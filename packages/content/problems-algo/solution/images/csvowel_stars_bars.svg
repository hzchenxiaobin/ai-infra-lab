<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">组合视角：把 n 个位置分给 5 个元音桶（隔板法）</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">「aaeio」⟺ a 桶放 2、e 桶放 1、i 桶放 1、o 桶放 1、u 桶放 0</text>

  <!-- ===== 上半：字符串 ⟺ 桶分配 ===== -->
  <text x="60" y="86" font-size="12" fill="#444" font-weight="bold">例子 n = 5，字符串 "aaeio"：</text>

  <!-- 字符串格子 a a e i o -->
  <g font-size="14">
    <rect x="60" y="96" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="79" y="118" text-anchor="middle" fill="#333" font-weight="bold">a</text>
    <rect x="100" y="96" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="119" y="118" text-anchor="middle" fill="#333" font-weight="bold">a</text>
    <rect x="140" y="96" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="159" y="118" text-anchor="middle" fill="#333" font-weight="bold">e</text>
    <rect x="180" y="96" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="199" y="118" text-anchor="middle" fill="#333" font-weight="bold">i</text>
    <rect x="220" y="96" width="38" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="239" y="118" text-anchor="middle" fill="#333" font-weight="bold">o</text>
  </g>

  <!-- 映射箭头 -->
  <text x="300" y="116" font-size="12" fill="#446688" font-weight="bold">⟺</text>

  <!-- 桶分配：5 个桶 a e i o u，分别装 2 1 1 1 0 -->
  <g font-size="12">
    <text x="340" y="88" text-anchor="middle" fill="#b85450" font-weight="bold">a</text>
    <text x="380" y="88" text-anchor="middle" fill="#b85450" font-weight="bold">e</text>
    <text x="420" y="88" text-anchor="middle" fill="#b85450" font-weight="bold">i</text>
    <text x="460" y="88" text-anchor="middle" fill="#b85450" font-weight="bold">o</text>
    <text x="500" y="88" text-anchor="middle" fill="#b85450" font-weight="bold">u</text>

    <!-- 桶（竖直条） -->
    <rect x="328" y="96" width="24" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="340" y="118" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <rect x="368" y="96" width="24" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="380" y="118" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <rect x="408" y="96" width="24" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="420" y="118" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <rect x="448" y="96" width="24" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="460" y="118" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <rect x="488" y="96" width="24" height="34" fill="#f5f5f5" stroke="#999" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="500" y="118" text-anchor="middle" fill="#999" font-weight="bold">0</text>
  </g>

  <!-- ===== 下半：隔板法图示 ===== -->
  <text x="60" y="170" font-size="12" fill="#444" font-weight="bold">隔板法：n 个 ★ 排成一行，插 4 块隔板分成 5 段</text>

  <!-- 星星与隔板：★ ★ | ★ | ★ | ★ |     (u 段空) -->
  <g font-size="18" fill="#d6a040">
    <text x="80" y="210" font-weight="bold">★</text>
    <text x="120" y="210" font-weight="bold">★</text>
    <text x="220" y="210" font-weight="bold">★</text>
    <text x="300" y="210" font-weight="bold">★</text>
    <text x="380" y="210" font-weight="bold">★</text>
  </g>
  <!-- 隔板 -->
  <g font-size="20" fill="#b85450" font-weight="bold">
    <text x="168" y="212">|</text>
    <text x="248" y="212">|</text>
    <text x="328" y="212">|</text>
    <text x="408" y="212">|</text>
  </g>

  <!-- 段标签 -->
  <g font-size="11" fill="#888">
    <text x="100" y="234" text-anchor="middle">a 段=2</text>
    <text x="194" y="234" text-anchor="middle">e 段=1</text>
    <text x="274" y="234" text-anchor="middle">i 段=1</text>
    <text x="354" y="234" text-anchor="middle">o 段=1</text>
    <text x="440" y="234" text-anchor="middle">u 段=0（空）</text>
  </g>

  <text x="280" y="262" text-anchor="middle" font-size="11" fill="#555">5 个 ★ + 4 块 | 任意排列 → 共 9 个位置选 4 个放隔板</text>

  <!-- ===== 结论框 ===== -->
  <rect x="50" y="282" width="470" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="64" y="306" font-size="13" fill="#4a7a3a" font-weight="bold">结论：答案 = C(n + 4, 4)</text>
  <text x="64" y="328" font-size="11" fill="#333">n 个相同位置（星）+ 4 块隔板 = n + 4 个槽，选 4 个放隔板</text>
  <text x="64" y="348" font-size="11" fill="#333">公式：C(n+4, 4) = (n+4)(n+3)(n+2)(n+1) / 24</text>
  <text x="64" y="370" font-size="11" fill="#b85450" font-weight="bold">验证：n=1 → 5，n=2 → 15，n=33 → 66045 ✓</text>
</svg>
