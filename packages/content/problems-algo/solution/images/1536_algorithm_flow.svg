<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：尾零化简 + 贪心冒泡</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">预处理每行尾零数 → 逐位置找最近合格行 → 冒泡上移累计交换次数</text>

  <!-- Step 1: compute trailing zeros -->
  <rect x="40" y="62" width="200" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="84" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 预处理尾零数</text>
  <text x="140" y="102" text-anchor="middle" font-size="10" fill="#555">tz[i] = 第 i 行末尾连续 0 的个数</text>

  <!-- arrow -->
  <path d="M 140 120 L 140 138" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2: loop -->
  <rect x="40" y="142" width="200" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② 遍历位置 i = 0…n−1</text>
  <text x="140" y="182" text-anchor="middle" font-size="10" fill="#555">需求 req = n − 1 − i</text>

  <!-- arrow to find -->
  <path d="M 140 200 L 140 218" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 3: find first qualifying row (diamond) -->
  <polygon points="140,222 240,262 140,302 40,262" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">从 j=i 起找首个</text>
  <text x="140" y="274" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">tz[j] ≥ req ?</text>

  <!-- No branch -->
  <path d="M 40 262 L 24 262 L 24 400 L 60 400" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="32" y="335" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" transform="rotate(-90 32 335)">找不到</text>

  <rect x="60" y="384" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="120" y="402" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 −1</text>
  <text x="120" y="416" text-anchor="middle" font-size="9" fill="#b85450">无法满足</text>

  <!-- Yes branch -->
  <path d="M 240 262 L 380 262" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="310" y="255" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">找到 j</text>

  <!-- Step 4: swap up -->
  <rect x="380" y="234" width="150" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="455" y="256" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">③ 冒泡上移</text>
  <text x="455" y="274" text-anchor="middle" font-size="10" fill="#555">ans += j − i</text>

  <!-- arrow down -->
  <path d="M 455 292 L 455 310" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 5: update tz array -->
  <rect x="380" y="314" width="150" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="455" y="336" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">④ 更新 tz 数组</text>
  <text x="455" y="354" text-anchor="middle" font-size="10" fill="#555">移除已用行，其余下移</text>

  <!-- loop back arrow -->
  <path d="M 455 372 L 455 408 L 140 408 L 140 198" stroke="#666" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="300" y="424" text-anchor="middle" font-size="10" fill="#666">下一个位置 i+1（直到 i = n−1 结束）</text>

  <!-- final result -->
  <path d="M 140 142 L 140 124 L 280 124 L 280 142" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="3 2" fill="none" filter="url(#rough2)"/>
  <rect x="290" y="62" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="350" y="80" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">全部完成</text>
  <text x="350" y="96" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">返回 ans</text>
  <path d="M 290 82 L 242 82" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="3 2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <text x="280" y="448" text-anchor="middle" font-size="10" fill="#888">每步选最近合格行 → 交换次数最小；找不到任何合格行 → 整体无解返回 −1</text>
</svg>
