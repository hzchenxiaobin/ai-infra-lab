<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例演算：nums=[1,2,3,4]  fn=sum  init=0</text>

  <!-- column x boundaries: 20,70,120,200,300,420,500 -->
  <!-- widths: step 50, i 50, nums[i] 80, acc前 100, fn 120, acc后 80 -->

  <!-- header -->
  <rect x="20" y="46" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="45" y="65" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">步</text>
  <text x="95" y="65" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i</text>
  <text x="160" y="65" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">nums[i]</text>
  <text x="250" y="65" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">acc(前)</text>
  <text x="360" y="65" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">fn(acc, nums[i])</text>
  <text x="460" y="65" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">acc(后)</text>

  <!-- vertical grid lines -->
  <line x1="70" y1="46" x2="70" y2="238" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="120" y1="46" x2="120" y2="238" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="200" y1="46" x2="200" y2="238" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="300" y1="46" x2="300" y2="238" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="420" y1="46" x2="420" y2="238" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 0 init -->
  <rect x="20" y="76" width="480" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="45" y="96" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">init</text>
  <text x="95" y="96" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">–</text>
  <text x="160" y="96" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">–</text>
  <text x="250" y="96" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">–</text>
  <text x="360" y="96" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">–</text>
  <text x="460" y="96" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- row 1 -->
  <rect x="20" y="106" width="480" height="30" fill="#f7f7f7" stroke="#ddd" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="45" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="95" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="160" y="126" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="250" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="360" y="126" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0 + 1</text>
  <text x="460" y="126" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- row 2 -->
  <rect x="20" y="136" width="480" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="45" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="95" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="160" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="250" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="360" y="156" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1 + 2</text>
  <text x="460" y="156" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- row 3 -->
  <rect x="20" y="166" width="480" height="30" fill="#f7f7f7" stroke="#ddd" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="45" y="186" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="95" y="186" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="160" y="186" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="250" y="186" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="360" y="186" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3 + 3</text>
  <text x="460" y="186" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- row 4 -->
  <rect x="20" y="196" width="480" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="45" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="95" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="160" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <text x="250" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="360" y="216" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">6 + 4</text>
  <text x="460" y="216" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">10</text>

  <line x1="20" y1="238" x2="500" y2="238" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="300" y="266" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">最终结果 = 10</text>
</svg>
