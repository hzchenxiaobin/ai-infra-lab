<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">截断操作与 S(v) 单调递增——二分答案的基础</text>

  <!-- ====== Top: sorted arr bar chart with capping ====== -->
  <text x="40" y="52" font-size="12" fill="#888">排序后 arr:</text>
  <line x1="80" y1="160" x2="330" y2="160" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- bar 3 (height=30) -->
  <rect x="96" y="130" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="124" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <!-- bar 4 (height=40) -->
  <rect x="156" y="120" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="114" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <!-- bar 9 (height=90): split into kept (blue) + capped (orange) -->
  <rect x="216" y="110" width="44" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="216" y="70" width="44" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="238" y="64" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>

  <!-- value = 5 line (capping threshold) -->
  <line x1="86" y1="110" x2="290" y2="110" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="296" y="114" font-size="11" fill="#b85450" font-weight="bold">value = 5</text>

  <!-- capped annotation -->
  <text x="238" y="92" text-anchor="middle" font-size="9.5" fill="#d6a040">截断→5</text>

  <text x="118" y="176" text-anchor="middle" font-size="10" fill="#999">≤5 保留</text>
  <text x="238" y="176" text-anchor="middle" font-size="10" fill="#d6a040">&gt;5 截断</text>

  <!-- ====== Formula box (right of bars) ====== -->
  <rect x="360" y="48" width="180" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="450" y="74" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">给定整数 value</text>
  <text x="450" y="96" text-anchor="middle" font-size="11" fill="#444">每个元素取 min</text>
  <text x="450" y="116" text-anchor="middle" font-size="11" fill="#444">转变后总和 =</text>
  <text x="450" y="138" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">S(v) = Σ min(arr[i], v)</text>

  <!-- arrow down -->
  <path d="M 280 188 L 280 206" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="200" font-size="11" fill="#888">v ↑ ⇒ S(v) ↑</text>

  <!-- ====== Bottom: monotonic curve ====== -->
  <line x1="80" y1="220" x2="80" y2="370" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="80" y1="370" x2="380" y2="370" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="226" text-anchor="end" font-size="10" fill="#888">S(v)</text>
  <text x="384" y="374" font-size="10" fill="#888">v →</text>
  <text x="74" y="374" text-anchor="end" font-size="10" fill="#999">0</text>

  <!-- increasing curve: points (0,0)(1,3)(2,6)(3,9)(4,11)(9,16) -->
  <path d="M 90 370 L 121 344 L 152 318 L 183 291 L 214 274 L 245 265 L 276 256 L 307 248 L 338 239 L 369 230"
        stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="150" y="280" font-size="11" fill="#446688" font-weight="bold">v ↑ ⇒ S(v) ↑</text>

  <!-- target line -->
  <line x1="80" y1="283" x2="380" y2="283" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="384" y="287" font-size="11" fill="#b85450" font-weight="bold">target=10</text>

  <!-- candidate points: v=3 (S=9 < target) and v=4 (S=11 >= target) -->
  <circle cx="183" cy="291" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="183" y1="291" x2="183" y2="370" stroke="#446688" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="183" y="386" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">v=3</text>
  <text x="170" y="312" font-size="9.5" fill="#446688">S=9&lt;10</text>

  <circle cx="214" cy="274" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="214" y1="274" x2="214" y2="370" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="214" y="386" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">v=4</text>
  <text x="201" y="268" font-size="9.5" fill="#b85450">S=11&gt;10</text>

  <text x="120" y="338" font-size="10" fill="#4a7a3a">比较两侧 → 取更近</text>

  <!-- right summary note -->
  <rect x="392" y="232" width="150" height="128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="467" y="256" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">答案空间</text>
  <text x="467" y="278" text-anchor="middle" font-size="11" fill="#666">value ∈ [0, max(arr)]</text>
  <text x="467" y="300" text-anchor="middle" font-size="11" fill="#666">求最接近 target 的 v</text>
  <text x="467" y="318" text-anchor="middle" font-size="11" fill="#666">非「满足条件」</text>
  <text x="467" y="336" text-anchor="middle" font-size="11" fill="#666">而是「最小差距」</text>
  <text x="467" y="352" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">单调 ⇒ 可二分！</text>
</svg>
