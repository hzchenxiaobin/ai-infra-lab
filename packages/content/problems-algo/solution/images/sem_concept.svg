<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：n 的奇偶决定 lcm(2,n) — 偶数即 n，奇数补一个 2</text>

  <!-- ====== LEFT: even case n=6 ====== -->
  <text x="135" y="60" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">n = 6（偶）</text>

  <!-- n box -->
  <rect x="95" y="70" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="135" y="96" text-anchor="middle" font-size="18" fill="#333">6</text>

  <!-- factor decomposition: 2 × 3 -->
  <text x="135" y="132" text-anchor="middle" font-size="11" fill="#888">素因子分解</text>
  <rect x="92" y="142" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="110" y="163" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">2</text>
  <text x="135" y="163" text-anchor="middle" font-size="14" fill="#888">×</text>
  <rect x="142" y="142" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="163" text-anchor="middle" font-size="15" fill="#333">3</text>

  <!-- check: 含因子 2 -->
  <text x="135" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">已含因子 2 ✓</text>
  <text x="135" y="212" text-anchor="middle" font-size="10.5" fill="#888">n 自身即 2 的倍数</text>

  <!-- arrow down -->
  <path d="M 135 222 L 135 248" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- answer box -->
  <rect x="75" y="252" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="135" y="278" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">ans = n = 6</text>

  <!-- ====== divider ====== -->
  <path d="M 270 50 L 270 300" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- ====== RIGHT: odd case n=5 ====== -->
  <text x="405" y="60" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">n = 5（奇）</text>

  <!-- n box -->
  <rect x="365" y="70" width="80" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="405" y="96" text-anchor="middle" font-size="18" fill="#333">5</text>

  <!-- factor decomposition: only 5 -->
  <text x="405" y="132" text-anchor="middle" font-size="11" fill="#888">素因子分解</text>
  <rect x="362" y="142" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="163" text-anchor="middle" font-size="15" fill="#333">5</text>
  <text x="412" y="163" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">缺 2</text>

  <!-- cross: 缺因子 2 -->
  <text x="405" y="196" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">缺因子 2 ✗</text>
  <text x="405" y="212" text-anchor="middle" font-size="10.5" fill="#888">需补一个因子 2</text>

  <!-- arrow down with "+2" -->
  <path d="M 405 222 L 405 248" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="432" y="240" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">×2</text>

  <!-- answer box -->
  <rect x="345" y="252" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="405" y="278" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">ans = 2n = 10</text>

  <!-- ====== bottom annotation ====== -->
  <rect x="50" y="308" width="440" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="328" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">gcd(2,n) 只取决于奇偶：偶→2，奇→1</text>
  <text x="270" y="344" text-anchor="middle" font-size="10.5" fill="#888">lcm(2,n) = 2n / gcd(2,n) → 偶数 n，奇数 2n；一行 n &lt;&lt; (n&amp;1) 折叠奇偶</text>
</svg>
