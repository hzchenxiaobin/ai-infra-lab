<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 475" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="475" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：S 线求峰值并发 · U 线按对求和 · 最后 LEFT JOIN 合流</text>

  <rect x="215" y="34" width="130" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">EmployeeShifts</text>
  <text x="280" y="68" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">（每行一条班次）</text>

  <path d="M 240 80 C 210 96, 150 100, 116 107" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 80 C 350 96, 410 100, 444 107" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="22" y="112" width="180" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="112" y="130" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① T：边界点集合</text>
  <text x="112" y="146" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">同人 start ∪ end</text>
  <text x="112" y="159" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">UNION 去重</text>

  <path d="M 112 168 L 112 182" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="22" y="184" width="180" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="112" y="202" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② P：原子区间</text>
  <text x="112" y="218" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">LEAD(st) OVER（同人按 st）</text>
  <text x="112" y="231" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">相邻边界切成 [st, ed)，末段 ed=NULL</text>

  <path d="M 112 244 L 112 258" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="22" y="260" width="180" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="112" y="278" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">③ S：包含计数</text>
  <text x="112" y="294" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">JOIN 原表：st ≥ start ∧ ed ≤ end</text>
  <text x="112" y="307" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">GROUP BY 段</text>
  <text x="112" y="319" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">→ concurrent_count</text>

  <path d="M 112 324 L 112 338" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="22" y="340" width="180" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="112" y="358" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">MAX(concurrent_count)</text>
  <text x="112" y="374" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">= max_overlapping_shifts</text>

  <rect x="358" y="112" width="180" height="140" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="448" y="132" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">①' U：自连接按对求和</text>
  <text x="448" y="150" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">ON 同人 ∧ t1.start &lt; t2.start</text>
  <text x="448" y="163" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">∧ t1.end &gt; t2.start</text>
  <text x="448" y="176" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">（3262 定向 + 单侧判定）</text>
  <text x="448" y="193" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">每对重叠区间：</text>
  <text x="448" y="206" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">[t2.start, LEAST(t1.end, t2.end)]</text>
  <text x="448" y="219" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">TIMESTAMPDIFF(MINUTE, …)</text>
  <text x="448" y="236" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">GROUP BY employee_id → SUM</text>

  <path d="M 448 252 L 448 266" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="358" y="268" width="180" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="448" y="286" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">SUM(每对重叠时长)</text>
  <text x="448" y="302" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">= total_overlap_duration</text>

  <path d="M 112 384 C 112 402, 130 410, 148 410" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 448 312 C 448 370, 420 410, 412 410" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="410" width="280" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="428" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">最终合流：S LEFT JOIN U USING(employee_id)</text>
  <text x="280" y="442" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">GROUP BY employee_id</text>
  <text x="280" y="455" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">MAX(并发) + COALESCE(MAX(总时长), 0) → ORDER BY</text>
</svg>
