<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">红绿灯时序与等权路径的关键性质</text>

  <!-- ===== Section 1: Traffic light timeline ===== -->
  <text x="40" y="54" font-size="12" fill="#555" font-weight="bold">红绿灯（所有节点同步，周期 = 2 × change）：</text>

  <!-- Green / Red / Green / Red boxes -->
  <rect x="60" y="66" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="100" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">绿灯</text>

  <rect x="140" y="66" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="180" y="84" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">红灯</text>

  <rect x="220" y="66" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">绿灯</text>

  <rect x="300" y="66" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="340" y="84" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">红灯</text>

  <text x="395" y="84" font-size="14" fill="#888">···</text>

  <!-- Time axis labels -->
  <text x="60" y="108" text-anchor="middle" font-size="10.5" fill="#888">0</text>
  <text x="140" y="108" text-anchor="middle" font-size="10.5" fill="#888">change</text>
  <text x="220" y="108" text-anchor="middle" font-size="10.5" fill="#888">2×change</text>
  <text x="300" y="108" text-anchor="middle" font-size="10.5" fill="#888">3×change</text>
  <text x="380" y="108" text-anchor="middle" font-size="10.5" fill="#888">4×change</text>

  <!-- Divider -->
  <path d="M 40 124 L 520 124" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Section 2: Path independence ===== -->
  <text x="280" y="148" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">穿越 k 条边的耗时 f(k) 只与 k 有关，与具体路径无关</text>

  <!-- Left: Path A -->
  <rect x="40" y="164" width="210" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="145" y="186" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">路径 A（k 条边）</text>
  <text x="145" y="206" text-anchor="middle" font-size="11" fill="#555">任意走法</text>
  <text x="145" y="228" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">耗时 = f(k)</text>

  <!-- Equals -->
  <text x="280" y="206" text-anchor="middle" font-size="22" fill="#b85450" font-weight="bold">≡</text>

  <!-- Right: Path B -->
  <rect x="310" y="164" width="210" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="415" y="186" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">路径 B（k 条边）</text>
  <text x="415" y="206" text-anchor="middle" font-size="11" fill="#555">不同走法</text>
  <text x="415" y="228" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">耗时 = f(k)</text>

  <!-- Reason -->
  <text x="280" y="258" text-anchor="middle" font-size="11" fill="#888">等权（每边 time）+ 同步灯 → 每步到达时刻仅由步数决定</text>

  <!-- ===== Section 3: Conclusion ===== -->
  <rect x="40" y="272" width="480" height="96" fill="#fafafa" stroke="#ddd" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="294" font-size="11.5" fill="#555">• f(k) 严格递增：每多走一条边至少多花 time &gt; 0 分钟</text>
  <text x="56" y="314" font-size="11.5" fill="#555">• 最短路径 L 条边 → 第二短路径为 L+1（若存在）或 L+2 条边</text>
  <text x="56" y="334" font-size="11.5" fill="#555">• L+2 总存在：在最短路径上走一条边再折回，加 2 条边</text>
  <text x="56" y="358" font-size="12" fill="#b85450" font-weight="bold">→ BFS 求 dist2[n]（第二个不同的边数），再算 f(dist2[n]) 即得答案</text>
</svg>
