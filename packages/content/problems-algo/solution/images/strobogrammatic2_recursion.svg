<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="270" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">递归流程：helper(m) 的分解 ↓ 与组装 ↑</text>

  <!-- ===== 分解方向（向下箭头）===== -->
  <text x="30" y="62" font-size="11" fill="#b85450" filter="url(#rough2)">分解 ↓</text>

  <!-- helper(4) 调用框 -->
  <rect x="160" y="56" width="220" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">helper(4, n=4)</text>
  <text x="392" y="82" font-size="10" fill="#d6a040" filter="url(#rough2)">m == n，禁 0</text>

  <!-- 向下箭头 helper(4) → helper(2) -->
  <line x1="270" y1="98" x2="270" y2="128" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="282" y="118" font-size="10" fill="#b85450" filter="url(#rough2)">递归 helper(m-2)</text>

  <!-- helper(2) 调用框 -->
  <rect x="160" y="132" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="158" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">helper(2, n=4)</text>
  <text x="392" y="158" font-size="10" fill="#446688" filter="url(#rough2)">m &lt; n，允 0</text>

  <!-- 向下箭头 helper(2) → helper(0) -->
  <line x1="270" y1="174" x2="270" y2="204" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="282" y="194" font-size="10" fill="#b85450" filter="url(#rough2)">递归 helper(m-2)</text>

  <!-- helper(0) base case 框 -->
  <rect x="160" y="208" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="234" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">helper(0) → [""]</text>
  <text x="392" y="234" font-size="10" fill="#4a7a3a" filter="url(#rough2)">base case</text>

  <!-- ===== 组装方向（向上箭头）===== -->
  <text x="460" y="270" font-size="11" fill="#4a7a3a" filter="url(#rough2)">↑ 组装</text>

  <!-- 向上箭头 helper(0) → helper(2) -->
  <line x1="200" y1="250" x2="200" y2="218" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- helper(2) 返回结果框 -->
  <rect x="60" y="270" width="420" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="290" font-size="11" fill="#446688" filter="url(#rough2)">包裹 5 对（含 0）：</text>
  <text x="80" y="308" font-size="13" fill="#333" filter="url(#rough2)">["00", "11", "69", "88", "96"]  ← 5 个</text>

  <!-- 向上箭头 helper(2) → helper(4) -->
  <line x1="200" y1="320" x2="200" y2="288" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 向上箭头 helper(2) → helper(4) 右侧 -->
  <line x1="340" y1="320" x2="340" y2="96" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- helper(4) 返回结果框 -->
  <rect x="40" y="336" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="60" y="358" font-size="11" fill="#d6a040" filter="url(#rough2)">包裹 4 对（禁 0）对每个内层结果：</text>
  <text x="60" y="378" font-size="12" fill="#333" filter="url(#rough2)">"1"+s+"1"  "6"+s+"9"  "8"+s+"8"  "9"+s+"6"  → 5×4 = 20 个最终结果</text>

  <!-- 底部说明 -->
  <rect x="60" y="404" width="440" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="423" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">⚠ m != n 判断前导零：最外层跳过 "0"+s+"0"</text>
</svg>
