<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：构造 idx → 按身高排序 idx → 收集名字 → 返回（无分支）</text>

  <!-- ===== Step 1: build idx ===== -->
  <rect x="24" y="60" width="120" height="110" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="84" y="82" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">① 构造 idx</text>
  <text x="84" y="104" text-anchor="middle" font-size="10" fill="#555">idx = [0,1,…,n-1]</text>
  <text x="84" y="120" text-anchor="middle" font-size="10" fill="#555">iota 填充</text>
  <text x="84" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a">下标 = 原始位置</text>
  <text x="84" y="162" text-anchor="middle" font-size="9" fill="#999">O(n)</text>

  <path d="M 146 115 L 162 115" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: sort idx ===== -->
  <rect x="166" y="60" width="130" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="231" y="82" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">② 排序 idx</text>
  <text x="231" y="104" text-anchor="middle" font-size="10" fill="#555">键 = heights[idx[i]]</text>
  <text x="231" y="120" text-anchor="middle" font-size="10" fill="#555">降序 sort</text>
  <text x="231" y="146" text-anchor="middle" font-size="10" fill="#d6a040">idx 被换位</text>
  <text x="231" y="162" text-anchor="middle" font-size="9" fill="#999">O(n log n)</text>

  <path d="M 298 115 L 314 115" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: gather names ===== -->
  <rect x="318" y="60" width="120" height="110" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="378" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">③ 收集名字</text>
  <text x="378" y="104" text-anchor="middle" font-size="10" fill="#555">ans[i] = names[idx[i]]</text>
  <text x="378" y="120" text-anchor="middle" font-size="10" fill="#555">遍历 idx</text>
  <text x="378" y="146" text-anchor="middle" font-size="10" fill="#446688">names 只读一次</text>
  <text x="378" y="162" text-anchor="middle" font-size="9" fill="#999">O(n)</text>

  <path d="M 440 115 L 456 115" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: return ===== -->
  <rect x="460" y="60" width="84" height="110" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="502" y="82" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">④ 返回</text>
  <text x="502" y="104" text-anchor="middle" font-size="10" fill="#555">return ans</text>
  <text x="502" y="146" text-anchor="middle" font-size="10" fill="#b85450">身高降序名字</text>
  <text x="502" y="162" text-anchor="middle" font-size="9" fill="#999">O(1)</text>

  <!-- divider -->
  <line x1="24" y1="190" x2="544" y2="190" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- ===== Bottom: key map / no-branch note ===== -->
  <text x="24" y="214" font-size="12" fill="#888" font-weight="bold">排序键说明（步骤②内部）：</text>

  <rect x="24" y="222" width="280" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="164" y="242" text-anchor="middle" font-size="11" fill="#333">比较 a, b（均为 idx 里的元素值）</text>
  <text x="164" y="260" text-anchor="middle" font-size="11" fill="#d6a040">return heights[a] &gt; heights[b]</text>

  <rect x="316" y="222" width="228" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="430" y="242" text-anchor="middle" font-size="11" fill="#333">heights 互不相同</text>
  <text x="430" y="260" text-anchor="middle" font-size="11" fill="#4a7a3a">→ 结果唯一，无并列分支</text>

  <!-- footnote -->
  <text x="280" y="302" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">总复杂度 O(n log n) · 空间 O(n)（idx + ans）</text>
  <text x="280" y="320" text-anchor="middle" font-size="10" fill="#999">names / heights 全程只读，仅整数下标参与换位</text>
</svg>
