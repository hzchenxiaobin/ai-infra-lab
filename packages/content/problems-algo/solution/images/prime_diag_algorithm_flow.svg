<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：收集对角元素 → 试除判质数 → 取最大</text>

  <!-- Step 1: iterate i, collect two diagonal values -->
  <rect x="40" y="50" width="480" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="72" font-size="13" fill="#333" font-weight="bold">① 遍历 i = 0 .. n-1</text>
  <text x="56" y="92" font-size="12" fill="#555">取 a = nums[i][i]，b = nums[i][n-1-i]，丢入候选集 set（自动去重）</text>

  <!-- arrow -->
  <line x1="280" y1="108" x2="280" y2="130" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: for each candidate v, trial-division primality test -->
  <rect x="40" y="134" width="480" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="156" font-size="13" fill="#333" font-weight="bold">② 对每个候选 v 调用 isPrime(v)</text>
  <text x="56" y="176" font-size="12" fill="#555">· v ≤ 1 → 否（1 既非质数也非合数）</text>
  <text x="56" y="194" font-size="12" fill="#555">· v == 2 → 是（最小质数，唯一偶质数）</text>
  <text x="56" y="212" font-size="12" fill="#555">· 否则枚举 d = 2, 3, 5, … ≤ √v，若 v % d == 0 则否；跑完无因子则是</text>

  <!-- arrow -->
  <line x1="280" y1="224" x2="280" y2="246" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: update max prime -->
  <rect x="40" y="250" width="480" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="272" font-size="13" fill="#333" font-weight="bold">③ 若是质数，更新 ans = max(ans, v)</text>
  <text x="56" y="292" font-size="12" fill="#555">ans 初值 0，保证「没有质数时返回 0」</text>

  <!-- arrow -->
  <line x1="280" y1="308" x2="280" y2="330" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: return -->
  <rect x="40" y="334" width="480" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="362" font-size="13" fill="#333" font-weight="bold">④ 返回 ans（0 表示对角线上无质数）</text>

  <!-- Complexity note -->
  <rect x="40" y="396" width="480" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="418" text-anchor="middle" font-size="12" fill="#555">候选 ≤ 2n 个，每次试除 O(√v)，v ≤ 4×10⁶ ⇒ √v ≤ 2000，总量约 6×10⁵</text>
</svg>
