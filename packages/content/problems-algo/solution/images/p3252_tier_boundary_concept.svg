<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：三档边界挂在「共享名次 position」上，不挂在行号上</text>
  <text x="290" y="40" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">n = 10 → Tier 1：position ≤ ⌈10×0.33⌉ = 4 ｜ Tier 2：position ≤ ⌈10×0.66⌉ = 7 ｜ 其余为 Tier 3</text>

  <rect x="36" y="52" width="280" height="20" fill="#e8e8e8" stroke="#999" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="46" y="66" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">队名</text>
  <text x="238" y="66" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">积分</text>
  <text x="292" y="66" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">名次</text>

  <rect x="36" y="72" width="280" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="36" y="176" width="280" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="36" y="280" width="280" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>

  <line x1="38" y1="98" x2="314" y2="98" stroke="#d8d8d8" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="38" y1="124" x2="314" y2="124" stroke="#d8d8d8" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="38" y1="150" x2="314" y2="150" stroke="#d8d8d8" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="38" y1="202" x2="314" y2="202" stroke="#d8d8d8" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="38" y1="228" x2="314" y2="228" stroke="#d8d8d8" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="38" y1="254" x2="314" y2="254" stroke="#d8d8d8" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="38" y1="306" x2="314" y2="306" stroke="#d8d8d8" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="31" y="89" text-anchor="end" font-size="8" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="31" y="115" text-anchor="end" font-size="8" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="31" y="141" text-anchor="end" font-size="8" fill="#aaa" filter="url(#rough2)">3</text>
  <text x="31" y="167" text-anchor="end" font-size="8" fill="#aaa" filter="url(#rough2)">4</text>
  <text x="31" y="193" text-anchor="end" font-size="8" fill="#aaa" filter="url(#rough2)">5</text>
  <text x="31" y="219" text-anchor="end" font-size="8" fill="#aaa" filter="url(#rough2)">6</text>
  <text x="31" y="245" text-anchor="end" font-size="8" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="31" y="271" text-anchor="end" font-size="8" fill="#b85450" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="31" y="297" text-anchor="end" font-size="8" fill="#aaa" filter="url(#rough2)">9</text>
  <text x="31" y="323" text-anchor="end" font-size="8" fill="#aaa" filter="url(#rough2)">10</text>

  <text x="46" y="89" font-size="9.5" fill="#333" filter="url(#rough2)">Sheffield United</text>
  <text x="238" y="89" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">56</text>
  <text x="292" y="89" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="46" y="115" font-size="9.5" fill="#333" filter="url(#rough2)">Fulham</text>
  <text x="238" y="115" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">55</text>
  <text x="292" y="115" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="46" y="141" font-size="9.5" fill="#333" filter="url(#rough2)">Newcastle United</text>
  <text x="238" y="141" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">43</text>
  <text x="292" y="141" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <text x="46" y="167" font-size="9.5" fill="#333" filter="url(#rough2)">Chelsea</text>
  <text x="238" y="167" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">41</text>
  <text x="292" y="167" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="46" y="193" font-size="9.5" fill="#333" filter="url(#rough2)">Burnley</text>
  <text x="238" y="193" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">27</text>
  <text x="292" y="193" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>

  <text x="46" y="219" font-size="9.5" fill="#333" filter="url(#rough2)">Nottingham Forest</text>
  <text x="238" y="219" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">24</text>
  <text x="292" y="219" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>

  <text x="46" y="245" font-size="9.5" fill="#333" filter="url(#rough2)">Everton</text>
  <text x="238" y="245" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">12</text>
  <text x="292" y="245" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>

  <text x="46" y="271" font-size="9.5" fill="#333" filter="url(#rough2)">Luton Town</text>
  <text x="238" y="271" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">12</text>
  <text x="292" y="271" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>

  <text x="46" y="297" font-size="9.5" fill="#333" filter="url(#rough2)">Liverpool</text>
  <text x="238" y="297" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">11</text>
  <text x="292" y="297" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">9</text>

  <text x="46" y="323" font-size="9.5" fill="#333" filter="url(#rough2)">Aston Villa</text>
  <text x="238" y="323" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">9</text>
  <text x="292" y="323" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">10</text>

  <rect x="273" y="229" width="38" height="50" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>

  <rect x="334" y="52" width="236" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="344" y="68" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 审题关键：边界平局 → 进高档</text>
  <text x="344" y="84" font-size="9" fill="#333" filter="url(#rough2)">Everton / Luton 同 12 分 → 共享 position = 7</text>
  <text x="344" y="100" font-size="9" fill="#333" filter="url(#rough2)">7 ≤ ⌈10×0.66⌉ = 7 恰在边界 → 双双进 Tier 2</text>

  <path d="M 324 76 L 318 76 L 318 172 L 324 172" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="334" y="116" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Tier 1（前 33%）</text>
  <text x="334" y="131" font-size="9.5" fill="#333" filter="url(#rough2)">position ≤ ⌈10×0.33⌉ = 4</text>
  <text x="334" y="146" font-size="8.5" fill="#888" filter="url(#rough2)">前 4 名入档（名义 33%，实占 40%）</text>

  <path d="M 324 180 L 318 180 L 318 276 L 324 276" fill="none" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="334" y="210" font-size="11" fill="#b58020" font-weight="bold" filter="url(#rough2)">Tier 2（中 33%）</text>
  <text x="334" y="225" font-size="9.5" fill="#333" filter="url(#rough2)">position ≤ ⌈10×0.66⌉ = 7（名次 5、6、7）</text>
  <text x="334" y="240" font-size="9" fill="#b85450" filter="url(#rough2)">并列第 7 压边界 → 两队同进本档（高档）</text>
  <text x="334" y="255" font-size="8.5" fill="#888" filter="url(#rough2)">Luton 是第 8 行：看名次 7，不看行号 8</text>

  <path d="M 324 284 L 318 284 L 318 328 L 324 328" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="334" y="296" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">Tier 3（后 34%）</text>
  <text x="334" y="311" font-size="9" fill="#333" filter="url(#rough2)">position &gt; 7（Liverpool 跳号 9 也在此档）</text>

  <rect x="36" y="344" width="534" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="46" y="361" font-size="9.5" fill="#333" filter="url(#rough2)">💡 分档判据 = RANK 共享名次：CASE WHEN position ≤ 边界 —— 并列队同名次，天然同档、同进同留</text>
  <text x="46" y="377" font-size="9.5" fill="#333" filter="url(#rough2)">NTILE(3) 按行号切桶（4/3/3）：第 7 行 Everton / 第 8 行 Luton 会被拆进两档 → 不可用</text>
</svg>
