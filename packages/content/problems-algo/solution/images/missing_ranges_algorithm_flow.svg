<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="500" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：哨兵统一三处缝隙，扫描相邻对判定缺失段</text>

  <!-- Start -->
  <rect x="230" y="40" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="17" filter="url(#rough2)"/>
  <text x="310" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">prev = lower−1, res = []</text>
  <path d="M 310 74 L 310 96" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop header -->
  <rect x="200" y="100" width="220" height="30" fill="#f6f6f6" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="120" text-anchor="middle" font-size="11.5" fill="#333">for cur in nums ∪ {upper+1}</text>

  <!-- loop exit to return res -->
  <path d="M 420 115 L 470 115" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="445" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a">遍历完</text>
  <rect x="470" y="100" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="525" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return res</text>

  <path d="M 310 130 L 310 152" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: cur - prev >= 2 ? -->
  <path d="M 310 158 L 420 200 L 310 242 L 200 200 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="196" text-anchor="middle" font-size="11.5" fill="#333">cur − prev</text>
  <text x="310" y="212" text-anchor="middle" font-size="11.5" fill="#333">≥ 2 ?</text>

  <!-- No branch: left then down to prev=cur -->
  <path d="M 200 200 L 110 200" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="180" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <text x="150" y="216" font-size="9.5" fill="#4a7a3a" font-style="italic">无缺失</text>
  <path d="M 110 200 L 110 437 L 230 437" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Yes branch: down to Decision 2 -->
  <path d="M 310 242 L 310 268" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="326" y="260" font-size="11" fill="#b85450" font-weight="bold">是</text>

  <!-- Decision 2: cur - prev == 2 ? -->
  <path d="M 310 268 L 420 300 L 310 332 L 200 300 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="296" text-anchor="middle" font-size="11.5" fill="#333">cur − prev</text>
  <text x="310" y="312" text-anchor="middle" font-size="11.5" fill="#333">== 2 ?</text>

  <!-- Yes (single): left to box -->
  <path d="M 200 300 L 160 300 L 160 340" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="185" y="292" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是</text>

  <!-- No (range): right to box -->
  <path d="M 420 300 L 465 300 L 465 340" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="445" y="292" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否</text>

  <!-- Left box: append "prev+1" -->
  <rect x="80" y="344" width="160" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="368" text-anchor="middle" font-size="11.5" fill="#333">res.append("prev+1")</text>

  <!-- Right box: append "prev+1->cur-1" -->
  <rect x="380" y="344" width="180" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="470" y="368" text-anchor="middle" font-size="11.5" fill="#333">res.append("prev+1-&gt;cur-1")</text>

  <!-- merge arrows to prev=cur -->
  <path d="M 160 384 L 160 408 L 310 408" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 470 384 L 470 408 L 310 408" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 310 408 L 310 422" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- prev = cur box -->
  <rect x="230" y="426" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="448" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">prev = cur</text>

  <!-- loop back to loop header -->
  <path d="M 230 443 L 60 443 L 60 115 L 200 115" stroke="#888" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="280" text-anchor="middle" font-size="10" fill="#888" font-style="italic">下一轮</text>
</svg>
