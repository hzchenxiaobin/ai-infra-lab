<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：三个年龄组的分子、分母与两个百分比</text>

  <!-- 演算表格 -->
  <rect x="366" y="46" width="72" height="152" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="438" y="46" width="72" height="152" fill="#fff8e1" filter="url(#rough2)"/>

  <path d="M 18 46 L 510 46" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 18 72 L 510 72" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 18 114 L 510 114" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 18 156 L 510 156" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 18 198 L 510 198" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 18 46 L 18 198" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 96 46 L 96 198" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 190 46 L 190 198" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 302 46 L 302 198" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 366 46 L 366 198" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 438 46 L 438 198" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 510 46 L 510 198" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="57" y="64" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">age_bucket</text>
  <text x="143" y="64" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">send_time</text>
  <text x="246" y="64" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">open_time</text>
  <text x="334" y="64" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">total</text>
  <text x="402" y="64" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">send_perc</text>
  <text x="474" y="64" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">open_perc</text>

  <text x="57" y="99" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">31-35</text>
  <text x="143" y="99" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">3.50</text>
  <text x="246" y="99" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">4.50+1.25=5.75</text>
  <text x="334" y="99" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">9.25</text>
  <text x="402" y="99" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">37.84</text>
  <text x="474" y="99" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">62.16</text>

  <text x="57" y="141" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">26-30</text>
  <text x="143" y="141" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">5.67+8.24=13.91</text>
  <text x="246" y="141" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">3.00</text>
  <text x="334" y="141" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">16.91</text>
  <text x="402" y="141" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">82.26</text>
  <text x="474" y="141" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">17.74</text>

  <text x="57" y="183" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">21-25</text>
  <text x="143" y="183" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">6.24</text>
  <text x="246" y="183" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">5.25</text>
  <text x="334" y="183" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">11.49</text>
  <text x="402" y="183" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">54.31</text>
  <text x="474" y="183" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">45.69</text>

  <!-- 卡1：以 31-35 为例 -->
  <rect x="24" y="218" width="234" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="141" y="238" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">以 31-35 为例（user 123）</text>
  <text x="141" y="256" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">send 3.50，open 4.50+1.25=5.75</text>
  <text x="141" y="274" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">(3.50 / 9.25) × 100 → 37.84</text>

  <!-- 卡2：分母只算一遍 -->
  <rect x="274" y="218" width="234" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="391" y="238" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">分母只算一遍</text>
  <text x="391" y="256" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">total = SUM(time_spent) = send+open</text>
  <text x="391" y="274" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">两列共享 → 每行两组百分数互补 100.00</text>

  <!-- 底部小字 -->
  <text x="260" y="310" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">所有百分比四舍五入到 2 位小数</text>
  <text x="260" y="326" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">题目允许任意顺序返回（示例输出为 31-35 → 26-30 → 21-25）</text>
</svg>
