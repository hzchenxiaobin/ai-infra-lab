<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：排序去重后，每个值一条位运算，最后取最高位</text>

  <ellipse cx="170" cy="46" rx="40" ry="14" fill="#f7f7f7" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="170" y="51" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">开始</text>

  <path d="M 170 60 L 170 74" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="85" y="78" width="170" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="170" y="98" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">排序 + 去重</text>

  <path d="M 170 110 L 170 122" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="75" y="126" width="190" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="170" y="146" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">f = 1（bit 0：总奖励 0 可达）</text>

  <path d="M 170 158 L 170 172" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <polygon points="170,176 250,210 170,244 90,210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="214" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">还有值 v？</text>

  <path d="M 250 210 L 329 210" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="289" y="202" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="333" y="188" width="172" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="419" y="206" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">f |= (f &amp; ((1&lt;&lt;v)−1)) &lt;&lt; v</text>
  <text x="419" y="224" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">mask 低 v 位 → 左移 v → 并回</text>

  <path d="M 419 188 V 156 H 285 Q 253 156 236 180" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="352" y="148" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">取下一个 v</text>

  <path d="M 170 244 L 170 280" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="181" y="266" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="70" y="284" width="200" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="305" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 f 的最高位下标</text>

  <path d="M 170 318 L 170 334" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <ellipse cx="170" cy="350" rx="36" ry="14" fill="#f7f7f7" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="170" y="355" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">结束</text>

  <rect x="300" y="298" width="205" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="402" y="318" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">一轮转移 = and + shift + or</text>
  <text x="402" y="336" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">C++：bitset&lt;10⁵&gt;，每轮 ~1563 字</text>
  <text x="402" y="352" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">共 7.8×10⁷ 次字操作，稳过</text>
  <text x="402" y="370" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">Python：大整数同理，0.1s 级</text>

  <text x="260" y="396" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">d ≤ min(n, V) = 5×10⁴ 个值；排序 O(n log n) 只占零头</text>
</svg>
