<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="570" height="320" fill="#fafafa"/>

  <!-- Title -->
  <text x="285" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：price=[13,5,1,8,21,2], k=3</text>
  <text x="285" y="44" text-anchor="middle" font-size="11" fill="#888">排序后 = [1, 2, 5, 8, 13, 21]，hi = price[5]-price[0] = 20</text>

  <!-- ===== Table grid ===== -->
  <!-- outer frame -->
  <rect x="20" y="58" width="530" height="208" fill="none" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <!-- header fill -->
  <rect x="20" y="58" width="530" height="32" fill="#e8f0fe" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- column dividers (x = 70,150,200,410,460,505) -->
  <line x1="70" y1="58" x2="70" y2="266" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="150" y1="58" x2="150" y2="266" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="200" y1="58" x2="200" y2="266" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="410" y1="58" x2="410" y2="266" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="460" y1="58" x2="460" y2="266" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="505" y1="58" x2="505" y2="266" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <!-- row dividers at y = 90,122,154,186,218,250 -->
  <line x1="20" y1="90" x2="550" y2="90" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="122" x2="550" y2="122" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="154" x2="550" y2="154" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="186" x2="550" y2="186" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="218" x2="550" y2="218" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- header text -->
  <text x="45" y="79" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">轮次</text>
  <text x="110" y="79" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">[lo, hi]</text>
  <text x="175" y="79" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">mid</text>
  <text x="305" y="79" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">贪心选取（相邻差 ≥ mid）</text>
  <text x="435" y="79" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">count</text>
  <text x="482" y="79" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">结果</text>
  <text x="527" y="79" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">ans</text>

  <!-- Row 1: mid=10 -->
  <text x="45" y="111" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="110" y="111" text-anchor="middle" font-size="11" fill="#333">[0, 20]</text>
  <text x="175" y="111" text-anchor="middle" font-size="11" fill="#333">10</text>
  <text x="305" y="111" text-anchor="middle" font-size="11" fill="#333">1 → 13 →（无）</text>
  <text x="435" y="111" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="482" y="111" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="527" y="111" text-anchor="middle" font-size="11" fill="#666">0</text>

  <!-- Row 2: mid=4 -->
  <text x="45" y="143" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="110" y="143" text-anchor="middle" font-size="11" fill="#333">[0, 9]</text>
  <text x="175" y="143" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="305" y="143" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1 → 5 → 13 → 21</text>
  <text x="435" y="143" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="482" y="143" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="527" y="143" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- Row 3: mid=7 -->
  <text x="45" y="175" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="110" y="175" text-anchor="middle" font-size="11" fill="#333">[5, 9]</text>
  <text x="175" y="175" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="305" y="175" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1 → 8 → 21</text>
  <text x="435" y="175" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="482" y="175" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="527" y="175" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">7</text>

  <!-- Row 4: mid=8 -->
  <text x="45" y="207" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="110" y="207" text-anchor="middle" font-size="11" fill="#333">[8, 9]</text>
  <text x="175" y="207" text-anchor="middle" font-size="11" fill="#333">8</text>
  <text x="305" y="207" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1 → 13 → 21</text>
  <text x="435" y="207" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="482" y="207" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="527" y="207" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">8</text>

  <!-- Row 5: mid=9 -->
  <text x="45" y="239" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="110" y="239" text-anchor="middle" font-size="11" fill="#333">[9, 9]</text>
  <text x="175" y="239" text-anchor="middle" font-size="11" fill="#333">9</text>
  <text x="305" y="239" text-anchor="middle" font-size="11" fill="#333">1 → 13 →（无）</text>
  <text x="435" y="239" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="482" y="239" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="527" y="239" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">8</text>

  <!-- bottom note -->
  <rect x="120" y="278" width="330" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="285" y="298" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">lo=9 &gt; hi=8，循环结束 → 返回 ans = 8 ✓</text>
</svg>
