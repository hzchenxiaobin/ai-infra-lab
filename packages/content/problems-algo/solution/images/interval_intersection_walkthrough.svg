<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐对取交集</text>

  <!-- Column headers -->
  <text x="40" y="52" font-size="10" fill="#888">步骤</text>
  <text x="86" y="52" font-size="10" fill="#888">A[i]</text>
  <text x="150" y="52" font-size="10" fill="#888">B[j]</text>
  <text x="214" y="52" font-size="10" fill="#888">lo, hi</text>
  <text x="282" y="52" font-size="10" fill="#888">交集</text>
  <text x="340" y="52" font-size="10" fill="#888">谁先结束</text>
  <text x="440" y="52" font-size="10" fill="#888">操作</text>

  <!-- Divider line -->
  <path d="M 30 58 L 530 58" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: [0,2] ∩ [1,5] = [1,2], i++ -->
  <text x="44" y="78" font-size="11" fill="#555">1</text>
  <rect x="78" y="66" width="60" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="108" y="80" text-anchor="middle" font-size="10" fill="#333">[0,2]</text>
  <rect x="142" y="66" width="60" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="172" y="80" text-anchor="middle" font-size="10" fill="#333">[1,5]</text>
  <text x="232" y="80" font-size="10" fill="#555">1, 2</text>
  <rect x="268" y="66" width="48" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="292" y="80" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">[1,2]</text>
  <text x="360" y="80" font-size="10" fill="#446688">2&lt;5 → i++</text>

  <!-- Row 2: [5,10] ∩ [1,5] = [5,5], j++ -->
  <text x="44" y="108" font-size="11" fill="#555">2</text>
  <rect x="78" y="96" width="60" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="108" y="110" text-anchor="middle" font-size="10" fill="#333">[5,10]</text>
  <rect x="142" y="96" width="60" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="172" y="110" text-anchor="middle" font-size="10" fill="#333">[1,5]</text>
  <text x="232" y="110" font-size="10" fill="#555">5, 5</text>
  <rect x="268" y="96" width="48" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="292" y="110" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">[5,5]</text>
  <text x="360" y="110" font-size="10" fill="#4a7a3a">5&lt;10 → j++</text>

  <!-- Row 3: [5,10] ∩ [8,12] = [8,10], i++ -->
  <text x="44" y="138" font-size="11" fill="#555">3</text>
  <rect x="78" y="126" width="60" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="108" y="140" text-anchor="middle" font-size="10" fill="#333">[5,10]</text>
  <rect x="142" y="126" width="60" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="172" y="140" text-anchor="middle" font-size="10" fill="#333">[8,12]</text>
  <text x="232" y="140" font-size="10" fill="#555">8, 10</text>
  <rect x="268" y="126" width="48" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="292" y="140" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">[8,10]</text>
  <text x="360" y="140" font-size="10" fill="#446688">10&lt;12 → i++</text>

  <!-- Row 4: [13,23] ∩ [8,12] = 空, j++ -->
  <text x="44" y="168" font-size="11" fill="#555">4</text>
  <rect x="78" y="156" width="60" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="108" y="170" text-anchor="middle" font-size="10" fill="#333">[13,23]</text>
  <rect x="142" y="156" width="60" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="172" y="170" text-anchor="middle" font-size="10" fill="#333">[8,12]</text>
  <text x="232" y="170" font-size="10" fill="#999">13, 12</text>
  <text x="282" y="170" text-anchor="middle" font-size="10" fill="#999">空</text>
  <text x="360" y="170" font-size="10" fill="#4a7a3a">12&lt;23 → j++</text>

  <!-- Row 5: [13,23] ∩ [15,24] = [15,23], i++ -->
  <text x="44" y="198" font-size="11" fill="#555">5</text>
  <rect x="78" y="186" width="60" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="108" y="200" text-anchor="middle" font-size="10" fill="#333">[13,23]</text>
  <rect x="142" y="186" width="60" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="172" y="200" text-anchor="middle" font-size="10" fill="#333">[15,24]</text>
  <text x="232" y="200" font-size="10" fill="#555">15, 23</text>
  <rect x="268" y="186" width="52" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="294" y="200" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">[15,23]</text>
  <text x="360" y="200" font-size="10" fill="#446688">23&lt;24 → i++</text>

  <!-- Row 6: [24,25] ∩ [15,24] = [24,24], j++ -->
  <text x="44" y="228" font-size="11" fill="#555">6</text>
  <rect x="78" y="216" width="60" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="108" y="230" text-anchor="middle" font-size="10" fill="#333">[24,25]</text>
  <rect x="142" y="216" width="60" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="172" y="230" text-anchor="middle" font-size="10" fill="#333">[15,24]</text>
  <text x="232" y="230" font-size="10" fill="#555">24, 24</text>
  <rect x="268" y="216" width="52" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="294" y="230" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">[24,24]</text>
  <text x="360" y="230" font-size="10" fill="#4a7a3a">24&lt;25 → j++</text>

  <!-- Row 7: [24,25] ∩ [25,26] = [25,25], i++ -->
  <text x="44" y="258" font-size="11" fill="#555">7</text>
  <rect x="78" y="246" width="60" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="108" y="260" text-anchor="middle" font-size="10" fill="#333">[24,25]</text>
  <rect x="142" y="246" width="60" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="172" y="260" text-anchor="middle" font-size="10" fill="#333">[25,26]</text>
  <text x="232" y="260" font-size="10" fill="#555">25, 25</text>
  <rect x="268" y="246" width="52" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="294" y="260" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">[25,25]</text>
  <text x="360" y="260" font-size="10" fill="#446688">25&lt;26 → i++</text>

  <!-- End row -->
  <path d="M 30 278 L 530 278" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="11" fill="#888">i = 4 越界 → 循环结束</text>

  <!-- Result box -->
  <rect x="40" y="316" width="480" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="60" y="338" font-size="11" fill="#888">结果:</text>
  <text x="280" y="339" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">[[1,2],[5,5],[8,10],[15,23],[24,24],[25,25]] ✓</text>

  <!-- Legend -->
  <rect x="40" y="366" width="16" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="62" y="376" font-size="10" fill="#666">A 区间</text>
  <rect x="110" y="366" width="16" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="132" y="376" font-size="10" fill="#666">B 区间</text>
  <rect x="180" y="366" width="16" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="202" y="376" font-size="10" fill="#666">交集</text>
  <text x="280" y="376" font-size="10" fill="#999">注：步骤 4 中 lo=13 &gt; hi=12，交集为空，跳过</text>
</svg>
