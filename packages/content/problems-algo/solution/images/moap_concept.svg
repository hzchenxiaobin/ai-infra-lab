<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="34" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">两端必须相等：正数下合并只增 ⟹ 吞并较小端</text>

  <!-- pointer labels -->
  <text x="156" y="78" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <path d="M156 82 L156 92" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="444" y="78" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">j</text>
  <path d="M444 82 L444 92" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- array cells: 4 3 2 1 2 3 1 -->
  <rect x="132" y="96" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="156" y="124" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">4</text>
  <rect x="180" y="96" width="48" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="204" y="124" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>
  <rect x="228" y="96" width="48" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="252" y="124" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <rect x="276" y="96" width="48" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="300" y="124" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <rect x="324" y="96" width="48" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="348" y="124" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <rect x="372" y="96" width="48" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="396" y="124" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>
  <rect x="420" y="96" width="48" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="444" y="124" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>

  <!-- a bracket (left, blue) -->
  <path d="M134 150 L134 160 L178 160 L178 150" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="156" y="178" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">a = 4</text>

  <!-- b bracket (right, red) -->
  <path d="M422 150 L422 160 L466 160 L466 150" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="444" y="178" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">b = 1</text>

  <!-- current decision arrow: a>b, merge right (吞较小端 b) -->
  <text x="300" y="178" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">a &gt; b：吞较小端</text>
  <path d="M410 168 L378 168" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- three case boxes -->
  <rect x="40" y="216" width="160" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="120" y="240" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">a &lt; b</text>
  <text x="120" y="260" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">左吞 nums[i+1]</text>
  <text x="120" y="278" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">a += nums[++i]，ans+1</text>

  <rect x="220" y="216" width="160" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="240" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a = b</text>
  <text x="300" y="260" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">配对收进</text>
  <text x="300" y="278" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">i++；j--；ans+0</text>

  <rect x="400" y="216" width="160" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="480" y="240" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">a &gt; b</text>
  <text x="480" y="260" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">右吞 nums[j-1]</text>
  <text x="480" y="278" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">b += nums[--j]，ans+1</text>

  <!-- summary note -->
  <rect x="60" y="300" width="480" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="320" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">正数 ⟹ 合并只增不减；吞较大端只拉大差距，故吞较小端被迫唯一</text>
  <text x="300" y="338" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">交换论证：任意最优解可改写为贪心解而不增代价 ⟹ 贪心最优</text>
</svg>
