<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrUp" markerWidth="8" markerHeight="8" refX="4" refY="0" orient="auto">
      <path d="M 4 0 L 8 8 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="540" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：a=[1,2,4] 与 b=[0,1,3] 归并</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">两指针每步取较小者入 ans，6 步得 [0,1,1,2,3,4]</text>

  <!-- column headers -->
  <text x="40" y="78" font-size="10" fill="#888" font-weight="bold">步</text>
  <text x="190" y="78" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">a = [1,2,4]</text>
  <text x="380" y="78" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">b = [0,1,3]</text>
  <text x="510" y="78" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">ans</text>

  <!-- helper: each row y = 92 + row*72, row 0..5 -->
  <!-- Row 1: i=0(a=1), j=0(b=0) -> 1>0 take b[0]=0 -->
  <g font-size="11">
    <text x="40" y="112" fill="#333" font-weight="bold">1</text>
    <!-- a cells -->
    <rect x="130" y="96" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="147" y="113" text-anchor="middle" fill="#333">1</text>
    <rect x="164" y="96" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="181" y="113" text-anchor="middle" fill="#333">2</text>
    <rect x="198" y="96" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="215" y="113" text-anchor="middle" fill="#333">4</text>
    <!-- i pointer -->
    <path d="M 147 124 L 147 132" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrUp)" fill="none" filter="url(#rough2)"/>
    <text x="147" y="142" text-anchor="middle" font-size="9" fill="#b85450">i=0</text>
    <!-- b cells -->
    <rect x="330" y="96" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="347" y="113" text-anchor="middle" fill="#333">0</text>
    <rect x="364" y="96" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="381" y="113" text-anchor="middle" fill="#333">1</text>
    <rect x="398" y="96" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="415" y="113" text-anchor="middle" fill="#333">3</text>
    <path d="M 347 124 L 347 132" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrUp)" fill="none" filter="url(#rough2)"/>
    <text x="347" y="142" text-anchor="middle" font-size="9" fill="#b85450">j=0</text>
    <!-- compare text -->
    <text x="260" y="113" text-anchor="middle" font-size="10" fill="#888">1 &gt; 0 → 取 b</text>
    <!-- ans -->
    <rect x="486" y="100" width="22" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="497" y="113" text-anchor="middle" font-size="10" fill="#333">0</text>
  </g>

  <!-- Row 2: i=0(a=1), j=1(b=1) -> 1<=1 take a[0]=1 -->
  <g font-size="11">
    <text x="40" y="184" fill="#333" font-weight="bold">2</text>
    <rect x="130" y="168" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="147" y="185" text-anchor="middle" fill="#333">1</text>
    <rect x="164" y="168" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="181" y="185" text-anchor="middle" fill="#333">2</text>
    <rect x="198" y="168" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="215" y="185" text-anchor="middle" fill="#333">4</text>
    <path d="M 147 196 L 147 204" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrUp)" fill="none" filter="url(#rough2)"/>
    <text x="147" y="214" text-anchor="middle" font-size="9" fill="#b85450">i=0</text>
    <rect x="330" y="168" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="347" y="185" text-anchor="middle" fill="#999">0</text>
    <rect x="364" y="168" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="381" y="185" text-anchor="middle" fill="#333">1</text>
    <rect x="398" y="168" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="415" y="185" text-anchor="middle" fill="#333">3</text>
    <path d="M 381 196 L 381 204" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrUp)" fill="none" filter="url(#rough2)"/>
    <text x="381" y="214" text-anchor="middle" font-size="9" fill="#b85450">j=1</text>
    <text x="260" y="185" text-anchor="middle" font-size="10" fill="#888">1 ≤ 1 → 取 a</text>
    <rect x="486" y="172" width="22" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="497" y="185" text-anchor="middle" font-size="10" fill="#333">0</text>
    <rect x="510" y="172" width="22" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="521" y="185" text-anchor="middle" font-size="10" fill="#333">1</text>
  </g>

  <!-- Row 3: i=1(a=2), j=1(b=1) -> 2>1 take b[1]=1 -->
  <g font-size="11">
    <text x="40" y="256" fill="#333" font-weight="bold">3</text>
    <rect x="130" y="240" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="147" y="257" text-anchor="middle" fill="#999">1</text>
    <rect x="164" y="240" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="181" y="257" text-anchor="middle" fill="#333">2</text>
    <rect x="198" y="240" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="215" y="257" text-anchor="middle" fill="#333">4</text>
    <path d="M 181 268 L 181 276" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrUp)" fill="none" filter="url(#rough2)"/>
    <text x="181" y="286" text-anchor="middle" font-size="9" fill="#b85450">i=1</text>
    <rect x="330" y="240" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="347" y="257" text-anchor="middle" fill="#999">0</text>
    <rect x="364" y="240" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="381" y="257" text-anchor="middle" fill="#333">1</text>
    <rect x="398" y="240" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="415" y="257" text-anchor="middle" fill="#333">3</text>
    <path d="M 381 268 L 381 276" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrUp)" fill="none" filter="url(#rough2)"/>
    <text x="381" y="286" text-anchor="middle" font-size="9" fill="#b85450">j=1</text>
    <text x="260" y="257" text-anchor="middle" font-size="10" fill="#888">2 &gt; 1 → 取 b</text>
    <rect x="486" y="244" width="22" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="497" y="257" text-anchor="middle" font-size="10" fill="#333">0</text>
    <rect x="510" y="244" width="22" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="521" y="257" text-anchor="middle" font-size="10" fill="#333">1</text>
    <rect x="534" y="244" width="22" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="545" y="257" text-anchor="middle" font-size="10" fill="#333">1</text>
  </g>

  <!-- Row 4: i=1(a=2), j=2(b=3) -> 2<=3 take a[1]=2 -->
  <g font-size="11">
    <text x="40" y="328" fill="#333" font-weight="bold">4</text>
    <rect x="130" y="312" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="147" y="329" text-anchor="middle" fill="#999">1</text>
    <rect x="164" y="312" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="181" y="329" text-anchor="middle" fill="#333">2</text>
    <rect x="198" y="312" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="215" y="329" text-anchor="middle" fill="#333">4</text>
    <path d="M 181 340 L 181 348" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrUp)" fill="none" filter="url(#rough2)"/>
    <text x="181" y="358" text-anchor="middle" font-size="9" fill="#b85450">i=1</text>
    <rect x="330" y="312" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="347" y="329" text-anchor="middle" fill="#999">0</text>
    <rect x="364" y="312" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="381" y="329" text-anchor="middle" fill="#999">1</text>
    <rect x="398" y="312" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="415" y="329" text-anchor="middle" fill="#333">3</text>
    <path d="M 415 340 L 415 348" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrUp)" fill="none" filter="url(#rough2)"/>
    <text x="415" y="358" text-anchor="middle" font-size="9" fill="#b85450">j=2</text>
    <text x="260" y="329" text-anchor="middle" font-size="10" fill="#888">2 ≤ 3 → 取 a</text>
    <rect x="486" y="316" width="22" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="497" y="329" text-anchor="middle" font-size="9" fill="#333">0</text>
    <rect x="510" y="316" width="22" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="521" y="329" text-anchor="middle" font-size="9" fill="#333">1</text>
    <rect x="534" y="316" width="22" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="545" y="329" text-anchor="middle" font-size="9" fill="#333">1</text>
    <rect x="558" y="316" width="20" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="568" y="329" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2</text>
  </g>

  <!-- Row 5: i=2(a=4), j=2(b=3) -> 4>3 take b[2]=3 -->
  <g font-size="11">
    <text x="40" y="400" fill="#333" font-weight="bold">5</text>
    <rect x="130" y="384" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="147" y="401" text-anchor="middle" fill="#999">1</text>
    <rect x="164" y="384" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="181" y="401" text-anchor="middle" fill="#999">2</text>
    <rect x="198" y="384" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="215" y="401" text-anchor="middle" fill="#333">4</text>
    <path d="M 215 412 L 215 420" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrUp)" fill="none" filter="url(#rough2)"/>
    <text x="215" y="430" text-anchor="middle" font-size="9" fill="#b85450">i=2</text>
    <rect x="330" y="384" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="347" y="401" text-anchor="middle" fill="#999">0</text>
    <rect x="364" y="384" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="381" y="401" text-anchor="middle" fill="#999">1</text>
    <rect x="398" y="384" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="415" y="401" text-anchor="middle" fill="#333">3</text>
    <path d="M 415 412 L 415 420" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrUp)" fill="none" filter="url(#rough2)"/>
    <text x="415" y="430" text-anchor="middle" font-size="9" fill="#b85450">j=2</text>
    <text x="260" y="401" text-anchor="middle" font-size="10" fill="#888">4 &gt; 3 → 取 b</text>
    <rect x="478" y="388" width="18" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="487" y="401" text-anchor="middle" font-size="8" fill="#333">0</text>
    <rect x="496" y="388" width="18" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="505" y="401" text-anchor="middle" font-size="8" fill="#333">1</text>
    <rect x="514" y="388" width="18" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="523" y="401" text-anchor="middle" font-size="8" fill="#333">1</text>
    <rect x="532" y="388" width="18" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="541" y="401" text-anchor="middle" font-size="8" fill="#333">2</text>
    <rect x="550" y="388" width="20" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="560" y="401" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">3</text>
  </g>

  <!-- Row 6: b exhausted -> append remainder a[2:]=[4] -->
  <g font-size="11">
    <text x="40" y="472" fill="#333" font-weight="bold">6</text>
    <rect x="130" y="456" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="147" y="473" text-anchor="middle" fill="#999">1</text>
    <rect x="164" y="456" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="181" y="473" text-anchor="middle" fill="#999">2</text>
    <rect x="198" y="456" width="34" height="24" fill="#e8f0fe" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="215" y="473" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <text x="215" y="492" text-anchor="middle" font-size="9" fill="#b85450">收尾 a[2:]</text>
    <rect x="330" y="456" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="347" y="473" text-anchor="middle" fill="#ccc">0</text>
    <rect x="364" y="456" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="381" y="473" text-anchor="middle" fill="#ccc">1</text>
    <rect x="398" y="456" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="415" y="473" text-anchor="middle" fill="#ccc">3</text>
    <text x="380" y="492" text-anchor="middle" font-size="9" fill="#888">b 已耗尽</text>
    <text x="260" y="473" text-anchor="middle" font-size="10" fill="#888">直接接上剩余 a</text>
    <rect x="470" y="460" width="16" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="478" y="473" text-anchor="middle" font-size="8" fill="#333">0</text>
    <rect x="486" y="460" width="16" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="494" y="473" text-anchor="middle" font-size="8" fill="#333">1</text>
    <rect x="502" y="460" width="16" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="510" y="473" text-anchor="middle" font-size="8" fill="#333">1</text>
    <rect x="518" y="460" width="16" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="526" y="473" text-anchor="middle" font-size="8" fill="#333">2</text>
    <rect x="534" y="460" width="16" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="542" y="473" text-anchor="middle" font-size="8" fill="#333">3</text>
    <rect x="552" y="460" width="20" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="562" y="473" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">4</text>
  </g>

  <!-- final result banner -->
  <rect x="120" y="510" width="340" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="13" filter="url(#rough2)"/>
  <text x="290" y="528" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">最终 ans = [0, 1, 1, 2, 3, 4] ✓</text>
</svg>
