<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：提取 pos → q 变换 → 前缀和 → 滑窗 O(n)</text>

  <!-- Step 1: collect pos -->
  <rect x="60" y="48" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="68" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① 收集 pos[]</text>
  <text x="160" y="84" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">遍历 nums，记录所有 1 的下标</text>

  <path d="M 160 94 L 160 112" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: compute q -->
  <rect x="60" y="114" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="134" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">② 计算 q[i] = pos[i] − i</text>
  <text x="160" y="150" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">"虚拟紧凑位置"，q 非递减</text>

  <path d="M 160 160 L 160 178" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: prefix sum -->
  <rect x="60" y="180" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="200" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 前缀和 P[] of q</text>
  <text x="160" y="216" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">P[0]=0, P[i]=Σq[0..i−1]</text>

  <path d="M 160 226 L 160 244" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: slide window (diamond) -->
  <polygon points="160,246 260,300 160,354 60,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="288" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">④ 滑窗 l = 0..cnt−k</text>
  <text x="160" y="304" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">r=l+k−1</text>
  <text x="160" y="318" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">m=l+(k−1)//2</text>
  <text x="160" y="332" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">中位数下标</text>

  <path d="M 160 356 L 160 374" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: compute cost -->
  <rect x="40" y="376" width="240" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="396" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">⑤ O(1) 算窗口代价</text>
  <text x="160" y="412" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">left_sum = P[m] − P[l]</text>
  <text x="160" y="424" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">right_sum = P[r+1] − P[m+1]</text>

  <path d="M 160 436 L 160 454" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6: return min -->
  <rect x="60" y="456" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="476" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑥ 返回 min(cost)</text>
  <text x="160" y="492" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">所有窗口中的最小代价</text>

  <!-- ===== Right side: cost formula detail ===== -->
  <rect x="320" y="376" width="215" height="124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="332" y="396" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">代价公式（前缀和加速）</text>
  <text x="332" y="416" font-size="10" fill="#555" filter="url(#rough2)">cost = right_sum − left_sum</text>
  <text x="332" y="430" font-size="10" fill="#555" filter="url(#rough2)">       + q[m]·(L − R)</text>
  <text x="332" y="448" font-size="9" fill="#888" filter="url(#rough2)">L = (k−1)//2 （左半个数）</text>
  <text x="332" y="462" font-size="9" fill="#888" filter="url(#rough2)">R = k−1−L （右半个数）</text>
  <text x="332" y="480" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">q 非递减 → 绝对值拆</text>
  <text x="332" y="492" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">成左右两段前缀和之差</text>

  <!-- ===== Right side: complexity ===== -->
  <rect x="320" y="48" width="215" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="332" y="68" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">复杂度</text>
  <text x="332" y="86" font-size="10" fill="#555" filter="url(#rough2)">时间：O(n)</text>
  <text x="332" y="100" font-size="9" fill="#888" filter="url(#rough2)">收集 pos O(n) + 建q/前缀和</text>
  <text x="332" y="112" font-size="9" fill="#888" filter="url(#rough2)">O(cnt) + 滑窗 cnt−k+1 个 ×O(1)</text>
  <text x="332" y="130" font-size="10" fill="#555" filter="url(#rough2)">空间：O(cnt)</text>
  <text x="332" y="142" font-size="9" fill="#888" filter="url(#rough2)">pos、q、P 三个数组</text>

  <!-- ===== Right side: why contiguous window ===== -->
  <rect x="320" y="162" width="215" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="332" y="182" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">为什么选连续窗口？</text>
  <text x="332" y="200" font-size="9" fill="#555" filter="url(#rough2)">最优解必选 pos[] 中 k 个</text>
  <text x="332" y="212" font-size="9" fill="#555" filter="url(#rough2)">连续元素。若跳过中间某</text>
  <text x="332" y="224" font-size="9" fill="#555" filter="url(#rough2)">个 1，可用它替换更远的 1，</text>
  <text x="332" y="236" font-size="9" fill="#555" filter="url(#rough2)">代价不增 → 不妨取连续段</text>
  <text x="332" y="252" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">cnt−k+1 个候选窗口取最小</text>

  <!-- ===== Right side: median note ===== -->
  <rect x="320" y="276" width="215" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="332" y="296" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">中位数下标 m 的取法</text>
  <text x="332" y="314" font-size="10" fill="#555" filter="url(#rough2)">m = l + (k−1) // 2</text>
  <text x="332" y="330" font-size="9" fill="#888" filter="url(#rough2)">k 奇：精确中位数，L=R</text>
  <text x="332" y="342" font-size="9" fill="#888" filter="url(#rough2)">k 偶：取左中位数，L=R−1</text>
  <text x="332" y="356" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">两种情况公式都正确</text>
</svg>
