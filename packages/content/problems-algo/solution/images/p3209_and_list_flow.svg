<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：滚动维护 (AND 值, 左端点个数) 列表</text>

  <rect x="120" y="36" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="200" y="55" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">开始：ans = 0，ands = ∅</text>

  <path d="M 200 66 L 200 82" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="110" y="82" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="200" y="101" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">取出下一个元素 x</text>

  <path d="M 200 112 L 200 128" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="200,128 278,154 200,180 122,154" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="158" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">元素取完了？</text>

  <path d="M 278 154 L 340 154" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="296" y="148" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="344" y="139" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="399" y="158" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <path d="M 200 180 L 200 196" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="208" y="192" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="85" y="196" width="230" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="200" y="215" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">新表 = [(x, 1)]：单元素子数组入列</text>

  <path d="M 200 226 L 200 242" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="72" y="242" width="256" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="200" y="261" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">逐个取出旧项 (v, c)，计算 nv = v &amp; x</text>

  <path d="M 200 272 L 200 288" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="200,288 288,316 200,344 112,316" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="313" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">nv 等于新表</text>
  <text x="200" y="326" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">末尾的值？</text>

  <path d="M 288 316 L 352 316" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="304" y="310" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="356" y="301" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="431" y="320" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">末尾计数 += c（合并）</text>

  <path d="M 112 316 L 48 316" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="86" y="310" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="8" y="301" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="68" y="320" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">追加 (nv, c)</text>

  <path d="M 200 344 L 200 360" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="72" y="360" width="256" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="379" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">查表：v == k ⇒ ans += c，回到取元素</text>

  <path d="M 72 375 L 30 375 L 30 97 L 106 97" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" stroke-dasharray="5,4" filter="url(#rough2)"/>
</svg>
