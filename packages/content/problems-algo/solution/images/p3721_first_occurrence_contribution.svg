<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 414"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="414" fill="#fafafa"/>

  <text x="280" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：D(l,r) 是 ±1/0 阶梯；滑动 l 只需一次区间加（nums = [1,2,3,2]）</text>

  <!-- 顶部：数组格子 -->
  <rect x="70" y="34" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="92" y="56" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="120" y="34" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="142" y="56" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="170" y="34" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="192" y="56" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="220" y="34" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="242" y="56" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="92" y="84" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">r=0</text>
  <text x="142" y="84" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">r=1</text>
  <text x="192" y="84" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">r=2</text>
  <text x="242" y="84" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">r=3</text>
  <text x="242" y="97" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">（重复不计数）</text>

  <!-- 顶部右侧：图例 -->
  <rect x="300" y="36" width="244" height="60" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="310" y="52" font-size="10" fill="#444" filter="url(#rough2)">奇数记 +1，偶数记 −1</text>
  <text x="310" y="68" font-size="10" fill="#444" filter="url(#rough2)">D(l,r) = 不同奇数数 − 不同偶数数</text>
  <text x="310" y="84" font-size="10" fill="#444" filter="url(#rough2)">D(l,r) = 0 ⟺ 平衡子数组</text>

  <!-- 面板 A：l = 1 -->
  <rect x="24" y="104" width="512" height="112" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="36" y="124" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">l = 1：D(1, r) —— r ≥ 1 有效（r = 0 已作废）</text>
  <text x="120" y="140" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">r=0</text>
  <text x="240" y="140" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">r=1</text>
  <text x="360" y="140" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">r=2</text>
  <text x="480" y="140" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">r=3</text>
  <path d="M 100 186 L 520 186" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="94" y="189" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="94" y="213" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">−1</text>
  <text x="120" y="192" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">×</text>
  <path d="M 240 210 L 360 186 L 480 186" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="240" cy="210" r="5" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="360" cy="186" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="480" cy="186" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="480" cy="186" r="10" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="530" y="180" text-anchor="end" font-size="10" fill="#b85450" filter="url(#rough2)">最右 0</text>
  <text x="530" y="196" text-anchor="end" font-size="10" fill="#b85450" filter="url(#rough2)">→ 长 3</text>

  <!-- 中间箭头 -->
  <path d="M 280 218 L 280 244" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="230" font-size="10.5" fill="#444" filter="url(#rough2)">l: 1 → 2：弹出 2（偶，sign = −1）</text>
  <text x="296" y="244" font-size="10.5" fill="#444" filter="url(#rough2)">贡献段 [0, nxt−1] = [0, 2] 整体 +1</text>

  <!-- 面板 B：l = 2 -->
  <rect x="24" y="252" width="512" height="112" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="36" y="272" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">l = 2：D(2, r) —— [0, 1] 被多改也无害（永不再查）</text>
  <text x="120" y="288" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">r=0</text>
  <text x="240" y="288" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">r=1</text>
  <text x="360" y="288" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">r=2</text>
  <text x="480" y="288" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">r=3</text>
  <rect x="96" y="294" width="336" height="62" fill="#d6a040" opacity="0.15" filter="url(#rough2)"/>
  <text x="264" y="306" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">「+1」作用区 [0, 2]</text>
  <path d="M 100 352 L 520 352" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="94" y="355" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="94" y="331" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">+1</text>
  <text x="120" y="358" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">×</text>
  <text x="240" y="358" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">×</text>
  <path d="M 360 328 L 480 352" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="360" cy="328" r="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="374" y="324" font-size="9" fill="#333" filter="url(#rough2)">+1</text>
  <circle cx="480" cy="352" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="480" cy="352" r="10" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="530" y="346" text-anchor="end" font-size="10" fill="#b85450" filter="url(#rough2)">最右 0</text>
  <text x="530" y="362" text-anchor="end" font-size="10" fill="#b85450" filter="url(#rough2)">→ 长 2</text>

  <!-- 底部结论 -->
  <rect x="24" y="372" width="512" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="386" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">每滑一步 = 1 次区间加 + 1 次「查最右 0」⟹ 总计 O(n log n)</text>
  <text x="280" y="400" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">「含 0」判定：min ≤ 0 ≤ max（阶梯相邻差 ≤ 1，负到正必踩 0）</text>
</svg>
