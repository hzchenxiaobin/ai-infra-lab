<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrGray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">循环结构：n=6 时位置 1 的轨道长度 = LCM(所有循环长度)</text>

  <!-- Fixed points: 0 and 5 -->
  <text x="60" y="62" font-size="11" fill="#888" filter="url(#rough2)">不动点：</text>
  <circle cx="120" cy="58" r="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="62" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">0</text>
  <path d="M 138 58 Q 156 44 150 58" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="160" y="50" font-size="9" fill="#888" filter="url(#rough2)">f(0)=0</text>

  <circle cx="460" cy="58" r="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="62" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">5</text>
  <path d="M 478 58 Q 496 44 490 58" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="500" y="50" font-size="9" fill="#888" filter="url(#rough2)">f(5)=5</text>
  <text x="460" y="92" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">长度 1</text>
  <text x="120" y="92" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">长度 1</text>

  <!-- Main cycle: 1 -> 2 -> 4 -> 3 -> 1 (length 4) -->
  <text x="280" y="138" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">非平凡循环（追踪位置 1）</text>

  <!-- 4 nodes in a circle layout -->
  <!-- pos 1 at top -->
  <circle cx="280" cy="180" r="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="185" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="280" y="158" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">起点</text>

  <!-- pos 2 at right -->
  <circle cx="400" cy="240" r="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="245" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- pos 4 at bottom -->
  <circle cx="280" cy="300" r="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="305" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- pos 3 at left -->
  <circle cx="160" cy="240" r="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="245" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- arrows: 1->2, 2->4, 4->3, 3->1 -->
  <path d="M 300 192 Q 360 200 384 230" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="356" y="200" font-size="9" fill="#b85450" filter="url(#rough2)">×2</text>

  <path d="M 384 260 Q 360 290 300 290" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="356" y="292" font-size="9" fill="#b85450" filter="url(#rough2)">×2</text>

  <path d="M 260 290 Q 200 290 176 260" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="210" y="292" font-size="9" fill="#b85450" filter="url(#rough2)">×2 mod 5</text>

  <path d="M 176 230 Q 200 200 260 192" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="210" y="200" font-size="9" fill="#b85450" filter="url(#rough2)">×2 mod 5</text>

  <!-- cycle length label -->
  <text x="280" y="240" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">长度 4</text>

  <!-- Conclusion box -->
  <path d="M 40 348 L 520 348" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="70" y="354" width="420" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">LCM(1, 1, 4) = 4 = ord₂(5) = 位置 1 的归位步数</text>
</svg>
