<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    核心观察：定长窗口 = 1 的总数
  </text>

  <!-- Array row label -->
  <text x="30" y="78" font-size="12" fill="#666" filter="url(#rough2)">data:</text>

  <!-- Full array: 1 0 1 0 1 0 1 -->
  <g filter="url(#rough2)">
    <rect x="70" y="58" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="92" y="82" text-anchor="middle" font-size="14" fill="#333">1</text>
    <rect x="114" y="58" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="136" y="82" text-anchor="middle" font-size="14" fill="#333">0</text>
    <rect x="158" y="58" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="180" y="82" text-anchor="middle" font-size="14" fill="#333">1</text>
    <rect x="202" y="58" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="224" y="82" text-anchor="middle" font-size="14" fill="#333">0</text>
    <rect x="246" y="58" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="268" y="82" text-anchor="middle" font-size="14" fill="#333">1</text>
    <rect x="290" y="58" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="312" y="82" text-anchor="middle" font-size="14" fill="#333">0</text>
    <rect x="334" y="58" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="356" y="82" text-anchor="middle" font-size="14" fill="#333">1</text>
  </g>

  <!-- Window bracket -->
  <path d="M 68 104 L 68 112 L 246 112 L 246 104" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="157" y="130" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">
    窗口大小 = ones = 3
  </text>

  <!-- Window highlight box -->
  <rect x="66" y="54" width="182" height="44" fill="none" stroke="#4a7a3a" stroke-width="2.5" stroke-dasharray="6 3" rx="6" filter="url(#rough2)"/>

  <!-- Count of 1s in window -->
  <text x="157" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    窗口内 1 的个数 = 2
  </text>

  <!-- Arrow down -->
  <path d="M 157 162 L 157 178" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Formula box -->
  <rect x="70" y="185" width="330" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="235" y="207" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    交换次数 = ones − 窗口内 1 的个数 = 3 − 2 = 1
  </text>

  <!-- Explanation -->
  <text x="30" y="245" font-size="12" fill="#666" filter="url(#rough2)">思路：</text>
  <text x="30" y="265" font-size="12" fill="#333" filter="url(#rough2)">① 统计全数组 1 的总数 ones</text>
  <text x="30" y="283" font-size="12" fill="#333" filter="url(#rough2)">② 用大小为 ones 的定长窗口扫过数组</text>
  <text x="30" y="301" font-size="12" fill="#333" filter="url(#rough2)">③ 找到窗口内 1 最多的那个窗口</text>
  <text x="30" y="319" font-size="12" fill="#333" filter="url(#rough2)">④ 最少交换 = ones − max(窗口内1的个数)</text>

  <!-- Insight box -->
  <rect x="320" y="245" width="180" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="267" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">💡 关键洞察</text>
  <text x="330" y="285" font-size="11" fill="#333" filter="url(#rough2)">窗口里的 0 就是要</text>
  <text x="330" y="300" font-size="11" fill="#333" filter="url(#rough2)">换出去的个数。</text>
  <text x="330" y="315" font-size="11" fill="#333" filter="url(#rough2)">0 最少 ⇔ 1 最多。</text>
</svg>
