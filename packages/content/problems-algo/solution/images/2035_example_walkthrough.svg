<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="560" fill="#fafafa"/>

  <!-- Title -->
  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums=[3,9,7,3], n=2 → 最小差 2</text>
  <text x="330" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">A=[3,9]，B=[7,3]，S=22，目标 S/2=11</text>

  <!-- Array cells -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="150" y="64" font-size="9" fill="#888">A[0]</text>
    <text x="200" y="64" font-size="9" fill="#888">A[1]</text>
    <text x="290" y="64" font-size="9" fill="#888">B[0]</text>
    <text x="340" y="64" font-size="9" fill="#888">B[1]</text>

    <rect x="130" y="70" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="150" y="89" fill="#446688" font-weight="bold">3</text>
    <rect x="180" y="70" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="200" y="89" fill="#446688" font-weight="bold">9</text>
    <rect x="270" y="70" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="290" y="89" fill="#4a7a3a" font-weight="bold">7</text>
    <rect x="320" y="70" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="340" y="89" fill="#4a7a3a" font-weight="bold">3</text>
  </g>

  <!-- split divider -->
  <path d="M 248 60 L 248 108" stroke="#b85450" stroke-width="2.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="248" y="54" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">劈开</text>

  <!-- braces -->
  <path d="M 130 108 L 130 114 L 220 114 L 220 108" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="175" y="128" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">半 A</text>
  <path d="M 270 108 L 270 114 L 360 114 L 360 108" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="315" y="128" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">半 B</text>

  <!-- Subset sum tables -->
  <text x="100" y="150" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">sumsA[k]</text>
  <text x="430" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">sumsB[k]（排序后）</text>

  <!-- table A -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="40" y="158" width="30" height="22" fill="#f4f6f9" stroke="#9bb0c8" stroke-width="1.2" rx="3"/>
    <text x="55" y="173" fill="#666" font-size="9">k</text>
    <rect x="70" y="158" width="70" height="22" fill="#f4f6f9" stroke="#9bb0c8" stroke-width="1.2" rx="3"/>
    <text x="105" y="173" fill="#666" font-size="9">子集和</text>
    <rect x="40" y="180" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="55" y="195" fill="#446688" font-weight="bold">0</text>
    <rect x="70" y="180" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="105" y="195" fill="#333">{0}</text>
    <rect x="40" y="202" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="55" y="217" fill="#446688" font-weight="bold">1</text>
    <rect x="70" y="202" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="105" y="217" fill="#333">{3, 9}</text>
    <rect x="40" y="224" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="55" y="239" fill="#446688" font-weight="bold">2</text>
    <rect x="70" y="224" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="105" y="239" fill="#333">{12}</text>
  </g>

  <!-- table B -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="370" y="158" width="30" height="22" fill="#f4f8f5" stroke="#9bc8a0" stroke-width="1.2" rx="3"/>
    <text x="385" y="173" fill="#666" font-size="9">k</text>
    <rect x="400" y="158" width="80" height="22" fill="#f4f8f5" stroke="#9bc8a0" stroke-width="1.2" rx="3"/>
    <text x="440" y="173" fill="#666" font-size="9">子集和</text>
    <rect x="370" y="180" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="385" y="195" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="400" y="180" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="440" y="195" fill="#333">{0}</text>
    <rect x="370" y="202" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="385" y="217" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="400" y="202" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="440" y="217" fill="#333">{3, 7}</text>
    <rect x="370" y="224" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="385" y="239" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="400" y="224" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="440" y="239" fill="#333">{10}</text>
  </g>

  <!-- divider -->
  <line x1="30" y1="260" x2="630" y2="260" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Pairing table header -->
  <text x="330" y="278" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">按 k 配对：遍历 s1，二分 sumsB[n−k] 找最近 s2</text>

  <g filter="url(#rough2)" font-size="9.5" text-anchor="middle">
    <!-- header row -->
    <rect x="40" y="290" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <text x="60" y="305" fill="#d6a040" font-weight="bold">k</text>
    <rect x="80" y="290" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <text x="110" y="305" fill="#d6a040" font-weight="bold">s1</text>
    <rect x="140" y="290" width="70" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <text x="175" y="305" fill="#d6a040" font-weight="bold">target=11−s1</text>
    <rect x="210" y="290" width="90" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <text x="255" y="305" fill="#d6a040" font-weight="bold">cand=sumsB[n−k]</text>
    <rect x="300" y="290" width="56" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <text x="328" y="305" fill="#d6a040" font-weight="bold">最近 s2</text>
    <rect x="356" y="290" width="56" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <text x="384" y="305" fill="#d6a040" font-weight="bold">s1+s2</text>
    <rect x="412" y="290" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <text x="452" y="305" fill="#d6a040" font-weight="bold">|2(s1+s2)−S|</text>

    <!-- row 1: k=0, s1=0 -->
    <rect x="40" y="312" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="60" y="327" fill="#446688" font-weight="bold">0</text>
    <rect x="80" y="312" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="110" y="327" fill="#333">0</text>
    <rect x="140" y="312" width="70" height="22" fill="#f4f6f9" stroke="#9bb0c8" stroke-width="1.2" rx="3"/>
    <text x="175" y="327" fill="#888">11</text>
    <rect x="210" y="312" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <text x="255" y="327" fill="#333">{10}</text>
    <rect x="300" y="312" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <text x="328" y="327" fill="#4a7a3a" font-weight="bold">10</text>
    <rect x="356" y="312" width="56" height="22" fill="#f4f6f9" stroke="#9bb0c8" stroke-width="1.2" rx="3"/>
    <text x="384" y="327" fill="#333">10</text>
    <rect x="412" y="312" width="80" height="22" fill="#f4f6f9" stroke="#9bb0c8" stroke-width="1.2" rx="3"/>
    <text x="452" y="327" fill="#333">2</text>

    <!-- row 2: k=1, s1=3 -->
    <rect x="40" y="334" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="60" y="349" fill="#446688" font-weight="bold">1</text>
    <rect x="80" y="334" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="110" y="349" fill="#333">3</text>
    <rect x="140" y="334" width="70" height="22" fill="#f4f6f9" stroke="#9bb0c8" stroke-width="1.2" rx="3"/>
    <text x="175" y="349" fill="#888">8</text>
    <rect x="210" y="334" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <text x="255" y="349" fill="#333">{3, 7}</text>
    <rect x="300" y="334" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <text x="328" y="349" fill="#4a7a3a" font-weight="bold">7</text>
    <rect x="356" y="334" width="56" height="22" fill="#f4f6f9" stroke="#9bb0c8" stroke-width="1.2" rx="3"/>
    <text x="384" y="349" fill="#333">10</text>
    <rect x="412" y="334" width="80" height="22" fill="#f4f6f9" stroke="#9bb0c8" stroke-width="1.2" rx="3"/>
    <text x="452" y="349" fill="#333">2</text>

    <!-- row 3: k=1, s1=9 -->
    <rect x="40" y="356" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="60" y="371" fill="#446688" font-weight="bold">1</text>
    <rect x="80" y="356" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="110" y="371" fill="#333">9</text>
    <rect x="140" y="356" width="70" height="22" fill="#f4f6f9" stroke="#9bb0c8" stroke-width="1.2" rx="3"/>
    <text x="175" y="371" fill="#888">2</text>
    <rect x="210" y="356" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <text x="255" y="371" fill="#333">{3, 7}</text>
    <rect x="300" y="356" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <text x="328" y="371" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="356" y="356" width="56" height="22" fill="#f4f6f9" stroke="#9bb0c8" stroke-width="1.2" rx="3"/>
    <text x="384" y="371" fill="#333">12</text>
    <rect x="412" y="356" width="80" height="22" fill="#f4f6f9" stroke="#9bb0c8" stroke-width="1.2" rx="3"/>
    <text x="452" y="371" fill="#333">2</text>

    <!-- row 4: k=2, s1=12 -->
    <rect x="40" y="378" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="60" y="393" fill="#446688" font-weight="bold">2</text>
    <rect x="80" y="378" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="110" y="393" fill="#333">12</text>
    <rect x="140" y="378" width="70" height="22" fill="#f4f6f9" stroke="#9bb0c8" stroke-width="1.2" rx="3"/>
    <text x="175" y="393" fill="#888">−1</text>
    <rect x="210" y="378" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <text x="255" y="393" fill="#333">{0}</text>
    <rect x="300" y="378" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <text x="328" y="393" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="356" y="378" width="56" height="22" fill="#f4f6f9" stroke="#9bb0c8" stroke-width="1.2" rx="3"/>
    <text x="384" y="393" fill="#333">12</text>
    <rect x="412" y="378" width="80" height="22" fill="#f4f6f9" stroke="#9bb0c8" stroke-width="1.2" rx="3"/>
    <text x="452" y="393" fill="#333">2</text>
  </g>

  <!-- best partition highlight -->
  <rect x="80" y="334" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="110" y="349" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- result box -->
  <rect x="120" y="420" width="420" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="330" y="440" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">所有配对最小差 = 2 ★</text>
  <text x="330" y="456" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">最优分组：part1=[3,7]（和 10），part2=[9,3]（和 12），差 2</text>

  <!-- note -->
  <rect x="40" y="480" width="580" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="330" y="500" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">k=1, s1=3 时：A 取 {3}、B 取 {7}（n−k=1），拼成 n=2 元子集 {3,7}</text>
  <text x="330" y="516" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">二分在 {3,7} 找最接近 8 的值 → 7（7 比 3 更近 8）</text>
  <text x="330" y="532" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">范德蒙：C(2,0)C(2,2)+C(2,1)C(2,1)+C(2,2)C(2,0)=1+4+1=6=C(4,2) 全覆盖</text>
</svg>
