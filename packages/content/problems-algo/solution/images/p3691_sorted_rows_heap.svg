<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：n 条有序列表，堆归并取前 k 大</text>
  <text x="260" y="45" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">示例 2：nums = [4, 2, 5, 1]，k = 3</text>

  <!-- nums 原数组 -->
  <text x="142" y="74" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">nums</text>
  <rect x="150" y="54" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="196" y="54" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="242" y="54" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="288" y="54" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <!-- 列标 -->
  <text x="170" y="101" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">r=0</text>
  <text x="216" y="101" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">r=1</text>
  <text x="262" y="101" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">r=2</text>
  <text x="308" y="101" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">r=3</text>

  <!-- 值三角矩阵：第 l 行 = 固定 l 的有序列表 -->
  <text x="138" y="128" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">l=0</text>
  <rect x="150" y="108" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="128" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="196" y="108" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="128" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="242" y="108" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="128" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="288" y="108" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="128" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="322" y="121" font-size="10" fill="#d6a040" filter="url(#rough2)">✓</text>

  <text x="138" y="168" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">l=1</text>
  <rect x="196" y="148" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="168" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="242" y="148" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="168" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="288" y="148" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="168" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="322" y="161" font-size="10" fill="#d6a040" filter="url(#rough2)">✓</text>

  <text x="138" y="208" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">l=2</text>
  <rect x="242" y="188" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="208" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="288" y="188" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="208" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="322" y="201" font-size="10" fill="#d6a040" filter="url(#rough2)">✓</text>

  <text x="138" y="248" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">l=3</text>
  <rect x="288" y="228" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="308" y="248" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <!-- 右侧注释 -->
  <text x="352" y="106" font-size="10.5" fill="#446688" filter="url(#rough2)">固定 l，r 右移一格：</text>
  <text x="352" y="122" font-size="10.5" fill="#446688" filter="url(#rough2)">max 只增、min 只减</text>
  <text x="352" y="138" font-size="10.5" fill="#446688" filter="url(#rough2)">⇒ v(l,r) 单调不减</text>
  <text x="352" y="160" font-size="10.5" fill="#333" filter="url(#rough2)">每个 l = 一条非减列表，</text>
  <text x="352" y="176" font-size="10.5" fill="#333" filter="url(#rough2)">全表是三角矩阵</text>
  <text x="352" y="202" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">绿色最右列 = 各行最大值</text>
  <text x="352" y="218" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">n 个种子全部入堆</text>
  <text x="352" y="244" font-size="10.5" fill="#d6a040" filter="url(#rough2)">橙色 = 前 k=3 大：</text>
  <text x="352" y="260" font-size="11" fill="#d6a040" filter="url(#rough2)">4 + 4 + 4 = 12</text>
  <text x="352" y="286" font-size="10.5" fill="#b85450" filter="url(#rough2)">弹 (l,r) ⇒ 推入 (l,r−1)</text>
  <text x="352" y="302" font-size="10.5" fill="#b85450" filter="url(#rough2)">列表前一个候选接棒</text>

  <!-- 底部说明 -->
  <text x="260" y="316" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">💡 三角矩阵 n(n+1)/2 ≈ 1.25×10⁹ 个值不必全算——弹谁才生成谁，堆只碰 O(n+k) 个</text>
  <text x="260" y="334" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">⚠️ 每个 (l,r) 只属于 l 那一行、只入堆一次 ⇒「互不相同」自动满足</text>
  <text x="260" y="352" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">⚠️ 值非负：堆顶弹到 0 ⇒ 剩余候选全为 0，提前收工</text>
</svg>
