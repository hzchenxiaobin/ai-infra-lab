<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">长除法本质：余数驱动每一位小数</text>
  <text x="270" y="42" text-anchor="middle" font-size="11" fill="#888">以 4 ÷ 333 为例</text>

  <!-- Row 1 -->
  <text x="24" y="82" font-size="11" fill="#888">第 1 步</text>
  <rect x="70" y="64" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="83" text-anchor="middle" font-size="12" fill="#333">r = 4</text>
  <text x="138" y="83" font-size="11" fill="#888">×10</text>
  <path d="M 160 78 L 188 78" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="192" y="64" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="83" text-anchor="middle" font-size="12" fill="#333">40</text>
  <text x="260" y="83" font-size="11" fill="#888">÷333</text>
  <path d="M 292 78 L 320 78" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="324" y="64" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="346" y="83" text-anchor="middle" font-size="12" fill="#333">商 0</text>
  <rect x="376" y="64" width="76" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="414" y="83" text-anchor="middle" font-size="12" fill="#333">新 r = 40</text>

  <!-- Row 2 -->
  <text x="24" y="138" font-size="11" fill="#888">第 2 步</text>
  <rect x="70" y="120" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="139" text-anchor="middle" font-size="12" fill="#333">r = 40</text>
  <text x="138" y="139" font-size="11" fill="#888">×10</text>
  <path d="M 160 134 L 188 134" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="192" y="120" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="139" text-anchor="middle" font-size="12" fill="#333">400</text>
  <text x="260" y="139" font-size="11" fill="#888">÷333</text>
  <path d="M 292 134 L 320 134" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="324" y="120" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="346" y="139" text-anchor="middle" font-size="12" fill="#333">商 1</text>
  <rect x="376" y="120" width="76" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="414" y="139" text-anchor="middle" font-size="12" fill="#333">新 r = 67</text>

  <!-- Row 3 -->
  <text x="24" y="194" font-size="11" fill="#888">第 3 步</text>
  <rect x="70" y="176" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="195" text-anchor="middle" font-size="12" fill="#333">r = 67</text>
  <text x="138" y="195" font-size="11" fill="#888">×10</text>
  <path d="M 160 190 L 188 190" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="192" y="176" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="195" text-anchor="middle" font-size="12" fill="#333">670</text>
  <text x="260" y="195" font-size="11" fill="#888">÷333</text>
  <path d="M 292 190 L 320 190" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="324" y="176" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="346" y="195" text-anchor="middle" font-size="12" fill="#333">商 2</text>
  <rect x="376" y="176" width="76" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="414" y="195" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">新 r = 4 ⚠</text>

  <!-- produced decimal -->
  <text x="24" y="244" font-size="11" fill="#888">已得小数:</text>
  <rect x="90" y="228" width="180" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="248" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0 . 0 1 2 ...</text>
  <text x="282" y="248" font-size="11" fill="#b85450">r=4 再次出现 → 开始循环</text>

  <!-- callout -->
  <rect x="40" y="276" width="460" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="298" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">核心观察：余数一旦重复，后续商位必然重复</text>
  <text x="270" y="316" text-anchor="middle" font-size="11" fill="#555">相同的余数 → 相同的「×10 ÷ d」过程 → 相同的商与新余数</text>
  <text x="270" y="332" text-anchor="middle" font-size="11" fill="#888">所以用哈希表记录每个余数首次出现的位置，即可定位循环节</text>
</svg>
