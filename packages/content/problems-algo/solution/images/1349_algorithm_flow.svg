<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="520" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：逐行状态压缩 DP</text>

  <!-- step 1: precompute -->
  <rect x="110" y="42" width="300" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="11" fill="#333">① 预处理：每行 available 掩码（'.' → 1, '#' → 0）</text>
  <path d="M 260 80 L 260 96" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- step 2: init dp for row 0 -->
  <rect x="110" y="98" width="300" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="121" text-anchor="middle" font-size="11" fill="#333">② 初始化 dp：枚举 row 0 所有合法 mask</text>
  <path d="M 260 136 L 260 152" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- step 3: loop header -->
  <rect x="90" y="154" width="340" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="177" text-anchor="middle" font-size="11" fill="#333">③ for i = 1 … m−1：处理第 i 行</text>
  <path d="M 260 192 L 260 210" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- decision: enumerate valid mask -->
  <polygon points="260,212 380,252 260,292 140,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="11" fill="#333">枚举 mask ∈ [0, 2ⁿ)</text>
  <text x="260" y="264" text-anchor="middle" font-size="10" fill="#888">满足约束 ①②？</text>
  <text x="260" y="278" text-anchor="middle" font-size="10" fill="#888">否 → 跳过</text>

  <path d="M 260 292 L 260 308" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="270" y="304" font-size="9" fill="#4a7a3a">是</text>

  <!-- decision: enumerate prev -->
  <polygon points="260,310 380,348 260,386 140,348" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="11" fill="#333">枚举 prev ∈ dp</text>
  <text x="260" y="360" text-anchor="middle" font-size="10" fill="#888">满足约束 ③？</text>
  <text x="260" y="374" text-anchor="middle" font-size="10" fill="#888">否 → 跳过</text>

  <path d="M 260 386 L 260 402" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="270" y="398" font-size="9" fill="#4a7a3a">是</text>

  <!-- update -->
  <rect x="80" y="404" width="360" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="427" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">ndp[mask] = max(ndp[mask], popcount(mask) + dp[prev])</text>

  <!-- loop back -->
  <path d="M 440 422 L 480 422 L 480 172 L 430 172" stroke="#666" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="486" y="300" font-size="9" fill="#888" transform="rotate(90 486 300)">循环回 ③</text>

  <!-- after loop -->
  <path d="M 260 442 L 260 460" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="130" y="462" width="260" height="36" rx="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="485" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">④ return max(dp)</text>

  <text x="260" y="514" text-anchor="middle" font-size="10" fill="#888">滚动数组：dp 只保留上一行，空间 O(2ⁿ)；n ≤ 8 → 256 状态</text>
</svg>
