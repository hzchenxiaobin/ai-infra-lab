<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">
    示例演算：nums = [3,4,5,2,1,7,3,4,7], k = 3
  </text>

  <!-- ===== Groups ===== -->
  <text x="40" y="48" font-size="10" fill="#888" filter="url(#rough2)">分组（值:频次）：</text>

  <rect x="40" y="54" width="150" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="115" y="70" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">组0</text>
  <text x="115" y="84" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">{3:2, 2:1}  sz=3</text>

  <rect x="200" y="54" width="150" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="275" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">组1</text>
  <text x="275" y="84" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">{4:2, 1:1}  sz=3</text>

  <rect x="360" y="54" width="150" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="435" y="70" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">组2</text>
  <text x="435" y="84" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">{5:1, 7:2}  sz=3</text>

  <!-- ===== XOR state labels ===== -->
  <text x="40" y="116" font-size="9" fill="#888" filter="url(#rough2)">xor →</text>
  <text x="130" y="116" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">0</text>
  <text x="168" y="116" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">1</text>
  <text x="206" y="116" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">2</text>
  <text x="244" y="116" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">3</text>
  <text x="282" y="116" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">4</text>
  <text x="320" y="116" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">5</text>
  <text x="358" y="116" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">6</text>
  <text x="396" y="116" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">7</text>

  <!-- ===== dp[0] ===== -->
  <text x="40" y="138" font-size="9" fill="#888" filter="url(#rough2)">dp[0]</text>
  <rect x="112" y="122" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="130" y="138" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="150" y="122" width="36" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="168" y="138" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">∞</text>
  <rect x="188" y="122" width="36" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="206" y="138" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">∞</text>
  <rect x="226" y="122" width="36" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="244" y="138" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">∞</text>
  <rect x="264" y="122" width="36" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="282" y="138" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">∞</text>
  <rect x="302" y="122" width="36" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="138" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">∞</text>
  <rect x="340" y="122" width="36" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="358" y="138" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">∞</text>
  <rect x="378" y="122" width="36" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="396" y="138" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">∞</text>

  <!-- arrow dp[0] -> dp[1] -->
  <path d="M260,148 L260,158" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="156" font-size="9" fill="#b85450" filter="url(#rough2)">组0: v=3,cost=1; v=2,cost=2; 全新,cost=3</text>

  <!-- ===== dp[1] ===== -->
  <text x="40" y="178" font-size="9" fill="#888" filter="url(#rough2)">dp[1]</text>
  <rect x="112" y="162" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="130" y="178" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <rect x="150" y="162" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="168" y="178" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <rect x="188" y="162" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="206" y="178" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <rect x="226" y="162" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="244" y="178" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="264" y="162" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="282" y="178" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <rect x="302" y="162" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="320" y="178" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <rect x="340" y="162" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="358" y="178" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <rect x="378" y="162" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="396" y="178" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="430" y="178" font-size="9" fill="#b85450" filter="url(#rough2)">← min=1 (选3, cost1)</text>

  <!-- arrow dp[1] -> dp[2] -->
  <path d="M260,188 L260,198" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="196" font-size="9" fill="#446688" filter="url(#rough2)">组1: v=4,cost=1; v=1,cost=2; 全新,cost=4</text>

  <!-- ===== dp[2] ===== -->
  <text x="40" y="218" font-size="9" fill="#888" filter="url(#rough2)">dp[2]</text>
  <rect x="112" y="202" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="130" y="218" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <rect x="150" y="202" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="168" y="218" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <rect x="188" y="202" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="206" y="218" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <rect x="226" y="202" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="244" y="218" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <rect x="264" y="202" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="282" y="218" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <rect x="302" y="202" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="320" y="218" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <rect x="340" y="202" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="358" y="218" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <rect x="378" y="202" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="396" y="218" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="430" y="218" font-size="9" fill="#446688" filter="url(#rough2)">← min=2 (选4, cost1)</text>

  <!-- arrow dp[2] -> dp[3] -->
  <path d="M260,228 L260,238" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="236" font-size="9" fill="#4a7a3a" filter="url(#rough2)">组2: v=7,cost=1; v=5,cost=2; 全新,cost=5</text>

  <!-- ===== dp[3] ===== -->
  <text x="40" y="258" font-size="9" fill="#888" filter="url(#rough2)">dp[3]</text>
  <rect x="112" y="242" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="130" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="150" y="242" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="168" y="258" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <rect x="188" y="242" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="206" y="258" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <rect x="226" y="242" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="244" y="258" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>
  <rect x="264" y="242" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="282" y="258" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>
  <rect x="302" y="242" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="258" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <rect x="340" y="242" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="358" y="258" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>
  <rect x="378" y="242" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="396" y="258" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>

  <!-- Answer arrow -->
  <path d="M130,268 L130,282 L280,282 L280,290" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Optimal path ===== -->
  <rect x="80" y="296" width="400" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">
    最优路径：dp[0][0]=0 → 组0选3(cost1) → 组1选4(cost1) → 组2选7(cost1)
  </text>
  <text x="280" y="334" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">
    累计异或：0 → 3 → 7 → 0   ✓   总代价 = 1+1+1 = 3
  </text>
  <text x="280" y="348" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">
    修改后数组 [3,4,7,3,4,7,3,4,7]，每窗口 3⊕4⊕7 = 0
  </text>

  <!-- ===== Legend ===== -->
  <rect x="40" y="370" width="480" height="76" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="60" y="388" font-size="9" fill="#888" font-weight="bold" filter="url(#rough2)">图例：</text>
  <rect x="100" y="380" width="20" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="128" y="390" font-size="9" fill="#555" filter="url(#rough2)">初始/答案</text>
  <rect x="200" y="380" width="20" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="228" y="390" font-size="9" fill="#555" filter="url(#rough2)">已有值最优</text>
  <rect x="300" y="380" width="20" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="328" y="390" font-size="9" fill="#555" filter="url(#rough2)">已有值次优</text>
  <rect x="400" y="380" width="20" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="428" y="390" font-size="9" fill="#555" filter="url(#rough2)">全新值基线</text>

  <text x="60" y="416" font-size="9" fill="#888" filter="url(#rough2)">说明：橙色列 = 全新值分支填充的基线值（min_prev + sz）；</text>
  <text x="60" y="432" font-size="9" fill="#888" filter="url(#rough2)">粉/蓝列 = 已有值分支覆盖出的更优解。dp[3][0] = 3 为最终答案。</text>
</svg>
