<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐节点更新 streak 与 maxLen（root = [1,null,3,2,4,null,null,null,5]）</text>

  <!-- 表格外框 -->
  <rect x="20" y="60" width="530" height="200" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 列分隔线 -->
  <line x1="110" y1="60" x2="110" y2="260" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="190" y1="60" x2="190" y2="260" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="270" y1="60" x2="270" y2="260" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="390" y1="60" x2="390" y2="260" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="470" y1="60" x2="470" y2="260" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行分隔线 -->
  <line x1="20" y1="90" x2="550" y2="90" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="124" x2="550" y2="124" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="158" x2="550" y2="158" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="192" x2="550" y2="192" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="226" x2="550" y2="226" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="20" y="60" width="530" height="30" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="65" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">访问节点</text>
  <text x="150" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">parentVal</text>
  <text x="230" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">传入 len</text>
  <text x="330" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">val == pv+1?</text>
  <text x="430" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">更新 len</text>
  <text x="510" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">maxLen</text>

  <!-- 行 0：节点 1（根） -->
  <text x="65" y="112" text-anchor="middle" font-size="11" fill="#333">1（根）</text>
  <text x="150" y="112" text-anchor="middle" font-size="11" fill="#888">1 *</text>
  <text x="230" y="112" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="330" y="112" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <text x="430" y="112" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="510" y="112" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- 行 1：节点 3 -->
  <text x="65" y="146" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="150" y="146" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="230" y="146" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="330" y="146" text-anchor="middle" font-size="10" fill="#b85450">否 (3≠2)</text>
  <text x="430" y="146" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="510" y="146" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- 行 2：节点 2 -->
  <text x="65" y="180" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="150" y="180" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="230" y="180" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="330" y="180" text-anchor="middle" font-size="10" fill="#b85450">否 (2≠4)</text>
  <text x="430" y="180" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="510" y="180" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- 行 3：节点 4（续接，绿色高亮） -->
  <rect x="20" y="192" width="530" height="34" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="65" y="214" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="150" y="214" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="230" y="214" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="330" y="214" text-anchor="middle" font-size="10" fill="#4a7a3a">是 (4=3+1)</text>
  <text x="430" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="510" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- 行 4：节点 5（续接，绿色高亮） -->
  <rect x="20" y="226" width="530" height="34" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="65" y="248" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="150" y="248" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="230" y="248" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="330" y="248" text-anchor="middle" font-size="10" fill="#4a7a3a">是 (5=4+1)</text>
  <text x="430" y="248" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="510" y="248" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- 底部说明 -->
  <rect x="30" y="280" width="500" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="11" fill="#555">* 根节点初始 parentVal = root.val，使续接条件不成立 → streak 重置为 1</text>
  <text x="280" y="318" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">最终 maxLen = 3（连续路径 3 → 4 → 5）</text>
  <text x="280" y="334" text-anchor="middle" font-size="10" fill="#888">绿色行：续接成功，streak 递增；其余行重置为 1</text>
</svg>
