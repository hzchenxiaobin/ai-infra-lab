<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：逐字符扫描，元音跳过丢弃，辅音原样保留</text>

  <!-- Legend -->
  <rect x="120" y="48" width="18" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="146" y="62" font-size="11" fill="#666">元音 a/e/i/o/u → 丢弃</text>
  <rect x="310" y="48" width="18" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="336" y="62" font-size="11" fill="#666">辅音 → 保留</text>

  <!-- Input string: l e e t c o d e -->
  <text x="70" y="112" font-size="12" fill="#888">输入:</text>
  <rect x="100" y="88" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="112" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">l</text>
  <rect x="146" y="88" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="166" y="112" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">e</text>
  <rect x="192" y="88" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="112" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">e</text>
  <rect x="238" y="88" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="258" y="112" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">t</text>
  <rect x="284" y="88" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="304" y="112" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
  <rect x="330" y="88" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="112" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">o</text>
  <rect x="376" y="88" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="396" y="112" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">d</text>
  <rect x="422" y="88" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="442" y="112" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">e</text>

  <!-- per-char fate markers -->
  <text x="120" y="146" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="166" y="146" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>
  <text x="212" y="146" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>
  <text x="258" y="146" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="304" y="146" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="350" y="146" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>
  <text x="396" y="146" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="442" y="146" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>

  <!-- big down arrow -->
  <path d="M 280 156 L 280 184" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="174" font-size="10" fill="#888">过滤元音</text>

  <!-- Output string: l t c d -->
  <text x="70" y="212" font-size="12" fill="#888">输出:</text>
  <rect x="100" y="188" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="212" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">l</text>
  <rect x="146" y="188" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="166" y="212" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">t</text>
  <rect x="192" y="188" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="212" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
  <rect x="238" y="188" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="258" y="212" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">d</text>

  <!-- Note box -->
  <rect x="60" y="248" width="440" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">一次遍历即可：字符为元音则跳过，否则追加到结果</text>
  <text x="280" y="292" text-anchor="middle" font-size="11" fill="#666">辅音字符不做任何变换，原样拼入结果串</text>
  <text x="280" y="310" text-anchor="middle" font-size="10" fill="#888">也可直接调用内置 replace / translate 批量删除</text>
</svg>
