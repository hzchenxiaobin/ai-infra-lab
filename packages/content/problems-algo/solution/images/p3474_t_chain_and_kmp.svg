<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：T 链钉入 + KMP 状态 j 一位管全局</text>

  <!-- ===== 上半部：word 条带 ===== -->
  <text x="70" y="52" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① T 链：把 str2 钉进 word（例：TFTF / ab）</text>

  <!-- T 窗口括注 -->
  <path d="M 72 60 L 72 66 L 156 66 L 156 60" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="114" y="58" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">T@0 钉 [0,2)</text>
  <path d="M 160 60 L 160 66 L 244 66 L 244 60" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="202" y="58" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">T@2 钉 [2,4)</text>

  <!-- 单元格 -->
  <rect x="72" y="70" width="42" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="114" y="70" width="42" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="156" y="70" width="42" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="198" y="70" width="42" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="240" y="70" width="42" height="38" rx="4" fill="#fff" stroke="#888" stroke-width="1.4" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="93" y="94" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="135" y="94" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="177" y="94" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="219" y="94" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="261" y="94" text-anchor="middle" font-size="14" fill="#a07020" font-weight="bold" filter="url(#rough2)">?</text>
  <text x="93" y="122" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="135" y="122" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="177" y="122" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="219" y="122" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="261" y="122" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>

  <!-- F 窗口弧线 -->
  <rect x="112" y="130" width="88" height="24" rx="10" fill="none" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6,3" filter="url(#rough2)"/>
  <text x="156" y="146" text-anchor="middle" font-size="10.5" fill="#a07020" filter="url(#rough2)">F@1 窗口</text>
  <rect x="196" y="130" width="88" height="24" rx="10" fill="none" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6,3" filter="url(#rough2)"/>
  <text x="240" y="146" text-anchor="middle" font-size="10.5" fill="#a07020" filter="url(#rough2)">F@3 窗口</text>

  <!-- 右侧说明框 -->
  <rect x="316" y="64" width="188" height="96" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="84" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">间距 d 与重叠</text>
  <text x="326" y="102" font-size="10.5" fill="#333" filter="url(#rough2)">· d ≥ m：不重叠，各钉各的</text>
  <text x="326" y="118" font-size="10.5" fill="#333" filter="url(#rough2)">· d &lt; m：重叠区要求 d 是</text>
  <text x="334" y="132" font-size="10.5" fill="#333" filter="url(#rough2)">str2 的周期，冲突 → ""</text>
  <text x="326" y="150" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">· 自由位只填 'a' / 'b'</text>

  <!-- ===== 下半部：KMP 状态机 ===== -->
  <text x="70" y="188" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② KMP 状态机（以 str2 = "ab" 为例）：j = 已建前缀匹配 str2 前缀的长度</text>

  <ellipse cx="92" cy="252" rx="24" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="92" y="257" text-anchor="middle" font-size="13" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">0</text>

  <ellipse cx="222" cy="252" rx="24" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="222" y="257" text-anchor="middle" font-size="13" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">1</text>

  <ellipse cx="362" cy="252" rx="28" ry="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="362" y="250" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="362" y="263" text-anchor="middle" font-size="9" fill="#8a3a36" filter="url(#rough2)">= m</text>

  <!-- 状态转移 -->
  <path d="M 116 246 L 196 246" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="156" y="238" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">'a'</text>
  <path d="M 246 246 L 332 246" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="289" y="238" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">'b'</text>

  <!-- 自环 -->
  <path d="M 92 230 C 78 208, 110 206, 96 229" fill="none" stroke="#888" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="204" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">'b'→0</text>
  <path d="M 226 230 C 216 210, 240 208, 226 230" fill="none" stroke="#888" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="224" y="206" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">'a'→1</text>

  <!-- fail 回退边 -->
  <path d="M 346 272 C 300 306, 160 306, 100 274" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="228" y="312" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">fail 链回退续配</text>

  <!-- 禁态说明 -->
  <rect x="410" y="196" width="96" height="102" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="458" y="214" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">j = m ⟺</text>
  <text x="458" y="228" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">以 x 结尾的</text>
  <text x="458" y="242" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">整窗 == str2</text>
  <text x="458" y="260" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">F 端点 → 禁！</text>
  <text x="458" y="276" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">改试 'b'</text>
  <text x="458" y="290" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">（T 端点放行）</text>

  <!-- 底部注 -->
  <text x="260" y="342" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">贪心：先 'a'（不落禁态且后缀有救 ok[x+1][δ]），不行再 'b'</text>
</svg>
