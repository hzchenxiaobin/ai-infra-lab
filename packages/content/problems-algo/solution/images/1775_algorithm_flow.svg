<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：求和 → 算裕量 → 降序贪心补差</text>

  <!-- Step 1: compute sums -->
  <rect x="60" y="46" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="64" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① 求 S₁ = sum(nums1)</text>
  <text x="150" y="80" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">   S₂ = sum(nums2)</text>

  <path d="M 150 90 L 150 112" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: compare and swap -->
  <polygon points="150,116 250,156 150,196 50,156" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="150" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">S₁ &lt; S₂ ?</text>
  <text x="150" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">交换两数组</text>
  <text x="150" y="184" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">保证 S₁ ≥ S₂</text>

  <!-- diff -->
  <path d="M 150 196 L 150 218" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="90" y="222" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="244" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② diff = S₁ − S₂</text>

  <!-- diff == 0 branch -->
  <path d="M 210 238 L 320 238" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="232" font-size="10" fill="#4a7a3a" filter="url(#rough2)">diff==0</text>
  <rect x="320" y="222" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="365" y="244" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 0</text>

  <path d="M 150 254 L 150 276" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: collect gains -->
  <rect x="40" y="280" width="220" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="298" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ 收集裕量 gains</text>
  <text x="150" y="314" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">nums1: 每个数贡献 v−1</text>
  <text x="150" y="328" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">nums2: 每个数贡献 6−v</text>

  <path d="M 150 338 L 150 360" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: count gains by bucket -->
  <rect x="40" y="364" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="382" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">④ 按 gain=5..0 桶计数</text>
  <text x="150" y="398" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">cnt[g] = 裕量为 g 的元素数</text>

  <!-- right column: greedy loop -->
  <path d="M 260 386 L 320 386" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- greedy loop diamond -->
  <polygon points="420,336 540,386 420,436 300,386" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="380" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">从 g=5 到 0</text>
  <text x="420" y="396" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">diff &gt; 0 且 cnt[g]&gt;0</text>

  <!-- loop body -->
  <path d="M 420 332 L 420 308" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="330" y="270" width="180" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="288" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">need = ⌈diff / g⌉</text>
  <text x="420" y="302" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">take = min(need, cnt[g])</text>

  <path d="M 330 289 L 270 289 L 270 332" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="282" font-size="10" fill="#b85450" filter="url(#rough2)">ans += take</text>
  <text x="300" y="324" font-size="10" fill="#b85450" filter="url(#rough2)">diff -= take*g</text>

  <!-- exit -->
  <path d="M 420 436 L 420 448" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- final decision -->
  <polygon points="420,448 510,448 510,432" fill="none" stroke="none"/>
  <rect x="340" y="440" width="160" height="0" fill="none"/>

  <!-- footer note -->
  <text x="150" y="424" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">diff ≤ 0 → 返回 ans</text>
  <text x="420" y="456" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">遍历完 diff&gt;0 → 返回 −1</text>
</svg>
