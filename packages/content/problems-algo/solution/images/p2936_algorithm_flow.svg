<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：每轮吞掉一个块，循环次数 = 块数</text>

  <!-- 开始 -->
  <rect x="190" y="36" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="13" filter="url(#rough2)"/>
  <text x="260" y="55" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#rough2)">n = size()；i = 0；blocks = 0</text>

  <path d="M 260 64 L 260 82" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="260,84 352,116 260,148 168,116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="112" text-anchor="middle" font-size="11.5" fill="#8a6414" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>
  <text x="260" y="128" text-anchor="middle" font-size="10" fill="#8a6414" filter="url(#rough2)">（还有块吗）</text>

  <path d="M 352 116 L 384 116" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="368" y="106" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="388" y="102" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="13" filter="url(#rough2)"/>
  <text x="443" y="121" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 blocks</text>

  <path d="M 260 148 L 260 168" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="274" y="162" text-anchor="start" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- 读块首 -->
  <rect x="175" y="170" width="170" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="190" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#rough2)">v = at(i)；blocks += 1</text>

  <path d="M 260 200 L 260 218" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 二分块尾 -->
  <rect x="140" y="220" width="240" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="238" text-anchor="middle" font-size="11.5" fill="#8a6414" font-weight="bold" filter="url(#rough2)">二分 [i, n−1] 找块尾 last</text>
  <text x="260" y="256" text-anchor="middle" font-size="10.5" fill="#8a6414" font-family="'Comic Sans MS', monospace" filter="url(#rough2)">at(mid)==v ? lo=mid : hi=mid−1</text>

  <path d="M 260 266 L 260 284" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 跳跃 -->
  <rect x="175" y="286" width="170" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#rough2)">i = last + 1（跳到下一块）</text>

  <!-- 回环箭头 -->
  <path d="M 175 301 L 96 301 L 96 116 L 164 116" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 底部注释 -->
  <rect x="55" y="326" width="410" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="13" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">每块 1 次读值 + ≤⌈log₂n⌉ 次探测，总调用 O(B·log n)</text>
</svg>
