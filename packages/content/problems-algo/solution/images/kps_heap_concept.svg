<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：固定 i 看成一路有序对，n 路归并用小顶堆取前 k 小</text>

  <!-- nums2 horizontal label -->
  <text x="148" y="58" text-anchor="middle" font-size="11" fill="#888">nums2 →</text>
  <rect x="190" y="46" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="210" y="65" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="232" y="46" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="252" y="65" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="274" y="46" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="294" y="65" text-anchor="middle" font-size="12" fill="#333">6</text>

  <!-- nums1 vertical label -->
  <text x="50" y="148" text-anchor="middle" font-size="11" fill="#888">nums1</text>
  <text x="50" y="162" text-anchor="middle" font-size="11" fill="#888">↓</text>
  <rect x="76" y="86" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="96" y="107" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="76" y="120" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="96" y="141" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="76" y="154" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="96" y="175" text-anchor="middle" font-size="12" fill="#333">11</text>

  <!-- pair sums matrix 3x3 -->
  <text x="180" y="80" font-size="10" fill="#888">对之和 nums1[i]+nums2[j]：</text>
  <!-- row 0: 3,5,7 -->
  <rect x="190" y="86" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="107" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="232" y="86" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="252" y="107" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="274" y="86" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="294" y="107" text-anchor="middle" font-size="12" fill="#333">7</text>
  <!-- row 1: 9,11,13 -->
  <rect x="190" y="120" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="141" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <rect x="232" y="120" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="252" y="141" text-anchor="middle" font-size="12" fill="#333">11</text>
  <rect x="274" y="120" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="294" y="141" text-anchor="middle" font-size="12" fill="#333">13</text>
  <!-- row 2: 13,15,17 -->
  <rect x="190" y="154" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="175" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">13</text>
  <rect x="232" y="154" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="252" y="175" text-anchor="middle" font-size="12" fill="#333">15</text>
  <rect x="274" y="154" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="294" y="175" text-anchor="middle" font-size="12" fill="#333">17</text>

  <!-- highlight first column -->
  <text x="210" y="206" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">↑ 首列 = 每路最小 ↑</text>

  <!-- arrow matrix -> heap -->
  <path d="M 326 130 L 380 130" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="353" y="124" text-anchor="middle" font-size="10" fill="#446688">首列入堆</text>

  <!-- min-heap on right -->
  <text x="460" y="64" text-anchor="middle" font-size="12" fill="#888">小顶堆（每路一个候选）</text>
  <ellipse cx="460" cy="92" rx="26" ry="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="460" y="97" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <ellipse cx="418" cy="140" rx="24" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="418" y="145" text-anchor="middle" font-size="12" fill="#333">9</text>
  <ellipse cx="502" cy="140" rx="24" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="502" y="145" text-anchor="middle" font-size="12" fill="#333">13</text>
  <path d="M 448 106 L 428 126" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 472 106 L 492 126" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="460" y="172" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">堆顶 = 全局最小对</text>

  <!-- pop arrow -->
  <path d="M 460 180 L 460 206" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="472" y="198" font-size="10" fill="#b85450" font-weight="bold">弹出</text>

  <!-- step boxes -->
  <rect x="340" y="208" width="240" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="460" y="229" text-anchor="middle" font-size="12" fill="#333">① 弹出 (sum, i, j)，加入答案</text>

  <path d="M 460 246 L 460 264" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="340" y="266" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="460" y="287" text-anchor="middle" font-size="12" fill="#333">② 同路下一位 (i, j+1) 入堆</text>

  <path d="M 460 304 L 460 322" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="340" y="324" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="345" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 重复 k 次</text>

  <!-- loop back arrow -->
  <path d="M 340 341 L 326 341 L 326 225 L 340 225" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="302" y="288" font-size="10" fill="#b85450" font-weight="bold">循环</text>

  <!-- bottom note -->
  <rect x="40" y="368" width="500" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="290" y="385" text-anchor="middle" font-size="11" fill="#446688">每路只存一个代表 → 堆大小 ≤ min(k, n₁)；共弹 k 次 → O(k log min(k, n₁))</text>
</svg>
