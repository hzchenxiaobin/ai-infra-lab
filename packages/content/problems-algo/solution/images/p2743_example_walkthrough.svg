<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "abab"  →  答案 7</text>

  <!-- ====== Row 1: right=0, left=0, window="a" ====== -->
  <text x="34" y="76" font-size="11" fill="#888" font-weight="bold">right=0</text>
  <!-- cells: a b a b ; idx0 window(green), idx1-3 after right (light) -->
  <rect x="90" y="58" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="134" y="58" width="40" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="80" text-anchor="middle" font-size="13" fill="#bbb">b</text>
  <rect x="178" y="58" width="40" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="80" text-anchor="middle" font-size="13" fill="#bbb">a</text>
  <rect x="222" y="58" width="40" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="242" y="80" text-anchor="middle" font-size="13" fill="#bbb">b</text>
  <text x="290" y="76" font-size="12" fill="#4a7a3a" font-weight="bold">窗口 "a"</text>
  <text x="392" y="76" font-size="12" fill="#b85450" font-weight="bold">贡献 1</text>
  <text x="468" y="76" font-size="12" fill="#444" font-weight="bold">累计 1</text>

  <!-- ====== Row 2: right=1, left=0, window="ab" ====== -->
  <text x="34" y="138" font-size="11" fill="#888" font-weight="bold">right=1</text>
  <rect x="90" y="120" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="142" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="134" y="120" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="142" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="178" y="120" width="40" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="142" text-anchor="middle" font-size="13" fill="#bbb">a</text>
  <rect x="222" y="120" width="40" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="242" y="142" text-anchor="middle" font-size="13" fill="#bbb">b</text>
  <text x="290" y="138" font-size="12" fill="#4a7a3a" font-weight="bold">窗口 "ab"</text>
  <text x="392" y="138" font-size="12" fill="#b85450" font-weight="bold">贡献 2</text>
  <text x="468" y="138" font-size="12" fill="#444" font-weight="bold">累计 3</text>

  <!-- ====== Row 3: right=2, left=1, window="ba" ====== -->
  <text x="34" y="200" font-size="11" fill="#888" font-weight="bold">right=2</text>
  <rect x="90" y="182" width="40" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="204" text-anchor="middle" font-size="13" fill="#bbb">a</text>
  <rect x="134" y="182" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="204" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="178" y="182" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="204" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="222" y="182" width="40" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="242" y="204" text-anchor="middle" font-size="13" fill="#bbb">b</text>
  <text x="290" y="200" font-size="12" fill="#4a7a3a" font-weight="bold">窗口 "ba"</text>
  <text x="384" y="200" font-size="12" fill="#d6a040" font-weight="bold">'a'重复</text>
  <text x="392" y="216" font-size="12" fill="#b85450" font-weight="bold">贡献 2</text>
  <text x="468" y="200" font-size="12" fill="#444" font-weight="bold">累计 5</text>

  <!-- ====== Row 4: right=3, left=2, window="ab" ====== -->
  <text x="34" y="262" font-size="11" fill="#888" font-weight="bold">right=3</text>
  <rect x="90" y="244" width="40" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="266" text-anchor="middle" font-size="13" fill="#bbb">a</text>
  <rect x="134" y="244" width="40" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="266" text-anchor="middle" font-size="13" fill="#bbb">b</text>
  <rect x="178" y="244" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="266" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="222" y="244" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="266" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <text x="290" y="262" font-size="12" fill="#4a7a3a" font-weight="bold">窗口 "ab"</text>
  <text x="384" y="262" font-size="12" fill="#d6a040" font-weight="bold">'b'重复</text>
  <text x="392" y="278" font-size="12" fill="#b85450" font-weight="bold">贡献 2</text>
  <text x="468" y="262" font-size="12" fill="#444" font-weight="bold">累计 7</text>

  <!-- summary box -->
  <rect x="50" y="300" width="460" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">每步贡献 = right − left + 1，逐 right 累加得 1+2+2+2 = 7</text>
  <text x="280" y="342" text-anchor="middle" font-size="11" fill="#666">right=2 遇 'a' 重复 → left 跳到 1；right=3 遇 'b' 重复 → left 跳到 2</text>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#888">窗口始终无重复，故以 right 结尾的起点的每个取值都合法</text>
</svg>
