<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一趟从左到右，每字符 O(1) 定去留</text>

    <!-- start -->
    <rect x="195" y="38" width="230" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="15"/>
    <text x="310" y="57" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">开始：R ← 空，last[a..z] ← 未出现</text>
    <path d="M 310 68 V 84" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>

    <!-- fetch char -->
    <rect x="190" y="88" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="310" y="109" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">从左到右取下一个字符 c</text>
    <path d="M 310 122 V 148" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>

    <!-- diamond -->
    <polygon points="310,152 432,198 310,244 188,198" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="310" y="192" text-anchor="middle" font-size="10" fill="#7a5c1a" font-weight="bold">last[c] 存在 且</text>
    <text x="310" y="210" text-anchor="middle" font-size="11" fill="#7a5c1a" font-weight="bold">L − last[c] ≤ k ？</text>
    <text x="310" y="228" text-anchor="middle" font-size="8" fill="#a87020">（L = |R|，c 将落入的下标）</text>

    <!-- yes: discard -->
    <path d="M 188 198 H 184" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)"/>
    <text x="176" y="186" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">是（靠近）</text>
    <rect x="28" y="172" width="150" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="103" y="192" text-anchor="middle" font-size="10" fill="#8c3a36" font-weight="bold">丢弃 c</text>
    <text x="103" y="210" text-anchor="middle" font-size="9" fill="#8c3a36">（并入左侧出现，R、last 均不变）</text>

    <!-- no: append -->
    <path d="M 432 198 H 436" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)"/>
    <text x="444" y="186" text-anchor="start" font-size="10" fill="#4a7a3a" font-weight="bold">否（不靠近）</text>
    <rect x="442" y="172" width="150" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="517" y="192" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold">追加 c 到 R 末尾</text>
    <text x="517" y="210" text-anchor="middle" font-size="9" fill="#2f5d24">last[c] ← L（= |R| − 1）</text>

    <!-- loop backs -->
    <path d="M 103 172 V 62 H 240 V 84" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" stroke-dasharray="7,5"/>
    <path d="M 517 172 V 62 H 380 V 84" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" stroke-dasharray="7,5"/>

    <!-- exit -->
    <path d="M 190 105 H 70 V 360 H 189" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrY)" stroke-dasharray="4,5"/>
    <text x="130" y="98" text-anchor="middle" font-size="9" fill="#888">字符取尽则退出</text>

    <!-- end -->
    <rect x="195" y="344" width="230" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16"/>
    <text x="310" y="364" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">返回 R（题面过程的最终稳定串）</text>

    <!-- note box -->
    <rect x="40" y="262" width="380" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="230" y="280" text-anchor="middle" font-size="9.5" fill="#7a5c1a" font-weight="bold">每字符 O(1) 的两个依据</text>
    <text x="56" y="297" text-anchor="start" font-size="9" fill="#7a5c1a">• 靠近 ⟺ 与最近出现距离 ≤ k——最近不靠近 ⇒ 更早更不靠近，只查 last[c]</text>
    <text x="56" y="314" text-anchor="start" font-size="9" fill="#7a5c1a">• 靠近时删的是右端新字符：R 原样弹回稳定态，无需任何回溯/重扫</text>
  </g>
</svg>
