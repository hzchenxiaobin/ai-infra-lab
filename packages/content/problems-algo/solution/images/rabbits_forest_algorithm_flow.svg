<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：统计频次 → 按答案分组向上取整 → 累加每组兔子数</text>

  <!-- step 1 -->
  <rect x="40" y="46" width="460" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="68" font-size="12" fill="#446688" font-weight="bold">① 统计频次</text>
  <text x="56" y="86" font-size="11" fill="#333">用哈希表 cnt 统计 answers 中每个值 x 出现的次数 c</text>
  <text x="56" y="102" font-size="11" fill="#333">例：answers=[1,1,2] → cnt = { 1:2, 2:1 }</text>

  <!-- arrow -->
  <path d="M 270 116 L 270 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="40" y="138" width="460" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="160" font-size="12" fill="#d6a040" font-weight="bold">② 对每个答案 x 分组计数（核心）</text>
  <text x="56" y="178" font-size="11" fill="#333">对 cnt 中的每个 (x, c)：</text>
  <text x="72" y="196" font-size="11" fill="#333">组数 group = ⌈c / (x+1)⌉ = (c + x) / (x+1)   ← 整数向上取整</text>
  <text x="72" y="214" font-size="11" fill="#333">该答案贡献兔子 = group × (x+1)</text>

  <!-- arrow -->
  <path d="M 270 230 L 270 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="40" y="252" width="460" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="274" font-size="12" fill="#4a7a3a" font-weight="bold">③ 累加求和</text>
  <text x="56" y="292" font-size="11" fill="#333">ans = Σ group × (x+1)，遍历完所有不同 x 即返回 ans</text>

  <!-- arrow -->
  <path d="M 270 314 L 270 332" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 4 result -->
  <rect x="40" y="336" width="460" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="362" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">返回 ans（森林中兔子总数的最小值）</text>

  <!-- note -->
  <rect x="40" y="386" width="460" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="270" y="404" text-anchor="middle" font-size="10.5" fill="#888">关键：每组恰 x+1 只（含「答 x」者自己）；余数不足也按一整组算，因其同色伙伴尚未被询问</text>
</svg>
