<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三行数组：nums → conver → ans（示例 nums = [2,3,7,5,10]）</text>

  <!-- Row 1: nums -->
  <text x="70" y="66" text-anchor="end" font-size="12" fill="#888" filter="url(#rough2)">nums[i]</text>
  <rect x="80" y="44" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="68" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="160" y="44" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="68" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="240" y="44" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="320" y="44" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="68" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="400" y="44" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="68" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">10</text>

  <!-- index labels -->
  <text x="120" y="96" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">i=0</text>
  <text x="200" y="96" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">i=1</text>
  <text x="280" y="96" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">i=2</text>
  <text x="360" y="96" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">i=3</text>
  <text x="440" y="96" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">i=4</text>

  <!-- Arrow: nums -> conver -->
  <text x="60" y="130" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">conver[i] =</text>
  <text x="60" y="146" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">nums[i]+max</text>

  <!-- Row 2: conver -->
  <rect x="80" y="118" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="142" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="160" y="118" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="142" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="240" y="118" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="142" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">14</text>
  <rect x="320" y="118" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="142" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">12</text>
  <rect x="400" y="118" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="142" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">20</text>

  <!-- running max annotation -->
  <text x="120" y="170" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">max=2</text>
  <text x="200" y="170" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">max=3</text>
  <text x="280" y="170" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">max=7</text>
  <text x="360" y="170" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">max=7</text>
  <text x="440" y="170" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">max=10</text>

  <!-- Arrow: conver -> ans (prefix sum) -->
  <text x="60" y="206" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">ans[i] =</text>
  <text x="60" y="222" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">前缀和</text>

  <!-- Row 3: ans -->
  <rect x="80" y="192" width="80" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="216" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="160" y="192" width="80" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="216" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="240" y="192" width="80" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">24</text>
  <rect x="320" y="192" width="80" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="216" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">36</text>
  <rect x="400" y="192" width="80" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="216" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">56</text>

  <!-- Legend -->
  <rect x="80" y="260" width="400" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="282" font-size="12" fill="#333" filter="url(#rough2)"><tspan font-weight="bold" fill="#446688">蓝</tspan>：原数组 nums[i]，输入</text>

  <rect x="80" y="300" width="400" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="322" font-size="12" fill="#333" filter="url(#rough2)"><tspan font-weight="bold" fill="#4a7a3a">绿</tspan>：转换数组 conver[i] = nums[i] + max(nums[0..i])</text>

  <rect x="80" y="340" width="400" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="362" font-size="12" fill="#333" filter="url(#rough2)"><tspan font-weight="bold" fill="#d6a040">橙</tspan>：答案数组 ans[i] = sum(conver[0..i])，即 conver 的前缀和</text>
</svg>
