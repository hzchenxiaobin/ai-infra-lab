<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    算法流程：两次全员异或 + 一次与
  </text>

  <!-- ===== Step 1: XOR arr1 ===== -->
  <rect x="120" y="48" width="320" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    Step 1：遍历 arr1，累异或
  </text>
  <text x="280" y="86" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    x1 = arr1[0] ^ arr1[1] ^ ... ^ arr1[n-1]
  </text>

  <!-- arrow -->
  <line x1="280" y1="102" x2="280" y2="118" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: XOR arr2 ===== -->
  <rect x="120" y="122" width="320" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    Step 2：遍历 arr2，累异或
  </text>
  <text x="280" y="160" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    x2 = arr2[0] ^ arr2[1] ^ ... ^ arr2[m-1]
  </text>

  <!-- arrow -->
  <line x1="280" y1="176" x2="280" y2="192" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: AND ===== -->
  <rect x="120" y="196" width="320" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="12" fill="#5a4a1a" filter="url(#rough2)">
    Step 3：两结果按位与
  </text>
  <text x="280" y="234" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">
    return x1 &amp; x2
  </text>

  <!-- arrow -->
  <line x1="280" y1="250" x2="280" y2="266" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Result ===== -->
  <rect x="120" y="270" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="12" fill="#2a4a1a" filter="url(#rough2)">
    返回 x1 &amp; x2 = 所有数对 AND 的异或和
  </text>

  <!-- ===== Complexity note ===== -->
  <rect x="60" y="326" width="440" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">
    时间 O(n + m)，空间 O(1) —— 从暴力的 O(n·m) 降维
  </text>
</svg>
