<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 125 → 25 + 5 + 1 = 31 个末尾零</text>

  <!-- ===== 表格 ===== -->
  <!-- 表头 -->
  <rect x="40" y="46" width="520" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="80"  y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">轮次</text>
  <text x="160" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">n（进入）</text>
  <text x="250" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">n //= 5</text>
  <text x="330" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">ans +=</text>
  <text x="410" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">ans（累计）</text>
  <text x="510" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">对应项</text>

  <!-- Row 1 -->
  <rect x="40" y="78" width="520" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80"  y="100" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">1</text>
  <text x="160" y="100" text-anchor="middle" font-size="11.5" fill="#333">125</text>
  <text x="250" y="100" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">25</text>
  <text x="330" y="100" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">+25</text>
  <text x="410" y="100" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">25</text>
  <text x="510" y="100" text-anchor="middle" font-size="10.5" fill="#888">⌊125/5⌋</text>

  <!-- Row 2 -->
  <rect x="40" y="114" width="520" height="34" fill="#f6f8fb" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80"  y="136" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2</text>
  <text x="160" y="136" text-anchor="middle" font-size="11.5" fill="#333">25</text>
  <text x="250" y="136" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="330" y="136" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">+5</text>
  <text x="410" y="136" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">30</text>
  <text x="510" y="136" text-anchor="middle" font-size="10.5" fill="#888">⌊125/25⌋</text>

  <!-- Row 3 -->
  <rect x="40" y="150" width="520" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80"  y="172" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>
  <text x="160" y="172" text-anchor="middle" font-size="11.5" fill="#333">5</text>
  <text x="250" y="172" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="330" y="172" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">+1</text>
  <text x="410" y="172" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">31</text>
  <text x="510" y="172" text-anchor="middle" font-size="10.5" fill="#888">⌊125/125⌋</text>

  <!-- Row 4 (终止) -->
  <rect x="40" y="186" width="520" height="34" fill="#f6f8fb" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80"  y="208" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">4</text>
  <text x="160" y="208" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="250" y="208" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">0</text>
  <text x="330" y="208" text-anchor="middle" font-size="11.5" fill="#b85450">+0</text>
  <text x="410" y="208" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">31</text>
  <text x="510" y="208" text-anchor="middle" font-size="10.5" fill="#b85450">⌊125/625⌋ 终止</text>

  <!-- 结果 -->
  <path d="M 300 222 L 300 240" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180" y="242" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="264" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">return 31  ✓</text>

  <!-- ===== 下方：每一层「额外的 5」可视化 ===== -->
  <text x="300" y="306" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">每一层补上「额外的 5 因子」</text>

  <!-- 第1层：5 的倍数 -->
  <text x="48" y="332" font-size="11" fill="#4a7a3a" font-weight="bold">第 1 层</text>
  <g filter="url(#rough2)">
    <rect x="110" y="320" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="125" y="336" text-anchor="middle" font-size="10" fill="#333">5</text>
    <rect x="144" y="320" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="159" y="336" text-anchor="middle" font-size="10" fill="#333">10</text>
    <text x="190" y="336" font-size="13" fill="#bbb">···</text>
    <rect x="214" y="320" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="229" y="336" text-anchor="middle" font-size="10" fill="#333">125</text>
  </g>
  <text x="266" y="336" font-size="11" fill="#4a7a3a" font-weight="bold">25 个 → 各贡献「第 1 个 5」</text>

  <!-- 第2层：25 的倍数 -->
  <text x="48" y="372" font-size="11" fill="#d6a040" font-weight="bold">第 2 层</text>
  <g filter="url(#rough2)">
    <rect x="110" y="360" width="30" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <text x="125" y="376" text-anchor="middle" font-size="10" fill="#333">25</text>
    <rect x="144" y="360" width="30" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <text x="159" y="376" text-anchor="middle" font-size="10" fill="#333">50</text>
    <text x="190" y="376" font-size="13" fill="#bbb">···</text>
    <rect x="214" y="360" width="30" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <text x="229" y="376" text-anchor="middle" font-size="10" fill="#333">125</text>
  </g>
  <text x="266" y="376" font-size="11" fill="#d6a040" font-weight="bold">5 个 → 各贡献「第 2 个 5」</text>

  <!-- 第3层：125 的倍数 -->
  <text x="48" y="412" font-size="11" fill="#b85450" font-weight="bold">第 3 层</text>
  <g filter="url(#rough2)">
    <rect x="110" y="400" width="30" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
    <text x="125" y="416" text-anchor="middle" font-size="10" fill="#333">125</text>
  </g>
  <text x="160" y="416" font-size="11" fill="#b85450" font-weight="bold">1 个 → 贡献「第 3 个 5」</text>
  <text x="300" y="416" font-size="11.5" fill="#333" font-weight="bold">合计 25 + 5 + 1 = 31</text>
</svg>
