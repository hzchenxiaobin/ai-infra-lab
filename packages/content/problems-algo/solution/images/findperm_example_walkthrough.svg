<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 620" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="620" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "DDIIDI" → [3,2,1,5,4,6,7]</text>
  <text x="290" y="44" text-anchor="middle" font-size="10.5" fill="#888">n = 7，逐字符扫描，val 从 1 递增，遇 I 弹栈</text>

  <!-- column headers -->
  <text x="40" y="74" font-size="10.5" fill="#888" font-weight="bold">步骤</text>
  <text x="90" y="74" font-size="10.5" fill="#888" font-weight="bold">i</text>
  <text x="130" y="74" font-size="10.5" fill="#888" font-weight="bold">s[i]</text>
  <text x="180" y="74" font-size="10.5" fill="#888" font-weight="bold">压栈 val</text>
  <text x="290" y="74" font-size="10.5" fill="#888" font-weight="bold">动作</text>
  <text x="440" y="74" font-size="10.5" fill="#888" font-weight="bold">stack(底→顶)</text>
  <text x="560" y="74" font-size="10.5" fill="#888" font-weight="bold">res</text>

  <!-- header divider -->
  <line x1="20" y1="82" x2="570" y2="82" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- ===== Step 0: init ===== -->
  <text x="40" y="104" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="90" y="104" font-size="11" fill="#999">—</text>
  <text x="130" y="104" font-size="11" fill="#999">—</text>
  <text x="180" y="104" font-size="11" fill="#999">—</text>
  <text x="290" y="104" font-size="11" fill="#446688">初始化</text>
  <text x="440" y="104" font-size="11" fill="#999">[]</text>
  <text x="560" y="104" font-size="11" fill="#999" text-anchor="end">[]</text>
  <line x1="20" y1="112" x2="570" y2="112" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Step 1: i=0, s[0]=D, push 1 ===== -->
  <text x="40" y="132" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="90" y="132" font-size="11" fill="#333">0</text>
  <rect x="120" y="118" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="131" y="134" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">D</text>
  <rect x="170" y="118" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="181" y="134" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="290" y="132" font-size="11" fill="#b85450">压栈，不弹</text>
  <text x="440" y="132" font-size="11" fill="#b85450" font-weight="bold">[1]</text>
  <text x="560" y="132" font-size="11" fill="#999" text-anchor="end">[]</text>
  <line x1="20" y1="142" x2="570" y2="142" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Step 2: i=1, s[1]=D, push 2 ===== -->
  <text x="40" y="162" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="90" y="162" font-size="11" fill="#333">1</text>
  <rect x="120" y="148" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="131" y="164" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">D</text>
  <rect x="170" y="148" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="181" y="164" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="290" y="162" font-size="11" fill="#b85450">压栈，不弹</text>
  <text x="440" y="162" font-size="11" fill="#b85450" font-weight="bold">[1, 2]</text>
  <text x="560" y="162" font-size="11" fill="#999" text-anchor="end">[]</text>
  <line x1="20" y1="172" x2="570" y2="172" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Step 3: i=2, s[2]=I, push 3 then pop all ===== -->
  <text x="40" y="192" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="90" y="192" font-size="11" fill="#333">2</text>
  <rect x="120" y="178" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="131" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">I</text>
  <rect x="170" y="178" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="181" y="194" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <text x="290" y="192" font-size="11" fill="#4a7a3a">压 3，弹全部</text>
  <text x="440" y="192" font-size="11" fill="#999">[]</text>
  <text x="560" y="192" font-size="11" fill="#b85450" font-weight="bold" text-anchor="end">[3,2,1]</text>
  <line x1="20" y1="202" x2="570" y2="202" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Step 4: i=3, s[3]=D, push 4 ===== -->
  <text x="40" y="222" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="90" y="222" font-size="11" fill="#333">3</text>
  <rect x="120" y="208" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="131" y="224" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">D</text>
  <rect x="170" y="208" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="181" y="224" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <text x="290" y="222" font-size="11" fill="#b85450">压栈，不弹</text>
  <text x="440" y="222" font-size="11" fill="#b85450" font-weight="bold">[4]</text>
  <text x="560" y="222" font-size="11" fill="#999" text-anchor="end">[3,2,1]</text>
  <line x1="20" y1="232" x2="570" y2="232" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Step 5: i=4, s[4]=I, push 5 then pop all ===== -->
  <text x="40" y="252" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="90" y="252" font-size="11" fill="#333">4</text>
  <rect x="120" y="238" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="131" y="254" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">I</text>
  <rect x="170" y="238" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="181" y="254" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5</text>
  <text x="290" y="252" font-size="11" fill="#4a7a3a">压 5，弹全部</text>
  <text x="440" y="252" font-size="11" fill="#999">[]</text>
  <text x="560" y="252" font-size="11" fill="#b85450" font-weight="bold" text-anchor="end">[…,5,4]</text>
  <line x1="20" y1="262" x2="570" y2="262" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Step 6: i=5, s[5]=I, push 6 then pop all ===== -->
  <text x="40" y="282" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="90" y="282" font-size="11" fill="#333">5</text>
  <rect x="120" y="268" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="131" y="284" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">I</text>
  <rect x="170" y="268" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="181" y="284" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">6</text>
  <text x="290" y="282" font-size="11" fill="#4a7a3a">压 6，弹全部</text>
  <text x="440" y="282" font-size="11" fill="#999">[]</text>
  <text x="560" y="282" font-size="11" fill="#b85450" font-weight="bold" text-anchor="end">[…,6]</text>
  <line x1="20" y1="292" x2="570" y2="292" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Step 7: i=6 (end), push 7 then pop all ===== -->
  <text x="40" y="312" font-size="11" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="90" y="312" font-size="11" fill="#333">6</text>
  <rect x="120" y="298" width="22" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="131" y="314" text-anchor="middle" font-size="10" fill="#999">末</text>
  <rect x="170" y="298" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="181" y="314" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">7</text>
  <text x="290" y="312" font-size="11" fill="#4a7a3a">压 7，弹全部</text>
  <text x="440" y="312" font-size="11" fill="#999">[]</text>
  <text x="560" y="312" font-size="11" fill="#b85450" font-weight="bold" text-anchor="end">[…,7]</text>

  <!-- divider -->
  <line x1="20" y1="330" x2="570" y2="330" stroke="#ddd" stroke-width="1.4" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Final result row ===== -->
  <text x="40" y="358" font-size="11" fill="#d6a040" font-weight="bold">结果</text>
  <text x="200" y="358" font-size="11" fill="#555">res =</text>

  <rect x="250" y="342" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="267" y="362" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <rect x="288" y="342" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="305" y="362" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <rect x="326" y="342" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="343" y="362" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="364" y="342" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="381" y="362" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">5</text>
  <rect x="402" y="342" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="419" y="362" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>
  <rect x="440" y="342" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="457" y="362" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">6</text>
  <rect x="478" y="342" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="495" y="362" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">7</text>

  <!-- ===== Verification ===== -->
  <rect x="30" y="392" width="520" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="50" y="414" font-size="11.5" fill="#d6a040" font-weight="bold">验证签名：</text>
  <text x="50" y="436" font-size="11" fill="#555">3 &gt; 2 &gt; 1 &lt; 5 &gt; 4 &lt; 6 &lt; 7</text>
  <text x="50" y="454" font-size="11" fill="#555">D    D    I    D    I    I</text>
  <text x="50" y="476" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 完全匹配 s = "DDIIDI"</text>

  <!-- ===== Legend ===== -->
  <rect x="30" y="508" width="520" height="92" fill="#f6f6f6" stroke="#ddd" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="50" y="530" font-size="11" fill="#888" font-weight="bold">图例</text>

  <rect x="50" y="540" width="20" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="80" y="554" font-size="10.5" fill="#555">D 段元素（被翻转，递减输出）</text>

  <rect x="50" y="566" width="20" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="80" y="580" font-size="10.5" fill="#555">I 位置元素（直接弹出，递增不变）</text>

  <rect x="300" y="540" width="20" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="330" y="554" font-size="10.5" fill="#555">当前压入的 val</text>

  <rect x="300" y="566" width="20" height="18" fill="#f6f6f6" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="330" y="580" font-size="10.5" fill="#555">字符串末尾（i = n）</text>
</svg>
