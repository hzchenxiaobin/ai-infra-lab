<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：target = [1,2,3,2,1]，3 次操作</text>

  <text x="102" y="95" text-anchor="end" font-size="9" fill="#aaa">h3</text>
  <text x="102" y="129" text-anchor="end" font-size="9" fill="#aaa">h2</text>
  <text x="102" y="163" text-anchor="end" font-size="9" fill="#aaa">h1</text>

  <rect x="214" y="80" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="240" y="101" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">新开</text>

  <rect x="162" y="114" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="188" y="135" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">新开</text>
  <rect x="214" y="114" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="266" y="114" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <rect x="110" y="148" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="136" y="169" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">新开</text>
  <rect x="162" y="148" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="214" y="148" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="266" y="148" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="318" y="148" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <path d="M 110 182 L 110 148 L 162 148 L 162 114 L 214 114 L 214 80 L 266 80 L 266 114 L 318 114 L 318 148 L 370 148 L 370 182" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>

  <text x="136" y="200" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">pos0</text>
  <text x="188" y="200" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">pos1</text>
  <text x="240" y="200" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">pos2</text>
  <text x="292" y="200" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">pos3</text>
  <text x="344" y="200" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">pos4</text>

  <text x="136" y="216" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="188" y="216" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="240" y="216" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="292" y="216" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="344" y="216" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <text x="60" y="244" font-size="11" fill="#555" font-weight="bold">3 次操作对应的子数组：</text>

  <rect x="100" y="252" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="130" y="267" font-size="11" fill="#333">操作1：[0,4] +1</text>
  <text x="250" y="267" font-size="10" fill="#888">target[0]-0 = 1 个新条带</text>

  <rect x="100" y="280" width="20" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="130" y="295" font-size="11" fill="#333">操作2：[1,3] +1</text>
  <text x="250" y="295" font-size="10" fill="#888">target[1]-target[0] = 1 个新条带</text>

  <rect x="100" y="308" width="20" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="130" y="323" font-size="11" fill="#333">操作3：[2,2] +1</text>
  <text x="250" y="323" font-size="10" fill="#888">target[2]-target[1] = 1 个新条带</text>

  <rect x="100" y="340" width="400" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="361" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans = 1 + 1 + 1 + 0 + 0 = 3</text>
  <text x="300" y="379" text-anchor="middle" font-size="10" fill="#555">target[0] + max(0,2-1) + max(0,3-2) + max(0,2-3) + max(0,1-2)</text>
</svg>
