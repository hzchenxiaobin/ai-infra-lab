<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="380" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：GROUP BY(date_id, make_name) + COUNT(DISTINCT) 去重计数</text>

  <!-- ===== Left: DailySales 原表（含重复行） ===== -->
  <text x="130" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">DailySales（含重复行）</text>

  <!-- header -->
  <rect x="20" y="66" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="55" y="81" text-anchor="middle" font-size="8.5" fill="#333" font-weight="bold">date_id</text>
  <rect x="90" y="66" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="120" y="81" text-anchor="middle" font-size="8.5" fill="#333" font-weight="bold">make</text>
  <rect x="150" y="66" width="45" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="172" y="81" text-anchor="middle" font-size="8.5" fill="#333" font-weight="bold">lead</text>
  <rect x="195" y="66" width="55" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="222" y="81" text-anchor="middle" font-size="8.5" fill="#333" font-weight="bold">partner</text>

  <!-- data rows (10 rows) -->
  <!-- toyota 12-8 group (blue highlight) -->
  <rect x="20" y="88" width="70" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="100" text-anchor="middle" font-size="8" fill="#446688">12-8</text>
  <rect x="90" y="88" width="60" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="120" y="100" text-anchor="middle" font-size="8" fill="#446688">toyota</text>
  <rect x="150" y="88" width="45" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="172" y="100" text-anchor="middle" font-size="8" fill="#333">0</text>
  <rect x="195" y="88" width="55" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="222" y="100" text-anchor="middle" font-size="8" fill="#333">1</text>

  <rect x="20" y="106" width="70" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="118" text-anchor="middle" font-size="8" fill="#446688">12-8</text>
  <rect x="90" y="106" width="60" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="120" y="118" text-anchor="middle" font-size="8" fill="#446688">toyota</text>
  <rect x="150" y="106" width="45" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="172" y="118" text-anchor="middle" font-size="8" fill="#333">1</text>
  <rect x="195" y="106" width="55" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="222" y="118" text-anchor="middle" font-size="8" fill="#333">0</text>

  <rect x="20" y="124" width="70" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="136" text-anchor="middle" font-size="8" fill="#446688">12-8</text>
  <rect x="90" y="124" width="60" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="120" y="136" text-anchor="middle" font-size="8" fill="#446688">toyota</text>
  <rect x="150" y="124" width="45" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="172" y="136" text-anchor="middle" font-size="8" fill="#333">1</text>
  <rect x="195" y="124" width="55" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="222" y="136" text-anchor="middle" font-size="8" fill="#333">2</text>

  <!-- "..." indicator -->
  <text x="120" y="156" text-anchor="middle" font-size="9" fill="#888">⋮（共 10 行）</text>

  <!-- ===== Arrow: GROUP BY ===== -->
  <rect x="270" y="100" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="320" y="119" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">GROUP BY</text>
  <path d="M255 114 L268 114" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Right: 4 groups → output ===== -->
  <text x="500" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">按 (date_id, make_name) 分组去重计数</text>

  <!-- group 1: 12-8 toyota -->
  <rect x="390" y="66" width="250" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="405" y="82" font-size="9" fill="#446688" font-weight="bold">12-8 toyota</text>
  <text x="405" y="95" font-size="8" fill="#888">leads={0,1}→2  partners={0,1,2}→3</text>

  <!-- group 2: 12-7 toyota -->
  <rect x="390" y="104" width="250" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="405" y="120" font-size="9" fill="#4a7a3a" font-weight="bold">12-7 toyota</text>
  <text x="405" y="133" font-size="8" fill="#888">leads={0}→1  partners={1,2}→2</text>

  <!-- group 3: 12-8 honda -->
  <rect x="390" y="142" width="250" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="405" y="158" font-size="9" fill="#d6a040" font-weight="bold">12-8 honda</text>
  <text x="405" y="171" font-size="8" fill="#888">leads={1,2}→2  partners={1,2}→2</text>

  <!-- group 4: 12-7 honda -->
  <rect x="390" y="180" width="250" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="405" y="196" font-size="9" fill="#b85450" font-weight="bold">12-7 honda</text>
  <text x="405" y="209" font-size="8" fill="#888">leads={0,1,2}→3  partners={1,2}→2</text>

  <!-- ===== Bottom: key insight box ===== -->
  <rect x="30" y="250" width="600" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="50" y="272" font-size="11" fill="#333" font-weight="bold">关键洞察</text>

  <!-- point 1 -->
  <rect x="50" y="282" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="58" y="293" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">1</text>
  <text x="72" y="293" font-size="10" fill="#333">表无主键 → 同一 (date, make) 下 lead_id / partner_id 可重复出现</text>

  <!-- point 2 -->
  <rect x="50" y="304" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="58" y="315" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="72" y="315" font-size="10" fill="#333">GROUP BY date_id, make_name → 按"日期+品牌"二维折叠成 4 组</text>

  <!-- point 3 -->
  <rect x="50" y="326" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="58" y="337" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">3</text>
  <text x="72" y="337" font-size="10" fill="#333">COUNT(DISTINCT lead_id) / COUNT(DISTINCT partner_id) 组内去重计数</text>

  <!-- point 4 -->
  <rect x="50" y="348" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="58" y="359" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">4</text>
  <text x="72" y="359" font-size="10" fill="#333">⚠ COUNT(*) 会把重复行也计入，必须用 COUNT(DISTINCT) 才是"不同 lead 数"</text>
</svg>
