<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：左右双指针夹逼，只换元音不动辅音</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">元音 = {a, e, i, o, u, A, E, I, O, U}，其余字符原地不动</text>

  <!-- ===== 字符串格子 ===== -->
  <text x="60" y="86" font-size="12" fill="#444" font-weight="bold">s = "leetcode"</text>
  <g font-size="14">
    <!-- 9 个格子 l e e t c o d e -->
    <rect x="60" y="94" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="82" y="120" text-anchor="middle" fill="#333" font-weight="bold">l</text>

    <rect x="108" y="94" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="130" y="120" text-anchor="middle" fill="#b85450" font-weight="bold">e</text>

    <rect x="156" y="94" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="178" y="120" text-anchor="middle" fill="#b85450" font-weight="bold">e</text>

    <rect x="204" y="94" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="226" y="120" text-anchor="middle" fill="#333" font-weight="bold">t</text>

    <rect x="252" y="94" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="274" y="120" text-anchor="middle" fill="#333" font-weight="bold">c</text>

    <rect x="300" y="94" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="322" y="120" text-anchor="middle" fill="#b85450" font-weight="bold">o</text>

    <rect x="348" y="94" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="370" y="120" text-anchor="middle" fill="#333" font-weight="bold">d</text>

    <rect x="396" y="94" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="418" y="120" text-anchor="middle" fill="#b85450" font-weight="bold">e</text>
  </g>

  <!-- ===== left / right 指针 ===== -->
  <text x="130" y="80" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">left ↓</text>
  <text x="418" y="80" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">↓ right</text>

  <!-- 指针箭头 -->
  <line x1="130" y1="82" x2="130" y2="90" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <line x1="418" y1="82" x2="418" y2="90" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- ===== 说明：颜色含义 ===== -->
  <text x="60" y="158" font-size="12" fill="#444" font-weight="bold">颜色含义：</text>
  <rect x="60" y="166" width="20" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="88" y="181" font-size="11" fill="#333">元音（待交换的目标）</text>
  <rect x="220" y="166" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="248" y="181" font-size="11" fill="#333">辅音 / 其它（跳过不动）</text>

  <!-- ===== 双指针运动规则 ===== -->
  <text x="60" y="216" font-size="12" fill="#444" font-weight="bold">双指针运动规则：</text>
  <rect x="60" y="224" width="440" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="74" y="243" font-size="11" fill="#333"><tspan font-weight="bold" fill="#4a7a3a">left</tspan> 从左向右扫，遇到非元音就 ++，停在第一个元音上</text>

  <rect x="60" y="256" width="440" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="74" y="275" font-size="11" fill="#333"><tspan font-weight="bold" fill="#d6a040">right</tspan> 从右向左扫，遇到非元音就 --，停在第一个元音上</text>

  <rect x="60" y="288" width="440" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="74" y="307" font-size="11" fill="#333">两指针都停在元音上 → <tspan font-weight="bold" fill="#b85450">swap(s[left], s[right])</tspan>，然后 left++ / right--</text>

  <!-- ===== 关键 ===== -->
  <rect x="50" y="328" width="460" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="64" y="348" font-size="11" fill="#4a7a3a" font-weight="bold">关键观察：</text>
  <text x="64" y="364" font-size="10" fill="#555">辅音位置天然不变，只需把两侧元音按「外↔内」配对交换 → 等价于反转元音子序列</text>
</svg>
