<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：单趟扫描 + 计数器</text>

  <!-- Start -->
  <ellipse cx="260" cy="58" rx="40" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">开始</text>

  <path d="M 260 76 L 260 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init box -->
  <rect x="180" y="94" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="115" text-anchor="middle" font-size="12" fill="#333">depth = 0, ans = 0</text>

  <path d="M 260 128 L 260 146" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: more chars? -->
  <polygon points="260,148 360,188 260,228 160,188" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="184" text-anchor="middle" font-size="12" fill="#333">还有字符?</text>
  <text x="260" y="200" text-anchor="middle" font-size="10" fill="#888">(遍历 s)</text>

  <!-- No branch -> return -->
  <path d="M 360 188 L 410 188 L 410 250" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="180" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="350" y="252" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="273" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 ans</text>

  <!-- Yes branch -> char type decision -->
  <path d="M 160 188 L 110 188 L 110 250" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="148" y="180" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Decision: char == '(' ? -->
  <polygon points="110,252 190,288 110,324 30,288" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="285" text-anchor="middle" font-size="11" fill="#333">c == ‘(’ ?</text>
  <text x="110" y="300" text-anchor="middle" font-size="10" fill="#888">左括号</text>

  <!-- '(' yes -->
  <path d="M 190 288 L 240 288 L 240 318" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="280" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="170" y="320" width="140" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="338" text-anchor="middle" font-size="11" fill="#333">depth++</text>
  <text x="240" y="354" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans = max(ans, depth)</text>

  <!-- '(' no -> ')' decision -->
  <path d="M 30 288 L 30 330" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="312" font-size="11" fill="#999" font-weight="bold">否</text>
  <polygon points="30,332 100,364 30,396 -40,364" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="30" y="362" text-anchor="middle" font-size="11" fill="#333">c == ‘)’ ?</text>

  <!-- ')' yes -->
  <path d="M 100 364 L 170 364 L 170 372" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="358" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="120" y="374" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="393" text-anchor="middle" font-size="12" fill="#333">depth--</text>

  <!-- ')' no -> skip -->
  <path d="M 30 396 L 30 408" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="402" font-size="11" fill="#999" font-weight="bold">否</text>
  <rect x="-20" y="410" width="100" height="26" fill="#f5f5f5" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="30" y="427" text-anchor="middle" font-size="11" fill="#888">跳过(数字/运算符)</text>

  <!-- Loop back arrow from all three branches to top decision -->
  <!-- right branch (depth++ box) back up -->
  <path d="M 310 342 L 360 342 L 360 188" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="366" y="268" font-size="9" fill="#4a7a3a">循环</text>
  <!-- The depth-- and skip branches also feed into the same loopback via merging -->
  <path d="M 220 404 L 360 404 L 360 342" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <path d="M 80 423 L 360 423 L 360 404" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <!-- Legend -->
  <rect x="350" y="320" width="150" height="58" fill="#fff" stroke="#eee" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="358" y="336" font-size="10" fill="#888" font-weight="bold">图例</text>
  <rect x="358" y="342" width="14" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="378" y="351" font-size="10" fill="#555">处理动作</text>
  <polygon points="365,358 379,358 372,368" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="378" y="368" font-size="10" fill="#555">判定分支</text>
</svg>
