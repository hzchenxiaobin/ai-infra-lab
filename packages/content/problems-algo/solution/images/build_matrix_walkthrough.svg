<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：k=3, row=[[1,2],[3,2]], col=[[2,1],[3,2]]</text>

  <!-- ===== Left: row Kahn trace ===== -->
  <text x="120" y="50" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">行图 Kahn（边 1→2, 3→2）</text>
  <g filter="url(#rough2)">
    <!-- header -->
    <rect x="24" y="58" width="200" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="44" y="73" text-anchor="middle" font-size="10" fill="#333">步</text>
    <text x="96" y="73" text-anchor="middle" font-size="10" fill="#333">出队</text>
    <text x="160" y="73" text-anchor="middle" font-size="10" fill="#333">队列/入度</text>
    <!-- rows -->
    <rect x="24" y="80" width="200" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="44" y="95" text-anchor="middle" font-size="10" fill="#333">0</text>
    <text x="96" y="95" text-anchor="middle" font-size="10" fill="#888">—</text>
    <text x="160" y="95" text-anchor="middle" font-size="10" fill="#333">Q=[1,3]</text>

    <rect x="24" y="102" width="200" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <text x="44" y="117" text-anchor="middle" font-size="10" fill="#333">1</text>
    <text x="96" y="117" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
    <text x="160" y="117" text-anchor="middle" font-size="10" fill="#333">rowPos[1]=0; Q=[3]</text>

    <rect x="24" y="124" width="200" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <text x="44" y="139" text-anchor="middle" font-size="10" fill="#333">2</text>
    <text x="96" y="139" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
    <text x="160" y="139" text-anchor="middle" font-size="10" fill="#333">rowPos[3]=1; Q=[2]</text>

    <rect x="24" y="146" width="200" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <text x="44" y="161" text-anchor="middle" font-size="10" fill="#333">3</text>
    <text x="96" y="161" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
    <text x="160" y="161" text-anchor="middle" font-size="10" fill="#333">rowPos[2]=2; Q=[]</text>
  </g>
  <text x="120" y="186" text-anchor="middle" font-size="11" fill="#4a7a3a">行序 = [1, 3, 2]</text>

  <!-- ===== Right: col Kahn trace ===== -->
  <text x="440" y="50" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">列图 Kahn（边 3→2, 2→1）</text>
  <g filter="url(#rough2)">
    <rect x="336" y="58" width="200" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="356" y="73" text-anchor="middle" font-size="10" fill="#333">步</text>
    <text x="408" y="73" text-anchor="middle" font-size="10" fill="#333">出队</text>
    <text x="472" y="73" text-anchor="middle" font-size="10" fill="#333">队列</text>

    <rect x="336" y="80" width="200" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="356" y="95" text-anchor="middle" font-size="10" fill="#333">0</text>
    <text x="408" y="95" text-anchor="middle" font-size="10" fill="#888">—</text>
    <text x="472" y="95" text-anchor="middle" font-size="10" fill="#333">Q=[3]</text>

    <rect x="336" y="102" width="200" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <text x="356" y="117" text-anchor="middle" font-size="10" fill="#333">1</text>
    <text x="408" y="117" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
    <text x="472" y="117" text-anchor="middle" font-size="10" fill="#333">colPos[3]=0; Q=[2]</text>

    <rect x="336" y="124" width="200" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <text x="356" y="139" text-anchor="middle" font-size="10" fill="#333">2</text>
    <text x="408" y="139" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
    <text x="472" y="139" text-anchor="middle" font-size="10" fill="#333">colPos[2]=1; Q=[1]</text>

    <rect x="336" y="146" width="200" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <text x="356" y="161" text-anchor="middle" font-size="10" fill="#333">3</text>
    <text x="408" y="161" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
    <text x="472" y="161" text-anchor="middle" font-size="10" fill="#333">colPos[1]=2; Q=[]</text>
  </g>
  <text x="440" y="186" text-anchor="middle" font-size="11" fill="#d6a040">列序 = [3, 2, 1]</text>

  <!-- arrow down to matrix -->
  <path d="M 280 196 L 280 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="210" text-anchor="middle" font-size="10" fill="#666">按 (rowPos[n], colPos[n]) 放置 n</text>

  <!-- ===== Final matrix ===== -->
  <g filter="url(#rough2)">
    <!-- row labels -->
    <text x="200" y="247" text-anchor="middle" font-size="10" fill="#446688">行0</text>
    <text x="200" y="279" text-anchor="middle" font-size="10" fill="#446688">行1</text>
    <text x="200" y="311" text-anchor="middle" font-size="10" fill="#446688">行2</text>
    <!-- col labels -->
    <text x="240" y="222" text-anchor="middle" font-size="10" fill="#d6a040">列0</text>
    <text x="290" y="222" text-anchor="middle" font-size="10" fill="#d6a040">列1</text>
    <text x="340" y="222" text-anchor="middle" font-size="10" fill="#d6a040">列2</text>

    <!-- row0: 0 0 1 -->
    <rect x="220" y="230" width="40" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <text x="240" y="251" text-anchor="middle" font-size="12" fill="#ccc">0</text>
    <rect x="260" y="230" width="40" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <text x="280" y="251" text-anchor="middle" font-size="12" fill="#ccc">0</text>
    <rect x="300" y="230" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="320" y="251" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>

    <!-- row1: 3 0 0 -->
    <rect x="220" y="262" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="240" y="283" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">3</text>
    <rect x="260" y="262" width="40" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <text x="280" y="283" text-anchor="middle" font-size="12" fill="#ccc">0</text>
    <rect x="300" y="262" width="40" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <text x="320" y="283" text-anchor="middle" font-size="12" fill="#ccc">0</text>

    <!-- row2: 0 2 0 -->
    <rect x="220" y="294" width="40" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <text x="240" y="315" text-anchor="middle" font-size="12" fill="#ccc">0</text>
    <rect x="260" y="294" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="280" y="315" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>
    <rect x="300" y="294" width="40" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <text x="320" y="315" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  </g>

  <!-- note -->
  <rect x="40" y="344" width="480" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="11" fill="#444">本例输出 [[0,0,1],[3,0,0],[0,2,0]] 是合法答案之一</text>
  <text x="280" y="378" text-anchor="middle" font-size="11" fill="#666">题面示例 [[3,0,0],[0,0,1],[0,2,0]] 也合法：1 与 3 无相对约束，拓扑序不唯一</text>
</svg>
