<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：解析两串 → 公式计算 → 拼串返回</text>

  <!-- Start node -->
  <ellipse cx="260" cy="62" rx="140" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="12" fill="#333">开始: 读入 num1, num2</text>

  <path d="M 260 82 L 260 98" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: find '+' in both -->
  <rect x="90" y="102" width="340" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="120" text-anchor="middle" font-size="11.5" fill="#333">p1 = num1.find('+')  ;  p2 = num2.find('+')</text>
  <text x="260" y="136" text-anchor="middle" font-size="10.5" fill="#888">（格式保证唯一 '+' 分隔实虚部）</text>

  <path d="M 260 146 L 260 162" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: parse a,b,c,d -->
  <rect x="60" y="166" width="400" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="184" text-anchor="middle" font-size="11.5" fill="#333">a = stoi(num1[0:p1])      b = stoi(num1[p1+1:end-1])</text>
  <text x="260" y="200" text-anchor="middle" font-size="11.5" fill="#333">c = stoi(num2[0:p2])      d = stoi(num2[p2+1:end-1])</text>
  <text x="260" y="216" text-anchor="middle" font-size="10.5" fill="#888">（虚部去掉末尾 'i'，stoi 自动吃负号）</text>

  <path d="M 260 222 L 260 238" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: formula -->
  <rect x="80" y="242" width="360" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">real = a * c − b * d</text>
  <text x="260" y="280" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">imag = a * d + b * c</text>
  <text x="260" y="294" text-anchor="middle" font-size="10" fill="#888">（i²=−1 把 bdi² 挪入实部，adi+bci 合虚部）</text>

  <path d="M 260 298 L 260 314" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: format string -->
  <rect x="100" y="318" width="320" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="11.5" fill="#333">ans = to_string(real) + "+"</text>
  <text x="260" y="352" text-anchor="middle" font-size="11.5" fill="#333">      + to_string(imag) + "i"</text>

  <path d="M 260 362 L 260 378" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End node -->
  <ellipse cx="260" cy="402" rx="120" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="406" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 ans</text>

  <!-- side note -->
  <rect x="350" y="166" width="160" height="56" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="6" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="430" y="184" text-anchor="middle" font-size="10" fill="#888">无须特判零</text>
  <text x="430" y="198" text-anchor="middle" font-size="10" fill="#888">to_string(0)="0"</text>
  <text x="430" y="212" text-anchor="middle" font-size="10" fill="#888">"0+2i" 天然合法</text>
  <path d="M 460 194 L 460 194" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="40" y="440" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="458" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">全程 O(n) 扫描 + 4 次整数乘法，无循环无递归</text>
  <text x="260" y="474" text-anchor="middle" font-size="10.5" fill="#555">n = 字符串长度（≤ 11），可视为 O(1)</text>
</svg>
