<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：遍历 j → 过期出队 → 查询候选 → 入队弹尾 → 更新答案</text>

  <!-- Start -->
  <rect x="250" y="44" width="120" height="32" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="65" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始，j = 0 .. n−1</text>

  <line x1="310" y1="76" x2="310" y2="92" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: expire front (diamond) -->
  <polygon points="310,96 460,140 310,184 160,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="132" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">① 过期出队</text>
  <text x="310" y="148" text-anchor="middle" font-size="10" fill="#555">x[队头] &lt; xj − k ?</text>
  <text x="310" y="162" text-anchor="middle" font-size="9" fill="#888">是 → pop_front，循环</text>

  <!-- loop back arrow for step 1 -->
  <path d="M 160 140 Q 130 140 130 120 L 130 108" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="132" font-size="8" fill="#d6a040">循环</text>

  <line x1="310" y1="184" x2="310" y2="196" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="324" y="194" font-size="9" fill="#888">否</text>

  <!-- Step 2: query candidate -->
  <rect x="180" y="200" width="260" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="218" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② 查询候选（deque 非空时）</text>
  <text x="310" y="234" text-anchor="middle" font-size="10" fill="#555">candidate = (yj + xj) + (y[front] − x[front])</text>
  <text x="310" y="246" text-anchor="middle" font-size="10" fill="#555">ans = max(ans, candidate)</text>

  <line x1="310" y1="250" x2="310" y2="266" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: pop back (diamond) -->
  <polygon points="310,270 460,314 310,358 160,314" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="306" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">③ 入队弹尾</text>
  <text x="310" y="322" text-anchor="middle" font-size="10" fill="#555">(y−x)[队尾] ≤ vj ?</text>
  <text x="310" y="336" text-anchor="middle" font-size="9" fill="#888">是 → pop_back，循环</text>

  <!-- loop back arrow for step 3 -->
  <path d="M 160 314 Q 130 314 130 294 L 130 282" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="306" font-size="8" fill="#d6a040">循环</text>

  <line x1="310" y1="358" x2="310" y2="370" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="324" y="368" font-size="9" fill="#888">否</text>

  <!-- Step 4: push j -->
  <rect x="220" y="374" width="180" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="396" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">④ push_back(j)</text>

  <line x1="310" y1="408" x2="310" y2="422" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop back to next j -->
  <rect x="250" y="426" width="120" height="30" rx="6" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="310" y="446" text-anchor="middle" font-size="11" fill="#555">j++ → 下一轮</text>

  <!-- side note: order matters -->
  <rect x="470" y="200" width="140" height="100" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="484" y="218" font-size="10" fill="#b85450" font-weight="bold">⚠️ 顺序不能反</text>
  <text x="484" y="234" font-size="9" fill="#555">先过期（清理）</text>
  <text x="484" y="248" font-size="9" fill="#555">再查询（合法最大）</text>
  <text x="484" y="262" font-size="9" fill="#555">后弹尾入队</text>
  <text x="484" y="278" font-size="9" fill="#555">j 不能提前入队</text>
  <text x="484" y="294" font-size="9" fill="#b85450">否则自己配自己</text>

  <!-- side note: amortized -->
  <rect x="470" y="374" width="140" height="50" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="484" y="392" font-size="10" fill="#d6a040" font-weight="bold">均摊 O(n)</text>
  <text x="484" y="406" font-size="9" fill="#555">每点入队 1 次</text>
  <text x="484" y="418" font-size="9" fill="#555">出队 1 次</text>
</svg>
