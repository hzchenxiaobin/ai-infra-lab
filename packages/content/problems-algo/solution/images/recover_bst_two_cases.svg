<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">两种情况：相邻 1 处逆序 vs 非相邻 2 处逆序</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">first = 第一处逆序的前驱；second = 最后一处逆序的当前</text>

  <!-- ===== Left: adjacent swap, 1 inversion ===== -->
  <rect x="20" y="58" width="255" height="296" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="148" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">情况 A：相邻交换</text>
  <text x="148" y="96" text-anchor="middle" font-size="10" fill="#555">原序列 1,2,3,4 → 交换相邻 2,3</text>

  <!-- sequence 1,3,2,4 with one inversion 3>2 -->
  <g font-size="12" filter="url(#rough2)">
    <rect x="36" y="116" width="34" height="30" fill="#fff" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="53" y="136" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <path d="M 72 131 L 86 131" stroke="#446688" stroke-width="1" fill="none" marker-end="url(#arr)"/>

    <!-- first = 3 -->
    <rect x="88" y="116" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="105" y="136" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <text x="105" y="160" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">first</text>

    <!-- inversion -->
    <path d="M 124 131 L 138 131" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arrR)"/>
    <text x="131" y="123" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">逆序①</text>

    <!-- second = 2 -->
    <rect x="140" y="116" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="157" y="136" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <text x="157" y="160" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">second</text>

    <path d="M 176 131 L 190 131" stroke="#446688" stroke-width="1" fill="none" marker-end="url(#arr)"/>
    <rect x="192" y="116" width="34" height="30" fill="#fff" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="209" y="136" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
  </g>

  <rect x="36" y="186" width="200" height="60" fill="#fff" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="136" y="206" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">仅 1 处逆序：3 &gt; 2</text>
  <text x="136" y="222" text-anchor="middle" font-size="9" fill="#555">first = 逆序①的前驱 = 3</text>
  <text x="136" y="236" text-anchor="middle" font-size="9" fill="#555">second = 逆序①的当前 = 2</text>

  <rect x="36" y="258" width="200" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="136" y="278" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">一次逆序即定位完成</text>
  <text x="136" y="296" text-anchor="middle" font-size="9" fill="#555">first/second 在同一处逆序里</text>
  <text x="136" y="312" text-anchor="middle" font-size="9" fill="#555">分别取前驱和当前</text>
  <text x="136" y="332" text-anchor="middle" font-size="9" fill="#4a7a3a">示例 2 即此情况</text>

  <!-- ===== Right: non-adjacent swap, 2 inversions ===== -->
  <rect x="285" y="58" width="255" height="296" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="412" y="80" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">情况 B：非相邻交换</text>
  <text x="412" y="96" text-anchor="middle" font-size="10" fill="#555">原序列 1,2,3 → 交换 1,3（隔一个）</text>

  <!-- sequence 3,2,1 with two inversions 3>2 and 2>1 -->
  <g font-size="12" filter="url(#rough2)">
    <!-- first = 3 -->
    <rect x="318" y="116" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="335" y="136" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <text x="335" y="160" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">first</text>

    <!-- inv1 -->
    <path d="M 354 131 L 368 131" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arrR)"/>
    <text x="361" y="123" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">逆序①</text>

    <rect x="370" y="116" width="34" height="30" fill="#fff" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="387" y="136" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>

    <!-- inv2 -->
    <path d="M 406 131 L 420 131" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arrR)"/>
    <text x="413" y="123" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">逆序②</text>

    <!-- second = 1 -->
    <rect x="422" y="116" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="439" y="136" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <text x="439" y="160" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">second</text>
  </g>

  <rect x="301" y="186" width="220" height="60" fill="#fff" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="411" y="206" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2 处逆序：3 &gt; 2 与 2 &gt; 1</text>
  <text x="411" y="222" text-anchor="middle" font-size="9" fill="#555">first = 逆序①的前驱 = 3</text>
  <text x="411" y="236" text-anchor="middle" font-size="9" fill="#555">second = 逆序②的当前 = 1</text>

  <rect x="301" y="258" width="220" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="411" y="278" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">两次逆序分别贡献 first/second</text>
  <text x="411" y="296" text-anchor="middle" font-size="9" fill="#555">first 仅在逆序①赋值一次</text>
  <text x="411" y="312" text-anchor="middle" font-size="9" fill="#555">second 每次逆序都更新 → 取逆序②</text>
  <text x="411" y="332" text-anchor="middle" font-size="9" fill="#b85450">示例 1 即此情况</text>
</svg>
