<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    </marker>
    <marker id="arro" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- title -->
  <text x="260" y="34" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：掩码按位与 + popcount，两路并行</text>

  <!-- n box -->
  <rect x="205" y="52" width="110" height="42" fill="#f0f0f0" stroke="#555" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="78" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">n</text>

  <!-- split arrows to two mask boxes -->
  <path d="M236,94 L150,118" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M284,94 L370,118" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- even mask box (blue) -->
  <rect x="50" y="118" width="200" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="150" y="146" text-anchor="middle" font-size="14" fill="#2a3a55" filter="url(#rough2)">n &amp; 0x5555 5555</text>

  <!-- odd mask box (green) -->
  <rect x="300" y="118" width="200" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="400" y="146" text-anchor="middle" font-size="14" fill="#2f5a26" filter="url(#rough2)">n &amp; 0xAAAA AAAA</text>

  <!-- arrows to popcount -->
  <path d="M150,164 L150,188" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M400,164 L400,188" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- even popcount box -->
  <rect x="75" y="188" width="150" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="150" y="214" text-anchor="middle" font-size="14" fill="#2a3a55" filter="url(#rough2)">popcount( )</text>

  <!-- odd popcount box -->
  <rect x="325" y="188" width="150" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="400" y="214" text-anchor="middle" font-size="14" fill="#2f5a26" filter="url(#rough2)">popcount( )</text>

  <!-- arrows to results -->
  <path d="M150,230 L150,252" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M400,230 L400,252" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- even / odd result boxes -->
  <rect x="105" y="252" width="90" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="150" y="278" text-anchor="middle" font-size="15" fill="#2a3a55" filter="url(#rough2)">even</text>

  <rect x="355" y="252" width="90" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="400" y="278" text-anchor="middle" font-size="15" fill="#2f5a26" filter="url(#rough2)">odd</text>

  <!-- converging arrows to return -->
  <path d="M150,292 L220,318" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M400,292 L330,318" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>

  <!-- return box (orange) -->
  <rect x="175" y="316" width="200" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="275" y="341" text-anchor="middle" font-size="14" fill="#7a5a10" filter="url(#rough2)">return [even, odd]</text>
</svg>
