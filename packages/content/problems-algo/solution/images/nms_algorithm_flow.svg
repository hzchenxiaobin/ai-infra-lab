<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：扫描 s 推进等待队列</text>

  <!-- Step 1: init -->
  <rect x="40" y="44" width="440" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="64" font-size="12" fill="#333" font-weight="bold">① 初始化</text>
  <text x="60" y="82" font-size="11" fill="#555">对每个 word，按 word[0] 放入 bucket[word[0]]，ptr = 0</text>

  <path d="M 260 96 L 260 110" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: for each c in s -->
  <rect x="40" y="114" width="440" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="134" font-size="12" fill="#333" font-weight="bold">② 遍历 s 中每个字符 c</text>
  <text x="60" y="152" font-size="11" fill="#555">cur ← 取走 bucket[c] 整桶（同时清空原桶，避免重复处理）</text>

  <path d="M 260 166 L 260 180" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: for each (i, ptr) in cur -->
  <rect x="40" y="184" width="440" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="204" font-size="12" fill="#333" font-weight="bold">③ 对 cur 中每个 (word 索引 i, 指针 ptr)</text>
  <text x="60" y="222" font-size="11" fill="#555">ptr++（匹配掉这个 c，指针后移）</text>

  <path d="M 260 236 L 260 250" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="260,254 360,294 260,334 160,294" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ptr ==</text>
  <text x="260" y="306" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">|word| ?</text>

  <!-- Yes branch -->
  <path d="M 160 294 L 90 294 L 90 330" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="288" font-size="10" fill="#4a7a3a">是</text>
  <rect x="30" y="334" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="90" y="350" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans++</text>
  <text x="90" y="366" text-anchor="middle" font-size="10" fill="#888">单词匹配完成 ✓</text>

  <!-- No branch -->
  <path d="M 360 294 L 430 294 L 430 330" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="386" y="288" font-size="10" fill="#446688">否</text>
  <rect x="370" y="334" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="350" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">放入</text>
  <text x="430" y="366" text-anchor="middle" font-size="10" fill="#446688">bucket[word[ptr]]</text>

  <!-- loop back arrow -->
  <path d="M 430 374 Q 430 410 260 410 Q 90 410 90 374" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="424" text-anchor="middle" font-size="10" fill="#888">处理完 cur 中所有项 → 回到 ② 扫下一个字符</text>

  <text x="260" y="446" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">扫完 s → 返回 ans</text>
</svg>
