<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L8,0 L4,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="25" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：capacity=2，多线程并发</text>

  <text x="30" y="52" font-size="11" fill="#888" font-weight="bold">时刻</text>
  <text x="120" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Producer 1</text>
  <text x="260" y="52" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Producer 2</text>
  <text x="400" y="52" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">Consumer</text>
  <text x="520" y="52" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">size</text>

  <line x1="20" y1="60" x2="540" y2="60" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="30" y="80" font-size="11" fill="#555">t1</text>
  <rect x="65" y="68" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="120" y="86" text-anchor="middle" font-size="10" fill="#333">enqueue(1) ✓</text>
  <text x="520" y="86" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0→1</text>
  <text x="260" y="86" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="400" y="86" text-anchor="middle" font-size="10" fill="#888">—</text>

  <text x="30" y="113" font-size="11" fill="#555">t2</text>
  <text x="120" y="119" text-anchor="middle" font-size="10" fill="#888">完成</text>
  <rect x="205" y="101" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="119" text-anchor="middle" font-size="10" fill="#333">enqueue(2) ✓</text>
  <text x="520" y="119" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1→2</text>
  <text x="400" y="119" text-anchor="middle" font-size="10" fill="#888">—</text>

  <text x="30" y="146" font-size="11" fill="#555">t3</text>
  <rect x="65" y="134" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="120" y="152" text-anchor="middle" font-size="10" fill="#b85450">enqueue(3) 阻塞</text>
  <text x="260" y="152" text-anchor="middle" font-size="10" fill="#888">完成</text>
  <text x="400" y="152" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="520" y="152" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2 (满)</text>

  <text x="30" y="179" font-size="11" fill="#555">t4</text>
  <text x="120" y="185" text-anchor="middle" font-size="10" fill="#b85450">阻塞中...</text>
  <text x="260" y="185" text-anchor="middle" font-size="10" fill="#888">完成</text>
  <rect x="345" y="167" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="400" y="185" text-anchor="middle" font-size="10" fill="#333">dequeue() → 1 ✓</text>
  <text x="520" y="185" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2→1</text>

  <text x="30" y="212" font-size="11" fill="#555">t5</text>
  <rect x="65" y="200" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="120" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a">被唤醒, enqueue(3) ✓</text>
  <text x="260" y="218" text-anchor="middle" font-size="10" fill="#888">完成</text>
  <text x="400" y="218" text-anchor="middle" font-size="10" fill="#888">完成</text>
  <text x="520" y="218" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1→2</text>

  <path d="M 400 193 L 400 205 Q 400 210 393 210 L 185 210 Q 180 210 180 205 L 180 198" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="207" text-anchor="middle" font-size="9" fill="#b85450">notify(not_full) 唤醒 P1</text>

  <text x="30" y="245" font-size="11" fill="#555">t6</text>
  <text x="120" y="251" text-anchor="middle" font-size="10" fill="#888">完成</text>
  <text x="260" y="251" text-anchor="middle" font-size="10" fill="#888">完成</text>
  <rect x="345" y="233" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="400" y="251" text-anchor="middle" font-size="10" fill="#333">dequeue() → 2 ✓</text>
  <text x="520" y="251" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2→1</text>

  <text x="30" y="278" font-size="11" fill="#555">t7</text>
  <text x="120" y="284" text-anchor="middle" font-size="10" fill="#888">完成</text>
  <text x="260" y="284" text-anchor="middle" font-size="10" fill="#888">完成</text>
  <rect x="345" y="266" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="400" y="284" text-anchor="middle" font-size="10" fill="#333">dequeue() → 3 ✓</text>
  <text x="520" y="284" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1→0</text>

  <text x="30" y="311" font-size="11" fill="#555">t8</text>
  <text x="120" y="317" text-anchor="middle" font-size="10" fill="#888">完成</text>
  <text x="260" y="317" text-anchor="middle" font-size="10" fill="#888">完成</text>
  <rect x="345" y="299" width="110" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="400" y="317" text-anchor="middle" font-size="10" fill="#d6a040">dequeue() 阻塞</text>
  <text x="520" y="317" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0 (空)</text>

  <rect x="120" y="345" width="320" height="60" fill="#e8f0fe" fill-opacity="0.3" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">关键观察</text>
  <text x="280" y="386" text-anchor="middle" font-size="10" fill="#555">dequeue 带走一个元素 → size 减小 → 队列从满变为不满</text>
  <text x="280" y="398" text-anchor="middle" font-size="10" fill="#555">→ notify(not_full) 唤醒被阻塞的生产者继续 enqueue</text>

  <rect x="120" y="415" width="320" height="50" fill="#e6f4ea" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="437" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">消费者取走顺序：1, 2, 3</text>
  <text x="280" y="455" text-anchor="middle" font-size="10" fill="#555">FIFO：先入先出，阻塞不影响排队顺序的公平性</text>
</svg>
