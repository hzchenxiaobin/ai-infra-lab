<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：x = 8，求 ⌊√8⌋ = 2</text>

  <!-- ===== Table header ===== -->
  <rect x="40" y="48" width="500" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">轮次</text>
  <text x="148" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[lo, hi]</text>
  <text x="220" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">mid</text>
  <text x="290" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">mid²</text>
  <text x="372" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">判定</text>
  <text x="476" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">动作</text>

  <!-- column separators -->
  <line x1="100" y1="48" x2="100" y2="238" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="196" y1="48" x2="196" y2="238" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="244" y1="48" x2="244" y2="238" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="336" y1="48" x2="336" y2="238" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="408" y1="48" x2="408" y2="238" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Row 1 ===== -->
  <rect x="40" y="80" width="500" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="99" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="148" y="99" text-anchor="middle" font-size="11" fill="#333">[0, 8]</text>
  <text x="220" y="99" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="290" y="99" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">16</text>
  <text x="372" y="99" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">16 &gt; 8 ✗</text>
  <text x="476" y="99" text-anchor="middle" font-size="11" fill="#b85450">hi = 3</text>

  <!-- ===== Row 2 ===== -->
  <rect x="40" y="112" width="500" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="131" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="148" y="131" text-anchor="middle" font-size="11" fill="#333">[0, 3]</text>
  <text x="220" y="131" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="290" y="131" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="372" y="131" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1 ≤ 8 ✓</text>
  <text x="476" y="131" text-anchor="middle" font-size="11" fill="#4a7a3a">ans=1; lo=2</text>

  <!-- ===== Row 3 ===== -->
  <rect x="40" y="144" width="500" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="163" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="148" y="163" text-anchor="middle" font-size="11" fill="#333">[2, 3]</text>
  <text x="220" y="163" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="290" y="163" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="372" y="163" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4 ≤ 8 ✓</text>
  <text x="476" y="163" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans=2; lo=3</text>

  <!-- ===== Row 4 ===== -->
  <rect x="40" y="176" width="500" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="195" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="148" y="195" text-anchor="middle" font-size="11" fill="#333">[3, 3]</text>
  <text x="220" y="195" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="290" y="195" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">9</text>
  <text x="372" y="195" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">9 &gt; 8 ✗</text>
  <text x="476" y="195" text-anchor="middle" font-size="11" fill="#b85450">hi = 2</text>

  <!-- ===== End row ===== -->
  <rect x="40" y="210" width="500" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="228" text-anchor="middle" font-size="11" fill="#333">lo=3 &gt; hi=2，循环结束 → 返回 ans = 2</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="256" width="500" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="280" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键观察</text>
  <text x="60" y="302" font-size="11" fill="#555">• 第 3 轮 mid=2 可行后，仍要继续向右试 mid=3，确保没有更大的可行 r</text>
  <text x="60" y="320" font-size="11" fill="#555">• 第 4 轮 mid=3 不可行被排除，ans 留在 2 —— 这就是「最大的可行 r」</text>
  <text x="60" y="336" font-size="11" fill="#d6a040" font-weight="bold">  对比：求「最小可行」时可行即向左收缩；本题求「最大可行」可行即向右收缩</text>
</svg>
