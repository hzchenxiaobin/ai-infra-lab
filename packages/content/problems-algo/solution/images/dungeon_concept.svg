<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">地下城网格：骑士救公主，全程 HP ≥ 1</text>

  <!-- grid: cell 70x50, origin x=100 y=64. cols x=100,172,244; rows y=64,116,168 -->
  <!-- row 0: -2, -3, +3 -->
  <rect x="100" y="64" width="70" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="95" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">−2</text>
  <rect x="172" y="64" width="70" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="207" y="95" text-anchor="middle" font-size="16" fill="#333">−3</text>
  <rect x="244" y="64" width="70" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="279" y="95" text-anchor="middle" font-size="16" fill="#333">+3</text>
  <!-- row 1: -5, -10, +1 -->
  <rect x="100" y="116" width="70" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="147" text-anchor="middle" font-size="16" fill="#333">−5</text>
  <rect x="172" y="116" width="70" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="207" y="147" text-anchor="middle" font-size="16" fill="#333">−10</text>
  <rect x="244" y="116" width="70" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="279" y="147" text-anchor="middle" font-size="16" fill="#333">+1</text>
  <!-- row 2: +10, +30, -5(princess) -->
  <rect x="100" y="168" width="70" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="199" text-anchor="middle" font-size="16" fill="#333">+10</text>
  <rect x="172" y="168" width="70" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="207" y="199" text-anchor="middle" font-size="16" fill="#333">+30</text>
  <rect x="244" y="168" width="70" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="279" y="199" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">−5</text>

  <!-- knight marker at (0,0) -->
  <circle cx="112" cy="76" r="7" fill="#446688" stroke="#224" stroke-width="1" filter="url(#rough2)"/>
  <text x="135" y="56" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">骑士起点</text>
  <!-- princess crown at (2,2) -->
  <path d="M 271 178 l 4 -7 l 4 5 l 4 -9 l 4 9 l 4 -5 l 4 7 z" fill="#b85450" stroke="#723" stroke-width="1" filter="url(#rough2)"/>
  <text x="279" y="234" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">公主（终点）</text>

  <!-- move direction arrows (right / down) near start -->
  <path d="M 178 80 L 196 80" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 150 114 L 150 132" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="206" y="74" font-size="9" fill="#446688">向右</text>
  <text x="156" y="128" font-size="9" fill="#446688">向下</text>

  <!-- legend -->
  <rect x="345" y="74" width="22" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="375" y="86" font-size="11" fill="#444">恶魔：扣血（负值）</text>
  <rect x="345" y="98" width="22" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="375" y="110" font-size="11" fill="#444">药水：回血（正值）</text>
  <circle cx="356" cy="128" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="375" y="132" font-size="11" fill="#444">骑士起点 (0,0)</text>
  <path d="M 350 146 l 3 -5 l 3 4 l 3 -7 l 3 7 l 3 -4 l 3 5 z" fill="#b85450" filter="url(#rough2)"/>
  <text x="375" y="150" font-size="11" fill="#444">公主位置 (m−1,n−1)</text>

  <!-- bottom note -->
  <rect x="40" y="252" width="440" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">规则</text>
  <text x="260" y="294" text-anchor="middle" font-size="11" fill="#444">· 每步只能向右或向下；进入格子即结算该格的 HP 变化</text>
  <text x="260" y="312" text-anchor="middle" font-size="11" fill="#444">· 任意时刻 HP ≤ 0 即阵亡；求「能救到公主」的最小初始 HP</text>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">本例最小初始 HP = 7（见下文演算）</text>
</svg>
