<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">核心：位置预处理 + 行列计数</text>

  <!-- 矩阵 mat (left) -->
  <text x="90" y="62" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">mat (m×n)</text>
  <g filter="url(#rough2)">
    <!-- row0 -->
    <rect x="30" y="74" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="70" y="74" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="110" y="74" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <!-- row1 -->
    <rect x="30" y="114" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="70" y="114" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3"/>
    <rect x="110" y="114" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <!-- row2 -->
    <rect x="30" y="154" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="70" y="154" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="110" y="154" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <!-- values -->
    <text x="50" y="99" text-anchor="middle" font-size="14" fill="#333">3</text>
    <text x="90" y="99" text-anchor="middle" font-size="14" fill="#333">2</text>
    <text x="130" y="99" text-anchor="middle" font-size="14" fill="#333">5</text>
    <text x="50" y="139" text-anchor="middle" font-size="14" fill="#333">1</text>
    <text x="90" y="139" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">4</text>
    <text x="130" y="139" text-anchor="middle" font-size="14" fill="#333">6</text>
    <text x="50" y="179" text-anchor="middle" font-size="14" fill="#333">8</text>
    <text x="90" y="179" text-anchor="middle" font-size="14" fill="#333">7</text>
    <text x="130" y="179" text-anchor="middle" font-size="14" fill="#333">9</text>
  </g>
  <text x="90" y="210" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">涂 arr[i]=4</text>

  <!-- arrow matrix -> pos box -->
  <path d="M150 134 L206 134" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- pos box (middle) -->
  <g filter="url(#rough2)">
    <rect x="210" y="86" width="150" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="285" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07020">位置预处理表</text>
    <text x="285" y="128" text-anchor="middle" font-size="13" fill="#333">pos[v] = (r, c)</text>
    <text x="285" y="150" text-anchor="middle" font-size="13" fill="#b85450">pos[4] = (1, 1)</text>
    <text x="285" y="170" text-anchor="middle" font-size="11" fill="#888">遍历 mat 一次建好</text>
  </g>

  <!-- counters (right) -->
  <text x="460" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">行列计数器</text>
  <g filter="url(#rough2)">
    <text x="380" y="106" text-anchor="end" font-size="12" fill="#333">rowCnt</text>
    <rect x="390" y="92" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="420" y="92" width="30" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <rect x="450" y="92" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="405" y="108" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="435" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">1</text>
    <text x="465" y="108" text-anchor="middle" font-size="12" fill="#333">0</text>

    <text x="380" y="146" text-anchor="end" font-size="12" fill="#333">colCnt</text>
    <rect x="390" y="132" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="420" y="132" width="30" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <rect x="450" y="132" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="405" y="148" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="435" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">1</text>
    <text x="465" y="148" text-anchor="middle" font-size="12" fill="#333">0</text>
  </g>
  <text x="435" y="172" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">涂 (1,1) 后 +1</text>

  <!-- arrow pos box -> counters -->
  <path d="M360 134 L386 112" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- bottom check box -->
  <g filter="url(#rough2)">
    <rect x="30" y="246" width="480" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="270" y="272" text-anchor="middle" font-size="13" fill="#333">每涂一格只需 O(1)：查 pos[v] → 行列计数各 +1</text>
    <text x="270" y="298" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">rowCnt[r] == n  或  colCnt[c] == m</text>
    <text x="270" y="322" text-anchor="middle" font-size="13" fill="#4a7a3a">成立即返回下标 i （第一个满行/满列）</text>
  </g>
</svg>
