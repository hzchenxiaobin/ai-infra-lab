<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fdfcf7"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold">不相交的线 = 最长公共子序列</text>
  <path d="M 160 38 Q 280 46 400 38" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <text x="280" y="52" text-anchor="middle" font-size="11" fill="#888">nums1 = [1,4,2]　nums2 = [1,2,4]　答案 = 2</text>

  <!-- nums1 标签 -->
  <text x="40" y="92" font-size="12" fill="#888" font-weight="bold">nums1</text>

  <!-- nums1 boxes -->
  <g filter="url(#sk)">
    <rect x="90" y="76" width="50" height="32" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" rx="4"/>
    <rect x="190" y="76" width="50" height="32" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" rx="4"/>
    <rect x="290" y="76" width="50" height="32" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" rx="4"/>
  </g>
  <text x="115" y="97" text-anchor="middle" font-size="14" fill="#2b2b2b">1</text>
  <text x="215" y="97" text-anchor="middle" font-size="14" fill="#2b2b2b">4</text>
  <text x="315" y="97" text-anchor="middle" font-size="14" fill="#2b2b2b">2</text>

  <text x="90" y="120" font-size="10" fill="#aaa">i=0</text>
  <text x="190" y="120" font-size="10" fill="#aaa">i=1</text>
  <text x="290" y="120" font-size="10" fill="#aaa">i=2</text>

  <!-- nums2 标签 -->
  <text x="40" y="202" font-size="12" fill="#888" font-weight="bold">nums2</text>

  <!-- nums2 boxes -->
  <g filter="url(#sk)">
    <rect x="90" y="186" width="50" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3" rx="4"/>
    <rect x="190" y="186" width="50" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3" rx="4"/>
    <rect x="290" y="186" width="50" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3" rx="4"/>
  </g>
  <text x="115" y="207" text-anchor="middle" font-size="14" fill="#2b2b2b">1</text>
  <text x="215" y="207" text-anchor="middle" font-size="14" fill="#2b2b2b">2</text>
  <text x="315" y="207" text-anchor="middle" font-size="14" fill="#2b2b2b">4</text>

  <text x="90" y="236" font-size="10" fill="#aaa">j=0</text>
  <text x="190" y="236" font-size="10" fill="#aaa">j=1</text>
  <text x="290" y="236" font-size="10" fill="#aaa">j=2</text>

  <!-- 有效连线：1→1 (绿色, 竖直) -->
  <path d="M 115 108 L 115 186" stroke="#4a8e4a" stroke-width="2" fill="none" filter="url(#sk)"/>
  <!-- 有效连线：4→4 (绿色, i=1→j=2, 不交叉) -->
  <path d="M 215 108 L 315 186" stroke="#4a8e4a" stroke-width="2" fill="none" filter="url(#sk)"/>

  <!-- 无效连线：2→2 (红色虚线, i=2→j=1, 与 4→4 交叉) -->
  <path d="M 315 108 L 215 186" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" filter="url(#sk)"/>

  <!-- 交叉标记 -->
  <circle cx="265" cy="147" r="6" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/>
  <line x1="269" y1="143" x2="277" y2="135" stroke="#b85450" stroke-width="1.5" filter="url(#sk)"/>

  <!-- 图例 -->
  <g filter="url(#sk)">
    <rect x="370" y="76" width="170" height="100" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="4,3"/>
  </g>
  <text x="380" y="98" font-size="11" fill="#2b2b2b" font-weight="bold">图例</text>
  <line x1="382" y1="114" x2="412" y2="114" stroke="#4a8e4a" stroke-width="2" filter="url(#sk)"/>
  <text x="420" y="118" font-size="11" fill="#444">有效（不相交）</text>
  <line x1="382" y1="134" x2="412" y2="134" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" filter="url(#sk)"/>
  <text x="420" y="138" font-size="11" fill="#444">禁止（相交）</text>
  <text x="380" y="160" font-size="10" fill="#888">2→2 与 4→4 相交</text>

  <!-- 底部说明 -->
  <g filter="url(#sk)">
    <rect x="60" y="268" width="440" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="80" y="292" font-size="12" fill="#2b2b2b" font-weight="bold">核心等价</text>
  <text x="80" y="312" font-size="11" fill="#444">连线不相交 ⇔ 连线两端下标在两个数组中各自递增</text>
  <text x="80" y="330" font-size="11" fill="#444">⇔ 被连接的数构成两个数组的「公共子序列」</text>
  <text x="80" y="348" font-size="11" fill="#c98a2b" font-weight="bold">⇒ 最大不相交连线数 = 最长公共子序列长度（LCS）</text>

  <text x="280" y="374" text-anchor="middle" font-size="10" fill="#aaa">与 1143. 最长公共子序列 完全同构，仅将字符换成整数</text>
</svg>
