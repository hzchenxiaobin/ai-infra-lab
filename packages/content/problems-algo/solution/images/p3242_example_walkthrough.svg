<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：3×3 网格的 4 次查询</text>

  <!-- 板 1：adjacentSum(1) -->
  <text x="116" y="50" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">adjacentSum(1)</text>
  <g filter="url(#rough2)">
    <rect x="65" y="58" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="99" y="58" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="133" y="58" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="65" y="92" width="34" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="99" y="92" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="133" y="92" width="34" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="65" y="126" width="34" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="99" y="126" width="34" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="133" y="126" width="34" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <text x="82" y="80" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">0</text>
    <text x="116" y="80" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold">1</text>
    <text x="150" y="80" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>
    <text x="82" y="114" text-anchor="middle" font-size="13" fill="#aaa">3</text>
    <text x="116" y="114" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>
    <text x="150" y="114" text-anchor="middle" font-size="13" fill="#aaa">5</text>
    <text x="82" y="148" text-anchor="middle" font-size="13" fill="#aaa">6</text>
    <text x="116" y="148" text-anchor="middle" font-size="13" fill="#aaa">7</text>
    <text x="150" y="148" text-anchor="middle" font-size="13" fill="#aaa">8</text>
  </g>
  <text x="116" y="182" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">0+2+4 = 6</text>

  <!-- 板 2：adjacentSum(4) -->
  <text x="341" y="50" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">adjacentSum(4)</text>
  <g filter="url(#rough2)">
    <rect x="290" y="58" width="34" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="324" y="58" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="358" y="58" width="34" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="290" y="92" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="324" y="92" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="358" y="92" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="290" y="126" width="34" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="324" y="126" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="358" y="126" width="34" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <text x="307" y="80" text-anchor="middle" font-size="13" fill="#aaa">0</text>
    <text x="341" y="80" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
    <text x="375" y="80" text-anchor="middle" font-size="13" fill="#aaa">2</text>
    <text x="307" y="114" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">3</text>
    <text x="341" y="114" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold">4</text>
    <text x="375" y="114" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">5</text>
    <text x="307" y="148" text-anchor="middle" font-size="13" fill="#aaa">6</text>
    <text x="341" y="148" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">7</text>
    <text x="375" y="148" text-anchor="middle" font-size="13" fill="#aaa">8</text>
  </g>
  <text x="341" y="182" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1+3+5+7 = 16</text>

  <!-- 板 3：diagonalSum(4) -->
  <text x="116" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">diagonalSum(4)</text>
  <g filter="url(#rough2)">
    <rect x="65" y="206" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="99" y="206" width="34" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="133" y="206" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="65" y="240" width="34" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="99" y="240" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="133" y="240" width="34" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="65" y="274" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="99" y="274" width="34" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="133" y="274" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="82" y="228" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
    <text x="116" y="228" text-anchor="middle" font-size="13" fill="#aaa">1</text>
    <text x="150" y="228" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="82" y="262" text-anchor="middle" font-size="13" fill="#aaa">3</text>
    <text x="116" y="262" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold">4</text>
    <text x="150" y="262" text-anchor="middle" font-size="13" fill="#aaa">5</text>
    <text x="82" y="296" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">6</text>
    <text x="116" y="296" text-anchor="middle" font-size="13" fill="#aaa">7</text>
    <text x="150" y="296" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">8</text>
  </g>
  <text x="116" y="330" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0+2+6+8 = 16</text>

  <!-- 板 4：diagonalSum(8) -->
  <text x="341" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">diagonalSum(8)</text>
  <g filter="url(#rough2)">
    <rect x="290" y="206" width="34" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="324" y="206" width="34" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="358" y="206" width="34" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="290" y="240" width="34" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="324" y="240" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="358" y="240" width="34" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="290" y="274" width="34" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="324" y="274" width="34" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="358" y="274" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="307" y="228" text-anchor="middle" font-size="13" fill="#aaa">0</text>
    <text x="341" y="228" text-anchor="middle" font-size="13" fill="#aaa">1</text>
    <text x="375" y="228" text-anchor="middle" font-size="13" fill="#aaa">2</text>
    <text x="307" y="262" text-anchor="middle" font-size="13" fill="#aaa">3</text>
    <text x="341" y="262" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4</text>
    <text x="375" y="262" text-anchor="middle" font-size="13" fill="#aaa">5</text>
    <text x="307" y="296" text-anchor="middle" font-size="13" fill="#aaa">6</text>
    <text x="341" y="296" text-anchor="middle" font-size="13" fill="#aaa">7</text>
    <text x="375" y="296" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold">8</text>
  </g>
  <text x="341" y="330" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4 = 4</text>

  <text x="260" y="350" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">注：1 的上方、8 的另外三个对角方向越界，自动跳过</text>
</svg>
