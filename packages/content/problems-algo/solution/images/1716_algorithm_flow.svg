<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：拆周 → 完整周求和 → 剩余天求和 → 相加</text>

  <!-- ===== Step 1: input n ===== -->
  <g filter="url(#rough2)">
    <rect x="220" y="44" width="120" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="18"/>
    <text x="280" y="67" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">输入 n 天</text>
  </g>

  <path d="M 280 84 L 280 104" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: split w, r ===== -->
  <g filter="url(#rough2)">
    <rect x="200" y="110" width="160" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="280" y="130" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">拆分：w, r = divmod(n, 7)</text>
    <text x="280" y="148" text-anchor="middle" font-size="10" fill="#555">w 个完整周，r 个剩余天</text>
  </g>

  <!-- branch arrows to full weeks and remaining -->
  <path d="M 250 170 L 250 188 L 130 188 L 130 206" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 170 L 310 188 L 430 188 L 430 206" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3a: full weeks sum ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="212" width="180" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="130" y="232" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">完整周求和</text>
    <line x1="52" y1="240" x2="208" y2="240" stroke="#c0d0e8" stroke-width="1" filter="url(#rough2)"/>
    <text x="52" y="256" font-size="10" fill="#555" filter="url(#rough2)">第 k 周和 S_k = 7k + 21</text>
    <text x="52" y="272" font-size="10" fill="#555" filter="url(#rough2)">{S_k} 首项 28 公差 7</text>
    <text x="52" y="290" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">W_full = w·(28+28+7(w−1))/2</text>
    <text x="52" y="302" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">  = 7w(w+7)/2</text>
  </g>

  <!-- ===== Step 3b: remaining days sum ===== -->
  <g filter="url(#rough2)">
    <rect x="340" y="212" width="180" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="430" y="232" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">剩余天求和</text>
    <line x1="352" y1="240" x2="508" y2="240" stroke="#e8c0c8" stroke-width="1" filter="url(#rough2)"/>
    <text x="352" y="256" font-size="10" fill="#555" filter="url(#rough2)">第 w+1 周前 r 天</text>
    <text x="352" y="272" font-size="10" fill="#555" filter="url(#rough2)">首项 w+1，公差 1</text>
    <text x="352" y="290" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">W_rem = r(w+1)</text>
    <text x="352" y="302" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">      + r(r−1)/2</text>
  </g>

  <!-- arrows converging -->
  <path d="M 130 312 L 130 336 L 270 336 L 270 352" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 430 312 L 430 336 L 290 336 L 290 352" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: sum ===== -->
  <g filter="url(#rough2)">
    <rect x="200" y="358" width="160" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <text x="280" y="378" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">W = W_full + W_rem</text>
    <text x="280" y="394" text-anchor="middle" font-size="10" fill="#555">返回总金额</text>
  </g>

  <path d="M 280 410 L 280 426" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== output ===== -->
  <g filter="url(#rough2)">
    <rect x="220" y="432" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="17"/>
    <text x="280" y="454" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">O(1) 返回</text>
  </g>

  <!-- side notes -->
  <rect x="40" y="358" width="120" height="40" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" rx="6" filter="url(#rough2)"/>
  <text x="100" y="376" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">w=0 时此项=0</text>
  <text x="100" y="390" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">边界自洽</text>

  <rect x="400" y="358" width="120" height="40" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" rx="6" filter="url(#rough2)"/>
  <text x="460" y="376" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">r=0 时此项=0</text>
  <text x="460" y="390" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">边界自洽</text>
</svg>
