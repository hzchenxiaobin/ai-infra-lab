<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "0110111"</text>

  <!-- direction arrow -->
  <path d="M 90 48 L 470 48" stroke="#888" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="44" text-anchor="middle" font-size="10" fill="#888">逐字符推进 →</text>

  <!-- ===== Row labels (left) ===== -->
  <text x="68" y="84" text-anchor="end" font-size="11" fill="#888" font-weight="bold">i</text>
  <text x="68" y="134" text-anchor="end" font-size="11" fill="#888" font-weight="bold">s[i]</text>
  <text x="68" y="194" text-anchor="end" font-size="11" fill="#888" font-weight="bold">consec</text>
  <text x="68" y="264" text-anchor="end" font-size="11" fill="#888" font-weight="bold">ans</text>

  <!-- ===== Row 1: i index (0..6) ===== -->
  <text x="118" y="84" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="174" y="84" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="230" y="84" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="286" y="84" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="342" y="84" text-anchor="middle" font-size="11" fill="#888">4</text>
  <text x="398" y="84" text-anchor="middle" font-size="11" fill="#888">5</text>
  <text x="454" y="84" text-anchor="middle" font-size="11" fill="#888">6</text>

  <!-- ===== Row 2: s[i] characters ===== -->
  <!-- 0 (red) -->
  <rect x="94" y="108" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="130" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <!-- 1 (blue, group1) -->
  <rect x="150" y="108" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="130" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- 1 (blue, group1) -->
  <rect x="206" y="108" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="130" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- 0 (red) -->
  <rect x="262" y="108" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="286" y="130" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <!-- 1 (green, group2) -->
  <rect x="318" y="108" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="130" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- 1 (green, group2) -->
  <rect x="374" y="108" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="398" y="130" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- 1 (green, group2) -->
  <rect x="430" y="108" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="454" y="130" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- group brackets -->
  <path d="M 150 150 L 150 156 L 254 156 L 254 150" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="202" y="170" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">段1</text>
  <path d="M 318 150 L 318 156 L 478 156 L 478 150" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="398" y="170" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">段2</text>

  <!-- ===== Row 3: consec ===== -->
  <rect x="94" y="180" width="48" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="118" y="200" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
  <rect x="150" y="180" width="48" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="174" y="200" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <rect x="206" y="180" width="48" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="230" y="200" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>
  <rect x="262" y="180" width="48" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="286" y="200" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
  <rect x="318" y="180" width="48" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="342" y="200" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="374" y="180" width="48" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="398" y="200" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="430" y="180" width="48" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="454" y="200" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- ===== Row 4: ans ===== -->
  <rect x="94" y="248" width="48" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="118" y="268" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">0</text>
  <rect x="150" y="248" width="48" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="174" y="268" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">1</text>
  <rect x="206" y="248" width="48" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="230" y="268" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">3</text>
  <rect x="262" y="248" width="48" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="286" y="268" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">3</text>
  <rect x="318" y="248" width="48" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="342" y="268" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">4</text>
  <rect x="374" y="248" width="48" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="398" y="268" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">6</text>
  <!-- final ans highlighted -->
  <rect x="430" y="248" width="48" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="454" y="268" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">9</text>

  <!-- sum note: segment contributions -->
  <text x="174" y="300" text-anchor="middle" font-size="10" fill="#446688">1+2=3</text>
  <text x="398" y="300" text-anchor="middle" font-size="10" fill="#4a7a3a">1+2+3=6</text>

  <!-- Result -->
  <rect x="150" y="318" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">ans = 3 + 6 = 9 ✓</text>
</svg>
