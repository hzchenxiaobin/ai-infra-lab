<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：nums = [3,3,5,6]（b = [3,2,3,3]）</text>

  <!-- 表头 -->
  <rect x="30" y="44" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="60" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i</text>
  <rect x="80" y="44" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="60" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">nums[i]</text>
  <rect x="150" y="44" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="60" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b[i]</text>
  <rect x="212" y="44" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="60" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">排名 r</text>
  <rect x="274" y="44" width="104" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="326" y="60" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">query 前缀 max</text>
  <rect x="384" y="44" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="416" y="60" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dp[i]</text>
  <rect x="454" y="44" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="482" y="60" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans</text>

  <!-- 行 i=0 -->
  <rect x="30" y="70" width="44" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="52" y="89" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="80" y="70" width="64" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="112" y="89" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="150" y="70" width="56" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="178" y="89" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="212" y="70" width="56" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="240" y="89" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="274" y="70" width="104" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="326" y="89" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">—（树空）</text>
  <rect x="384" y="70" width="64" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="416" y="89" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="454" y="70" width="56" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="482" y="89" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <!-- 行 i=1 -->
  <rect x="30" y="102" width="44" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="52" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="80" y="102" width="64" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="112" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="150" y="102" width="56" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="178" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="212" y="102" width="56" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="240" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="274" y="102" width="104" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="326" y="121" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">—（rank2 不可见）</text>
  <rect x="384" y="102" width="64" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="416" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="454" y="102" width="56" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="482" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <!-- 行 i=2 -->
  <rect x="30" y="134" width="44" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="52" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="80" y="134" width="64" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="112" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="150" y="134" width="56" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="178" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="212" y="134" width="56" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="240" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="274" y="134" width="104" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="326" y="153" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3（接 i=0/1）</text>
  <rect x="384" y="134" width="64" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="416" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <rect x="454" y="134" width="56" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="482" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>

  <!-- 行 i=3（答案行，高亮） -->
  <rect x="30" y="166" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="52" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <rect x="80" y="166" width="64" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="112" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">6</text>
  <rect x="150" y="166" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <rect x="212" y="166" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <rect x="274" y="166" width="104" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="326" y="185" text-anchor="middle" font-size="10" font-weight="bold" fill="#333" filter="url(#rough2)">8（接 i=2）</text>
  <rect x="384" y="166" width="64" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="416" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">14</text>
  <rect x="454" y="166" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="482" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">14</text>

  <!-- 注释 1：离散化 -->
  <rect x="30" y="210" width="460" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="231" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">离散化：sorted(b) = [2,3]，2→rank1、3→rank2；query(r) 只看得到排名 ≤ r 的 dp</text>

  <!-- 注释 2：i=1 的关键 -->
  <rect x="30" y="254" width="460" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i=1 的 b=2 全场最小：query(1) 看不到挂在 rank2 上的 dp=3（b 不能下降）</text>
  <text x="260" y="290" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">—— 全为正也不能全选，必须弃掉下标 1</text>

  <!-- 注释 3：负数 -->
  <rect x="30" y="308" width="460" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">负数例 nums=[−2,−1]：b=[−2,−2]，i=1 查到 dp[0]=−2</text>
  <text x="260" y="342" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">dp[1] = −1 + max(0, −2) = −1 —— 答案可以为负</text>
</svg>
