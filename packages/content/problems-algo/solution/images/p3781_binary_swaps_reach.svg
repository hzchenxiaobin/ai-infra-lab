<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：'1' 只能左移且不可穿越，落点满足 q&#8202;j ≤ o&#8202;j</text>

  <!-- 行标签：初始 -->
  <text x="52" y="68" text-anchor="middle" font-size="13" fill="#666" font-weight="bold" filter="url(#rough2)">初始</text>

  <!-- 行 A：格子（'1' 所在格橙色描边） -->
  <g filter="url(#rough2)">
    <rect x="96" y="44" width="58" height="38" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2"/>
    <rect x="154" y="44" width="58" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="212" y="44" width="58" height="38" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2"/>
    <rect x="270" y="44" width="58" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="328" y="44" width="58" height="38" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2"/>
  </g>
  <!-- 行 A：数值与下标 -->
  <g filter="url(#rough2)">
    <text x="125" y="69" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">2</text>
    <text x="183" y="69" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">1</text>
    <text x="241" y="69" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">5</text>
    <text x="299" y="69" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">2</text>
    <text x="357" y="69" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">3</text>
    <text x="102" y="57" font-size="9" fill="#aaa">0</text>
    <text x="160" y="57" font-size="9" fill="#aaa">1</text>
    <text x="218" y="57" font-size="9" fill="#aaa">2</text>
    <text x="276" y="57" font-size="9" fill="#aaa">3</text>
    <text x="334" y="57" font-size="9" fill="#aaa">4</text>
  </g>

  <!-- 行 A：s 字符（'1' 画圈） -->
  <g filter="url(#rough2)">
    <text x="125" y="103" text-anchor="middle" font-size="13" fill="#999">0</text>
    <circle cx="183" cy="98" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="183" y="103" text-anchor="middle" font-size="13" fill="#b07818" font-weight="bold">1</text>
    <text x="241" y="103" text-anchor="middle" font-size="13" fill="#999">0</text>
    <circle cx="299" cy="98" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="299" y="103" text-anchor="middle" font-size="13" fill="#b07818" font-weight="bold">1</text>
    <text x="357" y="103" text-anchor="middle" font-size="13" fill="#999">0</text>
    <text x="204" y="95" font-size="10" fill="#b07818">o₁ = 1</text>
    <text x="320" y="95" font-size="10" fill="#b07818">o₂ = 3</text>
  </g>

  <!-- 左移箭头（虚线橙） -->
  <g filter="url(#rough2)">
    <path d="M 183 112 C 170 134, 152 154, 131 171" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrO)"/>
    <path d="M 299 112 C 286 134, 268 154, 247 171" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrO)"/>
    <text x="143" y="140" font-size="13" fill="#b07818" font-weight="bold">①</text>
    <text x="259" y="140" font-size="13" fill="#b07818" font-weight="bold">②</text>
  </g>

  <!-- 右侧约束说明框 -->
  <g filter="url(#rough2)">
    <rect x="404" y="96" width="108" height="66" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="458" y="116" text-anchor="middle" font-size="10.5" fill="#33506b">'1' 只能左移</text>
    <text x="458" y="133" text-anchor="middle" font-size="10.5" fill="#33506b">不可互相穿越</text>
    <text x="458" y="150" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">⟹ q&#8202;j ≤ o&#8202;j</text>
  </g>

  <!-- 行标签：最优 -->
  <text x="52" y="200" text-anchor="middle" font-size="13" fill="#666" font-weight="bold" filter="url(#rough2)">最优</text>

  <!-- 行 B：格子（落点格绿色） -->
  <g filter="url(#rough2)">
    <rect x="96" y="176" width="58" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <rect x="154" y="176" width="58" height="38" rx="4" fill="#f5f5f5" stroke="#aaa" stroke-width="1.2"/>
    <rect x="212" y="176" width="58" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <rect x="270" y="176" width="58" height="38" rx="4" fill="#f5f5f5" stroke="#aaa" stroke-width="1.2"/>
    <rect x="328" y="176" width="58" height="38" rx="4" fill="#f5f5f5" stroke="#aaa" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)">
    <text x="125" y="201" text-anchor="middle" font-size="15" fill="#2f5d24" font-weight="bold">2</text>
    <text x="183" y="201" text-anchor="middle" font-size="15" fill="#999">1</text>
    <text x="241" y="201" text-anchor="middle" font-size="15" fill="#2f5d24" font-weight="bold">5</text>
    <text x="299" y="201" text-anchor="middle" font-size="15" fill="#999">2</text>
    <text x="357" y="201" text-anchor="middle" font-size="15" fill="#999">3</text>
  </g>

  <!-- 行 B：s 字符与 q 标注 -->
  <g filter="url(#rough2)">
    <text x="125" y="234" text-anchor="middle" font-size="13" fill="#b07818" font-weight="bold">1</text>
    <text x="183" y="234" text-anchor="middle" font-size="13" fill="#999">0</text>
    <text x="241" y="234" text-anchor="middle" font-size="13" fill="#b07818" font-weight="bold">1</text>
    <text x="299" y="234" text-anchor="middle" font-size="13" fill="#999">0</text>
    <text x="357" y="234" text-anchor="middle" font-size="13" fill="#999">0</text>
    <text x="125" y="252" text-anchor="middle" font-size="10" fill="#2f5d24">q₁ = 0</text>
    <text x="241" y="252" text-anchor="middle" font-size="10" fill="#2f5d24">q₂ = 2</text>
  </g>

  <!-- 右侧得分框 -->
  <g filter="url(#rough2)">
    <rect x="404" y="176" width="108" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="458" y="198" text-anchor="middle" font-size="11" fill="#2f5d24">落点 {0, 2}</text>
    <text x="458" y="222" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold">2 + 5 = 7</text>
  </g>

  <!-- 底部贪心总结框 -->
  <g filter="url(#rough2)">
    <rect x="30" y="264" width="460" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="260" y="286" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold">堆贪心：从左到右扫，nums[i] 入大根堆，扫到 '1' 就弹堆顶</text>
    <text x="260" y="306" text-anchor="middle" font-size="11.5" fill="#8a6d1f">i = 1 弹出 2（落点 0），i = 3 弹出 5（落点 2）</text>
    <text x="260" y="326" text-anchor="middle" font-size="11.5" fill="#8a6d1f">ans = 2 + 5 = 7，对应最终串 "10100"</text>
  </g>
</svg>
