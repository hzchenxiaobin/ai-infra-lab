<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="760" height="320" fill="#fdfcf7"/>

  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：words = ["aba","aabb","abcd","bac","aabc"] → 2</text>
  <path d="M 220 36 Q 380 44 540 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table -->
  <!-- columns: x0=60
       i  60-100 (w40)
       words[i] 100-200 (w100)
       集合(掩码) 200-330 (w130)
       cnt(前) 330-420 (w90)
       ans增量 420-520 (w100)
       ans 520-600 (w80)
       cnt(后) 600-700 (w100) -->

  <!-- header -->
  <g filter="url(#sk)"><rect x="60" y="56" width="640" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="80" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">i</text>
  <text x="150" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">words[i]</text>
  <text x="265" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">字符集合(掩码)</text>
  <text x="375" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">cnt(前)</text>
  <text x="470" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">ans 增量</text>
  <text x="560" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">ans</text>
  <text x="650" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">cnt(后)</text>

  <!-- vertical separators -->
  <line x1="100" y1="56" x2="100" y2="252" stroke="#9e9e9e" stroke-width="0.8" filter="url(#sk)"/>
  <line x1="200" y1="56" x2="200" y2="252" stroke="#9e9e9e" stroke-width="0.8" filter="url(#sk)"/>
  <line x1="330" y1="56" x2="330" y2="252" stroke="#9e9e9e" stroke-width="0.8" filter="url(#sk)"/>
  <line x1="420" y1="56" x2="420" y2="252" stroke="#9e9e9e" stroke-width="0.8" filter="url(#sk)"/>
  <line x1="520" y1="56" x2="520" y2="252" stroke="#9e9e9e" stroke-width="0.8" filter="url(#sk)"/>
  <line x1="600" y1="56" x2="600" y2="252" stroke="#9e9e9e" stroke-width="0.8" filter="url(#sk)"/>

  <!-- row 0: i=0 "aba" {a,b} 0 +0 0 1 -->
  <g filter="url(#sk)"><rect x="60" y="88" width="640" height="32" rx="2" fill="#ffffff" stroke="#cfcfcf" stroke-width="0.8"/></g>
  <text x="80" y="109" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">0</text>
  <text x="150" y="109" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">"aba"</text>
  <text x="265" y="109" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#sk)">{a, b}</text>
  <text x="375" y="109" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">0</text>
  <text x="470" y="109" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">+0</text>
  <text x="560" y="109" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">0</text>
  <text x="650" y="109" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">1</text>

  <!-- row 1: i=1 "aabb" {a,b} 1 +1 1 2  HIGHLIGHT -->
  <g filter="url(#sk)"><rect x="60" y="120" width="640" height="32" rx="2" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="80" y="141" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">1</text>
  <text x="150" y="141" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">"aabb"</text>
  <text x="265" y="141" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">{a, b}</text>
  <text x="375" y="141" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">1</text>
  <text x="470" y="141" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">+1 ✓</text>
  <text x="560" y="141" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">1</text>
  <text x="650" y="141" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">2</text>

  <!-- row 2: i=2 "abcd" {a,b,c,d} 0 +0 1 1 -->
  <g filter="url(#sk)"><rect x="60" y="152" width="640" height="32" rx="2" fill="#ffffff" stroke="#cfcfcf" stroke-width="0.8"/></g>
  <text x="80" y="173" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">2</text>
  <text x="150" y="173" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">"abcd"</text>
  <text x="265" y="173" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">{a, b, c, d}</text>
  <text x="375" y="173" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">0</text>
  <text x="470" y="173" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">+0</text>
  <text x="560" y="173" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">1</text>
  <text x="650" y="173" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">1</text>

  <!-- row 3: i=3 "bac" {a,b,c} 0 +0 1 1 -->
  <g filter="url(#sk)"><rect x="60" y="184" width="640" height="32" rx="2" fill="#ffffff" stroke="#cfcfcf" stroke-width="0.8"/></g>
  <text x="80" y="205" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">3</text>
  <text x="150" y="205" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">"bac"</text>
  <text x="265" y="205" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#sk)">{a, b, c}</text>
  <text x="375" y="205" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">0</text>
  <text x="470" y="205" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">+0</text>
  <text x="560" y="205" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">1</text>
  <text x="650" y="205" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">1</text>

  <!-- row 4: i=4 "aabc" {a,b,c} 1 +1 2 2  HIGHLIGHT -->
  <g filter="url(#sk)"><rect x="60" y="216" width="640" height="32" rx="2" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="80" y="237" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">4</text>
  <text x="150" y="237" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">"aabc"</text>
  <text x="265" y="237" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">{a, b, c}</text>
  <text x="375" y="237" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">1</text>
  <text x="470" y="237" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">+1 ✓</text>
  <text x="560" y="237" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">2</text>
  <text x="650" y="237" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">2</text>

  <!-- bottom outer border -->
  <rect x="60" y="56" width="640" height="192" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>

  <!-- summary note -->
  <g filter="url(#sk)"><rect x="60" y="266" width="640" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="380" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">两次增量来自 {a,b} 组(i=1) 与 {a,b,c} 组(i=4)，各 C(2,2)=1</text>
  <text x="380" y="300" text-anchor="middle" font-size="10" fill="#7a5415" filter="url(#sk)">高亮行 = 当前串与已入表的同掩码串配成对的时刻</text>
</svg>
