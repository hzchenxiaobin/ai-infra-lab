<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="460" height="560" fill="#fafafa"/>

  <text x="230" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">用邮票贴满网格图：算法流程</text>

  <g filter="url(#rough2)">
    <!-- Step 1 -->
    <rect x="90" y="46" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="230" y="73" text-anchor="middle" font-size="13" fill="#2b2b2b">① 建 grid 二维前缀和 pre</text>

    <!-- Step 2 -->
    <rect x="90" y="114" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="230" y="135" text-anchor="middle" font-size="13" fill="#2b2b2b">② 枚举合法左上角 (i,j)</text>
    <text x="230" y="151" text-anchor="middle" font-size="11" fill="#888">i+H ≤ m 且 j+W ≤ n</text>

    <!-- Diamond -->
    <polygon points="230,178 340,222 230,266 120,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="230" y="218" text-anchor="middle" font-size="12" fill="#2b2b2b">矩形和</text>
    <text x="230" y="234" text-anchor="middle" font-size="12" fill="#2b2b2b">== 0 ?</text>

    <!-- Yes branch -->
    <rect x="40" y="300" width="170" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="125" y="322" text-anchor="middle" font-size="12" fill="#2b2b2b">是：差分数组</text>
    <text x="125" y="338" text-anchor="middle" font-size="12" fill="#4a7a3a">打 4 个标记</text>

    <!-- No branch -->
    <rect x="250" y="300" width="170" height="50" fill="#f4f4f4" stroke="#888888" stroke-width="1.6" rx="8"/>
    <text x="335" y="322" text-anchor="middle" font-size="12" fill="#2b2b2b">否：跳过</text>
    <text x="335" y="338" text-anchor="middle" font-size="11" fill="#888">（此位置不放）</text>

    <!-- Step 4 -->
    <rect x="90" y="376" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="230" y="403" text-anchor="middle" font-size="13" fill="#2b2b2b">③ 对 d 二维前缀和 → coverage</text>

    <!-- Diamond 2 -->
    <polygon points="230,438 360,478 230,518 100,478" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="230" y="474" text-anchor="middle" font-size="12" fill="#2b2b2b">空格 coverage==0 ?</text>
    <text x="230" y="490" text-anchor="middle" font-size="11" fill="#888">（遍历所有 grid==0）</text>
  </g>

  <!-- arrows -->
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.5" fill="none">
    <path d="M230,90 L230,112" marker-end="url(#arr)"/>
    <path d="M230,158 L230,176" marker-end="url(#arr)"/>
    <path d="M170,244 Q120,270 125,298" marker-end="url(#arr)"/>
    <text x="150" y="272" font-size="11" fill="#4a7a3a">是</text>
    <path d="M290,244 Q340,270 335,298" marker-end="url(#arr)"/>
    <text x="318" y="272" font-size="11" fill="#888">否</text>
    <path d="M125,352 Q160,365 200,374" marker-end="url(#arr)"/>
    <path d="M230,420 L230,436" marker-end="url(#arr)"/>
  </g>

  <!-- final outputs -->
  <g filter="url(#rough2)">
    <rect x="20" y="528" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <text x="80" y="546" text-anchor="middle" font-size="12" fill="#b85450">是 → false</text>
    <rect x="320" y="528" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="380" y="546" text-anchor="middle" font-size="12" fill="#4a7a3a">否 → true</text>
  </g>
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.4" fill="none">
    <path d="M170,498 Q120,515 100,526" marker-end="url(#arr)"/>
    <text x="120" y="514" font-size="11" fill="#b85450">是</text>
    <path d="M290,498 Q340,515 360,526" marker-end="url(#arr)"/>
    <text x="340" y="514" font-size="11" fill="#4a7a3a">否</text>
  </g>
</svg>
