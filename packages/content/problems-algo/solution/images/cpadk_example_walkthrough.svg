<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums=[3,2,1,5,4], k=2</text>

  <!-- Header row: step / x / cnt before / hit / ans -->
  <rect x="30" y="48" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="60" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步骤</text>
  <rect x="90" y="48" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="115" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">x</text>
  <rect x="140" y="48" width="240" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">查 cnt[x±k]（命中标 ✓）</text>
  <rect x="380" y="48" width="140" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="450" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">登记后 cnt</text>
  <rect x="520" y="48" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="560" y="66" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans</text>

  <!-- Row 1: x=3 -->
  <rect x="30" y="78" width="60" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="99" text-anchor="middle" font-size="11" fill="#333">i=0</text>
  <rect x="90" y="78" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="99" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="140" y="78" width="240" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="260" y="99" text-anchor="middle" font-size="10" fill="#888">cnt[5]+cnt[1] = 0+0 = 0</text>
  <rect x="380" y="78" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="450" y="99" text-anchor="middle" font-size="10" fill="#333">{3:1}</text>
  <rect x="520" y="78" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="560" y="99" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>

  <!-- Row 2: x=2 -->
  <rect x="30" y="114" width="60" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="135" text-anchor="middle" font-size="11" fill="#333">i=1</text>
  <rect x="90" y="114" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="135" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="140" y="114" width="240" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="260" y="135" text-anchor="middle" font-size="10" fill="#888">cnt[4]+cnt[0] = 0+0 = 0</text>
  <rect x="380" y="114" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="450" y="135" text-anchor="middle" font-size="10" fill="#333">{3:1, 2:1}</text>
  <rect x="520" y="114" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="560" y="135" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>

  <!-- Row 3: x=1 HIT -->
  <rect x="30" y="150" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="60" y="171" text-anchor="middle" font-size="11" fill="#333">i=2</text>
  <rect x="90" y="150" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="171" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="140" y="150" width="240" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="260" y="171" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">cnt[3]+cnt[−1] = 1+0 = 1 ✓</text>
  <rect x="380" y="150" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="450" y="171" text-anchor="middle" font-size="10" fill="#333">{3:1, 2:1, 1:1}</text>
  <rect x="520" y="150" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="560" y="171" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <!-- Row 4: x=5 HIT -->
  <rect x="30" y="186" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="60" y="207" text-anchor="middle" font-size="11" fill="#333">i=3</text>
  <rect x="90" y="186" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="207" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="140" y="186" width="240" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="260" y="207" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">cnt[7]+cnt[3] = 0+1 = 1 ✓</text>
  <rect x="380" y="186" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="450" y="207" text-anchor="middle" font-size="10" fill="#333">{3:1,2:1,1:1,5:1}</text>
  <rect x="520" y="186" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="560" y="207" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>

  <!-- Row 5: x=4 HIT -->
  <rect x="30" y="222" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="60" y="243" text-anchor="middle" font-size="11" fill="#333">i=4</text>
  <rect x="90" y="222" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="243" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="140" y="222" width="240" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="260" y="243" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">cnt[6]+cnt[2] = 0+1 = 1 ✓</text>
  <rect x="380" y="222" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="450" y="243" text-anchor="middle" font-size="10" fill="#333">{3:1,2:1,1:1,5:1,4:1}</text>
  <rect x="520" y="222" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="560" y="243" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>

  <!-- pairs list -->
  <rect x="30" y="284" width="570" height="92" fill="#fafafa" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" rx="6" filter="url(#rough2)"/>
  <text x="40" y="306" font-size="11" fill="#666" font-weight="bold">命中的三对（均满足 i&lt;j）：</text>
  <text x="40" y="328" font-size="11" fill="#333">• i=2 (x=1) ↔ 前面有 3 → 配对 (i=0, j=2)，|3−1|=2</text>
  <text x="40" y="348" font-size="11" fill="#333">• i=3 (x=5) ↔ 前面有 3 → 配对 (i=0, j=3)，|3−5|=2</text>
  <text x="40" y="368" font-size="11" fill="#333">• i=4 (x=4) ↔ 前面有 2 → 配对 (i=1, j=4)，|2−4|=2</text>

  <!-- result -->
  <rect x="170" y="392" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="420" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">最终 ans = 3 ⭐</text>
</svg>
