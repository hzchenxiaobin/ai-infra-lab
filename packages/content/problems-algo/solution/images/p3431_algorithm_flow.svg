<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：两趟线性扫描，O(n)</text>

  <rect x="222" y="36" width="76" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="53" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M260,62 L260,78" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="82" width="320" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="101" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">第一趟：扫描 nums，记录</text>
  <text x="260" y="119" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">first2 / first3 / last1 / last2（哨兵 n / n / −1 / −1）</text>

  <path d="M260,128 L260,146" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,150 378,192 260,234 142,192" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="196" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">first3 &lt; last1 ?</text>

  <path d="M378,192 L398,192" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="386" y="184" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="404" y="176" width="84" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="446" y="196" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 −1</text>

  <path d="M260,234 L260,252" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="248" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="85" y="256" width="350" height="62" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">第二趟：扫描 locked，统计</text>
  <text x="260" y="294" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">first2 ≤ i &lt; last1 或 first3 ≤ i &lt; last2</text>
  <text x="260" y="310" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">且 locked[i] = 1 的下标个数 ans</text>

  <path d="M260,318 L260,330" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="334" width="220" height="24" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="350" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">返回 ans（最小解锁次数）</text>
</svg>
