<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    算法流程：构造 O(n) / 查询 O(log n)
  </text>

  <!-- 构造阶段 -->
  <rect x="30" y="50" width="230" height="340" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="145" y="74" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">构造 RangeFreqQuery(arr)</text>

  <rect x="50" y="90" width="190" height="40" fill="#fafafa" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="145" y="108" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">遍历 i = 0 → n−1</text>
  <text x="145" y="123" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">pos[arr[i]].push_back(i)</text>

  <path d="M145,132 L145,150" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <rect x="50" y="152" width="190" height="56" fill="#fafafa" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="145" y="172" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">下标按 i 递增追加</text>
  <text x="145" y="188" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">→ 每个列表天然升序</text>
  <text x="145" y="202" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">无需额外排序</text>

  <path d="M145,210 L145,228" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <rect x="50" y="230" width="190" height="40" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="145" y="248" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">得到 pos 表</text>
  <text x="145" y="263" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">value → [下标...]</text>

  <path d="M145,272 L145,290" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <rect x="50" y="292" width="190" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="145" y="310" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">时间 O(n)，空间 O(n)</text>
  <text x="145" y="325" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">下标总数恰为 n</text>

  <text x="145" y="360" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">构造只做一次</text>
  <text x="145" y="376" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">支撑后续所有查询</text>

  <!-- 查询阶段 -->
  <rect x="290" y="50" width="250" height="340" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="415" y="74" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">query(left, right, value)</text>

  <rect x="310" y="90" width="210" height="40" fill="#fafafa" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="415" y="108" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">查 pos 是否含 value</text>
  <text x="415" y="123" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">不含 → 直接返回 0</text>

  <path d="M415,132 L415,150" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- 菱形：列表存在？ -->
  <polygon points="415,154 480,190 415,226 350,190" fill="#fafafa" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="415" y="186" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">idx 列表</text>
  <text x="415" y="200" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">非空？</text>

  <!-- 否分支 -->
  <path d="M350,190 L300,190 L300,250" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="306" y="184" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="266" y="252" width="68" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="273" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">return 0</text>

  <!-- 是分支 -->
  <path d="M415,226 L415,244" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="423" y="240" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="310" y="246" width="210" height="56" fill="#fafafa" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="415" y="264" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">两次二分（列表升序）</text>
  <text x="415" y="280" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">lo = lower_bound(idx, left)</text>
  <text x="415" y="294" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">hi = upper_bound(idx, right)</text>

  <path d="M415,304 L415,322" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <rect x="310" y="324" width="210" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="415" y="342" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">return hi − lo</text>
  <text x="415" y="357" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">[lo, hi) 即落在 [left,right] 内</text>

  <text x="415" y="378" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">单次查询 O(log n)</text>
</svg>
