<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L8,0 L4,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="25" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：Thread B(third) 先到达</text>

  <text x="30" y="55" font-size="11" fill="#888" font-weight="bold">时刻</text>
  <text x="110" y="55" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Thread B (third)</text>
  <text x="280" y="55" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">Thread C (second)</text>
  <text x="430" y="55" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Thread A (first)</text>
  <text x="520" y="55" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">stage</text>

  <line x1="20" y1="62" x2="540" y2="62" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="30" y="82" font-size="11" fill="#555">t1</text>
  <rect x="60" y="70" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="88" text-anchor="middle" font-size="10" fill="#333">调用 third()</text>
  <text x="520" y="88" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="430" y="88" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="280" y="88" text-anchor="middle" font-size="10" fill="#888">—</text>

  <text x="30" y="115" font-size="11" fill="#555">t2</text>
  <rect x="60" y="103" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="121" text-anchor="middle" font-size="10" fill="#b85450">stage&lt;3, 阻塞</text>
  <text x="520" y="121" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="230" y="103" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="121" text-anchor="middle" font-size="10" fill="#333">调用 second()</text>
  <text x="430" y="121" text-anchor="middle" font-size="10" fill="#888">—</text>

  <text x="30" y="148" font-size="11" fill="#555">t3</text>
  <text x="110" y="154" text-anchor="middle" font-size="10" fill="#888">阻塞中...</text>
  <rect x="230" y="136" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="154" text-anchor="middle" font-size="10" fill="#b85450">stage&lt;2, 阻塞</text>
  <rect x="380" y="136" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="430" y="154" text-anchor="middle" font-size="10" fill="#333">调用 first()</text>
  <text x="520" y="154" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <text x="30" y="181" font-size="11" fill="#555">t4</text>
  <text x="110" y="187" text-anchor="middle" font-size="10" fill="#888">阻塞中...</text>
  <text x="280" y="187" text-anchor="middle" font-size="10" fill="#888">阻塞中...</text>
  <rect x="380" y="169" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="430" y="187" text-anchor="middle" font-size="10" fill="#333">printFirst ✓</text>
  <text x="520" y="187" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <text x="30" y="214" font-size="11" fill="#555">t5</text>
  <text x="110" y="220" text-anchor="middle" font-size="10" fill="#888">阻塞中...</text>
  <text x="280" y="220" text-anchor="middle" font-size="10" fill="#888">阻塞中...</text>
  <rect x="380" y="202" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="430" y="220" text-anchor="middle" font-size="10" fill="#b85450">stage=2, notify</text>
  <text x="520" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <path d="M 430 228 L 430 245 Q 430 252 423 252 L 290 252 Q 283 252 283 245 L 283 232" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="355" y="248" text-anchor="middle" font-size="9" fill="#b85450">唤醒 C</text>

  <text x="30" y="265" font-size="11" fill="#555">t6</text>
  <text x="110" y="271" text-anchor="middle" font-size="10" fill="#888">阻塞中...</text>
  <rect x="230" y="253" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="271" text-anchor="middle" font-size="10" fill="#333">printSecond ✓</text>
  <text x="430" y="271" text-anchor="middle" font-size="10" fill="#888">完成</text>
  <text x="520" y="271" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <text x="30" y="298" font-size="11" fill="#555">t7</text>
  <text x="110" y="304" text-anchor="middle" font-size="10" fill="#888">阻塞中...</text>
  <rect x="230" y="286" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="10" fill="#b85450">stage=3, notify</text>
  <text x="430" y="304" text-anchor="middle" font-size="10" fill="#888">完成</text>
  <text x="520" y="304" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>

  <path d="M 283 312 L 283 329 Q 283 336 290 336 L 420 336 Q 427 336 427 329 L 427 316" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="355" y="332" text-anchor="middle" font-size="9" fill="#b85450">唤醒 B</text>

  <text x="30" y="352" font-size="11" fill="#555">t8</text>
  <rect x="60" y="340" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="358" text-anchor="middle" font-size="10" fill="#333">printThird ✓</text>
  <text x="280" y="358" text-anchor="middle" font-size="10" fill="#888">完成</text>
  <text x="430" y="358" text-anchor="middle" font-size="10" fill="#888">完成</text>
  <text x="520" y="358" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>

  <rect x="100" y="380" width="360" height="30" fill="#e6f4ea" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="400" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">输出：firstsecondthird ✓</text>
</svg>
