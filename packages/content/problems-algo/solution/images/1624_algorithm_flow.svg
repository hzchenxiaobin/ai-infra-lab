<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：单趟扫描 + 首次下标表</text>

  <!-- Start -->
  <ellipse cx="270" cy="58" rx="44" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">开始</text>

  <path d="M 270 76 L 270 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init box -->
  <rect x="170" y="94" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="115" text-anchor="middle" font-size="12" fill="#333">ans = −1, first = 空表</text>

  <path d="M 270 128 L 270 146" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: more chars? -->
  <polygon points="270,148 380,194 270,240 160,194" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="190" text-anchor="middle" font-size="12" fill="#333">还有字符 s[i]?</text>
  <text x="270" y="206" text-anchor="middle" font-size="10" fill="#888">(i 从 0 遍历到 n−1)</text>

  <!-- No branch -> return -->
  <path d="M 380 194 L 440 194 L 440 256" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="394" y="186" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="378" y="258" width="124" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="279" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 ans</text>

  <!-- Yes branch -> char seen? -->
  <path d="M 160 194 L 110 194 L 110 252" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="186" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Decision: c in first? -->
  <polygon points="110,254 200,296 110,338 20,296" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="293" text-anchor="middle" font-size="11" fill="#333">first 含 s[i]?</text>
  <text x="110" y="308" text-anchor="middle" font-size="10" fill="#888">字符曾出现</text>

  <!-- Yes: update ans -->
  <path d="M 200 296 L 250 296 L 250 326" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="288" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="170" y="328" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#333">d = i − first[s[i]] − 1</text>
  <text x="280" y="362" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans = max(ans, d)</text>

  <!-- No: record first -->
  <path d="M 20 296 L 20 340" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="32" y="320" font-size="11" fill="#999" font-weight="bold">否</text>
  <rect x="-30" y="342" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="362" text-anchor="middle" font-size="11" fill="#333">first[s[i]] = i</text>

  <!-- Loop back arrows -->
  <path d="M 390 350 L 440 350 L 440 194" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="276" font-size="9" fill="#4a7a3a">循环</text>
  <path d="M 110 372 L 110 392 L 440 392 L 440 350" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <!-- Legend -->
  <rect x="360" y="408" width="170" height="42" fill="#fff" stroke="#eee" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="368" y="424" font-size="10" fill="#888" font-weight="bold">图例</text>
  <rect x="368" y="430" width="14" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="388" y="439" font-size="10" fill="#555">处理动作</text>
  <polygon points="460,428 480,428 470,440" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="486" y="439" font-size="10" fill="#555">判定分支</text>

  <!-- Bottom note -->
  <rect x="20" y="408" width="200" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="32" y="426" font-size="10" fill="#d6a040" font-weight="bold">注意</text>
  <text x="32" y="440" font-size="10" fill="#555">first 只在首次出现时写入，之后只读不覆盖</text>
</svg>
