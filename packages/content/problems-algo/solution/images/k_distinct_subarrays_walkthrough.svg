<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,2,1,2,3],  atMost(2)</text>

  <!-- 5 panels: width 112, gap 6, start x=8 -->
  <!-- Panel 0: right=0 -->
  <rect x="8" y="40" width="112" height="300" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="8" y="40" width="112" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="64" y="59" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">right=0</text>
  <!-- cells: 1(in,blue) 2 1 2 3 -->
  <rect x="19" y="80" width="18" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="28" y="94" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
  <rect x="37" y="80" width="18" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="46" y="94" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <rect x="55" y="80" width="18" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="64" y="94" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <rect x="73" y="80" width="18" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="82" y="94" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <rect x="91" y="80" width="18" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="94" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="64" y="140" text-anchor="middle" font-size="10" fill="#888">种类：</text>
  <text x="64" y="156" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="64" y="180" text-anchor="middle" font-size="10" fill="#888">≤2？</text>
  <text x="64" y="196" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">✓</text>
  <text x="64" y="222" text-anchor="middle" font-size="9.5" fill="#888">+1</text>
  <rect x="22" y="232" width="84" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="64" y="251" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">total=1</text>
  <text x="64" y="280" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">窗口 [1]</text>
  <text x="64" y="294" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">left=0</text>

  <!-- Panel 1: right=1 -->
  <rect x="126" y="40" width="112" height="300" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="126" y="40" width="112" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="182" y="59" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">right=1</text>
  <rect x="137" y="80" width="18" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="146" y="94" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
  <rect x="155" y="80" width="18" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="164" y="94" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="173" y="80" width="18" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="182" y="94" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <rect x="191" y="80" width="18" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="94" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <rect x="209" y="80" width="18" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="218" y="94" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="182" y="140" text-anchor="middle" font-size="10" fill="#888">种类：</text>
  <text x="182" y="156" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="182" y="180" text-anchor="middle" font-size="10" fill="#888">≤2？</text>
  <text x="182" y="196" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">✓</text>
  <text x="182" y="222" text-anchor="middle" font-size="9.5" fill="#888">+2</text>
  <rect x="140" y="232" width="84" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="182" y="251" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">total=3</text>
  <text x="182" y="280" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">窗口 [1,2]</text>
  <text x="182" y="294" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">left=0</text>

  <!-- Panel 2: right=2 -->
  <rect x="244" y="40" width="112" height="300" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="244" y="40" width="112" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="59" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">right=2</text>
  <rect x="255" y="80" width="18" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="264" y="94" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
  <rect x="273" y="80" width="18" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="282" y="94" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="291" y="80" width="18" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="300" y="94" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
  <rect x="309" y="80" width="18" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="318" y="94" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <rect x="327" y="80" width="18" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="336" y="94" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="300" y="140" text-anchor="middle" font-size="10" fill="#888">种类：</text>
  <text x="300" y="156" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="300" y="180" text-anchor="middle" font-size="10" fill="#888">≤2？</text>
  <text x="300" y="196" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">✓</text>
  <text x="300" y="222" text-anchor="middle" font-size="9.5" fill="#888">+3</text>
  <rect x="258" y="232" width="84" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="251" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">total=6</text>
  <text x="300" y="280" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">窗口 [1,2,1]</text>
  <text x="300" y="294" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">left=0</text>

  <!-- Panel 3: right=3 -->
  <rect x="362" y="40" width="112" height="300" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="362" y="40" width="112" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="418" y="59" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">right=3</text>
  <rect x="373" y="80" width="18" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="382" y="94" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
  <rect x="391" y="80" width="18" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="400" y="94" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="409" y="80" width="18" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="418" y="94" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
  <rect x="427" y="80" width="18" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="436" y="94" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="445" y="80" width="18" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="454" y="94" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="418" y="140" text-anchor="middle" font-size="10" fill="#888">种类：</text>
  <text x="418" y="156" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <text x="418" y="180" text-anchor="middle" font-size="10" fill="#888">≤2？</text>
  <text x="418" y="196" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">✓</text>
  <text x="418" y="222" text-anchor="middle" font-size="9.5" fill="#888">+4</text>
  <rect x="376" y="232" width="84" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="418" y="251" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">total=10</text>
  <text x="418" y="280" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">窗口[1,2,1,2]</text>
  <text x="418" y="294" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">left=0</text>

  <!-- Panel 4: right=4 (shrink!) -->
  <rect x="480" y="40" width="112" height="300" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <rect x="480" y="40" width="112" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="536" y="59" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">right=4 ★</text>
  <!-- array: left moves to 3, window [3,4]=[2,3] -->
  <rect x="491" y="80" width="18" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="500" y="94" text-anchor="middle" font-size="9" fill="#bbb">1</text>
  <rect x="509" y="80" width="18" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="518" y="94" text-anchor="middle" font-size="9" fill="#bbb">2</text>
  <rect x="527" y="80" width="18" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="536" y="94" text-anchor="middle" font-size="9" fill="#bbb">1</text>
  <rect x="545" y="80" width="18" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="554" y="94" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="563" y="80" width="18" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="572" y="94" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">3</text>
  <text x="536" y="140" text-anchor="middle" font-size="10" fill="#888">种类：</text>
  <text x="536" y="156" text-anchor="middle" font-size="11" fill="#b85450">3→</text>
  <text x="536" y="172" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <text x="536" y="190" text-anchor="middle" font-size="9" fill="#b85450">缩left!</text>
  <text x="536" y="208" text-anchor="middle" font-size="9.5" fill="#888">+2</text>
  <rect x="494" y="232" width="84" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="536" y="251" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">total=12</text>
  <text x="536" y="280" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">窗口 [2,3]</text>
  <text x="536" y="294" text-anchor="middle" font-size="9" fill="#d6a040" font-style="italic">left=0→3</text>

  <!-- Bottom summary -->
  <rect x="8" y="356" width="584" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="378" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">atMost(2) = 12，同理 atMost(1) = 5</text>
  <text x="300" y="398" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = atMost(2) − atMost(1) = 12 − 5 = 7 ✓</text>
  <text x="300" y="416" text-anchor="middle" font-size="10.5" fill="#888">每次 right 固定后，以 right 结尾的合法子数组有 right−left+1 个</text>
</svg>
