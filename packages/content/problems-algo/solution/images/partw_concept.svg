<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：改一个元素，把平衡条件拆成两个目标</text>
  <text x="300" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">pivot p 处 leftSum == rightSum；改动 nums[i] 落在哪侧，目标就不同</text>

  <!-- Array cells row -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="60" y="80" font-size="10" fill="#888">下标</text>
    <text x="110" y="80" font-size="10" fill="#888">0</text>
    <text x="170" y="80" font-size="10" fill="#888">…</text>
    <text x="230" y="80" font-size="10" fill="#888">p-1</text>
    <text x="290" y="80" font-size="10" fill="#b85450" font-weight="bold">p</text>
    <text x="350" y="80" font-size="10" fill="#888">…</text>
    <text x="410" y="80" font-size="10" fill="#888">n-1</text>

    <!-- left part (blue) -->
    <rect x="86" y="92" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="108" y="112" fill="#446688" font-weight="bold">nums[0]</text>
    <rect x="146" y="92" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="168" y="112" fill="#888">…</text>
    <rect x="206" y="92" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="228" y="112" fill="#446688" font-weight="bold" font-size="10">nums[p-1]</text>
    <!-- right part (green) -->
    <rect x="266" y="92" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="288" y="112" fill="#4a7a3a" font-weight="bold" font-size="10">nums[p]</text>
    <rect x="326" y="92" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="348" y="112" fill="#888">…</text>
    <rect x="386" y="92" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="408" y="112" fill="#4a7a3a" font-weight="bold" font-size="10">nums[n-1]</text>
  </g>

  <!-- pivot divider -->
  <path d="M 264 86 L 264 130" stroke="#b85450" stroke-width="2.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="264" y="78" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">pivot p</text>

  <!-- braces + sums -->
  <path d="M 86 128 L 86 134 L 250 134 L 250 128" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="168" y="150" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">leftSum = prefix[p]</text>
  <path d="M 266 128 L 266 134 L 430 134 L 430 128" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="348" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">rightSum = S − prefix[p]</text>

  <!-- balance box -->
  <rect x="150" y="164" width="300" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="186" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">不改：prefix[p] == S − prefix[p]  ⇔  2·prefix[p] == S</text>

  <!-- divider -->
  <line x1="40" y1="214" x2="560" y2="214" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="300" y="234" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">把 nums[i] 改成 k，delta d = k − nums[i]</text>

  <!-- Case A: i < p (i 在左) -->
  <rect x="40" y="250" width="270" height="124" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="175" y="272" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">情况 A：i &lt; p（改动落在左半）</text>
  <text x="175" y="294" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">新 leftSum = prefix[p] + d</text>
  <text x="175" y="312" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">rightSum 不变 = S − prefix[p]</text>
  <text x="175" y="332" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">平衡 → prefix[p] + d == S − prefix[p]</text>
  <rect x="70" y="342" width="210" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="175" y="360" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">目标：prefix[p] == (S − d) / 2</text>

  <!-- Case B: i >= p (i 在右) -->
  <rect x="330" y="250" width="270" height="124" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="465" y="272" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">情况 B：i ≥ p（改动落在右半）</text>
  <text x="465" y="294" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">leftSum 不变 = prefix[p]</text>
  <text x="465" y="312" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">新 rightSum = S + d − prefix[p]</text>
  <text x="465" y="332" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">平衡 → prefix[p] == S + d − prefix[p]</text>
  <rect x="360" y="342" width="210" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="465" y="360" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">目标：prefix[p] == (S + d) / 2</text>

  <!-- bottom note -->
  <rect x="40" y="388" width="520" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="406" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">改动位置 i 把 pivots 切成两段：p ∈ [1, i] 查目标 (S+d)/2，p ∈ (i, n−1] 查目标 (S−d)/2</text>
  <text x="300" y="421" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i 从左扫到右，用两张哈希表维护两侧 pivot 计数即可 O(1) 查</text>
</svg>
