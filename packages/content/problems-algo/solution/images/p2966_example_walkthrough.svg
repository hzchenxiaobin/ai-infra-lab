<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="450" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：一次成功，一次「看似能行」的失败</text>

  <!-- ===== 示例 1 ===== -->
  <text x="44" y="52" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：nums = [1,3,4,8,7,9,3,5,1]，k = 2</text>
  <text x="476" y="52" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">排序后：</text>

  <!-- 排序后 9 格分 3 组 -->
  <rect x="52" y="62" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="72" y="83" text-anchor="middle" font-size="12.5" fill="#334" filter="url(#rough2)">1</text>
  <rect x="92" y="62" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="112" y="83" text-anchor="middle" font-size="12.5" fill="#334" filter="url(#rough2)">1</text>
  <rect x="132" y="62" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="152" y="83" text-anchor="middle" font-size="12.5" fill="#334" filter="url(#rough2)">3</text>

  <rect x="192" y="62" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="212" y="83" text-anchor="middle" font-size="12.5" fill="#2f5d24" filter="url(#rough2)">3</text>
  <rect x="232" y="62" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="252" y="83" text-anchor="middle" font-size="12.5" fill="#2f5d24" filter="url(#rough2)">4</text>
  <rect x="272" y="62" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="292" y="83" text-anchor="middle" font-size="12.5" fill="#2f5d24" filter="url(#rough2)">5</text>

  <rect x="332" y="62" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="352" y="83" text-anchor="middle" font-size="12.5" fill="#8a6d3b" filter="url(#rough2)">7</text>
  <rect x="372" y="62" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="392" y="83" text-anchor="middle" font-size="12.5" fill="#8a6d3b" filter="url(#rough2)">8</text>
  <rect x="412" y="62" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="432" y="83" text-anchor="middle" font-size="12.5" fill="#8a6d3b" filter="url(#rough2)">9</text>

  <text x="112" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3−1=2 ≤ 2 ✓</text>
  <text x="252" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5−3=2 ≤ 2 ✓</text>
  <text x="392" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9−7=2 ≤ 2 ✓</text>

  <path d="M 260 118 L 260 130" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="128" y="134" width="264" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="154" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">输出 [[1,1,3],[3,4,5],[7,8,9]]</text>

  <!-- divider -->
  <path d="M 60 182 L 460 182" stroke="#ccc" stroke-width="1.2" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- ===== 示例 2 ===== -->
  <text x="44" y="208" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 2：nums = [2,4,2,2,5,2]，k = 2</text>
  <text x="476" y="208" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">排序后：</text>

  <rect x="92" y="218" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="112" y="239" text-anchor="middle" font-size="12.5" fill="#334" filter="url(#rough2)">2</text>
  <rect x="132" y="218" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="152" y="239" text-anchor="middle" font-size="12.5" fill="#334" filter="url(#rough2)">2</text>
  <rect x="172" y="218" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="192" y="239" text-anchor="middle" font-size="12.5" fill="#334" filter="url(#rough2)">2</text>

  <rect x="252" y="218" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="272" y="239" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">2</text>
  <rect x="292" y="218" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="312" y="239" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">4</text>
  <rect x="332" y="218" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="239" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>

  <text x="152" y="266" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2−2=0 ≤ 2 ✓</text>
  <text x="322" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">5−2=3 &gt; 2 ✗</text>

  <path d="M 322 274 L 322 288" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="200" y="292" width="244" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="322" y="312" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 [ ]（第二组首尾差超标）</text>

  <!-- bottom note -->
  <rect x="36" y="336" width="448" height="98" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="360" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">为什么示例 2 一定无解：四个 2 平分给两组，每组还得再收一个</text>
  <text x="260" y="382" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">「大数」（4 或 5）——含 2 的组装不下 5（差 3 &gt; k），</text>
  <text x="260" y="404" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">但另一组只剩 {2,4,5} 一种收法，极差 3 依然超标；</text>
  <text x="260" y="426" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">这正是鸽笼论证的 j=0 情形：垫背名额只有 a[1]=4 一个</text>
</svg>
