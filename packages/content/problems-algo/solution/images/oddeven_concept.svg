<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：原地拆出奇、偶两条链，再首尾相接</text>

  <!-- ===== Row 1: original list 1->2->3->4->5->6 ===== -->
  <text x="40" y="60" font-size="11.5" fill="#888">原链表（蓝=奇数位，橙=偶数位）</text>

  <!-- node 1 odd -->
  <rect x="40" y="70" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="68" y="94" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="68" y="126" text-anchor="middle" font-size="9.5" fill="#446688">奇</text>
  <line x1="96" y1="89" x2="110" y2="89" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- node 2 even -->
  <rect x="112" y="70" width="56" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="140" y="94" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="140" y="126" text-anchor="middle" font-size="9.5" fill="#d6a040">偶</text>
  <line x1="168" y1="89" x2="182" y2="89" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- node 3 odd -->
  <rect x="184" y="70" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="212" y="94" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="212" y="126" text-anchor="middle" font-size="9.5" fill="#446688">奇</text>
  <line x1="240" y1="89" x2="254" y2="89" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- node 4 even -->
  <rect x="256" y="70" width="56" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="284" y="94" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <text x="284" y="126" text-anchor="middle" font-size="9.5" fill="#d6a040">偶</text>
  <line x1="312" y1="89" x2="326" y2="89" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- node 5 odd -->
  <rect x="328" y="70" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="356" y="94" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <text x="356" y="126" text-anchor="middle" font-size="9.5" fill="#446688">奇</text>
  <line x1="384" y1="89" x2="398" y2="89" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- node 6 even -->
  <rect x="400" y="70" width="56" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="428" y="94" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <text x="428" y="126" text-anchor="middle" font-size="9.5" fill="#d6a040">偶</text>

  <!-- split arrows -->
  <path d="M 68 140 Q 68 168 90 178" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 428 140 Q 428 168 406 178" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 2: two extracted chains ===== -->
  <text x="40" y="186" font-size="11.5" fill="#446688" font-weight="bold">奇数链 odd：</text>
  <rect x="118" y="174" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="143" y="196" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <line x1="168" y1="191" x2="184" y2="191" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="186" y="174" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="211" y="196" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <line x1="236" y1="191" x2="252" y2="191" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="254" y="174" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="279" y="196" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="316" y="196" font-size="11" fill="#446688">odd 指针跳着走</text>

  <text x="40" y="252" font-size="11.5" fill="#d6a040" font-weight="bold">偶数链 even：</text>
  <rect x="122" y="240" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="147" y="262" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="120" y="232" text-anchor="start" font-size="9" fill="#d6a040" font-weight="bold">evenHead</text>
  <line x1="172" y1="257" x2="188" y2="257" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="190" y="240" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="215" y="262" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <line x1="240" y1="257" x2="256" y2="257" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="258" y="240" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="283" y="262" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>

  <!-- connect arrow: odd tail -> evenHead -->
  <path d="M 279 214 Q 279 226 147 234" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="228" font-size="10.5" fill="#4a7a3a" font-weight="bold">odd.next = evenHead</text>

  <!-- ===== Row 3: result ===== -->
  <text x="40" y="318" font-size="11.5" fill="#4a7a3a" font-weight="bold">结果：奇链尾接偶链头</text>
  <!-- result nodes: 1 3 5 2 4 6 -->
  <rect x="40"  y="330" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="65"  y="352" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <line x1="90" y1="347" x2="106" y2="347" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="108" y="330" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="133" y="352" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <line x1="158" y1="347" x2="174" y2="347" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="176" y="330" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="201" y="352" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <!-- highlighted connecting arrow -->
  <line x1="226" y1="347" x2="244" y2="347" stroke="#4a7a3a" stroke-width="2.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="246" y="330" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="271" y="352" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <line x1="296" y1="347" x2="312" y2="347" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="314" y="330" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="339" y="352" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <line x1="364" y1="347" x2="380" y2="347" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="382" y="330" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="407" y="352" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>

  <rect x="40" y="384" width="460" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="270" y="403" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">全程只改 next 指针，O(1) 额外空间</text>
</svg>
