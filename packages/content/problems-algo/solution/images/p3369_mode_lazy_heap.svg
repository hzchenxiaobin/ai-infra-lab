<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">众数：freq 哈希 + 延迟删除堆（键 = (−freq, x)）</text>
  <text x="260" y="44" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">堆顶天然就是「freq 最大、同频取最小」；remove 只改哈希不动堆</text>

  <!-- 表头 -->
  <text x="34" y="76" font-size="11" fill="#666" filter="url(#rough2)">操作</text>
  <text x="128" y="76" font-size="11" fill="#666" filter="url(#rough2)">freq 哈希</text>
  <text x="268" y="76" font-size="11" fill="#666" filter="url(#rough2)">堆内容（堆顶在左）</text>

  <!-- 行1 -->
  <text x="34" y="104" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">add 4</text>
  <text x="128" y="104" font-size="10.5" fill="#333" filter="url(#rough2)">4→1</text>
  <rect x="268" y="90" width="62" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="299" y="105" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">(−1,4)</text>

  <!-- 行2 -->
  <text x="34" y="134" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">add 4</text>
  <text x="128" y="134" font-size="10.5" fill="#333" filter="url(#rough2)">4→2</text>
  <rect x="268" y="120" width="62" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="299" y="135" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">(−2,4)</text>
  <rect x="338" y="120" width="62" height="22" fill="#f4f4f4" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="369" y="135" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">(−1,4)</text>

  <!-- 行3 -->
  <text x="34" y="164" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">add 2, 3</text>
  <text x="128" y="164" font-size="10.5" fill="#333" filter="url(#rough2)">2→1, 3→1</text>
  <rect x="268" y="150" width="62" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="299" y="165" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">(−2,4)</text>
  <rect x="338" y="150" width="52" height="22" fill="#f4f4f4" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="364" y="165" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">(−1,2)</text>
  <rect x="398" y="150" width="52" height="22" fill="#f4f4f4" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="424" y="165" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">(−1,3)</text>

  <!-- 行4: getMode -->
  <rect x="24" y="180" width="472" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="34" y="200" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">getMode</text>
  <text x="128" y="200" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">堆顶 (−2,4)：−(−2)=2 == freq[4] ✓ 有效</text>
  <text x="440" y="200" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">→ 4</text>

  <!-- 行5: remove 4 -->
  <text x="34" y="234" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">remove 4</text>
  <text x="128" y="234" font-size="10.5" fill="#333" filter="url(#rough2)">4→1（堆不动！）</text>
  <rect x="268" y="220" width="62" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="299" y="235" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">(−2,4)</text>
  <text x="342" y="235" font-size="9.5" fill="#b85450" filter="url(#rough2)">← 已过期（freq 实为 1）</text>

  <!-- 行6: getMode 弹过期 -->
  <rect x="24" y="250" width="472" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="34" y="270" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">getMode</text>
  <text x="128" y="270" font-size="10.5" fill="#b85450" filter="url(#rough2)">堆顶 (−2,4)：2 ≠ freq[4]=1 ✗ 弹出！</text>
  <text x="128" y="292" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">新顶 (−1,2)：1 == freq[2] ✓，且 (−1,2) &lt; (−1,3)</text>
  <text x="440" y="292" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">→ 2</text>

  <!-- 底部：为什么弹过期是安全的 -->
  <rect x="30" y="320" width="460" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="11.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">为什么「弹出过期条目」是安全的？</text>
  <text x="260" y="366" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">每次 add 都会压入当前 (−freq[x], x)——任何时刻真实状态在堆里必有对应条目；</text>
  <text x="260" y="386" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">被弹的都是「f ≠ freq[x]」的陈旧快照，弹掉不影响未来查询；</text>
  <text x="260" y="402" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">每条目至多压一次弹一次 → 均摊 O(log n)</text>
</svg>
