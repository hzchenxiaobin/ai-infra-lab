<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="640" height="540" fill="#fafafa"/>

  <!-- 主流程：开始 -->
  <rect x="60" y="28" width="180" height="34" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="50" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">输入 s</text>

  <path d="M 150 62 L 150 82" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第一趟 -->
  <rect x="45" y="86" width="210" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">第一趟：只反转字母</text>
  <text x="150" y="121" text-anchor="middle" font-size="10.5" fill="#667788" filter="url(#rough2)">reversePass(target = 字母)</text>

  <path d="M 150 128 L 150 148" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第二趟 -->
  <rect x="45" y="152" width="210" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="170" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">第二趟：只反转特殊字符</text>
  <text x="150" y="187" text-anchor="middle" font-size="10.5" fill="#99865a" filter="url(#rough2)">reversePass(target = 特殊字符)</text>

  <path d="M 150 194 L 150 214" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="75" y="218" width="150" height="34" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">返回 s</text>

  <!-- 调用虚线 -->
  <path d="M 255 100 L 296 100" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 255 173 L 296 173" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="286" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">两趟调用同一个子过程，</text>
  <text x="150" y="304" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">只是 target 判定取反</text>

  <!-- 右侧子图：一趟内部 -->
  <rect x="300" y="70" width="320" height="440" rx="10" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="460" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#555" filter="url(#rough2)">一趟 reversePass(target) 内部</text>

  <rect x="375" y="106" width="170" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">l = 0, r = n − 1</text>

  <path d="M 460 136 L 460 154" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形1 -->
  <polygon points="460,156 535,196 460,236 385,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="193" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">l &lt; r ?</text>
  <text x="460" y="211" text-anchor="middle" font-size="10" fill="#99865a" filter="url(#rough2)">（指针未相遇）</text>

  <path d="M 385 196 L 352 196" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="188" text-anchor="end" font-size="11.5" fill="#555" filter="url(#rough2)">否</text>
  <text x="345" y="212" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">本趟结束</text>

  <path d="M 460 236 L 460 254" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="250" font-size="11.5" fill="#555" filter="url(#rough2)">是</text>

  <!-- 跳过非目标 -->
  <rect x="320" y="258" width="280" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="277" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">l 右移跳过非 target 字符</text>
  <text x="460" y="295" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">r 左移跳过非 target 字符</text>

  <path d="M 460 304 L 460 322" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形2 -->
  <polygon points="460,324 545,366 460,408 375,366" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="363" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">l &lt; r ?</text>
  <text x="460" y="381" text-anchor="middle" font-size="10" fill="#99865a" filter="url(#rough2)">（跳过后未交错）</text>

  <path d="M 375 366 L 352 366" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="358" text-anchor="end" font-size="11.5" fill="#555" filter="url(#rough2)">否</text>
  <text x="345" y="382" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">不交换，结束</text>

  <path d="M 460 408 L 460 426" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="422" font-size="11.5" fill="#555" filter="url(#rough2)">是</text>

  <!-- 交换 -->
  <rect x="345" y="430" width="230" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="452" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">swap(s[l], s[r])；l++，r−−</text>

  <!-- 回环 -->
  <path d="M 575 447 L 610 447 L 610 196 L 539 196" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="600" y="330" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">继续下一对</text>
</svg>
