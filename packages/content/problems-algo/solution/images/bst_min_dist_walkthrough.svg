<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：root = [1,0,48,null,null,12,49]（示例 2）</text>

  <!-- 左：原 BST -->
  <text x="40" y="56" font-size="12" fill="#888">原 BST：</text>

  <!-- 树枝：1 -> 0, 1 -> 48, 48 -> 12, 48 -> 49 -->
  <line x1="135" y1="102" x2="80" y2="148" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="155" y1="102" x2="210" y2="148" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="200" y1="172" x2="165" y2="218" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="220" y1="172" x2="255" y2="218" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- 节点 1 (根, ②) -->
  <circle cx="145" cy="90" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="145" y="94" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="169" y="84" font-size="10" fill="#b85450" font-weight="bold">②</text>

  <!-- 节点 0 (①) -->
  <circle cx="70" cy="160" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="70" y="164" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="92" y="156" font-size="10" fill="#d6a040" font-weight="bold">①</text>

  <!-- 节点 48 (③) -->
  <circle cx="215" cy="160" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="164" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">48</text>
  <text x="240" y="156" font-size="10" fill="#b85450" font-weight="bold">③</text>

  <!-- 节点 12 (④) -->
  <circle cx="160" cy="230" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="234" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">12</text>
  <text x="183" y="226" font-size="10" fill="#b85450" font-weight="bold">④</text>

  <!-- 节点 49 (⑤) -->
  <circle cx="260" cy="230" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="234" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">49</text>
  <text x="283" y="226" font-size="10" fill="#b85450" font-weight="bold">⑤</text>

  <text x="40" y="270" font-size="11" fill="#888">中序：0 → 1 → 12 → 48 → 49</text>

  <!-- 右：逐步演变表 -->
  <text x="290" y="56" font-size="12" fill="#888">逐步演变（prev, diff, minDist）：</text>

  <!-- ① 访问 0 -->
  <text x="290" y="84" font-size="11" fill="#d6a040" font-weight="bold">① 访问 0：prev=null → 跳过算距</text>
  <rect x="290" y="90" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="106" text-anchor="middle" font-size="10" fill="#333">0</text>
  <path d="M 324 102 L 348 102" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="336" y="96" font-size="9" fill="#888">无</text>
  <rect x="352" y="90" width="120" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="412" y="106" text-anchor="middle" font-size="10" fill="#888">diff=—, min=∞</text>

  <!-- ② 访问 1 -->
  <text x="290" y="132" font-size="11" fill="#b85450" font-weight="bold">② 访问 1：prev=0 → |1−0|=1</text>
  <rect x="290" y="138" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="154" text-anchor="middle" font-size="10" fill="#333">1</text>
  <path d="M 324 150 L 348 150" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="336" y="144" font-size="9" fill="#888">1</text>
  <rect x="352" y="138" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="412" y="154" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">diff=1, min=1</text>

  <!-- ③ 访问 12 -->
  <text x="290" y="180" font-size="11" fill="#446688" font-weight="bold">③ 访问 12：prev=1 → |12−1|=11</text>
  <rect x="290" y="186" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="202" text-anchor="middle" font-size="10" fill="#333">12</text>
  <path d="M 324 198 L 348 198" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="336" y="192" font-size="9" fill="#888">11</text>
  <rect x="352" y="186" width="120" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="412" y="202" text-anchor="middle" font-size="10" fill="#888">diff=11, min=1</text>

  <!-- ④ 访问 48 -->
  <text x="290" y="228" font-size="11" fill="#446688" font-weight="bold">④ 访问 48：prev=12 → |48−12|=36</text>
  <rect x="290" y="234" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="250" text-anchor="middle" font-size="10" fill="#333">48</text>
  <path d="M 324 246 L 348 246" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="336" y="240" font-size="9" fill="#888">36</text>
  <rect x="352" y="234" width="120" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="412" y="250" text-anchor="middle" font-size="10" fill="#888">diff=36, min=1</text>

  <!-- ⑤ 访问 49 -->
  <text x="290" y="276" font-size="11" fill="#b85450" font-weight="bold">⑤ 访问 49：prev=48 → |49−48|=1</text>
  <rect x="290" y="282" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="298" text-anchor="middle" font-size="10" fill="#333">49</text>
  <path d="M 324 294 L 348 294" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="336" y="288" font-size="9" fill="#888">1</text>
  <rect x="352" y="282" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="412" y="298" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">diff=1, min=1</text>

  <!-- 结果标注 -->
  <text x="290" y="332" font-size="13" fill="#b85450" font-weight="bold">返回 minDist = 1 ✓</text>

  <!-- 说明框 -->
  <rect x="40" y="348" width="500" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="372" font-size="12" fill="#333" font-weight="bold">关键：最小距离可能出现在多处相邻对（②|1−0|=1 与 ⑤|49−48|=1）</text>
  <text x="60" y="392" font-size="11" fill="#555">① 首节点无前驱跳过；② diff=1 刷新 min；③④ diff=11/36 未刷新；⑤ diff=1 追平</text>
  <text x="60" y="412" font-size="11" fill="#555">树中相距最远的 0 与 49 差 49，但相邻对 0−1、48−49 差仅 1</text>
  <text x="60" y="430" font-size="11" fill="#4a7a3a" font-weight="bold">这正是「升序序列最小差必在相邻」的直观体现</text>
</svg>
