<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">从右向左扫描：跳过尾随空格 → 数最后一个单词</text>

  <!-- Scan direction arrow (right to left, curved) -->
  <path d="M 500 58 Q 290 42 90 58" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="290" y="40" text-anchor="middle" font-size="11" fill="#888">扫描方向（从右向左）</text>

  <!-- String blocks: "   fly me   to   the moon  " -->
  <!-- Block 1: "   " (3 spaces) -->
  <rect x="80" y="72" width="48" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="104" y="95" text-anchor="middle" font-size="10" fill="#aaa">···</text>

  <!-- Block 2: "fly" -->
  <rect x="128" y="72" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="95" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">fly</text>

  <!-- Block 3: " " -->
  <rect x="176" y="72" width="16" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="95" text-anchor="middle" font-size="10" fill="#aaa">·</text>

  <!-- Block 4: "me" -->
  <rect x="192" y="72" width="32" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="95" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">me</text>

  <!-- Block 5: "   " -->
  <rect x="224" y="72" width="48" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="248" y="95" text-anchor="middle" font-size="10" fill="#aaa">···</text>

  <!-- Block 6: "to" -->
  <rect x="272" y="72" width="32" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="95" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">to</text>

  <!-- Block 7: "   " -->
  <rect x="304" y="72" width="48" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="95" text-anchor="middle" font-size="10" fill="#aaa">···</text>

  <!-- Block 8: "the" -->
  <rect x="352" y="72" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="95" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">the</text>

  <!-- Block 9: " " -->
  <rect x="400" y="72" width="16" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="408" y="95" text-anchor="middle" font-size="10" fill="#aaa">·</text>

  <!-- Block 10: "moon" (GREEN - last word) -->
  <rect x="416" y="72" width="64" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="448" y="95" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">moon</text>

  <!-- Block 11: "  " (RED - trailing spaces) -->
  <rect x="480" y="72" width="32" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="496" y="95" text-anchor="middle" font-size="10" fill="#b85450">··</text>

  <!-- Phase 2 bracket: under "moon" (x=416 to 480) -->
  <path d="M 416 116 Q 416 124 422 124 L 474 124 Q 480 124 480 116" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="448" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">阶段2: 数单词 = 4</text>

  <!-- Phase 1 bracket: under trailing spaces (x=480 to 512) -->
  <path d="M 480 116 Q 480 124 486 124 L 506 124 Q 512 124 512 116" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="496" y="140" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">阶段1: 跳过</text>

  <!-- Result box -->
  <rect x="200" y="160" width="180" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="220" y="181" font-size="11" fill="#555">最后一个单词长度 =</text>
  <text x="350" y="182" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- Core idea box -->
  <rect x="40" y="210" width="500" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="236" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">核心直觉：最后一个单词就在字符串末尾</text>
  <text x="290" y="258" text-anchor="middle" font-size="11" fill="#666">阶段 1：while (s[i] == ' ') i−−  → 跳过尾随空格</text>
  <text x="290" y="276" text-anchor="middle" font-size="11" fill="#666">阶段 2：while (s[i] != ' ') len++; i−−  → 数单词</text>
  <text x="290" y="300" text-anchor="middle" font-size="11" fill="#888">两阶段共用 i，判定互补（== ' ' vs != ' '），i ≥ 0 统一守护边界</text>
</svg>
