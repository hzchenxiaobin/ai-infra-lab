<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">getValue("=X+Y")：去头 → 拆半 → 判别 → 求和</text>

  <!-- Step 1 -->
  <rect x="130" y="42" width="260" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 去掉开头的 '=' → 剩下 "X+Y"</text>

  <path d="M 260 74 L 260 90" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="105" y="92" width="310" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="113" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 以 '+' 为界，拆成左操作数 X 与右操作数 Y</text>

  <path d="M 260 124 L 260 140" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判别菱形 -->
  <polygon points="260,144 380,190 260,236 140,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="186" text-anchor="middle" font-size="12" fill="#8a6206" filter="url(#rough2)">操作数首字符</text>
  <text x="260" y="204" text-anchor="middle" font-size="12" fill="#8a6206" filter="url(#rough2)">是字母？</text>

  <path d="M 386 190 L 410 190" stroke="#b85450" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="458" y="194" text-anchor="middle" font-size="10.5" fill="#7a4a2b" filter="url(#rough2)">X、Y 各判一遍</text>

  <!-- 是 → 引用 -->
  <path d="M 140 190 C 92 190 92 226 116 250" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="104" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="28" y="252" width="200" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="128" y="274" text-anchor="middle" font-size="12.5" fill="#2d5523" filter="url(#rough2)">是 → 单元格引用</text>
  <text x="128" y="296" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">查 cells 表，缺省 0</text>

  <!-- 否 → 整数 -->
  <path d="M 380 190 C 428 190 428 226 404 250" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="224" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="292" y="252" width="200" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="392" y="274" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">否 → 非负整数</text>
  <text x="392" y="296" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">stoi / int 直接转</text>

  <!-- 汇合 -->
  <path d="M 128 308 C 128 332 180 342 230 342" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 392 308 C 392 332 340 342 290 342" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="118" y="344" width="284" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="13" fill="#2d5523" filter="url(#rough2)">③ 返回 x + y</text>
  <text x="260" y="381" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">如 "A1" 已写 10： "=A1+6" → 10 + 6 = 16</text>
</svg>
