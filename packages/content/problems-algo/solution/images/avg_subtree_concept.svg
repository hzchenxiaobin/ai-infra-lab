<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">统计值等于子树平均值的节点：绿色✓为命中节点</text>

  <!-- 树结构：根 4 -->
  <line x1="268" y1="82" x2="192" y2="118" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="292" y1="82" x2="368" y2="118" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="280" cy="70" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="74" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="300" y="60" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="280" y="58" text-anchor="middle" font-size="9" fill="#4a7a3a">(24,6)→4</text>

  <!-- 节点 8 (NOT match: 9/3=3 != 8) -->
  <line x1="168" y1="152" x2="132" y2="198" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="192" y1="152" x2="228" y2="198" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="180" cy="135" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="139" text-anchor="middle" font-size="11" fill="#333">8</text>
  <text x="198" y="128" font-size="10" fill="#b85450" font-weight="bold">✗</text>
  <text x="180" y="123" text-anchor="middle" font-size="9" fill="#b85450">(9,3)→3</text>

  <!-- 节点 5 (match: 11/2=5 == 5) -->
  <line x1="380" y1="152" x2="430" y2="198" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="380" cy="135" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="139" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="398" y="128" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="380" y="123" text-anchor="middle" font-size="9" fill="#4a7a3a">(11,2)→5</text>

  <!-- 叶 0 (match) -->
  <circle cx="125" cy="210" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="125" y="214" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="143" y="203" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="125" y="232" text-anchor="middle" font-size="9" fill="#4a7a3a">(0,1)→0</text>

  <!-- 叶 1 (match) -->
  <circle cx="235" cy="210" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="235" y="214" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="253" y="203" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="235" y="232" text-anchor="middle" font-size="9" fill="#4a7a3a">(1,1)→1</text>

  <!-- 叶 6 (match) -->
  <circle cx="435" cy="210" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="435" y="214" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="453" y="203" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="435" y="232" text-anchor="middle" font-size="9" fill="#4a7a3a">(6,1)→6</text>

  <!-- 说明框 -->
  <rect x="40" y="265" width="480" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="289" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">聚合规则（后序传递）</text>
  <text x="60" y="311" font-size="11" fill="#555">sum(node) = node.val + sum(left) + sum(right)</text>
  <text x="60" y="329" font-size="11" fill="#555">count(node) = 1 + count(left) + count(right)</text>
  <text x="60" y="349" font-size="11" fill="#4a7a3a">绿色 ✓：(sum, count)→avg == node.val（5 个命中：0,1,6,5,4）</text>
  <text x="60" y="369" font-size="11" fill="#b85450">红色 ✗：节点 8 的子树均值 9/3=3 ≠ 8（向下了，3 偏离 8）</text>
</svg>
