<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 478"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="478" fill="#fafafa"/>

  <text x="30" y="22" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟 k = 1..n 同验前缀与后缀，非质数立即短路</text>

  <!-- 开始 -->
  <rect x="190" y="36" width="180" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="57" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">s = str(num)，n = |s|</text>

  <path d="M 280 70 L 280 88" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 1：k > n ? -->
  <polygon points="280,92 348,124 280,156 212,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">k &gt; n ?</text>

  <path d="M 348 124 L 386 124" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="117" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">是</text>

  <rect x="390" y="107" width="146" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="463" y="128" text-anchor="middle" font-size="12" fill="#2d5a24" filter="url(#rough2)">return true</text>

  <path d="M 280 156 L 280 174" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="170" font-size="10" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 取前缀后缀 -->
  <rect x="190" y="176" width="180" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="197" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">pre = s[:k]，suf = s[n−k:]</text>

  <path d="M 280 210 L 280 228" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 2：pre 是质数 ? -->
  <polygon points="280,232 352,264 280,296 208,264" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="268" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">pre 是质数 ?</text>

  <path d="M 352 264 L 386 264" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="366" y="257" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="390" y="247" width="146" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="463" y="268" text-anchor="middle" font-size="12" fill="#8a3a34" filter="url(#rough2)">return false</text>

  <path d="M 280 296 L 280 314" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="310" font-size="10" fill="#446688" filter="url(#rough2)">是</text>

  <!-- 判定 3：suf 是质数 ? -->
  <polygon points="280,318 352,350 280,382 208,350" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="354" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">suf 是质数 ?</text>

  <path d="M 352 350 L 386 350" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="366" y="343" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="390" y="333" width="146" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="463" y="354" text-anchor="middle" font-size="12" fill="#8a3a34" filter="url(#rough2)">return false</text>

  <path d="M 280 382 L 280 400" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="396" font-size="10" fill="#446688" filter="url(#rough2)">是</text>

  <!-- k += 1 -->
  <rect x="190" y="402" width="180" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="422" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">k += 1</text>

  <!-- 回环 -->
  <path d="M 190 418 L 84 418 L 84 124 L 208 124" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="76" y="270" text-anchor="middle" font-size="9.5" fill="#8a6d1f" transform="rotate(-90 76 270)" filter="url(#rough2)">回到 k &gt; n ?</text>

  <!-- 底注 -->
  <text x="60" y="454" font-size="10" fill="#777" filter="url(#rough2)">isPrime(x)：试除到 √x（先排 2、3，再 6k±1 步进）—— 单个候选至多约 3.2 万 / 3 次取模</text>
  <text x="60" y="470" font-size="10" fill="#777" filter="url(#rough2)">短路：第一个非质数出现即终止，越短的候选越早暴露</text>
</svg>
