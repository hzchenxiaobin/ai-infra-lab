<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 495" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="495" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：删到最后，只剩最大频率字母的「最后一次出现」</text>

  <!-- Round 1 -->
  <text x="50" y="63" font-size="12" fill="#888" filter="url(#rough2)">第 1 轮</text>
  <rect x="104" y="42" width="36" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="122" y="63" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="146" y="42" width="36" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="164" y="63" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">a</text>
  <rect x="188" y="42" width="36" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="206" y="63" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="230" y="42" width="36" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="248" y="63" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="272" y="42" width="36" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="290" y="63" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">b</text>
  <rect x="314" y="42" width="36" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="332" y="63" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">b</text>
  <rect x="356" y="42" width="36" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="374" y="63" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">c</text>
  <rect x="398" y="42" width="36" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="416" y="63" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">a</text>
  <path d="M 110 48 L 134 68" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 134 48 L 110 68" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 194 48 L 218 68" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 218 48 L 194 68" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 236 48 L 260 68" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 260 48 L 236 68" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="88" font-size="9.5" fill="#999" filter="url(#rough2)">每格下标：</text>
  <text x="122" y="88" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="164" y="88" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="206" y="88" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="248" y="88" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="290" y="88" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="332" y="88" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="374" y="88" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="416" y="88" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">7</text>
  <text x="104" y="110" font-size="11.5" fill="#888" filter="url(#rough2)">删 a(0)、b(2)、c(3) —— 每个字母删掉「最早」的 ⟹ 剩 "abbca"</text>

  <!-- Round 2 -->
  <text x="50" y="143" font-size="12" fill="#888" filter="url(#rough2)">第 2 轮</text>
  <rect x="104" y="122" width="36" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="122" y="143" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="146" y="122" width="36" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="164" y="143" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">b</text>
  <rect x="188" y="122" width="36" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="206" y="143" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="230" y="122" width="36" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="248" y="143" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">b</text>
  <rect x="272" y="122" width="36" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="290" y="143" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="314" y="122" width="36" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="332" y="143" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">a</text>
  <path d="M 110 128 L 134 148" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 134 128 L 110 148" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 194 128 L 218 148" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 218 128 L 194 148" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 278 128 L 302 148" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 302 128 L 278 148" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="168" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="164" y="168" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="206" y="168" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="248" y="168" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="290" y="168" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">7</text>
  <text x="104" y="190" font-size="11.5" fill="#888" filter="url(#rough2)">删 a(1)、b(4)、c(6) ⟹ 剩 "ba"（括号里是原串下标）</text>

  <!-- Round 3 -->
  <text x="50" y="223" font-size="12" fill="#888" filter="url(#rough2)">第 3 轮</text>
  <rect x="104" y="202" width="36" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="122" y="223" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="146" y="202" width="36" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="164" y="223" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">a</text>
  <path d="M 110 208 L 134 228" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 134 208 L 110 228" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 152 208 L 176 228" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 176 208 L 152 228" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="248" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="164" y="248" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">7</text>
  <text x="104" y="270" font-size="11.5" fill="#888" filter="url(#rough2)">删 b(5)、a(7) ⟹ 空串（第 3 轮 = 最后一轮）</text>
  <rect x="316" y="204" width="168" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="400" y="229" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">"ba" 就是答案！</text>

  <!-- divider -->
  <path d="M 40 288 L 480 288" stroke="#bbb" stroke-width="1.2" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">换个视角：只看计数，不用真删</text>

  <!-- count buckets -->
  <text x="62" y="352" font-size="12" fill="#888" filter="url(#rough2)">cnt =</text>
  <text x="118" y="334" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="94" y="340" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="118" y="366" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="190" y="334" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="166" y="340" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="190" y="366" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="262" y="334" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">c</text>
  <rect x="238" y="340" width="48" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="262" y="366" text-anchor="middle" font-size="15" fill="#555" filter="url(#rough2)">2</text>
  <path d="M 310 344 C 330 338 340 342 344 352" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="348" y="344" width="140" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="418" y="366" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">最大频率 R = 3</text>

  <!-- survivor explanation -->
  <rect x="48" y="394" width="424" height="46" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="413" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">R − 1 = 2 轮之后：c（只有 2 次）已删光；a、b 恰好各剩 1 个</text>
  <text x="260" y="432" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">每轮删的都是「最早」的 ⟹ 剩下的就是「最后一次出现」</text>

  <!-- survivors -->
  <rect x="132" y="450" width="62" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="163" y="470" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b @5</text>
  <rect x="222" y="450" width="62" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="253" y="470" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a @7</text>
  <path d="M 296 465 L 322 465" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="330" y="456" font-size="10.5" fill="#888" filter="url(#rough2)">按原下标升序拼</text>
  <rect x="366" y="448" width="74" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="403" y="470" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">"ba"</text>
</svg>
