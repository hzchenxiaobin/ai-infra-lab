<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">核心观察：把「已感化强盗数 k」编进状态 → dp[i][j][k]</text>

  <!-- Left: grid -->
  <text x="30" y="56" font-size="12" fill="#333" filter="url(#rough2)">示例 1：网格与最优路径</text>
  <text x="44" y="64" font-size="10" fill="#4a7a3a" filter="url(#rough2)">起</text>
  <text x="176" y="209" font-size="10" fill="#4a7a3a" filter="url(#rough2)">终</text>

  <!-- route under cells -->
  <path d="M 79 91 L 121 91 L 121 133 L 163 133 L 163 175" fill="none" stroke="#4a7a3a"
        stroke-width="3.5" opacity="0.35" stroke-linecap="round" filter="url(#rough2)"/>

  <!-- row 0 -->
  <rect x="58" y="70" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="79" y="97" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="100" y="70" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="121" y="97" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="142" y="70" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163" y="97" text-anchor="middle" font-size="13" fill="#7a2f2b" filter="url(#rough2)">−1</text>

  <!-- row 1 -->
  <rect x="58" y="112" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="79" y="139" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="100" y="112" width="42" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="121" y="134" text-anchor="middle" font-size="13" fill="#7a2f2b" filter="url(#rough2)">−2</text>
  <path d="M 111 127 L 131 134" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="121" y="150" text-anchor="middle" font-size="9" fill="#b07516" filter="url(#rough2)">得 0</text>
  <rect x="142" y="112" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="163" y="139" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <!-- row 2 -->
  <rect x="58" y="154" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="79" y="181" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="100" y="154" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="121" y="181" text-anchor="middle" font-size="13" fill="#7a2f2b" filter="url(#rough2)">−3</text>
  <rect x="142" y="154" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="163" y="181" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <!-- route direction arrows -->
  <path d="M 94 91 L 108 91" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 121 98 L 121 110" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 136 133 L 150 133" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 163 142 L 163 154" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- legend -->
  <rect x="30" y="215" width="14" height="11" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="224" font-size="9.5" fill="#555" filter="url(#rough2)">≥ 0：得金币</text>
  <rect x="30" y="235" width="14" height="11" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="244" font-size="9.5" fill="#555" filter="url(#rough2)">&lt; 0：强盗抢走 |c|</text>
  <rect x="30" y="255" width="14" height="11" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="264" font-size="9.5" fill="#555" filter="url(#rough2)">感化：损失归 0（全程最多 2 次）</text>
  <path d="M 30 280 L 44 280" stroke="#4a7a3a" stroke-width="3" filter="url(#rough2)"/>
  <text x="50" y="284" font-size="9.5" fill="#555" filter="url(#rough2)">最优路径 0 → 1 → 0 → 3 → 4 = 8</text>

  <!-- connector -->
  <text x="242" y="110" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">每个格子</text>
  <text x="242" y="124" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">× 3 个状态</text>
  <path d="M 194 133 L 288 133" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Right: 3 layers -->
  <text x="300" y="56" font-size="12" fill="#333" filter="url(#rough2)">同一格拆成 3 个状态层</text>

  <rect x="300" y="76" width="185" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="392" y="99" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">k = 0：还没感化</text>

  <path d="M 340 117 L 340 129" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="127" font-size="9" fill="#b07516" filter="url(#rough2)">感化强盗：k → k+1，本格 +0</text>

  <rect x="300" y="132" width="185" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="392" y="155" text-anchor="middle" font-size="11" fill="#7a5a18" filter="url(#rough2)">k = 1：已感化 1 个</text>

  <path d="M 340 173 L 340 185" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="300" y="188" width="185" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="392" y="211" text-anchor="middle" font-size="11" fill="#2d5523" filter="url(#rough2)">k = 2：已感化 2 个</text>

  <text x="392" y="246" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">同层内：向右 / 向下走一格</text>
  <text x="392" y="263" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">跨层：只在强盗格发生</text>

  <!-- bottom note -->
  <rect x="25" y="290" width="470" height="72" fill="#f5f0e6" stroke="#b85450" stroke-width="1" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="313" text-anchor="middle" font-size="11.5" fill="#7a4a2b" filter="url(#rough2)">状态：dp[i][j][k] = 走到 (i,j)、恰好感化 k 个强盗的最大金币</text>
  <text x="260" y="335" text-anchor="middle" font-size="11.5" fill="#7a4a2b" filter="url(#rough2)">转移：max( 同层来源 + coins[i][j] ， k−1 层来源 + 0（仅强盗格）)</text>
  <text x="260" y="357" text-anchor="middle" font-size="11.5" fill="#7a4a2b" filter="url(#rough2)">答案：max dp[m−1][n−1][k]，k = 0, 1, 2</text>
</svg>
