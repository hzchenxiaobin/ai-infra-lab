<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="310" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    示例 [1,[4,[6]]] → [1,4,6] 栈状态演化
  </text>

  <!-- TOP markers -->
  <text x="30" y="76" font-size="11" fill="#b85450" filter="url(#rough2)">栈顶→</text>
  <text x="210" y="76" font-size="11" fill="#b85450" filter="url(#rough2)">栈顶→</text>
  <text x="390" y="76" font-size="11" fill="#b85450" filter="url(#rough2)">栈顶→</text>

  <!-- Snapshot 1: stack top=1, below=[4,[6]] -->
  <rect x="30" y="80" width="100" height="32" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="80" y="101" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="30" y="116" width="100" height="32" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="80" y="137" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[4,[6]]</text>
  <text x="80" y="168" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">第 1 次 next 前</text>

  <!-- Arrow 1 -->
  <line x1="135" y1="96" x2="205" y2="96" stroke="#446688" stroke-width="1.6"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="88" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">next()→1</text>
  <text x="170" y="158" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">hasNext 展开</text>
  <text x="170" y="172" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">[4,[6]]→[6],4</text>

  <!-- Snapshot 2: stack top=4, below=[6] -->
  <rect x="210" y="80" width="100" height="32" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="260" y="101" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="210" y="116" width="100" height="32" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="260" y="137" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[6]</text>
  <text x="260" y="168" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">第 2 次 next 前</text>

  <!-- Arrow 2 -->
  <line x1="315" y1="96" x2="385" y2="96" stroke="#446688" stroke-width="1.6"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="88" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">next()→4</text>
  <text x="350" y="158" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">hasNext 展开</text>
  <text x="350" y="172" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">[6]→6</text>

  <!-- Snapshot 3: stack top=6 -->
  <rect x="390" y="80" width="100" height="32" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="440" y="101" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <text x="440" y="168" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">第 3 次 next 前</text>

  <!-- Arrow 3 -->
  <line x1="495" y1="96" x2="565" y2="96" stroke="#446688" stroke-width="1.6"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="530" y="88" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">next()→6</text>

  <!-- Snapshot 4: empty -->
  <rect x="570" y="80" width="100" height="32" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="620" y="101" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">栈空 ∅</text>
  <text x="620" y="168" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">hasNext → false</text>

  <!-- Divider -->
  <line x1="40" y1="200" x2="680" y2="200" stroke="#888" stroke-width="1"
        stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- Output sequence -->
  <text x="360" y="226" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">
    ↓ 输出序列 ↓
  </text>
  <rect x="290" y="242" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="310" y="264" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="340" y="242" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="360" y="264" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="390" y="242" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="410" y="264" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>

  <!-- legend -->
  <rect x="40" y="288" width="18" height="14" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="64" y="300" font-size="11" fill="#555" filter="url(#rough2)">整数（待返回）</text>
  <rect x="180" y="288" width="18" height="14" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="204" y="300" font-size="11" fill="#555" filter="url(#rough2)">列表（待展开）</text>
</svg>
