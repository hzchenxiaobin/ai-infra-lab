<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">数据结构：栈序列 + 最小堆（未满下标）</text>

  <!-- free min-heap box -->
  <rect x="200" y="46" width="160" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">free（最小堆）</text>
  <line x1="214" y1="74" x2="346" y2="74" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="280" y="92" text-anchor="middle" font-size="11" fill="#555">未满栈下标</text>
  <text x="280" y="108" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">{ 1 }</text>

  <!-- arrow free -> stack1 (top of stack1 is the empty slot) -->
  <path d="M 280 114 L 280 134" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- stack 0 : [1,2] full -->
  <rect x="170" y="130" width="60" height="82" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <rect x="176" y="136" width="48" height="32" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="157" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="176" y="172" width="48" height="32" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="193" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="200" y="226" text-anchor="middle" font-size="11" fill="#888">栈 0</text>
  <text x="200" y="240" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">满</text>

  <!-- stack 1 : [3] + empty slot (leftmost non-full) -->
  <rect x="250" y="130" width="60" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <rect x="256" y="136" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="157" text-anchor="middle" font-size="10" fill="#d6a040" font-style="italic">空位</text>
  <rect x="256" y="172" width="48" height="32" fill="#fff" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="193" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="280" y="226" text-anchor="middle" font-size="11" fill="#888">栈 1</text>
  <text x="280" y="240" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">未满（最左）</text>

  <!-- stack 2 : [5,21] full -->
  <rect x="330" y="130" width="60" height="82" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <rect x="336" y="136" width="48" height="32" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="157" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">21</text>
  <rect x="336" y="172" width="48" height="32" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="193" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="360" y="226" text-anchor="middle" font-size="11" fill="#888">栈 2</text>
  <text x="360" y="240" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">满（最右非空）</text>

  <!-- push box + arrow to stack1 empty slot -->
  <rect x="30" y="300" width="150" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="105" y="322" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">push(val)</text>
  <text x="105" y="340" text-anchor="middle" font-size="10.5" fill="#555">取堆顶 = 最左未满</text>
  <text x="105" y="354" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">→ 填栈 1 空位</text>
  <path d="M 180 320 Q 230 270 256 154" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- pop box + arrow from stack2 top -->
  <rect x="380" y="300" width="150" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="455" y="322" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">pop()</text>
  <text x="455" y="340" text-anchor="middle" font-size="10.5" fill="#555">尾部裁剪后取 back()</text>
  <text x="455" y="354" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">→ 弹栈 2 顶 21</text>
  <path d="M 384 154 Q 410 270 432 312" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="280" y="386" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">push O(log n) 找最左未满   ·   pop O(1) 均摊取最右非空</text>
</svg>
