<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：students=[1,1,1,0,0,1], sandwiches=[1,0,0,0,1,1]</text>
  <text x="270" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">初始计数：cnt0 = 2，cnt1 = 4（按栈顶顺序消耗）</text>

  <!-- Sandwich stack label (left) -->
  <text x="20" y="74" font-size="10.5" fill="#666" filter="url(#rough2)">三明治栈</text>

  <!-- Step rows. Each row: step | top sandwich | condition | action | cnt0/cnt1 after -->
  <!-- header -->
  <rect x="20" y="80" width="500" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="95" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="100" y="95" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">栈顶 t</text>
  <text x="190" y="95" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">条件判定</text>
  <text x="330" y="95" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">动作</text>
  <text x="430" y="95" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">cnt0 / cnt1</text>

  <!-- Step 1: t=1, cnt1=4>0, cnt1--, 2/3 -->
  <rect x="20" y="104" width="500" height="28" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="122" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="96" y="110" width="20" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="106" y="123" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="190" y="122" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">cnt1 = 4 &gt; 0 ✓</text>
  <text x="330" y="122" font-size="10.5" fill="#2a5a1a" filter="url(#rough2)">cnt1−−（拿走）</text>
  <text x="436" y="122" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2 / 3</text>

  <!-- Step 2: t=0, cnt0=2>0, cnt0--, 1/3 -->
  <rect x="20" y="134" width="500" height="28" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="152" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="96" y="140" width="20" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="106" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="190" y="152" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">cnt0 = 2 &gt; 0 ✓</text>
  <text x="330" y="152" font-size="10.5" fill="#2a5a1a" filter="url(#rough2)">cnt0−−（拿走）</text>
  <text x="436" y="152" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1 / 3</text>

  <!-- Step 3: t=0, cnt0=1>0, cnt0--, 0/3 -->
  <rect x="20" y="164" width="500" height="28" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="182" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="96" y="170" width="20" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="106" y="183" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="190" y="182" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">cnt0 = 1 &gt; 0 ✓</text>
  <text x="330" y="182" font-size="10.5" fill="#2a5a1a" filter="url(#rough2)">cnt0−−（拿走）</text>
  <text x="436" y="182" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">0 / 3</text>

  <!-- Step 4: t=0, cnt0=0 → STOP -->
  <rect x="20" y="194" width="500" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="40" y="212" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="96" y="200" width="20" height="18" fill="#e6f4ea" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="106" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="190" y="212" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">cnt0 = 0 ✗</text>
  <text x="330" y="212" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">无人想吃 0 → 停！</text>
  <text x="436" y="212" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0 / 3</text>

  <!-- arrow from step4 to result -->
  <path d="M 270 224 L 270 240" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Why stop? illustration ===== -->
  <rect x="30" y="244" width="480" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="264" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">为什么停在第 4 步？</text>
  <text x="270" y="282" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">栈顶是 0，但 cnt0 已耗尽；剩余 3 名学生全是 1 型</text>
  <text x="270" y="296" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">→ 谁也吃不了这个 0，栈顶永久卡住</text>

  <!-- ===== Result box ===== -->
  <rect x="80" y="312" width="380" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="334" text-anchor="middle" font-size="12.5" fill="#5a4a1a" font-weight="bold" filter="url(#rough2)">答案 = cnt0 + cnt1 = 0 + 3 = 3</text>
  <text x="270" y="350" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（与示例输出 3 一致 ✓）</text>

  <!-- footer -->
  <text x="270" y="372" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">三明治按栈序消耗：1→0→0→0（停）；只需一趟扫描即得剩余学生数</text>
</svg>
