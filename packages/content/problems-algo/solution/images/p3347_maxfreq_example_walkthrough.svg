<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：九个候选事件点逐一过 min 公式</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">示例 2：nums = [5, 11, 20, 20]，k = 5，numOperations = 1</text>

  <!-- 表格外框与表头 -->
  <rect x="35" y="58" width="450" height="300" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <rect x="35" y="58" width="450" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="70" y="77" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">t</text>
  <text x="190" y="77" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">窗口 [t−5, t+5]</text>
  <text x="307" y="77" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">reach</text>
  <text x="372" y="77" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">eq</text>
  <text x="445" y="77" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">min(r, eq+1)</text>

  <!-- 高亮行 t=20 -->
  <rect x="37" y="270" width="446" height="28" fill="#e6f4ea" rx="4" filter="url(#rough2)"/>

  <!-- 行分隔虚线 -->
  <path d="M 35 114 h 450 M 35 142 h 450 M 35 170 h 450 M 35 198 h 450 M 35 226 h 450 M 35 254 h 450 M 35 282 h 450 M 35 310 h 450 M 35 338 h 450" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <!-- 列分隔虚线 -->
  <path d="M 105 60 v 296 M 275 60 v 296 M 340 60 v 296 M 405 60 v 296" fill="none" stroke="#dddddd" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <!-- 数据行 -->
  <text x="70" y="106" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="190" y="106" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[−5, 5]</text>
  <text x="307" y="106" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="372" y="106" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="445" y="106" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <text x="70" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="190" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0, 10]</text>
  <text x="307" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="372" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="445" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <text x="70" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="190" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1, 11]</text>
  <text x="307" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="372" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="445" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <text x="70" y="190" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <text x="190" y="190" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[5, 15]</text>
  <text x="307" y="190" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="372" y="190" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="445" y="190" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <text x="70" y="218" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">11</text>
  <text x="190" y="218" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[6, 16]</text>
  <text x="307" y="218" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="372" y="218" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="445" y="218" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <text x="70" y="246" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">15</text>
  <text x="190" y="246" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[10, 20]</text>
  <text x="307" y="246" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="372" y="246" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="445" y="246" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <text x="70" y="274" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">16</text>
  <text x="190" y="274" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[11, 21]</text>
  <text x="307" y="274" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="372" y="274" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="445" y="274" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <text x="70" y="302" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">20</text>
  <text x="190" y="302" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">[15, 25]</text>
  <text x="307" y="302" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="372" y="302" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="445" y="302" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2 ✓</text>

  <text x="70" y="330" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">25</text>
  <text x="190" y="330" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[20, 30]</text>
  <text x="307" y="330" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="372" y="330" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="445" y="330" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <rect x="35" y="368" width="450" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="385" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">reach=3 的 t=15/16 输给 eq=2 的 t=20：免单额度才是关键，多余操作加 0 浪费</text>
</svg>
