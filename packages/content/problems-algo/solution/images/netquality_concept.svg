<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：枚举塔坐标包围盒内的整数点，累加各塔信号</text>

  <!-- Grid -->
  <g stroke="#e3e3e3" stroke-width="1" filter="url(#rough2)">
    <line x1="70" y1="180" x2="70" y2="330"/>
    <line x1="120" y1="180" x2="120" y2="330"/>
    <line x1="170" y1="180" x2="170" y2="330"/>
    <line x1="220" y1="180" x2="220" y2="330"/>
    <line x1="270" y1="180" x2="270" y2="330"/>
    <line x1="70" y1="330" x2="270" y2="330"/>
    <line x1="70" y1="280" x2="270" y2="280"/>
    <line x1="70" y1="230" x2="270" y2="230"/>
    <line x1="70" y1="180" x2="270" y2="180"/>
  </g>

  <!-- candidate integer points (gray dots) -->
  <g fill="#c8c8c8" filter="url(#rough2)">
    <circle cx="70" cy="330" r="2.5"/>
    <circle cx="120" cy="330" r="2.5"/>
    <circle cx="170" cy="330" r="2.5"/>
    <circle cx="220" cy="330" r="2.5"/>
    <circle cx="270" cy="330" r="2.5"/>
    <circle cx="70" cy="280" r="2.5"/>
    <circle cx="120" cy="280" r="2.5"/>
    <circle cx="220" cy="280" r="2.5"/>
    <circle cx="270" cy="280" r="2.5"/>
    <circle cx="70" cy="230" r="2.5"/>
    <circle cx="170" cy="230" r="2.5"/>
    <circle cx="220" cy="230" r="2.5"/>
    <circle cx="270" cy="230" r="2.5"/>
    <circle cx="70" cy="180" r="2.5"/>
    <circle cx="120" cy="180" r="2.5"/>
    <circle cx="170" cy="180" r="2.5"/>
    <circle cx="220" cy="180" r="2.5"/>
    <circle cx="270" cy="180" r="2.5"/>
  </g>

  <!-- axis labels -->
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="70" y="345">0</text>
    <text x="120" y="345">1</text>
    <text x="170" y="345">2</text>
    <text x="220" y="345">3</text>
    <text x="270" y="345">4</text>
  </g>
  <g font-size="10" fill="#999" text-anchor="end">
    <text x="62" y="334">0</text>
    <text x="62" y="284">1</text>
    <text x="62" y="234">2</text>
    <text x="62" y="184">3</text>
  </g>
  <text x="60" y="172" font-size="10" fill="#999" text-anchor="end">y</text>
  <text x="284" y="345" font-size="10" fill="#999">x</text>

  <!-- radius circles (r=2 units -> 100px) -->
  <g fill-opacity="0.10" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)">
    <circle cx="120" cy="230" r="100" fill="#446688" stroke="#446688"/>
    <circle cx="170" cy="280" r="100" fill="#4a7a3a" stroke="#4a7a3a"/>
    <circle cx="220" cy="280" r="100" fill="#d6a040" stroke="#d6a040"/>
  </g>

  <!-- towers -->
  <circle cx="120" cy="230" r="8" fill="#446688" filter="url(#rough2)"/>
  <text x="120" y="222" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">q=5</text>
  <text x="132" y="248" font-size="10" fill="#555">(1,2)</text>

  <circle cx="170" cy="280" r="8" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="170" y="266" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">q=7</text>
  <text x="183" y="296" font-size="10" fill="#555">(2,1)</text>

  <circle cx="220" cy="280" r="8" fill="#d6a040" filter="url(#rough2)"/>
  <text x="220" y="266" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">q=9</text>
  <text x="233" y="296" font-size="10" fill="#555">(3,1)</text>

  <!-- best point (2,1) highlight ring -->
  <circle cx="170" cy="280" r="15" fill="none" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="170" y="308" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">最优 = 13</text>

  <!-- formula box -->
  <rect x="312" y="120" width="228" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="426" y="142" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">信号强度公式</text>
  <text x="426" y="164" text-anchor="middle" font-size="12" fill="#333">总信号 = Σ ⌊ qi / (1 + d) ⌋</text>
  <text x="426" y="182" text-anchor="middle" font-size="10" fill="#777">d = 塔到候选点的欧氏距离</text>
  <text x="426" y="195" text-anchor="middle" font-size="10" fill="#777">仅累加 d ≤ radius 的塔</text>

  <!-- insight box -->
  <rect x="312" y="214" width="228" height="116" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="426" y="236" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">候选范围 = 塔坐标包围盒</text>
  <text x="324" y="256" font-size="10" fill="#555">在包围盒外，所有塔都位于同一侧，</text>
  <text x="324" y="270" font-size="10" fill="#555">朝包围盒方向移动会同时减小到</text>
  <text x="324" y="284" font-size="10" fill="#555">每座塔的距离 ⇒ 信号只增不减。</text>
  <text x="324" y="302" font-size="10" fill="#555">故最优点必落在</text>
  <text x="324" y="316" font-size="10" fill="#555">[minX, maxX] × [minY, maxY] 内。</text>
</svg>
