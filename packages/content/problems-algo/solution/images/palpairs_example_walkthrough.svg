<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="540" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：words = ["abcd","dcba","lls","s","sssll"]</text>

  <!-- wordMap -->
  <text x="40" y="54" font-size="11.5" fill="#446688" font-weight="bold">wordMap:</text>
  <rect x="110" y="40" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="145" y="57" text-anchor="middle" font-size="10.5" fill="#333">abcd→0</text>
  <rect x="184" y="40" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="219" y="57" text-anchor="middle" font-size="10.5" fill="#333">dcba→1</text>
  <rect x="258" y="40" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="288" y="57" text-anchor="middle" font-size="10.5" fill="#333">lls→2</text>
  <rect x="322" y="40" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="347" y="57" text-anchor="middle" font-size="10.5" fill="#333">s→3</text>
  <rect x="376" y="40" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="411" y="57" text-anchor="middle" font-size="10.5" fill="#333">sssll→4</text>

  <!-- ===== Match 1: i=0 "abcd", j=0 → (1, 0) ===== -->
  <rect x="24" y="80" width="552" height="92" fill="#e6f4ea" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="40" y="100" font-size="11" fill="#4a7a3a" font-weight="bold">① i=0, w="abcd", j=0（情况 A）</text>

  <text x="40" y="124" font-size="10.5" fill="#888">prefix=</text>
  <rect x="92" y="112" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="110" y="127" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">""</text>
  <text x="134" y="124" font-size="10" fill="#4a7a3a">回文 ✓</text>

  <text x="190" y="124" font-size="10.5" fill="#888">suffix=</text>
  <rect x="242" y="112" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="282" y="127" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">abcd</text>

  <text x="332" y="124" font-size="10.5" fill="#888">rev(suffix)=</text>
  <rect x="420" y="112" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="460" y="127" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">dcba</text>
  <text x="506" y="124" font-size="10" fill="#d6a040">→map[1]</text>

  <rect x="40" y="146" width="280" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="180" y="161" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">"dcba" + "abcd" = "dcbaabcd" 回文 ⟹ pair (1, 0)</text>

  <!-- ===== Match 2: i=1 "dcba", j=0 → (0, 1) ===== -->
  <rect x="24" y="184" width="552" height="92" fill="#e6f4ea" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="40" y="204" font-size="11" fill="#4a7a3a" font-weight="bold">② i=1, w="dcba", j=0（情况 A）</text>

  <text x="40" y="228" font-size="10.5" fill="#888">prefix=</text>
  <rect x="92" y="216" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="110" y="231" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">""</text>
  <text x="134" y="228" font-size="10" fill="#4a7a3a">回文 ✓</text>

  <text x="190" y="228" font-size="10.5" fill="#888">suffix=</text>
  <rect x="242" y="216" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="282" y="231" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">dcba</text>

  <text x="332" y="228" font-size="10.5" fill="#888">rev(suffix)=</text>
  <rect x="420" y="216" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="460" y="231" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">abcd</text>
  <text x="506" y="228" font-size="10" fill="#d6a040">→map[0]</text>

  <rect x="40" y="250" width="280" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="180" y="265" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">"abcd" + "dcba" = "abcddcba" 回文 ⟹ pair (0, 1)</text>

  <!-- ===== Match 3: i=2 "lls", j=2 → (3, 2) ===== -->
  <rect x="24" y="288" width="552" height="92" fill="#e6f4ea" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="40" y="308" font-size="11" fill="#4a7a3a" font-weight="bold">③ i=2, w="lls", j=2（情况 A）</text>

  <text x="40" y="332" font-size="10.5" fill="#888">prefix=</text>
  <rect x="92" y="320" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="117" y="335" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">ll</text>
  <text x="148" y="332" font-size="10" fill="#4a7a3a">回文 ✓</text>

  <text x="190" y="332" font-size="10.5" fill="#888">suffix=</text>
  <rect x="242" y="320" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="262" y="335" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">s</text>

  <text x="292" y="332" font-size="10.5" fill="#888">rev(suffix)=</text>
  <rect x="380" y="320" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="400" y="335" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">s</text>
  <text x="430" y="332" font-size="10" fill="#d6a040">→map[3], idx≠i ✓</text>

  <rect x="40" y="354" width="260" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="170" y="369" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">"s" + "lls" = "slls" 回文 ⟹ pair (3, 2)</text>

  <!-- ===== Match 4: i=4 "sssll", j=2 → (2, 4) ===== -->
  <rect x="24" y="392" width="552" height="92" fill="#e6f4ea" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="40" y="412" font-size="11" fill="#4a7a3a" font-weight="bold">④ i=4, w="sssll", j=2（情况 A）</text>

  <text x="40" y="436" font-size="10.5" fill="#888">prefix=</text>
  <rect x="92" y="424" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="117" y="439" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">ss</text>
  <text x="148" y="436" font-size="10" fill="#4a7a3a">回文 ✓</text>

  <text x="190" y="436" font-size="10.5" fill="#888">suffix=</text>
  <rect x="242" y="424" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="272" y="439" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">sll</text>

  <text x="312" y="436" font-size="10.5" fill="#888">rev(suffix)=</text>
  <rect x="400" y="424" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="430" y="439" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">lls</text>
  <text x="468" y="436" font-size="10" fill="#d6a040">→map[2]</text>

  <rect x="40" y="458" width="320" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="200" y="473" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">"lls" + "sssll" = "llssssll" 回文 ⟹ pair (2, 4)</text>

  <!-- result -->
  <rect x="100" y="498" width="400" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="518" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">result = [[1,0],[0,1],[3,2],[2,4]]</text>
</svg>
