<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次遍历求 maxFreq，再做充盈判据</text>

  <!-- 1. Input -->
  <rect x="170" y="46" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="11" fill="#333">输入：已排序 nums[]，整数 K</text>

  <path d="M 270 78 L 270 100" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. Init -->
  <rect x="150" y="104" width="240" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="124" text-anchor="middle" font-size="11" fill="#333">maxFreq = 0, curFreq = 1</text>

  <path d="M 270 136 L 270 156" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. Loop condition (diamond) -->
  <polygon points="270,160 360,196 270,232 180,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="192" text-anchor="middle" font-size="11" fill="#333">i &lt; len(nums) ?</text>
  <text x="270" y="208" text-anchor="middle" font-size="10" fill="#888">遍历数组</text>

  <!-- Yes branch: right -->
  <path d="M 360 196 L 400 196" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="188" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- 4. Compare adjacent -->
  <rect x="380" y="168" width="140" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="188" text-anchor="middle" font-size="10" fill="#333">if nums[i]==nums[i-1]</text>
  <text x="450" y="202" text-anchor="middle" font-size="10" fill="#4a7a3a">curFreq++</text>
  <text x="450" y="216" text-anchor="middle" font-size="10" fill="#b85450">else curFreq=1</text>

  <!-- Update maxFreq -->
  <path d="M 450 224 L 450 244" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="370" y="248" width="160" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="450" y="266" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">maxFreq = max(maxFreq, curFreq)</text>

  <!-- i++ and loop back -->
  <path d="M 450 276 L 450 296 L 270 296 L 270 160" stroke="#666" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="290" text-anchor="middle" font-size="9" fill="#888">i++，回到循环</text>

  <!-- No branch: down -->
  <path d="M 270 232 L 270 268" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="254" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- 5. Check condition -->
  <rect x="120" y="272" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="290" text-anchor="middle" font-size="11" fill="#333">充盈判据检查</text>
  <text x="270" y="308" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">len(nums) ≥ K × maxFreq ?</text>

  <path d="M 270 316 L 270 336" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 6. Decision diamond -->
  <polygon points="270,340 340,370 270,400 200,370" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="374" text-anchor="middle" font-size="11" fill="#333">满足？</text>

  <!-- True -->
  <path d="M 200 370 L 150 370" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="362" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="60" y="356" width="88" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="104" y="374" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- False -->
  <path d="M 340 370 L 390 370" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="362" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="392" y="356" width="88" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="436" y="374" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return false</text>

  <!-- Right annotations -->
  <text x="470" y="120" font-size="9" fill="#888">初始化</text>
  <text x="470" y="196" font-size="9" fill="#888">逐对比较</text>
  <text x="470" y="266" font-size="9" fill="#888">更新最大频次</text>
  <text x="470" y="300" font-size="9" fill="#888">O(n) 一趟</text>
</svg>
