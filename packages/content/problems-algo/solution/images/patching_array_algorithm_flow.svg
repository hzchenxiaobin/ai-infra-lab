<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心流程：维护 miss 直到 miss &gt; n</text>

  <!-- Init -->
  <rect x="80" y="40" width="360" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="260" y="80" text-anchor="middle" font-size="11" fill="#555">miss = 1,  i = 0,  patches = 0</text>
  <text x="260" y="95" text-anchor="middle" font-size="10.5" fill="#888">miss 表示「当前无法构成的最小正整数」</text>

  <path d="M 260 102 L 260 118" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Loop diamond: miss <= n ? -->
  <polygon points="260,122 370,162 260,202 150,162" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="158" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">miss ≤ n ?</text>
  <text x="260" y="175" text-anchor="middle" font-size="10.5" fill="#777">覆盖已到 n？</text>

  <!-- No -> return -->
  <path d="M 370 162 L 440 162 L 440 216" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="392" y="154" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="370" y="220" width="140" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="440" y="239" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">扫描结束</text>
  <text x="440" y="256" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">return patches</text>

  <!-- Yes down -->
  <path d="M 260 202 L 260 220" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="276" y="216" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- Decision diamond: i < n && nums[i] <= miss ? -->
  <polygon points="260,224 390,267 260,310 130,267" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">i &lt; n 且 nums[i] ≤ miss ?</text>
  <text x="260" y="279" text-anchor="middle" font-size="10.5" fill="#777">下一个数落在覆盖内？</text>

  <!-- Yes (consume) -->
  <path d="M 130 267 L 70 267 L 70 324" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="86" y="259" font-size="11" fill="#4a7a3a" font-weight="bold">Yes</text>
  <rect x="10" y="328" width="150" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="85" y="350" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">吸收 nums[i]</text>
  <text x="85" y="368" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">miss += nums[i]</text>
  <text x="85" y="383" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">i += 1</text>

  <!-- No (patch) -->
  <path d="M 390 267 L 450 267 L 450 324" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="412" y="259" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="360" y="328" width="150" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="435" y="350" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">补 miss</text>
  <text x="435" y="368" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">patches += 1</text>
  <text x="435" y="383" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">miss *= 2</text>

  <!-- loop-back: both branches merge -->
  <path d="M 85 390 L 85 410" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <path d="M 435 390 L 435 410" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <path d="M 85 410 L 435 410" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <path d="M 85 410 L 8 410 L 8 162 L 150 162" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="22" y="290" font-size="10.5" fill="#888" font-style="italic" transform="rotate(-90 22 290)">回到循环顶部</text>
</svg>
