<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 演算：nums = [1,1,1,1]，queries = [[1,3],[0,2],[1,3],[1,2]]</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">按 l 排序后依次进场；pool 为按 r 的大根堆；i=3 时 [0,2] 在 r+1 处过期退役</text>

  <!-- 表头 -->
  <rect x="24" y="52" width="54" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="51" y="71" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">下标 i</text>
  <rect x="80" y="52" width="140" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="71" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">进场后 pool（大根堆）</text>
  <rect x="222" y="52" width="78" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="261" y="71" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">过期退役</text>
  <rect x="302" y="52" width="84" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="344" y="66" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">cur 对比</text>
  <text x="344" y="78" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">nums[i]</text>
  <rect x="388" y="52" width="108" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="442" y="71" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">动作</text>

  <!-- 行 i=0 -->
  <rect x="24" y="86" width="54" height="52" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="51" y="116" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">i = 0</text>
  <rect x="80" y="86" width="140" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="107" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">[0,2] 进场</text>
  <text x="150" y="125" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">pool = { 2 }</text>
  <rect x="222" y="86" width="78" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="261" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>
  <rect x="302" y="86" width="84" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="344" y="116" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">0 &lt; 1 缺</text>
  <rect x="388" y="86" width="108" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="442" y="107" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">选 r=2（[0,2]）</text>
  <text x="442" y="125" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">cur=1 · used=1</text>

  <!-- 行 i=1 -->
  <rect x="24" y="140" width="54" height="52" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="51" y="170" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">i = 1</text>
  <rect x="80" y="140" width="140" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="161" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">三条 [1,·] 进场</text>
  <text x="150" y="179" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">pool = { 3, 3, 2 }</text>
  <rect x="222" y="140" width="78" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="261" y="170" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>
  <rect x="302" y="140" width="84" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="344" y="170" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1 ≥ 1 ✓</text>
  <rect x="388" y="140" width="108" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="442" y="161" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">不动！</text>
  <text x="442" y="179" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">长券留给 i=3</text>

  <!-- 行 i=2 -->
  <rect x="24" y="194" width="54" height="52" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="51" y="224" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">i = 2</text>
  <rect x="80" y="194" width="140" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="215" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">（无进场）</text>
  <text x="150" y="233" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">pool = { 3, 3, 2 }</text>
  <rect x="222" y="194" width="78" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="261" y="215" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>
  <text x="261" y="233" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">r=2 ≥ 2 在岗</text>
  <rect x="302" y="194" width="84" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="344" y="224" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1 ≥ 1 ✓</text>
  <rect x="388" y="194" width="108" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="442" y="224" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">不动</text>

  <!-- 行 i=3 -->
  <rect x="24" y="248" width="54" height="52" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="51" y="278" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">i = 3</text>
  <rect x="80" y="248" width="140" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="269" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">（无进场）</text>
  <text x="150" y="287" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">pool = { 3, 3, 2 }</text>
  <rect x="222" y="248" width="78" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="261" y="269" text-anchor="middle" font-size="9" fill="#a07830" font-weight="bold" filter="url(#rough2)">expire[3]=1</text>
  <text x="261" y="287" text-anchor="middle" font-size="9" fill="#a07830" font-weight="bold" filter="url(#rough2)">cur 1→0</text>
  <rect x="302" y="248" width="84" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="344" y="278" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">0 &lt; 1 缺</text>
  <rect x="388" y="248" width="108" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="442" y="269" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">选 r=3（[1,3]）</text>
  <text x="442" y="287" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">cur=1 · used=2</text>

  <!-- 底部总结 -->
  <rect x="24" y="310" width="472" height="108" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="36" y="332" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = q − used = 4 − 2 = 2 ✓（删掉另一条 [1,3] 和 [1,2]，与官方解释一致）</text>
  <text x="36" y="353" font-size="10.5" fill="#333" filter="url(#rough2)">关键①：i=1 券已够 → 一张不选，把「长券」[1,3] 留到 i=3 再用，这正是省券之处</text>
  <text x="36" y="373" font-size="10.5" fill="#333" filter="url(#rough2)">关键②：[0,2] 在 r+1=3 处退役，cur 从 1 落回 0，缺口由堆顶（r 最大的 [1,3]）补上</text>
  <text x="36" y="393" font-size="10.5" fill="#333" filter="url(#rough2)">关键③：若此时 pool 空（或堆顶 r &lt; 3）→ 全体查询都救不了 i=3 → 返回 −1</text>
  <text x="36" y="411" font-size="10" fill="#4a7a3a" filter="url(#rough2)">每条查询至多入堆/出堆一次 → 均摊 O((n + q) log q)</text>
</svg>
