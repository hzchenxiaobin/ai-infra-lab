<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="880" height="560" fill="#fdfcf7"/>
  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">推箱子：复合状态 (箱, 人) + 嵌套 BFS 可达性检查</text>
  <path d="M 210 40 Q 440 48 670 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== LEFT PANEL: push mechanic ===== -->
  <g filter="url(#sk)">
    <rect x="24" y="60" width="396" height="470" rx="10" fill="#eef3fb" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="222" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#34506e">① 一次推动 = 状态转移（代价 1）</text>

  <!-- legend -->
  <g filter="url(#sk2)">
    <rect x="44" y="100" width="14" height="14" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="68" y="100" width="14" height="14" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="92" y="100" width="14" height="14" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="3 2"/>
    <rect x="116" y="100" width="14" height="14" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2"/>
  </g>
  <text x="58" y="111" text-anchor="middle" font-size="9" fill="#34506e">箱</text>
  <text x="82" y="111" text-anchor="middle" font-size="9" fill="#4a7a3a">人</text>
  <text x="106" y="111" text-anchor="middle" font-size="9" fill="#d6a040">标</text>
  <text x="130" y="111" text-anchor="middle" font-size="9" fill="#b85450">推位</text>

  <!-- BEFORE grid 3x3 -->
  <text x="112" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#34506e">推动前</text>
  <!-- cell (0,0) -->
  <g filter="url(#sk2)">
    <rect x="64" y="150" width="36" height="36" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="100" y="150" width="36" height="36" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="3 2"/>
    <rect x="136" y="150" width="36" height="36" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="64" y="186" width="36" height="36" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="100" y="186" width="36" height="36" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="136" y="186" width="36" height="36" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="64" y="222" width="36" height="36" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="100" y="222" width="36" height="36" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="136" y="222" width="36" height="36" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <text x="118" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">B</text>
  <text x="118" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">S</text>
  <text x="118" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040">T</text>

  <!-- push arrow up -->
  <path d="M 118 232 L 118 196" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)" filter="url(#sk2)"/>
  <text x="156" y="214" font-size="10" fill="#b85450" font-weight="bold">推↑</text>

  <!-- big arrow between grids -->
  <path d="M 184 204 L 214 204" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk2)"/>

  <!-- AFTER grid 3x3 -->
  <text x="268" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#34506e">推动后</text>
  <g filter="url(#sk2)">
    <rect x="220" y="150" width="36" height="36" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="256" y="150" width="36" height="36" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="292" y="150" width="36" height="36" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="220" y="186" width="36" height="36" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="256" y="186" width="36" height="36" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="292" y="186" width="36" height="36" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="220" y="222" width="36" height="36" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="256" y="222" width="36" height="36" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="292" y="222" width="36" height="36" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <text x="238" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">B</text>
  <text x="238" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">S</text>
  <!-- star at target reached -->
  <text x="238" y="148" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">★</text>

  <!-- state transition formula -->
  <g filter="url(#sk2)">
    <rect x="44" y="278" width="356" height="100" rx="6" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="222" y="300" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">状态转移规则</text>
  <text x="58" y="320" font-size="11" fill="#444">· 状态 = (箱 r,c , 人 r,c)</text>
  <text x="58" y="338" font-size="11" fill="#444">· 推动方向 d → 箱到 (箱+d)，人到 (箱旧位)</text>
  <text x="58" y="356" font-size="11" fill="#444">· 前提：人须先到达 (箱−d) 的推动位</text>
  <text x="58" y="372" font-size="11" font-weight="bold" fill="#b85450">→ 每次推动代价恒为 1 → BFS 求最少推动</text>

  <!-- state space -->
  <g filter="url(#sk2)">
    <rect x="44" y="392" width="356" height="124" rx="6" fill="#eef6ef" stroke="#4a7e4a" stroke-width="1.2"/>
  </g>
  <text x="222" y="414" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">状态空间规模</text>
  <text x="58" y="434" font-size="11" fill="#444">· 箱位置 m×n 种 × 人位置 m×n 种</text>
  <text x="58" y="452" font-size="11" fill="#444">· 总状态数 ≤ m²n² = 20⁴ = 16 万</text>
  <text x="58" y="470" font-size="11" fill="#444">· 每次转移：内层 BFS O(mn) 查可达</text>
  <text x="58" y="496" font-size="11" font-weight="bold" fill="#2e6e2e">→ 优化：人恒在箱旁，可压到 m×n×4</text>
  <text x="58" y="512" font-size="10.5" fill="#888">（推动后人总在箱的旧位，仅 4 个方向）</text>

  <!-- ===== RIGHT PANEL: nested BFS ===== -->
  <g filter="url(#sk)">
    <rect x="440" y="60" width="416" height="470" rx="10" fill="#eef6ef" stroke="#4a7e4a" stroke-width="1.6"/>
  </g>
  <text x="648" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">② 嵌套 BFS：推动前检查人能否绕到推位</text>

  <!-- 5x5 grid for inner BFS -->
  <!-- grid origin: x=486, y=108, cell=40 -->
  <text x="556" y="126" text-anchor="middle" font-size="10" fill="#888">箱在上中，人需绕墙到达箱左侧推位</text>

  <!-- row 0: . . T . . -->
  <g filter="url(#sk2)">
    <rect x="486" y="132" width="40" height="40" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="526" y="132" width="40" height="40" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="566" y="132" width="40" height="40" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="3 2"/>
    <rect x="606" y="132" width="40" height="40" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="646" y="132" width="40" height="40" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <text x="586" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040">T</text>

  <!-- row 1: . . . . . -->
  <g filter="url(#sk2)">
    <rect x="486" y="172" width="40" height="40" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="526" y="172" width="40" height="40" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="566" y="172" width="40" height="40" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="606" y="172" width="40" height="40" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="646" y="172" width="40" height="40" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>

  <!-- row 2: . . B . . -->
  <g filter="url(#sk2)">
    <rect x="486" y="212" width="40" height="40" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="526" y="212" width="40" height="40" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="3 2"/>
    <rect x="566" y="212" width="40" height="40" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="606" y="212" width="40" height="40" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="646" y="212" width="40" height="40" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <text x="586" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688">B</text>
  <text x="546" y="238" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">推位</text>

  <!-- row 3: S . # . . -->
  <g filter="url(#sk2)">
    <rect x="486" y="252" width="40" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="526" y="252" width="40" height="40" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="566" y="252" width="40" height="40" rx="3" fill="#4a4a4a" stroke="#2a2a2a" stroke-width="1.4"/>
    <rect x="606" y="252" width="40" height="40" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="646" y="252" width="40" height="40" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <text x="506" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">S</text>
  <text x="586" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#fafafa">#</text>

  <!-- row 4: . . . . . -->
  <g filter="url(#sk2)">
    <rect x="486" y="292" width="40" height="40" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="526" y="292" width="40" height="40" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="566" y="292" width="40" height="40" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="606" y="292" width="40" height="40" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="646" y="292" width="40" height="40" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>

  <!-- player path (dashed, going around wall) -->
  <!-- S at (3,0)=cell(486,252) center (506,272) -->
  <!-- path: (3,0)->(4,0)->(4,1)->(4,2)->(4,3)->(3,3)->(2,3)->(1,3)->(1,2)->(1,1)->(2,1) -->
  <!-- centers: (506,272)->(506,312)->(546,312)->(586,312)->(626,312)->(626,272)->(626,232)->(626,192)->(586,192)->(546,192)->(546,232) -->
  <path d="M 506 272 L 506 312 L 546 312 L 586 312 L 626 312 L 626 272 L 626 232 L 626 192 L 586 192 L 546 192 L 546 220"
        stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="5 3" filter="url(#sk2)"/>
  <text x="546" y="230" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- push arrow: box left -->
  <path d="M 580 232 L 552 232" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arR)" filter="url(#sk2)"/>

  <!-- explanation box -->
  <g filter="url(#sk2)">
    <rect x="456" y="348" width="384" height="168" rx="6" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="648" y="370" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">嵌套 BFS 逻辑</text>
  <text x="470" y="392" font-size="11" fill="#444">① 外层 BFS：状态 (箱,人)，每次「推动」= 1 步</text>
  <text x="470" y="410" font-size="11" fill="#444">② 枚举 4 个推动方向 d：</text>
  <text x="470" y="426" font-size="10.5" fill="#666">　 新箱位 = 箱+d（须为地板/非墙/不越界）</text>
  <text x="470" y="442" font-size="10.5" fill="#666">　 推动位 = 箱−d（人须站在此处才能推）</text>
  <text x="470" y="458" font-size="11" fill="#444">③ 内层 BFS：从人当前位置走到推动位</text>
  <text x="470" y="474" font-size="10.5" fill="#b85450" font-weight="bold">　 ⚠ 箱子视为障碍，人不能穿过箱子！</text>
  <text x="470" y="492" font-size="11" fill="#444">④ 可达 → 新状态 (新箱, 箱旧位) 入队</text>
  <text x="470" y="510" font-size="10.5" fill="#888">　 人跟随箱子，落到箱子的旧位置</text>
</svg>
