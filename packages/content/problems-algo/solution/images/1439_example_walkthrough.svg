<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：mat=[[1,3,11],[2,4,6]], k=5, 二分 [3, 17]</text>

  <!-- ====== Matrix display ====== -->
  <text x="40" y="54" font-size="11" fill="#888" font-weight="bold">矩阵：</text>
  <!-- Row 0 -->
  <text x="44" y="76" font-size="9.5" fill="#aaa">行0</text>
  <rect x="70" y="60" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="112" y="60" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <rect x="154" y="60" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">11</text>
  <!-- Row 1 -->
  <text x="44" y="100" font-size="9.5" fill="#aaa">行1</text>
  <rect x="70" y="86" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="112" y="86" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="154" y="86" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>

  <!-- range -->
  <rect x="240" y="64" width="280" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="380" y="84" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">答案区间</text>
  <text x="380" y="102" text-anchor="middle" font-size="11" fill="#555">lo = 1+2 = 3, hi = 11+6 = 17</text>
  <text x="380" y="116" text-anchor="middle" font-size="10" fill="#888">全部组合和：3,5,5,7,7,9,13,15,17</text>

  <!-- divider -->
  <path d="M 40 130 L 520 130" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Binary search steps ====== -->
  <text x="40" y="150" font-size="11" fill="#888" font-weight="bold">二分过程：</text>

  <!-- Step 1: [3,17] mid=10 -->
  <rect x="20" y="160" width="118" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="79" y="180" text-anchor="middle" font-size="10.5" fill="#3a5a2a" font-weight="bold">第1轮 [3,17]</text>
  <text x="79" y="196" text-anchor="middle" font-size="11" fill="#444">mid = 10</text>
  <text x="79" y="212" text-anchor="middle" font-size="10" fill="#4a7a3a">count=6 ≥5 ✓</text>
  <text x="79" y="228" text-anchor="middle" font-size="10" fill="#555">ans=10, hi=9</text>

  <path d="M 138 200 L 162 200" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Step 2: [3,9] mid=6 -->
  <rect x="164" y="160" width="118" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="223" y="180" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">第2轮 [3,9]</text>
  <text x="223" y="196" text-anchor="middle" font-size="11" fill="#444">mid = 6</text>
  <text x="223" y="212" text-anchor="middle" font-size="10" fill="#b85450">count=3 &lt;5 ✗</text>
  <text x="223" y="228" text-anchor="middle" font-size="10" fill="#555">lo = 7</text>

  <path d="M 282 200 L 306 200" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Step 3: [7,9] mid=8 -->
  <rect x="308" y="160" width="118" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="367" y="180" text-anchor="middle" font-size="10.5" fill="#3a5a2a" font-weight="bold">第3轮 [7,9]</text>
  <text x="367" y="196" text-anchor="middle" font-size="11" fill="#444">mid = 8</text>
  <text x="367" y="212" text-anchor="middle" font-size="10" fill="#4a7a3a">count=5 ≥5 ✓</text>
  <text x="367" y="228" text-anchor="middle" font-size="10" fill="#555">ans=8, hi=7</text>

  <path d="M 426 200 L 450 200" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Step 4: [7,7] mid=7 -->
  <rect x="452" y="160" width="100" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="502" y="180" text-anchor="middle" font-size="10.5" fill="#3a5a2a" font-weight="bold">第4轮 [7,7]</text>
  <text x="502" y="196" text-anchor="middle" font-size="11" fill="#444">mid = 7</text>
  <text x="502" y="212" text-anchor="middle" font-size="10" fill="#4a7a3a">count=5 ≥5 ✓</text>
  <text x="502" y="228" text-anchor="middle" font-size="10" fill="#555">ans=7, hi=6</text>

  <!-- divider -->
  <path d="M 40 254 L 520 254" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Count detail for mid=7 ====== -->
  <text x="40" y="274" font-size="11" fill="#888" font-weight="bold">count(7) 展开计数（DFS 行内剪枝）：</text>

  <!-- Row 0: pick 1 -->
  <rect x="40" y="286" width="240" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="304" font-size="10.5" fill="#446688" font-weight="bold">行0 选 1：</text>
  <text x="52" y="322" font-size="10" fill="#555">行1: 1+2=3✓, 1+4=5✓, 1+6=7✓</text>
  <text x="52" y="338" font-size="10" fill="#4a7a3a" font-weight="bold">→ 3 个组合 ≤7</text>

  <!-- Row 0: pick 3 -->
  <rect x="300" y="286" width="240" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="312" y="304" font-size="10.5" fill="#446688" font-weight="bold">行0 选 3：</text>
  <text x="312" y="322" font-size="10" fill="#555">行1: 3+2=5✓, 3+4=7✓, 3+6=9✗break</text>
  <text x="312" y="338" font-size="10" fill="#4a7a3a" font-weight="bold">→ 2 个组合 ≤7</text>

  <!-- Row 0: pick 11 -->
  <rect x="120" y="352" width="320" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">行0 选 11：11 &gt; 7 → break（行有序，后续必更大）</text>

  <!-- total -->
  <rect x="120" y="396" width="320" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">总计 count(7) = 3 + 2 = 5 ≥ k=5 → ans=7</text>

  <!-- result -->
  <rect x="170" y="436" width="220" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0" rx="6" filter="url(#rough2)"/>
  <text x="280" y="451" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">lo=7 &gt; hi=6，返回 ans = 7</text>
</svg>
