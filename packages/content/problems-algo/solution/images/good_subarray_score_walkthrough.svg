<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,4,3,7,4,5],  k = 3</text>
  <text x="320" y="42" text-anchor="middle" font-size="11" fill="#888">从 k=3 出发，逐步扩展窗口，追踪 minVal / 宽度 / 得分</text>

  <!-- Table header -->
  <rect x="48" y="58" width="544" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="76" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">步骤</text>
  <text x="138" y="76" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">l~r</text>
  <text x="260" y="76" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">决策</text>
  <text x="390" y="76" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">min</text>
  <text x="440" y="76" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">宽</text>
  <text x="490" y="76" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">得分</text>
  <text x="548" y="76" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">ans</text>

  <!-- vertical grid lines -->
  <line x1="108" y1="58" x2="108" y2="270" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="168" y1="58" x2="168" y2="270" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="372" y1="58" x2="372" y2="270" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="412" y1="58" x2="412" y2="270" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="468" y1="58" x2="468" y2="270" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="514" y1="58" x2="514" y2="270" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 0: init -->
  <rect x="48" y="86" width="544" height="28" fill="#fafafa" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="78" y="104" text-anchor="middle" font-size="10" fill="#333">初始</text>
  <text x="138" y="104" text-anchor="middle" font-size="10" fill="#333">3~3</text>
  <text x="260" y="104" text-anchor="middle" font-size="9" fill="#888">—</text>
  <text x="390" y="104" text-anchor="middle" font-size="10" fill="#333">7</text>
  <text x="440" y="104" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="490" y="104" text-anchor="middle" font-size="10" fill="#333">7</text>
  <text x="548" y="104" text-anchor="middle" font-size="10" fill="#333">7</text>

  <!-- Row 1: step 1 -->
  <rect x="48" y="114" width="544" height="28" fill="#fafafa" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="78" y="132" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">①</text>
  <text x="138" y="132" text-anchor="middle" font-size="10" fill="#333">3~4</text>
  <text x="260" y="132" text-anchor="middle" font-size="9" fill="#333">3 &lt; 4 → 向右</text>
  <text x="390" y="132" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="440" y="132" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="490" y="132" text-anchor="middle" font-size="10" fill="#333">8</text>
  <text x="548" y="132" text-anchor="middle" font-size="10" fill="#333">8</text>

  <!-- Row 2: step 2 -->
  <rect x="48" y="142" width="544" height="28" fill="#fafafa" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="78" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">②</text>
  <text x="138" y="160" text-anchor="middle" font-size="10" fill="#333">3~5</text>
  <text x="260" y="160" text-anchor="middle" font-size="9" fill="#333">3 &lt; 5 → 向右</text>
  <text x="390" y="160" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="440" y="160" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="490" y="160" text-anchor="middle" font-size="10" fill="#333">12</text>
  <text x="548" y="160" text-anchor="middle" font-size="10" fill="#333">12</text>

  <!-- Row 3: step 3 -->
  <rect x="48" y="170" width="544" height="28" fill="#fafafa" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="78" y="188" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">③</text>
  <text x="138" y="188" text-anchor="middle" font-size="10" fill="#333">2~5</text>
  <text x="260" y="188" text-anchor="middle" font-size="9" fill="#333">右尽 → 向左</text>
  <text x="390" y="188" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <text x="440" y="188" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="490" y="188" text-anchor="middle" font-size="10" fill="#333">12</text>
  <text x="548" y="188" text-anchor="middle" font-size="10" fill="#333">12</text>

  <!-- Row 4: step 4 (optimal, highlighted) -->
  <rect x="48" y="198" width="544" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">④</text>
  <text x="138" y="216" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1~5</text>
  <text x="260" y="216" text-anchor="middle" font-size="9" fill="#333">→ 向左</text>
  <text x="390" y="216" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="440" y="216" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="490" y="216" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">15 ⭐</text>
  <text x="548" y="216" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">15</text>

  <!-- Row 5: step 5 -->
  <rect x="48" y="226" width="544" height="28" fill="#fafafa" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="78" y="244" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">⑤</text>
  <text x="138" y="244" text-anchor="middle" font-size="10" fill="#333">0~5</text>
  <text x="260" y="244" text-anchor="middle" font-size="9" fill="#333">→ 向左</text>
  <text x="390" y="244" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="440" y="244" text-anchor="middle" font-size="10" fill="#333">6</text>
  <text x="490" y="244" text-anchor="middle" font-size="10" fill="#888">6</text>
  <text x="548" y="244" text-anchor="middle" font-size="10" fill="#333">15</text>

  <!-- outer border -->
  <rect x="48" y="58" width="544" height="196" fill="none" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <!-- Bottom note -->
  <rect x="48" y="280" width="544" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="302" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">关键：步骤 ①② 向右扩展（右侧值更大，minVal 保持 4 不降）</text>
  <text x="320" y="320" text-anchor="middle" font-size="11" fill="#444">步骤 ③④⑤ 向左被迫扩展（右侧到头），minVal 在 ④ 降到 3 但宽度涨到 5 → 得分 15 最优</text>
</svg>
