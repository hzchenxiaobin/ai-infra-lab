<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 演算：nums = [3, 5, 9]，两次查询答案 12 + 9 = 21</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#888">节点值按 (f00, f01, f10, f11) 排列；下图是查询① [1, −2] 之后的线段树</text>

  <!-- tree after query 1 -->
  <line x1="265" y1="100" x2="146" y2="138" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="265" y1="100" x2="380" y2="138" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="146" y1="182" x2="84" y2="220" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="146" y1="182" x2="247" y2="220" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>

  <rect x="180" y="56" width="170" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="265" y="74" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">根 [0..2]</text>
  <text x="265" y="92" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(0, 9, 3, 12)</text>
  <text x="422" y="74" font-size="10" fill="#4a7a3a" font-weight="bold">← 本次答案</text>
  <text x="422" y="90" font-size="10" fill="#4a7a3a" font-weight="bold">max = 12 = 3+9</text>

  <rect x="56" y="138" width="180" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="146" y="156" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">[0..1]（被上推重算）</text>
  <text x="146" y="174" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">(0, −2, 3, −∞)</text>

  <rect x="310" y="138" width="140" height="44" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="380" y="156" text-anchor="middle" font-size="10" fill="#888">[2..2]（不动）</text>
  <text x="380" y="174" text-anchor="middle" font-size="11" fill="#555">(0, −∞, −∞, 9)</text>

  <rect x="14" y="220" width="140" height="44" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="84" y="238" text-anchor="middle" font-size="10" fill="#888">[0..0]</text>
  <text x="84" y="256" text-anchor="middle" font-size="11" fill="#555">(0, −∞, −∞, 3)</text>

  <rect x="172" y="220" width="150" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="247" y="238" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">[1..1] ← 查询①改这里</text>
  <text x="247" y="256" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">(0, −∞, −∞, −2)</text>

  <!-- query 2 flow -->
  <text x="36" y="288" font-size="11" fill="#444" font-weight="bold">查询② [0, −3]：</text>
  <rect x="36" y="296" width="140" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="106" y="314" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">叶 [0..0] ← −3</text>
  <text x="106" y="332" text-anchor="middle" font-size="10" fill="#b85450">(0, −∞, −∞, −3)</text>
  <path d="M 180 318 L 196 318" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="296" width="150" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="275" y="314" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">[0..1] 重算</text>
  <text x="275" y="332" text-anchor="middle" font-size="10" fill="#d6a040">(0, −2, −3, −∞)</text>
  <path d="M 354 318 L 370 318" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="374" y="296" width="140" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="444" y="314" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">根重算 → 答案 9</text>
  <text x="444" y="332" text-anchor="middle" font-size="10" fill="#446688">(0, 9, −3, 6)</text>

  <!-- bottom note -->
  <rect x="36" y="354" width="478" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="275" y="375" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">答案之和 = 12 + 9 = 21 ✓（查询①的修改在查询②仍生效：nums[1] = −2 保持不变）</text>
  <text x="275" y="396" text-anchor="middle" font-size="10" fill="#555">注意 −∞ 与普通负数并存：f11 = −2 / −3 是「必选」的合法负值，只是被根上的 max 滤掉</text>
</svg>
