<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：word="998244353"，m=3</text>

  <!-- table outline -->
  <rect x="36" y="44" width="488" height="280" fill="none" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>

  <!-- header row -->
  <rect x="36" y="44" width="488" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="86" y1="44" x2="86" y2="324" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="146" y1="44" x2="146" y2="324" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="236" y1="44" x2="236" y2="324" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="386" y1="44" x2="386" y2="324" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <text x="61"  y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">i</text>
  <text x="116" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">d=word[i]</text>
  <text x="191" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">r_old</text>
  <text x="311" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">r_old×10+d</text>
  <text x="436" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">% 3 = r_new</text>
  <text x="504" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">div[i]</text>

  <!-- row data: i, d, r_old, r*10+d, r_new, div -->
  <!-- r0: 0,9,0,9,0,1 -->
  <text x="61"  y="86"  text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="116" y="86"  text-anchor="middle" font-size="12" fill="#333">9</text>
  <text x="191" y="86"  text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="311" y="86"  text-anchor="middle" font-size="12" fill="#333">0×10+9 = 9</text>
  <text x="436" y="86"  text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="504" y="86"  text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- r1: 1,9,0,9,0,1 -->
  <text x="61"  y="110" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="116" y="110" text-anchor="middle" font-size="12" fill="#333">9</text>
  <text x="191" y="110" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="311" y="110" text-anchor="middle" font-size="12" fill="#333">0×10+9 = 9</text>
  <text x="436" y="110" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="504" y="110" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- r2: 2,8,0,8,2,0 -->
  <text x="61"  y="134" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="116" y="134" text-anchor="middle" font-size="12" fill="#333">8</text>
  <text x="191" y="134" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="311" y="134" text-anchor="middle" font-size="12" fill="#333">0×10+8 = 8</text>
  <text x="436" y="134" text-anchor="middle" font-size="12" fill="#b85450">2</text>
  <text x="504" y="134" text-anchor="middle" font-size="12" fill="#b85450">0</text>

  <!-- r3: 3,2,2,22,1,0 -->
  <text x="61"  y="158" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="116" y="158" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="191" y="158" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="311" y="158" text-anchor="middle" font-size="12" fill="#333">2×10+2 = 22</text>
  <text x="436" y="158" text-anchor="middle" font-size="12" fill="#b85450">1</text>
  <text x="504" y="158" text-anchor="middle" font-size="12" fill="#b85450">0</text>

  <!-- r4: 4,4,1,14,2,0 -->
  <text x="61"  y="182" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="116" y="182" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="191" y="182" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="311" y="182" text-anchor="middle" font-size="12" fill="#333">1×10+4 = 14</text>
  <text x="436" y="182" text-anchor="middle" font-size="12" fill="#b85450">2</text>
  <text x="504" y="182" text-anchor="middle" font-size="12" fill="#b85450">0</text>

  <!-- r5: 5,4,2,24,0,1 -->
  <text x="61"  y="206" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="116" y="206" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="191" y="206" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="311" y="206" text-anchor="middle" font-size="12" fill="#333">2×10+4 = 24</text>
  <text x="436" y="206" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="504" y="206" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- r6: 6,3,0,3,0,1 -->
  <text x="61"  y="230" text-anchor="middle" font-size="12" fill="#333">6</text>
  <text x="116" y="230" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="191" y="230" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="311" y="230" text-anchor="middle" font-size="12" fill="#333">0×10+3 = 3</text>
  <text x="436" y="230" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="504" y="230" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- r7: 7,5,0,5,2,0 -->
  <text x="61"  y="254" text-anchor="middle" font-size="12" fill="#333">7</text>
  <text x="116" y="254" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="191" y="254" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="311" y="254" text-anchor="middle" font-size="12" fill="#333">0×10+5 = 5</text>
  <text x="436" y="254" text-anchor="middle" font-size="12" fill="#b85450">2</text>
  <text x="504" y="254" text-anchor="middle" font-size="12" fill="#b85450">0</text>

  <!-- r8: 8,3,2,23,2,0 -->
  <text x="61"  y="278" text-anchor="middle" font-size="12" fill="#333">8</text>
  <text x="116" y="278" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="191" y="278" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="311" y="278" text-anchor="middle" font-size="12" fill="#333">2×10+3 = 23</text>
  <text x="436" y="278" text-anchor="middle" font-size="12" fill="#b85450">2</text>
  <text x="504" y="278" text-anchor="middle" font-size="12" fill="#b85450">0</text>

  <!-- result -->
  <rect x="36" y="294" width="488" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="313" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">div = [1, 1, 0, 0, 0, 1, 1, 0, 0]</text>

  <!-- footer note -->
  <text x="280" y="348" text-anchor="middle" font-size="10.5" fill="#888">r_new==0（绿）即整除 → div[i]=1；余数非 0（红）→ div[i]=0；r 始终在 [0, m) 内滚动</text>
</svg>
