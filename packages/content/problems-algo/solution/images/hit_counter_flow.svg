<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：hit 入队 + getHits 滚动清理</text>

  <!-- ===== hit flow (left) ===== -->
  <rect x="25" y="56" width="190" height="210" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)" opacity="0.4"/>
  <text x="120" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">hit(timestamp)</text>

  <ellipse cx="120" cy="108" rx="42" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="113" text-anchor="middle" font-size="11" fill="#333">入口</text>

  <line x1="120" y1="126" x2="120" y2="148" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="152" width="140" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="120" y="172" text-anchor="middle" font-size="11" fill="#333">queue.push(ts)</text>
  <text x="120" y="187" text-anchor="middle" font-size="9" fill="#888">O(1)，不清理</text>

  <line x1="120" y1="196" x2="120" y2="218" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <ellipse cx="120" cy="238" rx="42" ry="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="243" text-anchor="middle" font-size="11" fill="#333">完成</text>

  <text x="120" y="286" text-anchor="middle" font-size="10" fill="#4a7a3a">hit 只负责入队</text>
  <text x="120" y="302" text-anchor="middle" font-size="9" fill="#888">清理留给 getHits 摊还</text>

  <!-- ===== getHits flow (right) ===== -->
  <text x="370" y="78" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">getHits(timestamp)</text>

  <ellipse cx="370" cy="108" rx="42" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="113" text-anchor="middle" font-size="11" fill="#333">入口</text>

  <line x1="370" y1="126" x2="370" y2="142" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="370,146 470,186 370,226 270,186" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="182" text-anchor="middle" font-size="10" fill="#333">queue 非空</text>
  <text x="370" y="196" text-anchor="middle" font-size="10" fill="#333">且 t−front ≥ 300?</text>

  <!-- yes (right) to pop -->
  <line x1="470" y1="186" x2="492" y2="186" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="480" y="178" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>

  <rect x="492" y="166" width="58" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="521" y="184" text-anchor="middle" font-size="10" fill="#333">pop</text>
  <text x="521" y="198" text-anchor="middle" font-size="9" fill="#888">front</text>

  <!-- loop back from pop to diamond top -->
  <path d="M 521 166 L 521 128 L 370 128 L 370 146" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrRed)" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="445" y="122" text-anchor="middle" font-size="9" fill="#b85450">循环清理</text>

  <!-- no (down) to return -->
  <line x1="370" y1="226" x2="370" y2="250" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="382" y="242" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <rect x="290" y="254" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="370" y="273" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return queue.size()</text>
  <text x="370" y="287" text-anchor="middle" font-size="9" fill="#888">窗口内敲击数</text>

  <line x1="370" y1="294" x2="370" y2="314" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <ellipse cx="370" cy="334" rx="42" ry="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="339" text-anchor="middle" font-size="11" fill="#333">完成</text>

  <!-- separator -->
  <line x1="235" y1="56" x2="235" y2="370" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- bottom: amortized analysis -->
  <rect x="25" y="320" width="190" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="39" y="342" font-size="11" fill="#4a7a3a" font-weight="bold">摊还分析：</text>
  <text x="39" y="360" font-size="10" fill="#555">每个 ts 最多入队 1 次、</text>
  <text x="39" y="376" font-size="10" fill="#555">出队 1 次，总操作 ≤ 2N。</text>
  <text x="39" y="394" font-size="10" fill="#b85450" font-weight="bold">单次最坏 O(N)（积压</text>
  <text x="39" y="406" font-size="10" fill="#b85450">后一次性清理）</text>
</svg>
