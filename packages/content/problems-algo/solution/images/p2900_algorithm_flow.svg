<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：一趟扫描，遇「值切换」即选中</text>

  <!-- start -->
  <rect x="225" y="38" width="150" height="32" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="58" text-anchor="middle" font-size="12" fill="#33507a" filter="url(#rough2)">开始：ans = []</text>

  <path d="M 300 70 L 300 80" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="300,84 355,116 300,148 245,116" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="120" text-anchor="middle" font-size="12" fill="#33507a" filter="url(#rough2)">i &lt; n ?</text>

  <!-- no -> return -->
  <path d="M 355 116 L 411 116" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="383" y="110" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="415" y="98" width="105" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="467" y="120" text-anchor="middle" font-size="12" fill="#8c3a36" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- yes -->
  <path d="M 300 148 L 300 164" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="313" y="162" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- diamond 2 -->
  <polygon points="300,170 445,208 300,246 155,208" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="204" text-anchor="middle" font-size="12" fill="#b07818" filter="url(#rough2)">i == 0 或</text>
  <text x="300" y="224" text-anchor="middle" font-size="12" fill="#b07818" filter="url(#rough2)">groups[i] ≠ groups[i−1] ?</text>

  <!-- yes -> pick -->
  <path d="M 300 246 L 300 260" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="313" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="205" y="264" width="190" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="286" text-anchor="middle" font-size="12" fill="#2e5c22" filter="url(#rough2)">ans 追加 words[i]</text>

  <!-- no -> bypass -->
  <path d="M 445 208 L 505 208 L 505 282 L 401 282" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="468" y="202" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- increment -->
  <path d="M 300 300 L 300 314" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="245" y="318" width="110" height="32" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="338" text-anchor="middle" font-size="12" fill="#33507a" filter="url(#rough2)">i ← i + 1</text>

  <!-- loop back -->
  <path d="M 245 334 L 120 334 L 120 116 L 238 116" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- bottom note -->
  <text x="280" y="384" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">判据恰选中每个连续同值段的首元素（含 i=0）：无特判、无回溯、无额外状态</text>
</svg>
