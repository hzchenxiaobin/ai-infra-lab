<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：无平局直接取最大；平局取字典序最大名</text>

  <rect x="20" y="44" width="500" height="196" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="40" y="66" font-size="12.5" fill="#446688" font-weight="bold">示例 1：Alice 共 5 词，最多且无平局 → 返回 "Alice"</text>

  <rect x="40" y="80" width="140" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="2.6" rx="8" filter="url(#rough2)"/>
  <text x="110" y="102" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">Alice</text>
  <text x="110" y="128" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">= 5</text>
  <rect x="140" y="84" width="36" height="15" fill="#b85450" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="158" y="95" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">MAX</text>

  <rect x="200" y="80" width="140" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="102" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">userThree</text>
  <text x="270" y="128" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">= 3</text>

  <rect x="360" y="80" width="140" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="102" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">userTwo</text>
  <text x="430" y="128" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">= 2</text>

  <text x="270" y="170" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">5 &gt; 3 &gt; 2，唯一最大，无平局</text>
  <rect x="160" y="184" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="209" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return "Alice" ✓</text>

  <rect x="20" y="252" width="500" height="166" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="40" y="274" font-size="12.5" fill="#d6a040" font-weight="bold">示例 2：Bob 与 Charlie 均 5 词，平局 → 取字典序最大的名字</text>

  <rect x="90" y="290" width="160" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="312" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">Bob</text>
  <text x="170" y="338" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">= 5</text>

  <rect x="290" y="290" width="160" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" rx="8" filter="url(#rough2)"/>
  <text x="370" y="312" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">Charlie</text>
  <text x="370" y="338" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">= 5</text>
  <rect x="414" y="294" width="36" height="15" fill="#b85450" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="432" y="305" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">WIN</text>

  <text x="270" y="374" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">"Bob" vs "Charlie"：首字符 'B'(66) &lt; 'C'(67) → "Charlie" 字典序更大</text>
  <rect x="150" y="384" width="240" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="403" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return "Charlie" ✓</text>

  <rect x="20" y="430" width="500" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="40" y="448" font-size="11" fill="#b85450" font-weight="bold">⚠ 平局取字典序最大名：ASCII 序大写 &lt; 小写（'A'65 &lt; 'a'97），默认字符串比较即满足，勿 case-fold</text>
  <text x="40" y="464" font-size="10.5" fill="#b85450">"Alice" &lt; "alice"（'A' &lt; 'a'），二者不同名；题目的"字典序"即字节序，非字母序</text>
</svg>
