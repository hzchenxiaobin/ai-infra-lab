<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#999"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：排序后贪心配对，给每个位置分配严格更大的值</text>

  <!-- 上行：待分配的值 perm（排序后） -->
  <text x="60" y="64" font-size="13" fill="#666" filter="url(#rough2)">分配的值</text>
  <text x="60" y="80" font-size="12" fill="#999" filter="url(#rough2)">(排序后)</text>
  <g filter="url(#rough2)">
    <!-- idx 0,1,2: 1,1,1 未用 -->
    <rect x="120" y="58" width="46" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" stroke-dasharray="3,2"/>
    <text x="143" y="78" text-anchor="middle" font-size="13" fill="#999">1</text>
    <rect x="172" y="58" width="46" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" stroke-dasharray="3,2"/>
    <text x="195" y="78" text-anchor="middle" font-size="13" fill="#999">1</text>
    <rect x="224" y="58" width="46" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" stroke-dasharray="3,2"/>
    <text x="247" y="78" text-anchor="middle" font-size="13" fill="#999">1</text>
    <!-- idx 3,4,5,6: 2,3,3,5 已匹配 -->
    <rect x="276" y="58" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="299" y="78" text-anchor="middle" font-size="13" fill="#333">2</text>
    <rect x="328" y="58" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="351" y="78" text-anchor="middle" font-size="13" fill="#333">3</text>
    <rect x="380" y="58" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="403" y="78" text-anchor="middle" font-size="13" fill="#333">3</text>
    <rect x="432" y="58" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <text x="455" y="78" text-anchor="middle" font-size="13" fill="#333">5</text>
  </g>
  <text x="299" y="48" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">↑ 被选作配对</text>

  <!-- 下行：位置阈值 nums（排序后） -->
  <text x="60" y="248" font-size="13" fill="#666" filter="url(#rough2)">位置阈值</text>
  <text x="60" y="264" font-size="12" fill="#999" filter="url(#rough2)">(排序后)</text>
  <g filter="url(#rough2)">
    <!-- idx 0,1,2,3: 1,1,1,2 已匹配 -->
    <rect x="120" y="236" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="143" y="256" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="172" y="236" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="195" y="256" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="224" y="236" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="247" y="256" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="276" y="236" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="299" y="256" text-anchor="middle" font-size="13" fill="#333">2</text>
    <!-- idx 4,5,6: 3,3,5 未匹配 -->
    <rect x="328" y="236" width="46" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" stroke-dasharray="3,2"/>
    <text x="351" y="256" text-anchor="middle" font-size="13" fill="#999">3</text>
    <rect x="380" y="236" width="46" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" stroke-dasharray="3,2"/>
    <text x="403" y="256" text-anchor="middle" font-size="13" fill="#999">3</text>
    <rect x="432" y="236" width="46" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" stroke-dasharray="3,2"/>
    <text x="455" y="256" text-anchor="middle" font-size="13" fill="#999">5</text>
  </g>
  <text x="351" y="286" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">↑ 找不到更大的值，留作「未满足」</text>

  <!-- 配对箭头：从下方阈值 → 上方值，弯向右 -->
  <g filter="url(#rough2)">
    <path d="M143,236 C200,180 250,140 299,90" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M195,236 C240,185 290,140 351,90" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M247,236 C280,190 330,145 403,90" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M299,236 C330,195 380,145 455,90" fill="none" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arr)"/>
  </g>

  <!-- 逐对标注 perm > nums -->
  <text x="225" y="160" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2&gt;1 ✓</text>
  <text x="277" y="172" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3&gt;1 ✓</text>
  <text x="329" y="160" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3&gt;1 ✓</text>
  <text x="381" y="172" font-size="11" fill="#4a7a3a" filter="url(#rough2)">5&gt;2 ✓</text>

  <!-- 答案 -->
  <rect x="210" y="316" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="338" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">最大伟大值 = 4</text>

  <text x="300" y="366" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">排序后双指针：小阈值配最小够大的值，4 个位置被满足</text>
</svg>
