<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：异或标记所有「不同位」</text>

  <!-- bit position header -->
  <text x="180" y="58" text-anchor="middle" font-size="10" fill="#888">bit3</text>
  <text x="240" y="58" text-anchor="middle" font-size="10" fill="#888">bit2</text>
  <text x="300" y="58" text-anchor="middle" font-size="10" fill="#888">bit1</text>
  <text x="360" y="58" text-anchor="middle" font-size="10" fill="#888">bit0</text>

  <!-- ===== start = 10 = 1010 ===== -->
  <text x="44" y="86" font-size="12.5" fill="#446688" font-weight="bold">start = 10</text>
  <text x="44" y="102" font-size="10" fill="#888">二进制</text>
  <rect x="155" y="66" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="180" y="90" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="215" y="66" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="90" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="275" y="66" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="300" y="90" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="335" y="66" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="360" y="90" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>

  <!-- XOR symbol -->
  <text x="108" y="148" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">^</text>
  <line x1="155" y1="116" x2="385" y2="116" stroke="#888" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== goal = 7 = 0111 ===== -->
  <text x="44" y="146" font-size="12.5" fill="#446688" font-weight="bold">goal = 7</text>
  <text x="44" y="162" font-size="10" fill="#888">二进制</text>
  <rect x="155" y="126" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="180" y="150" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="215" y="126" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="150" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="275" y="126" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="300" y="150" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="335" y="126" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="360" y="150" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>

  <!-- equals line -->
  <text x="108" y="196" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">=</text>
  <line x1="155" y1="176" x2="385" y2="176" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- ===== start ^ goal = 13 = 1101 ===== -->
  <text x="44" y="206" font-size="12.5" fill="#b85450" font-weight="bold">异或 = 13</text>
  <text x="44" y="222" font-size="10" fill="#888">不同位标 1</text>
  <rect x="155" y="186" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="210" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <rect x="215" y="186" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="210" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <rect x="275" y="186" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="300" y="210" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="335" y="186" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="210" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <text x="410" y="210" font-size="11" fill="#b85450" font-weight="bold">↑ 3 个 1 = 3 处不同</text>

  <!-- arrow down to formula -->
  <path d="M 270 226 Q 270 238 270 246" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- formula box -->
  <rect x="60" y="250" width="420" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="272" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">异或的每个 1 = 一处不同 = 需要翻转一次</text>

  <!-- truth table mini -->
  <rect x="60" y="300" width="420" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="80" y="320" font-size="11" fill="#d6a040" font-weight="bold">异或真值表：</text>
  <text x="190" y="320" font-size="11.5" fill="#333">0 ^ 0 = 0</text>
  <text x="290" y="320" font-size="11.5" fill="#333">1 ^ 1 = 0</text>
  <text x="80" y="340" font-size="11" fill="#b85450" font-weight="bold">相同→0（无需翻转）</text>
  <text x="240" y="320" font-size="11.5" fill="#b85450" font-weight="bold">0 ^ 1 = 1</text>
  <text x="340" y="320" font-size="11.5" fill="#b85450" font-weight="bold">1 ^ 0 = 1</text>
  <text x="240" y="340" font-size="11" fill="#b85450" font-weight="bold">不同→1（需翻转）</text>

  <!-- bottom note -->
  <rect x="60" y="364" width="420" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="270" y="386" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">最少翻转次数 = popcount(start ^ goal)</text>
</svg>
