<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    示例演算：s = "K1:L2"
  </text>

  <!-- column headers K L -->
  <g filter="url(#rough2)" font-size="14" fill="#446688" text-anchor="middle">
    <text x="180" y="72">K</text>
    <text x="260" y="72">L</text>
  </g>
  <!-- row headers 1 2 -->
  <g filter="url(#rough2)" font-size="14" fill="#446688" text-anchor="middle">
    <text x="136" y="100">1</text>
    <text x="136" y="150">2</text>
  </g>

  <!-- 2x2 grid, cell 80x50, start x=140 y=80 -->
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.4" fill="#e8f0fe">
    <rect x="140" y="80" width="80" height="50" rx="3"/>
    <rect x="220" y="80" width="80" height="50" rx="3"/>
    <rect x="140" y="130" width="80" height="50" rx="3"/>
    <rect x="220" y="130" width="80" height="50" rx="3"/>
  </g>

  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="180" y="111">K1</text>
    <text x="260" y="111">L1</text>
    <text x="180" y="161">K2</text>
    <text x="260" y="161">L2</text>
  </g>

  <!-- traversal order arrows: K1 -> K2 -> L1 -> L2 -->
  <!-- K1(180,105) -> K2(180,155): down -->
  <path d="M 180,135 L 180,148" stroke="#b85450" stroke-width="2" fill="none"
        marker-end="url(#arr3)" filter="url(#rough2)"/>
  <!-- K2(180,155) -> L1(260,105): diagonal up-right (end of col K, jump to next col L top) -->
  <path d="M 222,155 Q 290,180 260,135" stroke="#b85450" stroke-width="2" fill="none"
        stroke-dasharray="5,4" marker-end="url(#arr3)" filter="url(#rough2)"/>
  <!-- L1(260,105) -> L2(260,155): down -->
  <path d="M 260,135 L 260,148" stroke="#b85450" stroke-width="2" fill="none"
        marker-end="url(#arr3)" filter="url(#rough2)"/>

  <!-- order badges -->
  <g filter="url(#rough2)" font-size="11" fill="#b85450" text-anchor="middle">
    <circle cx="150" cy="90" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="150" y="93">1</text>
    <circle cx="150" cy="140" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="150" y="143">2</text>
    <circle cx="290" cy="90" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="290" y="93">3</text>
    <circle cx="290" cy="140" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="290" y="143">4</text>
  </g>

  <!-- result list panel -->
  <rect x="330" y="80" width="170" height="120" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="345" y="102" font-size="12" fill="#4a7a3a" filter="url(#rough2)">输出 ans：</text>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <text x="345" y="124">["K1",</text>
    <text x="345" y="144"> "K2",</text>
    <text x="345" y="164"> "L1",</text>
    <text x="345" y="184"> "L2"]</text>
  </g>

  <!-- walkthrough table -->
  <text x="60" y="212" font-size="13" fill="#333" filter="url(#rough2)">逐步过程：</text>
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.1" fill="none">
    <rect x="60" y="222" width="400" height="118" rx="4"/>
    <line x1="60" y1="250" x2="460" y2="250"/>
    <line x1="60" y1="284" x2="460" y2="284"/>
    <line x1="160" y1="222" x2="160" y2="340"/>
    <line x1="300" y1="222" x2="300" y2="340"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#446688" text-anchor="middle">
    <text x="110" y="241">外层列 c</text>
    <text x="230" y="241">内层行 r</text>
    <text x="380" y="241">拼装 &amp; ans</text>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="110" y="269">K</text>
    <text x="230" y="269">1 → 2</text>
    <text x="380" y="269">"K1", "K2"</text>
    <text x="110" y="303">L</text>
    <text x="230" y="303">1 → 2</text>
    <text x="380" y="303">"L1", "L2"</text>
    <text x="110" y="328">结束</text>
    <text x="230" y="328">—</text>
    <text x="380" y="328">返回 4 项</text>
  </g>
</svg>
