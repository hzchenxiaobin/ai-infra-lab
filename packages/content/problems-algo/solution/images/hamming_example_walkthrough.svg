<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：x = 1, y = 4，汉明距离 = 2</text>

  <!-- ===== Phase 1 header ===== -->
  <rect x="30" y="48" width="170" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="115" y="68" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">第一步：异或归约</text>

  <!-- Row x = 1 = 0001 -->
  <text x="44" y="96" font-size="12.5" fill="#446688" font-weight="bold">x = 1</text>
  <rect x="180" y="78" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="201" y="100" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="230" y="78" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="251" y="100" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="280" y="78" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="301" y="100" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="330" y="78" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="351" y="100" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>

  <!-- Row y = 4 = 0100 -->
  <text x="44" y="140" font-size="12.5" fill="#d6a040" font-weight="bold">y = 4</text>
  <rect x="180" y="122" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="201" y="144" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="230" y="122" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="251" y="144" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="280" y="122" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="301" y="144" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="330" y="122" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="351" y="144" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>

  <!-- differ markers -->
  <text x="251" y="74" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">↓异</text>
  <text x="351" y="74" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">↓异</text>

  <!-- XOR line -->
  <text x="158" y="172" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">^</text>
  <line x1="180" y1="164" x2="372" y2="164" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- Row z = 5 = 0101 -->
  <text x="44" y="200" font-size="12.5" fill="#4a7a3a" font-weight="bold">z = 5</text>
  <rect x="180" y="182" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="201" y="204" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="230" y="182" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="251" y="204" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <rect x="280" y="182" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="301" y="204" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="330" y="182" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="351" y="204" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <text x="384" y="204" font-size="10.5" fill="#b85450" font-weight="bold">← 2 个 1 = 2 处差异</text>

  <!-- divider -->
  <line x1="40" y1="232" x2="520" y2="232" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Phase 2 header ===== -->
  <rect x="30" y="244" width="200" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="130" y="264" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">第二步：Brian Kernighan 计数</text>

  <!-- Row 0: count=0, z=5=0101 -->
  <rect x="34" y="284" width="86" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="77" y="304" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">count = 0</text>
  <text x="140" y="304" font-size="12.5" fill="#446688" font-weight="bold">z = 5</text>
  <rect x="180" y="282" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="201" y="304" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="230" y="282" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="251" y="304" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="280" y="282" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="301" y="304" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="330" y="282" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="351" y="304" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <text x="384" y="304" font-size="10.5" fill="#b85450" font-weight="bold">↑ 最低设置位</text>

  <!-- arrow 1 -->
  <path d="M 351 318 Q 351 328 351 336" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="366" y="330" font-size="10.5" fill="#888">z &amp;= z−1（抹掉 bit0）</text>

  <!-- Row 1: count=1, z=4=0100 -->
  <rect x="34" y="342" width="86" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="77" y="362" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">count = 1</text>
  <text x="140" y="362" font-size="12.5" fill="#446688" font-weight="bold">z = 4</text>
  <rect x="180" y="340" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="201" y="362" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="230" y="340" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="251" y="362" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <rect x="280" y="340" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="301" y="362" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="330" y="340" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="351" y="362" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <text x="384" y="362" font-size="10.5" fill="#b85450" font-weight="bold">↑ 最低设置位</text>

  <!-- arrow 2 -->
  <path d="M 251 376 Q 251 386 251 394" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="266" y="388" font-size="10.5" fill="#888">z &amp;= z−1（抹掉 bit2）</text>

  <!-- Row 2: count=2, z=0=0000 -->
  <rect x="34" y="400" width="86" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="77" y="420" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">count = 2</text>
  <text x="140" y="420" font-size="12.5" fill="#888" font-weight="bold">z = 0</text>
  <rect x="180" y="398" width="42" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="201" y="420" text-anchor="middle" font-size="15" fill="#bbb" font-weight="bold">0</text>
  <rect x="230" y="398" width="42" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="251" y="420" text-anchor="middle" font-size="15" fill="#bbb" font-weight="bold">0</text>
  <rect x="280" y="398" width="42" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="301" y="420" text-anchor="middle" font-size="15" fill="#bbb" font-weight="bold">0</text>
  <rect x="330" y="398" width="42" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="351" y="420" text-anchor="middle" font-size="15" fill="#bbb" font-weight="bold">0</text>
  <text x="384" y="420" font-size="11" fill="#888" font-weight="bold">z = 0，停止 ✓</text>

  <!-- result box -->
  <rect x="180" y="438" width="220" height="0" fill="none"/>
  <text x="280" y="450" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">循环 2 次 = 2 处差异，返回 count = 2</text>
</svg>
