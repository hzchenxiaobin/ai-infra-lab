<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：三种形态一步命中</text>

  <!-- 表格外框与表头 -->
  <rect x="42" y="58" width="358" height="232" rx="6" fill="#ffffff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="42" y="58" width="358" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="72" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">n</text>
  <text x="171" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">二进制（b 位）</text>
  <text x="283" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">填满 = 2^b − 1</text>
  <text x="368" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">答案</text>

  <line x1="102" y1="58" x2="102" y2="290" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="240" y1="58" x2="240" y2="290" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="326" y1="58" x2="326" y2="290" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="42" y1="96" x2="400" y2="96" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="42" y1="161" x2="400" y2="161" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="42" y1="226" x2="400" y2="226" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 行 1：n = 5 -->
  <text x="72" y="133" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <rect x="139" y="104" width="20" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="161" y="104" width="20" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="183" y="104" width="20" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="149" y="122" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="171" y="122" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="193" y="122" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="171" y="152" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">b = 3</text>
  <rect x="251" y="104" width="20" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="273" y="104" width="20" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="295" y="104" width="20" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="261" y="122" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="283" y="122" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="305" y="122" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="368" y="133" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">7</text>

  <!-- 行 2：n = 10 -->
  <text x="72" y="198" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">10</text>
  <rect x="132" y="169" width="20" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="154" y="169" width="20" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="176" y="169" width="20" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="198" y="169" width="20" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="142" y="187" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="164" y="187" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="186" y="187" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="208" y="187" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="171" y="217" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">b = 4</text>
  <rect x="240" y="169" width="20" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="262" y="169" width="20" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="284" y="169" width="20" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="306" y="169" width="20" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="187" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="272" y="187" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="294" y="187" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="316" y="187" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="368" y="198" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">15</text>

  <!-- 行 3：n = 3（本身全 1） -->
  <text x="72" y="263" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="151" y="234" width="20" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="173" y="234" width="20" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="161" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="183" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="171" y="282" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">b = 2</text>
  <rect x="262" y="234" width="20" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="284" y="234" width="20" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="272" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="294" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="368" y="263" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>

  <!-- 行 3 右侧注释 -->
  <rect x="410" y="232" width="100" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="460" y="254" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">n 已全 1</text>
  <text x="460" y="274" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">返回自身 ✓</text>

  <!-- 底部说明 -->
  <rect x="42" y="306" width="436" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="333" text-anchor="middle" font-size="13" fill="#b8860b" filter="url(#rough2)">无需 if 分支：「大于等于」的等号被位宽夹逼自动吸收</text>
</svg>
