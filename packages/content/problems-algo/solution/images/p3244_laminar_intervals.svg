<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrc" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8899aa"/>
    </marker>
    <marker id="arrgr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arror" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrrd" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">两条查询区间的相对位置：题目只封杀「交叉」</text>

  <!-- ============ ✓ 允许 ============ -->
  <text x="48" y="52" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓ 允许</text>

  <!-- 链 A：不相交 / 相接（y=90） -->
  <path d="M 97 90 L 125 90" stroke="#8899aa" stroke-width="1.5" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <path d="M 162 90 L 190 90" stroke="#8899aa" stroke-width="1.5" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <path d="M 227 90 L 255 90" stroke="#8899aa" stroke-width="1.5" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <path d="M 292 90 L 320 90" stroke="#8899aa" stroke-width="1.5" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <path d="M 80 76 Q 145 42 194 76" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <path d="M 226 76 Q 288 42 337 76" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <text x="138" y="50" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">(0,2)</text>
  <text x="282" y="50" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">(2,4)</text>
  <circle cx="80" cy="90" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="145" cy="90" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="210" cy="90" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="275" cy="90" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="340" cy="90" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="94" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="145" y="94" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="210" y="94" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="275" y="94" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="340" y="94" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="365" y="88" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">不相交 / 端点相接</text>
  <text x="365" y="103" font-size="9.5" fill="#888" filter="url(#rough2)">(0,2) 与 (2,4) 在点 2 相接</text>

  <!-- 链 B：嵌套（y=152） -->
  <path d="M 97 152 L 125 152" stroke="#8899aa" stroke-width="1.5" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <path d="M 162 152 L 190 152" stroke="#8899aa" stroke-width="1.5" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <path d="M 227 152 L 255 152" stroke="#8899aa" stroke-width="1.5" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <path d="M 292 152 L 320 152" stroke="#8899aa" stroke-width="1.5" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <path d="M 80 138 Q 210 92 337 138" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <path d="M 145 140 Q 210 118 272 140" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arror)" filter="url(#rough2)"/>
  <text x="210" y="106" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">(0,4)</text>
  <circle cx="80" cy="152" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="145" cy="152" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="210" cy="152" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="275" cy="152" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="340" cy="152" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="156" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="145" y="156" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="210" y="156" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="275" y="156" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="340" y="156" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="365" y="150" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">嵌套：大的吃小的</text>
  <text x="365" y="165" font-size="9.5" fill="#888" filter="url(#rough2)">(1,3) ⊂ (0,4)</text>

  <line x1="48" y1="182" x2="472" y2="182" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- ============ ✗ 禁止 ============ -->
  <text x="48" y="206" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 禁止</text>

  <!-- 链 C：交叉（y=248） -->
  <path d="M 97 248 L 114 248" stroke="#8899aa" stroke-width="1.5" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <path d="M 148 248 L 165 248" stroke="#8899aa" stroke-width="1.5" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <path d="M 199 248 L 216 248" stroke="#8899aa" stroke-width="1.5" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <path d="M 250 248 L 267 248" stroke="#8899aa" stroke-width="1.5" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <path d="M 301 248 L 318 248" stroke="#8899aa" stroke-width="1.5" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <path d="M 352 248 L 369 248" stroke="#8899aa" stroke-width="1.5" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <path d="M 80 234 Q 182 184 281 234" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arror)" filter="url(#rough2)"/>
  <path d="M 183 238 Q 284 208 383 238" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrrd)" filter="url(#rough2)"/>
  <text x="118" y="207" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">(0,4)</text>
  <text x="352" y="207" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">(2,6)</text>
  <text x="258" y="201" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">交叉！</text>
  <path d="M 251 215 L 265 229" stroke="#b85450" stroke-width="3" fill="none" filter="url(#rough2)"/>
  <path d="M 265 215 L 251 229" stroke="#b85450" stroke-width="3" fill="none" filter="url(#rough2)"/>
  <circle cx="80" cy="248" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="131" cy="248" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="182" cy="248" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="233" cy="248" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="284" cy="248" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="335" cy="248" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="386" cy="248" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="252" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="131" y="252" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="182" y="252" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="233" y="252" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="284" y="252" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="335" y="252" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="386" y="252" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="233" y="286" text-anchor="middle" font-size="10.5" fill="#8a3a34" filter="url(#rough2)">queries 保证：不出现 0 &lt; 2 &lt; 4 &lt; 6 这样的交叉</text>

  <!-- 结论 -->
  <rect x="48" y="305" width="424" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">不交叉 ⇒ 极大区间两两不相交 ⇒「全选极大区间」即最优</text>
</svg>
