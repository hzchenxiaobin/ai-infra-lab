<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [0,2,1,5,3,4]，n = 6</text>

  <!-- Table header -->
  <g font-size="11" fill="#555" text-anchor="middle">
    <rect x="40" y="48" width="40" height="26" fill="#eee" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="60" y="65">i</text>
    <rect x="84" y="48" width="84" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="126" y="65">a=nums[i]</text>
    <rect x="172" y="48" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="247" y="65">b=nums[a]%n</text>
    <rect x="326" y="48" width="200" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="426" y="65">编码 nums[i]=a+n·b</text>
  </g>

  <!-- Row i=0 -->
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <rect x="40" y="76" width="40" height="28" fill="#eee" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="60" y="95">0</text>
    <rect x="84" y="76" width="84" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="126" y="95">0</text>
    <rect x="172" y="76" width="150" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="247" y="95">nums[0]%6 = 0</text>
    <rect x="326" y="76" width="200" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="426" y="95">0 + 6×0 = 0</text>
  </g>

  <!-- Row i=1 -->
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <rect x="40" y="106" width="40" height="28" fill="#eee" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="60" y="125">1</text>
    <rect x="84" y="106" width="84" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="126" y="125">2</text>
    <rect x="172" y="106" width="150" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="247" y="125">nums[2]%6 = 1</text>
    <rect x="326" y="106" width="200" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="426" y="125">2 + 6×1 = 8</text>
  </g>

  <!-- Row i=2 (已编码) -->
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <rect x="40" y="136" width="40" height="28" fill="#eee" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="60" y="155">2</text>
    <rect x="84" y="136" width="84" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="126" y="155">1</text>
    <rect x="172" y="136" width="150" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="247" y="155">8 % 6 = 2</text>
    <rect x="326" y="136" width="200" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="426" y="155">1 + 6×2 = 13</text>
  </g>
  <text x="318" y="151" text-anchor="end" font-size="9.5" fill="#b85450" font-weight="bold">已编码</text>

  <!-- Row i=3 -->
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <rect x="40" y="166" width="40" height="28" fill="#eee" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="60" y="185">3</text>
    <rect x="84" y="166" width="84" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="126" y="185">5</text>
    <rect x="172" y="166" width="150" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="247" y="185">nums[5]%6 = 4</text>
    <rect x="326" y="166" width="200" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="426" y="185">5 + 6×4 = 29</text>
  </g>

  <!-- Row i=4 (已编码) -->
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <rect x="40" y="196" width="40" height="28" fill="#eee" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="60" y="215">4</text>
    <rect x="84" y="196" width="84" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="126" y="215">3</text>
    <rect x="172" y="196" width="150" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="247" y="215">29 % 6 = 5</text>
    <rect x="326" y="196" width="200" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="426" y="215">3 + 6×5 = 33</text>
  </g>
  <text x="318" y="211" text-anchor="end" font-size="9.5" fill="#b85450" font-weight="bold">已编码</text>

  <!-- Row i=5 (已编码) -->
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <rect x="40" y="226" width="40" height="28" fill="#eee" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="60" y="245">5</text>
    <rect x="84" y="226" width="84" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="126" y="245">4</text>
    <rect x="172" y="226" width="150" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="247" y="245">33 % 6 = 3</text>
    <rect x="326" y="226" width="200" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="426" y="245">4 + 6×3 = 22</text>
  </g>
  <text x="318" y="241" text-anchor="end" font-size="9.5" fill="#b85450" font-weight="bold">已编码</text>

  <!-- Divider -->
  <path d="M 40 268 L 540 268" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Encoded array -->
  <text x="60" y="292" font-size="11.5" fill="#888">编码后数组：</text>
  <g font-size="12.5" fill="#d6a040" font-weight="bold" text-anchor="middle">
    <rect x="60" y="300" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="82" y="321">0</text>
    <rect x="108" y="300" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="130" y="321">8</text>
    <rect x="156" y="300" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="178" y="321">13</text>
    <rect x="204" y="300" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="226" y="321">29</text>
    <rect x="252" y="300" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="274" y="321">33</text>
    <rect x="300" y="300" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="322" y="321">22</text>
  </g>

  <!-- arrow down -->
  <path d="M 178 336 L 178 356" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="220" y="350" font-size="11" fill="#4a7a3a" font-weight="bold">第二趟：每个 // 6</text>

  <!-- Decoded result -->
  <text x="60" y="372" font-size="11.5" fill="#888">解码后（答案）：</text>
  <g font-size="12.5" fill="#4a7a3a" font-weight="bold" text-anchor="middle">
    <rect x="60" y="380" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/><text x="82" y="401">0</text>
    <rect x="108" y="380" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/><text x="130" y="401">1</text>
    <rect x="156" y="380" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/><text x="178" y="401">2</text>
    <rect x="204" y="380" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/><text x="226" y="401">4</text>
    <rect x="252" y="380" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/><text x="274" y="401">5</text>
    <rect x="300" y="380" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/><text x="322" y="401">3</text>
  </g>

  <!-- verify -->
  <rect x="360" y="380" width="180" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="401" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">= [0,1,2,4,5,3] ✓</text>

  <!-- footer note -->
  <text x="60" y="436" font-size="11" fill="#555">• 「已编码」格用 % n 取回原值——这正是两步原地编码不丢信息的关键</text>
  <text x="60" y="454" font-size="11" fill="#555">• n=6 时每格最大值 5+6×5=35，远小于 int 上限，无溢出风险</text>
</svg>
