<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">超级回文数 = 回文数 y 的平方 y² 也是回文数</text>

  <text x="60" y="64" font-size="12" fill="#888">✅ 超级回文数</text>

  <rect x="60" y="76" width="130" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="125" y="100" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">y = 11</text>
  <text x="125" y="116" text-anchor="middle" font-size="10" fill="#4a7a3a">回文 ✓</text>

  <path d="M 195 100 L 245 100" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="220" y="92" text-anchor="middle" font-size="10" fill="#4a7a3a">平方</text>

  <rect x="250" y="76" width="130" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="315" y="100" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">y² = 121</text>
  <text x="315" y="116" text-anchor="middle" font-size="10" fill="#4a7a3a">回文 ✓</text>

  <path d="M 385 100 L 435 100" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="440" y="76" width="100" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="490" y="100" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">超级回文</text>
  <text x="490" y="116" text-anchor="middle" font-size="10" fill="#4a7a3a">121 ✓</text>

  <line x1="40" y1="150" x2="520" y2="150" stroke="#ddd" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <text x="60" y="178" font-size="12" fill="#888">✅ 更多例子</text>

  <rect x="60" y="190" width="460" height="56" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="8" filter="url(#rough2)"/>

  <text x="80" y="212" font-size="11" fill="#333" font-weight="bold">y=1 → 1²=1</text>
  <text x="80" y="232" font-size="10" fill="#4a7a3a">✓</text>

  <text x="210" y="212" font-size="11" fill="#333" font-weight="bold">y=2 → 2²=4</text>
  <text x="210" y="232" font-size="10" fill="#4a7a3a">✓</text>

  <text x="340" y="212" font-size="11" fill="#333" font-weight="bold">y=22 → 22²=484</text>
  <text x="340" y="232" font-size="10" fill="#4a7a3a">✓</text>

  <line x1="40" y1="260" x2="520" y2="260" stroke="#ddd" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <text x="60" y="288" font-size="12" fill="#888">❌ 反例</text>

  <rect x="60" y="300" width="130" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="125" y="324" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">y = 26</text>
  <text x="125" y="340" text-anchor="middle" font-size="10" fill="#b85450">非回文 ✗</text>

  <path d="M 195 324 L 245 324" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="220" y="316" text-anchor="middle" font-size="10" fill="#b85450">平方</text>

  <rect x="250" y="300" width="130" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="315" y="324" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">y² = 676</text>
  <text x="315" y="340" text-anchor="middle" font-size="10" fill="#d6a040">回文但 y 不是</text>

  <path d="M 385 324 L 435 324" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <rect x="440" y="300" width="100" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="490" y="324" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">非超级回文</text>
  <text x="490" y="340" text-anchor="middle" font-size="10" fill="#b85450">676 ✗</text>

  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#888">关键：y 和 y² 必须同时为回文数</text>
</svg>
