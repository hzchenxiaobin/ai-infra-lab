<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="392" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：无冲突直返 / 一次交换修复 / 无解判定</text>

  <!-- Case 1: abca -->
  <text x="26" y="62" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① "abca"</text>
  <rect x="170" y="46" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="191" y="67" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="216" y="46" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="237" y="67" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="262" y="46" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="283" y="67" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="308" y="46" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="329" y="67" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="260" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">排序得 "aabc"：中间 a ≠ b，无冲突 → 零修改，输出 "aabc"</text>

  <!-- Case 2: aabbbc -->
  <text x="26" y="142" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">② "aabbbc"</text>
  <path d="M 390 124 C 390 112 302 112 302 124" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="150" y="128" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="149" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="194" y="128" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="149" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="238" y="128" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="258" y="149" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="282" y="128" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="302" y="149" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="326" y="128" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="346" y="149" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="370" y="128" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="149" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="302" y="176" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="390" y="176" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="150" y="188" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="209" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="194" y="188" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="209" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="238" y="188" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="258" y="209" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="282" y="188" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="302" y="209" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="326" y="188" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="346" y="209" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="370" y="188" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="209" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="260" y="242" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">swap(5,3)：中间对变 b ≠ c ✓；j=4 时 b 对 a 不冲突 → 输出 "aabcbb"</text>

  <!-- Case 3: cccd -->
  <text x="26" y="278" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">③ "cccd"</text>
  <path d="M 329 262 C 329 250 283 250 283 262" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="170" y="266" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="191" y="287" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="216" y="266" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="237" y="287" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="262" y="266" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="283" y="287" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="308" y="266" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="329" y="287" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="283" y="314" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="329" y="314" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="170" y="324" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="191" y="345" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="216" y="324" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="237" y="345" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="262" y="324" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="283" y="345" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">d</text>
  <rect x="308" y="324" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="329" y="345" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="260" y="378" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">swap(3,2) 后：j=3 时 s[3]=c 对 s[0]=c 仍冲突，而 i 已越界</text>
  <text x="260" y="390" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">频次 c×3 &gt; n/2=2，无解 → 输出 "-1"</text>
</svg>
