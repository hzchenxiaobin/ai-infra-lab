<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="540" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：按位数拆分计数 — 位数 &lt; k 与 位数 = k</text>

  <!-- ===== 设定 ===== -->
  <rect x="60" y="44" width="460" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="62" text-anchor="middle" font-size="11" fill="#333">digits = [1,3,5,7]，m = 4　｜　n = 100，s = "100"，k = 3</text>
  <text x="290" y="78" text-anchor="middle" font-size="10" fill="#888">目标：用 D 中数字组成的、≤ n 的正整数个数</text>

  <path d="M 290 86 L 290 100" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Part 1: 位数 < k ===== -->
  <rect x="40" y="104" width="240" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="160" y="126" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">第一部分：位数 &lt; k</text>
  <text x="160" y="146" text-anchor="middle" font-size="11" fill="#333">长度 1 ~ (k−1) 的数，天然 &lt; n</text>
  <text x="160" y="170" text-anchor="middle" font-size="11" fill="#333">1 位：m¹ = 4　（1,3,5,7）</text>
  <text x="160" y="190" text-anchor="middle" font-size="11" fill="#333">2 位：m² = 16　（11,13,…,77）</text>
  <text x="160" y="218" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">合计 = Σ m^i  (i=1..k−1)</text>
  <text x="160" y="240" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">= 4 + 16 = 20</text>

  <!-- ===== Part 2: 位数 = k ===== -->
  <rect x="300" y="104" width="240" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="420" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">第二部分：位数 = k 且 ≤ n</text>
  <text x="420" y="146" text-anchor="middle" font-size="11" fill="#333">逐位前缀匹配 n = s[0]s[1]s[2]</text>
  <text x="420" y="170" text-anchor="middle" font-size="11" fill="#333">第 i 位放「&lt; s[i]」→ 后面随意</text>
  <text x="420" y="190" text-anchor="middle" font-size="11" fill="#333">第 i 位放「= s[i]」→ 继续下一位</text>
  <text x="420" y="214" text-anchor="middle" font-size="11" fill="#333">s[i] ∉ D → 提前停止</text>
  <text x="420" y="240" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">逐位累加 less × m^(k−1−i)</text>

  <path d="M 290 256 L 290 270" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Part 2 逐位拆解 ===== -->
  <text x="290" y="286" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">第二部分逐位演算（n = "1 0 0"，k = 3）</text>

  <!-- pos 0 -->
  <rect x="40" y="296" width="160" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="120" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i = 0，c = 1</text>
  <text x="120" y="334" text-anchor="middle" font-size="10" fill="#333">less = D中&lt;1 的个数 = 0</text>
  <text x="120" y="350" text-anchor="middle" font-size="10" fill="#333">贡献 = 0 × m² = 0</text>
  <text x="120" y="368" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1 ∈ D → 继续 ✓</text>

  <!-- pos 1 -->
  <rect x="210" y="296" width="160" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="290" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i = 1，c = 0</text>
  <text x="290" y="334" text-anchor="middle" font-size="10" fill="#333">less = D中&lt;0 的个数 = 0</text>
  <text x="290" y="350" text-anchor="middle" font-size="10" fill="#333">贡献 = 0 × m¹ = 0</text>
  <text x="290" y="368" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0 ∉ D → 停止 ✗</text>

  <!-- pos 2 (skipped) -->
  <rect x="380" y="296" width="160" height="86" fill="#f6f8fb" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5,3" rx="6" filter="url(#rough2)"/>
  <text x="460" y="316" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">i = 2（未到达）</text>
  <text x="460" y="338" text-anchor="middle" font-size="10" fill="#888">前缀已无法匹配</text>
  <text x="460" y="356" text-anchor="middle" font-size="10" fill="#888">跳过，不累加</text>
  <text x="460" y="374" text-anchor="middle" font-size="10" fill="#888">n 本身不可组成</text>

  <path d="M 200 339 L 210 339" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 370 339 L 380 339" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 求和 ===== -->
  <path d="M 290 384 L 290 400" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="402" width="420" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="422" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">总答案 = 第一部分 + 第二部分</text>
  <text x="290" y="440" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">20 + 0 = 20</text>

  <!-- ===== 关键洞察 ===== -->
  <rect x="60" y="460" width="460" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)" opacity="0.7"/>
  <text x="290" y="480" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">💡 关键洞察</text>
  <text x="290" y="498" text-anchor="middle" font-size="10" fill="#333">位数 &lt; k 的数全部有效（幂次求和）；位数 = k 的数需逐位「小于分支 + 等于续接」</text>
  <text x="290" y="514" text-anchor="middle" font-size="10" fill="#333">每位的「小于」分支后面可任意填 → 贡献 less × m^(剩余位数)；遇到 s[i]∉D 即停</text>
</svg>
