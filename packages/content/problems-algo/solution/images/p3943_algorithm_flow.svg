<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次预处理 + 逐条操作分派</text>

  <rect x="150" y="32" width="220" height="50" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="52" text-anchor="middle" font-size="10" fill="#33507a" font-weight="bold" filter="url(#rough2)">预处理：nums2 按 B ≈ √n 分块</text>
  <text x="260" y="70" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">每块建计数表 cnt_b，lazy_b = 0；nums1 → (值 a, 次数 w)</text>

  <path d="M 260 82 L 260 100" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="182,128 260,102 338,128 260,154" fill="#fafafa" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="132" text-anchor="middle" font-size="10.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">query 类型？</text>

  <path d="M 182 128 L 100 128 L 100 168" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="120" text-anchor="middle" font-size="9" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">类型 1：区间加</text>

  <path d="M 338 128 L 400 128 L 400 168" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="382" y="120" text-anchor="middle" font-size="9" fill="#33507a" font-weight="bold" filter="url(#rough2)">类型 2：数对计数</text>

  <rect x="24" y="170" width="180" height="64" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="114" y="186" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">更新 [1, x, y, val]：散块</text>
  <text x="34" y="202" font-size="9" fill="#555" filter="url(#rough2)">bx = x/B，by = y/B；首尾散块</text>
  <text x="34" y="216" font-size="9" fill="#555" filter="url(#rough2)">（或 bx==by 时的单块）逐元素</text>
  <text x="34" y="230" font-size="9" fill="#555" filter="url(#rough2)">a[k] += val，增量改 cnt，O(B)</text>

  <path d="M 114 234 L 114 246" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="24" y="248" width="180" height="54" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="114" y="264" text-anchor="middle" font-size="10" fill="#3d6330" font-weight="bold" filter="url(#rough2)">整块 bx+1 .. by−1</text>
  <text x="34" y="280" font-size="9" fill="#555" filter="url(#rough2)">lazy_b += val，每块 O(1)</text>
  <text x="34" y="294" font-size="9" fill="#555" filter="url(#rough2)">合计 O(n/B) 个块，计数表不动</text>

  <rect x="310" y="170" width="186" height="64" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="403" y="186" text-anchor="middle" font-size="10" fill="#33507a" font-weight="bold" filter="url(#rough2)">查询 [2, tot]</text>
  <text x="320" y="202" font-size="9" fill="#555" filter="url(#rough2)">对每个 (a, w)：目标 t = tot − a</text>
  <text x="320" y="216" font-size="9" fill="#555" filter="url(#rough2)">ans += w · Σ_b cnt_b[t − lazy_b]</text>
  <text x="320" y="230" font-size="9" fill="#555" filter="url(#rough2)">d ≤ 5 个值 × m 块次哈希查表</text>

  <path d="M 403 234 L 403 246" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="310" y="248" width="186" height="54" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="403" y="264" text-anchor="middle" font-size="10" fill="#a0433f" font-weight="bold" filter="url(#rough2)">answer 追加本次结果</text>
  <text x="320" y="280" font-size="9" fill="#555" filter="url(#rough2)">每次查询 O(d·m)，d 是 nums1</text>
  <text x="320" y="294" font-size="9" fill="#555" filter="url(#rough2)">不同值个数（≤ 5），m = n/B</text>

  <path d="M 114 302 C 114 322, 190 322, 226 320" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 403 302 C 403 322, 330 322, 294 320" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="314" width="180" height="34" rx="10" fill="#fafafa" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="335" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">输出所有类型 2 的 answer</text>

  <path d="M 500 280 C 513 280, 512 130, 344 128" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="509" y="212" text-anchor="middle" font-size="8.5" fill="#999" transform="rotate(90 509 212)" filter="url(#rough2)">下一条</text>

  <text x="260" y="357" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">总复杂度 O(q·(B + d·n/B))，取 B ≈ √(d·n) 时最优 ≈ O(q·√n)</text>
</svg>
