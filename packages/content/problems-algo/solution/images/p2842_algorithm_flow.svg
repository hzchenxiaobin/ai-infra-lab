<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：统计频次 → 定边界 → 三区计数</text>

  <!-- step 1 -->
  <rect x="160" y="40" width="300" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="64" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">统计频次 freq[26]，收集非零频次数组 f</text>

  <path d="M 310 78 L 310 94" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond -->
  <polygon points="310,96 438,130 310,164 182,130" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">不同字符个数</text>
  <text x="310" y="143" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">&lt; k ？</text>

  <text x="460" y="124" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 438 130 L 492 130" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="494" y="112" width="106" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="547" y="134" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">返回 0</text>

  <text x="324" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M 310 164 L 310 190" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="160" y="192" width="300" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="216" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">频次降序排序，取边界值 x = f[k−1]</text>

  <path d="M 310 230 L 310 248" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4 -->
  <rect x="160" y="250" width="300" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="269" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">统计 g = #{f &gt; x}，cnt_x = #{f = x}</text>
  <text x="310" y="287" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">need = k − g</text>

  <path d="M 310 296 L 310 314" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 5 -->
  <rect x="110" y="316" width="400" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="339" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">ans = ∏(f &gt; x) × C(cnt_x, need) × x^need</text>
  <text x="310" y="359" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">全程 mod 10⁹ + 7</text>

  <path d="M 310 370 L 310 388" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 6 -->
  <rect x="160" y="390" width="300" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="414" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 ans</text>
</svg>
