<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：a = [1,2,4,6,9,14,15]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">lower_bound 找首个 ≥q（给 maxi），upper_bound 找首个 &gt;q（其前驱给 mini）</text>

  <!-- reference array strip -->
  <g font-size="10" filter="url(#rough2)">
    <text x="40" y="66" font-size="10" fill="#888" font-weight="bold">a：</text>
    <rect x="64" y="54" width="40" height="22" fill="#fff" stroke="#888" stroke-width="1.2" rx="3"/>
    <text x="84" y="69" text-anchor="middle" fill="#333">1</text>
    <rect x="104" y="54" width="40" height="22" fill="#fff" stroke="#888" stroke-width="1.2" rx="3"/>
    <text x="124" y="69" text-anchor="middle" fill="#333">2</text>
    <rect x="144" y="54" width="40" height="22" fill="#fff" stroke="#888" stroke-width="1.2" rx="3"/>
    <text x="164" y="69" text-anchor="middle" fill="#333">4</text>
    <rect x="184" y="54" width="40" height="22" fill="#fff" stroke="#888" stroke-width="1.2" rx="3"/>
    <text x="204" y="69" text-anchor="middle" fill="#333">6</text>
    <rect x="224" y="54" width="40" height="22" fill="#fff" stroke="#888" stroke-width="1.2" rx="3"/>
    <text x="244" y="69" text-anchor="middle" fill="#333">9</text>
    <rect x="264" y="54" width="40" height="22" fill="#fff" stroke="#888" stroke-width="1.2" rx="3"/>
    <text x="284" y="69" text-anchor="middle" fill="#333">14</text>
    <rect x="304" y="54" width="40" height="22" fill="#fff" stroke="#888" stroke-width="1.2" rx="3"/>
    <text x="324" y="69" text-anchor="middle" fill="#333">15</text>
    <text x="354" y="69" font-size="9" fill="#888">下标 0..6（n=7）</text>
  </g>

  <!-- table header -->
  <g font-size="11" filter="url(#rough2)">
    <rect x="30" y="96" width="500" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="60" y="113" text-anchor="middle" fill="#446688" font-weight="bold">q</text>
    <text x="140" y="113" text-anchor="middle" fill="#446688" font-weight="bold">lower_bound ≥q</text>
    <text x="250" y="113" text-anchor="middle" fill="#446688" font-weight="bold">upper_bound &gt;q</text>
    <text x="360" y="113" text-anchor="middle" fill="#446688" font-weight="bold">mini = a[ub−1]</text>
    <text x="470" y="113" text-anchor="middle" fill="#446688" font-weight="bold">maxi = a[lb]</text>
  </g>

  <!-- row 1: q=2 -->
  <g font-size="11" filter="url(#rough2)">
    <rect x="30" y="124" width="500" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="60" y="146" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <text x="140" y="146" text-anchor="middle" fill="#333">idx 1（值 2）</text>
    <text x="250" y="146" text-anchor="middle" fill="#333">idx 2（值 4）</text>
    <text x="360" y="146" text-anchor="middle" fill="#4a7a3a" font-weight="bold">a[1] = 2</text>
    <text x="470" y="146" text-anchor="middle" fill="#446688" font-weight="bold">a[1] = 2</text>
  </g>

  <!-- row 2: q=5 -->
  <g font-size="11" filter="url(#rough2)">
    <rect x="30" y="160" width="500" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="60" y="182" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <text x="140" y="182" text-anchor="middle" fill="#333">idx 3（值 6）</text>
    <text x="250" y="182" text-anchor="middle" fill="#333">idx 3（值 6）</text>
    <text x="360" y="182" text-anchor="middle" fill="#4a7a3a" font-weight="bold">a[2] = 4</text>
    <text x="470" y="182" text-anchor="middle" fill="#446688" font-weight="bold">a[3] = 6</text>
  </g>

  <!-- row 3: q=16 -->
  <g font-size="11" filter="url(#rough2)">
    <rect x="30" y="196" width="500" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="60" y="218" text-anchor="middle" fill="#b85450" font-weight="bold">16</text>
    <text x="140" y="218" text-anchor="middle" fill="#333">idx 7 = n（越界）</text>
    <text x="250" y="218" text-anchor="middle" fill="#333">idx 7 = n（越界）</text>
    <text x="360" y="218" text-anchor="middle" fill="#4a7a3a" font-weight="bold">a[6] = 15</text>
    <text x="470" y="218" text-anchor="middle" fill="#b85450" font-weight="bold">−1</text>
  </g>

  <!-- answer summary -->
  <rect x="30" y="248" width="500" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="268" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">answer = [[2,2], [4,6], [15,−1]]</text>
  <text x="280" y="286" text-anchor="middle" font-size="10" fill="#555">q 在数组中存在 → mini = maxi = q；q 越右界 → maxi = −1</text>

  <!-- notes -->
  <text x="30" y="316" font-size="10" fill="#4a7a3a" font-weight="bold">规律：</text>
  <text x="30" y="332" font-size="10" fill="#555">• q 命中某元素：lower_bound = upper_bound − 1，mini = maxi = q</text>
  <text x="30" y="348" font-size="10" fill="#555">• q 落在两元素之间：lower_bound = upper_bound，mini 取前驱、maxi 取本身</text>
  <text x="30" y="364" font-size="10" fill="#555">• q 大于全体：lower_bound = n，maxi = −1；mini 仍取末元素</text>
</svg>
