<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：order = "cba", s = "abcd"</text>

  <!-- Input -->
  <text x="40" y="58" font-size="12" fill="#888">输入:</text>
  <text x="90" y="58" font-size="12" fill="#333">order = </text>
  <rect x="140" y="44" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="154" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
  <rect x="168" y="44" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="182" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <rect x="196" y="44" width="28" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="210" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <text x="240" y="58" font-size="12" fill="#333">, s = "abcd"</text>

  <!-- Step 0: count -->
  <text x="40" y="96" font-size="12" fill="#888">步骤0  统计 freq:</text>
  <rect x="160" y="82" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c: 1</text>
  <rect x="226" y="82" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b: 1</text>
  <rect x="292" y="82" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a: 1</text>
  <rect x="358" y="82" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="388" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d: 1</text>

  <!-- table header -->
  <rect x="40" y="120" width="80" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="139" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">步骤</text>
  <rect x="120" y="120" width="120" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="139" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">处理字符</text>
  <rect x="240" y="120" width="160" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="139" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">freq 变化</text>
  <rect x="400" y="120" width="120" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="139" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">result</text>

  <!-- row 1: c -->
  <rect x="40" y="148" width="80" height="32" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="169" text-anchor="middle" font-size="11" fill="#333">① order[0]</text>
  <rect x="120" y="148" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="169" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="240" y="148" width="160" height="32" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="169" text-anchor="middle" font-size="11" fill="#666">c:1→0</text>
  <rect x="400" y="148" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="169" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">"c"</text>

  <!-- row 2: b -->
  <rect x="40" y="180" width="80" height="32" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="201" text-anchor="middle" font-size="11" fill="#333">② order[1]</text>
  <rect x="120" y="180" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="201" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="240" y="180" width="160" height="32" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="201" text-anchor="middle" font-size="11" fill="#666">b:1→0</text>
  <rect x="400" y="180" width="120" height="32" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="201" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">"cb"</text>

  <!-- row 3: a -->
  <rect x="40" y="212" width="80" height="32" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="233" text-anchor="middle" font-size="11" fill="#333">③ order[2]</text>
  <rect x="120" y="212" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="233" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="240" y="212" width="160" height="32" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="233" text-anchor="middle" font-size="11" fill="#666">a:1→0</text>
  <rect x="400" y="212" width="120" height="32" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="233" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">"cba"</text>

  <!-- row 4: append remaining -->
  <rect x="40" y="244" width="80" height="32" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="265" text-anchor="middle" font-size="11" fill="#333">④ 剩余</text>
  <rect x="120" y="244" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="265" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">d (不在 order)</text>
  <rect x="240" y="244" width="160" height="32" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="265" text-anchor="middle" font-size="11" fill="#666">d:1→0</text>
  <rect x="400" y="244" width="120" height="32" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="265" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">"cbad"</text>

  <!-- result box -->
  <rect x="40" y="296" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">输出："cbad" ✓</text>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#666">c、b、a 顺序与 order 一致；d 不在 order 中，放末尾即可</text>

  <!-- note -->
  <rect x="40" y="352" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">⚠️ 同字符多次出现：freq[c] = k 时一次性追加 k 个 c</text>
  <text x="280" y="388" text-anchor="middle" font-size="11" fill="#666">例 order="cba", s="aabbccd" → 输出 "ccbbaad"</text>
  <text x="280" y="402" text-anchor="middle" font-size="11" fill="#888">计数法天然处理重复，无需逐个比较</text>
</svg>
