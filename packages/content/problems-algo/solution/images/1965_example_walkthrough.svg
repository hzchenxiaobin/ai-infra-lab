<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：丢失信息的雇员（UNION ALL + GROUP BY）</text>

  <!-- ===== Employees input ===== -->
  <text x="50" y="50" font-size="10" fill="#446688" font-weight="bold">Employees</text>
  <rect x="40" y="56" width="150" height="86" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="50" y="72" font-size="9" fill="#446688" font-weight="bold">id   name</text>
  <line x1="40" y1="78" x2="190" y2="78" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="42" y="82" width="146" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="50" y="94" font-size="9" fill="#b85450" font-weight="bold">2   Crew</text>
  <text x="50" y="110" font-size="9" fill="#4a7a3a">4   Haven</text>
  <text x="50" y="126" font-size="9" fill="#4a7a3a">5   Kristian</text>
  <text x="50" y="138" font-size="8" fill="#888">id: {2, 4, 5}</text>

  <!-- ===== Salaries input ===== -->
  <text x="380" y="50" font-size="10" fill="#4a7a3a" font-weight="bold">Salaries</text>
  <rect x="370" y="56" width="170" height="86" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="380" y="72" font-size="9" fill="#4a7a3a" font-weight="bold">id    salary</text>
  <line x1="370" y1="78" x2="540" y2="78" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="380" y="94" font-size="9" fill="#4a7a3a">5    76071</text>
  <rect x="372" y="98" width="166" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="380" y="110" font-size="9" fill="#b85450" font-weight="bold">1    22517</text>
  <text x="380" y="126" font-size="9" fill="#4a7a3a">4    63539</text>
  <text x="380" y="138" font-size="8" fill="#888">id: {1, 4, 5}</text>

  <!-- ===== Arrows down to UNION ALL ===== -->
  <path d="M 115 144 C 115 165, 200 168, 200 180" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)" opacity="0.6" stroke-dasharray="3,2"/>
  <path d="M 455 144 C 455 165, 380 168, 380 180" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)" opacity="0.6" stroke-dasharray="3,2"/>

  <!-- ===== UNION ALL result (6 rows) ===== -->
  <text x="290" y="176" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">UNION ALL（不去重，6 行）</text>
  <rect x="220" y="182" width="140" height="132" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="230" y="198" font-size="9" fill="#446688" font-weight="bold">row   id</text>
  <line x1="220" y1="204" x2="360" y2="204" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="230" y="218" font-size="9" fill="#b85450" font-weight="bold">1      2</text>
  <text x="230" y="232" font-size="9" fill="#4a7a3a">2      4</text>
  <text x="230" y="246" font-size="9" fill="#4a7a3a">3      5</text>
  <text x="230" y="260" font-size="9" fill="#4a7a3a">4      5</text>
  <text x="230" y="274" font-size="9" fill="#b85450" font-weight="bold">5      1</text>
  <text x="230" y="288" font-size="9" fill="#4a7a3a">6      4</text>
  <text x="230" y="308" font-size="8" fill="#888">↑ 红 = 仅一张表（COUNT=1）</text>

  <!-- Arrow down -->
  <path d="M 290 314 L 290 332" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== GROUP BY + COUNT ===== -->
  <text x="290" y="348" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">GROUP BY id + COUNT(*)</text>
  <rect x="190" y="354" width="200" height="86" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="210" y="370" font-size="9" fill="#4a7a3a" font-weight="bold">id    COUNT(*)    来源</text>
  <line x1="190" y1="376" x2="390" y2="376" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="192" y="378" width="196" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="210" y="390" font-size="9" fill="#b85450" font-weight="bold">2       1          仅 E</text>
  <text x="210" y="406" font-size="9" fill="#4a7a3a">4       2          E + S</text>
  <text x="210" y="422" font-size="9" fill="#4a7a3a">5       2          E + S</text>
  <rect x="192" y="426" width="196" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="210" y="438" font-size="9" fill="#b85450" font-weight="bold">1       1          仅 S</text>

  <!-- Arrow to HAVING/result -->
  <path d="M 390 396 L 430 396" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Final result ===== -->
  <text x="495" y="374" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">HAVING cnt=1</text>
  <text x="495" y="388" text-anchor="middle" font-size="8" fill="#888">ORDER BY id</text>
  <rect x="434" y="394" width="120" height="56" fill="#fff" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="444" y="410" font-size="9" fill="#d6a040" font-weight="bold">employee_id</text>
  <line x1="434" y1="416" x2="554" y2="416" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="494" y="430" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="494" y="444" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- ===== Bottom note ===== -->
  <rect x="30" y="450" width="530" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="295" y="467" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">id=2 仅在 Employees（缺薪）；id=1 仅在 Salaries（缺名）→ COUNT=1 → 输出 {1, 2}</text>
</svg>
