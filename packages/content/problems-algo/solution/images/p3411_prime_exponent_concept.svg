<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：素因子指数视角</text>

  <rect x="70" y="30" width="380" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="49" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">prod = lcm × gcd ⟺ 对每个素数 p：Σeᵢ = max eᵢ + min eᵢ</text>

  <!-- 左：失败面板 -->
  <rect x="18" y="76" width="236" height="158" fill="#fdf3f4" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="136" y="95" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ [2, 4, 8]</text>
  <text x="136" y="109" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">素数 2 被 3 个元素共享</text>
  <rect x="57" y="118" width="46" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="113" y="118" width="46" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="169" y="118" width="46" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="80" y="139" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="136" y="139" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="192" y="139" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="80" y="164" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">e=1</text>
  <text x="136" y="164" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">e=2</text>
  <text x="192" y="164" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">e=3</text>
  <text x="136" y="184" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">p=2 的指数：Σ = 6</text>
  <text x="136" y="200" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">max + min = 3 + 1 = 4 ✗</text>
  <text x="136" y="222" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">prod 64 ≠ gcd 2 × lcm 8 = 16</text>

  <!-- 右：成功面板 -->
  <rect x="266" y="76" width="236" height="158" fill="#f4f9f4" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="384" y="95" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ [3, 4, 5]</text>
  <text x="384" y="109" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">每个素数只属于 1 个元素</text>
  <rect x="305" y="118" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="361" y="118" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="417" y="118" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="328" y="139" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="384" y="139" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="440" y="139" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="328" y="164" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">{3}</text>
  <text x="384" y="164" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">{2²}</text>
  <text x="440" y="164" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">{5}</text>
  <text x="384" y="184" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">每个素数：Σ = max</text>
  <text x="384" y="200" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">（min = 0）✓</text>
  <text x="384" y="222" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">prod 60 = gcd 1 × lcm 60</text>

  <!-- 底部：k=2 恒等式 -->
  <rect x="30" y="246" width="460" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="266" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">k = 2 恒成立：[6, 10] → 6×10 = 60 = gcd 2 × lcm 30 ✓</text>
  <text x="260" y="286" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">（恒等式 a·b = gcd(a,b) × lcm(a,b)）⇒ n ≥ 2 时答案 ≥ 2</text>

  <text x="260" y="322" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">k ≥ 3 ⟺ 两两互素（任意两个不同元素 gcd = 1）</text>
  <text x="260" y="342" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">1 没有素因子：多个 1 不构成冲突，可任意出现在窗口里</text>
</svg>
