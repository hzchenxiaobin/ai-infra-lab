<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="430" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1 DFS 逐节点演算（先序）</text>
  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">root = [8,3,10,1,6,null,14,null,null,4,7,13]</text>

  <!-- 表格外框 -->
  <g filter="url(#rough2)">
    <rect x="60" y="64" width="480" height="332" fill="none" stroke="#446688" stroke-width="1.5"/>
  </g>

  <!-- 列分隔线 -->
  <g stroke="#446688" stroke-width="1" filter="url(#rough2)">
    <line x1="60" y1="64" x2="60" y2="396"/>
    <line x1="110" y1="64" x2="110" y2="396"/>
    <line x1="165" y1="64" x2="165" y2="396"/>
    <line x1="225" y1="64" x2="225" y2="396"/>
    <line x1="285" y1="64" x2="285" y2="396"/>
    <line x1="370" y1="64" x2="370" y2="396"/>
    <line x1="455" y1="64" x2="455" y2="396"/>
    <line x1="540" y1="64" x2="540" y2="396"/>
  </g>

  <!-- 行分隔线 -->
  <g stroke="#aaa" stroke-width="0.8" filter="url(#rough2)">
    <line x1="60" y1="92" x2="540" y2="92"/>
    <line x1="60" y1="120" x2="540" y2="120"/>
    <line x1="60" y1="148" x2="540" y2="148"/>
    <line x1="60" y1="176" x2="540" y2="176"/>
    <line x1="60" y1="204" x2="540" y2="204"/>
    <line x1="60" y1="232" x2="540" y2="232"/>
    <line x1="60" y1="260" x2="540" y2="260"/>
    <line x1="60" y1="288" x2="540" y2="288"/>
    <line x1="60" y1="316" x2="540" y2="316"/>
    <line x1="60" y1="344" x2="540" y2="344"/>
    <line x1="60" y1="372" x2="540" y2="372"/>
  </g>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="60" y="64" width="480" height="28" fill="#e8f0fe"/>
    <text x="85" y="82" text-anchor="middle" font-size="11" fill="#333">步骤</text>
    <text x="137" y="82" text-anchor="middle" font-size="11" fill="#333">节点</text>
    <text x="195" y="82" text-anchor="middle" font-size="11" fill="#333">min</text>
    <text x="255" y="82" text-anchor="middle" font-size="11" fill="#333">max</text>
    <text x="327" y="82" text-anchor="middle" font-size="11" fill="#333">|val-min|</text>
    <text x="412" y="82" text-anchor="middle" font-size="11" fill="#333">|val-max|</text>
    <text x="497" y="82" text-anchor="middle" font-size="11" fill="#333">ans</text>
  </g>

  <!-- 高亮第 3 行（节点 1，命中 7） -->
  <rect x="60" y="148" width="480" height="28" fill="#fff8e1" filter="url(#rough2)"/>

  <!-- 数据行 -->
  <g font-size="11" fill="#333" filter="url(#rough2)">
    <text x="85" y="110" text-anchor="middle">1</text><text x="137" y="110" text-anchor="middle">8</text><text x="195" y="110" text-anchor="middle">8</text><text x="255" y="110" text-anchor="middle">8</text><text x="327" y="110" text-anchor="middle">0</text><text x="412" y="110" text-anchor="middle">0</text><text x="497" y="110" text-anchor="middle">0</text>

    <text x="85" y="138" text-anchor="middle">2</text><text x="137" y="138" text-anchor="middle">3</text><text x="195" y="138" text-anchor="middle">3</text><text x="255" y="138" text-anchor="middle">8</text><text x="327" y="138" text-anchor="middle">0</text><text x="412" y="138" text-anchor="middle">5</text><text x="497" y="138" text-anchor="middle">5</text>

    <text x="85" y="166" text-anchor="middle" fill="#b85450" font-weight="bold">3</text><text x="137" y="166" text-anchor="middle" fill="#b85450" font-weight="bold">1</text><text x="195" y="166" text-anchor="middle">1</text><text x="255" y="166" text-anchor="middle">8</text><text x="327" y="166" text-anchor="middle">0</text><text x="412" y="166" text-anchor="middle" fill="#b85450" font-weight="bold">7</text><text x="497" y="166" text-anchor="middle" fill="#b85450" font-weight="bold">7</text>

    <text x="85" y="194" text-anchor="middle">4</text><text x="137" y="194" text-anchor="middle">6</text><text x="195" y="194" text-anchor="middle">3</text><text x="255" y="194" text-anchor="middle">8</text><text x="327" y="194" text-anchor="middle">3</text><text x="412" y="194" text-anchor="middle">2</text><text x="497" y="194" text-anchor="middle">7</text>

    <text x="85" y="222" text-anchor="middle">5</text><text x="137" y="222" text-anchor="middle">4</text><text x="195" y="222" text-anchor="middle">3</text><text x="255" y="222" text-anchor="middle">8</text><text x="327" y="222" text-anchor="middle">1</text><text x="412" y="222" text-anchor="middle">4</text><text x="497" y="222" text-anchor="middle">7</text>

    <text x="85" y="250" text-anchor="middle">6</text><text x="137" y="250" text-anchor="middle">7</text><text x="195" y="250" text-anchor="middle">3</text><text x="255" y="250" text-anchor="middle">8</text><text x="327" y="250" text-anchor="middle">4</text><text x="412" y="250" text-anchor="middle">1</text><text x="497" y="250" text-anchor="middle">7</text>

    <text x="85" y="278" text-anchor="middle">7</text><text x="137" y="278" text-anchor="middle">10</text><text x="195" y="278" text-anchor="middle">8</text><text x="255" y="278" text-anchor="middle">10</text><text x="327" y="278" text-anchor="middle">2</text><text x="412" y="278" text-anchor="middle">0</text><text x="497" y="278" text-anchor="middle">7</text>

    <text x="85" y="306" text-anchor="middle">8</text><text x="137" y="306" text-anchor="middle">14</text><text x="195" y="306" text-anchor="middle">8</text><text x="255" y="306" text-anchor="middle">14</text><text x="327" y="306" text-anchor="middle">6</text><text x="412" y="306" text-anchor="middle">0</text><text x="497" y="306" text-anchor="middle">7</text>

    <text x="85" y="334" text-anchor="middle">9</text><text x="137" y="334" text-anchor="middle">13</text><text x="195" y="334" text-anchor="middle">8</text><text x="255" y="334" text-anchor="middle">14</text><text x="327" y="334" text-anchor="middle">5</text><text x="412" y="334" text-anchor="middle">1</text><text x="497" y="334" text-anchor="middle">7</text>
  </g>

  <!-- 高亮最终答案行 -->
  <rect x="455" y="344" width="85" height="52" fill="#e6f4ea" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <text x="497" y="382" text-anchor="middle" font-size="13" fill="#2a4a3a" font-weight="bold">7</text>
  </g>

  <text x="300" y="416" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    第 3 步访问节点 1 时 |1-8|=7 命中最大差，后续均未刷新
  </text>
</svg>
