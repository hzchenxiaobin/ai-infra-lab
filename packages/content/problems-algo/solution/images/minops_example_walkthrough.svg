<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：boxes = "001011" → [11, 8, 5, 4, 3, 4]</text>

  <!-- Pass 1 header -->
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">Pass 1（左→右）：维护 leftCount、leftOps</text>

  <!-- Pass 1 table -->
  <!-- header row -->
  <rect x="40" y="58" width="550" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="75" y="73">i</text>
    <text x="150" y="73">0</text>
    <text x="230" y="73">1</text>
    <text x="310" y="73">2</text>
    <text x="390" y="73">3</text>
    <text x="470" y="73">4</text>
    <text x="550" y="73">5</text>
  </g>

  <!-- boxes[i] row -->
  <rect x="40" y="80" width="550" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="75" y="95" fill="#555" font-weight="bold">boxes[i]</text>
    <text x="150" y="95" fill="#888">0</text>
    <text x="230" y="95" fill="#888">0</text>
    <text x="310" y="95" fill="#d6a040" font-weight="bold">1</text>
    <text x="390" y="95" fill="#888">0</text>
    <text x="470" y="95" fill="#d6a040" font-weight="bold">1</text>
    <text x="550" y="95" fill="#d6a040" font-weight="bold">1</text>
  </g>

  <!-- leftCount row -->
  <rect x="40" y="102" width="550" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="75" y="117" fill="#555" font-weight="bold">leftCount</text>
    <text x="150" y="117" fill="#555">0</text>
    <text x="230" y="117" fill="#555">0</text>
    <text x="310" y="117" fill="#555">0</text>
    <text x="390" y="117" fill="#555">1</text>
    <text x="470" y="117" fill="#555">1</text>
    <text x="550" y="117" fill="#555">2</text>
  </g>

  <!-- leftOps row -->
  <rect x="40" y="124" width="550" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="75" y="139" fill="#d6a040" font-weight="bold">leftOps</text>
    <text x="150" y="139" fill="#555">0</text>
    <text x="230" y="139" fill="#555">0</text>
    <text x="310" y="139" fill="#555">0</text>
    <text x="390" y="139" fill="#555">1</text>
    <text x="470" y="139" fill="#555">2</text>
    <text x="550" y="139" fill="#555">4</text>
  </g>

  <!-- answer row (after pass 1) -->
  <rect x="40" y="146" width="550" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="75" y="161" fill="#446688" font-weight="bold">answer</text>
    <text x="150" y="161" fill="#333" font-weight="bold">0</text>
    <text x="230" y="161" fill="#333" font-weight="bold">0</text>
    <text x="310" y="161" fill="#333" font-weight="bold">0</text>
    <text x="390" y="161" fill="#333" font-weight="bold">1</text>
    <text x="470" y="161" fill="#333" font-weight="bold">2</text>
    <text x="550" y="161" fill="#333" font-weight="bold">4</text>
  </g>

  <!-- Pass 2 header -->
  <text x="320" y="188" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Pass 2（右→左）：维护 rightCount、rightOps</text>

  <!-- Pass 2 table (reversed: i=5,4,3,2,1,0) -->
  <rect x="40" y="198" width="550" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="75" y="213">i</text>
    <text x="150" y="213">5</text>
    <text x="230" y="213">4</text>
    <text x="310" y="213">3</text>
    <text x="390" y="213">2</text>
    <text x="470" y="213">1</text>
    <text x="550" y="213">0</text>
  </g>

  <!-- boxes[i] row -->
  <rect x="40" y="220" width="550" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="75" y="235" fill="#555" font-weight="bold">boxes[i]</text>
    <text x="150" y="235" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="230" y="235" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="310" y="235" fill="#888">0</text>
    <text x="390" y="235" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="470" y="235" fill="#888">0</text>
    <text x="550" y="235" fill="#888">0</text>
  </g>

  <!-- rightCount row -->
  <rect x="40" y="242" width="550" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="75" y="257" fill="#555" font-weight="bold">rightCount</text>
    <text x="150" y="257" fill="#555">0</text>
    <text x="230" y="257" fill="#555">1</text>
    <text x="310" y="257" fill="#555">2</text>
    <text x="390" y="257" fill="#555">2</text>
    <text x="470" y="257" fill="#555">3</text>
    <text x="550" y="257" fill="#555">3</text>
  </g>

  <!-- rightOps row -->
  <rect x="40" y="264" width="550" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="75" y="279" fill="#4a7a3a" font-weight="bold">rightOps</text>
    <text x="150" y="279" fill="#555">0</text>
    <text x="230" y="279" fill="#555">1</text>
    <text x="310" y="279" fill="#555">3</text>
    <text x="390" y="279" fill="#555">5</text>
    <text x="470" y="279" fill="#555">8</text>
    <text x="550" y="279" fill="#555">11</text>
  </g>

  <!-- answer row (final) -->
  <rect x="40" y="286" width="550" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="75" y="301" fill="#446688" font-weight="bold">answer</text>
    <text x="150" y="301" fill="#333" font-weight="bold">4</text>
    <text x="230" y="301" fill="#333" font-weight="bold">3</text>
    <text x="310" y="301" fill="#333" font-weight="bold">4</text>
    <text x="390" y="301" fill="#333" font-weight="bold">5</text>
    <text x="470" y="301" fill="#333" font-weight="bold">8</text>
    <text x="550" y="301" fill="#333" font-weight="bold">11</text>
  </g>

  <!-- final answer box -->
  <path d="M 320 320 L 320 348" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="160" y="352" width="320" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="320" y="375" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">按 i=0→5 重排：[11, 8, 5, 4, 3, 4] ✓</text>
</svg>
