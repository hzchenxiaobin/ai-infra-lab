<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">批处理核心概念：时间窗口内的请求归为一批</text>

  <!-- timeline -->
  <line x1="40" y1="80" x2="600" y2="80" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="40" y="72" font-size="9" fill="#888" filter="url(#rough2)">t=0</text>
  <text x="180" y="72" font-size="9" fill="#888" filter="url(#rough2)">110</text>
  <text x="330" y="72" font-size="9" fill="#888" filter="url(#rough2)">250</text>
  <text x="490" y="72" font-size="9" fill="#888" filter="url(#rough2)">350</text>

  <!-- tick marks -->
  <line x1="40" y1="76" x2="40" y2="84" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="180" y1="76" x2="180" y2="84" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="330" y1="76" x2="330" y2="84" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="490" y1="76" x2="490" y2="84" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Batch 1 window -->
  <rect x="60" y="95" width="120" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="120" y="115" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">Batch 1 窗口</text>
  <text x="120" y="132" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">[10, 110]</text>

  <!-- request boxes batch 1 -->
  <rect x="68" y="158" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <text x="82" y="196" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">@10</text>

  <rect x="100" y="158" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="114" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>
  <text x="114" y="196" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">@20</text>

  <rect x="132" y="158" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c</text>
  <text x="146" y="196" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">@30</text>

  <rect x="164" y="158" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d</text>
  <text x="178" y="196" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">@40</text>

  <!-- gap between batches -->
  <text x="255" y="174" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">⋯</text>

  <!-- Batch 2 window -->
  <rect x="330" y="95" width="120" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="390" y="115" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Batch 2 窗口</text>
  <text x="390" y="132" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">[250, 350]</text>

  <!-- request boxes batch 2 -->
  <rect x="340" y="158" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="354" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">e</text>
  <text x="354" y="196" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">@250</text>

  <rect x="378" y="158" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="392" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">f</text>
  <text x="392" y="196" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">@300</text>

  <!-- flush arrows -->
  <path d="M 120 150 L 120 210" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 390 150 L 390 210" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arro)" filter="url(#rough2)"/>

  <!-- batchFn calls -->
  <rect x="52" y="220" width="136" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="120" y="242" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">batchFn([a,b,c,d])</text>

  <rect x="322" y="220" width="136" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="390" y="242" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">batchFn([e,f])</text>

  <!-- execution bars -->
  <text x="30" y="275" font-size="9" fill="#888" filter="url(#rough2)">t:</text>
  <line x1="40" y1="280" x2="600" y2="280" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="190" y="275" font-size="8" fill="#888" filter="url(#rough2)">510</text>
  <text x="460" y="275" font-size="8" fill="#888" filter="url(#rough2)">550</text>

  <!-- batch 1 execution -->
  <rect x="180" y="290" width="150" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="303" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">batch1 执行中 (400ms)</text>

  <!-- batch 2 execution (overlapping) -->
  <rect x="410" y="315" width="80" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="328" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">batch2 (200ms)</text>

  <!-- overlapping annotation -->
  <text x="440" y="355" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠ 两批并行执行（重叠）</text>

  <!-- result -->
  <rect x="100" y="375" width="440" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="397" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ["a!","b!","c!","d!","e!","f!"]</text>
</svg>
