<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">单调栈 O(n)：left[i] = left[j] + h[i] × (i − j)</text>

  <!-- 上半：区间结构示意 -->
  <text x="42" y="58" font-size="12" fill="#999" font-weight="bold" filter="url(#rough2)">以 i 为峰时左侧塔高按 h 分段：</text>

  <rect x="70" y="72" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="135" y="94" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[0..j] 复用 left[j]</text>

  <rect x="206" y="72" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="221" y="94" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">j</text>

  <rect x="242" y="72" width="180" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="332" y="94" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">(j..i) 全被压平成 h[i]</text>

  <rect x="428" y="72" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="445" y="94" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">i</text>

  <!-- 括线标注 -->
  <path d="M 70 114 L 236 114" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 242 114 L 462 114" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 150 114 L 150 128" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="144" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">h[j] ≤ h[i]，min 传到这里就停</text>
  <path d="M 352 114 L 352 128" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="144" text-anchor="middle" font-size="11" fill="#8a6d1a" filter="url(#rough2)">这些位置的上限都 &gt; h[i]</text>

  <!-- 下半：栈演算，以 h = [6,5,3,9,2,7] 求 left 为例 -->
  <text x="42" y="180" font-size="12" fill="#999" font-weight="bold" filter="url(#rough2)">h = [6,5,3,9,2,7]，栈存下标、栈内 h 递增：</text>

  <!-- i=3 -->
  <rect x="42" y="194" width="250" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="214" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">i=3, h=9：栈 [2]，h[2]=3 ≤ 9 不弹</text>
  <text x="56" y="234" font-size="12" fill="#333" filter="url(#rough2)">left[3] = left[2] + 9×(3−2)</text>
  <text x="56" y="254" font-size="12" fill="#333" filter="url(#rough2)">       = 9 + 9 = 18</text>
  <text x="56" y="272" font-size="10" fill="#999" filter="url(#rough2)">峰左侧只有 1 格被压平</text>

  <!-- i=4 -->
  <rect x="312" y="194" width="270" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="326" y="214" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">i=4, h=2：弹 9、弹 3 → 栈空</text>
  <text x="326" y="234" font-size="12" fill="#333" filter="url(#rough2)">left[4] = 0 + 2×(4−(−1)) = 10</text>
  <text x="326" y="254" font-size="12" fill="#333" filter="url(#rough2)">j = −1（哨兵，左侧全压平）</text>
  <text x="326" y="272" font-size="10" fill="#999" filter="url(#rough2)">左边 5 格上限都比 2 大，全被压到 2</text>

  <!-- 结果 -->
  <rect x="42" y="296" width="540" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="312" y="318" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">left = [6, 10, 9, 18, 10, 17]，right 同理从右往左扫一遍</text>

  <!-- 公式框 -->
  <rect x="42" y="344" width="540" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="312" y="362" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = max( left[i] + right[i] − h[i] )，峰被左右各算一次要减掉</text>
  <text x="312" y="378" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">right 完全对称：right[i] = right[j] + h[i] × (j − i)，j 是右边第一个 h[j] ≤ h[i]</text>
</svg>
