<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">自底向上贪心：逐层对齐兄弟子树</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">sum[i] = cost[i] + max(sum[左], sum[右])</text>

  <!-- ===== Step 1: Process bottom-up ===== -->
  <text x="30" y="76" font-size="12" fill="#446688" font-weight="bold">Step 1: 从叶子上一层开始，自底向上遍历</text>

  <!-- Tree with sum annotations -->
  <g font-size="11">
    <!-- internal nodes (blue) -->
    <circle cx="80" cy="112" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="80" y="117" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="80" y="106" text-anchor="middle" font-size="8" fill="#aaa">sum</text>

    <circle cx="45" cy="172" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="45" y="176" text-anchor="middle" fill="#446688" font-weight="bold">5</text>

    <circle cx="115" cy="172" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="115" y="176" text-anchor="middle" fill="#446688" font-weight="bold">2</text>

    <line x1="70" y1="126" x2="55" y2="160" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="90" y1="126" x2="105" y2="160" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

    <!-- leaves (green) -->
    <circle cx="25" cy="228" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="25" y="232" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>

    <circle cx="65" cy="228" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="65" y="232" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>

    <circle cx="95" cy="228" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="95" y="232" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>

    <circle cx="135" cy="228" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="135" y="232" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>

    <line x1="38" y1="184" x2="30" y2="218" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <line x1="52" y1="184" x2="60" y2="218" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <line x1="108" y1="184" x2="100" y2="218" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <line x1="122" y1="184" x2="130" y2="218" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  </g>

  <!-- arrows showing processing order -->
  <path d="M 165 228 Q 175 200 175 172" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="205" font-size="9" fill="#b85450" font-weight="bold">从底</text>
  <text x="180" y="218" font-size="9" fill="#b85450" font-weight="bold">向上</text>

  <!-- ===== Step 2: Formula for each internal node ===== -->
  <rect x="210" y="82" width="330" height="100" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <text x="375" y="102" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">Step 2: 对每个内部节点 i</text>

  <text x="220" y="124" font-size="10" fill="#444">左孩子 2i 的子树路径和 = sum[2i]</text>
  <text x="220" y="142" font-size="10" fill="#444">右孩子 2i+1 的子树路径和 = sum[2i+1]</text>

  <rect x="220" y="150" width="310" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="375" y="167" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">ans += |sum[左] − sum[右]|</text>

  <!-- ===== Step 3: Update parent sum ===== -->
  <rect x="210" y="196" width="330" height="60" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <text x="375" y="216" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Step 3: 更新父节点的子树和</text>

  <rect x="220" y="226" width="310" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="375" y="243" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">sum[i] = cost[i] + max(sum[左], sum[右])</text>

  <!-- ===== Why greedy works ===== -->
  <rect x="210" y="272" width="330" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="375" y="292" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">为什么贪心最优？</text>
  <text x="220" y="310" font-size="10" fill="#555">① 增加节点 i 影响 i 子树内所有路径（等量）</text>
  <text x="220" y="326" font-size="10" fill="#555">② 子树内部已对齐，增量不会破坏对齐</text>
  <text x="220" y="342" font-size="10" fill="#555">③ 只能增不能减 → 增小者追大者是最优</text>

  <!-- bottom note -->
  <line x1="20" y1="362" x2="540" y2="362" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="280" y="384" text-anchor="middle" font-size="10" fill="#aaa">i 从 n/2 递减到 1（数组实现，无需递归）</text>
  <text x="280" y="400" text-anchor="middle" font-size="10" fill="#aaa">cost 数组原地更新，O(1) 额外空间</text>
</svg>
