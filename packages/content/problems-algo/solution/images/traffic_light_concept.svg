<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="540" height="420" fill="#fdfcf7"/>

  <text x="270" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">红绿灯路口：A 路 × B 路</text>
  <path d="M 150 38 Q 270 46 390 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Roads -->
  <g filter="url(#sk)">
    <rect x="232" y="58" width="76" height="322" fill="#eeeae0" stroke="#bbb" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)">
    <rect x="38" y="192" width="464" height="76" fill="#eeeae0" stroke="#bbb" stroke-width="1.5"/>
  </g>

  <!-- lane center lines (dashed white) -->
  <path d="M 270 62 L 270 186" stroke="#fff" stroke-width="2" stroke-dasharray="6 5" filter="url(#sk)"/>
  <path d="M 270 278 L 270 376" stroke="#fff" stroke-width="2" stroke-dasharray="6 5" filter="url(#sk)"/>
  <path d="M 42 230 L 226 230" stroke="#fff" stroke-width="2" stroke-dasharray="6 5" filter="url(#sk)"/>
  <path d="M 314 230 L 498 230" stroke="#fff" stroke-width="2" stroke-dasharray="6 5" filter="url(#sk)"/>

  <!-- Direction arrows -->
  <path d="M 270 96 L 270 168" stroke="#446688" stroke-width="2.5" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="292" y="120" font-size="11" fill="#446688" font-weight="bold">方向1 ↓</text>
  <text x="292" y="134" font-size="9" fill="#888">北→南</text>

  <path d="M 270 362 L 270 292" stroke="#446688" stroke-width="2.5" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="292" y="336" font-size="11" fill="#446688" font-weight="bold">方向2 ↑</text>
  <text x="292" y="350" font-size="9" fill="#888">南→北</text>

  <path d="M 66 230 L 206 230" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="74" y="218" font-size="11" fill="#4a7a3a" font-weight="bold">方向3 →</text>
  <text x="74" y="252" font-size="9" fill="#888">西→东</text>

  <path d="M 484 230 L 344 230" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="392" y="218" font-size="11" fill="#4a7a3a" font-weight="bold">方向4 ←</text>
  <text x="392" y="252" font-size="9" fill="#888">东→西</text>

  <!-- Traffic light A (green) -->
  <g filter="url(#sk)">
    <rect x="316" y="64" width="20" height="38" rx="5" fill="#3a3a3a" stroke="#222" stroke-width="1.3"/>
    <circle cx="326" cy="76" r="5" fill="#b85450" opacity="0.3"/>
    <circle cx="326" cy="92" r="5" fill="#4a8e4a"/>
  </g>
  <text x="342" y="82" font-size="10" fill="#4a8e4a" font-weight="bold">灯A 绿</text>

  <!-- Traffic light B (red) -->
  <g filter="url(#sk)">
    <rect x="46" y="154" width="20" height="38" rx="5" fill="#3a3a3a" stroke="#222" stroke-width="1.3"/>
    <circle cx="56" cy="166" r="5" fill="#b85450"/>
    <circle cx="56" cy="182" r="5" fill="#4a8e4a" opacity="0.3"/>
  </g>
  <text x="40" y="148" font-size="10" fill="#b85450" font-weight="bold">灯B 红</text>

  <!-- Road labels -->
  <text x="244" y="54" font-size="11" fill="#666" font-weight="bold">A 路</text>
  <text x="484" y="186" font-size="11" fill="#666" font-weight="bold">B 路</text>

  <!-- Note: grouping rules -->
  <g filter="url(#sk)">
    <rect x="348" y="300" width="178" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="358" y="320" font-size="11" font-weight="bold" fill="#446688">分组规则</text>
  <text x="358" y="338" font-size="10" fill="#444">roadId 1 → A 路（方向 1、2）</text>
  <text x="358" y="354" font-size="10" fill="#444">roadId 2 → B 路（方向 3、4）</text>
  <text x="358" y="370" font-size="10" fill="#444">同路两方向可同时通行</text>

  <!-- Note: initial state -->
  <g filter="url(#sk)">
    <rect x="14" y="300" width="170" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="24" y="320" font-size="11" font-weight="bold" fill="#d6a040">初始状态</text>
  <text x="24" y="338" font-size="10" fill="#444">A 路绿灯 / B 路红灯</text>
  <text x="24" y="354" font-size="10" fill="#444">两路不可同时绿灯</text>
  <text x="24" y="370" font-size="10" fill="#b85450">已绿再开绿 = 错误</text>
</svg>
