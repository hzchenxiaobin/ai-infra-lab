<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：大根堆 + k 轮贪心</text>

  <!-- Step 1: Build max heap -->
  <rect x="170" y="48" width="200" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="74" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 将 piles 建为大根堆</text>

  <line x1="270" y1="92" x2="270" y2="118" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Loop condition -->
  <polygon points="270,120 380,165 270,210 160,165" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="160" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">还有操作次数</text>
  <text x="270" y="178" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">k &gt; 0 ?</text>

  <!-- No branch -> sum -->
  <line x1="380" y1="165" x2="440" y2="165" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="395" y="158" font-size="10" fill="#888">否</text>

  <rect x="440" y="142" width="90" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="485" y="162" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">累加堆中</text>
  <text x="485" y="178" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">所有元素</text>

  <line x1="485" y1="190" x2="485" y2="220" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="420" y="222" width="130" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="485" y="246" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回总和</text>

  <!-- Yes branch -> pop -->
  <line x1="270" y1="210" x2="270" y2="240" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="230" font-size="10" fill="#888">是</text>

  <!-- Step 3: Pop max -->
  <rect x="170" y="242" width="200" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="268" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 弹出堆顶 t（当前最大堆）</text>

  <line x1="270" y1="286" x2="270" y2="312" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: Halve -->
  <rect x="160" y="314" width="220" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="340" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ t = t − floor(t/2) = ceil(t/2)</text>

  <line x1="270" y1="358" x2="270" y2="378" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: Push back + k-- -->
  <rect x="155" y="380" width="230" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="402" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ push(t)，k−−，回到①判断</text>

  <!-- Loop back arrow -->
  <path d="M 155 397 Q 80 397 80 165 Q 80 120 160 165" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="55" y="280" font-size="10" fill="#aaa" transform="rotate(-90 55 280)">循环 k 次</text>
</svg>
