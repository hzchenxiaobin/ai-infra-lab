<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- 面板一：示例① 正向模拟 -->
  <text x="260" y="44" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">示例① 正向模拟：windows=[1,2,3]，queries=[3,3,2]</text>
  <text x="56" y="62" font-size="10" fill="#999" filter="url(#rough2)">操作</text>
  <text x="176" y="62" font-size="10" fill="#999" filter="url(#rough2)">z 序（顶 → 底）</text>

  <text x="56" y="83" font-size="10.5" fill="#555" filter="url(#rough2)">初始</text>
  <rect x="176" y="68" width="34" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="193" y="83" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="214" y="68" width="34" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="231" y="83" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="252" y="68" width="34" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="269" y="83" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>

  <text x="56" y="109" font-size="10.5" fill="#555" filter="url(#rough2)">选 3</text>
  <rect x="176" y="94" width="34" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="193" y="109" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="214" y="94" width="34" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="231" y="109" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="252" y="94" width="34" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="269" y="109" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>

  <text x="56" y="135" font-size="10.5" fill="#555" filter="url(#rough2)">再选 3（已在顶）</text>
  <rect x="176" y="120" width="34" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="193" y="135" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="214" y="120" width="34" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="231" y="135" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="252" y="120" width="34" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="269" y="135" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>

  <text x="56" y="161" font-size="10.5" fill="#555" filter="url(#rough2)">选 2</text>
  <rect x="176" y="146" width="34" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="193" y="161" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="214" y="146" width="34" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="231" y="161" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="252" y="146" width="34" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="269" y="161" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="330" y="161" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⇒ 最终 [2,3,1]</text>

  <path d="M 30 178 L 490 178" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="5 5" fill="none" filter="url(#rough2)"/>

  <!-- 面板二：示例② 逆向一次成型 -->
  <text x="260" y="198" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">示例② 逆向一次成型：windows=[1,4,2,3]，queries=[4,1,3]</text>

  <text x="36" y="227" font-size="10.5" fill="#555" filter="url(#rough2)">① 倒扫 queries 收新 id：3 → 1 → 4</text>
  <rect x="260" y="212" width="34" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="277" y="227" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="298" y="212" width="34" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="315" y="227" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="336" y="212" width="34" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="353" y="227" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="36" y="261" font-size="10.5" fill="#555" filter="url(#rough2)">② 正扫 windows：2 是新面孔（其余已见过）</text>
  <rect x="260" y="246" width="34" height="22" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="277" y="261" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">1</text>
  <path d="M 263 264 L 291 250" stroke="#b85450" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <rect x="298" y="246" width="34" height="22" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="315" y="261" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">4</text>
  <path d="M 301 264 L 329 250" stroke="#b85450" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <rect x="336" y="246" width="34" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="353" y="261" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="374" y="246" width="34" height="22" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="391" y="261" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">3</text>
  <path d="M 377 264 L 405 250" stroke="#b85450" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <path d="M 391 268 L 391 277" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <text x="36" y="295" font-size="10.5" fill="#555" filter="url(#rough2)">③ 新面孔 2 接到 ans 尾部</text>
  <rect x="260" y="280" width="34" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="277" y="295" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="298" y="280" width="34" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="315" y="295" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="336" y="280" width="34" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="353" y="295" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="374" y="280" width="34" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="391" y="295" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="36" y="329" font-size="10.5" fill="#555" filter="url(#rough2)">④ 最终答案</text>
  <rect x="260" y="314" width="34" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="277" y="329" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="298" y="314" width="34" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="315" y="329" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="336" y="314" width="34" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="353" y="329" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="374" y="314" width="34" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="391" y="329" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="430" y="329" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <text x="260" y="350" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">殊途同归：重复选中只算最后一次，未选中的原序垫底</text>
</svg>
