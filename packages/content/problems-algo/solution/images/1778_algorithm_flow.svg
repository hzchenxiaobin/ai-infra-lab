<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>
  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程</text>

  <!-- Start -->
  <rect x="200" y="40" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="11.5" fill="#333">从 (0,0) 开始</text>

  <path d="M260 68 L260 82" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Phase 1 -->
  <rect x="30" y="82" width="460" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="102" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">阶段 1：DFS 探图</text>
  <text x="50" y="122" font-size="10.5" fill="#555">for d in {U, D, L, R}:</text>
  <text x="50" y="138" font-size="10.5" fill="#555">  canMove(d)? → move(d), DFS(邻居), move(oppo(d))</text>
  <text x="50" y="154" font-size="10.5" fill="#555">  isTarget()? → 记录目标坐标</text>
  <text x="50" y="172" font-size="10.5" fill="#b85450">→ 输出：accessible 集合 + target 坐标</text>

  <path d="M260 182 L260 196" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: found target? -->
  <polygon points="260,196 340,222 260,248 180,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="11" fill="#333">找到目标?</text>

  <!-- No branch -->
  <path d="M180 222 L115 222" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="148" y="216" text-anchor="middle" font-size="10" fill="#888">No</text>
  <rect x="25" y="210" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="226" text-anchor="middle" font-size="11" fill="#b85450">return -1</text>

  <!-- Yes branch -->
  <path d="M260 248 L260 262" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="258" font-size="10" fill="#888">Yes</text>

  <!-- Phase 2 -->
  <rect x="30" y="262" width="460" height="110" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">阶段 2：BFS 寻路</text>
  <text x="50" y="302" font-size="10.5" fill="#555">queue = [(0,0)], dist = {(0,0): 0}</text>
  <text x="50" y="318" font-size="10.5" fill="#555">while queue 非空:</text>
  <text x="50" y="334" font-size="10.5" fill="#555">  pop (r,c), for 4 邻居 (nr,nc) in accessible:</text>
  <text x="50" y="350" font-size="10.5" fill="#555">    if 未访问: dist[邻居] = dist[(r,c)] + 1, 入队</text>
  <text x="50" y="366" font-size="10.5" fill="#b85450">    if 邻居 == target: return dist</text>

  <path d="M260 372 L260 386" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return -->
  <rect x="190" y="386" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="404" text-anchor="middle" font-size="11.5" fill="#333">返回最短步数</text>

  <text x="260" y="432" text-anchor="middle" font-size="10" fill="#aaa">DFS 保证探完所有可达格 → BFS 在完整地图上求最短路</text>
</svg>
