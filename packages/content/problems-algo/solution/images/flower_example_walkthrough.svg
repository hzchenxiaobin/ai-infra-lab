<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：贪心着色逐步过程</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">左：示例 1（环 1-2-3-1）| 右：示例 3（K4 完全图）</text>

  <!-- ===== Left: Example 1 (triangle) ===== -->
  <text x="135" y="74" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1：n=3，每点度数 2</text>

  <!-- Triangle edges -->
  <g filter="url(#rough2)" stroke="#aaa" stroke-width="1.5" fill="none">
    <line x1="70" y1="110" x2="200" y2="110"/>
    <line x1="70" y1="110" x2="135" y2="200"/>
    <line x1="200" y1="110" x2="135" y2="200"/>
  </g>

  <!-- Nodes -->
  <g filter="url(#rough2)" font-size="13" font-weight="bold">
    <circle cx="70" cy="110" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="70" y="115" text-anchor="middle" fill="#b85450">1</text>

    <circle cx="200" cy="110" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="200" y="115" text-anchor="middle" fill="#446688">2</text>

    <circle cx="135" cy="200" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="135" y="205" text-anchor="middle" fill="#4a7a3a">3</text>
  </g>

  <!-- Steps table for ex1 -->
  <g filter="url(#rough2)" font-size="10">
    <rect x="35" y="230" width="200" height="100" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="6"/>
    <text x="42" y="248" fill="#555" font-weight="bold">节点 | 邻居已用 | 候选 → 选</text>
    <line x1="42" y1="253" x2="228" y2="253" stroke="#ccc"/>
    <text x="42" y="269" fill="#b85450">  1  |  ∅        | {1,2,3,4} → 1</text>
    <text x="42" y="285" fill="#446688">  2  |  {1}      | {2,3,4}   → 2</text>
    <text x="42" y="301" fill="#4a7a3a">  3  |  {1,2}    | {3,4}     → 3</text>
    <text x="42" y="319" fill="#666" font-weight="bold">结果 [1, 2, 3]</text>
  </g>

  <!-- ===== Right: Example 3 (K4) ===== -->
  <text x="415" y="74" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">示例 3：n=4，K4 每点度数 3</text>

  <!-- K4 edges -->
  <g filter="url(#rough2)" stroke="#aaa" stroke-width="1.5" fill="none">
    <line x1="355" y1="110" x2="475" y2="110"/>
    <line x1="355" y1="110" x2="415" y2="200"/>
    <line x1="355" y1="110" x2="475" y2="200"/>
    <line x1="475" y1="110" x2="415" y2="200"/>
    <line x1="475" y1="110" x2="475" y2="200"/>
    <line x1="415" y1="200" x2="475" y2="200"/>
  </g>

  <!-- Nodes colored -->
  <g filter="url(#rough2)" font-size="13" font-weight="bold">
    <circle cx="355" cy="110" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="355" y="115" text-anchor="middle" fill="#b85450">1</text>

    <circle cx="475" cy="110" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="475" y="115" text-anchor="middle" fill="#446688">2</text>

    <circle cx="415" cy="200" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="415" y="205" text-anchor="middle" fill="#4a7a3a">3</text>

    <circle cx="490" cy="200" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="490" y="205" text-anchor="middle" fill="#d6a040">4</text>
  </g>

  <!-- Critical callout for node 4 -->
  <g filter="url(#rough2)">
    <rect x="475" y="172" width="78" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="514" y="187" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">仅剩花4</text>
  </g>

  <!-- Steps table for ex3 -->
  <g filter="url(#rough2)" font-size="10">
    <rect x="315" y="230" width="225" height="118" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="6"/>
    <text x="322" y="248" fill="#555" font-weight="bold">节点 | 邻居已用  | 候选 → 选</text>
    <line x1="322" y1="253" x2="533" y2="253" stroke="#ccc"/>
    <text x="322" y="269" fill="#b85450">  1  |  ∅        | {1,2,3,4} → 1</text>
    <text x="322" y="285" fill="#446688">  2  |  {1}      | {2,3,4}   → 2</text>
    <text x="322" y="301" fill="#4a7a3a">  3  |  {1,2}    | {3,4}     → 3</text>
    <text x="322" y="317" fill="#d6a040">  4  |  {1,2,3}  | {4}       → 4</text>
    <text x="322" y="338" fill="#666" font-weight="bold">结果 [1, 2, 3, 4]</text>
  </g>

  <!-- ===== Bottom takeaway ===== -->
  <g filter="url(#rough2)">
    <rect x="50" y="358" width="460" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8"/>
    <text x="280" y="380" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">节点 4 的临界情形：3 个邻居用满 {1,2,3}，仅剩 {4}</text>
    <text x="280" y="398" text-anchor="middle" font-size="10" fill="#888">度数 = k−1 时颜色恰好用满 → 这就是「4 色 + 度数 ≤ 3」精确配对的设计意图</text>
    <text x="280" y="413" text-anchor="middle" font-size="10" fill="#b85450">若减到 3 色，K4 无法着色（色数 = 4），贪心会失败</text>
  </g>

  <text x="280" y="432" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">红=花1 | 蓝=花2 | 绿=花3 | 橙=花4</text>
</svg>
