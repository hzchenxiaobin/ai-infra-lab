<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：三组输入套同一条公式（含 k = 0 边界）</text>

  <!-- 行 1：示例 1 -->
  <rect x="24" y="56" width="100" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="74" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x = 2, y = 7</text>

  <path d="M 126 78 L 148 78" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="56" width="180" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="240" y="74" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⌊7/4⌋ = 1</text>
  <text x="240" y="92" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">k = min(2, 1) = 1 奇</text>

  <path d="M 332 78 L 352 78" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="354" y="52" width="92" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="400" y="74" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Alice</text>
  <text x="400" y="93" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">赢家</text>

  <text x="30" y="122" font-size="10.5" fill="#888" filter="url(#rough2)">Alice 拿 (1, 4) 后剩 (1, 3)——Bob 只差 1 枚 10 币，凑不齐</text>

  <path d="M 24 136 L 496 136" stroke="#ccc" stroke-width="1" stroke-dasharray="5 5" filter="url(#rough2)"/>

  <!-- 行 2：示例 2 -->
  <rect x="24" y="160" width="100" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="74" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x = 4, y = 11</text>

  <path d="M 126 182 L 148 182" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="160" width="180" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="240" y="178" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⌊11/4⌋ = 2</text>
  <text x="240" y="196" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">k = min(4, 2) = 2 偶</text>

  <path d="M 332 182 L 352 182" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="354" y="156" width="92" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="400" y="178" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">Bob</text>
  <text x="400" y="197" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">赢家</text>

  <text x="30" y="226" font-size="10.5" fill="#888" filter="url(#rough2)">两人各拿一次后剩 (2, 3)——轮到 Alice，凑不齐</text>

  <path d="M 24 240 L 496 240" stroke="#ccc" stroke-width="1" stroke-dasharray="5 5" filter="url(#rough2)"/>

  <!-- 行 3：边界 k=0 -->
  <rect x="24" y="264" width="100" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="74" y="290" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x = 1, y = 3</text>

  <path d="M 126 286 L 148 286" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="264" width="180" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="282" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⌊3/4⌋ = 0</text>
  <text x="240" y="300" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">k = min(1, 0) = 0 偶</text>

  <path d="M 332 286 L 352 286" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="354" y="260" width="92" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="400" y="282" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">Bob</text>
  <text x="400" y="301" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">赢家</text>

  <text x="30" y="330" font-size="10.5" fill="#888" filter="url(#rough2)">开局 10 币不足 4 枚——Alice 一步没走就输了，k = 0 走公式无需特判</text>

  <rect x="70" y="352" width="380" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="373" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">同一公式通吃三行：奇偶定胜负，边界自洽</text>
</svg>
