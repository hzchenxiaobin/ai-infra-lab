<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：一遍过滤扫描</text>

  <!-- 示例 1 -->
  <text x="60" y="42" text-anchor="start" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：height = [1,2,3,4,5]，threshold = 2</text>

  <rect x="60" y="48" width="60" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">j</text>
  <rect x="120" y="48" width="90" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="165" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">height[j]</text>
  <rect x="210" y="48" width="170" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="295" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">height[j] &gt; 2 ?</text>
  <rect x="380" y="48" width="90" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="425" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">收集 j+1</text>

  <rect x="60" y="70" width="60" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="120" y="70" width="90" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="210" y="70" width="170" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="70" width="90" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="85" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="165" y="85" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="295" y="85" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1 &gt; 2 ✗</text>
  <text x="425" y="85" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <rect x="60" y="92" width="60" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="120" y="92" width="90" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="210" y="92" width="170" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="92" width="90" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="107" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="165" y="107" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="295" y="107" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2 &gt; 2 ✗（严格！）</text>
  <text x="425" y="107" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <rect x="60" y="114" width="60" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="120" y="114" width="90" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="210" y="114" width="170" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="114" width="90" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="129" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="165" y="129" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="295" y="129" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3 &gt; 2 ✓</text>
  <text x="425" y="129" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="60" y="136" width="60" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="120" y="136" width="90" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="210" y="136" width="170" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="136" width="90" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="151" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="165" y="151" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="295" y="151" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4 &gt; 2 ✓</text>
  <text x="425" y="151" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="60" y="164" width="410" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="180" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = [3, 4] —— 与示例 1 一致；注意 j=1 行：2 &gt; 2 为假（严格）</text>

  <!-- 示例 3 -->
  <text x="60" y="210" text-anchor="start" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 3：height = [10,1,10,1,10]，threshold = 10（严格性的坑）</text>

  <rect x="60" y="216" width="60" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="231" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">j</text>
  <rect x="120" y="216" width="90" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="165" y="231" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">height[j]</text>
  <rect x="210" y="216" width="170" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="295" y="231" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">height[j] &gt; 10 ?</text>
  <rect x="380" y="216" width="90" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="425" y="231" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">收集 j+1</text>

  <rect x="60" y="238" width="60" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="120" y="238" width="90" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="210" y="238" width="170" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="238" width="90" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="253" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="165" y="253" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <text x="295" y="253" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">10 &gt; 10 ✗（相等不算）</text>
  <text x="425" y="253" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <rect x="60" y="260" width="60" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="120" y="260" width="90" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="210" y="260" width="170" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="260" width="90" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="275" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="165" y="275" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="295" y="275" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1 &gt; 10 ✗</text>
  <text x="425" y="275" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <rect x="60" y="282" width="60" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="120" y="282" width="90" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="210" y="282" width="170" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="282" width="90" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="297" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="165" y="297" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <text x="295" y="297" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">10 &gt; 10 ✗（相等不算）</text>
  <text x="425" y="297" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <rect x="60" y="304" width="60" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="120" y="304" width="90" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="210" y="304" width="170" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="304" width="90" height="22" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="319" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="165" y="319" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="295" y="319" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1 &gt; 10 ✗</text>
  <text x="425" y="319" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <rect x="60" y="332" width="410" height="24" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="348" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = [ ] —— 等于 threshold 不算过线，全数阵亡</text>
</svg>
