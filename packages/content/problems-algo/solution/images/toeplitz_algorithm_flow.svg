<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>
  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：逐格比左上邻居</text>

  <!-- start -->
  <rect x="200" y="48" width="140" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="71" text-anchor="middle" font-size="12" fill="#333">遍历 i = 1 .. m-1</text>

  <path d="M 270 86 L 270 108" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- outer loop: j -->
  <rect x="170" y="112" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="135" text-anchor="middle" font-size="12" fill="#333">遍历 j = 1 .. n-1</text>

  <path d="M 270 148 L 270 170" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: equal? -->
  <polygon points="270,174 380,214 270,254 160,214" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="208" text-anchor="middle" font-size="11" fill="#333">matrix[i][j] ==</text>
  <text x="270" y="224" text-anchor="middle" font-size="11" fill="#333">matrix[i-1][j-1] ?</text>

  <!-- no branch: return false -->
  <path d="M 160 214 L 110 214" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="208" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="20" y="196" width="90" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="65" y="219" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">return false</text>

  <!-- yes branch -->
  <path d="M 270 254 L 270 276" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="270" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- continue box -->
  <rect x="170" y="278" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="301" text-anchor="middle" font-size="11.5" fill="#4a7a3a">继续下一格 (j++ / i++)</text>

  <!-- loop back arrow to j loop -->
  <path d="M 370 296 L 410 296 L 410 130 L 370 130" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="214" font-size="9.5" fill="#888">循环</text>

  <path d="M 270 314 L 270 338" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- end -->
  <rect x="170" y="340" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="363" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">遍历完无冲突 → return true</text>

  <!-- note -->
  <text x="270" y="390" text-anchor="middle" font-size="10.5" fill="#b85450">第 0 行 / 第 0 列无需比较：它们各自独占一条对角线</text>
</svg>
