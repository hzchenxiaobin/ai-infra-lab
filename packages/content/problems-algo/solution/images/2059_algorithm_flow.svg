<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="620" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：有界状态空间 BFS</text>

  <!-- Start oval -->
  <ellipse cx="280" cy="52" rx="44" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="56" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <!-- Arrow down -->
  <path d="M 280 68 L 280 82" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init: dist[start]=0, queue.push(start) -->
  <rect x="180" y="84" width="200" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="104" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">dist[start] ← 0，入队 start</text>

  <!-- Arrow down -->
  <path d="M 280 116 L 280 130" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: queue empty? -->
  <path d="M 210,162 L 280,130 L 350,162 L 280,194 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="160" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">queue</text>
  <text x="280" y="176" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">为空?</text>

  <!-- Yes → return -1 (right) -->
  <path d="M 350 162 L 430 162" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="388" y="156" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <rect x="430" y="148" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="166" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 -1</text>

  <!-- No → pop x (down) -->
  <path d="M 280 194 L 280 210" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="206" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Pop x from queue -->
  <rect x="200" y="212" width="160" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="230" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">x ← queue.pop()</text>

  <!-- Arrow down -->
  <path d="M 280 240 L 280 254" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- For each num in nums -->
  <rect x="170" y="256" width="220" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">for num in nums:</text>

  <!-- Arrow down -->
  <path d="M 280 284 L 280 298" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Compute 3 neighbors -->
  <rect x="140" y="300" width="280" height="28" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nx ∈ {x+num, x−num, x^num}</text>

  <!-- Arrow down -->
  <path d="M 280 328 L 280 342" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: nx == goal? -->
  <path d="M 190,380 L 280,342 L 370,380 L 280,418 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nx ==</text>
  <text x="280" y="388" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">goal ?</text>

  <!-- Yes → return dist[x]+1 (right) -->
  <path d="M 370 380 L 430 380" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="398" y="374" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="430" y="366" width="120" height="28" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="490" y="384" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">返回 dist[x]+1</text>

  <!-- No → down -->
  <path d="M 280 418 L 280 432" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="430" font-size="10.5" fill="#888" font-weight="bold">否</text>

  <!-- Diamond: 0<=nx<=1000 && dist[nx]==-1? -->
  <path d="M 170,472 L 280,432 L 390,472 L 280,512 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="462" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">在域内且</text>
  <text x="280" y="478" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">未访问?</text>
  <text x="280" y="496" text-anchor="middle" font-size="9.5" fill="#666">0≤nx≤1000 ∧ dist[nx]==−1</text>

  <!-- Yes → enqueue (left) -->
  <path d="M 170 472 L 110 472" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="140" y="466" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="30" y="458" width="80" height="28" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="70" y="476" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">入队+标记</text>

  <!-- No → discard (right) -->
  <path d="M 390 472 L 430 472" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="408" y="466" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="430" y="458" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="465" y="476" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">跳过</text>

  <!-- Loop back: from enqueue up to "for num" -->
  <path d="M 70 458 L 70 270 L 170 270" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)" stroke-dasharray="4 3"/>
  <text x="84" y="370" font-size="9.5" fill="#d6a040">下个 num</text>

  <!-- Loop back: from discard to queue empty check -->
  <path d="M 465 458 L 465 162 L 350 162" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4 3"/>
  <text x="478" y="300" font-size="9.5" fill="#888">回主循环</text>

  <!-- Bottom note -->
  <rect x="50" y="536" width="460" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="556" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">关键：先判 == goal（含越界），再判入域</text>
  <text x="280" y="574" text-anchor="middle" font-size="10.5" fill="#555">① nx == goal → 立即返回（越界也能命中）</text>
  <text x="280" y="590" text-anchor="middle" font-size="10.5" fill="#555">② 在域内且未访问 → 入队继续；否则跳过</text>
</svg>
