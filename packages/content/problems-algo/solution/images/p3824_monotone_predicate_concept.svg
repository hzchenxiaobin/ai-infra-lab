<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：S(k) 只降、k² 只涨 —— 谓词一旦为真、永远为真</text>

  <!-- 恒真区底色 -->
  <rect x="240" y="42" width="95" height="143" fill="#e6f4ea" opacity="0.5" filter="url(#rough2)"/>
  <text x="287" y="55" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">恒真区</text>

  <!-- 坐标轴 -->
  <g filter="url(#rough2)">
    <path d="M 58 185 L 338 185" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M 60 190 L 60 40" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="346" y="189" font-size="10" fill="#666">k</text>
    <text x="98" y="34" font-size="10" fill="#666">S(k) / k²</text>
    <text x="110" y="201" text-anchor="middle" font-size="10" fill="#666">1</text>
    <text x="175" y="201" text-anchor="middle" font-size="10" fill="#666">2</text>
    <text x="240" y="201" text-anchor="middle" font-size="10" fill="#666">3</text>
    <text x="305" y="201" text-anchor="middle" font-size="10" fill="#666">4</text>
  </g>

  <!-- 答案竖线 -->
  <path d="M 240 185 L 240 46" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="252" y="216" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">k* = 3 ← 首个真</text>

  <!-- S(k) 折线（橙） -->
  <g filter="url(#rough2)">
    <polyline points="110,57.5 175,108.5 240,134 305,142.5" fill="none" stroke="#d6a040" stroke-width="2.4"/>
    <circle cx="110" cy="57.5" r="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="175" cy="108.5" r="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="240" cy="134" r="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="305" cy="142.5" r="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="110" y="49" text-anchor="middle" font-size="9.5" fill="#8a6d1a" font-weight="bold">15</text>
    <text x="175" y="101" text-anchor="middle" font-size="9.5" fill="#8a6d1a" font-weight="bold">9</text>
    <text x="253" y="131" text-anchor="middle" font-size="9.5" fill="#8a6d1a" font-weight="bold">6</text>
    <text x="305" y="135" text-anchor="middle" font-size="9.5" fill="#8a6d1a" font-weight="bold">5</text>
  </g>

  <!-- k² 曲线（蓝） -->
  <g filter="url(#rough2)">
    <polyline points="110,176.5 175,151 240,108.5 305,49" fill="none" stroke="#446688" stroke-width="2.4"/>
    <circle cx="110" cy="176.5" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="175" cy="151" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="240" cy="108.5" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="305" cy="49" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="110" y="170" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold">1</text>
    <text x="175" y="145" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold">4</text>
    <text x="228" y="103" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold">9</text>
    <text x="305" y="43" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold">16</text>
  </g>

  <!-- 图例 -->
  <g filter="url(#rough2)">
    <path d="M 130 50 L 156 50" stroke="#d6a040" stroke-width="2.4" fill="none"/>
    <text x="162" y="54" font-size="10" fill="#8a6d1a">S(k)：操作次数</text>
    <path d="M 130 66 L 156 66" stroke="#446688" stroke-width="2.4" fill="none"/>
    <text x="162" y="70" font-size="10" fill="#33506b">k²：预算上限</text>
  </g>

  <!-- 右侧单调性注记 -->
  <g filter="url(#rough2)">
    <rect x="350" y="42" width="196" height="144" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="448" y="64" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold">单调性从哪来？</text>
    <text x="448" y="83" text-anchor="middle" font-size="10" fill="#8a6d1a">① k 增大 ⇒ 每个 ⌈v/k⌉ 只减不增</text>
    <text x="448" y="99" text-anchor="middle" font-size="10" fill="#8a6d1a">⇒ S(k) 单调不增</text>
    <text x="448" y="116" text-anchor="middle" font-size="10" fill="#8a6d1a">② k² 严格递增</text>
    <text x="448" y="134" text-anchor="middle" font-size="10" fill="#8a6d1a">P 真 ⇒ S(k+1) ≤ S(k) ≤ k²</text>
    <text x="448" y="150" text-anchor="middle" font-size="10" fill="#8a6d1a">又 k² &lt; (k+1)² ⇒ P(k+1) 真</text>
    <text x="448" y="168" text-anchor="middle" font-size="10" fill="#8a6d1a">false…false true…true</text>
    <text x="448" y="182" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">→ 二分找首个 true</text>
  </g>

  <!-- 底部演算表 -->
  <g filter="url(#rough2)">
    <text x="95" y="222" font-size="10.5" fill="#666">示例演算：nums = [3, 7, 5]</text>

    <rect x="60" y="228" width="485" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="95" y="244" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">k</text>
    <text x="165" y="244" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">⌈3/k⌉</text>
    <text x="215" y="244" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">⌈7/k⌉</text>
    <text x="265" y="244" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">⌈5/k⌉</text>
    <text x="340" y="244" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">S(k)</text>
    <text x="410" y="244" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">k²</text>
    <text x="495" y="244" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">S(k) ≤ k² ?</text>

    <rect x="60" y="252" width="485" height="24" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <text x="95" y="268" text-anchor="middle" font-size="10.5" fill="#333">1</text>
    <text x="165" y="268" text-anchor="middle" font-size="10.5" fill="#333">3</text>
    <text x="215" y="268" text-anchor="middle" font-size="10.5" fill="#333">7</text>
    <text x="265" y="268" text-anchor="middle" font-size="10.5" fill="#333">5</text>
    <text x="340" y="268" text-anchor="middle" font-size="10.5" fill="#333">15</text>
    <text x="410" y="268" text-anchor="middle" font-size="10.5" fill="#333">1</text>
    <text x="495" y="268" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

    <rect x="60" y="276" width="485" height="24" rx="3" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
    <text x="95" y="292" text-anchor="middle" font-size="10.5" fill="#333">2</text>
    <text x="165" y="292" text-anchor="middle" font-size="10.5" fill="#333">2</text>
    <text x="215" y="292" text-anchor="middle" font-size="10.5" fill="#333">4</text>
    <text x="265" y="292" text-anchor="middle" font-size="10.5" fill="#333">3</text>
    <text x="340" y="292" text-anchor="middle" font-size="10.5" fill="#333">9</text>
    <text x="410" y="292" text-anchor="middle" font-size="10.5" fill="#333">4</text>
    <text x="495" y="292" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

    <rect x="60" y="300" width="485" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="95" y="316" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">3</text>
    <text x="165" y="316" text-anchor="middle" font-size="10.5" fill="#333">1</text>
    <text x="215" y="316" text-anchor="middle" font-size="10.5" fill="#333">3</text>
    <text x="265" y="316" text-anchor="middle" font-size="10.5" fill="#333">2</text>
    <text x="340" y="316" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">6</text>
    <text x="410" y="316" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">9</text>
    <text x="495" y="316" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">✓</text>

    <rect x="60" y="324" width="485" height="24" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <text x="95" y="340" text-anchor="middle" font-size="10.5" fill="#333">4</text>
    <text x="165" y="340" text-anchor="middle" font-size="10.5" fill="#333">1</text>
    <text x="215" y="340" text-anchor="middle" font-size="10.5" fill="#333">2</text>
    <text x="265" y="340" text-anchor="middle" font-size="10.5" fill="#333">2</text>
    <text x="340" y="340" text-anchor="middle" font-size="10.5" fill="#333">5</text>
    <text x="410" y="340" text-anchor="middle" font-size="10.5" fill="#333">16</text>
    <text x="495" y="340" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">✓</text>
  </g>
</svg>
