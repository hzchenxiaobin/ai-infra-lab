<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 580" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="580" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [7, 5, 6, 4]</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">自底向上的归并树，每层统计跨段逆序对</text>

  <!-- ===== Level 0: Full array ===== -->
  <text x="20" y="74" font-size="11" fill="#446688" font-weight="bold">第 0 层</text>
  <rect x="200" y="60" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="79" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="248" y="60" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="79" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="296" y="60" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="79" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="344" y="60" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="366" y="79" text-anchor="middle" font-size="11" fill="#333">4</text>

  <!-- Split arrows -->
  <path d="M 260 88 L 190 108" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 88 L 400 108" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Level 1: [7,5] and [6,4] ===== -->
  <text x="20" y="118" font-size="11" fill="#446688" font-weight="bold">第 1 层</text>
  <rect x="148" y="110" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="129" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="196" y="110" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="129" text-anchor="middle" font-size="11" fill="#333">5</text>

  <rect x="348" y="110" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="129" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="396" y="110" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="418" y="129" text-anchor="middle" font-size="11" fill="#333">4</text>

  <!-- Split arrows to singletons -->
  <path d="M 170 138 L 145 158" stroke="#666" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 218 138 L 243 158" stroke="#666" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 370 138 L 345 158" stroke="#666" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 418 138 L 443 158" stroke="#666" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Level 2: Singletons ===== -->
  <text x="20" y="168" font-size="11" fill="#4a7a3a" font-weight="bold">第 2 层</text>
  <rect x="128" y="160" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="146" y="177" text-anchor="middle" font-size="10" fill="#333">7</text>
  <rect x="228" y="160" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="246" y="177" text-anchor="middle" font-size="10" fill="#333">5</text>
  <rect x="328" y="160" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="346" y="177" text-anchor="middle" font-size="10" fill="#333">6</text>
  <rect x="428" y="160" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="446" y="177" text-anchor="middle" font-size="10" fill="#333">4</text>

  <!-- ===== Merge back: Level 2 → Level 1 ===== -->
  <path d="M 146 186 L 171 206" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 246 186 L 221 206" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 346 186 L 371 206" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 446 186 L 421 206" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Level 1 merged results -->
  <rect x="148" y="208" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="227" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">5</text>
  <rect x="196" y="208" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="227" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">7</text>
  <text x="218" y="252" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">逆序 +1</text>

  <rect x="348" y="208" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="227" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4</text>
  <rect x="396" y="208" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="418" y="227" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">6</text>
  <text x="418" y="252" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">逆序 +1</text>

  <!-- ===== Merge back: Level 1 → Level 0 ===== -->
  <path d="M 218 256 L 268 276" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 418 256 L 368 276" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== Level 0 merge detail box ===== -->
  <text x="20" y="286" font-size="12" fill="#b85450" font-weight="bold">第 1→0 层合并：[5,7] 与 [4,6] 合并</text>

  <rect x="20" y="294" width="540" height="140" fill="#f6f6f6" stroke="#aaa" stroke-width="1.2" rx="8" filter="url(#rough2)"/>

  <!-- Left half [5,7] -->
  <text x="40" y="314" font-size="10" fill="#446688" font-weight="bold">左半</text>
  <rect x="40" y="320" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="58" y="337" text-anchor="middle" font-size="10" fill="#333">5</text>
  <rect x="80" y="320" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="98" y="337" text-anchor="middle" font-size="10" fill="#333">7</text>

  <!-- Right half [4,6] -->
  <text x="160" y="314" font-size="10" fill="#b85450" font-weight="bold">右半</text>
  <rect x="160" y="320" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="178" y="337" text-anchor="middle" font-size="10" fill="#333">4</text>
  <rect x="200" y="320" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="218" y="337" text-anchor="middle" font-size="10" fill="#333">6</text>

  <!-- tmp output -->
  <text x="290" y="314" font-size="10" fill="#4a7a3a" font-weight="bold">→ tmp</text>

  <!-- Step rows -->
  <text x="40" y="360" font-size="9" fill="#888" font-weight="bold">步骤</text>
  <text x="80" y="360" font-size="9" fill="#888" font-weight="bold">i→</text>
  <text x="160" y="360" font-size="9" fill="#888" font-weight="bold">j→</text>
  <text x="210" y="360" font-size="9" fill="#888" font-weight="bold">比较</text>
  <text x="280" y="360" font-size="9" fill="#888" font-weight="bold">取</text>
  <text x="320" y="360" font-size="9" fill="#888" font-weight="bold">逆序增量</text>
  <text x="400" y="360" font-size="9" fill="#888" font-weight="bold">tmp 状态</text>

  <!-- Step 1: i=5, j=4, 5>4, take right 4, count=2 -->
  <rect x="36" y="366" width="500" height="16" fill="#fce4ec" stroke="none" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="40" y="378" font-size="9" fill="#333">1</text>
  <text x="80" y="378" font-size="9" fill="#446688" font-weight="bold">5</text>
  <text x="160" y="378" font-size="9" fill="#b85450" font-weight="bold">4</text>
  <text x="210" y="378" font-size="9" fill="#333">5 &gt; 4</text>
  <text x="280" y="378" font-size="9" fill="#b85450">右 4</text>
  <text x="320" y="378" font-size="9" fill="#b85450" font-weight="bold">mid−i+1=2</text>
  <text x="400" y="378" font-size="9" fill="#4a7a3a">[4, _, _, _]</text>

  <!-- Step 2: i=5, j=6, 5<=6, take left 5, count=0 -->
  <rect x="36" y="384" width="500" height="16" fill="#e8f0fe" stroke="none" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="40" y="396" font-size="9" fill="#333">2</text>
  <text x="80" y="396" font-size="9" fill="#446688" font-weight="bold">5</text>
  <text x="160" y="396" font-size="9" fill="#b85450" font-weight="bold">6</text>
  <text x="210" y="396" font-size="9" fill="#333">5 ≤ 6</text>
  <text x="280" y="396" font-size="9" fill="#446688">左 5</text>
  <text x="320" y="396" font-size="9" fill="#888">0</text>
  <text x="400" y="396" font-size="9" fill="#4a7a3a">[4, 5, _, _]</text>

  <!-- Step 3: i=7, j=6, 7>6, take right 6, count=1 -->
  <rect x="36" y="402" width="500" height="16" fill="#fce4ec" stroke="none" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="40" y="414" font-size="9" fill="#333">3</text>
  <text x="80" y="414" font-size="9" fill="#446688" font-weight="bold">7</text>
  <text x="160" y="414" font-size="9" fill="#b85450" font-weight="bold">6</text>
  <text x="210" y="414" font-size="9" fill="#333">7 &gt; 6</text>
  <text x="280" y="414" font-size="9" fill="#b85450">右 6</text>
  <text x="320" y="414" font-size="9" fill="#b85450" font-weight="bold">mid−i+1=1</text>
  <text x="400" y="414" font-size="9" fill="#4a7a3a">[4, 5, 6, _]</text>

  <!-- Step 4: i=7, j=done, take left 7, count=0 -->
  <rect x="36" y="420" width="500" height="16" fill="#e8f0fe" stroke="none" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="40" y="432" font-size="9" fill="#333">4</text>
  <text x="80" y="432" font-size="9" fill="#446688" font-weight="bold">7</text>
  <text x="160" y="432" font-size="9" fill="#888">—</text>
  <text x="210" y="432" font-size="9" fill="#333">右空</text>
  <text x="280" y="432" font-size="9" fill="#446688">左 7</text>
  <text x="320" y="432" font-size="9" fill="#888">0</text>
  <text x="400" y="432" font-size="9" fill="#4a7a3a">[4, 5, 6, 7] ✓</text>

  <!-- ===== Final result ===== -->
  <rect x="100" y="448" width="380" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="470" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">总逆序对 = 1 + 1 + (2 + 0 + 1 + 0) = 5</text>
  <text x="290" y="488" text-anchor="middle" font-size="10" fill="#888">第2层: 1+1=2 ｜ 第1→0层合并: 3 ｜ 合计 5</text>

  <!-- ===== Bottom note ===== -->
  <text x="20" y="520" font-size="10" fill="#888">💡 每层合并时，逆序对在 O(n) 内批量统计（利用左半有序性）</text>
  <text x="20" y="538" font-size="10" fill="#888">⚠️ 逆序对 = 段内（递归统计）+ 跨段（合并统计），分治保证不重不漏</text>
</svg>
