<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：压缩后逐点判定</text>

  <!-- ===== Example 1 ===== -->
  <text x="40" y="52" font-size="12" fill="#446688" font-weight="bold">示例 1：nums = [2, 4, 1, 1, 6, 5]  →  ans = 3</text>

  <!-- original array: 6 boxes, 44 wide, 8 gap, x start 80 -->
  <g font-size="11">
    <rect x="80" y="60" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="102" y="79" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="132" y="60" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="154" y="79" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <rect x="184" y="60" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="206" y="79" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="236" y="60" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="258" y="79" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="288" y="60" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="310" y="79" text-anchor="middle" fill="#446688" font-weight="bold">6</text>
    <rect x="340" y="60" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="362" y="79" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
  </g>

  <!-- arrow + label -->
  <path d="M 232 94 L 232 108" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="246" y="104" font-size="9" fill="#666">合并相邻相等</text>

  <!-- compressed array: 5 boxes -->
  <g font-size="11">
    <rect x="92" y="112" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="114" y="131" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="144" y="112" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="166" y="131" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <rect x="196" y="112" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="218" y="131" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="248" y="112" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="270" y="131" text-anchor="middle" fill="#b85450" font-weight="bold">6</text>
    <rect x="300" y="112" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="322" y="131" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
  </g>

  <!-- table header: x 80,120,180,250,320,420 | w 40,60,70,70,100,60 -->
  <g font-size="10" fill="#666">
    <rect x="80" y="150" width="40" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="100" y="164" text-anchor="middle" font-weight="bold">i</text>
    <rect x="120" y="150" width="60" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="150" y="164" text-anchor="middle" font-weight="bold">a[i]</text>
    <rect x="180" y="150" width="70" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="215" y="164" text-anchor="middle" font-weight="bold">左邻居</text>
    <rect x="250" y="150" width="70" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="285" y="164" text-anchor="middle" font-weight="bold">右邻居</text>
    <rect x="320" y="150" width="100" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="370" y="164" text-anchor="middle" font-weight="bold">判定</text>
    <rect x="420" y="150" width="60" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="450" y="164" text-anchor="middle" font-weight="bold">ans</text>
  </g>

  <g font-size="11">
    <!-- row i=1: a[1]=4, left=2, right=1, hill -->
    <rect x="80" y="172" width="40" height="22" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="100" y="187" text-anchor="middle" fill="#446688">1</text>
    <rect x="120" y="172" width="60" height="22" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="150" y="187" text-anchor="middle" fill="#446688">4</text>
    <rect x="180" y="172" width="70" height="22" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="215" y="187" text-anchor="middle" fill="#446688">2</text>
    <rect x="250" y="172" width="70" height="22" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="285" y="187" text-anchor="middle" fill="#446688">1</text>
    <rect x="320" y="172" width="100" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="370" y="187" text-anchor="middle" fill="#b85450" font-weight="bold">峰 ✓</text>
    <rect x="420" y="172" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="450" y="187" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>

    <!-- row i=2: a[2]=1, left=4, right=6, valley -->
    <rect x="80" y="196" width="40" height="22" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="100" y="211" text-anchor="middle" fill="#446688">2</text>
    <rect x="120" y="196" width="60" height="22" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="150" y="211" text-anchor="middle" fill="#446688">1</text>
    <rect x="180" y="196" width="70" height="22" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="215" y="211" text-anchor="middle" fill="#446688">4</text>
    <rect x="250" y="196" width="70" height="22" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="285" y="211" text-anchor="middle" fill="#446688">6</text>
    <rect x="320" y="196" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="370" y="211" text-anchor="middle" fill="#4a7a3a" font-weight="bold">谷 ✓</text>
    <rect x="420" y="196" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="450" y="211" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>

    <!-- row i=3: a[3]=6, left=1, right=5, hill -->
    <rect x="80" y="220" width="40" height="22" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="100" y="235" text-anchor="middle" fill="#446688">3</text>
    <rect x="120" y="220" width="60" height="22" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="150" y="235" text-anchor="middle" fill="#446688">6</text>
    <rect x="180" y="220" width="70" height="22" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="215" y="235" text-anchor="middle" fill="#446688">1</text>
    <rect x="250" y="220" width="70" height="22" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="285" y="235" text-anchor="middle" fill="#446688">5</text>
    <rect x="320" y="220" width="100" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="370" y="235" text-anchor="middle" fill="#b85450" font-weight="bold">峰 ✓</text>
    <rect x="420" y="220" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="450" y="235" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
  </g>

  <!-- ===== Example 2 ===== -->
  <text x="40" y="276" font-size="12" fill="#446688" font-weight="bold">示例 2：nums = [6, 6, 5, 5, 4, 1]  →  ans = 0</text>

  <g font-size="11">
    <rect x="80" y="284" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="102" y="303" text-anchor="middle" fill="#d6a040" font-weight="bold">6</text>
    <rect x="132" y="284" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="154" y="303" text-anchor="middle" fill="#d6a040" font-weight="bold">6</text>
    <rect x="184" y="284" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="206" y="303" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
    <rect x="236" y="284" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="258" y="303" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
    <rect x="288" y="284" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="310" y="303" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <rect x="340" y="284" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="362" y="303" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
  </g>

  <path d="M 232 318 L 232 332" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="246" y="328" font-size="9" fill="#666">合并相邻相等</text>

  <!-- compressed: [6, 5, 4, 1] -->
  <g font-size="11">
    <rect x="100" y="336" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="122" y="355" text-anchor="middle" fill="#446688" font-weight="bold">6</text>
    <rect x="152" y="336" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="174" y="355" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
    <rect x="204" y="336" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="226" y="355" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <rect x="256" y="336" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="278" y="355" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
  </g>

  <!-- table header -->
  <g font-size="10" fill="#666">
    <rect x="80" y="374" width="40" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="100" y="388" text-anchor="middle" font-weight="bold">i</text>
    <rect x="120" y="374" width="60" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="150" y="388" text-anchor="middle" font-weight="bold">a[i]</text>
    <rect x="180" y="374" width="70" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="215" y="388" text-anchor="middle" font-weight="bold">左邻居</text>
    <rect x="250" y="374" width="70" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="285" y="388" text-anchor="middle" font-weight="bold">右邻居</text>
    <rect x="320" y="374" width="100" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="370" y="388" text-anchor="middle" font-weight="bold">判定</text>
    <rect x="420" y="374" width="60" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="450" y="388" text-anchor="middle" font-weight="bold">ans</text>
  </g>

  <g font-size="11">
    <!-- row i=1: a[1]=5, left=6, right=4, neither (5<6 but 5>4) -->
    <rect x="80" y="396" width="40" height="22" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="100" y="411" text-anchor="middle" fill="#446688">1</text>
    <rect x="120" y="396" width="60" height="22" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="150" y="411" text-anchor="middle" fill="#446688">5</text>
    <rect x="180" y="396" width="70" height="22" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="215" y="411" text-anchor="middle" fill="#446688">6</text>
    <rect x="250" y="396" width="70" height="22" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="285" y="411" text-anchor="middle" fill="#446688">4</text>
    <rect x="320" y="396" width="100" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="370" y="411" text-anchor="middle" fill="#888">非峰非谷</text>
    <rect x="420" y="396" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="450" y="411" text-anchor="middle" fill="#d6a040" font-weight="bold">0</text>

    <!-- row i=2: a[2]=4, left=5, right=1, neither (4<5 but 4>1) -->
    <rect x="80" y="420" width="40" height="22" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="100" y="435" text-anchor="middle" fill="#446688">2</text>
    <rect x="120" y="420" width="60" height="22" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="150" y="435" text-anchor="middle" fill="#446688">4</text>
    <rect x="180" y="420" width="70" height="22" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="215" y="435" text-anchor="middle" fill="#446688">5</text>
    <rect x="250" y="420" width="70" height="22" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="285" y="435" text-anchor="middle" fill="#446688">1</text>
    <rect x="320" y="420" width="100" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="370" y="435" text-anchor="middle" fill="#888">非峰非谷</text>
    <rect x="420" y="420" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="450" y="435" text-anchor="middle" fill="#d6a040" font-weight="bold">0</text>
  </g>

  <rect x="40" y="450" width="460" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="50" y="465" font-size="10" fill="#555">压缩后 [6,5,4,1] 单调递减 → 无拐点 → 每个内部下标既非峰也非谷</text>
</svg>
