<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="34" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">两种操作的本质</text>

  <!-- ========== 操作 1：任意重排 ========== -->
  <text x="40" y="78" font-size="14" fill="#446688" filter="url(#rough2)">操作 1：交换任意两个现有字符</text>
  <text x="40" y="96" font-size="11" fill="#666" filter="url(#rough2)">→ 字符位置随意重排，频次不变</text>

  <!-- before -->
  <rect x="40" y="112" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="134" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="72" y="112" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="87" y="134" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="104" y="112" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="119" y="134" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="136" y="112" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="151" y="134" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>
  <rect x="168" y="112" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="183" y="134" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">e</text>

  <!-- arrow -->
  <line x1="210" y1="128" x2="266" y2="128" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="238" y="120" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">换 b,e</text>

  <!-- after -->
  <rect x="278" y="112" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="293" y="134" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="310" y="112" width="30" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="134" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">e</text>
  <rect x="342" y="112" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="357" y="134" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="374" y="112" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="389" y="134" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>
  <rect x="406" y="112" width="30" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="421" y="134" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>

  <text x="460" y="134" font-size="11" fill="#4a7a3a" filter="url(#rough2)">abcde → aecdb</text>

  <!-- ========== 操作 2：频次互换 ========== -->
  <text x="40" y="186" font-size="14" fill="#b85450" filter="url(#rough2)">操作 2：两个现有字符的频次整体互换</text>
  <text x="40" y="204" font-size="11" fill="#666" filter="url(#rough2)">→ 只在「已有字符」之间换，不能凭空造/灭字符</text>

  <!-- before: aacabb  a=3,b=2,c=1 -->
  <rect x="40" y="220" width="30" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="242" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="72" y="220" width="30" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="87" y="242" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="104" y="220" width="30" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="119" y="242" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="136" y="220" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="151" y="242" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="168" y="220" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="183" y="242" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="200" y="220" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="242" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>

  <line x1="248" y1="236" x2="304" y2="236" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="228" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">a↔b</text>

  <!-- after: bbcbaa  b=3,a=2,c=1 -->
  <rect x="316" y="220" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="331" y="242" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="348" y="220" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="363" y="242" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="380" y="220" width="30" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="242" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="412" y="220" width="30" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="427" y="242" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="444" y="220" width="30" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="459" y="242" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="476" y="220" width="30" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="491" y="242" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>

  <!-- 频次对比小表 -->
  <text x="40" y="282" font-size="11" fill="#666" filter="url(#rough2)">操作前频次：</text>
  <rect x="120" y="270" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="140" y="286" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a:3</text>
  <rect x="166" y="270" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="186" y="286" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b:2</text>
  <rect x="212" y="270" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="232" y="286" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c:1</text>

  <text x="40" y="316" font-size="11" fill="#666" filter="url(#rough2)">操作后频次：</text>
  <rect x="120" y="304" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="140" y="320" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a:2</text>
  <rect x="166" y="304" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="186" y="320" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b:3</text>
  <rect x="212" y="304" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="232" y="320" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c:1</text>

  <rect x="290" y="298" width="230" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="405" y="320" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a,b 的频次 3↔2 互换，c 不动</text>

  <!-- 底部结论 -->
  <rect x="60" y="352" width="440" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">操作1=位置任意排列 ｜ 操作2=频次在已有字符间任意排列</text>
</svg>
