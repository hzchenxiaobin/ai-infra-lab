<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：三种实现路径</text>

  <!-- Step 1: extend prototype -->
  <rect x="140" y="42" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="67" text-anchor="middle" font-size="12" fill="#333">Function.prototype.bindPolyfill = function(obj)</text>
  <path d="M 260 82 L 260 100" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: diamond - which approach? -->
  <polygon points="260,104 360,150 260,196 160,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="146" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">选择实现方式</text>
  <text x="260" y="162" text-anchor="middle" font-size="10" fill="#888">能否用 call/apply?</text>

  <!-- Path A: use apply (left) -->
  <path d="M 160 150 L 80 150" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="120" y="144" text-anchor="middle" font-size="10" fill="#4a7a3a">可以</text>
  <rect x="20" y="130" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="50" y="148" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">方式 A</text>
  <text x="50" y="162" text-anchor="middle" font-size="9" fill="#555">apply</text>

  <!-- Path B: use call (center down) -->
  <path d="M 260 196 L 260 216" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="210" font-size="10" fill="#4a7a3a">推荐</text>
  <rect x="160" y="220" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="241" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">方式 B：call</text>
  <text x="260" y="257" text-anchor="middle" font-size="10" fill="#555">(...args) =&gt; this.call(obj, ...args)</text>

  <!-- Path C: symbol (right) -->
  <path d="M 360 150 L 420 150" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="390" y="144" text-anchor="middle" font-size="10" fill="#b85450">不用</text>
  <rect x="420" y="130" width="80" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="460" y="148" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">方式 C</text>
  <text x="460" y="162" text-anchor="middle" font-size="9" fill="#555">Symbol</text>
  <text x="460" y="176" text-anchor="middle" font-size="9" fill="#555">无内置方法</text>

  <!-- Common: return arrow function -->
  <path d="M 50 170 L 50 290 L 200 290" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="3,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 260 264 L 260 290" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 460 186 L 460 290 L 320 290" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Return box -->
  <rect x="140" y="300" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="321" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回新函数（闭包）</text>
  <text x="260" y="337" text-anchor="middle" font-size="10" fill="#888">this 已永久绑定到 obj</text>

  <!-- Summary -->
  <rect x="80" y="362" width="360" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="380" text-anchor="middle" font-size="10" fill="#555">A/B 用 call/apply 最简；C 用 Symbol 借壳调用，无依赖内置方法</text>
</svg>
