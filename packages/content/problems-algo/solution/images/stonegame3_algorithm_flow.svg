<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：从右向左填 dp（依赖在右）</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888">dp[i] 只依赖 dp[i+1]、dp[i+2]、dp[i+3]，故从 n 往 0 逆序填充</text>

  <!-- dp array row, indices 0..4 (n=4) -->
  <g font-size="14">
    <rect x="80" y="80" width="80" height="44" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <text x="120" y="108" text-anchor="middle" fill="#999" font-weight="bold">dp[0]</text>
    <rect x="164" y="80" width="80" height="44" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <text x="204" y="108" text-anchor="middle" fill="#999" font-weight="bold">dp[1]</text>
    <rect x="248" y="80" width="80" height="44" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <text x="288" y="108" text-anchor="middle" fill="#999" font-weight="bold">dp[2]</text>
    <rect x="332" y="80" width="80" height="44" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <text x="372" y="108" text-anchor="middle" fill="#999" font-weight="bold">dp[3]</text>
    <rect x="416" y="80" width="80" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="456" y="108" text-anchor="middle" fill="#4a7a3a" font-weight="bold">dp[4]=0</text>
  </g>
  <text x="456" y="74" text-anchor="middle" font-size="9" fill="#4a7a3a">基准（无石子）</text>

  <!-- fill direction arrow (right to left) -->
  <path d="M 440 140 L 100 140" stroke="#d6a040" stroke-width="2.2" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <text x="270" y="156" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">填充方向：i = n−1 → 0</text>

  <!-- decision diamond + branches for a generic i -->
  <text x="320" y="186" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">对每个 i，计算 3 个候选并取 max：</text>

  <!-- candidate k=1 -->
  <rect x="50" y="200" width="170" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="66" y="220" font-size="12" fill="#4a7a3a" font-weight="bold">k = 1</text>
  <text x="66" y="240" font-size="11" fill="#555">拿 values[i]</text>
  <text x="66" y="258" font-size="12" fill="#4a7a3a" font-weight="bold">c₁ = v[i] − dp[i+1]</text>

  <!-- candidate k=2 -->
  <rect x="235" y="200" width="170" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="251" y="220" font-size="12" fill="#d6a040" font-weight="bold">k = 2</text>
  <text x="251" y="240" font-size="11" fill="#555">拿 v[i]+v[i+1]</text>
  <text x="251" y="258" font-size="12" fill="#d6a040" font-weight="bold">c₂ = v[i]+v[i+1] − dp[i+2]</text>

  <!-- candidate k=3 -->
  <rect x="420" y="200" width="170" height="70" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="436" y="220" font-size="12" fill="#b85450" font-weight="bold">k = 3</text>
  <text x="436" y="240" font-size="11" fill="#555">拿 v[i]+v[i+1]+v[i+2]</text>
  <text x="436" y="258" font-size="12" fill="#b85450" font-weight="bold">c₃ = Σ₃ − dp[i+3]</text>

  <!-- arrows from candidates down to max -->
  <path d="M 135 272 L 300 296" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 320 272 L 320 296" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 505 272 L 340 296" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- max box -->
  <rect x="190" y="298" width="260" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="328" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">dp[i] = max(c₁, c₂, c₃)</text>

  <!-- dependency note -->
  <rect x="40" y="362" width="560" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="384" font-size="12" fill="#d6a040" font-weight="bold">⚠️ 边界与依赖</text>
  <text x="60" y="402" font-size="11" fill="#666">dp[n] = dp[n+1] = dp[n+2] = 0（哨兵：越界即无石子可拿，净赚 0）</text>
  <text x="60" y="418" font-size="11" fill="#666">因 dp[i] 只看右侧 3 格，逆序填充保证依赖已就绪；空间可滚动至 O(1)（仅留 4 个变量）</text>
</svg>
