<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fdfcf7"/>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算</text>
  <path d="M 320 38 Q 380 46 440 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ Example 1: 3x4 grid + path ============ -->
  <text x="120" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">示例1　grid 3×4，L = 6，T = 3</text>
  <g filter="url(#sk)">
    <rect x="40" y="70" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="80" y="70" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="120" y="70" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="160" y="70" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="40" y="110" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="80" y="110" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="120" y="110" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="160" y="110" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="40" y="150" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="80" y="150" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="120" y="150" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="160" y="150" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <!-- path cells green P=(0,0)(0,1)(1,1)(2,1)(2,2)(2,3) -->
  <g filter="url(#sk)">
    <rect x="40" y="70" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="80" y="70" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="80" y="110" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="80" y="150" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="120" y="150" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="160" y="150" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <path d="M 60 90 L 100 90 L 100 170 L 140 170 L 180 170" stroke="#4a7a3a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" filter="url(#sk)"/>
  <g font-size="15" font-weight="bold" text-anchor="middle" filter="url(#sk)">
    <text x="60" y="95" fill="#2e6e2e">0</text>
    <text x="100" y="95" fill="#2e6e2e">1</text>
    <text x="140" y="95" fill="#2b4a66">0</text>
    <text x="180" y="95" fill="#2b4a66">0</text>
    <text x="60" y="135" fill="#2b4a66">0</text>
    <text x="100" y="135" fill="#2e6e2e">1</text>
    <text x="140" y="135" fill="#2b4a66">0</text>
    <text x="180" y="135" fill="#2b4a66">0</text>
    <text x="60" y="175" fill="#2b4a66">1</text>
    <text x="100" y="175" fill="#2e6e2e">0</text>
    <text x="140" y="175" fill="#2e6e2e">1</text>
    <text x="180" y="175" fill="#2e6e2e">0</text>
  </g>
  <text x="120" y="210" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">路径 0,1,1,0,1,0 → 3 个 0 / 3 个 1</text>

  <!-- ex1 interval on right -->
  <text x="500" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">可达 0 数区间 [3, 5]，T = 3 落入</text>
  <line x1="270" y1="150" x2="730" y2="150" stroke="#5a5a5a" stroke-width="1.8" filter="url(#sk)"/>
  <g stroke="#5a5a5a" stroke-width="1.3" filter="url(#sk)">
    <line x1="270" y1="144" x2="270" y2="156"/>
    <line x1="347" y1="144" x2="347" y2="156"/>
    <line x1="424" y1="144" x2="424" y2="156"/>
    <line x1="501" y1="144" x2="501" y2="156"/>
    <line x1="578" y1="144" x2="578" y2="156"/>
    <line x1="655" y1="144" x2="655" y2="156"/>
    <line x1="730" y1="144" x2="730" y2="156"/>
  </g>
  <g font-size="11" fill="#888" text-anchor="middle" filter="url(#sk)">
    <text x="270" y="172">0</text>
    <text x="347" y="172">1</text>
    <text x="424" y="172">2</text>
    <text x="501" y="172">3</text>
    <text x="578" y="172">4</text>
    <text x="655" y="172">5</text>
    <text x="730" y="172">6</text>
  </g>
  <g filter="url(#sk)">
    <rect x="501" y="142" width="154" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <circle cx="501" cy="150" r="6.5" fill="#fff3d6" stroke="#d6a040" stroke-width="2.2" filter="url(#sk)"/>
  <text x="501" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#sk)">T=3</text>
  <g filter="url(#sk)">
    <rect x="380" y="190" width="240" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="500" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">min0 ≤ T ≤ max0 ⇒ true</text>

  <!-- ============ Example 2: 3x3 grid ============ -->
  <text x="100" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">示例2　grid 3×3，L = 5</text>
  <g filter="url(#sk)">
    <rect x="40" y="250" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="80" y="250" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="120" y="250" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="40" y="290" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="80" y="290" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="120" y="290" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="40" y="330" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="80" y="330" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="120" y="330" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle" filter="url(#sk)">
    <text x="60" y="275" fill="#2b4a66">1</text>
    <text x="100" y="275" fill="#2b4a66">1</text>
    <text x="140" y="275" fill="#2b4a66">0</text>
    <text x="60" y="315" fill="#2b4a66">0</text>
    <text x="100" y="315" fill="#2b4a66">0</text>
    <text x="140" y="315" fill="#2b4a66">1</text>
    <text x="60" y="355" fill="#2b4a66">1</text>
    <text x="100" y="355" fill="#2b4a66">0</text>
    <text x="140" y="355" fill="#2b4a66">0</text>
  </g>

  <!-- ex2 reasoning -->
  <g filter="url(#sk)">
    <rect x="210" y="250" width="410" height="120" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3"/>
  </g>
  <text x="230" y="278" font-size="13" font-weight="bold" fill="#7a2a26" filter="url(#sk)">每条单调路径长度恒为 L = m + n − 1 = 3 + 3 − 1 = 5</text>
  <text x="230" y="302" font-size="13" fill="#7a2a26" filter="url(#sk)">5 为奇数：0 数 + 1 数 = 5，无法对半均分</text>
  <text x="230" y="326" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">⇒ 直接 return false，无需任何搜索 / DP</text>
  <text x="230" y="350" font-size="11" fill="#7a5415" filter="url(#sk)">（区间 [2,4] 虽覆盖该网格，但 T = 2.5 非整数，根本不存在等分路径）</text>

  <text x="380" y="410" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">规律：先看 L 奇偶一票否决；L 偶时只需求 min/max 0 数，看 T 是否落入区间</text>
</svg>
