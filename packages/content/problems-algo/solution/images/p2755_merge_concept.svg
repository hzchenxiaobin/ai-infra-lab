<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">深度合并三准则</text>
  <text x="270" y="52" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">类型配对决定合并动作，否则 obj2 优先</text>

  <!-- Col 1: arrays -->
  <rect x="20" y="66" width="158" height="312" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="99" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#224466" filter="url(#rough2)">① 都是数组</text>
  <line x1="34" y1="100" x2="164" y2="100" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="99" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">按下标逐位合并</text>
  <text x="99" y="138" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">下标重叠→递归</text>
  <text x="99" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">单边→照收</text>

  <text x="99" y="184" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">例</text>
  <text x="99" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,[2]]</text>
  <text x="99" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⊕ [3,[4]]</text>
  <path d="M99 224 L99 244" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="99" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">[3,[4,2]]</text>
  <text x="99" y="286" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">idx0: 1∨3→3</text>
  <text x="99" y="298" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">idx1: [2]∨[4]→[4,2]</text>
  <text x="99" y="330" text-anchor="middle" font-size="9" fill="#888" font-style="italic" filter="url(#rough2)">新数组，长度取 max</text>

  <!-- Col 2: plain objects -->
  <rect x="191" y="66" width="158" height="312" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#244a22" filter="url(#rough2)">② 都是普通对象</text>
  <line x1="205" y1="100" x2="335" y2="100" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="270" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">按键合并</text>
  <text x="270" y="138" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">重叠键→递归</text>
  <text x="270" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">单边→照收</text>

  <text x="270" y="184" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">例</text>
  <text x="270" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{a:1,c:3}</text>
  <text x="270" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⊕ {a:2,b:2}</text>
  <path d="M270 224 L270 244" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">{a:2,b:2,c:3}</text>
  <text x="270" y="286" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">a: 1∨2→2</text>
  <text x="270" y="298" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">b 单 obj2, c 单 obj1</text>
  <text x="270" y="330" text-anchor="middle" font-size="9" fill="#888" font-style="italic" filter="url(#rough2)">新对象，并集键</text>

  <!-- Col 3: fallback -->
  <rect x="362" y="66" width="158" height="312" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="441" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#6a4a10" filter="url(#rough2)">③ 其余</text>
  <line x1="376" y1="100" x2="506" y2="100" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="441" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">类型不一致</text>
  <text x="441" y="138" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">或双方皆原始</text>
  <text x="441" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">→ 返回 obj2</text>

  <text x="441" y="184" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">例</text>
  <text x="441" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">true</text>
  <text x="441" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⊕ null</text>
  <path d="M441 224 L441 244" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="441" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">null</text>
  <text x="441" y="286" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">原始类型不递归</text>
  <text x="441" y="298" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">null 也算原始</text>
  <text x="441" y="330" text-anchor="middle" font-size="9" fill="#888" font-style="italic" filter="url(#rough2)">obj2 永远优先</text>

  <text x="270" y="392" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">⊕ = 深度合并　∨ = 两值在该位的取舍</text>
</svg>
