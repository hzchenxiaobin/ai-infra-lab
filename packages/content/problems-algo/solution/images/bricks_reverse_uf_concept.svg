<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="410" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">正向删除难 vs 逆向添加易</text>

  <!-- ===== Top: forward deletion is hard ===== -->
  <rect x="20" y="38" width="500" height="150" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="270" y="58" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">正向模拟：删一块 → 判断哪些砖掉落 → 再删下一块</text>

  <!-- grid: 2 rows x 4 cols, show a brick being deleted and chain falling -->
  <!-- row 0 -->
  <rect x="60" y="78" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="76" y="99" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="94" y="78" width="32" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="128" y="78" width="32" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="162" y="78" width="32" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <!-- row 1: hit brick (red X), then two falling bricks -->
  <rect x="60" y="112" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="76" y="133" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">X</text>
  <rect x="94" y="112" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="110" y="133" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">!</text>
  <rect x="128" y="112" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="144" y="133" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">!</text>
  <rect x="162" y="112" width="32" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <!-- falling arrows -->
  <line x1="110" y1="148" x2="110" y2="168" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="144" y1="148" x2="144" y2="168" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="270" y="172" text-anchor="middle" font-size="10.5" fill="#b85450">并查集只会 merge 不会 split → 正向删边无法维护连通性</text>

  <!-- arrow down: reverse -->
  <line x1="270" y1="192" x2="270" y2="218" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="210" font-size="11" fill="#4a7a3a" font-weight="bold">逆向</text>

  <!-- ===== Bottom: reverse addition is easy ===== -->
  <rect x="20" y="222" width="500" height="172" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="270" y="242" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">逆向并查集：先删全部 → 从后往前补砖 → union 合并</text>

  <!-- roof node -->
  <ellipse cx="76" cy="266" rx="26" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="76" y="271" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">roof</text>

  <!-- grid after all hits: only top-left brick -->
  <rect x="120" y="252" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="134" y="271" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="150" y="252" width="28" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="178" y="252" width="28" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="206" y="252" width="28" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <rect x="120" y="282" width="28" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="150" y="282" width="28" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="178" y="282" width="28" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="206" y="282" width="28" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <!-- roof connected to (0,0) -->
  <line x1="102" y1="266" x2="120" y2="266" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <!-- step labels -->
  <text x="245" y="268" font-size="10" fill="#666">① 先删全部 hit</text>
  <text x="245" y="282" font-size="10" fill="#666">② 建并查集</text>
  <text x="245" y="296" font-size="10" fill="#666">③ 逆序补砖 + union</text>

  <!-- restore brick arrow -->
  <rect x="120" y="282" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="134" y="301" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>

  <line x1="134" y1="282" x2="134" y2="262" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="148" y1="296" x2="178" y2="296" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- restored neighbors -->
  <rect x="150" y="282" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="178" y="282" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="164" y="301" text-anchor="middle" font-size="9" fill="#4a7a3a">+2</text>
  <text x="192" y="301" text-anchor="middle" font-size="9" fill="#4a7a3a">+3</text>

  <!-- formula box -->
  <rect x="30" y="332" width="480" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="352" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">掉落数 = 补砖后 roof 连通块大小 − 补砖前 roof 连通块大小 − 1</text>
  <text x="270" y="370" text-anchor="middle" font-size="10.5" fill="#888">result[i] = max(0, after − before − 1)　　（−1 = 被敲的砖本身）</text>
</svg>
