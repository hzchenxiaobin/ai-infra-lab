<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="460" fill="#fafafa"/>
  <text x="230" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">负数标记法流程：打标记 → 收集</text>

  <!-- Phase 1 label -->
  <rect x="30" y="40" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="90" y="57" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">第一趟：打标记</text>

  <!-- init -->
  <rect x="110" y="72" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="92" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化 i = 0</text>
  <text x="230" y="108" text-anchor="middle" font-size="10.5" fill="#555">n = len(nums)</text>

  <path d="M 230 116 L 230 132" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- loop check diamond -->
  <polygon points="230,136 340,176 230,216 120,176" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i &lt; n ?</text>
  <text x="230" y="190" text-anchor="middle" font-size="10.5" fill="#777">还有元素？</text>

  <!-- No -> phase 2 -->
  <path d="M 340 176 L 410 176 L 410 300" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="358" y="168" font-size="11" fill="#b85450" font-weight="bold">No</text>

  <!-- Yes down -->
  <path d="M 230 216 L 230 238" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="248" y="232" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- action box -->
  <rect x="70" y="242" width="320" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="264" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">v = |nums[i]|</text>
  <text x="230" y="284" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">if nums[v−1] &gt; 0:</text>
  <text x="230" y="302" text-anchor="middle" font-size="11.5" fill="#d6a040">　　nums[v−1] = −nums[v−1]</text>

  <!-- i += 1 -->
  <path d="M 230 312 L 230 328" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <rect x="170" y="330" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="352" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">i += 1</text>

  <!-- loop back -->
  <path d="M 170 347 L 60 347 L 60 176 L 120 176" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="64" y="262" font-size="9.5" fill="#888">回到循环顶</text>

  <!-- Phase 2 label -->
  <rect x="300" y="300" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>

  <!-- scan phase -->
  <rect x="250" y="380" width="200" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="350" y="400" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">第二趟：收集结果</text>
  <text x="350" y="418" text-anchor="middle" font-size="10.5" fill="#555">nums[i] &gt; 0 → i+1 缺失</text>
  <text x="350" y="434" text-anchor="middle" font-size="10.5" fill="#555">加入返回列表</text>

  <path d="M 410 300 L 410 380" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowD)" filter="url(#rough2)"/>
</svg>
