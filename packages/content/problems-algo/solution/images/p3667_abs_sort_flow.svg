<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：以 ( |x| , x ) 为键的比较排序</text>

  <!-- 开始 -->
  <rect x="160" y="36" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">开始：读入 nums</text>

  <path d="M 260 70 L 260 82" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 比较器 -->
  <rect x="130" y="86" width="260" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="109" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">定义比较器 cmp(a, b)：双键</text>

  <path d="M 260 122 L 260 136" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="260,140 342,176 260,212 178,176" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="181" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">|a| = |b| ?</text>

  <path d="M 178 176 L 160 176" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="168" y="166" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <path d="M 342 176 L 360 176" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="166" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>

  <!-- 左分支 -->
  <rect x="28" y="156" width="132" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="94" y="173" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">主键：绝对值</text>
  <text x="94" y="189" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 |a| &lt; |b|</text>

  <!-- 右分支 -->
  <rect x="360" y="156" width="132" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="426" y="173" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">次键：数值（负在前）</text>
  <text x="426" y="189" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 a &lt; b</text>

  <path d="M 94 196 L 94 230" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 426 196 L 426 230" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 排序 -->
  <rect x="60" y="236" width="400" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="259" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">比较排序：sort / sorted，O(n log n)</text>

  <path d="M 260 272 L 260 284" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <rect x="130" y="288" width="260" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="311" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回 [-1, 1, 3, -4, 5]</text>

  <!-- 进阶注记 -->
  <rect x="46" y="334" width="428" height="20" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">进阶：若 nums 已按值升序，双指针两端归并可降到 O(n)（见题解第 5 节）</text>
</svg>
