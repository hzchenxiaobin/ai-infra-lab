<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">核心观察：维护「可达区间右端点 miss」</text>
  <text x="270" y="42" text-anchor="middle" font-size="11" fill="#888">[1, miss−1] = 子集和已能覆盖的连续区间；miss = 当前最小缺失值</text>

  <!-- ============ Case A ============ -->
  <rect x="20" y="58" width="500" height="148" fill="#e6f4ea" fill-opacity="0.35" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="36" y="80" font-size="12.5" fill="#4a7a3a" font-weight="bold">情形 A：nums[i] ≤ miss → 吸收 nums[i]，miss ← miss + nums[i]</text>

  <!-- before row -->
  <text x="36" y="110" font-size="10.5" fill="#777">覆盖前</text>
  <rect x="80" y="98" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="150" y="114" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">[1, miss−1]</text>
  <circle cx="232" cy="110" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="246" y="114" font-size="10.5" fill="#d6a040" font-weight="bold">miss</text>
  <text x="296" y="114" font-size="10.5" fill="#555">nums[i] ≤ miss（落在覆盖内或恰为 miss）</text>

  <!-- arrow down -->
  <path d="M 150 128 L 150 150" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="160" y="144" font-size="10" fill="#4a7a3a" font-weight="bold">+ nums[i]</text>

  <!-- after row -->
  <text x="36" y="178" font-size="10.5" fill="#777">覆盖后</text>
  <rect x="80" y="166" width="260" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="182" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">[1, miss + nums[i] − 1]</text>
  <text x="352" y="182" font-size="10" fill="#82b366" font-style="italic">覆盖向右扩展 nums[i]</text>

  <!-- ============ Case B ============ -->
  <rect x="20" y="220" width="500" height="170" fill="#fce4ec" fill-opacity="0.35" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="36" y="242" font-size="12.5" fill="#b85450" font-weight="bold">情形 B：nums[i] &gt; miss → 出现缺口，补 miss 使覆盖翻倍</text>

  <!-- before row -->
  <text x="36" y="272" font-size="10.5" fill="#777">覆盖前</text>
  <rect x="80" y="260" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="150" y="276" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">[1, miss−1]</text>
  <!-- gap -->
  <rect x="226" y="260" width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="238" y="276" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">缺</text>
  <text x="238" y="298" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">miss</text>
  <!-- nums[i] far right -->
  <rect x="380" y="260" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="408" y="276" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">nums[i]</text>
  <text x="300" y="298" font-size="10" fill="#b85450" font-style="italic">nums[i] 越过 miss，中间断开</text>

  <!-- arrow down -->
  <path d="M 150 296 L 150 318" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="160" y="312" font-size="10" fill="#b85450" font-weight="bold">补 miss,  patches++</text>

  <!-- after row -->
  <text x="36" y="346" font-size="10.5" fill="#777">覆盖后</text>
  <rect x="80" y="334" width="300" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="350" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">[1, 2·miss − 1]</text>
  <text x="392" y="350" font-size="10" fill="#82b366" font-style="italic">覆盖翻倍，再回头判 nums[i]</text>

  <text x="270" y="380" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">关键：补 miss 使新区间 [miss, 2·miss−1] 恰接在 [1, miss−1] 之后，无空隙</text>
</svg>
