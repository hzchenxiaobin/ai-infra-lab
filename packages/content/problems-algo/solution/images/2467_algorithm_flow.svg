<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：四步走，全部 O(n)</text>

  <!-- Step 1 -->
  <g filter="url(#rough2)">
    <rect x="40" y="50" width="440" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="56" y="74" font-size="13" fill="#446688" font-weight="bold">① 建图 + 以 0 为根 BFS</text>
    <text x="56" y="94" font-size="12" fill="#333">邻接表 g[][]；求得 parent[u] 与 depth[u]（= Alice 到达时刻）</text>
  </g>
  <path d="M260,108 L260,128" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <g filter="url(#rough2)">
    <rect x="40" y="128" width="440" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="56" y="152" font-size="13" fill="#d6a040" font-weight="bold">② 追溯 Bob 回 0 的唯一路径</text>
    <text x="56" y="172" font-size="12" fill="#333">u=bob 沿 parent 上溯，bobTime[u]=距 bob 的步数；记入哈希表</text>
  </g>
  <path d="M260,186 L260,206" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <g filter="url(#rough2)">
    <rect x="40" y="206" width="440" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="56" y="230" font-size="13" fill="#4a7a3a" font-weight="bold">③ DFS 累加 Alice 路径得分</text>
    <text x="56" y="250" font-size="12" fill="#333">带 sum 入参；比 depth[u] 与 bobTime[u]：早=全额 / 等=半 / 晚=0 / 未在=全额</text>
  </g>
  <path d="M260,264 L260,284" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <g filter="url(#rough2)">
    <rect x="40" y="284" width="440" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="56" y="308" font-size="13" fill="#b85450" font-weight="bold">④ 叶子处取最大</text>
    <text x="56" y="328" font-size="12" fill="#333">u 为叶子（无子节点）时 ans = max(ans, sum)；返回 ans</text>
  </g>

  <!-- decision diamond: is leaf? -->
  <g filter="url(#rough2)">
    <path d="M490,313 L520,298 L550,313 L520,328 z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="520" y="317" text-anchor="middle" font-size="10" fill="#7a4a10">叶子?</text>
  </g>
  <text x="478" y="352" font-size="10" fill="#b85450" filter="url(#rough2)">是→更新 ans</text>

  <!-- note -->
  <g filter="url(#rough2)">
    <rect x="40" y="368" width="440" height="54" rx="8" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="56" y="390" font-size="12" fill="#555">关键：Bob 路径唯一（树中两点路径唯一），无需</text>
    <text x="56" y="408" font-size="12" fill="#555">搜索 Bob 的选择；只搜 Alice 的叶向路径取 max</text>
  </g>
</svg>
