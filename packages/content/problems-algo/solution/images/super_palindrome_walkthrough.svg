<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：left="4", right="1000"</text>

  <text x="40" y="56" font-size="12" fill="#888" font-weight="bold">第 1 步：单数字根 y = 1..9</text>

  <rect x="40" y="66" width="480" height="62" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>

  <text x="55" y="86" font-size="10" fill="#888">y</text>
  <text x="55" y="104" font-size="10" fill="#888">y²</text>
  <text x="55" y="120" font-size="9" fill="#888">回文?</text>

  <text x="90" y="86" font-size="10" fill="#333" font-weight="bold">1</text>
  <text x="90" y="104" font-size="10" fill="#333">1</text>
  <text x="90" y="120" font-size="9" fill="#b85450">✗&lt;4</text>

  <text x="140" y="86" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="140" y="104" font-size="10" fill="#333">4</text>
  <text x="140" y="120" font-size="9" fill="#4a7a3a" font-weight="bold">✓</text>

  <text x="190" y="86" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="190" y="104" font-size="10" fill="#333">9</text>
  <text x="190" y="120" font-size="9" fill="#4a7a3a" font-weight="bold">✓</text>

  <text x="240" y="86" font-size="10" fill="#333" font-weight="bold">4</text>
  <text x="240" y="104" font-size="10" fill="#333">16</text>
  <text x="240" y="120" font-size="9" fill="#b85450">✗</text>

  <text x="290" y="86" font-size="10" fill="#333" font-weight="bold">5</text>
  <text x="290" y="104" font-size="10" fill="#333">25</text>
  <text x="290" y="120" font-size="9" fill="#b85450">✗</text>

  <text x="340" y="86" font-size="10" fill="#333" font-weight="bold">6</text>
  <text x="340" y="104" font-size="10" fill="#333">36</text>
  <text x="340" y="120" font-size="9" fill="#b85450">✗</text>

  <text x="390" y="86" font-size="10" fill="#333" font-weight="bold">7</text>
  <text x="390" y="104" font-size="10" fill="#333">49</text>
  <text x="390" y="120" font-size="9" fill="#b85450">✗</text>

  <text x="440" y="86" font-size="10" fill="#333" font-weight="bold">8</text>
  <text x="440" y="104" font-size="10" fill="#333">64</text>
  <text x="440" y="120" font-size="9" fill="#b85450">✗</text>

  <text x="490" y="86" font-size="10" fill="#333" font-weight="bold">9</text>
  <text x="490" y="104" font-size="10" fill="#333">81</text>
  <text x="490" y="120" font-size="9" fill="#b85450">✗</text>

  <text x="520" y="104" font-size="11" fill="#4a7a3a" font-weight="bold">命中 2</text>

  <line x1="40" y1="140" x2="520" y2="140" stroke="#ddd" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <text x="40" y="164" font-size="12" fill="#888" font-weight="bold">第 2 步：多位 012 回文 root</text>

  <rect x="40" y="174" width="480" height="118" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>

  <text x="55" y="194" font-size="10" fill="#888" font-weight="bold">root</text>
  <text x="120" y="194" font-size="10" fill="#888" font-weight="bold">镜像类型</text>
  <text x="220" y="194" font-size="10" fill="#888" font-weight="bold">y</text>
  <text x="290" y="194" font-size="10" fill="#888" font-weight="bold">y²</text>
  <text x="400" y="194" font-size="10" fill="#888" font-weight="bold">回文?</text>
  <text x="470" y="194" font-size="10" fill="#888" font-weight="bold">在范围内?</text>

  <text x="55" y="214" font-size="10" fill="#333">"1"</text>
  <text x="120" y="214" font-size="10" fill="#888">偶(2位)</text>
  <text x="220" y="214" font-size="10" fill="#333" font-weight="bold">11</text>
  <text x="290" y="214" font-size="10" fill="#333">121</text>
  <text x="400" y="214" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="470" y="214" font-size="10" fill="#4a7a3a" font-weight="bold">✓ ≤1000</text>

  <text x="55" y="234" font-size="10" fill="#333">"2"</text>
  <text x="120" y="234" font-size="10" fill="#888">偶(2位)</text>
  <text x="220" y="234" font-size="10" fill="#333" font-weight="bold">22</text>
  <text x="290" y="234" font-size="10" fill="#333">484</text>
  <text x="400" y="234" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="470" y="234" font-size="10" fill="#4a7a3a" font-weight="bold">✓ ≤1000</text>

  <text x="55" y="254" font-size="10" fill="#333">"10"</text>
  <text x="120" y="254" font-size="10" fill="#888">奇(3位)</text>
  <text x="220" y="254" font-size="10" fill="#333" font-weight="bold">101</text>
  <text x="290" y="254" font-size="10" fill="#333">10201</text>
  <text x="400" y="254" font-size="10" fill="#b85450">✗</text>
  <text x="470" y="254" font-size="10" fill="#b85450">✗ &gt;1000</text>

  <text x="55" y="274" font-size="10" fill="#333">"11"</text>
  <text x="120" y="274" font-size="10" fill="#888">奇(3位)</text>
  <text x="220" y="274" font-size="10" fill="#333" font-weight="bold">111</text>
  <text x="290" y="274" font-size="10" fill="#333">12321</text>
  <text x="400" y="274" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="470" y="274" font-size="10" fill="#b85450">✗ &gt;1000</text>

  <text x="55" y="294" font-size="9" fill="#888" font-style="italic">... 更长的 root 产生的 y² 均 &gt; 1000 ...</text>
  <text x="520" y="234" font-size="11" fill="#4a7a3a" font-weight="bold">命中 2</text>

  <line x1="40" y1="304" x2="520" y2="304" stroke="#ddd" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <text x="40" y="330" font-size="12" fill="#888" font-weight="bold">第 3 步：汇总</text>

  <rect x="120" y="340" width="320" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>

  <text x="160" y="364" font-size="11" fill="#333">单数字命中：2²=4, 3²=9</text>
  <text x="160" y="384" font-size="11" fill="#333">多数字命中：11²=121, 22²=484</text>
  <text x="160" y="406" font-size="12" fill="#4a7a3a" font-weight="bold">总计 = 4</text>

  <text x="460" y="372" font-size="20" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="460" y="390" font-size="9" fill="#888">超级回文数</text>
</svg>
