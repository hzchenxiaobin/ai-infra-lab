<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    核心观察：前缀数递推 + 取模，r_i = (r_{i-1} × 2 + nums[i]) mod 5
  </text>

  <!-- Formula box -->
  <rect x="40" y="48" width="480" height="62" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    前缀数递推：x_i = x_{i-1} × 2 + nums[i]  （左移一位 + 追加新位）
  </text>
  <text x="280" y="96" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">
    取模递推：r_i = (r_{i-1} × 2 + nums[i]) mod 5  （只跟踪余数）
  </text>

  <!-- Example label -->
  <text x="60" y="134" font-size="12" fill="#555" filter="url(#rough2)">以 nums = [1, 0, 1] 为例：</text>

  <!-- Column headers -->
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="240" y="148">i = 0</text>
    <text x="340" y="148">i = 1</text>
    <text x="440" y="148">i = 2</text>
  </g>

  <!-- Inter-column arrows showing ×2+bit -->
  <path d="M282,144 L298,144" fill="none" stroke="#d6a040" stroke-width="1.6"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M382,144 L398,144" fill="none" stroke="#d6a040" stroke-width="1.6"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row: nums[i] -->
  <text x="80" y="170" font-size="11" fill="#888" filter="url(#rough2)">nums[i]</text>
  <g filter="url(#rough2)">
    <rect x="200" y="154" width="80" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="300" y="154" width="80" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="400" y="154" width="80" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="240" y="172">1</text>
    <text x="340" y="172">0</text>
    <text x="440" y="172">1</text>
  </g>

  <!-- Row: x_i (direct, grows) -->
  <text x="80" y="202" font-size="11" fill="#888" filter="url(#rough2)">x_i（直接算）</text>
  <g filter="url(#rough2)">
    <rect x="200" y="186" width="80" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="300" y="186" width="80" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="400" y="186" width="80" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="240" y="204">1</text>
    <text x="340" y="204">2</text>
    <text x="440" y="204">5</text>
  </g>
  <!-- ×2+bit annotations between x_i columns -->
  <g filter="url(#rough2)" font-size="9" fill="#b85450" text-anchor="middle">
    <text x="290" y="200">×2+0</text>
    <text x="390" y="200">×2+1</text>
  </g>

  <!-- mod 5 arrow from x_i to r_i -->
  <line x1="500" y1="199" x2="500" y2="231" stroke="#d6a040" stroke-width="2"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="513" y="218" font-size="10" fill="#d6a040" filter="url(#rough2)">mod</text>
  <text x="513" y="230" font-size="10" fill="#d6a040" filter="url(#rough2)">5</text>

  <!-- Row: r_i (modulo, stays small) -->
  <text x="80" y="234" font-size="11" fill="#888" filter="url(#rough2)">r_i = x_i mod 5</text>
  <g filter="url(#rough2)">
    <rect x="200" y="218" width="80" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="300" y="218" width="80" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="400" y="218" width="80" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="240" y="236">1</text>
    <text x="340" y="236">2</text>
    <text x="440" y="236">0 ✓</text>
  </g>

  <!-- Row: answer -->
  <text x="80" y="266" font-size="11" fill="#888" filter="url(#rough2)">answer[i]</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="240" y="266" fill="#b85450">false</text>
    <text x="340" y="266" fill="#b85450">false</text>
    <text x="440" y="266" fill="#4a7a3a" font-weight="bold">true</text>
  </g>

  <!-- Overflow warning box -->
  <rect x="40" y="286" width="250" height="52" rx="8" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="306" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">
    ⚠ 直接算 x_i：i = 10^5 时
  </text>
  <text x="165" y="324" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">
    x ≈ 2^(10^5)，必然溢出！
  </text>

  <!-- Modulo benefit box -->
  <rect x="300" y="286" width="250" height="52" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="425" y="306" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">
    ✓ 只跟踪 r_i：r ∈ {0,1,2,3,4}
  </text>
  <text x="425" y="324" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">
    永不溢出，O(1) 空间
  </text>

  <!-- Conclusion box -->
  <rect x="40" y="350" width="480" height="40" rx="8" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">
    同余性质：(a × 2 + b) mod 5 = ((a mod 5) × 2 + b) mod 5
  </text>
  <text x="280" y="384" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">
    → 只需前一步余数 r_{i-1}，无需完整数值 x_{i-1}
  </text>
</svg>
