<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描 + 一步整除，O(n) / O(1)</text>

  <rect x="30" y="40" width="250" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="155" y="61" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">① 一趟扫描：mn ← min，S ← ΣenemyEnergies</text>

  <path d="M 155 74 L 155 90" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <polygon points="155,92 224,122 155,152 86,122" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="155" y="126" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">E₀ ≥ mn ?</text>

  <path d="M 224 122 L 296 122" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="252" y="114" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="300" y="106" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="360" y="126" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 0</text>

  <path d="M 155 152 L 155 168" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="168" y="166" font-size="10" fill="#446688" filter="url(#rough2)">是</text>

  <rect x="30" y="170" width="250" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="155" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② ans ← (E₀ + S − mn) / mn</text>
  <text x="155" y="208" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">（整数除法；能量池 ÷ 每分单价）</text>

  <path d="M 155 218 L 155 234" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="30" y="236" width="250" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="155" y="256" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ 返回 ans</text>

  <rect x="30" y="284" width="250" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="155" y="304" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">📖 对应的操作序列（可行性构造）</text>
  <text x="155" y="322" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">打一次 mn 拿 1 分（解锁标记）</text>
  <text x="155" y="338" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">→ 标记其余 n−1 个敌人（能量池拉满）</text>
  <text x="155" y="354" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">→ 连刷剩下的 mn 直到能量 &lt; mn</text>
  <text x="155" y="370" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">全程能量只增后缓降，中途不会卡死</text>

  <rect x="300" y="152" width="196" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="398" y="172" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">💡 为什么 E₀ &lt; mn 是 0？</text>
  <text x="398" y="190" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">标记需要已有 ≥ 1 分，</text>
  <text x="398" y="206" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">冷启动只能靠得分操作；</text>
  <text x="398" y="222" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">连最便宜的 mn 都付不起，</text>
  <text x="398" y="238" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">任何操作都无法启动</text>

  <rect x="300" y="256" width="196" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="398" y="276" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ C++ 溢出陷阱</text>
  <text x="398" y="294" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">S ≤ 10⁵ × 10⁹ = 10¹⁴，int 会爆</text>
  <text x="398" y="310" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">累加器与返回值都用 long long</text>
  <text x="398" y="326" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">Python 天然大整数，无此坑</text>

  <rect x="300" y="344" width="196" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="398" y="362" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">复杂度</text>
  <text x="398" y="378" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">一趟扫描 O(n) ＋ 常数空间 O(1)</text>
</svg>
