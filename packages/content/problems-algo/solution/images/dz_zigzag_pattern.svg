<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="4.5" refY="7" orient="auto">
      <path d="M 0 0 L 9 0 L 4.5 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：只减不增 → 只需压低「谷位」</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">峰位不动，把每个谷位降到 min(邻居)−1，锯齿自然成立</text>

  <!-- index ruler -->
  <g font-size="9" fill="#888">
    <text x="155" y="74" text-anchor="middle">i=0</text>
    <text x="205" y="74" text-anchor="middle">1</text>
    <text x="255" y="74" text-anchor="middle">2</text>
    <text x="305" y="74" text-anchor="middle">3</text>
    <text x="355" y="74" text-anchor="middle">4</text>
  </g>

  <!-- ===== Pattern A: even peaks ===== -->
  <text x="40" y="104" font-size="11" fill="#446688" font-weight="bold">方案A</text>
  <text x="40" y="118" font-size="9" fill="#446688">偶数峰</text>
  <text x="80" y="104" font-size="10" fill="#666">A[0]&gt;A[1]&lt;A[2]&gt;A[3]&lt;A[4]</text>

  <g font-size="13">
    <!-- peak cells (even): blue, unchanged -->
    <rect x="134" y="112" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="155" y="134" text-anchor="middle" fill="#446688" font-weight="bold">9</text>
    <!-- valley cells (odd): red, to decrease -->
    <rect x="184" y="112" width="42" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="205" y="134" text-anchor="middle" fill="#b85450" font-weight="bold">6</text>
    <rect x="234" y="112" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="255" y="134" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="284" y="112" width="42" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="305" y="134" text-anchor="middle" fill="#b85450" font-weight="bold">6</text>
    <rect x="334" y="112" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="355" y="134" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
  </g>

  <!-- markers above pattern A: peak=▲ blue, valley=▼ red -->
  <g font-size="11">
    <text x="155" y="160" text-anchor="middle" fill="#446688" font-weight="bold">峰▲</text>
    <path d="M 205 156 L 205 168" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
    <text x="220" y="164" font-size="9" fill="#b85450">压低</text>
    <text x="255" y="160" text-anchor="middle" fill="#446688" font-weight="bold">峰▲</text>
    <path d="M 305 156 L 305 168" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
    <text x="320" y="164" font-size="9" fill="#b85450">压低</text>
    <text x="355" y="160" text-anchor="middle" fill="#446688" font-weight="bold">峰▲</text>
  </g>

  <line x1="20" y1="190" x2="520" y2="190" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Pattern B: odd peaks ===== -->
  <text x="40" y="218" font-size="11" fill="#d6a040" font-weight="bold">方案B</text>
  <text x="40" y="232" font-size="9" fill="#d6a040">奇数峰</text>
  <text x="80" y="218" font-size="10" fill="#666">A[0]&lt;A[1]&gt;A[2]&lt;A[3]&gt;A[4]</text>

  <g font-size="13">
    <!-- valley cells (even): red -->
    <rect x="134" y="226" width="42" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="155" y="248" text-anchor="middle" fill="#b85450" font-weight="bold">9</text>
    <rect x="184" y="226" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="205" y="248" text-anchor="middle" fill="#d6a040" font-weight="bold">6</text>
    <rect x="234" y="226" width="42" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="255" y="248" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="284" y="226" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="305" y="248" text-anchor="middle" fill="#d6a040" font-weight="bold">6</text>
    <rect x="334" y="226" width="42" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="355" y="248" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
  </g>

  <g font-size="11">
    <path d="M 155 270 L 155 282" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
    <text x="170" y="278" font-size="9" fill="#b85450">压低</text>
    <text x="205" y="274" text-anchor="middle" fill="#d6a040" font-weight="bold">峰▲</text>
    <path d="M 255 270 L 255 282" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
    <text x="270" y="278" font-size="9" fill="#b85450">压低</text>
    <text x="305" y="274" text-anchor="middle" fill="#d6a040" font-weight="bold">峰▲</text>
    <path d="M 355 270 L 355 282" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
    <text x="370" y="278" font-size="9" fill="#b85450">压低</text>
  </g>

  <!-- ===== formula box ===== -->
  <rect x="40" y="300" width="460" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="60" y="322" font-size="11" fill="#4a7a3a" font-weight="bold">谷位 i 的代价（只减不增）</text>
  <text x="60" y="342" font-family="monospace" font-size="11" fill="#333">cost_i = max(0, nums[i] - min(左邻, 右邻) + 1)</text>
  <text x="60" y="358" font-size="10" fill="#555">把 nums[i] 降到 min(邻居)−1：刚好比两侧都小 1</text>
  <text x="60" y="372" font-size="10" fill="#555">答案 = min( 方案A总代价 , 方案B总代价 )</text>
</svg>
