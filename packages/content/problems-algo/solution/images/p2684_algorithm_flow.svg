<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：从右往左逐列 DP，滚动数组</text>

  <!-- Step 1: init -->
  <rect x="30" y="55" width="160" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="110" y="75" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 初始化</text>
  <text x="110" y="93" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">dp = [0]*m（末列无法移动）</text>

  <path d="M 190 80 L 220 80" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop c (diamond) -->
  <path d="M 290 80 L 360 55 L 430 80 L 360 105 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="77" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">c = n-2 ↓ 0</text>
  <text x="360" y="93" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">还有列?</text>

  <path d="M 360 105 L 360 130" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: per column build ndp -->
  <rect x="170" y="133" width="380" height="95" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="360" y="153" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 对列 c 的每行 r：</text>
  <text x="360" y="171" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">枚举 nr ∈ {r-1, r, r+1}（列 c+1）</text>
  <text x="360" y="188" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">若 grid[nr][c+1] &gt; grid[r][c]：</text>
  <text x="360" y="206" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">ndp[r] = max(ndp[r], 1 + dp[nr])</text>
  <text x="360" y="222" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">（dp 仍是列 c+1 的值，整列算完再换）</text>

  <path d="M 170 180 L 140 180 L 140 80 L 220 80" stroke="#999" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="100" y="135" font-size="9" fill="#999" filter="url(#rough2)">dp = ndp</text>
  <text x="100" y="148" font-size="9" fill="#999" filter="url(#rough2)">回到列循环</text>

  <!-- Step 4: answer -->
  <path d="M 360 228 L 360 258" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="375" y="248" font-size="9" fill="#4a7a3a" filter="url(#rough2)">列循环结束</text>

  <rect x="220" y="262" width="280" height="45" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="360" y="282" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 返回 max(dp)</text>
  <text x="360" y="299" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">dp 现存第 0 列，即第一列各起点最大移动次数</text>
</svg>
