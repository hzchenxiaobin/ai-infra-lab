<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 + 相邻扫描 + 首尾环形</text>

  <!-- 开始 -->
  <ellipse cx="180" cy="52" rx="46" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="56" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">输入 timePoints</text>

  <path d="M 180 68 L 180 84" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- n = len -->
  <rect x="110" y="86" width="140" height="30" fill="#ffffff" stroke="#666" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="180" y="106" text-anchor="middle" font-size="11" fill="#333">n = len(timePoints)</text>

  <path d="M 180 116 L 180 134" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 n > 1440? -->
  <polygon points="180,136 244,170 180,204 116,170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="167" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">n &gt; 1440?</text>
  <text x="180" y="182" text-anchor="middle" font-size="9" fill="#888">鸽巢原理</text>

  <!-- Yes 分支：右出 -->
  <path d="M 244 170 L 360 170" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="300" y="162" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>

  <rect x="360" y="154" width="150" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="435" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return 0（有重复）</text>

  <!-- No 分支：下出 -->
  <path d="M 180 204 L 180 222" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="218" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- 转分钟 -->
  <rect x="80" y="224" width="200" height="34" fill="#ffffff" stroke="#666" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="180" y="246" text-anchor="middle" font-size="11" fill="#333">a[i] = HH×60 + MM（转分钟）</text>

  <path d="M 180 258 L 180 276" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 排序 -->
  <rect x="80" y="278" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="180" y="300" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">sort(a) 升序排序</text>

  <path d="M 180 312 L 180 330" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 首尾环形初值 -->
  <rect x="60" y="332" width="240" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="180" y="354" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">minDiff = 1440 + a[0] − a[n−1]</text>

  <path d="M 180 366 L 180 384" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 扫描相邻 -->
  <rect x="60" y="386" width="240" height="34" fill="#ffffff" stroke="#666" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="180" y="408" text-anchor="middle" font-size="11" fill="#333">for i=1..n−1: minDiff=min(, a[i]−a[i−1])</text>

  <path d="M 180 420 L 180 438" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <ellipse cx="180" cy="456" rx="60" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="460" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return minDiff</text>

  <!-- 旁注：首尾环形 + 相邻 候选 -->
  <rect x="370" y="286" width="150" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="382" y="306" font-size="11" fill="#333" font-weight="bold">两类候选取 min：</text>
  <text x="382" y="324" font-size="10" fill="#b85450">• 首尾跨午夜差</text>
  <text x="382" y="340" font-size="10" fill="#d6a040">• 相邻元素差</text>
  <text x="382" y="358" font-size="10" fill="#4a7a3a" font-weight="bold">升序 ⇒ 相邻差 ≥ 0</text>
</svg>
