<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1 演算：n=4，pairs=[(0,1),(2,3)]</text>
  <text x="280" y="38" text-anchor="middle" font-size="10.5" fill="#888">preferences = [[1,2,3],[3,2,0],[3,1,0],[1,2,0]]</text>

  <!-- rank table header -->
  <text x="24" y="66" font-size="11" fill="#666" font-weight="bold">rank 表（越小越喜欢）</text>

  <!-- column headers: u\friend -->
  <rect x="24" y="74" width="44" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="46" y="90" text-anchor="middle" font-size="10.5" fill="#555">x \ u</text>
  <rect x="68" y="74" width="40" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="88" y="90" text-anchor="middle" font-size="10.5" fill="#555">0</text>
  <rect x="108" y="74" width="40" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="128" y="90" text-anchor="middle" font-size="10.5" fill="#555">1</text>
  <rect x="148" y="74" width="40" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="168" y="90" text-anchor="middle" font-size="10.5" fill="#555">2</text>
  <rect x="188" y="74" width="40" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="208" y="90" text-anchor="middle" font-size="10.5" fill="#555">3</text>

  <!-- row x=0 -->
  <rect x="24" y="98" width="44" height="22" fill="#fff8e1" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="46" y="114" text-anchor="middle" font-size="10.5" fill="#555">0</text>
  <rect x="68" y="98" width="40" height="22" fill="#ddd" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="88" y="114" text-anchor="middle" font-size="10" fill="#aaa">—</text>
  <rect x="108" y="98" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="128" y="114" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">0</text>
  <rect x="148" y="98" width="40" height="22" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="168" y="114" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="188" y="98" width="40" height="22" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="208" y="114" text-anchor="middle" font-size="10.5" fill="#333">2</text>

  <!-- row x=1 -->
  <rect x="24" y="120" width="44" height="22" fill="#fff8e1" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="46" y="136" text-anchor="middle" font-size="10.5" fill="#555">1</text>
  <rect x="68" y="120" width="40" height="22" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="88" y="136" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="108" y="120" width="40" height="22" fill="#ddd" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="128" y="136" text-anchor="middle" font-size="10" fill="#aaa">—</text>
  <rect x="148" y="120" width="40" height="22" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="168" y="136" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="188" y="120" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="208" y="136" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">0</text>

  <!-- row x=2 -->
  <rect x="24" y="142" width="44" height="22" fill="#fff8e1" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="46" y="158" text-anchor="middle" font-size="10.5" fill="#555">2</text>
  <rect x="68" y="142" width="40" height="22" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="88" y="158" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="108" y="142" width="40" height="22" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="128" y="158" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="148" y="142" width="40" height="22" fill="#ddd" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="168" y="158" text-anchor="middle" font-size="10" fill="#aaa">—</text>
  <rect x="188" y="142" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="208" y="158" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">0</text>

  <!-- row x=3 -->
  <rect x="24" y="164" width="44" height="22" fill="#fff8e1" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="46" y="180" text-anchor="middle" font-size="10.5" fill="#555">3</text>
  <rect x="68" y="164" width="40" height="22" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="88" y="180" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="108" y="164" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="128" y="180" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">0</text>
  <rect x="148" y="164" width="40" height="22" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="168" y="180" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="188" y="164" width="40" height="22" fill="#ddd" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="208" y="180" text-anchor="middle" font-size="10" fill="#aaa">—</text>

  <!-- match note -->
  <text x="248" y="100" font-size="11" fill="#666" font-weight="bold">match：</text>
  <text x="248" y="118" font-size="10.5" fill="#555">match[0]=1, match[1]=0</text>
  <text x="248" y="134" font-size="10.5" fill="#555">match[2]=3, match[3]=2</text>

  <!-- Checking process -->
  <text x="280" y="200" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">逐人判定</text>

  <!-- x=0 -->
  <rect x="24" y="210" width="512" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="36" y="228" font-size="10.5" fill="#333">x=0, y=1：preferences[0] 中排在 1 之前的 u = ∅（rank[0][1]=0 已是最前）</text>
  <text x="510" y="228" text-anchor="end" font-size="10.5" fill="#4a7a3a" font-weight="bold">开心</text>

  <!-- x=1 -->
  <rect x="24" y="240" width="512" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="36" y="258" font-size="10.5" fill="#333">x=1, y=0：排在 0 前的 u=3,2；取 u=3, v=match[3]=2</text>
  <text x="510" y="258" text-anchor="end" font-size="10.5" fill="#b85450" font-weight="bold">不开心</text>
  <text x="36" y="276" font-size="10" fill="#888">rank[3][1]=0 &lt; rank[3][2]=1 ✓ → 1 不开心，break</text>

  <!-- x=2 -->
  <rect x="24" y="284" width="512" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="36" y="302" font-size="10.5" fill="#333">x=2, y=3：preferences[2] 中排在 3 之前的 u = ∅（rank[2][3]=0）</text>
  <text x="510" y="302" text-anchor="end" font-size="10.5" fill="#4a7a3a" font-weight="bold">开心</text>

  <!-- x=3 -->
  <rect x="24" y="314" width="512" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="36" y="332" font-size="10.5" fill="#333">x=3, y=2：排在 2 前的 u=1；取 u=1, v=match[1]=0</text>
  <text x="510" y="332" text-anchor="end" font-size="10.5" fill="#b85450" font-weight="bold">不开心</text>
  <text x="36" y="350" font-size="10" fill="#888">rank[1][3]=0 &lt; rank[1][0]=2 ✓ → 3 不开心，break</text>

  <!-- Result -->
  <rect x="120" y="368" width="320" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="386" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = 2（朋友 1 与 3 不开心）</text>
  <text x="280" y="402" text-anchor="middle" font-size="10.5" fill="#555">注意：1↔3 互相判定，但 ans 按人头计，互不重复加</text>
</svg>
