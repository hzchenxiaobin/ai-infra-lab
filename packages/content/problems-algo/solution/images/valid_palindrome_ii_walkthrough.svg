<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：两种删除决策的对照</text>

  <!-- ========== Example 1: abca ========== -->
  <rect x="30" y="44" width="500" height="196" fill="#fff" stroke="#e0e0e0" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="48" y="68" font-size="12" fill="#446688" font-weight="bold">例 1：s = "abca" → true（两种删法都成功）</text>

  <!-- main loop: a vs a match, then b vs c mismatch -->
  <text x="48" y="94" font-size="10" fill="#888">主循环：</text>
  <rect x="96" y="80" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="114" y="99" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="132" y="80" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="99" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <rect x="168" y="80" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="99" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
  <rect x="204" y="80" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="99" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>

  <text x="114" y="72" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">L</text>
  <text x="222" y="72" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">R</text>

  <text x="252" y="92" font-size="10" fill="#4a7a3a">a=a ✓ 内推</text>
  <text x="252" y="106" font-size="10" fill="#b85450" font-weight="bold">→ b≠c ★ 失配（L=1,R=2）</text>

  <!-- delete left branch: only s[2..2]="c" is checked -->
  <text x="48" y="134" font-size="10" fill="#4a7a3a" font-weight="bold">删左：</text>
  <rect x="96" y="120" width="36" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="114" y="138" text-anchor="middle" font-size="11" fill="#bbb">a</text>
  <rect x="132" y="120" width="36" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="138" text-anchor="middle" font-size="10" fill="#bbb">b（删）</text>
  <rect x="168" y="120" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
  <rect x="204" y="120" width="36" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="222" y="138" text-anchor="middle" font-size="11" fill="#bbb">a</text>
  <text x="252" y="134" font-size="10" fill="#4a7a3a">验 s[2..2]="c"</text>
  <text x="252" y="148" font-size="10" fill="#4a7a3a" font-weight="bold">单字符即回文 → true ✓</text>

  <!-- delete right branch: only s[1..1]="b" is checked -->
  <text x="48" y="176" font-size="10" fill="#d6a040" font-weight="bold">删右：</text>
  <rect x="96" y="162" width="36" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="114" y="180" text-anchor="middle" font-size="11" fill="#bbb">a</text>
  <rect x="132" y="162" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="180" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <rect x="168" y="162" width="36" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="186" y="180" text-anchor="middle" font-size="10" fill="#bbb">c（删）</text>
  <rect x="204" y="162" width="36" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="222" y="180" text-anchor="middle" font-size="11" fill="#bbb">a</text>
  <text x="252" y="176" font-size="10" fill="#d6a040">验 s[1..1]="b"</text>
  <text x="252" y="190" font-size="10" fill="#d6a040" font-weight="bold">单字符即回文 → true ✓</text>

  <!-- result row -->
  <rect x="350" y="120" width="170" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="435" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">删 b → "aca" ✓</text>
  <text x="435" y="158" text-anchor="middle" font-size="11" fill="#a07820" font-weight="bold">删 c → "aba" ✓</text>
  <text x="435" y="178" text-anchor="middle" font-size="10.5" fill="#555">true OR true = true</text>

  <!-- ========== Example 2: cuppucu ========== -->
  <rect x="30" y="252" width="500" height="274" fill="#fff" stroke="#e0e0e0" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="48" y="276" font-size="12" fill="#b85450" font-weight="bold">例 2：s = "cuppucu" → true（仅删右成功，证明贪心不可行）</text>

  <!-- main loop: first mismatch c vs u at ends -->
  <text x="48" y="300" font-size="10" fill="#888">主循环首步即失配：</text>
  <rect x="170" y="286" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="305" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
  <rect x="202" y="286" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="218" y="305" text-anchor="middle" font-size="11" fill="#888">u</text>
  <rect x="234" y="286" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="305" text-anchor="middle" font-size="11" fill="#888">p</text>
  <rect x="266" y="286" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="282" y="305" text-anchor="middle" font-size="11" fill="#888">p</text>
  <rect x="298" y="286" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="314" y="305" text-anchor="middle" font-size="11" fill="#888">u</text>
  <rect x="330" y="286" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="346" y="305" text-anchor="middle" font-size="11" fill="#888">c</text>
  <rect x="362" y="286" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="378" y="305" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">u</text>

  <text x="186" y="278" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">L</text>
  <text x="378" y="278" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">R</text>
  <text x="406" y="300" font-size="10" fill="#b85450" font-weight="bold">c≠u ★ 失配（L=0,R=6）</text>

  <!-- delete left: uppucu -> u=u, then p!=c -> false -->
  <text x="48" y="338" font-size="10" fill="#4a7a3a" font-weight="bold">删左 → 验 "uppucu"：</text>
  <rect x="170" y="324" width="32" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="186" y="342" text-anchor="middle" font-size="10" fill="#bbb">c</text>
  <rect x="202" y="324" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="218" y="342" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">u</text>
  <rect x="234" y="324" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="342" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">p</text>
  <rect x="266" y="324" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="282" y="342" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">p</text>
  <rect x="298" y="324" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="314" y="342" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">u</text>
  <rect x="330" y="324" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="346" y="342" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">c</text>
  <rect x="362" y="324" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="378" y="342" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">u</text>

  <text x="406" y="338" font-size="10" fill="#4a7a3a">u=u ✓</text>
  <text x="406" y="352" font-size="10" fill="#b85450" font-weight="bold">p≠c ✗ 失配</text>

  <rect x="48" y="360" width="180" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="138" y="378" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">isPalindrome(1,6) = false ✗</text>

  <!-- delete right: cuppuc -> c=c, u=u, p=p -> true -->
  <text x="48" y="408" font-size="10" fill="#d6a040" font-weight="bold">删右 → 验 "cuppuc"：</text>
  <rect x="170" y="394" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="186" y="412" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">c</text>
  <rect x="202" y="394" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="218" y="412" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">u</text>
  <rect x="234" y="394" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="412" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">p</text>
  <rect x="266" y="394" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="282" y="412" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">p</text>
  <rect x="298" y="394" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="314" y="412" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">u</text>
  <rect x="330" y="394" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="346" y="412" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">c</text>
  <rect x="362" y="394" width="32" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="378" y="412" text-anchor="middle" font-size="10" fill="#bbb">u</text>

  <text x="406" y="402" font-size="10" fill="#d6a040">c=c ✓ u=u ✓ p=p ✓</text>
  <text x="406" y="416" font-size="10" fill="#4a7a3a" font-weight="bold">匹配到底 → true</text>

  <rect x="48" y="430" width="180" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="138" y="448" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">isPalindrome(0,5) = true ✓</text>

  <!-- conclusion -->
  <rect x="240" y="478" width="290" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="385" y="496" text-anchor="middle" font-size="11" fill="#a07820" font-weight="bold">结论：false OR true = true</text>
  <text x="385" y="512" text-anchor="middle" font-size="10" fill="#555">若贪心只删左 → 误判 false，故必须两种都试</text>
</svg>
