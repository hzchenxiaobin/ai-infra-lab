<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：求 total → 滚动 leftSum → 两段均值 → 取最小下标</text>

  <!-- Step 1: total = sum(nums) -->
  <rect x="180" y="44" width="180" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① total = sum(nums)</text>
  <text x="372" y="68" font-size="9.5" fill="#888">一次遍历 O(n)</text>

  <!-- arrow -->
  <line x1="270" y1="82" x2="270" y2="100" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: init -->
  <rect x="150" y="104" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="128" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② leftSum=0, minDiff=total+1, ans=0</text>

  <!-- arrow -->
  <line x1="270" y1="142" x2="270" y2="160" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: for loop -->
  <rect x="150" y="164" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="186" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ for i = 0 .. n−1：</text>

  <!-- arrow into loop body -->
  <line x1="270" y1="198" x2="270" y2="214" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: leftSum += nums[i]; leftAvg -->
  <rect x="120" y="218" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="240" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">leftSum += nums[i]；leftAvg = leftSum / (i+1)</text>

  <!-- arrow -->
  <line x1="270" y1="252" x2="270" y2="266" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: rightSum -->
  <rect x="100" y="270" width="340" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="292" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">rightSum = total − leftSum；rightCount = n−i−1</text>

  <!-- arrow -->
  <line x1="270" y1="304" x2="270" y2="318" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: rightCount == 0? -->
  <polygon points="270,322 360,356 270,390 180,356" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="354" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">rightCount</text>
  <text x="270" y="368" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">== 0 ?</text>

  <!-- Yes branch (right) -->
  <line x1="360" y1="356" x2="400" y2="356" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="350" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="404" y="340" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="464" y="360" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">rightAvg = 0</text>

  <!-- No branch (left) -->
  <line x1="180" y1="356" x2="140" y2="356" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="350" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="16" y="340" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="76" y="360" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">rightAvg =</text>
  <text x="76" y="372" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">rightSum/rightCount</text>

  <!-- converge to diff -->
  <line x1="76" y1="372" x2="76" y2="396" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="464" y1="372" x2="464" y2="396" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="76" y1="396" x2="464" y2="396" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="270" y1="396" x2="270" y2="408" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6: diff + update min -->
  <rect x="90" y="412" width="360" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="434" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">diff=|leftAvg−rightAvg|；若 diff&lt;minDiff → 更新 minDiff, ans=i</text>

  <!-- loop back arrow (right side) -->
  <path d="M 450 232 Q 500 232 500 181 L 390 181" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="492" y="208" font-size="9.5" fill="#888">下一 i</text>

  <!-- Footer -->
  <text x="270" y="455" text-anchor="middle" font-size="10" fill="#888">遍历结束返回 ans；相等时用严格 &lt; 不更新，天然保留最小下标</text>
</svg>
