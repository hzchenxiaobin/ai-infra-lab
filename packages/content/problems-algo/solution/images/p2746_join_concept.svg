<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">连接操作 join：边界字符相同则删一个</text>

  <!-- Case 1: no overlap -->
  <text x="60" y="74" font-size="13" fill="#446688" filter="url(#rough2)">边界不同：直接拼接</text>

  <!-- "ab" box -->
  <rect x="70" y="86" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="88" y="111" text-anchor="middle" font-size="15" fill="#224" filter="url(#rough2)">a</text>
  <text x="122" y="111" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="105" y="80" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">末</text>

  <!-- plus -->
  <text x="155" y="113" text-anchor="middle" font-size="18" fill="#888" filter="url(#rough2)">+</text>

  <!-- "cde" box -->
  <rect x="170" y="86" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="188" y="111" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="220" y="111" text-anchor="middle" font-size="15" fill="#243" filter="url(#rough2)">d</text>
  <text x="252" y="111" text-anchor="middle" font-size="15" fill="#243" filter="url(#rough2)">e</text>
  <text x="188" y="80" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">首</text>

  <!-- arrow -->
  <path d="M280,106 L320,106" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result "abcde" -->
  <rect x="330" y="86" width="160" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="350" y="111" text-anchor="middle" font-size="15" fill="#5a3a10" filter="url(#rough2)">a</text>
  <text x="384" y="111" text-anchor="middle" font-size="15" fill="#5a3a10" filter="url(#rough2)">b</text>
  <text x="418" y="111" text-anchor="middle" font-size="15" fill="#5a3a10" filter="url(#rough2)">c</text>
  <text x="452" y="111" text-anchor="middle" font-size="15" fill="#5a3a10" filter="url(#rough2)">d</text>
  <text x="476" y="111" text-anchor="middle" font-size="15" fill="#5a3a10" filter="url(#rough2)">e</text>
  <text x="410" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">长度 5+3 = 不删</text>

  <!-- divider -->
  <line x1="50" y1="172" x2="470" y2="172" stroke="#ddd" stroke-width="1.2" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- Case 2: overlap -->
  <text x="60" y="196" font-size="13" fill="#b85450" filter="url(#rough2)">边界相同：删去一个</text>

  <!-- "ab" box -->
  <rect x="70" y="208" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="88" y="233" text-anchor="middle" font-size="15" fill="#224" filter="url(#rough2)">a</text>
  <text x="122" y="233" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="105" y="202" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">末</text>

  <!-- plus -->
  <text x="155" y="235" text-anchor="middle" font-size="18" fill="#888" filter="url(#rough2)">+</text>

  <!-- "ba" box -->
  <rect x="170" y="208" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="188" y="233" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="222" y="233" text-anchor="middle" font-size="15" fill="#243" filter="url(#rough2)">a</text>
  <text x="188" y="202" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">首</text>

  <!-- arrow -->
  <path d="M250,228 L290,228" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result "aba" -->
  <rect x="300" y="208" width="110" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="322" y="233" text-anchor="middle" font-size="15" fill="#5a3a10" filter="url(#rough2)">a</text>
  <text x="355" y="233" text-anchor="middle" font-size="15" fill="#5a3a10" filter="url(#rough2)">b</text>
  <text x="388" y="233" text-anchor="middle" font-size="15" fill="#5a3a10" filter="url(#rough2)">a</text>
  <text x="355" y="268" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">长度 2+2−1 = 3</text>

  <!-- strike-through on the two merged b's (between source boxes) -->
  <path d="M122,200 L122,256" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M188,200 L188,256" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="60" y="296" width="400" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="13" fill="#7a3a3a" filter="url(#rough2)">删除只发生在拼接边界</text>
  <text x="260" y="344" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">比较：前串末字符 vs 后串首字符</text>
</svg>
