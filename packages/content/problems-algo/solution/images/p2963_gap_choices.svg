<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">每个缝隙独立二选一：m−1 个缝隙 → 2^(m−1) 种方案</text>

  <!-- segments row -->
  <rect x="100" y="60" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <rect x="250" y="60" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <rect x="320" y="60" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="160" y="81" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">A [2,1,2]</text>
  <text x="270" y="81" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">B [3]</text>
  <text x="360" y="81" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">C [4,4]</text>

  <!-- gap decisions -->
  <path d="M 235 52 L 235 100" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <path d="M 305 52 L 305 100" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="235" y="44" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">缝隙 1：切？合？</text>
  <text x="305" y="44" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">缝隙 2：切？合？</text>

  <!-- four schemes -->
  <!-- row 1: cut / cut -->
  <text x="42" y="140" font-size="10.5" fill="#555" filter="url(#rough2)">① 切 + 切</text>
  <rect x="130" y="126" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="240" y="126" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="294" y="126" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <path d="M 225 122 L 225 154" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 279 122 L 279 154" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="366" y="143" font-size="10.5" fill="#333" filter="url(#rough2)">([2,1,2],[3],[4,4])</text>

  <!-- row 2: merge / cut -->
  <text x="42" y="186" font-size="10.5" fill="#555" filter="url(#rough2)">② 合 + 切</text>
  <rect x="130" y="172" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="210" y="172" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="294" y="172" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="242" y="168" font-size="10" fill="#4a7a3a" filter="url(#rough2)">粘牢~</text>
  <path d="M 279 168 L 279 200" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="366" y="189" font-size="10.5" fill="#333" filter="url(#rough2)">([2,1,2,3],[4,4])</text>

  <!-- row 3: cut / merge -->
  <text x="42" y="232" font-size="10.5" fill="#555" filter="url(#rough2)">③ 切 + 合</text>
  <rect x="130" y="218" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="240" y="218" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="264" y="218" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <path d="M 225 214 L 225 246" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="296" y="214" font-size="10" fill="#4a7a3a" filter="url(#rough2)">粘牢~</text>
  <text x="366" y="235" font-size="10.5" fill="#333" filter="url(#rough2)">([2,1,2],[3,4,4])</text>

  <!-- row 4: merge / merge -->
  <text x="42" y="278" font-size="10.5" fill="#555" filter="url(#rough2)">④ 合 + 合</text>
  <rect x="130" y="264" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="210" y="264" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="234" y="264" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="366" y="281" font-size="10.5" fill="#333" filter="url(#rough2)">([2,1,2,3,4,4])</text>

  <!-- why independent -->
  <rect x="26" y="306" width="468" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="42" y="326" font-size="10.5" fill="#333" filter="url(#rough2)">两个决定互不干扰：无论缝隙 1 切不切，缝隙 2 的两种选择都合法（反之亦然）</text>
  <text x="42" y="344" font-size="10.5" fill="#333" filter="url(#rough2)">→ 乘法原理：方案数 = 2 × 2 = 2^(m−1)</text>

  <!-- bottom strip -->
  <rect x="46" y="370" width="428" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="260" y="388" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">一般地：m 个原子段 → 2^(m−1) 种好分割</text>
  <text x="260" y="406" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">m = 1 时 2⁰ = 1：整个数组就是唯一方案（如 [1,1,1,1]）</text>
</svg>
