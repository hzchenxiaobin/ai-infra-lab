<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察②：按边界值 x（第 k 大频次）把频次分成三区</text>
  <text x="310" y="46" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">降序频次 [5, 4, 3, 3, 3, 2, 1]，k = 4 → x = 3，g = 2，need = 2</text>

  <!-- sorted freq cells -->
  <rect x="131" y="64" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="89" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="183" y="64" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="206" y="89" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="235" y="64" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="258" y="89" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="287" y="64" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="89" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="339" y="64" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="362" y="89" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="391" y="64" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="414" y="89" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="443" y="64" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="466" y="89" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- brackets -->
  <path d="M 131 112 L 131 118 L 229 118 L 229 112" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 235 112 L 235 118 L 385 118 L 385 112" fill="none" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 391 112 L 391 118 L 489 118 L 489 112" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- zone labels -->
  <text x="180" y="138" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">频次 &gt; x：全选</text>
  <text x="310" y="138" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">频次 = x：挑 need = 2 个</text>
  <text x="440" y="138" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">频次 &lt; x：不选</text>

  <text x="180" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">贡献 = 5 × 4 = 20</text>
  <text x="310" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">贡献 = C(3,2) × 3² = 27</text>
  <text x="440" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">选了必被换掉</text>

  <!-- formula box -->
  <rect x="90" y="178" width="440" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="200" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">ans = ∏(频次 &gt; x) × C(cnt_x, need) × x^need</text>
  <text x="310" y="224" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">= (5 × 4) × C(3, 2) × 3² = 540</text>

  <!-- exchange argument box -->
  <rect x="70" y="254" width="480" height="58" fill="#ffffff" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>
  <text x="310" y="274" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">交换论证（贪心正确性）</text>
  <text x="310" y="291" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">选了频次 &lt; x 的字符而漏掉频次 ≥ x 的字符时，把前者换成后者</text>
  <text x="310" y="306" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">美丽值严格变大 ⇒ 最大美丽值集合只能是上述三区结构</text>

  <text x="310" y="344" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">其中 cnt_x = 3（频次恰为 x 的字符数），need = k − g = 4 − 2 = 2</text>
</svg>
