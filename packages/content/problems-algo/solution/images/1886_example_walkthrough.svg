<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="460" height="350" fill="#fafafa"/>

  <!-- Title -->
  <text x="230" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：示例 3 的旋转匹配过程</text>

  <!-- Matrix labels -->
  <text x="78" y="46" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">0°（原始）</text>
  <text x="212" y="46" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">90°</text>
  <text x="346" y="46" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">180°</text>

  <!-- ===== Matrix 0° (origin 30,54, cell 32x32): [[0,0,0],[0,1,0],[1,1,1]] ===== -->
  <!-- Row 0: 0,0,0 -->
  <rect x="30" y="54" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="62" y="54" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="94" y="54" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="46" y="75" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="78" y="75" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="110" y="75" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <!-- Row 1: 0,1,0 -->
  <rect x="30" y="86" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="62" y="86" width="32" height="32" fill="#446688" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="94" y="86" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="46" y="107" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="78" y="107" text-anchor="middle" font-size="13" fill="white" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="110" y="107" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <!-- Row 2: 1,1,1 -->
  <rect x="30" y="118" width="32" height="32" fill="#446688" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="62" y="118" width="32" height="32" fill="#446688" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="94" y="118" width="32" height="32" fill="#446688" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="46" y="139" text-anchor="middle" font-size="13" fill="white" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="78" y="139" text-anchor="middle" font-size="13" fill="white" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="110" y="139" text-anchor="middle" font-size="13" fill="white" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- Comparison 0° -->
  <text x="78" y="172" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="78" y="186" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">≠ target</text>

  <!-- Arrow 0° -> 90° -->
  <path d="M 130 104 L 160 104" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="145" y="98" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">rotate</text>

  <!-- ===== Matrix 90° (origin 164,54): [[1,0,0],[1,1,0],[1,0,0]] ===== -->
  <!-- Row 0: 1,0,0 -->
  <rect x="164" y="54" width="32" height="32" fill="#446688" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="196" y="54" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="228" y="54" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="180" y="75" text-anchor="middle" font-size="13" fill="white" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="212" y="75" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="244" y="75" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <!-- Row 1: 1,1,0 -->
  <rect x="164" y="86" width="32" height="32" fill="#446688" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="196" y="86" width="32" height="32" fill="#446688" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="228" y="86" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="180" y="107" text-anchor="middle" font-size="13" fill="white" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="212" y="107" text-anchor="middle" font-size="13" fill="white" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="244" y="107" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <!-- Row 2: 1,0,0 -->
  <rect x="164" y="118" width="32" height="32" fill="#446688" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="196" y="118" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="228" y="118" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="180" y="139" text-anchor="middle" font-size="13" fill="white" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="212" y="139" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="244" y="139" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>

  <!-- Comparison 90° -->
  <text x="212" y="172" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="212" y="186" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">≠ target</text>

  <!-- Arrow 90° -> 180° -->
  <path d="M 264 104 L 294 104" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="279" y="98" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">rotate</text>

  <!-- ===== Matrix 180° (origin 298,54): [[1,1,1],[0,1,0],[0,0,0]] — GREEN (matches target) ===== -->
  <!-- Row 0: 1,1,1 -->
  <rect x="298" y="54" width="32" height="32" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="330" y="54" width="32" height="32" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="362" y="54" width="32" height="32" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="314" y="75" text-anchor="middle" font-size="13" fill="white" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="346" y="75" text-anchor="middle" font-size="13" fill="white" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="378" y="75" text-anchor="middle" font-size="13" fill="white" font-weight="bold" filter="url(#rough2)">1</text>
  <!-- Row 1: 0,1,0 -->
  <rect x="298" y="86" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="330" y="86" width="32" height="32" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="362" y="86" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="314" y="107" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="346" y="107" text-anchor="middle" font-size="13" fill="white" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="378" y="107" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <!-- Row 2: 0,0,0 -->
  <rect x="298" y="118" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="330" y="118" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="362" y="118" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="314" y="139" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="346" y="139" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="378" y="139" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>

  <!-- Comparison 180° -->
  <text x="346" y="172" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="346" y="186" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">匹配！</text>

  <!-- Arrow down from 180° to target -->
  <path d="M 346 192 L 346 212" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Target label -->
  <text x="346" y="210" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">target</text>

  <!-- ===== Target matrix (origin 298,218): [[1,1,1],[0,1,0],[0,0,0]] — GREEN ===== -->
  <!-- Row 0: 1,1,1 -->
  <rect x="298" y="218" width="32" height="32" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="330" y="218" width="32" height="32" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="362" y="218" width="32" height="32" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="314" y="239" text-anchor="middle" font-size="13" fill="white" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="346" y="239" text-anchor="middle" font-size="13" fill="white" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="378" y="239" text-anchor="middle" font-size="13" fill="white" font-weight="bold" filter="url(#rough2)">1</text>
  <!-- Row 1: 0,1,0 -->
  <rect x="298" y="250" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="330" y="250" width="32" height="32" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="362" y="250" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="314" y="271" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="346" y="271" text-anchor="middle" font-size="13" fill="white" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="378" y="271" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <!-- Row 2: 0,0,0 -->
  <rect x="298" y="282" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="330" y="282" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="362" y="282" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="314" y="303" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="346" y="303" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="378" y="303" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>

  <!-- Result box -->
  <rect x="80" y="326" width="300" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="230" y="340" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">180° 旋转后 mat == target → return true</text>
</svg>
