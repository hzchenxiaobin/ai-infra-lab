<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#778899"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 逆元筛 → O(n) 递推 T 表 → 汇总贡献</text>

  <g filter="url(#rough2)">
    <rect x="200" y="34" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="13"/>
    <text x="260" y="51" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5d24">输入 nums, k</text>
    <path d="M 260 60 L 260 74" stroke="#778899" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>

    <rect x="130" y="76" width="260" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="260" y="95" text-anchor="middle" font-size="11.5" fill="#33506b">① 排序（升序）；n=|nums|，m=k−1</text>
    <path d="M 260 106 L 260 118" stroke="#778899" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>

    <rect x="130" y="120" width="260" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="260" y="139" text-anchor="middle" font-size="11.5" fill="#33506b">② 线性逆元表 inv[1..n]（O(n) 递推）</text>
    <path d="M 260 150 L 260 162" stroke="#778899" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>

    <rect x="40" y="164" width="440" height="146" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="7 5" rx="10"/>
    <text x="260" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506b">③ for i = 1 … n−1 递推 T(i)　（初值 T(0)=1，comb=C(m,m)=1）</text>

    <polygon points="150,208 200,238 150,268 100,238" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="150" y="243" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f">i ≤ m ?</text>

    <path d="M 200 238 L 224 238" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <text x="212" y="232" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a">是</text>
    <rect x="228" y="222" width="200" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="328" y="237" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5d24">T(i) = 2·T(i−1)</text>
    <text x="328" y="250" text-anchor="middle" font-size="9" fill="#4a6a3f">（此时 T(i) 恰为 2^i）</text>

    <path d="M 150 268 L 150 278" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <text x="162" y="277" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">否</text>
    <rect x="60" y="280" width="380" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="250" y="297" text-anchor="middle" font-size="11" fill="#8f3a35">T(i) = 2·T(i−1) − comb；　comb ← comb·i·inv[i−m]</text>

    <path d="M 260 310 L 260 322" stroke="#778899" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <rect x="80" y="324" width="360" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
    <text x="260" y="343" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f">④ ans = Σ nums[i]·(T(i)+T(n−1−i)) mod 10⁹+7 → 返回</text>
  </g>
</svg>
