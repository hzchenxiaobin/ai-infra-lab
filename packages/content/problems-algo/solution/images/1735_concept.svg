<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：乘积问题 → 质因数分解 + 隔板法（各质因子独立分配）</text>

  <!-- ===== Row 1: k 分解为质因数 ===== -->
  <text x="34" y="64" font-size="12" fill="#446688" font-weight="bold">第 1 步：分解 k</text>

  <rect x="110" y="50" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="138" y="71" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">k</text>

  <text x="182" y="72" font-size="16" fill="#888" font-weight="bold">=</text>

  <rect x="204" y="50" width="76" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="242" y="71" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">p₁^e₁</text>

  <text x="294" y="72" font-size="14" fill="#888" font-weight="bold">×</text>

  <rect x="316" y="50" width="76" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="354" y="71" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">p₂^e₂</text>

  <text x="406" y="72" font-size="14" fill="#888" font-weight="bold">×</text>

  <text x="430" y="72" font-size="14" fill="#888" font-weight="bold">···</text>

  <!-- arrow down -->
  <path d="M 300 92 Q 300 104 300 116" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 2: 每个质因子独立分配到 n 个位置 ===== -->
  <text x="34" y="142" font-size="12" fill="#446688" font-weight="bold">第 2 步：各质因子</text>
  <text x="34" y="158" font-size="12" fill="#446688" font-weight="bold">独立分配到 n 格</text>

  <!-- p1: e1 个 p1 分到 n 格 -->
  <rect x="100" y="128" width="140" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">e₁ 个 p₁ → n 格</text>
  <text x="170" y="170" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">C(n+e₁−1, e₁)</text>

  <!-- p2: e2 个 p2 分到 n 格 -->
  <rect x="270" y="128" width="140" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="340" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">e₂ 个 p₂ → n 格</text>
  <text x="340" y="170" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">C(n+e₂−1, e₂)</text>

  <text x="436" y="160" font-size="14" fill="#888" font-weight="bold">···</text>

  <!-- arrow down -->
  <path d="M 300 194 Q 300 206 300 218" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 3: 乘法原理 ===== -->
  <text x="34" y="244" font-size="12" fill="#d6a040" font-weight="bold">第 3 步：乘法原理</text>
  <text x="34" y="260" font-size="12" fill="#d6a040" font-weight="bold">（各质因子独立）</text>

  <rect x="100" y="232" width="340" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="258" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = C(n+e₁−1,e₁) × C(n+e₂−1,e₂) × ···  (mod 1e9+7)</text>

  <!-- arrow down -->
  <path d="M 270 282 Q 270 294 270 306" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 4: 直观示例 k=6, n=2 ===== -->
  <rect x="60" y="318" width="500" height="130" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="342" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">直观示例：n=2, k=6 = 2¹ × 3¹</text>

  <!-- distribute p=2, e=1 to 2 slots -->
  <rect x="80" y="358" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="180" y="381" text-anchor="middle" font-size="11" fill="#333">2¹ 分 2 格 → C(2,1) = 2</text>

  <text x="296" y="380" font-size="16" fill="#888" font-weight="bold">×</text>

  <!-- distribute p=3, e=1 to 2 slots -->
  <rect x="316" y="358" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="416" y="381" text-anchor="middle" font-size="11" fill="#333">3¹ 分 2 格 → C(2,1) = 2</text>

  <text x="296" y="418" font-size="14" fill="#888" font-weight="bold">=</text>

  <rect x="200" y="408" width="200" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="429" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2 × 2 = 4 种方案</text>
</svg>
