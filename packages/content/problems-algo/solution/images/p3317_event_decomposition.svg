<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">按非空节目数 k 分桶：一个方案 = 分组 × 选节目 × 打分</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">固定 k 后三步正交（乘法原理连乘）；不同 k 互斥（加法原理求和）</text>

  <!-- ① 分组 -->
  <rect x="15" y="62" width="150" height="116" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="90" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 分组</text>
  <circle cx="52" cy="100" r="7" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="104" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">1</text>
  <circle cx="70" cy="100" r="7" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="104" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">2</text>
  <circle cx="88" cy="100" r="7" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="104" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">3</text>
  <circle cx="106" cy="100" r="7" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="106" y="104" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">4</text>
  <circle cx="124" cy="100" r="7" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="124" y="104" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">5</text>
  <path d="M 90 110 L 90 126" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <ellipse cx="62" cy="142" rx="30" ry="14" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="62" y="146" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">{1,2,3}</text>
  <ellipse cx="127" cy="142" rx="22" ry="14" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="127" y="146" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">{4,5}</text>
  <text x="90" y="170" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">n 人 → k 个非空组（组无编号）</text>
  <rect x="42" y="186" width="96" height="20" rx="10" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="200" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">S(n,k) 种</text>

  <!-- × 分隔 -->
  <text x="175" y="128" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold" filter="url(#rough2)">×</text>

  <!-- ② 选节目 -->
  <rect x="185" y="62" width="150" height="116" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="82" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 选节目</text>
  <rect x="203" y="98" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="214" y="113" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="231" y="98" width="22" height="22" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="242" y="113" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <rect x="259" y="98" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="270" y="113" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="287" y="98" width="22" height="22" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="298" y="113" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <rect x="315" y="98" width="22" height="22" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="326" y="113" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <path d="M 260 128 L 260 140" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <ellipse cx="214" cy="152" rx="16" ry="10" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <ellipse cx="270" cy="152" rx="16" ry="10" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="260" y="170" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">从 x 个有编号节目里挑 k 个</text>
  <rect x="212" y="186" width="96" height="20" rx="10" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">C(x,k) 种</text>

  <!-- × 分隔 -->
  <text x="345" y="128" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold" filter="url(#rough2)">×</text>

  <!-- ③ 打分 -->
  <rect x="355" y="62" width="150" height="116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="82" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">③ 打分</text>
  <circle cx="398" cy="104" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="398" y="108" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="466" cy="104" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="466" y="108" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <path d="M 398 116 L 398 132" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 466 116 L 466 132" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="386" y="136" width="24" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="398" y="151" text-anchor="middle" font-size="9" fill="#8a6a20" filter="url(#rough2)">节目</text>
  <rect x="454" y="136" width="24" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="466" y="151" text-anchor="middle" font-size="9" fill="#8a6a20" filter="url(#rough2)">节目</text>
  <text x="430" y="170" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">每个非空节目独立取 [1, y] 分</text>
  <rect x="382" y="186" width="96" height="20" rx="10" fill="#fff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="200" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">y^k 种</text>

  <!-- 底部公式 -->
  <rect x="15" y="228" width="490" height="118" fill="#fff" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">总方案数（对 10⁹ + 7 取模）</text>
  <text x="260" y="280" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">ans = Σ ( k = 1 … min(n,x) )  S(n,k) · C(x,k) · y^k</text>
  <text x="260" y="304" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">不同 k 的方案集合两两不相交 → 直接相加；k &gt; n 没人可分组，k &gt; x 没节目可挑</text>
  <text x="260" y="324" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">三步各只依赖 (n,k) / (x,k) / (k,y)，维度正交 → 乘法原理连乘</text>
</svg>
