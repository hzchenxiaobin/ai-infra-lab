<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：三种删除策略取最小</text>

  <text x="40" y="56" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">数组中 min 在 i，max 在 j（设 i &lt; j），n 个元素</text>

  <rect x="120" y="70" width="40" height="40" fill="#fafafa" stroke="#aaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="94" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>

  <rect x="160" y="70" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="180" y="94" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="180" y="124" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">j? i!</text>

  <rect x="200" y="70" width="40" height="40" fill="#fafafa" stroke="#aaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="94" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">7</text>

  <rect x="240" y="70" width="40" height="40" fill="#fafafa" stroke="#aaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="94" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">5</text>

  <rect x="280" y="70" width="40" height="40" fill="#fafafa" stroke="#aaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="94" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">4</text>

  <rect x="320" y="70" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="340" y="94" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="340" y="124" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">min</text>

  <rect x="360" y="70" width="40" height="40" fill="#fafafa" stroke="#aaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="94" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">8</text>

  <rect x="400" y="70" width="40" height="40" fill="#fafafa" stroke="#aaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="94" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">6</text>

  <text x="120" y="138" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="180" y="138" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">i=1</text>
  <text x="340" y="138" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">j=5</text>
  <text x="440" y="138" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">n-1=7</text>

  <text x="40" y="168" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">策略①全从左删到 j</text>
  <rect x="120" y="178" width="240" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="360" y="178" width="80" height="30" fill="#fafafa" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="198" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">删 0..j</text>
  <text x="400" y="198" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">保留</text>
  <text x="470" y="198" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">= j+1</text>

  <text x="40" y="234" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">策略②全从右删到 i</text>
  <rect x="120" y="244" width="80" height="30" fill="#fafafa" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <rect x="200" y="244" width="240" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="264" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">保留</text>
  <text x="320" y="264" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">删 i..n-1</text>
  <text x="470" y="264" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= n-i</text>

  <text x="40" y="300" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">策略③左删到 i + 右删到 j</text>
  <rect x="120" y="310" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="200" y="310" width="120" height="30" fill="#fafafa" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <rect x="320" y="310" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="330" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">删 0..i</text>
  <text x="260" y="330" text-anchor="middle" font-size="10.5" fill="#aaa" filter="url(#rough2)">保留</text>
  <text x="380" y="330" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">删 j..n-1</text>
  <text x="470" y="330" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">=(i+1)+(n-j)</text>

  <rect x="60" y="366" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="388" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">answer = min( j+1, n-i, (i+1)+(n-j) )</text>

  <text x="280" y="424" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">只删两端，绝不在中间挖——中间删了无意义且更贵</text>
</svg>
