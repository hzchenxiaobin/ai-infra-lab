<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="840" height="420" fill="#fafafa"/>

  <text x="420" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1, −1, 5, −2, 3], k = 3  →  ans = 4</text>

  <!-- Panel 0: 初始 -->
  <rect x="10" y="40" width="130" height="360" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="10" y="40" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="75" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始</text>
  <text x="20" y="90" font-size="11" fill="#888">元素：</text>
  <text x="75" y="90" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="20" y="116" font-size="11" fill="#888">prefix：</text>
  <text x="75" y="116" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0</text>
  <text x="20" y="142" font-size="11" fill="#888">查询：</text>
  <text x="75" y="142" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="20" y="168" font-size="11" fill="#888">命中：</text>
  <text x="75" y="168" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <rect x="20" y="182" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="75" y="201" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = 0</text>
  <text x="75" y="228" text-anchor="middle" font-size="10.5" fill="#888">first：</text>
  <rect x="18" y="236" width="114" height="44" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="75" y="256" text-anchor="middle" font-size="10.5" fill="#333">{ 0 : −1 }</text>
  <text x="75" y="272" text-anchor="middle" font-size="9.5" fill="#82b366">含「空前缀」</text>
  <text x="75" y="312" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">下标 −1 表示</text>
  <text x="75" y="328" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">从数组起点开始</text>

  <!-- Panel 1: i=0, x=1 -->
  <rect x="146" y="40" width="130" height="360" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="146" y="40" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="211" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i=0, x=1</text>
  <text x="156" y="90" font-size="11" fill="#888">元素：</text>
  <rect x="193" y="76" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="211" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="156" y="116" font-size="11" fill="#888">prefix：</text>
  <text x="211" y="116" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="156" y="142" font-size="11" fill="#888">查询：</text>
  <text x="211" y="142" text-anchor="middle" font-size="10" fill="#b85450">1−3=−2? 否</text>
  <text x="156" y="168" font-size="11" fill="#888">命中：</text>
  <text x="211" y="168" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <rect x="156" y="182" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="211" y="201" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = 0</text>
  <text x="211" y="228" text-anchor="middle" font-size="10.5" fill="#888">first：</text>
  <rect x="154" y="236" width="114" height="44" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="211" y="256" text-anchor="middle" font-size="9.5" fill="#333">{0:−1, 1:0}</text>
  <text x="211" y="272" text-anchor="middle" font-size="9.5" fill="#d6a040">写入 first[1]=0</text>
  <text x="211" y="312" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">prefix=1 首次</text>
  <text x="211" y="328" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">出现，记录下标</text>

  <!-- Panel 2: i=1, x=-1 -->
  <rect x="282" y="40" width="130" height="360" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="282" y="40" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="347" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i=1, x=−1</text>
  <text x="292" y="90" font-size="11" fill="#888">元素：</text>
  <rect x="329" y="76" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="347" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">−1</text>
  <text x="292" y="116" font-size="11" fill="#888">prefix：</text>
  <text x="347" y="116" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0</text>
  <text x="292" y="142" font-size="11" fill="#888">查询：</text>
  <text x="347" y="142" text-anchor="middle" font-size="10" fill="#b85450">0−3=−3? 否</text>
  <text x="292" y="168" font-size="11" fill="#888">命中：</text>
  <text x="347" y="168" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <rect x="292" y="182" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="347" y="201" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = 0</text>
  <text x="347" y="228" text-anchor="middle" font-size="10.5" fill="#888">first：</text>
  <rect x="290" y="236" width="114" height="44" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="347" y="256" text-anchor="middle" font-size="9.5" fill="#333">{0:−1, 1:0}</text>
  <text x="347" y="272" text-anchor="middle" font-size="9.5" fill="#b85450">不覆盖 first[0]</text>
  <text x="347" y="312" text-anchor="middle" font-size="10" fill="#b85450" font-style="italic">prefix=0 已存在</text>
  <text x="347" y="328" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">保留最早下标 −1</text>

  <!-- Panel 3: i=2, x=5 -->
  <rect x="418" y="40" width="130" height="360" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="418" y="40" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="483" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i=2, x=5</text>
  <text x="428" y="90" font-size="11" fill="#888">元素：</text>
  <rect x="465" y="76" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="483" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="428" y="116" font-size="11" fill="#888">prefix：</text>
  <text x="483" y="116" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5</text>
  <text x="428" y="142" font-size="11" fill="#888">查询：</text>
  <text x="483" y="142" text-anchor="middle" font-size="10" fill="#b85450">5−3=2? 否</text>
  <text x="428" y="168" font-size="11" fill="#888">命中：</text>
  <text x="483" y="168" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <rect x="428" y="182" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="483" y="201" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = 0</text>
  <text x="483" y="228" text-anchor="middle" font-size="10.5" fill="#888">first：</text>
  <rect x="426" y="236" width="114" height="44" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="483" y="256" text-anchor="middle" font-size="8.5" fill="#333">{0:−1,1:0,5:2}</text>
  <text x="483" y="272" text-anchor="middle" font-size="9.5" fill="#d6a040">写入 first[5]=2</text>
  <text x="483" y="312" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">prefix=5 首次</text>
  <text x="483" y="328" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">出现，记录下标</text>

  <!-- Panel 4: i=3, x=-2 (HIT, ans=4) -->
  <rect x="554" y="40" width="130" height="360" fill="#ffffff" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <rect x="554" y="40" width="130" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="619" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i=3, x=−2 ★</text>
  <text x="564" y="90" font-size="11" fill="#888">元素：</text>
  <rect x="601" y="76" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="619" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">−2</text>
  <text x="564" y="116" font-size="11" fill="#888">prefix：</text>
  <text x="619" y="116" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="564" y="142" font-size="11" fill="#888">查询：</text>
  <text x="619" y="142" text-anchor="middle" font-size="9.5" fill="#82b366" font-weight="bold">3−3=0? 是@−1</text>
  <text x="564" y="168" font-size="11" fill="#888">长度：</text>
  <text x="619" y="168" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">3−(−1)=4</text>
  <rect x="564" y="182" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="619" y="201" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans = 4</text>
  <text x="619" y="228" text-anchor="middle" font-size="10.5" fill="#888">first：</text>
  <rect x="562" y="236" width="114" height="44" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="619" y="256" text-anchor="middle" font-size="8.5" fill="#333">{0:−1,1:0,5:2,3:3}</text>
  <text x="619" y="272" text-anchor="middle" font-size="9.5" fill="#d6a040">写入 first[3]=3</text>
  <text x="619" y="312" text-anchor="middle" font-size="10" fill="#b85450" font-style="italic">命中 [0..3]</text>
  <text x="619" y="328" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">[1,−1,5,−2] 长度 4</text>

  <!-- Panel 5: i=4, x=3 (HIT, no improve) -->
  <rect x="690" y="40" width="130" height="360" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <rect x="690" y="40" width="130" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="755" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i=4, x=3 ☆</text>
  <text x="700" y="90" font-size="11" fill="#888">元素：</text>
  <rect x="737" y="76" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="755" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="700" y="116" font-size="11" fill="#888">prefix：</text>
  <text x="755" y="116" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">6</text>
  <text x="700" y="142" font-size="11" fill="#888">查询：</text>
  <text x="755" y="142" text-anchor="middle" font-size="9.5" fill="#82b366" font-weight="bold">6−3=3? 是@3</text>
  <text x="700" y="168" font-size="11" fill="#888">长度：</text>
  <text x="755" y="168" text-anchor="middle" font-size="11" fill="#888">4−3=1</text>
  <rect x="700" y="182" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="755" y="201" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = 4</text>
  <text x="755" y="228" text-anchor="middle" font-size="10.5" fill="#888">first：</text>
  <rect x="753" y="236" width="114" height="44" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="755" y="256" text-anchor="middle" font-size="8" fill="#333">{0:−1,1:0,5:2,3:3,6:4}</text>
  <text x="755" y="272" text-anchor="middle" font-size="9.5" fill="#d6a040">写入 first[6]=4</text>
  <text x="755" y="312" text-anchor="middle" font-size="10" fill="#888" font-style="italic">命中但更短</text>
  <text x="755" y="328" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">ans 不更新</text>

  <!-- bottom summary -->
  <rect x="10" y="362" width="810" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="415" y="384" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">i=3 用「最早下标 −1」得到长度 4；i=2 不覆盖 first[0] 才让 i=3 命中成功</text>
  <text x="415" y="400" text-anchor="middle" font-size="10.5" fill="#888">求最长 → 只在「首次出现」时写入，绝不覆盖</text>
</svg>
