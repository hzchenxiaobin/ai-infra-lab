<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <pattern id="hatch2" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#e6f4ea"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#4a7a3a" stroke-width="1.4"/>
    </pattern>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：tiles = [1,5][10,11][12,18][20,25][30,32], carpetLen = 10</text>

  <!-- carpet optimal placement l=1: [10,19] -->
  <rect x="138" y="44" width="120" height="18" fill="url(#hatch2)" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="198" y="38" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">毯子 [10,19]（最优 → 9）</text>

  <!-- tiles -->
  <rect x="30" y="70" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="88" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">[1,5]</text>
  <rect x="138" y="70" width="24" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="88" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">[10,11]</text>
  <rect x="162" y="70" width="84" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="88" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">[12,18]</text>
  <rect x="258" y="70" width="72" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="88" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">[20,25]</text>
  <rect x="378" y="70" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="396" y="88" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">[30,32]</text>

  <!-- number line -->
  <line x1="20" y1="106" x2="430" y2="106" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="30" y="120" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="90" y="120" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">5</text>
  <text x="138" y="120" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">10</text>
  <text x="162" y="120" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">12</text>
  <text x="246" y="120" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">18</text>
  <text x="258" y="120" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">20</text>
  <text x="330" y="120" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">25</text>
  <text x="378" y="120" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">30</text>
  <text x="414" y="120" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">32</text>

  <!-- table header -->
  <rect x="30" y="142" width="500" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="50" y="158" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">l</text>
  <text x="115" y="158" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">[start,end]</text>
  <text x="225" y="158" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">r</text>
  <text x="290" y="158" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">整块 pref[r]-pref[l]</text>
  <text x="410" y="158" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">截断</text>
  <text x="470" y="158" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">cover</text>

  <!-- row 0 -->
  <text x="50" y="180" font-size="10" fill="#666" filter="url(#rough2)">0</text>
  <text x="125" y="180" font-size="10" fill="#666" filter="url(#rough2)">[1,10]</text>
  <text x="225" y="180" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="320" y="180" font-size="10" fill="#446688" filter="url(#rough2)">5</text>
  <text x="420" y="180" font-size="10" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="478" y="180" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- row 1 optimal -->
  <rect x="32" y="188" width="496" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="202" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="125" y="202" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[10,19]</text>
  <text x="225" y="202" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="320" y="202" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="420" y="202" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="478" y="202" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9 ★</text>

  <!-- row 2 optimal -->
  <rect x="32" y="210" width="496" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="224" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="125" y="224" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[12,21]</text>
  <text x="225" y="224" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="320" y="224" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="420" y="224" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="478" y="224" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9 ★</text>

  <!-- row 3 -->
  <text x="50" y="244" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <text x="125" y="244" font-size="10" fill="#666" filter="url(#rough2)">[20,29]</text>
  <text x="225" y="244" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <text x="320" y="244" font-size="10" fill="#446688" filter="url(#rough2)">0</text>
  <text x="420" y="244" font-size="10" fill="#b85450" filter="url(#rough2)">6</text>
  <text x="478" y="244" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- row 4 -->
  <text x="50" y="264" font-size="10" fill="#666" filter="url(#rough2)">4</text>
  <text x="125" y="264" font-size="10" fill="#666" filter="url(#rough2)">[30,39]</text>
  <text x="225" y="264" font-size="10" fill="#666" filter="url(#rough2)">4</text>
  <text x="320" y="264" font-size="10" fill="#446688" filter="url(#rough2)">0</text>
  <text x="420" y="264" font-size="10" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="478" y="264" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">3</text>

  <line x1="30" y1="272" x2="530" y2="272" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <rect x="60" y="290" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">ans = max cover = 9 ✓</text>

  <text x="280" y="346" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">pref = [0, 5, 7, 14, 20, 23]（砖块长 5, 2, 7, 6, 3）</text>
  <text x="280" y="364" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">l=1 时毯子 [10,19]：整块盖 [10,11]→2 + [12,18]→7，右端停在空隙 19</text>
  <text x="280" y="382" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">l=2 时毯子 [12,21]：整块盖 [12,18]→7 + 截断 [20,25] 至 21→2</text>
  <text x="280" y="406" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">两种放法都得 9，题解只需返回最大值</text>
</svg>
