<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：删除集合 = 若干段「和 ≡ 0 (mod k)」的连续段</text>

  <rect x="145" y="30" width="230" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="46" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">示例 2：nums = [3, 1, 4, 1, 5]，k = 3</text>

  <path d="M 173 98 Q 263 42 353 98" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="263" y="66" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">删 [1,4,1]，和 6 ≡ 0 ✓</text>

  <path d="M 113 98 Q 143 58 173 98" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="143" y="72" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">删 [3]，和 3 ≡ 0 ✓</text>

  <rect x="113" y="100" width="54" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="121" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="140" y="136" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">删</text>

  <rect x="173" y="100" width="54" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="121" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="200" y="136" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">删</text>

  <rect x="233" y="100" width="54" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="121" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="260" y="136" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">删</text>

  <rect x="293" y="100" width="54" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="121" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="320" y="136" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">删</text>

  <rect x="353" y="100" width="54" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="380" y="121" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="380" y="136" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">留</text>

  <text x="140" y="158" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0</text>
  <text x="200" y="158" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="260" y="158" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <text x="320" y="158" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <text x="380" y="158" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">4</text>

  <path d="M 105 172 H 415" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 113 167 V 177" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 173 167 V 177" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 233 167 V 177" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 293 167 V 177" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 353 167 V 177" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 407 167 V 177" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="100" y="192" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">前缀和 pre[j]</text>
  <text x="113" y="192" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="173" y="192" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="233" y="192" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="293" y="192" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <text x="353" y="192" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">9</text>
  <text x="407" y="192" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">14</text>

  <text x="100" y="214" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">pre[j] mod 3</text>
  <text x="113" y="214" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="173" y="214" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="233" y="214" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="293" y="214" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="353" y="214" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="407" y="214" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="260" y="234" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">同色 = 同余 ⇒ 夹住的段和 ≡ 0；如 pre[3] ≡ pre[5] ⇒ [1,5]（和 6）也可删，但不最优</text>

  <rect x="35" y="246" width="450" height="98" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="270" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">① 任何一次删除的块都跨不过保留元素（保留者永不消失）</text>
  <text x="260" y="292" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">② ⇒ 删除集合可行 ⟺ 每个极大连续段的段和 ≡ 0 (mod k)（充要）</text>
  <text x="260" y="314" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">③ 问题坍缩为：选保留子序列最小化和，空隙段全 ≡ 0</text>
  <text x="260" y="336" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">④ pre[i] ≡ pre[j] (mod k) ⟺ 段 [j, i) 的和 ≡ 0 —— 前缀和取余配对</text>
</svg>
