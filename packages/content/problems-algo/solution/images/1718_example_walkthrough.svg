<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：n = 3 → [3, 1, 2, 3, 2]</text>

  <!-- index header (repeated for each row) -->
  <g filter="url(#rough2)" font-size="9" fill="#aaa" text-anchor="middle">
    <text x="140" y="58">pos 0</text>
    <text x="200" y="58">1</text>
    <text x="260" y="58">2</text>
    <text x="320" y="58">3</text>
    <text x="380" y="58">4</text>
  </g>

  <!-- ===== Step 1: pos=0, try 3 ===== -->
  <text x="40" y="80" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">① pos=0</text>
  <text x="40" y="94" font-size="9" fill="#888" filter="url(#rough2)">试 3 ✓</text>
  <g filter="url(#rough2)" font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="114" y="70" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4"/>
    <text x="140" y="92" fill="#446688">3</text>
    <rect x="166" y="70" width="52" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="192" y="92" fill="#ccc">_</text>
    <rect x="218" y="70" width="52" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="244" y="92" fill="#ccc">_</text>
    <rect x="270" y="70" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4"/>
    <text x="296" y="92" fill="#446688">3</text>
    <rect x="322" y="70" width="52" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="348" y="92" fill="#ccc">_</text>
  </g>
  <!-- distance arrow for 3 -->
  <path d="M 140 106 L 140 112" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 140 112 L 296 112" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4 2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 296 112 L 296 106" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="218" y="124" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">距离 3 ✓</text>

  <!-- Arrow down -->
  <path d="M 200 130 L 200 142" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: pos=1, try 2 (conflict), try 1 ===== -->
  <text x="40" y="160" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② pos=1</text>
  <text x="40" y="174" font-size="9" fill="#888" filter="url(#rough2)">2✗ 1✓</text>
  <!-- conflict note -->
  <rect x="400" y="150" width="160" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="168" font-size="9" fill="#b85450" filter="url(#rough2)">试 2 → 需放位 1 和 3</text>
  <text x="410" y="178" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">位 3 已被 3 占，冲突！</text>

  <g filter="url(#rough2)" font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="114" y="150" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="140" y="172" fill="#446688">3</text>
    <rect x="166" y="150" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <text x="192" y="172" fill="#4a7a3a">1</text>
    <rect x="218" y="150" width="52" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="244" y="172" fill="#ccc">_</text>
    <rect x="270" y="150" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="296" y="172" fill="#446688">3</text>
    <rect x="322" y="150" width="52" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="348" y="172" fill="#ccc">_</text>
  </g>

  <!-- Arrow down -->
  <path d="M 244 186 L 244 198" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: pos=2, try 2 ===== -->
  <text x="40" y="216" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ pos=2</text>
  <text x="40" y="230" font-size="9" fill="#888" filter="url(#rough2)">试 2 ✓</text>
  <g filter="url(#rough2)" font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="114" y="206" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="140" y="228" fill="#446688">3</text>
    <rect x="166" y="206" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="192" y="228" fill="#4a7a3a">1</text>
    <rect x="218" y="206" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="244" y="228" fill="#d6a040">2</text>
    <rect x="270" y="206" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="296" y="228" fill="#446688">3</text>
    <rect x="322" y="206" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="348" y="228" fill="#d6a040">2</text>
  </g>
  <!-- distance arrow for 2 -->
  <path d="M 244 242 L 244 248" stroke="#d6a040" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 244 248 L 348 248" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4 2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 348 248 L 348 242" stroke="#d6a040" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="296" y="260" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">距离 2 ✓</text>

  <!-- Arrow down -->
  <path d="M 244 266 L 244 278" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: skip filled positions ===== -->
  <text x="40" y="296" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">④⑤⑥</text>
  <text x="40" y="310" font-size="9" fill="#888" filter="url(#rough2)">跳过已填</text>
  <g filter="url(#rough2)" font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="114" y="286" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="140" y="308" fill="#446688">3</text>
    <rect x="166" y="286" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="192" y="308" fill="#4a7a3a">1</text>
    <rect x="218" y="286" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="244" y="308" fill="#d6a040">2</text>
    <rect x="270" y="286" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="296" y="308" fill="#446688">3</text>
    <rect x="322" y="286" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="348" y="308" fill="#d6a040">2</text>
  </g>
  <!-- skip annotations -->
  <text x="296" y="332" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">↑ pos=3 已填 3，跳过</text>
  <text x="348" y="332" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">↑ pos=4 已填 2，跳过</text>

  <!-- Arrow down -->
  <path d="M 244 338 L 244 350" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Result ===== -->
  <rect x="100" y="354" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="250" y="372" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">pos=5 == 2n−1，完成！</text>
  <text x="250" y="390" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[3, 1, 2, 3, 2] ✓</text>

  <!-- ===== Right side: legend ===== -->
  <rect x="420" y="206" width="140" height="92" fill="#f8f8f8" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="430" y="224" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">图例</text>
  <rect x="430" y="232" width="18" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="454" y="244" font-size="9" fill="#555" filter="url(#rough2)">数 5（蓝色系）</text>
  <rect x="430" y="252" width="18" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="454" y="264" font-size="9" fill="#555" filter="url(#rough2)">数 2/3（橙色系）</text>
  <rect x="430" y="272" width="18" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="454" y="284" font-size="9" fill="#555" filter="url(#rough2)">数 1（绿色系）</text>
  <rect x="430" y="292" width="18" height="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="454" y="296" font-size="9" fill="#888" filter="url(#rough2)">空位 _</text>

  <!-- Footer -->
  <text x="290" y="430" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">全程无回溯——贪心选 3 在位 0 即通向合法解，字典序自然最大</text>
</svg>
