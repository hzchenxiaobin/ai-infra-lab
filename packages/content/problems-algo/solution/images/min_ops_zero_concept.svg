<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：连续的 1 段用 +1 进位合并更省</text>

  <!-- top binary: ... 0 1 1 1 0 ... -->
  <text x="135" y="92" text-anchor="middle" font-size="16" fill="#888" filter="url(#rough2)">⋯</text>
  <g filter="url(#rough2)">
    <rect x="158" y="70" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="175" y="93" text-anchor="middle" font-size="15" fill="#333">0</text>
    <rect x="196" y="70" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="213" y="93" text-anchor="middle" font-size="15" fill="#333">1</text>
    <rect x="234" y="70" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="251" y="93" text-anchor="middle" font-size="15" fill="#333">1</text>
    <rect x="272" y="70" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="289" y="93" text-anchor="middle" font-size="15" fill="#333">1</text>
    <rect x="310" y="70" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="327" y="93" text-anchor="middle" font-size="15" fill="#333">0</text>
  </g>
  <text x="362" y="92" text-anchor="middle" font-size="16" fill="#888" filter="url(#rough2)">⋯</text>
  <text x="251" y="124" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">连续 1 段（长度 3）</text>

  <!-- diverging arrows -->
  <path d="M251,132 Q200,145 110,150" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M251,132 Q302,145 410,150" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- left column: 逐位减 -->
  <rect x="40" y="150" width="140" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="170" text-anchor="middle" font-size="13" fill="#b85450">策略 A：逐位减</text>
  <text x="110" y="202" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−2⁰ −2¹ −2²</text>
  <rect x="50" y="215" width="120" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="235" text-anchor="middle" font-size="13" fill="#b85450">3 次操作</text>

  <!-- right column: 进位合并 -->
  <rect x="340" y="150" width="140" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="170" text-anchor="middle" font-size="13" fill="#4a7a3a">策略 B：+2⁰ 进位</text>
  <!-- mini binary 1 0 0 0 0 -->
  <g filter="url(#rough2)">
    <rect x="342" y="186" width="24" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="354" y="203" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="370" y="186" width="24" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="382" y="203" text-anchor="middle" font-size="13" fill="#888">0</text>
    <rect x="398" y="186" width="24" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="410" y="203" text-anchor="middle" font-size="13" fill="#888">0</text>
    <rect x="426" y="186" width="24" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="438" y="203" text-anchor="middle" font-size="13" fill="#888">0</text>
    <rect x="454" y="186" width="24" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="466" y="203" text-anchor="middle" font-size="13" fill="#888">0</text>
  </g>
  <text x="410" y="228" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">整段合并成单个高位 1</text>
  <rect x="350" y="238" width="120" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="258" text-anchor="middle" font-size="13" fill="#4a7a3a">1 进位 + 1 清位 = 2 次</text>

  <!-- bottom note -->
  <rect x="50" y="292" width="420" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="313" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">口诀：孤立 1（两边是 0）直接减 = 1 次；</text>
  <text x="260" y="330" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">连续段（长度 ≥ 2）用 +1 进位合并 = 2 次</text>
</svg>
