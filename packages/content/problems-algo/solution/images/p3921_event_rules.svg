<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">九种事件 → 三类规则</text>

  <rect x="60" y="46" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="83" y="66" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"1"</text>
  <rect x="116" y="46" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="139" y="66" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"4"</text>
  <rect x="172" y="46" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="66" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"6"</text>

  <rect x="240" y="46" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="263" y="66" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"W"</text>

  <rect x="308" y="46" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="331" y="66" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"WD"</text>
  <rect x="364" y="46" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="387" y="66" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"NB"</text>

  <path d="M 130 84 C 110 105, 100 120, 96 140" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 263 84 C 263 105, 261 120, 260 140" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 360 84 C 385 105, 400 120, 410 140" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="22" y="146" width="150" height="96" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="97" y="170" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">得分球</text>
  <text x="97" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"0"~"4" "6"</text>
  <text x="97" y="218" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">score += 数字</text>

  <rect x="185" y="146" width="150" height="96" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="170" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">"W" 出局球</text>
  <text x="260" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">不加分</text>
  <text x="260" y="218" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">counter += 1</text>

  <rect x="348" y="146" width="150" height="96" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="423" y="170" text-anchor="middle" font-size="13.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">"WD" / "NB"</text>
  <text x="423" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">罚分球</text>
  <text x="423" y="218" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">score += 1</text>

  <rect x="80" y="272" width="360" height="66" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">counter 变为 10 → 立即停止</text>
  <text x="260" y="322" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">剩余事件全部忽略，返回 [score, counter]</text>
</svg>
