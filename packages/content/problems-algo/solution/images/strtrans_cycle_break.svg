<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="290" y="26" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">环依赖：需要「空闲字符」破环</text>
  <text x="290" y="46" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">映射成环时，无空闲字符则死锁；有空闲字符则可逐步拆环</text>

  <!-- ============ 上半：有环无空闲 → 死锁 ============ -->
  <rect x="20" y="60" width="540" height="170" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.3"/>
  <text x="290" y="82" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">str2 用满 26 字母 → 无空闲 → 成环必死锁</text>

  <!-- 环 a→b→c→a -->
  <!-- 节点 a -->
  <circle cx="150" cy="140" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="146" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <!-- 节点 b -->
  <circle cx="290" cy="140" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="146" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <!-- 节点 c -->
  <circle cx="430" cy="140" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="430" y="146" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>

  <!-- 环箭头 a→b -->
  <path d="M 178 132 Q 220 120 262 132" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="220" y="118" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">a→b</text>
  <!-- b→c -->
  <path d="M 318 132 Q 360 120 402 132" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="360" y="118" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">b→c</text>
  <!-- c→a (弧线下方绕回) -->
  <path d="M 430 168 Q 290 220 150 168" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="290" y="210" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">c→a</text>

  <!-- 死锁说明 -->
  <rect x="80" y="190" width="420" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="290" y="210" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">先做任一转换（如 a→b）都会污染 b → 后续无法还原 → return false</text>

  <!-- ============ 下半：有环+空闲 → 可拆 ============ -->
  <rect x="20" y="244" width="540" height="200" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.3"/>
  <text x="290" y="266" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">str2 未用满 26 字母 → 有空闲 x → 逐步拆环</text>

  <!-- 步骤1: a→x -->
  <rect x="36" y="284" width="110" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="91" y="304" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">步骤 1</text>
  <text x="91" y="324" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a → x</text>
  <text x="91" y="342" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">a 暂存到 x</text>
  <text x="91" y="354" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">x 不在 str2</text>

  <!-- 箭头 -->
  <line x1="148" y1="320" x2="170" y2="320" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤2: c→a -->
  <rect x="174" y="284" width="110" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="229" y="304" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">步骤 2</text>
  <text x="229" y="324" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c → a</text>
  <text x="229" y="342" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">c 归位到 a</text>
  <text x="229" y="354" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">a 已腾空 ✓</text>

  <!-- 箭头 -->
  <line x1="286" y1="320" x2="308" y2="320" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤3: b→c -->
  <rect x="312" y="284" width="110" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="367" y="304" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">步骤 3</text>
  <text x="367" y="324" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b → c</text>
  <text x="367" y="342" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">b 归位到 c</text>
  <text x="367" y="354" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">c 已腾空 ✓</text>

  <!-- 箭头 -->
  <line x1="424" y1="320" x2="446" y2="320" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤4: x→b -->
  <rect x="450" y="284" width="110" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="505" y="304" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">步骤 4</text>
  <text x="505" y="324" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x → b</text>
  <text x="505" y="342" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">x 归位到 b</text>
  <text x="505" y="354" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">b 已腾空 ✓</text>

  <!-- 拆环后示意 -->
  <text x="290" y="380" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">逆拓扑序 + 空闲字符断环：每步转换前目标字符已腾空，不会被污染</text>

  <!-- 结论框 -->
  <rect x="60" y="398" width="460" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="412" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">有空闲字符：任何环都能拆 → 只要映射合法即 return true</text>
  <text x="290" y="428" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">str2 用满 26 字母且 str1≠str2 → 双射非恒等必有环 → 无空闲 → return false</text>
</svg>
