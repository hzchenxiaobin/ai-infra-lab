<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：双单调队列滑窗，每个 r 累加 r−l+1</text>

  <!-- 初始化 -->
  <g filter="url(#rough2)">
    <rect x="170" y="34" width="220" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="280" y="54" text-anchor="middle" font-size="11" fill="#33506b">初始化：l = 0，ans = 0，两队列空</text>
  </g>
  <path d="M 280 66 L 280 80" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- r 右移 -->
  <g filter="url(#rough2)">
    <rect x="170" y="82" width="220" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="101" text-anchor="middle" font-size="11" fill="#33506b">r 右移一格（r = 0 … n−1）</text>
  </g>
  <path d="M 280 112 L 280 126" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 入双单调队列 -->
  <g filter="url(#rough2)">
    <rect x="140" y="128" width="280" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="147" text-anchor="middle" font-size="10" fill="#33506b">nums[r] 入 maxDq：弹队尾值 ≤ nums[r] 的下标</text>
    <text x="280" y="165" text-anchor="middle" font-size="10" fill="#33506b">对称入 minDq：弹队尾值 ≥ nums[r] 的下标</text>
  </g>
  <path d="M 230 176 L 230 190" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <g filter="url(#rough2)">
    <polygon points="230,192 345,228 230,264 115,228" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="230" y="224" text-anchor="middle" font-size="12.5" fill="#8a6d1a" font-weight="bold">开销 &gt; k ?</text>
    <text x="230" y="242" text-anchor="middle" font-size="9.5" fill="#8a6d1a">(maxDq头 − minDq头) × (r−l+1)</text>
  </g>

  <!-- 是：收缩 -->
  <text x="243" y="279" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 230 264 L 230 282" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="155" y="284" width="175" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="242" y="300" text-anchor="middle" font-size="9.5" fill="#8a3030">队头下标 == l ⇒ 弹出（两队列各自判）</text>
    <text x="242" y="316" text-anchor="middle" font-size="11" fill="#8a3030" font-weight="bold">l ← l + 1</text>
  </g>
  <path d="M 155 304 L 90 304 L 90 228 L 113 228" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="72" y="260" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">重判</text>

  <!-- 否：计数 -->
  <text x="360" y="219" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 345 228 L 383 228" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="385" y="212" width="140" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="455" y="232" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">ans += r − l + 1</text>
  </g>

  <!-- 外层循环：下一个 r -->
  <path d="M 455 244 L 455 342 L 70 342 L 70 97 L 166 97" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="6,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="255" y="336" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">下一个 r</text>

  <!-- 右上：易错点提示框 -->
  <g filter="url(#rough2)">
    <rect x="428" y="44" width="122" height="96" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="489" y="62" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold">⚠ 两个易错点</text>
    <text x="489" y="79"  text-anchor="middle" font-size="9" fill="#8a6d1a">中间量 ~10¹⁴</text>
    <text x="489" y="93"  text-anchor="middle" font-size="9" fill="#8a6d1a">乘法前转 long long</text>
    <text x="489" y="107" text-anchor="middle" font-size="9" fill="#8a6d1a">单元素窗口开销 0</text>
    <text x="489" y="121" text-anchor="middle" font-size="9" fill="#8a6d1a">⇒ 收缩必停，l ≤ r</text>
    <text x="489" y="135" text-anchor="middle" font-size="9" fill="#8a6d1a">答案 ~5×10⁹ 亦超 int</text>
  </g>
</svg>
