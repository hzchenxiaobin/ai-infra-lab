<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">投影分解：两轴投影均相交才算重叠</text>

  <!-- Panel (a): both axes overlap -->
  <text x="100" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">(a) 两轴都相交 ✓</text>
  <rect x="50" y="170" width="70" height="60" fill="#e8f0fe" fill-opacity="0.7" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="95" y="130" width="70" height="60" fill="#e6f4ea" fill-opacity="0.7" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="95" y="170" width="25" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="107" y="184" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">重叠</text>
  <text x="56" y="166" font-size="10" fill="#446688" filter="url(#rough2)">rec1</text>
  <text x="148" y="126" font-size="10" fill="#4a7a3a" filter="url(#rough2)">rec2</text>
  <line x1="40" y1="240" x2="170" y2="240" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="174" y="244" font-size="10" fill="#999" filter="url(#rough2)">x</text>

  <!-- Panel (b): x-disjoint -->
  <text x="280" y="56" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">(b) x 投影不相交 ✗</text>
  <rect x="225" y="150" width="55" height="70" fill="#e8f0fe" fill-opacity="0.7" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="305" y="130" width="55" height="70" fill="#e6f4ea" fill-opacity="0.7" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="232" y="146" font-size="10" fill="#446688" filter="url(#rough2)">rec1</text>
  <text x="312" y="126" font-size="10" fill="#4a7a3a" filter="url(#rough2)">rec2</text>
  <line x1="210" y1="240" x2="370" y2="240" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="374" y="244" font-size="10" fill="#999" filter="url(#rough2)">x</text>
  <line x1="282" y1="200" x2="303" y2="200" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="292" y="216" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">x 间隙</text>

  <!-- Panel (c): y-disjoint -->
  <text x="460" y="56" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">(c) y 投影不相交 ✗</text>
  <rect x="410" y="120" width="70" height="40" fill="#e8f0fe" fill-opacity="0.7" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="440" y="190" width="70" height="40" fill="#e6f4ea" fill-opacity="0.7" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="418" y="116" font-size="10" fill="#446688" filter="url(#rough2)">rec1</text>
  <text x="448" y="186" font-size="10" fill="#4a7a3a" filter="url(#rough2)">rec2</text>
  <line x1="400" y1="105" x2="400" y2="245" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="394" y="102" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">y</text>
  <line x1="475" y1="162" x2="475" y2="188" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="492" y="178" font-size="9" fill="#b85450" filter="url(#rough2)">y 间隙</text>

  <!-- Formula box -->
  <rect x="30" y="280" width="500" height="82" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">矩形重叠 ⇔ x 投影相交 ∧ y 投影相交</text>
  <text x="280" y="332" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">rec1[0] &lt; rec2[2]  ∧  rec2[0] &lt; rec1[2]</text>
  <text x="280" y="352" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">∧  rec1[1] &lt; rec2[3]  ∧  rec2[1] &lt; rec1[3]</text>
</svg>
