<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="430" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：答案 = 误差轮廓「起伏总量」的一半</text>
  <text x="290" y="40" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">d 两端接哨兵 0，取所有相邻差的绝对值求和，再除以 2</text>

  <!-- Panel A: 示例 1 -->
  <rect x="22" y="52" width="536" height="212" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 示例 1：nums = [3,5,1,2]，target = [4,6,2,4] → d = [−1, −1, −1, −2]</text>

  <text x="88" y="102" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">d =</text>
  <rect x="96" y="84" width="36" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="114" y="103" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="138" y="84" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="103" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="182" y="84" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="103" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="226" y="84" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="103" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="270" y="84" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="103" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">−2</text>
  <rect x="314" y="84" width="36" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="332" y="103" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>

  <text x="366" y="92" font-size="9.5" fill="#888" filter="url(#rough2)">（虚线 = 两端</text>
  <text x="366" y="106" font-size="9.5" fill="#888" filter="url(#rough2)">的哨兵 0）</text>

  <path d="M 135 116 L 135 128" fill="none" stroke="#666" stroke-width="1.1" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 181 116 L 181 128" fill="none" stroke="#666" stroke-width="1.1" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 225 116 L 225 128" fill="none" stroke="#666" stroke-width="1.1" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 269 116 L 269 128" fill="none" stroke="#666" stroke-width="1.1" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 313 116 L 313 128" fill="none" stroke="#666" stroke-width="1.1" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="108" y="146" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">|Δd| =</text>
  <rect x="118" y="132" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="150" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="164" y="132" width="36" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="182" y="150" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="210" y="132" width="36" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="150" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="256" y="132" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="274" y="150" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="302" y="132" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="150" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="420" y="150" font-size="10.5" fill="#555" filter="url(#rough2)">1 = |−1 − 0|，</text>
  <text x="420" y="164" font-size="10.5" fill="#555" filter="url(#rough2)">2 = |0 − (−2)| …</text>

  <text x="290" y="188" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">Σ|e| = 1+0+0+1+2 = 4 → 答案 = 4 / 2 = 2 ✓</text>

  <text x="290" y="212" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">逐位单点修正要 Σ|d| = 5 次；前三个 −1 打包成一次 [0..3]+1、再补一次 [3..3]+1 —— 只花 2 次</text>
  <text x="290" y="230" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">轮廓平缓（连续同向）→ 相邻差大量为 0 → 打包空间大</text>

  <!-- Panel B: 示例 2 -->
  <rect x="22" y="276" width="536" height="112" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="296" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 示例 2：d = [−1, 2, −2]，误差符号交错</text>

  <text x="88" y="326" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">d =</text>
  <rect x="96" y="308" width="36" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="114" y="326" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="138" y="308" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="326" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="182" y="308" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="326" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="226" y="308" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="326" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">−2</text>
  <rect x="270" y="308" width="36" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="288" y="326" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>

  <text x="108" y="364" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">|Δd| =</text>
  <rect x="118" y="348" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="366" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="164" y="348" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="366" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="210" y="348" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="366" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="256" y="348" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="274" y="366" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="420" y="356" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">Σ|e| = 1+3+4+2 = 10 → 5</text>
  <text x="420" y="374" font-size="10" fill="#888" filter="url(#rough2)">正负交替，无区间可共享</text>

  <text x="290" y="412" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">此时答案退化为 Σ|d| = 5（每个位置只能单点伺候）—— 两个示例恰好展示打包收益的两个极端</text>
</svg>
