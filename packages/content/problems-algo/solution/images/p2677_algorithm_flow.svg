<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：步长 size 遍历，每步切一刀</text>

  <!-- Start -->
  <rect x="220" y="46" width="160" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="72" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">输入 arr, size</text>

  <path d="M 300 90 L 300 110" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="200" y="114" width="200" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="134" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">res = [];  i = 0</text>
  <text x="300" y="150" text-anchor="middle" font-size="10" fill="#888">空结果数组，游标归零</text>

  <path d="M 300 162 L 300 182" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- While condition (diamond) -->
  <polygon points="300,186 400,230 300,274 200,230" fill="#fff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="226" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">i &lt; arr.length ?</text>
  <text x="300" y="244" text-anchor="middle" font-size="10" fill="#888">还有元素没切？</text>

  <!-- Yes branch -->
  <path d="M 400 230 L 440 230" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Slice + push -->
  <rect x="440" y="200" width="150" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="515" y="222" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">res.push(</text>
  <text x="515" y="238" text-anchor="middle" font-size="11" fill="#333">arr.slice(i, i+size)</text>
  <text x="515" y="254" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">)</text>

  <!-- i += size -->
  <path d="M 515 262 L 515 296 L 300 296 L 300 274" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="340" y="282" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="300" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">i += size</text>

  <!-- No branch -->
  <path d="M 300 274 L 300 330" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="312" y="306" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- Return -->
  <rect x="210" y="334" width="180" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="362" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">return res</text>

  <!-- bottom note -->
  <rect x="60" y="392" width="480" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="300" y="406" text-anchor="middle" font-size="11" fill="#888">Array.from 写法等价：用 Math.ceil(n/size) 算块数，一次生成</text>
</svg>
