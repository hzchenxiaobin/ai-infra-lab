<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums=[3,1,2,2,2,1,3], k=2</text>

  <!-- ===== Step 1: group by value ===== -->
  <text x="28" y="50" font-size="10.5" fill="#666">按值分桶：</text>

  <!-- bucket value=1: [1,5] -->
  <rect x="100" y="38" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="112" y="58" font-size="11" fill="#333">值 1 → [1, 5]</text>
  <!-- bucket value=2: [2,3,4] -->
  <rect x="232" y="38" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="244" y="58" font-size="11" fill="#333">值 2 → [2, 3, 4]</text>
  <!-- bucket value=3: [0,6] -->
  <rect x="384" y="38" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="396" y="58" font-size="11" fill="#333">值 3 → [0, 6]</text>

  <!-- ===== Table header ===== -->
  <rect x="20" y="84" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="102" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">值</text>
  <rect x="100" y="84" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="102" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">数对 (i,j)</text>
  <rect x="200" y="84" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="102" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">i · j</text>
  <rect x="300" y="84" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="102" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">(i·j) % 2</text>
  <rect x="400" y="84" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="102" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">计入?</text>

  <!-- ===== Row 1: value 1, pair (1,5) ===== -->
  <rect x="20" y="112" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="130" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="100" y="112" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="130" text-anchor="middle" font-size="10.5" fill="#333">(1, 5)</text>
  <rect x="200" y="112" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="130" text-anchor="middle" font-size="10.5" fill="#333">5</text>
  <rect x="300" y="112" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="130" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="400" y="112" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="130" text-anchor="middle" font-size="10.5" fill="#b85450">✗ 否</text>

  <!-- ===== Row 2: value 2, pair (2,3) ===== -->
  <rect x="20" y="140" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="158" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="100" y="140" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="158" text-anchor="middle" font-size="10.5" fill="#333">(2, 3)</text>
  <rect x="200" y="140" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="158" text-anchor="middle" font-size="10.5" fill="#333">6</text>
  <rect x="300" y="140" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="158" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <rect x="400" y="140" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="158" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓ 是</text>

  <!-- ===== Row 3: value 2, pair (2,4) ===== -->
  <rect x="20" y="168" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="186" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="100" y="168" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="186" text-anchor="middle" font-size="10.5" fill="#333">(2, 4)</text>
  <rect x="200" y="168" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="186" text-anchor="middle" font-size="10.5" fill="#333">8</text>
  <rect x="300" y="168" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="186" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <rect x="400" y="168" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="186" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓ 是</text>

  <!-- ===== Row 4: value 2, pair (3,4) ===== -->
  <rect x="20" y="196" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="214" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="100" y="196" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="214" text-anchor="middle" font-size="10.5" fill="#333">(3, 4)</text>
  <rect x="200" y="196" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="214" text-anchor="middle" font-size="10.5" fill="#333">12</text>
  <rect x="300" y="196" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="214" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <rect x="400" y="196" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="214" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓ 是</text>

  <!-- ===== Row 5: value 3, pair (0,6) ===== -->
  <rect x="20" y="224" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="242" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <rect x="100" y="224" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="242" text-anchor="middle" font-size="10.5" fill="#333">(0, 6)</text>
  <rect x="200" y="224" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="242" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <rect x="300" y="224" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="242" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <rect x="400" y="224" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="242" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓ 是</text>

  <!-- ===== Summary ===== -->
  <rect x="40" y="270" width="460" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="290" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">同值数对共 5 对，其中 4 对满足 (i·j) % 2 == 0</text>
  <text x="270" y="308" text-anchor="middle" font-size="10.5" fill="#555">ans = 0 + 0 + 1 + 1 + 1 + 1 = 4 ✓</text>

  <!-- ===== Key observation ===== -->
  <rect x="40" y="332" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="352" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">关键观察</text>
  <text x="270" y="370" text-anchor="middle" font-size="10" fill="#555">i=0 时 0·j=0 恒被任何 k 整除 → 含下标 0 的同值对必计入</text>
  <text x="270" y="384" text-anchor="middle" font-size="10" fill="#555">k=1 时所有同值对都满足（任何数被 1 整除），但仍需值相等</text>
</svg>
