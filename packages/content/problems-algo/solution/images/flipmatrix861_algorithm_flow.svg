<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：第 0 列直接计入，逐列统计有效 1 取 max 累加</text>

  <!-- Start -->
  <rect x="220" y="42" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="280" y="63" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>
  <path d="M 280 74 L 280 96" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ans = m * 2^(n-1) -->
  <rect x="140" y="98" width="280" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="117" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans = m × 2^(n−1)</text>
  <text x="280" y="133" text-anchor="middle" font-size="11" fill="#4a7a3a">（第 0 列：行翻后每行首位为 1）</text>
  <path d="M 280 140 L 280 158" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- j = 1 -->
  <rect x="210" y="160" width="140" height="32" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="181" text-anchor="middle" font-size="12" fill="#333">j = 1</text>
  <path d="M 280 192 L 280 212" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: j <= n-1 ? -->
  <path d="M 280 214 L 372 254 L 280 294 L 188 254 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">j ≤ n−1 ?</text>
  <text x="280" y="268" text-anchor="middle" font-size="10" fill="#888">（列未处理完）</text>

  <!-- No branch to return -->
  <path d="M 372 254 L 460 254 L 460 500" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="246" font-size="11" fill="#888">否</text>
  <rect x="400" y="500" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="460" y="521" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 ans</text>

  <!-- Yes branch down -->
  <path d="M 280 294 L 280 316" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="310" font-size="11" fill="#888">是</text>

  <!-- count ones box -->
  <rect x="110" y="318" width="340" height="48" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#333">遍历每行 i：grid[i][0]==1 ? grid[i][j] : grid[i][j]⊕1</text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#446688">累加得该列有效 1 的个数 ones</text>
  <path d="M 280 366 L 280 386" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- k = max -->
  <rect x="170" y="388" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="410" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">k = max(ones, m−ones)</text>
  <path d="M 280 422 L 280 442" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ans += -->
  <rect x="160" y="444" width="240" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="466" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans += k × 2^(n−1−j)</text>
  <path d="M 280 478 L 280 498" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- j++ -->
  <rect x="220" y="500" width="120" height="32" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="521" text-anchor="middle" font-size="12" fill="#333">j++</text>

  <!-- loop back arrow -->
  <path d="M 220 516 L 60 516 L 60 254 L 188 254" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="390" font-size="10" fill="#888" transform="rotate(-90 48 390)">回到列判断</text>
</svg>
