<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：双指针逐字符判定</text>

  <!-- 起点 -->
  <rect x="220" y="42" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="280" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">i = 0, j = 0</text>

  <!-- 循环条件 -->
  <path d="M 280 74 L 280 92" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="280,94 380,128 280,162 180,128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">j &lt; len(typed)?</text>
  <text x="280" y="140" text-anchor="middle" font-size="10" fill="#888">typed 还有字符待处理</text>

  <!-- 否分支 -> 结尾判定 -->
  <path d="M 380 128 L 470 128 L 470 230" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="120" font-size="10" fill="#888" font-weight="bold">否</text>

  <!-- 是分支向下 -->
  <path d="M 280 162 L 280 182" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="178" font-size="10" fill="#888" font-weight="bold">是</text>

  <!-- 判定1: name[i]==typed[j] -->
  <polygon points="280,184 400,220 280,256 160,220" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i&lt;n 且 name[i]==typed[j]?</text>
  <text x="280" y="232" text-anchor="middle" font-size="10" fill="#888">匹配 name 当前字符</text>

  <!-- 是 -> i++,j++ -->
  <path d="M 280 256 L 280 280" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="288" y="274" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="220" y="282" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="303" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i++, j++</text>

  <!-- 否 -> 判定2 -->
  <path d="M 160 220 L 100 220 L 100 300" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="212" font-size="10" fill="#888" font-weight="bold">否</text>
  <polygon points="100,302 200,338 100,374 0,338" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="334" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">j&gt;0 且 typed[j]==</text>
  <text x="100" y="348" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">typed[j-1]?</text>

  <!-- 是 -> j++（长按） -->
  <path d="M 100 374 L 100 398" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="108" y="392" font-size="10" fill="#d6a040" font-weight="bold">是</text>
  <rect x="40" y="400" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="100" y="421" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">仅 j++（长按）</text>

  <!-- 否 -> return false -->
  <path d="M 200 338 L 280 338 L 280 360" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="230" y="330" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="220" y="362" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="383" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return false</text>

  <!-- 回到循环：i++,j++ 与 j++ 都回到循环顶部 -->
  <path d="M 340 298 L 470 298 L 470 128 L 380 128" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 160 416 L 470 416 L 470 128" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="430" y="290" font-size="9.5" fill="#888">回循环</text>

  <!-- 结尾判定 -->
  <rect x="400" y="200" width="140" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="470" y="220" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">return i == n</text>
  <text x="470" y="236" text-anchor="middle" font-size="10" fill="#888">name 必须全部消费完</text>

  <!-- 终点 true -->
  <path d="M 470 244 L 470 268" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="410" y="270" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="470" y="290" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">true / false</text>

  <!-- 底部说明 -->
  <rect x="30" y="320" width="160" height="74" fill="none" stroke="none"/>
  <text x="110" y="448" text-anchor="middle" font-size="9.5" fill="#aaa">长按分支只 j++，不消费 name</text>
</svg>
