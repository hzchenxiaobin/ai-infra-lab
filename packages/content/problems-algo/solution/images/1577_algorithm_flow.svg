<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="520" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：建频率表 → 两类对称计数 → 求和</text>

  <!-- ===== 步骤1：建频率表 ===== -->
  <rect x="60" y="46" width="460" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="290" y="64" text-anchor="middle" font-size="12" fill="#333">① 遍历 nums1 / nums2，建频率表 cnt1、cnt2</text>
  <text x="290" y="80" text-anchor="middle" font-size="10" fill="#888">值 → 出现次数，合并同值下标</text>
  <path d="M 290 88 L 290 98" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 分两路：类型1 / 类型2 ===== -->
  <!-- 类型1 -->
  <rect x="40" y="104" width="250" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="165" y="127" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② 类型 1：A=cnt1, B=cnt2</text>

  <!-- 类型2 -->
  <rect x="310" y="104" width="250" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="435" y="127" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③ 类型 2：A=cnt2, B=cnt1</text>

  <path d="M 165 142 L 165 152" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 435 142 L 435 152" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 类型1 内部流程（左列） ===== -->
  <rect x="40" y="158" width="250" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="165" y="180" text-anchor="middle" font-size="11" fill="#333">for 每个 (v, f_v) in cntA：</text>

  <path d="M 165 194 L 165 204" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="210" width="250" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="165" y="232" text-anchor="middle" font-size="11" fill="#333">target = v × v  （long long）</text>

  <path d="M 165 246 L 165 256" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 内层循环 -->
  <polygon points="165,260 270,300 165,340 60,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="165" y="296" text-anchor="middle" font-size="11" fill="#333">for a in cntB：</text>
  <text x="165" y="312" text-anchor="middle" font-size="10" fill="#888">target % a == 0?</text>

  <!-- 是 → b = target/a -->
  <path d="M 270 300 L 290 300" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="294" text-anchor="middle" font-size="9" fill="#4a7a3a">是</text>

  <rect x="290" y="284" width="0" height="0" fill="none"/>

  <!-- 三分支判定 a vs b -->
  <rect x="60" y="352" width="210" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="165" y="374" text-anchor="middle" font-size="11" fill="#333">a &lt; b → +f_v·c_a·c_b</text>

  <path d="M 165 340 L 165 352" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="392" width="210" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="165" y="414" text-anchor="middle" font-size="11" fill="#333">a = b → +f_v·C(c_a,2)</text>

  <rect x="60" y="432" width="210" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="165" y="452" text-anchor="middle" font-size="10" fill="#888">a &gt; b → 跳过（去重）</text>

  <!-- 类型2 标注对称 -->
  <text x="435" y="200" text-anchor="middle" font-size="11" fill="#888">（流程与左侧完全一致，</text>
  <text x="435" y="216" text-anchor="middle" font-size="11" fill="#888"> 仅 cntA / cntB 互换）</text>
  <rect x="320" y="240" width="230" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="435" y="262" text-anchor="middle" font-size="11" fill="#d6a040">对 cnt2 中每个 (v, f_v)：</text>
  <text x="435" y="278" text-anchor="middle" font-size="11" fill="#333">target = v²</text>
  <text x="435" y="294" text-anchor="middle" font-size="11" fill="#333">在 cnt1 中因数配对计数</text>

  <rect x="320" y="352" width="230" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="435" y="376" text-anchor="middle" font-size="11" fill="#333">同样的 a vs b 三分支</text>
  <text x="435" y="394" text-anchor="middle" font-size="11" fill="#333">累加 f_v × pairs</text>

  <!-- ===== 汇总 ===== -->
  <path d="M 165 462 L 165 478 L 290 478" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 435 412 L 435 478 L 290 478" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="482" width="340" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="503" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">④ return 类型1 + 类型2</text>
</svg>
