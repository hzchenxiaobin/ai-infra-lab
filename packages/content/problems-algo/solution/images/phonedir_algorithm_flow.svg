<svg xmlns="http://www.w3.org/2000/svg" width="860" height="620" viewBox="0 0 860 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="ary" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="860" height="620" fill="#fdfcf7"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">三操作流程：get · check · release</text>
  <path d="M 280 46 Q 430 54 580 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Column 1: get() ===== -->
  <g filter="url(#sk)"><rect x="40" y="74" width="240" height="500" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="160" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">get()</text>
  <text x="160" y="118" text-anchor="middle" font-size="10.5" fill="#5a7a9e">取一个可用号码</text>

  <!-- recycled 非空? -->
  <g filter="url(#sk)"><path d="M 160 140 L 210 175 L 160 210 L 110 175 Z" fill="#fff" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="160" y="172" text-anchor="middle" font-size="10.5" fill="#2b2b2b">recycled</text>
  <text x="160" y="186" text-anchor="middle" font-size="10.5" fill="#2b2b2b">非空?</text>
  <text x="100" y="178" text-anchor="middle" font-size="10" fill="#2e6e2e">是</text>
  <text x="220" y="178" text-anchor="middle" font-size="10" fill="#b03a3a">否</text>

  <!-- 是分支 -->
  <g filter="url(#sk)"><rect x="60" y="226" width="80" height="50" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="100" y="246" text-anchor="middle" font-size="10" fill="#2e6e2e">n=队首</text>
  <text x="100" y="260" text-anchor="middle" font-size="10" fill="#2e6e2e">recycled.pop</text>
  <g filter="url(#sk)"><rect x="60" y="284" width="80" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="100" y="302" text-anchor="middle" font-size="10" fill="#2e6e2e">used[n]=T</text>
  <text x="100" y="318" text-anchor="middle" font-size="10" fill="#2e6e2e">return n</text>
  <path d="M 110 210 L 100 226" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 100 276 L 100 284" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 否分支 -->
  <g filter="url(#sk)"><path d="M 200 226 L 240 252 L 200 278 L 160 252 Z" fill="#fff" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="200" y="248" text-anchor="middle" font-size="10" fill="#2b2b2b">next&lt;</text>
  <text x="200" y="262" text-anchor="middle" font-size="10" fill="#2b2b2b">maxN?</text>
  <text x="160" y="240" text-anchor="middle" font-size="10" fill="#2e6e2e">是</text>
  <text x="240" y="240" text-anchor="middle" font-size="10" fill="#b03a3a">否</text>
  <path d="M 210 210 L 200 226" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 是 -->
  <g filter="url(#sk)"><rect x="160" y="294" width="80" height="50" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="200" y="312" text-anchor="middle" font-size="10" fill="#2e6e2e">n=next</text>
  <text x="200" y="326" text-anchor="middle" font-size="10" fill="#2e6e2e">next+=1</text>
  <g filter="url(#sk)"><rect x="160" y="352" width="80" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="200" y="370" text-anchor="middle" font-size="10" fill="#2e6e2e">used[n]=T</text>
  <text x="200" y="386" text-anchor="middle" font-size="10" fill="#2e6e2e">return n</text>
  <path d="M 200 278 L 200 294" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 200 344 L 200 352" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 否 -->
  <g filter="url(#sk)"><rect x="160" y="412" width="80" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="200" y="430" text-anchor="middle" font-size="10" fill="#b03a3a">return -1</text>
  <text x="200" y="446" text-anchor="middle" font-size="9.5" fill="#888">全部已分配</text>
  <path d="M 240 252 L 260 252 L 260 432 L 240 432" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#ary)" filter="url(#sk)"/>

  <!-- 关键提示 -->
  <g filter="url(#sk)"><rect x="50" y="478" width="220" height="80" rx="6" fill="#fff" stroke="#c98a2b" stroke-width="1.2" stroke-dasharray="3 2"/></g>
  <text x="160" y="498" text-anchor="middle" font-size="10.5" fill="#7a5415" font-weight="bold">⚠ 顺序敏感</text>
  <text x="160" y="516" text-anchor="middle" font-size="10" fill="#555">先看回收队列</text>
  <text x="160" y="532" text-anchor="middle" font-size="10" fill="#555">再推进游标</text>
  <text x="160" y="548" text-anchor="middle" font-size="9.5" fill="#888">否则游标到顶会假耗尽</text>

  <!-- ===== Column 2: check() ===== -->
  <g filter="url(#sk)"><rect x="310" y="74" width="240" height="500" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="430" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">check(number)</text>
  <text x="430" y="118" text-anchor="middle" font-size="10.5" fill="#4a7a3a">号码是否可用</text>

  <!-- 范围检查 -->
  <g filter="url(#sk)"><path d="M 430 150 L 490 185 L 430 220 L 370 185 Z" fill="#fff" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="430" y="180" text-anchor="middle" font-size="10" fill="#2b2b2b">0≤n&lt;maxN?</text>
  <text x="370" y="188" text-anchor="middle" font-size="10" fill="#2e6e2e">是</text>
  <text x="490" y="188" text-anchor="middle" font-size="10" fill="#b03a3a">否</text>

  <!-- 是分支：查 used -->
  <g filter="url(#sk)"><path d="M 430 240 L 490 275 L 430 310 L 370 275 Z" fill="#fff" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="430" y="270" text-anchor="middle" font-size="10" fill="#2b2b2b">used[n]==F?</text>
  <text x="370" y="278" text-anchor="middle" font-size="10" fill="#2e6e2e">是</text>
  <text x="490" y="278" text-anchor="middle" font-size="10" fill="#b03a3a">否</text>
  <path d="M 430 220 L 430 240" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="370" y="326" width="60" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="400" y="344" text-anchor="middle" font-size="10" fill="#2e6e2e">return</text>
  <text x="400" y="360" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">true</text>
  <path d="M 410 310 L 400 326" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="450" y="326" width="60" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="480" y="344" text-anchor="middle" font-size="10" fill="#b03a3a">return</text>
  <text x="480" y="360" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">false</text>
  <path d="M 450 310 L 480 326" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 否分支 -->
  <g filter="url(#sk)"><rect x="400" y="326" width="50" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2"/></g>
  <text x="425" y="352" text-anchor="middle" font-size="9" fill="#b03a3a">越界→F</text>
  <path d="M 470 220 L 510 220 L 510 348 L 450 348" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#ary)" filter="url(#sk)"/>

  <!-- 说明 -->
  <g filter="url(#sk)"><rect x="320" y="478" width="220" height="80" rx="6" fill="#fff" stroke="#c98a2b" stroke-width="1.2" stroke-dasharray="3 2"/></g>
  <text x="430" y="498" text-anchor="middle" font-size="10.5" fill="#7a5415" font-weight="bold">💡 单次下标访问</text>
  <text x="430" y="516" text-anchor="middle" font-size="10" fill="#555">!used[n] 即结论</text>
  <text x="430" y="532" text-anchor="middle" font-size="10" fill="#555">无需查队列/游标</text>
  <text x="430" y="548" text-anchor="middle" font-size="9.5" fill="#888">used[] 是唯一真相源</text>

  <!-- ===== Column 3: release() ===== -->
  <g filter="url(#sk)"><rect x="580" y="74" width="240" height="500" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="700" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">release(number)</text>
  <text x="700" y="118" text-anchor="middle" font-size="10.5" fill="#b85450">回收号码</text>

  <!-- used[n]==T? -->
  <g filter="url(#sk)"><path d="M 700 150 L 760 185 L 700 220 L 640 185 Z" fill="#fff" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="700" y="180" text-anchor="middle" font-size="10" fill="#2b2b2b">used[n]==T?</text>
  <text x="640" y="188" text-anchor="middle" font-size="10" fill="#2e6e2e">是</text>
  <text x="760" y="188" text-anchor="middle" font-size="10" fill="#888">否</text>

  <!-- 是分支 -->
  <g filter="url(#sk)"><rect x="620" y="244" width="80" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="660" y="262" text-anchor="middle" font-size="10" fill="#2e6e2e">used[n]=F</text>
  <text x="660" y="278" text-anchor="middle" font-size="9.5" fill="#888">标记可用</text>
  <path d="M 700 220 L 660 244" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="620" y="302" width="80" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="660" y="320" text-anchor="middle" font-size="10" fill="#2e6e2e">recycled</text>
  <text x="660" y="336" text-anchor="middle" font-size="10" fill="#2e6e2e">.push(n)</text>
  <path d="M 660 288 L 660 302" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="620" y="360" width="80" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="660" y="384" text-anchor="middle" font-size="10" fill="#2e6e2e">return</text>
  <path d="M 660 346 L 660 360" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 否分支：直接返回 -->
  <g filter="url(#sk)"><rect x="730" y="244" width="80" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2"/></g>
  <text x="770" y="262" text-anchor="middle" font-size="10" fill="#b03a3a">直接返回</text>
  <text x="770" y="278" text-anchor="middle" font-size="9.5" fill="#888">不入队</text>
  <path d="M 740 220 L 770 244" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 说明 -->
  <g filter="url(#sk)"><rect x="590" y="478" width="220" height="80" rx="6" fill="#fff" stroke="#c98a2b" stroke-width="1.2" stroke-dasharray="3 2"/></g>
  <text x="700" y="498" text-anchor="middle" font-size="10.5" fill="#7a5415" font-weight="bold">⚠ 防重关键</text>
  <text x="700" y="516" text-anchor="middle" font-size="10" fill="#555">只有 used==T 才入队</text>
  <text x="700" y="532" text-anchor="middle" font-size="10" fill="#555">否则跳过</text>
  <text x="700" y="548" text-anchor="middle" font-size="9.5" fill="#888">避免同一号码重复入队</text>

  <text x="430" y="600" text-anchor="middle" font-size="11" fill="#7a5415">三操作均为 O(1)：常数次数组读写 + 队列 push/pop</text>
</svg>
