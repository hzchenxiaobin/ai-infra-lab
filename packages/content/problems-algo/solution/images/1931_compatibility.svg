<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">列间兼容性：相邻列同行不同色</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888">列 i 的每个颜色 ≠ 列 i+1 对应行的颜色 → 两列"兼容"，可相邻放置</text>

  <!-- left: two adjacent columns with horizontal constraints -->
  <text x="155" y="78" text-anchor="middle" font-size="11" fill="#888">两个相邻列（m=3 为例）</text>

  <!-- column i -->
  <text x="90" y="98" text-anchor="middle" font-size="10" fill="#888">列 i</text>
  <rect x="70" y="104" width="40" height="40" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="90" y="129" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">R</text>
  <rect x="70" y="144" width="40" height="40" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="90" y="169" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">B</text>
  <rect x="70" y="184" width="40" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="90" y="209" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">G</text>

  <!-- horizontal constraint arrows -->
  <path d="M 112 124 L 198 124" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 2" marker-end="url(#arrRed)" fill="none" filter="url(#rough2)"/>
  <text x="155" y="119" text-anchor="middle" font-size="9" fill="#b85450">≠</text>
  <path d="M 112 164 L 198 164" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 2" marker-end="url(#arrRed)" fill="none" filter="url(#rough2)"/>
  <text x="155" y="159" text-anchor="middle" font-size="9" fill="#b85450">≠</text>
  <path d="M 112 204 L 198 204" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 2" marker-end="url(#arrRed)" fill="none" filter="url(#rough2)"/>
  <text x="155" y="199" text-anchor="middle" font-size="9" fill="#b85450">≠</text>

  <!-- column i+1 -->
  <text x="220" y="98" text-anchor="middle" font-size="10" fill="#888">列 i+1</text>
  <rect x="200" y="104" width="40" height="40" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="220" y="129" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">B</text>
  <rect x="200" y="144" width="40" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="220" y="169" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">G</text>
  <rect x="200" y="184" width="40" height="40" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="220" y="209" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">R</text>

  <!-- compatible label -->
  <rect x="100" y="248" width="120" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="267" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 兼容（可相邻）</text>

  <!-- incompatible example -->
  <text x="155" y="304" text-anchor="middle" font-size="11" fill="#888">不兼容示例：</text>
  <rect x="70" y="312" width="40" height="40" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="90" y="337" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">R</text>
  <rect x="200" y="312" width="40" height="40" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="220" y="337" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">R</text>
  <path d="M 112 332 L 198 332" stroke="#b85450" stroke-width="2" marker-end="url(#arrRed)" fill="none" filter="url(#rough2)"/>
  <text x="155" y="327" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">同色 ✗</text>
  <rect x="100" y="360" width="120" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="379" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ 不兼容</text>

  <!-- right: compatibility graph for m=1 -->
  <rect x="340" y="68" width="260" height="320" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="94" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">m=1 时的兼容图</text>
  <text x="470" y="112" text-anchor="middle" font-size="10" fill="#888">3 个状态，两两兼容（无自环）</text>

  <!-- nodes R, G, B -->
  <circle cx="400" cy="160" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="165" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">R</text>

  <circle cx="540" cy="160" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="540" y="165" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">B</text>

  <circle cx="470" cy="250" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="255" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">G</text>

  <!-- edges (bidirectional, no self-loops) -->
  <path d="M 422 160 L 518 160" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 384 178 L 452 234" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 518 178 L 488 234" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- DP transition formula -->
  <rect x="356" y="290" width="228" height="80" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="312" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">DP 转移</text>
  <text x="370" y="332" font-size="11" fill="#4a7a3a">dp[col][c] =</text>
  <text x="378" y="350" font-size="11" fill="#4a7a3a">  Σ dp[col−1][c']</text>
  <text x="378" y="366" font-size="10" fill="#888">  c' 与 c 兼容</text>

  <!-- bottom note -->
  <text x="310" y="430" text-anchor="middle" font-size="10" fill="#aaa">兼容关系 = 转移图的边 → 整个 DP 就是在兼容图上做 n−1 步"走法计数"</text>
</svg>
