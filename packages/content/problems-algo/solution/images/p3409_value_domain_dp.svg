<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="20" y="28" font-size="13" fill="#333" filter="url(#rough2)">核心观察：状态搬到值域上 —— f[v][d]</text>

  <!-- Section A: 值域数轴 -->
  <text x="30" y="52" font-size="11.5" fill="#666" filter="url(#rough2)">值域 1…300（V = 300，差 d ≤ 299）：</text>

  <line x1="70" y1="100" x2="450" y2="100" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="70" y1="92" x2="70" y2="108" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="450" y1="92" x2="450" y2="108" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="126" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="450" y="126" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">300</text>

  <circle cx="185" cy="100" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="104" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">x−d</text>
  <circle cx="260" cy="100" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="104" text-anchor="middle" font-size="11" fill="#8c3a34" filter="url(#rough2)">x</text>
  <circle cx="335" cy="100" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="335" y="104" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">x+d</text>

  <line x1="200" y1="100" x2="244" y2="100" stroke="#666" stroke-width="1.4" marker-start="url(#arr)" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="276" y1="100" x2="320" y2="100" stroke="#666" stroke-width="1.4" marker-start="url(#arr)" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="222" y="88" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">差 d</text>
  <text x="298" y="88" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">差 d</text>

  <text x="30" y="140" font-size="11.5" fill="#8c3a34" filter="url(#rough2)">固定新元素 x 与差 d ⇒ 前驱值只有 x−d / x+d 两种：枚举 d 就等于枚举前驱</text>

  <!-- Section B: 转移公式 -->
  <rect x="40" y="152" width="440" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="174" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">g[d] = max( f[x−d][d] , f[x+d][d] ) + 1 ← 以 x 结尾、末差恰为 d</text>
  <text x="260" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">f[v][d]：以值 v 结尾、最后一个相邻差 ≥ d 的最长长度（v 出现过则 ≥ 1）</text>

  <!-- Section C: f 单行后缀最大示意 -->
  <text x="40" y="238" font-size="11.5" fill="#333" filter="url(#rough2)">f[v][·] 单行示意（d 越大约束越强，值单调不增）：</text>

  <rect x="60" y="248" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="270" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="108" y="248" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="132" y="270" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="156" y="248" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="180" y="270" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">4</text>
  <rect x="204" y="248" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="228" y="270" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="252" y="248" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="276" y="270" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="300" y="248" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="324" y="270" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <text x="84" y="300" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">d=0</text>
  <text x="132" y="300" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">d=1</text>
  <text x="180" y="300" text-anchor="middle" font-size="10" fill="#7a5c1e" filter="url(#rough2)">d=2</text>
  <text x="228" y="300" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">d=3</text>
  <text x="276" y="300" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">d=4</text>
  <text x="324" y="300" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">d=5</text>

  <text x="40" y="322" font-size="11" fill="#7a5c1e" filter="url(#rough2)">查询 f[v][2] = 4：一次拿到「末差 ≥ 2」的全部状态 —— 后缀最大值的含义</text>

  <!-- Section D: 复杂度收益 -->
  <rect x="40" y="336" width="440" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="12.5" fill="#8c3a34" filter="url(#rough2)">状态 (i, d) → (v, d)：下标维度 n 换成值域维度 V</text>
  <text x="260" y="378" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">每个元素转移 O(V)，总时间 O(n·V)、空间 O(V²)</text>
</svg>
