<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">状态转移：dp[i−1][j][k′] → dp[i][j + δ(k, s[i])][k]（k ≠ k′）</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">dp[i][j][k]：前 i+1 回合、分差 j−n、Bob 第 i 回合出 k 的方案数</text>

  <!-- 源状态 -->
  <rect x="15" y="100" width="175" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="102" y="122" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">dp[i−1][j][k′]</text>
  <text x="102" y="140" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">回合 i−1 收官</text>
  <text x="102" y="156" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">分差 j−n</text>
  <text x="102" y="172" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">上一步出 k′（图中 k′ = W）</text>

  <!-- Alice 出招 -->
  <circle cx="257" cy="140" r="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="257" y="145" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">s[i]</text>
  <text x="257" y="182" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">Alice 本回合出招</text>
  <text x="257" y="196" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">决定 δ(·, s[i]) ∈ {−1,0,+1}</text>

  <!-- 三条转移边 -->
  <path d="M 190 118 C 250 80, 300 75, 340 82" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 283 140 C 305 140, 320 140, 340 140" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 190 162 C 250 200, 300 205, 340 198" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 目标状态：出 F -->
  <rect x="345" y="60" width="160" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="425" y="79" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">出 F（火龙）</text>
  <text x="425" y="96" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">新分差 j + δ(F, s[i])</text>

  <!-- 目标状态：出 W（非法） -->
  <rect x="345" y="117" width="160" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6,4" rx="8" filter="url(#rough2)"/>
  <text x="425" y="136" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">出 W —— 与上一步相同！</text>
  <text x="425" y="153" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">✗ 禁止：相邻两回合不能同招</text>
  <path d="M 310 122 L 326 138 M 326 122 L 310 138" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>

  <!-- 目标状态：出 E -->
  <rect x="345" y="174" width="160" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="425" y="193" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">出 E（地精）</text>
  <text x="425" y="210" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">新分差 j + δ(E, s[i])</text>

  <text x="257" y="228" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">9 条 (k′→k) 组合中砍掉 3 条同招边</text>

  <!-- 底部递推式 -->
  <rect x="15" y="248" width="490" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">dp[i][j + δ(k, s[i])][k] += dp[i−1][j][k′]（k ≠ k′）</text>
  <text x="260" y="296" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">初始：dp[0][δ(k, s[0]) + n][k] = 1（k = F/W/E，第 0 回合无历史约束）</text>
  <text x="260" y="316" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">答案：ans = Σ(j > n) Σ(k) dp[n−1][j][k] mod (10⁹+7)</text>
  <text x="260" y="336" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">j 是「分差 + n」偏移后的下标，j > n 即分差 > 0（严格大于）</text>
</svg>
