<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">付费刷墙 i：免费油漆匠趁机白嫖 time[i] 堵</text>

  <!-- time axis ticks -->
  <line x1="110" y1="250" x2="410" y2="250" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="105" y="254" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">时间</text>
  <line x1="110" y1="246" x2="110" y2="254" stroke="#888" filter="url(#rough2)"/>
  <line x1="210" y1="246" x2="210" y2="254" stroke="#888" filter="url(#rough2)"/>
  <line x1="310" y1="246" x2="310" y2="254" stroke="#888" filter="url(#rough2)"/>
  <line x1="410" y1="246" x2="410" y2="254" stroke="#888" filter="url(#rough2)"/>
  <text x="110" y="266" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="210" y="266" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="310" y="266" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="410" y="266" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>

  <!-- Paid painter lane -->
  <text x="100" y="80" text-anchor="end" font-size="13" fill="#446688" filter="url(#rough2)">付费</text>
  <rect x="110" y="62" width="300" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="260" y="85" text-anchor="middle" font-size="13" fill="#224" filter="url(#rough2)">墙 i 　time[i] = 3，花费 cost[i]</text>

  <!-- Free painter lane: 3 boxes of width 100 each -->
  <text x="100" y="170" text-anchor="end" font-size="13" fill="#4a7a3a" filter="url(#rough2)">免费</text>
  <rect x="110" y="150" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="160" y="173" text-anchor="middle" font-size="11" fill="#243" filter="url(#rough2)">免费墙①</text>
  <rect x="210" y="150" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="173" text-anchor="middle" font-size="11" fill="#243" filter="url(#rough2)">免费墙②</text>
  <rect x="310" y="150" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="360" y="173" text-anchor="middle" font-size="11" fill="#243" filter="url(#rough2)">免费墙③</text>

  <!-- parallel indicator -->
  <path d="M415,80 L415,168" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="128" font-size="10" fill="#b85450" filter="url(#rough2)">并行</text>

  <!-- equation box -->
  <rect x="60" y="296" width="400" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="13" fill="#5a3a10" filter="url(#rough2)">选墙 i 付费 ⇒ 覆盖 1(付费) + time[i](免费)</text>
  <text x="260" y="344" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">= time[i] + 1 堵墙，仅花 cost[i]</text>
</svg>
