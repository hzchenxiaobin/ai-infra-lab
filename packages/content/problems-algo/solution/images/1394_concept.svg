<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：频次 = 数值 即为幸运数</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">幸运数 v 满足 freq[v] == v，返回最大的幸运数，无则 -1</text>

  <!-- arr row: [1,2,2,3,3,3] -->
  <text x="110" y="88" text-anchor="end" font-size="12" fill="#666" font-weight="bold">arr =</text>
  <g font-size="15">
    <rect x="124" y="66" width="46" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="147" y="91" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="174" y="66" width="46" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="197" y="91" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="224" y="66" width="46" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="247" y="91" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="274" y="66" width="46" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="297" y="91" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="324" y="66" width="46" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="347" y="91" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="374" y="66" width="46" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="397" y="91" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
  </g>

  <!-- arrow down: count -->
  <path d="M 270 108 L 270 126" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="282" y="122" font-size="10" fill="#666">统计频次</text>

  <!-- freq mapping rows -->
  <text x="120" y="146" font-size="11" fill="#666" font-weight="bold">值 v</text>
  <text x="262" y="146" font-size="11" fill="#666" font-weight="bold">频次 freq[v]</text>
  <text x="360" y="146" font-size="11" fill="#666" font-weight="bold">v == freq?</text>
  <text x="470" y="146" font-size="11" fill="#666" font-weight="bold">幸运?</text>

  <!-- row 1: v=1 -> freq=1 (lucky) -->
  <rect x="110" y="156" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="132" y="179" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">1</text>
  <path d="M 158 173 L 184 173" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="188" y="156" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="179" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">1</text>
  <text x="360" y="179" font-size="13" fill="#4a7a3a" font-weight="bold">1 == 1 ✓</text>
  <text x="470" y="179" font-size="13" fill="#4a7a3a" font-weight="bold">✓ 幸运</text>

  <!-- row 2: v=2 -> freq=2 (lucky) -->
  <rect x="110" y="196" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="132" y="219" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">2</text>
  <path d="M 158 213 L 184 213" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="188" y="196" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="219" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="360" y="219" font-size="13" fill="#4a7a3a" font-weight="bold">2 == 2 ✓</text>
  <text x="470" y="219" font-size="13" fill="#4a7a3a" font-weight="bold">✓ 幸运</text>

  <!-- row 3: v=3 -> freq=3 (lucky + max) -->
  <rect x="110" y="236" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="132" y="259" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">3</text>
  <path d="M 158 253 L 184 253" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="188" y="236" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="210" y="259" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">3</text>
  <text x="360" y="259" font-size="13" fill="#4a7a3a" font-weight="bold">3 == 3 ✓</text>
  <text x="470" y="259" font-size="13" fill="#b85450" font-weight="bold">✓ 最大 ★</text>
  <text x="210" y="234" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">★</text>

  <!-- result -->
  <rect x="110" y="284" width="460" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="304" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">幸运数集合 = {1, 2, 3}，取最大 → ans = 3</text>
  <text x="340" y="320" text-anchor="middle" font-size="10" fill="#888">遍历频次表，凡 freq[v]==v 者皆为幸运数，ans 维护其中的最大值</text>

  <!-- contrast: no lucky -->
  <rect x="40" y="340" width="540" height="68" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="362" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">反例：arr = [2, 2, 2, 3, 3]</text>
  <text x="310" y="382" text-anchor="middle" font-size="11" fill="#666">freq: 2 → 3（2 ≠ 3 ✗），3 → 2（3 ≠ 2 ✗）</text>
  <text x="310" y="400" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">无任何 v 满足 freq[v]==v → 返回 -1</text>
</svg>
