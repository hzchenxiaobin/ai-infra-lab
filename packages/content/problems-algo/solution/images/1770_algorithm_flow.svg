<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">滚动数组 DP 算法流程（一维压缩）</text>

  <!-- Start -->
  <rect x="170" y="38" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[0] = 0，其余 = −∞；k = 0</text>

  <path d="M 270 76 L 270 94" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- While k &lt; m -->
  <polygon points="270,98 380,138 270,178 160,138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="134" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">k &lt; m ?</text>
  <text x="270" y="150" text-anchor="middle" font-size="10" fill="#888">否 → 取 max(dp) 返回</text>

  <!-- No branch: return -->
  <path d="M 380 138 L 460 138 L 460 56 L 372 56" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="392" y="30" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="452" y="49" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return max(dp)</text>

  <!-- Yes: new dp array -->
  <path d="M 270 178 L 270 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="130" y="200" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="223" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">新建 ndp[0..k+1] 全填 −∞</text>

  <path d="M 270 238 L 270 254" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- inner loop i -->
  <polygon points="270,258 370,290 270,322 170,290" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="288" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">i = 0 .. k+1</text>
  <text x="270" y="304" text-anchor="middle" font-size="9" fill="#888">遍历每个左取数 i</text>

  <path d="M 270 322 L 270 336" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Two transitions -->
  <rect x="40" y="340" width="225" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="152" y="360" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i &gt; 0（本轮取左）</text>
  <text x="152" y="376" text-anchor="middle" font-size="9" fill="#555">ndp[i] = max(ndp[i],</text>
  <text x="152" y="388" text-anchor="middle" font-size="9" fill="#555"> dp[i−1]+m[k]×nums[i−1])</text>

  <rect x="275" y="340" width="225" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="387" y="360" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">i ≤ k（本轮取右）</text>
  <text x="387" y="376" text-anchor="middle" font-size="9" fill="#555">ndp[i] = max(ndp[i],</text>
  <text x="387" y="388" text-anchor="middle" font-size="9" fill="#555"> dp[i]+m[k]×nums[n−1−k+i])</text>

  <!-- merge to dp = ndp -->
  <path d="M 152 396 L 152 412 L 270 412" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 387 396 L 387 412 L 270 412" stroke="#b85450" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 270 412 L 270 422" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="426" width="200" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="446" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp = ndp；k++</text>

  <!-- loop back -->
  <path d="M 170 441 L 70 441 L 70 138 L 156 138" stroke="#666" stroke-width="1.2" stroke-dasharray="5,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="58" y="290" text-anchor="middle" font-size="9" fill="#999" transform="rotate(-90 58 290)">外层循环</text>
</svg>
