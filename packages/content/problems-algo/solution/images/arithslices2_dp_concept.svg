<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">弱等差子序列 DP：dp[i] 是按公差 diff 索引的哈希表</text>

  <text x="20" y="60" font-size="12" fill="#888">nums:</text>
  <rect x="70" y="44" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="93" y="64" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="126" y="44" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="149" y="64" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="182" y="44" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="64" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="238" y="44" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="261" y="64" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>

  <text x="149" y="88" text-anchor="middle" font-size="10" fill="#d6a040">j</text>
  <text x="261" y="88" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">i</text>

  <path d="M 172 80 L 238 80" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="205" y="76" text-anchor="middle" font-size="10" fill="#b85450">diff = 8−4 = 4</text>

  <rect x="100" y="110" width="180" height="44" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="190" y="128" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">查 dp[j][diff] = dp[1][4]</text>
  <text x="190" y="145" text-anchor="middle" font-size="10.5" fill="#82b366">= 以 j 结尾、公差 4、长度≥2 的弱子序列数</text>

  <rect x="20" y="170" width="250" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="145" y="190" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[j] （哈希表，键=公差）</text>
  <rect x="40" y="200" width="210" height="24" fill="#fffdf3" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="217" font-size="11" fill="#4a7a3a">diff=4</text>
  <text x="220" y="217" text-anchor="end" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="40" y="228" width="210" height="24" fill="#fffdf3" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="245" font-size="11" fill="#4a7a3a">diff=2</text>
  <text x="220" y="245" text-anchor="end" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="145" y="272" text-anchor="middle" font-size="10" fill="#888">[2,4] 是唯一的弱子序列</text>

  <rect x="300" y="170" width="250" height="118" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="425" y="190" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[i] （待更新）</text>
  <rect x="320" y="200" width="210" height="24" fill="#fffdf3" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="335" y="217" font-size="11" fill="#b85450">diff=4</text>
  <text x="510" y="217" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">+= 1</text>
  <text x="425" y="245" text-anchor="middle" font-size="10" fill="#888">cnt + 1 = 0 + 1</text>
  <text x="425" y="272" text-anchor="middle" font-size="10" fill="#b85450">新增长度 2 的 [4,8]</text>

  <path d="M 270 226 L 318 212" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="20" y="305" width="530" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="40" y="325" font-size="12" fill="#333" font-weight="bold">转移：dp[i][diff] += dp[j][diff] + 1</text>
  <text x="40" y="345" font-size="11" fill="#555">　+1 = 新的二元 [nums[j],nums[i]]；dp[j][diff] = 续接的弱子序列，延长后长度≥3 → 计入答案</text>

  <rect x="20" y="372" width="530" height="38" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="40" y="390" font-size="11" fill="#444" font-weight="bold">答案：ans += dp[j][diff]</text>
  <text x="40" y="404" font-size="10.5" fill="#888">弱子序列（≥2）延长变 ≥3 才算合法；二元对本身不进答案，只进 dp 供后续续接</text>
</svg>
