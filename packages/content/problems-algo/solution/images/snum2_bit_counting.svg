<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="200" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：逐位统计模 3</text>
  <text x="200" y="46" text-anchor="middle" font-size="11" fill="#888">每个三倍数的位贡献是 3 的倍数，mod 3 后只剩落单数的位</text>

  <!-- ===== Bit-column grid (left) ===== -->
  <!-- grid origin x0=70, y0=80; col0=90, col1/2/3=70; row=30 -->

  <!-- highlight: row3 single number 3 -->
  <rect x="70" y="170" width="300" height="30" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <!-- highlight: mod3 result row -->
  <rect x="70" y="260" width="300" height="30" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <!-- highlight mod3=1 cells -->
  <rect x="230" y="260" width="70" height="30" fill="#e8f5e9" stroke="none" filter="url(#rough2)"/>
  <rect x="300" y="260" width="70" height="30" fill="#e8f5e9" stroke="none" filter="url(#rough2)"/>

  <!-- grid lines vertical -->
  <path d="M 70 80 L 70 290 M 160 80 L 160 290 M 230 80 L 230 290 M 300 80 L 300 290 M 370 80 L 370 290" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <!-- grid lines horizontal -->
  <path d="M 70 80 L 370 80 M 70 110 L 370 110 M 70 140 L 370 140 M 70 170 L 370 170 M 70 200 L 370 200 M 70 230 L 370 230 M 70 260 L 370 260 M 70 290 L 370 290" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- header row -->
  <text x="115" y="100" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">数值</text>
  <text x="195" y="100" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">bit2</text>
  <text x="265" y="100" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">bit1</text>
  <text x="335" y="100" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">bit0</text>

  <!-- data rows: 2,2,3,2 -->
  <text x="115" y="130" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="195" y="130" text-anchor="middle" font-size="12" fill="#555">0</text>
  <text x="265" y="130" text-anchor="middle" font-size="12" fill="#555">1</text>
  <text x="335" y="130" text-anchor="middle" font-size="12" fill="#555">0</text>

  <text x="115" y="160" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="195" y="160" text-anchor="middle" font-size="12" fill="#555">0</text>
  <text x="265" y="160" text-anchor="middle" font-size="12" fill="#555">1</text>
  <text x="335" y="160" text-anchor="middle" font-size="12" fill="#555">0</text>

  <!-- single number 3 -->
  <text x="115" y="190" text-anchor="middle" font-size="12" fill="#7a3a3a" font-weight="bold">3</text>
  <text x="195" y="190" text-anchor="middle" font-size="12" fill="#6a4a10">0</text>
  <text x="265" y="190" text-anchor="middle" font-size="12" fill="#6a4a10">1</text>
  <text x="335" y="190" text-anchor="middle" font-size="12" fill="#6a4a10">1</text>

  <text x="115" y="220" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="195" y="220" text-anchor="middle" font-size="12" fill="#555">0</text>
  <text x="265" y="220" text-anchor="middle" font-size="12" fill="#555">1</text>
  <text x="335" y="220" text-anchor="middle" font-size="12" fill="#555">0</text>

  <!-- count row -->
  <text x="115" y="250" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">列计数 cnt</text>
  <text x="195" y="250" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">3</text>
  <text x="265" y="250" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">4</text>
  <text x="335" y="250" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">1</text>

  <!-- mod 3 row -->
  <text x="115" y="280" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">cnt mod 3</text>
  <text x="195" y="280" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <text x="265" y="280" text-anchor="middle" font-size="13" fill="#2e6b2e" font-weight="bold">1</text>
  <text x="335" y="280" text-anchor="middle" font-size="13" fill="#2e6b2e" font-weight="bold">1</text>

  <!-- bracket: 3 倍数 cancel annotation -->
  <path d="M 195 296 L 195 306 M 335 296 L 335 306" stroke="#888" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="195" y="318" text-anchor="middle" font-size="9" fill="#888">3的倍数→0</text>
  <text x="335" y="318" text-anchor="middle" font-size="9" fill="#888">落单→保留</text>

  <!-- result box -->
  <rect x="110" y="332" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="220" y="354" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">答案 = 011₂ = 3 ✓</text>

  <!-- ===== Explanation (right) ===== -->
  <rect x="390" y="80" width="160" height="210" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="470" y="102" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">为什么 mod 3 有效</text>
  <text x="402" y="124" font-size="10" fill="#555">• 重复 3 次的数</text>
  <text x="402" y="140" font-size="10" fill="#555">  每位贡献 0 或 3</text>
  <text x="402" y="156" font-size="10" fill="#555">  都是 3 的倍数</text>
  <text x="402" y="180" font-size="10" fill="#555">• 落单数每位贡献</text>
  <text x="402" y="196" font-size="10" fill="#555">  0 或 1</text>
  <text x="402" y="220" font-size="10" fill="#555">• 列求和 mod 3：</text>
  <text x="402" y="236" font-size="10" fill="#555">  三倍数抵消为 0</text>
  <text x="402" y="252" font-size="10" fill="#555">  剩落单数的位</text>
  <text x="402" y="276" font-size="10" fill="#3a5a2a" font-weight="bold">⇒ 逐位还原落单数</text>

  <!-- arrow from mod3 row to result -->
  <path d="M 220 296 L 220 330" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
