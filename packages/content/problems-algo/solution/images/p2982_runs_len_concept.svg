<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：len[i] = 以 i 结尾的最长特殊后缀长度</text>

  <!-- s boxes -->
  <text x="52" y="66" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">s =</text>
  <g filter="url(#rough2)">
    <rect x="88" y="50" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="128" y="50" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="168" y="50" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="208" y="50" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="248" y="50" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="288" y="50" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="328" y="50" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="108" y="70" text-anchor="middle" font-size="13" fill="#333">a</text>
    <text x="148" y="70" text-anchor="middle" font-size="13" fill="#333">a</text>
    <text x="188" y="70" text-anchor="middle" font-size="13" fill="#333">a</text>
    <text x="228" y="70" text-anchor="middle" font-size="13" fill="#333">b</text>
    <text x="268" y="70" text-anchor="middle" font-size="13" fill="#333">a</text>
    <text x="308" y="70" text-anchor="middle" font-size="13" fill="#333">a</text>
    <text x="348" y="70" text-anchor="middle" font-size="13" fill="#333">a</text>
    <text x="108" y="94" text-anchor="middle" font-size="9" fill="#999">0</text>
    <text x="148" y="94" text-anchor="middle" font-size="9" fill="#999">1</text>
    <text x="188" y="94" text-anchor="middle" font-size="9" fill="#999">2</text>
    <text x="228" y="94" text-anchor="middle" font-size="9" fill="#999">3</text>
    <text x="268" y="94" text-anchor="middle" font-size="9" fill="#999">4</text>
    <text x="308" y="94" text-anchor="middle" font-size="9" fill="#999">5</text>
    <text x="348" y="94" text-anchor="middle" font-size="9" fill="#999">6</text>
  </g>

  <!-- arrow to len -->
  <path d="M 260 102 L 260 122" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="276" y="116" font-size="10" fill="#446688" filter="url(#rough2)">逐位递推</text>

  <!-- len boxes -->
  <text x="46" y="146" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">len =</text>
  <g filter="url(#rough2)">
    <rect x="88" y="130" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="128" y="130" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="168" y="130" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="208" y="130" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="248" y="130" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="288" y="130" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="328" y="130" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="108" y="150" text-anchor="middle" font-size="13" fill="#333">1</text>
    <text x="148" y="150" text-anchor="middle" font-size="13" fill="#333">2</text>
    <text x="188" y="150" text-anchor="middle" font-size="13" fill="#333">3</text>
    <text x="228" y="150" text-anchor="middle" font-size="13" fill="#333">1</text>
    <text x="268" y="150" text-anchor="middle" font-size="13" fill="#333">1</text>
    <text x="308" y="150" text-anchor="middle" font-size="13" fill="#333">2</text>
    <text x="348" y="150" text-anchor="middle" font-size="13" fill="#333">3</text>
  </g>

  <!-- formula note -->
  <rect x="60" y="174" width="400" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="195" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">len[i] = len[i-1]+1（s[i]=s[i-1]）否则 1 —— 一个游程内恰取值 1,2,…,L</text>

  <!-- arrow to grouping -->
  <path d="M 260 212 L 260 232" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="276" y="226" font-size="10" fill="#4a7a3a" filter="url(#rough2)">按字符分组</text>

  <!-- groups -->
  <rect x="55" y="238" width="230" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="170" y="260" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">字符 'a' 的 len 值</text>
  <text x="170" y="282" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">{ 1, 2, 3, 1, 2, 3 }</text>
  <text x="170" y="304" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">前三大的值：3, 3, 2</text>
  <rect x="140" y="314" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="170" y="330" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">第三大=2</text>

  <rect x="300" y="238" width="170" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="385" y="260" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">字符 'b' 的 len 值</text>
  <text x="385" y="282" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">{ 1 }</text>
  <text x="385" y="304" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">不足 3 个值</text>
  <text x="385" y="328" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">不产生候选 ✗</text>

  <!-- bottom note -->
  <rect x="40" y="356" width="440" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="377" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">每组只需保留前三大 len：出现 ≥3 次的判定只取决于第三大是否 ≥ x</text>
</svg>
