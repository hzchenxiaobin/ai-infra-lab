<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 2 演算：n = 4，两条候选路线的时间线</text>
  <text x="260" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">起点 0，终点 3；绿色/蓝色实线 = 走边（恰 1 个时间单位），橙色虚线 = 原地等待</text>

  <path d="M 55 72 L 475 72" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 60 68 L 60 76 M 110 68 L 110 76 M 160 68 L 160 76 M 210 68 L 210 76 M 260 68 L 260 76 M 310 68 L 310 76 M 360 68 L 360 76 M 410 68 L 410 76 M 460 68 L 460 76" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="90" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0</text>
  <text x="110" y="90" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="160" y="90" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <text x="210" y="90" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <text x="260" y="90" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">4</text>
  <text x="310" y="90" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">5</text>
  <text x="360" y="90" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">6</text>
  <text x="410" y="90" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">7</text>
  <text x="460" y="90" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">8</text>

  <text x="16" y="154" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">路线 B</text>

  <path d="M 60 150 L 110 150" stroke="#d6a040" stroke-width="2" stroke-dasharray="6,4" fill="none" filter="url(#rough2)"/>
  <path d="M 110 150 L 160 150" stroke="#4a7a3a" stroke-width="3.5" filter="url(#rough2)"/>
  <path d="M 160 150 L 260 150" stroke="#d6a040" stroke-width="2" stroke-dasharray="6,4" fill="none" filter="url(#rough2)"/>
  <path d="M 260 150 L 310 150" stroke="#4a7a3a" stroke-width="3.5" filter="url(#rough2)"/>

  <circle cx="60" cy="150" r="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="160" cy="150" r="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="310" cy="150" r="5" fill="#4a7a3a" stroke="#2d4d24" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="135" y="136" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">0→2 · 窗 [1,5]</text>
  <text x="285" y="136" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">2→3 · 窗 [4,7]</text>

  <text x="60" y="170" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0</text>
  <text x="160" y="170" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <text x="310" y="170" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>

  <path d="M 318 150 L 334 150" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="338" y="133" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="408" y="154" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">到达 3 @ t = 5 ✓</text>

  <text x="16" y="254" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">路线 A</text>

  <path d="M 60 250 L 110 250" stroke="#446688" stroke-width="3.5" filter="url(#rough2)"/>
  <path d="M 110 250 L 410 250" stroke="#d6a040" stroke-width="2" stroke-dasharray="6,4" fill="none" filter="url(#rough2)"/>
  <path d="M 410 250 L 460 250" stroke="#446688" stroke-width="3.5" filter="url(#rough2)"/>

  <circle cx="60" cy="250" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="110" cy="250" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="460" cy="250" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="85" y="236" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">0→1 · 窗 [0,3]</text>
  <text x="260" y="234" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">在节点 1 原地干等 6 拍……</text>
  <text x="435" y="236" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">1→3 · 窗 [7,8]</text>

  <text x="60" y="270" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0</text>
  <text x="110" y="270" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="460" y="270" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3</text>

  <path d="M 350 256 L 348 280" stroke="#999" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="250" y="284" width="200" height="30" fill="#f3f3f3" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="350" y="304" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">到达 3 @ t = 8（更晚）✗</text>

  <text x="260" y="348" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">B：等 1 拍 + 走 1 + 等 2 拍 + 走 1 = t 5 到达；Dijkstra 按最早到达时刻松弛，自动选出 B</text>
  <text x="260" y="366" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">A 先把 dist[3] 写成 8，随后被 B 的 nt = max(2,4)+1 = 5 反超松弛</text>
</svg>
