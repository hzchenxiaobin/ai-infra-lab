<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：k = 19，贪心相减全过程</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">每步取 ≤ rem 的最大斐波那契数，验证 k - F_j &lt; F_{j-1} 的不相邻性质</text>

  <!-- ===== Fibonacci sequence for reference ===== -->
  <text x="40" y="76" font-size="11" fill="#446688" font-weight="bold">斐波那契数列: 1, 1, 2, 3, 5, 8, 13, 21, 34, ...</text>

  <!-- ===== Step table ===== -->
  <text x="40" y="104" font-size="11" fill="#446688" font-weight="bold">贪心相减步骤表：</text>

  <!-- table header -->
  <g font-size="11" fill="#444" font-weight="bold">
    <rect x="40" y="112" width="540" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="80" y="130" text-anchor="middle">步骤</text>
    <text x="180" y="130" text-anchor="middle">剩余 rem</text>
    <text x="300" y="130" text-anchor="middle">取走 F_j</text>
    <text x="400" y="130" text-anchor="middle">rem - F_j</text>
    <text x="520" y="130" text-anchor="middle">验证 &lt; F_{j-1}</text>
  </g>

  <!-- rows -->
  <g font-size="11" fill="#333">
    <!-- Step 0: initial -->
    <text x="80" y="160" text-anchor="middle">0</text>
    <text x="180" y="160" text-anchor="middle" fill="#446688" font-weight="bold">19</text>
    <text x="300" y="160" text-anchor="middle" fill="#888">—</text>
    <text x="400" y="160" text-anchor="middle" fill="#888">—</text>
    <text x="520" y="160" text-anchor="middle" fill="#888">初始</text>

    <!-- Step 1: take 13 -->
    <rect x="44" y="148" width="532" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" fill-opacity="0.4" filter="url(#rough2)"/>
    <text x="80" y="164" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <text x="180" y="164" text-anchor="middle" fill="#333">19</text>
    <text x="300" y="164" text-anchor="middle" fill="#4a7a3a" font-weight="bold">13 (F₇)</text>
    <text x="400" y="164" text-anchor="middle" fill="#333">6</text>
    <text x="520" y="164" text-anchor="middle" fill="#4a7a3a">6 &lt; 8=F₆ ✓</text>

    <!-- Step 2: take 5 -->
    <rect x="44" y="172" width="532" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1" fill-opacity="0.4" filter="url(#rough2)"/>
    <text x="80" y="188" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <text x="180" y="188" text-anchor="middle" fill="#333">6</text>
    <text x="300" y="188" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5 (F₅)</text>
    <text x="400" y="188" text-anchor="middle" fill="#333">1</text>
    <text x="520" y="188" text-anchor="middle" fill="#4a7a3a">1 &lt; 3=F₄ ✓</text>

    <!-- Step 3: take 1 -->
    <rect x="44" y="196" width="532" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" fill-opacity="0.4" filter="url(#rough2)"/>
    <text x="80" y="212" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="180" y="212" text-anchor="middle" fill="#333">1</text>
    <text x="300" y="212" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1 (F₂)</text>
    <text x="400" y="212" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0 ✓</text>
    <text x="520" y="212" text-anchor="middle" fill="#4a7a3a">完成</text>
  </g>

  <!-- table outline -->
  <rect x="40" y="112" width="540" height="108" rx="3" fill="none" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="120" y1="112" x2="120" y2="220" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="240" y1="112" x2="240" y2="220" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="360" y1="112" x2="360" y2="220" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="460" y1="112" x2="460" y2="220" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Result ===== -->
  <rect x="40" y="236" width="540" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="262" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">答案 = 3，即 19 = 13 + 5 + 1 (Zeckendorf 表示)</text>

  <!-- ===== Non-adjacent check ===== -->
  <rect x="40" y="288" width="540" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="310" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">验证「互不相邻」：取走的下标为 {2, 4, 6}（F₂, F₅, F₇）</text>
  <text x="56" y="330" font-size="10" fill="#555">• F₇ = 13 与 F₅ = 5：隔了 F₆ = 8，不相邻 ✓</text>
  <text x="56" y="344" font-size="10" fill="#555">• F₅ = 5 与 F₂ = 1（即 F₂=1）：隔了 F₃=2, F₄=3，不相邻 ✓</text>
  <text x="56" y="356" font-size="10" fill="#888">⇒ {13, 5, 1} 是 19 的唯一 Zeckendorf 表示，项数 3 = 最少项数</text>

  <!-- ===== Key insight ===== -->
  <rect x="40" y="370" width="540" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="390" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">关键：每步 k - F_j &lt; F_{j-1} ⇒ 下一步取的数 ≤ F_{j-2}，天然不相邻</text>
  <text x="310" y="404" text-anchor="middle" font-size="10" fill="#888">不用 F_j 需 ≥ 2 个小数补偿，1 个 F_j 总是最优 ⇒ 贪心正确</text>
</svg>
