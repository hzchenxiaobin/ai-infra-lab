<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：从右到左扫描，‘0’ 必留、‘1’ 按预算贪心</text>

  <!-- Start oval -->
  <rect x="200" y="40" width="200" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="20" filter="url(#rough2)"/>
  <text x="300" y="58" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">初始化 val=0, kept=0,</text>
  <text x="300" y="73" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">zeros=0, zr=0, i=n−1</text>

  <!-- arrow down to diamond1 -->
  <path d="M 300 82 L 300 112" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond1: i >= 0 ? -->
  <path d="M 300 112 L 380 160 L 300 208 L 220 160 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="156" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">i ≥ 0 ?</text>
  <text x="300" y="172" text-anchor="middle" font-size="10" fill="#888">（从右到左）</text>

  <!-- No branch to End (right) -->
  <path d="M 380 160 L 440 160" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="400" y="153" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="440" y="138" width="140" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="20" filter="url(#rough2)"/>
  <text x="510" y="165" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 zeros + kept</text>

  <!-- Yes down -->
  <path d="M 300 208 L 300 238" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="312" y="228" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- diamond2: s[i]=='0' ? -->
  <path d="M 300 238 L 376 286 L 300 334 L 224 286 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="290" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">s[i] == ‘0’ ?</text>

  <!-- Yes (left): zeros++; zr++; i-- -->
  <path d="M 224 286 L 150 286" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="190" y="279" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="20" y="266" width="130" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="85" y="284" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">zeros++; zr++</text>
  <text x="85" y="299" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i−−（必留此 0）</text>
  <!-- loop back up to diamond1 (left rail) -->
  <path d="M 85 266 L 85 160 L 220 160" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="40" y="216" font-size="10" fill="#4a7a3a">↻ 下一字符</text>

  <!-- No down -->
  <path d="M 300 334 L 300 364" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="354" font-size="11" fill="#666" font-weight="bold">否（是 1）</text>

  <!-- compute r -->
  <rect x="210" y="364" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="385" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">r = zr + kept（该 1 的位权位）</text>

  <!-- arrow down to diamond3 -->
  <path d="M 300 398 L 300 412" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond3: r<31 且 val + 2^r <= k ? -->
  <rect x="190" y="412" width="220" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="432" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">r &lt; 31 且 val + 2^r ≤ k ?</text>
  <text x="300" y="448" text-anchor="middle" font-size="10" fill="#888">（2^r 超预算则永不留）</text>

  <!-- Yes (left): val+=2^r; kept++; i-- -->
  <path d="M 190 435 L 150 435" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="172" y="428" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="20" y="414" width="130" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="85" y="432" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">val += 2^r</text>
  <text x="85" y="447" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">kept++; i−−</text>

  <!-- No (right): skip; i-- -->
  <path d="M 410 435 L 450 435" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="432" y="428" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="450" y="414" width="130" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="515" y="440" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">跳过该 1；i−−</text>

  <!-- loop back rail (right side) from skip box up to diamond1 -->
  <path d="M 580 414 L 580 160 L 380 160" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="588" y="290" font-size="10" fill="#b85450">↻ 下一字符</text>
</svg>
