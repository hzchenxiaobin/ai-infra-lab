<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：两个上界取最小 → 得分 = min(a+b, ⌊(a+b+c)/2⌋)</text>

  <!-- ============ Case 1: a+b <= c ============ -->
  <text x="56" y="58" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">情形 ① a+b ≤ c：最大堆独大</text>

  <!-- baseline -->
  <path d="M 140 176 L 300 176" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- bar a=2 (blue) -->
  <rect x="150" y="148" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <!-- bar b=4 (blue) -->
  <rect x="200" y="120" width="38" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <!-- bar c=8 (blue) with stranded top 2 units (red overlay) -->
  <rect x="250" y="64" width="38" height="112" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="250" y="64" width="38" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>

  <!-- unit tick marks on c -->
  <g stroke="#446688" stroke-width="0.8" opacity="0.5" filter="url(#rough2)">
    <path d="M 250 92 L 288 92"/>
    <path d="M 250 106 L 288 106"/>
    <path d="M 250 120 L 288 120"/>
    <path d="M 250 134 L 288 134"/>
    <path d="M 250 148 L 288 148"/>
    <path d="M 250 162 L 288 162"/>
  </g>

  <!-- bar value labels -->
  <g font-size="11" fill="#555" text-anchor="middle" filter="url(#rough2)">
    <text x="169" y="190">a=2</text>
    <text x="219" y="190">b=4</text>
    <text x="269" y="190">c=8</text>
  </g>

  <!-- stranded label -->
  <text x="318" y="82" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">← 余 2 孤立</text>

  <!-- annotation box case 1 -->
  <rect x="350" y="104" width="200" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a+b = 6 全部配 c</text>
  <text x="450" y="140" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c 余 8−6 = 2 孤立</text>
  <text x="450" y="160" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 得分 = a+b = 6</text>

  <!-- divider -->
  <path d="M 40 206 L 520 206" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ============ Case 2: a+b > c ============ -->
  <text x="56" y="228" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">情形 ② a+b &gt; c：可均衡消耗</text>

  <!-- baseline -->
  <path d="M 140 346 L 300 346" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- bar a=4 (green) -->
  <rect x="150" y="290" width="38" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <!-- bar b=4 (green) -->
  <rect x="200" y="290" width="38" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <!-- bar c=6 (green) -->
  <rect x="250" y="262" width="38" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>

  <!-- unit tick marks on c -->
  <g stroke="#4a7a3a" stroke-width="0.8" opacity="0.5" filter="url(#rough2)">
    <path d="M 250 276 L 288 276"/>
    <path d="M 250 290 L 288 290"/>
    <path d="M 250 304 L 288 304"/>
    <path d="M 250 318 L 288 318"/>
    <path d="M 250 332 L 288 332"/>
  </g>

  <!-- bar value labels -->
  <g font-size="11" fill="#555" text-anchor="middle" filter="url(#rough2)">
    <text x="169" y="360">a=4</text>
    <text x="219" y="360">b=4</text>
    <text x="269" y="360">c=6</text>
  </g>

  <!-- annotation box case 2 -->
  <rect x="350" y="262" width="200" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="282" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">三堆轮流配对</text>
  <text x="450" y="298" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">总 14，每次消 2</text>
  <text x="450" y="314" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⌊14/2⌋ = 7，最多剩 1</text>
  <text x="450" y="334" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 得分 = ⌊(a+b+c)/2⌋ = 7</text>

  <!-- footer -->
  <text x="280" y="390" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">两情形统一：取两上界的较小者，且该上界总能被达到</text>
</svg>
