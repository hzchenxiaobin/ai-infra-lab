<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">示例演算：5 个用户 → 10 个类别对 → 4 个可报告对</text>

  <!-- Users strip -->
  <rect x="16" y="36" width="102" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="67" y="52" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">u1: B·C·E·S</text>
  <text x="67" y="64" text-anchor="middle" font-size="8" fill="#999">→ 6 对</text>
  <rect x="126" y="36" width="102" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="177" y="52" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">u2: B·C·E</text>
  <text x="177" y="64" text-anchor="middle" font-size="8" fill="#999">→ 3 对</text>
  <rect x="236" y="36" width="102" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="287" y="52" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">u3: B·E·K·S</text>
  <text x="287" y="64" text-anchor="middle" font-size="8" fill="#999">→ 6 对</text>
  <rect x="346" y="36" width="102" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="397" y="52" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">u4: C·E·K·S</text>
  <text x="397" y="64" text-anchor="middle" font-size="8" fill="#999">→ 6 对</text>
  <rect x="456" y="36" width="102" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="507" y="52" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">u5: B·C</text>
  <text x="507" y="64" text-anchor="middle" font-size="8" fill="#999">→ 1 对</text>

  <text x="290" y="84" text-anchor="middle" font-size="9" fill="#888">B=Books　C=Clothing　E=Electronics　K=Kitchen　S=Sports（合计 22 行证词）</text>

  <!-- Table header -->
  <rect x="30" y="94" width="520" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="109" font-size="9" fill="#446688" font-weight="bold">类别对</text>
  <text x="300" y="109" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">共同购买的用户</text>
  <text x="432" y="109" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">count</text>
  <text x="505" y="109" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">≥ 3 ?</text>

  <!-- Rows -->
  <rect x="30" y="118" width="520" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="132" font-size="9" fill="#333">Books-Clothing</text>
  <text x="300" y="132" text-anchor="middle" font-size="9" fill="#333">1, 2, 5</text>
  <text x="432" y="132" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="505" y="132" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="30" y="140" width="520" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="154" font-size="9" fill="#333">Books-Electronics</text>
  <text x="300" y="154" text-anchor="middle" font-size="9" fill="#333">1, 2, 3</text>
  <text x="432" y="154" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="505" y="154" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="30" y="162" width="520" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="176" font-size="9" fill="#333">Books-Kitchen</text>
  <text x="300" y="176" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="432" y="176" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="505" y="176" text-anchor="middle" font-size="9" fill="#b85450">✗</text>

  <rect x="30" y="184" width="520" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="198" font-size="9" fill="#333">Books-Sports</text>
  <text x="300" y="198" text-anchor="middle" font-size="9" fill="#333">1, 3</text>
  <text x="432" y="198" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="505" y="198" text-anchor="middle" font-size="9" fill="#b85450">✗</text>

  <rect x="30" y="206" width="520" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="220" font-size="9" fill="#333">Clothing-Electronics</text>
  <text x="300" y="220" text-anchor="middle" font-size="9" fill="#333">1, 2, 4</text>
  <text x="432" y="220" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="505" y="220" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="30" y="228" width="520" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="242" font-size="9" fill="#333">Clothing-Kitchen</text>
  <text x="300" y="242" text-anchor="middle" font-size="9" fill="#333">4</text>
  <text x="432" y="242" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="505" y="242" text-anchor="middle" font-size="9" fill="#b85450">✗</text>

  <rect x="30" y="250" width="520" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="264" font-size="9" fill="#333">Clothing-Sports</text>
  <text x="300" y="264" text-anchor="middle" font-size="9" fill="#333">1, 4</text>
  <text x="432" y="264" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="505" y="264" text-anchor="middle" font-size="9" fill="#b85450">✗</text>

  <rect x="30" y="272" width="520" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="286" font-size="9" fill="#333">Electronics-Kitchen</text>
  <text x="300" y="286" text-anchor="middle" font-size="9" fill="#333">3, 4</text>
  <text x="432" y="286" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="505" y="286" text-anchor="middle" font-size="9" fill="#b85450">✗</text>

  <rect x="30" y="294" width="520" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="308" font-size="9" fill="#333">Electronics-Sports</text>
  <text x="300" y="308" text-anchor="middle" font-size="9" fill="#333">1, 3, 4</text>
  <text x="432" y="308" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="505" y="308" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="30" y="316" width="520" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="330" font-size="9" fill="#333">Kitchen-Sports</text>
  <text x="300" y="330" text-anchor="middle" font-size="9" fill="#333">3, 4</text>
  <text x="432" y="330" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="505" y="330" text-anchor="middle" font-size="9" fill="#b85450">✗</text>

  <path d="M 290 340 L 290 350" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="306" y="350" font-size="9" fill="#666">ORDER BY count DESC, cat1, cat2</text>

  <!-- Result box -->
  <rect x="30" y="356" width="520" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="376" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">HAVING ≥ 3 筛出 4 对；count 全为 3 ⇒ 排序退化为 (category1, category2) 升序</text>

  <rect x="42" y="388" width="118" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="101" y="403" text-anchor="middle" font-size="8.5" fill="#333">Books-Clothing　3</text>
  <rect x="167" y="388" width="118" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="226" y="403" text-anchor="middle" font-size="8.5" fill="#333">Books-Electronics　3</text>
  <rect x="292" y="388" width="118" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="351" y="403" text-anchor="middle" font-size="8.5" fill="#333">Clothing-Electr.　3</text>
  <rect x="417" y="388" width="118" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="476" y="403" text-anchor="middle" font-size="8.5" fill="#333">Electr.-Sports　3</text>

  <text x="290" y="436" text-anchor="middle" font-size="9" fill="#4a7a3a">与预期输出逐行一致 ✓</text>
</svg>
