<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：枚举 26 个字母试删一次，命中即返回 true</text>

  <!-- ====== Input: count freq ====== -->
  <rect x="190" y="40" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="63" text-anchor="middle" font-size="12.5" fill="#333">统计 freq[26]：字母出现次数</text>

  <path d="M 270 76 L 270 98" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== Loop: 遍历 i = 0..25 ====== -->
  <rect x="170" y="100" width="200" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="123" text-anchor="middle" font-size="12.5" fill="#333">遍历字母 i，freq[i]==0 跳过</text>

  <path d="M 270 136 L 270 156" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== simulate delete ====== -->
  <rect x="170" y="158" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="181" text-anchor="middle" font-size="12.5" fill="#333">freq[i]−−（模拟删一个该字母）</text>

  <path d="M 270 194 L 270 214" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== Decision diamond: 所有非零频率相等? ====== -->
  <polygon points="270,216 400,262 270,308 140,262" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="256" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">所有非零频率</text>
  <text x="270" y="272" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">是否都相等？</text>
  <text x="270" y="288" text-anchor="middle" font-size="10" fill="#888">|set(非零 freq)| == 1</text>

  <!-- Yes branch (left) → return true -->
  <path d="M 140 262 L 70 262 L 70 250" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="100" y="254" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="20" y="214" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="70" y="237" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- No branch (right) → restore & next -->
  <path d="M 400 262 L 470 262 L 470 250" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="438" y="254" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="420" y="214" width="100" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="470" y="231" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">freq[i]++</text>
  <text x="470" y="245" text-anchor="middle" font-size="10.5" fill="#888">还原，继续下一个</text>

  <!-- loop back arrow: from right box up to loop header -->
  <path d="M 520 232 L 540 232 L 540 118 L 370 118" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="544" y="175" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 544 175)">下一字母</text>

  <!-- ====== fallthrough: return false ====== -->
  <path d="M 270 308 L 270 326" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="320" font-size="10.5" fill="#888">26 个字母都试过</text>
  <rect x="180" y="328" width="180" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="347" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">return false</text>
</svg>
