<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">缩写格式：前缀 + 中间字符数 + 尾字母</text>

  <!-- word "like" breakdown -->
  <text x="40" y="74" font-size="12" fill="#888">like (len=4):</text>
  <rect x="120" y="58" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">l</text>
  <text x="172" y="80" font-size="12" fill="#888">+</text>
  <rect x="188" y="58" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="213" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="256" y="80" font-size="12" fill="#888">+</text>
  <rect x="272" y="58" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="289" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">e</text>
  <path d="M 320 75 L 360 75" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="372" y="58" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="407" y="80" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">l2e</text>
  <text x="460" y="80" font-size="11" fill="#888">len 3 &lt; 4 ✓</text>

  <!-- label row -->
  <text x="137" y="108" text-anchor="middle" font-size="10" fill="#446688">首字母</text>
  <text x="213" y="108" text-anchor="middle" font-size="10" fill="#d6a040">中间个数</text>
  <text x="289" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a">尾字母</text>

  <!-- conflict example -->
  <text x="40" y="148" font-size="13" fill="#b85450" font-weight="bold">⚠ 冲突：两个词缩写撞车</text>

  <text x="40" y="178" font-size="12" fill="#888">internal (len=8):</text>
  <rect x="150" y="162" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="183" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">i</text>
  <rect x="186" y="162" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="183" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="236" y="162" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="251" y="183" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">l</text>
  <path d="M 276 177 L 312 177" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="324" y="162" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="354" y="183" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">i6l</text>

  <text x="40" y="220" font-size="12" fill="#888">interval (len=8):</text>
  <rect x="150" y="204" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="225" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">i</text>
  <rect x="186" y="204" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="225" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="236" y="204" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="251" y="225" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">l</text>
  <path d="M 276 219 L 312 219" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="324" y="204" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="354" y="225" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">i6l</text>

  <!-- clash marker -->
  <path d="M 400 177 L 400 219" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="430" y="202" font-size="12" fill="#b85450" font-weight="bold">撞了！</text>

  <!-- resolution hint -->
  <rect x="40" y="262" width="480" height="98" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">解法：加长前缀直到缩写唯一</text>
  <text x="60" y="312" font-size="11" fill="#555">• 前缀 k=1：i6l 撞 → k=2：in5l 撞 → k=3：int4l 撞 → k=4：inte3l 撞 → k=5：inter2l 撞</text>
  <text x="60" y="332" font-size="11" fill="#555">• k=6：intern1l / interv1l，长度 8 = 原词长度 8 → 不再缩短，保留原词</text>
  <text x="60" y="352" font-size="11" fill="#b85450">→ 关键：前缀长度 = 与「最长公共前缀」+1；再判缩写是否真的更短</text>
</svg>
