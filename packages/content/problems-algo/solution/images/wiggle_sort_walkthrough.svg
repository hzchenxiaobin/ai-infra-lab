<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [3, 5, 2, 1, 6, 4]</text>

  <!-- Column headers -->
  <text x="40" y="56" font-size="10" fill="#999" font-weight="bold">i</text>
  <text x="100" y="56" font-size="10" fill="#999" font-weight="bold">奇偶</text>
  <text x="170" y="56" font-size="10" fill="#999" font-weight="bold">期望</text>
  <text x="232" y="56" font-size="10" fill="#999" font-weight="bold">检查 (i−1, i)</text>
  <text x="372" y="56" font-size="10" fill="#999" font-weight="bold">动作</text>
  <text x="470" y="56" font-size="10" fill="#999" font-weight="bold">数组状态</text>

  <!-- horizontal rule -->
  <path d="M 20 64 L 600 64" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row i=1 -->
  <text x="40" y="92" font-size="11" fill="#333">1</text>
  <text x="100" y="92" font-size="11" fill="#d6a040" font-weight="bold">奇·峰</text>
  <text x="170" y="92" font-size="11" fill="#333">a0 ≤ a1</text>
  <text x="232" y="92" font-size="11" fill="#4a7a3a">3 ≤ 5 ✓</text>
  <text x="372" y="92" font-size="11" fill="#4a7a3a">不动</text>
  <rect x="468" y="80" width="30" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="483" y="94" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="500" y="80" width="30" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="515" y="94" text-anchor="middle" font-size="10" fill="#333">5</text>
  <rect x="532" y="80" width="30" height="20" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="547" y="94" text-anchor="middle" font-size="10" fill="#999">2</text>
  <rect x="564" y="80" width="30" height="20" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="579" y="94" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="600" y="94" font-size="9" fill="#999">6 4</text>

  <!-- Row i=2 -->
  <text x="40" y="132" font-size="11" fill="#333">2</text>
  <text x="100" y="132" font-size="11" fill="#446688" font-weight="bold">偶·谷</text>
  <text x="170" y="132" font-size="11" fill="#333">a1 ≥ a2</text>
  <text x="232" y="132" font-size="11" fill="#4a7a3a">5 ≥ 2 ✓</text>
  <text x="372" y="132" font-size="11" fill="#4a7a3a">不动</text>
  <rect x="468" y="120" width="30" height="20" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="483" y="134" text-anchor="middle" font-size="10" fill="#999">3</text>
  <rect x="500" y="120" width="30" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="515" y="134" text-anchor="middle" font-size="10" fill="#333">5</text>
  <rect x="532" y="120" width="30" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="547" y="134" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="564" y="120" width="30" height="20" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="579" y="134" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="600" y="134" font-size="9" fill="#999">6 4</text>

  <!-- Row i=3 (swap) -->
  <text x="40" y="172" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="100" y="172" font-size="11" fill="#d6a040" font-weight="bold">奇·峰</text>
  <text x="170" y="172" font-size="11" fill="#333">a2 ≤ a3</text>
  <text x="232" y="172" font-size="11" fill="#b85450">2 ≤ 1 ✗</text>
  <text x="372" y="172" font-size="11" fill="#b85450" font-weight="bold">swap(2,3)</text>
  <rect x="468" y="160" width="30" height="20" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="483" y="174" text-anchor="middle" font-size="10" fill="#999">3</text>
  <rect x="500" y="160" width="30" height="20" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="515" y="174" text-anchor="middle" font-size="10" fill="#999">5</text>
  <rect x="532" y="160" width="30" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="547" y="174" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <rect x="564" y="160" width="30" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="579" y="174" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="600" y="174" font-size="9" fill="#999">6 4</text>

  <!-- Row i=4 (swap) -->
  <text x="40" y="212" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="100" y="212" font-size="11" fill="#446688" font-weight="bold">偶·谷</text>
  <text x="170" y="212" font-size="11" fill="#333">a3 ≥ a4</text>
  <text x="232" y="212" font-size="11" fill="#b85450">2 ≥ 6 ✗</text>
  <text x="372" y="212" font-size="11" fill="#b85450" font-weight="bold">swap(3,4)</text>
  <rect x="468" y="200" width="30" height="20" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="483" y="214" text-anchor="middle" font-size="10" fill="#999">3</text>
  <rect x="500" y="200" width="30" height="20" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="515" y="214" text-anchor="middle" font-size="10" fill="#999">5</text>
  <rect x="532" y="200" width="30" height="20" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="547" y="214" text-anchor="middle" font-size="10" fill="#999">1</text>
  <rect x="564" y="200" width="30" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="579" y="214" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">6</text>
  <rect x="596" y="200" width="30" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="611" y="214" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>

  <!-- Row i=5 -->
  <text x="40" y="252" font-size="11" fill="#333">5</text>
  <text x="100" y="252" font-size="11" fill="#d6a040" font-weight="bold">奇·峰</text>
  <text x="170" y="252" font-size="11" fill="#333">a4 ≤ a5</text>
  <text x="232" y="252" font-size="11" fill="#4a7a3a">2 ≤ 4 ✓</text>
  <text x="372" y="252" font-size="11" fill="#4a7a3a">不动</text>
  <rect x="468" y="240" width="30" height="20" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="483" y="254" text-anchor="middle" font-size="10" fill="#999">3</text>
  <rect x="500" y="240" width="30" height="20" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="515" y="254" text-anchor="middle" font-size="10" fill="#999">5</text>
  <rect x="532" y="240" width="30" height="20" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="547" y="254" text-anchor="middle" font-size="10" fill="#999">1</text>
  <rect x="564" y="240" width="30" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="579" y="254" text-anchor="middle" font-size="10" fill="#333">6</text>
  <rect x="596" y="240" width="30" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="611" y="254" text-anchor="middle" font-size="10" fill="#333">4</text>

  <!-- Result -->
  <path d="M 20 282 L 600 282" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="310" y="306" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结果：[3, 5, 1, 6, 2, 4]  →  3≤5≥1≤6≥2≤4 ✓</text>
  <text x="310" y="328" text-anchor="middle" font-size="10" fill="#999">两处违反（i=3、i=4）各一次相邻交换即修复，全程不回看前缀</text>
</svg>
