<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333"
        filter="url(#rough2)">核心观察：两个和都有闭式，公因子 n 一提，答案是 n 本身</text>

  <!-- 左：奇数和 -->
  <rect x="32" y="50" width="240" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="48" y="74" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">前 n 个奇数之和</text>
  <text x="48" y="98" font-size="14" fill="#333" filter="url(#rough2)">1+3+5+7 = 16</text>
  <text x="48" y="118" font-size="14" fill="#4a7a3a" filter="url(#rough2)">= 4² = n²</text>
  <text x="48" y="150" font-size="11" fill="#888" filter="url(#rough2)">n 层 L 形砌片铺满 n×n 方阵</text>

  <!-- 4×4 方阵，L 层交替着色，对角线标注 1/3/5/7 -->
  <rect x="182" y="72" width="12" height="12" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="194" y="72" width="12" height="12" fill="#cde9cd" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="206" y="72" width="12" height="12" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="218" y="72" width="12" height="12" fill="#cde9cd" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="182" y="84" width="12" height="12" fill="#cde9cd" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="194" y="84" width="12" height="12" fill="#cde9cd" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="206" y="84" width="12" height="12" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="218" y="84" width="12" height="12" fill="#cde9cd" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="182" y="96" width="12" height="12" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="194" y="96" width="12" height="12" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="206" y="96" width="12" height="12" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="218" y="96" width="12" height="12" fill="#cde9cd" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="182" y="108" width="12" height="12" fill="#cde9cd" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="194" y="108" width="12" height="12" fill="#cde9cd" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="206" y="108" width="12" height="12" fill="#cde9cd" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="218" y="108" width="12" height="12" fill="#cde9cd" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="188" y="82" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="200" y="94" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="212" y="106" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="224" y="118" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7</text>

  <!-- 右：偶数和 -->
  <rect x="288" y="50" width="240" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="304" y="74" font-size="13" fill="#b3541e" font-weight="bold" filter="url(#rough2)">前 n 个偶数之和</text>
  <text x="304" y="98" font-size="14" fill="#333" filter="url(#rough2)">2+4+6+8 = 20</text>
  <text x="304" y="118" font-size="14" fill="#b3541e" filter="url(#rough2)">= 4×5 = n(n+1)</text>
  <text x="304" y="150" font-size="11" fill="#888" filter="url(#rough2)">4×4 方阵再补一列 n ⇒ n×(n+1)</text>

  <!-- 4×5 矩形，多出的第 5 列高亮 -->
  <rect x="436" y="76" width="12" height="12" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="448" y="76" width="12" height="12" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="460" y="76" width="12" height="12" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="472" y="76" width="12" height="12" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="484" y="76" width="12" height="12" fill="#f7d488" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="436" y="88" width="12" height="12" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="448" y="88" width="12" height="12" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="460" y="88" width="12" height="12" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="472" y="88" width="12" height="12" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="484" y="88" width="12" height="12" fill="#f7d488" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="436" y="100" width="12" height="12" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="448" y="100" width="12" height="12" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="460" y="100" width="12" height="12" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="472" y="100" width="12" height="12" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="484" y="100" width="12" height="12" fill="#f7d488" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="436" y="112" width="12" height="12" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="448" y="112" width="12" height="12" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="460" y="112" width="12" height="12" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="472" y="112" width="12" height="12" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="484" y="112" width="12" height="12" fill="#f7d488" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="490" y="140" text-anchor="middle" font-size="10" fill="#b3541e" filter="url(#rough2)">+n</text>

  <!-- 汇聚箭头 -->
  <path d="M 152 168 C 170 195 190 205 214 209" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 408 168 C 390 195 370 205 346 209" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- gcd 椭圆 -->
  <ellipse cx="280" cy="212" rx="62" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="218" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">gcd(16, 20) = 4</text>

  <path d="M 280 236 L 280 252" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 推导框 -->
  <rect x="32" y="256" width="496" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="277" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">一般地：gcd(n², n·(n+1)) = n · gcd(n, n+1)</text>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">（依据：gcd(na, nb) = n · gcd(a, b)）</text>

  <!-- 结论框 -->
  <rect x="32" y="314" width="496" height="40" fill="#e6f4ea" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">相邻整数互质：d | n 且 d | n+1 ⇒ d | 1</text>
  <text x="280" y="349" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">⇒ 答案 = n · 1 = n，直接 return n</text>
</svg>
