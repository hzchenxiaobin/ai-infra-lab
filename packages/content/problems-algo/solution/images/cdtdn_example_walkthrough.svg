<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐位试除，累计命中个数</text>

  <!-- ===================== Example 1: num=7 ===================== -->
  <text x="30" y="54" font-size="13" fill="#4a7a3a" font-weight="bold">示例 1：num = 7</text>

  <text x="30" y="78" font-size="11" fill="#888">数位：</text>
  <rect x="92" y="62" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="112" y="81" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">7</text>

  <text x="150" y="78" font-size="11" fill="#888">试除：</text>
  <rect x="200" y="62" width="92" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="246" y="81" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">7 % 7 = 0 ✓</text>

  <rect x="408" y="62" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="463" y="81" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">cnt = 1 → 1</text>

  <!-- divider -->
  <path d="M 30 102 L 510 102" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- ===================== Example 2: num=121 ===================== -->
  <text x="30" y="124" font-size="13" fill="#d6a040" font-weight="bold">示例 2：num = 121</text>

  <text x="30" y="148" font-size="11" fill="#888">数位：</text>
  <rect x="92" y="132" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="112" y="151" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="138" y="132" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="158" y="151" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <rect x="184" y="132" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="204" y="151" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>

  <text x="240" y="148" font-size="11" fill="#888">试除：</text>
  <rect x="290" y="132" width="96" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="338" y="151" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">121%1=0 ✓</text>
  <rect x="392" y="132" width="96" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="440" y="151" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">121%2=1 ✗</text>
  <rect x="290" y="166" width="96" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="338" y="185" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">121%1=0 ✓</text>

  <rect x="408" y="166" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="463" y="185" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">cnt = 2 → 2</text>

  <path d="M 338 160 L 338 166" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- divider -->
  <path d="M 30 206 L 510 206" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- ===================== Example 3: num=1248 ===================== -->
  <text x="30" y="228" font-size="13" fill="#446688" font-weight="bold">示例 3：num = 1248</text>

  <text x="30" y="252" font-size="11" fill="#888">数位：</text>
  <rect x="92" y="236" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="112" y="255" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="138" y="236" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="158" y="255" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <rect x="184" y="236" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="204" y="255" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">4</text>
  <rect x="230" y="236" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="250" y="255" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">8</text>

  <text x="286" y="252" font-size="11" fill="#888">试除：</text>
  <rect x="330" y="236" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="375" y="255" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">%1=%2=%4=%8=0</text>
  <text x="430" y="252" font-size="11" fill="#4a7a3a" font-weight="bold">全 ✓</text>

  <rect x="300" y="270" width="200" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="289" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">cnt = 4 → 4（每位都能整除）</text>

  <!-- ===================== bottom summary ===================== -->
  <rect x="40" y="312" width="460" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="332" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">规律：num % d 是否为 0 决定该位是否计入；遍历全部数位求和</text>
  <text x="270" y="348" text-anchor="middle" font-size="10" fill="#888">d∈{1..9}，1 必整除任意整数 → 出现 1 的位恒计入</text>
</svg>
