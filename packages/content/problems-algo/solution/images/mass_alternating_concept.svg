<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">交替子数组和：符号由「位次」决定</text>

  <!-- ===== Array row with index labels ===== -->
  <text x="40" y="72" font-size="11" fill="#888">下标 i：</text>
  <rect x="90" y="58" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="118" y="80" text-anchor="middle" font-size="11" fill="#888">0</text>
  <rect x="160" y="58" width="56" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="188" y="80" text-anchor="middle" font-size="11" fill="#888">1</text>
  <rect x="230" y="58" width="56" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="258" y="80" text-anchor="middle" font-size="11" fill="#888">2</text>
  <rect x="300" y="58" width="56" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="328" y="80" text-anchor="middle" font-size="11" fill="#888">3</text>

  <!-- values row -->
  <text x="40" y="118" font-size="11" fill="#888">nums[i]：</text>
  <rect x="90" y="100" width="56" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="118" y="124" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="160" y="100" width="56" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="188" y="124" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">−1</text>
  <rect x="230" y="100" width="56" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="258" y="124" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="300" y="100" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="328" y="124" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <!-- ===== Subarray [3,-1,1] : signs + - + ===== -->
  <text x="40" y="172" font-size="11" fill="#4a7a3a" font-weight="bold">取子数组 [3, −1, 1]：</text>

  <!-- sign row -->
  <text x="40" y="206" font-size="11" fill="#888">位次符号：</text>
  <rect x="90" y="190" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="118" y="211" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">+</text>
  <rect x="160" y="190" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="188" y="211" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">−</text>
  <rect x="230" y="190" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="258" y="211" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">+</text>

  <!-- bracket spanning [3,-1,1] -->
  <path d="M 92 148 Q 92 160 104 160 L 232 160 Q 244 160 244 148" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- expression -->
  <rect x="380" y="186" width="220" height="38" fill="#fafafa" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" rx="6" filter="url(#rough2)"/>
  <text x="490" y="211" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3 − (−1) + 1 = 5 ⭐</text>

  <!-- ===== Contrast: subarray [2] alone ===== -->
  <text x="40" y="258" font-size="11" fill="#888" font-weight="bold">对照：单元素子数组 [2]</text>
  <rect x="300" y="240" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="328" y="262" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="90" y="240" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="118" y="262" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">+</text>
  <text x="160" y="262" font-size="11" fill="#888">（首元素恒为 +）</text>
  <rect x="380" y="236" width="220" height="38" fill="#fafafa" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" rx="6" filter="url(#rough2)"/>
  <text x="490" y="261" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2 = 2</text>

  <!-- ===== Key insight box ===== -->
  <rect x="40" y="300" width="540" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="322" font-size="12" fill="#555" font-weight="bold">核心观察</text>
  <text x="56" y="342" font-size="11" fill="#555">子数组中元素的符号不由元素自身决定，而由它在子数组中的「位次」决定：</text>
  <text x="56" y="358" font-size="11" fill="#555">偶数位次（0/2/4…）取「+」，奇数位次（1/3/5…）取「−」，首元素必为「+」。</text>
</svg>
