<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：secret = "1807" , guess = "7810"</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">先标公牛，非公牛位累计 sCnt / gCnt 频次</text>

  <rect x="30" y="64" width="540" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="55" y="82" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i</text>
  <text x="115" y="82" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">secret[i]</text>
  <text x="185" y="82" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">guess[i]</text>
  <text x="265" y="82" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">公牛?</text>
  <text x="380" y="82" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">sCnt 变化</text>
  <text x="515" y="82" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">gCnt 变化</text>

  <rect x="30" y="90" width="540" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="108" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="115" y="108" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <text x="185" y="108" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">7</text>
  <text x="265" y="108" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">否</text>
  <text x="380" y="108" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1] → {1:1}</text>
  <text x="515" y="108" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[7] → {7:1}</text>

  <rect x="30" y="116" width="540" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="55" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="115" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">8</text>
  <text x="185" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">8</text>
  <text x="265" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是 → bulls=1</text>
  <text x="380" y="134" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="515" y="134" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <rect x="30" y="142" width="540" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="115" y="160" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">0</text>
  <text x="185" y="160" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <text x="265" y="160" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">否</text>
  <text x="380" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0] → {1:1, 0:1}</text>
  <text x="515" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1] → {7:1, 1:1}</text>

  <rect x="30" y="168" width="540" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="186" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="115" y="186" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">7</text>
  <text x="185" y="186" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">0</text>
  <text x="265" y="186" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">否</text>
  <text x="380" y="186" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[7] → {1,0,7}</text>
  <text x="515" y="186" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0] → {7,1,0}</text>

  <rect x="30" y="210" width="540" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="50" y="230" font-size="12" fill="#333" filter="url(#rough2)">循环结束：bulls = 1</text>
  <text x="50" y="248" font-size="12" fill="#333" filter="url(#rough2)">cows = min(sCnt[1],gCnt[1]) + min(sCnt[0],gCnt[0]) + min(sCnt[7],gCnt[7])</text>

  <rect x="30" y="262" width="540" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="282" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">= min(1,1) + min(1,1) + min(1,1) = 3</text>

  <rect x="150" y="308" width="300" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="335" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">结果：1A3B</text>
</svg>
