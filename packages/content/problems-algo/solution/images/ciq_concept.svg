<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="470" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：固定中间对 (j,k)，左侧数 i、右侧数 l</text>
  <text x="360" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">约束 nums[i] &lt; nums[k] &lt; nums[j] &lt; nums[l]</text>

  <!-- 下标轴 -->
  <line x1="60" y1="150" x2="660" y2="150" stroke="#bbb" stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#aaa" text-anchor="middle" filter="url(#rough2)">
    <text x="60" y="142">0</text>
    <text x="660" y="142">n−1</text>
    <text x="100" y="168">i</text>
    <text x="240" y="168">j</text>
    <text x="400" y="168">k</text>
    <text x="560" y="168">l</text>
  </g>

  <!-- 锯齿值曲线：低 i — 高 j — 低 k — 高 l -->
  <path d="M 100 250 Q 170 60 240 250 Q 320 440 400 250 Q 480 60 560 250" 
        stroke="#446688" stroke-width="2.2" fill="none" stroke-dasharray="0" filter="url(#rough2)"/>

  <!-- 四个节点 -->
  <g filter="url(#rough2)">
    <!-- i 低 -->
    <circle cx="100" cy="250" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="100" y="254" text-anchor="middle" font-size="11" fill="#3a4e7a" font-weight="bold">1</text>
    <!-- j 高 -->
    <circle cx="240" cy="80" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="240" y="84" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">3</text>
    <!-- k 低 -->
    <circle cx="400" cy="250" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="400" y="254" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">2</text>
    <!-- l 高 -->
    <circle cx="560" cy="80" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="560" y="84" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  </g>

  <!-- 节点标签 -->
  <g font-size="12" font-weight="bold" filter="url(#rough2)">
    <text x="100" y="278" text-anchor="middle" fill="#3a4e7a">i（低）</text>
    <text x="240" y="60" text-anchor="middle" fill="#7a5415">j（峰）</text>
    <text x="400" y="278" text-anchor="middle" fill="#3a5a2a">k（谷）</text>
    <text x="560" y="60" text-anchor="middle" fill="#b85450">l（高）</text>
  </g>

  <!-- 左半区域 -->
  <rect x="60" y="310" width="170" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="145" y="332" text-anchor="middle" font-size="12" fill="#3a4e7a" font-weight="bold" filter="url(#rough2)">左半：数 i</text>
  <text x="145" y="352" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">i &lt; j 且 nums[i] &lt; nums[k]</text>

  <!-- 右半区域 -->
  <rect x="490" y="310" width="170" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="575" y="332" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">右半：数 l</text>
  <text x="575" y="352" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">l &gt; k 且 nums[l] &gt; nums[j]</text>

  <!-- 中间约束 -->
  <rect x="290" y="310" width="140" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="360" y="332" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold" filter="url(#rough2)">中间约束</text>
  <text x="360" y="352" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">nums[k] &lt; nums[j]</text>

  <!-- 乘法公式框 -->
  <rect x="40" y="388" width="640" height="64" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="360" y="410" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">乘法原理（左右定义域不重叠 → 独立可乘）</text>
  <text x="360" y="434" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">贡献 = #{i: nums[i]&lt;nums[k]} × #{l: nums[l]&gt;nums[j]}</text>
  <text x="360" y="452" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">i 看 [0,j) 段、l 看 (k,n) 段，两段不重叠 → 左右互不牵制</text>
</svg>
