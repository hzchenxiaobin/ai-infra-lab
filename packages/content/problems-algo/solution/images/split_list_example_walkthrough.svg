<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="560" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：head = [1..10], k = 3</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">n=10, base=3, rem=1 → 段长 [4,3,3]，游标从头逐段切断</text>

  <!-- 表头 -->
  <rect x="20" y="60" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="45" y="77" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">段号</text>
  <rect x="74" y="60" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="102" y="77" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">段长</text>
  <rect x="134" y="60" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="174" y="77" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">段头 parts[i]</text>
  <rect x="218" y="60" width="200" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="318" y="77" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">走 size-1 步到段尾</text>
  <rect x="422" y="60" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="462" y="77" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">切断后 curr</text>
  <rect x="506" y="60" width="114" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="563" y="77" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">该段结果</text>

  <!-- 行 0: 段 0 -->
  <rect x="20" y="90" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="45" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="74" y="90" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="134" y="90" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="174" y="112" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="218" y="90" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="318" y="112" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1→2→3→4（尾=4）</text>
  <rect x="422" y="90" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="462" y="112" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <rect x="506" y="90" width="114" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="563" y="112" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[1,2,3,4]</text>

  <!-- 行 1: 段 1 -->
  <rect x="20" y="128" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="45" y="150" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="74" y="128" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="150" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <rect x="134" y="128" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="174" y="150" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="218" y="128" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="318" y="150" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5→6→7（尾=7）</text>
  <rect x="422" y="128" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="462" y="150" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">8</text>
  <rect x="506" y="128" width="114" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="563" y="150" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[5,6,7]</text>

  <!-- 行 2: 段 2 -->
  <rect x="20" y="166" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="45" y="188" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <rect x="74" y="166" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="188" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <rect x="134" y="166" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="174" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <rect x="218" y="166" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="318" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8→9→10（尾=10）</text>
  <rect x="422" y="166" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="462" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">null</text>
  <rect x="506" y="166" width="114" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="563" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[8,9,10]</text>

  <!-- 切断说明 -->
  <rect x="20" y="214" width="600" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="34" y="234" font-size="11" fill="#8a6a20" font-weight="bold">切断三步（每段尾部执行）：</text>
  <text x="34" y="252" font-size="11" fill="#555">① nxt = curr.next     → 先记下一段头，避免置空后丢失入口</text>
  <text x="34" y="268" font-size="11" fill="#555">② curr.next = null     → 与本段解耦；③ curr = nxt → 游标跳到下一段头</text>

  <!-- 结果链表可视化 -->
  <text x="20" y="304" font-size="12" fill="#444" font-weight="bold">最终结果（三段各自独立，next 均已置空）：</text>

  <!-- 段 0 -->
  <text x="20" y="338" font-size="10" fill="#4a7a3a" font-weight="bold">parts[0]</text>
  <g font-size="12">
    <rect x="80" y="324" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="97" y="344" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <rect x="116" y="324" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="133" y="344" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <rect x="152" y="324" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="169" y="344" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <rect x="188" y="324" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="205" y="344" text-anchor="middle" fill="#333" font-weight="bold">4</text>
  </g>
  <g stroke="#4a7a3a" stroke-width="1.2" fill="none">
    <line x1="114" y1="339" x2="116" y2="339" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="150" y1="339" x2="152" y2="339" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="186" y1="339" x2="188" y2="339" marker-end="url(#arr)" filter="url(#rough2)"/>
  </g>
  <text x="230" y="344" font-size="10" fill="#b85450" font-weight="bold">✂ next=null</text>

  <!-- 段 1 -->
  <text x="20" y="378" font-size="10" fill="#446688" font-weight="bold">parts[1]</text>
  <g font-size="12">
    <rect x="80" y="364" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="97" y="384" text-anchor="middle" fill="#333" font-weight="bold">5</text>
    <rect x="116" y="364" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="133" y="384" text-anchor="middle" fill="#333" font-weight="bold">6</text>
    <rect x="152" y="364" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="169" y="384" text-anchor="middle" fill="#333" font-weight="bold">7</text>
  </g>
  <g stroke="#446688" stroke-width="1.2" fill="none">
    <line x1="114" y1="379" x2="116" y2="379" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="150" y1="379" x2="152" y2="379" marker-end="url(#arr)" filter="url(#rough2)"/>
  </g>
  <text x="194" y="384" font-size="10" fill="#b85450" font-weight="bold">✂ next=null</text>

  <!-- 段 2 -->
  <text x="20" y="418" font-size="10" fill="#446688" font-weight="bold">parts[2]</text>
  <g font-size="12">
    <rect x="80" y="404" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="97" y="424" text-anchor="middle" fill="#333" font-weight="bold">8</text>
    <rect x="116" y="404" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="133" y="424" text-anchor="middle" fill="#333" font-weight="bold">9</text>
    <rect x="152" y="404" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="169" y="424" text-anchor="middle" fill="#333" font-weight="bold">10</text>
  </g>
  <g stroke="#446688" stroke-width="1.2" fill="none">
    <line x1="114" y1="419" x2="116" y2="419" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="150" y1="419" x2="152" y2="419" marker-end="url(#arr)" filter="url(#rough2)"/>
  </g>
  <text x="194" y="424" font-size="10" fill="#b85450" font-weight="bold">✂ next=null</text>

  <!-- 空段说明（n<k 情形对照） -->
  <rect x="20" y="448" width="600" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="34" y="468" font-size="11" fill="#446688" font-weight="bold">对照示例 1（n &lt; k）：head=[1,2,3], k=5 → base=0, rem=3</text>
  <text x="34" y="484" font-size="11" fill="#555">前 3 段 size=0+1=1（各 1 节点），后 2 段 size=0 → parts[i]=curr(null) + continue 留 null</text>
  <text x="34" y="498" font-size="11" fill="#555">结果：[[1],[2],[3],[],[]]   ← base=0 与空段统一由 size==0 分支处理，无需特判</text>

  <!-- 底部要点 -->
  <rect x="20" y="514" width="600" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="34" y="532" font-size="11" fill="#b85450" font-weight="bold">观察：</text>
  <text x="34" y="546" font-size="11" fill="#555">段长 4/3/3 差距≤1 且前≥后；切断后各段 next 均为 null，彼此独立；游标 curr 顺次推进，总步数 = n - 非空段数 ≤ n。</text>
</svg>
