<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：建集合 → 逐词扫描 → 第二次命中即返回</text>

  <!-- 建集合 -->
  <rect x="60" y="32" width="180" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="47" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">bannedWords 全部插入集合</text>
  <text x="150" y="61" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">建表 O(m·L)，m ≤ 10^5</text>
  <path d="M 150 68 L 150 78" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="95" y="80" width="110" height="22" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="95" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt = 0，i = 0</text>
  <path d="M 150 102 L 150 110" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环判断 -->
  <polygon points="150,112 205,127 150,142 95,127" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i &lt; n ?</text>
  <path d="M 207 127 L 326 127" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="248" y="120" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="330" y="113" width="150" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="405" y="131" text-anchor="middle" font-size="12" fill="#2f5424" font-weight="bold" filter="url(#rough2)">返回 false</text>
  <text x="405" y="153" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">扫描结束仍未凑满 2 次命中</text>
  <text x="158" y="152" text-anchor="start" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 150 142 L 150 152" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取词 -->
  <rect x="95" y="154" width="110" height="22" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">w = message[i]</text>
  <path d="M 150 176 L 150 184" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 在集合中？ -->
  <polygon points="150,186 205,201 150,216 95,201" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="205" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">w ∈ set ?</text>
  <text x="158" y="228" text-anchor="start" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 150 216 L 150 226" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 计数 -->
  <rect x="105" y="228" width="90" height="22" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="243" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt++</text>
  <path d="M 150 250 L 150 258" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 到 2 了吗？ -->
  <polygon points="150,260 205,275 150,290 95,275" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="279" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">cnt == 2 ?</text>
  <path d="M 207 275 L 326 275" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="248" y="268" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="330" y="261" width="150" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="405" y="279" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 true（提前退出）</text>
  <path d="M 95 275 L 46 275" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="88" y="268" text-anchor="end" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 95 201 L 46 201" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="88" y="194" text-anchor="end" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 左侧回边：i++ 回循环 -->
  <path d="M 40 275 L 40 91 L 90 91" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="23" y="222" width="34" height="24" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="238" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">i++</text>

  <!-- 底部要点框 -->
  <rect x="60" y="312" width="400" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">两条出口不对称：true 在循环内部（第二次命中当场返回）</text>
  <text x="260" y="344" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">false 在循环之后——只有扫完全部单词才能下「不是垃圾」的结论</text>
</svg>
