<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    示例演算：nums = [2,1,1,5,6,2,3,1]
  </text>

  <!-- 表头：下标 i -->
  <text x="70" y="78" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">下标 i</text>
  <rect x="80" y="60" width="52" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="106" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="134" y="60" width="52" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="188" y="60" width="52" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="214" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="242" y="60" width="52" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="268" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="296" y="60" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="322" y="81" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="350" y="60" width="52" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="376" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="404" y="60" width="52" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="430" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="458" y="60" width="52" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="484" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>

  <!-- 行：nums[i] -->
  <text x="70" y="124" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">nums[i]</text>
  <rect x="80" y="106" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="106" y="127" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="134" y="106" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="127" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="188" y="106" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="214" y="127" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="242" y="106" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="268" y="127" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="296" y="106" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="322" y="127" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="350" y="106" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="376" y="127" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="404" y="106" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="430" y="127" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="458" y="106" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="484" y="127" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <!-- 行：lis[i] -->
  <text x="70" y="170" text-anchor="end" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">lis[i] ↑</text>
  <rect x="80" y="152" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="106" y="173" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="134" y="152" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="173" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="188" y="152" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="214" y="173" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="242" y="152" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="268" y="173" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="296" y="152" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="322" y="173" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="350" y="152" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="376" y="173" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="404" y="152" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="430" y="173" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="458" y="152" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="484" y="173" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <!-- 行：lds[i] -->
  <text x="70" y="216" text-anchor="end" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">lds[i] ↓</text>
  <rect x="80" y="198" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="106" y="219" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="134" y="198" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="219" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="188" y="198" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="214" y="219" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="242" y="198" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="268" y="219" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="296" y="198" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="322" y="219" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="350" y="198" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="376" y="219" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="404" y="198" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="430" y="219" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="458" y="198" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="484" y="219" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <!-- 行：mountain[i] = lis+lds-1（只标合法峰顶） -->
  <text x="70" y="262" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">mountain</text>
  <text x="106" y="262" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">—</text>
  <text x="160" y="262" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">✗</text>
  <text x="214" y="262" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">✗</text>
  <rect x="242" y="248" width="52" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="267" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="296" y="244" width="52" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="268" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="350" y="248" width="52" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="376" y="267" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="404" y="248" width="52" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="267" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="484" y="262" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">—</text>

  <!-- 峰顶标注 -->
  <text x="322" y="240" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">峰顶 i=4</text>

  <!-- 结论框 -->
  <rect x="120" y="310" width="360" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="338" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">最大山形长度 = 5</text>
  <text x="300" y="360" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">峰顶 i=4（值 6）：lis=[1,5,6] + lds=[6,3,1]</text>
  <text x="300" y="378" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">拼接去重峰顶 → [1,5,6,3,1]</text>
  <text x="300" y="408" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = n − 5 = 8 − 5 = 3</text>
</svg>
