<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：累积异或 xr，末值为 0 则存在</text>

  <!-- ===== Example 1 ===== -->
  <text x="30" y="64" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">示例 1　derived = [1, 1, 0]</text>

  <!-- derived row -->
  <text x="30" y="104" font-size="12" fill="#666" filter="url(#rough2)">derived</text>
  <rect x="90" y="82" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="115" y="106" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="170" y="82" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195" y="106" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="250" y="82" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="275" y="106" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>

  <!-- xr accumulated row -->
  <text x="30" y="168" font-size="12" fill="#666" filter="url(#rough2)">xr 累积</text>
  <text x="58" y="168" font-size="13" fill="#888" filter="url(#rough2)">0</text>
  <line x1="78" y1="164" x2="92" y2="164" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="84" y="156" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">⊕1</text>

  <rect x="90" y="146" width="50" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="115" y="170" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <line x1="140" y1="164" x2="172" y2="164" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="156" y="156" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">⊕1</text>

  <rect x="170" y="146" width="50" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195" y="170" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <line x1="220" y1="164" x2="252" y2="164" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="236" y="156" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">⊕0</text>

  <rect x="250" y="146" width="50" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="275" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>

  <text x="320" y="168" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">→ 末值 0 ⇒ true ✅</text>

  <!-- reconstruction -->
  <rect x="30" y="196" width="520" height="26" rx="6" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="214" font-size="11" fill="#444" filter="url(#rough2)">重建 original: o0=0, o1=0⊕1=1, o2=1⊕1=0；闭环 d2=0 == o2⊕o0 = 0⊕0 = 0 ✓</text>

  <!-- ===== Example 3 ===== -->
  <text x="30" y="262" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">示例 3　derived = [1, 0]</text>

  <!-- derived row -->
  <text x="30" y="304" font-size="12" fill="#666" filter="url(#rough2)">derived</text>
  <rect x="90" y="282" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="115" y="306" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="170" y="282" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195" y="306" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>

  <!-- xr accumulated row -->
  <text x="30" y="368" font-size="12" fill="#666" filter="url(#rough2)">xr 累积</text>
  <text x="58" y="368" font-size="13" fill="#888" filter="url(#rough2)">0</text>
  <line x1="78" y1="364" x2="92" y2="364" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="84" y="356" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">⊕1</text>

  <rect x="90" y="346" width="50" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="115" y="370" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <line x1="140" y1="364" x2="172" y2="364" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="156" y="356" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">⊕0</text>

  <rect x="170" y="346" width="50" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="195" y="370" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>

  <text x="240" y="368" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">→ 末值 1 ⇒ false ❌</text>

  <!-- reconstruction -->
  <rect x="30" y="396" width="520" height="20" rx="6" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="411" font-size="11" fill="#444" filter="url(#rough2)">重建 original: o0=0, o1=0⊕1=1；闭环 d1=0 ≠ o1⊕o0 = 1⊕0 = 1 ✗</text>
</svg>
