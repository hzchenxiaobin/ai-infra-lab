<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：s1="parker", s2="morris", baseStr="parser"</text>

  <!-- section: union steps -->
  <text x="20" y="50" font-size="11.5" fill="#446688" font-weight="bold">阶段一：逐对 union（字典序小者当根）</text>

  <!-- table header -->
  <rect x="24" y="58" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="59" y="75" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">i</text>
  <rect x="94" y="58" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="139" y="75" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">s1[i]~s2[i]</text>
  <rect x="184" y="58" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="234" y="75" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">find 结果</text>
  <rect x="284" y="58" width="110" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="339" y="75" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">操作</text>
  <rect x="394" y="58" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="454" y="75" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">等价类</text>

  <!-- row i=0: p~m -->
  <rect x="24" y="82" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="59" y="100" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="94" y="82" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="139" y="100" text-anchor="middle" font-size="11" fill="#333">p ~ m</text>
  <rect x="184" y="82" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="234" y="100" text-anchor="middle" font-size="11" fill="#333">p, m</text>
  <rect x="284" y="82" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="339" y="100" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">parent[p]=m</text>
  <rect x="394" y="82" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="454" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">{m←p}</text>

  <!-- row i=1: a~o -->
  <rect x="24" y="108" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="59" y="126" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="94" y="108" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="139" y="126" text-anchor="middle" font-size="11" fill="#333">a ~ o</text>
  <rect x="184" y="108" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="234" y="126" text-anchor="middle" font-size="11" fill="#333">a, o</text>
  <rect x="284" y="108" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="339" y="126" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">parent[o]=a</text>
  <rect x="394" y="108" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="454" y="126" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">{a←o}</text>

  <!-- row i=2: r~r skip -->
  <rect x="24" y="134" width="70" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="59" y="152" text-anchor="middle" font-size="11" fill="#888">2</text>
  <rect x="94" y="134" width="90" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="139" y="152" text-anchor="middle" font-size="11" fill="#888">r ~ r</text>
  <rect x="184" y="134" width="100" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="234" y="152" text-anchor="middle" font-size="11" fill="#888">r, r</text>
  <rect x="284" y="134" width="110" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="339" y="152" text-anchor="middle" font-size="10.5" fill="#aaa">同根，跳过</text>
  <rect x="394" y="134" width="120" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="454" y="152" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <!-- row i=3: k~r -->
  <rect x="24" y="160" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="59" y="178" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="94" y="160" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="139" y="178" text-anchor="middle" font-size="11" fill="#333">k ~ r</text>
  <rect x="184" y="160" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="234" y="178" text-anchor="middle" font-size="11" fill="#333">k, r</text>
  <rect x="284" y="160" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="339" y="178" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">parent[r]=k</text>
  <rect x="394" y="160" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="454" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">{k←r}</text>

  <!-- row i=4: e~i -->
  <rect x="24" y="186" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="59" y="204" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="94" y="186" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="139" y="204" text-anchor="middle" font-size="11" fill="#333">e ~ i</text>
  <rect x="184" y="186" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="234" y="204" text-anchor="middle" font-size="11" fill="#333">e, i</text>
  <rect x="284" y="186" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="339" y="204" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">parent[i]=e</text>
  <rect x="394" y="186" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="454" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">{e←i}</text>

  <!-- row i=5: r~s -->
  <rect x="24" y="212" width="70" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="59" y="230" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="94" y="212" width="90" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="139" y="230" text-anchor="middle" font-size="11" fill="#333">r ~ s</text>
  <rect x="184" y="212" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="234" y="230" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">k, s</text>
  <rect x="284" y="212" width="110" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="339" y="230" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">parent[s]=k</text>
  <rect x="394" y="212" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="454" y="230" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">{k←r,s}</text>

  <!-- note for i=5 -->
  <text x="270" y="256" text-anchor="middle" font-size="10" fill="#d6a040">↑ find(r)=k（r 的根已是 k），k&lt;s 故 parent[s]=k → {k,r,s} 合并</text>

  <!-- section 2: baseStr replacement -->
  <text x="20" y="284" font-size="11.5" fill="#b85450" font-weight="bold">阶段二：baseStr 逐字符 find 替换</text>

  <!-- baseStr chars -->
  <text x="40" y="312" font-size="11" fill="#888">baseStr：</text>
  <rect x="104" y="298" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="121" y="316" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">p</text>
  <rect x="140" y="298" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="316" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="176" y="298" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="193" y="316" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">r</text>
  <rect x="212" y="298" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="316" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">s</text>
  <rect x="248" y="298" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="316" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>
  <rect x="284" y="298" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="316" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">r</text>

  <!-- arrows down -->
  <text x="121" y="340" text-anchor="middle" font-size="9" fill="#888">find</text>
  <text x="157" y="340" text-anchor="middle" font-size="9" fill="#888">find</text>
  <text x="193" y="340" text-anchor="middle" font-size="9" fill="#888">find</text>
  <text x="229" y="340" text-anchor="middle" font-size="9" fill="#888">find</text>
  <text x="265" y="340" text-anchor="middle" font-size="9" fill="#888">find</text>
  <text x="301" y="340" text-anchor="middle" font-size="9" fill="#888">find</text>

  <!-- result chars -->
  <text x="40" y="370" font-size="11" fill="#888">result：</text>
  <rect x="104" y="356" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="121" y="374" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">m</text>
  <rect x="140" y="356" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="374" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">a</text>
  <rect x="176" y="356" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="193" y="374" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">k</text>
  <rect x="212" y="356" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="374" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">k</text>
  <rect x="248" y="356" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="374" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">e</text>
  <rect x="284" y="356" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="374" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">k</text>

  <!-- mapping annotations -->
  <text x="340" y="366" font-size="9.5" fill="#888">p→m, a→a, r→k, s→k,</text>
  <text x="340" y="378" font-size="9.5" fill="#888">e→e, r→k</text>

  <!-- final result -->
  <rect x="60" y="396" width="420" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="418" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">输出："makkek"</text>
</svg>
