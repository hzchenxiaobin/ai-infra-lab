<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 2 演算：nums = [3,4,5,1,2]</text>
  <text x="300" y="42" text-anchor="middle" font-size="11" fill="#888">递归分治 → 组合计数 → 减去原排列</text>

  <!-- ===== Top: Recursion tree ===== -->
  <text x="60" y="66" font-size="11" fill="#446688" font-weight="bold">递归树</text>

  <!-- Root node -->
  <rect x="180" y="60" width="240" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="78" text-anchor="middle" font-size="10" fill="#333">f([3,4,5,1,2])</text>
  <text x="300" y="96" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">= C(4,2) × f([1,2]) × f([4,5]) = 6</text>

  <!-- Lines to children -->
  <path d="M 250 104 L 160 136" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <path d="M 350 104 L 440 136" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- Left child: f([1,2]) -->
  <rect x="70" y="138" width="180" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160" y="155" text-anchor="middle" font-size="9" fill="#333">f([1,2])</text>
  <text x="160" y="170" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">= C(1,0) × 1 × 1 = 1</text>

  <!-- Right child: f([4,5]) -->
  <rect x="350" y="138" width="180" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="440" y="155" text-anchor="middle" font-size="9" fill="#333">f([4,5])</text>
  <text x="440" y="170" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">= C(1,0) × 1 × 1 = 1</text>

  <!-- Sub-children notes -->
  <text x="160" y="196" text-anchor="middle" font-size="8" fill="#888">root=1, left=[], right=[2]</text>
  <text x="440" y="196" text-anchor="middle" font-size="8" fill="#888">root=4, left=[], right=[5]</text>

  <!-- arrow to bottom section -->
  <path d="M 300 210 L 300 226" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== Bottom: 6 interleavings ===== -->
  <text x="60" y="234" font-size="11" fill="#446688" font-weight="bold">6 种交错排列（含原排列）</text>
  <text x="300" y="234" font-size="10" fill="#888">左序列 [1,2] 与右序列 [4,5] 保序交错</text>

  <!-- Interleaving rows -->
  <g font-size="10">
    <!-- Row 1: [1,2,4,5] -->
    <rect x="100" y="244" width="22" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="111" y="258" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="124" y="244" width="22" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="135" y="258" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="148" y="244" width="22" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="159" y="258" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <rect x="172" y="244" width="22" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="183" y="258" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
    <text x="210" y="258" font-size="9" fill="#4a7a3a">✓ 有效</text>

    <!-- Row 2: [1,4,2,5] -->
    <rect x="100" y="270" width="22" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="111" y="284" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="124" y="270" width="22" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="135" y="284" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <rect x="148" y="270" width="22" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="159" y="284" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="172" y="270" width="22" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="183" y="284" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
    <text x="210" y="284" font-size="9" fill="#4a7a3a">✓ 有效</text>

    <!-- Row 3: [1,4,5,2] -->
    <rect x="100" y="296" width="22" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="111" y="310" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="124" y="296" width="22" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="135" y="310" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <rect x="148" y="296" width="22" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="159" y="310" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
    <rect x="172" y="296" width="22" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="183" y="310" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="210" y="310" font-size="9" fill="#4a7a3a">✓ 有效</text>
  </g>

  <!-- Right column rows -->
  <g font-size="10">
    <!-- Row 4: [4,1,2,5] -->
    <rect x="340" y="244" width="22" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="351" y="258" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <rect x="364" y="244" width="22" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="375" y="258" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="388" y="244" width="22" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="399" y="258" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="412" y="244" width="22" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="423" y="258" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
    <text x="450" y="258" font-size="9" fill="#4a7a3a">✓ 有效</text>

    <!-- Row 5: [4,1,5,2] -->
    <rect x="340" y="270" width="22" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="351" y="284" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <rect x="364" y="270" width="22" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="375" y="284" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="388" y="270" width="22" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="399" y="284" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
    <rect x="412" y="270" width="22" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="423" y="284" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="450" y="284" font-size="9" fill="#4a7a3a">✓ 有效</text>

    <!-- Row 6: [4,5,1,2] = ORIGINAL -->
    <rect x="340" y="296" width="22" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="351" y="310" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <rect x="364" y="296" width="22" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="375" y="310" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <rect x="388" y="296" width="22" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="399" y="310" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="412" y="296" width="22" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="423" y="310" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <text x="450" y="310" font-size="9" fill="#b85450" font-weight="bold">✗ 原排列，排除</text>
  </g>

  <!-- ===== Final answer box ===== -->
  <rect x="30" y="338" width="540" height="84" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="362" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">总方案数（含原排列）= C(4,2) × 1 × 1 = 6</text>
  <text x="300" y="384" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">答案 = 6 - 1 = 5</text>
  <text x="300" y="406" text-anchor="middle" font-size="10" fill="#888">5 种有效重排：[3,1,2,4,5] [3,1,4,2,5] [3,1,4,5,2] [3,4,1,2,5] [3,4,1,5,2]</text>
</svg>
