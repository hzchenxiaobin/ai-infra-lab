<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：三个官方示例各走一遍公式</text>

  <!-- 示例 1 -->
  <rect x="18" y="36" width="484" height="104" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="32" y="56" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">示例 1：word = "abbcccc"</text>

  <rect x="52" y="66" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="65" y="84" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">a</text>
  <rect x="82" y="66" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="95" y="84" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">b</text>
  <rect x="110" y="66" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="123" y="84" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">b</text>
  <rect x="140" y="66" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="153" y="84" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">c</text>
  <rect x="168" y="66" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="181" y="84" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">c</text>
  <rect x="196" y="66" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="209" y="84" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">c</text>
  <rect x="224" y="66" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="237" y="84" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">c</text>

  <text x="286" y="76" font-size="10" fill="#4a4a4a" filter="url(#rough2)">runs：a | bb | cccc</text>
  <text x="286" y="92" font-size="10" fill="#4a4a4a" filter="url(#rough2)">ans = 1 + 0 + 1 + 3</text>
  <text x="32" y="126" font-size="9.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">5 个方案：abbcccc · abcccc · abbccc · abbcc · abbc</text>

  <!-- 示例 2 -->
  <rect x="18" y="152" width="484" height="92" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="32" y="172" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">示例 2：word = "abcd"（全字符互不相同）</text>

  <rect x="52" y="182" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="65" y="200" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">a</text>
  <rect x="82" y="182" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="95" y="200" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">b</text>
  <rect x="112" y="182" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="125" y="200" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">c</text>
  <rect x="142" y="182" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="155" y="200" text-anchor="middle" font-size="11" fill="#8f3a36" filter="url(#rough2)">d</text>

  <text x="200" y="192" font-size="10" fill="#4a4a4a" filter="url(#rough2)">runs：a | b | c | d（m = 4 段，全 L=1）</text>
  <text x="200" y="208" font-size="10" fill="#4a4a4a" filter="url(#rough2)">ans = 1 + 0 + 0 + 0 + 0 = 1</text>
  <text x="32" y="232" font-size="9.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">没有重复字符 ⇒ 按多久都只出一个 ⇒ 唯一方案 t = "abcd"</text>

  <!-- 示例 3 -->
  <rect x="18" y="256" width="484" height="92" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="32" y="276" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">示例 3：word = "aaaa"（一整段）</text>

  <rect x="52" y="286" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="65" y="304" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">a</text>
  <rect x="82" y="286" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="95" y="304" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">a</text>
  <rect x="112" y="286" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="125" y="304" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">a</text>
  <rect x="142" y="286" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="155" y="304" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">a</text>

  <text x="200" y="296" font-size="10" fill="#4a4a4a" filter="url(#rough2)">runs：aaaa（m = 1 段，L = 4）</text>
  <text x="200" y="312" font-size="10" fill="#4a4a4a" filter="url(#rough2)">ans = 1 + (4 − 1) = 4</text>
  <text x="32" y="336" font-size="9.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">4 个方案：a · aa · aaa · aaaa（按 1~4 次，各有各的样）</text>

  <!-- 小结 -->
  <rect x="18" y="358" width="484" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="380" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">💡 用 n − m + 1 复核：7 − 3 + 1 = 5 ✓   4 − 4 + 1 = 1 ✓   4 − 1 + 1 = 4 ✓</text>
  <text x="260" y="400" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">（n = 串长，m = 段数；答案只依赖 run 结构，与字符本身无关）</text>
</svg>
