<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">一次拆分合并 = 剪下块 + 粘到任意空隙（状态图上的一条边）</text>

  <!-- ==================== 左列：操作解剖 ==================== -->

  <!-- Row 1: 原数组 -->
  <text x="24" y="68" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">原数组</text>
  <rect x="64" y="50" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="81" y="70" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="100" y="50" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="117" y="70" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="136" y="50" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="153" y="70" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="172" y="50" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="189" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="208" y="50" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="244" y="50" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="261" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">5</text>

  <path d="M 62 86 L 62 94 L 170 94 L 170 86" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="116" y="108" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">剪出 [L..R] = [1,1,2]</text>

  <path d="M 116 112 L 116 128" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row 2: 块与剩余分离 -->
  <text x="24" y="152" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">块</text>
  <rect x="64" y="134" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="154" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="98" y="134" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="114" y="154" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="132" y="134" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="154" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="188" y="152" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">剩余</text>
  <rect x="226" y="134" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="154" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="260" y="134" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="154" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="294" y="134" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="154" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">5</text>

  <!-- 可粘贴空隙 carets -->
  <path d="M 221 176 L 231 176 L 226 167 z" fill="#d6a040" filter="url(#rough2)"/>
  <path d="M 254 176 L 264 176 L 259 167 z" fill="#d6a040" filter="url(#rough2)"/>
  <path d="M 288 176 L 298 176 L 293 167 z" fill="#d6a040" filter="url(#rough2)"/>
  <path d="M 321 176 L 331 176 L 326 167 z" fill="#d6a040" filter="url(#rough2)"/>
  <text x="276" y="192" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4 个可粘贴空隙</text>

  <!-- 块飘向空隙的箭头 -->
  <path d="M 98 170 Q 170 208 286 174" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <path d="M 200 196 L 200 208" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row 3: 新数组 -->
  <text x="24" y="230" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">新数组</text>
  <rect x="64" y="212" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="232" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="98" y="212" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="114" y="232" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="132" y="212" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="232" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="166" y="212" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="182" y="232" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="200" y="212" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="232" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="234" y="212" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="232" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">5</text>
  <text x="98" y="262" font-size="10" fill="#888" filter="url(#rough2)">块保持原顺序粘进空隙 → 得到一个新的排列（新状态）</text>

  <!-- ==================== 右列：状态图 BFS ==================== -->

  <text x="455" y="48" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">状态图：排列 = 节点，操作 = 边</text>

  <rect x="395" y="64" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="455" y="84" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">(3,1,2)</text>
  <text x="455" y="112" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">层 0（起点）</text>

  <path d="M 445 94 Q 400 118 386 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 455 94 L 453 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 465 94 Q 510 118 520 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="455" y="126" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1 次操作 = 1 条边</text>

  <rect x="350" y="140" width="64" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="382" y="158" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(1,2,3)✓</text>
  <rect x="421" y="140" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="453" y="158" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">(3,2,1)</text>
  <rect x="492" y="140" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="524" y="158" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">(1,3,2)</text>

  <text x="382" y="186" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">目标！答案 = 1</text>

  <text x="455" y="216" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">还有层 2、层 3 …… 继续分层扩展</text>
  <text x="455" y="236" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（实测 n = 6 时最远也只需 4 步）</text>

  <!-- ==================== 底部：关键观察 ==================== -->

  <rect x="20" y="278" width="530" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="285" y="300" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">关键观察</text>
  <text x="40" y="322" font-size="10.5" fill="#666" filter="url(#rough2)">① 状态总数 ≤ 6! = 720 个排列（重复元素更少）——全图 BFS 毫秒级</text>
  <text x="40" y="342" font-size="10.5" fill="#666" filter="url(#rough2)">② 单个状态的邻居 = 枚举 (L, R, 粘贴点 i)，共 O(n³) ≤ 216 个</text>
  <text x="40" y="362" font-size="10.5" fill="#666" filter="url(#rough2)">③ 操作可逆 → 无向无权图：最少操作数 = BFS 首次命中的层数</text>
</svg>
