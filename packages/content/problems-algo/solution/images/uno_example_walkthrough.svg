<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：arr = [1,2,2,1,1,3]</text>

  <!-- ===== Phase A: count table ===== -->
  <text x="40" y="50" font-size="11" fill="#446688" font-weight="bold">阶段一：逐个计数</text>

  <!-- column headers -->
  <text x="30" y="72" text-anchor="middle" font-size="10" fill="#888">i</text>
  <text x="100" y="72" text-anchor="middle" font-size="10" fill="#888">arr[i]</text>
  <text x="280" y="72" text-anchor="middle" font-size="10" fill="#888">freq 处理后</text>

  <line x1="16" y1="78" x2="524" y2="78" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row i=0 : 1 -> freq{1:1} -->
  <text x="30" y="100" text-anchor="middle" font-size="11" fill="#999">0</text>
  <rect x="84" y="86" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="102" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="280" y="102" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">freq{1:1}</text>

  <!-- row i=1 : 2 -> freq{1:1,2:1} -->
  <text x="30" y="126" text-anchor="middle" font-size="11" fill="#999">1</text>
  <rect x="84" y="112" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="128" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="280" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">freq{1:1, 2:1}</text>

  <!-- row i=2 : 2 -> freq{1:1,2:2} -->
  <text x="30" y="152" text-anchor="middle" font-size="11" fill="#999">2</text>
  <rect x="84" y="138" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="154" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="280" y="154" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">freq{1:1, 2:2}</text>

  <!-- row i=3 : 1 -> freq{1:2,2:2} -->
  <text x="30" y="178" text-anchor="middle" font-size="11" fill="#999">3</text>
  <rect x="84" y="164" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="180" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="280" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">freq{1:2, 2:2}</text>

  <!-- row i=4 : 1 -> freq{1:3,2:2} -->
  <text x="30" y="204" text-anchor="middle" font-size="11" fill="#999">4</text>
  <rect x="84" y="190" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="280" y="206" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">freq{1:3, 2:2}</text>

  <!-- row i=5 : 3 -> freq{1:3,2:2,3:1} -->
  <text x="30" y="230" text-anchor="middle" font-size="11" fill="#999">5</text>
  <rect x="84" y="216" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="232" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="280" y="232" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">freq{1:3, 2:2, 3:1}</text>

  <line x1="16" y1="244" x2="524" y2="244" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- ===== Phase B: uniqueness check ===== -->
  <text x="40" y="268" font-size="11" fill="#4a7a3a" font-weight="bold">阶段二：逐个频次查重 —— 维护 seen 集合</text>

  <!-- column headers -->
  <text x="60" y="288" text-anchor="middle" font-size="10" fill="#888">来源值</text>
  <text x="160" y="288" text-anchor="middle" font-size="10" fill="#888">频次 c</text>
  <text x="300" y="288" text-anchor="middle" font-size="10" fill="#888">c ∈ seen?</text>
  <text x="440" y="288" text-anchor="middle" font-size="10" fill="#888">seen 处理后</text>

  <line x1="16" y1="294" x2="524" y2="294" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row : value 1 -> c=3 -> not in seen -> add -->
  <text x="60" y="316" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="140" y="302" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="318" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="300" y="318" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">否</text>
  <text x="440" y="318" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">seen = {3}</text>

  <!-- row : value 2 -> c=2 -> not in seen -> add -->
  <text x="60" y="342" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <rect x="140" y="328" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="344" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="300" y="344" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">否</text>
  <text x="440" y="344" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">seen = {3, 2}</text>

  <!-- row : value 3 -> c=1 -> not in seen -> add -->
  <text x="60" y="368" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <rect x="140" y="354" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="370" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="300" y="370" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">否</text>
  <text x="440" y="370" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">seen = {3, 2, 1}</text>

  <!-- arrow down to result -->
  <path d="M 270 384 L 270 400" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="150" y="402" width="240" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="421" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">无重复频次 → 返回 true</text>

  <!-- note -->
  <rect x="60" y="440" width="420" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="456" text-anchor="middle" font-size="11" fill="#444">注：示例 2 arr=[1,2] → 频次 {1:1, 2:1}，第二个 1 命中 seen → false</text>
  <text x="270" y="468" text-anchor="middle" font-size="10" fill="#888">值不同但出现次数相同，正是本题要拦截的情况</text>
</svg>
