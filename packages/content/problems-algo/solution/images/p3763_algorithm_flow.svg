<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：按阈值排序 + 最大堆模拟</text>

  <!-- 开始 -->
  <ellipse cx="110" cy="60" rx="42" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="65" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 110 80 L 110 100" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 排序 -->
  <rect x="30" y="102" width="160" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="119" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">下标按 threshold 升序</text>
  <text x="110" y="135" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">得到待放行队列 idx[]</text>
  <path d="M 110 142 L 110 162" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="30" y="164" width="160" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="187" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">step=1，i=0，ans=0</text>
  <path d="M 110 200 L 110 222" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 放行循环 -->
  <rect x="18" y="224" width="184" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="244" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">把 threshold[idx[i]] ≤ step</text>
  <text x="110" y="260" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">的 nums[idx[i]] 全部压入最大堆</text>
  <text x="110" y="276" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">（每个下标恰好入堆一次）</text>

  <!-- 判定：堆空？ -->
  <path d="M 202 253 L 248 253" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 300 213 L 336 178 L 372 213 L 336 248 L 300 213 z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="336" y="226" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">堆空？</text>
  <text x="336" y="242" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(无可选下标)</text>

  <!-- 是 → 返回 -->
  <path d="M 336 211 L 336 178 L 336 152 L 336 132" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="344" y="164" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="266" y="94" width="140" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="336" y="117" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">流程结束，返回 ans</text>

  <!-- 否 → 取堆顶 -->
  <path d="M 372 231 L 412 231" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="414" y="204" width="130" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="479" y="224" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">弹出堆顶 max</text>
  <text x="479" y="240" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans += max，step += 1</text>
  <text x="479" y="254" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">（每步恰好取一个）</text>

  <!-- 回到放行循环 -->
  <path d="M 479 260 L 479 320 L 110 320 L 110 284" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="290" y="336" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">进入下一 step（先放行新下标，再看堆）</text>

  <!-- 底部备注 -->
  <rect x="60" y="352" width="440" height="36" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="375" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">n ≤ 10⁵，排序 O(n log n) + 堆操作 O(n log n)</text>
</svg>
