<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L5,9 L10,0 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L5,9 L10,0 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L5,9 L10,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：计数定三区，一趟扫描按类落位</text>

  <!-- ===== Original array row ===== -->
  <text x="40" y="56" font-size="11.5" fill="#555" font-weight="bold">原数组 nums（示例 1，pivot = 10）：</text>

  <rect x="60" y="68" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="92" y="94" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>

  <rect x="124" y="68" width="64" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="156" y="94" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">12</text>

  <rect x="188" y="68" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="220" y="94" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>

  <rect x="252" y="68" width="64" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="284" y="94" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>

  <rect x="316" y="68" width="64" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="348" y="94" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">14</text>

  <rect x="380" y="68" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="412" y="94" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <rect x="444" y="68" width="64" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="476" y="94" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>

  <!-- Legend -->
  <rect x="500" y="70" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="520" y="82" font-size="9.5" fill="#888">&lt; pivot</text>
  <rect x="500" y="88" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="520" y="100" font-size="9.5" fill="#888">= pivot</text>
  <rect x="500" y="106" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="520" y="118" font-size="9.5" fill="#888">&gt; pivot</text>

  <!-- ===== Count box ===== -->
  <path d="M 284 108 L 284 132" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="296" y="128" font-size="9.5" fill="#888" font-weight="bold">统计</text>

  <rect x="60" y="136" width="448" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="161" font-size="11.5" fill="#333" font-weight="bold">一趟计数：</text>
  <text x="170" y="161" font-size="12" fill="#446688" font-weight="bold">less = 3</text>
  <text x="240" y="161" font-size="10.5" fill="#888">(9, 5, 3)</text>
  <text x="312" y="161" font-size="12" fill="#d6a040" font-weight="bold">equal = 2</text>
  <text x="384" y="161" font-size="10.5" fill="#888">(10, 10)</text>
  <text x="448" y="161" font-size="12" fill="#b85450" font-weight="bold">greater = 2</text>

  <!-- arrow down to result -->
  <path d="M 284 176 L 284 198" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="296" y="194" font-size="9.5" fill="#888" font-weight="bold">定区</text>

  <!-- ===== Result array with three regions ===== -->
  <text x="40" y="220" font-size="11.5" fill="#555" font-weight="bold">结果 ans（三段连续区，下标范围由计数决定）：</text>

  <!-- region brackets -->
  <path d="M 60 238 L 60 232 L 252 232 L 252 238" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="156" y="228" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">less 区 [0, 3)</text>

  <path d="M 252 238 L 252 232 L 380 232 L 380 238" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="316" y="228" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">equal 区 [3, 5)</text>

  <path d="M 380 238 L 380 232 L 508 232 L 508 238" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="444" y="228" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">greater 区 [5, 7)</text>

  <!-- result cells -->
  <rect x="60" y="240" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="92" y="266" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <text x="92" y="294" text-anchor="middle" font-size="8.5" fill="#446688">idx0</text>

  <rect x="124" y="240" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="156" y="266" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="156" y="294" text-anchor="middle" font-size="8.5" fill="#446688">idx1</text>

  <rect x="188" y="240" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="220" y="266" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="220" y="294" text-anchor="middle" font-size="8.5" fill="#446688">idx2</text>

  <rect x="252" y="240" width="64" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="284" y="266" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>
  <text x="284" y="294" text-anchor="middle" font-size="8.5" fill="#d6a040">idx3</text>

  <rect x="316" y="240" width="64" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="348" y="266" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>
  <text x="348" y="294" text-anchor="middle" font-size="8.5" fill="#d6a040">idx4</text>

  <rect x="380" y="240" width="64" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="412" y="266" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">12</text>
  <text x="412" y="294" text-anchor="middle" font-size="8.5" fill="#b85450">idx5</text>

  <rect x="444" y="240" width="64" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="476" y="266" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">14</text>
  <text x="476" y="294" text-anchor="middle" font-size="8.5" fill="#b85450">idx6</text>

  <!-- ===== Key formula ===== -->
  <rect x="40" y="312" width="480" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="56" y="334" font-size="11.5" fill="#333" font-weight="bold">三游标起点由计数给出，扫描时按类别落位、游标自增：</text>
  <text x="56" y="356" font-size="12.5" fill="#446688" font-family="'Comic Sans MS', monospace" font-weight="bold">l = 0</text>
  <text x="120" y="356" font-size="12.5" fill="#d6a040" font-family="'Comic Sans MS', monospace" font-weight="bold">e = less</text>
  <text x="210" y="356" font-size="12.5" fill="#b85450" font-family="'Comic Sans MS', monospace" font-weight="bold">g = less + equal</text>
  <text x="56" y="376" font-size="11" fill="#555">x&lt;pivot→ans[l++]　x==pivot→ans[e++]　x&gt;pivot→ans[g++]</text>
</svg>
