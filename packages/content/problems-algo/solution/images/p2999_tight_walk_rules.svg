<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">贴上界游走：沿 x 的前缀区逐位三条规则</text>
  <text x="280" y="42" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">pre = n − L 为前缀区长度；pw[k] = (limit+1)^k；走到第 i 位看 x[i]：</text>

  <!-- rule 1 -->
  <rect x="20" y="54" width="520" height="104" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="36" y="78" font-size="12.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">规则 ① 贴住：x[i] ≤ limit → 本位放 0..x[i]−1</text>
  <g filter="url(#rough2)">
    <rect x="36" y="88" width="28" height="28" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="68" y="88" width="28" height="28" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="100" y="88" width="28" height="28" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="132" y="88" width="28" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="164" y="88" width="84" height="28" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="252" y="88" width="56" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="50" y="107" text-anchor="middle" font-size="11" fill="#33507a">x₀</text>
    <text x="82" y="107" text-anchor="middle" font-size="11" fill="#33507a">x₁</text>
    <text x="114" y="107" text-anchor="middle" font-size="11" fill="#33507a">⋯</text>
    <text x="146" y="107" text-anchor="middle" font-size="11" fill="#b07818">d</text>
    <text x="206" y="107" text-anchor="middle" font-size="9.5" fill="#33507a">任取 0..limit</text>
    <text x="280" y="107" text-anchor="middle" font-size="10.5" fill="#2e5c22">= s</text>
    <text x="68" y="130" text-anchor="middle" font-size="9.5" fill="#555">贴住</text>
    <text x="146" y="130" text-anchor="middle" font-size="9.5" fill="#555">放小</text>
    <text x="206" y="130" text-anchor="middle" font-size="9.5" fill="#555">每位自由</text>
    <text x="280" y="130" text-anchor="middle" font-size="9.5" fill="#555">固定</text>
    <text x="360" y="96" font-size="12" fill="#33507a">res += x[i] · pw[pre−1−i]</text>
    <text x="360" y="116" font-size="11" fill="#555">→ 继续右移，看下一位</text>
  </g>

  <!-- rule 2 -->
  <rect x="20" y="168" width="520" height="104" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="36" y="192" font-size="12.5" fill="#8c3a36" font-weight="bold" filter="url(#rough2)">规则 ② 断开：x[i] &gt; limit → x[i] 本身放不下，贴靠到此为止</text>
  <g filter="url(#rough2)">
    <rect x="36" y="202" width="28" height="28" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.5"/>
    <rect x="68" y="202" width="28" height="28" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.5"/>
    <rect x="100" y="202" width="28" height="28" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.5"/>
    <rect x="132" y="202" width="64" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="200" y="202" width="84" height="28" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="288" y="202" width="56" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="50" y="221" text-anchor="middle" font-size="11" fill="#8c3a36">x₀</text>
    <text x="82" y="221" text-anchor="middle" font-size="11" fill="#8c3a36">x₁</text>
    <text x="114" y="221" text-anchor="middle" font-size="11" fill="#8c3a36">⋯</text>
    <text x="164" y="221" text-anchor="middle" font-size="9.5" fill="#b07818">0..limit</text>
    <text x="242" y="221" text-anchor="middle" font-size="9.5" fill="#8c3a36">任取 0..limit</text>
    <text x="316" y="221" text-anchor="middle" font-size="10.5" fill="#2e5c22">= s</text>
    <text x="68" y="244" text-anchor="middle" font-size="9.5" fill="#555">贴住</text>
    <text x="164" y="244" text-anchor="middle" font-size="9.5" fill="#555">本位也自由</text>
    <text x="242" y="244" text-anchor="middle" font-size="9.5" fill="#555">全自由</text>
    <text x="316" y="244" text-anchor="middle" font-size="9.5" fill="#555">固定</text>
    <text x="368" y="210" font-size="12" fill="#8c3a36">res += pw[pre−i]</text>
    <text x="368" y="230" font-size="11" fill="#8c3a36">立即收工，return res</text>
  </g>

  <!-- rule 3 -->
  <rect x="20" y="282" width="520" height="104" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="36" y="306" font-size="12.5" fill="#2e5c22" font-weight="bold" filter="url(#rough2)">规则 ③ 走完全程：i 到达 pre —— 整条前缀与 x 相同</text>
  <g filter="url(#rough2)">
    <rect x="36" y="316" width="28" height="28" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="68" y="316" width="28" height="28" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="100" y="316" width="28" height="28" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="132" y="316" width="28" height="28" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="164" y="316" width="120" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="50" y="335" text-anchor="middle" font-size="11" fill="#2e5c22">x₀</text>
    <text x="82" y="335" text-anchor="middle" font-size="11" fill="#2e5c22">x₁</text>
    <text x="114" y="335" text-anchor="middle" font-size="11" fill="#2e5c22">⋯</text>
    <text x="146" y="335" text-anchor="middle" font-size="9" fill="#2e5c22">x pre−1</text>
    <text x="224" y="335" text-anchor="middle" font-size="9.5" fill="#2e5c22">s 与 x 后缀比较</text>
    <text x="98" y="358" text-anchor="middle" font-size="9.5" fill="#555">全部贴住</text>
    <text x="224" y="358" text-anchor="middle" font-size="9.5" fill="#555">s ≤ x[pre:] ?</text>
    <text x="368" y="324" font-size="12" fill="#2e5c22">成立 → res += 1</text>
    <text x="368" y="344" font-size="11" fill="#555">（y = x 前缀 + s ≤ x）</text>
  </g>

  <text x="280" y="412" text-anchor="middle" font-size="11" fill="#b07818" filter="url(#rough2)">哨兵：len(x) &lt; L → 0；len(x) == L → 只看 x ≥ s ? 1 : 0</text>
</svg>
