<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">promisify 算法流程</text>

  <!-- Step 1: 返回 new Promise -->
  <rect x="150" y="55" width="240" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="78" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① return new Promise(...)</text>
  <text x="270" y="96" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">立即返回 pending Promise</text>

  <line x1="270" y1="105" x2="270" y2="128" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: 调用原函数 -->
  <rect x="120" y="132" width="300" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="155" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② fn(callback, ...args)</text>
  <text x="270" y="173" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">把自制 callback 注入第一参</text>

  <line x1="270" y1="182" x2="270" y2="205" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: callback 被调用 -->
  <rect x="135" y="209" width="270" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="237" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ callback(value, error) 被触发</text>

  <line x1="270" y1="253" x2="270" y2="272" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 决策菱形 -->
  <polygon points="270,276 360,320 270,364 180,320" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="316" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">error 为</text>
  <text x="270" y="334" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">真值？</text>

  <!-- 是 → reject -->
  <line x1="180" y1="320" x2="100" y2="320" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="312" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="20" y="340" width="155" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="97" y="362" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">reject(error)</text>
  <text x="97" y="380" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">Promise 失败</text>

  <!-- 否 → resolve -->
  <line x1="360" y1="320" x2="438" y2="320" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="312" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="365" y="340" width="155" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="442" y="362" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">resolve(value)</text>
  <text x="442" y="380" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">Promise 成功</text>
</svg>
