<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrd" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="620" height="410" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：按值分组 → 下标表双指针滑窗</text>

  <!-- start -->
  <rect x="240" y="38" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="280" y="57" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 280 66 L 280 78" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 1 -->
  <rect x="110" y="80" width="340" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="101" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 一次遍历：按值收集下标表 pos[x]（值域 1~n 可用数组）</text>
  <path d="M 280 114 L 280 124" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2 diamond: more values? -->
  <polygon points="280,124 390,152 280,180 170,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="148" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">还有值 x？</text>
  <text x="280" y="164" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">逐个枚举</text>

  <!-- no: return ans -->
  <path d="M 390 152 L 424 152" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="144" font-size="10" fill="#999" filter="url(#rough2)">否</text>
  <rect x="424" y="134" width="112" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="480" y="156" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">④ 返回 ans</text>

  <!-- yes: init -->
  <path d="M 280 180 L 280 194" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="192" font-size="10" fill="#999" filter="url(#rough2)">是</text>
  <text x="318" y="192" font-size="10" fill="#999" filter="url(#rough2)">i ← 0</text>

  <!-- step 3 -->
  <rect x="140" y="196" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="217" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">③ j 右移：代价 = p[j] − p[i] − (j − i)</text>
  <path d="M 280 230 L 280 242" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 5 diamond: cost > k? -->
  <polygon points="280,244 400,288 280,332 160,288" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">代价 &gt; k ？</text>
  <text x="280" y="300" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">删除预算超了吗</text>

  <!-- no: update ans -->
  <path d="M 400 288 L 426 288" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="280" font-size="10" fill="#999" filter="url(#rough2)">否</text>
  <rect x="426" y="270" width="122" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="487" y="292" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">ans ← max(ans, j−i+1)</text>

  <!-- yes: shrink -->
  <path d="M 280 332 L 280 344" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="342" font-size="10" fill="#999" filter="url(#rough2)">是</text>
  <rect x="190" y="346" width="180" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">i++（左端收缩）</text>

  <!-- shrink loop back to diamond -->
  <path d="M 190 362 L 118 362 L 118 288 L 156 288" stroke="#999" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#arrd)" filter="url(#rough2)"/>
  <text x="112" y="250" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">回循环</text>

  <!-- G loop back to step 3 (j right move) -->
  <path d="M 487 270 L 487 213 L 424 213" stroke="#999" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#arrd)" filter="url(#rough2)"/>
  <text x="493" y="240" font-size="10" fill="#999" filter="url(#rough2)">j 右移</text>

  <!-- value loop: j done -> next value -->
  <path d="M 487 306 L 487 392 L 80 392 L 80 152 L 166 152" stroke="#999" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#arrd)" filter="url(#rough2)"/>
  <text x="284" y="386" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j 遍历完 p → 取下一个值 x</text>

  <text x="604" y="404" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">总复杂度 O(n)：各下标表长度之和 = n</text>
</svg>
