<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：成与败</text>

  <text x="20" y="64" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① n = 192  → true</text>
  <rect x="20" y="74" width="80" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="60" y="98" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">192</text>
  <rect x="104" y="74" width="80" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="144" y="98" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">384</text>
  <rect x="188" y="74" width="80" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="228" y="98" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">576</text>
  <text x="278" y="98" font-size="12" fill="#666" filter="url(#rough2)">→</text>
  <rect x="294" y="74" width="150" height="38" fill="#f6f8fa" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="369" y="98" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">192384576</text>

  <text x="20" y="134" font-size="11" fill="#666" filter="url(#rough2)">长度 9 · 无 0 · 排序后 = "123456789"</text>
  <text x="320" y="134" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 迷人</text>

  <line x1="20" y1="158" x2="520" y2="158" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <text x="20" y="184" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">② n = 100  → false</text>
  <rect x="20" y="194" width="80" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="60" y="218" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">100</text>
  <rect x="104" y="194" width="80" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="144" y="218" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">200</text>
  <rect x="188" y="194" width="80" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="228" y="218" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">300</text>
  <text x="278" y="218" font-size="12" fill="#666" filter="url(#rough2)">→</text>
  <rect x="294" y="194" width="150" height="38" fill="#f6f8fa" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="369" y="218" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">100200300</text>

  <text x="20" y="254" font-size="11" fill="#666" filter="url(#rough2)">含 0 ✓ · 含重复数字（1/0/2/3 各多次）</text>
  <text x="320" y="254" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 非迷人</text>

  <line x1="20" y1="278" x2="520" y2="278" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <text x="20" y="304" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">观察：n ∈ [100, 333] 才可能凑齐 9 位</text>
  <text x="20" y="326" font-size="11" fill="#666" filter="url(#rough2)">n ≥ 334 时 3n ≥ 1002（4 位），拼接超过 9 位必重复</text>
  <text x="20" y="344" font-size="11" fill="#666" filter="url(#rough2)">实际迷人的三位数仅 4 个：192 · 219 · 273 · 327</text>

  <text x="20" y="368" font-size="11" fill="#888" filter="url(#rough2)">（219 → 219438657 · 273 → 273546819 · 327 → 327654981）</text>
</svg>
