<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟封顶后缀积 + 一趟前缀和扫描</text>

  <rect x="30" y="44" width="270" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="165" y="61" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">① 从右往左建封顶后缀积：suf[n−1] = 1</text>
  <text x="165" y="79" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">suf[i] = min(suf[i+1] × nums[i+1], CAP)</text>

  <path d="M 165 86 L 165 94" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="98" width="270" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="165" y="115" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">② 从左往右：pre = 0，i = 0</text>

  <path d="M 165 124 L 165 134" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 165 140 L 252 166 L 165 192 L 78 166 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="165" y="170" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">pre == suf[i] ?</text>

  <text x="257" y="157" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 252 166 L 262 166" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="268" y="152" width="186" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="361" y="170" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 i —— 最小平衡下标</text>

  <path d="M 165 192 L 165 212" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="173" y="206" font-size="10" fill="#888" filter="url(#rough2)">否</text>

  <path d="M 165 218 L 242 244 L 165 270 L 88 244 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="165" y="248" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">pre &gt; suf[i] ?</text>

  <text x="247" y="235" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 242 244 L 262 244" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="268" y="230" width="186" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="361" y="248" text-anchor="middle" font-size="10.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">返回 −1（差值只增不减）</text>

  <path d="M 165 270 L 165 280" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="173" y="278" font-size="10" fill="#888" filter="url(#rough2)">否</text>

  <rect x="80" y="286" width="170" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="165" y="303" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">pre += nums[i]，i++</text>

  <path d="M 80 299 L 24 299 L 24 166 L 72 166" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="32" y="291" font-size="9.5" fill="#888" filter="url(#rough2)">i ≤ n−1</text>

  <path d="M 165 312 L 165 322" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="175" y="319" font-size="9.5" fill="#888" filter="url(#rough2)">i == n</text>

  <rect x="70" y="326" width="190" height="22" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="165" y="341" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">i 走到 n ⇒ 扫描完，返回 −1</text>

  <rect x="268" y="268" width="186" height="74" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="361" y="286" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">⚠️ 封顶为什么安全</text>
  <text x="361" y="304" text-anchor="middle" font-size="9.6" fill="#8a6d1f" filter="url(#rough2)">suf[i] = CAP ⟺ 真实积 ≥ CAP</text>
  <text x="361" y="321" text-anchor="middle" font-size="9.6" fill="#8a6d1f" filter="url(#rough2)">&gt; 10¹⁴ ≥ pre，必不相等</text>
  <text x="361" y="338" text-anchor="middle" font-size="9.6" fill="#8a6d1f" filter="url(#rough2)">suf[i] &lt; CAP 则是精确值</text>
</svg>
