<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：极大递增段分解，合法摆法只有两种</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2k 窗口里唯一无约束的相邻对是接缝 (a+k−1, a+k) ⇒ 窗口内断裂数 ≤ 1 且恰在接缝</text>

  <text x="260" y="64" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">nums = [2, 5, 7, 8, 9, 2, 3, 4, 3, 1] 切成 4 个极大递增段：</text>

  <!-- run 1: 蓝色 5 格 -->
  <rect x="60" y="74" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="100" y="74" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="140" y="74" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="74" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="220" y="74" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="80" y="100" text-anchor="middle" font-size="15" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="120" y="100" text-anchor="middle" font-size="15" fill="#33506b" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="160" y="100" text-anchor="middle" font-size="15" fill="#33506b" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="200" y="100" text-anchor="middle" font-size="15" fill="#33506b" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="240" y="100" text-anchor="middle" font-size="15" fill="#33506b" font-weight="bold" filter="url(#rough2)">9</text>

  <!-- run 2: 绿色 3 格 -->
  <rect x="260" y="74" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="300" y="74" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="340" y="74" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="100" text-anchor="middle" font-size="15" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="320" y="100" text-anchor="middle" font-size="15" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="360" y="100" text-anchor="middle" font-size="15" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- run 3/4: 橙、红各 1 格 -->
  <rect x="380" y="74" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="400" y="100" text-anchor="middle" font-size="15" fill="#a07830" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="420" y="74" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="440" y="100" text-anchor="middle" font-size="15" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 下标 -->
  <text x="80" y="126" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="120" y="126" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="160" y="126" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="200" y="126" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="240" y="126" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="280" y="126" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="320" y="126" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">6</text>
  <text x="360" y="126" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">7</text>
  <text x="400" y="126" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">8</text>
  <text x="440" y="126" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">9</text>

  <!-- 断裂标记 -->
  <text x="260" y="142" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="380" y="142" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="420" y="142" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="286" y="142" font-size="9" fill="#b85450" filter="url(#rough2)">断裂</text>

  <!-- 段长标注 -->
  <text x="160" y="160" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">段1 · L₁=5</text>
  <text x="320" y="160" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">段2 · L₂=3</text>
  <text x="410" y="160" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">L₃=1</text>
  <text x="452" y="160" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">L₄=1</text>

  <!-- 情况一 -->
  <rect x="18" y="176" width="236" height="110" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="136" y="196" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">情况一：两段同属一个长 L 的段</text>
  <rect x="44" y="206" width="27" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="71" y="206" width="27" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="98" y="206" width="27" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="125" y="206" width="27" height="27" fill="#e8f0fe" stroke="#7a9ac0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="152" y="206" width="27" height="27" fill="#e8f0fe" stroke="#7a9ac0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="179" y="206" width="27" height="27" fill="#e8f0fe" stroke="#7a9ac0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="84" y="200" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold" filter="url(#rough2)">第一段 k</text>
  <text x="165" y="200" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">第二段 k</text>
  <text x="136" y="252" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">k + k ≤ L ⇒ 贡献 ⌊L/2⌋</text>
  <text x="136" y="272" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">如整段 [1,2,3,4]（L=4）→ k=2</text>

  <!-- 情况二 -->
  <rect x="266" y="176" width="236" height="110" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="384" y="196" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">情况二：恰好跨过一条接缝</text>
  <rect x="288" y="206" width="22" height="27" fill="#e8f0fe" stroke="#7a9ac0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="310" y="206" width="22" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="332" y="206" width="22" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="354" y="206" width="22" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="376" y="206" width="22" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="398" y="206" width="22" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="420" y="206" width="22" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="442" y="206" width="22" height="27" fill="#e6f4ea" stroke="#a8c89a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <path d="M 375 202 L 375 240" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="375" y="252" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">接缝：此处可以断！</text>
  <text x="384" y="270" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">前段取后缀 k 个 + 后段取前缀 k 个</text>
  <text x="384" y="284" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">⇒ 贡献 min(L₁, L₂)</text>

  <!-- 结论 -->
  <rect x="30" y="296" width="460" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">答案 = max( 各段 ⌊Lᵢ/2⌋ , 相邻两段 min(Lᵢ, Lᵢ₊₁) ) = max(2, 3) = 3 ✓</text>

  <!-- 陷阱 -->
  <rect x="20" y="344" width="480" height="56" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="364" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 严格递增 = nums[i−1] &lt; nums[i]，相等也是断裂！示例 2 的 [4,4,4,4] 三个相邻对全是断裂。</text>
  <text x="34" y="382" font-size="10" fill="#333" filter="url(#rough2)">一次遍历维护 cur（当前段长）与 prev（上一段长）即可，无需显式建段列表；窗口若含 ≥2 个断裂，必有一段内部踩雷，不合法。</text>
</svg>
