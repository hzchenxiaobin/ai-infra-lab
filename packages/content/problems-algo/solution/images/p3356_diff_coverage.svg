<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">check(k) 内核：差分还原「前 k 条查询的覆盖总量」，逐位与 nums 比较</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">一次 check 花 O(k) 打点 + O(n) 还原比较；本图 k = 2（取前两条查询）</text>

  <!-- 表头 -->
  <rect x="24" y="54" width="118" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="83" y="72" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">下标 →</text>
  <rect x="142" y="54" width="50" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="167" y="72" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="194" y="54" width="50" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="219" y="72" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="246" y="54" width="50" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="271" y="72" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="298" y="54" width="50" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="323" y="72" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="350" y="54" width="50" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="375" y="72" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="402" y="54" width="50" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="427" y="72" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="454" y="54" width="42" height="28" fill="#f7f7f7" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="475" y="68" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>
  <text x="475" y="79" text-anchor="middle" font-size="7.5" fill="#aaa" filter="url(#rough2)">哨兵</text>

  <!-- 行1：查询① -->
  <rect x="24" y="86" width="118" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="83" y="105" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">查询① [1,3,2]</text>
  <rect x="142" y="86" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="167" y="105" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <rect x="194" y="86" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="219" y="105" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">+2</text>
  <rect x="246" y="86" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="271" y="105" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <rect x="298" y="86" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="323" y="105" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <rect x="350" y="86" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="375" y="105" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">−2</text>
  <rect x="402" y="86" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="427" y="105" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <rect x="454" y="86" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="475" y="105" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>

  <!-- 行2：查询② -->
  <rect x="24" y="120" width="118" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="83" y="139" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">查询② [2,4,1]</text>
  <rect x="142" y="120" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="167" y="139" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <rect x="194" y="120" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="219" y="139" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <rect x="246" y="120" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="271" y="139" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">+1</text>
  <rect x="298" y="120" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="323" y="139" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <rect x="350" y="120" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="375" y="139" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <rect x="402" y="120" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="427" y="139" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="454" y="120" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="475" y="139" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>

  <!-- 行3：cov -->
  <rect x="24" y="154" width="118" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="83" y="175" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">前缀和 → cov</text>
  <rect x="142" y="154" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="167" y="175" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="194" y="154" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="219" y="175" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="246" y="154" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="271" y="175" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="298" y="154" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="323" y="175" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="350" y="154" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="375" y="175" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="402" y="154" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="427" y="175" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="454" y="154" width="42" height="34" fill="#f7fbf7" stroke="#9cb89c" stroke-width="1" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="475" y="175" text-anchor="middle" font-size="11" fill="#7a9a7a" filter="url(#rough2)">(0)</text>

  <!-- 行4：nums -->
  <rect x="24" y="192" width="118" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="83" y="211" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">nums（目标）</text>
  <rect x="142" y="192" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="167" y="211" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="194" y="192" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="219" y="211" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="246" y="192" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="271" y="211" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="298" y="192" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="323" y="211" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="350" y="192" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="375" y="211" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="402" y="192" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="427" y="211" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="454" y="192" width="42" height="30" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="475" y="211" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">−</text>

  <!-- 行5：判定 -->
  <rect x="24" y="226" width="118" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="83" y="247" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">cov ≥ nums ?</text>
  <rect x="142" y="226" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="167" y="247" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0≥0 ✓</text>
  <rect x="194" y="226" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="219" y="247" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2≥2 ✓</text>
  <rect x="246" y="226" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="271" y="247" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3≥3 ✓</text>
  <rect x="298" y="226" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="323" y="247" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">3&lt;4 ✗</text>
  <rect x="350" y="226" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="375" y="247" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1≥1 ✓</text>
  <rect x="402" y="226" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="427" y="247" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0≥0 ✓</text>
  <rect x="454" y="226" width="42" height="34" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="475" y="247" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">−</text>

  <!-- 前缀和方向 -->
  <path d="M 148 278 L 464 278" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="306" y="270" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">前缀和方向：cov[i] = diff[0] + … + diff[i]</text>

  <!-- 底部注 -->
  <rect x="24" y="292" width="472" height="92" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="312" font-size="10.5" fill="#333" filter="url(#rough2)">每条查询 = 给 [l, r] 内每位发一叠「至多减 val、可不减」的券</text>
  <text x="34" y="330" font-size="10.5" fill="#333" filter="url(#rough2)">cov_i = 前 k 条中覆盖 i 的查询 val 总和 = 该位「至多能减多少」</text>
  <text x="34" y="348" font-size="10.5" fill="#333" filter="url(#rough2)">富余不要紧：每位恰好用 nums[i] 张券即可精确归零 → 判定是 ≥，不是 =</text>
  <text x="34" y="366" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">任一位不足（下标 3：3 &lt; 4）→ 这个 k 不可行，答案在更右侧</text>
</svg>
