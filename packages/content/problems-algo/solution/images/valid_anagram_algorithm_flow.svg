<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：长度快判 → 计数抵消 → 全零校验</text>

  <!-- ====== Step 1: length check ====== -->
  <polygon points="270,46 410,86 270,126 130,86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="80" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">len(s) == len(t) ?</text>
  <text x="270" y="98" text-anchor="middle" font-size="10" fill="#888">长度不同必非异位词</text>

  <!-- no branch -->
  <path d="M 130 86 L 60 86 L 60 140" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="92" y="78" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="20" y="142" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="164" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>

  <!-- yes branch -->
  <path d="M 410 86 L 480 86 L 480 140" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="448" y="78" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ====== Step 2: count loop ====== -->
  <rect x="350" y="142" width="260" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="164" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">遍历 i = 0 .. n−1</text>
  <text x="480" y="182" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#446688">cnt[s[i]]++;  cnt[t[i]]−−;</text>
  <text x="480" y="196" text-anchor="middle" font-size="9.5" fill="#888">一次循环同时处理两串同下标字符</text>

  <text x="270" y="160" font-size="10.5" fill="#888">建 cnt[26]={0}</text>
  <path d="M 270 110 L 270 140 L 348 168" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop back arrow -->
  <path d="M 480 198 L 480 216 L 620 216 L 620 168 L 614 168" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="556" y="210" font-size="9" fill="#888">下一对 i++</text>

  <!-- ====== Step 3: zero check ====== -->
  <path d="M 480 198 L 480 232" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="510" y="220" font-size="9.5" fill="#888">遍历完</text>

  <polygon points="270,236 410,276 270,316 130,276" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="270" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">cnt 全为 0 ?</text>
  <text x="270" y="288" text-anchor="middle" font-size="10" fill="#888">逐格校验 26 格</text>

  <!-- left: yes -->
  <path d="M 130 276 L 80 276 L 80 330" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="100" y="268" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="30" y="332" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="80" y="354" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return true ✓</text>

  <!-- right: no -->
  <path d="M 410 276 L 460 276 L 460 330" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="440" y="268" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="410" y="332" width="100" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="460" y="354" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false ✗</text>

  <!-- ====== Side notes ====== -->
  <rect x="350" y="232" width="180" height="0" fill="none"/>

  <rect x="430" y="240" width="100" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="480" y="262" text-anchor="middle" font-size="10.5" fill="#446688">校验阶段 O(26)</text>

  <!-- ====== bottom complexity ====== -->
  <rect x="170" y="332" width="180" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="354" text-anchor="middle" font-size="10.5" fill="#555">总体 O(n) 时间 / O(1) 空间</text>
</svg>
