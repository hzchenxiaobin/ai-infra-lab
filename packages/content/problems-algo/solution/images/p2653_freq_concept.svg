<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">值域仅 101 个：频率数组 + 从小到大累加找第 x 小</text>

  <!-- nums array with window -->
  <text x="30" y="62" font-size="12" fill="#888">窗口 [1,-1,-3] (k=3):</text>
  <rect x="150" y="48" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="67" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="192" y="48" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="67" text-anchor="middle" font-size="12" fill="#333">-1</text>
  <rect x="234" y="48" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="67" text-anchor="middle" font-size="12" fill="#333">-3</text>
  <path d="M 150 86 L 276 86" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrG)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="292" y="90" font-size="10" fill="#d6a040">k=3</text>

  <!-- frequency array: show -3..1 with ellipsis -->
  <text x="30" y="130" font-size="12" fill="#888">freq[v+50]:</text>
  <text x="118" y="130" font-size="12" fill="#aaa">···</text>
  <!-- value -3 -->
  <rect x="140" y="112" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="128" text-anchor="middle" font-size="10" fill="#888">-3</text>
  <text x="160" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <!-- value -2 -->
  <rect x="182" y="112" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="128" text-anchor="middle" font-size="10" fill="#888">-2</text>
  <text x="202" y="146" text-anchor="middle" font-size="12" fill="#999">0</text>
  <!-- value -1 -->
  <rect x="224" y="112" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="244" y="128" text-anchor="middle" font-size="10" fill="#888">-1</text>
  <text x="244" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <!-- value 0 -->
  <rect x="266" y="112" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="286" y="128" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="286" y="146" text-anchor="middle" font-size="12" fill="#999">0</text>
  <!-- value 1 -->
  <rect x="308" y="112" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="328" y="128" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="328" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="352" y="130" font-size="12" fill="#aaa">···</text>
  <text x="388" y="124" font-size="10" fill="#888">v ∈ [-50,50]</text>
  <text x="388" y="138" font-size="10" fill="#b85450">负数区高亮</text>

  <!-- accumulation scan -->
  <text x="30" y="184" font-size="12" fill="#888">累加 cnt (x=2):</text>
  <path d="M 160 174 L 240 174" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="194" text-anchor="middle" font-size="10" fill="#b85450">cnt=1</text>
  <text x="202" y="194" text-anchor="middle" font-size="10" fill="#999">cnt=1</text>
  <text x="244" y="194" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">cnt=2≥x</text>
  <text x="286" y="194" text-anchor="middle" font-size="10" fill="#aaa">…</text>

  <!-- result -->
  <rect x="135" y="214" width="285" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="278" y="239" text-anchor="middle" font-size="12" fill="#333">第 2 小 = -1 &lt; 0  →  美丽值 = -1 ✓</text>

  <!-- insight box -->
  <rect x="30" y="276" width="460" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键观察</text>
  <text x="260" y="316" text-anchor="middle" font-size="11" fill="#555">|值域| = 101，每窗扫描 O(101) = O(1)，总 O(n)</text>
  <text x="260" y="333" text-anchor="middle" font-size="10" fill="#888">滑动时 O(1) 增删频率，无需排序 / 无需有序集合</text>
</svg>
