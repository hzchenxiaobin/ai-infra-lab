<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="940" height="440" fill="#fdfcf7"/>

  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：构造 与 查询</text>
  <path d="M 300 42 Q 470 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Left column: WordFilter / insert ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="70" width="420" height="330" rx="8" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1" opacity="0.25"/>
  </g>
  <text x="250" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">WordFilter(words)  ——  构造</text>

  <!-- step 1 -->
  <g filter="url(#sk)">
    <rect x="70" y="112" width="360" height="40" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.2"/>
  </g>
  <text x="250" y="130" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">① 遍历 words，记录下标 i</text>
  <text x="250" y="144" text-anchor="middle" font-size="10" fill="#555">for i, w in enumerate(words)</text>

  <path d="M 250 152 L 250 168" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 2 -->
  <g filter="url(#sk)">
    <rect x="70" y="172" width="360" height="56" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.2"/>
  </g>
  <text x="250" y="192" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">② 枚举 w 的每个后缀 w[s:]</text>
  <text x="250" y="208" text-anchor="middle" font-size="10" fill="#555">s = 0 .. len(w)-1</text>
  <text x="250" y="222" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">key = w[s:] + '#' + w</text>

  <path d="M 250 228 L 250 244" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 3 -->
  <g filter="url(#sk)">
    <rect x="70" y="248" width="360" height="56" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.2"/>
  </g>
  <text x="250" y="268" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">③ 逐字符走/建 Trie 节点</text>
  <text x="250" y="284" text-anchor="middle" font-size="10" fill="#555">for c in key: node = node[c] (缺失则建)</text>
  <text x="250" y="298" text-anchor="middle" font-size="10" fill="#555">沿 key 路径每个节点都经过</text>

  <path d="M 250 304 L 250 320" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 4 -->
  <g filter="url(#sk)">
    <rect x="70" y="324" width="360" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="250" y="342" text-anchor="middle" font-size="11" fill="#a06820" font-weight="bold">④ 节点.weight = max(weight, i)</text>
  <text x="250" y="356" text-anchor="middle" font-size="10" fill="#555">下标升序处理 → 直接赋值即取最大</text>

  <text x="250" y="388" text-anchor="middle" font-size="10" fill="#888">每词 O(L²)，共 N 词 → 构造 O(N·L²)</text>

  <!-- ===== Right column: f ===== -->
  <g filter="url(#sk)">
    <rect x="480" y="70" width="420" height="330" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1" opacity="0.25"/>
  </g>
  <text x="690" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">f(pref, suff)  ——  查询</text>

  <!-- step 1 -->
  <g filter="url(#sk)">
    <rect x="510" y="112" width="360" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="690" y="130" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">① 拼查询键</text>
  <text x="690" y="144" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">key = suff + '#' + pref</text>

  <path d="M 690 152 L 690 168" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 2 -->
  <g filter="url(#sk)">
    <rect x="510" y="172" width="360" height="56" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="690" y="192" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">② 逐字符走 Trie</text>
  <text x="690" y="208" text-anchor="middle" font-size="10" fill="#555">for c in key: node = node[c]</text>
  <text x="690" y="222" text-anchor="middle" font-size="10" fill="#555">若某字符缺失 → 路径不存在</text>

  <path d="M 690 228 L 690 244" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision diamond -->
  <g filter="url(#sk)">
    <path d="M 690 248 L 760 290 L 690 332 L 620 290 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="690" y="286" text-anchor="middle" font-size="11" fill="#a06820" font-weight="bold">走完整条</text>
  <text x="690" y="300" text-anchor="middle" font-size="11" fill="#a06820" font-weight="bold">key?</text>

  <!-- no branch -->
  <path d="M 620 290 L 540 290" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="580" y="282" text-anchor="middle" font-size="10" fill="#888">否</text>
  <g filter="url(#sk)">
    <rect x="478" y="276" width="62" height="28" rx="6" fill="#f6f6f6" stroke="#888" stroke-width="1"/>
  </g>
  <text x="509" y="295" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">return -1</text>

  <!-- yes branch -->
  <path d="M 690 332 L 690 352" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="702" y="346" font-size="10" fill="#2e8b57" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="600" y="356" width="180" height="34" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/>
  </g>
  <text x="690" y="378" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">return node.weight</text>

  <text x="690" y="400" text-anchor="middle" font-size="10" fill="#888">单次查询 O(|suff|+|pref|) = O(L)</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="410" width="860" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="0.8"/>
  </g>
  <text x="470" y="426" text-anchor="middle" font-size="10" fill="#2b6e9e">💡 构造期把「前缀+后缀」二维条件压成「包装串」一维 Trie 路径 → 查询降为单次 Trie 走路径</text>
</svg>
