<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">游戏机制：前两元素比大小，胜者留首，败者队尾</text>

  <!-- ===== 初始数组 ===== -->
  <text x="28" y="58" font-size="10.5" fill="#666">初始数组</text>

  <!-- arr[0]=2 highlight winner -->
  <rect x="80" y="44" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="66" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <!-- arr[1]=1 highlight challenger -->
  <rect x="124" y="44" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="66" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <!-- rest -->
  <rect x="168" y="44" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="66" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="212" y="44" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="66" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="256" y="44" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="66" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="300" y="44" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="66" text-anchor="middle" font-size="13" fill="#333">6</text>
  <rect x="344" y="44" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="364" y="66" text-anchor="middle" font-size="13" fill="#333">7</text>

  <!-- labels for front two -->
  <text x="100" y="38" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">冠军</text>
  <text x="144" y="38" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">挑战者</text>

  <!-- VS in middle -->
  <text x="260" y="100" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2 &gt; 1 → 2 胜，1 败</text>

  <!-- arrows: winner stays, loser to back -->
  <!-- winner stays (green down) -->
  <path d="M 100 80 L 100 140" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="70" y="115" font-size="10" fill="#4a7a3a" font-weight="bold">留首位</text>
  <!-- loser to back (orange curved) -->
  <path d="M 144 80 Q 144 120 200 132 Q 360 150 384 140" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="380" y="120" font-size="10" fill="#d6a040" font-weight="bold">移到队尾</text>

  <!-- ===== 一回合后 ===== -->
  <text x="28" y="158" font-size="10.5" fill="#666">一回合后</text>

  <rect x="80" y="144" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="166" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="124" y="144" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="166" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="168" y="144" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="166" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="212" y="144" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="166" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="256" y="144" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="166" text-anchor="middle" font-size="13" fill="#333">6</text>
  <rect x="300" y="144" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="166" text-anchor="middle" font-size="13" fill="#333">7</text>
  <!-- 1 moved to back, highlight -->
  <rect x="344" y="144" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="364" y="166" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- streak counter -->
  <rect x="150" y="196" width="220" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="214" text-anchor="middle" font-size="11" fill="#333">冠军 2 连胜计数 streak = 1</text>

  <!-- ===== 关键：连胜 k 即结束 ===== -->
  <rect x="50" y="240" width="420" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="260" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">结束条件：某元素连胜 k 回合 → 该元素为赢家</text>
  <text x="260" y="278" text-anchor="middle" font-size="10.5" fill="#555">注意 k 可达 10⁹，逐回合模拟队列会 TLE → 需 O(n) 单遍扫描</text>
  <text x="260" y="292" text-anchor="middle" font-size="10.5" fill="#555">（败者移到队尾只是「延迟出场」，不改变挑战顺序）</text>

  <!-- Footer -->
  <text x="260" y="322" text-anchor="middle" font-size="10.5" fill="#888">每回合：冠军 = max(当前冠军, 挑战者)，败者排到队尾等待再次出场</text>
  <text x="260" y="340" text-anchor="middle" font-size="10" fill="#aaa">数组元素各不相同 → 比较结果确定无并列</text>
</svg>
