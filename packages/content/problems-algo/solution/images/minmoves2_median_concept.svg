<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">核心观察：让所有数等于「中位数」可使绝对差之和最小</text>

  <text x="40" y="70" font-size="12" fill="#888">排序后数组:</text>
  <rect x="120" y="54" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="74" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="184" y="54" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="74" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="248" y="54" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="74" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <rect x="312" y="54" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="74" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <rect x="376" y="54" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="406" y="74" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>
  <text x="450" y="74" font-size="11" fill="#888">nums = [1,10,2,9] → sort</text>

  <path d="M 278 90 L 278 108" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="104" font-size="11" fill="#b85450">中位数 median = 3</text>

  <text x="40" y="148" font-size="12" fill="#4a7a3a" font-weight="bold">方案 A: target = 中位数 3</text>
  <rect x="40" y="158" width="480" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="56" y="180" font-size="12" fill="#333">|1−3| + |2−3| + |3−3| + |9−3| + |10−3| = 2 + 1 + 0 + 6 + 7 = </text>
  <text x="478" y="180" font-size="13" fill="#4a7a3a" font-weight="bold">16</text>

  <text x="40" y="222" font-size="12" fill="#b85450" font-weight="bold">方案 B: target = 均值 5（反例）</text>
  <rect x="40" y="232" width="480" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="56" y="254" font-size="12" fill="#333">|1−5| + |2−5| + |3−5| + |9−5| + |10−5| = 4 + 3 + 2 + 4 + 5 = </text>
  <text x="478" y="254" font-size="13" fill="#b85450" font-weight="bold">18</text>

  <path d="M 280 276 L 280 296" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="304" width="480" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">L1 损失的最小化点 = 中位数</text>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#666">f(t) = Σ|xi − t| 在 t = median 处取最小值</text>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#888">t 偏离中位数时，左右两端差值同时增大 → 必然更劣</text>
</svg>
