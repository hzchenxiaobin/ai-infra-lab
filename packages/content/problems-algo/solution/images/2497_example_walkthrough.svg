<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：以节点 3 为中心，取邻居 10、2，星和 = 4+10+2 = 16</text>

  <!-- ===== graph (left) ===== -->
  <!-- non-star edges (gray) -->
  <g stroke="#bbb" stroke-width="1.5" fill="none" filter="url(#rough2)">
    <line x1="40" y1="90" x2="150" y2="150"/>
    <line x1="150" y1="150" x2="260" y2="90"/>
  </g>
  <!-- selected star edges (bold red) -->
  <g stroke="#b85450" stroke-width="3" fill="none" filter="url(#rough2)">
    <line x1="150" y1="195" x2="150" y2="150"/>
    <line x1="138" y1="227" x2="65" y2="278"/>
  </g>
  <!-- skipped star edges (dashed gray) -->
  <g stroke="#bbb" stroke-width="1.5" fill="none" stroke-dasharray="5 4" filter="url(#rough2)">
    <line x1="150" y1="237" x2="150" y2="278"/>
    <line x1="162" y1="227" x2="235" y2="278"/>
  </g>

  <!-- nodes -->
  <g filter="url(#rough2)">
    <circle cx="40" cy="90" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="40" y="95" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="40" y="72" text-anchor="middle" font-size="10" fill="#888">=1</text>

    <circle cx="260" cy="90" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="260" y="95" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="260" y="72" text-anchor="middle" font-size="10" fill="#888">=3</text>

    <circle cx="150" cy="150" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="150" y="155" text-anchor="middle" font-size="12" fill="#2f5a22" font-weight="bold">1</text>
    <text x="172" y="146" font-size="10" fill="#4a7a3a">=2 ✓</text>

    <circle cx="150" cy="215" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <text x="150" y="212" text-anchor="middle" font-size="13" fill="#7a4a10" font-weight="bold">3</text>
    <text x="150" y="226" text-anchor="middle" font-size="10" fill="#7a4a10">=4 中心</text>

    <circle cx="55" cy="285" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="55" y="290" text-anchor="middle" font-size="12" fill="#2f5a22" font-weight="bold">4</text>
    <text x="33" y="278" font-size="10" fill="#4a7a3a">=10 ✓</text>

    <circle cx="150" cy="290" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="150" y="295" text-anchor="middle" font-size="12" fill="#7a2a26">5</text>
    <text x="172" y="294" font-size="10" fill="#888">=−10</text>

    <circle cx="245" cy="285" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="245" y="290" text-anchor="middle" font-size="12" fill="#7a2a26">6</text>
    <text x="267" y="278" font-size="10" fill="#888">=−20</text>
  </g>

  <!-- legend -->
  <g filter="url(#rough2)" font-size="11">
    <line x1="50" y1="324" x2="80" y2="324" stroke="#b85450" stroke-width="3"/>
    <text x="86" y="328" fill="#b85450">选中的星边</text>
    <line x1="180" y1="324" x2="210" y2="324" stroke="#bbb" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="216" y="328" fill="#888">跳过的负值邻居</text>
  </g>

  <!-- ===== right: center-3 callout ===== -->
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <rect x="318" y="56" width="222" height="140" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="330" y="80" font-size="13" fill="#446688" font-weight="bold">中心 = 3，k = 2</text>
    <text x="330" y="104">邻居值（降序）：</text>
    <text x="330" y="122" font-size="11" fill="#555">　10, 2, −10, −20</text>
    <text x="330" y="146">取前 2 个正值 → 10, 2</text>
    <text x="330" y="168">星和 = vals[3] + 10 + 2</text>
    <text x="330" y="186" font-size="11" fill="#555">　 = 4 + 10 + 2 = 16 ✓</text>
  </g>

  <!-- ===== bottom: per-center table ===== -->
  <g filter="url(#rough2)" font-size="11">
    <!-- header -->
    <rect x="40" y="348" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="70" y="363" text-anchor="middle" fill="#446688" font-weight="bold">中心</text>
    <rect x="100" y="348" width="200" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="200" y="363" text-anchor="middle" fill="#446688" font-weight="bold">邻居值（降序）</text>
    <rect x="300" y="348" width="110" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="355" y="363" text-anchor="middle" fill="#446688" font-weight="bold">取前 k 正值</text>
    <rect x="410" y="348" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="445" y="363" text-anchor="middle" fill="#446688" font-weight="bold">星和</text>

    <!-- row 3 (highlight) -->
    <rect x="40" y="370" width="60" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <text x="70" y="384" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <rect x="100" y="370" width="200" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <text x="200" y="384" text-anchor="middle" fill="#b85450">10, 2, −10, −20</text>
    <rect x="300" y="370" width="110" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <text x="355" y="384" text-anchor="middle" fill="#b85450">10, 2</text>
    <rect x="410" y="370" width="70" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <text x="445" y="384" text-anchor="middle" fill="#b85450" font-weight="bold">16</text>

    <!-- row 1 -->
    <rect x="40" y="390" width="60" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="70" y="404" text-anchor="middle" fill="#333">1</text>
    <rect x="100" y="390" width="200" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="200" y="404" text-anchor="middle" fill="#333">4, 3, 1</text>
    <rect x="300" y="390" width="110" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="355" y="404" text-anchor="middle" fill="#333">4, 3</text>
    <rect x="410" y="390" width="70" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="445" y="404" text-anchor="middle" fill="#333">9</text>

    <!-- row 4 -->
    <rect x="40" y="410" width="60" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="70" y="424" text-anchor="middle" fill="#333">4</text>
    <rect x="100" y="410" width="200" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="200" y="424" text-anchor="middle" fill="#333">4</text>
    <rect x="300" y="410" width="110" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="355" y="424" text-anchor="middle" fill="#333">4</text>
    <rect x="410" y="410" width="70" height="20" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="445" y="424" text-anchor="middle" fill="#333">14</text>
  </g>

  <text x="280" y="436" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">max = 16 ✓</text>
</svg>
