<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 365" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrC" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="365" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描，逐对做按位 OR</text>

  <rect x="350" y="38" width="146" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="423" y="59" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">OR 是 O(1) 机器指令</text>
  <text x="423" y="76" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">输出 n−1 个数</text>
  <text x="423" y="93" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">→ O(n) 已是下界</text>

  <rect x="150" y="44" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="250" y="66" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始：读入 nums（n ≥ 2）</text>

  <path d="M 250 78 L 250 98" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>

  <rect x="150" y="102" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="250" y="124" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">i ← 0，answer ← 长度 n−1</text>

  <path d="M 250 136 L 250 156" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>

  <polygon points="250,158 318,196 250,234 182,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="201" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">i &lt; n − 1 ?</text>

  <path d="M 250 234 L 250 256" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>
  <text x="260" y="250" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="140" y="260" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="250" y="282" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">answer[i] ← nums[i] | nums[i+1]</text>

  <path d="M 250 294 L 250 314" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>

  <rect x="175" y="318" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="250" y="340" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i ← i + 1</text>

  <path d="M 175 335 L 88 335 L 88 196 L 174 196" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>
  <text x="104" y="322" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">回到判定</text>

  <path d="M 318 196 L 352 196" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>
  <text x="336" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="356" y="179" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="426" y="201" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 answer</text>
</svg>
