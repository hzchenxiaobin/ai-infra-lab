<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：数位 DP + KMP 自动机计数</text>

  <!-- Step 1: preprocess KMP -->
  <rect x="150" y="42" width="320" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="62" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">① 预处理 evil 的 KMP π 数组</text>
  <text x="310" y="78" text-anchor="middle" font-size="10" fill="#555">并构建转移表 nxt[j][c]（j ∈ 0..m, c ∈ a..z）</text>

  <path d="M 310 90 L 310 106" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: digit DP memo -->
  <rect x="120" y="108" width="380" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="128" text-anchor="middle" font-size="12" fill="#335" font-weight="bold">② 记忆化数位 DP：dfs(i, j, tight)</text>
  <text x="310" y="144" text-anchor="middle" font-size="10" fill="#555">i = 当前位 | j = evil 匹配进度 | tight = 是否贴上界</text>

  <path d="M 310 156 L 310 172" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision: j == m? -->
  <polygon points="310,174 420,210 310,246 200,210" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="206" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">j == m ?</text>
  <text x="310" y="222" text-anchor="middle" font-size="10" fill="#b85450">已含 evil</text>

  <!-- Yes: return 0 -->
  <path d="M 420 210 L 470 210" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="445" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="470" y="188" width="110" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="525" y="208" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">返回 0</text>
  <text x="525" y="223" text-anchor="middle" font-size="9.5" fill="#888">此分支不合法</text>

  <!-- No: continue down -->
  <path d="M 310 246 L 310 264" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="328" y="258" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Decision: i == n? -->
  <polygon points="310,266 420,302 310,338 200,302" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="298" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">i == n ?</text>
  <text x="310" y="314" text-anchor="middle" font-size="10" fill="#a87020">填完所有位</text>

  <!-- Yes: return 1 -->
  <path d="M 420 302 L 470 302" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="445" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="470" y="280" width="110" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="525" y="300" text-anchor="middle" font-size="11.5" fill="#3a5a2a" font-weight="bold">返回 1</text>
  <text x="525" y="315" text-anchor="middle" font-size="9.5" fill="#888">成功构造</text>

  <!-- No: enumerate chars -->
  <path d="M 310 338 L 310 356" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="328" y="350" font-size="11" fill="#888">否</text>

  <!-- Step 3: loop over chars -->
  <rect x="100" y="358" width="420" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="378" text-anchor="middle" font-size="12" fill="#335" font-weight="bold">③ 枚举字符 c ∈ 'a' .. limit</text>
  <text x="310" y="394" text-anchor="middle" font-size="10" fill="#555">limit = tight ? bound[i] : 'z' | nj = nxt[j][c] | 递归累加</text>

  <path d="M 310 406 L 310 422" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: return memoized -->
  <rect x="150" y="424" width="320" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="448" text-anchor="middle" font-size="12.5" fill="#a87020" font-weight="bold">④ 记忆化返回 Σ dfs(i+1, nj, tight&amp;&amp;c==limit)</text>

  <!-- loop back arrow -->
  <path d="M 520 382 L 580 382 L 580 132 L 500 132" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)" stroke-dasharray="5,3"/>
  <text x="596" y="260" text-anchor="middle" font-size="10" fill="#888" transform="rotate(90 596 260)">下一字符</text>

  <!-- Final answer box -->
  <rect x="60" y="476" width="500" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="498" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">答案 = (countLE(s2) − countLE(s1) + good(s1) + MOD) % MOD</text>
</svg>
