<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">执行一轮指令后的三种情况</text>

  <!-- Case 1: Returns to origin -->
  <rect x="20" y="42" width="480" height="92" fill="#e6f4ea" fill-opacity="0.4" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="35" y="64" font-size="12.5" fill="#4a7a3a" font-weight="bold">① 回到原点 (0,0)</text>
  <text x="35" y="84" font-size="11" fill="#444">每轮走同一条闭合路径 → 有界</text>
  <text x="35" y="104" font-size="10.5" fill="#666">例: "GGLLGG" → (0,0)→(0,2)→(0,0)</text>
  <circle cx="430" cy="88" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <path d="M 430 68 A 20 20 0 1 1 429 68" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="430" y="125" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 有界</text>

  <!-- Case 2: Direction changed -->
  <rect x="20" y="146" width="480" height="92" fill="#e8f0fe" fill-opacity="0.4" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="35" y="168" font-size="12.5" fill="#446688" font-weight="bold">② 不在原点，方向 ≠ 北</text>
  <text x="35" y="188" font-size="11" fill="#444">路径每轮旋转，最多 4 轮归位 → 有界</text>
  <text x="35" y="208" font-size="10.5" fill="#666">例: "GL" → 终点 (0,1) 面朝西，4 轮回原点</text>
  <path d="M 445 210 L 445 175" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 445 175 L 410 175" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 410 175 L 410 210" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 410 210 L 445 210" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="427" y="229" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">✓ 有界</text>

  <!-- Case 3: Direction unchanged, moved away -->
  <rect x="20" y="250" width="480" height="92" fill="#fce4ec" fill-opacity="0.4" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="35" y="272" font-size="12.5" fill="#b85450" font-weight="bold">③ 不在原点，方向 = 北</text>
  <text x="35" y="292" font-size="11" fill="#444">每轮同向平移，无限远离 → 无界</text>
  <text x="35" y="312" font-size="10.5" fill="#666">例: "GG" → 终点 (0,2) 面朝北，持续北移</text>
  <circle cx="430" cy="330" r="4" fill="#b85450" filter="url(#rough2)"/>
  <path d="M 430 325 L 430 275" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="448" y="302" font-size="16" fill="#b85450" font-weight="bold">∞</text>
  <text x="430" y="338" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗ 无界</text>

  <text x="260" y="362" text-anchor="middle" font-size="12" fill="#555" font-style="italic">有界 ⟺ 回到原点 ∨ 方向改变</text>
</svg>
