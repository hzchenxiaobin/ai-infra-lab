<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [4, 3, −1]，k = 2</text>
  <text x="260" y="44" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">排序后 [−1, 3, 4]，正差值 D = {1, 4, 5}；dp¹ = [1,1,1]，dp²[j] = 前缀和 pre[p(j)+1]</text>

  <!-- 表头 -->
  <rect x="60" y="58" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="120" y="58" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="240" y="58" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="330" y="58" width="130" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="76" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="180" y="76" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">dp²（k=2 一轮转移）</text>
  <text x="285" y="76" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">cnt_ge(d)</text>
  <text x="395" y="76" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">(d − prev)·cnt</text>

  <!-- 行 1: d=1 -->
  <rect x="60" y="84" width="60" height="26" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="120" y="84" width="120" height="26" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="240" y="84" width="90" height="26" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="330" y="84" width="130" height="26" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="180" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[0, 1, 2]</text>
  <text x="285" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="395" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1−0)×3 = 3</text>

  <!-- 行 2: d=4 -->
  <rect x="60" y="110" width="60" height="26" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="120" y="110" width="120" height="26" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="240" y="110" width="90" height="26" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="330" y="110" width="130" height="26" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="128" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="180" y="128" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[0, 1, 1]</text>
  <text x="285" y="128" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="395" y="128" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(4−1)×2 = 6</text>

  <!-- 行 3: d=5 -->
  <rect x="60" y="136" width="60" height="26" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="120" y="136" width="120" height="26" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="240" y="136" width="90" height="26" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="330" y="136" width="130" height="26" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="180" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[0, 0, 1]</text>
  <text x="285" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="395" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(5−4)×1 = 1</text>

  <!-- 逐子序列验证框 -->
  <rect x="46" y="178" width="428" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="199" text-anchor="middle" font-size="12.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">逐个子序列验证：(−1,3) 能量 4；(−1,4) 能量 5；(3,4) 能量 1</text>
  <text x="260" y="219" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d=1 三个全计，d=4 只剩前两个，d=5 只剩 (−1,4) —— 正是 cnt_ge 的 3, 2, 1</text>

  <!-- 贪心判定框 -->
  <rect x="46" y="242" width="428" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="263" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">贪心判存在（d=5）：从 −1 出发，3−(−1)=4 &lt; 5 跳过，4−(−1)=5 ≥ 5 取</text>
  <text x="260" y="283" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">凑够 k=2 个 ⇒ 可行；若 d=6：4−(−1)=5 &lt; 6，凑不够 ⇒ break</text>

  <!-- 结论框 -->
  <rect x="46" y="306" width="428" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="324" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">ans = 3 + 6 + 1 = 10 ✓</text>
  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">与按定义逐个算 |4−3|+|4−(−1)|+|3−(−1)| = 10 一致</text>
</svg>
