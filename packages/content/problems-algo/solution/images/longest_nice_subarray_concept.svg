<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：优雅 ⟺ 窗口内比特位两两不相交 ⟺ (mask &amp; x) == 0</text>

  <!-- separator -->
  <line x1="298" y1="50" x2="298" y2="250" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- ===== Left: nice window [3,8,48] ===== -->
  <text x="40" y="56" font-size="11" fill="#4a7a3a" font-weight="bold">优雅：[3, 8, 48]</text>

  <!-- Array boxes -->
  <rect x="40" y="64" width="40" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="60" y="84" text-anchor="middle" font-size="13" fill="#aaa">1</text>
  <rect x="86" y="64" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="106" y="84" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="132" y="64" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="152" y="84" text-anchor="middle" font-size="13" fill="#333">8</text>
  <rect x="178" y="64" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="84" text-anchor="middle" font-size="13" fill="#333">48</text>
  <rect x="224" y="64" width="40" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="244" y="84" text-anchor="middle" font-size="13" fill="#aaa">10</text>

  <!-- window bracket -->
  <path d="M 88 102 L 88 108 L 220 108 L 220 102" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="154" y="122" text-anchor="middle" font-size="10" fill="#4a7a3a">两两 AND = 0 ✓</text>

  <!-- 6-bit columns: centers 132,160,188,216,244,272 (step 28, box w24 from x=120) -->
  <!-- column bit labels -->
  <text x="132" y="142" text-anchor="middle" font-size="9" fill="#999">b5</text>
  <text x="160" y="142" text-anchor="middle" font-size="9" fill="#999">b4</text>
  <text x="188" y="142" text-anchor="middle" font-size="9" fill="#999">b3</text>
  <text x="216" y="142" text-anchor="middle" font-size="9" fill="#999">b2</text>
  <text x="244" y="142" text-anchor="middle" font-size="9" fill="#999">b1</text>
  <text x="272" y="142" text-anchor="middle" font-size="9" fill="#999">b0</text>

  <!-- 3 = 000011 -->
  <text x="86" y="162" font-size="11" fill="#446688">3 =</text>
  <rect x="120" y="148" width="24" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="132" y="164" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  <rect x="148" y="148" width="24" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="164" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  <rect x="176" y="148" width="24" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="188" y="164" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  <rect x="204" y="148" width="24" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="216" y="164" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  <rect x="232" y="148" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="244" y="164" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <rect x="260" y="148" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="272" y="164" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>

  <!-- 8 = 001000 -->
  <text x="86" y="186" font-size="11" fill="#4a7a3a">8 =</text>
  <rect x="120" y="172" width="24" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="132" y="188" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  <rect x="148" y="172" width="24" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="188" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  <rect x="176" y="172" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="188" y="188" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="204" y="172" width="24" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="216" y="188" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  <rect x="232" y="172" width="24" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="244" y="188" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  <rect x="260" y="172" width="24" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="272" y="188" text-anchor="middle" font-size="12" fill="#ccc">0</text>

  <!-- 48 = 110000 -->
  <text x="80" y="210" font-size="11" fill="#d6a040">48 =</text>
  <rect x="120" y="196" width="24" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="132" y="212" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="148" y="196" width="24" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="160" y="212" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="176" y="196" width="24" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="188" y="212" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  <rect x="204" y="196" width="24" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="216" y="212" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  <rect x="232" y="196" width="24" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="244" y="212" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  <rect x="260" y="196" width="24" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="272" y="212" text-anchor="middle" font-size="12" fill="#ccc">0</text>

  <!-- mask = 111011 = 59 -->
  <text x="78" y="234" font-size="11" fill="#555" font-weight="bold">mask</text>
  <rect x="120" y="220" width="24" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="132" y="236" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="148" y="220" width="24" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="160" y="236" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="176" y="220" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="188" y="236" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="204" y="220" width="24" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="216" y="236" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  <rect x="232" y="220" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="244" y="236" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <rect x="260" y="220" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="272" y="236" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>

  <!-- ===== Right: not nice [3,1] ===== -->
  <text x="320" y="56" font-size="11" fill="#b85450" font-weight="bold">非优雅：[3, 1]</text>

  <rect x="332" y="64" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="84" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="378" y="64" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="398" y="84" text-anchor="middle" font-size="13" fill="#333">1</text>

  <path d="M 334 102 L 334 108 L 420 108 L 420 102" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="377" y="122" text-anchor="middle" font-size="10" fill="#b85450">3 AND 1 = 1 ≠ 0 ✗</text>

  <!-- 3-bit columns centers 362,390,418 (box w24 from x=350) -->
  <text x="362" y="142" text-anchor="middle" font-size="9" fill="#999">b2</text>
  <text x="390" y="142" text-anchor="middle" font-size="9" fill="#999">b1</text>
  <text x="418" y="142" text-anchor="middle" font-size="9" fill="#999">b0</text>

  <!-- 3 = 011 -->
  <text x="320" y="162" font-size="11" fill="#446688">3 =</text>
  <rect x="350" y="148" width="24" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="362" y="164" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  <rect x="378" y="148" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="390" y="164" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <rect x="406" y="148" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="418" y="164" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>

  <!-- 1 = 001 -->
  <text x="320" y="186" font-size="11" fill="#446688">1 =</text>
  <rect x="350" y="172" width="24" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="362" y="188" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  <rect x="378" y="172" width="24" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="390" y="188" text-anchor="middle" font-size="12" fill="#ccc">0</text>
  <rect x="406" y="172" width="24" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="418" y="188" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <!-- shared bit highlight -->
  <rect x="404" y="146" width="28" height="50" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="3,3" rx="4" filter="url(#rough2)"/>
  <text x="440" y="176" font-size="9" fill="#b85450">b0 被两数共用</text>

  <!-- ===== Bottom: key insights ===== -->
  <rect x="30" y="262" width="500" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">判定：mask &amp; x == 0  ⟺  x 不与窗口任一元素共享置位  ⟺  加入后仍优雅</text>
  <text x="280" y="298" text-anchor="middle" font-size="11" fill="#446688">一次按位与替代 C(k,2) 次两两比较</text>

  <rect x="30" y="316" width="500" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">优雅窗口里每位至多被一个数占用 ⇒  OR == XOR</text>
  <text x="280" y="356" text-anchor="middle" font-size="12" fill="#4a7a3a">故  mask ^= nums[left]  可在 O(1) 精确撤销左端，把滑窗压成 O(n)</text>

  <rect x="30" y="376" width="500" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="394" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">前提：不变式「处理 right 前窗口恒优雅」</text>
  <text x="280" y="412" text-anchor="middle" font-size="10" fill="#d6a040">保证撤销时刻窗口合法，^ 才不误清共享位</text>
</svg>
