<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建并查集 → 查询替换</text>

  <!-- Step 1: init -->
  <rect x="60" y="46" width="420" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="84" cy="68" r="14" fill="#446688" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="72" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">1</text>
  <text x="110" y="64" font-size="12" fill="#333" font-weight="bold">初始化 parent[0..25] = i</text>
  <text x="110" y="80" font-size="10.5" fill="#666">26 个字母各自为根，parent[c] = c</text>
  <line x1="270" y1="92" x2="270" y2="106" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: union loop -->
  <rect x="60" y="108" width="420" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="84" cy="138" r="14" fill="#d6a040" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="142" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">2</text>
  <text x="110" y="132" font-size="12" fill="#333" font-weight="bold">遍历 s1[i], s2[i]，逐对 union</text>
  <text x="110" y="148" font-size="10.5" fill="#666">ra = find(s1[i]), rb = find(s2[i])</text>
  <text x="110" y="162" font-size="10.5" fill="#b85450" font-weight="bold">if ra != rb: parent[max(ra,rb)] = min(ra,rb)</text>
  <text x="110" y="176" font-size="10" fill="#888">较大字符的根 → 指向较小字符（字典序最小当根）</text>
  <line x1="270" y1="188" x2="270" y2="202" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: find with path compression -->
  <rect x="60" y="204" width="420" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="84" cy="232" r="14" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="236" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">3</text>
  <text x="110" y="226" font-size="12" fill="#333" font-weight="bold">find(x)：递归找根 + 路径压缩</text>
  <text x="110" y="242" font-size="10.5" fill="#666">if parent[x] != x: parent[x] = find(parent[x])</text>
  <text x="110" y="256" font-size="10.5" fill="#4a7a3a">返回的根 = 该等价类中字典序最小的字符</text>
  <line x1="270" y1="268" x2="270" y2="282" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: build result -->
  <rect x="60" y="284" width="420" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="84" cy="312" r="14" fill="#b85450" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="316" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">4</text>
  <text x="110" y="306" font-size="12" fill="#333" font-weight="bold">遍历 baseStr，逐字符 find 替换</text>
  <text x="110" y="322" font-size="10.5" fill="#666">ans += char(find(baseStr[i] - 'a') + 'a')</text>
  <text x="110" y="336" font-size="10.5" fill="#b85450">每个字符替换为所在等价类的最小字符</text>
  <line x1="270" y1="348" x2="270" y2="362" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: return -->
  <rect x="120" y="364" width="300" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="389" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">返回 ans（字典序最小等效字符串）</text>

  <!-- note -->
  <rect x="60" y="416" width="420" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="436" text-anchor="middle" font-size="10.5" fill="#444">字母表仅 26 个 → parent 数组大小 26，空间 O(1)</text>
</svg>
