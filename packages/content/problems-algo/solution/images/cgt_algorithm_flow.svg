<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：三层循环 + 逐条件剪枝</text>

  <!-- Start -->
  <ellipse cx="280" cy="52" rx="90" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="56" text-anchor="middle" font-size="11" fill="#333">ans = 0，i = 0</text>

  <path d="M 280 70 L 280 84" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop i decision -->
  <polygon points="280,88 390,124 280,160 170,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="11" fill="#333">i &lt; n ?</text>
  <text x="280" y="136" text-anchor="middle" font-size="10" fill="#888">(外层循环)</text>

  <!-- No -> return -->
  <path d="M 390 124 L 470 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="116" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="470" y="106" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="510" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回</text>
  <text x="510" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans ⭐</text>

  <!-- Yes -> j loop -->
  <path d="M 280 160 L 280 174" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="170" font-size="10" fill="#82b366">是</text>

  <!-- j = i+1 init -->
  <rect x="180" y="178" width="200" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="11" fill="#333">j = i + 1</text>

  <path d="M 280 206 L 280 218" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop j decision -->
  <polygon points="280,222 390,256 280,290 170,256" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="11" fill="#333">j &lt; n ?</text>
  <text x="280" y="268" text-anchor="middle" font-size="10" fill="#888">(中层循环)</text>

  <!-- No -> i++ -->
  <path d="M 170 256 L 100 256 L 100 124 L 170 124" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="190" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 92 190)">i++</text>

  <!-- Yes -> cond1 check -->
  <path d="M 280 290 L 280 302" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="298" font-size="10" fill="#82b366">是</text>

  <!-- Cond1 decision -->
  <polygon points="280,306 410,340 280,374 150,340" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="10" fill="#333">|arr[i]−arr[j]| ≤ a ?</text>
  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#888">条件① 剪枝</text>

  <!-- No -> j++ (prune k loop entirely) -->
  <path d="M 410 340 L 440 340 L 440 256 L 390 256" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="298" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">否</text>
  <text x="448" y="310" text-anchor="middle" font-size="9" fill="#b85450">跳过k</text>
  <text x="448" y="322" text-anchor="middle" font-size="9" fill="#888">j++</text>

  <!-- Yes -> k loop -->
  <path d="M 280 374 L 280 386" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="382" font-size="10" fill="#82b366">是</text>

  <!-- k loop + cond2 + cond3 (compact box) -->
  <rect x="80" y="390" width="400" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="408" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">for k = j+1 .. n−1:</text>
  <text x="280" y="424" text-anchor="middle" font-size="10" fill="#666">② |arr[j]−arr[k]| ≤ b ? → 否则 continue</text>
  <text x="280" y="440" text-anchor="middle" font-size="10" fill="#666">③ |arr[i]−arr[k]| ≤ c ? → 否则 continue；通过则 ans++</text>

  <!-- loop back from k box to j decision -->
  <path d="M 480 418 L 520 418 L 520 256 L 390 256" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="528" y="338" text-anchor="middle" font-size="9" fill="#888" transform="rotate(90 528 338)">j++</text>
</svg>
