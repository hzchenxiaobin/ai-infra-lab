<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 466" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="466" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：[[1,1],[9,9],[1,1]] —— 素数 19 以 8 次频次胜出</text>

  <!-- mini mat grid -->
  <text x="496" y="32" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">mat</text>
  <rect x="472" y="36" width="24" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="484" y="52" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="496" y="36" width="24" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="508" y="52" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="472" y="60" width="24" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="484" y="76" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">9</text>
  <rect x="496" y="60" width="24" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="508" y="76" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">9</text>
  <rect x="472" y="84" width="24" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="484" y="100" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="496" y="84" width="24" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="508" y="100" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>

  <!-- table -->
  <rect x="28" y="118" width="504" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="62" y="135" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">起点</text>
  <text x="242" y="135" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">沿 8 方向生成的数（&gt; 10）</text>
  <text x="460" y="135" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">素数判定</text>

  <rect x="28" y="144" width="504" height="186" fill="none" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 96 144 L 96 330 M 388 144 L 388 330 M 28 175 L 532 175 M 28 206 L 532 206 M 28 237 L 532 237 M 28 268 L 532 268 M 28 299 L 532 299" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <text x="62" y="164" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(0,0)</text>
  <text x="242" y="164" text-anchor="middle" font-size="10.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">11, 19, 19, 191</text>
  <text x="460" y="164" text-anchor="middle" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">全部素数 ✓</text>

  <text x="62" y="195" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(0,1)</text>
  <text x="242" y="195" text-anchor="middle" font-size="10.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">19, 191, 19, 11</text>
  <text x="460" y="195" text-anchor="middle" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">全部素数 ✓</text>

  <text x="62" y="226" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(1,0)</text>
  <text x="242" y="226" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">99, 91, 91, 91, 91</text>
  <text x="460" y="226" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">全合数 ✗</text>

  <text x="62" y="257" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(1,1)</text>
  <text x="242" y="257" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">91, 91, 99, 91, 91</text>
  <text x="460" y="257" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">全合数 ✗</text>

  <text x="62" y="288" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(2,0)</text>
  <text x="242" y="288" text-anchor="middle" font-size="10.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">11, 19, 191, 19</text>
  <text x="460" y="288" text-anchor="middle" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">全部素数 ✓</text>

  <text x="62" y="319" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(2,1)</text>
  <text x="242" y="319" text-anchor="middle" font-size="10.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">11, 19, 19, 191</text>
  <text x="460" y="319" text-anchor="middle" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">全部素数 ✓</text>

  <!-- footnote -->
  <rect x="28" y="338" width="504" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">中间两行全军覆没：91 = 7×13、99 = 9×11 都是合数；</text>
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">19 的 8 次 = 8 个「先 1 后 9」的有向相邻对（如 (0,0)→东南、(2,1)→北 …）</text>

  <!-- frequency bars -->
  <text x="30" y="400" text-anchor="start" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">素数频次（1 格 = 22px = 1 次）：</text>

  <text x="68" y="412" text-anchor="end" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">19</text>
  <rect x="76" y="402" width="176" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="262" y="413" text-anchor="start" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">× 8 ← 频次最高，返回 19</text>

  <text x="68" y="432" text-anchor="end" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">191</text>
  <rect x="76" y="422" width="88" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="174" y="433" text-anchor="start" font-size="10.5" fill="#446688" filter="url(#rough2)">× 4</text>

  <text x="68" y="452" text-anchor="end" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">11</text>
  <rect x="76" y="442" width="88" height="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="174" y="453" text-anchor="start" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">× 4</text>
</svg>
