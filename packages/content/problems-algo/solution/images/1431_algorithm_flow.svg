<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：求 max → 求阈值 → 逐个比较 → 输出布尔列表</text>

  <!-- Start -->
  <ellipse cx="180" cy="54" rx="42" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="58" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <path d="M 180 70 L 180 82" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box1: find max -->
  <rect x="100" y="84" width="160" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="104" text-anchor="middle" font-size="11.5" fill="#333">maxVal = max(candies)</text>

  <path d="M 180 116 L 180 128" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box2: threshold -->
  <rect x="88" y="130" width="184" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="150" text-anchor="middle" font-size="11.5" fill="#333">threshold = maxVal − extraCandies</text>

  <path d="M 180 162 L 180 174" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box3: init -->
  <rect x="110" y="176" width="140" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="196" text-anchor="middle" font-size="11.5" fill="#333">i = 0；res = [ ]</text>

  <path d="M 180 208 L 180 214" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: i < n ? -->
  <polygon points="180,216 258,250 180,284 102,250" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="254" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>

  <!-- Yes branch down -->
  <path d="M 180 284 L 180 300" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="296" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Box4: res[i] = ... -->
  <rect x="88" y="302" width="184" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="322" text-anchor="middle" font-size="11.5" fill="#333">res[i] = candies[i] ≥ threshold</text>

  <path d="M 180 334 L 180 346" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box5: i += 1 -->
  <rect x="130" y="348" width="100" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="366" text-anchor="middle" font-size="11.5" fill="#333">i += 1</text>

  <!-- loop back: box5 left -> left -> up -> diamond left point -->
  <path d="M 130 362 L 60 362 L 60 250 L 100 250" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="64" y="244" font-size="10.5" fill="#4a7a3a">回到判断</text>

  <!-- No branch right -->
  <path d="M 258 250 L 300 250" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="266" y="244" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- Box6: return res -->
  <rect x="300" y="234" width="120" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="254" text-anchor="middle" font-size="11.5" fill="#333">返回 res</text>

  <path d="M 360 266 L 360 278" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <ellipse cx="360" cy="296" rx="42" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="300" text-anchor="middle" font-size="12" fill="#333">结束</text>

  <!-- footer note -->
  <rect x="60" y="392" width="440" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="410" text-anchor="middle" font-size="11" fill="#555">一次求 max（O(n)）+ 一次减法 + 一次遍历比较（O(n)）= 总 O(n)</text>
  <text x="280" y="424" text-anchor="middle" font-size="10" fill="#888">无需对每个孩子重新求最大值</text>
</svg>
