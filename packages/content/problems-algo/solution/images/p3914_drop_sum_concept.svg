<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：为每个落差付一次钱 —— 答案 = 相邻落差之和</text>

  <!-- 左上：示例 [5,1,2,3] 的后缀抬升 -->
  <g filter="url(#rough2)">
    <rect x="16" y="36" width="270" height="190" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="151" y="56" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">示例：nums = [5, 1, 2, 3]</text>

    <!-- 第一行格子 -->
    <rect x="74" y="66" width="34" height="24" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="91" y="83" text-anchor="middle" font-size="12" fill="#333">5</text>
    <rect x="114" y="66" width="34" height="24" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="131" y="83" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="154" y="66" width="34" height="24" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="171" y="83" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="194" y="66" width="34" height="24" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="211" y="83" text-anchor="middle" font-size="12" fill="#333">3</text>

    <text x="91" y="102" text-anchor="middle" font-size="9" fill="#888">i=0</text>
    <text x="131" y="102" text-anchor="middle" font-size="9" fill="#888">i=1</text>
    <text x="171" y="102" text-anchor="middle" font-size="9" fill="#888">i=2</text>
    <text x="211" y="102" text-anchor="middle" font-size="9" fill="#888">i=3</text>

    <!-- 5→1 落差箭头 -->
    <path d="M 95 62 C 104 48, 122 48, 129 60" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)"/>
    <text x="112" y="45" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">落差 4</text>
    <text x="112" y="56" text-anchor="middle" font-size="8" fill="#b85450">（仅此处下降）</text>

    <!-- 转化箭头 -->
    <path d="M 151 108 L 151 126" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="158" y="121" font-size="9" fill="#33506b">后缀 [1..3] += 4，一笔付 4</text>

    <!-- 第二行格子：后三个被抬升 -->
    <rect x="74" y="132" width="34" height="24" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2"/>
    <text x="91" y="149" text-anchor="middle" font-size="12" fill="#999">5</text>
    <rect x="114" y="132" width="34" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="131" y="149" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">5</text>
    <rect x="154" y="132" width="34" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="171" y="149" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">6</text>
    <rect x="194" y="132" width="34" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="211" y="149" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">7</text>

    <text x="151" y="170" text-anchor="middle" font-size="9" fill="#555">绿 = 被同一次抬升覆盖（各 +4）</text>
    <text x="151" y="188" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold">位置 1、2、3 共享抬升 → 只付 4</text>
    <text x="151" y="206" text-anchor="middle" font-size="9" fill="#4a6b8a">右端点拉满 n−1：无副作用、不加价</text>
  </g>

  <!-- 右上：区间加的边界效应 -->
  <g filter="url(#rough2)">
    <rect x="302" y="36" width="242" height="190" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="423" y="56" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">区间加只动两个边界</text>

    <!-- 6 个格子，中间 3 个 +x -->
    <rect x="317" y="88" width="30" height="24" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="351" y="88" width="30" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="385" y="88" width="30" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="419" y="88" width="30" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="453" y="88" width="30" height="24" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="487" y="88" width="30" height="24" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2"/>
    <text x="398" y="104" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold">[l..r] +x</text>
    <text x="366" y="122" text-anchor="middle" font-size="8" fill="#888">l</text>
    <text x="449" y="122" text-anchor="middle" font-size="8" fill="#888">r</text>

    <!-- 左边界疗效箭头（蓝，向上） -->
    <path d="M 351 84 L 351 68" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <text x="356" y="66" font-size="9.5" fill="#446688" font-weight="bold">左边界：diff +x</text>
    <!-- 右边界副作用箭头（红，向下） -->
    <path d="M 453 68 L 453 84" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)"/>
    <text x="458" y="66" font-size="9.5" fill="#b85450" font-weight="bold">右边界：diff −x</text>

    <text x="423" y="140" text-anchor="middle" font-size="9.5" fill="#2f5d24">左边界消下降 ✓（疗效）</text>
    <text x="423" y="158" text-anchor="middle" font-size="9.5" fill="#8a3030">右边界可能造新下降 ✗（副作用）</text>
    <text x="423" y="176" text-anchor="middle" font-size="9.5" fill="#555">区间内部的相邻差纹丝不动</text>
    <text x="423" y="196" text-anchor="middle" font-size="9.5" fill="#8a6d1a" font-weight="bold">⇒ 后缀 [l..n−1]：右边界消失</text>
    <text x="423" y="213" text-anchor="middle" font-size="9.5" fill="#8a6d1a" font-weight="bold">零副作用，修下降的最优姿势</text>
  </g>

  <!-- 左下：三个要点 -->
  <g filter="url(#rough2)">
    <rect x="16" y="240" width="336" height="150" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="184" y="260" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold">三个要点</text>
    <text x="28" y="280" font-size="9.5" fill="#8a6d1a">① 计价跟「量」走：一次 +x 付 x，与次数无关</text>
    <text x="28" y="296" font-size="9.5" fill="#8a6d1a">　 （k 次 +1 与 1 次 +k 付款相同）</text>
    <text x="28" y="314" font-size="9.5" fill="#8a6d1a">② 每个落差必须由「起点在其右侧」的抬升补足</text>
    <text x="28" y="330" font-size="9.5" fill="#8a6d1a">　 ⇒ 总代价 ≥ add 的正差分和 ≥ 原数组落差和（下界）</text>
    <text x="28" y="348" font-size="9.5" fill="#8a6d1a">③ 后缀贪心：付款条件恰为 nums[i−1] &gt; nums[i]，</text>
    <text x="28" y="364" font-size="9.5" fill="#8a6d1a">　 金额恰为落差 ⇒ 每个落差恰好付一次（达下界）</text>
    <text x="28" y="382" font-size="10" fill="#d6a040" font-weight="bold">答案 = Σ max(0, nums[i] − nums[i+1])</text>
  </g>

  <!-- 右下：常见翻车点 -->
  <g filter="url(#rough2)">
    <rect x="368" y="240" width="176" height="150" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="456" y="260" text-anchor="middle" font-size="11" fill="#8a3030" font-weight="bold">常见翻车点</text>
    <text x="380" y="280" font-size="9.5" fill="#8a3030">① 把 Σ(前缀max − nums[i]) 当答案：</text>
    <text x="380" y="296" font-size="9.5" fill="#8a3030">　 [5,1,2] 算 7，实际 4——</text>
    <text x="380" y="312" font-size="9.5" fill="#8a3030">　 共享抬升被重复计费</text>
    <text x="380" y="330" font-size="9.5" fill="#8a3030">② 想用一次操作修两个不相邻落差：</text>
    <text x="380" y="346" font-size="9.5" fill="#8a3030">　 内部相邻差不动，办不到</text>
    <text x="380" y="364" font-size="9.5" fill="#8a3030">③ C++ 忘开 long long：</text>
    <text x="380" y="380" font-size="9.5" fill="#8a3030">　 最坏 ~10⁵ × 10⁹ ≈ 10¹⁴ 爆 int</text>
  </g>
</svg>
