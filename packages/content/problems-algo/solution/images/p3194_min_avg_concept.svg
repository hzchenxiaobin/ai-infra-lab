<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：排序后第 k 轮配对 = 第 k 小 × 第 k 大</text>

  <text x="40" y="56" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">排序后 a =</text>

  <!-- sorted boxes, pair-colored: (0,7) blue, (1,6) green, (2,5) orange, (3,4) pink -->
  <rect x="63" y="66" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="85" y="93" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="113" y="66" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="135" y="93" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="163" y="66" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="185" y="93" text-anchor="middle" font-size="16" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="213" y="66" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="235" y="93" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="263" y="66" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="285" y="93" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>

  <rect x="313" y="66" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="335" y="93" text-anchor="middle" font-size="16" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">8</text>

  <rect x="363" y="66" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="385" y="93" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">13</text>

  <rect x="413" y="66" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="435" y="93" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">15</text>

  <!-- two pointers -->
  <path d="M 85 138 L 85 120" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="85" y="154" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">i = 0</text>

  <path d="M 435 138 L 435 120" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="435" y="154" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">j = 7</text>

  <text x="260" y="150" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每轮 i++、j−− 向中间靠拢 ↦</text>

  <!-- pair rows -->
  <rect x="90" y="164" width="340" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="260" y="182" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">第 1 轮：( 1 + 15 ) / 2 = 8.0</text>

  <rect x="90" y="195" width="340" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="260" y="213" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">第 2 轮：( 3 + 13 ) / 2 = 8.0</text>

  <rect x="90" y="226" width="340" height="27" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="260" y="244" text-anchor="middle" font-size="12.5" fill="#8a6d3b" filter="url(#rough2)">第 3 轮：( 4 + 8 ) / 2 = 6.0</text>

  <rect x="90" y="257" width="340" height="27" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="275" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">第 4 轮：( 4 + 7 ) / 2 = 5.5 ★ 最小</text>

  <!-- answer -->
  <rect x="110" y="296" width="300" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="317" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = 5.5 = min{ 8, 8, 6, 5.5 }</text>

  <!-- bottom note -->
  <rect x="40" y="342" width="440" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="360" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">不必真的移除元素：第 k 轮恰好移除第 k 小与第 k 大</text>
  <text x="260" y="378" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">排序后即 a[k−1] 与 a[n−k]，对撞双指针 n/2 对一趟算完</text>
</svg>
