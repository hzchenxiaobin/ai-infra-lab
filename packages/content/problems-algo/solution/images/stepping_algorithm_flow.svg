<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">BFS 生成步进数 —— 算法流程</text>

  <!-- 开始 -->
  <rect x="140" y="48" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="185" y="68" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">开始</text>

  <!-- init -->
  <rect x="80" y="96" width="210" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="185" y="119" text-anchor="middle" font-size="12" fill="#333">队列 ← [0,1,2,…,9]；res ← []</text>

  <path d="M 185 78 L 185 94" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: 队列空? -->
  <polygon points="185,150 270,190 185,230 100,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="194" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">队列为空?</text>
  <path d="M 185 132 L 185 148" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- yes -> return -->
  <path d="M 270 190 L 360 190" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="184" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <rect x="360" y="172" width="150" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="435" y="195" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 res</text>

  <!-- no -> dequeue -->
  <path d="M 185 230 L 185 250" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="246" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="100" y="252" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="185" y="274" text-anchor="middle" font-size="12" fill="#333">num ← 队首出队</text>

  <!-- diamond: num>high? -->
  <path d="M 185 286 L 185 300" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="185,304 265,338 185,372 105,338" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="342" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">num &gt; high?</text>
  <path d="M 265 338 L 360 338" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="332" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <rect x="360" y="320" width="150" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="435" y="343" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">跳出（已升序）</text>

  <!-- no -> num>=low? -->
  <path d="M 185 372 L 185 384" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="382" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- branch right: append ; then continue down to num==0? -->
  <rect x="345" y="386" width="170" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="430" y="406" text-anchor="middle" font-size="11.5" fill="#333">num ≥ low? → res.append(num)</text>
  <path d="M 265 396 L 343 396" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- expand box -->
  <rect x="70" y="386" width="270" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="205" y="408" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">展开（num ≠ 0 时）</text>
  <text x="205" y="426" text-anchor="middle" font-size="11" fill="#555">last ← num % 10</text>
  <text x="205" y="444" text-anchor="middle" font-size="11" fill="#555">last&gt;0 → 入队 num×10+(last−1)；last&lt;9 → 入队 num×10+(last+1)</text>

  <!-- loop back arrow: from expand box left side up to 队列空? diamond -->
  <path d="M 70 423 L 40 423 L 40 190 L 98 190" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="300" font-size="10.5" fill="#4a7a3a" font-weight="bold">回循环</text>

  <text x="280" y="472" text-anchor="middle" font-size="10.5" fill="#888">关键：num&gt;high 即 break —— 队列天然升序，后续必更大；num=0 仅作为结果不展开</text>
</svg>
