<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：枚举左邻居 j，一遍过滤扫描</text>

  <!-- 开始 -->
  <rect x="185" y="40" width="150" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="57" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">读入 height, threshold</text>

  <line x1="260" y1="66" x2="260" y2="78" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="185" y="80" width="150" height="26" rx="6" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="97" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">j = 0（左邻居视角）</text>

  <line x1="260" y1="106" x2="260" y2="118" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环条件 -->
  <polygon points="260,120 335,150 260,180 185,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="154" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">j ≤ n−2 ?</text>

  <line x1="335" y1="150" x2="373" y2="150" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="348" y="144" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="375" y="137" width="105" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="427" y="154" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <line x1="260" y1="180" x2="260" y2="192" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="190" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 判定 -->
  <polygon points="260,194 355,226 260,258 165,226" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="223" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">height[j] &gt;</text>
  <text x="260" y="238" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">threshold ?</text>

  <line x1="355" y1="226" x2="393" y2="226" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="367" y="219" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="395" y="213" width="115" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="452" y="230" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans 追加 j+1</text>

  <path d="M 452 239 L 452 292 L 344 292" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <line x1="260" y1="258" x2="260" y2="277" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="271" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 前进 -->
  <rect x="190" y="279" width="150" height="26" rx="6" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="265" y="296" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">j = j + 1</text>

  <!-- 回边 -->
  <path d="M 190 292 L 110 292 L 110 150 L 181 150" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部要点框 -->
  <rect x="55" y="322" width="410" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="260" y="341" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">条件与动作都挂在 j 上：查 height[j]、收 j+1 —— 下标 0 天然被排除</text>
</svg>
