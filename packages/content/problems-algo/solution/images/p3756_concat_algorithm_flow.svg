<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：一趟预处理 + 每查询 O(1)</text>

  <!-- Start -->
  <rect x="110" y="34" width="300" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="53" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始：s（长 m）+ q 个查询 [l, r]</text>

  <path d="M 260 64 L 260 78" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="95" y="82" width="330" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">一趟扫描 i = 0 … m−1，顺手维护三个前缀</text>

  <path d="M 260 114 L 260 128" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: is non-zero? -->
  <polygon points="185,162 260,134 335,162 260,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="158" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s[i] ≠ '0' ?</text>
  <text x="260" y="176" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">（d = s[i] − '0'）</text>

  <!-- Yes branch (right) -->
  <text x="350" y="156" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 335 162 L 362 162" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="366" y="142" width="140" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="436" y="159" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">P ← (P·10+d) % M</text>
  <text x="436" y="176" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">S += d；C += 1</text>

  <!-- No branch (left) -->
  <text x="170" y="156" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">否</text>
  <path d="M 185 162 L 158 162" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="16" y="142" width="140" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="86" y="159" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">P、S、C 原样继承</text>
  <text x="86" y="176" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">（0 是透明的）</text>

  <!-- Merge arrows into pow10 box -->
  <path d="M 86 184 L 86 208" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 436 184 L 436 208" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 190 L 260 208" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="212" width="360" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="232" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">预处理幂表 pow10[0 … C[m]]：10^k mod M</text>

  <path d="M 260 244 L 260 258" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Query box -->
  <rect x="40" y="262" width="440" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="284" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">对每个查询 [l, r] —— O(1)：</text>
  <text x="260" y="306" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x = (P[r+1] − P[l] · pow10[C[r+1]−C[l]]) % M</text>
  <text x="260" y="326" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">sum = S[r+1] − S[l]</text>
  <text x="260" y="344" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">answer[i] = x · sum % M（C++：x &lt; 0 时 +M）</text>

  <path d="M 260 350 L 260 364" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <rect x="140" y="368" width="240" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="388" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 answer；总复杂度 O(m + q)</text>
</svg>
