<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">寻找重复的子树：子树序列化 → 哈希计数，相同序列 = 相同子树</text>

  <!-- 树结构 -->
  <!-- 根 1 -->
  <line x1="300" y1="72" x2="210" y2="112" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="320" y1="72" x2="410" y2="112" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="310" cy="60" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="64" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- 节点 2 (左, DUP-A 根) -->
  <line x1="200" y1="132" x2="160" y2="182" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="210" cy="120" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="124" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="228" y="113" font-size="9" fill="#4a7a3a" font-weight="bold">A</text>

  <!-- 节点 3 -->
  <line x1="400" y1="132" x2="370" y2="182" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="420" y1="132" x2="470" y2="182" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="410" cy="120" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="124" text-anchor="middle" font-size="11" fill="#333">3</text>

  <!-- 叶 4 (左下, DUP 叶) -->
  <circle cx="160" cy="195" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="199" text-anchor="middle" font-size="11" fill="#333">4</text>

  <!-- 节点 2 (3 的左子, DUP-B 根) -->
  <line x1="360" y1="202" x2="340" y2="252" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="370" cy="190" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="370" y="194" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="388" y="183" font-size="9" fill="#4a7a3a" font-weight="bold">B</text>

  <!-- 叶 4 (3 的右子, DUP 叶) -->
  <circle cx="475" cy="195" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="475" y="199" text-anchor="middle" font-size="11" fill="#333">4</text>

  <!-- 叶 4 (B 的左子, DUP 叶) -->
  <circle cx="340" cy="265" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="340" y="269" text-anchor="middle" font-size="11" fill="#333">4</text>

  <!-- 重复子树 [2,4] 虚线圈 (A 和 B) -->
  <ellipse cx="185" cy="160" rx="42" ry="48" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <ellipse cx="355" cy="230" rx="42" ry="48" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- 序列化说明面板 -->
  <rect x="40" y="300" width="540" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="324" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">子树序列化（前序 + null 记 #，格式 val,left,right）</text>
  <text x="60" y="346" font-size="11" fill="#4a7a3a" font-weight="bold">[4] 叶子 →</text>
  <text x="170" y="346" font-size="11" fill="#555" font-family="'Comic Sans MS', monospace">"4,#,#"</text>
  <text x="280" y="346" font-size="11" fill="#b85450" font-weight="bold">出现 3 次 → 重复 ✓</text>
  <text x="60" y="368" font-size="11" fill="#4a7a3a" font-weight="bold">[2,4] 子树 →</text>
  <text x="170" y="368" font-size="11" fill="#555" font-family="'Comic Sans MS', monospace">"2,4,#,#,#"</text>
  <text x="290" y="368" font-size="11" fill="#b85450" font-weight="bold">出现 2 次 → 重复 ✓</text>
  <text x="60" y="390" font-size="11" fill="#888" font-weight="bold">[1,...] 整树 →</text>
  <text x="170" y="390" font-size="11" fill="#888" font-family="'Comic Sans MS', monospace">"1,2,4,#,#,#,3,..."</text>
  <text x="320" y="390" font-size="11" fill="#888">出现 1 次 → 不重复</text>
</svg>
