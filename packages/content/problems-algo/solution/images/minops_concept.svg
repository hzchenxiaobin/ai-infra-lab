<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：answer[i] = leftOps[i] + rightOps[i]</text>
  <text x="320" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">左球距离和 + 右球距离和 = 总操作数；目标右移时左球各 +1、右球各 −1 步</text>

  <!-- index labels -->
  <g filter="url(#rough2)" font-size="10" fill="#aaa" text-anchor="middle">
    <text x="155" y="72">i=0</text>
    <text x="225" y="72">i=1</text>
    <text x="295" y="72">i=2</text>
    <text x="365" y="72">i=3</text>
    <text x="435" y="72">i=4</text>
  </g>
  <text x="295" y="60" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">目标</text>

  <!-- boxes row: 1 0 1 1 0 -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="130" y="78" width="50" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <circle cx="155" cy="96" r="6" fill="#d6a040"/>
    <rect x="200" y="78" width="50" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="4"/>
    <rect x="270" y="78" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4"/>
    <circle cx="295" cy="96" r="6" fill="#446688"/>
    <rect x="340" y="78" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <circle cx="365" cy="96" r="6" fill="#4a7a3a"/>
    <rect x="410" y="78" width="50" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="4"/>
  </g>

  <!-- left arrow: ball at 0 -> target at 2 -->
  <path d="M 155 114 Q 225 175 283 114" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)" stroke-dasharray="5 3"/>
  <text x="225" y="165" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">距离 2</text>

  <!-- right arrow: ball at 3 -> target at 2 -->
  <path d="M 365 114 Q 330 175 307 114" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" stroke-dasharray="5 3"/>
  <text x="335" y="165" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">距离 1</text>

  <!-- contribution boxes -->
  <rect x="50" y="180" width="240" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="170" y="199" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">左侧贡献 leftOps = 2</text>

  <rect x="350" y="180" width="240" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="199" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">右侧贡献 rightOps = 1</text>

  <!-- answer -->
  <rect x="180" y="218" width="280" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="320" y="237" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">answer[2] = 2 + 1 = 3</text>

  <!-- divider -->
  <line x1="60" y1="258" x2="580" y2="258" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="320" y="276" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">递推：目标从 i−1 移到 i 时</text>

  <!-- recurrence boxes -->
  <rect x="50" y="288" width="270" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="185" y="308" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">左→右扫描</text>
  <text x="185" y="326" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">leftOps[i] = leftOps[i−1] + leftCount</text>
  <text x="185" y="340" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">左侧每个球各多走 1 步</text>

  <rect x="350" y="288" width="270" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="485" y="308" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">右→左扫描</text>
  <text x="485" y="326" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">rightOps[i] = rightOps[i+1] + rightCount</text>
  <text x="485" y="340" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">右侧每个球各多走 1 步</text>
</svg>
