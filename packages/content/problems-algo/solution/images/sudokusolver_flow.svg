<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">解数独：逐格回溯流程</text>

  <!-- entry -->
  <rect x="190" y="48" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="70" text-anchor="middle" font-size="12" fill="#333">solve(pos)  pos = 空格下标</text>

  <path d="M 290 82 L 290 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- terminal: pos == len? -->
  <polygon points="290,100 410,140 290,180 170,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="290" y="136" text-anchor="middle" font-size="12" fill="#333">pos == 空格数?</text>
  <text x="290" y="154" text-anchor="middle" font-size="10" fill="#888">空格全填完</text>

  <path d="M 290 180 L 290 198" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="304" y="194" font-size="10" fill="#82b366">是</text>
  <rect x="210" y="202" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="222" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return true</text>

  <!-- no -->
  <path d="M 410 140 L 470 140 L 470 234" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="432" y="132" font-size="10" fill="#b85450">否</text>

  <rect x="390" y="238" width="170" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="475" y="258" text-anchor="middle" font-size="11" fill="#333">for d = 1 .. 9</text>

  <path d="M 475 268 L 475 284" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- conflict check diamond -->
  <polygon points="475,286 570,316 475,346 380,316" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="475" y="312" text-anchor="middle" font-size="9.5" fill="#333">rows/cols/boxes</text>
  <text x="475" y="328" text-anchor="middle" font-size="9.5" fill="#333">冲突？</text>

  <!-- yes conflict -> next d -->
  <path d="M 570 316 L 556 316" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="560" y="308" font-size="9.5" fill="#b85450">是</text>
  <text x="540" y="340" font-size="9.5" fill="#b85450">跳过此 d</text>

  <!-- no conflict -> place -->
  <path d="M 380 316 L 330 316 L 330 296" stroke="#82b366" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="308" font-size="10" fill="#82b366">否</text>

  <rect x="200" y="292" width="200" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="312" text-anchor="middle" font-size="10" fill="#333">放 d；三表标记 true</text>

  <path d="M 300 324 L 300 340" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="344" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="300" y="364" text-anchor="middle" font-size="10" fill="#333">solve(pos + 1)</text>

  <path d="M 300 374 L 300 390" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- success check -->
  <polygon points="300,392 400,418 300,444 200,418" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="416" text-anchor="middle" font-size="10" fill="#333">递归返回 true?</text>
  <text x="300" y="432" text-anchor="middle" font-size="9" fill="#888">下游全填通</text>

  <!-- yes -> return true -->
  <path d="M 400 418 L 450 418" stroke="#82b366" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="414" y="410" font-size="10" fill="#82b366">是</text>
  <rect x="450" y="404" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="495" y="422" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- no -> backtrack -->
  <path d="M 200 418 L 150 418 L 150 358 L 200 358" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="158" y="410" font-size="10" fill="#b85450">否</text>
  <rect x="40" y="340" width="110" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="95" y="356" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">回溯</text>
  <text x="95" y="370" text-anchor="middle" font-size="9" fill="#b85450">擦除 d，三表 false</text>
  <path d="M 95 340 L 95 316 L 200 316" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="108" y="310" font-size="9" fill="#b85450">试下一个 d</text>

  <!-- all d exhausted -> return false -->
  <path d="M 390 253 L 390 200" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="318" y="186" width="150" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="393" y="204" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">9 个都试过 → return false</text>

  <text x="290" y="448" text-anchor="middle" font-size="10.5" fill="#888">预存空格列表，递归只推进 pos；三表 O(1) 剪枝把搜索树砍到极小</text>
</svg>
