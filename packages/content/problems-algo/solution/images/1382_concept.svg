<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">中序遍历：形状与值集之间的桥梁</text>

  <!-- 左侧：退化 BST（右倾链） -->
  <text x="90" y="62" text-anchor="middle" font-size="12" fill="#888">退化 BST（右倾链）</text>
  <circle cx="90" cy="84" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="88" text-anchor="middle" font-size="11" fill="#333">1</text>
  <circle cx="120" cy="128" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="132" text-anchor="middle" font-size="11" fill="#333">2</text>
  <line x1="98" y1="96" x2="114" y2="116" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="150" cy="172" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="176" text-anchor="middle" font-size="11" fill="#333">3</text>
  <line x1="128" y1="140" x2="144" y2="160" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="180" cy="216" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="220" text-anchor="middle" font-size="11" fill="#333">4</text>
  <line x1="158" y1="184" x2="174" y2="204" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="120" y="252" text-anchor="middle" font-size="10" fill="#b85450">高度 4，不平衡</text>

  <!-- 箭头 1：中序展开 -->
  <path d="M 205 150 L 265 150" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="235" y="142" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">中序遍历</text>
  <text x="235" y="164" text-anchor="middle" font-size="9" fill="#888">左→根→右</text>

  <!-- 中间：升序数组 -->
  <text x="335" y="62" text-anchor="middle" font-size="12" fill="#888">升序数组（= BST 中序）</text>
  <rect x="270" y="78" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="98" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="310" y="78" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="98" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="350" y="78" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="98" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="390" y="78" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="98" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="350" y="128" text-anchor="middle" font-size="10" fill="#d6a040">形状信息丢弃，只留有序性</text>

  <!-- 箭头 2：取中点重建 -->
  <path d="M 435 150 L 495 150" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="465" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">取中点</text>
  <text x="465" y="164" text-anchor="middle" font-size="9" fill="#888">分治重建</text>

  <!-- 右侧：平衡 BST -->
  <text x="545" y="62" text-anchor="middle" font-size="12" fill="#888">平衡 BST</text>
  <circle cx="545" cy="96" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="545" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <circle cx="515" cy="150" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="515" y="154" text-anchor="middle" font-size="11" fill="#333">1</text>
  <line x1="537" y1="108" x2="521" y2="138" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="575" cy="150" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="575" y="154" text-anchor="middle" font-size="11" fill="#333">3</text>
  <line x1="553" y1="108" x2="569" y2="138" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="600" cy="204" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="600" y="208" text-anchor="middle" font-size="10" fill="#333">4</text>
  <line x1="583" y1="162" x2="596" y2="192" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="558" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a">高度 3，平衡</text>

  <!-- 底部说明框 -->
  <rect x="40" y="280" width="540" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="304" font-size="12" fill="#333" font-weight="bold">核心：BST 的中序遍历是升序的</text>
  <text x="60" y="324" font-size="11" fill="#555">① 中序展开：原树形状无论如何退化，中序序列唯一且升序</text>
  <text x="60" y="342" font-size="11" fill="#555">② 取中点重建：对升序数组取 mid=(L+R)/2 为根，左右递归 ⇒ 平衡 BST</text>
  <text x="60" y="356" font-size="11" fill="#888">中序遍历是连接「值集」与「形状」的桥梁——形状可丢，有序性保留</text>
</svg>
