<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">BST 单链搜索：每步比较 + 更新最近值 + 选向</text>

  <!-- 入口 -->
  <rect x="170" y="48" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="70" text-anchor="middle" font-size="12" fill="#333">cur = root; closest = root.val</text>

  <path d="M 290 82 L 290 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环判断 -->
  <polygon points="290,102 420,148 290,194 160,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="144" text-anchor="middle" font-size="12" fill="#333">cur != null ?</text>

  <path d="M 420 148 L 480 148" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="140" font-size="10" fill="#b85450">否</text>
  <rect x="480" y="132" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="520" y="153" text-anchor="middle" font-size="11" fill="#333">返回 closest</text>

  <path d="M 290 194 L 290 210" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="206" font-size="10" fill="#82b366">是</text>

  <!-- 更新最近值 -->
  <rect x="130" y="214" width="320" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="236" text-anchor="middle" font-size="11" fill="#333">if |target − cur.val| &lt; |target − closest|</text>
  <text x="290" y="252" text-anchor="middle" font-size="10" fill="#888">（等号不更新：保留更小值，处理并列情况）</text>

  <path d="M 290 256 L 290 272" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 方向决策 -->
  <polygon points="290,276 400,316 290,356 180,316" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="312" text-anchor="middle" font-size="12" fill="#333">target &lt; cur.val ?</text>

  <!-- 走左 -->
  <path d="M 180 316 L 110 316" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="308" font-size="10" fill="#82b366">是</text>
  <rect x="20" y="300" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="65" y="321" text-anchor="middle" font-size="11" fill="#333">cur = cur.left</text>

  <!-- 走右 -->
  <path d="M 400 316 L 460 316" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="308" font-size="10" fill="#b85450">否</text>
  <rect x="460" y="300" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="510" y="321" text-anchor="middle" font-size="11" fill="#333">cur = cur.right</text>

  <!-- 回到循环 -->
  <path d="M 65 300 L 65 130 L 160 148" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 510 300 L 510 130 L 420 148" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="390" text-anchor="middle" font-size="10" fill="#b85450">↑ 回到循环顶部</text>

  <!-- 说明框 -->
  <rect x="40" y="400" width="500" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
</svg>
