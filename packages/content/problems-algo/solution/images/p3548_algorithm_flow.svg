<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <!-- 开始 -->
  <ellipse cx="260" cy="29" rx="45" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="34" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">开始</text>
  <path d="M 260 44 L 260 52" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 枚举割线 -->
  <rect x="140" y="54" width="240" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="71" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">枚举水平割 r（垂直割=转置复用）</text>
  <text x="260" y="88" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">预处理：total 与全表值计数 full[]</text>
  <path d="M 260 96 L 260 104" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 增量维护 -->
  <rect x="140" y="106" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">增量并入第 r 行：topSum、cnt[]</text>
  <text x="260" y="138" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">下半 = total − topSum，计数 = full − cnt</text>
  <path d="M 260 144 L 260 152" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 直接相等？ -->
  <polygon points="260,152 345,182 260,212 175,182" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="187" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">topSum == botSum ?</text>
  <path d="M 345 182 L 390 182" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="355" y="175" font-size="11" fill="#888" filter="url(#rough2)">是</text>
  <ellipse cx="445" cy="182" rx="52" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="445" y="187" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">return true</text>
  <path d="M 260 212 L 260 232" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="226" font-size="11" fill="#888" filter="url(#rough2)">否</text>

  <!-- 差值与较大侧 -->
  <rect x="140" y="234" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="256" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">v = |topSum − botSum|，锁定较大侧</text>
  <path d="M 260 268 L 260 278" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 形状分支一：二维块？ -->
  <polygon points="260,278 360,308 260,338 160,308" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="305" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">较大侧是二维块？</text>
  <text x="260" y="320" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">（行≥2 且列≥2）</text>
  <path d="M 360 308 L 386 308" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="366" y="301" font-size="11" fill="#888" filter="url(#rough2)">是</text>
  <rect x="388" y="284" width="124" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="303" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">查计数（哈希 O(1)）</text>
  <text x="450" y="319" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">块内存在 v → true</text>
  <path d="M 260 338 L 260 356" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="350" font-size="11" fill="#888" filter="url(#rough2)">否</text>

  <!-- 形状分支二：单行/单列？ -->
  <polygon points="260,356 352,386 260,416 168,386" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="391" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">较大侧是单行/单列？</text>
  <path d="M 352 386 L 386 386" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="379" font-size="11" fill="#888" filter="url(#rough2)">是</text>
  <rect x="388" y="362" width="124" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="381" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">只能挖首/尾格</text>
  <text x="450" y="397" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">v==端点值 → true</text>
  <path d="M 260 416 L 260 436" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="428" font-size="11" fill="#888" filter="url(#rough2)">否</text>
  <text x="284" y="430" font-size="10" fill="#888" filter="url(#rough2)">（1×1：移除后为空，跳过）</text>

  <!-- 结束 -->
  <text x="170" y="462" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">所有割线穷尽 →</text>
  <ellipse cx="260" cy="458" rx="62" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="463" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">return false</text>

  <!-- 回环：下一条割线 -->
  <path d="M 168 386 C 44 386, 44 125, 138 125" stroke="#888" stroke-width="1.5" stroke-dasharray="6 5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="255" font-size="10.5" fill="#888" filter="url(#rough2)" transform="rotate(-90 30 255)">未命中 → 下一条割线</text>
</svg>
