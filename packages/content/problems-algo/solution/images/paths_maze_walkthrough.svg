<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐顶点枚举邻居对，命中即 +1</text>
  <text x="300" y="42" text-anchor="middle" font-size="11" fill="#888">图同上：1:{2,3,4} 2:{1,4,5} 3:{1,4} 4:{1,2,3} 5:{2}</text>

  <!-- Header row -->
  <text x="40" y="72" font-size="12" fill="#444" font-weight="bold">顶点c</text>
  <text x="110" y="72" font-size="12" fill="#444" font-weight="bold">邻居 g[c]</text>
  <text x="250" y="72" font-size="12" fill="#444" font-weight="bold">检查邻居对 (a,b)</text>
  <text x="470" y="72" font-size="12" fill="#444" font-weight="bold">命中(成环)</text>
  <text x="560" y="72" font-size="12" fill="#444" font-weight="bold">计数</text>
  <line x1="28" y1="80" x2="582" y2="80" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- Row c=1 -->
  <text x="40" y="104" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="110" y="104" font-size="11" fill="#333">{2,3,4}</text>
  <text x="250" y="104" font-size="11" fill="#333">(2,3) (2,4) (3,4)</text>
  <text x="470" y="104" font-size="11" fill="#4a7a3a" font-weight="bold">{1,2,4} {1,3,4}</text>
  <text x="560" y="104" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- Row c=2 -->
  <text x="40" y="128" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="110" y="128" font-size="11" fill="#333">{1,4,5}</text>
  <text x="250" y="128" font-size="11" fill="#333">(1,4) (1,5) (4,5)</text>
  <text x="470" y="128" font-size="11" fill="#4a7a3a" font-weight="bold">{1,2,4}</text>
  <text x="560" y="128" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- Row c=3 -->
  <text x="40" y="152" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="110" y="152" font-size="11" fill="#333">{1,4}</text>
  <text x="250" y="152" font-size="11" fill="#333">(1,4)</text>
  <text x="470" y="152" font-size="11" fill="#4a7a3a" font-weight="bold">{1,3,4}</text>
  <text x="560" y="152" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- Row c=4 -->
  <text x="40" y="176" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="110" y="176" font-size="11" fill="#333">{1,2,3}</text>
  <text x="250" y="176" font-size="11" fill="#333">(1,2) (1,3) (2,3)</text>
  <text x="470" y="176" font-size="11" fill="#4a7a3a" font-weight="bold">{1,2,4} {1,3,4}</text>
  <text x="560" y="176" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- Row c=5 -->
  <text x="40" y="200" font-size="12" fill="#666" font-weight="bold">5</text>
  <text x="110" y="200" font-size="11" fill="#666">{2}</text>
  <text x="250" y="200" font-size="11" fill="#999">— 不足一对 —</text>
  <text x="470" y="200" font-size="11" fill="#999">—</text>
  <text x="560" y="200" font-size="12" fill="#999">0</text>

  <line x1="28" y1="212" x2="582" y2="212" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- Sum row -->
  <text x="40" y="236" font-size="12" fill="#b85450" font-weight="bold">合计</text>
  <text x="250" y="236" font-size="11" fill="#555">每个三角形被 3 个顶点重复统计</text>
  <text x="470" y="236" font-size="11" fill="#b85450" font-weight="bold">{1,2,4}×3  {1,3,4}×3</text>
  <text x="560" y="236" font-size="13" fill="#b85450" font-weight="bold">6</text>

  <!-- Result box -->
  <rect x="60" y="258" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="280" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">ans = 6，每个 3 环被 3 个顶点各算 1 次</text>
  <text x="300" y="300" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">混乱分数 = 6 / 3 = 2</text>

  <!-- Triangle dedup mini example -->
  <rect x="60" y="326" width="480" height="84" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="300" y="346" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">为什么要除以 3？</text>
  <text x="300" y="366" text-anchor="middle" font-size="11" fill="#555">三角形 {1,2,4} 会在 c=1、c=2、c=4 时各被统计一次</text>
  <text x="300" y="382" text-anchor="middle" font-size="11" fill="#555">（分别以 1、2、4 为中心，另外两点互连）→ 共 3 次</text>
  <text x="300" y="398" text-anchor="middle" font-size="11" fill="#888">故总数 ÷ 3 才是不同 3 环的数量</text>

  <!-- legend -->
  <rect x="80" y="420" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
  <text x="100" y="431" font-size="11" fill="#555">命中成环</text>
  <text x="220" y="431" font-size="11" fill="#888">未命中的对（如 (2,3) 因 2-3 无边）不计数</text>
</svg>
