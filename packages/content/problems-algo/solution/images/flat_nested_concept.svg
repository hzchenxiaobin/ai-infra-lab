<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：每下钻一层「深度预算」减 1，预算 &gt; 0 才展开子数组</text>

  <!-- depth column headers -->
  <text x="235" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">depth 0</text>
  <text x="235" y="71" text-anchor="middle" font-size="10" fill="#888">预算 = n</text>
  <text x="430" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">depth 1</text>
  <text x="430" y="71" text-anchor="middle" font-size="10" fill="#888">预算 = n−1</text>
  <text x="615" y="56" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">depth 2</text>
  <text x="615" y="71" text-anchor="middle" font-size="10" fill="#888">预算 = n−2</text>

  <!-- vertical depth guide lines -->
  <line x1="335" y1="80" x2="335" y2="250" stroke="#cfd8e3" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="525" y1="80" x2="525" y2="250" stroke="#cfd8e3" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- root arr -->
  <rect x="34" y="158" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="57" y="178" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">arr</text>

  <!-- depth 0 children -->
  <rect x="215" y="100" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="235" y="119" text-anchor="middle" font-size="12" fill="#333">1</text>

  <rect x="198" y="158" width="74" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="235" y="178" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[2,[3,4]]</text>

  <rect x="215" y="216" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="235" y="235" text-anchor="middle" font-size="12" fill="#333">5</text>

  <!-- depth 1 children of [2,[3,4]] -->
  <rect x="410" y="138" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="430" y="157" text-anchor="middle" font-size="12" fill="#333">2</text>

  <rect x="402" y="196" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="430" y="216" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[3,4]</text>

  <!-- depth 2 children of [3,4] -->
  <rect x="595" y="184" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="615" y="203" text-anchor="middle" font-size="12" fill="#333">3</text>

  <rect x="595" y="220" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="615" y="239" text-anchor="middle" font-size="12" fill="#333">4</text>

  <!-- edges -->
  <path d="M 80 173 C 150 173, 160 114, 215 114" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 80 173 L 198 173" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 80 173 C 150 173, 160 230, 215 230" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 272 173 C 340 173, 350 152, 410 152" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 272 173 C 340 173, 350 211, 402 211" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 458 211 C 530 211, 545 198, 595 198" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 458 211 C 530 211, 545 234, 595 234" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- legend -->
  <rect x="40" y="270" width="16" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="62" y="283" font-size="11" fill="#555">数组节点（可展开）</text>
  <rect x="190" y="270" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="212" y="283" font-size="11" fill="#555">叶子（数字）</text>

  <!-- results -->
  <rect x="40" y="300" width="640" height="44" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="58" y="318" font-size="11" fill="#b85450" font-weight="bold">n=1：</text>
  <text x="98" y="318" font-size="11" fill="#333">展开 depth0 的 [2,[3,4]] →</text>
  <text x="258" y="318" font-size="11" fill="#333" font-weight="bold">[1, 2, [3,4], 5]</text>
  <text x="400" y="318" font-size="10" fill="#888">（[3,4] 在 depth1，预算 0，保留）</text>
  <text x="58" y="336" font-size="11" fill="#b85450" font-weight="bold">n=2：</text>
  <text x="98" y="336" font-size="11" fill="#333">再展开 depth1 的 [3,4] →</text>
  <text x="258" y="336" font-size="11" fill="#333" font-weight="bold">[1, 2, 3, 4, 5]</text>
</svg>
