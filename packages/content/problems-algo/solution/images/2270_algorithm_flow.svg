<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：求 total → 滚动 leftSum → 比较两段和 → 计数</text>

  <!-- Step 1: total = sum(nums) -->
  <rect x="180" y="40" width="180" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① total = sum(nums)</text>
  <text x="372" y="64" font-size="9.5" fill="#888">一次遍历 O(n)</text>

  <!-- arrow -->
  <line x1="270" y1="78" x2="270" y2="96" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: init -->
  <rect x="150" y="100" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② leftSum=0, ans=0</text>

  <!-- arrow -->
  <line x1="270" y1="138" x2="270" y2="156" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: for loop -->
  <rect x="150" y="160" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="182" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ for i = 0 .. n−2：</text>

  <!-- arrow into loop body -->
  <line x1="270" y1="194" x2="270" y2="210" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: leftSum += nums[i] -->
  <rect x="140" y="214" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="236" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">leftSum += nums[i]（前 i+1 个元素之和）</text>

  <!-- arrow -->
  <line x1="270" y1="248" x2="270" y2="262" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: rightSum -->
  <rect x="110" y="266" width="320" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="288" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">rightSum = total − leftSum（后 n−i−1 个之和）</text>

  <!-- arrow -->
  <line x1="270" y1="300" x2="270" y2="316" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: leftSum >= rightSum? -->
  <polygon points="270,320 372,356 270,392 168,356" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="352" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">leftSum</text>
  <text x="270" y="366" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">≥ rightSum ?</text>

  <!-- Yes branch (right) -->
  <line x1="372" y1="356" x2="412" y2="356" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="350" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="416" y="340" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="471" y="360" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans++</text>

  <!-- No branch (left) -->
  <line x1="168" y1="356" x2="128" y2="356" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="350" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="16" y="340" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="71" y="360" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">跳过</text>

  <!-- converge to loop back -->
  <line x1="71" y1="372" x2="71" y2="392" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="471" y1="372" x2="471" y2="392" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="71" y1="392" x2="471" y2="392" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- loop back arrow (right side) back to for -->
  <path d="M 460 392 Q 510 392 510 178 L 390 178" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="502" y="300" font-size="9.5" fill="#888">下一 i</text>

  <!-- return -->
  <rect x="170" y="404" width="200" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="419" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④ 遍历结束返回 ans</text>
</svg>
