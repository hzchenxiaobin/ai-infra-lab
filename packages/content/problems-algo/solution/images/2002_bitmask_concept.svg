<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">位掩码：子序列 ↔ n 位掩码，不相交 ⟺ 按位与为 0</text>
  <text x="280" y="42" text-anchor="middle" font-size="10" fill="#888">选第 i 个下标 = bit i 置 1；两个子序列无公共下标 = 两掩码无公共 1</text>

  <!-- index labels above -->
  <g font-size="9" fill="#888">
    <text x="78" y="62" text-anchor="middle">0</text>
    <text x="118" y="62" text-anchor="middle">1</text>
    <text x="158" y="62" text-anchor="middle">2</text>
    <text x="198" y="62" text-anchor="middle">3</text>
