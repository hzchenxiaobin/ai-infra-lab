  <!-- result -->
  <text x="280" y="288" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">= 0  →  两子序列不相交 ✓</text>

  <!-- key insight box -->
  <rect x="30" y="305" width="500" height="95" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键观察</text>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#333">每个子序列对应一个 n 位掩码（bit i = 1 表示选中下标 i）</text>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#333">两个子序列不相交 ⟺ mask₁ &amp; mask₂ == 0（无公共 1 位）</text>
  <text x="280" y="390" text-anchor="middle" font-size="10" fill="#666">n ≤ 12 → 2¹² = 4096 个掩码，可全部枚举</text>
</svg>
