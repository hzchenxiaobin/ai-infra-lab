    <text x="118" y="92" text-anchor="middle" fill="#446688" font-weight="bold">e</text>
    <!-- index 2: e (white) -->
    <rect x="140" y="70" width="36" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="158" y="92" text-anchor="middle" fill="#666">e</text>
    <!-- index 3: t (blue - ete) -->
    <rect x="180" y="70" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="198" y="92" text-anchor="middle" fill="#446688" font-weight="bold">t</text>
