<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：num = 2736 → 7236</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">last 表预存 → i=0 命中 d=7 → 交换下标 0 与 1</text>

  <!-- ===== digits row ===== -->
  <text x="40" y="88" font-size="12" fill="#888">digits：</text>

  <rect x="150" y="72" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="175" y="94" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <rect x="204" y="72" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="229" y="94" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>

  <rect x="258" y="72" width="50" height="34" fill="#fafafa" stroke="#aaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="283" y="94" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <rect x="312" y="72" width="50" height="34" fill="#fafafa" stroke="#aaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="337" y="94" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>

  <!-- index labels -->
  <text x="175" y="120" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i=0</text>
  <text x="229" y="120" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">j=1</text>
  <text x="283" y="120" text-anchor="middle" font-size="10" fill="#aaa">2</text>
  <text x="337" y="120" text-anchor="middle" font-size="10" fill="#aaa">3</text>

  <!-- divider -->
  <line x1="40" y1="138" x2="520" y2="138" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== last table ===== -->
  <text x="40" y="162" font-size="12" fill="#888">last[d]：</text>

  <!-- d row header -->
  <text x="40" y="190" font-size="11" fill="#888">d</text>
  <!-- 10 cells d=0..9, width 40, x=80,120,...,440 -->
  <rect x="80" y="176" width="40" height="26" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="100" y="194" text-anchor="middle" font-size="11" fill="#666">0</text>
  <rect x="120" y="176" width="40" height="26" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="140" y="194" text-anchor="middle" font-size="11" fill="#666">1</text>
  <rect x="160" y="176" width="40" height="26" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="180" y="194" text-anchor="middle" font-size="11" fill="#666">2</text>
  <rect x="200" y="176" width="40" height="26" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="220" y="194" text-anchor="middle" font-size="11" fill="#666">3</text>
  <rect x="240" y="176" width="40" height="26" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="260" y="194" text-anchor="middle" font-size="11" fill="#666">4</text>
  <rect x="280" y="176" width="40" height="26" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="300" y="194" text-anchor="middle" font-size="11" fill="#666">5</text>
  <rect x="320" y="176" width="40" height="26" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="340" y="194" text-anchor="middle" font-size="11" fill="#666">6</text>
  <rect x="360" y="176" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="2" filter="url(#rough2)"/>
  <text x="380" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">7</text>
  <rect x="400" y="176" width="40" height="26" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="420" y="194" text-anchor="middle" font-size="11" fill="#666">8</text>
  <rect x="440" y="176" width="40" height="26" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="460" y="194" text-anchor="middle" font-size="11" fill="#666">9</text>

  <!-- last value row -->
  <text x="40" y="224" font-size="11" fill="#888">last</text>
  <rect x="80" y="210" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="100" y="228" text-anchor="middle" font-size="11" fill="#999">−1</text>
  <rect x="120" y="210" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="140" y="228" text-anchor="middle" font-size="11" fill="#999">−1</text>
  <rect x="160" y="210" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="180" y="228" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <rect x="200" y="210" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="220" y="228" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <rect x="240" y="210" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="11" fill="#999">−1</text>
  <rect x="280" y="210" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="300" y="228" text-anchor="middle" font-size="11" fill="#999">−1</text>
  <rect x="320" y="210" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="340" y="228" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <rect x="360" y="210" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="2" filter="url(#rough2)"/>
  <text x="380" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="400" y="210" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="420" y="228" text-anchor="middle" font-size="11" fill="#999">−1</text>
  <rect x="440" y="210" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="460" y="228" text-anchor="middle" font-size="11" fill="#999">−1</text>

  <!-- divider -->
  <line x1="40" y1="250" x2="520" y2="250" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== scan trace ===== -->
  <text x="40" y="274" font-size="12" fill="#888">i=0, cur=2：</text>

  <!-- d=9: last=-1, skip -->
  <rect x="150" y="260" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="182" y="280" text-anchor="middle" font-size="11" fill="#d6a040">d=9 → −1 ✗</text>

  <text x="226" y="280" font-size="12" fill="#888">→</text>

  <!-- d=8: last=-1, skip -->
  <rect x="244" y="260" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="276" y="280" text-anchor="middle" font-size="11" fill="#d6a040">d=8 → −1 ✗</text>

  <text x="320" y="280" font-size="12" fill="#888">→</text>

  <!-- d=7: last=1 > 0, hit -->
  <rect x="338" y="260" width="84" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="380" y="280" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">d=7, last=1&gt;0 ✓</text>

  <text x="434" y="280" font-size="11" fill="#4a7a3a" font-weight="bold">命中！</text>

  <!-- swap arrow -->
  <path d="M 229 134 Q 229 300 200 296" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== result ===== -->
  <text x="40" y="330" font-size="12" fill="#888">交换 (0,1)：</text>

  <rect x="150" y="316" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="338" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>
  <rect x="204" y="316" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="229" y="338" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="258" y="316" width="50" height="34" fill="#fafafa" stroke="#aaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="283" y="338" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="312" y="316" width="50" height="34" fill="#fafafa" stroke="#aaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="337" y="338" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>

  <text x="378" y="338" font-size="13" fill="#888">=</text>
  <rect x="396" y="316" width="76" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="434" y="338" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">7236</text>

  <!-- bottom note -->
  <rect x="80" y="362" width="400" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">从 9 递减保证取最大；last 取最右出现 → 一次命中即交换</text>
</svg>
