<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：jewels = "aA"，stones = "aAAbbbb"</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">jewelSet = { a, A }，初值 count = 0</text>

  <!-- table header -->
  <rect x="40" y="58" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="77" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">步骤</text>
  <rect x="124" y="58" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="77" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">字符 ch</text>
  <rect x="208" y="58" width="130" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="273" y="77" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ch ∈ jewelSet?</text>
  <rect x="342" y="58" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="387" y="77" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">count</text>
  <rect x="436" y="58" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="468" y="77" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">动作</text>

  <!-- rows: step, ch, hit?, count, action -->
  <!-- row 1: a, ✓, 1, count++ -->
  <rect x="40" y="92" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="80" y="110" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <rect x="124" y="92" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="164" y="110" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="208" y="92" width="130" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="273" y="110" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">✓ 命中</text>
  <rect x="342" y="92" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="387" y="110" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="436" y="92" width="64" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="468" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>

  <!-- row 2: A, ✓, 2 -->
  <rect x="40" y="122" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="80" y="140" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <rect x="124" y="122" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="164" y="140" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A</text>
  <rect x="208" y="122" width="130" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="273" y="140" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">✓ 命中</text>
  <rect x="342" y="122" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="387" y="140" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="436" y="122" width="64" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="468" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>

  <!-- row 3: A, ✓, 3 -->
  <rect x="40" y="152" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="80" y="170" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <rect x="124" y="152" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="164" y="170" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A</text>
  <rect x="208" y="152" width="130" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="273" y="170" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">✓ 命中</text>
  <rect x="342" y="152" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="387" y="170" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="436" y="152" width="64" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="468" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>

  <!-- row 4: b, ✗, 3 -->
  <rect x="40" y="182" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="80" y="200" text-anchor="middle" font-size="11.5" fill="#333">4</text>
  <rect x="124" y="182" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="164" y="200" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <rect x="208" y="182" width="130" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="273" y="200" text-anchor="middle" font-size="11.5" fill="#999" font-weight="bold">✗ 不在</text>
  <rect x="342" y="182" width="90" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="387" y="200" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">3</text>
  <rect x="436" y="182" width="64" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="468" y="200" text-anchor="middle" font-size="11" fill="#999">跳过</text>

  <!-- row 5: b, ✗, 3 -->
  <rect x="40" y="212" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="80" y="230" text-anchor="middle" font-size="11.5" fill="#333">5</text>
  <rect x="124" y="212" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="164" y="230" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <rect x="208" y="212" width="130" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="273" y="230" text-anchor="middle" font-size="11.5" fill="#999" font-weight="bold">✗ 不在</text>
  <rect x="342" y="212" width="90" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="387" y="230" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">3</text>
  <rect x="436" y="212" width="64" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="468" y="230" text-anchor="middle" font-size="11" fill="#999">跳过</text>

  <!-- row 6: b, ✗, 3 -->
  <rect x="40" y="242" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="80" y="260" text-anchor="middle" font-size="11.5" fill="#333">6</text>
  <rect x="124" y="242" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="164" y="260" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <rect x="208" y="242" width="130" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="273" y="260" text-anchor="middle" font-size="11.5" fill="#999" font-weight="bold">✗ 不在</text>
  <rect x="342" y="242" width="90" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="387" y="260" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">3</text>
  <rect x="436" y="242" width="64" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="468" y="260" text-anchor="middle" font-size="11" fill="#999">跳过</text>

  <!-- row 7: b, ✗, 3 -->
  <rect x="40" y="272" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="80" y="290" text-anchor="middle" font-size="11.5" fill="#333">7</text>
  <rect x="124" y="272" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="164" y="290" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <rect x="208" y="272" width="130" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="273" y="290" text-anchor="middle" font-size="11.5" fill="#999" font-weight="bold">✗ 不在</text>
  <rect x="342" y="272" width="90" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="387" y="290" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">3</text>
  <rect x="436" y="272" width="64" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="468" y="290" text-anchor="middle" font-size="11" fill="#999">跳过</text>

  <!-- 终判 -->
  <rect x="40" y="312" width="460" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="336" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">遍历结束 → return count = 3</text>

  <!-- note -->
  <rect x="40" y="358" width="460" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="380" text-anchor="middle" font-size="11" fill="#555"> jewels 中字符互不相同 → 集合天然无重复；大小写敏感，'a' 与 'A' 是不同的宝石</text>
</svg>
