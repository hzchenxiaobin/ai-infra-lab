<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：找两条根路径 → 剥公共前缀 → 拼 U + L/R</text>

  <!-- Step 1 -->
  <rect x="40" y="48" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="60" y="70" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① DFS 找 root→start 路径</text>
  <text x="60" y="88" font-size="11" fill="#333" filter="url(#rough2)">回溯记录方向：向左记 'L'，向右记 'R'，命中 startValue 即收集 pathStart</text>
  <text x="490" y="88" text-anchor="end" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">pathStart</text>

  <line x1="280" y1="108" x2="280" y2="128" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="40" y="132" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="60" y="154" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② DFS 找 root→dest 路径</text>
  <text x="60" y="172" font-size="11" fill="#333" filter="url(#rough2)">同样回溯记录方向，命中 destValue 收集 pathDest</text>
  <text x="490" y="172" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">pathDest</text>

  <line x1="280" y1="192" x2="280" y2="212" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: strip common prefix -->
  <rect x="40" y="216" width="480" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="60" y="238" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ 剥离公共前缀 → 定位 LCA</text>
  <text x="60" y="256" font-size="11" fill="#333" filter="url(#rough2)">逐字符比较 pathStart 与 pathDest，相同则同跳（经过同一路径=LCA 之上）</text>
  <text x="60" y="274" font-size="11" fill="#b85450" filter="url(#rough2)">首次不同处 = LCA，剩余 startRemain / destRemain</text>

  <line x1="280" y1="292" x2="280" y2="312" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: build answer -->
  <rect x="40" y="316" width="480" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="60" y="338" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ 拼接答案</text>
  <text x="60" y="356" font-size="11" fill="#333" filter="url(#rough2)">answer = 'U' × len(startRemain) + destRemain</text>
  <text x="60" y="374" font-size="11" fill="#b85450" filter="url(#rough2)">start 上行到 LCA（每步 U）+ 从 LCA 下行到 dest（原 L/R 方向）</text>
</svg>
