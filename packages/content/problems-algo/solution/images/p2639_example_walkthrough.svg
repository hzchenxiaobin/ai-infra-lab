<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：单列取 3；三列分别取 3 / 1 / 2</text>

  <!-- ====== Example 1 (left) ====== -->
  <rect x="24" y="48" width="280" height="350" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="164" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：grid = [[1],[22],[333]]</text>
  <text x="164" y="88" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">m=3, n=1（单列）</text>

  <!-- column 0 values stacked -->
  <rect x="120" y="104" width="88" height="34" fill="#fff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="164" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="222" y="126" font-size="10" fill="#999" filter="url(#rough2)">→ "1" 长 1</text>

  <rect x="120" y="142" width="88" height="34" fill="#fff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="164" y="164" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">22</text>
  <text x="222" y="164" font-size="10" fill="#999" filter="url(#rough2)">→ "22" 长 2</text>

  <rect x="120" y="180" width="88" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="164" y="202" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">333</text>
  <text x="222" y="202" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ "333" 长 3</text>

  <!-- arrow down -->
  <path d="M 164 220 L 164 240" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="236" font-size="10" fill="#446688" filter="url(#rough2)">取 max</text>

  <!-- result -->
  <rect x="110" y="246" width="108" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="164" y="272" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = [3]</text>

  <text x="164" y="312" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">单列三个长度 1/2/3</text>
  <text x="164" y="328" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">列最大 = 3</text>

  <!-- ====== Example 2 (right) ====== -->
  <rect x="336" y="48" width="280" height="350" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="476" y="72" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">示例 2：3×3 矩阵</text>

  <!-- 3x3 grid -->
  <!-- col headers -->
  <text x="394" y="94" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">列0</text>
  <text x="442" y="94" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">列1</text>
  <text x="490" y="94" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">列2</text>
  <!-- row 0 -->
  <rect x="372" y="100" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="394" y="120" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">−15</text>
  <rect x="420" y="100" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="442" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="468" y="100" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="490" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <!-- row 1 -->
  <rect x="372" y="132" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="394" y="152" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">15</text>
  <rect x="420" y="132" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="442" y="152" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <rect x="468" y="132" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="490" y="152" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">12</text>
  <!-- row 2 -->
  <rect x="372" y="164" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="394" y="184" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="420" y="164" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="442" y="184" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="468" y="164" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="490" y="184" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">−2</text>

  <!-- width per cell small -->
  <text x="394" y="210" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">长 3/2/1</text>
  <text x="442" y="210" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">长 1/1/1</text>
  <text x="490" y="210" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">长 1/2/2</text>

  <!-- down arrows -->
  <path d="M 394 218 L 394 238" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 442 218 L 442 238" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 490 218 L 490 238" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- max row -->
  <rect x="372" y="244" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="394" y="265" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="420" y="244" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="442" y="265" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="468" y="244" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="490" y="265" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="476" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = [3, 1, 2]</text>

  <!-- note about negative sign -->
  <rect x="348" y="312" width="256" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="476" y="332" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">易错点：负号占一位</text>
  <text x="360" y="352" font-size="10" fill="#555" filter="url(#rough2)">−15 → "-15" 长 3（2 数位 + 1 负号）</text>
  <text x="360" y="370" font-size="10" fill="#555" filter="url(#rough2)">−2  → "-2"  长 2（1 数位 + 1 负号）</text>
  <text x="360" y="386" font-size="10" fill="#999" filter="url(#rough2)">len(str(x)) 自动处理，无需手动 +1</text>
</svg>
