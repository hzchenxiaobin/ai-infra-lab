<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1 演算</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#888">s = "LeetcodeHelpsMeLearn", spaces = [8,13,15]</text>

  <!-- ===== Header row ===== -->
  <rect x="20" y="52" width="80" height="30" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">i 区间</text>

  <rect x="100" y="52" width="56" height="30" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="72" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">j</text>

  <rect x="156" y="52" width="76" height="30" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="72" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">spaces[j]</text>

  <rect x="232" y="52" width="60" height="30" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="72" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">命中?</text>

  <rect x="292" y="52" width="208" height="30" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="396" y="72" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">累积输出</text>

  <!-- ===== Row 1: i=0..7 ===== -->
  <rect x="20" y="86" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="106" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">0…7</text>
  <rect x="100" y="86" width="56" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="106" text-anchor="middle" font-size="10.5" fill="#555">0</text>
  <rect x="156" y="86" width="76" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="106" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">8</text>
  <rect x="232" y="86" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="106" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">✗</text>
  <rect x="292" y="86" width="208" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="396" y="106" text-anchor="middle" font-size="10.5" fill="#333">Leetcode</text>

  <!-- ===== Row 2: i=8 (hit) ===== -->
  <rect x="20" y="120" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="140" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">8</text>
  <rect x="100" y="120" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="140" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">0→1</text>
  <rect x="156" y="120" width="76" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="140" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">8</text>
  <rect x="232" y="120" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="140" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="292" y="120" width="208" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="396" y="140" text-anchor="middle" font-size="10.5" fill="#333">Leetcode␣H</text>

  <!-- ===== Row 3: i=9..12 ===== -->
  <rect x="20" y="154" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="174" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">9…12</text>
  <rect x="100" y="154" width="56" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="174" text-anchor="middle" font-size="10.5" fill="#555">1</text>
  <rect x="156" y="154" width="76" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="174" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">13</text>
  <rect x="232" y="154" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="174" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">✗</text>
  <rect x="292" y="154" width="208" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="396" y="174" text-anchor="middle" font-size="10.5" fill="#333">Leetcode␣Helps</text>

  <!-- ===== Row 4: i=13 (hit) ===== -->
  <rect x="20" y="188" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="208" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">13</text>
  <rect x="100" y="188" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="208" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">1→2</text>
  <rect x="156" y="188" width="76" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="208" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">13</text>
  <rect x="232" y="188" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="208" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="292" y="188" width="208" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="396" y="208" text-anchor="middle" font-size="10.5" fill="#333">Leetcode␣Helps␣M</text>

  <!-- ===== Row 5: i=14 ===== -->
  <rect x="20" y="222" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="242" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">14</text>
  <rect x="100" y="222" width="56" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="242" text-anchor="middle" font-size="10.5" fill="#555">2</text>
  <rect x="156" y="222" width="76" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="242" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">15</text>
  <rect x="232" y="222" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="242" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">✗</text>
  <rect x="292" y="222" width="208" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="396" y="242" text-anchor="middle" font-size="10.5" fill="#333">Leetcode␣Helps␣Me</text>

  <!-- ===== Row 6: i=15 (hit) ===== -->
  <rect x="20" y="256" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="276" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">15</text>
  <rect x="100" y="256" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="276" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">2→3</text>
  <rect x="156" y="256" width="76" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="276" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">15</text>
  <rect x="232" y="256" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="276" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="292" y="256" width="208" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="396" y="276" text-anchor="middle" font-size="10.5" fill="#333">Leetcode␣Helps␣Me␣L</text>

  <!-- ===== Row 7: i=16..20 ===== -->
  <rect x="20" y="290" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="310" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">16…20</text>
  <rect x="100" y="290" width="56" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="310" text-anchor="middle" font-size="10.5" fill="#555">3</text>
  <rect x="156" y="290" width="76" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="194" y="310" text-anchor="middle" font-size="10.5" fill="#bbb">—</text>
  <rect x="232" y="290" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="310" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">✗</text>
  <rect x="292" y="290" width="208" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="396" y="310" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">Leetcode␣Helps␣Me␣Learn</text>

  <!-- Footer -->
  <text x="260" y="340" text-anchor="middle" font-size="10" fill="#aaa">绿框=命中并在该字符前插入空格 · ␣ 表示空格 · j 用尽后只写字符</text>
  <text x="260" y="354" text-anchor="middle" font-size="10" fill="#aaa">最终结果："Leetcode Helps Me Learn"</text>
</svg>
