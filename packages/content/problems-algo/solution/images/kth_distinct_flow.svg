<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">两遍扫描算法流程</text>

  <!-- Pass 1 区块标题 -->
  <rect x="40" y="50" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="12" filter="url(#rough2)"/>
  <text x="100" y="68" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">Pass 1：计数</text>

  <!-- Pass 1 起始 -->
  <rect x="220" y="50" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="300" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">freq = {} , i = 0</text>
  <line x1="300" y1="84" x2="300" y2="104" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Pass 1 取字符 -->
  <rect x="210" y="106" width="180" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="128" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">s = arr[i] ; freq[s] += 1</text>
  <line x1="300" y1="140" x2="300" y2="160" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Pass 1 i++ 循环 -->
  <rect x="220" y="162" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="300" y="184" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i++ ; i &lt; n ? 回上</text>
  <path d="M 220 179 Q 130 179 130 123 Q 130 67 220 67" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="300" y1="196" x2="300" y2="218" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="316" y="212" font-size="10" fill="#666" filter="url(#rough2)">Pass 1 结束</text>

  <!-- Pass 2 区块标题 -->
  <rect x="40" y="216" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="12" filter="url(#rough2)"/>
  <text x="100" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">Pass 2：取第 k 个</text>

  <!-- Pass 2 起始 -->
  <rect x="220" y="226" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="300" y="248" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cnt = 0 , i = 0</text>
  <line x1="300" y1="260" x2="300" y2="280" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Pass 2 取字符 -->
  <rect x="220" y="282" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="304" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">s = arr[i]</text>
  <line x1="300" y1="316" x2="300" y2="334" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 1: freq[s]==1? -->
  <polygon points="300,336 400,372 300,408 200,372" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="370" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">freq[s] == 1 ?</text>
  <text x="300" y="386" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">(出现一次?)</text>

  <!-- 否 → 跳过 -->
  <line x1="400" y1="372" x2="470" y2="372" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="435" y="366" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="470" y="356" width="80" height="34" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="510" y="378" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">跳过，i++</text>

  <!-- 是 → cnt++ -->
  <line x1="300" y1="408" x2="300" y2="428" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="316" y="422" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="220" y="430" width="160" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="450" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cnt += 1</text>

  <!-- 判定 2: cnt==k? -->
  <line x1="300" y1="460" x2="300" y2="478" stroke="#446688" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="200" y="462" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="482" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cnt == k ? 返回 s : 否则 i++ 续扫</text>

  <!-- 终点：未命中返回空 -->
  <rect x="430" y="460" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="490" y="480" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">扫完仍无 → ""</text>
</svg>
