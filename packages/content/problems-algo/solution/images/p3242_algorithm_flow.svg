<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：建索引一次，查询 O(1)</text>

  <!-- ① 初始化 -->
  <rect x="30" y="48" width="190" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="125" y="67" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 构造：扫一遍 grid</text>
  <text x="125" y="83" text-anchor="middle" font-size="10" fill="#556" filter="url(#rough2)">O(n²)，仅执行一次</text>

  <path d="M 222 70 L 262 70" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="264" y="48" width="226" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="377" y="67" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">pos[grid[i][j]] = (i, j)</text>
  <text x="377" y="83" text-anchor="middle" font-size="10" fill="#556" filter="url(#rough2)">值域恰为 0..n²-1 的排列 → 直填下标</text>

  <!-- ② 查询 -->
  <text x="260" y="112" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">② 查询阶段：两种方法共用一套循环</text>

  <rect x="30" y="118" width="150" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="105" y="139" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">adjacentSum / diagonalSum</text>
  <text x="105" y="155" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">(value)，kind = 0 / 1</text>

  <path d="M 182 144 L 212 144" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="214" y="118" width="104" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="266" y="140" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">pos[value]</text>
  <text x="266" y="156" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">→ (i, j)</text>

  <path d="M 320 144 L 340 144" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="342" y="118" width="148" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="416" y="140" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">取 4 个方向偏移</text>
  <text x="416" y="156" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">d = kind*4 … kind*4+3</text>

  <path d="M 416 170 L 416 198" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <path d="M 416 198 L 486 234 L 416 270 L 346 234 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="416" y="230" text-anchor="middle" font-size="10.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">邻居 (x,y)</text>
  <text x="416" y="244" text-anchor="middle" font-size="10.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">在界内？</text>

  <path d="M 416 270 L 416 288" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="428" y="284" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="356" y="290" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="416" y="314" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">s += grid[x][y]</text>

  <path d="M 346 234 L 320 234" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="333" y="226" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="178" y="214" width="140" height="40" fill="#f5f5f5" stroke="#999" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="248" y="232" text-anchor="middle" font-size="10.5" fill="#777" font-weight="bold" filter="url(#rough2)">跳过该方向</text>
  <text x="248" y="246" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（越界）</text>

  <path d="M 248 214 L 248 192 L 380 192 L 380 173" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="312" y="187" font-size="9.5" fill="#777" filter="url(#rough2)">下一方向 d</text>

  <path d="M 476 310 L 506 310 L 506 144 L 491 144" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="500" y="240" font-size="9.5" fill="#777" text-anchor="middle" transform="rotate(-90 500 240)" filter="url(#rough2)">下一方向 d</text>

  <path d="M 354 310 L 302 310" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="320" y="300" font-size="9.5" fill="#777" filter="url(#rough2)">4 个方向做完</text>

  <rect x="152" y="290" width="150" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="227" y="314" text-anchor="middle" font-size="11.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">return s</text>

  <text x="85" y="300" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">单次查询 O(1)</text>
  <text x="85" y="316" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">查表 + 固定 4 次判断</text>
</svg>
