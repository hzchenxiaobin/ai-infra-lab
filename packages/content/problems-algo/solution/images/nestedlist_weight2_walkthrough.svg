<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    示例：[1,[4,[6]]] 一遍 BFS → 17
  </text>
  <text x="280" y="48" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">
    D=3，反向权重：1→3, 4→2, 6→1
  </text>

  <!-- Column headers -->
  <rect x="40" y="68" width="110" height="28" fill="#fafafa" stroke="none"/>
  <text x="95" y="86" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">阶段</text>

  <rect x="160" y="68" width="110" height="28" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="215" y="86" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">第 1 层 d=1</text>

  <rect x="280" y="68" width="110" height="28" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="335" y="86" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">第 2 层 d=2</text>

  <rect x="400" y="68" width="110" height="28" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="455" y="86" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">第 3 层 d=3</text>

  <!-- Row: queue 内容 -->
  <text x="95" y="120" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">queue</text>
  <rect x="160" y="106" width="110" height="30" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="215" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1, [4,[6]]</text>
  <rect x="280" y="106" width="110" height="30" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="335" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4, [6]</text>
  <rect x="400" y="106" width="110" height="30" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="455" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>

  <!-- Row: 本层处理 -->
  <text x="95" y="160" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">本层整数</text>
  <rect x="160" y="146" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="215" y="166" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">+1</text>
  <rect x="280" y="146" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="335" y="166" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">+4</text>
  <rect x="400" y="146" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="455" y="166" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">+6</text>

  <!-- Row: level_sum（累计不重置） -->
  <text x="95" y="200" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">level_sum</text>
  <text x="95" y="214" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">(不重置)</text>
  <rect x="160" y="186" width="110" height="34" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="215" y="208" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="280" y="186" width="110" height="34" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="335" y="208" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1 + 4 = 5</text>
  <rect x="400" y="186" width="110" height="34" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="455" y="208" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">5 + 6 = 11</text>

  <!-- Arrow down -->
  <line x1="215" y1="222" x2="215" y2="244" stroke="#446688" stroke-width="1.4"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="335" y1="222" x2="335" y2="244" stroke="#446688" stroke-width="1.4"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="455" y1="222" x2="455" y2="244" stroke="#446688" stroke-width="1.4"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row: total += level_sum -->
  <text x="95" y="262" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">total</text>
  <text x="95" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">+=level_sum</text>
  <rect x="160" y="248" width="110" height="34" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="215" y="270" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0 + 1 = 1</text>
  <rect x="280" y="248" width="110" height="34" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="335" y="270" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1 + 5 = 6</text>
  <rect x="400" y="248" width="110" height="34" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="455" y="270" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6 + 11 = 17</text>

  <!-- Divider -->
  <line x1="40" y1="300" x2="520" y2="300" stroke="#888" stroke-width="1"
        stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- Verification: each value added (D-d+1) times -->
  <text x="280" y="324" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">
    验证：每个整数被加 (D − d + 1) 次
  </text>

  <rect x="50" y="340" width="150" height="40" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="125" y="358" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    1（d=1）被加 3 次
  </text>
  <text x="125" y="374" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">
    = 1 × 3 = 3
  </text>

  <rect x="210" y="340" width="150" height="40" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="285" y="358" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    4（d=2）被加 2 次
  </text>
  <text x="285" y="374" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">
    = 4 × 2 = 8
  </text>

  <rect x="370" y="340" width="150" height="40" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="445" y="358" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    6（d=3）被加 1 次
  </text>
  <text x="445" y="374" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">
    = 6 × 1 = 6
  </text>

  <!-- Final sum -->
  <text x="280" y="410" text-anchor="middle" font-size="17" fill="#b85450" filter="url(#rough2)">
    3 + 8 + 6 = 17 ✓
  </text>
  <text x="280" y="428" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">
    level_sum 不重置 → 每层 total += level_sum 自然实现反向加权
  </text>
</svg>
