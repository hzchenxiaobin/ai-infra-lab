<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：melt 四步把宽表拉成长表</text>

  <!-- Step 1 -->
  <rect x="80" y="52" width="400" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="104" cy="80" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="292" y="76" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">指定 id_vars='product'</text>
  <text x="292" y="94" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">标识列不参与融化，其值复制进每个块</text>

  <path d="M 280 108 L 280 122" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="80" y="124" width="400" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="104" cy="152" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="292" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">剩余列默认全部作为 value_vars</text>
  <text x="292" y="166" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">即 quarter_1 ~ quarter_4（不必显式列出）</text>

  <path d="M 280 180 L 280 194" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="80" y="196" width="400" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="104" cy="224" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">3</text>
  <text x="292" y="220" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">逐列拉直成一块</text>
  <text x="292" y="238" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">列名写入 quarter（var_name），数值写入 sales（value_name）</text>

  <path d="M 280 252 L 280 266" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="80" y="268" width="400" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="104" cy="296" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">4</text>
  <text x="292" y="292" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">按列序纵向拼接（列优先堆叠）</text>
  <text x="292" y="310" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">返回新 DataFrame，原表不动</text>

  <!-- Bottom tip -->
  <rect x="60" y="344" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">💡 行数 = n × k（k = 值列数）；若要 product 优先的行序，melt 后自行 sort_values</text>
  <text x="280" y="380" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">本题期望输出恰是默认列优先顺序——一行排序代码都不用写</text>
</svg>
