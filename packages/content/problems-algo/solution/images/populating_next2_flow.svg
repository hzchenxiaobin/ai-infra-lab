<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">O(1) 空间算法流程：dummy 哨兵逐层建链</text>

  <!-- 1. 开始 -->
  <rect x="150" y="44" width="180" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="240" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">开始：levelStart = root</text>

  <!-- 箭头 1→2 -->
  <line x1="240" y1="76" x2="240" y2="96" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. 外层判断 -->
  <polygon points="240,100 340,140 240,180 140,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="136" text-anchor="middle" font-size="11" fill="#333">levelStart</text>
  <text x="240" y="150" text-anchor="middle" font-size="11" fill="#333">≠ null ?</text>

  <!-- No 分支 → return root -->
  <path d="M 340 140 L 420 140" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="134" text-anchor="middle" font-size="10" fill="#888">否</text>
  <rect x="420" y="124" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="475" y="144" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return root</text>

  <!-- Yes 分支 ↓ -->
  <line x1="240" y1="180" x2="240" y2="200" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="194" font-size="10" fill="#888">是</text>

  <!-- 3. 初始化 dummy/tail/cur -->
  <rect x="120" y="204" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="240" y="224" text-anchor="middle" font-size="11" fill="#333">dummy = Node(0); tail = dummy</text>
  <text x="240" y="240" text-anchor="middle" font-size="11" fill="#333">cur = levelStart</text>

  <!-- 箭头 3→4 -->
  <line x1="240" y1="248" x2="240" y2="268" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. 内层判断 cur != null -->
  <polygon points="240,272 340,312 240,352 140,312" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="308" text-anchor="middle" font-size="11" fill="#333">cur</text>
  <text x="240" y="322" text-anchor="middle" font-size="11" fill="#333">≠ null ?</text>

  <!-- No 分支 → levelStart = dummy.next → 回到外层 -->
  <path d="M 340 312 L 420 312" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="306" text-anchor="middle" font-size="10" fill="#888">否</text>
  <rect x="420" y="296" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="480" y="318" text-anchor="middle" font-size="10" fill="#333">levelStart =</text>
  <text x="480" y="332" text-anchor="middle" font-size="10" fill="#333">dummy.next</text>
  <!-- 回到外层判断的折线 -->
  <path d="M 480 296 L 480 90 L 340 90 L 340 120" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4,3" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="410" y="84" font-size="9" fill="#4a7a3a">回到外层</text>

  <!-- Yes 分支 ↓ -->
  <line x1="240" y1="352" x2="240" y2="372" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="366" font-size="10" fill="#888">是</text>

  <!-- 5. 判断 cur.left -->
  <polygon points="240,376 330,408 240,440 150,408" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="412" text-anchor="middle" font-size="11" fill="#333">cur.left ?</text>

  <!-- Yes → 接左孩子 -->
  <path d="M 330 408 L 380 408" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="402" text-anchor="middle" font-size="10" fill="#888">是</text>
  <rect x="380" y="390" width="150" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="455" y="412" text-anchor="middle" font-size="10" fill="#333">tail.next = cur.left</text>
  <text x="455" y="426" text-anchor="middle" font-size="9" fill="#666">tail = tail.next</text>

  <!-- 6. 判断 cur.right -->
  <line x1="240" y1="440" x2="240" y2="458" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="240,462 330,494 240,526 150,494" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="498" text-anchor="middle" font-size="11" fill="#333">cur.right ?</text>

  <!-- Yes → 接右孩子 -->
  <path d="M 330 494 L 380 494" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="488" text-anchor="middle" font-size="10" fill="#888">是</text>
  <rect x="380" y="476" width="150" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="455" y="498" text-anchor="middle" font-size="10" fill="#333">tail.next = cur.right</text>
  <text x="455" y="512" text-anchor="middle" font-size="9" fill="#666">tail = tail.next</text>

  <!-- 7. cur = cur.next → 回到内层判断 -->
  <line x1="240" y1="526" x2="240" y2="540" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 240 540 L 60 540 L 60 312 L 140 312" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4,3" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <rect x="80" y="528" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="140" y="544" text-anchor="middle" font-size="10" fill="#333">cur = cur.next</text>
  <text x="96" y="304" font-size="9" fill="#4a7a3a">回到内层</text>
</svg>
