<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：任何单调路径跨越的行列集合恒定 → 代价唯一</text>

  <text x="280" y="60" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例 1：startPos=[1,0]，homePos=[2,3]，rowCosts=[5,4,3]，colCosts=[8,2,6,7]</text>

  <text x="40" y="92" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">列代价 colCosts →</text>

  <rect x="134" y="78" width="46" height="24" fill="#fafafa" stroke="#aaa" stroke-width="1.4" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="157" y="95" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">8</text>
  <rect x="188" y="78" width="46" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="211" y="95" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="242" y="78" width="46" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="265" y="95" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="296" y="78" width="46" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="319" y="95" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7</text>

  <text x="40" y="135" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">行</text>
  <text x="40" y="151" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">代</text>
  <text x="40" y="167" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">价</text>
  <text x="40" y="183" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">↓</text>

  <rect x="76" y="121" width="46" height="24" fill="#fafafa" stroke="#aaa" stroke-width="1.4" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="99" y="138" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">5</text>
  <rect x="76" y="167" width="46" height="24" fill="#fafafa" stroke="#aaa" stroke-width="1.4" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="99" y="184" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4</text>
  <rect x="76" y="213" width="46" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="99" y="230" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="130" y="110" width="216" height="46" fill="none" stroke="#bbb" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <rect x="130" y="156" width="216" height="46" fill="none" stroke="#bbb" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <rect x="130" y="202" width="216" height="46" fill="none" stroke="#bbb" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <line x1="184" y1="110" x2="184" y2="248" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="238" y1="110" x2="238" y2="248" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="292" y1="110" x2="292" y2="248" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <rect x="130" y="156" width="54" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="157" y="178" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">起</text>
  <text x="157" y="192" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">(1,0)</text>

  <rect x="292" y="202" width="54" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="319" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">家</text>
  <text x="319" y="238" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">(2,3)</text>

  <path d="M 157 202 L 157 218" stroke="#4a7a3a" stroke-width="2.4" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <path d="M 168 225 L 308 225" stroke="#4a7a3a" stroke-width="2.4" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>

  <path d="M 168 179 L 308 179" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <path d="M 319 190 L 319 206" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>

  <text x="172" y="217" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">下</text>
  <text x="240" y="221" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">右→右→右</text>
  <text x="240" y="175" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">右→右→右</text>
  <text x="328" y="200" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">下</text>

  <text x="375" y="142" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">路径 A（绿）</text>
  <text x="375" y="158" font-size="10" fill="#444" filter="url(#rough2)">先下后右</text>
  <text x="375" y="174" font-size="10" fill="#444" filter="url(#rough2)">跨行 {2}</text>
  <text x="375" y="189" font-size="10" fill="#444" filter="url(#rough2)">跨列 {1,2,3}</text>
  <text x="375" y="205" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">路径 B（橙）</text>
  <text x="375" y="221" font-size="10" fill="#444" filter="url(#rough2)">先右后下</text>
  <text x="375" y="237" font-size="10" fill="#444" filter="url(#rough2)">跨行 {2}</text>
  <text x="375" y="252" font-size="10" fill="#444" filter="url(#rough2)">跨列 {1,2,3}</text>

  <rect x="375" y="262" width="150" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="450" y="276" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">两路径代价均 = 18</text>

  <text x="40" y="290" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">代价公式（行/列代价 ≥ 0，绕路只增不减）：</text>

  <rect x="40" y="298" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">代价 = Σ rowCosts[r] + Σ colCosts[c]</text>
  <text x="280" y="336" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">r ∈ [min(startrow,homerow), max(...)]，r ≠ startrow</text>
  <text x="280" y="350" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">c ∈ [min(startcol,homecol), max(...)]，c ≠ startcol</text>

  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">起点行/列不计费（那是「离开」而非「进入」）；终点行/列计费</text>
  <text x="280" y="398" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">虚线框 = 不计入的起点行/列；绿框 = 计入的跨越行/列</text>
</svg>
