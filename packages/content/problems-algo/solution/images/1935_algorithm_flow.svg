<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="480" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="240" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建集合 → 切分 → 逐单词判定</text>

  <!-- 开始 -->
  <rect x="205" y="44" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="240" y="63" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <path d="M 240 72 L 240 88" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- broken = set(brokenLetters) -->
  <rect x="140" y="88" width="200" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="107" text-anchor="middle" font-size="12" fill="#333">broken = set(brokenLetters)</text>

  <path d="M 240 116 L 240 132" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- words = split(text); ans = 0 -->
  <rect x="115" y="132" width="250" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="151" text-anchor="middle" font-size="12" fill="#333">words = text.split(" "); ans = 0</text>

  <path d="M 240 160 L 240 176" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- for word in words -->
  <rect x="165" y="176" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="195" text-anchor="middle" font-size="12" fill="#333">for word in words</text>

  <path d="M 240 204 L 240 222" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Diamond: word 含破损字符? -->
  <path d="M 240 222 L 345 254 L 240 286 L 135 254 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="250" text-anchor="middle" font-size="11.5" fill="#333">word 含</text>
  <text x="240" y="266" text-anchor="middle" font-size="11.5" fill="#333">破损字符?</text>

  <!-- 是 (right) -> 跳过 -->
  <path d="M 345 254 L 373 254" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="359" y="247" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="373" y="240" width="82" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="414" y="259" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">跳过</text>

  <!-- 否 (down) -> ans += 1 -->
  <path d="M 240 286 L 240 300" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="254" y="296" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="190" y="300" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="319" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans += 1</text>

  <path d="M 240 328 L 240 344" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 继续下一单词 -->
  <rect x="155" y="344" width="170" height="28" fill="#f5f5f5" stroke="#aaa" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="240" y="363" text-anchor="middle" font-size="11.5" fill="#666">继续下一单词</text>

  <!-- Loop-back dashed from 继续下一单词 up to for-word -->
  <path d="M 155 358 Q 95 358 95 190 L 165 190" stroke="#aaa" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="78" y="275" font-size="10.5" fill="#888" transform="rotate(-90 78 275)">循环至遍历完毕</text>

  <path d="M 240 372 L 240 388" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 返回 ans -->
  <rect x="190" y="388" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="240" y="407" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 ans</text>
</svg>
