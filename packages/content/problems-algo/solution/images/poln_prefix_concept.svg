<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">前缀乘积：把「区间乘」变成「两次点乘相除」</text>

  <text x="40" y="68" font-size="12" fill="#4a7a3a" filter="url(#rough2)">数据流 a：</text>
  <rect x="120" y="48" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="170" y="48" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="220" y="48" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="270" y="48" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <text x="328" y="68" font-size="11" fill="#888" filter="url(#rough2)">…</text>

  <text x="40" y="112" font-size="12" fill="#446688" filter="url(#rough2)">前缀乘 pp：</text>
  <rect x="120" y="92" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="112" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="170" y="92" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="220" y="92" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <rect x="270" y="92" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">40</text>
  <rect x="320" y="92" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="344" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">320</text>
  <text x="378" y="112" font-size="11" fill="#888" filter="url(#rough2)">…</text>

  <text x="144" y="136" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">pp[0]</text>
  <text x="194" y="136" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">pp[1]</text>
  <text x="244" y="136" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">pp[2]</text>
  <text x="294" y="136" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">pp[3]</text>
  <text x="344" y="136" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">pp[4]</text>

  <rect x="100" y="158" width="380" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">getProduct(k) = pp[n] ÷ pp[n−k]</text>
  <text x="290" y="198" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">最后 k 个的乘积 = 总乘积 ÷ 前面那段的乘积</text>

  <path d="M344,124 Q420,150 410,158" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="430" y="148" font-size="10" fill="#b85450" filter="url(#rough2)">pp[n]</text>

  <path d="M244,124 Q200,150 210,158" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="148" font-size="10" fill="#4a7a3a" filter="url(#rough2)">pp[n−k]</text>

  <text x="280" y="240" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">零是「乘积杀手」：遇到 0 就重置</text>

  <rect x="40" y="260" width="240" height="140" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="282" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">add(0) 之前</text>
  <rect x="60" y="294" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="312" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="104" y="294" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="312" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="148" y="294" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="312" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="200" y="312" font-size="11" fill="#888" filter="url(#rough2)">…</text>
  <text x="160" y="344" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">pp 长度 = n+1</text>
  <text x="160" y="362" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">（保留历史乘积）</text>
  <text x="160" y="384" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">任意含 0 的区间 → 乘积为 0</text>

  <path d="M286,330 L316,330" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="301" y="322" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">add(0)</text>

  <rect x="320" y="260" width="240" height="140" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="282" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">add(0) 之后：重置</text>
  <rect x="400" y="294" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="312" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="452" y="312" font-size="11" fill="#888" filter="url(#rough2)">（清空）</text>
  <text x="440" y="344" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">pp = [1]，长度 = 1</text>
  <text x="440" y="362" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">历史乘积全部丢弃</text>
  <text x="440" y="384" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">k ≥ len(pp) ⇒ 必含 0 ⇒ 返回 0</text>

</svg>
