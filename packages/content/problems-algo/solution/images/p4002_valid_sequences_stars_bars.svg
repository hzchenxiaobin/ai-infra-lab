<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：隔板法数总数，正难则反减全奇</text>

  <!-- Panel A: stars and bars -->
  <rect x="22" y="44" width="476" height="112" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="36" y="68" font-size="13" fill="#446688" filter="url(#rough2)">① 总数：和为 n 的 k 个正整数组合 —— 隔板法</text>

  <text x="50" y="107" font-size="15" fill="#446688" filter="url(#rough2)">★</text>
  <rect x="64" y="93" width="4" height="19" fill="#d6a040" filter="url(#rough2)"/>
  <text x="80" y="107" font-size="15" fill="#446688" filter="url(#rough2)">★</text>
  <text x="110" y="107" font-size="15" fill="#446688" filter="url(#rough2)">★</text>
  <rect x="124" y="93" width="4" height="19" fill="#d6a040" filter="url(#rough2)"/>
  <text x="140" y="107" font-size="15" fill="#446688" filter="url(#rough2)">★</text>
  <text x="170" y="107" font-size="15" fill="#446688" filter="url(#rough2)">★</text>
  <path d="M 200 101 L 232 101" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="242" y="107" font-size="14" fill="#333" filter="url(#rough2)">[1, 2, 2]</text>
  <text x="330" y="107" font-size="12" fill="#666" filter="url(#rough2)">（n=5, k=3）</text>

  <text x="36" y="140" font-size="13" fill="#333" filter="url(#rough2)">n−1 个空隙里选 k−1 个插板</text>
  <text x="368" y="141" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">C(n−1, k−1)</text>

  <!-- Panel B: complement all-odd -->
  <rect x="22" y="166" width="476" height="112" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="36" y="190" font-size="13" fill="#4a7a3a" filter="url(#rough2)">② 反面：乘积为奇 ⟺ k 个数全是奇数</text>
  <text x="36" y="216" font-size="13" fill="#333" filter="url(#rough2)">每个奇数写作 2x+1：[1, 1, 3] → x = [0, 0, 1]</text>
  <text x="36" y="242" font-size="13" fill="#333" filter="url(#rough2)">2·(x 的和) + k = n ⟹ x 的和 = (n−k)/2（为奇则无解）</text>
  <text x="36" y="268" font-size="13" fill="#333" filter="url(#rough2)">k 元非负解 ⟹</text>
  <text x="150" y="269" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">C((n+k)/2 − 1, k−1)</text>
  <text x="340" y="268" font-size="12" fill="#666" filter="url(#rough2)">= C(3,2) = 3</text>

  <!-- Final formula -->
  <rect x="22" y="290" width="476" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = C(n−1, k−1) − C((n+k)/2 − 1, k−1)</text>
  <text x="260" y="332" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">（n−k 为奇时第二项为 0；示例：6 − 3 = 3 ✓）</text>
</svg>
