<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">SQL 执行流程：FROM → GROUP BY → SELECT 条件聚合</text>

  <!-- ===== Step 1: FROM ===== -->
  <text x="60" y="52" font-size="10" fill="#888">① FROM</text>
  <g filter="url(#rough2)"><rect x="50" y="58" width="240" height="44" fill="#fff" stroke="#446688" stroke-width="1.5" rx="8"/></g>
  <text x="170" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">FROM Products</text>
  <text x="170" y="94" text-anchor="middle" font-size="9" fill="#888">读取全部「产品-商店-价格」行（长表）</text>

  <!-- Arrow 1 -->
  <path d="M 170 104 L 170 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: GROUP BY product_id ===== -->
  <text x="60" y="128" font-size="10" fill="#888">② GROUP BY</text>
  <g filter="url(#rough2)"><rect x="50" y="134" width="240" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/></g>
  <text x="170" y="156" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">GROUP BY product_id</text>
  <text x="170" y="172" text-anchor="middle" font-size="9" fill="#888">按产品折叠，同一产品多行并成一组</text>
  <text x="170" y="186" text-anchor="middle" font-size="9" fill="#888">示例 5 行 → 2 组（product 0 / product 1）</text>

  <!-- Arrow 2 -->
  <path d="M 170 194 L 170 208" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: SELECT + MAX(IF(...)) ===== -->
  <text x="60" y="218" font-size="10" fill="#888">③ SELECT</text>
  <g filter="url(#rough2)"><rect x="50" y="224" width="240" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/></g>
  <text x="170" y="244" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">SELECT product_id,</text>
  <text x="170" y="260" text-anchor="middle" font-size="10" fill="#4a7a3a">MAX(IF(store='store1',price,NULL))</text>
  <text x="170" y="274" text-anchor="middle" font-size="10" fill="#4a7a3a">MAX(IF(store='store2',price,NULL))</text>
  <text x="170" y="288" text-anchor="middle" font-size="10" fill="#4a7a3a">MAX(IF(store='store3',price,NULL))</text>
  <text x="170" y="304" text-anchor="middle" font-size="9" fill="#888">每组挑出三店价格，缺失即 NULL</text>
  <text x="170" y="318" text-anchor="middle" font-size="9" fill="#888">（无 ORDER BY，顺序无要求）</text>

  <!-- ===== Right side: execution order note ===== -->
  <g filter="url(#rough2)"><rect x="320" y="134" width="220" height="100" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="340" y="156" font-size="11" fill="#b85450" font-weight="bold">⚠️ 子句执行顺序</text>
  <text x="340" y="176" font-size="10" fill="#b85450">FROM → WHERE → GROUP BY</text>
  <text x="340" y="194" font-size="10" fill="#b85450">→ HAVING → SELECT</text>
  <text x="340" y="212" font-size="10" fill="#b85450">→ ORDER BY → LIMIT</text>
  <text x="340" y="228" font-size="9" fill="#888">GROUP BY 早于 SELECT，聚合后求值</text>

  <!-- ===== Right side: why store can be in SELECT note ===== -->
  <g filter="url(#rough2)"><rect x="320" y="250" width="220" height="92" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="340" y="272" font-size="11" fill="#2e6e2e" font-weight="bold">💡 为何 SELECT 能含 store？</text>
  <text x="340" y="290" font-size="10" fill="#2e6e2e">store 在 MAX(...) 内部</text>
  <text x="340" y="306" font-size="10" fill="#2e6e2e">已被聚合，无需入 GROUP BY</text>
  <text x="340" y="324" font-size="9" fill="#888">裸非聚合列才必须入 GROUP BY</text>

  <!-- ===== Bottom note ===== -->
  <g filter="url(#rough2)"><rect x="50" y="340" width="240" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/></g>
  <text x="170" y="360" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">IF=MySQL 方言；CASE WHEN 跨库通用</text>
  <text x="170" y="376" text-anchor="middle" font-size="9" fill="#888">生产环境优先 CASE WHEN THEN price END</text>
</svg>
