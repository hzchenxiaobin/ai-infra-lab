<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M0,0 L9,0 L4.5,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="520" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">寻找右区间算法流程（排序起点 + 二分下界）</text>

  <!-- Step 1: build (start, idx) pairs -->
  <rect x="170" y="44" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">构造 (start_j, j) 列表</text>
  <path d="M 270 80 L 270 98" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: sort by start -->
  <rect x="150" y="102" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="124" text-anchor="middle" font-size="12" fill="#333">按 start 升序排序 → starts[n]</text>
  <path d="M 270 138 L 270 156" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: hash map start->idx -->
  <rect x="120" y="160" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="182" text-anchor="middle" font-size="12" fill="#333">建立哈希 startToIdx：start 值 → 原始下标</text>
  <path d="M 270 196 L 270 214" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- loop: for each interval i -->
  <polygon points="270,218 380,260 270,302 160,260" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="256" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i &lt; n ?</text>
  <text x="270" y="272" text-anchor="middle" font-size="10.5" fill="#888">遍历每个区间</text>
  <!-- no -> done -->
  <path d="M 380 260 L 470 260" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="420" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="408" y="272" width="116" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="466" y="290" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return ans</text>
  <text x="466" y="306" text-anchor="middle" font-size="10" fill="#888">长度 n</text>
  <!-- yes -> down -->
  <path d="M 270 302 L 270 320" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="282" y="316" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- binary search: lower_bound(end_i) -->
  <rect x="110" y="324" width="320" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="346" text-anchor="middle" font-size="12" fill="#333">在 starts 中二分找首个 start ≥ end_i</text>
  <path d="M 270 360 L 270 378" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- decision: found? -->
  <polygon points="270,382 380,424 270,466 160,424" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="420" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">找到 pos &lt; n ?</text>
  <text x="270" y="436" text-anchor="middle" font-size="10.5" fill="#888">即是否存在 start ≥ end_i</text>

  <!-- yes (left) -> map back -->
  <path d="M 160 424 L 110 424 L 110 466" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="132" y="416" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="36" y="470" width="148" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="110" y="492" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">ans[i] = startToIdx[starts[pos]]</text>

  <!-- no (right) -> -1 -->
  <path d="M 380 424 L 440 424 L 440 466" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="418" y="416" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="366" y="470" width="148" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="440" y="492" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans[i] = -1</text>

  <!-- loop back -->
  <path d="M 110 504 L 110 514 L 270 514 L 270 218" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 440 504 L 440 514 L 270 514" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="200" y="510" font-size="10" fill="#888">下一个 i</text>
</svg>
