<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">BST 中序遍历 → 有序数组 → 二分定位邻居</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">mini = ≤q 的最大值（floor），maxi = ≥q 的最小值（ceiling）</text>

  <!-- ===== Left: BST ===== -->
  <rect x="18" y="58" width="260" height="324" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="148" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">二叉搜索树</text>

  <g font-size="12" fill="#446688" filter="url(#rough2)">
    <!-- edges first (under nodes) -->
    <path d="M 132 116 L 96 168" stroke="#446688" stroke-width="1.4" fill="none"/>
    <path d="M 156 116 L 196 168" stroke="#446688" stroke-width="1.4" fill="none"/>
    <path d="M 80 188 L 58 232" stroke="#446688" stroke-width="1.4" fill="none"/>
    <path d="M 104 188 L 124 232" stroke="#446688" stroke-width="1.4" fill="none"/>
    <path d="M 184 188 L 164 232" stroke="#446688" stroke-width="1.4" fill="none"/>
    <path d="M 212 188 L 250 232" stroke="#446688" stroke-width="1.4" fill="none"/>
    <path d="M 244 248 L 222 296" stroke="#446688" stroke-width="1.4" fill="none"/>

    <!-- nodes -->
    <circle cx="144" cy="100" r="17" fill="#fff" stroke="#446688" stroke-width="1.8"/>
    <text x="144" y="105" text-anchor="middle" font-weight="bold">6</text>
    <circle cx="88" cy="172" r="16" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="88" y="177" text-anchor="middle" font-weight="bold">2</text>
    <circle cx="200" cy="172" r="16" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="200" y="177" text-anchor="middle" font-weight="bold">13</text>
    <circle cx="56" cy="244" r="14" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="56" y="249" text-anchor="middle" font-size="11" font-weight="bold">1</text>
    <circle cx="120" cy="244" r="14" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="120" y="249" text-anchor="middle" font-size="11" font-weight="bold">4</text>
    <circle cx="168" cy="244" r="14" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="168" y="249" text-anchor="middle" font-size="11" font-weight="bold">9</text>
    <circle cx="256" cy="244" r="14" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="256" y="249" text-anchor="middle" font-size="11" font-weight="bold">15</text>
    <circle cx="214" cy="308" r="13" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="214" y="313" text-anchor="middle" font-size="11" font-weight="bold">14</text>
  </g>

  <!-- inorder label -->
  <text x="148" y="350" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">中序：1 → 2 → 4 → 6 → 9 → 14 → 15</text>

  <!-- arrow to sorted array -->
  <path d="M 268 150 L 300 150" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="142" text-anchor="middle" font-size="10" fill="#666">中序</text>

  <!-- ===== Right: sorted array ===== -->
  <rect x="296" y="64" width="248" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="420" y="84" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">有序数组 a（一次中序即得）</text>

  <g font-size="12" filter="url(#rough2)">
    <!-- 7 cells: 1,2,4,6,9,14,15 -->
    <rect x="308" y="100" width="30" height="30" fill="#fff" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="323" y="120" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="340" y="100" width="30" height="30" fill="#fff" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="355" y="120" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="372" y="100" width="30" height="30" fill="#fff" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="387" y="120" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <rect x="404" y="100" width="30" height="30" fill="#fff" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="419" y="120" text-anchor="middle" fill="#4a7a3a" font-weight="bold">6</text>
    <rect x="436" y="100" width="30" height="30" fill="#fff" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="451" y="120" text-anchor="middle" fill="#4a7a3a" font-weight="bold">9</text>
    <rect x="468" y="100" width="30" height="30" fill="#fff" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="483" y="120" text-anchor="middle" fill="#4a7a3a" font-weight="bold">14</text>
    <rect x="500" y="100" width="30" height="30" fill="#fff" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="515" y="120" text-anchor="middle" fill="#4a7a3a" font-weight="bold">15</text>

    <!-- index labels -->
    <text x="323" y="148" text-anchor="middle" font-size="8" fill="#888">0</text>
    <text x="355" y="148" text-anchor="middle" font-size="8" fill="#888">1</text>
    <text x="387" y="148" text-anchor="middle" font-size="8" fill="#888">2</text>
    <text x="419" y="148" text-anchor="middle" font-size="8" fill="#888">3</text>
    <text x="451" y="148" text-anchor="middle" font-size="8" fill="#888">4</text>
    <text x="483" y="148" text-anchor="middle" font-size="8" fill="#888">5</text>
    <text x="515" y="148" text-anchor="middle" font-size="8" fill="#888">6</text>
  </g>

  <!-- ===== Bottom: query 5 neighbors ===== -->
  <rect x="296" y="176" width="248" height="206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="420" y="196" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">查询 q = 5：在 a 中二分找邻居</text>

  <!-- query box -->
  <rect x="320" y="208" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="360" y="228" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">q = 5</text>

  <!-- mini arrow: floor = a[2] = 4 -->
  <path d="M 360 242 L 360 262 L 387 262 L 387 132" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="266" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">mini</text>
  <text x="372" y="258" text-anchor="middle" font-size="9" fill="#4a7a3a">floor ≤5 = a[2]</text>

  <!-- maxi arrow: ceiling = a[3] = 6 -->
  <path d="M 360 242 L 360 296 L 419 296 L 419 132" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="300" y="300" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">maxi</text>
  <text x="404" y="312" text-anchor="middle" font-size="9" fill="#446688">ceil ≥5 = a[3]</text>

  <!-- answer -->
  <rect x="318" y="328" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="378" y="350" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">answer = [4, 6]</text>

  <text x="470" y="350" text-anchor="middle" font-size="9" fill="#888">lower_bound ≥ q → maxi</text>
  <text x="470" y="364" text-anchor="middle" font-size="9" fill="#888">upper_bound−1 → mini</text>
</svg>
