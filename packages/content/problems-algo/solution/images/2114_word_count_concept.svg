<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：单词数 = 空格数 + 1</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">单空格分隔 + 无首尾空格 ⇒ 每个空格都是分隔符</text>

  <!-- ===== Sentence visualization ===== -->
  <text x="260" y="72" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">句子：alice and bob love leetcode</text>

  <!-- Word boxes -->
  <rect x="40" y="84" width="58" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="69" y="106" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">alice</text>

  <rect x="116" y="84" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="139" y="106" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">and</text>

  <rect x="180" y="84" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="106" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">bob</text>

  <rect x="242" y="84" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="269" y="106" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">love</text>

  <rect x="314" y="84" width="86" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="357" y="106" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">leetcode</text>

  <!-- Space markers (orange) between words -->
  <rect x="100" y="86" width="14" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="107" y="106" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">␣</text>

  <rect x="164" y="86" width="14" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="171" y="106" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">␣</text>

  <rect x="226" y="86" width="14" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="233" y="106" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">␣</text>

  <rect x="298" y="86" width="14" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="305" y="106" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">␣</text>

  <!-- Counts row -->
  <text x="260" y="140" text-anchor="middle" font-size="11" fill="#888">↑ 蓝色 = 单词 (5 个) · 橙色 = 空格 (4 个)</text>

  <!-- ===== Formula box ===== -->
  <rect x="60" y="160" width="400" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="182" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">单词数 = 空格数 + 1</text>
  <text x="260" y="202" text-anchor="middle" font-size="11" fill="#555">5 = 4 + 1 ✓</text>

  <!-- ===== Why +1 explanation ===== -->
  <rect x="40" y="232" width="440" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">为什么是 +1？</text>
  <text x="260" y="270" text-anchor="middle" font-size="10.5" fill="#555">n 个单词排成一行，相邻单词间需 n−1 个分隔空格</text>
  <text x="260" y="286" text-anchor="middle" font-size="10.5" fill="#555">⇒ 空格数 = 单词数 − 1 ⇒ 单词数 = 空格数 + 1</text>

  <!-- Footer -->
  <text x="260" y="324" text-anchor="middle" font-size="10.5" fill="#888">边界：单词句（无空格）→ 0 + 1 = 1，自然兼容</text>
  <text x="260" y="340" text-anchor="middle" font-size="10" fill="#aaa">依赖：单空格分隔 + 无首尾空格（题目保证）</text>
</svg>
