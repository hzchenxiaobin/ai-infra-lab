<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：产品 123424 的四年同比增长率</text>

  <rect x="45" y="56" width="430" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">year</text>
  <text x="150" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">curr_year_spend</text>
  <text x="240" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">prev_year_spend</text>
  <text x="330" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">yoy_rate</text>
  <text x="425" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">备注</text>

  <rect x="45" y="84" width="430" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="108" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2019</text>
  <text x="150" y="108" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1500.60</text>
  <text x="240" y="108" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">NULL</text>
  <text x="330" y="108" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">NULL</text>
  <text x="425" y="108" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">首年：无上一年</text>

  <rect x="45" y="124" width="430" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2020</text>
  <text x="150" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1000.20</text>
  <text x="240" y="148" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1500.60</text>
  <text x="330" y="148" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">−33.35</text>
  <text x="425" y="148" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">负增长</text>

  <rect x="45" y="164" width="430" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2021</text>
  <text x="150" y="188" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1246.44</text>
  <text x="240" y="188" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1000.20</text>
  <text x="330" y="188" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">24.62</text>
  <text x="425" y="188" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">回升</text>

  <rect x="45" y="204" width="430" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="228" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2022</text>
  <text x="150" y="228" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2145.32</text>
  <text x="240" y="228" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1246.44</text>
  <text x="330" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">72.12</text>
  <text x="425" y="228" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">高增长</text>

  <path d="M 105 56 L 105 244" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 195 56 L 195 244" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 285 56 L 285 244" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 375 56 L 375 244" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <path d="M 208 138 Q 172 124 158 114" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <path d="M 208 178 Q 172 164 158 154" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <path d="M 208 218 Q 172 204 158 194" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>

  <text x="70" y="264" font-size="10" fill="#4a7a3a" filter="url(#rough2)">绿色虚线：prev_year_spend 取自上一行的 curr_year_spend</text>

  <text x="70" y="288" font-size="12" fill="#333" filter="url(#rough2)">2020：(1000.20 − 1500.60) / 1500.60 × 100 = <tspan fill="#b85450" font-weight="bold">−33.35</tspan></text>
  <text x="70" y="310" font-size="12" fill="#333" filter="url(#rough2)">2021：(1246.44 − 1000.20) / 1000.20 × 100 = <tspan fill="#4a7a3a" font-weight="bold">24.62</tspan></text>
  <text x="70" y="332" font-size="12" fill="#333" filter="url(#rough2)">2022：(2145.32 − 1246.44) / 1246.44 × 100 = <tspan fill="#4a7a3a" font-weight="bold">72.12</tspan></text>

  <rect x="60" y="346" width="400" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="363" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">首年 2019 照常输出一行：prev 与 yoy_rate 均为 NULL（不是删行）</text>

  <text x="260" y="390" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">四个年份恰好连续，year = prev_year + 1 全部成立</text>
</svg>
