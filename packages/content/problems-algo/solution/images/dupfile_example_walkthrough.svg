<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：4 条路径字符串的解析与分组</text>
  <text x="300" y="42" text-anchor="middle" font-size="11" fill="#888">输入→解析→哈希表状态→输出，全程 O(N) 一次遍历</text>

  <!-- table headers -->
  <text x="20" y="68" font-size="10.5" fill="#888" font-weight="bold">步</text>
  <text x="56" y="68" font-size="10.5" fill="#888" font-weight="bold">输入字符串</text>
  <text x="250" y="68" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">解析结果 (content → path)</text>
  <text x="520" y="68" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">动作</text>
  <line x1="10" y1="76" x2="590" y2="76" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: root/a 1.txt(abcd) 2.txt(efgh) -->
  <text x="20" y="96" font-size="10.5" fill="#333">1</text>
  <text x="44" y="96" font-size="10" fill="#446688" font-family="monospace">root/a 1.txt(abcd)</text>
  <text x="44" y="110" font-size="10" fill="#446688" font-family="monospace">       2.txt(efgh)</text>
  <text x="250" y="96" text-anchor="middle" font-size="10" fill="#b85450" font-family="monospace" font-weight="bold">abcd → root/a/1.txt</text>
  <text x="250" y="110" text-anchor="middle" font-size="10" fill="#b85450" font-family="monospace" font-weight="bold">efgh → root/a/2.txt</text>
  <text x="520" y="103" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">新建 2 组</text>

  <line x1="10" y1="120" x2="590" y2="120" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 2: root/c 3.txt(abcd) -->
  <text x="20" y="140" font-size="10.5" fill="#333">2</text>
  <text x="44" y="140" font-size="10" fill="#446688" font-family="monospace">root/c 3.txt(abcd)</text>
  <text x="250" y="140" text-anchor="middle" font-size="10" fill="#b85450" font-family="monospace" font-weight="bold">abcd → root/c/3.txt</text>
  <rect x="470" y="130" width="100" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="520" y="143" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">abcd 组 +1</text>

  <line x1="10" y1="156" x2="590" y2="156" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 3: root/c/d 4.txt(efgh) -->
  <text x="20" y="176" font-size="10.5" fill="#333">3</text>
  <text x="44" y="176" font-size="10" fill="#446688" font-family="monospace">root/c/d 4.txt(efgh)</text>
  <text x="250" y="176" text-anchor="middle" font-size="10" fill="#b85450" font-family="monospace" font-weight="bold">efgh → root/c/d/4.txt</text>
  <rect x="470" y="166" width="100" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="520" y="179" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">efgh 组 +1</text>

  <line x1="10" y1="192" x2="590" y2="192" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 4: root 4.txt(efgh) -->
  <text x="20" y="212" font-size="10.5" fill="#333">4</text>
  <text x="44" y="212" font-size="10" fill="#446688" font-family="monospace">root 4.txt(efgh)</text>
  <text x="250" y="212" text-anchor="middle" font-size="10" fill="#b85450" font-family="monospace" font-weight="bold">efgh → root/4.txt</text>
  <rect x="470" y="202" width="100" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="520" y="215" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">efgh 组 +1</text>

  <line x1="10" y1="228" x2="590" y2="228" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Hash map final state -->
  <text x="20" y="252" font-size="11" fill="#888" font-weight="bold">哈希表最终状态：</text>

  <rect x="40" y="262" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="280" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" font-family="monospace">abcd</text>
  <rect x="146" y="262" width="260" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="280" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">root/a/1.txt, root/c/3.txt</text>
  <rect x="420" y="262" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="280" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">size=2 ✓</text>

  <rect x="40" y="294" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="312" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" font-family="monospace">efgh</text>
  <rect x="146" y="294" width="260" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="312" text-anchor="middle" font-size="9.5" fill="#444" font-family="monospace">root/a/2.txt, root/c/d/4.txt, root/4.txt</text>
  <rect x="420" y="294" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="312" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">size=3 ✓</text>

  <!-- Arrow -->
  <path d="M 300 322 L 300 338" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="334" font-size="10" fill="#888">过滤 size ≥ 2</text>

  <!-- Output -->
  <rect x="40" y="344" width="520" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="364" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" font-family="monospace">[[root/a/2.txt, root/c/d/4.txt, root/4.txt],</text>
  <text x="300" y="380" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" font-family="monospace"> [root/a/1.txt, root/c/3.txt]]</text>

  <!-- footer note -->
  <rect x="40" y="404" width="520" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="424" text-anchor="middle" font-size="11" fill="#444">同一目录下文件名唯一 → 不同目录的同名文件可同内容</text>
  <text x="300" y="442" text-anchor="middle" font-size="11" fill="#888">content 作为哈希键天然去重，只需过滤 size≥2 即得重复组</text>
</svg>
