<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#3a4e7a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="500" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：less[] 左扫增量、greater 右扫即时、单趟合并</text>

  <!-- 步骤 1：外层 j 左扫 -->
  <rect x="40" y="46" width="640" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="68" font-size="12" fill="#3a4e7a" font-weight="bold" filter="url(#rough2)">① 外层 j 从 0 → n−1 左扫（less[k] = #{i&lt;j : nums[i]&lt;nums[k]}）</text>
  <text x="60" y="88" font-size="11.5" fill="#555" filter="url(#rough2)">每处理完 j，把 nums[j] 并入左前缀：∀k&gt;j，若 nums[j]&lt;nums[k] 则 less[k]++</text>

  <path d="M 360 102 L 360 114" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2：内层 k 右扫 -->
  <rect x="40" y="118" width="640" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="140" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">② 内层 k 从 n−1 → j+1 右扫（greater = #{l&gt;k : nums[l]&gt;nums[j]}）</text>
  <text x="60" y="160" font-size="11.5" fill="#555" filter="url(#rough2)">greater 初始 0，每左移一格先把 nums[k] 并入右侧（若 &gt;nums[j] 则 greater++）</text>

  <path d="M 360 174 L 360 186" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="360,192 480,232 360,272 240,232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="228" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold" filter="url(#rough2)">nums[k] vs nums[j]</text>
  <text x="360" y="246" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#rough2)">（排列 → 非 &lt; 即 &gt;）</text>

  <!-- 左分支：合法对 -->
  <text x="226" y="236" text-anchor="end" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">&lt;</text>
  <path d="M 240 232 L 140 232" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="214" width="100" height="38" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="231" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">合法对</text>
  <text x="90" y="246" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">ans +=</text>
  <text x="90" y="258" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">less[k]×greater</text>

  <!-- 右分支：非合法对 -->
  <text x="494" y="236" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">&gt;</text>
  <path d="M 480 232 L 580 232" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="580" y="214" width="100" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="630" y="231" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">非合法对</text>
  <text x="630" y="246" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">greater++</text>
  <text x="630" y="258" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">less[k]++</text>

  <path d="M 360 274 L 360 286" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 合并说明 -->
  <rect x="40" y="292" width="640" height="70" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="314" font-size="12" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">③ 两维护合并进同一趟右扫（每步 O(1)）</text>
  <text x="60" y="336" font-size="11.5" fill="#333" filter="url(#rough2)">使用 less[k] 在 &lt; 分支、更新 less[k] 在 &gt; 分支 → 互斥不自污染</text>
  <text x="60" y="354" font-size="11.5" fill="#333" filter="url(#rough2)">greater 右扫即时、less[] 服务后续 j 的左扫增量 → 同一循环双用</text>

  <!-- 复杂度结算 -->
  <rect x="40" y="374" width="640" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="360" y="396" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold" filter="url(#rough2)">外层 n 趟 × 内层至多 n 步 × 每步 O(1)</text>
  <text x="360" y="416" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">时间 O(n²) ≤ 1.6×10⁷　｜　空间 O(n)（仅 less 数组）</text>

  <!-- 对照暴力 -->
  <rect x="40" y="436" width="640" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="360" y="458" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">对照：四重暴力 O(n⁴) ≈ 2.7×10¹³</text>
  <text x="360" y="478" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">降阶关键：固定中间对 (j,k) 把四下标耦合拆成左右两个一维计数</text>
</svg>
