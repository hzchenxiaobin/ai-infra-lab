<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐行对统计共享列</text>

  <!-- Grid column labels -->
  <text x="176" y="48" text-anchor="middle" font-size="9.5" fill="#aaa">c0</text>
  <text x="208" y="48" text-anchor="middle" font-size="9.5" fill="#aaa">c1</text>
  <text x="240" y="48" text-anchor="middle" font-size="9.5" fill="#aaa">c2</text>
  <text x="272" y="48" text-anchor="middle" font-size="9.5" fill="#aaa">c3</text>
  <text x="304" y="48" text-anchor="middle" font-size="9.5" fill="#aaa">c4</text>

  <!-- Row labels -->
  <text x="152" y="76" text-anchor="end" font-size="9.5" fill="#aaa">r0</text>
  <text x="152" y="108" text-anchor="end" font-size="9.5" fill="#aaa">r1</text>
  <text x="152" y="140" text-anchor="end" font-size="9.5" fill="#aaa">r2</text>
  <text x="152" y="172" text-anchor="end" font-size="9.5" fill="#aaa">r3</text>

  <!-- Row 0: 1 0 0 1 0 -->
  <rect x="160" y="56" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="176" y="76" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="192" y="56" width="32" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="208" y="76" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="224" y="56" width="32" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="240" y="76" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="256" y="56" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="272" y="76" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="288" y="56" width="32" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="304" y="76" text-anchor="middle" font-size="11" fill="#aaa">0</text>

  <!-- Row 1: 0 0 1 0 1 -->
  <rect x="160" y="88" width="32" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="176" y="108" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="192" y="88" width="32" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="208" y="108" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="224" y="88" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="240" y="108" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="256" y="88" width="32" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="272" y="108" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="288" y="88" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="304" y="108" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <!-- Row 2: 0 0 0 1 0 -->
  <rect x="160" y="120" width="32" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="176" y="140" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="192" y="120" width="32" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="208" y="140" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="224" y="120" width="32" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="240" y="140" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="256" y="120" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="272" y="140" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="288" y="120" width="32" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="304" y="140" text-anchor="middle" font-size="11" fill="#aaa">0</text>

  <!-- Row 3: 1 0 1 0 1 -->
  <rect x="160" y="152" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="176" y="172" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="192" y="152" width="32" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="208" y="172" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="224" y="152" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="240" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="256" y="152" width="32" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="272" y="172" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="288" y="152" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="304" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <!-- Table header -->
  <rect x="60" y="200" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="120" y="218" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">行对 (r₁,r₂)</text>
  <rect x="180" y="200" width="130" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="245" y="218" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">共享列（都为 1）</text>
  <rect x="310" y="200" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="345" y="218" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cnt</text>
  <rect x="380" y="200" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="425" y="218" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">C(cnt,2)</text>

  <!-- Data rows -->
  <rect x="60" y="226" width="120" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="120" y="242" text-anchor="middle" font-size="10.5" fill="#555">(0,1)</text>
  <rect x="180" y="226" width="130" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="245" y="242" text-anchor="middle" font-size="10.5" fill="#aaa">{}</text>
  <rect x="310" y="226" width="70" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="345" y="242" text-anchor="middle" font-size="10.5" fill="#555">0</text>
  <rect x="380" y="226" width="90" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="425" y="242" text-anchor="middle" font-size="10.5" fill="#555">0</text>

  <rect x="60" y="250" width="120" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="120" y="266" text-anchor="middle" font-size="10.5" fill="#555">(0,2)</text>
  <rect x="180" y="250" width="130" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="245" y="266" text-anchor="middle" font-size="10.5" fill="#555">{3}</text>
  <rect x="310" y="250" width="70" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="345" y="266" text-anchor="middle" font-size="10.5" fill="#555">1</text>
  <rect x="380" y="250" width="90" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="425" y="266" text-anchor="middle" font-size="10.5" fill="#555">0</text>

  <rect x="60" y="274" width="120" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="120" y="290" text-anchor="middle" font-size="10.5" fill="#555">(0,3)</text>
  <rect x="180" y="274" width="130" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="245" y="290" text-anchor="middle" font-size="10.5" fill="#555">{0}</text>
  <rect x="310" y="274" width="70" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="345" y="290" text-anchor="middle" font-size="10.5" fill="#555">1</text>
  <rect x="380" y="274" width="90" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="425" y="290" text-anchor="middle" font-size="10.5" fill="#555">0</text>

  <rect x="60" y="298" width="120" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="120" y="314" text-anchor="middle" font-size="10.5" fill="#555">(1,2)</text>
  <rect x="180" y="298" width="130" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="245" y="314" text-anchor="middle" font-size="10.5" fill="#aaa">{}</text>
  <rect x="310" y="298" width="70" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="345" y="314" text-anchor="middle" font-size="10.5" fill="#555">0</text>
  <rect x="380" y="298" width="90" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="425" y="314" text-anchor="middle" font-size="10.5" fill="#555">0</text>

  <!-- Highlighted row (1,3) -->
  <rect x="60" y="322" width="120" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <text x="120" y="338" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">(1,3)</text>
  <rect x="180" y="322" width="130" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <text x="245" y="338" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">{2, 4}</text>
  <rect x="310" y="322" width="70" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <text x="345" y="338" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">2</text>
  <rect x="380" y="322" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="425" y="338" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1 ⭐</text>

  <rect x="60" y="346" width="120" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="120" y="362" text-anchor="middle" font-size="10.5" fill="#555">(2,3)</text>
  <rect x="180" y="346" width="130" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="245" y="362" text-anchor="middle" font-size="10.5" fill="#aaa">{}</text>
  <rect x="310" y="346" width="70" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="345" y="362" text-anchor="middle" font-size="10.5" fill="#555">0</text>
  <rect x="380" y="346" width="90" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="425" y="362" text-anchor="middle" font-size="10.5" fill="#555">0</text>

  <!-- Total row -->
  <rect x="60" y="372" width="410" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="391" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">合计</text>
  <text x="425" y="391" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <text x="280" y="418" text-anchor="middle" font-size="11" fill="#d6a040" font-style="italic">仅行对 (1,3) 贡献 1 个角矩形 → 答案 = 1</text>
</svg>
