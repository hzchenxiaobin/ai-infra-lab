<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">* 的语义：匹配「前一个字符」零次或多次</text>

  <text x="40" y="72" font-size="12" fill="#888">模式:</text>
  <rect x="80" y="54" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="75" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="122" y="54" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="75" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">*</text>
  <text x="172" y="75" font-size="11" fill="#888">← * 作用于前一个字符 a</text>

  <text x="40" y="122" font-size="12" fill="#888">能匹配:</text>
  <rect x="80" y="106" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="125" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">""</text>
  <text x="138" y="125" font-size="10" fill="#888">零次</text>
  <rect x="188" y="106" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="213" y="125" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"a"</text>
  <text x="246" y="125" font-size="10" fill="#888">一次</text>
  <rect x="296" y="106" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="321" y="125" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"aa"</text>
  <text x="354" y="125" font-size="10" fill="#888">两次</text>
  <rect x="404" y="106" width="64" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="436" y="125" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"aaa…"</text>
  <text x="476" y="125" font-size="10" fill="#888">多次</text>

  <text x="280" y="174" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">DP 遇到 x* 时的两个分支（取「或」）</text>

  <path d="M 142 88 Q 142 130 155 192" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr1)" filter="url(#rough2)" stroke-dasharray="4,2"/>
  <path d="M 142 88 Q 300 130 405 192" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)" stroke-dasharray="4,2"/>

  <rect x="40" y="194" width="230" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="218" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">分支①：匹配零次（丢弃 x*）</text>
  <text x="155" y="240" text-anchor="middle" font-size="11" fill="#555">pattern 跳过这两个字符</text>
  <text x="155" y="262" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">dp[i][j] |= dp[i][j-2]</text>

  <rect x="290" y="194" width="230" height="84" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="405" y="218" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">分支②：再匹配一次</text>
  <text x="405" y="240" text-anchor="middle" font-size="11" fill="#555">x 与 s[i-1] 相等（或 x = '.'）</text>
  <text x="405" y="262" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">dp[i][j] |= dp[i-1][j]</text>

  <rect x="40" y="296" width="480" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">两分支任一为真即匹配成功</text>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#666">分支②用 dp[i-1][j]：pattern 不动，串前进一步</text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#888">含义：x* 吃掉 s[i-1]，但仍可继续吃后面的字符</text>
</svg>
