<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：n = 3, m = 2 → 答案 3</text>

  <!-- left panel: game simulation -->
  <rect x="30" y="48" width="246" height="250" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="153" y="72" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">对局模拟：(x, y) = (1, 2)</text>
  <path d="M 46 82 L 260 82" stroke="#446688" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <text x="48" y="104" font-size="11.5" fill="#888" filter="url(#rough2)">初始</text>
  <text x="262" y="104" text-anchor="end" font-size="11.5" fill="#888" filter="url(#rough2)">(1, 2)</text>
  <text x="48" y="130" font-size="11.5" fill="#446688" filter="url(#rough2)">第1步：A 摘排2</text>
  <text x="262" y="130" text-anchor="end" font-size="11.5" fill="#555" filter="url(#rough2)">(1, 1)</text>
  <text x="48" y="156" font-size="11.5" fill="#d6a040" filter="url(#rough2)">第2步：B 摘排1</text>
  <text x="262" y="156" text-anchor="end" font-size="11.5" fill="#555" filter="url(#rough2)">(0, 1)</text>
  <text x="48" y="182" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">第3步：A 摘排2</text>
  <text x="262" y="182" text-anchor="end" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">(0, 0)</text>

  <text x="153" y="210" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">两排全空 → Alice 抓住 Bob 获胜 ✓</text>
  <text x="153" y="238" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">总步数 = 1 + 2 = 3（奇数）</text>
  <text x="153" y="262" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">Bob 无论怎么摘，对局都恰好 3 步</text>
  <text x="153" y="284" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">奇偶开局已定 → (1,2) 计入答案</text>

  <!-- right panel: enumerate all pairs -->
  <rect x="294" y="48" width="196" height="250" fill="#ffffff" stroke="#999" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="392" y="72" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold" filter="url(#rough2)">全部 6 对逐一判定</text>
  <path d="M 308 82 L 476 82" stroke="#999" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <text x="316" y="106" font-size="11.5" fill="#999" filter="url(#rough2)">(1,1)</text>
  <text x="468" y="106" text-anchor="end" font-size="11.5" fill="#999" filter="url(#rough2)">x+y=2 ✗</text>
  <text x="316" y="130" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(1,2)</text>
  <text x="468" y="130" text-anchor="end" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x+y=3 ✓</text>
  <text x="316" y="154" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(2,1)</text>
  <text x="468" y="154" text-anchor="end" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x+y=3 ✓</text>
  <text x="316" y="178" font-size="11.5" fill="#999" filter="url(#rough2)">(2,2)</text>
  <text x="468" y="178" text-anchor="end" font-size="11.5" fill="#999" filter="url(#rough2)">x+y=4 ✗</text>
  <text x="316" y="202" font-size="11.5" fill="#999" filter="url(#rough2)">(3,1)</text>
  <text x="468" y="202" text-anchor="end" font-size="11.5" fill="#999" filter="url(#rough2)">x+y=4 ✗</text>
  <text x="316" y="226" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(3,2)</text>
  <text x="468" y="226" text-anchor="end" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x+y=5 ✓</text>

  <text x="392" y="254" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 共 3 对</text>
  <text x="392" y="274" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">(1,2)、(2,1)、(3,2)</text>
  <text x="392" y="292" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">与示例 1 完全一致</text>

  <!-- bottom note -->
  <rect x="48" y="316" width="424" height="50" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">💡 判定 O(1) 之后别急着交：枚举全部数对仍是 10¹⁰ 次，</text>
  <text x="260" y="356" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">必须把逐对判定升维成「奇偶分类计数」，才能 O(1) 收官。</text>
</svg>
