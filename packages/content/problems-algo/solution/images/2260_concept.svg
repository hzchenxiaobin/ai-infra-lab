<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">哈希映射：存最近下标，相邻同值算最小跨度</text>
  <path d="M 120 44 Q 280 52 440 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 数组行 cards -->
  <text x="60" y="92" text-anchor="end" font-size="13" fill="#666">cards</text>

  <!-- index 0: 3 (上次出现，高亮红) -->
  <g filter="url(#rough2)">
    <rect x="90" y="76" width="56" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="118" y="101" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">3</text>
  <text x="118" y="70" text-anchor="middle" font-size="10" fill="#888">0</text>

  <!-- index 1: 4 -->
  <g filter="url(#rough2)">
    <rect x="152" y="76" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="180" y="101" text-anchor="middle" font-size="14" fill="#333">4</text>
  <text x="180" y="70" text-anchor="middle" font-size="10" fill="#888">1</text>

  <!-- index 2: 2 -->
  <g filter="url(#rough2)">
    <rect x="214" y="76" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="242" y="101" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="242" y="70" text-anchor="middle" font-size="10" fill="#888">2</text>

  <!-- index 3: 3 当前（高亮橙） -->
  <g filter="url(#rough2)">
    <rect x="276" y="76" width="56" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="304" y="101" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">3</text>
  <text x="304" y="70" text-anchor="middle" font-size="10" fill="#888">3</text>

  <!-- index 4: 4 -->
  <g filter="url(#rough2)">
    <rect x="338" y="76" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="366" y="101" text-anchor="middle" font-size="14" fill="#333">4</text>
  <text x="366" y="70" text-anchor="middle" font-size="10" fill="#888">4</text>

  <!-- index 5: 7 -->
  <g filter="url(#rough2)">
    <rect x="400" y="76" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="428" y="101" text-anchor="middle" font-size="14" fill="#333">7</text>
  <text x="428" y="70" text-anchor="middle" font-size="10" fill="#888">5</text>

  <!-- 扫描指针 -->
  <path d="M 304 56 L 304 70" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="328" y="58" font-size="11" fill="#d6a040">i=3</text>

  <!-- 两处 3 之间的跨度弧线 -->
  <path d="M 118 130 Q 211 150 304 130" stroke="#b85450" stroke-width="1.8" fill="none"
        stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="211" y="148" text-anchor="middle" font-size="12" fill="#b85450">跨度 = 3 − 0 + 1 = 4 张</text>

  <!-- 查询说明 -->
  <text x="304" y="172" text-anchor="middle" font-size="11" fill="#888">当前 cards[i] = 3</text>
  <path d="M 304 182 Q 304 210 200 238" stroke="#3a3a3a" stroke-width="1.6" fill="none"
        stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="212" text-anchor="middle" font-size="12" fill="#3a3a3a">3 ∈ last ?</text>

  <!-- last 映射框 -->
  <g filter="url(#rough2)">
    <rect x="80" y="226" width="300" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="230" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">last（值 → 最近下标）</text>

  <g filter="url(#rough2)">
    <ellipse cx="135" cy="278" rx="28" ry="15" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="135" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">3 : 0</text>

  <g filter="url(#rough2)">
    <ellipse cx="200" cy="278" rx="28" ry="15" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="200" y="282" text-anchor="middle" font-size="11" fill="#333">4 : 1</text>

  <g filter="url(#rough2)">
    <ellipse cx="265" cy="278" rx="28" ry="15" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="265" y="282" text-anchor="middle" font-size="11" fill="#333">2 : 2</text>

  <!-- 命中结果箭头 -->
  <path d="M 135 295 Q 135 308 165 318" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 结果框 -->
  <g filter="url(#rough2)">
    <rect x="110" y="318" width="280" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="250" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">✓ ans = min(ans, 3 − 0 + 1) = 4</text>

  <!-- 右侧说明 -->
  <g filter="url(#rough2)">
    <rect x="400" y="226" width="140" height="92" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="470" y="248" text-anchor="middle" font-size="11" fill="#666">只需相邻两次出现</text>
  <text x="470" y="266" text-anchor="middle" font-size="11" fill="#446688">p3−p1 ≥ max(p3−p2, p2−p1)</text>
  <text x="470" y="284" text-anchor="middle" font-size="11" fill="#666">覆盖更新：只留最近下标</text>
  <text x="470" y="302" text-anchor="middle" font-size="11" fill="#4a7a3a">→ 跨度更小 → 更优</text>
</svg>
