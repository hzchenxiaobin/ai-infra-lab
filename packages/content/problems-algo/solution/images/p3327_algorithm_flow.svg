<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一次后序 ＋ 一次 Manacher，全程 O(n)</text>

  <!-- ① 建 children -->
  <rect x="36" y="38" width="330" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="201" y="62" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">① 建 children 表：i＝1…n−1 挂到 parent[i]（升序天然保证）</text>
  <path d="M 201 76 L 201 92" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ② 后序遍历 -->
  <rect x="36" y="96" width="330" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="201" y="120" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">② 显式栈模拟后序遍历 → 完成序列 order</text>
  <path d="M 201 134 L 201 150" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ③ T / pos / size -->
  <rect x="36" y="154" width="330" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="201" y="174" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">③ 由 order 填 T 与 pos；正序扫一遍 order 累加 size</text>
  <text x="201" y="192" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">（后序保证：扫到 x 时，其孩子的 size 已就绪）</text>
  <path d="M 201 206 L 201 222" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ④ Manacher -->
  <rect x="36" y="226" width="330" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="201" y="250" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">④ 对 T 跑 Manacher → d1[]（奇）、d2[]（偶）</text>
  <path d="M 201 264 L 201 280" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ⑤ 区间定位 -->
  <rect x="36" y="284" width="330" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="201" y="308" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">⑤ 每个 x：l＝pos[x]−size[x]＋1，r＝pos[x]，m＝size[x]</text>
  <path d="M 201 322 L 201 338" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="200,342 290,378 200,414 110,378" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="374" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">m 是奇数？</text>
  <text x="200" y="390" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">（区间长度）</text>

  <!-- 奇 → d1 -->
  <path d="M 290 378 L 322 378" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="304" y="369" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">奇</text>
  <rect x="326" y="358" width="170" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="411" y="375" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">answer[x] ＝</text>
  <text x="411" y="390" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">2·d1[(l+r)/2]−1 ≥ m ？</text>

  <!-- 偶 → d2 -->
  <path d="M 200 414 L 200 434" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="228" y="428" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">偶</text>
  <rect x="112" y="438" width="178" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="201" y="455" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">answer[x] ＝ 2·d2[l＋m/2] ≥ m ？</text>

  <!-- 右侧批注 1 -->
  <rect x="384" y="96" width="126" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="447" y="114" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">为什么用显式栈？</text>
  <text x="447" y="130" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">链状树深达 10⁵，</text>
  <text x="447" y="144" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">Python 递归上限 1000</text>
  <text x="447" y="158" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">直接爆栈；C++ 也有</text>
  <text x="447" y="170" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">栈深风险 → 迭代稳妥</text>

  <!-- 右侧批注 2 -->
  <rect x="384" y="226" width="126" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="447" y="244" text-anchor="middle" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">复杂度账单</text>
  <text x="447" y="260" text-anchor="middle" font-size="8.5" fill="#7a5a20" filter="url(#rough2)">建表 O(n) ＋ 遍历 O(n)</text>
  <text x="447" y="274" text-anchor="middle" font-size="8.5" fill="#7a5a20" filter="url(#rough2)">＋ Manacher O(n)</text>
  <text x="447" y="288" text-anchor="middle" font-size="8.5" fill="#7a5a20" filter="url(#rough2)">＋ n 次 O(1) 查询</text>
  <text x="447" y="302" text-anchor="middle" font-size="9" fill="#a07830" font-weight="bold" filter="url(#rough2)">总计 O(n) ✔</text>
</svg>
