<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：后序 DFS 收集全部完美子树大小，降序取第 k 个</text>
  <text x="260" y="38" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">左：递归 dfs(node) 的判定与记录；右下：主流程收尾；虚线 = 主流程调用递归</text>

  <!-- 递归 dfs(node) -->
  <rect x="115" y="48" width="110" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="65" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">dfs(node)</text>

  <line x1="170" y1="74" x2="170" y2="82" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="170,84 228,102 170,120 112,102" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="106" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">node 为空？</text>

  <line x1="228" y1="102" x2="258" y2="102" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="243" y="96" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="262" y="89" width="90" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="307" y="106" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">return 0</text>
  <text x="307" y="124" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">空树高度 0，不拖累父节点</text>

  <line x1="170" y1="120" x2="170" y2="128" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="178" y="127" text-anchor="start" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="85" y="130" width="170" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="147" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">hl ← dfs(L)；hr ← dfs(R)</text>

  <line x1="170" y1="156" x2="170" y2="166" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="170,168 248,190 170,212 92,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="194" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">hl&lt;0 ∨ hr&lt;0 ∨ hl≠hr ？</text>

  <line x1="248" y1="190" x2="256" y2="190" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="252" y="183" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="260" y="177" width="70" height="26" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="295" y="194" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">return −1</text>
  <text x="295" y="215" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">不完美；孩子已记的照常有效</text>

  <line x1="170" y1="212" x2="170" y2="222" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="178" y="221" text-anchor="start" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="55" y="224" width="230" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="241" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">h ← hl+1；记 2^h−1；return h</text>

  <!-- 主流程 -->
  <rect x="340" y="130" width="150" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="415" y="147" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">dfs(root) 遍历全树</text>
  <path d="M 415 128 L 415 66 L 232 66" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="330" y="60" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">调用</text>

  <line x1="415" y1="156" x2="415" y2="166" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="340" y="168" width="150" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="415" y="185" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">收集 sizes（≤ n 项）</text>

  <line x1="415" y1="194" x2="415" y2="204" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="340" y="206" width="150" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="415" y="223" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">sizes 降序排序</text>

  <line x1="415" y1="232" x2="415" y2="240" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <polygon points="415,242 488,264 415,286 342,264" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="415" y="268" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">len(sizes) ≥ k ？</text>

  <line x1="415" y1="286" x2="415" y2="296" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="423" y="295" text-anchor="start" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="345" y="298" width="140" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="415" y="315" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">return sizes[k−1]</text>

  <path d="M 488 264 L 504 264 L 504 347 L 489 347" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="496" y="258" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="345" y="334" width="140" height="26" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="415" y="351" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">return −1</text>

  <!-- 底部要点 -->
  <rect x="30" y="364" width="460" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="380" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">① 每个节点至多贡献一项 → sizes ≤ n；嵌套的完美子树分别计数</text>
  <text x="260" y="394" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">② −1 只向上传播：不完美节点的孩子已入列的大小全部有效</text>
  <text x="260" y="408" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">③ 排序可省：大小只有 2^h−1（h ≤ 10）约 10 种 → 高度桶计数 O(n)</text>
</svg>
