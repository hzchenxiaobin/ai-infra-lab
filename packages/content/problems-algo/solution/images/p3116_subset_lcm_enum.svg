<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">位掩码递推全部子集的 LCM（以 coins = [2,3,5] 为例）</text>

  <!-- level 1: popcount 1, sign + -->
  <text x="66" y="72" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">单枚硬币</text>
  <text x="66" y="86" font-size="10" fill="#888" filter="url(#rough2)">|S|=1 → +</text>

  <rect x="95" y="60" width="96" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="143" y="78" text-anchor="middle" font-size="11" fill="#335" font-weight="bold" filter="url(#rough2)">mask 001 (2)</text>
  <text x="143" y="95" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">lcm = 2，符号 +</text>

  <rect x="232" y="60" width="96" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="78" text-anchor="middle" font-size="11" fill="#335" font-weight="bold" filter="url(#rough2)">mask 010 (3)</text>
  <text x="280" y="95" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">lcm = 3，符号 +</text>

  <rect x="369" y="60" width="96" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="417" y="78" text-anchor="middle" font-size="11" fill="#335" font-weight="bold" filter="url(#rough2)">mask 100 (5)</text>
  <text x="417" y="95" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">lcm = 5，符号 +</text>

  <!-- arrows level1 -> level2 (rest = mask & (mask-1)) -->
  <path d="M 143 106 L 143 146" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="152" y="130" font-size="9.5" fill="#888" filter="url(#rough2)">∪coin₃</text>
  <path d="M 400 106 L 330 146" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="378" y="130" font-size="9.5" fill="#888" filter="url(#rough2)">∪coin₂</text>
  <path d="M 417 106 L 417 146" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="426" y="130" font-size="9.5" fill="#888" filter="url(#rough2)">∪coin₃</text>

  <!-- level 2: popcount 2, sign - -->
  <text x="66" y="166" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">两枚硬币</text>
  <text x="66" y="180" font-size="10" fill="#888" filter="url(#rough2)">|S|=2 → −</text>

  <rect x="95" y="154" width="96" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="143" y="172" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold" filter="url(#rough2)">mask 011</text>
  <text x="143" y="189" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">lcm(2,3) = 6，−</text>

  <rect x="232" y="154" width="96" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="172" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold" filter="url(#rough2)">mask 101</text>
  <text x="280" y="189" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">lcm(2,5) = 10，−</text>

  <rect x="369" y="154" width="96" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="417" y="172" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold" filter="url(#rough2)">mask 110</text>
  <text x="417" y="189" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">lcm(3,5) = 15，−</text>

  <!-- arrow level2 -> level3 -->
  <path d="M 395 200 L 320 240" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="376" y="226" font-size="9.5" fill="#888" filter="url(#rough2)">∪coin₂</text>

  <!-- level 3: popcount 3, sign + -->
  <text x="66" y="260" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">三枚硬币</text>
  <text x="66" y="274" font-size="10" fill="#888" filter="url(#rough2)">|S|=3 → +</text>

  <rect x="232" y="248" width="96" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">mask 111</text>
  <text x="280" y="283" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">lcm(15,2) = 30，+</text>

  <!-- note box -->
  <rect x="46" y="308" width="468" height="42" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="325" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">lcm[mask] = lcm( lcm[mask &amp; (mask−1)], coin[最低位] )——去最低位递推，每个 mask 只算一次 gcd</text>
  <text x="280" y="342" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">popcnt 奇 ⇒ +，偶 ⇒ −；每个子集对 count(x) 贡献 ±⌊x / lcm[mask]⌋</text>
</svg>
