<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三个用例覆盖「就地修改 / this 绑定 / 取反」</text>

  <!-- ===== Example 1: double ===== -->
  <text x="30" y="56" font-size="12" fill="#446688" font-weight="bold">示例 1：arr[i] = val * 2</text>
  <text x="30" y="72" font-size="10" fill="#888">context = true（回调不用 this，不影响结果）</text>

  <!-- Step rows -->
  <!-- i=0 -->
  <rect x="30" y="82" width="45" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="52" y="100" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="80" y="82" width="45" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="102" y="100" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="130" y="82" width="45" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="152" y="100" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="185" y="100" font-size="10" fill="#666">i=0: val=1 → arr[0]=2</text>

  <!-- i=1 -->
  <rect x="30" y="116" width="45" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="52" y="134" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="80" y="116" width="45" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="102" y="134" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="130" y="116" width="45" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="152" y="134" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="185" y="134" font-size="10" fill="#666">i=1: val=2 → arr[1]=4</text>

  <!-- i=2 -->
  <rect x="30" y="150" width="45" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="52" y="168" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="80" y="150" width="45" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="102" y="168" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="130" y="150" width="45" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="152" y="168" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="185" y="168" font-size="10" fill="#666">i=2: val=3 → arr[2]=6</text>

  <text x="30" y="192" font-size="11" fill="#4a7a3a" font-weight="bold">结果：[2, 4, 6] ✓</text>

  <!-- separator -->
  <path d="M 30 205 L 530 205" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- ===== Example 2: this binding ===== -->
  <text x="30" y="228" font-size="12" fill="#d6a040" font-weight="bold">示例 2：arr[i] = this，context = false</text>
  <text x="30" y="244" font-size="10" fill="#888">callback.call(false, ...) → 回调内 this === false</text>

  <!-- Show array -->
  <rect x="30" y="254" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="272" text-anchor="middle" font-size="11" fill="#333">true</text>
  <rect x="95" y="254" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="125" y="272" text-anchor="middle" font-size="11" fill="#333">true</text>
  <rect x="160" y="254" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="190" y="272" text-anchor="middle" font-size="11" fill="#333">false</text>
  <rect x="225" y="254" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="255" y="272" text-anchor="middle" font-size="11" fill="#333">false</text>
  <path d="M 290 268 L 330 268" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="261" text-anchor="middle" font-size="9" fill="#d6a040">this=false</text>

  <!-- result -->
  <rect x="340" y="254" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="370" y="272" text-anchor="middle" font-size="11" fill="#333">false</text>
  <rect x="405" y="254" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="435" y="272" text-anchor="middle" font-size="11" fill="#333">false</text>
  <rect x="470" y="254" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="500" y="272" text-anchor="middle" font-size="11" fill="#333">false</text>

  <text x="340" y="298" font-size="11" fill="#4a7a3a" font-weight="bold">结果：[false, false, false, false] ✓</text>

  <!-- separator -->
  <path d="M 30 312 L 530 312" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- ===== Example 3: negate ===== -->
  <text x="30" y="335" font-size="12" fill="#b85450" font-weight="bold">示例 3：arr[i] = !val，context = 5</text>
  <text x="30" y="351" font-size="10" fill="#888">回调不用 this，context 不影响结果</text>

  <!-- step table -->
  <rect x="30" y="361" width="60" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="378" text-anchor="middle" font-size="10" fill="#333">true</text>
  <rect x="95" y="361" width="60" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="125" y="378" text-anchor="middle" font-size="10" fill="#333">true</text>
  <rect x="160" y="361" width="60" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="190" y="378" text-anchor="middle" font-size="10" fill="#333">false</text>
  <rect x="225" y="361" width="60" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="255" y="378" text-anchor="middle" font-size="10" fill="#333">false</text>
  <text x="295" y="378" font-size="10" fill="#666">!val 逐个取反</text>
  <path d="M 430 374 L 470 374" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="30" y="395" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="412" text-anchor="middle" font-size="10" fill="#333">false</text>
  <rect x="95" y="395" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="125" y="412" text-anchor="middle" font-size="10" fill="#333">false</text>
  <rect x="160" y="395" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="190" y="412" text-anchor="middle" font-size="10" fill="#333">true</text>
  <rect x="225" y="395" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="255" y="412" text-anchor="middle" font-size="10" fill="#333">true</text>

  <text x="30" y="440" font-size="11" fill="#4a7a3a" font-weight="bold">结果：[false, false, true, true] ✓</text>

  <!-- bottom note -->
  <rect x="40" y="452" width="490" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="285" y="466" text-anchor="middle" font-size="10" fill="#446688">三例分别考察：就地修改 · this 绑定 · 逻辑运算 —— callback.call(context, val, i, arr) 一行通吃</text>
</svg>
