<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：前向可达 f + 后向可达 g + 逐层计数</text>

  <!-- Step 1: forward -->
  <rect x="150" y="44" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 前向 DP：f[i][j]</text>
  <text x="280" y="76" text-anchor="middle" font-size="10.5" fill="#555">从 (0,0) 沿「右/下」走 1 能否到 (i,j)</text>

  <path d="M 280 84 L 280 100" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: check f[end] -->
  <polygon points="280,100 400,140 280,180 160,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="138" text-anchor="middle" font-size="11.5" fill="#333">f[m−1][n−1]==0 ?</text>
  <text x="280" y="156" text-anchor="middle" font-size="10.5" fill="#888">(无路径)</text>
  <!-- no path -> true -->
  <path d="M 400 140 L 476 140" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="466" y="126" width="86" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="509" y="145" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return true</text>
  <text x="420" y="120" font-size="10" fill="#b85450">是</text>

  <path d="M 280 180 L 280 196" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="192" font-size="10.5" fill="#4a7a3a">否（有路径）↓</text>

  <!-- Step 3: backward -->
  <rect x="150" y="196" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="212" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 后向 DP：g[i][j]</text>
  <text x="280" y="228" text-anchor="middle" font-size="10.5" fill="#555">从 (i,j) 沿「右/下」走 1 能否到 (m−1,n−1)</text>

  <path d="M 280 236 L 280 252" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: count per level -->
  <rect x="130" y="252" width="300" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 逐层计数 cnt[k]</text>
  <text x="280" y="287" text-anchor="middle" font-size="10.5" fill="#555">cnt[i+j] += (f[i][j] &amp;&amp; g[i][j])</text>
  <text x="280" y="300" text-anchor="middle" font-size="10" fill="#888">k = i+j 为对角层编号，0 … m+n−2</text>

  <path d="M 280 300 L 280 316" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: scan levels 1..m+n-3 -->
  <polygon points="280,316 410,356 280,396 150,356" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="11.5" fill="#333">∃ k∈[1,m+n−3]</text>
  <text x="280" y="370" text-anchor="middle" font-size="11.5" fill="#333">使 cnt[k] == 1 ?</text>

  <!-- yes -> true -->
  <path d="M 410 356 L 476 356" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="466" y="342" width="86" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="509" y="361" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return true</text>
  <text x="430" y="336" font-size="10" fill="#b85450">是</text>

  <!-- no -> false -->
  <path d="M 150 356 L 84 356" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="8" y="342" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="48" y="361" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">return false</text>
  <text x="118" y="336" font-size="10" fill="#446688">否</text>

  <!-- bottom notes -->
  <rect x="40" y="416" width="500" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="432" text-anchor="middle" font-size="10.5" fill="#555">f、g 各一次 O(mn) 遍历；计数一次 O(mn)；总 O(mn) 时间 / O(mn) 空间</text>
  <text x="290" y="446" text-anchor="middle" font-size="10" fill="#888">翻转 0→1 只增路径不会断路，故只考虑 1→0（删支配点）</text>
</svg>
