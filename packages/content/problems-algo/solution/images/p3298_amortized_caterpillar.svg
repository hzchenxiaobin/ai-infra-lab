<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">均摊分析：left 和 right 都只会向右走</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">word1 = "cbaaabc"，need：a:1 / b:1 / c:1</text>

  <!-- 快照 ①：r=5，窗口 [1,5] -->
  <text x="30" y="86" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">①</text>
  <text x="170" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">L</text>
  <path d="M 182 56 L 182 68" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">R</text>
  <path d="M 362 56 L 362 68" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="105" y="72" width="40" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="150" y="72" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="195" y="72" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="240" y="72" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="285" y="72" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="330" y="72" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="375" y="72" width="40" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="125" y="94" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">c</text>
  <text x="170" y="94" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">b</text>
  <text x="215" y="94" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">a</text>
  <text x="260" y="94" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">a</text>
  <text x="305" y="94" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">a</text>
  <text x="350" y="94" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">b</text>
  <text x="395" y="94" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">c</text>
  <text x="105" y="120" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="150" y="120" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="195" y="120" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="240" y="120" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="285" y="120" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="330" y="120" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="375" y="120" font-size="10" fill="#999" filter="url(#rough2)">6</text>
  <text x="260" y="122" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">窗口 [1,5] =「baaab」：b、a 都富余，唯独欠 1 个 c（less=1）</text>

  <!-- 快照 ②：r=6 入窗，覆盖达成 -->
  <text x="30" y="176" font-size="13" fill="#a07830" font-weight="bold" filter="url(#rough2)">②</text>
  <text x="170" y="150" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">L</text>
  <path d="M 182 146 L 182 158" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="395" y="150" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">R</text>
  <path d="M 407 146 L 407 158" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="105" y="162" width="40" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="150" y="162" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="195" y="162" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="240" y="162" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="285" y="162" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="330" y="162" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="375" y="162" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="184" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">c</text>
  <text x="170" y="184" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">b</text>
  <text x="215" y="184" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">a</text>
  <text x="260" y="184" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">a</text>
  <text x="305" y="184" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">a</text>
  <text x="350" y="184" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">b</text>
  <text x="395" y="184" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="260" y="212" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">right +1（每轮就这一步）：c 入窗 → less=0，覆盖达成，进入 while 收缩</text>

  <!-- 快照 ③：left 弹跳 -->
  <text x="30" y="266" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">③</text>
  <text x="350" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">L</text>
  <path d="M 362 236 L 362 248" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="395" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">R</text>
  <path d="M 407 236 L 407 248" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="105" y="252" width="40" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <line x1="108" y1="270" x2="142" y2="268" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="150" y="252" width="40" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <line x1="153" y1="268" x2="187" y2="270" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="195" y="252" width="40" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <line x1="198" y1="272" x2="232" y2="266" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="240" y="252" width="40" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <line x1="243" y1="266" x2="277" y2="272" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="285" y="252" width="40" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <line x1="288" y1="270" x2="322" y2="268" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="330" y="252" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="375" y="252" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="125" y="274" text-anchor="middle" font-size="12" fill="#ccc" filter="url(#rough2)">c</text>
  <text x="170" y="274" text-anchor="middle" font-size="12" fill="#ccc" filter="url(#rough2)">b</text>
  <text x="215" y="274" text-anchor="middle" font-size="12" fill="#ccc" filter="url(#rough2)">a</text>
  <text x="260" y="274" text-anchor="middle" font-size="12" fill="#ccc" filter="url(#rough2)">a</text>
  <text x="305" y="274" text-anchor="middle" font-size="12" fill="#ccc" filter="url(#rough2)">a</text>
  <text x="350" y="274" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">b</text>
  <text x="395" y="274" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">c</text>
  <text x="260" y="304" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">连踢 b,a,a,a（都是富余），直到某个 a 即将不够 → left 一次弹跳 1→5</text>

  <!-- L 弹跳箭头 -->
  <path d="M 170 158 C 100 190, 130 240, 336 240" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="88" y="205" font-size="9.5" fill="#4a7a3a" transform="rotate(-90 88 205)" filter="url(#rough2)">left 弹跳 +4</text>

  <!-- 底部结论 -->
  <rect x="34" y="322" width="452" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">right：每轮 +1，共 n 步 ｜ left：只进不退，全程 ≤ n 步</text>
  <text x="260" y="360" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">合计 ≤ 2n = 2×10⁶ 步（每步 O(1)）→ for 套 while 依然是严格 O(n)</text>

  <text x="260" y="390" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">记账法：把 while 的开销记到每个被踢出的元素头上——一人至多进窗一次、出窗一次，总账 2n</text>
</svg>
