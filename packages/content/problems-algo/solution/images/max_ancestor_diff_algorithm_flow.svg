<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">DFS(node, cur_min, cur_max) 算法流程</text>

  <!-- 起点 -->
  <g filter="url(#rough2)">
    <ellipse cx="300" cy="66" rx="90" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="300" y="71" text-anchor="middle" font-size="12" fill="#333">调用 dfs(root, root.val, root.val)</text>
  </g>
  <path d="M300,86 L300,112" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 判空 -->
  <g filter="url(#rough2)">
    <polygon points="300,112 380,150 300,188 220,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="300" y="148" text-anchor="middle" font-size="12" fill="#333">node == null ?</text>
    <text x="300" y="166" text-anchor="middle" font-size="11" fill="#888">return</text>
  </g>
  <path d="M380,150 L430,150" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="395" y="143" font-size="11" fill="#888" filter="url(#rough2)">是</text>
  <path d="M300,188 L300,214" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="310" y="204" font-size="11" fill="#888" filter="url(#rough2)">否</text>

  <!-- 更新答案 -->
  <g filter="url(#rough2)">
    <rect x="200" y="214" width="200" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="300" y="234" text-anchor="middle" font-size="12" fill="#2a4a2a">用 node.val 更新全局 ans</text>
    <text x="300" y="254" text-anchor="middle" font-size="11" fill="#333">ans = max(ans, |val-cur_min|, |val-cur_max|)</text>
  </g>
  <path d="M300,270 L300,296" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 收缩 min/max -->
  <g filter="url(#rough2)">
    <rect x="180" y="296" width="240" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="300" y="322" text-anchor="middle" font-size="11" fill="#333">nmin=min(cur_min,val)  nmax=max(cur_max,val)</text>
  </g>
  <path d="M300,340 L300,360" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 递归左右 -->
  <g filter="url(#rough2)">
    <rect x="120" y="360" width="160" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="200" y="380" text-anchor="middle" font-size="12" fill="#333">dfs(node.left,</text>
    <text x="200" y="396" text-anchor="middle" font-size="11" fill="#555">nmin, nmax)</text>

    <rect x="320" y="360" width="160" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="400" y="380" text-anchor="middle" font-size="12" fill="#333">dfs(node.right,</text>
    <text x="400" y="396" text-anchor="middle" font-size="11" fill="#555">nmin, nmax)</text>
  </g>
  <path d="M290,382 L215,382" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <path d="M310,382 L385,382" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>

  <text x="300" y="426" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    自顶向下传 min/max，无需回溯——每条路径独立维护
  </text>
</svg>
