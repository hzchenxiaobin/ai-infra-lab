<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="660" height="360" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">覆盖树与原对象平行：只重建被改路径上的节点，未触及子树沿用原引用</text>

  <!-- 原对象 (left) -->
  <rect x="24" y="58" width="180" height="250" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="114" y="50" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">原对象 obj（只读）</text>
  <rect x="40" y="78" width="148" height="26" fill="#fff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="114" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">obj</text>
  <rect x="56" y="112" width="132" height="26" fill="#fff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="122" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">val</text>
  <rect x="72" y="146" width="56" height="26" fill="#fff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="100" y="164" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">x=10</text>
  <rect x="132" y="146" width="56" height="26" fill="#fff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="160" y="164" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">y=20</text>
  <text x="114" y="200" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">…其它未触及子树…</text>
  <text x="114" y="222" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">全程不被写入</text>

  <!-- 中间：覆盖树 -->
  <rect x="240" y="58" width="180" height="250" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="330" y="50" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">覆盖树 draft（写在此）</text>
  <rect x="256" y="78" width="148" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="330" y="96" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">root (obj 节点)</text>
  <rect x="272" y="112" width="132" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="338" y="130" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">obj (obj 节点)</text>
  <rect x="288" y="146" width="116" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="346" y="164" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">val (obj 节点)</text>
  <rect x="288" y="184" width="52" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="314" y="202" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">x=20</text>
  <rect x="352" y="184" width="52" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="378" y="202" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">y=10</text>
  <text x="330" y="232" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">只存「被改的叶子」</text>
  <text x="330" y="250" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">中间层为 obj 节点</text>

  <!-- arrow obj -> draft -->
  <path d="M 204 130 L 240 130" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="222" y="122" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">写入</text>

  <!-- 结果 (right) -->
  <rect x="456" y="58" width="180" height="250" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="546" y="50" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">结果（copy-on-write）</text>
  <rect x="472" y="78" width="148" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="4" filter="url(#rough2)"/>
  <text x="546" y="96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">obj（克隆）</text>
  <rect x="488" y="112" width="132" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="4" filter="url(#rough2)"/>
  <text x="554" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">val（克隆）</text>
  <rect x="504" y="146" width="56" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="532" y="164" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">x=20</text>
  <rect x="564" y="146" width="56" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="592" y="164" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">y=10</text>
  <text x="546" y="200" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">┄┄┄ 共享原引用 ┄┄┄</text>
  <text x="546" y="218" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">未触及的兄弟子树</text>

  <!-- arrow draft -> result -->
  <path d="M 420 130 L 456 130" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="122" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">重建</text>

  <!-- shared link: 原对象未触及子树 -> 结果 -->
  <path d="M 172 240 C 300 290 400 290 540 240" stroke="#999" stroke-width="1.4" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="356" y="288" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">结构共享：未改子树指针复用</text>

  <!-- bottom note -->
  <rect x="24" y="306" width="612" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="330" y="327" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">写只在覆盖树登记（原对象零写入）；收尾沿被改路径浅拷贝，未触及子树沿用原引用</text>
</svg>
