<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrOrange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">中序后继的两种情况（node 带 parent 指针）</text>

  <!-- 分隔线 -->
  <path d="M 320 48 L 320 372" stroke="#ccc" stroke-width="1" stroke-dasharray="3,4" fill="none" filter="url(#rough2)"/>

  <!-- ===== 左面板：情况一 ===== -->
  <rect x="20" y="44" width="290" height="330" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="165" y="68" text-anchor="middle" font-size="13" fill="#b87b20" font-weight="bold">情况一：node 有右子树</text>
  <text x="165" y="86" text-anchor="middle" font-size="11" fill="#777">后继 = 右子树中最左的节点</text>

  <!-- 树枝 -->
  <line x1="140" y1="126" x2="195" y2="170" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="132" y1="126" x2="100" y2="170" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="190" y1="186" x2="168" y2="232" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- 节点 10 (query) -->
  <circle cx="138" cy="112" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="138" y="116" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>
  <text x="160" y="104" font-size="10" fill="#d6a040" font-weight="bold">node</text>

  <!-- 节点 5 -->
  <circle cx="95" cy="184" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="95" y="188" text-anchor="middle" font-size="11" fill="#333">5</text>

  <!-- 节点 15 -->
  <circle cx="198" cy="184" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="198" y="188" text-anchor="middle" font-size="11" fill="#333">15</text>

  <!-- 节点 12 (successor) -->
  <circle cx="166" cy="246" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="166" y="250" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">12</text>
  <text x="186" y="240" font-size="10" fill="#4a7a3a" font-weight="bold">后继</text>

  <!-- 搜索路径箭头：10 → 15 → 12 -->
  <path d="M 150 128 L 188 170" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <path d="M 190 200 L 172 232" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>

  <text x="165" y="300" text-anchor="middle" font-size="11" fill="#555">先到右孩子，再一路向左到底</text>
  <text x="165" y="320" text-anchor="middle" font-size="11" fill="#b87b20" font-weight="bold">while (cur.left) cur = cur.left</text>
  <text x="165" y="348" text-anchor="middle" font-size="10" fill="#888">中序：… 10, 12, 15 …  ⇒ 10 的后继是 12</text>

  <!-- ===== 右面板：情况二 ===== -->
  <rect x="330" y="44" width="290" height="330" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="475" y="68" text-anchor="middle" font-size="13" fill="#335" font-weight="bold">情况二：node 无右子树</text>
  <text x="475" y="86" text-anchor="middle" font-size="11" fill="#777">沿 parent 上溯，首个使 node 在其左子树的祖先</text>

  <!-- 树枝（正常父子边） -->
  <line x1="475" y1="126" x2="430" y2="170" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="430" y1="190" x2="455" y2="232" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="465" y1="252" x2="490" y2="294" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- 节点 20 (successor) -->
  <circle cx="475" cy="112" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="475" y="116" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">20</text>
  <text x="500" y="104" font-size="10" fill="#4a7a3a" font-weight="bold">后继</text>

  <!-- 节点 10 -->
  <circle cx="428" cy="184" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="428" y="188" text-anchor="middle" font-size="11" fill="#333">10</text>

  <!-- 节点 15 -->
  <circle cx="458" cy="246" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="458" y="250" text-anchor="middle" font-size="11" fill="#333">15</text>

  <!-- 节点 17 (query) -->
  <circle cx="495" cy="306" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="495" y="310" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">17</text>
  <text x="518" y="300" font-size="10" fill="#d6a040" font-weight="bold">node</text>

  <!-- 上溯箭头（parent 指针方向，向上）：17 → 15 → 10 → 20 -->
  <path d="M 488 292 L 463 260" stroke="#446688" stroke-width="1.8" stroke-dasharray="4,3" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <path d="M 452 232 L 432 200" stroke="#446688" stroke-width="1.8" stroke-dasharray="4,3" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <path d="M 432 170 L 470 128" stroke="#446688" stroke-width="1.8" stroke-dasharray="4,3" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- 右孩/左孩标注 -->
  <text x="478" y="280" font-size="9" fill="#b85450">右孩→继续</text>
  <text x="408" y="220" font-size="9" fill="#b85450">右孩→继续</text>
  <text x="438" y="156" font-size="9" fill="#4a7a3a" font-weight="bold">左孩→停!</text>

  <text x="475" y="346" text-anchor="middle" font-size="10" fill="#888">中序：… 15, 17, 20 …  ⇒ 17 的后继是 20</text>
</svg>
