<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">排序后每个元素可占据 [x−k, x+k] 内的整数 —— 贪心取最小可用值</text>
  <text x="500" y="48" text-anchor="end" font-size="12" fill="#888" filter="url(#rough2)">示例 nums=[4,4,4,4]，k=1</text>

  <!-- number line -->
  <g filter="url(#rough2)">
    <path d="M55,64 L430,64" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>
    <line x1="60" y1="58" x2="60" y2="70" stroke="#666" stroke-width="1.5"/>
    <line x1="124" y1="58" x2="124" y2="70" stroke="#666" stroke-width="1.5"/>
    <line x1="188" y1="58" x2="188" y2="70" stroke="#666" stroke-width="1.5"/>
    <line x1="252" y1="58" x2="252" y2="70" stroke="#666" stroke-width="1.5"/>
    <line x1="316" y1="58" x2="316" y2="70" stroke="#666" stroke-width="1.5"/>
    <line x1="380" y1="58" x2="380" y2="70" stroke="#666" stroke-width="1.5"/>
    <text x="60" y="84" text-anchor="middle" font-size="12" fill="#666">2</text>
    <text x="124" y="84" text-anchor="middle" font-size="12" fill="#666">3</text>
    <text x="188" y="84" text-anchor="middle" font-size="12" fill="#666">4</text>
    <text x="252" y="84" text-anchor="middle" font-size="12" fill="#666">5</text>
    <text x="316" y="84" text-anchor="middle" font-size="12" fill="#666">6</text>
    <text x="380" y="84" text-anchor="middle" font-size="12" fill="#666">7</text>
  </g>

  <!-- row 1: take 3 -->
  <g filter="url(#rough2)">
    <text x="34" y="120" text-anchor="middle" font-size="13" fill="#333">①</text>
    <rect x="124" y="109" width="128" height="14" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="124" cy="116" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="296" y="120" font-size="12" fill="#4a7a3a">v = max(3, −∞+1) = 3 ✓</text>
  </g>

  <!-- row 2: take 4 -->
  <g filter="url(#rough2)">
    <text x="34" y="170" text-anchor="middle" font-size="13" fill="#333">②</text>
    <rect x="124" y="159" width="128" height="14" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="188" cy="166" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="296" y="170" font-size="12" fill="#4a7a3a">v = max(3, 4) = 4 ✓</text>
  </g>

  <!-- row 3: take 5 -->
  <g filter="url(#rough2)">
    <text x="34" y="220" text-anchor="middle" font-size="13" fill="#333">③</text>
    <rect x="124" y="209" width="128" height="14" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="252" cy="216" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="296" y="220" font-size="12" fill="#4a7a3a">v = max(3, 5) = 5 ✓</text>
  </g>

  <!-- row 4: fail -->
  <g filter="url(#rough2)">
    <text x="34" y="270" text-anchor="middle" font-size="13" fill="#333">④</text>
    <rect x="124" y="259" width="128" height="14" rx="7" fill="#f0f0f0" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="188" y="264" text-anchor="middle" font-size="11" fill="#b85450">已满</text>
    <text x="296" y="270" font-size="12" fill="#b85450">v = max(3, 6) = 6 &gt; 5 ✗</text>
  </g>

  <!-- bottom note -->
  <g filter="url(#rough2)">
    <rect x="30" y="296" width="460" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="260" y="318" text-anchor="middle" font-size="12" fill="#8a6d1a">cur 记录上一个占据值：新元素尝试 v = max(x−k, cur+1)</text>
    <text x="260" y="336" text-anchor="middle" font-size="12" fill="#8a6d1a">只要 v ≤ x+k 就占据成功（cur←v，ans++），否则注定撞车、跳过</text>
    <text x="260" y="354" text-anchor="middle" font-size="12" fill="#8a6d1a">3/4/5 被占满后，第 ④ 个区间 [3,5] 无值可取 → 答案 3</text>
  </g>
</svg>
