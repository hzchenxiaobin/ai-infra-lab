<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="700" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="350" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">
    Gaps &amp; Islands：断点标记 → 前缀和分组（以客户 105 为例）
  </text>

  <!-- Group 1 background -->
  <rect x="46" y="46" width="316" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)" opacity="0.5"/>
  <!-- Group 2 background -->
  <rect x="406" y="46" width="248" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)" opacity="0.5"/>

  <!-- Gap indicator -->
  <text x="384" y="86" text-anchor="middle" font-size="16" fill="#bbb" filter="url(#rough2)">⋯</text>

  <!-- Transaction boxes -->
  <rect x="54" y="52" width="68" height="60" fill="white" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="74" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">05-01</text>
  <text x="88" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">100</text>

  <rect x="132" y="52" width="68" height="60" fill="white" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="166" y="74" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">05-02</text>
  <text x="166" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">150</text>

  <rect x="210" y="52" width="68" height="60" fill="white" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="74" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">05-03</text>
  <text x="244" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">200</text>

  <rect x="288" y="52" width="68" height="60" fill="white" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="74" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">05-04</text>
  <text x="322" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">300</text>

  <rect x="414" y="52" width="68" height="60" fill="white" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="448" y="74" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">05-12</text>
  <text x="448" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">250</text>

  <rect x="492" y="52" width="68" height="60" fill="white" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="526" y="74" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">05-13</text>
  <text x="526" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">260</text>

  <rect x="570" y="52" width="68" height="60" fill="white" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="604" y="74" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">05-14</text>
  <text x="604" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">270</text>

  <!-- is_break markers -->
  <circle cx="88" cy="130" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="88" y="153" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">首行</text>

  <circle cx="166" cy="130" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="166" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="166" y="153" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">连续↑</text>

  <circle cx="244" cy="130" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="244" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="244" y="153" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">连续↑</text>

  <circle cx="322" cy="130" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="322" y="153" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">连续↑</text>

  <circle cx="448" cy="130" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="448" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="448" y="153" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">日期断</text>

  <circle cx="526" cy="130" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="526" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="526" y="153" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">连续↑</text>

  <circle cx="604" cy="130" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="604" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="604" y="153" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">连续↑</text>

  <!-- Cumulative SUM annotation -->
  <text x="350" y="178" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">SUM(is_break) OVER (…) → group_id</text>

  <!-- Group ID bars -->
  <rect x="54" y="188" width="302" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="205" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">group_id = 1　(4 行 ≥ 3 ✓)</text>

  <rect x="414" y="188" width="224" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="526" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">group_id = 2 (3行≥3✓)</text>

  <!-- Output annotation -->
  <text x="350" y="252" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">
    输出：(101, 05-01, 05-03)  (105, 05-01, 05-04)  (105, 05-12, 05-14)
  </text>

  <!-- Legend -->
  <circle cx="110" cy="288" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="292" font-size="11" fill="#666" filter="url(#rough2)">is_break=1 断点（新岛起点）</text>
  <circle cx="330" cy="288" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345" y="292" font-size="11" fill="#666" filter="url(#rough2)">is_break=0 延续（同岛）</text>
  <text x="500" y="292" font-size="11" fill="#bbb" filter="url(#rough2)">⋯ 表示日期不连续</text>

  <text x="350" y="320" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">
    "连续" = DATEDIFF(date, prev_date)=1 且 amount > prev_amount，二者皆满足才算延续
  </text>
</svg>
