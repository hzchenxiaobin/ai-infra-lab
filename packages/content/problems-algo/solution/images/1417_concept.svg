<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：分类计数 + 交错合并</text>

  <!-- 原字符串 -->
  <text x="40" y="56" font-size="12" fill="#666" font-weight="bold">原字符串</text>
  <g filter="url(#rough2)">
    <rect x="110" y="64" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="125" y="84" text-anchor="middle" font-size="12" fill="#333">a</text>
    <rect x="140" y="64" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="155" y="84" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="170" y="64" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="185" y="84" text-anchor="middle" font-size="12" fill="#333">b</text>
    <rect x="200" y="64" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="215" y="84" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="230" y="64" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="245" y="84" text-anchor="middle" font-size="12" fill="#333">c</text>
    <rect x="260" y="64" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="275" y="84" text-anchor="middle" font-size="12" fill="#333">2</text>
  </g>
  <text x="350" y="84" font-size="11" fill="#888" filter="url(#rough2)">蓝=字母，绿=数字</text>

  <!-- 拆分箭头 -->
  <path d="M 200 98 L 200 116" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="300" y="110" font-size="11" fill="#446688" font-weight="bold">按类型拆分</text>

  <!-- 字母行 -->
  <text x="40" y="138" font-size="12" fill="#446688" font-weight="bold">字母</text>
  <g filter="url(#rough2)">
    <rect x="110" y="128" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="125" y="147" text-anchor="middle" font-size="12" fill="#333">a</text>
    <rect x="140" y="128" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="155" y="147" text-anchor="middle" font-size="12" fill="#333">b</text>
    <rect x="170" y="128" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="185" y="147" text-anchor="middle" font-size="12" fill="#333">c</text>
  </g>
  <text x="216" y="147" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">cL = 3</text>

  <!-- 数字行 -->
  <text x="40" y="182" font-size="12" fill="#4a7a3a" font-weight="bold">数字</text>
  <g filter="url(#rough2)">
    <rect x="110" y="172" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="125" y="191" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="140" y="172" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="155" y="191" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="170" y="172" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="185" y="191" text-anchor="middle" font-size="12" fill="#333">2</text>
  </g>
  <text x="216" y="191" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cD = 3</text>

  <!-- 可行性条件 -->
  <rect x="100" y="210" width="360" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="230" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">可行性条件：|cL − cD| ≤ 1（否则返回 ""）</text>

  <!-- 交错箭头 -->
  <path d="M 200 244 L 200 262" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="300" y="256" font-size="11" fill="#446688" font-weight="bold">交错合并：谁多谁开头</text>

  <!-- 交错结果 -->
  <text x="40" y="284" font-size="12" fill="#666" font-weight="bold">交错</text>
  <g filter="url(#rough2)">
    <rect x="110" y="274" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="125" y="293" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
    <rect x="140" y="274" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="155" y="293" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
    <rect x="170" y="274" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="185" y="293" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
    <rect x="200" y="274" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="215" y="293" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <rect x="230" y="274" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="245" y="293" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
    <rect x="260" y="274" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="275" y="293" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  </g>

  <!-- 结果框 -->
  <rect x="100" y="320" width="200" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="200" y="343" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">结果 "a0b1c2"</text>

  <!-- 策略说明 -->
  <text x="330" y="330" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">策略</text>
  <text x="330" y="348" font-size="11" fill="#555" filter="url(#rough2)">谁多谁先放，逐个交替</text>
  <text x="330" y="364" font-size="11" fill="#555" filter="url(#rough2)">相等时任选一种开头</text>
  <text x="330" y="380" font-size="11" fill="#555" filter="url(#rough2)">"ab123" → cD&gt;cL → 数字开头</text>
</svg>
