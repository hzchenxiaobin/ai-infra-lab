<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">不同的好子序列数目：算法流程</text>

  <!-- Start -->
  <rect x="200" y="44" width="160" height="32" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="12" fill="#333">输入 binary</text>

  <line x1="280" y1="76" x2="280" y2="96" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="170" y="98" width="220" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="116" text-anchor="middle" font-size="12" fill="#333">初始化</text>
  <text x="280" y="132" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">end0=0, end1=0, has0=0</text>

  <line x1="280" y1="138" x2="280" y2="158" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: more chars? -->
  <polygon points="280,158 392,200 280,242 168,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="12" fill="#444">还有字符 c?</text>
  <text x="280" y="212" text-anchor="middle" font-size="10" fill="#888">（遍历 binary）</text>

  <!-- No branch: return -->
  <line x1="392" y1="200" x2="432" y2="200" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="194" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="432" y="182" width="116" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="490" y="200" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回</text>
  <text x="490" y="214" text-anchor="middle" font-size="10" fill="#555">(end0+end1+has0)%MOD</text>

  <!-- Yes branch down -->
  <line x1="280" y1="242" x2="280" y2="262" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="256" font-size="11" fill="#b85450" font-weight="bold">是</text>

  <!-- Decision: c == '1'? -->
  <polygon points="280,262 392,304 280,346 168,304" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="12" fill="#444">c == '1' ?</text>
  <text x="280" y="318" text-anchor="middle" font-size="10" fill="#888">（按字符分两条支路）</text>

  <!-- Yes (c=='1'): right -->
  <line x1="392" y1="304" x2="412" y2="304" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="298" font-size="11" fill="#446688" font-weight="bold">是</text>
  <rect x="412" y="286" width="128" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="476" y="304" text-anchor="middle" font-size="11" fill="#333">end1 ←</text>
  <text x="476" y="318" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">(end0+end1+1)%MOD</text>

  <!-- No (c=='0'): left -->
  <line x1="168" y1="304" x2="148" y2="304" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="156" y="298" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="20" y="286" width="128" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="84" y="304" text-anchor="middle" font-size="11" fill="#333">end0 ←</text>
  <text x="84" y="318" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">(end0+end1)%MOD</text>
  <text x="84" y="336" text-anchor="middle" font-size="10" fill="#d6a040">has0 = 1</text>

  <!-- loop back arrows: from both update boxes up to the "more chars?" diamond top -->
  <!-- right box top (412,286) up to (392,200) area: go up then left into diamond right side -->
  <path d="M 476 286 L 476 200 L 392 200" fill="none" stroke="#666" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="194" font-size="10" fill="#888">继续</text>
  <!-- left box top (84,286) up to (168,200) area -->
  <path d="M 84 286 L 84 200 L 168 200" fill="none" stroke="#666" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="280" font-size="10" fill="#888">继续</text>

  <!-- side note -->
  <rect x="40" y="386" width="480" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="406" font-size="11" fill="#555">要点：</text>
  <text x="100" y="406" font-size="11" fill="#446688" font-weight="bold">① '1' 支路 +1（"1" 本身）</text>
  <text x="270" y="406" font-size="11" fill="#b85450" font-weight="bold">② '0' 支路无 +1（"0" 另算）</text>
  <text x="430" y="406" font-size="11" fill="#4a7a3a" font-weight="bold">③ O(n)/O(1)</text>
</svg>
