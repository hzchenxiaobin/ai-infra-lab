<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="900" height="620" fill="#fdfcf7"/>

  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：桶链表状态变化</text>
  <path d="M 280 38 Q 450 46 620 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="60" y="62" font-size="11" font-weight="bold" fill="#444">操作</text>
  <text x="240" y="62" font-size="11" font-weight="bold" fill="#444">桶链表（head 端=最小计数 → tail 端=最大计数）</text>
  <text x="60" y="78" font-size="9" fill="#888">head ↔ [count:keys] ↔ ... ↔ tail</text>

  <!-- Step 1: inc a -->
  <text x="60" y="104" font-size="11" fill="#2e6e2e" font-weight="bold">① inc("a")</text>
  <g filter="url(#sk)">
    <rect x="220" y="90" width="80" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="260" y="110" text-anchor="middle" font-size="10" fill="#2e6e2e">1: {a}</text>
  <text x="320" y="108" font-size="9" fill="#888">新建 count=1 桶（head 端）</text>

  <!-- Step 2: inc b -->
  <text x="60" y="148" font-size="11" fill="#2e6e2e" font-weight="bold">② inc("b")</text>
  <g filter="url(#sk)">
    <rect x="220" y="134" width="110" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="275" y="154" text-anchor="middle" font-size="10" fill="#2e6e2e">1: {a, b}</text>
  <text x="350" y="152" font-size="9" fill="#888">head.next.count==1 → 加入同桶</text>

  <!-- Step 3: inc b -->
  <text x="60" y="192" font-size="11" fill="#2e6e2e" font-weight="bold">③ inc("b")</text>
  <g filter="url(#sk)">
    <rect x="220" y="178" width="80" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="260" y="198" text-anchor="middle" font-size="10" fill="#2e6e2e">1: {a}</text>
  <path d="M 300 193 L 320 193" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="324" y="178" width="80" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="364" y="198" text-anchor="middle" font-size="10" fill="#7a5415">2: {b}</text>
  <text x="430" y="196" font-size="9" fill="#888">b 从 1 桶搬出，新建 2 桶在后</text>

  <!-- Step 4: inc c -->
  <text x="60" y="236" font-size="11" fill="#2e6e2e" font-weight="bold">④ inc("c")</text>
  <g filter="url(#sk)">
    <rect x="220" y="222" width="110" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="275" y="242" text-anchor="middle" font-size="10" fill="#2e6e2e">1: {a, c}</text>
  <path d="M 330 237 L 350 237" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="354" y="222" width="80" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="394" y="242" text-anchor="middle" font-size="10" fill="#7a5415">2: {b}</text>
  <text x="460" y="240" font-size="9" fill="#888">c 新建，1 桶已有 → 加入</text>

  <!-- Step 5: inc c -->
  <text x="60" y="280" font-size="11" fill="#2e6e2e" font-weight="bold">⑤ inc("c")</text>
  <g filter="url(#sk)">
    <rect x="220" y="266" width="80" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="260" y="286" text-anchor="middle" font-size="10" fill="#2e6e2e">1: {a}</text>
  <path d="M 300 281 L 320 281" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="324" y="266" width="110" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="379" y="286" text-anchor="middle" font-size="10" fill="#7a5415">2: {b, c}</text>
  <text x="460" y="284" font-size="9" fill="#888">c 升 2，next.count==2 → 加入</text>

  <!-- Step 6: inc c -->
  <text x="60" y="324" font-size="11" fill="#2e6e2e" font-weight="bold">⑥ inc("c")</text>
  <g filter="url(#sk)">
    <rect x="220" y="310" width="80" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="260" y="330" text-anchor="middle" font-size="10" fill="#2e6e2e">1: {a}</text>
  <path d="M 300 325 L 320 325" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="324" y="310" width="80" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="364" y="330" text-anchor="middle" font-size="10" fill="#7a5415">2: {b}</text>
  <path d="M 404 325 L 424 325" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="428" y="310" width="80" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="468" y="330" text-anchor="middle" font-size="10" fill="#b85450">3: {c}</text>
  <text x="530" y="328" font-size="9" fill="#888">c 升 3，新建 3 桶；2 桶还有 b 不删</text>

  <!-- Step 7: getMax / getMin -->
  <text x="60" y="368" font-size="11" fill="#4a8edb" font-weight="bold">getMax</text>
  <text x="135" y="368" font-size="11" fill="#444">→ tail.prev = 3 桶 → "c"</text>
  <text x="60" y="384" font-size="11" fill="#4a8edb" font-weight="bold">getMin</text>
  <text x="135" y="384" font-size="11" fill="#444">→ head.next = 1 桶 → "a"</text>

  <!-- Step 8: dec b -->
  <text x="60" y="424" font-size="11" fill="#b85450" font-weight="bold">⑦ dec("b")</text>
  <g filter="url(#sk)">
    <rect x="220" y="410" width="110" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="275" y="430" text-anchor="middle" font-size="10" fill="#2e6e2e">1: {a, b}</text>
  <path d="M 330 425 L 350 425" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="354" y="410" width="80" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="394" y="430" text-anchor="middle" font-size="10" fill="#b85450">3: {c}</text>
  <text x="460" y="428" font-size="9" fill="#888">b 降 1，prev(1 桶).count==1 → 加入</text>
  <text x="460" y="440" font-size="9" fill="#888">旧 2 桶空 → 摘除 ✓</text>

  <!-- legend -->
  <g filter="url(#sk)">
    <rect x="40" y="470" width="820" height="130" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="60" y="494" font-size="13" font-weight="bold" fill="#444">观察要点：</text>
  <text x="60" y="516" font-size="11" fill="#2e6e2e" font-weight="bold">新建桶位置：</text>
  <text x="180" y="516" font-size="11" fill="#444">inc 新 key → count=1 桶恒在 head 端（1 是最小计数）；inc 已有 → 新桶在 oldB 之后</text>
  <text x="60" y="538" font-size="11" fill="#d6a040" font-weight="bold">复用相邻桶：</text>
  <text x="180" y="538" font-size="11" fill="#444">⑤ 中 next.count==2 直接加入；⑦ 中 prev.count==1 直接加入 → 省去新建，O(1)</text>
  <text x="60" y="560" font-size="11" fill="#b85450" font-weight="bold">空桶即摘：</text>
  <text x="180" y="560" font-size="11" fill="#444">⑦ 中 b 离开 2 桶后 2 桶变空，必须从链表移除，否则 getMax 可能命中空桶</text>
  <text x="60" y="582" font-size="11" fill="#4a8edb" font-weight="bold">最值查询：</text>
  <text x="180" y="582" font-size="11" fill="#444">head.next = 最小计数桶，tail.prev = 最大计数桶，O(1) 取任意 key</text>
</svg>
