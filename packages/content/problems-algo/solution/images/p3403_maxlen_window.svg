<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="20" y="30" font-size="13" fill="#333" filter="url(#rough2)">核心观察：单段最长 n − numFriends + 1，每个起点取最长候选</text>

  <!-- Section A: 长度上界 -->
  <text x="20" y="88" font-size="13" fill="#333" filter="url(#rough2)">word =</text>

  <rect x="72" y="68" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="89" y="90" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>
  <rect x="106" y="68" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="123" y="90" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="140" y="68" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="157" y="90" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="174" y="68" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="191" y="90" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>

  <text x="252" y="78" font-size="11" fill="#446688" filter="url(#rough2)">蓝色 = 某一回合拿走的一段</text>
  <text x="252" y="96" font-size="11" fill="#4a7a3a" filter="url(#rough2)">绿色 = 其余 numFriends−1 段</text>
  <text x="252" y="114" font-size="11" fill="#4a7a3a" filter="url(#rough2)">每段至少 1 个字符</text>

  <path d="M72,108 L72,114 L174,114 L174,108" fill="none" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="123" y="130" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">最多 maxLen 个</text>

  <rect x="20" y="146" width="330" height="38" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="170" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">maxLen = n − numFriends + 1 = 4 − 2 + 1 = 3</text>

  <!-- Section B: 枚举起点 -->
  <text x="20" y="216" font-size="13" fill="#333" filter="url(#rough2)">② 枚举起点 i：候选 = word[i : i+maxLen]（越界取到末尾）</text>

  <rect x="52" y="230" width="98" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <text x="20" y="254" font-size="12" fill="#333" filter="url(#rough2)">i=0</text>
  <rect x="60" y="236" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="73" y="254" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">d</text>
  <rect x="88" y="236" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="101" y="254" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">b</text>
  <rect x="116" y="236" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="129" y="254" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">c</text>
  <text x="196" y="254" font-size="12.5" fill="#b85450" filter="url(#rough2)">→ "dbc"  ✓ 答案</text>

  <text x="20" y="294" font-size="12" fill="#333" filter="url(#rough2)">i=1</text>
  <rect x="60" y="276" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="73" y="294" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">b</text>
  <rect x="88" y="276" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="101" y="294" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">c</text>
  <rect x="116" y="276" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="129" y="294" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">a</text>
  <text x="196" y="294" font-size="12.5" fill="#333" filter="url(#rough2)">→ "bca"</text>

  <text x="20" y="334" font-size="12" fill="#333" filter="url(#rough2)">i=2</text>
  <rect x="60" y="316" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="73" y="334" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">c</text>
  <rect x="88" y="316" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="101" y="334" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">a</text>
  <text x="196" y="334" font-size="12.5" fill="#555" filter="url(#rough2)">→ "ca"（右边只剩 2 个字符）</text>

  <text x="20" y="374" font-size="12" fill="#333" filter="url(#rough2)">i=3</text>
  <rect x="60" y="356" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="73" y="374" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">a</text>
  <text x="196" y="374" font-size="12.5" fill="#555" filter="url(#rough2)">→ "a"（i+maxLen 超出 n，取到末尾）</text>

  <rect x="20" y="396" width="480" height="50" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="418" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 同一起点越长越大：真前缀必更小（"db" &lt; "dbc"）</text>
  <text x="260" y="437" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">每个起点只看最长候选，n 个起点取全局最大即可</text>
</svg>
