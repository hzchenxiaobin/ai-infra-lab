<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 490"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="490" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 前缀和 → 两轮锚点枚举（二分）</text>

  <!-- Step 1: sort -->
  <rect x="140" y="34" width="240" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="53" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">按 l 升序排序 ⇒ l、r 均升序（区间不重叠）</text>
  <path d="M 260 64 L 260 78" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- Step 2: prefix sum -->
  <rect x="140" y="80" width="240" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="99" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">pre[i] = 前 i 个区间的硬币总数（前缀和）</text>
  <path d="M 260 110 L 260 118" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- Branch -->
  <path d="M 260 118 L 137 118 L 137 136" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 260 118 L 387 118 L 387 136" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- Left column: candidate 1 -->
  <rect x="30" y="138" width="215" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="137" y="157" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">候选① 枚举 i：窗口 [l[i], l[i]+k−1]</text>
  <path d="M 137 168 L 137 178" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="30" y="180" width="215" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="199" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">二分：最后一个 j 使 r[j] ≤ l[i]+k−1</text>
  <path d="M 137 210 L 137 220" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="30" y="222" width="215" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="241" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">整段 = pre[j+1] − pre[i]</text>
  <path d="M 137 252 L 137 262" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="30" y="264" width="215" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="281" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">若 l[j+1] ≤ l[i]+k−1：</text>
  <text x="137" y="297" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">加零头 c[j+1]×(l[i]+k−l[j+1])</text>

  <!-- Right column: candidate 2 -->
  <rect x="275" y="138" width="215" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="387" y="157" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">候选② 枚举 i：窗口 [r[i]−k+1, r[i]]</text>
  <path d="M 387 168 L 387 178" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="275" y="180" width="215" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="387" y="199" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">二分：第一个 j 使 l[j] ≥ r[i]−k+1</text>
  <path d="M 387 210 L 387 220" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="275" y="222" width="215" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="387" y="241" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">整段 = pre[i+1] − pre[min(j, i+1)]</text>
  <path d="M 387 252 L 387 262" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="275" y="264" width="215" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="387" y="281" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">若 r[j−1] ≥ r[i]−k+1：</text>
  <text x="387" y="297" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">加零头 c[j−1]×(r[j−1]−r[i]+k)</text>

  <!-- Merge -->
  <path d="M 137 308 L 137 330" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 387 308 L 387 330" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="110" y="332" width="300" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="351" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">ans = max(ans, 当前窗口硬币数)</text>
  <path d="M 260 362 L 260 376" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="185" y="378" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="397" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- Side note -->
  <rect x="25" y="424" width="470" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="444" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">复杂度 O(n log n)：排序 + 2n 次二分（n ≤ 1e5）</text>
  <text x="260" y="462" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">两轮的 j 都随 i 单调不减 → 可换双指针做到 O(n)</text>
</svg>
