<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="axarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8aa0"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">曼哈顿半径：可达区是「菱形」，不是圆（r=5）</text>

  <!-- 坐标轴 -->
  <g filter="url(#rough2)">
    <path d="M 134 250 L 444 250" stroke="#7a8aa0" stroke-width="1.3" fill="none" marker-end="url(#axarr)"/>
    <text x="451" y="254" font-size="11" fill="#7a8aa0">x</text>
    <path d="M 290 400 L 290 96" stroke="#7a8aa0" stroke-width="1.3" fill="none" marker-end="url(#axarr)"/>
    <text x="296" y="92" font-size="11" fill="#7a8aa0">y</text>
  </g>

  <!-- 菱形可达区 -->
  <g filter="url(#rough2)">
    <polygon points="420,250 290,120 160,250 290,380" fill="#e8f0fe" fill-opacity="0.55" stroke="#446688" stroke-width="2"/>
  </g>

  <!-- 欧氏圆（误用） -->
  <g filter="url(#rough2)">
    <ellipse cx="290" cy="250" rx="130" ry="130" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="7 5"/>
  </g>

  <!-- 中心点 -->
  <g filter="url(#rough2)">
    <circle cx="290" cy="250" r="5.5" fill="#d6a040" stroke="#8a6d1a" stroke-width="1.5"/>
    <text x="282" y="242" text-anchor="end" font-size="11" fill="#8a6d1a">center(0,0)</text>
  </g>

  <!-- 菱形标注 -->
  <g filter="url(#rough2)">
    <text x="46" y="96" font-size="11.5" fill="#33506b">菱形：|dx|+|dy| ≤ r</text>
    <path d="M 118 106 L 218 176" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- 圆标注 -->
  <g filter="url(#rough2)">
    <text x="436" y="300" font-size="11" fill="#b85450">欧氏圆</text>
    <text x="436" y="314" font-size="10" fill="#b85450">(误用成它)</text>
    <path d="M 432 305 L 416 305" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)"/>
  </g>

  <!-- 塔 A：两度量一致可达 -->
  <g filter="url(#rough2)">
    <rect x="335.5" y="191.5" width="13" height="13" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="342" y="202" text-anchor="middle" font-size="10" fill="#2f5d24">A</text>
    <text x="352" y="193" font-size="10.5" fill="#2f5d24">A(2,2)</text>
    <text x="352" y="208" font-size="10.5" fill="#2f5d24">d=4 ✓</text>
  </g>

  <!-- 塔 B：圆上、菱形外 -->
  <g filter="url(#rough2)">
    <rect x="387.5" y="165.5" width="13" height="13" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <text x="394" y="176" text-anchor="middle" font-size="10" fill="#b85450">B</text>
    <text x="404" y="158" font-size="10.5" fill="#b85450">B(4,3)</text>
    <text x="404" y="172" font-size="10.5" fill="#b85450">曼哈顿=7 ✗</text>
    <text x="404" y="186" font-size="10.5" fill="#b85450">欧氏=5 在圆上</text>
  </g>

  <!-- 塔 C：轴向位置，两度量一致 -->
  <g filter="url(#rough2)">
    <rect x="387.5" y="243.5" width="13" height="13" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="394" y="254" text-anchor="middle" font-size="10" fill="#2f5d24">C</text>
    <text x="412" y="272" font-size="10.5" fill="#2f5d24">C(4,0) 曼哈顿=4 ✓</text>
  </g>

  <!-- 底部说明 -->
  <g filter="url(#rough2)">
    <rect x="64" y="408" width="436" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="282" y="428" text-anchor="middle" font-size="11.5" fill="#8a6d1a">d = |x−cx| + |y−cy|：方向代价 1 · 斜向代价 2（出租车几何）</text>
    <text x="282" y="446" text-anchor="middle" font-size="10.5" fill="#8a6d1a">两度量只在「斜向」处分道扬镳：B 在圆内、菱形外——误用欧氏即误判</text>
  </g>
</svg>
