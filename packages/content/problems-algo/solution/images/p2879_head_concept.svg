<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">head(3)：按位置取前缀，不看列值</text>

  <!-- Left: employees 6 rows -->
  <rect x="30" y="58" width="185" height="224" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="122" y="78" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">employees（6 行）</text>

  <rect x="45" y="88" width="28" height="22" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="75" y="88" width="62" height="22" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="139" y="88" width="62" height="22" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="59" y="103" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)"></text>
  <text x="106" y="103" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">employee_id</text>
  <text x="170" y="103" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">name</text>

  <rect x="45" y="112" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="75" y="112" width="62" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="139" y="112" width="62" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="59" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="106" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="170" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Bob</text>

  <rect x="45" y="138" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="75" y="138" width="62" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="139" y="138" width="62" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="59" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="106" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">90</text>
  <text x="170" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Alice</text>

  <rect x="45" y="164" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="75" y="164" width="62" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="139" y="164" width="62" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="59" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="106" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">9</text>
  <text x="170" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Tatiana</text>

  <rect x="45" y="190" width="28" height="24" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="75" y="190" width="62" height="24" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="139" y="190" width="62" height="24" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="59" y="206" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>
  <text x="106" y="206" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">60</text>
  <text x="170" y="206" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">Annabelle</text>

  <rect x="45" y="216" width="28" height="24" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="75" y="216" width="62" height="24" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="139" y="216" width="62" height="24" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="59" y="232" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4</text>
  <text x="106" y="232" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">49</text>
  <text x="170" y="232" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">Jonathan</text>

  <rect x="45" y="242" width="28" height="24" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="75" y="242" width="62" height="24" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="139" y="242" width="62" height="24" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="59" y="258" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">5</text>
  <text x="106" y="258" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">43</text>
  <text x="170" y="258" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">Khaled</text>

  <text x="122" y="298" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">前 3 行 = 位置 0~2（绿色高亮）</text>

  <!-- Middle arrow + head(3) -->
  <path d="M 222 140 L 336 140" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="279" y="130" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">从行标签 0 起数 3 行</text>

  <rect x="228" y="165" width="104" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="188" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">employees</text>
  <text x="280" y="208" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">.head(3)</text>

  <text x="280" y="248" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">纯位置计算，不看任何列的值</text>

  <!-- Right: new 3-row DataFrame -->
  <rect x="345" y="58" width="185" height="170" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="437" y="78" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">新 DataFrame（3 行）</text>

  <rect x="360" y="88" width="28" height="22" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="390" y="88" width="62" height="22" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="454" y="88" width="62" height="22" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="374" y="103" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)"></text>
  <text x="421" y="103" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">employee_id</text>
  <text x="485" y="103" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">name</text>

  <rect x="360" y="112" width="28" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="390" y="112" width="62" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="454" y="112" width="62" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="374" y="128" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="421" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="485" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Bob</text>

  <rect x="360" y="138" width="28" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="390" y="138" width="62" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="454" y="138" width="62" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="374" y="154" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="421" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">90</text>
  <text x="485" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Alice</text>

  <rect x="360" y="164" width="28" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="390" y="164" width="62" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="454" y="164" width="62" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="374" y="180" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="421" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">9</text>
  <text x="485" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Tatiana</text>

  <text x="437" y="212" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">顺序与索引原样保留，原表不动</text>

  <!-- Bottom warning -->
  <rect x="40" y="312" width="480" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⚠️ 排序陷阱</text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">id 乱序（3, 90, 9）也照单全收——head 不认识 employee_id</text>
  <text x="280" y="374" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">先 sort_values 再取前 3 → 得 3, 9, 43，直接判错</text>
</svg>
