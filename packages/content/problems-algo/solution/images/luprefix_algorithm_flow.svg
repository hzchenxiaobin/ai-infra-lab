<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">算法流程：标记 + 推进指针</text>

  <!-- upload(v) -->
  <rect x="150" y="58" width="260" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="90" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">upload(video)</text>

  <path d="M280 112 L280 132" stroke="#446688" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- mark seen -->
  <rect x="120" y="136" width="320" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="168" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">seen[video] = true（标记已上传）</text>

  <path d="M280 190 L280 210" stroke="#446688" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="280,214 420,266 280,318 140,266" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">ans &lt; n 且</text>
  <text x="280" y="276" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">seen[ans+1] == true ?</text>

  <!-- Yes branch: ans++ loop -->
  <path d="M420 266 L476 266 L476 214 L420 214" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="448" y="258" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="436" y="226" width="84" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="478" y="250" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ans++</text>

  <!-- No branch -->
  <path d="M280 318 L280 348" stroke="#888" stroke-width="1.4" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="296" y="340" text-anchor="start" font-size="12" fill="#888" filter="url(#rough2)">否（断链/越界）</text>

  <!-- upload done -->
  <rect x="140" y="352" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">upload 返回（ans 已是最长前缀）</text>

  <!-- longest() box -->
  <rect x="120" y="420" width="320" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="444" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">longest()</text>
  <text x="280" y="466" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">直接 return ans → O(1)</text>
  <text x="280" y="482" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">（指针已在 upload 时维护完毕）</text>
</svg>
