<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：s[i] 直接放到 result[indices[i]]，一次遍历完成</text>

  <!-- ===== Top row: s with indices ===== -->
  <text x="30" y="74" font-size="11" fill="#888">s =</text>

  <!-- char c i=0 -> 4 -->
  <rect x="70" y="56" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="93" y="78" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">c</text>
  <text x="93" y="104" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i=0</text>

  <!-- char o i=1 -> 5 -->
  <rect x="124" y="56" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="78" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">o</text>
  <text x="147" y="104" text-anchor="middle" font-size="10" fill="#888">i=1</text>

  <!-- char d i=2 -> 6 -->
  <rect x="178" y="56" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="201" y="78" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">d</text>
  <text x="201" y="104" text-anchor="middle" font-size="10" fill="#888">i=2</text>

  <!-- char e i=3 -> 7 -->
  <rect x="232" y="56" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="78" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">e</text>
  <text x="255" y="104" text-anchor="middle" font-size="10" fill="#888">i=3</text>

  <!-- char l i=4 -> 0 -->
  <rect x="286" y="56" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="309" y="78" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">l</text>
  <text x="309" y="104" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">i=4</text>

  <!-- char e i=5 -> 2 -->
  <rect x="340" y="56" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="363" y="78" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">e</text>
  <text x="363" y="104" text-anchor="middle" font-size="10" fill="#888">i=5</text>

  <!-- char e i=6 -> 1 -->
  <rect x="394" y="56" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="417" y="78" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">e</text>
  <text x="417" y="104" text-anchor="middle" font-size="10" fill="#888">i=6</text>

  <!-- char t i=7 -> 3 -->
  <rect x="448" y="56" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="471" y="78" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">t</text>
  <text x="471" y="104" text-anchor="middle" font-size="10" fill="#888">i=7</text>

  <!-- indices row label -->
  <text x="30" y="138" font-size="11" fill="#888">indices =</text>
  <text x="93" y="138" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>
  <text x="147" y="138" text-anchor="middle" font-size="10" fill="#888">5</text>
  <text x="201" y="138" text-anchor="middle" font-size="10" fill="#888">6</text>
  <text x="255" y="138" text-anchor="middle" font-size="10" fill="#888">7</text>
  <text x="309" y="138" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0</text>
  <text x="363" y="138" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="417" y="138" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="471" y="138" text-anchor="middle" font-size="10" fill="#888">3</text>

  <!-- ===== Thin gray curves for all mappings ===== -->
  <!-- i=1 o -> 5 : 147 -> 363 -->
  <path d="M 147 88 Q 255 170 363 250" stroke="#ccc" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- i=2 d -> 6 : 201 -> 417 -->
  <path d="M 201 88 Q 309 170 417 250" stroke="#ccc" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- i=3 e -> 7 : 255 -> 471 -->
  <path d="M 255 88 Q 363 170 471 250" stroke="#ccc" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- i=5 e -> 2 : 363 -> 201 -->
  <path d="M 363 88 Q 282 170 201 250" stroke="#ccc" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- i=6 e -> 1 : 417 -> 147 -->
  <path d="M 417 88 Q 282 170 147 250" stroke="#ccc" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- i=7 t -> 3 : 471 -> 255 -->
  <path d="M 471 88 Q 363 170 255 250" stroke="#ccc" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Highlighted arrows ===== -->
  <!-- i=0 c -> 4 : 93 -> 309 (blue) -->
  <path d="M 93 88 Q 201 165 309 250" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="170" y="150" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">s[0]→res[4]</text>

  <!-- i=4 l -> 0 : 309 -> 93 (green) -->
  <path d="M 309 88 Q 201 185 93 250" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="195" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">s[4]→res[0]</text>

  <!-- ===== Bottom row: result ===== -->
  <text x="30" y="270" font-size="11" fill="#888">result =</text>

  <rect x="70" y="252" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="93" y="274" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">l</text>
  <text x="93" y="298" text-anchor="middle" font-size="9" fill="#888">j=0</text>

  <rect x="124" y="252" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="274" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">e</text>
  <text x="147" y="298" text-anchor="middle" font-size="9" fill="#888">j=1</text>

  <rect x="178" y="252" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="201" y="274" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">e</text>
  <text x="201" y="298" text-anchor="middle" font-size="9" fill="#888">j=2</text>

  <rect x="232" y="252" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="274" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">t</text>
  <text x="255" y="298" text-anchor="middle" font-size="9" fill="#888">j=3</text>

  <rect x="286" y="252" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="309" y="274" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">c</text>
  <text x="309" y="298" text-anchor="middle" font-size="9" fill="#888">j=4</text>

  <rect x="340" y="252" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="363" y="274" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">o</text>
  <text x="363" y="298" text-anchor="middle" font-size="9" fill="#888">j=5</text>

  <rect x="394" y="252" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="417" y="274" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">d</text>
  <text x="417" y="298" text-anchor="middle" font-size="9" fill="#888">j=6</text>

  <rect x="448" y="252" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="471" y="274" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">e</text>
  <text x="471" y="298" text-anchor="middle" font-size="9" fill="#888">j=7</text>

  <!-- ===== Key insight box ===== -->
  <rect x="30" y="316" width="500" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="338" font-size="12" fill="#444" font-weight="bold">反转查找方向：对每个源 i，直接把 s[i] 放到 indices[i]</text>
  <text x="50" y="358" font-size="11" fill="#666">顺着给定映射走 → O(1) 直达；而非「对每个目标 j 扫描找源」→ O(n) 求逆</text>
  <text x="50" y="380" font-size="12" fill="#b85450" font-weight="bold">→ result[indices[i]] = s[i]，一次遍历 O(n) 完成</text>
</svg>
