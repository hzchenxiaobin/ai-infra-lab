<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">示例演算：s="abcdefghij", k=3, fill='x'（n=10）</text>

  <!-- ====== Header row ====== -->
  <rect x="24" y="44" width="532" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="50" y="62" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">步</text>
  <text x="92" y="62" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i</text>
  <text x="180" y="62" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">s[i : i+k]</text>
  <text x="268" y="62" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">len</text>
  <text x="330" y="62" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">填充?</text>
  <text x="410" y="62" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">组结果</text>
  <text x="500" y="62" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">res 累积</text>

  <!-- ====== Row 1: step 1, i=0, abc ====== -->
  <rect x="24" y="74" width="532" height="30" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="93" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="92" y="93" text-anchor="middle" font-size="11" fill="#333">0</text>
  <!-- mini boxes a b c -->
  <rect x="146" y="78" width="20" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="156" y="93" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">a</text>
  <rect x="168" y="78" width="20" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="178" y="93" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">b</text>
  <rect x="190" y="78" width="20" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="200" y="93" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">c</text>
  <text x="268" y="93" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="330" y="93" text-anchor="middle" font-size="10" fill="#888">否</text>
  <text x="410" y="93" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"abc"</text>
  <text x="500" y="93" text-anchor="middle" font-size="9" fill="#4a7a3a">["abc"]</text>

  <!-- ====== Row 2: step 2, i=3, def ====== -->
  <rect x="24" y="106" width="532" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="125" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="92" y="125" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="146" y="110" width="20" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="156" y="125" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">d</text>
  <rect x="168" y="110" width="20" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="178" y="125" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">e</text>
  <rect x="190" y="110" width="20" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="200" y="125" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">f</text>
  <text x="268" y="125" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="330" y="125" text-anchor="middle" font-size="10" fill="#888">否</text>
  <text x="410" y="125" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"def"</text>
  <text x="500" y="125" text-anchor="middle" font-size="9" fill="#4a7a3a">["abc","def"]</text>

  <!-- ====== Row 3: step 3, i=6, ghi ====== -->
  <rect x="24" y="138" width="532" height="30" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="157" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="92" y="157" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="146" y="142" width="20" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="156" y="157" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">g</text>
  <rect x="168" y="142" width="20" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="178" y="157" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">h</text>
  <rect x="190" y="142" width="20" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="200" y="157" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">i</text>
  <text x="268" y="157" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="330" y="157" text-anchor="middle" font-size="10" fill="#888">否</text>
  <text x="410" y="157" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"ghi"</text>
  <text x="500" y="157" text-anchor="middle" font-size="8" fill="#4a7a3a">["abc","def","ghi"]</text>

  <!-- ====== Row 4: step 4, i=9, j → jxx (padded) ====== -->
  <rect x="24" y="170" width="532" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="50" y="189" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="92" y="189" text-anchor="middle" font-size="11" fill="#333">9</text>
  <!-- j (real) + x x (fill) -->
  <rect x="146" y="174" width="20" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="156" y="189" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">j</text>
  <rect x="168" y="174" width="20" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="178" y="189" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">x</text>
  <rect x="190" y="174" width="20" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="200" y="189" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">x</text>
  <text x="268" y="189" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="330" y="189" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">是 +xx</text>
  <text x="410" y="189" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">"jxx"</text>
  <text x="500" y="189" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">[…,"jxx"]</text>

  <!-- ====== Row 5: stop ====== -->
  <rect x="24" y="202" width="532" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="50" y="221" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">—</text>
  <text x="92" y="221" text-anchor="middle" font-size="11" fill="#b85450">12</text>
  <text x="180" y="221" text-anchor="middle" font-size="10" fill="#b85450">i = 12 ≥ n = 10</text>
  <text x="330" y="221" text-anchor="middle" font-size="10" fill="#b85450">停止</text>
  <text x="410" y="221" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="500" y="221" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">返回 res ✓</text>

  <!-- divider -->
  <path d="M 24 244 L 556 244" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Summary box -->
  <rect x="60" y="258" width="460" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="280" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最终结果：["abc", "def", "ghi", "jxx"]</text>
  <text x="290" y="298" text-anchor="middle" font-size="10" fill="#555">循环 ⌈10/3⌉ = 4 次，前 3 组各 3 字符无需填充</text>
  <text x="290" y="314" text-anchor="middle" font-size="10" fill="#d6a040">第 4 组仅剩 1 字符 'j'，补 2 个 'x' 凑满 k=3</text>
</svg>
