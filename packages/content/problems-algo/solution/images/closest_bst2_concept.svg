<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">双栈迭代器：前驱栈（&lt; target 递减）+ 后继栈（≥ target 递增）</text>

  <!-- BST Tree -->
  <text x="20" y="52" font-size="11" fill="#888">BST（target=3.71）</text>

  <circle cx="110" cy="82" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="87" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <circle cx="75" cy="136" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="75" y="140" text-anchor="middle" font-size="11" fill="#333">2</text>
  <line x1="98" y1="96" x2="82" y2="124" stroke="#666" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="145" cy="136" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="145" y="140" text-anchor="middle" font-size="11" fill="#333">5</text>
  <line x1="122" y1="96" x2="138" y2="124" stroke="#666" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="48" cy="190" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="48" y="194" text-anchor="middle" font-size="10" fill="#333">1</text>
  <line x1="65" y1="148" x2="54" y2="180" stroke="#666" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="102" cy="190" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="102" y="194" text-anchor="middle" font-size="10" fill="#333">3</text>
  <line x1="85" y1="148" x2="96" y2="180" stroke="#666" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- Divider -->
  <line x1="185" y1="48" x2="185" y2="210" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- Pred Stack -->
  <text x="270" y="52" font-size="11" fill="#4a7a3a" font-weight="bold">前驱栈（&lt; target）</text>
  <rect x="240" y="62" width="60" height="120" fill="none" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3,3" rx="4" filter="url(#rough2)"/>
  <rect x="246" y="68" width="48" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="300" y="84" font-size="9" fill="#b85450">←top</text>
  <rect x="246" y="98" width="48" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="270" y="114" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="246" y="128" width="48" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="270" y="144" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="270" y="170" text-anchor="middle" font-size="9" fill="#4a7a3a">↓ 递减</text>

  <!-- Succ Stack -->
  <text x="410" y="52" font-size="11" fill="#446688" font-weight="bold">后继栈（≥ target）</text>
  <rect x="380" y="62" width="60" height="90" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="3,3" rx="4" filter="url(#rough2)"/>
  <rect x="386" y="68" width="48" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="440" y="84" font-size="9" fill="#b85450">←top</text>
  <rect x="386" y="98" width="48" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="410" y="114" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="410" y="140" text-anchor="middle" font-size="9" fill="#446688">↓ 递增</text>

  <!-- Compare arrow -->
  <path d="M 294 80 L 376 80" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="335" y="73" text-anchor="middle" font-size="9" fill="#b85450">比较 top</text>

  <!-- Replenish annotation -->
  <text x="490" y="52" font-size="9" fill="#888">弹出后补充：</text>
  <text x="490" y="68" font-size="9" fill="#4a7a3a">pred → 压左子树右脊</text>
  <text x="490" y="82" font-size="9" fill="#446688">succ → 压右子树左脊</text>

  <!-- Number line -->
  <text x="20" y="222" font-size="11" fill="#888">中序序列（升序）：</text>
  <line x1="50" y1="250" x2="530" y2="250" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 525 245 L 535 250 L 525 255" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <circle cx="110" cy="250" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="110" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>
  <circle cx="190" cy="250" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="190" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a">2</text>
  <circle cx="270" cy="250" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="270" y="270" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>

  <path d="M 290 238 L 290 262" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="290" y="234" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3.71</text>

  <circle cx="350" cy="250" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="350" y="270" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>
  <circle cx="430" cy="250" r="4" fill="#446688" filter="url(#rough2)"/>
  <text x="430" y="270" text-anchor="middle" font-size="11" fill="#446688">5</text>

  <text x="270" y="288" text-anchor="middle" font-size="9" fill="#4a7a3a">← 前驱（递减）</text>
  <text x="350" y="288" text-anchor="middle" font-size="9" fill="#446688">后继（递增）→</text>

  <!-- Merge explanation -->
  <rect x="30" y="300" width="520" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="318" font-size="10.5" fill="#333">每次比较两栈 top 与 target 的距离，取更近者；弹出后从其子树补充同方向下一节点</text>

  <!-- Result -->
  <rect x="30" y="338" width="520" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="356" font-size="10.5" fill="#333">k=2：① |3.71−4|=0.29 &lt; |3.71−3|=0.71 → 取 4；② 再取 3 → 结果 [4, 3]</text>

  <!-- Complexity -->
  <rect x="30" y="370" width="520" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="50" y="385" font-size="10" fill="#888">初始化 O(h)（沿搜索路径建栈）+ k 轮 O(h) 补充 = O(h + k·h)，平衡 BST 下 O(k log n)</text>
</svg>
