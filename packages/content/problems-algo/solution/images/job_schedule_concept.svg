<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心：按 endTime 排序 + DP「选/不选」+ 二分找不冲突工作</text>

  <!-- Top: timeline with sorted jobs -->
  <text x="280" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 按 endTime 升序排列工作（时间轴）</text>

  <!-- timeline axis -->
  <line x1="50" y1="96" x2="510" y2="96" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="48" y="100" text-anchor="end" font-size="9" fill="#888">0</text>
  <text x="138" y="100" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="226" y="100" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="314" y="100" text-anchor="middle" font-size="9" fill="#888">6</text>

  <!-- Job 1: [1,3] p=50 -->
  <rect x="88" y="62" width="88" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="132" y="79" text-anchor="middle" font-size="9.5" fill="#333">①[1-3] p=50</text>

  <!-- Job 2: [2,4] p=10 -->
  <rect x="132" y="100" width="88" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="176" y="117" text-anchor="middle" font-size="9.5" fill="#333">②[2-4] p=10</text>

  <!-- Job 3: [3,5] p=40 -->
  <rect x="176" y="62" width="88" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="220" y="79" text-anchor="middle" font-size="9.5" fill="#333">③[3-5] p=40</text>

  <!-- Job 4: [3,6] p=70 (highlighted) -->
  <rect x="176" y="100" width="132" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="242" y="117" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">④[3-6] p=70</text>

  <!-- arrow showing sort direction -->
  <path d="M 320 113 L 340 113" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="358" y="117" font-size="9.5" fill="#666">endTime ↑</text>

  <!-- Middle: DP decision for job i -->
  <text x="280" y="158" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">② 对工作 i 做决策：选 or 不选？</text>

  <!-- decision diamond -->
  <polygon points="280,168 380,202 280,236 180,202" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">工作 i</text>
  <text x="280" y="210" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">选不选？</text>

  <!-- Skip branch (left) -->
  <path d="M 180 202 L 110 202" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="142" y="196" font-size="9.5" fill="#b85450" font-weight="bold">不选</text>
  <rect x="22" y="186" width="84" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="64" y="202" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">dp[i-1]</text>
  <text x="64" y="214" text-anchor="middle" font-size="9" fill="#b85450">继承前 i-1 个</text>

  <!-- Take branch (right) -->
  <path d="M 380 202 L 440 202" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="398" y="196" font-size="9.5" fill="#4a7a3a" font-weight="bold">选</text>
  <rect x="446" y="180" width="98" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="495" y="197" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">profit[i]</text>
  <text x="495" y="210" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">+ dp[j]</text>
  <text x="495" y="221" text-anchor="middle" font-size="8.5" fill="#4a7a3a">j=最近不冲突</text>

  <!-- dp[i] = max -->
  <text x="280" y="262" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">dp[i] = max( 不选, 选 )</text>

  <!-- Bottom: binary search to find j -->
  <text x="280" y="290" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">③ 二分查找 j：endTime[j] ≤ startTime[i] 的最大下标</text>

  <rect x="30" y="302" width="500" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>

  <!-- sorted endTimes row -->
  <text x="50" y="318" font-size="9.5" fill="#446688" font-weight="bold">endTime:</text>
  <rect x="110" y="308" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="135" y="323" text-anchor="middle" font-size="9.5" fill="#333">3</text>
  <rect x="162" y="308" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="187" y="323" text-anchor="middle" font-size="9.5" fill="#333">4</text>
  <rect x="214" y="308" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="239" y="323" text-anchor="middle" font-size="9.5" fill="#333">5</text>
  <rect x="266" y="308" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="291" y="323" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">6</text>

  <!-- startTime[i]=3 marker -->
  <text x="332" y="318" font-size="9.5" fill="#d6a040" font-weight="bold">startTime④=3</text>

  <!-- arrow pointing to first endTime <= 3 -->
  <text x="60" y="350" font-size="9.5" fill="#4a7a3a" font-weight="bold">j=1 ←</text>
  <path d="M 92 346 L 130 332" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="3,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="110" y="352" font-size="9" fill="#4a7a3a">endTime=3 ≤ 3 ✓</text>

  <text x="250" y="352" font-size="9" fill="#888">二分 O(log n) 定位</text>

  <!-- bottom note -->
  <rect x="30" y="372" width="500" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="50" y="392" font-size="10" fill="#333">💡 <tspan fill="#d6a040" font-weight="bold">关键转化</tspan>：每个工作只有「选/不选」两种决策。选 i 时必须跳过所有</text>
  <text x="50" y="408" font-size="10" fill="#333">与之冲突的工作 → 用二分快速定位「 endTime ≤ startTime[i] 的最近工作 j 」</text>
  <text x="50" y="420" font-size="10" fill="#333">排好序后 j 可二分 → 整体 O(n log n)</text>
</svg>
