<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">网格 DP：当前格最优 = 上方/左方较小者 + 本格值</text>

  <!-- grid label -->
  <text x="60" y="100" font-size="12" fill="#888">grid:</text>

  <!-- 3x3 grid : cell w=64 h=48 -->
  <!-- row 0 -->
  <rect x="120" y="72" width="64" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="152" y="102" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="184" y="72" width="64" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="102" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>
  <rect x="248" y="72" width="64" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="102" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <!-- row 1 -->
  <rect x="120" y="120" width="64" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="150" text-anchor="middle" font-size="15" fill="#333">1</text>
  <rect x="184" y="120" width="64" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="150" text-anchor="middle" font-size="15" fill="#333">5</text>
  <rect x="248" y="120" width="64" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="150" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <!-- row 2 -->
  <rect x="120" y="168" width="64" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="198" text-anchor="middle" font-size="15" fill="#333">4</text>
  <rect x="184" y="168" width="64" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="198" text-anchor="middle" font-size="15" fill="#333">2</text>
  <rect x="248" y="168" width="64" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="198" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>

  <!-- optimal path arrows through cell centers: (0,0)->(0,1)->(0,2)->(1,2)->(2,2) -->
  <path d="M 152 96 L 210 96" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 216 96 L 274 96" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 280 108 L 280 138" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 280 156 L 280 186" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- start / end markers -->
  <text x="152" y="64" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">起</text>
  <text x="280" y="232" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">终 (答案=7)</text>

  <!-- recurrence illustration on the right -->
  <text x="400" y="60" font-size="12.5" fill="#446688" font-weight="bold">看 (1,1) 这个格子：</text>

  <!-- from above (0,1) -->
  <rect x="370" y="78" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="394" y="101" text-anchor="middle" font-size="12" fill="#333">上方</text>
  <path d="M 394 116 L 394 138" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- from left (1,0) -->
  <rect x="316" y="144" width="48" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="340" y="167" text-anchor="middle" font-size="12" fill="#333">左方</text>
  <path d="M 366 162 L 388 162" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- current cell -->
  <rect x="390" y="144" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="418" y="169" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">(i,j)</text>

  <!-- recurrence box -->
  <rect x="40" y="270" width="480" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">状态转移：</text>
  <text x="280" y="322" text-anchor="middle" font-size="14.5" fill="#b85450" font-weight="bold">dp[i][j] = min(dp[i−1][j], dp[i][j−1]) + grid[i][j]</text>
  <text x="280" y="342" text-anchor="middle" font-size="10.5" fill="#888">只能从上或左走来 → 无后效性；子结构最优 → 取较小者累加</text>
</svg>
