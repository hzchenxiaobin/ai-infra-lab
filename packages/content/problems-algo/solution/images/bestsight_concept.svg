<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：score = (values[i] + i) + (values[j] − j)，左右两项独立优化</text>

  <!-- ===== Formula decomposition ===== -->
  <text x="40" y="58" font-size="12" fill="#888">得分公式拆分：</text>

  <!-- original formula -->
  <rect x="60" y="68" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="90" text-anchor="middle" font-size="13" fill="#333">score(i, j) = values[i] + values[j] + i − j</text>

  <!-- split arrows -->
  <path d="M 175 102 L 175 116" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 385 102 L 385 116" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="113" text-anchor="middle" font-size="10" fill="#888">重新分组</text>

  <!-- left part (green) -->
  <rect x="60" y="120" width="210" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="165" y="142" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">L(i) = values[i] + i</text>

  <!-- plus sign -->
  <text x="280" y="142" text-anchor="middle" font-size="16" fill="#888" font-weight="bold">+</text>

  <!-- right part (blue) -->
  <rect x="290" y="120" width="210" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="395" y="142" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">R(j) = values[j] − j</text>

  <!-- annotations -->
  <text x="165" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a">只依赖 i（左景点）</text>
  <text x="395" y="172" text-anchor="middle" font-size="11" fill="#446688">只依赖 j（右景点）</text>

  <!-- ===== Array with contributions for [8,1,5,2,6] ===== -->
  <text x="40" y="200" font-size="12" fill="#888">以 values = [8, 1, 5, 2, 6] 为例：</text>

  <!-- index row -->
  <text x="40" y="226" font-size="11" fill="#999">i / j</text>
  <rect x="100" y="212" width="60" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="130" y="230" text-anchor="middle" font-size="11" fill="#888">0</text>
  <rect x="164" y="212" width="60" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="194" y="230" text-anchor="middle" font-size="11" fill="#888">1</text>
  <rect x="228" y="212" width="60" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="258" y="230" text-anchor="middle" font-size="11" fill="#888">2</text>
  <rect x="292" y="212" width="60" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="322" y="230" text-anchor="middle" font-size="11" fill="#888">3</text>
  <rect x="356" y="212" width="60" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="386" y="230" text-anchor="middle" font-size="11" fill="#888">4</text>

  <!-- values row -->
  <text x="40" y="260" font-size="11" fill="#999">values</text>
  <rect x="100" y="246" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <rect x="164" y="246" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="228" y="246" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="292" y="246" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="356" y="246" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="386" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>

  <!-- L(i) = values[i] + i row (green) -->
  <text x="40" y="294" font-size="11" fill="#4a7a3a" font-weight="bold">L(i)</text>
  <rect x="100" y="280" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="298" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <rect x="164" y="280" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="298" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="228" y="280" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="298" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="292" y="280" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="298" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="356" y="280" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="386" y="298" text-anchor="middle" font-size="12" fill="#333">10</text>

  <!-- R(j) = values[j] - j row (blue) -->
  <text x="40" y="328" font-size="11" fill="#446688" font-weight="bold">R(j)</text>
  <rect x="100" y="314" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="332" text-anchor="middle" font-size="12" fill="#333">8</text>
  <rect x="164" y="314" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="332" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="228" y="314" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="258" y="332" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="292" y="314" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="332" text-anchor="middle" font-size="12" fill="#333">−1</text>
  <rect x="356" y="314" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="386" y="332" text-anchor="middle" font-size="12" fill="#333">2</text>

  <!-- arrow from L(0)=8 and R(2)=3 to answer 11 -->
  <path d="M 130 306 L 130 348 L 250 372" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <path d="M 258 340 L 258 372" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>

  <!-- answer callout -->
  <rect x="170" y="372" width="170" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="255" y="393" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">j=2: maxLeft=8, 8+3=11 ⭐</text>

  <!-- right summary note -->
  <rect x="430" y="226" width="120" height="178" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="490" y="250" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键转化</text>
  <text x="490" y="274" text-anchor="middle" font-size="11" fill="#666">固定 j 时</text>
  <text x="490" y="292" text-anchor="middle" font-size="11" fill="#666">score = maxLeft + R(j)</text>
  <text x="490" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a">maxLeft =</text>
  <text x="490" y="332" text-anchor="middle" font-size="11" fill="#4a7a3a">max L(i), i &lt; j</text>
  <text x="490" y="356" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">扫描 j 时</text>
  <text x="490" y="372" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">顺带维护 maxLeft</text>
  <text x="490" y="396" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">→ O(n) 一次扫描</text>
</svg>
