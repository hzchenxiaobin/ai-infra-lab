<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="620" height="540" fill="#fdfcf7"/>

  <text x="310" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">算法流程：数岛 → 枚举单格 → 返回 2</text>

  <!-- (1) Start -->
  <g filter="url(#sk)"><ellipse cx="310" cy="64" rx="130" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="310" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">对原网格数岛屿数 cnt</text>
  <path d="M 310 84 L 310 98" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- (2) decision: cnt != 1 ? -->
  <g filter="url(#sk)"><polygon points="310,100 420,148 310,196 200,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="310" y="144" text-anchor="middle" font-size="12" fill="#333">cnt ≠ 1 ?</text>
  <text x="310" y="160" text-anchor="middle" font-size="10" fill="#888">(0 或 ≥2 座，已分离)</text>

  <!-- Yes -> return 0 (right) -->
  <path d="M 420 148 L 470 148" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="445" y="142" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="472" y="128" width="120" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="532" y="146" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 0</text>
  <text x="532" y="160" text-anchor="middle" font-size="10" fill="#5a7a4a">(已分离)</text>

  <!-- No -> down to (3) enumerate -->
  <path d="M 310 196 L 310 212" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="324" y="208" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- (3) enumerate each land cell -->
  <g filter="url(#sk)"><rect x="220" y="214" width="180" height="38" rx="6" fill="#fffdf7" stroke="#5a5a5a" stroke-width="1.5"/></g>
  <text x="310" y="238" text-anchor="middle" font-size="12" fill="#333">枚举每个陆地格 (i,j)</text>
  <path d="M 310 252 L 310 266" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- (4) temporarily set to 0 -->
  <g filter="url(#sk)"><rect x="210" y="268" width="200" height="38" rx="6" fill="#fffdf7" stroke="#5a5a5a" stroke-width="1.5"/></g>
  <text x="310" y="292" text-anchor="middle" font-size="12" fill="#333">临时 grid[i][j] = 0，再数岛 cnt'</text>
  <path d="M 310 306 L 310 320" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- (5) decision: cnt' != 1 ? -->
  <g filter="url(#sk)"><polygon points="310,322 420,366 310,410 200,366" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="310" y="362" text-anchor="middle" font-size="12" fill="#333">cnt' ≠ 1 ?</text>
  <text x="310" y="378" text-anchor="middle" font-size="10" fill="#888">(i,j) 是割点</text>

  <!-- Yes -> return 1 (right) -->
  <path d="M 420 366 L 470 366" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="445" y="360" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="472" y="346" width="120" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="532" y="364" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 1</text>
  <text x="532" y="378" text-anchor="middle" font-size="10" fill="#a04642">(找到割点)</text>

  <!-- No -> left: restore & loop check -->
  <path d="M 200 366 L 150 366" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="175" y="360" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- (6) restore -->
  <g filter="url(#sk)"><rect x="40" y="346" width="110" height="40" rx="6" fill="#fffdf7" stroke="#5a5a5a" stroke-width="1.5"/></g>
  <text x="95" y="364" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">还原</text>
  <text x="95" y="378" text-anchor="middle" font-size="10" fill="#555">grid[i][j]=1</text>
  <path d="M 95 346 L 95 318" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- (7) decision: more cells? -->
  <g filter="url(#sk)"><polygon points="95,316 160,286 95,256 30,286" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="95" y="282" text-anchor="middle" font-size="10" fill="#333">还有未枚</text>
  <text x="95" y="294" text-anchor="middle" font-size="10" fill="#333">举的格?</text>

  <!-- Yes -> loop back to (3) enumerate (right then up) -->
  <path d="M 160 286 L 200 286 L 200 233 L 220 233" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="180" y="280" font-size="10" fill="#b85450" font-weight="bold">是·下一格</text>

  <!-- No -> return 2 (down) -->
  <path d="M 95 316 L 95 440" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="110" y="380" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- terminal: return 2 -->
  <g filter="url(#sk)"><rect x="35" y="442" width="120" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="95" y="466" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">返回 2</text>
  <text x="95" y="480" text-anchor="middle" font-size="10" fill="#5a7a4a">(无割点，由引理)</text>

  <!-- legend -->
  <g filter="url(#sk)"><rect x="460" y="440" width="140" height="74" rx="6" fill="#fffdf7" stroke="#bbb" stroke-width="1"/></g>
  <text x="470" y="458" font-size="10" fill="#555" font-weight="bold">三段判定：</text>
  <text x="470" y="474" font-size="10" fill="#4a7a3a">绿框 = 返回值出口</text>
  <text x="470" y="490" font-size="10" fill="#d6a040">橙菱形 = 判定分支</text>
  <text x="470" y="506" font-size="10" fill="#888">虚线 = 枚举回环</text>
</svg>
