<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">四种策略：排序后从两端共移除 3 个</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">每次操作可把任意元素改成任意值 ⇔ 从排序数组两端「删掉」该元素</text>

  <!-- ===== Sorted array row ===== -->
  <text x="38" y="102" font-size="12" fill="#446688" font-weight="bold">排序后</text>
  <g font-size="9" fill="#888">
    <text x="174" y="80" text-anchor="middle">0</text>
    <text x="226" y="80" text-anchor="middle">1</text>
    <text x="278" y="80" text-anchor="middle">2</text>
    <text x="330" y="80" text-anchor="middle">3</text>
    <text x="382" y="80" text-anchor="middle">4</text>
  </g>
  <g font-size="14">
    <rect x="150" y="86" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="174" y="108" text-anchor="middle" fill="#333">0</text>
    <rect x="202" y="86" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="226" y="108" text-anchor="middle" fill="#333">1</text>
    <rect x="254" y="86" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="278" y="108" text-anchor="middle" fill="#333">5</text>
    <rect x="306" y="86" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="330" y="108" text-anchor="middle" fill="#333">10</text>
    <rect x="358" y="86" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="382" y="108" text-anchor="middle" fill="#333">14</text>
  </g>

  <!-- divider -->
  <path d="M 20 130 L 540 130" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Case 1: i=0, remove 3 from right, keep [0,1], diff=1 BEST ===== -->
  <text x="22" y="164" font-size="11" fill="#4a7a3a" font-weight="bold">删右 3</text>
  <text x="22" y="178" font-size="9" fill="#888">i=0</text>
  <g font-size="14">
    <!-- kept: index 0 (new min) -->
    <rect x="150" y="150" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
    <text x="174" y="172" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <!-- kept: index 1 (new max) -->
    <rect x="202" y="150" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
    <text x="226" y="172" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <!-- removed: 2,3,4 -->
    <rect x="254" y="150" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <path d="M 256 152 L 300 182" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="278" y="172" text-anchor="middle" fill="#ccc">5</text>
    <rect x="306" y="150" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <path d="M 308 152 L 352 182" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="330" y="172" text-anchor="middle" fill="#ccc">10</text>
    <rect x="358" y="150" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <path d="M 360 152 L 404 182" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="382" y="172" text-anchor="middle" fill="#ccc">14</text>
  </g>
  <!-- diff box -->
  <rect x="424" y="150" width="116" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="482" y="172" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1 − 0 = 1 ★</text>

  <!-- ===== Case 2: i=1, remove 1L+2R, keep [1,2], diff=4 ===== -->
  <text x="22" y="226" font-size="11" fill="#444" font-weight="bold">删左1</text>
  <text x="22" y="240" font-size="9" fill="#888">+右2</text>
  <text x="22" y="252" font-size="9" fill="#888">i=1</text>
  <g font-size="14">
    <!-- removed: 0 -->
    <rect x="150" y="214" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <path d="M 152 216 L 196 246" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="174" y="236" text-anchor="middle" fill="#ccc">0</text>
    <!-- kept: 1 (min), 2 (max) -->
    <rect x="202" y="214" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="226" y="236" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="254" y="214" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="278" y="236" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <!-- removed: 3,4 -->
    <rect x="306" y="214" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <path d="M 308 216 L 352 246" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="330" y="236" text-anchor="middle" fill="#ccc">10</text>
    <rect x="358" y="214" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <path d="M 360 216 L 404 246" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="382" y="236" text-anchor="middle" fill="#ccc">14</text>
  </g>
  <rect x="424" y="214" width="116" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="482" y="236" text-anchor="middle" font-size="13" fill="#333">5 − 1 = 4</text>

  <!-- ===== Case 3: i=2, remove 2L+1R, keep [2,3], diff=5 ===== -->
  <text x="22" y="288" font-size="11" fill="#444" font-weight="bold">删左2</text>
  <text x="22" y="302" font-size="9" fill="#888">+右1</text>
  <text x="22" y="314" font-size="9" fill="#888">i=2</text>
  <g font-size="14">
    <!-- removed: 0,1 -->
    <rect x="150" y="278" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <path d="M 152 280 L 196 310" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="174" y="300" text-anchor="middle" fill="#ccc">0</text>
    <rect x="202" y="278" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <path d="M 204 280 L 248 310" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="226" y="300" text-anchor="middle" fill="#ccc">1</text>
    <!-- kept: 2 (min), 3 (max) -->
    <rect x="254" y="278" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="278" y="300" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="306" y="278" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="330" y="300" text-anchor="middle" fill="#4a7a3a" font-weight="bold">10</text>
    <!-- removed: 4 -->
    <rect x="358" y="278" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <path d="M 360 280 L 404 310" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="382" y="300" text-anchor="middle" fill="#ccc">14</text>
  </g>
  <rect x="424" y="278" width="116" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="482" y="300" text-anchor="middle" font-size="13" fill="#333">10 − 5 = 5</text>

  <!-- ===== Case 4: i=3, remove 3 from left, keep [3,4], diff=4 ===== -->
  <text x="22" y="350" font-size="11" fill="#444" font-weight="bold">删左 3</text>
  <text x="22" y="364" font-size="9" fill="#888">i=3</text>
  <g font-size="14">
    <!-- removed: 0,1,2 -->
    <rect x="150" y="342" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <path d="M 152 344 L 196 374" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="174" y="364" text-anchor="middle" fill="#ccc">0</text>
    <rect x="202" y="342" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <path d="M 204 344 L 248 374" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="226" y="364" text-anchor="middle" fill="#ccc">1</text>
    <rect x="254" y="342" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <path d="M 256 344 L 300 374" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="278" y="364" text-anchor="middle" fill="#ccc">5</text>
    <!-- kept: 3 (min), 4 (max) -->
    <rect x="306" y="342" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="330" y="364" text-anchor="middle" fill="#4a7a3a" font-weight="bold">10</text>
    <rect x="358" y="342" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="382" y="364" text-anchor="middle" fill="#4a7a3a" font-weight="bold">14</text>
  </g>
  <rect x="424" y="342" width="116" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="482" y="364" text-anchor="middle" font-size="13" fill="#333">14 − 10 = 4</text>

  <!-- ===== Bottom: formula summary ===== -->
  <rect x="40" y="400" width="480" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="422" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">通用公式（n &gt; 4）</text>
  <text x="280" y="442" text-anchor="middle" font-size="12" fill="#333">答案 = min(nums[n−4]−nums[0], nums[n−3]−nums[1], nums[n−2]−nums[2], nums[n−1]−nums[3])</text>
</svg>
