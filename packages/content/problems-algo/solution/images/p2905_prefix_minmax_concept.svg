<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">为什么只需检查前缀最小 / 前缀最大？</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">示例：nums = [5, 1, 4, 1]，indexDifference D = 2，valueDifference V = 4</text>

  <rect x="112" y="68" width="170" height="76" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="6,4" rx="6" filter="url(#rough2)"/>
  <text x="197" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">候选 i ∈ [0, j−D]</text>

  <line x1="286" y1="97" x2="386" y2="97" stroke="#999" stroke-width="1.3" marker-start="url(#arr)" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="336" y="88" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">|i−j| ≥ D</text>

  <rect x="120" y="76" width="64" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="152" y="102" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>

  <rect x="210" y="76" width="64" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="242" y="102" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="300" y="76" width="64" height="42" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="332" y="102" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">4</text>

  <rect x="390" y="76" width="64" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="422" y="102" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="422" y="68" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">j = 3</text>

  <text x="152" y="134" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="242" y="134" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="332" y="134" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="422" y="134" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">3</text>

  <rect x="60" y="162" width="150" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="135" y="181" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">maxIdx = 0（值 5）</text>
  <path d="M 135 160 L 148 146" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arro)" filter="url(#rough2)"/>

  <rect x="240" y="162" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="315" y="181" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">minIdx = 1（值 1）</text>
  <path d="M 315 160 L 246 146" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <text x="290" y="232" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">站在 nums[j] = 1 看值域：达标的候选值只可能在两侧</text>

  <rect x="70" y="270" width="50" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="334" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x ≤ 1−4 = −3</text>
  <text x="95" y="348" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓ 达标</text>

  <rect x="460" y="270" width="55" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="487" y="334" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">x ≥ 1+4 = 5</text>
  <text x="487" y="348" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">✓ 达标</text>

  <text x="290" y="262" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">|nums[j] − x| &lt; V：全不达标</text>

  <line x1="70" y1="292" x2="522" y2="292" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="120" y1="286" x2="120" y2="298" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="314" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−3</text>
  <line x1="440" y1="286" x2="440" y2="298" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="314" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>

  <circle cx="280" cy="292" r="5.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">mn = 1 ✗</text>

  <circle cx="440" cy="292" r="5.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="384" y="330" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">mx = 5 ✓</text>

  <path d="M 122 280 L 268 289" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="195" y="274" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">往左最远 → mn</text>

  <path d="M 448 287 L 476 280" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="462" y="274" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">mx ← 往右最远</text>

  <rect x="70" y="356" width="445" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="292" y="375" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">若存在达标候选，必落在两侧彩区 → 查 mn、mx 两个即可覆盖全部</text>
</svg>
