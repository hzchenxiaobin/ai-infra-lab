<svg xmlns="http://www.w3.org/2000/svg" width="860" height="760" viewBox="0 0 860 760" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="860" height="760" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">Hierholzer DFS 求欧拉回路 · 算法流程</text>
  <path d="M 300 42 Q 430 50 560 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ① init -->
  <g filter="url(#sk)">
    <rect x="330" y="62" width="220" height="44" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="440" y="82" text-anchor="middle" font-size="12.5" fill="#34506e">① 起点 node = "0"×(n−1)</text>
  <text x="440" y="99" text-anchor="middle" font-size="11.5" fill="#34506e">seen = ∅，ans = []</text>
  <path d="M 440 106 L 440 128" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

  <!-- ② DFS(node) entry -->
  <g filter="url(#sk)">
    <rect x="318" y="128" width="244" height="40" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="440" y="153" text-anchor="middle" font-size="12.5" fill="#34506e">② 进入 dfs(node)，枚举 d ∈ 0..k−1</text>
  <path d="M 440 168 L 440 192" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

  <!-- D1: edge (node+d) not in seen ? -->
  <g filter="url(#sk)">
    <polygon points="356,232 440,192 524,232 440,272" fill="#fef6e8" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="440" y="228" text-anchor="middle" font-size="11.5" fill="#7a5415">edge = node + d</text>
  <text x="440" y="246" text-anchor="middle" font-size="11.5" fill="#7a5415">edge ∉ seen ?</text>

  <!-- D1 No -> all edges exhausted -> return (stuck) -->
  <path d="M 524 232 L 660 232" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="582" y="226" font-size="11" fill="#7a7a7a" font-weight="bold">否（用尽）</text>
  <g filter="url(#sk)"><rect x="660" y="214" width="150" height="40" rx="6" fill="#fdecee" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="735" y="232" text-anchor="middle" font-size="11.5" fill="#b85450">当前节点「卡住」</text>
  <text x="735" y="248" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">return（回溯）</text>

  <!-- D1 Yes -> mark + recurse -->
  <path d="M 440 272 L 440 300" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  <text x="448" y="290" font-size="11" fill="#4a8e4a" font-weight="bold">是</text>

  <!-- ③ mark edge -->
  <g filter="url(#sk)">
    <rect x="324" y="300" width="232" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="440" y="325" text-anchor="middle" font-size="12.5" fill="#2e6e2e">③ seen.add(edge)（边用掉）</text>
  <path d="M 440 340 L 440 364" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

  <!-- ④ recurse into next node -->
  <g filter="url(#sk)">
    <rect x="300" y="364" width="280" height="44" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="440" y="384" text-anchor="middle" font-size="12.5" fill="#34506e">④ dfs(node[1:] + d)</text>
  <text x="440" y="401" text-anchor="middle" font-size="11" fill="#7a7a7a">递归到下一节点（边方向推进）</text>
  <path d="M 440 408 L 440 432" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

  <!-- ⑤ post-order append (after recursion returns) -->
  <g filter="url(#sk)">
    <rect x="300" y="432" width="280" height="44" rx="8" fill="#fff8e1" stroke="#c9a93a" stroke-width="1.8"/>
  </g>
  <text x="440" y="452" text-anchor="middle" font-size="12.5" fill="#7a5415">⑤ 回溯后：ans.append(d)</text>
  <text x="440" y="469" text-anchor="middle" font-size="11" fill="#7a5a5a">后序追加边标签 ⭐ 关键步骤</text>
  <path d="M 440 476 L 440 500" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

  <!-- D2: more digits d to try ? -->
  <g filter="url(#sk)">
    <polygon points="356,540 440,500 524,540 440,580" fill="#fef6e8" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="440" y="536" text-anchor="middle" font-size="11.5" fill="#7a5415">还有下一 d ?</text>
  <text x="440" y="554" text-anchor="middle" font-size="11.5" fill="#7a5415">(d &lt; k−1)</text>

  <!-- D2 Yes -> loop back to D1 -->
  <path d="M 356 540 L 250 540 L 250 232 L 356 232" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="5 3" marker-end="url(#arb)"/>
  <text x="258" y="390" font-size="10.5" fill="#446688">d ← d+1</text>
  <text x="258" y="406" font-size="10.5" fill="#446688">继续枚举</text>
  <text x="316" y="534" font-size="11" fill="#446688" font-weight="bold">是</text>

  <!-- D2 No -> return (this dfs frame ends) -->
  <path d="M 524 540 L 660 540" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="582" y="534" font-size="11" fill="#7a7a7a" font-weight="bold">否</text>
  <g filter="url(#sk)"><rect x="660" y="522" width="150" height="40" rx="6" fill="#fdecee" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="735" y="540" text-anchor="middle" font-size="11.5" fill="#b85450">本层 dfs 结束</text>
  <text x="735" y="556" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">return</text>

  <!-- ⑥ final assembly -->
  <path d="M 440 580 L 440 614" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="250" y="614" width="380" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="440" y="634" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">⑥ 返回 "0"×(n−1) + "".join(ans[::-1])</text>
  <text x="440" y="651" text-anchor="middle" font-size="11" fill="#5a5a5a">反转后序序列得正向回路 + 前置起点节点</text>

  <!-- why post-order + reverse works -->
  <g filter="url(#sk)">
    <rect x="40" y="676" width="780" height="68" rx="8" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="430" y="698" text-anchor="middle" font-size="11.5" fill="#7a5415">后序追加 = 回路反向序列：最先「卡住」的边先进 ans，最后回到起点的边最后进</text>
  <text x="430" y="718" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">必须先 ans[::-1] 反转得正向回路，再前置起点节点 → 正向 de Bruijn 序列</text>
  <text x="430" y="738" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">⚠ 缺反转会漏密码（如 n=3,k=2 漏 "100"）：边标记占位 + 后序追加 + 反转，三者缺一不可</text>
</svg>
