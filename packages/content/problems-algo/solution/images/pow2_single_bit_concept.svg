<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：2 的幂二进制恰有一个 1</text>

  <!-- ===== Panel A: powers of two ===== -->
  <text x="40" y="52" font-size="12" fill="#446688" font-weight="bold">2 的幂 → 单一 1</text>

  <!-- n = 1 = 0001 -->
  <text x="40" y="74" font-size="11.5" fill="#333" font-weight="bold">n=1</text>
  <rect x="150" y="58" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="170" y="76" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="192" y="58" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="212" y="76" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="234" y="58" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="254" y="76" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="276" y="58" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="296" y="76" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>

  <!-- n = 2 = 0010 -->
  <text x="40" y="106" font-size="11.5" fill="#333" font-weight="bold">n=2</text>
  <rect x="150" y="90" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="170" y="108" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="192" y="90" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="212" y="108" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="234" y="90" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="108" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="276" y="90" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="296" y="108" text-anchor="middle" font-size="13" fill="#333">0</text>

  <!-- n = 4 = 0100 -->
  <text x="40" y="138" font-size="11.5" fill="#333" font-weight="bold">n=4</text>
  <rect x="150" y="122" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="170" y="140" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="192" y="122" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="140" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="234" y="122" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="254" y="140" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="276" y="122" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="296" y="140" text-anchor="middle" font-size="13" fill="#333">0</text>

  <!-- n = 8 = 1000 -->
  <text x="40" y="170" font-size="11.5" fill="#333" font-weight="bold">n=8</text>
  <rect x="150" y="154" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="172" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="192" y="154" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="212" y="172" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="234" y="154" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="254" y="172" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="276" y="154" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="296" y="172" text-anchor="middle" font-size="13" fill="#333">0</text>

  <text x="328" y="172" font-size="11" fill="#b85450" font-weight="bold">← 每个恰一个 1</text>

  <!-- divider -->
  <line x1="40" y1="196" x2="500" y2="196" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Panel B: n & (n-1) on n=8 ===== -->
  <text x="40" y="218" font-size="12" fill="#4a7a3a" font-weight="bold">n &amp; (n−1)：抹掉这唯一的 1</text>

  <!-- n = 8 = 1000 -->
  <text x="40" y="244" font-size="11.5" fill="#333" font-weight="bold">n=8</text>
  <rect x="150" y="228" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="246" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="192" y="228" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="212" y="246" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="234" y="228" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="254" y="246" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="276" y="228" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="296" y="246" text-anchor="middle" font-size="13" fill="#333">0</text>
  <text x="328" y="246" font-size="10.5" fill="#b85450" font-weight="bold">唯一设置位</text>

  <!-- subtract arrow -->
  <path d="M 170 256 Q 170 264 170 270" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="184" y="266" font-size="10.5" fill="#888">−1 借位</text>

  <!-- n-1 = 7 = 0111 -->
  <text x="40" y="294" font-size="11.5" fill="#d6a040" font-weight="bold">n−1=7</text>
  <rect x="150" y="278" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="296" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="192" y="278" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="296" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="234" y="278" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="296" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="276" y="278" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="296" y="296" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="328" y="294" font-size="10.5" fill="#d6a040" font-weight="bold">借位全翻</text>

  <!-- AND bracket -->
  <text x="120" y="326" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">&amp;</text>
  <line x1="150" y1="312" x2="316" y2="312" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- result = 0000 -->
  <text x="40" y="354" font-size="11.5" fill="#4a7a3a" font-weight="bold">结果=0</text>
  <rect x="150" y="338" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="356" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="192" y="338" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="212" y="356" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="234" y="338" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="254" y="356" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="276" y="338" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="296" y="356" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="328" y="354" font-size="11" fill="#4a7a3a" font-weight="bold">→ 是 2 的幂 ✓</text>
</svg>
