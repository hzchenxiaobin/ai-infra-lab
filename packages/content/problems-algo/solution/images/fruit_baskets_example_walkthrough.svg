<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="560" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：fruits = [3,3,3,1,2,1,1,2,3,3,4]，求至多 2 种水果的最长子数组</text>

  <!-- index labels -->
  <text x="20" y="52" font-size="10" fill="#888">下标:</text>
  <text x="92" y="52" font-size="10" fill="#888" font-weight="bold">0</text>
  <text x="132" y="52" font-size="10" fill="#888" font-weight="bold">1</text>
  <text x="172" y="52" font-size="10" fill="#888" font-weight="bold">2</text>
  <text x="212" y="52" font-size="10" fill="#888" font-weight="bold">3</text>
  <text x="252" y="52" font-size="10" fill="#888" font-weight="bold">4</text>
  <text x="292" y="52" font-size="10" fill="#888" font-weight="bold">5</text>
  <text x="332" y="52" font-size="10" fill="#888" font-weight="bold">6</text>
  <text x="372" y="52" font-size="10" fill="#888" font-weight="bold">7</text>
  <text x="412" y="52" font-size="10" fill="#888" font-weight="bold">8</text>
  <text x="452" y="52" font-size="10" fill="#888" font-weight="bold">9</text>
  <text x="492" y="52" font-size="10" fill="#888" font-weight="bold">10</text>

  <!-- fruits cells: [3,3,3,1,2,1,1,2,3,3,4] -->
  <rect x="78" y="58" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="118" y="58" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="158" y="58" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="198" y="58" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="238" y="58" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="278" y="58" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="318" y="58" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="358" y="58" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="375" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="398" y="58" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="415" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="438" y="58" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="455" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="478" y="58" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="495" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <!-- color legend for types -->
  <rect x="540" y="62" width="12" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="556" y="72" font-size="9" fill="#555">种类3</text>
  <rect x="540" y="78" width="12" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="556" y="88" font-size="9" fill="#555">种类1</text>

  <!-- Steps table header -->
  <text x="20" y="116" font-size="12" fill="#444" font-weight="bold">步骤</text>
  <text x="70" y="116" font-size="12" fill="#444" font-weight="bold">right</text>
  <text x="120" y="116" font-size="12" fill="#444" font-weight="bold">水果</text>
  <text x="170" y="116" font-size="12" fill="#444" font-weight="bold">动作</text>
  <text x="360" y="116" font-size="12" fill="#444" font-weight="bold">freq（种类）</text>
  <text x="490" y="116" font-size="12" fill="#444" font-weight="bold">窗口</text>
  <text x="585" y="116" font-size="12" fill="#444" font-weight="bold">max</text>

  <line x1="14" y1="122" x2="600" y2="122" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 1: right=0..2, type 3 -->
  <text x="20" y="142" font-size="11" fill="#333">1-3</text>
  <text x="70" y="142" font-size="11" fill="#333">0-2</text>
  <text x="120" y="142" font-size="11" fill="#333" font-weight="bold">3,3,3</text>
  <text x="170" y="142" font-size="11" fill="#82b366">入窗，种类 1 ≤ 2</text>
  <text x="360" y="142" font-size="11" fill="#4a7a3a" font-weight="bold">{3:3}（1）</text>
  <text x="490" y="142" font-size="11" fill="#4a7a3a" font-weight="bold">[3,3,3]</text>
  <text x="585" y="142" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- Step 2: right=3, type 1 -->
  <text x="20" y="164" font-size="11" fill="#333">4</text>
  <text x="70" y="164" font-size="11" fill="#333">3</text>
  <text x="120" y="164" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="170" y="164" font-size="11" fill="#82b366">入窗，种类 2 ≤ 2</text>
  <text x="360" y="164" font-size="11" fill="#4a7a3a" font-weight="bold">{3:3,1:1}（2）</text>
  <text x="490" y="164" font-size="11" fill="#4a7a3a" font-weight="bold">[3,3,3,1]</text>
  <text x="585" y="164" font-size="11" fill="#333" font-weight="bold">4</text>

  <!-- Step 3: right=4, type 2, distinct=3 > 2 -->
  <text x="20" y="186" font-size="11" fill="#333">5</text>
  <text x="70" y="186" font-size="11" fill="#333">4</text>
  <text x="120" y="186" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="170" y="186" font-size="11" fill="#b85450">入窗，种类 3 &gt; 2!</text>
  <text x="360" y="186" font-size="11" fill="#b85450" font-weight="bold">{3:3,1:1,2:1}（3）</text>
  <text x="490" y="186" font-size="11" fill="#d6a040" font-weight="bold">需收缩</text>
  <text x="585" y="186" font-size="11" fill="#333">4</text>

  <!-- Step 3': shrink left=0,1,2 remove three 3s -->
  <text x="20" y="208" font-size="10" fill="#888">5'</text>
  <text x="70" y="208" font-size="10" fill="#888">—</text>
  <text x="120" y="208" font-size="10" fill="#888">—</text>
  <text x="170" y="208" font-size="10" fill="#82b366">left=0,1,2 移走三个 3→0</text>
  <text x="360" y="208" font-size="10" fill="#4a7a3a">{1:1,2:1}（2）✓</text>
  <text x="490" y="208" font-size="10" fill="#4a7a3a" font-weight="bold">[1,2]</text>
  <text x="585" y="208" font-size="10" fill="#888">4</text>

  <!-- Step 4: right=5, type 1 -->
  <text x="20" y="230" font-size="11" fill="#333">6</text>
  <text x="70" y="230" font-size="11" fill="#333">5</text>
  <text x="120" y="230" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="170" y="230" font-size="11" fill="#82b366">入窗，1 已在窗</text>
  <text x="360" y="230" font-size="11" fill="#4a7a3a" font-weight="bold">{1:2,2:1}（2）</text>
  <text x="490" y="230" font-size="11" fill="#4a7a3a" font-weight="bold">[1,2,1]</text>
  <text x="585" y="230" font-size="11" fill="#333">4</text>

  <!-- Step 5: right=6, type 1 -->
  <text x="20" y="252" font-size="11" fill="#333">7</text>
  <text x="70" y="252" font-size="11" fill="#333">6</text>
  <text x="120" y="252" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="170" y="252" font-size="11" fill="#82b366">入窗，1 已在窗</text>
  <text x="360" y="252" font-size="11" fill="#4a7a3a" font-weight="bold">{1:3,2:1}（2）</text>
  <text x="490" y="252" font-size="11" fill="#4a7a3a" font-weight="bold">[1,2,1,1]</text>
  <text x="585" y="252" font-size="11" fill="#333">4</text>

  <!-- Step 6: right=7, type 2, max=5 ⭐ -->
  <text x="20" y="274" font-size="11" fill="#333">8</text>
  <text x="70" y="274" font-size="11" fill="#333">7</text>
  <text x="120" y="274" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="170" y="274" font-size="11" fill="#82b366">入窗，2 已在窗</text>
  <text x="360" y="274" font-size="11" fill="#4a7a3a" font-weight="bold">{1:3,2:2}（2）</text>
  <text x="490" y="274" font-size="11" fill="#4a7a3a" font-weight="bold">[1,2,1,1,2]</text>
  <text x="585" y="274" font-size="11" fill="#333" font-weight="bold">5 ⭐</text>

  <!-- Step 7: right=8, type 3, distinct=3 > 2 -->
  <text x="20" y="296" font-size="11" fill="#333">9</text>
  <text x="70" y="296" font-size="11" fill="#333">8</text>
  <text x="120" y="296" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="170" y="296" font-size="11" fill="#b85450">入窗，种类 3 &gt; 2!</text>
  <text x="360" y="296" font-size="11" fill="#b85450" font-weight="bold">{1:3,2:2,3:1}（3）</text>
  <text x="490" y="296" font-size="11" fill="#d6a040" font-weight="bold">需收缩</text>
  <text x="585" y="296" font-size="11" fill="#333">5</text>

  <!-- Step 7': shrink left=3..6 remove all 1s -->
  <text x="20" y="318" font-size="10" fill="#888">9'</text>
  <text x="70" y="318" font-size="10" fill="#888">—</text>
  <text x="120" y="318" font-size="10" fill="#888">—</text>
  <text x="170" y="318" font-size="10" fill="#82b366">left=3,4,5,6 移走三个 1→0</text>
  <text x="360" y="318" font-size="10" fill="#4a7a3a">{2:1,3:1}（2）✓</text>
  <text x="490" y="318" font-size="10" fill="#4a7a3a" font-weight="bold">[2,3]</text>
  <text x="585" y="318" font-size="10" fill="#888">5</text>

  <!-- Step 8: right=9, type 3 -->
  <text x="20" y="340" font-size="11" fill="#333">10</text>
  <text x="70" y="340" font-size="11" fill="#333">9</text>
  <text x="120" y="340" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="170" y="340" font-size="11" fill="#82b366">入窗，3 已在窗</text>
  <text x="360" y="340" font-size="11" fill="#4a7a3a" font-weight="bold">{2:1,3:2}（2）</text>
  <text x="490" y="340" font-size="11" fill="#4a7a3a" font-weight="bold">[2,3,3]</text>
  <text x="585" y="340" font-size="11" fill="#333">5</text>

  <!-- Step 9: right=10, type 4, distinct=3 > 2, shrink -->
  <text x="20" y="362" font-size="11" fill="#333">11</text>
  <text x="70" y="362" font-size="11" fill="#333">10</text>
  <text x="120" y="362" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="170" y="362" font-size="11" fill="#b85450">入窗 3&gt;2! 收缩移 2</text>
  <text x="360" y="362" font-size="11" fill="#4a7a3a" font-weight="bold">{3:2,4:1}（2）✓</text>
  <text x="490" y="362" font-size="11" fill="#4a7a3a" font-weight="bold">[3,4]</text>
  <text x="585" y="362" font-size="11" fill="#333">5</text>

  <!-- result box -->
  <rect x="60" y="390" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="412" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">答案 = 5，最长子数组 [1,2,1,1,2]（下标 3-7）</text>
  <text x="310" y="432" text-anchor="middle" font-size="11" fill="#888">left、right 各至多移动 n 次 → 整体 O(n)</text>

  <!-- legend -->
  <rect x="60" y="464" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="80" y="475" font-size="11" fill="#555">入窗/收缩成功</text>
  <rect x="190" y="464" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="210" y="475" font-size="11" fill="#555">种类超限触发收缩</text>
  <rect x="340" y="464" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="360" y="475" font-size="11" fill="#555">中间收缩步</text>
  <text x="470" y="475" font-size="11" fill="#888">⭐ = 全局最大</text>
</svg>
