<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：后序自底向上，每节点算出 (L, R)，ans 逐步刷新</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">节点旁标注 (L, R)；红色为当前 ans 最大值所在节点</text>

  <!-- ===== Left: tree with (L,R) labels ===== -->
  <g font-size="12">
    <!-- edges -->
    <line x1="170" y1="92" x2="120" y2="146" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="170" y1="92" x2="240" y2="146" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="120" y1="156" x2="80" y2="208" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="240" y1="156" x2="280" y2="208" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="80" y1="218" x2="120" y2="270" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="280" y1="218" x2="320" y2="270" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="120" y1="280" x2="90" y2="332" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>

    <!-- nodes with (L,R) labels -->
    <circle cx="170" cy="84" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="170" y="89" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="170" y="72" text-anchor="middle" font-size="9" fill="#446688">(1,1)</text>

    <circle cx="120" cy="151" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="120" y="156" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <text x="92" y="139" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">(3,0)</text>

    <circle cx="240" cy="151" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="240" y="156" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <text x="268" y="139" text-anchor="middle" font-size="9" fill="#446688">(0,2)</text>

    <circle cx="80" cy="213" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="80" y="218" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <text x="52" y="201" text-anchor="middle" font-size="9" fill="#446688">(0,2)</text>

    <circle cx="280" cy="213" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="280" y="218" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
    <text x="308" y="201" text-anchor="middle" font-size="9" fill="#446688">(1,0)</text>

    <circle cx="120" cy="275" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="120" y="280" text-anchor="middle" fill="#446688" font-weight="bold">6</text>
    <text x="92" y="263" text-anchor="middle" font-size="9" fill="#446688">(1,0)</text>

    <circle cx="320" cy="275" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="320" y="280" text-anchor="middle" fill="#446688" font-weight="bold">7</text>
    <text x="346" y="263" text-anchor="middle" font-size="9" fill="#446688">(0,0)</text>

    <circle cx="90" cy="337" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="90" y="342" text-anchor="middle" fill="#446688" font-weight="bold">8</text>
    <text x="64" y="328" text-anchor="middle" font-size="9" fill="#446688">(0,0)</text>
  </g>

  <!-- ===== Right: computation sequence ===== -->
  <text x="470" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">后序计算顺序（自底向上）</text>

  <!-- header -->
  <rect x="330" y="84" width="270" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="356" y="100" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">节点</text>
  <text x="430" y="100" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">计算</text>
  <text x="560" y="100" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">(L,R) / ans</text>

  <g font-size="9" fill="#555">
    <rect x="330" y="110" width="270" height="22" rx="3" fill="none" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="356" y="125" text-anchor="middle">8</text><text x="430" y="125" text-anchor="middle">叶子</text><text x="560" y="125" text-anchor="middle">(0,0) / 0</text>

    <rect x="330" y="134" width="270" height="22" rx="3" fill="none" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="356" y="149" text-anchor="middle">6</text><text x="430" y="149" text-anchor="middle">L=1+8.R</text><text x="560" y="149" text-anchor="middle">(1,0) / 1</text>

    <rect x="330" y="158" width="270" height="22" rx="3" fill="none" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="356" y="173" text-anchor="middle">7</text><text x="430" y="173" text-anchor="middle">叶子</text><text x="560" y="173" text-anchor="middle">(0,0) / 1</text>

    <rect x="330" y="182" width="270" height="22" rx="3" fill="none" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="356" y="197" text-anchor="middle">4</text><text x="430" y="197" text-anchor="middle">R=1+6.L</text><text x="560" y="197" text-anchor="middle">(0,2) / 2</text>

    <rect x="330" y="206" width="270" height="22" rx="3" fill="none" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="356" y="221" text-anchor="middle">5</text><text x="430" y="221" text-anchor="middle">L=1+7.R</text><text x="560" y="221" text-anchor="middle">(1,0) / 2</text>

    <!-- best row highlighted -->
    <rect x="330" y="230" width="270" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="356" y="246" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <text x="430" y="246" text-anchor="middle" fill="#d6a040" font-weight="bold">L=1+4.R</text>
    <text x="560" y="246" text-anchor="middle" fill="#b85450" font-weight="bold">(3,0) / 3 ←</text>

    <rect x="330" y="256" width="270" height="22" rx="3" fill="none" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="356" y="271" text-anchor="middle">3</text><text x="430" y="271" text-anchor="middle">R=1+5.L</text><text x="560" y="271" text-anchor="middle">(0,2) / 3</text>

    <rect x="330" y="280" width="270" height="22" rx="3" fill="none" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="356" y="295" text-anchor="middle">1</text><text x="430" y="295" text-anchor="middle">L=1+2.R,R=1+3.L</text><text x="560" y="295" text-anchor="middle">(1,1) / 3</text>
  </g>

  <!-- note -->
  <rect x="330" y="316" width="270" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="465" y="338" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans = 3</text>
  <text x="465" y="356" text-anchor="middle" font-size="10" fill="#666">起点节点 2：2→4→6→8（L→R→L）</text>

  <!-- bottom note -->
  <rect x="30" y="386" width="560" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="310" y="408" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">L 用左孩子的 R、R 用右孩子的 L：交叉取值正是「左右交替」的递归体现</text>
</svg>
