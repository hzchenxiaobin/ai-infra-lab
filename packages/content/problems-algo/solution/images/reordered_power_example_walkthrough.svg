<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 46 与 n = 10</text>

  <!-- ===== 示例 1：n = 46 ===== -->
  <rect x="30" y="42" width="460" height="172" fill="none" stroke="#e6f4ea" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="50" y="62" font-size="12" fill="#4a7a3a" font-weight="bold">① n = 46 → true</text>

  <!-- n 的签名 -->
  <rect x="50" y="74" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="90" y="94" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">n = 46</text>

  <path d="M 130 89 L 160 89" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="145" y="82" text-anchor="middle" font-size="9" fill="#888">排序</text>

  <rect x="164" y="74" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="202" y="94" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">target "46"</text>

  <!-- 2 位数 2 的幂列表 -->
  <text x="280" y="68" font-size="10.5" fill="#555" font-weight="bold">2 位数的 2 的幂：</text>

  <rect x="280" y="76" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="320" y="92" text-anchor="middle" font-size="10.5" fill="#555">16 → "16"</text>

  <rect x="280" y="102" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="320" y="118" text-anchor="middle" font-size="10.5" fill="#555">32 → "23"</text>

  <rect x="280" y="128" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="144" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">64 → "46" ✓</text>

  <!-- 匹配箭头 -->
  <path d="M 240 89 L 278 139" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="4 2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 结果 -->
  <rect x="400" y="128" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="435" y="147" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">true</text>
  <text x="400" y="170" font-size="9.5" fill="#888">46 重排 → 64 = 2⁶</text>

  <!-- ===== 示例 2：n = 10 ===== -->
  <rect x="30" y="228" width="460" height="172" fill="none" stroke="#fce4ec" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="50" y="248" font-size="12" fill="#b85450" font-weight="bold">② n = 10 → false</text>

  <!-- n 的签名 -->
  <rect x="50" y="260" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="90" y="280" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">n = 10</text>

  <path d="M 130 275 L 160 275" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="145" y="268" text-anchor="middle" font-size="9" fill="#888">排序</text>

  <rect x="164" y="260" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="202" y="280" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">target "01"</text>

  <!-- 2 位数 2 的幂列表 -->
  <text x="280" y="254" font-size="10.5" fill="#555" font-weight="bold">2 位数的 2 的幂：</text>

  <rect x="280" y="262" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="320" y="278" text-anchor="middle" font-size="10.5" fill="#555">16 → "16" ✗</text>

  <rect x="280" y="288" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="320" y="304" text-anchor="middle" font-size="10.5" fill="#555">32 → "23" ✗</text>

  <rect x="280" y="314" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="320" y="330" text-anchor="middle" font-size="10.5" fill="#555">64 → "46" ✗</text>

  <!-- 无匹配 -->
  <path d="M 240 275 L 278 275" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4 2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="259" y="268" text-anchor="middle" font-size="9" fill="#b85450">无匹配</text>

  <!-- 结果 -->
  <rect x="400" y="300" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="435" y="319" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">false</text>
  <text x="395" y="342" font-size="9.5" fill="#888">"01" 无 2 的幂匹配</text>

  <!-- 底部备注 -->
  <text x="260" y="420" text-anchor="middle" font-size="10" fill="#888">只需比对「同位数」的 2 的幂——签名长度不同直接跳过</text>
</svg>
