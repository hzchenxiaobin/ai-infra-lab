<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2765c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">交替的本质：在 v 与 v+1 之间反复横跳</text>

  <text x="120" y="74" text-anchor="middle" font-size="11" fill="#888">k=0</text>
  <text x="190" y="74" text-anchor="middle" font-size="11" fill="#888">k=1</text>
  <text x="260" y="74" text-anchor="middle" font-size="11" fill="#888">k=2</text>
  <text x="330" y="74" text-anchor="middle" font-size="11" fill="#888">k=3</text>
  <text x="400" y="74" text-anchor="middle" font-size="11" fill="#888">k=4</text>

  <rect x="88" y="84" width="64" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="120" y="118" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold">3</text>

  <rect x="158" y="84" width="64" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="190" y="118" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">4</text>

  <rect x="228" y="84" width="64" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold">3</text>

  <rect x="298" y="84" width="64" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="330" y="118" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">4</text>

  <rect x="368" y="84" width="64" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="400" y="118" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold">3</text>

  <text x="120" y="158" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">基值 v</text>
  <text x="190" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">v+1</text>
  <text x="260" y="158" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">v</text>
  <text x="330" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">v+1</text>
  <text x="400" y="158" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">v</text>

  <rect x="140" y="172" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="11" filter="url(#rough2)"/>
  <text x="155" y="188" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+1</text>

  <rect x="210" y="172" width="30" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="11" filter="url(#rough2)"/>
  <text x="225" y="188" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−1</text>

  <rect x="280" y="172" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="11" filter="url(#rough2)"/>
  <text x="295" y="188" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+1</text>

  <rect x="350" y="172" width="30" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="11" filter="url(#rough2)"/>
  <text x="365" y="188" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−1</text>

  <rect x="110" y="226" width="300" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="246" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">位置 k 的取值：s[k] = s[0] + (k mod 2)</text>
  <text x="260" y="262" text-anchor="middle" font-size="11" fill="#d6a040">偶数位回基值 v，奇数位取 v+1</text>

  <rect x="60" y="290" width="400" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">起点必须是 +1：s[1] = s[0] + 1</text>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#b85450">随后差值在 +1、−1 之间交替，整体只含两个值</text>
</svg>
