<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <!-- dividers -->
  <line x1="280" y1="10" x2="280" y2="420" stroke="#d8d8d8" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <line x1="10" y1="215" x2="550" y2="215" stroke="#d8d8d8" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== ins (top-left) ===== -->
  <text x="140" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">ins(name, row)</text>

  <polygon points="70,52 116,76 70,100 24,76" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="80" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">表存在?</text>
  <path d="M 116 76 L 168 76" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="142" y="70" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>
  <rect x="168" y="64" width="92" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="214" y="81" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">return false</text>

  <path d="M 70 100 L 70 120" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="82" y="116" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <polygon points="70,122 116,146 70,170 24,146" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="150" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">len==cols?</text>
  <path d="M 116 146 L 168 146" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="142" y="140" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>

  <path d="M 70 170 L 70 186" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="82" y="182" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="14" y="188" width="112" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="205" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">rows[nextId++]=row</text>
  <path d="M 126 201 L 168 201" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="168" y="188" width="92" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="214" y="205" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">return true</text>

  <!-- ===== rmv (top-right) ===== -->
  <text x="420" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">rmv(name, rowId)</text>

  <polygon points="350,64 396,88 350,112 304,88" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="92" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">表存在?</text>
  <path d="M 396 88 L 446 88" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="421" y="82" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>
  <rect x="446" y="76" width="92" height="26" rx="5" fill="#f5f5f5" stroke="#a8a8a8" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="492" y="93" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">直接返回</text>

  <path d="M 350 112 L 350 134" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="130" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="294" y="136" width="112" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">rows.erase(rowId)</text>
  <text x="350" y="194" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">无此行则 no-op；nextId 不变</text>

  <!-- ===== sel (bottom-left) ===== -->
  <text x="140" y="240" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">sel(name,rowId,col)</text>

  <polygon points="70,270 138,308 70,346 2,308" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="304" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">行存在 且</text>
  <text x="70" y="318" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1≤col≤cols?</text>
  <path d="M 138 308 L 168 308" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="153" y="302" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>
  <rect x="168" y="296" width="98" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="217" y="313" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">return "&lt;null&gt;"</text>

  <path d="M 70 346 L 70 366" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="82" y="362" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="10" y="368" width="124" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="72" y="385" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">return rows[r][col-1]</text>

  <!-- ===== exp (bottom-right) ===== -->
  <text x="420" y="240" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">exp(name)</text>

  <polygon points="350,264 396,288 350,312 304,288" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="292" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">表存在?</text>
  <path d="M 396 288 L 446 288" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="421" y="282" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>
  <rect x="446" y="276" width="80" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="486" y="293" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">return []</text>

  <path d="M 350 312 L 350 332" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="328" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="290" y="334" width="120" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="350" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">收集 id 升序排序</text>
  <text x="350" y="362" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">拼接 "id,v1,…,vn"</text>
  <path d="M 410 351 L 446 351" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="446" y="338" width="80" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="486" y="355" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">返回行数组</text>

  <text x="350" y="400" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">排序保证导出按 id 升序</text>
</svg>
