<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">旋转数组 = 两段升序，断点处即最小值</text>

  <!-- left high segment polyline: [3,4,5] at idx 0,1,2 -->
  <path d="M90,175 L170,148 L250,120" stroke="#446688" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <!-- right low segment polyline: [1,2] at idx 3,4 -->
  <path d="M330,230 L410,203" stroke="#4a7a3a" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <!-- the drop between idx2(5) and idx3(1) -->
  <path d="M250,120 L330,230" stroke="#b85450" stroke-width="2.2" fill="none" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <!-- baseline -->
  <line x1="70" y1="248" x2="430" y2="248" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- value points -->
  <circle cx="90" cy="175" r="4.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="170" cy="148" r="4.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="250" cy="120" r="4.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="330" cy="230" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <circle cx="410" cy="203" r="4.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- value labels above points -->
  <text x="90" y="167" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <text x="170" y="140" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <text x="250" y="112" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5</text>
  <text x="330" y="244" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">1</text>
  <text x="410" y="195" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- index labels below baseline -->
  <text x="90" y="264" text-anchor="middle" font-size="9.5" fill="#aaa">0</text>
  <text x="170" y="264" text-anchor="middle" font-size="9.5" fill="#aaa">1</text>
  <text x="250" y="264" text-anchor="middle" font-size="9.5" fill="#aaa">2</text>
  <text x="330" y="264" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">3</text>
  <text x="410" y="264" text-anchor="middle" font-size="9.5" fill="#aaa">4</text>

  <!-- min callout -->
  <path d="M330 232 L372 214" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="378" y="210" font-size="10.5" fill="#b85450" font-weight="bold">最小值</text>

  <!-- segment brackets -->
  <text x="170" y="282" text-anchor="middle" font-size="10" fill="#446688">左段（较大）</text>
  <text x="370" y="282" text-anchor="middle" font-size="10" fill="#4a7a3a">右段（较小）</text>

  <!-- two-case panels -->
  <rect x="40" y="300" width="230" height="82" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="155" y="322" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">nums[mid] &lt; nums[right]</text>
  <text x="155" y="340" text-anchor="middle" font-size="10.5" fill="#4a7a3a">右半 [mid..right] 有序</text>
  <text x="155" y="356" text-anchor="middle" font-size="10.5" fill="#4a7a3a">断点不在右半 → min 在左(含 mid)</text>
  <text x="155" y="374" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">right = mid</text>

  <rect x="290" y="300" width="230" height="82" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="405" y="322" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">nums[mid] &gt; nums[right]</text>
  <text x="405" y="340" text-anchor="middle" font-size="10.5" fill="#b85450">右半存在「断点下坠」</text>
  <text x="405" y="356" text-anchor="middle" font-size="10.5" fill="#b85450">min 在右半 → 排除 mid</text>
  <text x="405" y="374" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">left = mid + 1</text>
</svg>
