<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：首窗求和 → 增量滑动 → 取最大</text>

  <!-- Step 1: initial sum -->
  <rect x="150" y="44" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="12" fill="#333">sum = Σ nums[0..k−1]，maxSum = sum</text>
  <path d="M 280 82 L 280 104" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop header -->
  <rect x="170" y="108" width="220" height="30" fill="#f6f6f6" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="11.5" fill="#333">for i in [k, n−1]</text>
  <path d="M 280 140 L 280 162" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: increment update -->
  <rect x="120" y="166" width="320" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="189" text-anchor="middle" font-size="12" fill="#333">sum += nums[i] − nums[i−k]</text>
  <path d="M 280 204 L 280 226" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: sum > maxSum? -->
  <path d="M 280 230 L 380 274 L 280 318 L 180 274 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="11.5" fill="#333">sum &gt; maxSum</text>
  <text x="280" y="286" text-anchor="middle" font-size="11.5" fill="#333">？</text>

  <!-- Yes branch -->
  <path d="M 280 318 L 280 342" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="294" y="334" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="190" y="346" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="12" fill="#333">maxSum = sum</text>

  <!-- No branch: skip -->
  <path d="M 380 274 L 460 274 L 460 124 L 392 124" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="424" y="266" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">否</text>

  <!-- loop back from yes to loop header -->
  <path d="M 190 361 L 130 361 L 130 124 L 170 124" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- end -->
  <rect x="170" y="392" width="220" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="415" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return maxSum / k</text>
  <path d="M 460 124 L 510 124 L 510 410 L 392 410" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
