<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="25" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：点集 (0,0) (4,0) (0,4) (1,1)</text>

  <!-- Panel borders -->
  <rect x="10" y="40" width="240" height="170" rx="6" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="270" y="40" width="240" height="170" rx="6" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="10" y="220" width="240" height="170" rx="6" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="270" y="220" width="240" height="170" rx="6" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Panel 1: Step 1 -->
  <text x="130" y="58" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">Step 1: C = 点圆(P[0])</text>
  <circle cx="55" cy="170" r="6" fill="#b85450" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="68" y="165" font-size="10" fill="#333" filter="url(#rough2)">(0,0)</text>
  <text x="130" y="195" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">center=(0,0) r=0</text>

  <!-- Panel 2: Step 2 -->
  <text x="390" y="58" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">Step 2: P[1] 在外 → from2</text>
  <circle cx="320" cy="170" r="6" fill="#b85450" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="392" cy="170" r="6" fill="#b85450" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="308" y="165" font-size="10" fill="#333" filter="url(#rough2)">(0,0)</text>
  <text x="400" y="165" font-size="10" fill="#333" filter="url(#rough2)">(4,0)</text>
  <circle cx="356" cy="170" r="36" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="356" cy="170" r="3" fill="#d6a040" filter="url(#rough2)"/>
  <text x="390" y="195" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">center=(2,0) r=2</text>

  <!-- Panel 3: Step 3 -->
  <text x="130" y="238" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">Step 3: P[2] 在外 → from3</text>
  <circle cx="55" cy="350" r="6" fill="#b85450" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="127" cy="350" r="6" fill="#b85450" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="55" cy="278" r="6" fill="#b85450" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="43" y="365" font-size="10" fill="#333" filter="url(#rough2)">(0,0)</text>
  <text x="135" y="365" font-size="10" fill="#333" filter="url(#rough2)">(4,0)</text>
  <text x="43" y="275" font-size="10" fill="#333" filter="url(#rough2)">(0,4)</text>
  <circle cx="91" cy="314" r="51" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="91" cy="314" r="3" fill="#d6a040" filter="url(#rough2)"/>
  <text x="130" y="382" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">center=(2,2) r=2√2≈2.83</text>

  <!-- Panel 4: Step 4 -->
  <text x="390" y="238" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">Step 4: P[3] 在内 → 完成</text>
  <circle cx="320" cy="350" r="6" fill="#b85450" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="392" cy="350" r="6" fill="#b85450" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="320" cy="278" r="6" fill="#b85450" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="338" cy="332" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="308" y="365" font-size="10" fill="#333" filter="url(#rough2)">(0,0)</text>
  <text x="400" y="365" font-size="10" fill="#333" filter="url(#rough2)">(4,0)</text>
  <text x="308" y="275" font-size="10" fill="#333" filter="url(#rough2)">(0,4)</text>
  <text x="346" y="345" font-size="10" fill="#446688" filter="url(#rough2)">(1,1)</text>
  <circle cx="356" cy="314" r="51" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="356" cy="314" r="3" fill="#d6a040" filter="url(#rough2)"/>
  <text x="390" y="382" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">dist=(√2)&lt;r ✓ 完成</text>
</svg>
