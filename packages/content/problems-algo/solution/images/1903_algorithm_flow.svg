<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：从右向左扫描，定位最右奇位</text>
  <text x="300" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">单趟逆序扫描，命中即返回；扫完仍无奇位则返回空串</text>

  <!-- Start: i = n - 1 -->
  <rect x="230" y="62" width="140" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="20" filter="url(#rough2)"/>
  <text x="300" y="87" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">开始：i = n − 1</text>

  <!-- Arrow down to decision i>=0 -->
  <path d="M 300 104 L 300 124" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Decision: i >= 0 ? -->
  <polygon points="300,128 400,178 300,228 200,178" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="174" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">i ≥ 0 ?</text>
  <text x="300" y="192" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(还没扫完)</text>

  <!-- No branch: left -> return "" -->
  <path d="M 200 178 L 120 178" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="160" y="170" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="40" y="208" width="160" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="120" y="227" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">无奇数位</text>
  <text x="120" y="244" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">return ""</text>

  <!-- Yes branch: down to decision num[i] odd? -->
  <path d="M 300 228 L 300 248" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="312" y="244" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Decision: num[i] odd? -->
  <polygon points="300,252 410,302 300,352 190,302" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="298" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">num[i] 为奇?</text>
  <text x="300" y="316" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">num[i] &amp; 1 == 1</text>

  <!-- Yes branch: right -> return num[0..i] -->
  <path d="M 410 302 L 480 302" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="445" y="294" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="400" y="332" width="160" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="480" y="351" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">命中最右奇位</text>
  <text x="480" y="368" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return num[0..i]</text>

  <!-- No branch: down-left, i -= 1, loop back -->
  <path d="M 300 352 L 300 378 L 460 378 L 460 178 L 410 178" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="312" y="370" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="338" y="388" width="124" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="410" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">i ← i − 1（左移）</text>

  <!-- Note -->
  <rect x="40" y="430" width="520" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="448" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">逆序扫描保证「第一个命中的奇位」就是「最右奇位」</text>
  <text x="300" y="463" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">—— 命中即返回，最坏扫全串 O(n)，空间 O(1)</text>
</svg>
