<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">8 方向 BFS：从左上到右下的最短路径</text>
  <path d="M 200 36 Q 360 44 520 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Left: 8-direction diagram ===== -->
  <text x="160" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">8 邻居方向（对比 4 方向）</text>

  <!-- 3x3 grid: center cell + 8 neighbors -->
  <g filter="url(#rough2)" font-size="14">
    <!-- corners (diagonal, only in 8-dir) -->
    <rect x="100" y="80" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="120" y="105" text-anchor="middle" fill="#7a5415">↖</text>

    <rect x="180" y="80" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="200" y="105" text-anchor="middle" fill="#7a5415">↗</text>

    <rect x="100" y="160" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="120" y="185" text-anchor="middle" fill="#7a5415">↙</text>

    <rect x="180" y="160" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="200" y="185" text-anchor="middle" fill="#7a5415">↘</text>

    <!-- 4-directional neighbors (up/down/left/right) -->
    <rect x="140" y="80" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="160" y="105" text-anchor="middle" fill="#333">↑</text>

    <rect x="140" y="160" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="160" y="185" text-anchor="middle" fill="#333">↓</text>

    <rect x="100" y="120" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="120" y="145" text-anchor="middle" fill="#333">←</text>

    <rect x="180" y="120" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="200" y="145" text-anchor="middle" fill="#333">→</text>

    <!-- center cell -->
    <rect x="140" y="120" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3"/>
    <text x="160" y="145" text-anchor="middle" fill="#b03a3a" font-weight="bold">cell</text>
  </g>

  <text x="160" y="222" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">蓝 = 4 方向邻接（上下左右）</text>
  <text x="160" y="236" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">橙 = 额外 4 个对角邻接（8 方向多出）</text>

  <!-- ===== Right: BFS layers on a 5x5 grid ===== -->
  <text x="500" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">BFS 逐层扩展（层数 = 路径长度）</text>

  <!-- 5x5 grid, cell size 36, origin (360, 84) -->
  <g filter="url(#rough2)" font-size="12">
    <!-- row 0 -->
    <rect x="360" y="84" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2"/><text x="378" y="108" text-anchor="middle" fill="#b03a3a" font-weight="bold">1</text>
    <rect x="396" y="84" width="36" height="36" fill="#e8f0fe" stroke="#446688"/><text x="414" y="108" text-anchor="middle" fill="#333">2</text>
    <rect x="432" y="84" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a"/><text x="450" y="108" text-anchor="middle" fill="#2e6e2e">3</text>
    <rect x="468" y="84" width="36" height="36" fill="#fff" stroke="#bbb"/><text x="486" y="108" text-anchor="middle" fill="#ccc">1</text>
    <rect x="504" y="84" width="36" height="36" fill="#fff" stroke="#bbb"/><text x="522" y="108" text-anchor="middle" fill="#ccc">1</text>

    <!-- row 1 -->
    <rect x="360" y="120" width="36" height="36" fill="#e8f0fe" stroke="#446688"/><text x="378" y="144" text-anchor="middle" fill="#333">2</text>
    <rect x="396" y="120" width="36" height="36" fill="#e8f0fe" stroke="#446688"/><text x="414" y="144" text-anchor="middle" fill="#333">2</text>
    <rect x="432" y="120" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a"/><text x="450" y="144" text-anchor="middle" fill="#2e6e2e">3</text>
    <rect x="468" y="120" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a"/><text x="486" y="144" text-anchor="middle" fill="#2e6e2e">4</text>
    <rect x="504" y="120" width="36" height="36" fill="#fff" stroke="#bbb"/><text x="522" y="144" text-anchor="middle" fill="#ccc">1</text>

    <!-- row 2 -->
    <rect x="360" y="156" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a"/><text x="378" y="180" text-anchor="middle" fill="#2e6e2e">3</text>
    <rect x="396" y="156" width="36" height="36" fill="#fff" stroke="#bbb"/><text x="414" y="180" text-anchor="middle" fill="#ccc">1</text>
    <rect x="432" y="156" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a"/><text x="450" y="180" text-anchor="middle" fill="#2e6e2e">3</text>
    <rect x="468" y="156" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a"/><text x="486" y="180" text-anchor="middle" fill="#2e6e2e">4</text>
    <rect x="504" y="156" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a"/><text x="522" y="180" text-anchor="middle" fill="#2e6e2e">5</text>

    <!-- row 3 -->
    <rect x="360" y="192" width="36" height="36" fill="#fff" stroke="#bbb"/><text x="378" y="216" text-anchor="middle" fill="#ccc">1</text>
    <rect x="396" y="192" width="36" height="36" fill="#fff" stroke="#bbb"/><text x="414" y="216" text-anchor="middle" fill="#ccc">1</text>
    <rect x="432" y="192" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a"/><text x="450" y="216" text-anchor="middle" fill="#2e6e2e">4</text>
    <rect x="468" y="192" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a"/><text x="486" y="216" text-anchor="middle" fill="#2e6e2e">5</text>
    <rect x="504" y="192" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a"/><text x="522" y="216" text-anchor="middle" fill="#2e6e2e">5</text>

    <!-- row 4 -->
    <rect x="360" y="228" width="36" height="36" fill="#fff" stroke="#bbb"/><text x="378" y="252" text-anchor="middle" fill="#ccc">1</text>
    <rect x="396" y="228" width="36" height="36" fill="#fff" stroke="#bbb"/><text x="414" y="252" text-anchor="middle" fill="#ccc">1</text>
    <rect x="432" y="228" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a"/><text x="450" y="252" text-anchor="middle" fill="#2e6e2e">5</text>
    <rect x="468" y="228" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a"/><text x="486" y="252" text-anchor="middle" fill="#2e6e2e">6</text>
    <rect x="504" y="228" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2"/><text x="522" y="252" text-anchor="middle" fill="#b03a3a" font-weight="bold">7</text>
  </g>

  <!-- highlight shortest path with red arrows -->
  <path d="M 378 120 L 414 120" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 414 120 L 450 156" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 450 156 L 486 192" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 486 192 L 522 228" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="500" y="288" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">数字 = BFS 层数（即到起点的最短距离）</text>
  <text x="500" y="302" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">红箭头 = 8 方向最短路径（5 步 = 7 格）</text>

  <!-- ===== Bottom: key insight ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="320" width="640" height="64" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="60" y="344" font-size="12" fill="#444" filter="url(#rough2)">
    <tspan font-weight="bold" fill="#d6a040">核心观察</tspan>：8 方向 BFS 每扩展一层，路径长度 +1。BFS 天然求最短路径——第一个到达 (n−1, n−1) 的层数即为答案。
  </text>
  <text x="60" y="366" font-size="11" fill="#666" filter="url(#rough2)">起点 (0,0) 在第 1 层（路径长度含起点）。访问过的格子标记为 1（原地修改）避免重复入队。</text>
</svg>
