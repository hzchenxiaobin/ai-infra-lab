<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">第 i 位只有两种情况：同位双双取 1，异位补给小者</text>

  <!-- Case 1: same bits -->
  <rect x="26" y="42" width="468" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="42" y="64" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">情况① a_i = b_i（同位）：A_i 与 B_i 永远同值</text>

  <text x="52" y="100" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">a 的第 i 位</text>
  <rect x="66" y="108" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="83" y="131" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="52" y="152" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">b 的第 i 位</text>
  <rect x="66" y="160" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="83" y="183" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>

  <path d="M 118 151 L 176 151" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="147" y="142" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">x_i = 1 一起翻转</text>

  <text x="196" y="100" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">A 的位</text>
  <rect x="210" y="108" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="227" y="131" text-anchor="middle" font-size="14" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="196" y="152" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">B 的位</text>
  <rect x="210" y="160" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="227" y="183" text-anchor="middle" font-size="14" fill="#2f5d24" filter="url(#rough2)">1</text>

  <text x="266" y="112" font-size="11" fill="#333" filter="url(#rough2)">A += 2^i 且 B += 2^i</text>
  <text x="266" y="132" font-size="11" fill="#333" filter="url(#rough2)">乘积增加 2^i(A+B) + 2^(2i) &gt; 0</text>
  <text x="266" y="152" font-size="11" fill="#b85450" filter="url(#rough2)">严格变好 ⇒ 无脑双取 1</text>
  <text x="266" y="172" font-size="11" fill="#4a7a3a" filter="url(#rough2)">且两人同时 +2^i</text>
  <text x="266" y="188" font-size="11" fill="#4a7a3a" filter="url(#rough2)">⇒ 差 A−B 纹丝不动</text>

  <!-- Case 2: differ bits -->
  <rect x="26" y="204" width="468" height="146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="42" y="226" font-size="12.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">情况② a_i ≠ b_i（异位）：无论 x_i，恰好一个为 1</text>

  <rect x="56" y="240" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="73" y="263" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="56" y="282" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="73" y="305" text-anchor="middle" font-size="14" fill="#8f3a36" filter="url(#rough2)">0</text>
  <text x="73" y="332" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">a_i / b_i</text>

  <path d="M 108 278 L 168 258" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 108 278 L 168 300" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="138" y="250" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">给 A</text>
  <text x="138" y="316" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">给 B</text>

  <rect x="176" y="244" width="118" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="235" y="264" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">(A+2^i) · B</text>
  <rect x="176" y="286" width="118" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="235" y="306" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">A · (B+2^i)</text>

  <path d="M 306 259 L 344 279" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 306 301 L 344 283" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="352" y="258" width="126" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="415" y="277" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">两式相减 = 2^i(B−A)</text>
  <text x="415" y="294" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">给较小的一方！</text>

  <text x="42" y="340" font-size="11" fill="#8a6d1f" filter="url(#rough2)">这一位 2^i 只有唯一一份，给了 A 就给不了 B —— 和 A+B 无论如何不变</text>

  <!-- bottom summary -->
  <rect x="46" y="360" width="428" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="378" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">规则①下 S = A+B 为定值 ⇒ AB = (S² − (A−B)²) / 4</text>
  <text x="260" y="396" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">乘积最大化 ⇔ |A−B| 最小化 ⇔ 异位补给小者，越拉越平</text>
</svg>
