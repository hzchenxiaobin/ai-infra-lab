<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums = [3, 1, 3, 2, 4, 3]</text>

  <!-- ===== Step 1: Array with even/odd coloring ===== -->
  <text x="40" y="50" font-size="11.5" fill="#446688" font-weight="bold">① 原数组按奇偶下标着色</text>

  <!-- index labels -->
  <text x="72" y="68" text-anchor="middle" font-size="9" fill="#888">i=0</text>
  <text x="116" y="68" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="160" y="68" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="204" y="68" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="248" y="68" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="292" y="68" text-anchor="middle" font-size="9" fill="#888">5</text>

  <!-- array cells -->
  <rect x="50" y="74" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="72" y="96" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>
  <rect x="94" y="74" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="116" y="96" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="138" y="74" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="96" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>
  <rect x="182" y="74" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="204" y="96" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <rect x="226" y="74" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="248" y="96" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">4</text>
  <rect x="270" y="74" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="292" y="96" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>

  <!-- group brackets -->
  <path d="M 50 112 L 50 120 L 270 120 L 270 112" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="160" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">偶数位：[3, 3, 4]</text>

  <path d="M 94 112 L 94 128 L 314 128 L 314 112" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)" transform="translate(0,12)"/>
  <text x="204" y="148" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">奇数位：[1, 2, 3]</text>

  <!-- ===== Step 2: Frequency tables ===== -->
  <path d="M 160 156 L 160 170" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="40" y="186" font-size="11.5" fill="#446688" font-weight="bold">② 统计频率 & 取 Top 2</text>

  <!-- Even freq table -->
  <rect x="40" y="194" width="220" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="212" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">偶数位频率表</text>

  <!-- table header -->
  <text x="70" y="230" text-anchor="middle" font-size="9.5" fill="#888">值</text>
  <text x="130" y="230" text-anchor="middle" font-size="9.5" fill="#888">频次</text>
  <text x="200" y="230" text-anchor="middle" font-size="9.5" fill="#888">排名</text>

  <!-- row: 3 -->
  <rect x="55" y="236" width="30" height="20" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="250" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="130" y="250" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="200" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">a₁ (top1)</text>

  <!-- row: 4 -->
  <rect x="55" y="260" width="30" height="20" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="274" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="130" y="274" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="200" y="274" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">a₂ (top2)</text>

  <text x="150" y="290" text-anchor="middle" font-size="9.5" fill="#888">a₁=3, c₁=2 / a₂=4, c₂=1</text>

  <!-- Odd freq table -->
  <rect x="300" y="194" width="220" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="212" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">奇数位频率表</text>

  <text x="330" y="230" text-anchor="middle" font-size="9.5" fill="#888">值</text>
  <text x="390" y="230" text-anchor="middle" font-size="9.5" fill="#888">频次</text>
  <text x="460" y="230" text-anchor="middle" font-size="9.5" fill="#888">排名</text>

  <!-- row: 1 -->
  <rect x="315" y="236" width="30" height="20" fill="#fff" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="330" y="250" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="390" y="250" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="460" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">b₂ (top2)</text>

  <!-- row: 2 -->
  <rect x="315" y="260" width="30" height="20" fill="#fff" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="330" y="274" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="390" y="274" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="460" y="274" text-anchor="middle" font-size="10" fill="#888">—</text>

  <!-- row: 3 -->
  <rect x="315" y="284" width="30" height="14" fill="#fff" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="330" y="295" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="390" y="295" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="460" y="295" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">b₁ (top1)</text>

  <!-- ===== Step 3: Pairing ===== -->
  <path d="M 280 296 L 280 312" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="40" y="328" font-size="11.5" fill="#b85450" font-weight="bold">③ 配对决策：a₁=3 与 b₁=3 相同 → 需退而求其次</text>

  <!-- Candidate 1 -->
  <rect x="40" y="338" width="240" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="358" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">候选1：偶数位留 a₁=3，奇数位留 b₂=1</text>
  <text x="160" y="376" text-anchor="middle" font-size="11" fill="#333">保留 = c₁ + d₂ = 2 + 1 = 3</text>
  <text x="160" y="390" text-anchor="middle" font-size="10.5" fill="#888">操作数 = 6 − 3 = 3</text>

  <!-- Candidate 2 -->
  <rect x="300" y="338" width="240" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="358" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">候选2：偶数位留 a₂=4，奇数位留 b₁=3</text>
  <text x="420" y="376" text-anchor="middle" font-size="11" fill="#333">保留 = c₂ + d₁ = 1 + 1 = 2</text>
  <text x="420" y="390" text-anchor="middle" font-size="10.5" fill="#888">操作数 = 6 − 2 = 4</text>

  <!-- ===== Step 4: Result ===== -->
  <path d="M 160 396 L 160 410" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 420 396 L 420 404 L 160 404" stroke="#888" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>

  <rect x="120" y="414" width="320" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="436" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">max_sum = max(3, 2) = 3</text>
  <text x="280" y="454" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">答案 = 6 − 3 = 3 ✓</text>
  <text x="280" y="470" text-anchor="middle" font-size="9.5" fill="#aaa">选候选1：偶数位全改 3，奇数位全改 1 → [3,1,3,1,3,1]</text>
</svg>
