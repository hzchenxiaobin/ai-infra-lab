<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 2 演算：zero=1, one=2, low=2, high=3</text>

  <!-- table: full-width row rects -->
  <!-- header row -->
  <g filter="url(#rough2)">
    <rect x="40" y="52" width="480" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <!-- data rows -->
  <g filter="url(#rough2)">
    <rect x="40" y="88" width="480" height="36" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="40" y="124" width="480" height="36" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="40" y="160" width="480" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="40" y="196" width="480" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <!-- vertical separators -->
  <g stroke="#888" stroke-width="1" filter="url(#rough2)">
    <line x1="100" y1="52" x2="100" y2="232"/>
    <line x1="230" y1="52" x2="230" y2="232"/>
    <line x1="360" y1="52" x2="360" y2="232"/>
    <line x1="450" y1="52" x2="450" y2="232"/>
  </g>

  <!-- header text -->
  <g filter="url(#rough2)" font-size="12" fill="#334455" text-anchor="middle">
    <text x="70" y="74">i</text>
    <text x="165" y="74">dp[i−zero]=dp[i−1]</text>
    <text x="295" y="74">dp[i−one]=dp[i−2]</text>
    <text x="405" y="74">dp[i]</text>
    <text x="505" y="74">∈[2,3]?</text>
  </g>

  <!-- data text -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <!-- row i=0 -->
    <text x="70" y="110">0</text>
    <text x="165" y="110" fill="#999">—（base）</text>
    <text x="295" y="110" fill="#999">—</text>
    <text x="405" y="110" fill="#b85450" font-weight="bold">1</text>
    <text x="505" y="110">否</text>
    <!-- row i=1 -->
    <text x="70" y="146">1</text>
    <text x="165" y="146">1</text>
    <text x="295" y="146" fill="#999">—（越界→0）</text>
    <text x="405" y="146">1</text>
    <text x="505" y="146">否</text>
    <!-- row i=2 (in range) -->
    <text x="70" y="182">2</text>
    <text x="165" y="182">1</text>
    <text x="295" y="182">1</text>
    <text x="405" y="182" fill="#7a4a10" font-weight="bold">2</text>
    <text x="505" y="182" fill="#d6a040">是</text>
    <!-- row i=3 (in range) -->
    <text x="70" y="218">3</text>
    <text x="165" y="218">2</text>
    <text x="295" y="218">1</text>
    <text x="405" y="218" fill="#7a4a10" font-weight="bold">3</text>
    <text x="505" y="218" fill="#d6a040">是</text>
  </g>

  <!-- produced strings note -->
  <text x="280" y="262" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">对应字符串：长度 2 → '00','11'　｜　长度 3 → '000','011','110'</text>

  <!-- answer caption -->
  <g filter="url(#rough2)">
    <rect x="120" y="284" width="320" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="280" y="314" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">ans = dp[2] + dp[3] = 2 + 3 = 5 ✓</text>
  </g>
</svg>
