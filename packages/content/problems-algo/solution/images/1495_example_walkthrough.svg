  <text x="584" y="152" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗</text>
  <rect x="608" y="136" width="48" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="632" y="152" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗</text>
  <rect x="656" y="136" width="48" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="680" y="152" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗</text>
  <text x="710" y="152" font-size="9" fill="#b85450">✗</text>

