  <text x="70" y="79" text-anchor="middle" font-size="9.5" fill="#333">program_date</text>
  <text x="140" y="79" text-anchor="middle" font-size="9.5" fill="#333">cid</text>
  <text x="235" y="79" text-anchor="middle" font-size="9.5" fill="#333">title</text>
  <text x="350" y="79" text-anchor="middle" font-size="9.5" fill="#333">Kids</text>
  <text x="445" y="79" text-anchor="middle" font-size="9.5" fill="#333">type</text>
  <!-- check columns header -->
  <rect x="560" y="62" width="48" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="584" y="79" text-anchor="middle" font-size="9" fill="#333">①月=06</text>
  <rect x="608" y="62" width="48" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="632" y="79" text-anchor="middle" font-size="9" fill="#333">②Y</text>
