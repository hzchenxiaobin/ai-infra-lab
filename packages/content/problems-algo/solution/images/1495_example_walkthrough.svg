  <rect x="20" y="160" width="540" height="24" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="176" text-anchor="middle" font-size="9.5" fill="#333">2020-05-13</text>
  <text x="140" y="176" text-anchor="middle" font-size="9.5" fill="#446688">4</text>
  <text x="235" y="176" text-anchor="middle" font-size="9.5" fill="#333">Aladdin</text>
  <text x="350" y="176" text-anchor="middle" font-size="9.5" fill="#4a7a3a">Y</text>
  <text x="445" y="176" text-anchor="middle" font-size="9.5" fill="#333">Movies</text>
  <rect x="560" y="160" width="48" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="584" y="176" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗</text>
  <rect x="608" y="160" width="48" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="632" y="176" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="656" y="160" width="48" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="680" y="176" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="710" y="176" font-size="9" fill="#b85450">✗</text>

