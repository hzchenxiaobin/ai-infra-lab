  <text x="680" y="79" text-anchor="middle" font-size="9" fill="#333">③Mov</text>

  <!-- Row 1: 06-10, 1, Leetcode Movie, N, Movies -->
  <rect x="20" y="88" width="540" height="24" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="104" text-anchor="middle" font-size="9.5" fill="#333">2020-06-10</text>
  <text x="140" y="104" text-anchor="middle" font-size="9.5" fill="#446688">1</text>
  <text x="235" y="104" text-anchor="middle" font-size="9.5" fill="#333">Leetcode Movie</text>
