  <text x="584" y="201" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="608" y="184" width="48" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="632" y="201" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="656" y="184" width="48" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="680" y="201" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="710" y="201" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Row 6: 07-15, 5, Cinderella, Y, Movies  (current month) -->
  <rect x="20" y="210" width="540" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="226" text-anchor="middle" font-size="9.5" fill="#333">2020-07-15</text>
  <text x="140" y="226" text-anchor="middle" font-size="9.5" fill="#446688">5</text>
  <text x="235" y="226" text-anchor="middle" font-size="9.5" fill="#333">Cinderella</text>
  <text x="350" y="226" text-anchor="middle" font-size="9.5" fill="#4a7a3a">Y</text>
  <text x="445" y="226" text-anchor="middle" font-size="9.5" fill="#333">Movies</text>
  <rect x="560" y="210" width="48" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="584" y="226" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗</text>
  <rect x="608" y="210" width="48" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="632" y="226" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="656" y="210" width="48" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="680" y="226" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="710" y="226" font-size="9" fill="#b85450">✗</text>

  <!-- annotations -->
  <text x="710" y="60" font-size="8.5" fill="#888">结果</text>

  <!-- arrow to result -->
  <path d="M 360 244 L 360 268" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="372" y="262" font-size="9.5" fill="#4a7a3a">DISTINCT title</text>

  <!-- Result box -->
  <rect x="220" y="274" width="280" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="295" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">输出</text>
  <rect x="300" y="302" width="120" height="22" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="360" y="318" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Aladdin</text>

  <!-- legend / explanation -->
  <rect x="40" y="346" width="640" height="84" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="366" font-size="10.5" fill="#333" font-weight="bold">逐行解读：</text>
  <text x="60" y="382" font-size="9.5" fill="#555">• 06-10 Leetcode Movie：月在 6 月 ✓，但 Kids=N ✗ → 淘汰（非儿童适宜）</text>
  <text x="60" y="396" font-size="9.5" fill="#555">• 05-11/12 两条 5 月记录：月份即 ✗（非上月）→ 淘汰；Alg. for Kids 还是 Series ✗</text>
  <text x="60" y="410" font-size="9.5" fill="#555">• 05-13 Aladdin：②③全 ✓，但落在 5 月（非上月 6 月）✗ → 淘汰（同题不同月不算）</text>
  <text x="60" y="424" font-size="9.5" fill="#555">• 06-18 Aladdin：①②③全 ✓ → 留下；07-15 Cinderella：②③ ✓ 但 7 月为本月 ✗ → 淘汰</text>
</svg>
