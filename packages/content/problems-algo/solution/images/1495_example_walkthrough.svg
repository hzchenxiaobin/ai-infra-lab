  <rect x="20" y="184" width="540" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="201" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">2020-06-18</text>
