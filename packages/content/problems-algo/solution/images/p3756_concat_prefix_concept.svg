<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">「0」是透明的：拼接前缀 P 只编码非零数字</text>

  <!-- Panel A: string cells with prefix P -->
  <text x="40" y="58" font-size="12" fill="#555" filter="url(#rough2)">s =</text>

  <rect x="70" y="36" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="60" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="118" y="36" width="44" height="38" fill="#f2f2f2" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" rx="4" filter="url(#rough2)"/>
  <text x="140" y="60" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <rect x="166" y="36" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="60" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="214" y="36" width="44" height="38" fill="#f2f2f2" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" rx="4" filter="url(#rough2)"/>
  <text x="236" y="60" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <rect x="262" y="36" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="284" y="60" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="310" y="36" width="44" height="38" fill="#f2f2f2" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" rx="4" filter="url(#rough2)"/>
  <text x="332" y="60" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <rect x="358" y="36" width="44" height="38" fill="#f2f2f2" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" rx="4" filter="url(#rough2)"/>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <rect x="406" y="36" width="44" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="428" y="60" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>

  <!-- P row under cells -->
  <text x="40" y="96" font-size="12" fill="#446688" filter="url(#rough2)">P:</text>
  <text x="92" y="96" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <text x="140" y="96" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <text x="188" y="96" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">12</text>
  <text x="236" y="96" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">12</text>
  <text x="284" y="96" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">123</text>
  <text x="332" y="96" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">123</text>
  <text x="380" y="96" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">123</text>
  <text x="428" y="96" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">1234</text>

  <text x="260" y="118" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">读入 0：三个前缀原地踏步（透明）；读入非零 d：P = P·10 + d</text>

  <path d="M 40 130 L 480 134" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- Panel B: query formula -->
  <text x="40" y="156" font-size="12" fill="#555" filter="url(#rough2)">任意查询 [l, r]：前缀相减还原区间拼接数 x</text>

  <rect x="50" y="166" width="420" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="188" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">x ≡ P[r+1] − P[l] · 10^(C[r+1] − C[l])   (mod M)</text>
  <text x="260" y="206" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">幂次 k = C[r+1] − C[l] = 区间非零个数（0 不占数位）</text>

  <rect x="50" y="226" width="420" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="246" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">sum = S[r+1] − S[l]（数字和 = 区间非零数字之和）</text>
  <text x="260" y="264" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">answer = x · sum mod M</text>

  <rect x="50" y="284" width="420" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">查询 [1,3]：x = P[4] − P[1]·10^(C[4]−C[1]) = 12 − 1×10 = 2</text>
  <text x="260" y="322" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">sum = S[4] − S[1] = 3 − 1 = 2；answer = 2×2 = 4 ✓</text>
  <text x="260" y="338" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">若 [l,r] 全是 0：k = 0 ⇒ x = 0、sum = 0 —— 无需跳零特判</text>
</svg>
