<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：max &gt; 每个订单的均值 ⟺ max &gt; MAX(所有订单均值)</text>

  <!-- Y axis -->
  <line x1="50" y1="100" x2="50" y2="340" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="50" y1="340" x2="540" y2="340" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="105" text-anchor="end" font-size="9" fill="#888">qty</text>
  <text x="44" y="344" text-anchor="end" font-size="9" fill="#888">0</text>

  <!-- ===== Threshold line: MAX(avg) = 14.33 ===== -->
  <line x1="50" y1="168" x2="540" y2="168" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <rect x="392" y="150" width="146" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.85"/>
  <text x="465" y="164" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">阈值 = MAX(均值) = 14.33</text>

  <!-- ===== Order 1: max 15 (top 160), avg 12.33 (top 192) ===== -->
  <rect x="66" y="160" width="20" height="180" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="90" y="192" width="20" height="148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="76" y="154" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">15</text>
  <text x="100" y="186" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">12.3</text>
  <rect x="60" y="326" width="56" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.8"/>
  <text x="88" y="338" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">订单1 ✓</text>

  <!-- ===== Order 2: max 8 (top 244), avg 5.5 (top 274) ===== -->
  <rect x="156" y="244" width="20" height="96" fill="#e8f0fe" stroke="#999" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <rect x="180" y="274" width="20" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="166" y="238" text-anchor="middle" font-size="9" fill="#999" font-weight="bold">8</text>
  <text x="190" y="268" text-anchor="middle" font-size="9" fill="#d6a040">5.5</text>
  <text x="178" y="338" text-anchor="middle" font-size="9" fill="#999">订单2</text>

  <!-- ===== Order 3: max 20 (top 100), avg 14.33 (top 168) ===== -->
  <rect x="246" y="100" width="20" height="240" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="270" y="168" width="20" height="172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="256" y="94" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">20</text>
  <text x="280" y="162" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">14.3</text>
  <rect x="240" y="326" width="56" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.8"/>
  <text x="268" y="338" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">订单3 ✓</text>

  <!-- ===== Order 4: max 8 (top 244), avg 5 (top 280) ===== -->
  <rect x="336" y="244" width="20" height="96" fill="#e8f0fe" stroke="#999" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <rect x="360" y="280" width="20" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="346" y="238" text-anchor="middle" font-size="9" fill="#999" font-weight="bold">8</text>
  <text x="370" y="274" text-anchor="middle" font-size="9" fill="#d6a040">5</text>
  <text x="358" y="338" text-anchor="middle" font-size="9" fill="#999">订单4</text>

  <!-- ===== Order 5: max 9 (top 232), avg 9 (top 232) ===== -->
  <rect x="426" y="232" width="20" height="108" fill="#e8f0fe" stroke="#999" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <rect x="450" y="232" width="20" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="436" y="226" text-anchor="middle" font-size="9" fill="#999" font-weight="bold">9</text>
  <text x="460" y="226" text-anchor="middle" font-size="9" fill="#d6a040">9</text>
  <text x="448" y="338" text-anchor="middle" font-size="9" fill="#999">订单5</text>

  <!-- ===== Bottom note: equivalence ===== -->
  <rect x="30" y="362" width="540" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="383" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">「最大数量 &gt; 每个订单的均值（含自身）」 ⟺ 「最大数量 &gt; 所有订单均值的最大值」</text>

  <!-- ===== Legend ===== -->
  <rect x="30" y="404" width="540" height="28" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <rect x="46" y="414" width="12" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="1" filter="url(#rough2)"/>
  <text x="64" y="423" font-size="9" fill="#666">max（订单最大数量）</text>
  <rect x="200" y="414" width="12" height="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="1" filter="url(#rough2)"/>
  <text x="218" y="423" font-size="9" fill="#666">avg（订单均值）</text>
  <line x1="330" y1="419" x2="352" y2="419" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="358" y="423" font-size="9" fill="#666">阈值 = MAX(各均值)</text>
  <rect x="470" y="414" width="12" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="1" filter="url(#rough2)"/>
  <text x="488" y="423" font-size="9" fill="#4a7a3a" font-weight="bold">越过阈值 = 不平衡</text>
</svg>
