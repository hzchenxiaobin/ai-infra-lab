<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：值域 0–100 →「计数桶」+「试除判质数」</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">示例 1 · nums = [1, 2, 3, 4, 5, 4] —— 元素 4 出现 2 次，2 是质数</text>

  <!-- ============ Panel 1: 输入数组 ============ -->
  <text x="44" y="64" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 输入数组</text>

  <g filter="url(#rough2)">
    <rect x="150" y="50" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="192" y="50" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="234" y="50" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="276" y="50" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="318" y="50" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="360" y="50" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>

    <text x="166" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
    <text x="208" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
    <text x="250" y="68" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold">4</text>
    <text x="292" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
    <text x="334" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
    <text x="376" y="68" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold">4</text>

    <text x="166" y="90" text-anchor="middle" font-size="8" fill="#999">i=0</text>
    <text x="208" y="90" text-anchor="middle" font-size="8" fill="#999">i=1</text>
    <text x="250" y="90" text-anchor="middle" font-size="8" fill="#999">i=2</text>
    <text x="292" y="90" text-anchor="middle" font-size="8" fill="#999">i=3</text>
    <text x="334" y="90" text-anchor="middle" font-size="8" fill="#999">i=4</text>
    <text x="376" y="90" text-anchor="middle" font-size="8" fill="#999">i=5</text>
  </g>

  <text x="414" y="68" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">← 两个 4</text>

  <path d="M 260 98 L 260 116" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ============ Panel 2: 计数桶 ============ -->
  <text x="44" y="138" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 计数桶 cnt[x]（x = 0…100）</text>

  <g filter="url(#rough2)">
    <text x="112" y="167" font-size="10.5" fill="#666" font-weight="bold">x</text>
    <rect x="122" y="152" width="52" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="182" y="152" width="52" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="242" y="152" width="52" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="302" y="152" width="52" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="362" y="152" width="52" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="148" y="168" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold">1</text>
    <text x="208" y="168" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold">2</text>
    <text x="268" y="168" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold">4</text>
    <text x="328" y="168" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold">5</text>
    <text x="388" y="168" text-anchor="middle" font-size="10" fill="#2a5a2a" font-weight="bold">…</text>

    <text x="112" y="197" font-size="10.5" fill="#666" font-weight="bold">cnt</text>
    <rect x="122" y="182" width="52" height="22" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <rect x="182" y="182" width="52" height="22" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <rect x="242" y="182" width="52" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="302" y="182" width="52" height="22" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <rect x="362" y="182" width="52" height="22" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <text x="148" y="198" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="208" y="198" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="268" y="198" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold">2</text>
    <text x="328" y="198" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="388" y="198" text-anchor="middle" font-size="12" fill="#999">…</text>
  </g>

  <text x="260" y="222" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">0 ≤ nums[i] ≤ 100 → 开一个长度 101 的桶即可，连哈希表都不用</text>

  <path d="M 260 230 L 260 248" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ============ Panel 3: 频次判质数 ============ -->
  <text x="44" y="262" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 逐个频次判质数（f &lt; 2 一票否决）</text>

  <g filter="url(#rough2)">
    <rect x="80" y="272" width="76" height="40" fill="#f7f7f7" stroke="#aaa" stroke-width="1.3" rx="6"/>
    <text x="118" y="288" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">f = 1</text>
    <text x="118" y="304" text-anchor="middle" font-size="10" fill="#999">非质数 ✗</text>

    <rect x="168" y="272" width="76" height="40" fill="#f7f7f7" stroke="#aaa" stroke-width="1.3" rx="6"/>
    <text x="206" y="288" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">f = 1</text>
    <text x="206" y="304" text-anchor="middle" font-size="10" fill="#999">非质数 ✗</text>

    <rect x="256" y="272" width="76" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6"/>
    <text x="294" y="288" text-anchor="middle" font-size="11" fill="#2a5a2a" font-weight="bold">f = 2</text>
    <text x="294" y="304" text-anchor="middle" font-size="10" fill="#2a5a2a" font-weight="bold">质数 ✓</text>

    <rect x="344" y="272" width="76" height="40" fill="#f7f7f7" stroke="#aaa" stroke-width="1.3" rx="6"/>
    <text x="382" y="288" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">f = 1</text>
    <text x="382" y="304" text-anchor="middle" font-size="10" fill="#999">非质数 ✗</text>

    <rect x="432" y="272" width="76" height="40" fill="#f7f7f7" stroke="#aaa" stroke-width="1.3" rx="6"/>
    <text x="470" y="288" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">f = 1</text>
    <text x="470" y="304" text-anchor="middle" font-size="10" fill="#999">非质数 ✗</text>
  </g>

  <text x="294" y="326" text-anchor="middle" font-size="9" fill="#2a5a2a" filter="url(#rough2)">1 不是质数（质数必须 &gt; 1）；2 是最小质数，试除 d = 2…√f 即可确认</text>

  <!-- ============ 结果框 ============ -->
  <g filter="url(#rough2)">
    <rect x="60" y="340" width="400" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="260" y="359" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold">存在频次为质数的元素（4 → 2）→ 返回 true</text>
    <text x="260" y="377" text-anchor="middle" font-size="8.5" fill="#333">频次 f ≤ 100 → √f ≤ 10，每个频次至多试除 10 次；100 以内的质数只有 25 个</text>
  </g>
</svg>
