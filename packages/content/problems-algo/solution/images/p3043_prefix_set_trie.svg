<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 364" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="364" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：公共前缀 ⟺ arr2 的前缀出现在 arr1 的前缀集合中</text>

  <!-- left panel: hash set view -->
  <rect x="16" y="42" width="238" height="252" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="10" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="135" y="64" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">视角一：前缀哈希集合</text>

  <rect x="36" y="76" width="198" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="135" y="96" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">arr1 = [1, 10, 100]</text>

  <path d="M 135 106 L 135 116" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="36" y="122" width="198" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="135" y="140" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">反复 ÷10，全部前缀入集合：</text>
  <rect x="52" y="148" width="44" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="74" y="166" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="104" y="148" width="48" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="128" y="166" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="160" y="148" width="52" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="186" y="166" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">100</text>

  <text x="135" y="208" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">y = 1000 从长到短探测：</text>

  <rect x="48" y="220" width="72" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="84" y="240" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1000 ✗</text>

  <path d="M 122 235 L 136 235" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="140" y="220" width="66" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="173" y="240" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">100 ✓</text>

  <text x="135" y="276" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">首个命中即停，len = 3</text>

  <!-- right panel: trie view -->
  <rect x="266" y="42" width="238" height="252" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="10" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="385" y="64" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">视角二：10 叉 Trie</text>

  <circle cx="385" cy="92" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="385" y="96" text-anchor="middle" font-size="9" fill="#8a6d3b" filter="url(#rough2)">根</text>
  <path d="M 385 103 L 385 117" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <circle cx="385" cy="132" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="385" y="137" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 385 145 L 385 159" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <circle cx="385" cy="174" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="385" y="179" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <path d="M 385 187 L 385 201" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <circle cx="385" cy="216" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="385" y="221" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>

  <text x="356" y="136" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">深度 1 · 前缀 1</text>
  <text x="356" y="178" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">深度 2 · 前缀 10</text>
  <text x="356" y="220" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">深度 3 · 前缀 100</text>

  <text x="406" y="108" text-anchor="start" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">y = 1000：</text>
  <text x="406" y="136" text-anchor="start" font-size="10" fill="#4a7a3a" filter="url(#rough2)">第1位 1 ✓</text>
  <text x="406" y="178" text-anchor="start" font-size="10" fill="#4a7a3a" filter="url(#rough2)">第2位 0 ✓</text>
  <text x="406" y="220" text-anchor="start" font-size="10" fill="#4a7a3a" filter="url(#rough2)">第3位 0 ✓</text>
  <text x="406" y="252" text-anchor="start" font-size="10" fill="#b85450" filter="url(#rough2)">第4位 0 ✗ 无路</text>

  <text x="385" y="280" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">停在深度 3 → 答案 3</text>

  <!-- bottom strip -->
  <rect x="16" y="308" width="488" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">一个数的所有前缀 = 从根出发的一条链；查询 = 沿链下走，能走多深，公共前缀就有多长。</text>
  <text x="260" y="344" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">集合元素 ↔ Trie 节点、命中长度 ↔ 走到的深度，两种视角同构。</text>
</svg>
