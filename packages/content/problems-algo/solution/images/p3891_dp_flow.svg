<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="4.5" refY="7.5" orient="auto">
      <path d="M0,0 L4.5,7.5 L9,0 Z" fill="#446688"/>
    </marker>
    <marker id="arrGy" markerWidth="9" markerHeight="9" refX="4.5" refY="7.5" orient="auto">
      <path d="M0,0 L4.5,7.5 L9,0 Z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：(个数, 代价) 字典序双目标的一趟扫描 DP</text>

  <!-- 初始化 -->
  <rect x="160" y="32" width="200" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="52" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">dp0 = (0, 0)，dp1 = 不可达哨兵</text>
  <path d="M 260 64 L 260 76" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 循环头 -->
  <rect x="140" y="80" width="240" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="100" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">对每个内部位置 i = 1 … n−2</text>

  <path d="M 260 112 L 260 120 L 160 120 L 160 132" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 260 112 L 260 120 L 360 120 L 360 132" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 两个转移 -->
  <rect x="58" y="136" width="204" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="155" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">选 i 为特殊</text>
  <text x="160" y="173" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">dp1 ← dp0 + (1, c(i))</text>

  <rect x="278" y="136" width="204" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="155" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">不选 i</text>
  <text x="380" y="173" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">dp0 ← better(dp0, dp1)</text>

  <path d="M 160 186 L 160 200 L 360 200" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 360 186 L 360 200" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 260 200 L 260 212" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- better 说明 -->
  <rect x="100" y="216" width="320" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="234" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">better(a, b)：个数大者优先</text>
  <text x="260" y="251" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">个数相同 ⇒ 代价小者优先（字典序）</text>

  <path d="M 260 260 L 260 272" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 结果 -->
  <rect x="130" y="276" width="260" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="297" text-anchor="middle" font-size="11.5" fill="#8f3a34" font-weight="bold" filter="url(#rough2)">答案 = better(dp0, dp1).cost</text>

  <!-- 回边 -->
  <path d="M 482 161 L 498 161 L 498 96 L 384 96" fill="none" stroke="#999" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrGy)" filter="url(#rough2)"/>
  <text x="446" y="90" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">下一个 i</text>

  <!-- 代价公式备注 -->
  <rect x="58" y="322" width="330" height="28" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="223" y="340" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">c(i) = max(0, max(nums[i−1], nums[i+1]) + 1 − nums[i])</text>
  <text x="400" y="340" font-size="9.5" fill="#888" filter="url(#rough2)">O(n) 时间 · O(1) 空间</text>
</svg>
