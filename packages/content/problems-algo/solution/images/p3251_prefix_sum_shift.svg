<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 412"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="412" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">转移 = 前缀和 + 右移 d 格</text>
  <text x="260" y="38" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">dp[i][j] = dp[i−1][0] + … + dp[i−1][j−d]；图中 d = 1，dp[i−1] = [1,1,2,1,1]</text>

  <!-- ① 上一层 dp[i-1] -->
  <text x="36" y="62" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 上一层 dp[i−1]（按 arr1 取值 j 分桶）</text>

  <rect x="100" y="124" width="38" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="158" y="124" width="38" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="216" y="108" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="274" y="124" width="38" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="332" y="124" width="38" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="119" y="118" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="177" y="118" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="235" y="102" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="293" y="118" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="351" y="118" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">1</text>
  <path d="M 92 140 L 430 140" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="119" y="156" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">j=0</text>
  <text x="177" y="156" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">j=1</text>
  <text x="235" y="156" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">j=2</text>
  <text x="293" y="156" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">j=3</text>
  <text x="351" y="156" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">j=4</text>

  <!-- ② 前缀和 S(m) -->
  <text x="36" y="186" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">② 前缀和 S(m) = dp[i−1][0] + … + dp[i−1][m]</text>

  <rect x="100" y="276" width="38" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="158" y="260" width="38" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="216" y="228" width="38" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="274" y="212" width="38" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="332" y="196" width="38" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="119" y="270" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">1</text>
  <text x="177" y="254" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">2</text>
  <text x="235" y="222" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">4</text>
  <text x="293" y="206" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">5</text>
  <text x="351" y="190" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">6</text>
  <path d="M 92 292 L 430 292" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="119" y="308" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">m=0</text>
  <text x="177" y="308" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">m=1</text>
  <text x="235" y="308" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">m=2</text>
  <text x="293" y="308" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">m=3</text>
  <text x="351" y="308" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">m=4</text>

  <!-- 右移箭头 -->
  <path d="M 448 254 Q 492 302 448 352" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="484" y="294" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">右移</text>
  <text x="484" y="308" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">d=1 格</text>

  <!-- ③ 本层 dp[i] -->
  <text x="36" y="336" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ 本层 dp[i][j] = S(j−d)</text>

  <rect x="158" y="372" width="38" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="216" y="356" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="274" y="324" width="38" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="332" y="308" width="38" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="177" y="366" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="235" y="350" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">2</text>
  <text x="293" y="318" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">4</text>
  <text x="351" y="302" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">5</text>
  <text x="119" y="382" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="119" y="366" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">j&lt;d 清零</text>
  <path d="M 92 388 L 430 388" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="119" y="404" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">j=0</text>
  <text x="177" y="404" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">j=1</text>
  <text x="235" y="404" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">j=2</text>
  <text x="293" y="404" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">j=3</text>
  <text x="351" y="404" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">j=4</text>
</svg>
