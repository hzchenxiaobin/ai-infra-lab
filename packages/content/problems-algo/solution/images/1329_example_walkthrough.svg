<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：每条对角线升序排序</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">以 k=0 主对角线 [3,2,1]→[1,2,3] 为例，其余同理</text>

  <!-- ===== BEFORE matrix ===== -->
  <text x="130" y="78" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">排序前</text>
  <!-- row 0 -->
  <g font-size="15">
    <rect x="40"  y="88" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="64"  y="114" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <rect x="88"  y="88" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="112" y="114" text-anchor="middle" fill="#333">3</text>
    <rect x="136" y="88" width="48" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="160" y="114" text-anchor="middle" fill="#333">1</text>
    <rect x="184" y="88" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="208" y="114" text-anchor="middle" fill="#333">1</text>
  </g>
  <!-- row 1 -->
  <g font-size="15">
    <rect x="40"  y="128" width="48" height="40" fill="#f3e5f5" stroke="#8e44ad" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="64"  y="154" text-anchor="middle" fill="#333">2</text>
    <rect x="88"  y="128" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="112" y="154" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="136" y="128" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="160" y="154" text-anchor="middle" fill="#333">1</text>
    <rect x="184" y="128" width="48" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="208" y="154" text-anchor="middle" fill="#333">2</text>
  </g>
  <!-- row 2 -->
  <g font-size="15">
    <rect x="40"  y="168" width="48" height="40" fill="#e0f5f3" stroke="#2a8a7a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="64"  y="194" text-anchor="middle" fill="#333">1</text>
    <rect x="88"  y="168" width="48" height="40" fill="#f3e5f5" stroke="#8e44ad" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="112" y="194" text-anchor="middle" fill="#333">1</text>
    <rect x="136" y="168" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="160" y="194" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="184" y="168" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="208" y="194" text-anchor="middle" fill="#333">2</text>
  </g>
  <!-- diagonal arrow before -->
  <path d="M 64 96 L 160 192" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="150" y="232" font-size="10" fill="#b85450" font-weight="bold">k=0：[3, 2, 1]</text>

  <!-- ===== arrow between ===== -->
  <path d="M 240 148 L 300 148" stroke="#666" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="270" y="140" text-anchor="middle" font-size="9" fill="#888">分组排序</text>
  <text x="270" y="164" text-anchor="middle" font-size="9" fill="#888">写回</text>

  <!-- ===== AFTER matrix ===== -->
  <text x="400" y="78" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">排序后</text>
  <!-- row 0 -->
  <g font-size="15">
    <rect x="310" y="88" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="334" y="114" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="358" y="88" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="382" y="114" text-anchor="middle" fill="#333">1</text>
    <rect x="406" y="88" width="48" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="430" y="114" text-anchor="middle" fill="#333">1</text>
    <rect x="454" y="88" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="478" y="114" text-anchor="middle" fill="#333">1</text>
  </g>
  <!-- row 1 -->
  <g font-size="15">
    <rect x="310" y="128" width="48" height="40" fill="#f3e5f5" stroke="#8e44ad" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="334" y="154" text-anchor="middle" fill="#333">1</text>
    <rect x="358" y="128" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="382" y="154" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="406" y="128" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="430" y="154" text-anchor="middle" fill="#333">2</text>
    <rect x="454" y="128" width="48" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="478" y="154" text-anchor="middle" fill="#333">2</text>
  </g>
  <!-- row 2 -->
  <g font-size="15">
    <rect x="310" y="168" width="48" height="40" fill="#e0f5f3" stroke="#2a8a7a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="334" y="194" text-anchor="middle" fill="#333">1</text>
    <rect x="358" y="168" width="48" height="40" fill="#f3e5f5" stroke="#8e44ad" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="382" y="194" text-anchor="middle" fill="#333">2</text>
    <rect x="406" y="168" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="430" y="194" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <rect x="454" y="168" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="478" y="194" text-anchor="middle" fill="#333">3</text>
  </g>
  <!-- diagonal arrow after -->
  <path d="M 334 96 L 430 192" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="420" y="232" font-size="10" fill="#b85450" font-weight="bold">k=0：[1, 2, 3]</text>

  <!-- ===== per-diagonal summary table ===== -->
  <text x="280" y="270" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">各对角线排序对照</text>

  <g font-size="10">
    <!-- header -->
    <rect x="60"  y="284" width="80" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="100" y="300" text-anchor="middle" fill="#555" font-weight="bold">key k</text>
    <rect x="140" y="284" width="170" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="225" y="300" text-anchor="middle" fill="#555" font-weight="bold">原始序列</text>
    <rect x="310" y="284" width="170" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="395" y="300" text-anchor="middle" fill="#555" font-weight="bold">排序后</text>

    <!-- rows -->
    <rect x="60"  y="308" width="80" height="22" fill="#e0f5f3" stroke="#2a8a7a" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="100" y="323" text-anchor="middle" fill="#333">2</text>
    <rect x="140" y="308" width="170" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="225" y="323" text-anchor="middle" fill="#333">[1]</text>
    <rect x="310" y="308" width="170" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="395" y="323" text-anchor="middle" fill="#333">[1]</text>

    <rect x="60"  y="330" width="80" height="22" fill="#f3e5f5" stroke="#8e44ad" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="100" y="345" text-anchor="middle" fill="#333">1</text>
    <rect x="140" y="330" width="170" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="225" y="345" text-anchor="middle" fill="#333">[2, 1]</text>
    <rect x="310" y="330" width="170" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="395" y="345" text-anchor="middle" fill="#333">[1, 2]</text>

    <rect x="60"  y="352" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="100" y="367" text-anchor="middle" fill="#333">0</text>
    <rect x="140" y="352" width="170" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="225" y="367" text-anchor="middle" fill="#333">[3, 2, 1]</text>
    <rect x="310" y="352" width="170" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="395" y="367" text-anchor="middle" fill="#333">[1, 2, 3]</text>

    <rect x="60"  y="374" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="100" y="389" text-anchor="middle" fill="#333">−1</text>
    <rect x="140" y="374" width="170" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="225" y="389" text-anchor="middle" fill="#333">[3, 1, 2]</text>
    <rect x="310" y="374" width="170" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="395" y="389" text-anchor="middle" fill="#333">[1, 2, 3]</text>

    <rect x="60"  y="396" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="100" y="411" text-anchor="middle" fill="#333">−2</text>
    <rect x="140" y="396" width="170" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="225" y="411" text-anchor="middle" fill="#333">[1, 2]</text>
    <rect x="310" y="396" width="170" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="395" y="411" text-anchor="middle" fill="#333">[1, 2]</text>

    <rect x="60"  y="418" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="100" y="433" text-anchor="middle" fill="#333">−3</text>
    <rect x="140" y="418" width="170" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="225" y="433" text-anchor="middle" fill="#333">[1]</text>
    <rect x="310" y="418" width="170" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="395" y="433" text-anchor="middle" fill="#333">[1]</text>
  </g>

  <text x="280" y="454" text-anchor="middle" font-size="10" fill="#888">写回时按 i 升序遍历 → 同对角线先到的格子取最小值</text>
</svg>
