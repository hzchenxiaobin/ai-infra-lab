<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：水够直走 1 步，水不够折返 2i+1 步</text>

  <!-- ====== Top scene: river + plants ====== -->
  <!-- River -->
  <path d="M 40 56 Q 55 48 70 56 Q 85 64 100 56 L 100 86 Q 85 94 70 86 Q 55 78 40 86 Z"
        fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="75" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">河</text>
  <text x="70" y="104" text-anchor="middle" font-size="9" fill="#aaa">x=−1</text>

  <!-- Plants 0-3 -->
  <circle cx="150" cy="71" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="150" y="104" text-anchor="middle" font-size="9" fill="#aaa">x=0</text>

  <circle cx="220" cy="71" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="220" y="104" text-anchor="middle" font-size="9" fill="#aaa">x=1</text>

  <circle cx="290" cy="71" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="290" y="104" text-anchor="middle" font-size="9" fill="#aaa">x=2</text>

  <circle cx="360" cy="71" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="360" y="104" text-anchor="middle" font-size="9" fill="#aaa">x=3</text>

  <!-- divider -->
  <path d="M 30 120 L 530 120" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Case 1: enough water → direct ====== -->
  <text x="36" y="146" font-size="12" fill="#4a7a3a" font-weight="bold">情况一：水够 → 直走 1 步</text>

  <circle cx="120" cy="184" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="189" text-anchor="middle" font-size="10" fill="#333">i−1</text>

  <circle cx="280" cy="184" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="189" text-anchor="middle" font-size="10" fill="#333">i</text>

  <!-- direct arrow -->
  <path d="M 136 184 L 264 184" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="178" y="162" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="200" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1 步</text>

  <!-- water can + note -->
  <rect x="380" y="166" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="382" y="176" width="42" height="24" fill="#b8d4f0" filter="url(#rough2)"/>
  <text x="403" y="188" text-anchor="middle" font-size="9" fill="#333">水罐</text>
  <text x="438" y="178" font-size="10" fill="#4a7a3a">cur ≥ plants[i]</text>
  <text x="438" y="194" font-size="10" fill="#4a7a3a" font-weight="bold">→ ans += 1</text>

  <!-- divider -->
  <path d="M 30 216 L 530 216" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Case 2: not enough → detour ====== -->
  <text x="36" y="242" font-size="12" fill="#d6a040" font-weight="bold">情况二：水不够 → 折返河边再过来</text>

  <circle cx="120" cy="288" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="293" text-anchor="middle" font-size="10" fill="#333">i−1</text>

  <!-- river in middle -->
  <path d="M 220 276 Q 235 268 250 276 Q 265 284 280 276 L 280 300 Q 265 308 250 300 Q 235 292 220 300 Z"
        fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="293" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">河</text>

  <circle cx="380" cy="288" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="293" text-anchor="middle" font-size="10" fill="#333">i</text>

  <!-- detour arrow 1: plant i-1 → river -->
  <path d="M 134 288 L 218 288" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="176" y="280" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">i 步</text>

  <!-- detour arrow 2: river → plant i -->
  <path d="M 282 288 L 364 288" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="323" y="280" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">i+1 步</text>

  <!-- total -->
  <rect x="130" y="318" width="150" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="205" y="336" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">合计：2i + 1 步</text>

  <!-- water can + note -->
  <rect x="380" y="270" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="382" y="290" width="42" height="14" fill="#b8d4f0" filter="url(#rough2)"/>
  <text x="403" y="284" text-anchor="middle" font-size="9" fill="#333">水罐</text>
  <text x="438" y="282" font-size="10" fill="#d6a040">cur &lt; plants[i]</text>
  <text x="438" y="298" font-size="10" fill="#d6a040" font-weight="bold">→ ans += 2i+1</text>

  <!-- ====== Bottom formula ====== -->
  <rect x="50" y="358" width="460" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">
    每株：够水 ans+=1 / 不够 ans+=2i+1；浇完更新 cur
  </text>
</svg>
