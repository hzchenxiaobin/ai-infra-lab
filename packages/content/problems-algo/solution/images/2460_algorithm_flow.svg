<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 780" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="780" fill="#fafafa"/>

  <text x="230" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">对数组执行操作 · 两阶段流程</text>

  <!-- ===== Phase 1 ===== -->
  <text x="230" y="48" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">阶段① 顺序合并相邻相等</text>

  <rect x="120" y="58" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="80" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">初始化</text>
  <text x="230" y="96" text-anchor="middle" font-size="11" fill="#555">i ← 0</text>

  <path d="M 230 102 L 230 122" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <polygon points="230,124 332,172 230,220 128,172" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="168" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i &lt; n−1 ?</text>
  <text x="230" y="186" text-anchor="middle" font-size="10.5" fill="#777">还有相邻对？</text>

  <!-- Yes down -->
  <path d="M 230 220 L 230 240" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="244" y="236" font-size="11" fill="#82b366" font-weight="bold">是</text>

  <!-- action1 -->
  <rect x="78" y="242" width="304" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="263" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">若 nums[i] == nums[i+1]：</text>
  <text x="230" y="281" text-anchor="middle" font-size="11" fill="#4a7a3a">  nums[i] ← 2·nums[i]； nums[i+1] ← 0</text>
  <text x="230" y="300" text-anchor="middle" font-size="11" fill="#555">i ← i+1</text>

  <path d="M 230 310 L 230 330" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- loop back 1 -->
  <path d="M 230 330 L 58 330 L 58 172 L 124 172" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="64" y="324" font-size="10.5" fill="#888" font-style="italic">循环</text>

  <!-- No -> phase2 (right channel) -->
  <path d="M 332 172 L 400 172 L 400 399 L 354 399" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="338" y="164" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="406" y="200" font-size="10" fill="#888" font-style="italic">合并完成</text>

  <!-- ===== Phase 2 ===== -->
  <text x="230" y="364" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">阶段② 读写双指针搬零（同 283）</text>

  <rect x="110" y="378" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="400" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">初始化</text>
  <text x="230" y="416" text-anchor="middle" font-size="11" fill="#555">slow ← 0,  fast ← 0</text>

  <path d="M 230 422 L 230 442" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <polygon points="230,444 332,492 230,540 128,492" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="488" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">fast &lt; n ?</text>
  <text x="230" y="506" text-anchor="middle" font-size="10.5" fill="#777">还有未扫描元素？</text>

  <!-- Yes down -->
  <path d="M 230 540 L 230 560" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="244" y="556" font-size="11" fill="#82b366" font-weight="bold">是</text>

  <!-- action2 -->
  <rect x="68" y="562" width="324" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="583" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">若 nums[fast] ≠ 0：</text>
  <text x="230" y="601" text-anchor="middle" font-size="11" fill="#4a7a3a">  nums[slow] ← nums[fast]； slow++</text>
  <text x="230" y="620" text-anchor="middle" font-size="11" fill="#555">fast ← fast+1</text>

  <path d="M 230 630 L 230 650" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- loop back 2 -->
  <path d="M 230 650 L 58 650 L 58 492 L 124 492" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="64" y="644" font-size="10.5" fill="#888" font-style="italic">循环</text>

  <!-- No -> fill zeros -->
  <path d="M 332 492 L 400 492 L 400 690 L 354 690" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="338" y="484" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="406" y="520" font-size="10" fill="#888" font-style="italic">扫描结束</text>

  <!-- fill zeros box -->
  <rect x="110" y="668" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="690" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">补零</text>
  <text x="230" y="706" text-anchor="middle" font-size="11" fill="#555">[slow, n) ← 0</text>

  <path d="M 230 712 L 230 730" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- End -->
  <ellipse cx="230" cy="752" rx="48" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="757" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">结束</text>

  <text x="230" y="774" text-anchor="middle" font-size="10.5" fill="#d6a040" font-style="italic">O(n) 时间，O(1) 空间，原地保序</text>
</svg>
