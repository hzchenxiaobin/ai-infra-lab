<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：1 显著 ⇒ 0 的个数 ≤ √n，固定 l 按「0 的个数」切段</text>

  <!-- 上：不等式上界 -->
  <rect x="30" y="34" width="460" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="56" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1 显著 ⇔ ones ≥ zeros²，而 ones ≤ n ⇒ zeros ≤ √n ≈ 200（n = 4×10⁴）</text>
  <text x="260" y="78" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">合法子串的 0 极少 → 不枚举右端点 r，枚举 0 的个数 k（仅 O(√n) 种）</text>

  <!-- 中：示例串 -->
  <text x="36" y="114" font-size="10" fill="#555" filter="url(#rough2)">示例：s = 1101011（n = 7），固定 l = 0</text>

  <text x="44" y="130" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">l</text>
  <path d="M 50 136 H 66" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="120" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="87" y="139" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="108" y="120" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="125" y="139" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="146" y="120" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="163" y="139" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">0</text>
  <rect x="184" y="120" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="201" y="139" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="222" y="120" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="239" y="139" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">0</text>
  <rect x="260" y="120" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="277" y="139" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="298" y="120" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="315" y="139" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <text x="87" y="164" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="125" y="164" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="163" y="164" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="201" y="164" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="239" y="164" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="277" y="164" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>
  <text x="315" y="164" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">6</text>

  <text x="163" y="181" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">p₀</text>
  <text x="239" y="181" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">p₁</text>
  <path d="M 342 116 V 206" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="350" y="128" font-size="9" fill="#888" filter="url(#rough2)">哨兵</text>
  <text x="350" y="141" font-size="9" fill="#888" filter="url(#rough2)">p₂ = n = 7</text>

  <!-- 分段色条 -->
  <rect x="70" y="192" width="72" height="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="106" y="201" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">✓</text>
  <rect x="146" y="192" width="72" height="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="182" y="201" text-anchor="middle" font-size="8.5" fill="#8a6d3b" filter="url(#rough2)">✓</text>
  <rect x="222" y="192" width="34" height="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="239" y="201" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">✗</text>
  <rect x="260" y="192" width="72" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="296" y="201" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <path d="M 106 203 V 211" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="106" y="224" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">k=0：r ∈ [l, p₀−1] 全 1 → 整段 ✓</text>

  <path d="M 182 203 V 233" stroke="#d6a040" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="182" y="245" text-anchor="middle" font-size="9" fill="#8a6d3b" filter="url(#rough2)">k=1：r ∈ [p₀, p₁−1]，需 ones ≥ 1 → 整段 ✓</text>

  <path d="M 296 203 V 253" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="292" y="265" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">k=2：r ∈ [p₁, p₂−1]，需 ones ≥ 4 ⇒ r ≥ 5 → 掐头剩 [5,6] ✓</text>

  <!-- 下：公式 -->
  <rect x="30" y="280" width="460" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">恰好 k 个 0 ⇒ r ∈ [p_{k−1}, p_k − 1]（k = 0 时为 [l, p₀−1]）</text>
  <text x="260" y="319" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">段内 ones = (r−l+1) − k ≥ k² ⇔ r ≥ l + k² + k − 1（合法 r = 段内后缀）</text>
  <text x="260" y="338" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">段贡献 = max(0, p_k − 1 − max(p_{k−1}, l+k²+k−1) + 1)</text>

  <rect x="30" y="358" width="460" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="378" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">k 枚举到 √n 为止（l + k² + k &gt; n 即剪枝）→ 单个 l 仅 O(√n) 段，总计 O(n√n)</text>
</svg>
