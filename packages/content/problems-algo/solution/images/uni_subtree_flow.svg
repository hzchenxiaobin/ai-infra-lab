<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">后序 DFS 流程：dfs(node) 返回 bool，true 时计数</text>

  <!-- 入口 -->
  <rect x="225" y="44" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333">调用 dfs(node)</text>

  <!-- 判空 菱形 -->
  <path d="M 280 80 L 340 110 L 280 140 L 220 110 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="114" text-anchor="middle" font-size="11" fill="#333">node == null?</text>
  <path d="M 280 72 L 280 80" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 是 → return true -->
  <path d="M 340 110 L 420 110" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="102" font-size="10" fill="#4a7a3a">是</text>
  <rect x="420" y="96" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="475" y="114" text-anchor="middle" font-size="11" fill="#333">return true</text>

  <!-- 否 → 递归 -->
  <path d="M 220 110 L 160 110" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="102" font-size="10" fill="#b85450">否</text>

  <rect x="70" y="96" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="115" y="114" text-anchor="middle" font-size="11" fill="#333">递归左右</text>
  <text x="115" y="140" text-anchor="middle" font-size="10" fill="#888">leftUni / rightUni</text>

  <path d="M 115 124 L 115 150 L 280 150 L 280 165" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 两子都同值? -->
  <path d="M 280 165 L 350 195 L 280 225 L 210 195 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="199" text-anchor="middle" font-size="11" fill="#333">leftUni &amp; rightUni?</text>

  <!-- 否 → return false -->
  <path d="M 210 195 L 130 195" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="187" font-size="10" fill="#b85450">否</text>
  <rect x="40" y="181" width="90" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="85" y="199" text-anchor="middle" font-size="11" fill="#333">return false</text>

  <!-- 是 → 检查值 -->
  <path d="M 280 225 L 280 245" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="240" font-size="10" fill="#4a7a3a">是</text>

  <path d="M 280 245 L 365 275 L 280 305 L 195 275 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="271" text-anchor="middle" font-size="10" fill="#333">val==left.val</text>
  <text x="280" y="285" text-anchor="middle" font-size="10" fill="#333">且 val==right.val?</text>
  <text x="280" y="298" text-anchor="middle" font-size="9" fill="#888">(孩子为空则跳过)</text>

  <!-- 否 → return false -->
  <path d="M 365 275 L 440 275" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="267" font-size="10" fill="#b85450">否</text>
  <rect x="440" y="261" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="490" y="279" text-anchor="middle" font-size="11" fill="#333">return false</text>

  <!-- 是 → count++ / return true -->
  <path d="M 280 305 L 280 325" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="320" font-size="10" fill="#4a7a3a">是</text>

  <rect x="200" y="325" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="347" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">count++; return true</text>

  <!-- 底部说明 -->
  <rect x="50" y="375" width="460" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="397" text-anchor="middle" font-size="11" fill="#555">空节点 return true（空真为真）· 叶子天然同值 · 一假即短路传递</text>
</svg>
