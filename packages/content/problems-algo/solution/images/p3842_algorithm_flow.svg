<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：一次计数 + 一次扫描，O(n + 100)</text>

  <!-- 步骤 1：初始化 -->
  <rect x="140" y="48" width="280" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="12.5" fill="#2a4a68" filter="url(#rough2)">① 初始化计数数组 cnt[1..100] = 0</text>

  <path d="M280,86 L280,112" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2：遍历计数 -->
  <rect x="140" y="116" width="280" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="140" text-anchor="middle" font-size="12.5" fill="#2a4a68" filter="url(#rough2)">② 遍历 bulbs：对每个 x 执行 cnt[x] += 1</text>

  <path d="M280,154 L280,180" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 3：判断菱形 -->
  <polygon points="280,184 400,232 280,280 160,232" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">③ i 从 1 扫到 100：</text>
  <text x="280" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">cnt[i] 是奇数？</text>

  <!-- 是：收集 -->
  <path d="M400,232 L432,232" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="222" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="440" y="212" width="108" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="494" y="237" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">i 加入 ans</text>

  <!-- 否：跳过 -->
  <path d="M160,232 L128,232" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="144" y="222" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="20" y="212" width="100" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="237" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">跳过 i</text>

  <!-- 汇合 -->
  <path d="M494,252 L494,288 Q494,300 482,300 L300,300" fill="none" stroke="#555" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M70,252 L70,288 Q70,300 82,300 L258,300" fill="none" stroke="#555" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M280,292 L280,316" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 4：返回 -->
  <rect x="140" y="320" width="280" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a4a68" filter="url(#rough2)">④ 返回 ans（扫描顺序 1→100，天然升序）</text>

  <!-- 底部注记 -->
  <text x="280" y="382" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">n = |bulbs| ≤ 100，K = 100：总时间 O(n + K)，额外空间 O(K)</text>
</svg>
