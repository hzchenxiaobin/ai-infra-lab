<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">三个示例：数「严格大于 k 的不同值」，重复只算一层</text>

  <!-- 图例 -->
  <rect x="30" y="34" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="49" y="46" font-size="9.5" fill="#33506b" filter="url(#rough2)">大于 k 的层</text>
  <rect x="135" y="34" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="154" y="46" font-size="9.5" fill="#a07830" filter="url(#rough2)">另一层(&gt;k)</text>
  <rect x="235" y="34" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="254" y="46" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">等于 k</text>
  <rect x="320" y="34" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="339" y="46" font-size="9.5" fill="#b85450" filter="url(#rough2)">小于 k → -1</text>

  <!-- 示例 1 -->
  <text x="30" y="76" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">示例 1：nums = [5,2,5,4,5]，k = 2</text>
  <rect x="140" y="86" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="158" y="106" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="184" y="86" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="202" y="106" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="228" y="86" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="246" y="106" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="272" y="86" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="290" y="106" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="316" y="86" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="334" y="106" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="368" y="106" font-size="9.5" fill="#666" filter="url(#rough2)">← 三个 5 只算一层</text>
  <text x="30" y="140" font-size="11" fill="#333" filter="url(#rough2)">大于 2 的不同值 {5, 4} 共 2 层 →</text>
  <text x="252" y="140" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">答案 2</text>
  <text x="316" y="140" font-size="10.5" fill="#a07830" filter="url(#rough2)">（先 h=4，再 h=2）</text>

  <!-- 示例 2 -->
  <text x="30" y="176" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">示例 2：nums = [2,1,2]，k = 2</text>
  <rect x="140" y="186" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="158" y="206" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="184" y="186" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="206" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="228" y="186" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="246" y="206" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="280" y="206" font-size="9.5" fill="#b85450" filter="url(#rough2)">← 1 &lt; 2</text>
  <text x="30" y="240" font-size="11" fill="#333" filter="url(#rough2)">存在 1 &lt; k：操作只降不升，1 永远抬不回 2 →</text>
  <text x="352" y="240" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 -1</text>

  <!-- 示例 3 -->
  <text x="30" y="276" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">示例 3：nums = [9,7,5,3]，k = 1（阶梯即四个层）</text>
  <rect x="150" y="342" width="42" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="171" y="336" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="204" y="318" width="42" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="225" y="312" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="258" y="294" width="42" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="279" y="288" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="312" y="270" width="42" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="333" y="264" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">9</text>
  <path d="M 130 374 L 380 374" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="386" y="378" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">k = 1</text>

  <text x="390" y="282" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">① 9 压到 7</text>
  <text x="390" y="302" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">② 7 压到 5</text>
  <text x="390" y="322" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">③ 5 压到 3</text>
  <text x="390" y="342" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ 3 压到 k</text>
  <text x="416" y="368" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">答案 4</text>

  <!-- 底注 -->
  <text x="260" y="412" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">重复值只算一层；等于 k 的格子从头到尾不动、不计层数</text>
</svg>
