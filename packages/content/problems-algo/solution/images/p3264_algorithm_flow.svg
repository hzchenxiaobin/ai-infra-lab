<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：建堆 → k 轮「弹顶 · 乘 · 塞回」→ 同步写回</text>

  <!-- 开始 -->
  <ellipse cx="195" cy="50" rx="42" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="195" y="55" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M195,64 L195,76" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- ① 建堆 -->
  <rect x="100" y="80" width="190" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="195" y="97" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">① n 个 (值, 下标) 入小根堆</text>
  <text x="195" y="111" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">heapify，O(n)</text>
  <path d="M195,118 L195,130" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 判断 -->
  <path d="M195,132 L259,162 L195,192 L131,162 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="195" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">k &gt; 0 ?</text>

  <!-- 是 -->
  <path d="M195,192 L195,204" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="209" y="203" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- ② 弹顶 -->
  <rect x="95" y="208" width="200" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="195" y="224" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">② 弹出堆顶 (x, i)</text>
  <text x="195" y="238" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">全局最小 · 并列取最前（字典序）</text>
  <path d="M195,244 L195,256" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- ③ 乘塞回 -->
  <rect x="95" y="260" width="200" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="195" y="276" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">③ push (x·m, i) 并写回 nums[i]</text>
  <text x="195" y="290" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">k ← k − 1</text>

  <!-- 回到判断 -->
  <path d="M93,278 C 34,278 30,162 127,162" stroke="#888" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="62" y="148" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">回到判断</text>

  <!-- 否 -->
  <path d="M259,162 L330,162" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="285" y="154" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- ④ 返回 -->
  <rect x="334" y="142" width="160" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="414" y="160" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">④ 返回 nums</text>
  <text x="414" y="178" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">原地已更新，无需收尾</text>
  <path d="M414,186 L414,198" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <ellipse cx="414" cy="212" rx="40" ry="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="414" y="217" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">结束</text>

  <!-- 对照说明 -->
  <rect x="40" y="310" width="440" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="327" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">暴力对照：每轮 O(n) 线性扫最小值下标（严格小于保最前），总 O(k·n)</text>
  <text x="260" y="343" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">本题 n ≤ 100、k ≤ 10 同样秒过——堆赢在规模放大后的可扩展性</text>
</svg>
