<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：单遍扫描维护 prev/cur，组边界处累加 min(prev,cur)</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">跳变时结算「上一段与本段」；循环外补一次收尾（最后一段无后续跳变触发）</text>

  <!-- ===== Start ===== -->
  <rect x="110" y="64" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="86" text-anchor="middle" font-size="11" fill="#3a5a2a">开始：prev=0, cur=1, ans=0</text>
  <path d="M 180 98 L 180 114" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== For loop ===== -->
  <rect x="106" y="116" width="148" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="138" text-anchor="middle" font-size="11" fill="#3a4a66">for i = 1 .. n−1</text>
  <path d="M 180 150 L 180 168" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision diamond ===== -->
  <polygon points="180,170 252,196 180,222 108,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="193" text-anchor="middle" font-size="10.5" fill="#6a4a10">s[i] ==</text>
  <text x="180" y="207" text-anchor="middle" font-size="10.5" fill="#6a4a10">s[i−1] ?</text>

  <!-- ===== Yes branch -> cur++ ===== -->
  <path d="M 252 196 L 300 196" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="300" y="179" width="130" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="365" y="201" text-anchor="middle" font-size="11" fill="#7a3a3a">是：cur++</text>

  <!-- ===== No branch -> settle ===== -->
  <path d="M 180 222 L 180 250" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="240" font-size="10" fill="#b85450">否</text>
  <rect x="90" y="250" width="180" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="180" y="269" text-anchor="middle" font-size="10.5" fill="#7a3a3a">ans += min(prev, cur)</text>
  <text x="180" y="285" text-anchor="middle" font-size="10.5" fill="#7a3a3a">prev = cur; cur = 1</text>

  <!-- ===== Merge + loopback to for ===== -->
  <!-- cur++ right -> merge vertical at x=470 -->
  <path d="M 430 196 L 470 196" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <!-- settle right -> merge -->
  <path d="M 270 272 L 470 272" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <!-- merge vertical -->
  <path d="M 470 196 L 470 272" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <!-- loopback up and into for top -->
  <path d="M 470 196 L 470 96 L 180 96 L 180 114" stroke="#666" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="90" font-size="9.5" fill="#888">i++ 继续</text>

  <!-- ===== Loop exit (for ends) -> 收尾 ===== -->
  <path d="M 106 133 L 60 133 L 60 354 L 88 354" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="244" font-size="9.5" fill="#888" transform="rotate(-90 40 244)">循环结束</text>

  <!-- ===== 收尾 box ===== -->
  <rect x="88" y="332" width="240" height="44" fill="#fff3cd" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="208" y="351" text-anchor="middle" font-size="11" fill="#6a4a10" font-weight="bold">ans += min(prev, cur)</text>
  <text x="208" y="367" text-anchor="middle" font-size="9.5" fill="#8a6a20">← 收尾：最后一段无后续跳变触发</text>

  <!-- 收尾 -> return -->
  <path d="M 208 376 L 208 398" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Return ===== -->
  <rect x="148" y="400" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="208" y="422" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">返回 ans</text>

  <!-- ===== Side notes ===== -->
  <rect x="312" y="400" width="248" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="324" y="420" font-size="10.5" fill="#3a5a2a" font-weight="bold">关键点：</text>
  <text x="324" y="436" font-size="10" fill="#555">• prev=0 使首段 min(0,cur)=0，无需特判</text>
  <text x="324" y="450" font-size="10" fill="#555">• 收尾补刀不可漏（最后一段配对）</text>
</svg>
