<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="480" height="520" fill="#fafafa"/>

  <text x="240" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建频率表 → 逐位核对 → 全等返回 true</text>

  <!-- Start -->
  <ellipse cx="240" cy="62" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="67" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">开始</text>

  <line x1="240" y1="82" x2="240" y2="98" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init step -->
  <rect x="90" y="102" width="300" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="124" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">freq[0..9] = 0（建 10 个桶）</text>
  <text x="240" y="142" text-anchor="middle" font-size="10.5" fill="#888">数字只有 0~9，频率表定长 10</text>

  <line x1="240" y1="150" x2="240" y2="166" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Build table step -->
  <rect x="70" y="170" width="340" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="240" y="193" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">遍历 num：freq[c − '0'] ++</text>
  <text x="240" y="213" text-anchor="middle" font-size="11" fill="#d6a040">一趟扫描同时累加所有桶，O(n)</text>

  <line x1="240" y1="226" x2="240" y2="242" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Check decision diamond -->
  <polygon points="240,246 360,296 240,346 120,296" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="290" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">i = 0..n−1：</text>
  <text x="240" y="308" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">freq[i] == num[i]−'0' ?</text>

  <!-- No branch -> return false -->
  <line x1="360" y1="296" x2="416" y2="296" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="290" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">否</text>
  <rect x="392" y="278" width="80" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="432" y="301" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>

  <!-- Yes branch -> continue down -->
  <line x1="240" y1="346" x2="240" y2="362" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="258" y="358" font-size="12" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- All equal check -->
  <rect x="120" y="366" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="384" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">全部核对通过（无矛盾）</text>
  <text x="240" y="402" text-anchor="middle" font-size="10.5" fill="#4a7a3a">期望表与实测表逐项全等</text>

  <line x1="240" y1="410" x2="240" y2="426" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return true -->
  <rect x="140" y="430" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="240" y="453" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return true</text>

  <line x1="240" y1="466" x2="240" y2="482" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <ellipse cx="240" cy="500" rx="42" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="505" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结束</text>
</svg>
