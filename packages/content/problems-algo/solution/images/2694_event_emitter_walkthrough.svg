<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例 4 演算：退订 cb1 后 emit → [7]</text>

  <!-- 通用表头：Map 状态列 -->
  <text x="200" y="56" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">events.get("firstEvent")</text>
  <text x="430" y="56" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">操作与返回值</text>

  <!-- ===== 步骤 1：new EventEmitter ===== -->
  <rect x="40" y="70" width="360" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="88" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">① new EventEmitter()</text>
  <text x="60" y="103" font-size="10" fill="#999" filter="url(#rough2)">Map 为空</text>
  <text x="200" y="95" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">undefined（空 Map）</text>
  <rect x="410" y="70" width="110" height="40" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="465" y="95" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">返回 []</text>

  <!-- ===== 步骤 2：subscribe cb1 ===== -->
  <rect x="40" y="118" width="360" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="136" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">② subscribe("firstEvent", x => x+1)</text>
  <text x="60" y="152" font-size="10" fill="#4a7a3a" filter="url(#rough2)">建空数组 → push cb1 → 返回 sub1</text>
  <text x="200" y="144" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">[ cb1 ]</text>
  <rect x="410" y="118" width="110" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="465" y="144" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">"subscribed"</text>

  <!-- ===== 步骤 3：subscribe cb2 ===== -->
  <rect x="40" y="172" width="360" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="190" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">③ subscribe("firstEvent", x => x+2)</text>
  <text x="60" y="206" font-size="10" fill="#4a7a3a" filter="url(#rough2)">数组已存在 → push cb2 → 返回 sub2</text>
  <text x="200" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">[ cb1, cb2 ]</text>
  <rect x="410" y="172" width="110" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="465" y="198" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">"subscribed"</text>

  <!-- ===== 步骤 4：unsubscribe cb1 ===== -->
  <rect x="40" y="226" width="360" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="244" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">④ sub1.unsubscribe()</text>
  <text x="60" y="260" font-size="10" fill="#b85450" filter="url(#rough2)">闭包 indexOf(cb1)=0 → splice(0,1)</text>
  <text x="200" y="252" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">[ cb2 ]</text>
  <rect x="410" y="226" width="110" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="465" y="252" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">undefined</text>

  <!-- 删除标记：cb1 被划掉 -->
  <text x="158" y="200" font-size="9" fill="#999" text-decoration="line-through" filter="url(#rough2)">cb1</text>

  <!-- ===== 步骤 5：emit [5] ===== -->
  <rect x="40" y="280" width="360" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="300" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">⑤ emit("firstEvent", [5])</text>
  <text x="60" y="316" font-size="10" fill="#d6a040" filter="url(#rough2)">map: cb2(5) = 5+2 = 7</text>
  <text x="60" y="328" font-size="10" fill="#d6a040" filter="url(#rough2)">仅剩 cb2，cb1 已退订</text>
  <text x="200" y="310" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">[ cb2 ]（不变）</text>
  <rect x="410" y="280" width="110" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="465" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">[ 7 ]</text>

  <!-- 步骤间箭头 -->
  <path d="M 220 110 L 220 118" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 220 162 L 220 172" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 220 216 L 220 226" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 220 270 L 220 280" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 关键说明框 -->
  <rect x="50" y="350" width="470" height="76" fill="none" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="60" y="370" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">关键观察：</text>
  <text x="60" y="388" font-size="10" fill="#333" filter="url(#rough2)">• 退订 cb1 后数组 [cb1, cb2] → [cb2]，引用不变（splice 原地删）</text>
  <text x="60" y="404" font-size="10" fill="#333" filter="url(#rough2)">• emit 只遍历剩余的 cb2，返回 [7]；cb1 永不执行</text>
  <text x="60" y="420" font-size="10" fill="#b85450" filter="url(#rough2)">• 若用 filter 重建数组，闭包 sub2 捕获的旧引用会失效 → 后续退订出错</text>
</svg>
