<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">示例演算：["Hello","World"] ⇄ "5#Hello5#World"</text>

  <!-- ===== 编码 ===== -->
  <text x="30" y="56" font-size="13" fill="#446688" font-weight="bold">编码过程</text>

  <text x="30" y="78" font-size="11" fill="#555">输入：</text>
  <rect x="70" y="66" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="105" y="82" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">"Hello"</text>
  <rect x="148" y="66" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="183" y="82" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">"World"</text>

  <!-- 步骤表 -->
  <rect x="30" y="100" width="500" height="80" fill="none" stroke="#d6a040" stroke-width="1" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="40" y="118" font-size="10" fill="#888" font-weight="bold">步骤</text>
  <text x="100" y="118" font-size="10" fill="#888" font-weight="bold">字符串</text>
  <text x="200" y="118" font-size="10" fill="#888" font-weight="bold">len</text>
  <text x="260" y="118" font-size="10" fill="#888" font-weight="bold">追加片段</text>
  <text x="430" y="118" font-size="10" fill="#888" font-weight="bold">res 累积</text>

  <line x1="30" y1="124" x2="530" y2="124" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="48" y="142" font-size="10" fill="#333">1</text>
  <text x="100" y="142" font-size="10" fill="#333" font-family="monospace">"Hello"</text>
  <text x="210" y="142" font-size="10" fill="#b85450" font-weight="bold">5</text>
  <text x="260" y="142" font-size="10" fill="#333" font-family="monospace">5#Hello</text>
  <text x="430" y="142" font-size="10" fill="#446688" font-family="monospace">5#Hello</text>

  <text x="48" y="164" font-size="10" fill="#333">2</text>
  <text x="100" y="164" font-size="10" fill="#333" font-family="monospace">"World"</text>
  <text x="210" y="164" font-size="10" fill="#b85450" font-weight="bold">5</text>
  <text x="260" y="164" font-size="10" fill="#333" font-family="monospace">5#World</text>
  <text x="430" y="164" font-size="10" fill="#446688" font-family="monospace">5#Hello5#World</text>

  <path d="M 280 180 L 280 200" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="200" width="200" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="219" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">编码结果："5#Hello5#World"</text>

  <!-- ===== 解码 ===== -->
  <text x="30" y="252" font-size="13" fill="#4a7a3a" font-weight="bold">解码过程</text>

  <rect x="30" y="262" width="500" height="140" fill="none" stroke="#d6a040" stroke-width="1" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="40" y="280" font-size="10" fill="#888" font-weight="bold">步骤</text>
  <text x="80" y="280" font-size="10" fill="#888" font-weight="bold">i</text>
  <text x="120" y="280" font-size="10" fill="#888" font-weight="bold">找#</text>
  <text x="190" y="280" font-size="10" fill="#888" font-weight="bold">length</text>
  <text x="270" y="280" font-size="10" fill="#888" font-weight="bold">截取 s[j+1 : j+1+len]</text>
  <text x="450" y="280" font-size="10" fill="#888" font-weight="bold">i 更新</text>

  <line x1="30" y1="286" x2="530" y2="286" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="48" y="306" font-size="10" fill="#333">1</text>
  <text x="80" y="306" font-size="10" fill="#333" font-family="monospace">0</text>
  <text x="120" y="306" font-size="10" fill="#b85450" font-family="monospace">j=1</text>
  <text x="190" y="306" font-size="10" fill="#b85450" font-weight="bold">5</text>
  <text x="270" y="306" font-size="10" fill="#4a7a3a" font-family="monospace">s[2:7]="Hello"</text>
  <text x="450" y="306" font-size="10" fill="#446688" font-family="monospace">7</text>

  <text x="48" y="332" font-size="10" fill="#333">2</text>
  <text x="80" y="332" font-size="10" fill="#333" font-family="monospace">7</text>
  <text x="120" y="332" font-size="10" fill="#b85450" font-family="monospace">j=8</text>
  <text x="190" y="332" font-size="10" fill="#b85450" font-weight="bold">5</text>
  <text x="270" y="332" font-size="10" fill="#4a7a3a" font-family="monospace">s[9:14]="World"</text>
  <text x="450" y="332" font-size="10" fill="#446688" font-family="monospace">14</text>

  <text x="48" y="358" font-size="10" fill="#333">3</text>
  <text x="80" y="358" font-size="10" fill="#333" font-family="monospace">14</text>
  <text x="120" y="358" font-size="10" fill="#b85450" font-family="monospace">i≥len → 结束</text>
  <text x="190" y="358" font-size="10" fill="#888">—</text>
  <text x="270" y="358" font-size="10" fill="#888">—</text>
  <text x="450" y="358" font-size="10" fill="#888">—</text>

  <rect x="160" y="370" width="240" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="389" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">解码结果：["Hello","World"] ✓</text>
</svg>
