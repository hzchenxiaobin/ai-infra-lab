<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">位恒等式：1 的位数在 OR / AND 之间守恒</text>

  <!-- bit table -->
  <!-- header row -->
  <g filter="url(#rough2)">
    <rect x="60" y="46" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="190" y="46" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="250" y="46" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="310" y="46" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="380" y="46" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="11.5" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="125" y="65">值 / 位</text>
    <text x="220" y="65">bit2</text>
    <text x="280" y="65">bit1</text>
    <text x="340" y="65">bit0</text>
    <text x="440" y="65">1 的位数</text>
  </g>

  <!-- row a = 5 -->
  <g filter="url(#rough2)">
    <rect x="60" y="80" width="130" height="30" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="190" y="80" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="250" y="80" width="60" height="30" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="310" y="80" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="380" y="80" width="120" height="30" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="125" y="100" font-weight="bold">a = 5  (101)</text>
    <text x="220" y="100" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="280" y="100">0</text>
    <text x="340" y="100" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="440" y="100" fill="#4a7a3a" font-weight="bold">2</text>
  </g>

  <!-- row b = 3 -->
  <g filter="url(#rough2)">
    <rect x="60" y="114" width="130" height="30" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="190" y="114" width="60" height="30" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="250" y="114" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="310" y="114" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="380" y="114" width="120" height="30" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="125" y="134" font-weight="bold">b = 3  (011)</text>
    <text x="220" y="134">0</text>
    <text x="280" y="134" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="340" y="134" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="440" y="134" fill="#4a7a3a" font-weight="bold">2</text>
  </g>

  <!-- separator -->
  <path d="M 60 150 L 500 150" stroke="#d0d0d0" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- row a OR b -->
  <g filter="url(#rough2)">
    <rect x="60" y="158" width="130" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="190" y="158" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="250" y="158" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="310" y="158" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="380" y="158" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="125" y="178" fill="#b85450" font-weight="bold">a | b  = 111</text>
    <text x="220" y="178" fill="#b85450" font-weight="bold">1</text>
    <text x="280" y="178" fill="#b85450" font-weight="bold">1</text>
    <text x="340" y="178" fill="#b85450" font-weight="bold">1</text>
    <text x="440" y="178" fill="#b85450" font-weight="bold">3</text>
  </g>

  <!-- row a AND b -->
  <g filter="url(#rough2)">
    <rect x="60" y="192" width="130" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="190" y="192" width="60" height="30" fill="#fff" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="250" y="192" width="60" height="30" fill="#fff" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="310" y="192" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="380" y="192" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="125" y="212" fill="#d6a040" font-weight="bold">a &amp; b = 001</text>
    <text x="220" y="212">0</text>
    <text x="280" y="212">0</text>
    <text x="340" y="212" fill="#d6a040" font-weight="bold">1</text>
    <text x="440" y="212" fill="#d6a040" font-weight="bold">1</text>
  </g>

  <!-- per-bit conservation note -->
  <text x="60" y="248" font-size="11.5" fill="#555" font-weight="bold">逐位看：a_i + b_i = (a_i | b_i) + (a_i &amp; b_i) 恒成立</text>
  <text x="76" y="268" font-size="11" fill="#555">bit2：1 + 0 = 1 = 1 + 0   ｜  bit1：0 + 1 = 1 = 1 + 0   ｜  bit0：1 + 1 = 2 = 1 + 1</text>
  <text x="60" y="286" font-size="11" fill="#888">每个二进制位上"输入 1 的个数"= "输出 1 的个数"，逐位相加即得全局恒等式。</text>

  <!-- identity box -->
  <rect x="40" y="302" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">bitCount(a | b) + bitCount(a &amp; b) = bitCount(a) + bitCount(b)</text>
  <text x="280" y="348" text-anchor="middle" font-size="12" fill="#4a7a3a">本例：3 + 1 = 4 = 2 + 2  ✓</text>

  <!-- condition transform -->
  <path d="M 280 362 L 280 384" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="40" y="388" width="480" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="410" text-anchor="middle" font-size="12" fill="#333">优质条件  bitCount(num1 | num2) + bitCount(num1 &amp; num2) ≥ k</text>
  <text x="280" y="432" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">⇔  bitCount(num1) + bitCount(num2) ≥ k   （只看各自 1 的个数之和）</text>
</svg>
