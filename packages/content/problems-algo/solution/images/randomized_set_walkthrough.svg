<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="900" height="580" fill="#fdfcf7"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：一组操作下双结构的演变</text>
  <path d="M 300 46 Q 450 54 600 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- header -->
  <g font-size="11" fill="#888" font-weight="bold">
    <text x="90" y="84">操作</text>
    <text x="240" y="84">vals（数组）</text>
    <text x="660" y="84">idx（val→下标）</text>
    <text x="840" y="84" text-anchor="end">返回</text>
  </g>
  <path d="M 70 92 L 850 92" stroke="#ccc" stroke-width="1" filter="url(#sk)"/>

  <!-- Row 1: insert(1) -->
  <text x="90" y="118" font-size="12.5" fill="#2b6e9e" font-weight="bold">insert(1)</text>
  <g font-size="12.5">
    <g filter="url(#sk)"><rect x="240" y="106" width="44" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="262" y="123" text-anchor="middle" fill="#2b6e9e">1</text>
  </g>
  <text x="660" y="123" font-size="11.5" fill="#346">{1:0}</text>
  <text x="840" y="123" text-anchor="end" font-size="12" fill="#2e6e2e" font-weight="bold">true</text>
  <text x="430" y="123" font-size="10" fill="#888">尾插，下标 0</text>

  <!-- Row 2: insert(3) -->
  <text x="90" y="156" font-size="12.5" fill="#2b6e9e" font-weight="bold">insert(3)</text>
  <g font-size="12.5">
    <g filter="url(#sk)"><rect x="240" y="144" width="44" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="262" y="161" text-anchor="middle" fill="#2b6e9e">1</text>
    <g filter="url(#sk)"><rect x="284" y="144" width="44" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="306" y="161" text-anchor="middle" fill="#2b6e9e">3</text>
  </g>
  <text x="660" y="161" font-size="11.5" fill="#346">{1:0, 3:1}</text>
  <text x="840" y="161" text-anchor="end" font-size="12" fill="#2e6e2e" font-weight="bold">true</text>
  <text x="430" y="161" font-size="10" fill="#888">尾插，下标 1</text>

  <!-- Row 3: insert(5) -->
  <text x="90" y="194" font-size="12.5" fill="#2b6e9e" font-weight="bold">insert(5)</text>
  <g font-size="12.5">
    <g filter="url(#sk)"><rect x="240" y="182" width="44" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="262" y="199" text-anchor="middle" fill="#2b6e9e">1</text>
    <g filter="url(#sk)"><rect x="284" y="182" width="44" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="306" y="199" text-anchor="middle" fill="#2b6e9e">3</text>
    <g filter="url(#sk)"><rect x="328" y="182" width="44" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="350" y="199" text-anchor="middle" fill="#2b6e9e">5</text>
  </g>
  <text x="660" y="199" font-size="11.5" fill="#346">{1:0, 3:1, 5:2}</text>
  <text x="840" y="199" text-anchor="end" font-size="12" fill="#2e6e2e" font-weight="bold">true</text>
  <text x="430" y="199" font-size="10" fill="#888">尾插，下标 2</text>

  <!-- Row 4: insert(3) duplicate -->
  <text x="90" y="232" font-size="12.5" fill="#2b6e9e" font-weight="bold">insert(3)</text>
  <g font-size="12.5">
    <g filter="url(#sk)"><rect x="240" y="220" width="44" height="24" rx="4" fill="#f2f2f2" stroke="#bbb" stroke-width="1"/></g>
    <text x="262" y="237" text-anchor="middle" fill="#888">1</text>
    <g filter="url(#sk)"><rect x="284" y="220" width="44" height="24" rx="4" fill="#f2f2f2" stroke="#bbb" stroke-width="1"/></g>
    <text x="306" y="237" text-anchor="middle" fill="#888">3</text>
    <g filter="url(#sk)"><rect x="328" y="220" width="44" height="24" rx="4" fill="#f2f2f2" stroke="#bbb" stroke-width="1"/></g>
    <text x="350" y="237" text-anchor="middle" fill="#888">5</text>
  </g>
  <text x="660" y="237" font-size="11.5" fill="#888">{1:0, 3:1, 5:2}</text>
  <text x="840" y="237" text-anchor="end" font-size="12" fill="#b03a3a" font-weight="bold">false</text>
  <text x="430" y="237" font-size="10" fill="#b03a3a">3 已在 idx → 拒绝，结构不变</text>

  <!-- Row 5: remove(3) the highlight -->
  <g filter="url(#sk)"><rect x="70" y="252" width="780" height="74" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5 3"/></g>
  <text x="90" y="280" font-size="12.5" fill="#7a5415" font-weight="bold">remove(3)</text>
  <!-- before -->
  <g font-size="12.5">
    <g filter="url(#sk)"><rect x="240" y="266" width="44" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="262" y="283" text-anchor="middle" fill="#2b6e9e">1</text>
    <g filter="url(#sk)"><rect x="284" y="266" width="44" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
    <text x="306" y="283" text-anchor="middle" fill="#b03a3a" font-weight="bold">3</text>
    <g filter="url(#sk)"><rect x="328" y="266" width="44" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="350" y="283" text-anchor="middle" fill="#2b6e9e">5</text>
  </g>
  <!-- arrow: last 5 -> pos 1 -->
  <path d="M 350 274 Q 360 300 308 282" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#arO)" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="370" y="288" font-size="9.5" fill="#7a5415">末尾5搬到下标1</text>
  <!-- after -->
  <text x="240" y="312" font-size="9.5" fill="#888">→ 结果:</text>
  <g font-size="12.5">
    <g filter="url(#sk)"><rect x="290" y="300" width="44" height="24" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="312" y="317" text-anchor="middle" fill="#2e6e2e">1</text>
    <g filter="url(#sk)"><rect x="334" y="300" width="44" height="24" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="356" y="317" text-anchor="middle" fill="#2e6e2e" font-weight="bold">5</text>
  </g>
  <text x="660" y="296" font-size="11.5" fill="#346">前: {1:0, 3:1, 5:2}</text>
  <text x="660" y="314" font-size="11.5" fill="#7a5415" font-weight="bold">后: {1:0, 5:1}</text>
  <text x="840" y="306" text-anchor="end" font-size="12" fill="#2e6e2e" font-weight="bold">true</text>
  <text x="430" y="318" font-size="9.5" fill="#7a5415">idx[5] 从 2 改成 1，删 idx[3]，pop 末尾</text>

  <!-- Row 6: getRandom -->
  <text x="90" y="350" font-size="12.5" fill="#2e6e2e" font-weight="bold">getRandom()</text>
  <g font-size="12.5">
    <g filter="url(#sk)"><rect x="240" y="338" width="44" height="24" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/></g>
    <text x="262" y="355" text-anchor="middle" fill="#2e6e2e">1</text>
    <g filter="url(#sk)"><rect x="284" y="338" width="44" height="24" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/></g>
    <text x="306" y="355" text-anchor="middle" fill="#2e6e2e">5</text>
  </g>
  <text x="660" y="355" font-size="11.5" fill="#346">{1:0, 5:1}</text>
  <text x="840" y="355" text-anchor="end" font-size="12" fill="#2e6e2e" font-weight="bold">1 / 5</text>
  <text x="430" y="355" font-size="10" fill="#888">rand()%2 ∈ {0,1} → 各 1/2 概率</text>

  <!-- Row 7: remove(1) -->
  <g filter="url(#sk)"><rect x="70" y="374" width="780" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="90" y="402" font-size="12.5" fill="#7a5415" font-weight="bold">remove(1)</text>
  <g font-size="12.5">
    <g filter="url(#sk)"><rect x="240" y="388" width="44" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
    <text x="262" y="405" text-anchor="middle" fill="#b03a3a" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="284" y="388" width="44" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="306" y="405" text-anchor="middle" fill="#2b6e9e">5</text>
  </g>
  <path d="M 306 396 Q 318 416 266 404" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#arO)" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="330" y="422" font-size="9.5" fill="#7a5415">末尾5搬到下标0</text>
  <g font-size="12.5">
    <g filter="url(#sk)"><rect x="470" y="388" width="44" height="24" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="492" y="405" text-anchor="middle" fill="#2e6e2e" font-weight="bold">5</text>
  </g>
  <text x="660" y="394" font-size="11.5" fill="#346">前: {1:0, 5:1}</text>
  <text x="660" y="412" font-size="11.5" fill="#7a5415" font-weight="bold">后: {5:0}</text>
  <text x="840" y="404" text-anchor="end" font-size="12" fill="#2e6e2e" font-weight="bold">true</text>

  <!-- Row 8: getRandom -->
  <text x="90" y="456" font-size="12.5" fill="#2e6e2e" font-weight="bold">getRandom()</text>
  <g font-size="12.5">
    <g filter="url(#sk)"><rect x="240" y="444" width="44" height="24" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="262" y="461" text-anchor="middle" fill="#2e6e2e" font-weight="bold">5</text>
  </g>
  <text x="660" y="461" font-size="11.5" fill="#346">{5:0}</text>
  <text x="840" y="461" text-anchor="end" font-size="12" fill="#2e6e2e" font-weight="bold">5</text>
  <text x="430" y="461" font-size="10" fill="#888">只剩一个，必返回 5</text>

  <!-- summary -->
  <g filter="url(#sk)"><rect x="60" y="490" width="780" height="64" rx="10" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="450" y="514" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">关键：每次 remove 都把末尾搬到空洞，数组永远「紧凑无空洞」</text>
  <text x="450" y="533" text-anchor="middle" font-size="11" fill="#542">vals 长度 == idx 大小 == 元素个数 → getRandom 命中率 100%</text>
  <text x="450" y="548" text-anchor="middle" font-size="10" fill="#888">insert O(1) · remove O(1) · getRandom O(1)</text>
</svg>
