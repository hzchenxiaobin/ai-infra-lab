<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：从 k=2 出发逐次松弛</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">图：2→1(1)、2→3(1)、3→4(1)；dist 1-indexed：[_,1,2,3,4]</text>

  <!-- column headers -->
  <text x="34" y="68" font-size="10" fill="#888" font-weight="bold">步骤</text>
  <text x="98" y="68" font-size="10" fill="#888" font-weight="bold">弹出(d,u)</text>
  <text x="184" y="68" font-size="10" fill="#888" font-weight="bold">松弛动作</text>
  <text x="330" y="68" font-size="10" fill="#888" font-weight="bold">dist[]</text>
  <text x="470" y="68" font-size="10" fill="#888" font-weight="bold">堆(处理后)</text>

  <!-- ===== Initial row ===== -->
  <rect x="20" y="76" width="520" height="34" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="42" y="97" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">初始</text>
  <text x="130" y="97" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="252" y="97" text-anchor="middle" font-size="10" fill="#888">dist[2]=0，其余=∞</text>
  <text x="375" y="97" text-anchor="middle" font-size="10" fill="#666" font-family="monospace">[_,∞,0,∞,∞]</text>
  <text x="495" y="97" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" font-family="monospace">[(0,2)]</text>

  <!-- ===== Step 1 ===== -->
  <rect x="20" y="116" width="520" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="42" y="143" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="130" y="143" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">(0, 2)</text>
  <text x="252" y="137" text-anchor="middle" font-size="9" fill="#555">2→1: 0+1=1&lt;∞ ✓</text>
  <text x="252" y="151" text-anchor="middle" font-size="9" fill="#555">2→3: 0+1=1&lt;∞ ✓</text>
  <text x="375" y="143" text-anchor="middle" font-size="10" fill="#666" font-family="monospace">[_,1,0,1,∞]</text>
  <text x="495" y="143" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" font-family="monospace">[(1,1),(1,3)]</text>

  <!-- ===== Step 2 ===== -->
  <rect x="20" y="166" width="520" height="40" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="42" y="190" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">2</text>
  <text x="130" y="190" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">(1, 1)</text>
  <text x="252" y="190" text-anchor="middle" font-size="9" fill="#888">无出边，无松弛</text>
  <text x="375" y="190" text-anchor="middle" font-size="10" fill="#aaa" font-family="monospace">[_,1,0,1,∞]</text>
  <text x="495" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" font-family="monospace">[(1,3)]</text>

  <!-- ===== Step 3 ===== -->
  <rect x="20" y="212" width="520" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="42" y="239" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="130" y="239" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">(1, 3)</text>
  <text x="252" y="239" text-anchor="middle" font-size="9" fill="#555">3→4: 1+1=2&lt;∞ ✓</text>
  <text x="375" y="239" text-anchor="middle" font-size="10" fill="#666" font-family="monospace">[_,1,0,1,2]</text>
  <text x="495" y="239" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" font-family="monospace">[(2,4)]</text>

  <!-- ===== Step 4 ===== -->
  <rect x="20" y="262" width="520" height="40" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="42" y="286" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">4</text>
  <text x="130" y="286" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">(2, 4)</text>
  <text x="252" y="286" text-anchor="middle" font-size="9" fill="#888">无出边，堆空 → 结束</text>
  <text x="375" y="286" text-anchor="middle" font-size="10" fill="#aaa" font-family="monospace">[_,1,0,1,2]</text>
  <text x="495" y="286" text-anchor="middle" font-size="10" fill="#aaa" font-family="monospace">[]</text>

  <!-- arrow down to conclusion -->
  <path d="M 280 304 L 280 326" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Conclusion ===== -->
  <rect x="60" y="328" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">无 ∞ → 所有节点可达</text>
  <text x="280" y="370" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">答案 = max(dist[1..4]) = max(1,0,1,2) = 2</text>

  <!-- footnotes -->
  <text x="40" y="410" font-size="10" fill="#888">弹出顺序即 dist 从小到大的确定顺序：0(2) → 1(1)/1(3) → 2(4)</text>
  <text x="40" y="428" font-size="10" fill="#888">若最终 dist 仍含 ∞（如示例 2），则返回 -1</text>
  <text x="40" y="446" font-size="10" fill="#446688" font-weight="bold">堆每次弹出最小 (d,u)，保证贪心正确</text>
</svg>
