<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">构建 LPS（next）表：pattern = "aabaaf"</text>

  <text x="38" y="52" font-size="11" fill="#888">下标:</text>
  <text x="112" y="52" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">0</text>
  <text x="158" y="52" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">1</text>
  <text x="204" y="52" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">2</text>
  <text x="250" y="52" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">3</text>
  <text x="296" y="52" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">4</text>
  <text x="342" y="52" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">5</text>

  <rect x="90" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="136" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="182" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="228" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="274" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="296" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="320" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">f</text>

  <text x="40" y="124" font-size="12" fill="#444" font-weight="bold">步</text>
  <text x="95" y="124" font-size="12" fill="#444" font-weight="bold">i</text>
  <text x="150" y="124" font-size="12" fill="#444" font-weight="bold">pat[i]</text>
  <text x="215" y="124" font-size="12" fill="#444" font-weight="bold">j(前)</text>
  <text x="290" y="124" font-size="12" fill="#444" font-weight="bold">动作</text>
  <text x="465" y="124" font-size="12" fill="#444" font-weight="bold">lps[i]</text>

  <line x1="30" y1="132" x2="540" y2="132" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="40" y="154" font-size="11" fill="#333">1</text>
  <text x="95" y="154" font-size="11" fill="#333">1</text>
  <text x="158" y="154" font-size="11" fill="#333" font-weight="bold">a</text>
  <text x="220" y="154" font-size="11" fill="#333">0</text>
  <text x="270" y="154" font-size="11" fill="#82b366">a==a → j=1</text>
  <text x="475" y="154" font-size="11" fill="#333" font-weight="bold">1</text>

  <text x="40" y="176" font-size="11" fill="#333">2</text>
  <text x="95" y="176" font-size="11" fill="#333">2</text>
  <text x="204" y="176" font-size="11" fill="#333" font-weight="bold">b</text>
  <text x="220" y="176" font-size="11" fill="#333">1</text>
  <text x="270" y="176" font-size="11" fill="#b85450">b≠a→j=lps[0]=0; b≠a</text>
  <text x="475" y="176" font-size="11" fill="#333" font-weight="bold">0</text>

  <text x="40" y="198" font-size="11" fill="#333">3</text>
  <text x="95" y="198" font-size="11" fill="#333">3</text>
  <text x="158" y="198" font-size="11" fill="#333" font-weight="bold">a</text>
  <text x="220" y="198" font-size="11" fill="#333">0</text>
  <text x="270" y="198" font-size="11" fill="#82b366">a==a → j=1</text>
  <text x="475" y="198" font-size="11" fill="#333" font-weight="bold">1</text>

  <text x="40" y="220" font-size="11" fill="#333">4</text>
  <text x="95" y="220" font-size="11" fill="#333">4</text>
  <text x="158" y="220" font-size="11" fill="#333" font-weight="bold">a</text>
  <text x="220" y="220" font-size="11" fill="#333">1</text>
  <text x="270" y="220" font-size="11" fill="#82b366">a==a → j=2 ⭐</text>
  <text x="475" y="220" font-size="11" fill="#d6a040" font-weight="bold">2</text>

  <text x="40" y="242" font-size="11" fill="#333">5</text>
  <text x="95" y="242" font-size="11" fill="#333">5</text>
  <text x="342" y="242" font-size="11" fill="#333" font-weight="bold">f</text>
  <text x="220" y="242" font-size="11" fill="#333">2</text>
  <text x="270" y="242" font-size="11" fill="#b85450">f≠b→j=1; f≠a→j=0; f≠a</text>
  <text x="475" y="242" font-size="11" fill="#333" font-weight="bold">0</text>

  <rect x="60" y="268" width="440" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">LPS = [0, 1, 0, 1, 2, 0]</text>

  <text x="280" y="322" text-anchor="middle" font-size="10.5" fill="#888">LPS[i] = pattern[0..i] 的「最长相同前后缀」长度（proper，不含整个串）</text>
  <text x="280" y="340" text-anchor="middle" font-size="10.5" fill="#888">⭐ lps[4]=2 即 pattern[0..4]="aabaa" 的前缀 "aa" 与后缀 "aa" 相同</text>
</svg>
