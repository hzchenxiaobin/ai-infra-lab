<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">山羊拉丁文变换规则：元音 / 辅音 + 索引个 a</text>

  <!-- Rule 1: vowel -->
  <rect x="30" y="48" width="540" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="46" y="68" font-size="12" fill="#4a7a3a" font-weight="bold">规则一：首字母为元音 (a/e/i/o/u)</text>

  <!-- apple box -->
  <rect x="50" y="80" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="100" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">apple</text>

  <path d="M 126 95 L 170 95" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="148" y="88" text-anchor="middle" font-size="10" fill="#4a7a3a">原样保留</text>

  <!-- apple + ma -->
  <rect x="176" y="80" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="221" y="100" text-anchor="middle" font-size="12" fill="#333">apple</text>
  <rect x="246" y="80" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="261" y="100" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">ma</text>

  <text x="300" y="88" font-size="10" fill="#888">末尾追加 "ma"</text>

  <!-- Rule 2: consonant -->
  <rect x="30" y="180" width="540" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="46" y="200" font-size="12" fill="#b85450" font-weight="bold">规则二：首字母为辅音</text>

  <!-- goat box -->
  <rect x="50" y="212" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="232" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">goat</text>

  <path d="M 126 227 L 170 227" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="148" y="220" text-anchor="middle" font-size="10" fill="#b85450">首字母移末尾</text>

  <!-- oat + g + ma -->
  <rect x="176" y="212" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="232" text-anchor="middle" font-size="12" fill="#333">oat</text>
  <rect x="232" y="212" width="26" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="245" y="232" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">g</text>
  <rect x="258" y="212" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="273" y="232" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">ma</text>

  <text x="300" y="220" font-size="10" fill="#888">移首字母 + 追加 "ma"</text>

  <!-- Rule 3: index a -->
  <rect x="30" y="312" width="540" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="46" y="332" font-size="12" fill="#d6a040" font-weight="bold">规则三：按单词索引追加 a</text>

  <g font-size="11" filter="url(#rough2)">
    <rect x="50" y="344" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="75" y="362" text-anchor="middle" fill="#333">单词 1</text>
    <text x="110" y="362" fill="#888">→ +"a"</text>

    <rect x="170" y="344" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="195" y="362" text-anchor="middle" fill="#333">单词 2</text>
    <text x="230" y="362" fill="#888">→ +"aa"</text>

    <rect x="292" y="344" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="317" y="362" text-anchor="middle" fill="#333">单词 3</text>
    <text x="352" y="362" fill="#888">→ +"aaa"</text>

    <rect x="416" y="344" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="441" y="362" text-anchor="middle" fill="#333">单词 k</text>
    <text x="476" y="362" fill="#888">→ +"a"×k</text>
  </g>
</svg>
