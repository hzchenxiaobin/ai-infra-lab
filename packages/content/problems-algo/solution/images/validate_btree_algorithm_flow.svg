<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">验证二叉树节点 — 算法流程</text>

  <!-- input -->
  <rect x="150" y="44" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输入：n, leftChild[], rightChild[]</text>
  <text x="270" y="77" text-anchor="middle" font-size="10.5" fill="#666">父 i 指向 leftChild[i] / rightChild[i]</text>
  <line x1="270" y1="84" x2="270" y2="104" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 1: compute indeg -->
  <rect x="130" y="104" width="280" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="122" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">扫 left/right，统计 indeg[c]++</text>
  <text x="270" y="136" text-anchor="middle" font-size="10" fill="#666">c == -1 跳过</text>
  <line x1="270" y1="142" x2="270" y2="162" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: indeg > 1 ? -->
  <path d="M 270 162 L 390 202 L 270 242 L 150 202 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="198" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">任一 indeg &gt; 1 ?</text>
  <text x="270" y="214" text-anchor="middle" font-size="10" fill="#888">某节点两个父亲</text>

  <text x="405" y="198" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <line x1="390" y1="202" x2="436" y2="202" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="436" y="184" width="92" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="482" y="201" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 false</text>
  <text x="482" y="215" text-anchor="middle" font-size="10" fill="#888">双父非法</text>

  <text x="120" y="198" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <line x1="150" y1="202" x2="110" y2="202" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="14" y="184" width="96" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="62" y="201" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">找根</text>
  <text x="62" y="215" text-anchor="middle" font-size="10" fill="#666">indeg == 0</text>

  <line x1="62" y1="222" x2="62" y2="252" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 62 252 Q 62 268 170 268" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: root count == 1 ? -->
  <rect x="150" y="246" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="267" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">收集入度为 0 的节点</text>
  <line x1="270" y1="280" x2="270" y2="298" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 270 298 L 380 336 L 270 374 L 160 336 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="332" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">根的数量 = 1 ?</text>
  <text x="270" y="348" text-anchor="middle" font-size="10" fill="#888">0 个→有环；&gt;1→多树</text>

  <text x="395" y="332" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <line x1="380" y1="336" x2="436" y2="336" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="436" y="318" width="92" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="482" y="335" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 false</text>
  <text x="482" y="349" text-anchor="middle" font-size="10" fill="#888">无根/多根</text>

  <text x="120" y="332" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="160" y1="336" x2="110" y2="336" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="14" y="318" width="96" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="62" y="335" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">BFS</text>
  <text x="62" y="349" text-anchor="middle" font-size="10" fill="#666">从 root 出发</text>

  <line x1="62" y1="356" x2="62" y2="386" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 62 386 Q 62 402 170 402" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: cnt == n ? -->
  <rect x="150" y="384" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="405" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">沿左右孩子 BFS，记 cnt</text>
  <line x1="270" y1="418" x2="270" y2="432" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 270 432 L 370 452 L 270 472 L 170 452 Z" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="456" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">cnt == n ?</text>

  <text x="385" y="450" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="370" y1="452" x2="436" y2="452" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="436" y="434" width="92" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="482" y="451" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 true</text>
  <text x="482" y="465" text-anchor="middle" font-size="10" fill="#888">全连通</text>

  <text x="120" y="450" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <line x1="170" y1="452" x2="110" y2="452" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="14" y="434" width="96" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="62" y="451" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 false</text>
  <text x="62" y="465" text-anchor="middle" font-size="10" fill="#888">不连通</text>
</svg>
