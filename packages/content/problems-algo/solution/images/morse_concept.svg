<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心直觉：字母→摩斯串拼接，不同拼接结果用集合去重</text>

  <!-- Mapping table header -->
  <text x="30" y="62" font-size="12" fill="#888">摩斯码表（节选）：</text>
  <rect x="30" y="70" width="260" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="88" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">字母</text>
  <text x="120" y="88" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">摩斯码</text>
  <text x="210" y="88" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">字母</text>
  <text x="270" y="88" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">摩斯码</text>
  <line x1="85" y1="70" x2="85" y2="96" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="160" y1="70" x2="160" y2="96" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="240" y1="70" x2="240" y2="96" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="30" y="96" width="260" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="111" text-anchor="middle" font-size="11" fill="#333">g</text>
  <text x="120" y="111" text-anchor="middle" font-size="11" fill="#333">--.</text>
  <text x="210" y="111" text-anchor="middle" font-size="11" fill="#333">z</text>
  <text x="270" y="111" text-anchor="middle" font-size="11" fill="#333">--..</text>

  <rect x="30" y="118" width="260" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="133" text-anchor="middle" font-size="11" fill="#333">i</text>
  <text x="120" y="133" text-anchor="middle" font-size="11" fill="#333">..</text>
  <text x="210" y="133" text-anchor="middle" font-size="11" fill="#333">e</text>
  <text x="270" y="133" text-anchor="middle" font-size="11" fill="#333">.</text>

  <rect x="30" y="140" width="260" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="155" text-anchor="middle" font-size="11" fill="#333">n</text>
  <text x="120" y="155" text-anchor="middle" font-size="11" fill="#333">-.</text>
  <text x="210" y="155" text-anchor="middle" font-size="11" fill="#333">s</text>
  <text x="270" y="155" text-anchor="middle" font-size="11" fill="#333">...</text>

  <rect x="30" y="162" width="260" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="177" text-anchor="middle" font-size="11" fill="#333">m</text>
  <text x="120" y="177" text-anchor="middle" font-size="11" fill="#333">--</text>
  <text x="210" y="177" text-anchor="middle" font-size="11" fill="#888">…</text>
  <text x="270" y="177" text-anchor="middle" font-size="11" fill="#888">共 26 个</text>

  <!-- Word -> transform -->
  <text x="330" y="88" font-size="12" fill="#444" font-weight="bold">单词 → 拼接摩斯串</text>

  <rect x="330" y="96" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="114" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">gin</text>
  <path d="M 396 109 L 446 109" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="450" y="96" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="510" y="114" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">--...-.</text>

  <rect x="330" y="132" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">zen</text>
  <path d="M 396 145 L 446 145" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="450" y="132" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="510" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">--...-.</text>

  <text x="510" y="172" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">两个串完全相同！</text>

  <!-- Set dedup idea -->
  <rect x="30" y="220" width="540" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="244" text-anchor="middle" font-size="12" fill="#333">问题本质：对每个单词算一个"摩斯串"，问有多少个<b>不同</b>的串</text>

  <!-- Hash set -->
  <text x="30" y="292" font-size="12" fill="#888">哈希集合（自动去重）：</text>
  <rect x="30" y="300" width="240" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="320" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">--...-.</text>
  <text x="200" y="320" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">--...--.</text>

  <text x="290" y="320" font-size="12" fill="#4a7a3a" font-weight="bold">→ 不同串数 = 集合大小 = 2 ⭐</text>

  <text x="30" y="360" font-size="11" fill="#888">关键：摩斯串本身是字符串，直接丢进 set 即可去重，</text>
  <text x="30" y="378" font-size="11" fill="#888">无需关心原单词是谁，只关心拼接后的串是否相等。</text>
</svg>
