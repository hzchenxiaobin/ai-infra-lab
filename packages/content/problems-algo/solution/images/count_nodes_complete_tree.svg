<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="390" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：比较「左深度」与「右深度」判定是否完美二叉树</text>

  <!-- 左：完美二叉树 -->
  <text x="160" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">完美二叉树（满）</text>
  <!-- 根 -->
  <circle cx="160" cy="80" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="84" text-anchor="middle" font-size="11" fill="#333">1</text>
  <!-- 第二层 -->
  <circle cx="120" cy="135" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="139" text-anchor="middle" font-size="10" fill="#333">2</text>
  <line x1="150" y1="92" x2="128" y2="123" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="200" cy="135" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="139" text-anchor="middle" font-size="10" fill="#333">3</text>
  <line x1="170" y1="92" x2="192" y2="123" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- 第三层 -->
  <circle cx="100" cy="190" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="194" text-anchor="middle" font-size="9" fill="#333">4</text>
  <line x1="112" y1="146" x2="104" y2="180" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="140" cy="190" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="194" text-anchor="middle" font-size="9" fill="#333">5</text>
  <line x1="128" y1="146" x2="136" y2="180" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="180" cy="190" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="194" text-anchor="middle" font-size="9" fill="#333">6</text>
  <line x1="192" y1="146" x2="184" y2="180" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="220" cy="190" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="194" text-anchor="middle" font-size="9" fill="#333">7</text>
  <line x1="208" y1="146" x2="216" y2="180" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>

  <!-- 左路径高亮 1->2->4 -->
  <path d="M 150 92 L 128 123" stroke="#d6a040" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <path d="M 112 146 L 104 180" stroke="#d6a040" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <!-- 右路径高亮 1->3->7 -->
  <path d="M 170 92 L 192 123" stroke="#b85450" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <path d="M 208 146 L 216 180" stroke="#b85450" stroke-width="2.4" fill="none" filter="url(#rough2)"/>

  <text x="160" y="222" text-anchor="middle" font-size="11" fill="#333">左深度 <tspan fill="#d6a040" font-weight="bold">3</tspan> = 右深度 <tspan fill="#b85450" font-weight="bold">3</tspan></text>
  <rect x="70" y="232" width="180" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="254" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">节点数 = 2³ − 1 = 7</text>

  <!-- 分隔 -->
  <line x1="300" y1="60" x2="300" y2="280" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- 右：完全但非完美 -->
  <text x="440" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">完全但非完美</text>
  <circle cx="440" cy="80" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="440" y="84" text-anchor="middle" font-size="11" fill="#333">1</text>
  <circle cx="400" cy="135" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="139" text-anchor="middle" font-size="10" fill="#333">2</text>
  <line x1="430" y1="92" x2="408" y2="123" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="480" cy="135" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="480" y="139" text-anchor="middle" font-size="10" fill="#333">3</text>
  <line x1="450" y1="92" x2="472" y2="123" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="380" cy="190" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="194" text-anchor="middle" font-size="9" fill="#333">4</text>
  <line x1="392" y1="146" x2="384" y2="180" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="420" cy="190" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="194" text-anchor="middle" font-size="9" fill="#333">5</text>
  <line x1="408" y1="146" x2="416" y2="180" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="460" cy="190" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="194" text-anchor="middle" font-size="9" fill="#333">6</text>
  <line x1="472" y1="146" x2="464" y2="180" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- 左路径高亮 1->2->4 -->
  <path d="M 430 92 L 408 123" stroke="#d6a040" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <path d="M 392 146 L 384 180" stroke="#d6a040" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <!-- 右路径高亮 1->3（3 无右孩子，右深度止于 3） -->
  <path d="M 450 92 L 472 123" stroke="#b85450" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <text x="498" y="138" font-size="10" fill="#b85450">止于此</text>

  <text x="440" y="222" text-anchor="middle" font-size="11" fill="#333">左深度 <tspan fill="#d6a040" font-weight="bold">3</tspan> ≠ 右深度 <tspan fill="#b85450" font-weight="bold">2</tspan></text>
  <rect x="340" y="232" width="200" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="254" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">非完美 → 递归左 + 递归右</text>

  <!-- 说明框 -->
  <rect x="40" y="290" width="520" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="313" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">完全二叉树的判定利器</text>
  <text x="60" y="334" font-size="11" fill="#555">• 左深度：从根一直走 left 到底的层数 d；右深度：从根一直走 right 到底的层数 d</text>
  <text x="60" y="352" font-size="11" fill="#555">• 二者相等 ⟺ 该子树是完美二叉树 ⟺ 节点数恰为 2^d − 1，无需再递归</text>
  <text x="60" y="370" font-size="11" fill="#555">• 二者不等 ⟺ 最后一层没填满，须对左右子树分别递归（其中一棵必为完美）</text>
</svg>
