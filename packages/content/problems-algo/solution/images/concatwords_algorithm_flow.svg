<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="720" height="540" fill="#fdfcf7"/>

  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">连接词算法流程</text>
  <path d="M 210 40 Q 360 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Start -->
  <g filter="url(#sk)">
    <rect x="280" y="60" width="160" height="34" rx="17" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="360" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">输入 words[]</text>
  <path d="M 360 96 L 360 112" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Sort -->
  <g filter="url(#sk)">
    <rect x="250" y="116" width="220" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="360" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a6a20">按长度升序排序 words</text>
  <text x="360" y="150" text-anchor="middle" font-size="10" fill="#888">短词先处理，长词后处理</text>
  <path d="M 360 158 L 360 174" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Init -->
  <g filter="url(#sk)">
    <rect x="250" y="178" width="220" height="40" rx="6" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="360" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">preWords = ∅,  result = []</text>
  <text x="360" y="212" text-anchor="middle" font-size="10" fill="#888">更短词字典 + 结果列表</text>
  <path d="M 360 220 L 360 236" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Loop header -->
  <g filter="url(#sk)">
    <path d="M 360 236 L 470 268 L 360 300 L 250 268 Z" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="360" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">遍历每个 w</text>
  <text x="360" y="282" text-anchor="middle" font-size="10" fill="#2b6e9e">（升序）</text>
  <path d="M 360 300 L 360 316" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Word Break DP box -->
  <g filter="url(#sk)">
    <rect x="120" y="320" width="480" height="74" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/>
  </g>
  <text x="140" y="340" font-size="12" font-weight="bold" fill="#2e6e2e">wordBreak(w, preWords)：复用 139 题 DP</text>
  <text x="140" y="358" font-size="10" fill="#555">dp[0] = true;  for i in 1..len(w):</text>
  <text x="140" y="372" font-size="10" fill="#555">  for j in 0..i-1:  if dp[j] &amp;&amp; w[j:i] ∈ preWords → dp[i] = true, break</text>
  <text x="140" y="386" font-size="10" fill="#555">return dp[len(w)]</text>
  <path d="M 360 396 L 360 412" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Decision: dp[len]==true? -->
  <g filter="url(#sk)">
    <path d="M 360 412 L 460 440 L 360 468 L 260 440 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="360" y="438" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a6a20">dp[len]==true?</text>
  <text x="360" y="454" text-anchor="middle" font-size="9" fill="#9a6a20">（由 ≥2 更短词拼成）</text>

  <!-- Yes branch -->
  <path d="M 260 440 L 150 440" stroke="#2e8b57" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="205" y="432" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">Yes</text>
  <g filter="url(#sk)">
    <rect x="50" y="424" width="100" height="34" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/>
  </g>
  <text x="100" y="446" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">result.append(w)</text>

  <!-- Merge to "add to preWords" -->
  <path d="M 100 458 L 100 488 L 300 488" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <!-- No branch -->
  <path d="M 460 440 L 570 440" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="515" y="432" text-anchor="middle" font-size="10" fill="#a03040" font-weight="bold">No</text>
  <path d="M 620 458 L 620 488 L 420 488" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Add to preWords -->
  <g filter="url(#sk)">
    <rect x="300" y="476" width="120" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="360" y="498" text-anchor="middle" font-size="10" fill="#2b6e9e" font-weight="bold">preWords.add(w)</text>

  <!-- Loop back arrow -->
  <path d="M 300 493 Q 60 493 60 268 Q 60 252 248 268" stroke="#5a5a5a" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="64" y="380" font-size="9" fill="#888" transform="rotate(-90 64 380)">下一个 w</text>

  <!-- Return (right side) -->
  <path d="M 420 493 Q 690 493 690 268 Q 690 252 472 268" stroke="#5a5a5a" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="686" y="380" font-size="9" fill="#888" transform="rotate(90 686 380)">遍历完 → 返回 result</text>
</svg>
