<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 510" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="510" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：score = (max−min) + min相邻差，2 次修改删端点</text>

  <!-- ====== Section A: sorted array & original score ====== -->
  <text x="40" y="88" font-size="12" fill="#888">排序后 a:</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="150" y="70" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="170" y="90">1</text>
    <rect x="190" y="70" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="210" y="90">4</text>
    <rect x="230" y="70" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="250" y="90">5</text>
    <rect x="270" y="70" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="290" y="90">7</text>
    <rect x="310" y="70" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="330" y="90">8</text>
  </g>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="170" y="118">0</text>
    <text x="210" y="118">1</text>
    <text x="250" y="118">2</text>
    <text x="290" y="118">3</text>
    <text x="330" y="118">4</text>
  </g>

  <!-- max_score bracket above -->
  <path d="M150 60 L150 52 L350 52 L350 60" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="46" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">max−min = 8−1 = 7</text>

  <!-- min_score gaps below -->
  <path d="M190 112 L190 104 L230 104 L230 112" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="100" text-anchor="middle" font-size="10" fill="#4a7a3a">1</text>
  <path d="M270 112 L270 104 L310 104 L310 112" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="100" text-anchor="middle" font-size="10" fill="#4a7a3a">1</text>
  <text x="410" y="100" font-size="11" fill="#4a7a3a">min相邻差 = 1</text>

  <!-- original score badge -->
  <rect x="400" y="70" width="140" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="470" y="90" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">原始 score = 8</text>

  <!-- divider -->
  <path d="M 40 140 L 520 140" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="280" y="158" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">用 2 次修改把端点极值「设为邻居」→ min_gap 归 0，只余范围</text>

  <!-- ====== Case 1: remove a[0] & a[4] ====== -->
  <text x="30" y="196" font-size="11.5" fill="#555" font-weight="bold">① 改 a[0],a[4]</text>
  <text x="30" y="212" font-size="10.5" fill="#888">各设为邻居</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="150" y="180" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="168" y="198">1</text>
    <rect x="186" y="180" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="204" y="198">4</text>
    <rect x="222" y="180" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="240" y="198">5</text>
    <rect x="258" y="180" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="276" y="198">7</text>
    <rect x="294" y="180" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="312" y="198">8</text>
  </g>
  <path d="M186 176 L186 170 L294 170 L294 176" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="164" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">范围 a[3]−a[1]=3</text>
  <text x="350" y="198" font-size="11.5" fill="#4a7a3a" font-weight="bold">→ gap=0, score=3</text>

  <!-- ====== Case 2: remove a[0],a[1] ====== -->
  <text x="30" y="276" font-size="11.5" fill="#555" font-weight="bold">② 改 a[0],a[1]</text>
  <text x="30" y="292" font-size="10.5" fill="#888">各设为 a[2]=5</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="150" y="260" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="168" y="278">1</text>
    <rect x="186" y="260" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="204" y="278">4</text>
    <rect x="222" y="260" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="240" y="278">5</text>
    <rect x="258" y="260" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="276" y="278">7</text>
    <rect x="294" y="260" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="312" y="278">8</text>
  </g>
  <path d="M222 256 L222 250 L330 250 L330 256" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="276" y="244" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">范围 a[4]−a[2]=3</text>
  <text x="350" y="278" font-size="11.5" fill="#4a7a3a" font-weight="bold">→ gap=0, score=3</text>

  <!-- ====== Case 3: remove a[3],a[4] ====== -->
  <text x="30" y="356" font-size="11.5" fill="#555" font-weight="bold">③ 改 a[3],a[4]</text>
  <text x="30" y="372" font-size="10.5" fill="#888">各设为 a[2]=5</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="150" y="340" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="168" y="358">1</text>
    <rect x="186" y="340" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="204" y="358">4</text>
    <rect x="222" y="340" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="240" y="358">5</text>
    <rect x="258" y="340" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="276" y="358">7</text>
    <rect x="294" y="340" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="312" y="358">8</text>
  </g>
  <path d="M150 336 L150 330 L258 330 L258 336" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="204" y="324" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">范围 a[2]−a[0]=4</text>
  <text x="350" y="358" font-size="11.5" fill="#4a7a3a" font-weight="bold">→ gap=0, score=4</text>

  <!-- Conclusion -->
  <rect x="60" y="400" width="440" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="419" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">答案 = min(3, 3, 4) = 3</text>

  <text x="280" y="452" text-anchor="middle" font-size="10.5" fill="#888">3 种方案 = 从两端共删 2 个极值的所有分布（左 i 个 + 右 2−i 个，i∈{0,1,2}）</text>
</svg>
