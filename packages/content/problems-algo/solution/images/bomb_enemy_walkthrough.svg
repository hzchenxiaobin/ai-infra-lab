<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：每个空格的 rowHits + colHits = 总杀敌数</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">行段敌人数：row0=1, row1 段1=1/段2=1, row2=1 · 列段敌人数：col0=1, col1=2, col2=0, col3=1</text>

  <!-- ===== Grid with annotations ===== -->
  <!-- cell 65x60, start x=80 y=80 -->

  <!-- Column labels -->
  <text x="112" y="74" text-anchor="middle" font-size="10" fill="#888">col0</text>
  <text x="177" y="74" text-anchor="middle" font-size="10" fill="#888">col1</text>
  <text x="242" y="74" text-anchor="middle" font-size="10" fill="#888">col2</text>
  <text x="307" y="74" text-anchor="middle" font-size="10" fill="#888">col3</text>

  <!-- Row labels -->
  <text x="56" y="114" text-anchor="middle" font-size="10" fill="#888">row0</text>
  <text x="56" y="174" text-anchor="middle" font-size="10" fill="#888">row1</text>
  <text x="56" y="234" text-anchor="middle" font-size="10" fill="#888">row2</text>

  <!-- ===== Row 0: 0 E 0 0 ===== -->
  <!-- (0,0) empty: r=1 c=1 =2 -->
  <rect x="80" y="85" width="65" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="112" y="110" text-anchor="middle" font-size="16" fill="#446688">0</text>
  <text x="112" y="130" text-anchor="middle" font-size="9" fill="#888">1+1=2</text>

  <!-- (0,1) E -->
  <rect x="145" y="85" width="65" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="177" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">E</text>
  <text x="177" y="130" text-anchor="middle" font-size="9" fill="#b85450">c=2</text>

  <!-- (0,2) empty: r=1 c=0 =1 -->
  <rect x="210" y="85" width="65" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="242" y="110" text-anchor="middle" font-size="16" fill="#446688">0</text>
  <text x="242" y="130" text-anchor="middle" font-size="9" fill="#888">1+0=1</text>

  <!-- (0,3) empty: r=1 c=1 =2 -->
  <rect x="275" y="85" width="65" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="307" y="110" text-anchor="middle" font-size="16" fill="#446688">0</text>
  <text x="307" y="130" text-anchor="middle" font-size="9" fill="#888">1+1=2</text>

  <!-- ===== Row 1: E 0 W E ===== -->
  <!-- (1,0) E -->
  <rect x="80" y="145" width="65" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="170" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">E</text>
  <text x="112" y="190" text-anchor="middle" font-size="9" fill="#b85450">r=1</text>

  <!-- (1,1) empty: r=1 c=2 =3 ← MAX -->
  <rect x="145" y="145" width="65" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="177" y="170" text-anchor="middle" font-size="16" font-weight="bold" fill="#d6a040">0</text>
  <text x="177" y="190" text-anchor="middle" font-size="10" font-weight="bold" fill="#d6a040">1+2=3</text>
  <text x="177" y="200" text-anchor="middle" font-size="8" fill="#d6a040">★最大</text>

  <!-- (1,2) W -->
  <rect x="210" y="145" width="65" height="60" fill="#555" stroke="#333" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="170" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">W</text>
  <text x="242" y="190" text-anchor="middle" font-size="9" fill="#ff9999">墙</text>

  <!-- (1,3) E -->
  <rect x="275" y="145" width="65" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="170" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">E</text>
  <text x="307" y="190" text-anchor="middle" font-size="9" fill="#b85450">r=1</text>

  <!-- ===== Row 2: 0 E 0 0 ===== -->
  <!-- (2,0) empty: r=1 c=1 =2 -->
  <rect x="80" y="205" width="65" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="112" y="230" text-anchor="middle" font-size="16" fill="#446688">0</text>
  <text x="112" y="250" text-anchor="middle" font-size="9" fill="#888">1+1=2</text>

  <!-- (2,1) E -->
  <rect x="145" y="205" width="65" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="177" y="230" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">E</text>
  <text x="177" y="250" text-anchor="middle" font-size="9" fill="#b85450">c=2</text>

  <!-- (2,2) empty: r=1 c=0 =1 -->
  <rect x="210" y="205" width="65" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="242" y="230" text-anchor="middle" font-size="16" fill="#446688">0</text>
  <text x="242" y="250" text-anchor="middle" font-size="9" fill="#888">1+0=1</text>

  <!-- (2,3) empty: r=1 c=1 =2 -->
  <rect x="275" y="205" width="65" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="307" y="230" text-anchor="middle" font-size="16" fill="#446688">0</text>
  <text x="307" y="250" text-anchor="middle" font-size="9" fill="#888">1+1=2</text>

  <!-- ===== Right side: segment breakdown ===== -->
  <!-- Row segments -->
  <rect x="370" y="85" width="175" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="457" y="103" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">行段敌人数</text>
  <text x="380" y="121" font-size="9" fill="#555">row0: [0 E 0 0] → 1</text>
  <text x="380" y="137" font-size="9" fill="#555">row1: [E 0]→1  [E]→1</text>
  <text x="380" y="153" font-size="9" fill="#555">row2: [0 E 0 0] → 1</text>

  <!-- Col segments -->
  <rect x="370" y="175" width="175" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="457" y="193" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">列段敌人数</text>
  <text x="380" y="211" font-size="9" fill="#555">col0: [0 E 0] → 1</text>
  <text x="380" y="227" font-size="9" fill="#555">col1: [E 0 E] → 2</text>
  <text x="380" y="243" font-size="9" fill="#555">col2: [0]→0  [0]→0</text>
  <text x="380" y="259" font-size="9" fill="#555">col3: [0 E 0] → 1</text>

  <!-- Answer box -->
  <rect x="370" y="275" width="175" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="457" y="295" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">答案</text>
  <text x="457" y="318" text-anchor="middle" font-size="16" font-weight="bold" fill="#d6a040">max = 3</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="340" width="505" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="282" y="360" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">关键：col1 的列段敌人 = 2（上方 E + 下方 E，中间无墙）</text>
  <text x="56" y="380" font-size="10" fill="#555">① (1,1) 是唯一能吃到 col1=2 的空格（col1 的敌人 E 在 row0 和 row2，空格 0 在 row1）。</text>
  <text x="56" y="398" font-size="10" fill="#555">② 同时 (1,1) 的行段 [E 0] 有 1 个敌人 → 1+2=3，全图最大。</text>
</svg>
