<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 562"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="562" fill="#fafafa"/>

  <text x="20" y="24" font-size="13" fill="#333" filter="url(#rough2)">算法流程：二分最小距离 x，check 用环形贪心</text>

  <!-- 开始 -->
  <ellipse cx="260" cy="52" rx="40" ry="16" fill="#f5f5f5" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="57" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M260,68 L260,80" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤1：预处理 -->
  <rect x="60" y="84" width="400" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="104" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">① 求周长坐标 t（顺时针）并排序，倍增成链 t2 = t ∪ (t+4s)</text>
  <text x="260" y="123" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">二分区间 lo = 1，hi = ⌊4s/k⌋（上界来自 kx ≤ 4s）</text>

  <path d="M260,132 L260,144" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤2：取中点 -->
  <rect x="110" y="148" width="300" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="168" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">② mid = ⌈(lo + hi + 1) / 2⌉</text>

  <path d="M260,178 L260,190" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤3：check 内部 -->
  <rect x="60" y="194" width="400" height="80" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="214" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">③ check(mid)：双指针预处理 nxt[i]</text>
  <text x="260" y="232" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">（第一个坐标 ≥ t2[i] + mid 的下标，一趟 O(n)）</text>
  <text x="260" y="250" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">枚举 n 个起点：每次跳到 ≥ cur + mid 的第一个点</text>
  <text x="260" y="268" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">限制：第 k 个点 ≤ 起点 + 4s − mid（给环绕间隔留够）</text>

  <path d="M260,274 L260,286" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定1：check 是否成立 -->
  <polygon points="260,290 385,325 260,360 135,325" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="321" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">check(mid) 成立？</text>
  <text x="260" y="339" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（任一起点凑够 k 个点）</text>

  <!-- 是 分支 -->
  <path d="M260,360 L260,374" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="372" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="160" y="378" width="200" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="398" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">lo = mid（可行，保留）</text>

  <!-- 否 分支绕行到 hi 框 -->
  <path d="M135,325 L55,325 L55,429 L150,429" fill="none" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="317" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="155" y="414" width="210" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="434" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">hi = mid − 1（不可行，收缩）</text>

  <path d="M260,408 L260,414" fill="none" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M260,444 L260,456" fill="none" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定2：lo < hi -->
  <polygon points="260,460 355,486 260,512 165,486" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="491" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">lo &lt; hi ？</text>

  <!-- 否：回边继续二分 -->
  <path d="M355,486 L490,486 L490,163 L416,163" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="497" y="325" font-size="10" fill="#888" filter="url(#rough2)" transform="rotate(90 497,325)">继续二分</text>

  <!-- 是：结束 -->
  <path d="M260,512 L260,524" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="522" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <ellipse cx="260" cy="540" rx="46" ry="15" fill="#f5f5f5" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="545" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 lo</text>
</svg>
