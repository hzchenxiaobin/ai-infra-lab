<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：枚举 mm → 算 ss → 校验 → 去前导零 → 贪心计费</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">O(1) 时间 O(1) 空间，至多 2 个合法 mm</text>

  <!-- Step 1: 输入参数 -->
  <rect x="160" y="56" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="20" filter="url(#rough2)"/>
  <text x="260" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输入 startAt, moveCost, pushCost, t</text>

  <path d="M 260 92 L 260 106" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: 枚举 mm -->
  <rect x="130" y="110" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="128" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">枚举 mm = 0..99</text>
  <text x="260" y="143" text-anchor="middle" font-size="10" fill="#888">ss = targetSeconds − mm × 60</text>

  <path d="M 260 152 L 260 166" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: 0 ≤ ss ≤ 99? -->
  <polygon points="260,170 380,202 260,234 140,202" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="198" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0 ≤ ss ≤ 99 ?</text>
  <text x="260" y="213" text-anchor="middle" font-size="9.5" fill="#888">且 mm ≤ 99</text>

  <!-- No branch: right -->
  <path d="M 380 202 L 430 202" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="405" y="196" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">No</text>
  <rect x="430" y="188" width="76" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="468" y="207" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">跳过</text>
  <!-- loop back from skip to mm enumeration -->
  <path d="M 468 188 L 468 130 L 390 130" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- Yes branch: down -->
  <path d="M 260 234 L 260 248" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="244" font-size="10" fill="#4a7a3a" font-weight="bold">Yes</text>

  <!-- Step 3: 去前导零 -->
  <rect x="120" y="252" width="280" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="270" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">拼四位 mm|ss → 去前导零</text>
  <text x="260" y="285" text-anchor="middle" font-size="10" fill="#888">如 0960 → 960，0076 → 76（补零免费）</text>

  <path d="M 260 294 L 260 306" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: 贪心计费 -->
  <rect x="100" y="310" width="320" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">贪心计费：逐位扫描</text>
  <text x="260" y="344" text-anchor="middle" font-size="10" fill="#888">d ≠ cur → +moveCost, cur=d；每位 +pushCost</text>

  <!-- dashed loop annotation -->
  <path d="M 260 356 L 260 368" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="3 2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="365" font-size="9.5" fill="#888">ans=min, 至多2次</text>

  <!-- Step 5: 返回 -->
  <rect x="160" y="372" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="20" filter="url(#rough2)"/>
  <text x="260" y="394" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">返回 ans</text>
</svg>
