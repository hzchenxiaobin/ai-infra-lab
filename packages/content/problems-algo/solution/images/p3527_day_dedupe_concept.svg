<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 416"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="416" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：计数单位是「天」——先按天去重，再全局累加</text>

  <!-- ============ 第 0 天 ============ -->
  <rect x="15" y="48" width="50" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="68" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">第0天</text>
  <rect x="76" y="52" width="34" height="24" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="93" y="68" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">good</text>
  <rect x="114" y="52" width="34" height="24" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="131" y="68" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ok</text>
  <rect x="152" y="52" width="34" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="169" y="68" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">good</text>
  <line x1="155" y1="64" x2="183" y2="62" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="190" y="52" width="34" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="207" y="68" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">ok</text>
  <line x1="193" y1="62" x2="221" y2="64" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 230 64 L 254 64" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="262" y="48" width="118" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="321" y="68" text-anchor="middle" font-size="11" fill="#2a5a2a" filter="url(#rough2)">{good, ok}</text>

  <!-- ============ 第 1 天 ============ -->
  <rect x="15" y="100" width="50" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="120" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">第1天</text>
  <rect x="76" y="104" width="28" height="24" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="120" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ok</text>
  <rect x="108" y="104" width="28" height="24" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="122" y="120" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">bad</text>
  <rect x="140" y="104" width="28" height="24" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="154" y="120" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">good</text>
  <rect x="172" y="104" width="28" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="186" y="120" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">ok</text>
  <line x1="175" y1="116" x2="197" y2="114" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="204" y="104" width="28" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="218" y="120" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">ok</text>
  <line x1="207" y1="114" x2="229" y2="116" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 238 116 L 254 116" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="262" y="100" width="142" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="333" y="120" text-anchor="middle" font-size="11" fill="#2a5a2a" filter="url(#rough2)">{ok, bad, good}</text>

  <!-- ============ 第 2 天 ============ -->
  <rect x="15" y="152" width="50" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="172" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">第2天</text>
  <rect x="76" y="156" width="34" height="24" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="93" y="172" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">good</text>
  <path d="M 118 168 L 254 168" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="262" y="152" width="86" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="305" y="172" text-anchor="middle" font-size="11" fill="#2a5a2a" filter="url(#rough2)">{good}</text>

  <!-- ============ 第 3 天 ============ -->
  <rect x="15" y="204" width="50" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="224" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">第3天</text>
  <rect x="76" y="208" width="34" height="24" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="93" y="224" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">bad</text>
  <path d="M 118 220 L 254 220" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="262" y="204" width="80" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="302" y="224" text-anchor="middle" font-size="11" fill="#2a5a2a" filter="url(#rough2)">{bad}</text>

  <!-- 图例（利用第 2/3 天右侧留白） -->
  <rect x="368" y="156" width="30" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="383" y="172" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">ok</text>
  <line x1="371" y1="168" x2="395" y2="166" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="406" y="171" font-size="9.5" fill="#b85450" filter="url(#rough2)">当天重复，只计 1 次</text>
  <rect x="368" y="208" width="30" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="383" y="224" text-anchor="middle" font-size="10.5" fill="#2a5a2a" filter="url(#rough2)">ok</text>
  <text x="406" y="223" font-size="9.5" fill="#2a5a2a" filter="url(#rough2)">跨天出现，天数累加</text>

  <!-- 去重结果 → 全局计数 -->
  <path d="M 330 240 L 330 254" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="258" width="400" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">全局计数：包含该词的天数</text>
  <rect x="76" y="286" width="368" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">good → 3 天（第 0、1、2 天）✓ 最大</text>
  <text x="260" y="322" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">ok → 2 天（第 0、1 天）</text>
  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">bad → 2 天（第 1、3 天）</text>

  <!-- 冠军框 -->
  <rect x="140" y="360" width="240" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="380" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">返回「good」：3 天最高</text>

  <text x="260" y="408" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">并列时取字典序最小——示例 2：bad / good / ok 同为 2 天 → 选「bad」</text>
</svg>
