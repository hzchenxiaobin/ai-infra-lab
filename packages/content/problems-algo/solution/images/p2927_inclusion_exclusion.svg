<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">容斥：从总数里扣掉「有人超限」</text>

  <!-- left: definition -->
  <rect x="25" y="46" width="196" height="110" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="123" y="70" text-anchor="middle" font-size="11" fill="#333">记 Aᵢ = 第 i 人分到</text>
  <text x="123" y="88" text-anchor="middle" font-size="11" fill="#333">≥ L 颗的方案集，L = limit+1</text>
  <text x="123" y="112" text-anchor="middle" font-size="11" fill="#446688">ans = f(n) − |A₁∪A₂∪A₃|</text>
  <text x="123" y="138" text-anchor="middle" font-size="10" fill="#888">f(n)：无上限的总方案数</text>

  <!-- left: substitution -->
  <rect x="25" y="170" width="196" height="102" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="123" y="194" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">超限替换</text>
  <text x="123" y="216" text-anchor="middle" font-size="11" fill="#333">|Aᵢ|：先给 i 预发 L 颗</text>
  <text x="123" y="234" text-anchor="middle" font-size="11" fill="#333">剩 n−L 颗自由分配</text>
  <text x="123" y="256" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">→ |Aᵢ| = f(n−L)</text>

  <!-- venn diagram -->
  <circle cx="315" cy="140" r="62" fill="#fce4ec" fill-opacity="0.5" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="402" cy="140" r="62" fill="#fce4ec" fill-opacity="0.5" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="358" cy="218" r="62" fill="#fce4ec" fill-opacity="0.5" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="266" y="88" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">A₁</text>
  <text x="450" y="88" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">A₂</text>
  <text x="358" y="304" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">A₃</text>

  <text x="284" y="130" text-anchor="middle" font-size="9" fill="#555">f(n−L)</text>
  <text x="432" y="130" text-anchor="middle" font-size="9" fill="#555">f(n−L)</text>
  <text x="358" y="254" text-anchor="middle" font-size="9" fill="#555">f(n−L)</text>
  <text x="358" y="120" text-anchor="middle" font-size="9" fill="#555">f(n−2L)</text>
  <text x="318" y="192" text-anchor="middle" font-size="9" fill="#555">f(n−2L)</text>
  <text x="399" y="192" text-anchor="middle" font-size="9" fill="#555">f(n−2L)</text>
  <text x="358" y="170" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">f(n−3L)</text>

  <text x="475" y="176" font-size="9" fill="#888">各 3 个</text>
  <text x="475" y="190" font-size="9" fill="#888">交叠处</text>

  <!-- bottom formula -->
  <rect x="25" y="300" width="470" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="11" fill="#333">|A₁∪A₂∪A₃| = 3·f(n−L) − 3·f(n−2L) + f(n−3L)</text>
  <text x="260" y="348" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans = f(n) − 3·f(n−L) + 3·f(n−2L) − f(n−3L)</text>
</svg>
