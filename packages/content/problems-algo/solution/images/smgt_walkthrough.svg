<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：letters = [c, f, j]</text>

  <!-- ===== 例 1: target = c ===== -->
  <text x="20" y="56" font-size="12" fill="#446688" font-weight="bold">例 1：target = 'c' → 找首个 &gt; 'c' 的字母</text>

  <!-- round 1 -->
  <text x="20" y="80" font-size="11" fill="#555">第 1 轮：left=0, right=2 → mid=1</text>
  <rect x="60" y="88" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="108" text-anchor="middle" font-size="13" fill="#333">c</text>
  <rect x="125" y="88" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">f</text>
  <rect x="190" y="88" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="108" text-anchor="middle" font-size="13" fill="#333">j</text>
  <text x="90" y="132" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">left</text>
  <text x="155" y="132" text-anchor="middle" font-size="9.5" fill="#888" font-weight="bold">mid</text>
  <text x="220" y="132" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">right</text>
  <rect x="280" y="96" width="180" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="370" y="112" text-anchor="middle" font-size="10.5" fill="#446688">'f' &gt; 'c' → right = mid−1 = 0</text>

  <!-- round 2 -->
  <text x="20" y="160" font-size="11" fill="#555">第 2 轮：left=0, right=0 → mid=0</text>
  <rect x="60" y="168" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="188" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="125" y="168" width="60" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="188" text-anchor="middle" font-size="13" fill="#aaa">f</text>
  <rect x="190" y="168" width="60" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="188" text-anchor="middle" font-size="13" fill="#aaa">j</text>
  <text x="90" y="212" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">left/mid</text>
  <text x="90" y="224" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">right</text>
  <rect x="280" y="176" width="180" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="370" y="192" text-anchor="middle" font-size="10.5" fill="#446688">'c' ≤ 'c' → left = mid+1 = 1</text>

  <!-- result 1 -->
  <rect x="40" y="240" width="420" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="262" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">left=1 &gt; right=0，区间空 → return letters[1] = 'f' ✓</text>

  <!-- ===== 例 2: target = j (wrap) ===== -->
  <text x="20" y="302" font-size="12" fill="#b85450" font-weight="bold">例 2：target = 'j'（环绕）→ 所有字母 ≤ 'j'，回到 letters[0]</text>

  <!-- round 1 -->
  <text x="20" y="326" font-size="11" fill="#555">第 1 轮：left=0, right=2 → mid=1，'f' ≤ 'j' → left=2</text>
  <rect x="60" y="334" width="60" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="354" text-anchor="middle" font-size="13" fill="#aaa">c</text>
  <rect x="125" y="334" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="354" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">f</text>
  <rect x="190" y="334" width="60" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="354" text-anchor="middle" font-size="13" fill="#aaa">j</text>

  <!-- round 2 -->
  <text x="20" y="382" font-size="11" fill="#555">第 2 轮：left=2, right=2 → mid=2，'j' ≤ 'j' → left=3</text>
  <rect x="60" y="390" width="60" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="410" text-anchor="middle" font-size="13" fill="#aaa">c</text>
  <rect x="125" y="390" width="60" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="410" text-anchor="middle" font-size="13" fill="#aaa">f</text>
  <rect x="190" y="390" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="410" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">j</text>

  <!-- result 2 -->
  <rect x="280" y="396" width="240" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="400" y="414" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">left=3=n → 3%3=0 → letters[0]='c'</text>
</svg>
