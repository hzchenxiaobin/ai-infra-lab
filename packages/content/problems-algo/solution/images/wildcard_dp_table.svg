<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,9 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="720" height="460" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">DP 填表演算：s = "abc", p = "a*c"</text>
  <text x="360" y="48" text-anchor="middle" font-size="11" fill="#888">dp[i][j] 表示 s[0..i-1] 是否匹配 p[0..j-1]</text>

  <!-- Column headers (pattern) -->
  <text x="132" y="92" text-anchor="end" font-size="11" fill="#888" font-weight="bold">p →</text>
  <text x="180" y="92" text-anchor="middle" font-size="11" fill="#888">""</text>
  <text x="250" y="92" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">a</text>
  <text x="320" y="92" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">*</text>
  <text x="390" y="92" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">c</text>

  <!-- Row headers (string) -->
  <text x="132" y="134" text-anchor="end" font-size="11" fill="#888" font-weight="bold">""</text>
  <text x="132" y="178" text-anchor="end" font-size="13" fill="#4a7a3a" font-weight="bold">a</text>
  <text x="132" y="222" text-anchor="end" font-size="13" fill="#4a7a3a" font-weight="bold">b</text>
  <text x="132" y="266" text-anchor="end" font-size="13" fill="#4a7a3a" font-weight="bold">c</text>
  <text x="96" y="200" font-size="11" fill="#888" font-weight="bold" transform="rotate(-90 96 200)">s ↓</text>

  <!-- Row 0: T F F F (boundary) -->
  <rect x="150" y="108" width="60" height="44" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="136" text-anchor="middle" font-size="14" fill="#c98a2b" font-weight="bold">T</text>
  <rect x="220" y="108" width="60" height="44" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="136" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold">F</text>
  <rect x="290" y="108" width="60" height="44" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="136" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold">F</text>
  <rect x="360" y="108" width="60" height="44" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="136" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold">F</text>

  <!-- Row 1: F T T F -->
  <rect x="150" y="152" width="60" height="44" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="180" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold">F</text>
  <rect x="220" y="152" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="180" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="290" y="152" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="180" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="360" y="152" width="60" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="180" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold">F</text>

  <!-- Row 2: F F T F -->
  <rect x="150" y="196" width="60" height="44" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="224" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold">F</text>
  <rect x="220" y="196" width="60" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="224" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold">F</text>
  <rect x="290" y="196" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="224" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="360" y="196" width="60" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="224" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold">F</text>

  <!-- Row 3: F F T T(ans) -->
  <rect x="150" y="240" width="60" height="44" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="268" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold">F</text>
  <rect x="220" y="240" width="60" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="268" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold">F</text>
  <rect x="290" y="240" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="268" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="360" y="240" width="60" height="44" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="268" text-anchor="middle" font-size="15" fill="#4a8e4a" font-weight="bold">T</text>

  <!-- Transition arrows -->
  <!-- ① dp[1][1] = dp[0][0] : 'a'=='a' diagonal from (180,152) to (250,152) -->
  <path d="M 195 152 Q 220 158 235 152" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" stroke-dasharray="3,2"/>
  <text x="205" y="146" font-size="10" fill="#4a8e4a" font-weight="bold">a=a</text>

  <!-- ② dp[1][2] = dp[1][1] : * matches empty, left from (250,174) to (290,174) -->
  <path d="M 260 174 L 288 174" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="262" y="166" font-size="9" fill="#d6a040" font-weight="bold">*空</text>

  <!-- ③ dp[2][2] = dp[1][2] : * absorbs 'b', up from (320,196) to (320,196) -->
  <path d="M 320 196 L 320 198" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="328" y="190" font-size="9" fill="#b85450" font-weight="bold">*吞b</text>

  <!-- ④ dp[3][3] = dp[2][2] : 'c'=='c' diagonal from (320,240) to (390,240) -->
  <path d="M 335 240 Q 360 246 375 240" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" stroke-dasharray="3,2"/>
  <text x="342" y="234" font-size="10" fill="#4a8e4a" font-weight="bold">c=c</text>

  <!-- Side explanation box -->
  <rect x="460" y="108" width="240" height="176" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="580" y="130" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">读表要点</text>
  <text x="470" y="152" font-size="11" fill="#c98a2b" font-weight="bold">边界行</text>
  <text x="470" y="168" font-size="10" fill="#555">空串只能匹配空模式</text>
  <text x="470" y="182" font-size="10" fill="#555">p 以 * 开头才可能</text>
  <text x="470" y="196" font-size="10" fill="#555">匹配空串</text>
  <text x="470" y="218" font-size="11" fill="#d6a040" font-weight="bold">分支① * 空</text>
  <text x="470" y="234" font-size="10" fill="#555">T 沿「左」方向传递</text>
  <text x="470" y="248" font-size="10" fill="#555">(dp[i][j-1])</text>
  <text x="470" y="270" font-size="11" fill="#b85450" font-weight="bold">分支② * 吞字符</text>
  <text x="470" y="284" font-size="10" fill="#555">T 沿「上」方向传递</text>

  <!-- Bottom legend -->
  <rect x="40" y="308" width="660" height="136" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="60" y="332" font-size="12" fill="#2b2b2b" font-weight="bold">关键路径回放：</text>
  <text x="60" y="356" font-size="11" fill="#4a8e4a">① a 匹配 a</text>
  <text x="200" y="356" font-size="11" fill="#555">→ dp[1][1] = dp[0][0] = T（对角线转移）</text>
  <text x="60" y="380" font-size="11" fill="#d6a040">② * 先匹配空串</text>
  <text x="240" y="380" font-size="11" fill="#555">→ dp[1][2] = dp[1][1] = T（分支①，模式前进）</text>
  <text x="60" y="404" font-size="11" fill="#b85450">③ * 再吞掉 b</text>
  <text x="240" y="404" font-size="11" fill="#555">→ dp[2][2] = dp[1][2] = T（分支②，串前进）</text>
  <text x="60" y="428" font-size="11" fill="#4a8e4a">④ c 匹配 c</text>
  <text x="200" y="428" font-size="11" fill="#555">→ dp[3][3] = dp[2][2] = T ✓ 整串匹配成功</text>
</svg>
