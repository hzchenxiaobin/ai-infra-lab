<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：m=3, n=5, prices=[[1,4,2],[2,2,7],[2,1,3]]</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">price 表：1×4→2，2×2→7，2×1→3；其余为 0</text>

  <text x="40" y="76" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">dp 表（行=i 高，列=j 宽）</text>

  <rect x="40" y="86" width="38" height="28" rx="3" fill="#f0f0f0" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="59" y="105" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i\j</text>
  <rect x="78" y="86" width="38" height="28" rx="3" fill="#f0f0f0" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="97" y="105" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="116" y="86" width="38" height="28" rx="3" fill="#f0f0f0" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="135" y="105" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="154" y="86" width="38" height="28" rx="3" fill="#f0f0f0" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="173" y="105" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="192" y="86" width="38" height="28" rx="3" fill="#f0f0f0" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="211" y="105" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="230" y="86" width="38" height="28" rx="3" fill="#f0f0f0" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="249" y="105" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">5</text>

  <rect x="40" y="114" width="38" height="28" rx="3" fill="#f0f0f0" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="59" y="133" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="78" y="114" width="38" height="28" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="97" y="133" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="116" y="114" width="38" height="28" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="135" y="133" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="154" y="114" width="38" height="28" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="173" y="133" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="192" y="114" width="38" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="211" y="133" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="230" y="114" width="38" height="28" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="249" y="133" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="40" y="142" width="38" height="28" rx="3" fill="#f0f0f0" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="59" y="161" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="78" y="142" width="38" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="97" y="161" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="116" y="142" width="38" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="135" y="161" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="154" y="142" width="38" height="28" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="173" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <rect x="192" y="142" width="38" height="28" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="211" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">14</text>
  <rect x="230" y="142" width="38" height="28" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="249" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">17</text>

  <rect x="40" y="170" width="38" height="28" rx="3" fill="#f0f0f0" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="59" y="189" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="78" y="170" width="38" height="28" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="97" y="189" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="116" y="170" width="38" height="28" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="135" y="189" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <rect x="154" y="170" width="38" height="28" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="173" y="189" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <rect x="192" y="170" width="38" height="28" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="211" y="189" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">16</text>
  <rect x="230" y="170" width="38" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="249" y="189" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">19</text>

  <text x="40" y="218" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">绿格=整块卖命中价格表；黄=切出来更优；红=答案</text>

  <text x="310" y="76" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">最优切分树（dp[3][5]=19）</text>

  <rect x="316" y="86" width="100" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="366" y="111" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3×5 = 19</text>

  <path d="M 336 128 Q 320 140 320 152" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 396 128 Q 412 140 412 152" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="318" y="148" font-size="9.5" fill="#b85450" filter="url(#rough2)">横切 k=1</text>

  <rect x="278" y="156" width="84" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="178" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">1×5 = 2</text>

  <rect x="378" y="156" width="84" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="178" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">2×5 = 17</text>

  <path d="M 320 192 Q 320 202 320 210" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 404 192 Q 404 202 404 210" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <rect x="278" y="214" width="84" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="235" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">卖 1×4 → 2</text>

  <rect x="362" y="214" width="84" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="404" y="235" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">竖切 k=2</text>

  <path d="M 404 248 Q 380 260 366 272" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 404 248 Q 428 260 442 272" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <rect x="316" y="276" width="60" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="346" y="296" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2×2 →7</text>

  <rect x="430" y="276" width="60" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="296" text-anchor="middle" font-size="10.5" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">2×3=10</text>

  <path d="M 460 308 Q 460 318 460 326" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <rect x="430" y="330" width="60" height="28" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="349" text-anchor="middle" font-size="9.5" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">竖切 k=1</text>

  <path d="M 450 360 Q 436 370 422 378" fill="none" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 470 360 Q 484 370 498 378" fill="none" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <rect x="388" y="382" width="58" height="28" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="417" y="401" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2×1 →3</text>

  <rect x="470" y="382" width="58" height="28" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="499" y="401" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2×2 →7</text>

  <rect x="40" y="320" width="260" height="120" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="344" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最终卖出清单</text>
  <text x="60" y="368" font-size="11" fill="#333" filter="url(#rough2)">• 1 块 1×4 → 2 元</text>
  <text x="60" y="388" font-size="11" fill="#333" filter="url(#rough2)">• 2 块 2×2 → 2×7 = 14 元</text>
  <text x="60" y="408" font-size="11" fill="#333" filter="url(#rough2)">• 1 块 2×1 → 3 元</text>
  <text x="60" y="428" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">合计 2+14+3 = 19 ✓</text>
</svg>
