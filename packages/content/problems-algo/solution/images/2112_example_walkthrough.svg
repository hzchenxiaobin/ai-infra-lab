<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1 演算：3 条航班 → 3 个机场的流量统计</text>

  <!-- ===== Flights input (compact) ===== -->
  <text x="40" y="48" font-size="10" fill="#888">输入 Flights 表：</text>
  <!-- Flight 1→2, 4 -->
  <rect x="40" y="54" width="130" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)" opacity="0.7"/>
  <text x="50" y="70" font-size="10" fill="#446688" font-weight="bold">1 → 2,  cnt=4</text>
  <!-- Flight 2→1, 5 -->
  <rect x="180" y="54" width="130" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)" opacity="0.7"/>
  <text x="190" y="70" font-size="10" fill="#4a7a3a" font-weight="bold">2 → 1,  cnt=5</text>
  <!-- Flight 2→4, 5 -->
  <rect x="320" y="54" width="130" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)" opacity="0.7"/>
  <text x="330" y="70" font-size="10" fill="#d6a040" font-weight="bold">2 → 4,  cnt=5</text>

  <!-- Arrow down -->
  <path d="M 280 82 L 280 100" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="94" font-size="9.5" fill="#666">按机场统计出发 + 到达</text>

  <!-- ===== Airport breakdown table ===== -->
  <rect x="30" y="108" width="500" height="220" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <!-- Header row -->
  <rect x="32" y="110" width="496" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="60" y="126" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">airport</text>
  <text x="170" y="126" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">出发航班 (dep)</text>
  <text x="320" y="126" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">到达航班 (arr)</text>
  <text x="460" y="126" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">total</text>

  <line x1="120" y1="110" x2="120" y2="328" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="240" y1="110" x2="240" y2="328" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="400" y1="110" x2="400" y2="328" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Airport 1 row -->
  <rect x="32" y="136" width="496" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="0.6" rx="3" filter="url(#rough2)" opacity="0.4"/>
  <text x="60" y="160" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <text x="170" y="154" text-anchor="middle" font-size="9.5" fill="#446688">1→2: 4</text>
  <text x="170" y="172" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">Σdep = 4</text>
  <text x="320" y="154" text-anchor="middle" font-size="9.5" fill="#4a7a3a">2→1: 5</text>
  <text x="320" y="172" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">Σarr = 5</text>
  <text x="460" y="168" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">9</text>

  <!-- Airport 2 row (HIGHLIGHTED) -->
  <rect x="32" y="194" width="496" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)" opacity="0.6"/>
  <text x="60" y="218" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>
  <text x="170" y="212" text-anchor="middle" font-size="9.5" fill="#b85450">2→1: 5  2→4: 5</text>
  <text x="170" y="230" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">Σdep = 10</text>
  <text x="320" y="212" text-anchor="middle" font-size="9.5" fill="#b85450">1→2: 4</text>
  <text x="320" y="230" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">Σarr = 4</text>
  <text x="460" y="222" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">14</text>
  <text x="460" y="240" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">MAX ✓</text>

  <!-- Airport 4 row -->
  <rect x="32" y="252" width="496" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="0.6" rx="3" filter="url(#rough2)" opacity="0.4"/>
  <text x="60" y="276" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">4</text>
  <text x="170" y="270" text-anchor="middle" font-size="9.5" fill="#aaa">— 无出发</text>
  <text x="170" y="288" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">Σdep = 0</text>
  <text x="320" y="270" text-anchor="middle" font-size="9.5" fill="#d6a040">2→4: 5</text>
  <text x="320" y="288" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">Σarr = 5</text>
  <text x="460" y="284" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">5</text>

  <!-- Arrow down to output -->
  <path d="M 280 332 L 280 350" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Output -->
  <rect x="180" y="354" width="200" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="377" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">输出 airport_id = 2</text>
</svg>
