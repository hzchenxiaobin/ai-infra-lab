<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 490" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="490" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：预处理 0 位置，逐 l 逐 k 分段取交计数</text>

  <rect x="100" y="34" width="320" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="52" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">① zeros[] = 全部 0 的位置 + 哨兵 n</text>

  <path d="M 260 62 V 72" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="100" y="76" width="320" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="94" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">② for l = 0 … n−1（j 指针只前进）</text>

  <path d="M 260 104 V 138" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- 循环容器：对每个 l -->
  <rect x="60" y="116" width="364" height="250" fill="#fdfdfd" stroke="#999" stroke-width="1.3" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="74" y="134" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">对每个 l：</text>

  <rect x="120" y="142" width="280" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="159" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">③ j 前移：zeros[j] = 首个 ≥ l 的 0</text>

  <path d="M 260 168 V 178" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="88" y="180" width="328" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="252" y="197" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">④ ans += zeros[j] − l（k=0 段整段合法）</text>

  <path d="M 260 206 V 216" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="222" y="218" width="76" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="233" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">⑤ k = 1</text>

  <path d="M 260 240 V 252" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <polygon points="260,256 398,286 260,316 122,286" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="283" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">⑥ 还有第 k 个 0 且</text>
  <text x="260" y="297" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">l + k² + k ≤ n ？</text>

  <path d="M 260 316 V 326" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="268" y="324" font-size="9.5" fill="#446688" filter="url(#rough2)">是</text>

  <rect x="76" y="328" width="348" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="341" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">⑦ lo = max(p_{k−1}, l+k²+k−1)，hi = p_k − 1</text>
  <text x="250" y="355" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">⑧ hi ≥ lo ⇒ ans += hi − lo + 1</text>

  <!-- k++ 回边 -->
  <path d="M 76 344 H 44 V 286 H 116" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="54" y="336" font-size="9" fill="#d6a040" filter="url(#rough2)">k++</text>
  <text x="28" y="272" font-size="8.5" fill="#d6a040" filter="url(#rough2)">回到⑥</text>

  <!-- 否：下一个 l -->
  <path d="M 398 286 H 448 V 90 H 424" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="404" y="278" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">否</text>
  <text x="446" y="82" font-size="9" fill="#8a6d3b" filter="url(#rough2)">l++</text>

  <!-- 返回 -->
  <path d="M 260 366 V 388" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="268" y="382" font-size="9" fill="#888" filter="url(#rough2)">l 用完</text>

  <rect x="160" y="392" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="412" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑨ return ans</text>

  <rect x="40" y="434" width="440" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="450" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 别用滑动窗口：r 越过 0 时阈值 zeros² 跳变，合法性对 r 不单调</text>
  <text x="260" y="466" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">哨兵 n 统一「右侧 0 不足」与「末段右界」两种边界，zeros[j+k] 永不越界</text>
</svg>
