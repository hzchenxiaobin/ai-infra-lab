<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：前缀和相同 → 中间段和为零</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">链表累加前缀和，两处前缀和相同则中间段和为零</text>

  <!-- ===== 初始链表（标注前缀和） ===== -->
  <text x="20" y="68" font-size="11" fill="#444" font-weight="bold">初始链表（前缀和标注于节点下方）</text>
  <g font-size="13">
    <rect x="36" y="76" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="61" y="96" text-anchor="middle" fill="#8a6a20" font-size="9" font-weight="bold">dummy</text>
    <rect x="94" y="76" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="119" y="96" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="152" y="76" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="177" y="96" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="210" y="76" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="235" y="96" text-anchor="middle" fill="#b85450" font-weight="bold">−3</text>
    <rect x="268" y="76" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="293" y="96" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <rect x="326" y="76" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="351" y="96" text-anchor="middle" fill="#333" font-weight="bold">1</text>
  </g>

  <!-- arrows between nodes -->
  <g stroke="#446688" stroke-width="1.2" fill="none">
    <line x1="86" y1="92" x2="94" y2="92" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="144" y1="92" x2="152" y2="92" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="202" y1="92" x2="210" y2="92" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="260" y1="92" x2="268" y2="92" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="318" y1="92" x2="326" y2="92" marker-end="url(#arr)" filter="url(#rough2)"/>
  </g>

  <!-- prefix sums -->
  <g font-size="11" fill="#888">
    <text x="20" y="124" font-size="10" fill="#aaa">prefix:</text>
    <text x="61" y="124" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
    <text x="119" y="124" text-anchor="middle" fill="#555">1</text>
    <text x="177" y="124" text-anchor="middle" fill="#555">3</text>
    <text x="235" y="124" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
    <text x="293" y="124" text-anchor="middle" fill="#555">3</text>
    <text x="351" y="124" text-anchor="middle" fill="#555">4</text>
  </g>

  <!-- arc connecting prefix 0 at dummy and -3 -->
  <path d="M 61 130 Q 148 154 235 130" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="148" y="152" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">前缀和 0 相同 → [1,2,−3] 和为零</text>

  <!-- ===== 删去后 ===== -->
  <text x="20" y="184" font-size="11" fill="#444" font-weight="bold">删去后：dummy → 3 → 1</text>
  <g font-size="13">
    <rect x="100" y="192" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="125" y="212" text-anchor="middle" fill="#8a6a20" font-size="9" font-weight="bold">dummy</text>
    <rect x="158" y="192" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="183" y="212" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <rect x="216" y="192" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="241" y="212" text-anchor="middle" fill="#333" font-weight="bold">1</text>
  </g>
  <g stroke="#446688" stroke-width="1.2" fill="none">
    <line x1="150" y1="208" x2="158" y2="208" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="208" y1="208" x2="216" y2="208" marker-end="url(#arr)" filter="url(#rough2)"/>
  </g>
  <text x="276" y="212" font-size="10" fill="#888">→∅</text>

  <!-- ===== 核心洞察 ===== -->
  <rect x="20" y="240" width="540" height="128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="34" y="262" font-size="12" fill="#8a6a20" font-weight="bold">核心洞察</text>
  <text x="34" y="284" font-size="11" fill="#555">① 前缀和相同 ⟺ 中间段和为零（prefix[j] − prefix[i] = 0）</text>
  <text x="34" y="304" font-size="11" fill="#555">② 哑节点 prefix=0 → 统一处理从头开始的零和段（头删边界）</text>
  <text x="34" y="324" font-size="11" fill="#555">③ 存最后一次出现的节点 → 一次跳过最长零和段</text>
  <text x="34" y="344" font-size="11" fill="#555">④ 删去零和段后后续节点前缀和不变 → 两遍扫描完成全部删除</text>
  <text x="34" y="362" font-size="10" fill="#b85450" font-weight="bold">反复删去 = 多段零和 → 两遍扫描一次性处理（无需反复迭代）</text>
</svg>
