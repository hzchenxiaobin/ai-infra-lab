<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">递归下降解析：build(s) 流程</text>

  <!-- 入口 build(s) -->
  <rect x="200" y="46" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">build(s)</text>

  <path d="M 290 78 L 290 94" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判空 s == "" -->
  <polygon points="290,96 410,134 290,172 170,134" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="132" text-anchor="middle" font-size="12" fill="#333">s 为空?</text>
  <text x="290" y="150" text-anchor="middle" font-size="10" fill="#888">无内容可解析</text>

  <path d="M 410 134 L 470 134 L 470 78" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="428" y="126" font-size="10" fill="#b85450">是</text>
  <rect x="410" y="62" width="120" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="470" y="82" text-anchor="middle" font-size="12" fill="#888">返回 null</text>

  <path d="M 290 172 L 290 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="184" font-size="10" fill="#82b366">否</text>

  <!-- 解析根值 -->
  <rect x="150" y="192" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="290" y="214" text-anchor="middle" font-size="11" fill="#333">i = s.find('(')；rootVal = int(s[:i])；建 root</text>

  <path d="M 290 226 L 290 240" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判 i == -1 -->
  <polygon points="290,242 410,276 290,310 170,276" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="275" text-anchor="middle" font-size="12" fill="#333">无 '(' ?</text>
  <text x="290" y="292" text-anchor="middle" font-size="10" fill="#888">i == -1 即纯数字叶节点</text>

  <path d="M 410 276 L 470 276 L 470 220" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="428" y="268" font-size="10" fill="#b85450">是</text>
  <rect x="410" y="204" width="120" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="470" y="224" text-anchor="middle" font-size="12" fill="#888">返回 root</text>

  <path d="M 290 310 L 290 324" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="320" font-size="10" fill="#82b366">否</text>

  <!-- 配对括号定位 -->
  <rect x="120" y="326" width="340" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="348" text-anchor="middle" font-size="11" fill="#333">balance 计数找到匹配 ')' 的位置 j</text>

  <!-- 左右递归 -->
  <rect x="40" y="372" width="250" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="165" y="394" text-anchor="middle" font-size="11" fill="#333">root.left = build(s[i+1 : j])</text>

  <rect x="300" y="372" width="250" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="425" y="394" text-anchor="middle" font-size="11" fill="#333">若有第二组：root.right = build(...)</text>

  <text x="290" y="414" text-anchor="middle" font-size="10" fill="#888">子串剥离首尾括号后递归；单括号组必为左孩子</text>
</svg>
