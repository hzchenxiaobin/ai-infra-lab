<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">进阶解法：中序遍历拍平为升序数组 + 左右双指针</text>

  <!-- BST -->
  <text x="100" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">BST</text>
  <circle cx="100" cy="84" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="89" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5</text>

  <circle cx="65" cy="132" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="65" y="137" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <line x1="90" y1="96" x2="74" y2="120" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="140" cy="132" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="137" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">6</text>
  <line x1="113" y1="96" x2="131" y2="120" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="45" cy="184" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="45" y="189" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <line x1="58" y1="144" x2="48" y2="173" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>

  <circle cx="90" cy="184" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="189" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <line x1="73" y1="144" x2="84" y2="173" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>

  <circle cx="165" cy="184" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="165" y="189" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">7</text>
  <line x1="150" y1="144" x2="159" y2="173" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- 箭头到数组 -->
  <text x="220" y="130" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">中序</text>
  <path d="M 210 140 L 270 140" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 升序数组 -->
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">升序数组</text>
  <rect x="285" y="120" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="310" y="146" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>

  <rect x="335" y="120" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="360" y="146" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>

  <rect x="385" y="120" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="410" y="146" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4</text>

  <rect x="435" y="120" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="460" y="146" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">5</text>

  <rect x="485" y="120" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="510" y="146" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">6</text>

  <rect x="535" y="120" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="560" y="146" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">7</text>

  <!-- 双指针 L / R -->
  <path d="M 310 200 L 310 168" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="216" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">L</text>

  <path d="M 560 200 L 560 168" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="560" y="216" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">R</text>

  <!-- 决策 -->
  <rect x="40" y="240" width="540" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="60" y="262" font-size="12" fill="#555" font-weight="bold">双指针决策（k = 9，初始 L=2, R=7）：</text>
  <text x="60" y="284" font-size="11" fill="#555">• 和 = 9 == 9 → 命中，返回 true ⭐</text>
  <text x="60" y="304" font-size="11" fill="#555">• 和 &lt; k → L++（左端值太小，需要更大的数配对）</text>
  <text x="60" y="324" font-size="11" fill="#555">• 和 &gt; k → R−−（右端值太大，需要更小的数配对）</text>
  <text x="60" y="346" font-size="11" fill="#555">单调性保证：L++ 必增大和，R−− 必减小和，不会错过解。</text>
  <text x="60" y="362" font-size="11" fill="#d6a040" font-weight="bold">本质 = 167.两数之和II（有序数组）套一层中序遍历。</text>

  <!-- 对比 -->
  <rect x="40" y="390" width="540" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="60" y="412" font-size="12" fill="#b85450" font-weight="bold">两法对比：</text>
  <text x="60" y="432" font-size="11" fill="#555">哈希表法：O(n) 时间 / O(n) 空间，不依赖 BST 性质，适用任意树。</text>
  <text x="60" y="448" font-size="11" fill="#555">双指针法：O(n) 时间 / O(n) 空间（数组），利用 BST 升序性质，思路承接 167。</text>
</svg>
