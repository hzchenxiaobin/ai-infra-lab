<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8edb"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="440" fill="#fdfcf7"/>

  <text x="280" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">Dijkstra 状态机：三态 + 邻居检测</text>
  <path d="M 160 36 Q 280 44 400 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="60" y="80" width="120" height="50" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="120" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">THINKING</text>
  <text x="120" y="120" text-anchor="middle" font-size="9" fill="#5a5a5a">思考中（不持叉）</text>

  <g filter="url(#sk)"><rect x="220" y="80" width="120" height="50" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="280" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">HUNGRY</text>
  <text x="280" y="120" text-anchor="middle" font-size="9" fill="#5a5a5a">饿了，想吃（不持叉）</text>

  <g filter="url(#sk)"><rect x="380" y="80" width="120" height="50" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="440" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">EATING</text>
  <text x="440" y="120" text-anchor="middle" font-size="9" fill="#5a5a5a">进餐（持双叉）</text>

  <path d="M 180 100 L 218 100" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="190" y="92" font-size="9" fill="#5a5a5a">想吃了</text>

  <path d="M 340 100 L 378 100" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="348" y="92" font-size="9" fill="#4a8e4a" font-weight="bold">test 通过</text>

  <path d="M 440 130 Q 440 175 360 175 Q 280 175 280 130" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="300" y="168" font-size="10" fill="#4a8e4a" font-weight="bold">吃完 → 放叉 → 回到思考</text>

  <path d="M 280 130 Q 280 165 200 165 Q 120 165 120 130" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="135" y="158" font-size="9" fill="#b85450" font-weight="bold">邻居在吃 → 阻塞等待</text>

  <g filter="url(#sk)"><rect x="40" y="200" width="480" height="110" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/></g>
  <text x="56" y="222" font-size="13" font-weight="bold" fill="#444">test(i) 关键检测（互斥保护下执行）：</text>

  <g filter="url(#sk)"><rect x="56" y="234" width="456" height="62" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1"/></g>
  <text x="68" y="252" font-size="11" fill="#2b2b2b" font-family="'Comic Sans MS','Courier New',monospace">if state[i]==HUNGRY &amp;&amp; state[(i+4)%5]!=EATING</text>
  <text x="80" y="268" font-size="11" fill="#2b2b2b" font-family="'Comic Sans MS','Courier New',monospace">&amp;&amp; state[(i+1)%5]!=EATING:</text>
  <text x="92" y="284" font-size="11" fill="#2e6e2e" font-weight="bold" font-family="'Comic Sans MS','Courier New',monospace">state[i]=EATING;  cv[i].notify();</text>

  <g filter="url(#sk)"><rect x="60" y="330" width="440" height="96" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="76" y="352" font-size="12" font-weight="bold" fill="#2e6e2e">为何不死锁 / 不饿死：</text>
  <text x="76" y="370" font-size="10" fill="#444">① 互斥：EATING 时左右邻居必非 EATING（test 双向检测）→ 相邻不同吃</text>
  <text x="76" y="386" font-size="10" fill="#444">② 无占有等待：HUNGRY 态不持叉，只在 test 通过瞬间「原子」拿到双叉</text>
  <text x="76" y="402" font-size="10" fill="#444">③ 有限等待：放叉后立刻 test 两邻居 → 必唤醒可吃者，循环推进无饥饿</text>
  <text x="76" y="418" font-size="10" fill="#7a5415">★ 不相邻的哲学家可并行进餐（最多 ⌊n/2⌋ = 2 人同时吃）</text>
</svg>
