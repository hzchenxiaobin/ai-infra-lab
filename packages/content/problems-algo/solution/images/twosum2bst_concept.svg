<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两棵 BST + 哈希集合：一棵建表 values，另一棵查补数 target−v</text>

  <!-- ===== root1：遍历建表 ===== -->
  <text x="120" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">root1：遍历建表</text>
  <circle cx="120" cy="92" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="97" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>

  <circle cx="80" cy="150" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="155" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <line x1="108" y1="105" x2="90" y2="137" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="165" cy="150" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="165" y="155" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <line x1="134" y1="105" x2="155" y2="137" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- 箭头 root1 -> set -->
  <path d="M 200 130 L 250 130" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="225" y="122" text-anchor="middle" font-size="11" fill="#666">收集</text>

  <!-- ===== 哈希集合 values ===== -->
  <text x="320" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">values 集合</text>
  <rect x="262" y="72" width="116" height="116" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <rect x="274" y="84" width="92" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="320" y="101" text-anchor="middle" font-size="11" fill="#333">2</text>

  <rect x="274" y="114" width="92" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="320" y="131" text-anchor="middle" font-size="11" fill="#333">1</text>

  <rect x="274" y="144" width="92" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="320" y="161" text-anchor="middle" font-size="11" fill="#333">4</text>

  <!-- 箭头 set -> root2 -->
  <path d="M 390 130 L 440 130" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="415" y="122" text-anchor="middle" font-size="11" fill="#666">查补数</text>

  <!-- ===== root2：遍历查补数 ===== -->
  <text x="520" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">root2：遍历查补数</text>
  <circle cx="520" cy="92" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="520" y="97" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>

  <circle cx="478" cy="150" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="478" y="155" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <line x1="508" y1="105" x2="488" y2="137" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="568" cy="150" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="568" y="155" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <line x1="534" y1="105" x2="558" y2="137" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- 当前节点高亮 3 -->
  <circle cx="568" cy="150" r="18" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- 补数命中标注 -->
  <rect x="455" y="190" width="130" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="520" y="208" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">target−3 = 2 ∈ 集合 ✓</text>

  <!-- 说明 -->
  <rect x="40" y="244" width="560" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="60" y="268" font-size="12" fill="#555" font-weight="bold">核心直觉（承接 1.两数之和 / 653.两数之和IV）：</text>
  <text x="60" y="288" font-size="11" fill="#555">• 第一阶段：遍历 root1，把所有节点值存入哈希集合 values —— O(n)。</text>
  <text x="60" y="306" font-size="11" fill="#555">• 第二阶段：遍历 root2，对每个节点 v 查 (target − v) 是否在 values 中 —— O(m)。</text>
  <text x="60" y="324" font-size="11" fill="#555">两棵树各扫一遍，总 O(n+m)；不依赖 BST 有序性，任意两棵树都成立。</text>

  <!-- target 标注 -->
  <text x="320" y="380" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">target = 5：root1 的 2 + root2 的 3 = 5 → 返回 true</text>

  <!-- 复杂度 -->
  <rect x="40" y="400" width="560" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="320" y="422" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">时间 O(n+m)｜空间 O(n)｜两阶段各一遍遍历</text>
</svg>
