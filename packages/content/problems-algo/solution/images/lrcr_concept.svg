<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">替换次数 = 窗口长度 − 最大字母频次</text>

  <!-- window frame around a sample substring AABAB, k=1 -->
  <text x="60" y="74" font-size="11.5" fill="#888" font-weight="bold">窗口</text>
  <rect x="80" y="56" width="320" height="48" fill="none" stroke="#446688" stroke-width="2.2" rx="6" filter="url(#rough2)"/>

  <!-- letters A A B A B at x = 96,160,224,288,352 (cell width 64) -->
  <rect x="88" y="62" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="116" y="86" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">A</text>
  <rect x="152" y="62" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="180" y="86" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">A</text>
  <rect x="216" y="62" width="56" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="244" y="86" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">B</text>
  <rect x="280" y="62" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="308" y="86" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">A</text>
  <rect x="344" y="62" width="56" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="372" y="86" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">B</text>

  <!-- left / right pointers -->
  <text x="116" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">↑ left</text>
  <text x="372" y="124" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">↑ right</text>
  <text x="260" y="124" text-anchor="middle" font-size="11" fill="#888">窗口长度 = 5</text>

  <!-- count box -->
  <rect x="60" y="146" width="400" height="58" fill="#f0f0f0" stroke="#888" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="80" y="168" font-size="12" fill="#333" font-weight="bold">频次统计：A = 3，B = 2</text>
  <text x="80" y="190" font-size="12" fill="#333">最大频次 maxFreq = 3（保留 A，3 个不用换）</text>

  <!-- formula row -->
  <rect x="40" y="218" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">需替换 = 5 − 3 = 2 个（B → A）</text>
  <text x="260" y="260" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2 &gt; k=1 ✗ 非法 → 收缩 left</text>

  <!-- validity conclusion -->
  <rect x="40" y="288" width="440" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="310" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">合法 ⟺ (窗口长度 − maxFreq) ≤ k</text>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#446688">窗口越长越好，右端扩张、非法时左端右移</text>
</svg>
