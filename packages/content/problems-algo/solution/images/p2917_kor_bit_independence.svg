<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：位独立 —— 每个二进制位是一个独立的计数子问题</text>

  <!-- 表头 -->
  <text x="46" y="60" font-size="12" fill="#4a7a3a" filter="url(#rough2)">nums</text>
  <text x="132" y="60" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">bit 3</text>
  <text x="184" y="60" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">bit 2</text>
  <text x="236" y="60" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">bit 1</text>
  <text x="288" y="60" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">bit 0</text>

  <!-- 行标签：元素值 -->
  <text x="68" y="87" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="68" y="113" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">12</text>
  <text x="68" y="139" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">9</text>
  <text x="68" y="165" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="68" y="191" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">9</text>
  <text x="68" y="217" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">15</text>

  <!-- 数据格子：bit3 列（点亮，绿） -->
  <rect x="112" y="70" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="132" y="88" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <rect x="112" y="96" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="132" y="114" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="112" y="122" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="132" y="140" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="112" y="148" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="132" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="112" y="174" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="132" y="192" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="112" y="200" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="132" y="218" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 数据格子：bit2 列（未达标，灰） -->
  <rect x="164" y="70" width="40" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="88" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="164" y="96" width="40" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="114" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="164" y="122" width="40" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="140" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <rect x="164" y="148" width="40" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="166" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <rect x="164" y="174" width="40" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="192" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <rect x="164" y="200" width="40" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="218" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 数据格子：bit1 列（未达标，灰） -->
  <rect x="216" y="70" width="40" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="236" y="88" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="216" y="96" width="40" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="236" y="114" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <rect x="216" y="122" width="40" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="236" y="140" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <rect x="216" y="148" width="40" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="236" y="166" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <rect x="216" y="174" width="40" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="236" y="192" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <rect x="216" y="200" width="40" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="236" y="218" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 数据格子：bit0 列（点亮，绿） -->
  <rect x="268" y="70" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="288" y="88" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="268" y="96" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="288" y="114" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <rect x="268" y="122" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="288" y="140" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="268" y="148" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="288" y="166" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <rect x="268" y="174" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="288" y="192" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="268" y="200" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="288" y="218" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- cnt 行 -->
  <text x="68" y="251" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">cnt</text>
  <text x="132" y="251" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="184" y="251" text-anchor="middle" font-size="13" fill="#888" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="236" y="251" text-anchor="middle" font-size="13" fill="#888" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="288" y="251" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- 结果位行 -->
  <text x="68" y="283" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">K-or</text>
  <rect x="112" y="264" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="132" y="282" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1 ✓</text>
  <rect x="164" y="264" width="40" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="282" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">0</text>
  <rect x="216" y="264" width="40" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="236" y="282" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">0</text>
  <rect x="268" y="264" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="288" y="282" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1 ✓</text>

  <!-- 右侧说明框：位独立 -->
  <rect x="336" y="70" width="168" height="112" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="420" y="94" text-anchor="middle" font-size="11.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">位与位互不影响</text>
  <text x="420" y="114" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">一列 = 一个独立计数器</text>
  <text x="420" y="132" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">cnt = 该位为 1 的元素数</text>
  <text x="420" y="150" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">cnt ≥ k ⇒ 点亮该位</text>
  <text x="420" y="168" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">cnt &lt; k ⇒ 保持 0</text>

  <!-- 右侧说明框：结果 -->
  <rect x="336" y="210" width="168" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="420" y="236" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">只有 bit3、bit0 达标</text>
  <text x="420" y="256" text-anchor="middle" font-size="12.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">ans = 1001₂ = 9</text>
  <text x="420" y="276" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">（k = 4，示例 1）</text>
  <path d="M 308 277 L 334 258" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部：k 的三档语义 -->
  <text x="260" y="316" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">k 的三档语义（示例 3 即 k=1，示例 2 即 k=n）</text>

  <rect x="36" y="324" width="144" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="108" y="346" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">k = 1</text>
  <text x="108" y="364" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">至少 1 个元素该位为 1</text>
  <text x="108" y="380" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">⇒ 普通按位或 OR</text>

  <rect x="195" y="324" width="140" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="265" y="346" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">1 &lt; k &lt; n</text>
  <text x="265" y="364" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">至少 k 个元素该位为 1</text>
  <text x="265" y="380" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">⇒ K-or 阈值计数（本题）</text>

  <rect x="350" y="324" width="144" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="422" y="346" text-anchor="middle" font-size="12" fill="#33507a" font-weight="bold" filter="url(#rough2)">k = n</text>
  <text x="422" y="364" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">全部元素该位为 1</text>
  <text x="422" y="380" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">⇒ 普通按位与 AND</text>
</svg>
