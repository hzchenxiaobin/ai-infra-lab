<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>
  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：首处失配，二选一删（左 / 右），再线性扫剩余子串</text>

  <!-- Section 1: the matching phase -->
  <text x="40" y="62" font-size="12" fill="#446688" font-weight="bold">① 双指针逼近：相等就内推，直到首处失配</text>

  <rect x="60" y="78" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="100" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="104" y="78" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="100" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="148" y="78" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="100" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="192" y="78" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="100" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>

  <text x="82" y="64" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">left</text>
  <path d="M 82 66 L 82 74" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrL)" filter="url(#rough2)" transform="rotate(180 82 70)"/>
  <text x="214" y="64" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">right</text>
  <path d="M 214 66 L 214 74" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrL)" filter="url(#rough2)" transform="rotate(180 214 70)"/>

  <text x="126" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a">已匹配 a=a</text>
  <text x="170" y="124" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">失配 b≠c ★</text>

  <!-- divider -->
  <path d="M 40 138 L 500 138" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- Section 2: delete left -->
  <text x="40" y="164" font-size="12" fill="#4a7a3a" font-weight="bold">② 删左：跳过 s[left]，判定 s[left+1 .. right]</text>

  <rect x="60" y="180" width="44" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="201" text-anchor="middle" font-size="12" fill="#bbb">a</text>
  <text x="82" y="172" text-anchor="middle" font-size="9" fill="#bbb">删</text>
  <rect x="104" y="180" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="126" y="201" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="148" y="180" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="201" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="192" y="180" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="214" y="201" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>

  <rect x="330" y="180" width="180" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">子串 "bca"→"ca"? 否</text>
  <text x="420" y="214" text-anchor="middle" font-size="10" fill="#555">isPalindrome(l+1, r) 线性扫</text>

  <!-- divider -->
  <path d="M 40 234 L 500 234" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- Section 3: delete right -->
  <text x="40" y="260" font-size="12" fill="#d6a040" font-weight="bold">③ 删右：跳过 s[right]，判定 s[left .. right−1]</text>

  <rect x="60" y="276" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="297" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="104" y="276" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="126" y="297" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="148" y="276" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="297" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="192" y="276" width="44" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="214" y="297" text-anchor="middle" font-size="12" fill="#bbb">a</text>
  <text x="214" y="268" text-anchor="middle" font-size="9" fill="#bbb">删</text>

  <rect x="330" y="276" width="180" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="294" text-anchor="middle" font-size="11" fill="#a07820" font-weight="bold">子串 "abc"→"ab"? 否</text>
  <text x="420" y="310" text-anchor="middle" font-size="10" fill="#555">isPalindrome(l, r−1) 线性扫</text>

  <!-- footer summary -->
  <rect x="40" y="328" width="460" height="116" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="352" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">判定口诀：首处失配 → 删左 OR 删右，任一成功即 true</text>
  <text x="270" y="372" text-anchor="middle" font-size="10.5" fill="#555">删除预算只有 1 次：分支后是零容错线性扫描，不再产生新分支</text>
  <text x="270" y="390" text-anchor="middle" font-size="10.5" fill="#555">两种删法结果可能不同（如 "cuppucu" 只删右成功），故必须都试</text>
  <text x="270" y="408" text-anchor="middle" font-size="10.5" fill="#555">主循环 n/2 步 + 两次子串扫描各 ≤ n/2，合计 ≤ 2n → O(n)</text>
  <text x="270" y="426" text-anchor="middle" font-size="10" fill="#888">短路求值：删左成功则不调删右，平均更快</text>
</svg>
