<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="17" font-weight="bold"
        fill="#333" filter="url(#rough2)">算法流程：求高 → 建矩阵 → DFS 区间二分放置</text>

  <!-- 左侧主链 -->
  <rect x="40" y="50" width="170" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="125" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">开始</text>
  <line x1="125" y1="84" x2="125" y2="100" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="102" width="170" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="125" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">h = height(root)</text>
  <text x="125" y="136" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">后序 DFS，空节点返回 -1</text>
  <line x1="125" y1="148" x2="125" y2="164" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="166" width="170" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="125" y="184" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">m = h+1, n = 2^(h+1)−1</text>
  <text x="125" y="200" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">行数 m，列数 n</text>
  <line x1="125" y1="212" x2="125" y2="228" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="230" width="170" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="125" y="255" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">res = m×n 空串矩阵</text>
  <line x1="125" y1="270" x2="125" y2="286" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="288" width="170" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="125" y="313" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">dfs(root, 0, 0, n−1)</text>
  <line x1="125" y1="328" x2="125" y2="344" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="346" width="170" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="125" y="371" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 res</text>
  <line x1="125" y1="386" x2="125" y2="402" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="404" width="170" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="125" y="426" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">结束</text>

  <!-- 从 dfs 调用指向右侧递归详情 -->
  <line x1="210" y1="308" x2="270" y2="308" stroke="#b85450" stroke-width="1.6"
        stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="302" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">展开</text>

  <!-- 右侧 dfs 容器 -->
  <rect x="270" y="60" width="250" height="380" rx="10" fill="none" stroke="#446688"
        stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="395" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">dfs(node, row, lo, hi)</text>

  <!-- 判空菱形 -->
  <polygon points="395,110 470,150 395,190 320,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="395" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">node == null?</text>
  <text x="395" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)"></text>
  <!-- yes 分支 -->
  <line x1="470" y1="150" x2="492" y2="150" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="480" y="144" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="492" y="136" width="44" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="514" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">return</text>

  <!-- no 分支向下 -->
  <line x1="395" y1="190" x2="395" y2="208" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="406" y="202" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="320" y="210" width="150" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="395" y="232" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">mid = (lo + hi) / 2</text>
  <line x1="395" y1="244" x2="395" y2="258" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="320" y="260" width="150" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="395" y="282" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">res[row][mid] = str(val)</text>
  <line x1="395" y1="294" x2="395" y2="308" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="320" y="310" width="150" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="395" y="328" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dfs(left, row+1,</text>
  <text x="395" y="342" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">lo, mid−1)</text>
  <line x1="395" y1="350" x2="395" y2="364" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="320" y="366" width="150" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="395" y="384" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dfs(right, row+1,</text>
  <text x="395" y="398" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">mid+1, hi)</text>
  <line x1="395" y1="406" x2="395" y2="420" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="350" y="422" width="90" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="395" y="440" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">return</text>
</svg>
