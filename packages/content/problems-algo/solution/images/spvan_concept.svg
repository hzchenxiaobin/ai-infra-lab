<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">为什么状态要带上「已访问位掩码」？</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">同一个节点 0，不同已访问集合 = 不同状态</text>

  <!-- ===== Left: small graph (star) ===== -->
  <text x="110" y="74" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">图结构（示例 1）</text>

  <!-- edges -->
  <line x1="110" y1="180" x2="60" y2="120" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="110" y1="180" x2="160" y2="120" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="110" y1="180" x2="110" y2="250" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- node 0 (center) -->
  <circle cx="110" cy="180" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="185" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <!-- node 1 -->
  <circle cx="60" cy="120" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <!-- node 2 -->
  <circle cx="160" cy="120" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <!-- node 3 -->
  <circle cx="110" cy="250" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="255" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <!-- ===== Right: two states both at node 0 ===== -->
  <text x="370" y="74" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">两次到达节点 0 —— 不同状态</text>

  <!-- State A: (0, {0,1}) -->
  <rect x="300" y="92" width="220" height="78" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="410" y="112" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">状态 A：站在 0，已访 {0,1}</text>
  <!-- mask bits A -->
  <rect x="328" y="124" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345" y="144" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="366" y="124" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="383" y="144" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="404" y="124" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="421" y="144" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="442" y="124" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="459" y="144" text-anchor="middle" font-size="13" fill="#999">0</text>
  <text x="410" y="162" text-anchor="middle" font-size="10" fill="#666">mask=0011，还需访 2、3</text>

  <!-- State B: (0, {0,1,2}) -->
  <rect x="300" y="190" width="220" height="78" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="410" y="210" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">状态 B：站在 0，已访 {0,1,2}</text>
  <!-- mask bits B -->
  <rect x="328" y="222" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345" y="242" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="366" y="222" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="383" y="242" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="404" y="222" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="421" y="242" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="442" y="222" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="459" y="242" text-anchor="middle" font-size="13" fill="#999">0</text>
  <text x="410" y="260" text-anchor="middle" font-size="10" fill="#666">mask=0111，只需访 3</text>

  <!-- bit labels under state A -->
  <text x="345" y="178" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="383" y="178" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="421" y="178" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="459" y="178" text-anchor="middle" font-size="9" fill="#888">3</text>

  <!-- ===== Bottom takeaway ===== -->
  <rect x="40" y="290" width="480" height="70" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">普通 BFS 只记「0 已访问」→ 会把两个状态合并成一个</text>
  <text x="280" y="334" text-anchor="middle" font-size="12" fill="#444">状态 = (当前节点 u, 已访问位掩码 mask)，二者缺一不可</text>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#666">n ≤ 12 → 2^n 种 mask，状态空间 n·2^n 可承受</text>

  <!-- arrows from node 0 to two states -->
  <path d="M 132 178 Q 220 150 298 131" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 132 188 Q 220 210 298 229" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
