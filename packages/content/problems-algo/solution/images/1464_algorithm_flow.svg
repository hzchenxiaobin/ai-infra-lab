<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：一趟遍历维护 max1（最大）与 max2（次大）</text>

  <!-- Start -->
  <ellipse cx="200" cy="54" rx="42" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="58" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <path d="M 200 70 L 200 82" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box1: init max1=max2=-inf, i=0 -->
  <rect x="80" y="84" width="240" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="106" text-anchor="middle" font-size="11.5" fill="#333">max1 = −∞；max2 = −∞；i = 0</text>

  <path d="M 200 118 L 200 130" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: i < n ? -->
  <polygon points="200,132 280,166 200,200 120,166" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="170" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>

  <!-- No branch right -->
  <path d="M 280 166 L 360 166" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="160" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- return box -->
  <rect x="360" y="150" width="160" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440" y="172" text-anchor="middle" font-size="11" fill="#333">返回 (max1−1)(max2−1)</text>

  <!-- Yes branch down -->
  <path d="M 200 200 L 200 214" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="210" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Diamond: nums[i] > max1 ? -->
  <polygon points="200,216 300,256 200,296 100,256" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="254" text-anchor="middle" font-size="11.5" fill="#333">nums[i] &gt; max1 ?</text>
  <text x="200" y="270" text-anchor="middle" font-size="10" fill="#888">新最大出现</text>

  <!-- Yes: max2=max1; max1=nums[i] -->
  <path d="M 300 256 L 340 256" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="250" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="340" y="240" width="200" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="262" text-anchor="middle" font-size="11" fill="#333">max2 = max1；max1 = nums[i]</text>

  <!-- No: Diamond nums[i] > max2 ? -->
  <path d="M 100 256 L 60 256" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="64" y="250" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <polygon points="200,300 270,332 200,364 130,332" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="336" text-anchor="middle" font-size="11" fill="#333">nums[i] &gt; max2 ?</text>

  <!-- Yes: max2=nums[i] -->
  <path d="M 130 332 L 100 332" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="104" y="326" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="20" y="316" width="80" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="336" text-anchor="middle" font-size="10.5" fill="#333">max2=nums[i]</text>

  <!-- No: skip -->
  <path d="M 200 364 L 200 380" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="376" font-size="10.5" fill="#888">否，跳过</text>

  <!-- merge to i++ -->
  <rect x="150" y="388" width="100" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="406" text-anchor="middle" font-size="11.5" fill="#333">i += 1</text>

  <!-- loop back lines -->
  <path d="M 440 274 L 440 430 L 250 430 L 250 166" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 60 348 L 60 430 L 150 430" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 200 416 L 200 430" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="380" y="424" font-size="10" fill="#4a7a3a">回到判断 i &lt; n</text>

  <!-- footer note -->
  <rect x="50" y="440" width="460" height="16" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="452" text-anchor="middle" font-size="10.5" fill="#555">每个元素最多更新一次 max1 或 max2，总 O(n)、额外 O(1)</text>
</svg>
