<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：反向倒推全过程</text>

  <!-- ====== Example 2: target=19, maxDoubles=2 ====== -->
  <text x="40" y="58" font-size="13" fill="#446688" font-weight="bold">示例 2：target = 19, maxDoubles = 2 → 答案 7</text>

  <!-- chain: 19 -> 18 -> 9 -> 8 -> 4 -> (+=3) -> 7 -->
  <!-- node 19 (odd, highlight) -->
  <rect x="40" y="74" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="63" y="96" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">19</text>

  <!-- arrow 19->18 : odd -1 -->
  <path d="M 86 91 L 104 91" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="95" y="84" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">奇</text>
  <text x="95" y="116" text-anchor="middle" font-size="10" fill="#b85450">−1</text>

  <!-- node 18 (even) -->
  <rect x="106" y="74" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="129" y="96" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">18</text>

  <!-- arrow 18->9 : even ÷2, d:2->1 -->
  <path d="M 152 91 L 170 91" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="161" y="84" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">偶</text>
  <text x="161" y="116" text-anchor="middle" font-size="9" fill="#446688">÷2 d=1</text>

  <!-- node 9 (odd) -->
  <rect x="172" y="74" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="195" y="96" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">9</text>

  <!-- arrow 9->8 : odd -1 -->
  <path d="M 218 91 L 236 91" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="227" y="84" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">奇</text>
  <text x="227" y="116" text-anchor="middle" font-size="10" fill="#b85450">−1</text>

  <!-- node 8 (even) -->
  <rect x="238" y="74" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="261" y="96" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">8</text>

  <!-- arrow 8->4 : even ÷2, d:1->0 -->
  <path d="M 284 91 L 302 91" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="293" y="84" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">偶</text>
  <text x="293" y="116" text-anchor="middle" font-size="9" fill="#446688">÷2 d=0</text>

  <!-- node 4 -->
  <rect x="304" y="74" width="46" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="327" y="96" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>

  <!-- doubles exhausted: += 4-1 = 3 -->
  <path d="M 350 91 L 378 91" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="364" y="84" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">d 用尽</text>
  <text x="364" y="116" text-anchor="middle" font-size="9" fill="#888">+= 4−1</text>

  <!-- result box -->
  <rect x="380" y="74" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="420" y="90" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">moves</text>
  <text x="420" y="104" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">= 4 + 3 = 7</text>

  <!-- step counter annotation -->
  <text x="63" y="138" text-anchor="middle" font-size="9" fill="#888">m=1</text>
  <text x="129" y="138" text-anchor="middle" font-size="9" fill="#888">m=2</text>
  <text x="195" y="138" text-anchor="middle" font-size="9" fill="#888">m=3</text>
  <text x="261" y="138" text-anchor="middle" font-size="9" fill="#888">m=4</text>
  <text x="327" y="138" text-anchor="middle" font-size="9" fill="#888">退出</text>

  <!-- forward path verification (small) -->
  <text x="40" y="166" font-size="11" fill="#666">正向验证：1→2→3→4(×2)→8(+1)→9(×2)→18(+1)→19，3 个 +1 + 2 个 ×2 = 7 步 ✓</text>

  <!-- ====== Example 3: target=10, maxDoubles=4 ====== -->
  <text x="40" y="208" font-size="13" fill="#446688" font-weight="bold">示例 3：target = 10, maxDoubles = 4 → 答案 4</text>

  <!-- chain: 10 -> 5 -> 4 -> 2 -> 1 = 4 -->
  <rect x="40" y="224" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="63" y="246" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">10</text>

  <path d="M 86 241 L 104 241" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="95" y="234" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">偶</text>
  <text x="95" y="266" text-anchor="middle" font-size="9" fill="#446688">÷2 d=3</text>

  <rect x="106" y="224" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="129" y="246" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>

  <path d="M 152 241 L 170 241" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="161" y="234" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">奇</text>
  <text x="161" y="266" text-anchor="middle" font-size="10" fill="#b85450">−1</text>

  <rect x="172" y="224" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="195" y="246" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>

  <path d="M 218 241 L 236 241" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="227" y="234" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">偶</text>
  <text x="227" y="266" text-anchor="middle" font-size="9" fill="#446688">÷2 d=2</text>

  <rect x="238" y="224" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="261" y="246" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <path d="M 284 241 L 302 241" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="293" y="234" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">偶</text>
  <text x="293" y="266" text-anchor="middle" font-size="9" fill="#446688">÷2 d=1</text>

  <rect x="304" y="224" width="46" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="327" y="246" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <path d="M 350 241 L 378 241" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="364" y="234" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">到 1</text>
  <text x="364" y="266" text-anchor="middle" font-size="9" fill="#888">+= 0</text>

  <rect x="380" y="224" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="420" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">moves</text>
  <text x="420" y="254" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">= 4</text>

  <text x="63" y="288" text-anchor="middle" font-size="9" fill="#888">m=1</text>
  <text x="129" y="288" text-anchor="middle" font-size="9" fill="#888">m=2</text>
  <text x="195" y="288" text-anchor="middle" font-size="9" fill="#888">m=3</text>
  <text x="261" y="288" text-anchor="middle" font-size="9" fill="#888">m=4</text>
  <text x="327" y="288" text-anchor="middle" font-size="9" fill="#888">退出</text>

  <!-- ====== Example 1: target=5, maxDoubles=0 ====== -->
  <text x="40" y="324" font-size="13" fill="#446688" font-weight="bold">示例 1：target = 5, maxDoubles = 0 → 答案 4</text>
  <rect x="40" y="340" width="460" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.7"/>
  <text x="270" y="360" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">doubles = 0 → 循环不执行 → moves += target − 1 = 5 − 1 = 4</text>

  <!-- ====== Bottom insight ====== -->
  <rect x="24" y="384" width="512" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="404" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">每个 ÷2 至多前置一次 −1（奇数−1 必变偶），故循环步数 ≤ 2 × maxDoubles</text>
  <text x="280" y="422" text-anchor="middle" font-size="11" fill="#888">maxDoubles ≤ 100 → 循环至多 200 步，常数级；末尾一次性 += target−1 是 O(1)</text>
</svg>
