<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">算法流程：new Promise 内调度，拒绝也走收集链</text>

  <!-- Step 1: return new Promise(resolve) -->
  <rect x="160" y="44" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">① return new Promise(resolve =&gt; {…})</text>
  <text x="420" y="68" font-size="9" fill="#888">无 reject，永不短路</text>

  <path d="M 280 84 L 280 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: init results + count -->
  <rect x="160" y="104" width="240" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="122" text-anchor="middle" font-size="10" fill="#333">② const results = new Array(n)</text>
  <text x="280" y="138" text-anchor="middle" font-size="10" fill="#333">let count = 0; n = functions.length</text>

  <path d="M 280 150 L 280 166" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: sync loop (decision diamond) -->
  <polygon points="280,170 360,210 280,250 200,210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="208" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">i &lt; n ?</text>
  <text x="280" y="222" text-anchor="middle" font-size="9" fill="#888">同步循环，无 await</text>

  <!-- Yes branch (down) -->
  <text x="290" y="266" font-size="9" fill="#4a7a3a">是</text>
  <path d="M 280 250 L 280 276" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <!-- Step 4: fire functions[i]().then(onF, onR) -->
  <rect x="120" y="280" width="320" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">④ functions[i]().then(onFulfilled, onRejected)</text>
  <text x="280" y="314" text-anchor="middle" font-size="9" fill="#888">立即调用 fn()，返回 pending promise，并发计时开始</text>
  <text x="280" y="326" text-anchor="middle" font-size="9" fill="#888">let i 闭包捕获下标</text>

  <!-- loop back arrow to diamond -->
  <path d="M 440 305 L 470 305 L 470 210 L 360 210" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="478" y="258" font-size="9" fill="#4a7a3a">下一个 i</text>

  <!-- No branch (right, to step 5/wait) -->
  <text x="370" y="206" font-size="9" fill="#b85450">否（循环结束）</text>
  <path d="M 360 210 L 410 210 L 410 360 L 280 360" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- Step 5: wait for all to settle -->
  <rect x="120" y="356" width="320" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="377" text-anchor="middle" font-size="10" fill="#333">⑤ 等待：每个 promise 异步定型，触发回调</text>

  <path d="M 280 392 L 280 408" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6: two branches inside callback -->
  <text x="60" y="430" font-size="10" fill="#888">回调内</text>
  <!-- onFulfilled (green) -->
  <rect x="60" y="414" width="190" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="155" y="431" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">onFulfilled(v)</text>
  <text x="155" y="445" text-anchor="middle" font-size="9" fill="#333">results[i] = v</text>

  <!-- onRejected (red) - ALSO lands! -->
  <rect x="310" y="414" width="190" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="405" y="431" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">onRejected(r)</text>
  <text x="405" y="445" text-anchor="middle" font-size="9" fill="#333">results[i] = r  ← 也落位</text>

  <!-- both converge to count check -->
  <path d="M 155 454 L 155 470 L 280 470" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 405 454 L 405 470 L 280 470" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- Step 7: count check -->
  <polygon points="280,474 350,500 280,526 210,500" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="503" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">++count == n ?</text>

  <text x="290" y="540" font-size="9" fill="#4a7a3a">是</text>
  <path d="M 280 526 L 280 540" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <rect x="180" y="542" width="200" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="552" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">resolve(results) ✓</text>
</svg>
