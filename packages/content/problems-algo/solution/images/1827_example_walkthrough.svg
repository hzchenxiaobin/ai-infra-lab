<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1, 5, 2, 4, 1]</text>

  <!-- Table header -->
  <rect x="40" y="48" width="520" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="100" y1="48" x2="100" y2="78" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="170" y1="48" x2="170" y2="78" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="300" y1="48" x2="300" y2="78" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="400" y1="48" x2="400" y2="78" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <text x="135" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">比较</text>
  <text x="235" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">本轮 ops</text>
  <text x="350" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">累计 ops</text>
  <text x="470" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">调整后数组</text>

  <!-- Row 0: i=0 -->
  <rect x="40" y="80" width="520" height="32" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="100" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="135" y="100" text-anchor="middle" font-size="10" fill="#888">—（锚定）</text>
  <text x="235" y="100" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="350" y="100" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="470" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[1, 5, 2, 4, 1]</text>

  <!-- Row 1: i=1, 5 > 1 ok -->
  <rect x="40" y="114" width="520" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="134" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="135" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a">5 &gt; 1 ✓</text>
  <text x="235" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a">0</text>
  <text x="350" y="134" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="470" y="134" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[1, 5, 2, 4, 1]</text>

  <!-- Row 2: i=2, 2 <= 5, ops=4 -->
  <rect x="40" y="148" width="520" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="168" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="135" y="168" text-anchor="middle" font-size="10" fill="#b85450">2 ≤ 5 ✗</text>
  <text x="235" y="168" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5+1−2 = 4</text>
  <text x="350" y="168" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="470" y="168" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[1, 5, 6, 4, 1]</text>

  <!-- Row 3: i=3, 4 <= 6, ops=3 -->
  <rect x="40" y="182" width="520" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="202" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="135" y="202" text-anchor="middle" font-size="10" fill="#b85450">4 ≤ 6 ✗</text>
  <text x="235" y="202" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6+1−4 = 3</text>
  <text x="350" y="202" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">7</text>
  <text x="470" y="202" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[1, 5, 6, 7, 1]</text>

  <!-- Row 4: i=4, 1 <= 7, ops=7 -->
  <rect x="40" y="216" width="520" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="236" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="135" y="236" text-anchor="middle" font-size="10" fill="#b85450">1 ≤ 7 ✗</text>
  <text x="235" y="236" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">7+1−1 = 7</text>
  <text x="350" y="236" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">14</text>
  <text x="470" y="236" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[1, 5, 6, 7, 8]</text>

  <!-- Result box -->
  <rect x="120" y="268" width="360" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="293" font-size="11" fill="#555">最终结果：</text>
  <text x="220" y="294" font-size="14" fill="#4a7a3a" font-weight="bold">总操作次数 = 0+0+4+3+7 = 14</text>

  <!-- Array transformation visualization -->
  <text x="300" y="332" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">数组变化可视化</text>

  <!-- Original array -->
  <text x="50" y="362" font-size="11" fill="#888">原数组：</text>
  <rect x="110" y="348" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="368" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="165" y="348" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="368" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="220" y="348" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="368" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <rect x="275" y="348" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="368" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>
  <rect x="330" y="348" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="368" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>

  <!-- Arrow down -->
  <path d="M 300 384 L 300 398" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="395" font-size="10" fill="#888">+14 次</text>

  <!-- Final array -->
  <text x="50" y="425" font-size="11" fill="#888">最终：</text>
  <rect x="110" y="411" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="431" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="165" y="411" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="431" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">5</text>
  <rect x="220" y="411" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="431" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">6</text>
  <rect x="275" y="411" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="431" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">7</text>
  <rect x="330" y="411" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="431" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">8</text>

  <text x="300" y="452" text-anchor="middle" font-size="10" fill="#888">红 = 需抬升的位置；绿 = 调整后严格递增</text>
</svg>
