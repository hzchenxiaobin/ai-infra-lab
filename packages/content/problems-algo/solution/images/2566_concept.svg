<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：贪心 — 最高位优先，目标取极值（max→9，min→0）</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888">从左扫第一个能改的位改到极值；同一数字全部联动替换，低位只赚不亏</text>

  <!-- original number row -->
  <text x="40" y="86" font-size="12" fill="#555" font-weight="bold">num</text>
  <rect x="199" y="64" width="42" height="42" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="220" y="91" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="249" y="64" width="42" height="42" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="270" y="91" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="299" y="64" width="42" height="42" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="320" y="91" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">8</text>
  <rect x="349" y="64" width="42" height="42" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="370" y="91" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">9</text>
  <rect x="399" y="64" width="42" height="42" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="420" y="91" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>

  <!-- MAX branch -->
  <text x="40" y="160" font-size="12" fill="#446688" font-weight="bold">最大值</text>
  <text x="40" y="176" font-size="10" fill="#446688">扫到第一个 ≠ '9'</text>
  <text x="220" y="128" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑ 首 个 非 9 = '1'</text>
  <path d="M 220 132 L 220 146" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="199" y="150" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="177" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">9</text>
  <rect x="249" y="150" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="177" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">9</text>
  <rect x="299" y="150" width="42" height="42" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="320" y="177" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">8</text>
  <rect x="349" y="150" width="42" height="42" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="370" y="177" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">9</text>
  <rect x="399" y="150" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="420" y="177" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">9</text>
  <text x="470" y="177" font-size="12" fill="#446688" font-weight="bold">= 99899</text>
  <text x="470" y="192" font-size="9" fill="#888">蓝框=被改动的 '1'</text>

  <!-- MIN branch -->
  <text x="40" y="246" font-size="12" fill="#4a7a3a" font-weight="bold">最小值</text>
  <text x="40" y="262" font-size="10" fill="#4a7a3a">扫到第一个 ≠ '0'</text>
  <text x="220" y="214" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑ 首 个 非 0 = '1'</text>
  <path d="M 220 218 L 220 232" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="199" y="236" width="42" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="263" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">0</text>
  <rect x="249" y="236" width="42" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="263" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">0</text>
  <rect x="299" y="236" width="42" height="42" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="320" y="263" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">8</text>
  <rect x="349" y="236" width="42" height="42" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="370" y="263" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">9</text>
  <rect x="399" y="236" width="42" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="420" y="263" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">0</text>
  <text x="470" y="263" font-size="12" fill="#4a7a3a" font-weight="bold">= 0890</text>
  <text x="470" y="278" font-size="9" fill="#888">前导 0 丢弃 → 890</text>

  <!-- key insight box -->
  <rect x="40" y="312" width="560" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="336" font-size="12" fill="#444" font-weight="bold">为什么「最高位优先」最优？</text>
  <text x="60" y="355" font-size="11" fill="#555">最高位的权值最大（10^(n-1)）。把它改到极值带来的增益，远大于任意低位改动。</text>
  <text x="60" y="373" font-size="11" fill="#555">故：max 找首个 &lt; 9 的位改 9；min 找首个 &gt; 0 的位改 0（输入无前导零 ⇒ 即首位）。</text>

  <!-- result -->
  <rect x="180" y="408" width="280" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="436" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">差值 = 99899 − 890 = 99009</text>
</svg>
