<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">种花问题算法流程（贪心 + 原地修改）</text>

  <g filter="url(#rough2)">
    <rect x="120" y="44" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="220" y="67" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">初始化 i = 0, count = 0</text>
  </g>
  <path d="M 220 80 L 220 102" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="220,104 290,140 220,176 150,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="220" y="136" text-anchor="middle" font-size="11" fill="#a07820" font-weight="bold">i &lt; n ?</text>
    <text x="220" y="150" text-anchor="middle" font-size="9" fill="#888">还有位置</text>
  </g>
  <path d="M 290 140 L 360 140" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="305" y="132" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="362" y="122" width="142" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="433" y="145" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 count ≥ n</text>
  </g>

  <path d="M 220 176 L 220 202" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="228" y="194" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)">
    <polygon points="220,206 332,250 220,294 108,250" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="220" y="244" text-anchor="middle" font-size="11" fill="#a07820" font-weight="bold">bed[i]==0</text>
    <text x="220" y="258" text-anchor="middle" font-size="11" fill="#a07820" font-weight="bold">且 左空 且 右空 ?</text>
  </g>

  <path d="M 220 294 L 220 316" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="228" y="312" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="70" y="318" width="230" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="185" y="338" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">种花：bed[i] = 1</text>
    <text x="185" y="354" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">count++; i += 2（跳过被堵的下一格）</text>
  </g>

  <path d="M 332 250 L 380 250" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="346" y="242" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="382" y="232" width="110" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
    <text x="437" y="255" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i += 1</text>
  </g>

  <path d="M 437 268 L 437 370 L 50 370 L 50 140 L 148 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <path d="M 70 340 L 50 340" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="58" y="364" font-size="9" fill="#888" filter="url(#rough2)">回到循环头</text>
</svg>
