<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="780" height="460" fill="#fdfcf7"/>

  <text x="390" y="34" text-anchor="middle" font-size="18" fill="#2b2b2b" font-weight="bold">LCS 归约：最小删除和 = 总 ASCII 和 − 2 × 最大公共子序列 ASCII 和</text>
  <path d="M 200 44 Q 390 52 580 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="390" y="58" text-anchor="middle" font-size="11" fill="#888">保留部分必为公共子序列；最小化删除和 ⇔ 最大化保留部分的 ASCII 和</text>

  <!-- s1 = "sea" -->
  <text x="60" y="110" font-size="13" fill="#2b2b2b" font-weight="bold">s1 = "sea"</text>
  <!-- s1 字符格子 -->
  <g filter="url(#sk)"><rect x="150" y="84" width="50" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="175" y="107" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">s</text>
  <text x="175" y="134" text-anchor="middle" font-size="10" fill="#888">115</text>
  <g filter="url(#sk)"><rect x="202" y="84" width="50" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="227" y="107" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">e</text>
  <text x="227" y="134" text-anchor="middle" font-size="10" fill="#888">101</text>
  <g filter="url(#sk)"><rect x="254" y="84" width="50" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="279" y="107" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">a</text>
  <text x="279" y="134" text-anchor="middle" font-size="10" fill="#888">97</text>
  <text x="316" y="107" font-size="11" fill="#444">Σ = 313</text>

  <!-- s2 = "eat" -->
  <text x="60" y="178" font-size="13" fill="#2b2b2b" font-weight="bold">s2 = "eat"</text>
  <g filter="url(#sk)"><rect x="150" y="152" width="50" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="175" y="175" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">e</text>
  <text x="175" y="202" text-anchor="middle" font-size="10" fill="#888">101</text>
  <g filter="url(#sk)"><rect x="202" y="152" width="50" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="227" y="175" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">a</text>
  <text x="227" y="202" text-anchor="middle" font-size="10" fill="#888">97</text>
  <g filter="url(#sk)"><rect x="254" y="152" width="50" height="34" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="279" y="175" text-anchor="middle" font-size="13" fill="#c98a2b" font-weight="bold">t</text>
  <text x="279" y="202" text-anchor="middle" font-size="10" fill="#888">116</text>
  <text x="316" y="175" font-size="11" fill="#444">Σ = 314</text>

  <!-- 绿色框圈出公共子序列 "ea" -->
  <g filter="url(#sk)">
    <rect x="196" y="78" width="112" height="114" rx="8" fill="none" stroke="#4a8e4a" stroke-width="1.6" stroke-dasharray="6,3"/>
  </g>
  <text x="252" y="226" text-anchor="middle" font-size="11" fill="#4a8e4a" font-weight="bold">最大 ASCII 公共子序列 "ea" = 198</text>

  <!-- 右侧公式区 -->
  <g filter="url(#sk)">
    <rect x="430" y="84" width="320" height="160" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3"/>
  </g>
  <text x="590" y="110" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">归约公式</text>
  <text x="450" y="138" font-size="12" fill="#444">总 ASCII 和 = sum(s1) + sum(s2)</text>
  <text x="470" y="156" font-size="11" fill="#888">= 313 + 314 = 627</text>
  <text x="450" y="184" font-size="12" fill="#444">保留部分（公共子序列）被算两次</text>
  <text x="470" y="202" font-size="11" fill="#888">删除和 = 总和 − 2 × maxAsciiCS</text>
  <text x="450" y="228" font-size="12" fill="#d6a040" font-weight="bold">answer = 627 − 2 × 198 = 231</text>

  <!-- 底部说明 -->
  <g filter="url(#sk)">
    <rect x="60" y="266" width="690" height="170" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5,3"/>
  </g>
  <text x="80" y="292" font-size="12" fill="#2b2b2b" font-weight="bold">与 583 / 1143 的对照（同构的二维 DP 家族）：</text>
  <text x="80" y="318" font-size="11" fill="#4a8e4a" font-weight="bold">1143 LCS</text>
  <text x="180" y="318" font-size="11" fill="#444">dp[i][j] = max LCS 长度（每对字符权重为 1）</text>
  <text x="80" y="342" font-size="11" fill="#4a8e4a" font-weight="bold">583 删除步数</text>
  <text x="180" y="342" font-size="11" fill="#444">answer = m + n − 2 × LCS（步数权重为 1）</text>
  <text x="80" y="366" font-size="11" fill="#b85450" font-weight="bold">712 ASCII 删除和</text>
  <text x="180" y="366" font-size="11" fill="#444">answer = sum(s1)+sum(s2) − 2 × maxAsciiCS（权重为字符 ASCII 值）</text>
  <text x="80" y="396" font-size="11" fill="#888">把 1143 的「长度」换成「ASCII 和」即得 712 的归约；把 583 的「字符数」换成「ASCII 值」即得 712 的直接 DP。</text>
  <text x="80" y="418" font-size="11" fill="#888">maxAsciiCS 的转移：匹配时 dp[i-1][j-1] + ord(c)；不匹配时 max(dp[i-1][j], dp[i][j-1])。</text>
</svg>
