<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：频次表对比判定</text>

  <!-- Example 1: match -->
  <rect x="30" y="40" width="580" height="186" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="50" y="62" font-size="12.5" fill="#4a7a3a" font-weight="bold">示例 1：target = [1,2,3,4]，arr = [2,4,1,3] → true ✓</text>

  <!-- target array -->
  <text x="50" y="84" font-size="11" fill="#555">target:</text>
  <rect x="100" y="70" width="34" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="117" y="88" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="134" y="70" width="34" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="151" y="88" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="168" y="70" width="34" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="185" y="88" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="202" y="70" width="34" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="219" y="88" text-anchor="middle" font-size="12" fill="#333">4</text>

  <!-- arr array -->
  <text x="50" y="116" font-size="11" fill="#555">arr:</text>
  <rect x="100" y="102" width="34" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="117" y="120" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="134" y="102" width="34" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="151" y="120" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="168" y="102" width="34" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="185" y="120" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="202" y="102" width="34" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="219" y="120" text-anchor="middle" font-size="12" fill="#333">3</text>

  <!-- freq table for ex1 -->
  <text x="300" y="84" font-size="11" fill="#555" font-weight="bold">频次表：</text>
  <!-- header -->
  <rect x="300" y="92" width="60" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="330" y="108" text-anchor="middle" font-size="11" fill="#333">值 v</text>
  <rect x="360" y="92" width="60" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="390" y="108" text-anchor="middle" font-size="11" fill="#333">target</text>
  <rect x="420" y="92" width="60" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="450" y="108" text-anchor="middle" font-size="11" fill="#333">arr</text>
  <rect x="480" y="92" width="70" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="515" y="108" text-anchor="middle" font-size="11" fill="#333">一致?</text>
  <!-- rows -->
  <rect x="300" y="116" width="60" height="22" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="330" y="132" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="360" y="116" width="60" height="22" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="390" y="132" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="420" y="116" width="60" height="22" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="450" y="132" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="480" y="116" width="70" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="515" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="300" y="140" width="60" height="22" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="330" y="156" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="360" y="140" width="60" height="22" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="390" y="156" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="420" y="140" width="60" height="22" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="450" y="156" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="480" y="140" width="70" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="515" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="300" y="164" width="60" height="22" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="330" y="180" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="360" y="164" width="60" height="22" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="390" y="180" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="420" y="164" width="60" height="22" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="450" y="180" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="480" y="164" width="70" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="515" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="300" y="188" width="60" height="22" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="330" y="204" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="360" y="188" width="60" height="22" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="390" y="204" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="420" y="188" width="60" height="22" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="450" y="204" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="480" y="188" width="70" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="515" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <text x="50" y="210" font-size="11.5" fill="#4a7a3a" font-weight="bold">所有值频次均一致 → 多重集相等 → true ✓</text>

  <!-- Example 3: mismatch -->
  <rect x="30" y="244" width="580" height="186" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="50" y="266" font-size="12.5" fill="#b85450" font-weight="bold">示例 3：target = [3,7,9]，arr = [3,7,11] → false ✗</text>

  <!-- target array -->
  <text x="50" y="288" font-size="11" fill="#555">target:</text>
  <rect x="100" y="274" width="34" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="117" y="292" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="134" y="274" width="34" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="151" y="292" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="168" y="274" width="34" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="185" y="292" text-anchor="middle" font-size="12" fill="#333">9</text>

  <!-- arr array -->
  <text x="50" y="320" font-size="11" fill="#555">arr:</text>
  <rect x="100" y="306" width="34" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="117" y="324" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="134" y="306" width="34" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="151" y="324" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="168" y="306" width="34" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="185" y="324" text-anchor="middle" font-size="12" fill="#333">11</text>

  <!-- freq table for ex3 -->
  <text x="300" y="288" font-size="11" fill="#555" font-weight="bold">频次表：</text>
  <rect x="300" y="296" width="60" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="330" y="312" text-anchor="middle" font-size="11" fill="#333">值 v</text>
  <rect x="360" y="296" width="60" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="390" y="312" text-anchor="middle" font-size="11" fill="#333">target</text>
  <rect x="420" y="296" width="60" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="450" y="312" text-anchor="middle" font-size="11" fill="#333">arr</text>
  <rect x="480" y="296" width="70" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="515" y="312" text-anchor="middle" font-size="11" fill="#333">一致?</text>

  <rect x="300" y="320" width="60" height="22" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="330" y="336" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="360" y="320" width="60" height="22" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="390" y="336" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="420" y="320" width="60" height="22" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="450" y="336" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="480" y="320" width="70" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="515" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="300" y="344" width="60" height="22" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="330" y="360" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="360" y="344" width="60" height="22" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="390" y="360" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="420" y="344" width="60" height="22" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="450" y="360" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="480" y="344" width="70" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="515" y="360" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="300" y="368" width="60" height="22" rx="4" fill="#fff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="384" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">9</text>
  <rect x="360" y="368" width="60" height="22" rx="4" fill="#fff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="384" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="420" y="368" width="60" height="22" rx="4" fill="#fff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450" y="384" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <rect x="480" y="368" width="70" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="515" y="384" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>

  <rect x="300" y="392" width="60" height="22" rx="4" fill="#fff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="408" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">11</text>
  <rect x="360" y="392" width="60" height="22" rx="4" fill="#fff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="408" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <rect x="420" y="392" width="60" height="22" rx="4" fill="#fff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450" y="408" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="480" y="392" width="70" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="515" y="408" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>

  <text x="50" y="414" font-size="11.5" fill="#b85450" font-weight="bold">值 9 与 11 频次不一致 → 多重集不等 → false ✗</text>

  <!-- bottom note -->
  <rect x="30" y="442" width="580" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="320" y="460" text-anchor="middle" font-size="11" fill="#444">结论：只比较频次，与元素顺序无关——频次全等即 true，否则 false</text>
</svg>
