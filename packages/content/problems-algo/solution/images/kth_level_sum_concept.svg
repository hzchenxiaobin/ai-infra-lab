<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：BFS 逐层求和 → 降序排序 → 取第 k 大</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">层和 = 同一层节点值之和；排序后下标 k−1 即第 k 大</text>

  <!-- ===== Tree (示例 1) ===== -->
  <g font-size="12">
    <!-- L1 root -->
    <circle cx="190" cy="86" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="190" y="92" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <!-- L2 -->
    <circle cx="135" cy="156" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="135" y="161" text-anchor="middle" fill="#446688" font-weight="bold">8</text>
    <circle cx="245" cy="156" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="245" y="161" text-anchor="middle" fill="#446688" font-weight="bold">9</text>
    <line x1="176" y1="100" x2="147" y2="142" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="204" y1="100" x2="233" y2="142" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <!-- L3 -->
    <circle cx="100" cy="226" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="100" y="231" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <circle cx="170" cy="226" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="170" y="231" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <circle cx="210" cy="226" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="210" y="231" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <circle cx="280" cy="226" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="280" y="231" text-anchor="middle" fill="#d6a040" font-weight="bold">7</text>
    <line x1="123" y1="170" x2="107" y2="212" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="147" y1="170" x2="163" y2="212" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="233" y1="170" x2="217" y2="212" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="257" y1="170" x2="273" y2="212" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <!-- L4 -->
    <circle cx="80" cy="296" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="80" y="301" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <circle cx="130" cy="296" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="130" y="301" text-anchor="middle" fill="#4a7a3a" font-weight="bold">6</text>
    <line x1="88" y1="240" x2="76" y2="282" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="112" y1="240" x2="124" y2="282" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  </g>

  <!-- ===== Right side: per-level sum ===== -->
  <text x="350" y="72" font-size="11" fill="#444" font-weight="bold">逐层求和（BFS 一层一算）</text>
  <g font-size="11">
    <!-- L1 -->
    <text x="350" y="92" font-size="10" fill="#b85450" font-weight="bold">L1</text>
    <rect x="375" y="80" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="395" y="96" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <text x="425" y="96" font-size="9" fill="#888">= 5</text>
    <!-- L2 -->
    <text x="350" y="162" font-size="10" fill="#446688" font-weight="bold">L2</text>
    <rect x="375" y="150" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="395" y="166" text-anchor="middle" fill="#446688" font-weight="bold">17</text>
    <text x="425" y="166" font-size="9" fill="#888">= 8+9</text>
    <!-- L3 -->
    <text x="350" y="232" font-size="10" fill="#d6a040" font-weight="bold">L3</text>
    <rect x="375" y="220" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="395" y="236" text-anchor="middle" fill="#d6a040" font-weight="bold">13</text>
    <text x="425" y="236" font-size="9" fill="#888">= 2+1+3+7</text>
    <!-- L4 -->
    <text x="350" y="302" font-size="10" fill="#4a7a3a" font-weight="bold">L4</text>
    <rect x="375" y="290" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="395" y="306" text-anchor="middle" fill="#4a7a3a" font-weight="bold">10</text>
    <text x="425" y="306" font-size="9" fill="#888">= 4+6</text>
  </g>

  <!-- ===== Bottom: sums list -> sort -> answer ===== -->
  <line x1="20" y1="330" x2="540" y2="330" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <text x="30" y="352" font-size="11" fill="#444" font-weight="bold">层和列表 sums</text>
  <g font-size="11">
    <rect x="30" y="360" width="46" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="53" y="378" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <rect x="80" y="360" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="103" y="378" text-anchor="middle" fill="#446688" font-weight="bold">17</text>
    <rect x="130" y="360" width="46" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="153" y="378" text-anchor="middle" fill="#d6a040" font-weight="bold">13</text>
    <rect x="180" y="360" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="203" y="378" text-anchor="middle" fill="#4a7a3a" font-weight="bold">10</text>
    <text x="234" y="378" font-size="9" fill="#888">BFS 收集到的原始顺序</text>
  </g>

  <!-- sort arrow -->
  <path d="M 145 392 L 145 410" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="160" y="406" font-size="10" fill="#666" font-weight="bold">降序排序</text>

  <g font-size="11">
    <rect x="30" y="418" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="53" y="436" text-anchor="middle" fill="#446688" font-weight="bold">17</text>
    <rect x="80" y="418" width="46" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="3" filter="url(#rough2)"/>
    <text x="103" y="436" text-anchor="middle" fill="#d6a040" font-weight="bold">13</text>
    <rect x="130" y="418" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="153" y="436" text-anchor="middle" fill="#4a7a3a" font-weight="bold">10</text>
    <rect x="180" y="418" width="46" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="203" y="436" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
  </g>

  <!-- k-th highlight -->
  <path d="M 103 446 L 103 456 L 300 456" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="300" y="446" width="170" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="385" y="461" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">k=2 → sums[k−1] = 13 ✓</text>
</svg>
