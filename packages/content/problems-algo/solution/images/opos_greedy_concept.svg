<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：贪心 — 当前段尽可能长，遇「本段已有字符」才被迫切割</text>

  <!-- String cells -->
  <text x="60" y="88" font-size="12" fill="#888">s =</text>
  <!-- seg1: a(0) b(1) blue -->
  <rect x="100" y="60" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="88" text-anchor="middle" font-size="18" fill="#333">a</text>
  <text x="122" y="120" text-anchor="middle" font-size="10" fill="#888">0</text>
  <rect x="144" y="60" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="166" y="88" text-anchor="middle" font-size="18" fill="#333">b</text>
  <text x="166" y="120" text-anchor="middle" font-size="10" fill="#888">1</text>
  <!-- seg2: a(2) c(3) green -->
  <rect x="188" y="60" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="88" text-anchor="middle" font-size="18" fill="#333">a</text>
  <text x="210" y="120" text-anchor="middle" font-size="10" fill="#888">2</text>
  <rect x="232" y="60" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="88" text-anchor="middle" font-size="18" fill="#333">c</text>
  <text x="254" y="120" text-anchor="middle" font-size="10" fill="#888">3</text>
  <!-- seg3: a(4) b(5) orange -->
  <rect x="276" y="60" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="88" text-anchor="middle" font-size="18" fill="#333">a</text>
  <text x="298" y="120" text-anchor="middle" font-size="10" fill="#888">4</text>
  <rect x="320" y="60" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="88" text-anchor="middle" font-size="18" fill="#333">b</text>
  <text x="342" y="120" text-anchor="middle" font-size="10" fill="#888">5</text>
  <!-- seg4: a(6) pink -->
  <rect x="364" y="60" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="386" y="88" text-anchor="middle" font-size="18" fill="#333">a</text>
  <text x="386" y="120" text-anchor="middle" font-size="10" fill="#888">6</text>

  <!-- Cut bars (dashed red) before cells 2,4,6 = after cells 1,3,5 -->
  <path d="M188 50 L188 116" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <path d="M276 50 L276 116" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <path d="M364 50 L364 116" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>

  <!-- Duplicate trigger tags above trigger cells 2,4,6 -->
  <text x="210" y="48" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">a 重复!</text>
  <text x="298" y="48" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">a 重复!</text>
  <text x="386" y="48" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">a 重复!</text>

  <!-- Arrow down -->
  <path d="M 270 140 L 270 160" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="280" y="155" font-size="11" fill="#446688">在「重复字符」前切断，重复字符另起一段</text>

  <!-- Resulting segments -->
  <rect x="100" y="168" width="88" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="144" y="194" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">"ab"</text>
  <text x="196" y="192" font-size="16" fill="#b85450" font-weight="bold">|</text>

  <rect x="206" y="168" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="241" y="194" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">"ac"</text>
  <text x="284" y="192" font-size="16" fill="#b85450" font-weight="bold">|</text>

  <rect x="294" y="168" width="70" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="329" y="194" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">"ab"</text>
  <text x="372" y="192" font-size="16" fill="#b85450" font-weight="bold">|</text>

  <rect x="382" y="168" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="404" y="194" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">"a"</text>

  <!-- seen set illustration -->
  <text x="60" y="246" font-size="12" fill="#888">seen 集合</text>
  <text x="60" y="266" font-size="11" fill="#446688">只记「当前段」内字符；</text>
  <text x="60" y="282" font-size="11" fill="#446688">一旦切割 → seen 清空</text>

  <rect x="180" y="232" width="300" height="62" fill="#fff" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="330" y="252" text-anchor="middle" font-size="11" fill="#555">段内每加入一个新字符 → seen.add(c)</text>
  <text x="330" y="270" text-anchor="middle" font-size="11" fill="#555">若 c ∈ seen → 必须切割（否则违反「段内唯一」）</text>
  <text x="330" y="286" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">切点是被「重复字符」逼出来的，不是主动选的</text>

  <!-- Result -->
  <path d="M 270 304 L 270 318" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="190" y="320" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="342" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">最少划分 = 4 段</text>
</svg>
