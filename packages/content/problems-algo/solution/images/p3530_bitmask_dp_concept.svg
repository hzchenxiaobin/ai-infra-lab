<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">位置 = popcount(mask)+1 ⇒ 收益只看集合大小，不看顺序</text>

  <!-- 区块1：位置乘数条 -->
  <text x="62" y="52" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">处理位置与乘数：</text>

  <rect x="66" y="58" width="42" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="87" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="87" y="88" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">×1</text>

  <rect x="116" y="58" width="42" height="36" rx="4" fill="#dbe7fa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="137" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <text x="137" y="88" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">×2</text>

  <rect x="166" y="58" width="42" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="187" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="187" y="88" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">×3</text>

  <rect x="216" y="58" width="42" height="36" rx="4" fill="#c9daf8" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="237" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <text x="237" y="88" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">×4</text>

  <rect x="266" y="58" width="42" height="36" rx="4" fill="#bcd4f5" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="287" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">5</text>
  <text x="287" y="88" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">×5</text>

  <text x="326" y="68" font-size="10" fill="#666" filter="url(#rough2)">已放 k 个 → 下一位置 k+1</text>
  <text x="326" y="84" font-size="10" fill="#666" filter="url(#rough2)">乘数随进度增大，大分想垫后</text>
  <text x="187" y="108" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">↑ 当前 mask 的下一位置</text>

  <!-- 区块2：mask 位格 -->
  <text x="62" y="132" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">mask = 已放节点集合（n=6 示意）：</text>

  <rect x="66" y="138" width="38" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="85" y="152" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">bit5</text>
  <text x="85" y="166" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">·</text>

  <rect x="110" y="138" width="38" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="129" y="152" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">bit4</text>
  <text x="129" y="166" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">·</text>

  <rect x="154" y="138" width="38" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="173" y="152" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">bit3</text>
  <text x="173" y="166" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">·</text>

  <rect x="198" y="138" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="217" y="152" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">bit2</text>
  <text x="217" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>

  <rect x="242" y="138" width="38" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="261" y="152" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">bit1</text>
  <text x="261" y="166" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">·</text>

  <rect x="286" y="138" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="305" y="152" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">bit0</text>
  <text x="305" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>

  <text x="336" y="152" font-size="10" fill="#666" filter="url(#rough2)">已放 {0, 2}</text>
  <text x="336" y="168" font-size="10" fill="#666" filter="url(#rough2)">popcount = 2</text>
  <text x="66" y="188" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">下一位置 = 2 + 1 = 3，无论之前 0、2 谁先谁后</text>

  <!-- 区块3：候选节点卡片 -->
  <text x="62" y="212" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">下一个放谁？看前驱是否清零：</text>

  <rect x="60" y="218" width="144" height="72" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="132" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">v = 1（score 6）</text>
  <text x="132" y="252" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">pre[1] = { 0 } ⊆ mask ✓</text>
  <text x="132" y="270" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">可放 · 收益 6 × 3 = 18</text>
  <text x="132" y="284" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">(pre[1] &amp; mask) == pre[1]</text>

  <rect x="214" y="218" width="144" height="72" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="286" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">v = 3（score 3）</text>
  <text x="286" y="252" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">pre[3] = { 0, 2 } ⊆ mask ✓</text>
  <text x="286" y="270" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">可放 · 收益 3 × 3 = 9</text>
  <text x="286" y="284" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">一次位运算判完</text>

  <rect x="368" y="218" width="144" height="72" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">v = 5（score 9）</text>
  <text x="440" y="252" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">pre[5] = { 2, 4 } ⊄ mask ✗</text>
  <text x="440" y="270" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">不可放 · 前驱 4 未放</text>
  <text x="440" y="284" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">得分再高也得等</text>

  <path d="M 132 290 C 132 304, 180 308, 226 310" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 区块4：转移公式 -->
  <rect x="60" y="300" width="400" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5527" filter="url(#rough2)">dp[mask | 1&lt;&lt;1] ← dp[mask] + 6 × 3</text>
  <text x="260" y="342" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">无论哪条路径到达 mask，乘数同为 3 ⇒ 最优子结构成立，dp 只存每个集合的最大利润</text>

  <text x="474" y="330" font-size="9" fill="#888" filter="url(#rough2)">贪心翻车点：</text>
  <text x="474" y="344" font-size="9" fill="#888" filter="url(#rough2)">放谁还看</text>
  <text x="474" y="356" font-size="9" fill="#888" filter="url(#rough2)">解锁了谁</text>
</svg>
