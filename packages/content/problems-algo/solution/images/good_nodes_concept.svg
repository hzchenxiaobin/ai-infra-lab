<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">统计好节点：前序向下传递 pathMax，绿色✓为好节点</text>

  <!-- 树结构 根 3 (good, pathMax 3->3) -->
  <line x1="268" y1="86" x2="192" y2="132" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="292" y1="86" x2="368" y2="132" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="280" cy="72" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="76" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="302" y="62" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="252" y="60" font-size="9" fill="#446688">max 3</text>

  <!-- 节点 1 左 (bad: 1 < 3) -->
  <line x1="168" y1="166" x2="132" y2="222" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="180" cy="148" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="152" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="200" y="140" font-size="10" fill="#b85450" font-weight="bold">✗</text>
  <text x="150" y="140" font-size="9" fill="#b85450">1&lt;3</text>

  <!-- 节点 4 右 (good: 4 >= 3, pathMax->4) -->
  <line x1="368" y1="166" x2="340" y2="222" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="392" y1="166" x2="430" y2="222" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="380" cy="148" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="152" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="400" y="140" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="348" y="140" font-size="9" fill="#4a7a3a">max 4</text>

  <!-- 叶 3 左下 (good: 3 >= 3) -->
  <circle cx="125" cy="232" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="125" y="236" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="143" y="226" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="92" y="226" font-size="9" fill="#4a7a3a">3≥3</text>

  <!-- 叶 1 左下 (bad: 1 < 4) -->
  <circle cx="335" cy="232" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="335" y="236" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="353" y="226" font-size="10" fill="#b85450" font-weight="bold">✗</text>
  <text x="304" y="226" font-size="9" fill="#b85450">1&lt;4</text>

  <!-- 叶 5 右下 (good: 5 >= 4, pathMax->5) -->
  <circle cx="435" cy="232" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="435" y="236" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="453" y="226" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="404" y="226" font-size="9" fill="#4a7a3a">max 5</text>

  <!-- 向下传递箭头说明 -->
  <path d="M 280 96 L 280 108" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="106" font-size="9" fill="#888">传 max=3</text>

  <!-- 说明框 -->
  <rect x="40" y="278" width="480" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">判定规则（前序向下传递 pathMax）</text>
  <text x="60" y="324" font-size="11" fill="#555">节点 X 是好节点 ⟺ 路径 root→X 上无节点的值大于 X ⟺ X.val ≥ pathMax</text>
  <text x="60" y="344" font-size="11" fill="#4a7a3a">绿色 ✓：好节点（4 个 = 根3 + 节点4 + 叶3 + 叶5），命中即更新 pathMax = X.val</text>
  <text x="60" y="364" font-size="11" fill="#b85450">红色 ✗：非好节点（节点1 被 max=3 压住；叶1 被 max=4 压住），pathMax 不变继续下传</text>
</svg>
