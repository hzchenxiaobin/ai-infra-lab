<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心：干涸日优先抽「最快再次降雨」的满水湖</text>

  <!-- dry day box -->
  <rect x="40" y="150" width="70" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="75" y="170" text-anchor="middle" font-size="13" fill="#333">0</text>
  <text x="75" y="184" text-anchor="middle" font-size="10" fill="#888">干涰日</text>

  <!-- arrow to heap -->
  <path d="M115,170 L175,170" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- heap label -->
  <text x="220" y="110" text-anchor="middle" font-size="11" fill="#888">小顶堆（按「下次降雨日」排序）</text>

  <!-- heap boxes -->
  <rect x="180" y="120" width="84" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="222" y="140" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">湖2 · 第4天</text>

  <rect x="180" y="158" width="84" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="222" y="178" text-anchor="middle" font-size="11" fill="#333">湖1 · 第5天</text>

  <rect x="180" y="196" width="84" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="222" y="216" text-anchor="middle" font-size="11" fill="#333">湖3 · 第8天</text>

  <!-- arrow pointing to top (most urgent) -->
  <path d="M335,136 L268,136" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="392" y="140" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">抽湖2</text>

  <!-- warning box -->
  <rect x="290" y="250" width="210" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="395" y="273" text-anchor="middle" font-size="11" fill="#b85450">⚠ 若不抽湖2：</text>
  <text x="395" y="291" text-anchor="middle" font-size="11" fill="#555">第4天湖2再次降雨</text>
  <text x="395" y="307" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">→ 泛滥！</text>

  <!-- bottom note -->
  <text x="130" y="278" text-anchor="middle" font-size="11" fill="#4a7a3a">堆顶 = 下次降雨最近 = 最紧迫</text>
  <text x="130" y="296" text-anchor="middle" font-size="10" fill="#4a7a3a">其余湖还有更多干涰日可救</text>
  <text x="130" y="314" text-anchor="middle" font-size="10" fill="#4a7a3a">交换论证 → 贪心最优</text>
</svg>
