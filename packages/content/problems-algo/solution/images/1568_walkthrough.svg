<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>

  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例 1 演算：2×2 方块无割点 → 需删 2 格</text>
  <path d="M 170 38 Q 320 46 470 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Row A: original 2x2 block ===== -->
  <text x="90" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">① 原网格：1 座岛</text>
  <!-- 3x3 mini grid, cell 36, origin (30,82); island at (0,1),(0,2),(1,1),(1,2) -->
  <g filter="url(#sk)"><rect x="30"  y="82" width="36" height="36" rx="3" fill="#eef2f7" stroke="#9aa8b5"/></g>
  <g filter="url(#sk)"><rect x="66"  y="82" width="36" height="36" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="102" y="82" width="36" height="36" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="138" y="82" width="36" height="36" rx="3" fill="#eef2f7" stroke="#9aa8b5"/></g>
  <g filter="url(#sk)"><rect x="30"  y="118" width="36" height="36" rx="3" fill="#eef2f7" stroke="#9aa8b5"/></g>
  <g filter="url(#sk)"><rect x="66"  y="118" width="36" height="36" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="102" y="118" width="36" height="36" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="138" y="118" width="36" height="36" rx="3" fill="#eef2f7" stroke="#9aa8b5"/></g>
  <g filter="url(#sk)"><rect x="30"  y="154" width="36" height="36" rx="3" fill="#eef2f7" stroke="#9aa8b5"/></g>
  <g filter="url(#sk)"><rect x="66"  y="154" width="36" height="36" rx="3" fill="#eef2f7" stroke="#9aa8b5"/></g>
  <g filter="url(#sk)"><rect x="102" y="154" width="36" height="36" rx="3" fill="#eef2f7" stroke="#9aa8b5"/></g>
  <g filter="url(#sk)"><rect x="138" y="154" width="36" height="36" rx="3" fill="#eef2f7" stroke="#9aa8b5"/></g>
  <text x="84"  y="106" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="120" y="106" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="84"  y="142" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="120" y="142" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="84"  y="208" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">岛屿数 = 1</text>
  <text x="84"  y="222" text-anchor="middle" font-size="10" fill="#888">cnt ≠ 1? 否</text>

  <!-- arrow to row B -->
  <path d="M 190 130 L 210 130" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Row B: 4 single-cell deletions (each L-shape, 1 island) ===== -->
  <text x="380" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">② 枚举删一格：4 种都剩 L 形 = 1 座岛</text>

  <!-- four 3x3 mini grids, cell 24, spacing; show each deletion -->
  <!-- helper: each grid origin x = 230, 340, 450, 560 ? too wide. use cell=22, grid w=66 -->
  <!-- grid 1: delete (0,1) -->
  <g font-size="9">
    <!-- g1 origin (230,84) -->
    <g filter="url(#sk)"><rect x="230" y="84" width="22" height="22" rx="2" fill="#eef2f7" stroke="#9aa8b5"/></g>
    <g filter="url(#sk)"><rect x="252" y="84" width="22" height="22" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
    <g filter="url(#sk)"><rect x="274" y="84" width="22" height="22" rx="2" fill="#e8f0fe" stroke="#446688"/></g>
    <g filter="url(#sk)"><rect x="230" y="106" width="22" height="22" rx="2" fill="#eef2f7" stroke="#9aa8b5"/></g>
    <g filter="url(#sk)"><rect x="252" y="106" width="22" height="22" rx="2" fill="#e8f0fe" stroke="#446688"/></g>
    <g filter="url(#sk)"><rect x="274" y="106" width="22" height="22" rx="2" fill="#e8f0fe" stroke="#446688"/></g>
    <text x="263" y="100" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">×</text>
    <text x="285" y="100" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
    <text x="263" y="122" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
    <text x="285" y="122" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
    <text x="263" y="146" text-anchor="middle" font-size="9" fill="#888">删(0,1)</text>
    <text x="263" y="158" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">=1座</text>
  </g>

  <!-- g2 origin (320,84): delete (0,2) -->
  <g font-size="9">
    <g filter="url(#sk)"><rect x="320" y="84" width="22" height="22" rx="2" fill="#eef2f7" stroke="#9aa8b5"/></g>
    <g filter="url(#sk)"><rect x="342" y="84" width="22" height="22" rx="2" fill="#e8f0fe" stroke="#446688"/></g>
    <g filter="url(#sk)"><rect x="364" y="84" width="22" height="22" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
    <g filter="url(#sk)"><rect x="320" y="106" width="22" height="22" rx="2" fill="#eef2f7" stroke="#9aa8b5"/></g>
    <g filter="url(#sk)"><rect x="342" y="106" width="22" height="22" rx="2" fill="#e8f0fe" stroke="#446688"/></g>
    <g filter="url(#sk)"><rect x="364" y="106" width="22" height="22" rx="2" fill="#e8f0fe" stroke="#446688"/></g>
    <text x="353" y="100" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
    <text x="375" y="100" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">×</text>
    <text x="353" y="122" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
    <text x="375" y="122" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
    <text x="353" y="146" text-anchor="middle" font-size="9" fill="#888">删(0,2)</text>
    <text x="353" y="158" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">=1座</text>
  </g>

  <!-- g3 origin (410,84): delete (1,1) -->
  <g font-size="9">
    <g filter="url(#sk)"><rect x="410" y="84" width="22" height="22" rx="2" fill="#eef2f7" stroke="#9aa8b5"/></g>
    <g filter="url(#sk)"><rect x="432" y="84" width="22" height="22" rx="2" fill="#e8f0fe" stroke="#446688"/></g>
    <g filter="url(#sk)"><rect x="454" y="84" width="22" height="22" rx="2" fill="#e8f0fe" stroke="#446688"/></g>
    <g filter="url(#sk)"><rect x="410" y="106" width="22" height="22" rx="2" fill="#eef2f7" stroke="#9aa8b5"/></g>
    <g filter="url(#sk)"><rect x="432" y="106" width="22" height="22" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
    <g filter="url(#sk)"><rect x="454" y="106" width="22" height="22" rx="2" fill="#e8f0fe" stroke="#446688"/></g>
    <text x="443" y="100" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
    <text x="465" y="100" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
    <text x="443" y="122" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">×</text>
    <text x="465" y="122" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
    <text x="443" y="146" text-anchor="middle" font-size="9" fill="#888">删(1,1)</text>
    <text x="443" y="158" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">=1座</text>
  </g>

  <!-- g4 origin (500,84): delete (1,2) -->
  <g font-size="9">
    <g filter="url(#sk)"><rect x="500" y="84" width="22" height="22" rx="2" fill="#eef2f7" stroke="#9aa8b5"/></g>
    <g filter="url(#sk)"><rect x="522" y="84" width="22" height="22" rx="2" fill="#e8f0fe" stroke="#446688"/></g>
    <g filter="url(#sk)"><rect x="544" y="84" width="22" height="22" rx="2" fill="#e8f0fe" stroke="#446688"/></g>
    <g filter="url(#sk)"><rect x="500" y="106" width="22" height="22" rx="2" fill="#eef2f7" stroke="#9aa8b5"/></g>
    <g filter="url(#sk)"><rect x="522" y="106" width="22" height="22" rx="2" fill="#e8f0fe" stroke="#446688"/></g>
    <g filter="url(#sk)"><rect x="544" y="106" width="22" height="22" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
    <text x="533" y="100" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
    <text x="555" y="100" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
    <text x="533" y="122" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
    <text x="555" y="122" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">×</text>
    <text x="533" y="146" text-anchor="middle" font-size="9" fill="#888">删(1,2)</text>
    <text x="533" y="158" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">=1座</text>
  </g>

  <text x="380" y="180" text-anchor="middle" font-size="10" fill="#888" font-style="italic">L 形三格仍连通 → 单格删全失败 → 无割点</text>

  <!-- arrow down to row C -->
  <path d="M 320 188 L 320 206" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Row C: delete two cells -> 2 islands ===== -->
  <text x="320" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">③ 删两格 (1,1) 与 (0,2)：剩对角两格 → 2 座岛</text>

  <!-- 3x3 grid, cell 36, origin (250,238) -->
  <g filter="url(#sk)"><rect x="250" y="238" width="36" height="36" rx="3" fill="#eef2f7" stroke="#9aa8b5"/></g>
  <g filter="url(#sk)"><rect x="286" y="238" width="36" height="36" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="322" y="238" width="36" height="36" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="250" y="274" width="36" height="36" rx="3" fill="#eef2f7" stroke="#9aa8b5"/></g>
  <g filter="url(#sk)"><rect x="286" y="274" width="36" height="36" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="322" y="274" width="36" height="36" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="250" y="310" width="36" height="36" rx="3" fill="#eef2f7" stroke="#9aa8b5"/></g>
  <g filter="url(#sk)"><rect x="286" y="310" width="36" height="36" rx="3" fill="#eef2f7" stroke="#9aa8b5"/></g>
  <g filter="url(#sk)"><rect x="322" y="310" width="36" height="36" rx="3" fill="#eef2f7" stroke="#9aa8b5"/></g>
  <text x="304" y="262" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="340" y="262" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">×</text>
  <text x="304" y="298" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">×</text>
  <text x="340" y="298" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>

  <!-- labels for the two remaining 1-cell islands -->
  <text x="304" y="232" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">岛①</text>
  <text x="340" y="232" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">删</text>
  <text x="304" y="320" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">删</text>
  <text x="340" y="320" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">岛②</text>

  <!-- arrow to conclusion -->
  <path d="M 380 290 L 430 290" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>

  <!-- conclusion box -->
  <g filter="url(#sk)"><rect x="432" y="252" width="180" height="80" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="522" y="278" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">返回 2</text>
  <text x="522" y="298" text-anchor="middle" font-size="10" fill="#444">两剩格对角不相邻</text>
  <text x="522" y="312" text-anchor="middle" font-size="10" fill="#444">→ 2 座单格岛</text>
  <text x="522" y="326" text-anchor="middle" font-size="10" fill="#444">→ 分离 ✓</text>

  <!-- bottom note -->
  <g filter="url(#sk)"><rect x="40" y="370" width="560" height="76" rx="10" fill="#fffdf3" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="56" y="394" font-size="12" font-weight="bold" fill="#d6a040">关键点</text>
  <text x="56" y="414" font-size="11" fill="#444">• 2×2 方块每格度数=2，删任一格剩 L 形三格仍连通 → 无割点 → 单格枚举必失败</text>
  <text x="56" y="432" font-size="11" fill="#444">• 删两格使剩余陆格「对角不相邻」即可拆成两座岛 → 答案上界 2 在此实例化</text>
</svg>
