<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：十字臂长取四方向最小值</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">7×7 网格，中心 (3,3)；矿井 (0) 在 (3,5) 与 (5,3) 截断右臂与下臂</text>

  <!-- grid background -->
  <rect x="50" y="95" width="182" height="182" fill="#f4f4f0" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- grid lines -->
  <path d="M76 95 V277 M102 95 V277 M128 95 V277 M154 95 V277 M180 95 V277 M206 95 V277 M50 121 H232 M50 147 H232 M50 173 H232 M50 199 H232 M50 225 H232 M50 251 H232" stroke="#cccccc" stroke-width="0.8" fill="none" filter="url(#rough2)"/>

  <!-- up arm cells (blue): (0,3),(1,3),(2,3) -->
  <rect x="128" y="95"  width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="141" y="113" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="128" y="121" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="141" y="139" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="128" y="147" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="141" y="165" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- down arm cell (4,3) blue -->
  <rect x="128" y="199" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="141" y="217" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- left arm cells (3,0),(3,1),(3,2) blue -->
  <rect x="50"  y="173" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="63"  y="191" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="76"  y="173" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="89"  y="191" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="102" y="173" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="115" y="191" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- right arm cell (3,4) blue -->
  <rect x="154" y="173" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="167" y="191" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- center (3,3) red -->
  <rect x="128" y="173" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="3" filter="url(#rough2)"/>
  <text x="141" y="191" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>

  <!-- mine (3,5) pink with 0 -->
  <rect x="180" y="173" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="193" y="191" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
  <!-- mine (5,3) pink with 0 -->
  <rect x="128" y="225" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="141" y="243" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>

  <!-- arm length labels -->
  <text x="141" y="84" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">U = 4 ↑</text>
  <text x="141" y="293" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">D = 2 ↓（被 0 截断）</text>
  <text x="42" y="191" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">L = 4 ←</text>
  <text x="240" y="191" text-anchor="start" font-size="12" fill="#b85450" font-weight="bold">R = 2 →</text>

  <!-- explanation box on right -->
  <rect x="265" y="95" width="280" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="405" y="118" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">臂长 = 该方向「含中心」的连续 1 个数</text>
  <text x="405" y="138" text-anchor="middle" font-size="11" fill="#666">遇到 0（矿井）或越界即停止累加</text>
  <text x="405" y="158" text-anchor="middle" font-size="11" fill="#666">四条臂独立计算，互不影响</text>
  <text x="405" y="176" text-anchor="middle" font-size="11" fill="#888">U、L 长 ≠ 十字大，短板决定阶数</text>

  <!-- formula box -->
  <rect x="265" y="200" width="280" height="77" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="405" y="222" text-anchor="middle" font-size="12.5" fill="#333">中心 (r, c) 的十字阶数：</text>
  <text x="405" y="246" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold">order = min( U, D, L, R )</text>
  <text x="405" y="268" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">= min( 4, 2, 4, 2 ) = 2</text>

  <!-- conclusion -->
  <rect x="265" y="292" width="280" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="405" y="314" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">答案 = 所有中心里 order 的最大值</text>
  <text x="405" y="334" text-anchor="middle" font-size="11" fill="#666">预处理四方向连续 1 → 逐点取 min → 取 max</text>
</svg>
