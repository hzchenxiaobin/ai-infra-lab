  <rect x="454" y="150" width="76" height="34" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="492" y="172" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">缺 Mort</text>

  <rect x="30" y="186" width="62" height="34" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="61" y="208" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">104</text>
  <rect x="92" y="186" width="168" height="34" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="176" y="208" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">Mortgage</text>
  <rect x="260" y="186" width="66" height="34" fill="#fafafa" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="293" y="208" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0</text>
  <rect x="326" y="186" width="66" height="34" fill="#fafafa" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="359" y="208" text-anchor="middle" font-size="11" fill="#8a6d1a" filter="url(#rough2)">1</text>
  <rect x="392" y="186" width="62" height="34" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="423" y="208" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>
  <rect x="454" y="186" width="76" height="34" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="492" y="208" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">缺 Refi</text>

  <path d="M 492 222 Q 440 240 340 252" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <rect x="130" y="256" width="300" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">HAVING 放行 → ORDER BY user_id 升序</text>
  <text x="280" y="300" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">输出：user_id = 102</text>

  <rect x="30" y="324" width="500" height="42" fill="#fafafa" stroke="#d6a040" stroke-width="1" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="341" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">无关类型 AutoLoan / Inschool：对两个计数器贡献恒为 0，不改变判定</text>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">可先 WHERE loan_type IN ('Refinance','Mortgage') 预过滤，分组桶更小（见题解 5.1）</text>
