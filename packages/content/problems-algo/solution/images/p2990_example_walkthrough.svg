<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：逐用户双条件计数，只有 102 两个计数器都 &gt; 0</text>

  <rect x="30" y="48" width="62" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="61" y="67" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">user_id</text>

  <rect x="92" y="48" width="168" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="67" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">组内贷款类型</text>

  <rect x="260" y="48" width="66" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="293" y="67" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">SUM(R)</text>

  <rect x="326" y="48" width="66" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="359" y="67" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">SUM(M)</text>

  <rect x="392" y="48" width="62" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="423" y="67" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">双&gt;0?</text>

  <rect x="454" y="48" width="76" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="492" y="67" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">结果</text>

  <rect x="30" y="78" width="62" height="34" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="61" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">101</text>
