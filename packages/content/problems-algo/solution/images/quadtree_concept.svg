<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：整块同值→叶子，否则四等分递归</text>

  <!-- Left grid: leaf case (all 1s), 4x4 -->
  <text x="110" y="60" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">全部相同 → 叶子节点</text>
  <g filter="url(#rough2)">
    <rect x="50" y="70" width="120" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2"/>
    <!-- 4x4 cells all 1 -->
    <line x1="80" y1="70" x2="80" y2="190" stroke="#4a7a3a" stroke-width="1.2"/>
    <line x1="110" y1="70" x2="110" y2="190" stroke="#4a7a3a" stroke-width="1.2"/>
    <line x1="140" y1="70" x2="140" y2="190" stroke="#4a7a3a" stroke-width="1.2"/>
    <line x1="50" y1="100" x2="170" y2="100" stroke="#4a7a3a" stroke-width="1.2"/>
    <line x1="50" y1="130" x2="170" y2="130" stroke="#4a7a3a" stroke-width="1.2"/>
    <line x1="50" y1="160" x2="170" y2="160" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <g font-size="11" fill="#3a5a2a" text-anchor="middle" filter="url(#rough2)">
    <text x="65" y="89">1</text><text x="95" y="89">1</text><text x="125" y="89">1</text><text x="155" y="89">1</text>
    <text x="65" y="119">1</text><text x="95" y="119">1</text><text x="125" y="119">1</text><text x="155" y="119">1</text>
    <text x="65" y="149">1</text><text x="95" y="149">1</text><text x="125" y="149">1</text><text x="155" y="149">1</text>
    <text x="65" y="179">1</text><text x="95" y="179">1</text><text x="125" y="179">1</text><text x="155" y="179">1</text>
  </g>
  <!-- arrow to leaf node -->
  <path d="M 170 130 L 210 130" stroke="#888" stroke-width="1.6" marker-end="url(#arrD)" fill="none" filter="url(#rough2)"/>
  <rect x="212" y="112" width="70" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="247" y="129" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">isLeaf=1</text>
  <text x="247" y="143" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">val=1</text>

  <!-- Right grid: mixed, split into 4 -->
  <text x="420" y="60" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">混合值 → 四等分递归</text>
  <g filter="url(#rough2)">
    <rect x="360" y="70" width="120" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="2"/>
    <line x1="390" y1="70" x2="390" y2="190" stroke="#d6a040" stroke-width="1.2"/>
    <line x1="420" y1="70" x2="420" y2="190" stroke="#d6a040" stroke-width="1.2"/>
    <line x1="450" y1="70" x2="450" y2="190" stroke="#d6a040" stroke-width="1.2"/>
    <line x1="360" y1="100" x2="480" y2="100" stroke="#d6a040" stroke-width="1.2"/>
    <line x1="360" y1="130" x2="480" y2="130" stroke="#d6a040" stroke-width="1.2"/>
    <line x1="360" y1="160" x2="480" y2="160" stroke="#d6a040" stroke-width="1.2"/>
    <!-- center split lines (thicker) -->
    <line x1="420" y1="70" x2="420" y2="190" stroke="#b85450" stroke-width="2.4" stroke-dasharray="4,3"/>
    <line x1="360" y1="130" x2="480" y2="130" stroke="#b85450" stroke-width="2.4" stroke-dasharray="4,3"/>
  </g>
  <g font-size="11" fill="#555" text-anchor="middle" filter="url(#rough2)">
    <text x="375" y="89">0</text><text x="405" y="89">0</text><text x="435" y="89">1</text><text x="465" y="89">1</text>
    <text x="375" y="119">0</text><text x="405" y="119">0</text><text x="435" y="119">1</text><text x="465" y="119">1</text>
    <text x="375" y="149">1</text><text x="405" y="149">1</text><text x="435" y="149">0</text><text x="465" y="149">0</text>
    <text x="375" y="179">1</text><text x="405" y="179">1</text><text x="435" y="179">0</text><text x="465" y="179">0</text>
  </g>
  <!-- 4 quadrant labels -->
  <text x="383" y="222" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">TL</text>
  <text x="447" y="222" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">TR</text>
  <text x="383" y="234" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">BL</text>
  <text x="447" y="234" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">BR</text>

  <!-- bottom: divide-and-conquer summary -->
  <rect x="32" y="262" width="496" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="48" y="282" font-size="12" fill="#446688" font-weight="bold">分治：检查 [x, x+len) × [y, y+len) 是否全同</text>
  <text x="48" y="299" font-size="11" fill="#446688">全同→叶子(val=该值)；否则 len/=2，对 TL/TR/BL/BR 四块各递归一次</text>

  <rect x="32" y="316" width="496" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="48" y="336" font-size="12" fill="#d6a040" font-weight="bold">n = 2^x（0 ≤ x ≤ 6），每次对半切保证四块等大</text>
  <text x="48" y="353" font-size="11" fill="#d6a040">递归深度 = log₂n ≤ 6；最坏每层扫描全格 O(n²)，总计 O(n² log n)</text>
</svg>
