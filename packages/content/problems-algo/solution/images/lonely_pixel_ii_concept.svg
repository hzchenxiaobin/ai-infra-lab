<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold">核心观察：第三条件归约为「行签名频次 = 列 B 数」</text>

  <!-- ===== 左：示例矩阵 target=2 ===== -->
  <text x="134" y="54" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">示例（target = 2）</text>

  <!-- 列标 -->
  <text x="98" y="74" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="134" y="74" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="170" y="74" text-anchor="middle" font-size="10" fill="#888">2</text>
  <!-- 行标 -->
  <text x="74" y="107" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="74" y="143" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="74" y="179" text-anchor="middle" font-size="10" fill="#888">2</text>

  <!-- row 0: B W B -->
  <rect x="80" y="90" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="98" y="113" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">B</text>
  <rect x="116" y="90" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="134" y="113" text-anchor="middle" font-size="12" fill="#ccc">W</text>
  <rect x="152" y="90" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="170" y="113" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">B</text>
  <!-- row 1: B W B（与 row0 同签名） -->
  <rect x="80" y="126" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="98" y="149" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">B</text>
  <rect x="116" y="126" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="134" y="149" text-anchor="middle" font-size="12" fill="#ccc">W</text>
  <rect x="152" y="126" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="170" y="149" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">B</text>
  <!-- row 2: W B W -->
  <rect x="80" y="162" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="98" y="185" text-anchor="middle" font-size="12" fill="#ccc">W</text>
  <rect x="116" y="162" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="134" y="185" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">B</text>
  <rect x="152" y="162" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="170" y="185" text-anchor="middle" font-size="12" fill="#ccc">W</text>

  <!-- rowCount 标注（右侧） -->
  <text x="208" y="82" text-anchor="middle" font-size="9" fill="#888">行B数</text>
  <rect x="196" y="94" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="208" y="109" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="196" y="130" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="208" y="145" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="196" y="166" width="24" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="208" y="181" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>

  <!-- colCount 标注（下方） -->
  <text x="56" y="214" text-anchor="middle" font-size="9" fill="#888">列B数</text>
  <rect x="86" y="204" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="98" y="219" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="122" y="204" width="24" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="134" y="219" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <rect x="158" y="204" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="170" y="219" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- 同行说明 -->
  <rect x="36" y="240" width="252" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="162" y="258" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">行0 ≡ 行1（同签名 "BWB"）</text>
  <text x="162" y="274" text-anchor="middle" font-size="10.5" fill="#777">→ freq["BWB"] = 2；行2 签名 "WBW"，freq=1</text>

  <!-- ===== 右：三条件 ===== -->
  <rect x="312" y="54" width="224" height="158" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="424" y="76" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">B(i,j) 孤独的三条件</text>

  <text x="326" y="100" font-size="11.5" fill="#333">① rowCount[i] == target</text>
  <text x="326" y="122" font-size="11.5" fill="#333">② colCount[j] == target</text>
  <text x="326" y="146" font-size="11.5" fill="#333">③ 列 j 上所有有 B 的行</text>
  <text x="340" y="162" font-size="11.5" fill="#333">都与行 i 完全相同</text>

  <!-- 条件3 高亮框 -->
  <rect x="318" y="134" width="212" height="36" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>

  <!-- 等价归约 -->
  <rect x="312" y="226" width="224" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="424" y="248" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">③ ⟺ freq[sig(i)] == colCount[j]</text>
  <text x="424" y="268" text-anchor="middle" font-size="10" fill="#777">与 i 同签名的行也都在列 j 有 B</text>

  <!-- 合并 ② ③ -->
  <rect x="312" y="294" width="224" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="424" y="312" text-anchor="middle" font-size="10.5" fill="#444">代入 ② colCount[j]==target：</text>
  <text x="424" y="332" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">③ ⟺ freq[sig(i)] == target</text>

  <!-- 底部最终公式 -->
  <rect x="36" y="294" width="252" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="162" y="314" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">孤独(i,j) ⟺ ① ∧ ② ∧ ③</text>
  <text x="162" y="334" text-anchor="middle" font-size="10" fill="#555">三值皆预计算 → 每个 B 判定 O(1)</text>

</svg>
