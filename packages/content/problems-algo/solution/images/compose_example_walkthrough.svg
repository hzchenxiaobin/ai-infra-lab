<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：functions = [x→x+1, x→x², x→2x]，x = 4</text>

  <!-- column headers -->
  <text x="70" y="66" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">步</text>
  <text x="200" y="66" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">取出的函数</text>
  <text x="360" y="66" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">acc 变化</text>
  <text x="540" y="66" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">说明</text>

  <!-- header underline -->
  <line x1="30" y1="76" x2="590" y2="76" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- init row -->
  <rect x="30" y="88" width="560" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="112" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0</text>
  <text x="200" y="112" text-anchor="middle" font-size="12" fill="#333">（初始值）</text>
  <text x="360" y="112" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">acc = x = 4</text>
  <text x="540" y="112" text-anchor="middle" font-size="11" fill="#888">reduceRight 的起点</text>

  <!-- arrow 0->1 -->
  <path d="M 360 128 L 360 138" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 1: f3 -->
  <rect x="30" y="142" width="560" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="166" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="200" y="166" text-anchor="middle" font-size="12" fill="#333">f3：x → 2·x</text>
  <text x="360" y="166" text-anchor="middle" font-size="12" fill="#333">2 × 4 = <tspan fill="#b85450" font-weight="bold">8</tspan></text>
  <text x="540" y="166" text-anchor="middle" font-size="11" fill="#888">最右端先执行</text>

  <!-- arrow 1->2 -->
  <path d="M 360 182 L 360 192" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: f2 -->
  <rect x="30" y="196" width="560" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="220" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <text x="200" y="220" text-anchor="middle" font-size="12" fill="#333">f2：x → x²</text>
  <text x="360" y="220" text-anchor="middle" font-size="12" fill="#333">8² = <tspan fill="#b85450" font-weight="bold">64</tspan></text>
  <text x="540" y="220" text-anchor="middle" font-size="11" fill="#888">指针左移一位</text>

  <!-- arrow 2->3 -->
  <path d="M 360 236 L 360 246" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3: f1 -->
  <rect x="30" y="250" width="560" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="274" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <text x="200" y="274" text-anchor="middle" font-size="12" fill="#333">f1：x → x+1</text>
  <text x="360" y="274" text-anchor="middle" font-size="12" fill="#333">64 + 1 = <tspan fill="#b85450" font-weight="bold">65</tspan></text>
  <text x="540" y="274" text-anchor="middle" font-size="11" fill="#888">最左端最后执行</text>

  <!-- arrow 3->out -->
  <path d="M 360 290 L 360 300" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- output row -->
  <rect x="30" y="304" width="560" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="324" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">输出：65 —— 与手算 f1(f2(f3(4))) 完全一致</text>
  <text x="310" y="342" text-anchor="middle" font-size="11" fill="#888">关键：书写顺序 [f1, f2, f3]，但作用顺序是 f3 → f2 → f1</text>

  <text x="310" y="372" text-anchor="middle" font-size="11" fill="#888">对照示例 3：functions = []，x = 42 —— 无函数可取，acc 保持 42，即恒等函数</text>
</svg>
