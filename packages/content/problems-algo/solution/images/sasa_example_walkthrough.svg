<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：nums = [1,2,3,4,5,6,7,8]</text>

  <!-- Step 1: compute b[] -->
  <text x="20" y="52" font-size="12" fill="#4a7a3a" font-weight="bold">第一步：计算 b[i] = nums[i]·n − total（n=8, total=36）</text>

  <!-- nums row -->
  <text x="20" y="76" font-size="10" fill="#888">nums</text>
  <rect x="62" y="62" width="38" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="81" y="77" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <rect x="102" y="62" width="38" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="121" y="77" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <rect x="142" y="62" width="38" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="161" y="77" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <rect x="182" y="62" width="38" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="201" y="77" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>
  <rect x="222" y="62" width="38" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="241" y="77" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <rect x="262" y="62" width="38" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="281" y="77" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">6</text>
  <rect x="302" y="62" width="38" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="321" y="77" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">7</text>
  <rect x="342" y="62" width="38" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="361" y="77" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">8</text>

  <!-- b row -->
  <text x="20" y="104" font-size="10" fill="#888">b[]</text>
  <rect x="62" y="90" width="38" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="81" y="105" text-anchor="middle" font-size="9" fill="#333">-28</text>
  <rect x="102" y="90" width="38" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="121" y="105" text-anchor="middle" font-size="9" fill="#333">-20</text>
  <rect x="142" y="90" width="38" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="161" y="105" text-anchor="middle" font-size="9" fill="#333">-12</text>
  <rect x="182" y="90" width="38" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="201" y="105" text-anchor="middle" font-size="9" fill="#333">-4</text>
  <rect x="222" y="90" width="38" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="241" y="105" text-anchor="middle" font-size="9" fill="#333">4</text>
  <rect x="262" y="90" width="38" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="281" y="105" text-anchor="middle" font-size="9" fill="#333">12</text>
  <rect x="302" y="90" width="38" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="321" y="105" text-anchor="middle" font-size="9" fill="#333">20</text>
  <rect x="342" y="90" width="38" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="361" y="105" text-anchor="middle" font-size="9" fill="#333">28</text>

  <!-- split annotation -->
  <path d="M 200 120 L 200 124 L 222 124" stroke="#888" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="155" y="132" font-size="9" fill="#446688" font-weight="bold">左半</text>
  <text x="300" y="132" font-size="9" fill="#b85450" font-weight="bold">右半</text>

  <!-- divider -->
  <line x1="20" y1="140" x2="420" y2="140" stroke="#ddd" stroke-width="1" stroke-dasharray="6,4" filter="url(#rough2)"/>

  <!-- Step 2: build left map -->
  <text x="20" y="160" font-size="12" fill="#4a7a3a" font-weight="bold">第二步：建左半哈希表（关键条目）</text>

  <!-- left map table -->
  <rect x="20" y="168" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="183" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">sum</text>
  <rect x="100" y="168" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="183" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">sizes</text>
  <rect x="180" y="168" width="140" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="250" y="183" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">对应元素</text>

  <rect x="20" y="190" width="80" height="18" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="203" text-anchor="middle" font-size="9" fill="#333">0</text>
  <rect x="100" y="190" width="80" height="18" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="203" text-anchor="middle" font-size="9" fill="#333">{0}</text>
  <rect x="180" y="190" width="140" height="18" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="250" y="203" text-anchor="middle" font-size="9" fill="#888">∅（空集）</text>

  <rect x="20" y="208" width="80" height="18" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="221" text-anchor="middle" font-size="9" fill="#333">-4</text>
  <rect x="100" y="208" width="80" height="18" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="221" text-anchor="middle" font-size="9" fill="#333">{1}</text>
  <rect x="180" y="208" width="140" height="18" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="250" y="221" text-anchor="middle" font-size="9" fill="#888">{-4}（b₃）</text>

  <rect x="20" y="226" width="80" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="239" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">-32</text>
  <rect x="100" y="226" width="80" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="140" y="239" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">{2}</text>
  <rect x="180" y="226" width="140" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="250" y="239" text-anchor="middle" font-size="9" fill="#333">{-28,-4} 或 {-20,-12}</text>

  <text x="340" y="203" font-size="9" fill="#888">··· 共 2⁴=16 项 ···</text>

  <!-- divider -->
  <line x1="20" y1="256" x2="420" y2="256" stroke="#ddd" stroke-width="1" stroke-dasharray="6,4" filter="url(#rough2)"/>

  <!-- Step 3: right enumeration and match -->
  <text x="20" y="276" font-size="12" fill="#b85450" font-weight="bold">第三步：枚举右半子集，查 −sum_r</text>

  <!-- right table header -->
  <rect x="20" y="284" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="299" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">sum_r</text>
  <rect x="100" y="284" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="125" y="299" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">size_r</text>
  <rect x="150" y="284" width="70" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="185" y="299" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">查−sum_r</text>
  <rect x="220" y="284" width="100" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="270" y="299" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">命中结果</text>

  <!-- row: sum_r=0 -->
  <rect x="20" y="306" width="80" height="18" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="319" text-anchor="middle" font-size="9" fill="#333">0</text>
  <rect x="100" y="306" width="50" height="18" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="125" y="319" text-anchor="middle" font-size="9" fill="#333">0</text>
  <rect x="150" y="306" width="70" height="18" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="185" y="319" text-anchor="middle" font-size="9" fill="#888">0</text>
  <rect x="220" y="306" width="100" height="18" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="270" y="319" text-anchor="middle" font-size="9" fill="#888">size=0 排除</text>

  <!-- row: sum_r=4, MATCH -->
  <rect x="20" y="324" width="80" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="337" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">4</text>
  <rect x="100" y="324" width="50" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="125" y="337" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">1</text>
  <rect x="150" y="324" width="70" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="185" y="337" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">-4</text>
  <rect x="220" y="324" width="100" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="270" y="337" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓ size=2 命中!</text>

  <!-- row: sum_r=32 (example match) -->
  <rect x="20" y="342" width="80" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="355" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">32</text>
  <rect x="100" y="342" width="50" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="125" y="355" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2</text>
  <rect x="150" y="342" width="70" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="185" y="355" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">-32</text>
  <rect x="220" y="342" width="100" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="270" y="355" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">✓ size=4 命中!</text>

  <text x="340" y="337" font-size="9" fill="#4a7a3a">← {4}</text>
  <text x="340" y="355" font-size="9" fill="#d6a040">← {4,28}</text>

  <!-- result box -->
  <rect x="40" y="378" width="360" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="400" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return true ✓</text>

  <!-- annotations -->
  <text x="20" y="430" font-size="10" fill="#888">命中1：左{-4}+右{4} → A={4,5}, avg=4.5=36/8 ✓</text>
  <text x="20" y="446" font-size="10" fill="#888">命中2：左{-28,-4}+右{4,28} → A={1,4,5,8}, avg=4.5 ✓</text>
  <text x="20" y="462" font-size="10" fill="#888">对应题目示例：[1,4,5,8] 与 [2,3,6,7] 均值都是 4.5</text>
</svg>
