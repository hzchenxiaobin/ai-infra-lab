<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：按位计数的滑动窗口</text>

  <!-- start -->
  <rect x="210" y="40" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="285" y="62" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">l = 0, r = 0, ans = ∞</text>

  <path d="M 285 74 L 285 92" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- add right -->
  <rect x="185" y="96" width="200" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="285" y="116" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">nums[r] 入窗</text>
  <text x="285" y="134" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">为 1 的位 cnt[b]++，点亮新位</text>

  <path d="M 285 144 L 285 162" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="285,166 375,196 285,226 195,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="285" y="192" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">l ≤ r 且</text>
  <text x="285" y="208" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">OR ≥ k ？</text>

  <!-- yes branch: record -->
  <path d="M 375 196 L 442 196" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="188" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="446" y="174" width="150" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="521" y="192" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">记录答案</text>
  <text x="521" y="209" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = min(ans, r−l+1)</text>

  <path d="M 521 218 L 521 240" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- remove left -->
  <rect x="446" y="244" width="150" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="521" y="264" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">nums[l] 出窗：逐位 −1</text>
  <text x="521" y="280" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">计数归零的位熄灭</text>
  <text x="521" y="296" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">l++</text>

  <!-- loop back to diamond -->
  <path d="M 446 272 C 400 272 385 250 376 220" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="248" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">继续收缩判定</text>

  <!-- no branch -->
  <path d="M 285 226 L 285 252" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="297" y="244" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- diamond 2 -->
  <polygon points="285,256 355 285 285,314 215,285" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="285" y="290" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">r 到末尾？</text>

  <!-- no: r++ and loop back -->
  <path d="M 215 285 L 130 285" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="277" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="52" y="263" width="78" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="91" y="282" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">r++</text>
  <text x="91" y="298" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">扩窗</text>

  <path d="M 91 263 L 91 120 L 183 120" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- yes: return -->
  <path d="M 285 314 L 285 338" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="297" y="332" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="180" y="342" width="210" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="285" y="362" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">返回 ans</text>
  <text x="285" y="380" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">（ans 仍为 ∞ 则返回 −1）</text>
</svg>
