<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：计数大写字母，三分支判定</text>

  <!-- Start node -->
  <ellipse cx="260" cy="62" rx="110" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="12" fill="#333">开始: cnt = 0, n = len(word)</text>

  <path d="M 260 82 L 260 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop decision: i < n ? -->
  <polygon points="260,104 380,150 260,196 140,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="146" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>
  <text x="260" y="162" text-anchor="middle" font-size="11" fill="#666">(还有字符)</text>

  <!-- Yes branch down -->
  <path d="M 260 196 L 260 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="210" font-size="11" fill="#82b366">是</text>

  <!-- isupper check -->
  <rect x="170" y="218" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="241" text-anchor="middle" font-size="11.5" fill="#333">word[i] 是大写? cnt++</text>

  <path d="M 260 254 L 260 272" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="210" y="276" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="12" fill="#333">i++</text>

  <!-- loop back to decision -->
  <path d="M 260 306 L 260 312 L 440 312 L 440 150 L 380 150" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="232" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 452 232)">回到循环</text>

  <!-- No branch -> right to verdict -->
  <path d="M 380 150 L 430 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="405" y="142" text-anchor="middle" font-size="11" fill="#b85450">否</text>

  <!-- Verdict diamond: cnt == n ? -->
  <polygon points="470,108 510,150 470,192 430,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="470" y="154" text-anchor="middle" font-size="10.5" fill="#333">cnt==n?</text>

  <!-- Yes (all upper) -> true -->
  <path d="M 470 108 L 470 88 L 360 88" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="98" font-size="10" fill="#4a7a3a">是</text>
  <rect x="280" y="72" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="92" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">true ✓</text>

  <!-- No -> next check: cnt == 0 ? -->
  <path d="M 510 150 L 510 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="516" y="178" font-size="10" fill="#b85450">否</text>

  <!-- can't go below 470 width cleanly; route verdict chain downward on right -->
  <polygon points="470,204 510,246 470,288 430,246" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="470" y="250" text-anchor="middle" font-size="10.5" fill="#333">cnt==0?</text>

  <!-- Yes (all lower) -> true -->
  <path d="M 430 246 L 376 246" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="238" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="296" y="232" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="336" y="252" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">true ✓</text>

  <!-- No -> next check: cnt==1 & first upper ? -->
  <path d="M 470 288 L 470 308" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="302" font-size="10" fill="#b85450">否</text>

  <polygon points="470,312 510,356 470,400 430,356" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="470" y="352" text-anchor="middle" font-size="9.5" fill="#333">cnt==1 且</text>
  <text x="470" y="366" text-anchor="middle" font-size="9.5" fill="#333">首大写?</text>

  <!-- Yes (first cap) -> true -->
  <path d="M 430 356 L 376 356" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="348" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="296" y="342" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="336" y="362" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">true ✓</text>

  <!-- No -> false -->
  <path d="M 470 400 L 470 420" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="414" font-size="10" fill="#b85450">否</text>
  <rect x="428" y="424" width="84" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="470" y="445" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">false ✗</text>

  <!-- left side note -->
  <rect x="30" y="350" width="240" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="150" y="372" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">三次判定覆盖三种合法模式</text>
  <text x="150" y="390" text-anchor="middle" font-size="10.5" fill="#888">cnt == n → 全大写；cnt == 0 → 全小写</text>
  <text x="150" y="402" text-anchor="middle" font-size="10.5" fill="#888">cnt==1 &amp; 首→首字母大写</text>

  <!-- bottom note -->
  <text x="150" y="442" text-anchor="middle" font-size="10.5" fill="#888">一趟遍历计数 O(n)，三个判定短路返回</text>
  <text x="150" y="456" text-anchor="middle" font-size="10.5" fill="#888">最多扫一遍 + 常数次比较</text>
</svg>
