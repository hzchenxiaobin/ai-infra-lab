<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrowL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="560" fill="#fafafa"/>

  <text x="230" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分查找第 k 个缺失数 流程</text>

  <!-- Init -->
  <rect x="70" y="42" width="320" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="64" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">预处理</text>
  <text x="230" y="82" text-anchor="middle" font-size="10.5" fill="#555">missing(idx) = nums[idx] − nums[0] − idx</text>

  <path d="M 230 96 L 230 114" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Pre-check diamond: missing(n-1) < k ? -->
  <polygon points="230,118 360,168 230,218 100,168" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="162" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">missing(n−1) &lt; k ?</text>
  <text x="230" y="180" text-anchor="middle" font-size="10" fill="#777">第 k 个缺失在数组末尾之后？</text>

  <!-- Yes -> direct return -->
  <path d="M 100 168 L 40 168 L 40 236" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="56" y="160" font-size="11" fill="#82b366" font-weight="bold">Yes</text>
  <rect x="4" y="240" width="150" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="79" y="262" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">答案在末尾之后</text>
  <text x="79" y="280" text-anchor="middle" font-size="9.5" fill="#555">return nums[n−1]</text>
  <text x="79" y="292" text-anchor="middle" font-size="9.5" fill="#555">+ k − missing(n−1)</text>

  <!-- No -> binary search init -->
  <path d="M 230 218 L 230 236" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="252" y="234" font-size="11" fill="#b85450" font-weight="bold">No</text>

  <rect x="110" y="240" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="265" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">lo = 0, hi = n − 1</text>

  <path d="M 230 280 L 230 298" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Loop check -->
  <polygon points="230,302 340,344 230,386 120,344" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="340" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">lo &lt; hi ?</text>
  <text x="230" y="358" text-anchor="middle" font-size="10" fill="#777">区间非空？</text>

  <!-- No -> return -->
  <path d="M 340 344 L 400 344 L 400 410" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="358" y="336" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="300" y="414" width="156" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="378" y="436" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">j = lo − 1</text>
  <text x="378" y="452" text-anchor="middle" font-size="9.5" fill="#555">return nums[j]</text>
  <text x="378" y="464" text-anchor="middle" font-size="9.5" fill="#555">+ k − missing(j)</text>

  <!-- Yes down -->
  <path d="M 230 386 L 230 404" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="248" y="400" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- mid compute -->
  <rect x="100" y="408" width="260" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="431" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">mid = lo + (hi − lo) / 2</text>

  <!-- compare diamond -->
  <polygon points="230,452 350,492 230,532 110,492" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="488" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">missing(mid) &lt; k ?</text>
  <text x="230" y="504" text-anchor="middle" font-size="9.5" fill="#777">mid 处缺失数不够 k？</text>

  <!-- < branch: left -->
  <path d="M 110 492 L 60 492 L 60 300 L 120 344" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="70" y="484" font-size="10" fill="#446688" font-weight="bold">Yes</text>
  <text x="64" y="318" font-size="9.5" fill="#446688">lo = mid+1</text>

  <!-- >= branch: right -->
  <path d="M 350 492 L 400 492 L 400 300 L 340 344" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowL)" filter="url(#rough2)"/>
  <text x="370" y="484" font-size="10" fill="#b85450" font-weight="bold">No</text>
  <text x="394" y="318" font-size="9.5" fill="#b85450">hi = mid</text>

  <!-- footer -->
  <text x="230" y="548" text-anchor="middle" font-size="10.5" fill="#888">左闭右开 [lo, hi) 风格二分，找首个 missing ≥ k 的下标，O(log n)</text>
</svg>
