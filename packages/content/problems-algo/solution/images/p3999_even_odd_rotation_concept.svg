<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：E、O 各自独立转圈，最小表示当指纹</text>

  <!-- 原串 aabb 拆分 -->
  <text x="96" y="40" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">下标 0</text>
  <text x="142" y="40" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="188" y="40" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <text x="234" y="40" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>

  <rect x="76" y="44" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="96" y="63" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="122" y="44" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="142" y="63" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="168" y="44" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="188" y="63" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="214" y="44" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="234" y="63" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="34" y="63" text-anchor="end" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">s</text>

  <!-- 拆分箭头 -->
  <path d="M 96 76 L 96 104" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 188 76 L 148 104" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 142 76 L 180 104" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 234 76 L 234 104" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- E 行 -->
  <rect x="76" y="108" width="40" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="96" y="126" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="122" y="108" width="40" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="142" y="126" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">b</text>

  <!-- O 行 -->
  <rect x="180" y="108" width="40" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="126" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="226" y="108" width="40" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="246" y="126" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">b</text>

  <text x="109" y="148" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">E（偶位）</text>
  <text x="213" y="148" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">O（奇位）</text>

  <text x="161" y="168" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">E、O 各自独立循环右移任意位（移位量互不相干）</text>

  <!-- 2x2 拼装表 -->
  <text x="164" y="184" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">O = ab</text>
  <text x="220" y="184" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">O = ba</text>
  <text x="134" y="204" text-anchor="end" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">E = ab</text>
  <text x="134" y="232" text-anchor="end" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">E = ba</text>

  <rect x="140" y="190" width="48" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="208" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">aabb</text>
  <rect x="196" y="190" width="48" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="208" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">abba</text>
  <rect x="140" y="218" width="48" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="236" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">baab</text>
  <rect x="196" y="218" width="48" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="236" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">bbaa</text>

  <text x="178" y="262" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">等价类 = {aabb, abba, baab, bbaa}</text>
  <text x="178" y="278" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">指纹同为 ("ab","ab")：minrot(ab)=minrot(ba)="ab"</text>

  <!-- 右侧面板：等价判定 -->
  <rect x="285" y="40" width="220" height="88" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="60" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">等价判定（观察一）</text>
  <text x="395" y="80" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">s ~ t ⟺ 同长</text>
  <text x="395" y="97" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">∧ E_s ≅ E_t（互为循环移位）</text>
  <text x="395" y="114" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">∧ O_s ≅ O_t</text>

  <!-- 右侧面板：指纹与答案 -->
  <rect x="285" y="140" width="220" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="160" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">指纹与答案（观察三）</text>
  <text x="395" y="180" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">指纹 = (minrot(E), minrot(O))</text>
  <text x="395" y="200" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">答案 = 不同指纹的个数</text>

  <!-- 右侧面板：反例警示 -->
  <rect x="285" y="230" width="220" height="72" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="248" text-anchor="middle" font-size="10.5" fill="#a04038" font-weight="bold" filter="url(#rough2)">⚠️ 别对整串做最小表示</text>
  <text x="395" y="265" text-anchor="middle" font-size="9" fill="#a04038" filter="url(#rough2)">"abab"/"baba" 整串互为旋转</text>
  <text x="395" y="280" text-anchor="middle" font-size="9" fill="#a04038" filter="url(#rough2)">但 (E,O) = ("aa","bb") vs ("bb","aa")</text>
  <text x="395" y="295" text-anchor="middle" font-size="9" fill="#a04038" font-weight="bold" filter="url(#rough2)">并不等价！指纹必须拆开算</text>

  <!-- 底部总结 -->
  <rect x="30" y="314" width="470" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="337" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">一句话：奇偶拆分 → 各取字典序最小循环移位当指纹 → 哈希去重，组数 = 不同指纹数</text>
</svg>
