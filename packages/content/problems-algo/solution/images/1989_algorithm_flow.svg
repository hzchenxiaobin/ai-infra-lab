<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：双指针贪心（左→右一次扫描）</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">i 找最左未配对捉人者(team=1)，j 找最左未配对逃跑者(team=0)</text>

  <!-- ===== Init ===== -->
  <rect x="190" y="58" width="180" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="76" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">初始化：i = 0, j = 0, count = 0</text>
  <text x="280" y="92" text-anchor="middle" font-size="10" fill="#555">跳过 team[i]!=1 的 i，跳过 team[j]!=0 的 j</text>

  <path d="M 280 100 L 280 112" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Loop condition ===== -->
  <polygon points="280,116 380,156 280,196 180,156" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="150" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">i &lt; n 且 j &lt; n ?</text>
  <text x="280" y="166" text-anchor="middle" font-size="10" fill="#555">（还有候选）</text>

  <!-- No -> end -->
  <path d="M 380 156 L 430 156" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="150" font-size="10" fill="#888">否</text>
  <rect x="430" y="140" width="100" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="480" y="162" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 count</text>

  <!-- Yes -> distance check -->
  <path d="M 280 196 L 280 208" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="206" font-size="10" fill="#888">是</text>

  <polygon points="280,212 400,252 280,292 160,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">|i − j| ≤ dist ?</text>
  <text x="280" y="262" text-anchor="middle" font-size="10" fill="#555">在捕获范围内？</text>

  <!-- ===== Case A: catch ===== -->
  <path d="M 160 252 L 110 252" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="120" y="246" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="30" y="232" width="80" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="250" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">配对成功</text>
  <text x="70" y="264" text-anchor="middle" font-size="10" fill="#4a7a3a">count++</text>
  <path d="M 70 272 L 70 288" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="30" y="290" width="80" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="70" y="312" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i++, j++</text>

  <!-- ===== Case B/C: not in range ===== -->
  <path d="M 400 252 L 450 252" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="246" font-size="10" fill="#888">否</text>

  <polygon points="480,216 540,252 480,288 420,252" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="480" y="250" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">j &lt; i ?</text>

  <!-- j < i: skip j -->
  <path d="M 420 252 L 380 252" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="384" y="246" font-size="9" fill="#b85450" font-weight="bold">是</text>
  <rect x="300" y="300" width="110" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="355" y="320" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">j 永不可抓</text>
  <text x="355" y="336" text-anchor="middle" font-size="10" fill="#b85450">→ j++（跳过）</text>
  <path d="M 420 288 L 380 300" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- i < j: skip i -->
  <path d="M 540 252 L 540 300" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="546" y="278" font-size="9" fill="#d6a040" font-weight="bold">否</text>
  <rect x="440" y="300" width="110" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="495" y="320" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">i 抓不到人</text>
  <text x="495" y="336" text-anchor="middle" font-size="10" fill="#d6a040">→ i++（跳过）</text>

  <!-- ===== Loop back arrows ===== -->
  <path d="M 70 324 Q 70 360 160 360 Q 230 360 280 196" stroke="#4a7a3a" stroke-width="1.3" fill="none" stroke-dasharray="5 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="100" y="356" font-size="9" fill="#4a7a3a">回到循环</text>

  <path d="M 355 344 Q 355 372 280 372 Q 230 372 230 196" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="5 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 495 344 Q 495 384 280 384 Q 220 384 220 196" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="5 3" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ===== Invariant box ===== -->
  <rect x="30" y="400" width="500" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="48" y="422" font-size="11" fill="#446688" font-weight="bold">贪心正确性关键：</text>
  <text x="48" y="440" font-size="10" fill="#555">跳过的一方「永无机会」——剩余候选都在更右侧，距离只增不减，故丢弃安全；配对时取最左双方不损失后续选择</text>
</svg>
