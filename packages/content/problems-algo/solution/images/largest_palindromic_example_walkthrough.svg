<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 600" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="660" height="600" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：计数 → 配对拼左半 → 选中心 → 拼接（含前导零丢弃）</text>

  <!-- ============ Example 1 ============ -->
  <text x="30" y="58" font-size="13" fill="#446688" font-weight="bold">示例1  num = "444947137"</text>

  <!-- count table -->
  <text x="30" y="82" font-size="11.5" fill="#555">计数：</text>
  <g font-size="12" text-anchor="middle">
    <rect x="78" y="68" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="95" y="86">9</text>
    <text x="95" y="108" font-size="10" fill="#888">cnt=1</text>
    <rect x="114" y="68" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="131" y="86">8</text>
    <text x="131" y="108" font-size="10" fill="#888">0</text>
    <rect x="150" y="68" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="167" y="86" fill="#4a7a3a" font-weight="bold">7</text>
    <text x="167" y="108" font-size="10" fill="#4a7a3a" font-weight="bold">cnt=2</text>
    <rect x="186" y="68" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="203" y="86" fill="#4a7a3a" font-weight="bold">4</text>
    <text x="203" y="108" font-size="10" fill="#4a7a3a" font-weight="bold">cnt=4</text>
    <rect x="222" y="68" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="239" y="86">3</text>
    <text x="239" y="108" font-size="10" fill="#888">cnt=1</text>
    <rect x="258" y="68" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="275" y="86">1</text>
    <text x="275" y="108" font-size="10" fill="#888">cnt=1</text>
  </g>

  <!-- pairs -->
  <text x="30" y="138" font-size="11.5" fill="#555">取对 ⌊cnt/2⌋（9→0）：7 取 1 对、4 取 2 对，余 0 对</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="146" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="45" y="167">7</text>
    <rect x="62" y="146" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="77" y="167">4</text>
    <rect x="94" y="146" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="109" y="167">4</text>
    <text x="140" y="167" font-size="11.5" fill="#4a7a3a">left = "744"，首 '7' 非零 → 保留</text>
  </g>

  <!-- center -->
  <text x="30" y="196" font-size="11.5" fill="#555">中心：奇计数（9,3,1）中最大 = 9 → center = "9"</text>

  <!-- assemble -->
  <path d="M 100 204 L 100 226" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <g font-size="14" text-anchor="middle" font-weight="bold">
    <rect x="30" y="232" width="30" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="45" y="254">7</text>
    <rect x="62" y="232" width="30" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="77" y="254">4</text>
    <rect x="94" y="232" width="30" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="109" y="254">4</text>
    <rect x="126" y="232" width="30" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="141" y="254" fill="#b8860b">9</text>
    <rect x="158" y="232" width="30" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="173" y="254">4</text>
    <rect x="190" y="232" width="30" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="205" y="254">4</text>
    <rect x="222" y="232" width="30" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="237" y="254">7</text>
    <text x="270" y="254" font-size="12.5" fill="#4a7a3a">→ "7449447" ✅</text>
  </g>

  <line x1="20" y1="290" x2="640" y2="290" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- ============ Example 2 ============ -->
  <text x="30" y="318" font-size="13" fill="#b85450" font-weight="bold">示例2  num = "00009"</text>

  <!-- count table -->
  <text x="30" y="342" font-size="11.5" fill="#555">计数：</text>
  <g font-size="12" text-anchor="middle">
    <rect x="78" y="330" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="98" y="348">9</text>
    <text x="98" y="370" font-size="10" fill="#446688" font-weight="bold">cnt=1</text>
    <rect x="122" y="330" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="142" y="348" fill="#b85450" font-weight="bold">0</text>
    <text x="142" y="370" font-size="10" fill="#b85450" font-weight="bold">cnt=4</text>
  </g>

  <!-- pairs -->
  <text x="30" y="396" font-size="11.5" fill="#555">取对：9 取 0 对、0 取 2 对 → left = "00"</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="404" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="45" y="425" fill="#b85450">0</text>
    <rect x="62" y="404" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="77" y="425" fill="#b85450">0</text>
    <text x="108" y="425" font-size="11.5" fill="#b85450" font-weight="bold">首 '0'！无非零配对 → 丢弃</text>
  </g>

  <!-- discard arrow -->
  <path d="M 92 438 L 92 462" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="160" y="454" font-size="11" fill="#b85450" font-weight="bold">left = ""（含前导零非法）</text>

  <!-- center only -->
  <text x="30" y="486" font-size="11.5" fill="#555">中心：cnt[9]=1 奇 → center = "9"</text>
  <g font-size="14" text-anchor="middle" font-weight="bold">
    <rect x="30" y="496" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="50" y="519" fill="#b8860b">9</text>
    <text x="90" y="519" font-size="12.5" fill="#4a7a3a">res = "" + "9" + "" = "9" ✅</text>
  </g>

  <!-- takeaway box -->
  <rect x="360" y="316" width="288" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="504" y="342" text-anchor="middle" font-size="13" fill="#b8860b" font-weight="bold">对比要点</text>
  <text x="374" y="366" font-size="11.5" fill="#555">示例1：有非零配对（7,4）→</text>
  <text x="386" y="382" font-size="11" fill="#4a7a3a">左半首字符非零，配对全保留</text>
  <text x="374" y="402" font-size="11.5" fill="#555">示例2：无非零配对，只有 0 对 →</text>
  <text x="386" y="418" font-size="11" fill="#b85450">左半首 '0'，整段丢弃，只留中心</text>
</svg>
