<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：tiv_2015 重复性 + (lat,lon) 唯一性，两个子查询 AND 过滤</text>

  <!-- Insurance table (left) -->
  <text x="125" y="52" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">Insurance（原始表）</text>
  <rect x="20" y="58" width="210" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="38" y="75" font-size="9" fill="#333">pid</text>
  <text x="78" y="75" font-size="9" fill="#d6a040">tiv_15</text>
  <text x="120" y="75" font-size="9" fill="#b85450">tiv_16</text>
  <text x="158" y="75" font-size="9" fill="#4a7a3a">lat</text>
  <text x="195" y="75" font-size="9" fill="#446688">lon</text>

  <!-- Row pid=1 (winner) -->
  <rect x="20" y="84" width="210" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="38" y="99" font-size="9.5" fill="#b85450" font-weight="bold">1</text>
  <text x="78" y="99" font-size="9.5" fill="#d6a040" font-weight="bold">10</text>
  <text x="120" y="99" font-size="9.5" fill="#b85450" font-weight="bold">5</text>
  <text x="158" y="99" font-size="9.5" fill="#4a7a3a" font-weight="bold">10</text>
  <text x="195" y="99" font-size="9.5" fill="#446688" font-weight="bold">10</text>

  <!-- Row pid=2 (excluded) -->
  <rect x="20" y="106" width="210" height="22" fill="#f5f5f5" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="38" y="121" font-size="9.5" fill="#888">2</text>
  <text x="78" y="121" font-size="9.5" fill="#888">20</text>
  <text x="120" y="121" font-size="9.5" fill="#888">20</text>
  <text x="158" y="121" font-size="9.5" fill="#888">20</text>
  <text x="195" y="121" font-size="9.5" fill="#888">20</text>

  <!-- Row pid=3 (excluded) -->
  <rect x="20" y="128" width="210" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="38" y="143" font-size="9.5" fill="#d6a040" font-weight="bold">3</text>
  <text x="78" y="143" font-size="9.5" fill="#d6a040" font-weight="bold">10</text>
  <text x="120" y="143" font-size="9.5" fill="#888">30</text>
  <text x="158" y="143" font-size="9.5" fill="#4a7a3a" font-weight="bold">20</text>
  <text x="195" y="143" font-size="9.5" fill="#446688" font-weight="bold">20</text>

  <!-- Row pid=4 (winner) -->
  <rect x="20" y="150" width="210" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="38" y="165" font-size="9.5" fill="#b85450" font-weight="bold">4</text>
  <text x="78" y="165" font-size="9.5" fill="#d6a040" font-weight="bold">10</text>
  <text x="120" y="165" font-size="9.5" fill="#b85450" font-weight="bold">40</text>
  <text x="158" y="165" font-size="9.5" fill="#4a7a3a" font-weight="bold">40</text>
  <text x="195" y="165" font-size="9.5" fill="#446688" font-weight="bold">40</text>

  <text x="125" y="188" text-anchor="middle" font-size="9" fill="#888">↑ 红=入选 橙=半入选 灰=排除</text>

  <!-- Condition 1: GROUP BY tiv_2015 (top right) -->
  <text x="430" y="52" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">条件① tiv_2015 有同伴</text>
  <rect x="280" y="58" width="300" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="295" y="76" font-size="9" fill="#666">GROUP BY tiv_2015</text>
  <text x="295" y="90" font-size="9" fill="#666">HAVING COUNT(*) &gt; 1</text>
  <text x="430" y="108" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">白名单 A = {10}</text>

  <!-- arrow from table to cond1 -->
  <path d="M232 95 L278 86" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Condition 2: GROUP BY lat,lon (bottom right) -->
  <text x="430" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">条件② (lat,lon) 位置唯一</text>
  <rect x="280" y="138" width="300" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="295" y="156" font-size="9" fill="#666">GROUP BY lat, lon</text>
  <text x="295" y="170" font-size="9" fill="#666">HAVING COUNT(*) = 1</text>
  <text x="430" y="188" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">白名单 B = {(10,10), (40,40)}</text>

  <!-- arrow from table to cond2 -->
  <path d="M232 139 L278 148" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- AND intersection -->
  <rect x="280" y="210" width="300" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="230" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">WHERE tiv_2015 IN A AND (lat,lon) IN B</text>
  <text x="430" y="246" text-anchor="middle" font-size="10" fill="#b85450">命中行：pid 1 + pid 4</text>

  <!-- arrow down to sum -->
  <path d="M430 256 L430 282" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="450" y="274" font-size="9" fill="#b85450">SUM + ROUND</text>

  <!-- Result box -->
  <rect x="310" y="288" width="240" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="430" y="308" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ROUND(SUM(tiv_2016), 2)</text>
  <text x="430" y="326" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">= 45.00</text>

  <!-- Two-dimension note -->
  <rect x="40" y="355" width="540" height="85" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="377" font-size="11" fill="#333" font-weight="bold">💡 两个分组维度相互独立</text>
  <text x="60" y="395" font-size="9.5" fill="#666">条件①按 tiv_2015 分组（查重复性），条件②按 (lat,lon) 分组（查唯一性）——</text>
  <text x="60" y="409" font-size="9.5" fill="#666">分组键完全不同，两个子查询各自独立产出白名单，外层 AND 取交集。</text>
  <text x="60" y="425" font-size="9.5" fill="#b85450">切勿用 GROUP BY tiv_2015, lat, lon 合并——会把分组粒度切得太细，COUNT 语义改变。</text>
</svg>
