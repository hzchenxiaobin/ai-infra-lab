<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n=6, 时间戳取末 4 位 (MMDD)</text>

  <!-- table header -->
  <rect x="24" y="48" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步骤</text>
  <rect x="80" y="48" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">时间</text>
  <rect x="150" y="48" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">好友对</text>
  <rect x="230" y="48" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">count</text>
  <rect x="300" y="48" width="216" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="408" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">操作说明</text>

  <!-- row init -->
  <rect x="24" y="74" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="52" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">init</text>
  <rect x="80" y="74" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="115" y="92" text-anchor="middle" font-size="11" fill="#888">—</text>
  <rect x="150" y="74" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="190" y="92" text-anchor="middle" font-size="11" fill="#888">—</text>
  <rect x="230" y="74" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="265" y="92" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <rect x="300" y="74" width="216" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="408" y="92" text-anchor="middle" font-size="10.5" fill="#666">各自为根</text>

  <!-- row 1: 0101 (0,1) -->
  <rect x="24" y="102" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="52" y="120" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">①</text>
  <rect x="80" y="102" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="115" y="120" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0101</text>
  <rect x="150" y="102" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="190" y="120" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(0,1)</text>
  <rect x="230" y="102" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="265" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">5</text>
  <rect x="300" y="102" width="216" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="408" y="120" text-anchor="middle" font-size="10.5" fill="#4a7a3a">union, parent[1]=0</text>

  <!-- row 2: 0104 (3,4) -->
  <rect x="24" y="130" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="52" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">②</text>
  <rect x="80" y="130" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="115" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0104</text>
  <rect x="150" y="130" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="190" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(3,4)</text>
  <rect x="230" y="130" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="265" y="148" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="300" y="130" width="216" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="408" y="148" text-anchor="middle" font-size="10.5" fill="#4a7a3a">union, parent[4]=3</text>

  <!-- row 3: 0107 (2,3) -->
  <rect x="24" y="158" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="52" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">③</text>
  <rect x="80" y="158" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="115" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0107</text>
  <rect x="150" y="158" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="190" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(2,3)</text>
  <rect x="230" y="158" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="265" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="300" y="158" width="216" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="408" y="176" text-anchor="middle" font-size="10.5" fill="#4a7a3a">union, parent[2]=3</text>

  <!-- row 4: 0211 (1,5) -->
  <rect x="24" y="186" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="52" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④</text>
  <rect x="80" y="186" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="115" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0211</text>
  <rect x="150" y="186" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="190" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(1,5)</text>
  <rect x="230" y="186" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="265" y="204" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="300" y="186" width="216" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="408" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a">find(1)=0, union, parent[5]=0</text>

  <!-- row 5: 0224 (2,4) skip -->
  <rect x="24" y="214" width="56" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="52" y="232" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">⑤</text>
  <rect x="80" y="214" width="70" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="115" y="232" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">0224</text>
  <rect x="150" y="214" width="80" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="190" y="232" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">(2,4)</text>
  <rect x="230" y="214" width="70" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="265" y="232" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">2</text>
  <rect x="300" y="214" width="216" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="408" y="232" text-anchor="middle" font-size="10" fill="#888">find(2)=3=find(4) → 跳过</text>

  <!-- row 6: 0301 (0,3) return -->
  <rect x="24" y="242" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="52" y="260" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⑥</text>
  <rect x="80" y="242" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="260" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0301</text>
  <rect x="150" y="242" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="260" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">(0,3)</text>
  <rect x="230" y="242" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="265" y="260" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1 ⭐</text>
  <rect x="300" y="242" width="216" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="408" y="260" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">union → count=1 → 返回</text>

  <!-- result box -->
  <rect x="24" y="280" width="492" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="304" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">返回 20190301 ⭐ 全员连通的最早时刻</text>

  <!-- graph: final connected component -->
  <text x="270" y="336" text-anchor="middle" font-size="11" fill="#888">0301 合并后：6 人同属一个集合（0—1—5 与 2—3—4 两群合一）</text>

  <!-- left cluster 0-1-5 -->
  <circle cx="120" cy="372" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="376" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <circle cx="180" cy="372" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="376" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <circle cx="150" cy="340" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="344" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <line x1="136" y1="368" x2="164" y2="368" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="126" y1="356" x2="144" y2="356" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <!-- right cluster 2-3-4 -->
  <circle cx="300" cy="372" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="376" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <circle cx="360" cy="372" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="376" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <circle cx="330" cy="340" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="344" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <line x1="316" y1="368" x2="344" y2="368" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="346" y1="356" x2="330" y2="356" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <!-- bridging edge (0,3) red -->
  <path d="M 196 372 Q 258 352 284 372" stroke="#b85450" stroke-width="2.5" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="240" y="348" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">(0,3)</text>

  <rect x="40" y="384" width="460" height="12" fill="none" stroke="none"/>
  <text x="270" y="394" text-anchor="middle" font-size="10" fill="#444">注意 0224 的 (2,4) 因 2、4 已同根被跳过，未减少分量</text>
</svg>
