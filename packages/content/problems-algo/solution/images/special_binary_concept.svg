<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="480" fill="#fafafa"/>
  <text x="380" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：特殊二进制串 = 平衡括号（1 当 '('，0 当 ')'），递归分解后降序拼接</text>

  <!-- ===== LEFT: 平衡括号视角 ===== -->
  <rect x="24" y="48" width="352" height="240" fill="#eef3fb" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="200" y="74" text-anchor="middle" font-size="13" fill="#34506e" font-weight="bold">① 特殊二进制串 = 平衡括号串</text>

  <!-- string boxes 1 1 0 1 1 0 0 0 -->
  <text x="40" y="104" font-size="11" fill="#888">s = "11011000"</text>
  <g font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
    <rect x="72" y="108" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="87" y="128">1</text>
    <rect x="104" y="108" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="119" y="128">1</text>
    <rect x="136" y="108" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="151" y="128">0</text>
    <rect x="168" y="108" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="183" y="128">1</text>
    <rect x="200" y="108" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="215" y="128">1</text>
    <rect x="232" y="108" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="247" y="128">0</text>
    <rect x="264" y="108" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="279" y="128">0</text>
    <rect x="296" y="108" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="311" y="128">0</text>
  </g>

  <!-- parenthesis mapping row -->
  <text x="40" y="160" font-size="11" fill="#888">括号视角：</text>
  <g font-size="16" font-weight="bold" text-anchor="middle" fill="#446688">
    <text x="87" y="162">(</text>
    <text x="119" y="162">(</text>
    <text x="151" y="162" fill="#d6a040">)</text>
    <text x="183" y="162">(</text>
    <text x="215" y="162">(</text>
    <text x="247" y="162" fill="#d6a040">)</text>
    <text x="279" y="162" fill="#d6a040">)</text>
    <text x="311" y="162" fill="#d6a040">)</text>
  </g>

  <!-- property notes -->
  <rect x="40" y="178" width="320" height="48" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.2" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <text x="56" y="196" font-size="11" fill="#7a5415">性质 1：0 的个数 = 1 的个数（左右括号等量）</text>
  <text x="56" y="214" font-size="11" fill="#7a5415">性质 2：任意前缀 1 数 ≥ 0 数（合法括号）</text>

  <text x="200" y="270" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⇒ 必以 1 开头、以 0 结尾，且可递归嵌套</text>

  <!-- ===== RIGHT: 相邻特殊子串交换 + 递归降序 ===== -->
  <rect x="392" y="48" width="344" height="240" fill="#eef6ef" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="564" y="74" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">② 相邻特殊子串可任意交换</text>

  <text x="408" y="104" font-size="11" fill="#888">内层 "101100" 拆成两个相邻特殊子串：</text>

  <!-- chunk 10 -->
  <rect x="424" y="116" width="22" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="435" y="134" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="446" y="116" width="22" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="457" y="134" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="478" y="134" font-size="11" fill="#888">"10"</text>

  <!-- swap arrow -->
  <path d="M 512 110 Q 540 100 568 110" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 568 142 Q 540 152 512 142" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="540" y="96" text-anchor="middle" font-size="10" fill="#b85450">swap</text>

  <!-- chunk 1100 -->
  <rect x="580" y="116" width="22" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="591" y="134" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="602" y="116" width="22" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="613" y="134" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="624" y="116" width="22" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="635" y="134" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="646" y="116" width="22" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="657" y="134" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="678" y="134" font-size="11" fill="#888">"1100"</text>

  <!-- after swap -->
  <text x="408" y="172" font-size="11" fill="#888">交换后 → "1100" + "10" = "110010"（更大）</text>
  <rect x="424" y="184" width="88" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="468" y="200" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">1100</text>
  <text x="518" y="200" font-size="11" fill="#888">+</text>
  <rect x="530" y="184" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="552" y="200" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">10</text>

  <!-- recursive idea -->
  <rect x="408" y="220" width="312" height="56" fill="#fdecee" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="424" y="240" font-size="11" fill="#b85450" font-weight="bold">递归：每个子串内部同样分解+排序</text>
  <text x="424" y="256" font-size="11" fill="#7a5a5a">相邻交换可生成任意排列 → 直接降序排</text>
  <text x="424" y="270" font-size="11" fill="#7a5a5a">整体最大 = 各子串最大后按字典序降序拼接</text>

  <!-- ===== BOTTOM: 嵌套分解树 ===== -->
  <rect x="24" y="304" width="712" height="160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="380" y="328" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">③ 嵌套分解树：外层 1…0 包裹，内层切成若干特殊子串</text>

  <!-- root node: 11011000 -->
  <rect x="312" y="342" width="136" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="380" y="362" text-anchor="middle" font-size="12" fill="#34506e" font-weight="bold">1 · "101100" · 0</text>

  <!-- branches to two inner chunks -->
  <path d="M 348 372 L 220 398" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 412 372 L 540 398" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- leaf 10 -->
  <rect x="180" y="398" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="220" y="416" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">"10"</text>
  <text x="220" y="440" text-anchor="middle" font-size="10" fill="#888">叶子（最内层）</text>

  <!-- inner node 1100 -> wraps "10" -->
  <rect x="500" y="398" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="560" y="416" text-anchor="middle" font-size="12" fill="#34506e" font-weight="bold">1 · "10" · 0 = "1100"</text>
  <path d="M 560 426 L 560 442" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="528" y="446" width="64" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="560" y="461" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">"10"</text>

  <text x="380" y="464" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">自底向上：先最大化各子串 → 同层按降序拼接 → 包回 1…0</text>
</svg>
