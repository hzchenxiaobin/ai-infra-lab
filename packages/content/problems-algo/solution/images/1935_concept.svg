<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：破损字母入集合，逐字符 O(1) 判定</text>

  <!-- Top: brokenLetters -> broken set -->
  <rect x="40" y="52" width="170" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="125" y="74" text-anchor="middle" font-size="12.5" fill="#333">brokenLetters = "ad"</text>

  <path d="M 212 69 L 238 69" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="242" y="52" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="317" y="74" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">broken = { a, d }</text>

  <!-- dashed link from set down to word area -->
  <path d="M 317 86 L 317 132" stroke="#aaa" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="325" y="112" font-size="10.5" fill="#888">用于逐字符判定</text>

  <!-- text line -->
  <text x="40" y="126" font-size="12.5" fill="#555" font-weight="bold">text = "hello world"</text>

  <!-- Word 1: hello -->
  <text x="58" y="162" font-size="11" fill="#666">单词1</text>
  <rect x="110" y="140" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="125" y="160" text-anchor="middle" font-size="13" fill="#333">h</text>
  <rect x="140" y="140" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="155" y="160" text-anchor="middle" font-size="13" fill="#333">e</text>
  <rect x="170" y="140" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="185" y="160" text-anchor="middle" font-size="13" fill="#333">l</text>
  <rect x="200" y="140" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="215" y="160" text-anchor="middle" font-size="13" fill="#333">l</text>
  <rect x="230" y="140" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="245" y="160" text-anchor="middle" font-size="13" fill="#333">o</text>

  <path d="M 262 155 L 286 155" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="288" y="140" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="378" y="160" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">全不在 broken → 可输入 ✓</text>

  <!-- Word 2: world -->
  <text x="58" y="212" font-size="11" fill="#666">单词2</text>
  <rect x="110" y="190" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="125" y="210" text-anchor="middle" font-size="13" fill="#333">w</text>
  <rect x="140" y="190" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="155" y="210" text-anchor="middle" font-size="13" fill="#333">o</text>
  <rect x="170" y="190" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="185" y="210" text-anchor="middle" font-size="13" fill="#333">r</text>
  <rect x="200" y="190" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="215" y="210" text-anchor="middle" font-size="13" fill="#333">l</text>
  <rect x="230" y="190" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="245" y="210" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">d</text>

  <path d="M 262 205 L 286 205" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="288" y="190" width="180" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="378" y="210" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">d ∈ broken → 不可输入 ✗</text>

  <!-- Divider -->
  <path d="M 40 248 L 520 248" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ans -->
  <rect x="150" y="258" width="260" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="279" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">ans = 1（只数可输入的单词）</text>

  <!-- Notes -->
  <text x="40" y="316" font-size="11" fill="#555">• brokenLetters 入哈希集合，字符判定 O(1)，O(W·L·B) → O(n)</text>
  <text x="40" y="336" font-size="11" fill="#555">• 单词中发现破损字符即不可输入，可提前终止该单词扫描</text>
  <text x="40" y="356" font-size="11" fill="#555">• 字母固定 26 个，可用布尔数组 broken[26] 替代哈希集合</text>
  <text x="40" y="376" font-size="11" fill="#555">• brokenLetters 为空 → 集合空 → 所有单词均可输入</text>
</svg>
