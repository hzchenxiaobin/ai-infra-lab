<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：排序子序列 =「1 只右移、0 只左移」</text>

  <!-- s 行 -->
  <text x="58" y="61" text-anchor="end" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">s</text>
  <rect x="70" y="42" width="52" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="96" y="62" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="122" y="42" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="148" y="62" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="174" y="42" width="52" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="62" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="226" y="42" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="252" y="62" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- 1 右移箭头 -->
  <path d="M 96 76 C 100 102, 196 94, 200 118" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 200 76 C 206 102, 250 94, 252 118" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="132" y="98" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">第 1 个 1 右移</text>
  <text x="238" y="112" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">第 2 个 1 右移</text>

  <!-- t 行 -->
  <text x="58" y="141" text-anchor="end" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">t</text>
  <rect x="70" y="122" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="96" y="142" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="122" y="122" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="148" y="142" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="174" y="122" width="52" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="142" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="226" y="122" width="52" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="252" y="142" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 前缀 1 数对比 -->
  <text x="58" y="172" text-anchor="end" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">prefS</text>
  <text x="96" y="172" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="148" y="172" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="200" y="172" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="252" y="172" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="58" y="188" text-anchor="end" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">prefT</text>
  <text x="96" y="188" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">0</text>
  <text x="148" y="188" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">0</text>
  <text x="200" y="188" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="252" y="188" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">2</text>
  <text x="96" y="204" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="148" y="204" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="200" y="204" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="252" y="204" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="164" y="222" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">每列 prefT ≤ prefS，且总数 2 = 2 ⇒ t 可达</text>

  <!-- 右侧判定面板 -->
  <rect x="308" y="36" width="200" height="78" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="408" y="54" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">判定：t 可达 当且仅当</text>
  <text x="408" y="71" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">① ones(t) = ones(s)</text>
  <text x="408" y="86" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">② 每个前缀 prefT[i] ≤ prefS[i]</text>
  <text x="408" y="104" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">（① 任何操作都不改 1 的总数）</text>

  <rect x="308" y="122" width="200" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="408" y="140" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">为什么条件必要？</text>
  <text x="408" y="156" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">排序子序列 = 选中位置内部「0 前 1 后」</text>
  <text x="408" y="172" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">⇒ 任何前缀边界内的 1 数只减不增</text>
  <text x="408" y="188" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">（放回左边界的是选中值中最小的几个）</text>

  <!-- 一次操作演示 -->
  <text x="180" y="240" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">一次操作现场：对 s 选子序列 {0, 2, 3}（橙框格）</text>

  <rect x="70" y="248" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="90" y="266" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="112" y="248" width="40" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="132" y="266" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">0</text>
  <rect x="154" y="248" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="174" y="266" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="196" y="248" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="216" y="266" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">0</text>

  <path d="M 244 258 L 316 258" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">排序</text>
  <text x="280" y="276" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">[1,1,0]→[0,1,1]</text>

  <rect x="330" y="248" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="350" y="266" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="372" y="248" width="40" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="392" y="266" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">0</text>
  <rect x="414" y="248" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="434" y="266" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="456" y="248" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="476" y="266" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="413" y="290" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">= t，一步到位 ✓</text>

  <!-- 等价刻画 -->
  <rect x="40" y="300" width="468" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="274" y="317" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">等价刻画：把 s 与 t 的 1 按出现顺序配对，第 j 个 1 只能原地或右移（0 对应左移）</text>
  <text x="274" y="334" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">反之两条件满足时，反复挑「1 前 0 后」的两个位置排序交换（冒泡构造）即可变成 t</text>
</svg>
