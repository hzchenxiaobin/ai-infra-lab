<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9db4c9"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 逐组「先赋值、再入堆」→ 循环推进</text>

  <rect x="150" y="32" width="220" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="50" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">按 nums1 升序排序下标 order</text>
  <path d="M 260 60 L 260 70" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <rect x="140" y="74" width="240" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="92" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">取相等 nums1 的一段下标区间 [i, j)</text>
  <path d="M 260 102 L 260 112" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <rect x="130" y="116" width="260" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="134" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">① 组内统一赋值：ans[order[t]] = sum</text>
  <path d="M 260 144 L 260 154" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>

  <rect x="130" y="158" width="260" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="176" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">② 组内逐个取值 v = nums2[order[t]]</text>
  <path d="M 260 186 L 260 198" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>

  <polygon points="260,202 330,228 260,254 190,228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="232" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">堆大小 &lt; k ?</text>
  <path d="M 330 228 L 354 228" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="342" y="220" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 260 254 L 260 266" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="268" y="264" font-size="9" fill="#55677d" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="358" y="213" width="132" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="424" y="226" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">直接入堆</text>
  <text x="424" y="238" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">sum += v</text>

  <polygon points="260,270 330,296 260,322 190,296" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">v &gt; 堆顶 ?</text>
  <path d="M 330 296 L 354 296" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <text x="342" y="288" text-anchor="middle" font-size="9" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 190 296 L 158 296" stroke="#9db4c9" stroke-width="2" marker-end="url(#arrK)" fill="none" filter="url(#rough2)"/>
  <text x="176" y="288" font-size="9" fill="#55677d" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="152" y="300" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">忽略 v</text>

  <rect x="358" y="281" width="132" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="424" y="294" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">换血：弹堆顶、入 v</text>
  <text x="424" y="306" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">sum += v − 旧堆顶</text>

  <path d="M 260 322 L 260 330" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="266" y="331" font-size="8.5" fill="#55677d" filter="url(#rough2)">组内值取完</text>

  <rect x="160" y="334" width="200" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">本组处理完：i = j 前进</text>

  <path d="M 160 348 L 96 348 L 96 88 L 134 88" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="152" y="340" text-anchor="end" font-size="8.5" fill="#55677d" filter="url(#rough2)">还有剩余组</text>

  <path d="M 360 348 L 382 348" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="371" y="341" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">i = n</text>
  <rect x="386" y="334" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="436" y="352" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <path d="M 424 213 L 424 172 L 394 172" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="448" y="168" font-size="8.5" fill="#4a6b3f" filter="url(#rough2)">下一个 v</text>
  <path d="M 490 296 L 502 296 L 502 184 L 394 184" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="512" y="240" font-size="8.5" fill="#4a6b3f" filter="url(#rough2)" transform="rotate(-90 512 240)">下一个 v</text>

  <g filter="url(#rough2)">
    <rect x="40" y="374" width="460" height="22" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" stroke-dasharray="5 3" rx="8"/>
    <text x="270" y="389" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold">每组固定「先统一赋值、再统一入堆」——相等值互不可见、自己也选不到自己</text>
  </g>
</svg>
