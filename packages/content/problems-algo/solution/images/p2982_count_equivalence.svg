<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">计数等价：长度 x 的特殊子串出现次数 = #{ len[i] ≥ x }</text>

  <!-- left: sliding occurrences in a run -->
  <text x="130" y="58" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">游程 "aaaa"（L=4）里找 "aa"（x=2）</text>

  <g filter="url(#rough2)">
    <!-- three windows over 4 cells -->
    <rect x="70" y="72" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="110" y="72" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="150" y="72" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="190" y="72" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="90" y="92" text-anchor="middle" font-size="13" fill="#333">a</text>
    <text x="130" y="92" text-anchor="middle" font-size="13" fill="#333">a</text>
    <text x="170" y="92" text-anchor="middle" font-size="13" fill="#333">a</text>
    <text x="210" y="92" text-anchor="middle" font-size="13" fill="#333">a</text>

    <!-- window 1 -->
    <rect x="70" y="112" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <text x="110" y="130" text-anchor="middle" font-size="11" fill="#8a6d3b">①aa</text>
    <!-- window 2 -->
    <rect x="70" y="144" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <text x="150" y="162" text-anchor="middle" font-size="11" fill="#8a6d3b">② a aa</text>
    <!-- window 3 -->
    <rect x="110" y="176" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <text x="190" y="194" text-anchor="middle" font-size="11" fill="#8a6d3b">③ aa a</text>
  </g>

  <rect x="60" y="212" width="200" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="232" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">重叠出现 L−x+1 = 3 次</text>

  <!-- right: len >= x count -->
  <text x="390" y="58" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">同一游程的 len 值：1, 2, 3, 4</text>

  <g filter="url(#rough2)">
    <rect x="310" y="72" width="40" height="30" fill="#f2f2f2" stroke="#999" stroke-width="1.5" rx="4"/>
    <rect x="350" y="72" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="390" y="72" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="430" y="72" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="330" y="92" text-anchor="middle" font-size="13" fill="#888">1</text>
    <text x="370" y="92" text-anchor="middle" font-size="13" fill="#333">2</text>
    <text x="410" y="92" text-anchor="middle" font-size="13" fill="#333">3</text>
    <text x="450" y="92" text-anchor="middle" font-size="13" fill="#333">4</text>
    <text x="330" y="116" text-anchor="middle" font-size="10" fill="#b85450">&lt;2 ✗</text>
    <text x="410" y="116" text-anchor="middle" font-size="10" fill="#4a7a3a">≥ 2 的恰好 3 个 ✓</text>
  </g>

  <rect x="300" y="132" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="152" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">#{ len ≥ 2 } = 3 次</text>

  <!-- equals sign -->
  <text x="262" y="180" text-anchor="middle" font-size="26" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">=</text>

  <!-- formula box -->
  <rect x="60" y="254" width="400" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="273" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">字符 c 的长度 x 特殊子串总出现次数</text>
  <text x="260" y="291" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">= Σ max(0, L_i − x + 1) = #{ i : s[i]=c 且 len[i] ≥ x }</text>

  <!-- monotonic note -->
  <rect x="40" y="312" width="440" height="52" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">x 增大 ⇒ 出现次数不增（单调性）⇒「出现 ≥3 次」的 x 是一段前缀：</text>
  <text x="260" y="352" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">x 可行 ⟺ x ≤ 该字符 len 值的第三大 —— 这正是只维护前三大的原因</text>
</svg>
