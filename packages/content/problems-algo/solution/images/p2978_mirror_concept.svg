<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：镜像 = 沿 y = x 翻转 —— 对角线坐标要「两行」才算对称</text>

  <!-- 左侧：坐标平面草图 -->
  <!-- y 轴 -->
  <path d="M 70 300 L 70 70" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="58" y="66" font-size="12" fill="#555" filter="url(#rough2)">y</text>
  <!-- x 轴 -->
  <path d="M 55 285 L 295 285" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="298" y="290" font-size="12" fill="#555" filter="url(#rough2)">x</text>
  <!-- 对角线 y = x（虚线） -->
  <path d="M 75 280 L 270 95" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="262" y="88" font-size="11.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">y = x</text>

  <!-- 非对角镜像点对 -->
  <circle cx="110" cy="150" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="68" y="140" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">(20, 21)</text>
  <circle cx="200" cy="235" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="208" y="252" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">(21, 20)</text>
  <!-- 镜像箭头（穿过对角线） -->
  <path d="M 118 160 C 155 190, 168 205, 190 226" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="122" y="215" font-size="10.5" fill="#446688" filter="url(#rough2)">互为镜像（两列交换）</text>

  <!-- 对角线两点（同一值两行） -->
  <circle cx="143" cy="215" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="157" cy="202" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 120 186 C 130 194, 136 200, 142 208" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="46" y="178" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">两行 (20,20)×2 ✓</text>
  <text x="46" y="192" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">两行互为镜像 ⇒ 对称</text>

  <!-- 对角线单点（不自配） -->
  <circle cx="196" cy="165" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 224 172 C 216 170, 210 168, 204 167" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="228" y="168" font-size="11" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">单行 (30,30)×1 ✗</text>
  <text x="228" y="182" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">一行 ≠ 一对，不能自配</text>

  <!-- 右侧：三类判定说明框 -->
  <rect x="322" y="50" width="176" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="410" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">非对角 x &lt; y</text>
  <text x="410" y="89" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">值 (x,y) 与 (y,x) 都在表中</text>
  <text x="410" y="108" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">⇒ 对称，输出 (min, max)</text>

  <rect x="322" y="138" width="176" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="410" y="158" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">对角 x = y</text>
  <text x="410" y="177" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">值 (x,x) 至少出现两行</text>
  <text x="410" y="196" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">⇒ 对称，只输出一次</text>

  <rect x="322" y="226" width="176" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="410" y="248" text-anchor="middle" font-size="12" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">单行 (x, x)</text>
  <text x="410" y="268" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">找不到伴 ⇒ 不算对称 ✗</text>

  <!-- 底部统一公式 -->
  <rect x="36" y="304" width="462" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="267" y="322" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">统一判定：#rows(x,y) + #rows(y,x) ≥ 2（数的是行，不是值）</text>
  <text x="267" y="340" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">再取 x ≤ y 的代表 + DISTINCT 去重 ⇒ 每对恰好输出一行</text>
</svg>
