<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一趟位扫描，O(n) 定位第 k 个字符</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">n = operations.length ≤ 100；先减一转 0-indexed，再逐位判定，最后 mod 26</text>

  <!-- 主流程 -->
  <rect x="55" y="50" width="210" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="69" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">输入 k（1-indexed）与 operations</text>
  <path d="M 160 80 L 160 90" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="55" y="92" width="210" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="106" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">k ← k − 1；shift ← 0</text>
  <text x="160" y="119" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">（0-indexed 是位判断的地基）</text>
  <path d="M 160 126 L 160 132" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 1 -->
  <polygon points="160,134 240,156 160,178 80,156" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="151" text-anchor="middle" font-size="10" fill="#8a3833" filter="url(#rough2)">i &lt; n 且</text>
  <text x="160" y="165" text-anchor="middle" font-size="10" fill="#8a3833" filter="url(#rough2)">(k &gt;&gt; i) ≠ 0 ？</text>
  <path d="M 160 178 L 160 190" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="168" y="189" text-anchor="start" font-size="9" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 菱形 2 -->
  <polygon points="160,192 240,214 160,236 80,214" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="209" text-anchor="middle" font-size="10" fill="#8a3833" filter="url(#rough2)">(k &gt;&gt; i) &amp; 1 = 1</text>
  <text x="160" y="223" text-anchor="middle" font-size="10" fill="#8a3833" filter="url(#rough2)">且 op[i] = 1 ？</text>
  <path d="M 160 236 L 160 246" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="168" y="245" text-anchor="start" font-size="9" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="95" y="248" width="130" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="265" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">shift ← shift + 1</text>
  <path d="M 160 274 L 160 284" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="95" y="286" width="130" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="303" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">i ← i + 1</text>

  <!-- 循环回边 -->
  <path d="M 95 299 L 52 299 L 52 156 L 76 156" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="50" y="228" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)" transform="rotate(-90 50 228)">下一个 i</text>

  <!-- 菱形 2 的否：绕过 shift++ 直接到 i++ -->
  <path d="M 240 214 L 262 214 L 262 299 L 229 299" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="246" y="209" text-anchor="start" font-size="9" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 菱形 1 的否：位扫完 → 返回 -->
  <path d="M 240 156 L 285 156 L 285 345 L 261 345" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="289" y="173" text-anchor="start" font-size="9.5" fill="#b85450" filter="url(#rough2)">否（位已扫完）</text>

  <rect x="55" y="332" width="210" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="349" text-anchor="middle" font-size="11" fill="#2f5424" font-weight="bold" filter="url(#rough2)">返回 chr('a' + shift mod 26)</text>

  <!-- 右侧：易错点 -->
  <rect x="305" y="90" width="200" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="315" y="108" text-anchor="start" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">两个易错点</text>
  <text x="315" y="124" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">① k 忘了 −1（1-indexed → 0-indexed）</text>
  <text x="315" y="138" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">② shift 可能超过 25（k &lt; 2⁴⁷）</text>
  <text x="315" y="152" text-anchor="start" font-size="9.5" fill="#b85450" filter="url(#rough2)">→ 必须 mod 26（z 循环回 a）</text>

  <!-- 右侧：位技巧 -->
  <rect x="305" y="180" width="200" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="315" y="198" text-anchor="start" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">位技巧：一行版</text>
  <text x="315" y="215" text-anchor="start" font-size="9.5" fill="#33506b" filter="url(#rough2)">把 op[i]=1 的位压成 mask 后：</text>
  <text x="315" y="231" text-anchor="start" font-size="9.5" fill="#33506b" filter="url(#rough2)">ans = 'a' +</text>
  <text x="315" y="247" text-anchor="start" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">popcount((k−1) &amp; mask) mod 26</text>

  <!-- 右侧：复杂度 -->
  <rect x="305" y="272" width="200" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="405" y="291" text-anchor="middle" font-size="10" fill="#2f5424" filter="url(#rough2)">时间 O(n) · 空间 O(1)</text>
</svg>
