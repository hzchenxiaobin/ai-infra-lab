<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例 2：两次 BFS 收齐直径端点（n = 7，D = 4）</text>

  <!-- 左侧：示例树 -->
  <text x="125" y="42" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">②最远 d=4</text>

  <!-- 边（先画线，节点圆盖在上面） -->
  <g stroke="#8a8a8a" stroke-width="1.6" filter="url(#rough2)">
    <line x1="125" y1="66" x2="125" y2="114"/>
    <line x1="125" y1="114" x2="125" y2="162"/>
    <line x1="125" y1="162" x2="125" y2="210"/>
    <line x1="125" y1="210" x2="125" y2="258"/>
    <line x1="125" y1="114" x2="212" y2="114"/>
    <line x1="125" y1="210" x2="212" y2="210"/>
  </g>

  <!-- start 箭头指向节点 0 -->
  <text x="48" y="60" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">start</text>
  <path d="M 62 66 L 104 66" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>

  <!-- 内部节点距离标注 -->
  <g font-size="8.5" fill="#888" filter="url(#rough2)">
    <text x="103" y="118" text-anchor="end">d₀=1</text>
    <text x="103" y="166" text-anchor="end">d₀=2</text>
    <text x="103" y="214" text-anchor="end">d₀=3</text>
  </g>

  <!-- 端点距离标注 -->
  <g font-size="9.5" font-weight="bold" filter="url(#rough2)">
    <text x="212" y="140" text-anchor="middle" fill="#33506b">②最远 d=4</text>
    <text x="214" y="192" text-anchor="middle" fill="#8a6d1f">①最远 d=4</text>
    <text x="125" y="288" text-anchor="middle" fill="#8a6d1f">①最远 d=4</text>
  </g>

  <!-- 内部节点 -->
  <g filter="url(#rough2)">
    <ellipse cx="125" cy="114" rx="14" ry="14" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <ellipse cx="125" cy="162" rx="14" ry="14" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <ellipse cx="125" cy="210" rx="14" ry="14" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <text x="125" y="118" text-anchor="middle" font-size="12" fill="#555">1</text>
    <text x="125" y="166" text-anchor="middle" font-size="12" fill="#555">2</text>
    <text x="125" y="214" text-anchor="middle" font-size="12" fill="#555">3</text>
  </g>

  <!-- cand_other 端点（蓝）：0 与 6 -->
  <g filter="url(#rough2)">
    <ellipse cx="125" cy="66" rx="14" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <ellipse cx="212" cy="114" rx="14" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <text x="125" y="70" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">0</text>
    <text x="212" y="118" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">6</text>
  </g>

  <!-- cand_start 端点（橙）：4 与 5 -->
  <g filter="url(#rough2)">
    <ellipse cx="212" cy="210" rx="14" ry="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <ellipse cx="125" cy="258" rx="14" ry="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="212" y="214" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold">5</text>
    <text x="125" y="262" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold">4</text>
  </g>

  <!-- 左下角图例 -->
  <g filter="url(#rough2)">
    <ellipse cx="48" cy="304" rx="6" ry="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="62" y="308" font-size="10" fill="#8a6d1f">cand_start：BFS① 的并列最远点</text>
    <ellipse cx="48" cy="322" rx="6" ry="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="62" y="326" font-size="10" fill="#33506b">cand_other：BFS② 的并列最远点</text>
    <ellipse cx="48" cy="340" rx="6" ry="6" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <text x="62" y="344" font-size="10" fill="#777">内部节点：非直径端点</text>
  </g>

  <!-- 右侧：两次 BFS 步骤 -->
  <g filter="url(#rough2)">
    <rect x="272" y="44" width="234" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="389" y="64" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">BFS① 从 start = 0 出发</text>
    <text x="389" y="80" text-anchor="middle" font-size="10" fill="#33506b">最远 d = 4：节点 4 与 5（并列）</text>
    <text x="389" y="97" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">cand_start = {4, 5}</text>
  </g>
  <path d="M 389 106 L 389 118" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="272" y="120" width="234" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="389" y="140" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold">BFS② 从 A = 4 出发</text>
    <text x="389" y="156" text-anchor="middle" font-size="10" fill="#8a6d1f">最远 d = 4：节点 0 与 6（并列）</text>
    <text x="389" y="173" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold">cand_other = {0, 6}</text>
  </g>
  <path d="M 389 182 L 389 194" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="272" y="196" width="234" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="389" y="216" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">并集 = 全部直径端点</text>
    <text x="389" y="232" text-anchor="middle" font-size="10" fill="#2f5d24">ans = {0, 4, 5, 6}</text>
    <text x="389" y="249" text-anchor="middle" font-size="10" fill="#2f5d24">升序输出 [0, 4, 5, 6]</text>
  </g>

  <!-- 定理备注 -->
  <g filter="url(#rough2)">
    <rect x="272" y="270" width="234" height="74" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3"/>
    <text x="389" y="290" text-anchor="middle" font-size="9.5" fill="#666">定理①：任意点的并列最远点，</text>
    <text x="389" y="305" text-anchor="middle" font-size="9.5" fill="#666">个个都是直径端点；</text>
    <text x="389" y="320" text-anchor="middle" font-size="9.5" fill="#666">定理②：两侧集合取并集，</text>
    <text x="389" y="335" text-anchor="middle" font-size="9.5" fill="#666">恰为全部直径端点</text>
  </g>
</svg>
