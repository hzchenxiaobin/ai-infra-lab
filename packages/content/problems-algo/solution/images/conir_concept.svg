<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：区间奇数计数 = 前缀 f(high) − 前缀 f(low−1)</text>

  <!-- Row 1: [0..high] = [0..7] -->
  <text x="44" y="72" font-size="11.5" fill="#555" font-weight="bold">f(7)</text>
  <text x="44" y="86" font-size="9.5" fill="#999">[0..7]</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="88" y="56" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="106" y="75">0</text>
    <rect x="124" y="56" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="142" y="75" font-weight="bold">1</text>
    <rect x="160" y="56" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="178" y="75">2</text>
    <rect x="196" y="56" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="214" y="75" font-weight="bold">3</text>
    <rect x="232" y="56" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="250" y="75">4</text>
    <rect x="268" y="56" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="286" y="75" font-weight="bold">5</text>
    <rect x="304" y="56" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="322" y="75">6</text>
    <rect x="340" y="56" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="358" y="75" font-weight="bold">7</text>
  </g>
  <text x="392" y="75" font-size="11.5" fill="#555">= ⌊(7+1)/2⌋ = <tspan fill="#d6a040" font-weight="bold">4</tspan></text>

  <!-- minus sign between rows -->
  <text x="48" y="114" font-size="18" fill="#b85450" font-weight="bold">−</text>

  <!-- Row 2: [0..low-1] = [0..2] -->
  <text x="44" y="134" font-size="11.5" fill="#555" font-weight="bold">f(2)</text>
  <text x="44" y="148" font-size="9.5" fill="#999">[0..2]</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="88" y="118" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="106" y="137">0</text>
    <rect x="124" y="118" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="142" y="137" font-weight="bold">1</text>
    <rect x="160" y="118" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="178" y="137">2</text>
  </g>
  <text x="392" y="137" font-size="11.5" fill="#555">= ⌊(2+1)/2⌋ = <tspan fill="#d6a040" font-weight="bold">1</tspan></text>

  <!-- equals sign -->
  <text x="48" y="182" font-size="18" fill="#4a7a3a" font-weight="bold">=</text>

  <!-- Row 3: [low..high] = [3..7] result -->
  <text x="44" y="200" font-size="11.5" fill="#4a7a3a" font-weight="bold">answer</text>
  <text x="44" y="214" font-size="9.5" fill="#999">[3..7]</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="88" y="184" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="106" y="203" font-weight="bold">3</text>
    <rect x="124" y="184" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="142" y="203">4</text>
    <rect x="160" y="184" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="178" y="203" font-weight="bold">5</text>
    <rect x="196" y="184" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="214" y="203">6</text>
    <rect x="232" y="184" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="250" y="203" font-weight="bold">7</text>
  </g>
  <text x="392" y="203" font-size="11.5" fill="#555">= 4 − 1 = <tspan fill="#b85450" font-weight="bold">3</tspan></text>

  <!-- Divider -->
  <path d="M 40 240 L 520 240" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Formula box -->
  <rect x="60" y="256" width="440" height="124" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">通用公式</text>
  <text x="280" y="306" text-anchor="middle" font-size="12.5" fill="#333">f(N) = [0..N] 内奇数个数 = ⌊(N + 1) / 2⌋</text>
  <text x="280" y="330" text-anchor="middle" font-size="12.5" fill="#333">answer = f(high) − f(low − 1) = (high + 1) / 2 − low / 2</text>
  <text x="280" y="354" text-anchor="middle" font-size="11" fill="#4a7a3a">（整数除法；f(low−1) = ⌊low / 2⌋，故第二项直接写 low / 2）</text>
</svg>
