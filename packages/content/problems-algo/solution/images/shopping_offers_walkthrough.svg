<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：price=[2,5], special=[[3,0,5],[1,2,10]], needs=[3,2]</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">从 needs=[3,2] 出发，三种决策取最小</text>

  <!-- Root -->
  <rect x="220" y="58" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">needs=[3,2]</text>
  <text x="280" y="92" text-anchor="middle" font-size="10" fill="#888">待决策</text>

  <!-- Branch 1: 原价 -->
  <path d="M 230 98 L 90 142" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="104" y="126" font-size="10" fill="#4a7a3a" font-weight="bold">原价</text>
  <rect x="30" y="144" width="110" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="85" y="162" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">全单原价</text>
  <text x="85" y="180" text-anchor="middle" font-size="10" fill="#333">3·2 + 2·5</text>
  <text x="85" y="196" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">= 16</text>

  <!-- Branch 2: offer 1 -->
  <path d="M 270 98 L 200 142" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="216" y="120" font-size="10" fill="#d6a040" font-weight="bold">礼包①</text>
  <text x="216" y="134" font-size="9" fill="#d6a040">[3,0,5]</text>
  <rect x="150" y="144" width="110" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="205" y="162" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">needs=[0,2]</text>
  <text x="205" y="180" text-anchor="middle" font-size="10" fill="#333">付 5 + dfs</text>
  <text x="205" y="196" text-anchor="middle" font-size="10" fill="#888">无礼包可套</text>

  <!-- Branch 3: offer 2 -->
  <path d="M 330 98 L 400 142" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="120" font-size="10" fill="#b85450" font-weight="bold">礼包②</text>
  <text x="358" y="134" font-size="9" fill="#b85450">[1,2,10]</text>
  <rect x="350" y="144" width="110" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="405" y="162" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">needs=[2,0]</text>
  <text x="405" y="180" text-anchor="middle" font-size="10" fill="#333">付 10 + dfs</text>
  <text x="405" y="196" text-anchor="middle" font-size="10" fill="#888">无礼包可套</text>

  <!-- Leaves for sub-states -->
  <path d="M 205 200 L 205 224" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="226" width="110" height="44" fill="#f6f6f6" stroke="#888" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="205" y="244" text-anchor="middle" font-size="10" fill="#333">0·2 + 2·5</text>
  <text x="205" y="262" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">= 10</text>

  <path d="M 405 200 L 405 224" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="350" y="226" width="110" height="44" fill="#f6f6f6" stroke="#888" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="405" y="244" text-anchor="middle" font-size="10" fill="#333">2·2 + 0·5</text>
  <text x="405" y="262" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">= 4</text>

  <!-- Result combination -->
  <rect x="80" y="290" width="400" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">回传比较</text>
  <text x="280" y="328" text-anchor="middle" font-size="11" fill="#444">min(16, 5+10=15, 10+4=14)</text>
  <text x="280" y="344" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">= 14 ✓（礼包② + 2A 原价）</text>

  <!-- note: no overbuy -->
  <rect x="80" y="362" width="400" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">关键约束：不能超量购买</text>
  <text x="280" y="400" text-anchor="middle" font-size="10" fill="#444">礼包①+② 得 4A+2B，A 超量 1（需 3A），故组合不可行</text>
  <text x="280" y="416" text-anchor="middle" font-size="10" fill="#888">转移时必须校验 needs[i] &gt;= offer[i] ∀i，否则跳过该礼包</text>
</svg>
