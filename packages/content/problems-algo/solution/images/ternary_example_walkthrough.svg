<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：expression = "T ? T ? F : 5 : 3"</text>

  <!-- index row -->
  <text x="20" y="58" font-size="11" fill="#888">下标：</text>
  <g filter="url(#rough2)" font-size="10" fill="#aaa" text-anchor="middle">
    <text x="80" y="58">0</text>
    <text x="130" y="58">1</text>
    <text x="180" y="58">2</text>
    <text x="230" y="58">3</text>
    <text x="280" y="58">4</text>
    <text x="330" y="58">5</text>
    <text x="380" y="58">6</text>
    <text x="430" y="58">7</text>
    <text x="480" y="58">8</text>
  </g>

  <!-- char cells -->
  <g filter="url(#rough2)">
    <rect x="64" y="66" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="80" y="87" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">T</text>
    <rect x="114" y="66" width="32" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <text x="130" y="87" text-anchor="middle" font-size="12" fill="#888">?</text>
    <rect x="164" y="66" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="180" y="87" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">T</text>
    <rect x="214" y="66" width="32" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <text x="230" y="87" text-anchor="middle" font-size="12" fill="#888">?</text>
    <rect x="264" y="66" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="280" y="87" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">F</text>
    <rect x="314" y="66" width="32" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <text x="330" y="87" text-anchor="middle" font-size="12" fill="#888">:</text>
    <rect x="364" y="66" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="380" y="87" text-anchor="middle" font-size="12" fill="#333">5</text>
    <rect x="414" y="66" width="32" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <text x="430" y="87" text-anchor="middle" font-size="12" fill="#888">:</text>
    <rect x="464" y="66" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="480" y="87" text-anchor="middle" font-size="12" fill="#333">3</text>
  </g>

  <!-- table header -->
  <g filter="url(#rough2)">
    <rect x="20" y="118" width="40" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3"/>
    <text x="40" y="137" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">步</text>
    <rect x="60" y="118" width="36" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3"/>
    <text x="78" y="137" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">i</text>
    <rect x="96" y="118" width="56" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3"/>
    <text x="124" y="137" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">字符</text>
    <rect x="152" y="118" width="220" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3"/>
    <text x="262" y="137" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">动作</text>
    <rect x="372" y="118" width="168" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3"/>
    <text x="456" y="137" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">栈（底→顶）</text>
  </g>

  <!-- rows -->
  <g font-size="10" fill="#333" filter="url(#rough2)">
    <!-- row 1 -->
    <rect x="20" y="146" width="40" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3"/>
    <text x="40" y="162" text-anchor="middle">1</text>
    <rect x="60" y="146" width="36" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3"/>
    <text x="78" y="162" text-anchor="middle">8</text>
    <rect x="96" y="146" width="56" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3"/>
    <text x="124" y="162" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="152" y="146" width="220" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3"/>
    <text x="158" y="162" font-size="10" fill="#555">压栈</text>
    <rect x="372" y="146" width="168" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <text x="378" y="162" font-size="10" fill="#333">['3']</text>

    <!-- row 2 -->
    <rect x="20" y="170" width="40" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3"/>
    <text x="40" y="186" text-anchor="middle">2</text>
    <rect x="60" y="170" width="36" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3"/>
    <text x="78" y="186" text-anchor="middle">7</text>
    <rect x="96" y="170" width="56" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3"/>
    <text x="124" y="186" text-anchor="middle" fill="#888">:</text>
    <rect x="152" y="170" width="220" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3"/>
    <text x="158" y="186" font-size="10" fill="#888">跳过分隔符</text>
    <rect x="372" y="170" width="168" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="378" y="186" font-size="10" fill="#888">['3']</text>

    <!-- row 3 -->
    <rect x="20" y="194" width="40" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3"/>
    <text x="40" y="210" text-anchor="middle">3</text>
    <rect x="60" y="194" width="36" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3"/>
    <text x="78" y="210" text-anchor="middle">6</text>
    <rect x="96" y="194" width="56" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3"/>
    <text x="124" y="210" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="152" y="194" width="220" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3"/>
    <text x="158" y="210" font-size="10" fill="#555">压栈</text>
    <rect x="372" y="194" width="168" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <text x="378" y="210" font-size="10" fill="#333">['3','5']</text>

    <!-- row 4 -->
    <rect x="20" y="218" width="40" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3"/>
    <text x="40" y="234" text-anchor="middle">4</text>
    <rect x="60" y="218" width="36" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3"/>
    <text x="78" y="234" text-anchor="middle">5</text>
    <rect x="96" y="218" width="56" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3"/>
    <text x="124" y="234" text-anchor="middle" fill="#888">:</text>
    <rect x="152" y="218" width="220" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3"/>
    <text x="158" y="234" font-size="10" fill="#888">跳过</text>
    <rect x="372" y="218" width="168" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="378" y="234" font-size="10" fill="#888">['3','5']</text>

    <!-- row 5 -->
    <rect x="20" y="242" width="40" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3"/>
    <text x="40" y="258" text-anchor="middle">5</text>
    <rect x="60" y="242" width="36" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3"/>
    <text x="78" y="258" text-anchor="middle">4</text>
    <rect x="96" y="242" width="56" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3"/>
    <text x="124" y="258" text-anchor="middle" fill="#446688" font-weight="bold">F</text>
    <rect x="152" y="242" width="220" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3"/>
    <text x="158" y="258" font-size="10" fill="#555">压栈</text>
    <rect x="372" y="242" width="168" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <text x="378" y="258" font-size="10" fill="#333">['3','5','F']</text>

    <!-- row 6: reduce -->
    <rect x="20" y="266" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <text x="40" y="282" text-anchor="middle" fill="#d6a040" font-weight="bold">6</text>
    <rect x="60" y="266" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <text x="78" y="282" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="96" y="266" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <text x="124" y="282" text-anchor="middle" fill="#d6a040" font-weight="bold">?</text>
    <rect x="152" y="266" width="220" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <text x="158" y="282" font-size="9.5" fill="#333">cond=T；弹 F/5；压 F；i−=2</text>
    <rect x="372" y="266" width="168" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <text x="378" y="282" font-size="10" fill="#333">['3','F']</text>

    <!-- row 7 -->
    <rect x="20" y="290" width="40" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="40" y="306" text-anchor="middle">7</text>
    <rect x="60" y="290" width="36" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="78" y="306" text-anchor="middle">—</text>
    <rect x="96" y="290" width="56" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="124" y="306" text-anchor="middle" fill="#888">T</text>
    <rect x="152" y="290" width="220" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="158" y="306" font-size="10" fill="#888">已作为条件被吃掉</text>
    <rect x="372" y="290" width="168" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="378" y="306" font-size="10" fill="#888">['3','F']</text>

    <!-- row 8: reduce outer -->
    <rect x="20" y="314" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <text x="40" y="330" text-anchor="middle" fill="#d6a040" font-weight="bold">8</text>
    <rect x="60" y="314" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <text x="78" y="330" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="96" y="314" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <text x="124" y="330" text-anchor="middle" fill="#d6a040" font-weight="bold">?</text>
    <rect x="152" y="314" width="220" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <text x="158" y="330" font-size="9.5" fill="#333">cond=T；弹 F/3；压 F；i−=2</text>
    <rect x="372" y="314" width="168" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <text x="378" y="330" font-size="10" fill="#333">['F']</text>
  </g>

  <!-- result -->
  <rect x="20" y="346" width="520" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="364" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">结果 = 栈顶 = 'F' ✓  （T ? (T ? F : 5) : 3 = T ? F : 3 = F）</text>
</svg>
