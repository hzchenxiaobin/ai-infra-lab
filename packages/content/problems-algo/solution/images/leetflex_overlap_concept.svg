<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="380" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">核心概念：两个登录区间重叠 ⇔ 同时在线（端点相接也算）</text>
  <path d="M 150 36 Q 380 44 610 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Top: general overlap principle ===== -->
  <text x="40" y="64" font-size="11" fill="#888">① 一般判定：区间 A = [login₁, logout₁]，B = [login₂, logout₂]</text>

  <!-- timeline axis -->
  <line x1="80" y1="120" x2="680" y2="120" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 680 120 L 672 116 L 672 124 z" fill="#999" filter="url(#rough2)"/>
  <text x="686" y="124" font-size="10" fill="#888">时间</text>

  <!-- interval A -->
  <g filter="url(#rough2)">
    <rect x="120" y="96" width="220" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <text x="124" y="92" font-size="9" fill="#446688" font-weight="bold">login₁</text>
  <text x="330" y="92" font-size="9" fill="#446688" font-weight="bold">logout₁</text>
  <text x="200" y="111" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">区间 A（IP 甲）</text>

  <!-- interval B (overlapping) -->
  <g filter="url(#rough2)">
    <rect x="240" y="128" width="260" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <text x="244" y="164" font-size="9" fill="#4a7a3a" font-weight="bold">login₂</text>
  <text x="486" y="164" font-size="9" fill="#4a7a3a" font-weight="bold">logout₂</text>
  <text x="360" y="143" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">区间 B（IP 乙）</text>

  <!-- overlap region highlight -->
  <g filter="url(#rough2)">
    <rect x="240" y="96" width="100" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
  </g>
  <text x="290" y="76" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">重叠区 ⇒ 同时在线 ⇒ 禁止</text>

  <!-- tick marks -->
  <line x1="120" y1="116" x2="120" y2="126" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="340" y1="116" x2="340" y2="126" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="240" y1="116" x2="240" y2="126" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="500" y1="116" x2="500" y2="126" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- ===== Middle: overlap condition formula ===== -->
  <g filter="url(#rough2)"><rect x="80" y="184" width="600" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="100" y="208" font-size="12" fill="#446688" font-weight="bold">⭐ 区间重叠条件（含端点，闭区间）：</text>
  <text x="100" y="232" font-size="13" fill="#333" font-family="'Comic Sans MS','Segoe UI',monospace">login₁ ≤ logout₂  AND  login₂ ≤ logout₁   →  两者同时成立即重叠</text>

  <!-- ===== Bottom: two contrasting cases ===== -->
  <text x="40" y="276" font-size="11" fill="#888">② 端点相接的边界：本题刻意用 1 秒之差区分「禁止 / 不禁止」</text>

  <!-- Case A: gap (not banned) - account 3 -->
  <g filter="url(#rough2)"><rect x="40" y="290" width="330" height="130" rx="8" fill="#fff" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="56" y="312" font-size="11" fill="#4a7a3a" font-weight="bold">账户 3：logout₁ = 16:59:59 ＜ login₂ = 17:00:00</text>
  <line x1="70" y1="350" x2="350" y2="350" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="90" y="340" width="120" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/></g>
  <text x="150" y="354" text-anchor="middle" font-size="9" fill="#446688">IP 9</text>
  <g filter="url(#rough2)"><rect x="220" y="340" width="120" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/></g>
  <text x="280" y="354" text-anchor="middle" font-size="9" fill="#4a7a3a">IP 13</text>
  <text x="206" y="372" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1 秒空档</text>
  <text x="205" y="396" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">login₂ ≤ logout₁ ? 17:00 ≤ 16:59:59 ✗</text>
  <text x="205" y="414" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">→ 不重叠，不禁止 ✓</text>

  <!-- Case B: touch (banned) - account 4 -->
  <g filter="url(#rough2)"><rect x="390" y="290" width="330" height="130" rx="8" fill="#fff" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="406" y="312" font-size="11" fill="#b85450" font-weight="bold">账户 4：logout₁ = 17:00:00 = login₂ = 17:00:00</text>
  <line x1="420" y1="350" x2="700" y2="350" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="440" y="340" width="130" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/></g>
  <text x="505" y="354" text-anchor="middle" font-size="9" fill="#446688">IP 10</text>
  <g filter="url(#rough2)"><rect x="570" y="340" width="120" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/></g>
  <text x="630" y="354" text-anchor="middle" font-size="9" fill="#4a7a3a">IP 11</text>
  <circle cx="570" cy="350" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="570" y="372" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">端点相接</text>
  <text x="555" y="396" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">login₂ ≤ logout₁ ? 17:00 ≤ 17:00 ✓</text>
  <text x="555" y="414" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">→ 重叠，禁止 ✓</text>
</svg>
