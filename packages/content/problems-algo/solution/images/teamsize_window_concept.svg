<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">窗口函数按 team_id 分组计数：组内每行都拿到本组 COUNT</text>

  <!-- Window function expression -->
  <rect x="120" y="42" width="320" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="11" fill="#333">COUNT(*) OVER (PARTITION BY team_id) AS team_size</text>

  <!-- Team 1 group -->
  <text x="100" y="100" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">team_id = 1</text>
  <rect x="30" y="108" width="140" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" stroke-dasharray="5,3" rx="8" filter="url(#rough2)"/>
  <text x="100" y="126" text-anchor="middle" font-size="9.5" fill="#446688">分区（2 人）</text>
  <rect x="48" y="134" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="151" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <rect x="104" y="134" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="151" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">7</text>
  <rect x="48" y="178" width="104" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="100" y="199" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">team_size = 2</text>

  <!-- Team 2 group -->
  <text x="280" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">team_id = 2</text>
  <rect x="210" y="108" width="140" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5,3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="9.5" fill="#4a7a3a">分区（3 人）</text>
  <rect x="220" y="134" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="151" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="262" y="134" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="151" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>
  <rect x="304" y="134" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="151" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>
  <rect x="228" y="178" width="104" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="199" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">team_size = 3</text>

  <!-- Team 3 group -->
  <text x="460" y="100" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">team_id = 3</text>
  <rect x="390" y="108" width="140" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" rx="8" filter="url(#rough2)"/>
  <text x="460" y="126" text-anchor="middle" font-size="9.5" fill="#b85450">分区（2 人）</text>
  <rect x="408" y="134" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="151" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <rect x="464" y="134" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="486" y="151" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <rect x="408" y="178" width="104" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="460" y="199" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">team_size = 2</text>

  <!-- arrows: each group -> its team_size -->
  <path d="M100 160 C 100 168, 100 172, 100 178" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M280 160 C 280 168, 280 172, 280 178" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M460 160 C 460 168, 460 172, 460 178" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- Result row example -->
  <text x="280" y="258" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">每行原样保留 + 追加一列 team_size（同组同值）</text>
  <rect x="150" y="266" width="260" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="282" font-size="10" fill="#4a7a3a" font-weight="bold">emp_id</text>
  <text x="290" y="282" font-size="10" fill="#4a7a3a" font-weight="bold">team_id</text>
  <text x="380" y="282" font-size="10" fill="#d6a040" font-weight="bold">team_size</text>
  <line x1="240" y1="266" x2="240" y2="290" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="330" y1="266" x2="330" y2="290" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="150" y="290" width="260" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="190" y="305" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="290" y="305" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="380" y="305" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <line x1="240" y1="290" x2="240" y2="312" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="330" y1="290" x2="330" y2="312" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="150" y="312" width="260" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="190" y="327" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="290" y="327" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="380" y="327" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <line x1="240" y1="312" x2="240" y2="334" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="330" y1="312" x2="330" y2="334" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="30" y="346" width="500" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="364" font-size="10" fill="#333">核心：PARTITION BY team_id 把表切成若干「团队分区」，COUNT(*) 在分区内</text>
  <text x="50" y="380" font-size="10" fill="#333">对全体行求值后<tspan fill="#d6a040" font-weight="bold">广播回分区内每一行</tspan>——无需 GROUP BY 收缩，原表 N 行 → 输出仍是 N 行。</text>
</svg>
