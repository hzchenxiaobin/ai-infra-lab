<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">含重复值：nums[mid]==nums[right] 时无法判断断点在哪半</text>

  <!-- ====== Top: 153 题（无重复，可判断） ====== -->
  <rect x="20" y="42" width="520" height="116" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <rect x="20" y="42" width="520" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="59" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">153 题（值互异）：nums[mid] vs nums[right] 必能定胜负</text>

  <text x="32" y="82" font-size="10.5" fill="#888">nums：</text>
  <rect x="80" y="68" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="86" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="124" y="68" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="86" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="168" y="68" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="86" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="212" y="68" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="232" y="86" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="256" y="68" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="86" text-anchor="middle" font-size="11" fill="#333">2</text>

  <text x="188" y="110" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">mid=2</text>
  <text x="276" y="110" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">right=4</text>

  <rect x="44" y="118" width="460" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">nums[mid]=5 &gt; nums[right]=2 → 右半有下坠 → left=mid+1 ✓</text>

  <!-- ====== Bottom: 154 题（有重复，歧义） ====== -->
  <rect x="20" y="172" width="520" height="206" fill="#ffffff" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <rect x="20" y="172" width="520" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="189" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">154 题（含重复）：nums[mid]==nums[right] → 断点左/右皆可能！</text>

  <!-- 子情况 A：min 在右半 -->
  <text x="32" y="214" font-size="10.5" fill="#888">A：</text>
  <rect x="60" y="202" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="220" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="104" y="202" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="220" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="148" y="202" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="220" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <rect x="192" y="202" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="220" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <rect x="236" y="202" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256" y="220" text-anchor="middle" font-size="11" fill="#333">2</text>

  <text x="168" y="242" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">mid=2</text>
  <text x="256" y="242" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">right=4</text>
  <text x="300" y="220" font-size="10.5" fill="#b85450">min=0 在右半 (mid, right]</text>

  <!-- 子情况 B：min 在左半 -->
  <text x="32" y="268" font-size="10.5" fill="#888">B：</text>
  <rect x="60" y="256" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="274" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="104" y="256" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="124" y="274" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <rect x="148" y="256" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="274" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <rect x="192" y="256" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="274" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="236" y="256" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256" y="274" text-anchor="middle" font-size="11" fill="#333">2</text>

  <text x="168" y="296" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">mid=2</text>
  <text x="256" y="296" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">right=4</text>
  <text x="300" y="274" font-size="10.5" fill="#b85450">min=0 在左半 [left, mid)</text>

  <!-- 结论框 -->
  <rect x="44" y="312" width="460" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">两例同为 nums[mid]==nums[right]==2，断点却左右皆可 → 无法二分砍半</text>

  <rect x="44" y="352" width="460" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="367" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">对策：right−− 保守退缩（nums[right] 非「唯一」最小，丢弃无损）</text>

  <text x="280" y="392" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">最坏全相同值时退化为 O(n)，此为信息论下界</text>
</svg>
