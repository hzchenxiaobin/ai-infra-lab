<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：序映射 + 相邻词对首异字符比较</text>

  <!-- ===== 第一步：order → rank 映射 ===== -->
  <text x="40" y="58" font-size="11" fill="#888" font-weight="bold">① 建序映射 rank[c] = c 在 order 中的位置</text>

  <text x="40" y="82" font-size="10" fill="#888">order</text>
  <rect x="78" y="68" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="87" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">w</text>
  <rect x="114" y="68" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="131" y="87" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">o</text>
  <rect x="150" y="68" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="167" y="87" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">r</text>
  <rect x="186" y="68" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="203" y="87" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">l</text>
  <rect x="222" y="68" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="87" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">d</text>
  <rect x="258" y="68" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="87" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">a</text>
  <text x="300" y="87" font-size="13" fill="#aaa">…</text>

  <text x="40" y="112" font-size="10" fill="#888">rank</text>
  <text x="95" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="131" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="167" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="203" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="239" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="275" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>

  <!-- 分隔虚线 -->
  <path d="M 40 128 L 520 128" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== 第二步：相邻词对首异字符 ===== -->
  <text x="40" y="148" font-size="11" fill="#888" font-weight="bold">② 比较相邻词对，找首个不同字符</text>

  <text x="40" y="174" font-size="10" fill="#888">w₁</text>
  <rect x="78" y="158" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="177" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">w</text>
  <rect x="114" y="158" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="131" y="177" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">o</text>
  <rect x="150" y="158" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="167" y="177" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">r</text>
  <rect x="186" y="158" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="203" y="177" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">d</text>

  <text x="40" y="210" font-size="10" fill="#888">w₂</text>
  <rect x="78" y="194" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="213" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">w</text>
  <rect x="114" y="194" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="131" y="213" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">o</text>
  <rect x="150" y="194" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="167" y="213" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">r</text>
  <rect x="186" y="194" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="203" y="213" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">l</text>
  <rect x="222" y="194" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="213" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">d</text>

  <!-- 首异标记 -->
  <path d="M 203 230 L 203 222" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="203" y="244" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">首异 ↓</text>

  <!-- rank 对比 -->
  <text x="278" y="177" font-size="11" fill="#b85450" font-weight="bold">rank[d]=4</text>
  <text x="278" y="213" font-size="11" fill="#d6a040" font-weight="bold">rank[l]=3</text>
  <text x="278" y="195" font-size="13" fill="#b85450" font-weight="bold">4 &gt; 3 ⇒ w₁ &gt; w₂</text>

  <!-- ===== 三种判定结果 ===== -->
  <path d="M 40 256 L 520 256" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="40" y="276" font-size="11" fill="#888" font-weight="bold">③ 首异字符的三种结果</text>

  <rect x="40" y="288" width="150" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="115" y="308" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">rank[w₁[k]] &lt; rank[w₂[k]]</text>
  <text x="115" y="324" text-anchor="middle" font-size="10.5" fill="#4a7a3a">w₁ &lt; w₂，本对正确</text>

  <rect x="205" y="288" width="150" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">rank[w₁[k]] &gt; rank[w₂[k]]</text>
  <text x="280" y="324" text-anchor="middle" font-size="10.5" fill="#b85450">w₁ &gt; w₂，return false</text>

  <rect x="370" y="288" width="150" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="445" y="306" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">无首异（前缀关系）</text>
  <text x="445" y="322" text-anchor="middle" font-size="10.5" fill="#d6a040">需 len(w₁) ≤ len(w₂)</text>

  <!-- 底部不变式 -->
  <rect x="40" y="352" width="480" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">不变式：只需检查相邻词对 —— 序关系传递，相邻对全正确则整体有序</text>
  <text x="280" y="384" text-anchor="middle" font-size="10.5" fill="#446688">首异字符一锤定音；无首异则短者在前（前缀规则）</text>
</svg>
