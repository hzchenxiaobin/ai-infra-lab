<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 415" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="415" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2,1,8]，k = 10（1010₂）</text>

  <!-- Panel 1: right=0 -->
  <text x="260" y="48" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① right=0：窗口 [2]，OR = 0010₂ = 2 &lt; 10 ✗</text>
  <rect x="212" y="58" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="232" y="79" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="232" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0010</text>

  <path d="M 260 108 L 260 124" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Panel 2: right=1 -->
  <text x="260" y="142" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">② right=1：窗口 [2,1]，OR = 0011₂ = 3 &lt; 10 ✗</text>
  <rect x="192" y="152" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="212" y="173" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="234" y="152" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="173" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="212" y="196" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0010</text>
  <text x="254" y="196" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0001</text>

  <path d="M 260 202 L 260 218" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Panel 3: right=2 -->
  <text x="260" y="236" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ right=2：窗口 [2,1,8]，OR = 1011₂ = 11 ≥ 10 ✓</text>
  <rect x="172" y="246" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="192" y="267" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="214" y="246" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="234" y="267" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="256" y="246" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="276" y="267" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="192" y="290" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0010</text>
  <text x="234" y="290" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0001</text>
  <text x="276" y="290" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">1000</text>

  <rect x="120" y="298" width="280" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">记录 ans = 3；收缩：移除 2 → cnt[bit1] 归 0</text>

  <path d="M 260 324 L 260 338" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- after shrink -->
  <text x="260" y="356" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">收缩后 [1,8]，OR = 1001₂ = 9 &lt; 10 ✗ —— 停止，换下一个 right</text>
  <rect x="172" y="364" width="40" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="192" y="383" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">2</text>
  <rect x="214" y="364" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="234" y="383" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="256" y="364" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="276" y="383" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">8</text>

  <text x="400" y="383" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">ans = 3 ✓</text>
</svg>
