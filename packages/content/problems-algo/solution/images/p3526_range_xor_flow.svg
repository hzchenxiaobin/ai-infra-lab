<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 370"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="370" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">三种查询，一套 split / merge 框架</text>

  <!-- 起点 -->
  <rect x="180" y="40" width="160" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">读入 query = [t, x, y]</text>

  <path d="M 260 72 L 260 88" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="260,92 336,124 260,156 184,124" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="129" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">t = ?</text>

  <!-- 三分支箭头 -->
  <path d="M 184 124 L 95 124 L 95 164" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="128" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <path d="M 260 156 L 260 164" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="273" y="163" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <path d="M 336 124 L 425 124 L 425 164" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="392" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">3</text>

  <!-- 三列表头 -->
  <text x="95" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">单点修改 [1,i,v]</text>
  <text x="260" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">区间异或 [2,l,r]</text>
  <text x="425" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">区间翻转 [3,l,r]</text>

  <!-- 第一列 -->
  <rect x="20" y="184" width="150" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="95" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">split(root, i)</text>
  <path d="M 95 212 L 95 222" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="224" width="150" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="95" y="242" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">split(·, 1) 切出第 i 个</text>
  <path d="M 95 252 L 95 262" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="264" width="150" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="95" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">val = xr = v</text>

  <!-- 第二列 -->
  <rect x="185" y="184" width="150" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">split(root, l)</text>
  <path d="M 260 212 L 260 222" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="185" y="224" width="150" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="242" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">split(·, r−l+1)</text>
  <path d="M 260 252 L 260 262" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="185" y="264" width="150" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">ans ← xr（O(1)）</text>

  <!-- 第三列 -->
  <rect x="350" y="184" width="150" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="425" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">split(root, l)</text>
  <path d="M 425 212 L 425 222" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="350" y="224" width="150" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="425" y="242" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">split(·, r−l+1)</text>
  <path d="M 425 252 L 425 262" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="350" y="264" width="150" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="425" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">rev ^= 1（O(1)）</text>

  <!-- 汇合 -->
  <path d="M 95 292 L 95 302" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 292 L 260 302" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 425 292 L 425 302" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="304" width="400" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">merge(merge(A, B), C) 拼回完整序列</text>

  <text x="260" y="356" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">单次操作期望 O(log n)：两趟 split + 一趟 merge，路径长度 = 树高</text>
</svg>
