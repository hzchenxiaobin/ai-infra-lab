<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：三段式波形（升-降-升）与四阶段状态机</text>

  <!-- 波形示例 -->
  <text x="260" y="44" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">nums = [1, 4, 2, 7]：整段就是三段式</text>

  <line x1="90" y1="150" x2="190" y2="105" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="190" y1="105" x2="290" y2="135" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="290" y1="135" x2="390" y2="62" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>

  <circle cx="90" cy="150" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="190" cy="105" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="190" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <circle cx="290" cy="135" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="139" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="390" cy="62" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="66" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>

  <text x="130" y="122" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">第一段递增</text>
  <text x="240" y="160" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">下降段</text>
  <text x="340" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">第二段递增</text>

  <text x="90" y="185" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">l</text>
  <text x="190" y="185" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">p（峰）</text>
  <text x="290" y="185" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">q（谷）</text>
  <text x="390" y="185" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">r</text>

  <text x="260" y="207" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">l &lt; p &lt; q &lt; r：三段共享端点，每段至少 2 个元素</text>

  <!-- 状态机 -->
  <text x="260" y="230" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">四阶段状态机：dpk[i] = 以 i 结尾、处于阶段 k 的子数组最大和</text>

  <rect x="22" y="242" width="100" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="261" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">dp0 起步↑</text>
  <text x="72" y="279" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">递增·长度可=1</text>

  <rect x="148" y="242" width="100" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="198" y="261" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">dp1 递增↑</text>
  <text x="198" y="279" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">长度≥2才可转弯</text>

  <rect x="274" y="242" width="100" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="324" y="261" text-anchor="middle" font-size="11" fill="#a07820" filter="url(#rough2)">dp2 下降↓</text>
  <text x="324" y="279" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">含峰·天然≥2</text>

  <rect x="400" y="242" width="100" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="450" y="261" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">dp3 再递增↑</text>
  <text x="450" y="279" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">含谷·天然≥2</text>

  <path d="M 124 266 L 144 266" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="134" y="258" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">升</text>
  <path d="M 250 266 L 270 266" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="260" y="258" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">降</text>
  <path d="M 376 266 L 396 266" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="386" y="258" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">升</text>

  <text x="72" y="302" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">升: max(dp0+x, x)</text>
  <text x="198" y="302" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">升: max(dp1,dp0)+x</text>
  <text x="324" y="302" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">降: max(dp2,dp1)+x</text>
  <text x="450" y="302" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">升: max(dp3,dp2)+x</text>

  <text x="260" y="322" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">平（相邻相等）：dp1/dp2/dp3 → −∞，dp0 ← x 重启</text>

  <rect x="140" y="332" width="240" height="24" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans = max dp3（有限值即完整三段式）</text>
</svg>
