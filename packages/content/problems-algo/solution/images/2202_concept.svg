<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：2 ≤ k ≤ n−1 时，索引 k−1 是唯一不可达的</text>

  <!-- Stack top arrow -->
  <text x="60" y="70" text-anchor="middle" font-size="11" fill="#888">堆顶 ↓</text>
  <path d="M 60 76 L 60 92" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Array elements (k=4, n=7) -->
  <!-- idx 0: green (push-back candidate) -->
  <rect x="75" y="96" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="103" y="121" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">a₀</text>
  <text x="103" y="152" text-anchor="middle" font-size="9.5" fill="#4a7a3a">idx 0</text>

  <!-- idx 1: green -->
  <rect x="135" y="96" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="163" y="121" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">a₁</text>
  <text x="163" y="152" text-anchor="middle" font-size="9.5" fill="#4a7a3a">idx 1</text>

  <!-- idx 2: green (k-2 = 2) -->
  <rect x="195" y="96" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="223" y="121" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">a₂</text>
  <text x="223" y="152" text-anchor="middle" font-size="9.5" fill="#4a7a3a">idx k−2</text>

  <!-- idx 3: RED (gap, k-1) -->
  <rect x="255" y="96" width="56" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="283" y="121" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">a₃</text>
  <text x="283" y="152" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">idx k−1 ✗</text>

  <!-- idx 4: green (k) -->
  <rect x="315" y="96" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="343" y="121" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">a₄</text>
  <text x="343" y="152" text-anchor="middle" font-size="9.5" fill="#4a7a3a">idx k</text>

  <!-- idx 5: gray -->
  <rect x="375" y="96" width="56" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="403" y="121" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">a₅</text>
  <text x="403" y="152" text-anchor="middle" font-size="9.5" fill="#999">idx k+1</text>

  <!-- idx 6: gray -->
  <rect x="435" y="96" width="56" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="463" y="121" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">a₆</text>
  <text x="463" y="152" text-anchor="middle" font-size="9.5" fill="#999">idx n−1</text>

  <!-- Bracket: green left region (idx 0..k-2) -->
  <path d="M 75 168 L 75 176 L 251 176 L 251 168" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="163" y="192" text-anchor="middle" font-size="10.5" fill="#4a7a3a">可推回堆顶 ✓（删除后第 k 步推回）</text>

  <!-- Bracket: red gap (idx k-1) -->
  <path d="M 255 168 L 255 200 L 311 200 L 311 168" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="283" y="216" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">间隙：不可达 ✗</text>

  <!-- Bracket: green right (idx k) -->
  <path d="M 315 168 L 315 176 L 371 176 L 371 168" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="343" y="192" text-anchor="middle" font-size="10.5" fill="#4a7a3a">留于堆中 ✓</text>

  <!-- Bracket: gray (idx k+1..n-1) -->
  <path d="M 375 168 L 375 176 L 491 176 L 491 168" stroke="#bbb" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="433" y="192" text-anchor="middle" font-size="10.5" fill="#999">不可达（需 &gt;k 步）</text>

  <!-- Explanation box -->
  <rect x="40" y="232" width="480" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="11" fill="#666">两种方式让 aᵢ 到达堆顶：</text>
  <text x="280" y="270" text-anchor="middle" font-size="10.5" fill="#a87020">① 删 i 个后在堆中（需 k−i 为偶数，凑 push/pop 对消磨）</text>
  <text x="280" y="284" text-anchor="middle" font-size="10.5" fill="#a87020">② 删除 aᵢ 再推回（需 k ≥ i+2，多删 r 个调奇偶）</text>

  <!-- Bottom note -->
  <rect x="40" y="306" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">两种方式并集 → 索引 0..k−2 与 k 均可达，唯独 k−1 不可达</text>
  <text x="280" y="344" text-anchor="middle" font-size="10" fill="#555">方式①要求 k−i 偶数（k−(k−1)=1 奇 ✗）；方式②要求 k≥i+2（k≥k+1 不成立 ✗）</text>
</svg>
