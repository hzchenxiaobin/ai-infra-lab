<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：KMP 在无限流上滑行 —— 只记一个 j，失配靠 fail 自对齐</text>

  <!-- stream section -->
  <text x="52" y="60" font-size="11.5" fill="#888" filter="url(#rough2)">无限流（只能向前读）</text>

  <!-- hit window frame (behind boxes) -->
  <rect x="206" y="50" width="190" height="48" fill="none" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="301" y="44" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">命中窗口（j = m = 4）</text>

  <!-- stream boxes -->
  <rect x="120" y="56" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="79" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="166" y="56" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="186" y="79" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="212" y="56" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="232" y="79" text-anchor="middle" font-size="14" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="258" y="56" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="278" y="79" text-anchor="middle" font-size="14" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="304" y="56" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="324" y="79" text-anchor="middle" font-size="14" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="350" y="56" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="79" text-anchor="middle" font-size="14" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- stream indices -->
  <text x="140" y="106" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="186" y="106" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="232" y="106" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="278" y="106" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="324" y="106" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="370" y="106" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>

  <text x="396" y="80" font-size="16" fill="#555" filter="url(#rough2)">…</text>
  <path d="M 414 74 L 452 74" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="433" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">next()</text>
  <text x="433" y="92" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">只向前</text>

  <!-- match check marks -->
  <text x="232" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="278" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="324" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="370" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- pattern row aligned under stream indices 2..5 -->
  <text x="52" y="156" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">pattern =</text>
  <rect x="212" y="132" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="232" y="155" text-anchor="middle" font-size="14" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="258" y="132" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="278" y="155" text-anchor="middle" font-size="14" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="304" y="132" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="324" y="155" text-anchor="middle" font-size="14" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="350" y="132" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="155" text-anchor="middle" font-size="14" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="412" y="148" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">j = 4</text>
  <text x="412" y="164" font-size="9.5" fill="#888" filter="url(#rough2)">已匹配前缀长度</text>

  <!-- fail row -->
  <text x="52" y="196" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">fail =</text>
  <rect x="212" y="178" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="232" y="196" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="258" y="178" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="278" y="196" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="304" y="178" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="324" y="196" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="350" y="178" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="370" y="196" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="412" y="190" font-size="9.5" fill="#888" filter="url(#rough2)">fail[i] = 前 i+1 位</text>
  <text x="412" y="204" font-size="9.5" fill="#888" filter="url(#rough2)">最长相等真前后缀</text>

  <!-- insight box -->
  <rect x="36" y="222" width="448" height="132" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="246" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 流只能向前读：i 只增不减，读过的比特绝不重读</text>
  <text x="260" y="270" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② 唯一匹配状态 j：失配时 j ← fail[j−1]，模式「自对齐」</text>
  <text x="260" y="294" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 例：fail[3]=1 → 前缀[1]==后缀[1]，失配后右移 3 位续比</text>
  <text x="260" y="318" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ j == m 命中：起点 = i − m + 1（本图 5 − 4 + 1 = 2 ✓）</text>

  <!-- bottom note -->
  <rect x="36" y="364" width="448" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="383" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">对比朴素滑窗：失配后窗口 +1，新窗口 m 位全部重比 O(n·m)；KMP 摊还 O(1)/比特</text>
</svg>
