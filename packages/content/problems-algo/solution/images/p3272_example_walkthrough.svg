<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：n = 3，k = 5 → 答案 27</text>

  <!-- ① 枚举回文 -->
  <text x="70" y="46" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">① 枚举回文</text>
  <text x="260" y="64" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">3 位回文 = a b a；整除 5 ⇒ 末位 ∈ {0,5}；末位 = 首位 ⇒ a = 5（a = 0 前导零 ✗）</text>

  <rect x="65" y="74" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="82" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">505</text>

  <rect x="104" y="74" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="121" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">515</text>

  <rect x="143" y="74" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">525</text>

  <rect x="182" y="74" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="199" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">535</text>

  <rect x="221" y="74" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="238" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">545</text>

  <rect x="260" y="74" width="34" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="277" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">555</text>

  <rect x="299" y="74" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="316" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">565</text>

  <rect x="338" y="74" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="355" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">575</text>

  <rect x="377" y="74" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="394" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">585</text>

  <rect x="416" y="74" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="433" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">595</text>

  <text x="260" y="120" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">10 个回文全部整除 5 ✓ → 多重集 {5,5,b} 互不相同（本例恰好无需去重）</text>

  <path d="M260,126 L260,140" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 分类计数表 -->
  <text x="70" y="156" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">② 按多重集计数（n = 3）</text>

  <rect x="52" y="164" width="120" height="22" fill="#f0ede6" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="112" y="179" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333" filter="url(#rough2)">多重集</text>

  <rect x="172" y="164" width="118" height="22" fill="#f0ede6" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="231" y="179" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333" filter="url(#rough2)">排列总数</text>

  <rect x="290" y="164" width="118" height="22" fill="#f0ede6" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="349" y="179" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333" filter="url(#rough2)">减：首零排列</text>

  <rect x="408" y="164" width="72" height="22" fill="#f0ede6" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="444" y="179" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333" filter="url(#rough2)">贡献</text>

  <rect x="52" y="186" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="112" y="201" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{5,5,0}（b=0）</text>

  <rect x="172" y="186" width="118" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="231" y="201" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3!/2! = 3</text>

  <rect x="290" y="186" width="118" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="349" y="201" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2!/（0!·2!）= 1</text>

  <rect x="408" y="186" width="72" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="444" y="201" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <rect x="52" y="208" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="112" y="223" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{5,5,d} × 8（d≠0,5）</text>

  <rect x="172" y="208" width="118" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="231" y="223" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">各 3!/2! = 3</text>

  <rect x="290" y="208" width="118" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="349" y="223" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">无 0，不减</text>

  <rect x="408" y="208" width="72" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="444" y="223" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">24</text>

  <rect x="52" y="230" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="112" y="245" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{5,5,5}（b=5）</text>

  <rect x="172" y="230" width="118" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="231" y="245" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3!/3! = 1</text>

  <rect x="290" y="230" width="118" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="349" y="245" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">—</text>

  <rect x="408" y="230" width="72" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="444" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a10" filter="url(#rough2)">1</text>

  <rect x="52" y="252" width="428" height="24" fill="#fff" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="269" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">合计：2 + 24 + 1 = 27 ✓</text>

  <!-- ③ 说明 -->
  <text x="260" y="298" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">如 {5,5,0}：排列 055 ✗前导零 / 505 ✓ / 550 ✓ → 贡献 3 − 1 = 2</text>
  <text x="260" y="320" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">8 个无零多重集各贡献 3（55d / 5d5 / d55 全部合法）；555 自身即回文</text>

  <text x="260" y="346" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">好数不必是回文：550 不是回文，但它能重排出 505，所以是好数</text>
</svg>
