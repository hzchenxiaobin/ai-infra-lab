<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：四边界循环填数</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">每轮填一圈（右→下→左→上），num 递增，走完缩 1 格；后两步需 if 守卫</text>

  <!-- init box -->
  <rect x="216" y="60" width="168" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="76" text-anchor="middle" font-size="9" fill="#446688">初始化</text>
  <text x="300" y="90" text-anchor="middle" font-size="10" fill="#333">matrix=n×n 零阵；T=0,B=n-1,L=0,R=n-1；num=1</text>

  <!-- arrow init -> diamond -->
  <path d="M 300 100 L 300 118" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- while diamond -->
  <polygon points="300,122 432,168 300,214 168,168" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="164" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">T≤B</text>
  <text x="300" y="180" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">且 L≤R ?</text>

  <!-- diamond right -> return matrix (否) -->
  <path d="M 432 168 L 520 168 L 520 110" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="470" y="160" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="468" y="78" width="120" height="34" fill="#f4f4f4" stroke="#999" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="528" y="99" text-anchor="middle" font-size="11" fill="#333">返回 matrix</text>

  <!-- diamond bottom -> step1 (是) -->
  <path d="M 300 214 L 300 236 L 96 236 L 96 256" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="250" y="230" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ===== four step boxes in a row, y center 284 ===== -->
  <!-- ① right -->
  <rect x="42" y="258" width="108" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="96" y="280" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">① 向右 填顶行</text>
  <text x="96" y="298" text-anchor="middle" font-size="9" fill="#888">L→R；T++</text>
  <!-- ② down -->
  <rect x="182" y="258" width="108" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="236" y="280" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">② 向下 填右列</text>
  <text x="236" y="298" text-anchor="middle" font-size="9" fill="#888">T→B；R--</text>
  <!-- ③ left -->
  <rect x="322" y="258" width="108" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="376" y="280" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">③ 向左 填底行</text>
  <text x="376" y="298" text-anchor="middle" font-size="9" fill="#888">R→L；B--</text>
  <!-- ④ up -->
  <rect x="462" y="258" width="108" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="516" y="280" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④ 向上 填左列</text>
  <text x="516" y="298" text-anchor="middle" font-size="9" fill="#888">B→T；L++</text>

  <!-- arrows between steps -->
  <path d="M 150 284 L 178 284" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290 284 L 318 284" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 430 284 L 458 284" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- guard annotations under ③④ -->
  <text x="376" y="326" text-anchor="middle" font-size="9" fill="#b85450">若 T≤B</text>
  <text x="516" y="326" text-anchor="middle" font-size="9" fill="#b85450">若 L≤R</text>

  <!-- loop-back arrow: ④ down, left across, up to diamond left -->
  <path d="M 516 314 L 516 372 L 24 372 L 24 168 L 168 168" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="364" font-size="10" fill="#446688" font-weight="bold">回到循环顶部（收缩后重新判定）</text>

  <!-- note box -->
  <rect x="42" y="396" width="516" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="416" text-anchor="middle" font-size="10" fill="#444">③④前的 if 守卫：当只剩一行 / 一列时，前两步已填完，后两步必须跳过，否则覆盖</text>
</svg>
