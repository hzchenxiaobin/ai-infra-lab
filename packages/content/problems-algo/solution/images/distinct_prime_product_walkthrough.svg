<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [2,4,3,7,10,6]，集合逐步累并</text>

  <!-- Table header -->
  <rect x="30" y="44" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="61" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">元素</text>
  <rect x="100" y="44" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="61" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">分解</text>
  <rect x="220" y="44" width="200" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="61" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">并入后的集合</text>
  <rect x="420" y="44" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="61" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">新增</text>

  <!-- Row 1: 2 -->
  <rect x="30" y="72" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="65" y="91" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="100" y="72" width="120" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="91" text-anchor="middle" font-size="11" fill="#333">2 （质数）</text>
  <rect x="220" y="72" width="200" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="320" y="91" text-anchor="middle" font-size="12" fill="#2f5d20" font-weight="bold">{2}</text>
  <rect x="420" y="72" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="450" y="91" text-anchor="middle" font-size="11" fill="#b85450">+2</text>

  <!-- Row 2: 4 -->
  <rect x="30" y="102" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="65" y="121" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="100" y="102" width="120" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="121" text-anchor="middle" font-size="11" fill="#333">2 × 2</text>
  <rect x="220" y="102" width="200" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="320" y="121" text-anchor="middle" font-size="12" fill="#2f5d20" font-weight="bold">{2}</text>
  <rect x="420" y="102" width="60" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="450" y="121" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- Row 3: 3 -->
  <rect x="30" y="132" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="65" y="151" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="100" y="132" width="120" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="151" text-anchor="middle" font-size="11" fill="#333">3 （质数）</text>
  <rect x="220" y="132" width="200" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="320" y="151" text-anchor="middle" font-size="12" fill="#2f5d20" font-weight="bold">{2, 3}</text>
  <rect x="420" y="132" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="450" y="151" text-anchor="middle" font-size="11" fill="#b85450">+3</text>

  <!-- Row 4: 7 -->
  <rect x="30" y="162" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="65" y="181" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <rect x="100" y="162" width="120" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="181" text-anchor="middle" font-size="11" fill="#333">7 （质数）</text>
  <rect x="220" y="162" width="200" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="320" y="181" text-anchor="middle" font-size="12" fill="#2f5d20" font-weight="bold">{2, 3, 7}</text>
  <rect x="420" y="162" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="450" y="181" text-anchor="middle" font-size="11" fill="#b85450">+7</text>

  <!-- Row 5: 10 -->
  <rect x="30" y="192" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="65" y="211" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>
  <rect x="100" y="192" width="120" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="211" text-anchor="middle" font-size="11" fill="#333">2 × 5</text>
  <rect x="220" y="192" width="200" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="320" y="211" text-anchor="middle" font-size="12" fill="#2f5d20" font-weight="bold">{2, 3, 5, 7}</text>
  <rect x="420" y="192" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="450" y="211" text-anchor="middle" font-size="11" fill="#b85450">+5</text>

  <!-- Row 6: 6 -->
  <rect x="30" y="222" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="65" y="241" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <rect x="100" y="222" width="120" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="241" text-anchor="middle" font-size="11" fill="#333">2 × 3</text>
  <rect x="220" y="222" width="200" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="320" y="241" text-anchor="middle" font-size="12" fill="#2f5d20" font-weight="bold">{2, 3, 5, 7}</text>
  <rect x="420" y="222" width="60" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="450" y="241" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- Result -->
  <rect x="30" y="266" width="450" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="255" y="293" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">最终集合 {2, 3, 5, 7} → 返回 4</text>

  <!-- Right note -->
  <rect x="490" y="266" width="120" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="550" y="284" text-anchor="middle" font-size="10" fill="#b07820">校验：乘积 =</text>
  <text x="550" y="300" text-anchor="middle" font-size="10" fill="#333">2⁵·3²·5·7</text>

  <!-- Bottom note -->
  <rect x="30" y="324" width="580" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="346" text-anchor="middle" font-size="12" fill="#333">关键：4 = 2×2、6 = 2×3 的因子都<tspan font-weight="bold">已在集合里</tspan>，并入后集合不变 → 重复质因子自然去重</text>
  <text x="320" y="366" text-anchor="middle" font-size="11" fill="#666">用哈希集合存储，「不同」即由集合唯一性保证，无需关心重数</text>
</svg>
