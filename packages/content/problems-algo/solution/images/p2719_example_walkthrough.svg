<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：count_le("12") = 11  （min_sum=1, max_sum=8）</text>

  <!-- Root -->
  <rect x="220" y="42" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">pos=0, tight=T</text>
  <text x="280" y="74" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">started=F, sum=0, up=1</text>

  <!-- Left branch: d=0 leading zero -->
  <path d="M 230,82 Q 160,110 110,140" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="118" y="120" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">d=0 (前导零)</text>

  <rect x="40" y="140" width="150" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="115" y="156" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">pos=1, tight=F, started=F</text>
  <text x="115" y="172" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">sum=0, up=9 → 1 位数</text>

  <!-- right branch: d=1 tight first digit -->
  <path d="M 330,82 Q 400,110 450,140" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="392" y="120" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">d=1 (贴界首位)</text>

  <rect x="370" y="140" width="150" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="445" y="156" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">pos=1, tight=T, started=T</text>
  <text x="445" y="172" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">sum=1, up=2 → 10/11/12</text>

  <!-- Leaves under left branch (1-digit) -->
  <text x="115" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">d=1…8：sum=1…8 ✓（各计 1）</text>
  <line x1="90" y1="186" x2="90" y2="206" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="140" y1="186" x2="140" y2="206" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="40" y="206" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="222" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">x=1…8  共 8</text>

  <rect x="130" y="206" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="222" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">d=9 ✗</text>
  <text x="160" y="246" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">sum=9&gt;8 剪枝</text>

  <!-- Leaves under right branch (10/11/12) -->
  <text x="445" y="200" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">d=0/1/2：sum=1/2/3 ✓</text>
  <line x1="420" y1="186" x2="420" y2="206" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <line x1="470" y1="186" x2="470" y2="206" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="370" y="206" width="150" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="445" y="222" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">x=10,11,12  共 3</text>

  <!-- Sum box -->
  <line x1="120" y1="238" x2="240" y2="270" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <line x1="440" y1="238" x2="320" y2="270" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="160" y="276" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">f(12) = 8 (短位数) + 3 (贴界) = <tspan font-weight="bold" fill="#b85450">11</tspan> ⭐</text>

  <!-- Final answer box -->
  <rect x="80" y="326" width="400" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="351" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">num1="1" → num1−1="0"，f(0)=0  ⇒  ans = f(12) − f(0) = <tspan font-weight="bold" fill="#b85450">11</tspan> ✓</text>
</svg>
