<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：奇偶判定 + 贪心取最小不同偶数</text>

  <!-- ====== Left: odd => impossible ====== -->
  <rect x="24" y="44" width="252" height="170" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)" opacity="0.35"/>
  <text x="150" y="66" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">观察一：奇数不可拆</text>
  <text x="150" y="84" text-anchor="middle" font-size="11" fill="#888">偶数 + 偶数 = 偶数（恒成立）</text>

  <!-- equation -->
  <rect x="56" y="100" width="188" height="40" fill="#ffffff" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="125" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2a + 2b + … = 2·(a+b+…)</text>

  <text x="150" y="162" text-anchor="middle" font-size="12" fill="#b85450">finalSum 为奇 → 无解</text>
  <rect x="104" y="172" width="92" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="150" y="192" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">return []</text>

  <!-- ====== Right: even => greedy ====== -->
  <rect x="284" y="44" width="252" height="170" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)" opacity="0.35"/>
  <text x="410" y="66" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">观察二：贪心取最小</text>
  <text x="410" y="84" text-anchor="middle" font-size="11" fill="#888">要数目最多 → 取尽量小的偶数</text>

  <!-- sequence 2,4,6,...,2k -->
  <rect x="312" y="100" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="120" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="352" y="100" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="120" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="392" y="100" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="120" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <text x="438" y="120" font-size="12" fill="#888">…</text>
  <rect x="456" y="100" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="478" y="120" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">余</text>

  <!-- sum formula -->
  <rect x="316" y="140" width="188" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="410" y="162" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">前 k 项和 = 2+4+…+2k = k(k+1)</text>

  <text x="410" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a">末位吸收剩余，保证互异</text>
  <text x="410" y="206" text-anchor="middle" font-size="11" fill="#4a7a3a">余 ≥ 2k &gt; 2(k−1) ✓</text>

  <!-- ====== Bottom: max count formula ====== -->
  <rect x="24" y="226" width="512" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">最大化数目 k ⟺ 找最大 k 使 k(k+1) ≤ finalSum</text>
  <text x="280" y="274" text-anchor="middle" font-size="12" fill="#666">→ 贪心：依次取 2,4,…,2k，剩余不够下一项时整块吸收</text>
  <text x="280" y="294" text-anchor="middle" font-size="12" fill="#666">→ k ≈ √finalSum，循环 O(√finalSum)</text>

  <!-- ====== Bottom strip: example mini ====== -->
  <rect x="24" y="316" width="512" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)" opacity="0.5"/>
  <text x="280" y="340" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">示例：finalSum = 28</text>

  <rect x="60" y="354" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="374" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <path d="M 96 369 L 112 369" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="116" y="354" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="134" y="374" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <path d="M 152 369 L 168 369" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="172" y="354" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="374" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <path d="M 208 369 L 224 369" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="228" y="354" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="374" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">16</text>

  <text x="296" y="374" font-size="13" fill="#4a7a3a" font-weight="bold">→ 2+4+6+16 = 28 ✓</text>
  <text x="380" y="396" font-size="11" fill="#888">数目 4 = max k 使 k(k+1)≤28</text>
</svg>
