<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [3,5,4,2,4,6]</text>

  <!-- ===== Row 0: input ===== -->
  <text x="50" y="52" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">输入</text>
  <rect x="120" y="38" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="164" y="38" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="208" y="38" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="252" y="38" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="296" y="38" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="340" y="38" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="139" y="56" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="183" y="56" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="227" y="56" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="271" y="56" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="315" y="56" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="359" y="56" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- arrow down -->
  <path d="M 250 70 L 250 84" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="265" y="80" font-size="9" fill="#666" filter="url(#rough2)">排序</text>

  <!-- ===== Row 1: sorted ===== -->
  <text x="50" y="104" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">排序后</text>
  <rect x="120" y="90" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="164" y="90" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="208" y="90" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="252" y="90" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="296" y="90" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="340" y="90" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="139" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="183" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="227" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="271" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="315" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="359" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- i / j pointer labels -->
  <text x="139" y="128" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">i=0</text>
  <text x="359" y="128" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">j=5</text>

  <!-- divider -->
  <path d="M 40 138 L 540 138" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Step-by-step table ===== -->
  <text x="290" y="156" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">逐对计算最大数对和</text>

  <!-- Column headers -->
  <text x="70" y="176" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="180" y="176" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">配对</text>
  <text x="300" y="176" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">数对和</text>
  <text x="440" y="176" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">当前 ans</text>

  <!-- Step 1: i=0, j=5: 2+6=8 -->
  <rect x="40" y="184" width="500" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="4" filter="url(#rough2)" opacity="0.5"/>
  <text x="70" y="202" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">i=0, j=5</text>
  <rect x="150" y="188" width="30" height="22" fill="#e6f4ea" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="165" y="203" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="188" y="203" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">+</text>
  <rect x="200" y="188" width="30" height="22" fill="#e6f4ea" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="215" y="203" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="300" y="203" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2 + 6 = 8</text>
  <text x="440" y="203" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">max(0, 8) = 8</text>

  <!-- Step 2: i=1, j=4: 3+5=8 -->
  <rect x="40" y="214" width="500" height="28" fill="#fafafa" stroke="#eee" stroke-width="0.8" rx="4" filter="url(#rough2)" opacity="0.5"/>
  <text x="70" y="232" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">i=1, j=4</text>
  <rect x="150" y="218" width="30" height="22" fill="#e6f4ea" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="165" y="233" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="188" y="233" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">+</text>
  <rect x="200" y="218" width="30" height="22" fill="#e6f4ea" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="215" y="233" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="300" y="233" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3 + 5 = 8</text>
  <text x="440" y="233" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">max(8, 8) = 8</text>

  <!-- Step 3: i=2, j=3: 4+4=8 -->
  <rect x="40" y="244" width="500" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="4" filter="url(#rough2)" opacity="0.5"/>
  <text x="70" y="262" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">i=2, j=3</text>
  <rect x="150" y="248" width="30" height="22" fill="#e6f4ea" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="165" y="263" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="188" y="263" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">+</text>
  <rect x="200" y="248" width="30" height="22" fill="#e6f4ea" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="215" y="263" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="300" y="263" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4 + 4 = 8</text>
  <text x="440" y="263" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">max(8, 8) = 8</text>

  <!-- result box -->
  <rect x="120" y="286" width="340" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="310" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = 8</text>

  <!-- contrast: 相邻配对 -->
  <path d="M 290 326 L 290 340" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="342" width="460" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="358" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">对照：相邻配对 (2,3)(4,4)(5,6) → max(5,8,11) = 11 &gt; 8</text>

  <!-- insight -->
  <rect x="60" y="372" width="460" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="290" y="387" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">首尾配对：2+6 = 3+5 = 4+4 = 8 → 均衡 → 最大值最小</text>
</svg>
