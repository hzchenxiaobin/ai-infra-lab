<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrGy" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">限制松弛的 Bellman-Ford：每轮读 prev 快照、写 dist</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">k+1 轮 → 最多 k+1 条边；快照防止同轮连走多条边</text>

  <!-- ===== Top: rounds timeline ===== -->
  <text x="40" y="78" font-size="11" fill="#446688" font-weight="bold">松弛轮数（每轮延伸一条边）</text>

  <rect x="60" y="88" width="92" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="106" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">第 1 轮</text>
  <text x="106" y="124" text-anchor="middle" font-size="10" fill="#555">1 条边</text>

  <path d="M 154 110 L 188 110" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrGy)" filter="url(#rough2)"/>
  <text x="171" y="102" text-anchor="middle" font-size="9" fill="#888">+1边</text>

  <rect x="192" y="88" width="92" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="238" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">第 2 轮</text>
  <text x="238" y="124" text-anchor="middle" font-size="10" fill="#555">2 条边</text>

  <path d="M 286 110 L 326 110" stroke="#888" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrGy)" filter="url(#rough2)"/>
  <text x="306" y="102" text-anchor="middle" font-size="11" fill="#888">…</text>

  <rect x="330" y="88" width="100" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="380" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">第 k+1 轮</text>
  <text x="380" y="124" text-anchor="middle" font-size="10" fill="#d6a040">k+1 条边（上限）</text>

  <rect x="448" y="88" width="92" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="494" y="108" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结束</text>
  <text x="494" y="124" text-anchor="middle" font-size="10" fill="#555">读 dist[dst]</text>

  <path d="M 430 110 L 446 110" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrGy)" filter="url(#rough2)"/>

  <!-- ===== Bottom: snapshot mechanism ===== -->
  <text x="40" y="172" font-size="11" fill="#446688" font-weight="bold">快照机制（以第 2 轮、示例 1 为例）</text>

  <!-- prev row label -->
  <text x="40" y="216" font-size="12" fill="#4a7a3a" font-weight="bold">prev</text>
  <text x="40" y="230" font-size="9" fill="#888">上一轮快照</text>
  <text x="40" y="242" font-size="9" fill="#888">（只读）</text>

  <!-- index labels -->
  <text x="124" y="184" text-anchor="middle" font-size="9" fill="#888">[0]</text>
  <text x="184" y="184" text-anchor="middle" font-size="9" fill="#888">[1]</text>
  <text x="244" y="184" text-anchor="middle" font-size="9" fill="#888">[2]</text>
  <text x="304" y="184" text-anchor="middle" font-size="9" fill="#888">[3]</text>

  <!-- prev cells: [0]=0, [1]=100, [2]=∞, [3]=∞ -->
  <rect x="96" y="190" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="124" y="215" text-anchor="middle" font-size="13" fill="#333">0</text>

  <rect x="156" y="190" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="215" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">100</text>

  <rect x="216" y="190" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="244" y="215" text-anchor="middle" font-size="13" fill="#aaa">∞</text>

  <rect x="276" y="190" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="304" y="215" text-anchor="middle" font-size="13" fill="#aaa">∞</text>

  <!-- dist row label -->
  <text x="40" y="316" font-size="12" fill="#446688" font-weight="bold">dist</text>
  <text x="40" y="330" font-size="9" fill="#888">本轮写入</text>

  <!-- dist cells: [0]=0, [1]=100, [2]=200(新), [3]=700(新) -->
  <rect x="96" y="290" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="124" y="315" text-anchor="middle" font-size="13" fill="#333">0</text>

  <rect x="156" y="290" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="184" y="315" text-anchor="middle" font-size="13" fill="#333">100</text>

  <rect x="216" y="290" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="244" y="315" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">200</text>
  <text x="244" y="345" text-anchor="middle" font-size="9" fill="#d6a040">新写入</text>

  <rect x="276" y="290" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="304" y="315" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">700</text>
  <text x="304" y="345" text-anchor="middle" font-size="9" fill="#d6a040">新写入</text>

  <!-- Allowed arrow: prev[1] -> dist[2] -->
  <path d="M 184 232 Q 200 260 238 288" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="196" y="262" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 1→2</text>
  <text x="196" y="274" font-size="9" fill="#4a7a3a">读 prev[1]+100</text>

  <!-- Allowed arrow: prev[1] -> dist[3] -->
  <path d="M 184 232 Q 240 252 300 288" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="262" y="262" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 1→3</text>
  <text x="262" y="274" font-size="9" fill="#4a7a3a">读 prev[1]+600</text>

  <!-- Forbidden arrow: dist[2] -> dist[3] (same round read) -->
  <path d="M 272 310 L 276 310" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <line x1="248" y1="300" x2="284" y2="320" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="248" y1="320" x2="284" y2="300" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="244" y="368" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗ 2→3 禁止读 dist[2]</text>
  <text x="244" y="380" text-anchor="middle" font-size="9" fill="#b85450">否则同轮连走 2 边 → 越限</text>

  <!-- Right side note box -->
  <rect x="376" y="190" width="160" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="456" y="212" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">为什么用快照？</text>
  <text x="456" y="232" text-anchor="middle" font-size="10" fill="#555">同轮内 dist[v] 被更新后</text>
  <text x="456" y="246" text-anchor="middle" font-size="10" fill="#555">若立刻被 v→w 读取，</text>
  <text x="456" y="260" text-anchor="middle" font-size="10" fill="#555">本轮就连走了 2 条边</text>
  <text x="456" y="278" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">→ 破坏 k+1 边约束</text>
  <text x="456" y="298" text-anchor="middle" font-size="9" fill="#888">读 prev（旧）、写 dist（新）</text>

  <!-- footer -->
  <text x="280" y="424" text-anchor="middle" font-size="10" fill="#888">每轮基于上一轮结果延伸一条边 ⇒ 第 i 轮后 dist[v] = 最多 i 条边到 v 的最低价</text>
</svg>
