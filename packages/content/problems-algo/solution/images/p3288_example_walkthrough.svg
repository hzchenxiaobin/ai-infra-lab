<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1 演算：锚点 k = (2, 2)</text>

  <!-- 表头 -->
  <rect x="45" y="40" width="110" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="100" y="58" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold" filter="url(#rough2)">点</text>
  <rect x="155" y="40" width="190" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="250" y="58" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold" filter="url(#rough2)">与锚点 (2,2) 比较</text>
  <rect x="345" y="40" width="130" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="410" y="58" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold" filter="url(#rough2)">判定</text>

  <!-- 行 1：剔除 -->
  <rect x="45" y="72" width="110" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="100" y="93" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">(3, 1)</text>
  <rect x="155" y="72" width="190" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="250" y="93" text-anchor="middle" font-size="10" fill="#8a4a48" filter="url(#rough2)">x=3 &gt; 2 ✓ 但 y=1 &lt; 2 ✗</text>
  <rect x="345" y="72" width="130" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="410" y="93" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">不可比，剔除</text>

  <!-- 行 2：锚点 -->
  <rect x="45" y="110" width="110" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="131" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">(2, 2)</text>
  <rect x="155" y="110" width="190" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="131" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">锚点本身</text>
  <rect x="345" y="110" width="130" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="131" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">自身，计 1</text>

  <!-- 行 3：剔除 -->
  <rect x="45" y="148" width="110" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="100" y="169" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">(4, 1)</text>
  <rect x="155" y="148" width="190" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="250" y="169" text-anchor="middle" font-size="10" fill="#8a4a48" filter="url(#rough2)">x=4 &gt; 2 ✓ 但 y=1 &lt; 2 ✗</text>
  <rect x="345" y="148" width="130" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="410" y="169" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">不可比，剔除</text>

  <!-- 行 4：左下 -->
  <rect x="45" y="186" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="100" y="207" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(0, 0)</text>
  <rect x="155" y="186" width="190" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="250" y="207" text-anchor="middle" font-size="10" fill="#3a5f30" filter="url(#rough2)">x=0 &lt; 2 且 y=0 &lt; 2</text>
  <rect x="345" y="186" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="410" y="207" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">左下区 ✓</text>

  <!-- 行 5：右上 -->
  <rect x="45" y="224" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="100" y="245" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">(5, 3)</text>
  <rect x="155" y="224" width="190" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="250" y="245" text-anchor="middle" font-size="10" fill="#2c4a66" filter="url(#rough2)">x=5 &gt; 2 且 y=3 &gt; 2</text>
  <rect x="345" y="224" width="130" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="410" y="245" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">右上区 ✓</text>

  <!-- 求和区 -->
  <text x="260" y="280" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">三段拼接：</text>

  <rect x="48" y="290" width="124" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="110" y="311" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">LIS(左下) = 1</text>

  <text x="184" y="312" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">+</text>

  <rect x="198" y="290" width="110" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="253" y="311" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">k 自身 = 1</text>

  <text x="320" y="312" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">+</text>

  <rect x="334" y="290" width="124" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="396" y="311" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">LIS(右上) = 1</text>

  <path d="M 470 307 L 484 307" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="496" y="312" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>

  <text x="260" y="346" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">对应路径：(0,0) → (2,2) → (5,3) ✓</text>
</svg>
