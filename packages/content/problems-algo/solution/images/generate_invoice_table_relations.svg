<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两表关联：Purchases JOIN Products ON product_id</text>

  <!-- ===== Purchases table ===== -->
  <rect x="30" y="50" width="200" height="160" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="130" y="70" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">Purchases</text>
  <line x1="40" y1="78" x2="220" y2="78" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="42" y="94" font-size="11" fill="#333">invoice_id</text>
  <text x="42" y="110" font-size="11" fill="#b85450" font-weight="bold">product_id  FK</text>
  <text x="42" y="126" font-size="11" fill="#333">quantity</text>
  <text x="42" y="148" font-size="10" fill="#888">inv=1, p=1, q=2</text>
  <text x="42" y="162" font-size="10" fill="#888">inv=2, p=2, q=3</text>
  <text x="42" y="176" font-size="10" fill="#888">inv=2, p=1, q=4</text>
  <text x="42" y="192" font-size="10" fill="#888">inv=4, p=1, q=10</text>

  <!-- ===== Products table ===== -->
  <rect x="350" y="50" width="190" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="445" y="70" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">Products</text>
  <line x1="360" y1="78" x2="530" y2="78" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="362" y="94" font-size="11" fill="#b85450" font-weight="bold">product_id  PK</text>
  <text x="362" y="110" font-size="11" fill="#d6a040" font-weight="bold">price</text>
  <text x="362" y="132" font-size="10" fill="#888">1: price=100</text>
  <text x="362" y="146" font-size="10" fill="#888">2: price=200</text>

  <!-- Join arrow -->
  <path d="M 230 104 L 350 104" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="97" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">JOIN ON product_id</text>
  <text x="290" y="120" text-anchor="middle" font-size="9" fill="#b85450">取 unit price</text>

  <!-- ===== Formula box ===== -->
  <rect x="80" y="238" width="400" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="260" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">单行金额 = quantity × Products.price</text>
  <text x="280" y="278" text-anchor="middle" font-size="10" fill="#888">每条采购 → 数量 × 单价 = 该行金额</text>

  <!-- ===== Output ===== -->
  <rect x="120" y="310" width="320" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">输出：invoice_id, price</text>
  <text x="280" y="348" text-anchor="middle" font-size="10" fill="#888">GROUP BY invoice_id → SUM(单行金额)</text>

  <!-- arrows -->
  <path d="M 280 288 L 280 310" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
