<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="20" y="26" font-size="13" fill="#333" filter="url(#rough2)">核心观察：F(y) 单调不减 → 二分找 F(y) ≥ total/2 的最小 y</text>

  <!-- 左图：正方形与水平线 -->
  <text x="130" y="52" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">squares = [[0,0,2],[1,1,1]]</text>

  <!-- 坐标轴 -->
  <path d="M60,60 L60,300 L250,300" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="66" font-size="10" fill="#888" filter="url(#rough2)">y</text>
  <text x="252" y="314" font-size="10" fill="#888" filter="url(#rough2)">x</text>

  <!-- 正方形 A [0,0,2] -->
  <rect x="60" y="210" width="90" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="105" y="260" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">A</text>

  <!-- 正方形 B [1,1,1] -->
  <rect x="105" y="255" width="45" height="45" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="128" y="282" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">B</text>

  <!-- 水平分割线 y* = 7/6 -->
  <path d="M40,247.5 L250,247.5" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="7,5" filter="url(#rough2)"/>
  <text x="36" y="244" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">y*</text>

  <!-- 上下面积标注 -->
  <text x="205" y="200" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">线上面积 = 2.5</text>
  <text x="205" y="290" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">线下面积 = 2.5</text>

  <text x="130" y="332" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">水平线上下面积相等，取最小 y*</text>

  <!-- 右图：F(y) 曲线 -->
  <text x="400" y="52" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">F(y) 线下面积曲线</text>

  <path d="M310,80 L310,300 L500,300" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="298" y="86" font-size="10" fill="#888" filter="url(#rough2)">F</text>
  <text x="502" y="314" font-size="10" fill="#888" filter="url(#rough2)">y</text>

  <!-- total 高度虚线 -->
  <path d="M310,120 L445,120" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="4,4" filter="url(#rough2)"/>
  <text x="314" y="114" font-size="10" fill="#888" filter="url(#rough2)">total = 5</text>

  <!-- total/2 高度虚线 -->
  <path d="M310,210 L470,210" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="314" y="204" font-size="10" fill="#d6a040" filter="url(#rough2)">total/2 = 2.5</text>

  <!-- F(y) 曲线: (0,0)->(1,2)->(2,5)->(3,5) -->
  <path d="M310,300 L355,228 L400,120 L445,120" fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- 交点 y* -->
  <circle cx="362.5" cy="210" r="5" fill="#b85450" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M362.5,210 L362.5,300" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,4" filter="url(#rough2)"/>
  <text x="372" y="230" font-size="11" fill="#b85450" filter="url(#rough2)">y* = 7/6</text>
  <text x="352" y="316" text-anchor="end" font-size="10" fill="#b85450" filter="url(#rough2)">7/6</text>
  <text x="355" y="316" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="402" y="316" font-size="10" fill="#888" filter="url(#rough2)">2</text>

  <text x="400" y="332" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">F 单调不减且连续 → 二分下界即最小 y*</text>

  <!-- 底部结论 -->
  <rect x="55" y="340" width="410" height="16" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)" opacity="0.6"/>
</svg>
