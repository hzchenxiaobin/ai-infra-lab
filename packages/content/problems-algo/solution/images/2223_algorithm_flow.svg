<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">Z 算法：维护最右匹配段 [l, r)，复用 z[i−l] + 暴力扩展</text>

  <!-- ====== Z-box concept (top) ====== -->
  <text x="290" y="52" text-anchor="middle" font-size="11" fill="#888">Z-box：s[l..r) 与 s[0..r−l) 完全相同，位置 i 的镜像 i−l 在前缀区</text>

  <!-- prefix row (upper) -->
  <text x="64" y="84" text-anchor="end" font-size="10.5" fill="#446688" font-weight="bold">前缀区</text>
  <rect x="84" y="68" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="104" y="86" text-anchor="middle" font-size="10.5" fill="#335">0</text>
  <rect x="124" y="68" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="144" y="86" text-anchor="middle" font-size="10.5" fill="#335">1</text>
  <rect x="164" y="68" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="86" text-anchor="middle" font-size="10.5" fill="#a87020" font-weight="bold">i−l</text>
  <rect x="204" y="68" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="224" y="86" text-anchor="middle" font-size="10.5" fill="#335">…</text>
  <rect x="244" y="68" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="264" y="86" text-anchor="middle" font-size="10.5" fill="#335">r−l−1</text>

  <!-- Z-box row (lower) -->
  <text x="64" y="128" text-anchor="end" font-size="10.5" fill="#4a7a3a" font-weight="bold">Z-box</text>
  <rect x="84" y="112" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="104" y="130" text-anchor="middle" font-size="10.5" fill="#3a5a2a">l</text>
  <rect x="124" y="112" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="144" y="130" text-anchor="middle" font-size="10.5" fill="#3a5a2a">l+1</text>
  <rect x="164" y="112" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="130" text-anchor="middle" font-size="10.5" fill="#a87020" font-weight="bold">i</text>
  <rect x="204" y="112" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="224" y="130" text-anchor="middle" font-size="10.5" fill="#3a5a2a">…</text>
  <rect x="244" y="112" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="264" y="130" text-anchor="middle" font-size="10.5" fill="#3a5a2a">r−1</text>

  <!-- dashed connectors -->
  <path d="M 104 96 L 104 112" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 144 96 L 144 112" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 184 96 L 184 112" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 224 96 L 224 112" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 264 96 L 264 112" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- bracket labels -->
  <text x="184" y="158" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">↑ s[i..r) 镜像 s[i−l..r−l)，z[i−l] 已知</text>

  <!-- divider -->
  <path d="M 30 172 L 550 172" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Flowchart (bottom) ====== -->
  <!-- Start box -->
  <rect x="220" y="184" width="140" height="28" fill="#fff" stroke="#888" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="290" y="203" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">i = 1 → n−1 循环</text>
  <path d="M 290 212 L 290 224" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Decision: i < r ? -->
  <path d="M 290 224 L 330 246 L 290 268 L 250 246 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="250" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">i &lt; r ?</text>

  <!-- Yes branch (down) -->
  <text x="296" y="284" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 290 268 L 290 286" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="180" y="286" width="220" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="305" text-anchor="middle" font-size="10.5" fill="#3a5a2a" font-weight="bold">z[i] = min(r − i, z[i − l])</text>

  <!-- No branch (right) -->
  <text x="340" y="242" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <path d="M 330 246 L 408 246" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="408" y="232" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="468" y="251" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">z[i] = 0（盒外）</text>
  <!-- merge from No branch down to extend box -->
  <path d="M 468 260 L 468 326 L 400 326" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- arrow from yes box to extend -->
  <path d="M 290 314 L 290 326" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Extend box -->
  <rect x="150" y="326" width="280" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="290" y="346" text-anchor="middle" font-size="10.5" fill="#335" font-weight="bold">扩展：while s[i+z] == s[z]：z[i]++</text>
  <path d="M 290 356 L 290 368" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Decision: update box? -->
  <path d="M 290 368 L 330 390 L 290 412 L 250 390 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="394" text-anchor="middle" font-size="10.5" fill="#a87020" font-weight="bold">i+z &gt; r ?</text>

  <!-- Yes: update l,r -->
  <text x="296" y="428" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 290 412 L 290 430" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="170" y="430" width="240" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="449" text-anchor="middle" font-size="10.5" fill="#3a5a2a" font-weight="bold">更新 l = i, r = i + z[i]（扩张盒子）</text>

  <!-- No: skip -->
  <text x="338" y="386" font-size="10" fill="#888" font-weight="bold">否</text>
  <path d="M 330 390 L 470 390 L 470 444 L 410 444" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="488" y="416" text-anchor="middle" font-size="9.5" fill="#888">盒子不变</text>
</svg>
