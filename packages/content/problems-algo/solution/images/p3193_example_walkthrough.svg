<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 368"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="368" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：n = 3，requirements = [[2,2],[1,1],[0,0]]</text>

  <text x="70" y="50" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">阶段</text>
  <text x="190" y="50" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j=0</text>
  <text x="234" y="50" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j=1</text>
  <text x="278" y="50" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j=2</text>
  <text x="322" y="50" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j=3</text>
  <text x="410" y="50" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">需求 → 动作</text>

  <text x="70" y="82" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">i=1（插值 0）</text>
  <rect x="170" y="58" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="84" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="214" y="58" width="40" height="40" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="84" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="258" y="58" width="40" height="40" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="278" y="84" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="302" y="58" width="40" height="40" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="84" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="356" y="82" font-size="9.5" fill="#555" filter="url(#rough2)">[0,0]：j=0 天然满足 ✓</text>

  <text x="70" y="132" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">i=2（插值 1）</text>
  <rect x="170" y="108" width="40" height="40" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="134" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="204" y="118" font-size="8" fill="#b85450" filter="url(#rough2)">✗</text>
  <rect x="214" y="108" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="134" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="258" y="108" width="40" height="40" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="278" y="134" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="302" y="108" width="40" height="40" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="134" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="356" y="132" font-size="9.5" fill="#555" filter="url(#rough2)">[1,1]：清零 j ≠ 1</text>

  <text x="70" y="182" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">i=3（插值 2）</text>
  <rect x="170" y="158" width="40" height="40" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="184" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="214" y="158" width="40" height="40" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="184" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="248" y="168" font-size="8" fill="#b85450" filter="url(#rough2)">✗</text>
  <rect x="258" y="158" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="278" y="184" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="302" y="158" width="40" height="40" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="184" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="336" y="168" font-size="8" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="356" y="182" font-size="9.5" fill="#555" filter="url(#rough2)">[2,2]：清零 j ≠ 2</text>

  <text x="260" y="224" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">答案 = dp[2] = 1</text>

  <rect x="36" y="238" width="448" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="260" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">幸存路径：i=2 选 k=1 —— 值 1 必须排在值 0 前面</text>
  <text x="260" y="278" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">　　　　　i=3 选 k=1 —— 值 2 右侧恰有 1 个更小值</text>

  <text x="128" y="320" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">σ =</text>
  <rect x="140" y="296" width="32" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="156" y="316" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="178" y="296" width="32" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="194" y="316" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="216" y="296" width="32" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="232" y="316" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">0</text>

  <line x1="256" y1="311" x2="288" y2="311" stroke="#446688" stroke-width="1.8" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="272" y="302" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">取逆</text>

  <rect x="296" y="296" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="316" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="334" y="296" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="316" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="372" y="296" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="388" y="316" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="260" y="346" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">perm = [2,0,1] ✓ 与官方唯一解一致</text>
</svg>
