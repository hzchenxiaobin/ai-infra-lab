<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">排序后父文件夹必在子文件夹前 → 只需比对待入队项与队尾</text>

  <!-- ===== Sorted folder list ===== -->
  <text x="40" y="60" font-size="11" fill="#888">排序后（示例 1）</text>

  <!-- row 0: /a  KEPT -->
  <rect x="40" y="70" width="170" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="55" y="90" font-size="13" fill="#333" font-weight="bold">/a</text>
  <text x="180" y="90" font-size="10" fill="#4a7a3a" font-weight="bold">保留</text>

  <!-- row 1: /a/b  REMOVED -->
  <rect x="40" y="106" width="170" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="55" y="126" font-size="13" fill="#b85450" font-weight="bold">/a/b</text>
  <!-- strikethrough -->
  <path d="M 48 121 L 150 121" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="126" font-size="10" fill="#b85450" font-weight="bold">跳过</text>
  <text x="222" y="126" font-size="9.5" fill="#888">← /a 的子</text>

  <!-- row 2: /c/d  KEPT -->
  <rect x="40" y="142" width="170" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="55" y="162" font-size="13" fill="#333" font-weight="bold">/c/d</text>
  <text x="180" y="162" font-size="10" fill="#4a7a3a" font-weight="bold">保留</text>

  <!-- row 3: /c/d/e  REMOVED -->
  <rect x="40" y="178" width="170" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="55" y="198" font-size="13" fill="#b85450" font-weight="bold">/c/d/e</text>
  <path d="M 48 193 L 150 193" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="198" font-size="10" fill="#b85450" font-weight="bold">跳过</text>
  <text x="222" y="198" font-size="9.5" fill="#888">← /c/d 的子</text>

  <!-- row 4: /c/f  KEPT -->
  <rect x="40" y="214" width="170" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="55" y="234" font-size="13" fill="#333" font-weight="bold">/c/f</text>
  <text x="180" y="234" font-size="10" fill="#4a7a3a" font-weight="bold">保留</text>

  <!-- prev pointer: compare /a/b against /a -->
  <path d="M 210 85 Q 232 100 232 121" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="236" y="108" font-size="9" fill="#4a7a3a">比对队尾</text>

  <!-- ===== Rule box ===== -->
  <rect x="300" y="70" width="200" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="400" y="90" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">判定规则</text>
  <text x="400" y="110" text-anchor="middle" font-size="12" fill="#333">f 以 prev + "/" 开头？</text>
  <text x="400" y="128" text-anchor="middle" font-size="11" fill="#b85450">是 → 子文件夹，跳过</text>
  <text x="400" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a">否 → 保留，prev ← f</text>

  <!-- mini examples -->
  <rect x="300" y="172" width="200" height="74" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="400" y="190" text-anchor="middle" font-size="10.5" fill="#888">两个微例</text>
  <text x="312" y="208" font-size="10" fill="#333">"/a/b".startswith("/a/")</text>
  <text x="478" y="208" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">✓ 跳过</text>
  <text x="312" y="226" font-size="10" fill="#333">"/a/b/ca".startswith("/a/b/c/")</text>
  <text x="478" y="226" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold">✗ 保留</text>
  <text x="312" y="240" font-size="9" fill="#888">注意是 "/a/b/c/" 不是 "/a/b/c"</text>

  <!-- ===== Summary ===== -->
  <rect x="30" y="262" width="470" height="82" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="265" y="284" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">为什么只比对待入队项与「队尾」就够？</text>
  <text x="265" y="304" text-anchor="middle" font-size="11" fill="#666">排序后某父文件夹的全部后代构成一段连续区间，紧跟其后；</text>
  <text x="265" y="322" text-anchor="middle" font-size="11" fill="#666">区间内逐个跳过，队尾始终是父文件夹；走出区间即换新父。</text>
  <text x="265" y="338" text-anchor="middle" font-size="10.5" fill="#d6a040">⚠ 必须拼 "/" ：否则 "/a/b/ca" 会被误判为 "/a/b/c" 的子文件夹</text>
</svg>
