<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：尾部追加 = 带权拆分，dp[i] 枚举「最后一段」</text>

  <!-- target 字符格 -->
  <text x="54" y="64" text-anchor="end" font-size="12" fill="#888" filter="url(#rough2)">target</text>
  <rect x="64" y="46" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="67" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="100" y="46" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="116" y="67" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="136" y="46" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="152" y="67" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="172" y="46" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="67" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>
  <rect x="208" y="46" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="67" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">e</text>
  <rect x="244" y="46" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="67" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">f</text>

  <!-- 拆分段括号 -->
  <path d="M64,84 v8 h104 v-8" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="116" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">abc ¥1</text>
  <path d="M172,84 v8 h32 v-8" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="188" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">d ¥1</text>
  <path d="M208,84 v8 h68 v-8" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="242" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">ef ¥5</text>

  <path d="M170,116 L170,136" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- dp 条 -->
  <text x="170" y="140" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">dp[i] = 构造前 i 个字符的最小代价（dp[0] = 0）</text>
  <rect x="46" y="148" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="62" y="166" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="82" y="148" width="32" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="98" y="166" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">∞</text>
  <rect x="118" y="148" width="32" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="134" y="166" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">∞</text>
  <rect x="154" y="148" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="166" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="190" y="148" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="206" y="166" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="226" y="148" width="32" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="242" y="166" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">100</text>
  <rect x="262" y="148" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="278" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">7</text>
  <text x="62" y="188" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">dp[0]</text>
  <text x="170" y="188" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">dp[3]=dp[0]+1</text>
  <text x="206" y="188" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">dp[4]=dp[3]+1</text>
  <text x="242" y="188" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">abdef 整段 ¥100</text>
  <text x="278" y="188" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">dp[6]=dp[4]+5</text>

  <!-- 右侧三个观察框 -->
  <rect x="322" y="42" width="186" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="415" y="62" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">追加 ⇒ 有序划分</text>
  <text x="415" y="78" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">每段恰为一个单词，代价相加</text>
  <text x="415" y="92" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">与 139 单词拆分同构</text>

  <rect x="322" y="108" width="186" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="415" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">最后一段视角</text>
  <text x="415" y="144" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">dp[i] = min(dp[i−L] + cost(w))</text>
  <text x="415" y="158" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">w 取遍结束于 i 的单词</text>

  <rect x="322" y="174" width="186" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="415" y="194" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">简单版查词怎么快？</text>
  <text x="415" y="210" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">哈希表 O(1) 判 target[i−L..i) ∈ words</text>
  <text x="415" y="224" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">或 Trie 起点下行，一次判一串</text>

  <!-- 底部：进阶链条 -->
  <rect x="46" y="248" width="462" height="66" rx="8" fill="#fff" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="277" y="268" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">一条进化链：拆分模型不变，换的是「查词」的数据结构</text>
  <text x="277" y="286" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">139 可行性（哈希集合） → 3253 简单版带权（哈希表 / Trie 下行）</text>
  <text x="277" y="302" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">→ 3213 困难版 5×10⁴（AC 自动机 / 滚动哈希）</text>

  <text x="260" y="342" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">本题 = 139 的「带权最优化」简单版</text>
</svg>
