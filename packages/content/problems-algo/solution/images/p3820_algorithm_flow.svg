<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：建邻接表 → 三次单源 BFS → 逐节点勾股判定</text>
  <text x="260" y="38" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">建表 O(n) + 3×BFS O(n) + 判定 O(n) = O(n) 时间 / O(n) 空间</text>

  <!-- Step 1 -->
  <rect x="160" y="52" width="200" height="30" fill="#f5f5f5" stroke="#666" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="71" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">① 建无向邻接表（O(n)）</text>

  <!-- arrows to BFS boxes -->
  <path d="M 220 82 L 118 106" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 82 L 259 106" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 82 L 401 106" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: three BFS boxes -->
  <rect x="45" y="108" width="140" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="115" y="127" text-anchor="middle" font-size="10.5" fill="#335" font-weight="bold" filter="url(#rough2)">② BFS 从 x</text>
  <text x="115" y="144" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">得距离表 dx[]</text>

  <rect x="190" y="108" width="140" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="127" text-anchor="middle" font-size="10.5" fill="#335" font-weight="bold" filter="url(#rough2)">② BFS 从 y</text>
  <text x="260" y="144" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">得距离表 dy[]</text>

  <rect x="335" y="108" width="140" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="405" y="127" text-anchor="middle" font-size="10.5" fill="#335" font-weight="bold" filter="url(#rough2)">② BFS 从 z</text>
  <text x="405" y="144" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">得距离表 dz[]</text>

  <!-- arrows to step 3 -->
  <path d="M 115 154 L 185 188" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 154 L 260 188" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 405 154 L 335 188" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="95" y="190" width="330" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="211" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">③ u = 0…n−1：取 (dx[u], dy[u], dz[u]) 排序 → a ≤ b ≤ c</text>

  <!-- arrow to diamond -->
  <path d="M 260 224 L 260 230" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="260,232 342,258 260,284 178,258" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">a²+b² = c² ？</text>

  <!-- yes branch -->
  <path d="M 342 258 L 362 258" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="250" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="365" y="244" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="262" text-anchor="middle" font-size="10.5" fill="#335" font-weight="bold" filter="url(#rough2)">ans += 1</text>

  <!-- loop paths -->
  <path d="M 420 272 L 420 310" stroke="#555" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 260 284 L 260 310" stroke="#555" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="248" y="300" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 420 310 L 75 310 L 75 207 L 91 207" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="303" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">u &lt; n：下一个 u</text>

  <!-- exit -->
  <path d="M 332 310 L 332 316" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="332" y="304" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">u = n：退出</text>

  <!-- return box -->
  <rect x="240" y="318" width="185" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="332" y="337" text-anchor="middle" font-size="10.5" fill="#335" font-weight="bold" filter="url(#rough2)">④ 遍历结束，返回 ans</text>
</svg>
