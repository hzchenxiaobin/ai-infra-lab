<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 570"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="570" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="280" y="20" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">算法流程：枚举 n 种左旋次数 r，每种下 ⌊n/2⌋ 个镜像对独立计费</text>

    <!-- ① init -->
    <rect x="90" y="34" width="280" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="230" y="55" text-anchor="middle" font-size="10.5" fill="#2f5d24">① 读入 s、n；ans ← +∞</text>
    <path d="M 230 68 V 82" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>

    <!-- ② outer loop over r -->
    <rect x="90" y="84" width="280" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="230" y="103" text-anchor="middle" font-size="10" fill="#33506b">② 枚举左旋次数 r = 0 … n − 1</text>
    <text x="230" y="120" text-anchor="middle" font-size="9" fill="#555">cost ← r（先付旋转成本）</text>
    <path d="M 230 132 V 146" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>

    <!-- ③ inner loop dashed box -->
    <rect x="40" y="150" width="440" height="170" rx="10" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="54" y="142" width="224" height="16" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="166" y="153.5" text-anchor="middle" font-size="8" fill="#33506b">③ 枚举镜像对 i = 0 … ⌊n/2⌋ − 1</text>

    <rect x="90" y="172" width="280" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="230" y="190" text-anchor="middle" font-size="9.5" fill="#33506b">p ← s[(i+r) mod n]，q ← s[(r+n−1−i) mod n]</text>
    <text x="230" y="205" text-anchor="middle" font-size="8" fill="#7a8ca6">下标取模 = 虚拟左旋，不实际造串</text>
    <path d="M 230 212 V 226" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>

    <rect x="90" y="228" width="280" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="230" y="246" text-anchor="middle" font-size="9.5" fill="#7a5c1a">d ← ∣p − q∣；cost ← cost + min(d, 26 − d)</text>
    <text x="230" y="261" text-anchor="middle" font-size="8" fill="#a08040">循环字母表，双向取短</text>

    <path d="M 230 268 V 290 H 496 V 192 H 374" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="510" y="240" text-anchor="middle" font-size="7.5" fill="#888" transform="rotate(-90 510 240)">下一个 i</text>

    <path d="M 230 320 V 334" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>

    <!-- ④ update ans -->
    <rect x="90" y="336" width="280" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="230" y="358" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">④ ans ← min(ans, cost)</text>
    <path d="M 230 372 V 386" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>

    <!-- diamond: more r? -->
    <polygon points="230,388 318,420 230,452 142,420" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="230" y="417" text-anchor="middle" font-size="10" fill="#7a5c1a">r + 1 &lt; n？</text>
    <text x="230" y="431" text-anchor="middle" font-size="7.5" fill="#a08040">还有旋转没试过？</text>

    <text x="124" y="437" text-anchor="middle" font-size="8.5" fill="#4a7a3a">是</text>
    <path d="M 142 420 H 36 V 108 H 84" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="24" y="264" text-anchor="middle" font-size="7.5" fill="#888" transform="rotate(-90 24 264)">下一个 r</text>

    <text x="238" y="466" text-anchor="start" font-size="8.5" fill="#b85450">否</text>
    <path d="M 230 452 V 466" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>

    <!-- ⑤ return -->
    <rect x="90" y="470" width="280" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="230" y="491" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">⑤ 返回 ans</text>

    <text x="280" y="540" text-anchor="middle" font-size="8.5" fill="#999">n 种旋转 × ⌊n/2⌋ 对、每对 O(1) ⇒ 时间 O(n²)（n = 2000 约 2×10⁶ 次）；下标取模免造串，额外空间 O(1)</text>
  </g>
</svg>
