<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">同行/同列 → 连通分量，每个分量恰好留一块</text>

  <!-- ===== Grid ===== -->
  <rect x="80" y="50" width="198" height="198" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <line x1="80" y1="116" x2="278" y2="116" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="80" y1="182" x2="278" y2="182" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="146" y1="50" x2="146" y2="248" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="212" y1="50" x2="212" y2="248" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- axis labels -->
  <text x="113" y="45" text-anchor="middle" font-size="9" fill="#aaa">y=0</text>
  <text x="179" y="45" text-anchor="middle" font-size="9" fill="#aaa">y=1</text>
  <text x="245" y="45" text-anchor="middle" font-size="9" fill="#aaa">y=2</text>
  <text x="70" y="87" text-anchor="middle" font-size="9" fill="#aaa">x=0</text>
  <text x="70" y="153" text-anchor="middle" font-size="9" fill="#aaa">x=1</text>
  <text x="70" y="219" text-anchor="middle" font-size="9" fill="#aaa">x=2</text>

  <!-- same row connections (blue) -->
  <line x1="113" y1="83" x2="179" y2="83" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="113" y1="149" x2="245" y2="149" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="179" y1="215" x2="245" y2="215" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- same column connections (green) -->
  <line x1="113" y1="83" x2="113" y2="149" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="179" y1="83" x2="179" y2="215" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="245" y1="149" x2="245" y2="215" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- stones -->
  <circle cx="113" cy="83" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="113" y="87" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">0,0</text>

  <circle cx="179" cy="83" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="179" y="87" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">0,1</text>

  <circle cx="113" cy="149" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="113" y="153" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">1,0</text>

  <circle cx="245" cy="149" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="245" y="153" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">1,2</text>

  <circle cx="179" cy="215" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="179" y="219" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2,1</text>

  <circle cx="245" cy="215" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="245" y="219" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2,2</text>

  <!-- legend -->
  <line x1="300" y1="62" x2="325" y2="62" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="332" y="66" font-size="10" fill="#666">同行（相同 x）</text>
  <line x1="300" y1="82" x2="325" y2="82" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="332" y="86" font-size="10" fill="#666">同列（相同 y）</text>

  <!-- all connected note -->
  <rect x="295" y="100" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="405" y="123" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">6 块石头全部连通 → 1 个分量</text>

  <!-- formula box -->
  <rect x="295" y="150" width="220" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="405" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">答案 = n − 连通分量数</text>
  <text x="405" y="198" text-anchor="middle" font-size="20" fill="#b85450" font-weight="bold">6 − 1 = 5</text>
  <text x="405" y="222" text-anchor="middle" font-size="10" fill="#888">每分量留 1 块，其余全删</text>

  <!-- key insight -->
  <rect x="30" y="262" width="485" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="270" y="284" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键观察</text>
  <text x="270" y="304" text-anchor="middle" font-size="11" fill="#555">同行/同列关系是传递的：A~B 且 B~C → A~C（经 B 中转搭桥）</text>
  <text x="270" y="324" text-anchor="middle" font-size="11" fill="#555">连通分量内 k 块石头按 DFS 后序逐个删除，恰留 1 块（根节点）</text>
  <text x="270" y="344" text-anchor="middle" font-size="11" fill="#555">→ 最大移除数 = n − 连通分量数，并查集数分量即可</text>
</svg>
