<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：相邻「已存在值」之间的空隙 = 缺失区间</text>

  <!-- existing values row label -->
  <text x="30" y="92" font-size="11.5" fill="#888">已存在值:</text>

  <!-- sentinel prev = lower-1 = -1 (dashed gray) -->
  <rect x="50" y="72" width="56" height="32" fill="#fafafa" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="78" y="93" text-anchor="middle" font-size="12" fill="#aaa">−1</text>
  <text x="78" y="120" text-anchor="middle" font-size="9" fill="#aaa">哨兵 prev</text>

  <!-- 0 -->
  <rect x="118" y="72" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="93" text-anchor="middle" font-size="12" fill="#333">0</text>

  <!-- 1 -->
  <rect x="186" y="72" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="93" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- 3 -->
  <rect x="254" y="72" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="93" text-anchor="middle" font-size="12" fill="#333">3</text>

  <!-- 50 -->
  <rect x="322" y="72" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="93" text-anchor="middle" font-size="12" fill="#333">50</text>

  <!-- 75 -->
  <rect x="390" y="72" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="418" y="93" text-anchor="middle" font-size="12" fill="#333">75</text>

  <!-- sentinel upper+1 = 100 (dashed gray) -->
  <rect x="458" y="72" width="56" height="32" fill="#fafafa" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="486" y="93" text-anchor="middle" font-size="12" fill="#aaa">100</text>
  <text x="486" y="120" text-anchor="middle" font-size="9" fill="#aaa">哨兵 upper+1</text>

  <!-- gap markers: show diff between consecutive existing values -->
  <!-- (-1,0) diff=1 no gap -->
  <text x="112" y="120" text-anchor="middle" font-size="9.5" fill="#bbb">diff=1</text>

  <!-- (0,1) diff=1 no gap -->
  <text x="180" y="120" text-anchor="middle" font-size="9.5" fill="#bbb">diff=1</text>

  <!-- (1,3) diff=2 -> "2" -->
  <path d="M 248 110 L 248 128" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="248" y="142" text-anchor="middle" font-size="9.5" fill="#b85450">diff=2</text>

  <!-- (3,50) diff=47 -> "4->49" -->
  <path d="M 316 110 L 316 128" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="316" y="142" text-anchor="middle" font-size="9.5" fill="#b85450">diff=47</text>

  <!-- (50,75) diff=25 -> "51->74" -->
  <path d="M 384 110 L 384 128" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="384" y="142" text-anchor="middle" font-size="9.5" fill="#b85450">diff=25</text>

  <!-- (75,100) diff=25 -> "76->99" -->
  <path d="M 452 110 L 452 128" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="452" y="142" text-anchor="middle" font-size="9.5" fill="#b85450">diff=25</text>

  <!-- arrows from gaps down to missing range boxes -->
  <path d="M 248 168 L 248 196" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 316 168 L 316 196" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 384 168 L 384 196" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 452 168 L 452 196" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- missing range output boxes -->
  <rect x="214" y="202" width="68" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="248" y="223" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">"2"</text>

  <rect x="278" y="202" width="76" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="316" y="223" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">"4-&gt;49"</text>

  <rect x="344" y="202" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="384" y="223" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">"51-&gt;74"</text>

  <rect x="410" y="202" width="84" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="452" y="223" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">"76-&gt;99"</text>

  <!-- two-case panels -->
  <rect x="40" y="266" width="240" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="160" y="290" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">diff == 2 → 缺 1 个</text>
  <text x="160" y="314" text-anchor="middle" font-size="11" fill="#333">输出 "prev+1"</text>
  <text x="160" y="338" text-anchor="middle" font-size="10.5" fill="#888">prev+1 == cur-1，单元素段</text>

  <rect x="300" y="266" width="240" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="420" y="290" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">diff &gt; 2 → 缺一段</text>
  <text x="420" y="314" text-anchor="middle" font-size="11" fill="#333">输出 "prev+1-&gt;cur-1"</text>
  <text x="420" y="338" text-anchor="middle" font-size="10.5" fill="#888">连续段 [prev+1, cur-1]</text>
</svg>
