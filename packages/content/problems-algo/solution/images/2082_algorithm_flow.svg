<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：FROM → WHERE → COUNT(DISTINCT)</text>

  <!-- ===== Step 1: FROM Store ===== -->
  <rect x="60" y="42" width="200" height="52" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="60" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">FROM Store</text>
  <text x="160" y="76" text-anchor="middle" font-size="8" fill="#888">读取全部账单行</text>
  <text x="160" y="88" text-anchor="middle" font-size="8" fill="#888">5 行</text>

  <!-- Arrow down -->
  <path d="M 160 94 L 160 116" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: WHERE amount > 500 ===== -->
  <rect x="40" y="120" width="240" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="138" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">WHERE amount &gt; 500</text>
  <text x="160" y="154" text-anchor="middle" font-size="8" fill="#666">行级范围谓词：严格大于 500</text>
  <text x="160" y="166" text-anchor="middle" font-size="8" fill="#888">amount = 500 不算（边界坑）</text>

  <!-- Arrow down -->
  <path d="M 160 180 L 160 198" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Intermediate: filtered rows -->
  <rect x="50" y="202" width="220" height="56" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="218" text-anchor="middle" font-size="9" fill="#666">筛出的「富账单」</text>
  <text x="160" y="232" text-anchor="middle" font-size="8" fill="#b85450">(6, cust1, 549)</text>
  <text x="160" y="244" text-anchor="middle" font-size="8" fill="#b85450">(8, cust1, 834)</text>
  <text x="160" y="256" text-anchor="middle" font-size="8" fill="#b85450">(11, cust3, 657)</text>

  <!-- Arrow right to distinct -->
  <path d="M 270 230 L 312 230" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: DISTINCT customer_id ===== -->
  <rect x="316" y="120" width="240" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="436" y="138" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">DISTINCT customer_id</text>
  <text x="436" y="154" text-anchor="middle" font-size="8" fill="#666">同客户多张富账单只留一次</text>
  <text x="436" y="166" text-anchor="middle" font-size="8" fill="#888">cust1, cust1, cust3 → {1, 3}</text>

  <!-- Arrow down from distinct -->
  <path d="M 436 180 L 436 202" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- distinct result -->
  <rect x="326" y="206" width="220" height="44" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="436" y="222" text-anchor="middle" font-size="9" fill="#666">去重后的「富客户」集合</text>
  <text x="436" y="240" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">{cust 1, cust 3}</text>

  <!-- Arrow down merge to count -->
  <path d="M 436 250 L 436 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 160 258 L 160 278 C 160 290, 320 290, 432 280" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="3 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: COUNT ===== -->
  <rect x="296" y="274" width="280" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="436" y="292" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">SELECT COUNT(DISTINCT customer_id)</text>
  <text x="436" y="308" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">AS rich_count</text>

  <!-- Result -->
  <path d="M 436 326 L 436 346" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="396" y="350" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="436" y="365" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">rich_count</text>
  <text x="436" y="380" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- ===== SQL clause order note ===== -->
  <rect x="40" y="290" width="240" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="160" y="306" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">执行顺序</text>
  <text x="160" y="322" text-anchor="middle" font-size="8" fill="#666">FROM → WHERE → SELECT</text>
  <text x="160" y="336" text-anchor="middle" font-size="8" fill="#888">WHERE 先行级过滤</text>
  <text x="160" y="350" text-anchor="middle" font-size="8" fill="#888">再 DISTINCT 去重</text>
  <text x="160" y="364" text-anchor="middle" font-size="8" fill="#888">最后 COUNT 聚合</text>
</svg>
