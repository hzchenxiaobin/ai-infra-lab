<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一步特解 + 阈值累加通用版</text>

  <!-- 左列：一步特解 -->
  <rect x="25" y="30" width="220" height="220" rx="10" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="135" y="45" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">一步特解（本题值域）</text>

  <rect x="85" y="52" width="120" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="145" y="69" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">开始：读入 n</text>

  <path d="M 145 78 L 145 88" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="145,88 210,105 145,122 80,105" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="145" y="109" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">n ≥ 1000 ?</text>

  <path d="M 145 122 L 145 134" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="132" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="80" y="136" width="130" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="145" y="154" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 n − 999 ✓</text>

  <path d="M 80 105 L 50 105 L 50 196 L 76 196" fill="none" stroke="#888" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="58" y="99" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="80" y="182" width="130" height="28" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="145" y="200" text-anchor="middle" font-size="11.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">返回 0</text>
  <text x="145" y="226" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">（1~3 位数无逗号）</text>

  <!-- 右列：通用版循环 -->
  <rect x="265" y="30" width="240" height="255" rx="10" fill="none" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="385" y="45" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">通用版：阈值累加（n 可达 10¹⁸）</text>

  <rect x="320" y="52" width="130" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="385" y="69" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">ans = 0, p = 1000</text>

  <path d="M 385 78 L 385 88" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="385,88 450,115 385,142 320,115" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="385" y="119" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">p ≤ n ?</text>

  <path d="M 385 142 L 385 158" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="154" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="305" y="160" width="160" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="385" y="175" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">ans += n − p + 1</text>
  <text x="385" y="189" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">p ×= 1000</text>

  <path d="M 305 177 L 288 177 L 288 115 L 316 115" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="283" y="150" font-size="9" fill="#999" filter="url(#rough2)">回环</text>

  <path d="M 450 115 L 478 115 L 478 216 L 446 216" fill="none" stroke="#888" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="460" y="108" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="320" y="202" width="126" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="383" y="220" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans ✓</text>

  <text x="385" y="252" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">本题 n ≤ 10⁵：循环至多 1 轮</text>
  <text x="385" y="268" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">⇔ max(0, n − 999)</text>

  <!-- 底部验算条 -->
  <rect x="60" y="300" width="400" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="315" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">验算</text>
  <text x="260" y="331" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">n = 998 → 0　　n = 1002 → 3　　n = 10⁵ → 99001</text>
</svg>
