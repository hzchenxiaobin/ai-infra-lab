<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：num = "1234"，t = 256 = 2⁸（需 8 个 2）</text>

  <!-- 表头 -->
  <rect x="24" y="38" width="472" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="54" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">尝试</text>
  <text x="120" y="54" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">前缀供给 / 剩余需求</text>
  <text x="300" y="54" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">判定</text>
  <text x="440" y="54" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">结果</text>

  <!-- 行1：x=num -->
  <rect x="24" y="64" width="472" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="83" font-size="10.5" fill="#333" filter="url(#rough2)">① x=num</text>
  <text x="120" y="83" font-size="10.5" fill="#333" filter="url(#rough2)">积 24 = 2³·3 → 只有 3 个 2</text>
  <text x="300" y="83" font-size="10.5" fill="#333" filter="url(#rough2)">3 &lt; 8</text>
  <text x="440" y="83" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- 行2：i=3 -->
  <rect x="24" y="96" width="472" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="115" font-size="10.5" fill="#333" filter="url(#rough2)">i=3 改'4'</text>
  <text x="120" y="115" font-size="10.5" fill="#333" filter="url(#rough2)">前缀 123 供 2¹，剩 2⁷；m=0</text>
  <text x="300" y="115" font-size="10.5" fill="#333" filter="url(#rough2)">d∈[5,9] 消不完</text>
  <text x="440" y="115" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- 行3：i=2 -->
  <rect x="24" y="128" width="472" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="147" font-size="10.5" fill="#333" filter="url(#rough2)">i=2 改'3'</text>
  <text x="120" y="147" font-size="10.5" fill="#333" filter="url(#rough2)">前缀 12 供 2¹，剩 2⁷；m=1</text>
  <text x="300" y="147" font-size="10.5" fill="#333" filter="url(#rough2)">d=8 剩 2⁴ → 2 名额&gt;1</text>
  <text x="440" y="147" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- 行4：i=1 -->
  <rect x="24" y="160" width="472" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="40" y="179" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">i=1 改'2'</text>
  <text x="120" y="179" font-size="10.5" fill="#a07830" filter="url(#rough2)">前缀 1 供 0，剩 2⁸；m=2</text>
  <text x="300" y="179" font-size="10.5" fill="#a07830" filter="url(#rough2)">d=3 ✗(剩8,3名额)。</text>
  <text x="440" y="179" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="300" y="196" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">d=4：剩 2⁶ → 2 名额 ≤ 2 ✓</text>
  <text x="120" y="196" font-size="10.5" fill="#a07830" filter="url(#rough2)">放大位取最小的可行 d=4</text>

  <!-- 行5：后缀贪心 -->
  <rect x="24" y="206" width="472" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="40" y="225" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">后缀贪心</text>
  <text x="120" y="225" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">第 1 位：1~7 剩太多 ✗，d=8 剩 2³ → 1 名额 ≤ 1 ✓</text>
  <text x="120" y="243" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">第 2 位：d=8 清零 ✓ → 后缀 = "88"</text>

  <!-- 结果 -->
  <rect x="120" y="256" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">答案 "1488"：1×4×8×8 = 256 ✓</text>

  <!-- 角落例子：升长 -->
  <rect x="24" y="306" width="472" height="76" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="40" y="328" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">对照：升长情形 num = "99"，t = 2</text>
  <text x="40" y="347" font-size="10.5" fill="#333" filter="url(#rough2)">等长候选只有 99（积 81 为奇数）✗；num[i]=9 无更大数位，i 扫到底 ✗</text>
  <text x="40" y="365" font-size="10.5" fill="#333" filter="url(#rough2)">→ L = max(3, 1) = 3，贪心填：先 1（名额 1 ≤ 剩 2 位）再 1，最后必须 d=2</text>
  <text x="40" y="383" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">→ 答案 "112"（1×1×2 = 2 ✓，111 积为 1 不行）</text>
</svg>
