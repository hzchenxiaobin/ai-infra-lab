<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：最小可用 ID = 回收小顶堆 + 水位计数器</text>

  <!-- ===== Left: watermark counter ===== -->
  <rect x="36" y="54" width="200" height="186" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="136" y="76" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">水位计数器 nextId</text>
  <text x="136" y="94" text-anchor="middle" font-size="10.5" fill="#888">从未分配过的 ID 源泉</text>

  <rect x="60" y="108" width="152" height="28" fill="#fff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="86" y="127" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="136" y="127" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="186" y="127" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <line x1="110" y1="112" x2="110" y2="132" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="160" y1="112" x2="160" y2="132" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="60" y="146" width="152" height="26" fill="#fff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="136" y="164" text-anchor="middle" font-size="11" fill="#888">… 单调递增 …</text>

  <text x="136" y="196" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">取用：id = nextId++</text>
  <text x="136" y="214" text-anchor="middle" font-size="10.5" fill="#888">回收堆空时才动用</text>

  <!-- ===== Right: recycled min-heap ===== -->
  <rect x="324" y="54" width="200" height="186" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="424" y="76" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">回收小顶堆 recycled</text>
  <text x="424" y="94" text-anchor="middle" font-size="10.5" fill="#888">remove 释放的 ID 回收站</text>

  <rect x="392" y="110" width="64" height="30" fill="#fff" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="424" y="130" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="350" y="156" width="56" height="28" fill="#fff" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="378" y="175" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="442" y="156" width="56" height="28" fill="#fff" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="470" y="175" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <line x1="424" y1="140" x2="378" y2="156" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="424" y1="140" x2="470" y2="156" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="424" y="202" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">取用：pop 堆顶（最小）</text>
  <text x="424" y="220" text-anchor="middle" font-size="10.5" fill="#888">非空时优先复用</text>

  <!-- ===== upload decision ===== -->
  <rect x="36" y="252" width="488" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">upload：优先复用回收堆，堆空才开水位计数器</text>

  <rect x="62" y="284" width="116" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="120" y="307" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">堆非空？</text>
  <text x="190" y="298" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="190" y="320" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <rect x="216" y="282" width="140" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="286" y="300" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">id = pop 堆顶 ✓</text>
  <rect x="216" y="312" width="140" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="286" y="330" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">id = nextId++ ✓</text>

  <!-- arrow from decision to two branches -->
  <path d="M 178 302 L 214 294" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 178 304 L 214 324" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== remove ===== -->
  <rect x="36" y="344" width="488" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="364" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">remove：从 map 删除 videoId，把该 ID push 进回收堆</text>
  <text x="280" y="386" text-anchor="middle" font-size="10.5" fill="#888">下次 upload 优先复用被删的最小 ID（题意：删除后 ID 可重用）</text>
</svg>
