<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：统计频率 → 按频率降序排序 → 展开构建结果</text>

  <!-- Step 1: Input string "tree" -->
  <text x="40" y="68" font-size="12" fill="#888">输入:</text>
  <rect x="90" y="52" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="71" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">t</text>
  <rect x="128" y="52" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="71" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">r</text>
  <rect x="166" y="52" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="71" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>
  <rect x="204" y="52" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="71" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>
  <text x="260" y="71" font-size="11" fill="#888">s = "tree"</text>

  <!-- Arrow down -->
  <path d="M 150 88 L 150 106" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="165" y="102" font-size="10" fill="#888">① 统计频率</text>

  <!-- Step 2: Frequency table -->
  <text x="40" y="128" font-size="12" fill="#888">频率:</text>
  <rect x="90" y="112" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">t: 1</text>
  <rect x="156" y="112" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">r: 1</text>
  <rect x="222" y="112" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="252" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e: 2</text>

  <!-- Arrow down -->
  <path d="M 150 148 L 150 166" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="165" y="162" font-size="10" fill="#888">② 按频率降序排序</text>

  <!-- Step 3: Sorted pairs -->
  <text x="40" y="188" font-size="12" fill="#888">排序:</text>
  <rect x="90" y="172" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="191" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e: 2</text>
  <rect x="156" y="172" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="191" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">t: 1</text>
  <rect x="222" y="172" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="252" y="191" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">r: 1</text>
  <text x="300" y="191" font-size="11" fill="#888">e 频率最高排首位</text>

  <!-- Arrow down -->
  <path d="M 150 208 L 150 226" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="165" y="222" font-size="10" fill="#888">③ 展开: char × freq</text>

  <!-- Step 4: Result -->
  <text x="40" y="248" font-size="12" fill="#888">结果:</text>
  <rect x="90" y="232" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="251" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>
  <rect x="128" y="232" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="251" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>
  <rect x="166" y="232" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="251" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">t</text>
  <rect x="204" y="232" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="251" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">r</text>
  <text x="260" y="251" font-size="12" fill="#4a7a3a" font-weight="bold">= "eert" ✓</text>

  <!-- Core idea box -->
  <rect x="40" y="284" width="460" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="308" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">三步走：频率统计（哈希）→ 按频率排序 → 展开</text>
  <text x="270" y="328" text-anchor="middle" font-size="11" fill="#666">同频字符顺序任意 → 排序只需按频率分桶</text>
  <text x="270" y="348" text-anchor="middle" font-size="11" fill="#888">字符集 ≤ 62（大小写+数字），k log k 近似常数 → 可视作 O(n)</text>
</svg>
