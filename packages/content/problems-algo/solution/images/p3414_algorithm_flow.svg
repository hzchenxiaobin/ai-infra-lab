<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="500" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 逐区间 DP，状态自带方案</text>

  <!-- start -->
  <rect x="90" y="36" width="240" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="56" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">读入 intervals，记录原下标</text>
  <path d="M 210 66 L 210 76" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- sort -->
  <rect x="70" y="80" width="280" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="102" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">按右端点 r 升序排序（并列不影响）</text>
  <path d="M 210 114 L 210 124" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="70" y="128" width="280" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="150" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">初始化 f[0][j] = (0, [])，j = 0..4</text>
  <path d="M 210 162 L 210 172" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i loop pill -->
  <rect x="105" y="176" width="210" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="196" text-anchor="middle" font-size="11.5" fill="#2f5424" font-weight="bold" filter="url(#rough2)">对 i = 0 … n−1 循环</text>
  <path d="M 210 206 L 210 216" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- binary search -->
  <rect x="60" y="220" width="300" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="242" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">二分求 k：前 i 个中右端点 r &lt; l_i 的个数</text>
  <path d="M 210 254 L 210 264" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- inner j loop -->
  <rect x="60" y="268" width="300" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="287" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">对 j = 1..4：</text>
  <text x="210" y="305" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">cand = (f[k][j−1].s − w_i, sorted(ids + [idx_i]))</text>
  <path d="M 210 316 L 210 326" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- min assign -->
  <rect x="70" y="330" width="280" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="352" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">f[i+1][j] = min(f[i][j], cand)</text>
  <path d="M 210 364 L 210 374" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond -->
  <polygon points="210,378 140,410 210,442 280,410" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="415" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">i 走完了？</text>

  <!-- loop back -->
  <path d="M 140 410 L 36 410 L 36 191 L 97 191" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="122" y="402" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- yes -->
  <path d="M 210 442 L 210 456" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="222" y="453" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- return -->
  <rect x="120" y="460" width="180" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="481" text-anchor="middle" font-size="12" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">返回 f[n][4].ids</text>

  <!-- side note -->
  <path d="M 372 370 L 348 360" fill="none" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arro)" filter="url(#rough2)"/>
  <rect x="330" y="374" width="182" height="106" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="421" y="394" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">min 比较序（关键）</text>
  <text x="421" y="412" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">① −得分小者胜 ⇒ 得分更大</text>
  <text x="421" y="430" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">② 得分并列：比下标序列</text>
  <text x="421" y="446" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">字典序，小者胜</text>
  <text x="421" y="466" text-anchor="middle" font-size="10" fill="#8a6a1f" filter="url(#rough2)">序列长 ≤ 4：拷贝、排序 O(1)</text>
</svg>
