<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>

  <text x="380" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：多键级联排序——前一键「并列」时，依次用下一键决出次序</text>

  <!-- ===== Cascade of 4 key boxes (staircase going down-right) ===== -->
  <!-- Key 1: gold DESC -->
  <rect x="40" y="58" width="200" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="140" y="78" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">① gold_medals</text>
  <text x="140" y="95" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">DESC（金多在前）</text>

  <!-- arrow 1->2 -->
  <path d="M250 92 L300 122" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="286" y="100" font-size="9" fill="#888">并列→</text>

  <!-- Key 2: silver DESC -->
  <rect x="300" y="118" width="200" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="400" y="138" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">② silver_medals</text>
  <text x="400" y="155" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">DESC（银多在前）</text>

  <!-- arrow 2->3 -->
  <path d="M510 152 L560 182" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="546" y="160" font-size="9" fill="#888">并列→</text>

  <!-- Key 3: bronze DESC -->
  <rect x="80" y="178" width="200" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="180" y="198" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">③ bronze_medals</text>
  <text x="180" y="215" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">DESC（铜多在前）</text>

  <!-- arrow 3->4 -->
  <path d="M290 212 L340 242" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="326" y="220" font-size="9" fill="#888">并列→</text>

  <!-- Key 4: country ASC -->
  <rect x="340" y="238" width="200" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="440" y="258" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">④ country</text>
  <text x="440" y="275" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ASC（字母升序）</text>

  <!-- ===== Bottom: China vs USA tie illustration ===== -->
  <rect x="40" y="300" width="680" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="380" y="322" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">示例：China 与 USA 同为 (10, 10, 20)</text>

  <rect x="70" y="332" width="150" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="145" y="347" text-anchor="middle" font-size="10" fill="#333">China  10 10 20</text>

  <rect x="70" y="356" width="150" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="145" y="371" text-anchor="middle" font-size="10" fill="#333">USA    10 10 20</text>

  <text x="250" y="356" font-size="10" fill="#888">三键全并列</text>
  <path d="M300 366 L350 366" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="360" y="332" width="330" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="525" y="352" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">→ 用 ④ country 升序：C &lt; U</text>
  <text x="525" y="370" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">China 排在 USA 之前</text>
</svg>
