<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">
    矩阵的层结构：每层独立顺时针提取为环
  </text>

  <!-- 4x4 Matrix: cell 40px, start x=200, y=60 -->
  <g font-size="13" fill="#333" text-anchor="middle">
    <!-- Row 0: all outer (blue) -->
    <rect x="200" y="60" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="220" y="85" filter="url(#rough2)">1</text>
    <rect x="240" y="60" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="260" y="85" filter="url(#rough2)">2</text>
    <rect x="280" y="60" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="300" y="85" filter="url(#rough2)">3</text>
    <rect x="320" y="60" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="340" y="85" filter="url(#rough2)">4</text>
    <!-- Row 1: outer, inner, inner, outer -->
    <rect x="200" y="100" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="220" y="125" filter="url(#rough2)">5</text>
    <rect x="240" y="100" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="260" y="125" filter="url(#rough2)">6</text>
    <rect x="280" y="100" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="300" y="125" filter="url(#rough2)">7</text>
    <rect x="320" y="100" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="340" y="125" filter="url(#rough2)">8</text>
    <!-- Row 2: outer, inner, inner, outer -->
    <rect x="200" y="140" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="220" y="165" filter="url(#rough2)">9</text>
    <rect x="240" y="140" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="260" y="165" filter="url(#rough2)">10</text>
    <rect x="280" y="140" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="300" y="165" filter="url(#rough2)">11</text>
    <rect x="320" y="140" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="340" y="165" filter="url(#rough2)">12</text>
    <!-- Row 3: all outer -->
    <rect x="200" y="180" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="220" y="205" filter="url(#rough2)">13</text>
    <rect x="240" y="180" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="260" y="205" filter="url(#rough2)">14</text>
    <rect x="280" y="180" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="300" y="205" filter="url(#rough2)">15</text>
    <rect x="320" y="180" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="340" y="205" filter="url(#rough2)">16</text>
  </g>

  <!-- Layer labels -->
  <text x="192" y="82" text-anchor="end" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">第0层</text>
  <text x="234" y="122" text-anchor="end" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第1层</text>

  <!-- Clockwise arrows around outer layer -->
  <path d="M 210 52 L 350 52" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 370 70 L 370 210" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 350 228 L 210 228" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 190 210 L 190 70" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="280" y="44" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">顺时针遍历</text>

  <!-- Divider -->
  <path d="M 40 248 L 520 248" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Extracted rings title -->
  <text x="280" y="270" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold" filter="url(#rough2)">
    顺时针提取为 1D 环
  </text>

  <!-- Outer ring: 12 cells, 32px, start x=130, y=292 -->
  <text x="60" y="310" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">第0层环：</text>
  <g font-size="11" fill="#333" text-anchor="middle">
    <rect x="130" y="292" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="146" y="310" filter="url(#rough2)">1</text>
    <rect x="162" y="292" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="178" y="310" filter="url(#rough2)">2</text>
    <rect x="194" y="292" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="210" y="310" filter="url(#rough2)">3</text>
    <rect x="226" y="292" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="242" y="310" filter="url(#rough2)">4</text>
    <rect x="258" y="292" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="274" y="310" filter="url(#rough2)">8</text>
    <rect x="290" y="292" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="306" y="310" filter="url(#rough2)">12</text>
    <rect x="322" y="292" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="338" y="310" filter="url(#rough2)">16</text>
    <rect x="354" y="292" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="370" y="310" filter="url(#rough2)">15</text>
    <rect x="386" y="292" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="402" y="310" filter="url(#rough2)">14</text>
    <rect x="418" y="292" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="434" y="310" filter="url(#rough2)">13</text>
    <rect x="450" y="292" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="466" y="310" filter="url(#rough2)">9</text>
    <rect x="482" y="292" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="498" y="310" filter="url(#rough2)">5</text>
  </g>

  <!-- Inner ring: 4 cells, 32px, start x=216, y=350 -->
  <text x="60" y="368" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第1层环：</text>
  <g font-size="11" fill="#333" text-anchor="middle">
    <rect x="216" y="350" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="232" y="368" filter="url(#rough2)">6</text>
    <rect x="248" y="350" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="264" y="368" filter="url(#rough2)">7</text>
    <rect x="280" y="350" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="296" y="368" filter="url(#rough2)">11</text>
    <rect x="312" y="350" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="328" y="368" filter="url(#rough2)">10</text>
  </g>

  <!-- Key insight box -->
  <rect x="60" y="394" width="440" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    每层独立旋转：shift = k % 环长，左移 shift 位后写回
  </text>
</svg>
