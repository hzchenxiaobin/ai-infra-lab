<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="30" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">换水循环：每轮「喝 + 兑换」净消耗 e−1 个空瓶</text>

  <!-- Box A: 满水 full -->
  <rect x="40" y="80" width="130" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="105" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">满水</text>
  <text x="105" y="122" text-anchor="middle" font-size="12" fill="#446688">full 瓶</text>

  <!-- Arrow A -> B : 喝掉 -->
  <path d="M 170 108 L 210 108" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="98" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">喝掉</text>
  <text x="190" y="128" text-anchor="middle" font-size="10" fill="#777">ans += full</text>

  <!-- Box B: 空瓶 empty -->
  <rect x="210" y="80" width="130" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="275" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">空瓶</text>
  <text x="275" y="122" text-anchor="middle" font-size="12" fill="#d6a040">empty 个</text>

  <!-- Arrow B -> C : 兑换 -->
  <path d="M 340 108 L 380 108" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="360" y="98" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">兑换</text>
  <text x="360" y="128" text-anchor="middle" font-size="10" fill="#777">÷ e 个换 1</text>

  <!-- Box C: 新满水 -->
  <rect x="380" y="80" width="120" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="440" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">新满水</text>
  <text x="440" y="122" text-anchor="middle" font-size="12" fill="#446688">empty/e 瓶</text>

  <!-- Loop-back arrow C -> A (curved down and back) -->
  <path d="M 440 136 Q 440 200 270 200 Q 105 200 105 136" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="270" y="218" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">循环：新满水再被喝掉 → 进入下一轮</text>

  <!-- Net effect highlight box -->
  <rect x="50" y="248" width="440" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="272" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">一轮净效果</text>
  <text x="270" y="294" text-anchor="middle" font-size="12" fill="#444">空瓶减少 e 个 + 喝后得 1 个 = 净消耗 (e−1) 个空瓶</text>
  <text x="270" y="312" text-anchor="middle" font-size="12" fill="#444">同时累计多喝 <tspan font-weight="bold" fill="#b85450">1</tspan> 瓶</text>

  <!-- Legend -->
  <rect x="40" y="338" width="12" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="56" y="348" font-size="9" fill="#555">满水</text>
  <rect x="110" y="338" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="126" y="348" font-size="9" fill="#555">空瓶</text>
  <line x1="180" y1="344" x2="210" y2="344" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="216" y="348" font-size="9" fill="#555">循环回路</text>
</svg>
