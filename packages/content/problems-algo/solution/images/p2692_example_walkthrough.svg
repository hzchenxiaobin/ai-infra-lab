<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">四个示例的执行演算：1/2/3 经 set 陷阱抛错，4 经 ownKeys 透传返回键名</text>

  <!-- 表头 -->
  <rect x="14" y="46" width="592" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="52" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">示例</text>
  <text x="195" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">操作</text>
  <text x="400" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">触发陷阱</text>
  <text x="560" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">结果</text>

  <!-- 列分隔虚线 -->
  <line x1="92" y1="50" x2="92" y2="74" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="300" y1="50" x2="300" y2="74" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="502" y1="50" x2="502" y2="74" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行 1：示例1 -->
  <rect x="14" y="80" width="592" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="52" y="107" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">示例 1</text>
  <text x="195" y="100" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">obj = {"x":5}</text>
  <text x="195" y="116" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">obj.x = 5</text>
  <text x="400" y="107" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">set(target, "x", 5)</text>
  <text x="560" y="107" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗ TypeError</text>

  <!-- 行 2：示例2 -->
  <rect x="14" y="132" width="592" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="52" y="159" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">示例 2</text>
  <text x="195" y="152" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">arr = [1,2,3]</text>
  <text x="195" y="168" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">arr[1] = {}</text>
  <text x="400" y="159" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">set(target, "1", {})</text>
  <text x="560" y="159" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗ TypeError</text>

  <!-- 行 3：示例3 -->
  <rect x="14" y="184" width="592" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="52" y="211" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">示例 3</text>
  <text x="195" y="204" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">obj.arr.push(4)</text>
  <text x="195" y="220" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">(嵌套数组)</text>
  <text x="400" y="204" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">get("arr")→代理数组</text>
  <text x="400" y="216" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">push 内 set("3",4)</text>
  <text x="400" y="228" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">+ set length</text>
  <text x="560" y="211" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗ TypeError</text>

  <!-- 行 4：示例4 -->
  <rect x="14" y="236" width="592" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="52" y="263" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">示例 4</text>
  <text x="195" y="256" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">obj = {"x":2,"y":2}</text>
  <text x="195" y="272" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Object.keys(obj)</text>
  <text x="400" y="263" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">ownKeys（透传）</text>
  <text x="560" y="263" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓ ["x","y"]</text>

  <!-- 底注 -->
  <rect x="14" y="294" width="592" height="46" fill="#fafafa" stroke="#bbb" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="310" y="312" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">关键洞察：set 是所有写入（含 push/pop/splice 内部写元素与 length）的共同咽喉</text>
  <text x="310" y="328" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">覆盖 set 一处即可拦下全部变更方法 · 无需逐一打补丁</text>
</svg>
