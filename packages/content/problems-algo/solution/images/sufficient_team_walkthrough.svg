<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 逐人 DP 演算（n=3, full=111）</text>

  <!-- State headers -->
  <text x="100" y="56" font-size="9.5" fill="#888" font-weight="bold">状态：</text>
  <g font-size="10" fill="#555">
    <text x="155" y="56" text-anchor="middle">000</text>
    <text x="205" y="56" text-anchor="middle">001</text>
    <text x="255" y="56" text-anchor="middle">010</text>
    <text x="305" y="56" text-anchor="middle">011</text>
    <text x="355" y="56" text-anchor="middle">100</text>
    <text x="405" y="56" text-anchor="middle">101</text>
    <text x="455" y="56" text-anchor="middle">110</text>
    <text x="505" y="56" text-anchor="middle">111</text>
  </g>

  <!-- Row 0: Init -->
  <text x="30" y="80" font-size="10" fill="#888">初始</text>
  <rect x="140" y="66" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="155" y="82" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <rect x="190" y="66" width="30" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="82" text-anchor="middle" font-size="9" fill="#ccc">∞</text>
  <rect x="240" y="66" width="30" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="255" y="82" text-anchor="middle" font-size="9" fill="#ccc">∞</text>
  <rect x="290" y="66" width="30" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="305" y="82" text-anchor="middle" font-size="9" fill="#ccc">∞</text>
  <rect x="340" y="66" width="30" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="355" y="82" text-anchor="middle" font-size="9" fill="#ccc">∞</text>
  <rect x="390" y="66" width="30" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="405" y="82" text-anchor="middle" font-size="9" fill="#ccc">∞</text>
  <rect x="440" y="66" width="30" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="455" y="82" text-anchor="middle" font-size="9" fill="#ccc">∞</text>
  <rect x="490" y="66" width="30" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="505" y="82" text-anchor="middle" font-size="9" fill="#ccc">∞</text>

  <!-- Row 1: After person 0 (p=001) -->
  <text x="30" y="112" font-size="10" fill="#4a7a3a" font-weight="bold">+人员0</text>
  <text x="30" y="124" font-size="9" fill="#888">p=001</text>
  <rect x="140" y="100" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="155" y="116" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <rect x="190" y="100" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="205" y="116" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="240" y="100" width="30" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="255" y="116" text-anchor="middle" font-size="9" fill="#ccc">∞</text>
  <rect x="290" y="100" width="30" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="305" y="116" text-anchor="middle" font-size="9" fill="#ccc">∞</text>
  <rect x="340" y="100" width="30" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="355" y="116" text-anchor="middle" font-size="9" fill="#ccc">∞</text>
  <rect x="390" y="100" width="30" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="405" y="116" text-anchor="middle" font-size="9" fill="#ccc">∞</text>
  <rect x="440" y="100" width="30" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="455" y="116" text-anchor="middle" font-size="9" fill="#ccc">∞</text>
  <rect x="490" y="100" width="30" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="505" y="116" text-anchor="middle" font-size="9" fill="#ccc">∞</text>

  <!-- arrow 000 -> 001 -->
  <path d="M 155 94 Q 170 96 200 98" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row 2: After person 1 (p=010) -->
  <text x="30" y="152" font-size="10" fill="#4a7a3a" font-weight="bold">+人员1</text>
  <text x="30" y="164" font-size="9" fill="#888">p=010</text>
  <rect x="140" y="140" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="155" y="156" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <rect x="190" y="140" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="205" y="156" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <rect x="240" y="140" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="255" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="290" y="140" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="305" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="340" y="140" width="30" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="355" y="156" text-anchor="middle" font-size="9" fill="#ccc">∞</text>
  <rect x="390" y="140" width="30" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="405" y="156" text-anchor="middle" font-size="9" fill="#ccc">∞</text>
  <rect x="440" y="140" width="30" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="455" y="156" text-anchor="middle" font-size="9" fill="#ccc">∞</text>
  <rect x="490" y="140" width="30" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="505" y="156" text-anchor="middle" font-size="9" fill="#ccc">∞</text>

  <!-- arrows for person 1 -->
  <path d="M 155 134 Q 180 136 248 138" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 205 134 Q 240 136 298 138" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row 3: After person 2 (p=110) -->
  <text x="30" y="192" font-size="10" fill="#4a7a3a" font-weight="bold">+人员2</text>
  <text x="30" y="204" font-size="9" fill="#888">p=110</text>
  <rect x="140" y="180" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="155" y="196" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <rect x="190" y="180" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="205" y="196" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <rect x="240" y="180" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="255" y="196" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <rect x="290" y="180" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="305" y="196" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <rect x="340" y="180" width="30" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="355" y="196" text-anchor="middle" font-size="9" fill="#ccc">∞</text>
  <rect x="390" y="180" width="30" height="24" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="405" y="196" text-anchor="middle" font-size="9" fill="#ccc">∞</text>
  <rect x="440" y="180" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="455" y="196" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="490" y="180" width="30" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="505" y="196" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>

  <!-- arrows for person 2 -->
  <path d="M 155 174 Q 260 176 448 178" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 205 174 Q 330 176 498 178" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- Backtrack section -->
  <text x="280" y="230" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">回溯路径：111 ← 001 ← 000</text>

  <!-- Backtrack boxes -->
  <rect x="60" y="244" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="120" y="262" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">mask=000</text>
  <text x="120" y="276" text-anchor="middle" font-size="9.5" fill="#888">起点（空团队）</text>

  <path d="M 182 264 L 218 264" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="200" y="258" text-anchor="middle" font-size="8.5" fill="#b85450">+人员0</text>

  <rect x="220" y="244" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">mask=001</text>
  <text x="280" y="276" text-anchor="middle" font-size="9.5" fill="#888">覆盖 java</text>

  <path d="M 342 264 L 378 264" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="360" y="258" text-anchor="middle" font-size="8.5" fill="#b85450">+人员2</text>

  <rect x="380" y="244" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="440" y="262" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">mask=111</text>
  <text x="440" y="276" text-anchor="middle" font-size="9.5" fill="#b85450">全覆盖 ⭐</text>

  <!-- Result -->
  <rect x="100" y="304" width="360" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">team = [0, 2]（大小 2）</text>
  <text x="280" y="338" text-anchor="middle" font-size="10" fill="#555">人员0(java) + 人员2(nodejs,reactjs) = 全覆盖</text>

  <!-- parent chain detail -->
  <rect x="40" y="360" width="480" height="100" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">parent 链详情</text>
  <text x="60" y="400" font-size="10" fill="#555">parent[111] = (001, 人员2) → 加入人员2，回溯到 001</text>
  <text x="60" y="418" font-size="10" fill="#555">parent[001] = (000, 人员0) → 加入人员0，回溯到 000</text>
  <text x="60" y="436" font-size="10" fill="#555">parent[000] = 哨兵 → 回溯终止</text>
  <text x="60" y="454" font-size="10" fill="#b85450" font-weight="bold">team = [2, 0] → 逆序 → [0, 2] ✓</text>
</svg>
