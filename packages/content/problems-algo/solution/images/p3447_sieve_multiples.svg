<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="20" y="28" font-size="13" fill="#333" filter="url(#rough2)">核心观察：调转视角——不是「组找元素」，而是「值给倍数盖戳」</text>

  <!-- Section A: elements 去重 -->
  <text x="20" y="72" font-size="12" fill="#333" filter="url(#rough2)">elements =</text>

  <rect x="95" y="52" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="112" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="112" y="97" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=0</text>
  <rect x="131" y="52" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="148" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="148" y="97" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=1</text>

  <path d="M178,67 L208,67" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="216" y="60" font-size="11.5" fill="#446688" filter="url(#rough2)">去重建表：first[4]=0</text>
  <text x="216" y="78" font-size="11.5" fill="#446688" filter="url(#rough2)">first[2]=1</text>
  <text x="216" y="96" font-size="10.5" fill="#b85450" filter="url(#rough2)">同值重复出现时，只有首个下标有用（要最小 j）</text>

  <path d="M20,115 L500,115" fill="none" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- Section B: 盖戳 -->
  <text x="20" y="140" font-size="12.5" fill="#333" filter="url(#rough2)">每个出现的值 v，给它在值域内的所有倍数盖「下标戳」：</text>

  <!-- 绿戳行: v=2 下标1, cells 2,4,6,8,10,12 -->
  <rect x="70" y="158" width="24" height="17" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="82" y="171" text-anchor="middle" font-size="11" fill="#2a4a1a" filter="url(#rough2)">1</text>
  <rect x="142" y="158" width="24" height="17" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="154" y="171" text-anchor="middle" font-size="11" fill="#2a4a1a" filter="url(#rough2)">1</text>
  <rect x="214" y="158" width="24" height="17" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="226" y="171" text-anchor="middle" font-size="11" fill="#2a4a1a" filter="url(#rough2)">1</text>
  <rect x="286" y="158" width="24" height="17" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="298" y="171" text-anchor="middle" font-size="11" fill="#2a4a1a" filter="url(#rough2)">1</text>
  <rect x="358" y="158" width="24" height="17" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="171" text-anchor="middle" font-size="11" fill="#2a4a1a" filter="url(#rough2)">1</text>
  <rect x="430" y="158" width="24" height="17" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="442" y="171" text-anchor="middle" font-size="11" fill="#2a4a1a" filter="url(#rough2)">1</text>

  <!-- 蓝戳行: v=4 下标0, cells 4,8,12 -->
  <rect x="142" y="182" width="24" height="17" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="154" y="195" text-anchor="middle" font-size="11" fill="#224466" filter="url(#rough2)">0</text>
  <rect x="286" y="182" width="24" height="17" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="298" y="195" text-anchor="middle" font-size="11" fill="#224466" filter="url(#rough2)">0</text>
  <rect x="430" y="182" width="24" height="17" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="442" y="195" text-anchor="middle" font-size="11" fill="#224466" filter="url(#rough2)">0</text>

  <!-- 数轴 1..12 -->
  <rect x="28" y="210" width="36" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="46" y="232" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">1</text>
  <rect x="64" y="210" width="36" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="82" y="232" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="100" y="210" width="36" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="118" y="232" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="136" y="210" width="36" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="154" y="232" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="172" y="210" width="36" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="190" y="232" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">5</text>
  <rect x="208" y="210" width="36" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="226" y="232" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="244" y="210" width="36" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="262" y="232" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">7</text>
  <rect x="280" y="210" width="36" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="298" y="232" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <rect x="316" y="210" width="36" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="334" y="232" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">9</text>
  <rect x="352" y="210" width="36" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="370" y="232" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10</text>
  <rect x="388" y="210" width="36" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="406" y="232" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">11</text>
  <rect x="424" y="210" width="36" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="442" y="232" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">12</text>

  <!-- best 行 -->
  <text x="46" y="264" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">−1</text>
  <text x="82" y="264" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="118" y="264" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="154" y="264" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="190" y="264" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">−1</text>
  <text x="226" y="264" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="262" y="264" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">−1</text>
  <text x="298" y="264" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="334" y="264" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">−1</text>
  <text x="370" y="264" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="406" y="264" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">−1</text>
  <text x="442" y="264" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="20" y="264" font-size="10.5" fill="#666" filter="url(#rough2)">best:</text>

  <!-- 图例 -->
  <rect x="30" y="284" width="16" height="12" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="52" y="294" font-size="10.5" fill="#333" filter="url(#rough2)">值 2（下标 1）盖的戳</text>
  <rect x="170" y="284" width="16" height="12" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="192" y="294" font-size="10.5" fill="#333" filter="url(#rough2)">值 4（下标 0）盖的戳</text>
  <text x="320" y="294" font-size="10.5" fill="#b85450" filter="url(#rough2)">同一列多戳 → 取最小下标</text>

  <!-- Section C: 查表 -->
  <rect x="40" y="312" width="96" height="24" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="328" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">组 8</text>
  <path d="M140,324 L168,324" fill="none" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="176" y="328" font-size="11.5" fill="#333" filter="url(#rough2)">best[8] = 0 ✓（蓝戳 0 &lt; 绿戳 1）</text>

  <rect x="40" y="344" width="96" height="24" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="360" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">组 3</text>
  <path d="M140,356 L168,356" fill="none" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="176" y="360" font-size="11.5" fill="#333" filter="url(#rough2)">best[3] = −1（3 既不是 2 也不是 4 的倍数）</text>

  <rect x="20" y="384" width="480" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="402" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">盖戳总次数 Σ M/v ≤ M·(1 + 1/2 + … + 1/M) ≈ M ln M ≈ 1.2×10⁶</text>
  <text x="260" y="420" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">只与值域 M = 10⁵ 有关，与 groups、elements 的长度无关</text>
</svg>
