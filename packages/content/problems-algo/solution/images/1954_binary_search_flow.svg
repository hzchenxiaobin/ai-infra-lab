<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">二分查找最小 k</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888">S(k) 单调递增 → 找最小 k 使 S(k) ≥ neededApples</text>

  <!-- Start: lo=0, hi=upper -->
  <rect x="210" y="66" width="180" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="91" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">lo = 0, hi = 10^5</text>

  <!-- arrow down to diamond -->
  <path d="M 300 110 L 300 126" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Diamond: lo < hi? -->
  <polygon points="300,130 380,170 300,210 220,170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="168" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">lo &lt; hi ?</text>
  <text x="300" y="184" text-anchor="middle" font-size="10" fill="#888">(循环条件)</text>

  <!-- No branch (right) -->
  <path d="M 380 170 L 440 170" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="410" y="162" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="440" y="150" width="120" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 8 × lo</text>
  <text x="500" y="184" text-anchor="middle" font-size="10" fill="#4a7a3a">(= 周长)</text>

  <!-- Yes branch (down) -->
  <path d="M 300 210 L 300 226" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="310" y="222" font-size="10" fill="#4a7a3a">是</text>

  <!-- mid computation -->
  <rect x="180" y="228" width="240" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="300" y="252" text-anchor="middle" font-size="12" fill="#446688">mid = lo + (hi - lo) / 2</text>

  <!-- arrow down -->
  <path d="M 300 270 L 300 286" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Diamond: S(mid) >= needed? -->
  <polygon points="300,290 400,335 300,380 200,335" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="330" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">S(mid) ≥</text>
  <text x="300" y="346" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">neededApples?</text>

  <!-- Yes: hi = mid (left) -->
  <path d="M 200 335 L 130 335 L 130 170 L 220 170" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="166" y="327" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="70" y="250" width="120" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="130" y="268" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">hi = mid</text>
  <text x="130" y="282" text-anchor="middle" font-size="10" fill="#888">(收缩上界)</text>
  <path d="M 130 250 L 130 335" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- No: lo = mid+1 (right) -->
  <path d="M 400 335 L 470 335 L 470 170 L 380 170" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="436" y="327" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="410" y="250" width="120" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="470" y="268" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">lo = mid + 1</text>
  <text x="470" y="282" text-anchor="middle" font-size="10" fill="#888">(抬升下界)</text>
  <path d="M 470 250 L 470 335" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="40" y="400" width="520" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="420" font-size="11" fill="#444">单调性保证：S(k) 随 k 递增 → 二分查找找下界，O(log hi) 次</text>
</svg>
