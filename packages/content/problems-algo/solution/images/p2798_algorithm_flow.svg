<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF2798" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">计数算法流程：从左到右一趟扫描</text>

  <!-- Start -->
  <rect x="170" y="42" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="11" fill="#333">开始：cnt = 0, i = 0</text>
  <line x1="260" y1="76" x2="260" y2="94" stroke="#888" stroke-width="1.4" marker-end="url(#arrF2798)" filter="url(#rough2)"/>

  <!-- Decision diamond: i < n ? -->
  <polygon points="260,96 360,140 260,184 160,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="136" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">i &lt; n ?</text>
  <text x="260" y="152" text-anchor="middle" font-size="10" fill="#888">(还有元素)</text>

  <!-- No -> return cnt -->
  <line x1="160" y1="140" x2="76" y2="140" stroke="#888" stroke-width="1.4" marker-end="url(#arrF2798)" filter="url(#rough2)"/>
  <text x="118" y="134" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="16" y="122" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="46" y="144" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回 cnt</text>

  <!-- Yes -->
  <line x1="260" y1="184" x2="260" y2="202" stroke="#888" stroke-width="1.4" marker-end="url(#arrF2798)" filter="url(#rough2)"/>
  <text x="272" y="198" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Inner decision: hours[i] >= target ? -->
  <polygon points="260,204 380,248 260,292 140,248" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">hours[i] ≥ target ?</text>

  <!-- Yes: cnt++ -->
  <line x1="140" y1="248" x2="96" y2="248" stroke="#888" stroke-width="1.4" marker-end="url(#arrF2798)" filter="url(#rough2)"/>
  <text x="120" y="242" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="16" y="230" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="56" y="252" text-anchor="middle" font-size="10" fill="#333">cnt ← cnt + 1</text>

  <!-- No: skip -->
  <line x1="380" y1="248" x2="424" y2="248" stroke="#888" stroke-width="1.4" marker-end="url(#arrF2798)" filter="url(#rough2)"/>
  <text x="404" y="242" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="424" y="230" width="80" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="464" y="252" text-anchor="middle" font-size="10" fill="#333">跳过</text>

  <!-- converge to i = i + 1 -->
  <path d="M 56 266 L 56 314 L 464 314 L 464 266" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <line x1="260" y1="314" x2="260" y2="326" stroke="#888" stroke-width="1.4" marker-end="url(#arrF2798)" filter="url(#rough2)"/>
  <rect x="200" y="326" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="346" text-anchor="middle" font-size="11" fill="#333">i ← i + 1</text>

  <!-- loop back to top diamond -->
  <path d="M 260 358 L 260 382 L 490 382 L 490 96 L 362 96" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrF2798)" filter="url(#rough2)"/>
  <text x="440" y="376" text-anchor="middle" font-size="10" fill="#888">回到 i&lt;n?</text>

  <!-- note -->
  <rect x="40" y="402" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="60" y="422" font-size="10" fill="#666">每元素一次比较，可能一次自增，无回溯无排序</text>
  <text x="60" y="438" font-size="10" fill="#4a7a3a" font-weight="bold">读每个元素至少一次 → O(n) 是下界，本流程恰好最优</text>
</svg>
