<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：两个示例的 L / R 判定表</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">diff = |L−R|：diff=0 → +2；diff=1 → +1；diff ≥ 2 → +0</text>

  <!-- 示例 1 -->
  <text x="260" y="66" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">示例 1：nums = [1,0,2,0,3]，total = 6（零起点 i=1、i=3）</text>

  <rect x="60" y="76" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="105" y="92" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">起点 i</text>
  <rect x="155" y="76" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="195" y="92" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">L</text>
  <rect x="240" y="76" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="92" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">R</text>
  <rect x="325" y="76" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="365" y="92" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">diff</text>
  <rect x="410" y="76" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="455" y="92" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">贡献</text>

  <rect x="60" y="100" width="90" height="26" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="105" y="118" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="155" y="100" width="80" height="26" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="195" y="118" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="240" y="100" width="80" height="26" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="118" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="325" y="100" width="80" height="26" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="365" y="118" text-anchor="middle" font-size="11.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="410" y="100" width="90" height="26" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="455" y="118" text-anchor="middle" font-size="11.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="60" y="126" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="105" y="144" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="155" y="126" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="195" y="144" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="240" y="126" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="144" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="325" y="126" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="365" y="144" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="410" y="126" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="455" y="144" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2 ✓</text>

  <text x="260" y="170" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">答案 = 0 + 2 = 2 —— i=3 向左、向右出发各算一个方案</text>

  <!-- 示例 2 -->
  <text x="260" y="198" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">示例 2：nums = [2,3,4,0,4,1,0]，total = 14（零起点 i=3、i=6）</text>

  <rect x="60" y="208" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="105" y="224" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">起点 i</text>
  <rect x="155" y="208" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="195" y="224" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">L</text>
  <rect x="240" y="208" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="224" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">R</text>
  <rect x="325" y="208" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="365" y="224" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">diff</text>
  <rect x="410" y="208" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="455" y="224" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">贡献</text>

  <rect x="60" y="232" width="90" height="26" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="105" y="250" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="155" y="232" width="80" height="26" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="195" y="250" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">9</text>
  <rect x="240" y="232" width="80" height="26" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="325" y="232" width="80" height="26" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="365" y="250" text-anchor="middle" font-size="11.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="410" y="232" width="90" height="26" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="455" y="250" text-anchor="middle" font-size="11.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="60" y="258" width="90" height="26" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="105" y="276" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <rect x="155" y="258" width="80" height="26" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="195" y="276" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">14</text>
  <rect x="240" y="258" width="80" height="26" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="325" y="258" width="80" height="26" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="365" y="276" text-anchor="middle" font-size="11.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">14</text>
  <rect x="410" y="258" width="90" height="26" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="455" y="276" text-anchor="middle" font-size="11.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">0</text>

  <text x="260" y="302" text-anchor="middle" font-size="11.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">答案 = 0 —— 两侧和相差太大，无论怎么出发都会提前滑出边界</text>

  <!-- 细节提示 -->
  <rect x="20" y="318" width="480" height="82" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="338" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 三个细节：</text>
  <text x="34" y="356" font-size="10" fill="#333" filter="url(#rough2)">① left 在「判定之后」累加：零位置值为 0，先后无差，语义是「离开格子时结算左侧和」；</text>
  <text x="34" y="374" font-size="10" fill="#333" filter="url(#rough2)">② 全零数组每个零都满足 L=R=0 → 答案 = 2 × 零的个数；单个 [0] 的答案是 2 不是 1；</text>
  <text x="34" y="392" font-size="10" fill="#333" filter="url(#rough2)">③ 零贴着端点时一侧和为 0，公式照常生效（如 [1,0]：L=1, R=0，向左出发可行）。</text>
</svg>
