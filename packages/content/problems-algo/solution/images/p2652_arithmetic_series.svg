<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">等差数列求和：k 的倍数之和 = k × (1+2+…+m)</text>

  <!-- Row A: multiples bars (baseline y=175) -->
  <text x="40" y="178" font-size="12" fill="#446688" font-weight="bold">倍数</text>
  <rect x="95" y="149" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="167" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">k</text>
  <rect x="151" y="123" width="46" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="167" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2k</text>
  <rect x="207" y="97" width="46" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="167" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3k</text>
  <rect x="263" y="71" width="46" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="286" y="167" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4k</text>
  <text x="322" y="167" text-anchor="middle" font-size="14" fill="#888">…</text>
  <rect x="350" y="45" width="46" height="130" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="373" y="167" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">mk</text>

  <!-- baseline -->
  <line x1="90" y1="176" x2="406" y2="176" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <!-- vertical arrow linking two rows -->
  <path d="M 70 233 L 70 185" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="58" y="213" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold">× k</text>

  <!-- Row B: counts (baseline y=257, height 24) -->
  <text x="40" y="253" font-size="12" fill="#4a7a3a" font-weight="bold">计数</text>
  <rect x="95" y="233" width="46" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="250" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="151" y="233" width="46" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="250" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="207" y="233" width="46" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="250" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="263" y="233" width="46" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="286" y="250" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="322" y="250" text-anchor="middle" font-size="14" fill="#888">…</text>
  <rect x="350" y="233" width="46" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="373" y="250" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">m</text>

  <!-- Formula box -->
  <rect x="40" y="288" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">S(k) = k × (1 + 2 + … + m) = k · m(m+1)/2</text>
  <text x="280" y="322" text-anchor="middle" font-size="10" fill="#888">其中 m = ⌊n / k⌋，即 [1, n] 内 k 的倍数个数</text>
</svg>
