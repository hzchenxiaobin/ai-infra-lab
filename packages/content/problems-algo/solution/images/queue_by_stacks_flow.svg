<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="880" height="560" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">用栈实现队列：算法流程</text>
  <path d="M 270 42 Q 440 50 610 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- push 分支 -->
  <g filter="url(#sk)">
    <rect x="60" y="70" width="160" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="140" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">push(x)</text>
  <text x="140" y="106" text-anchor="middle" font-size="10" fill="#666">入队操作</text>

  <g filter="url(#sk)">
    <rect x="60" y="140" width="160" height="56" rx="4" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>
  <text x="140" y="164" text-anchor="middle" font-size="12" fill="#333">in_stack.push(x)</text>
  <text x="140" y="182" text-anchor="middle" font-size="10" fill="#2e6e2e">直接压入入栈栈，O(1)</text>
  <path d="M 140 114 L 140 140" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="60" y="226" width="160" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="140" y="251" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">结束 O(1)</text>
  <path d="M 140 196 L 140 226" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 分隔 -->
  <path d="M 260 90 L 260 300" stroke="#c8c8c8" stroke-width="1.5" stroke-dasharray="4 4" filter="url(#sk)"/>

  <!-- pop / peek 分支 -->
  <g filter="url(#sk)">
    <rect x="300" y="70" width="220" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="410" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">pop() / peek()</text>
  <text x="410" y="106" text-anchor="middle" font-size="10" fill="#666">出队 / 取队首</text>

  <!-- 判断：out_stack 空？ -->
  <g filter="url(#sk)">
    <path d="M 410 130 L 510 170 L 410 210 L 310 170 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="410" y="168" text-anchor="middle" font-size="12" fill="#7a2828" font-weight="bold">out_stack</text>
  <text x="410" y="184" text-anchor="middle" font-size="12" fill="#7a2828" font-weight="bold">为空？</text>
  <path d="M 410 114 L 410 130" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 是：倒栈 -->
  <text x="288" y="160" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="540" y="138" width="220" height="64" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="650" y="160" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">while in_stack 非空：</text>
  <text x="650" y="178" text-anchor="middle" font-size="11" fill="#333">  out_stack.push(in_stack.pop())</text>
  <text x="650" y="194" text-anchor="middle" font-size="10" fill="#2e6e2e">把入栈栈全部倒入出栈栈</text>
  <path d="M 510 170 L 540 170" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 否/倒完后 -->
  <text x="510" y="224" font-size="11" fill="#2e6e2e" font-weight="bold">否（已倒过/未空）</text>
  <g filter="url(#sk)">
    <rect x="300" y="240" width="220" height="56" rx="4" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>
  <text x="410" y="264" text-anchor="middle" font-size="12" fill="#333">从 out_stack 取栈顶</text>
  <text x="410" y="282" text-anchor="middle" font-size="10" fill="#7a5415">pop() → out_stack.pop()</text>
  <text x="410" y="294" text-anchor="middle" font-size="10" fill="#7a5415">peek() → out_stack.top()</text>
  <path d="M 410 210 L 410 240" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 650 202 L 650 268 L 520 268" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="300" y="318" width="220" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="410" y="343" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">返回结果（摊还 O(1)）</text>
  <path d="M 410 296 L 410 318" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- empty 分支 -->
  <g filter="url(#sk)">
    <rect x="580" y="70" width="200" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="680" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">empty()</text>
  <text x="680" y="106" text-anchor="middle" font-size="10" fill="#666">判空</text>
  <g filter="url(#sk)">
    <rect x="580" y="140" width="200" height="56" rx="4" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>
  <text x="680" y="164" text-anchor="middle" font-size="12" fill="#333">in_stack.empty()</text>
  <text x="680" y="182" text-anchor="middle" font-size="12" fill="#333">and out_stack.empty()</text>
  <path d="M 680 114 L 680 140" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="580" y="226" width="200" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="680" y="251" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">两栈都空 → true，O(1)</text>
  <path d="M 680 196 L 680 226" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 底部不变量说明 -->
  <g filter="url(#sk)">
    <rect x="60" y="392" width="760" height="140" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="416" font-size="13" font-weight="bold" fill="#2b2b2b">关键不变量 &amp; 摊还分析</text>
  <text x="80" y="440" font-size="11" fill="#444">① out_stack 的栈底永远是最早入队的元素（队首）——倒栈时按入栈逆序压入，最先被 pop 的就是最老的。</text>
  <text x="80" y="460" font-size="11" fill="#444">② 一旦 out_stack 非空，绝不再倒栈，直到它被 pop 空。否则会破坏队内元素的相对顺序。</text>
  <text x="80" y="480" font-size="11" fill="#444">③ 摊还 O(1)：每个元素最多被 push 进 in_stack 一次、pop 出 in_stack 一次、push 进 out_stack 一次、</text>
  <text x="80" y="496" font-size="11" fill="#444">    pop 出 out_stack 一次——4 次栈操作“供养”后续所有 pop/peek，单次操作摊还成本 = O(1)。</text>
  <text x="80" y="518" font-size="11" fill="#7a5415">⚠ 判空必须看两个栈：in_stack 可能还有刚 push 的，out_stack 可能还有倒过来未出的。</text>
</svg>
