<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="430" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：同步前序遍历，第 3 步 o is target 命中</text>
  <text x="290" y="42" text-anchor="middle" font-size="11" fill="#888">树=[7,4,3,null,null,6,19]，target=原树中值为 3 的节点</text>

  <text x="140" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">original</text>
  <g font-size="12">
    <line x1="140" y1="98" x2="100" y2="140" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <line x1="140" y1="98" x2="180" y2="140" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <line x1="180" y1="140" x2="155" y2="188" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <line x1="180" y1="140" x2="205" y2="188" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>

    <circle cx="140" cy="90" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="140" y="94" text-anchor="middle" fill="#d6a040" font-weight="bold">7</text>
    <circle cx="100" cy="148" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="100" y="152" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <circle cx="180" cy="148" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="180" y="152" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <circle cx="155" cy="196" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="155" y="200" text-anchor="middle" fill="#446688" font-weight="bold">6</text>
    <circle cx="205" cy="196" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="205" y="200" text-anchor="middle" fill="#446688" font-weight="bold">19</text>
  </g>
  <text x="156" y="82" font-size="9" fill="#d6a040" font-weight="bold">①</text>
  <text x="84" y="140" font-size="9" fill="#d6a040" font-weight="bold">②</text>
  <text x="196" y="140" font-size="9" fill="#b85450" font-weight="bold">③命中</text>

  <text x="430" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">cloned</text>
  <g font-size="12">
    <line x1="430" y1="98" x2="390" y2="140" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <line x1="430" y1="98" x2="470" y2="140" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <line x1="470" y1="140" x2="445" y2="188" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <line x1="470" y1="140" x2="495" y2="188" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>

    <circle cx="430" cy="90" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="430" y="94" text-anchor="middle" fill="#4a7a3a" font-weight="bold">7</text>
    <circle cx="390" cy="148" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="390" y="152" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <circle cx="470" cy="148" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="470" y="152" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <circle cx="445" cy="196" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="445" y="200" text-anchor="middle" fill="#4a7a3a" font-weight="bold">6</text>
    <circle cx="495" cy="196" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="495" y="200" text-anchor="middle" fill="#4a7a3a" font-weight="bold">19</text>
  </g>
  <text x="446" y="82" font-size="9" fill="#4a7a3a" font-weight="bold">①</text>
  <text x="374" y="140" font-size="9" fill="#4a7a3a" font-weight="bold">②</text>
  <text x="486" y="140" font-size="9" fill="#4a7a3a" font-weight="bold">③返回</text>

  <rect x="30" y="232" width="520" height="184" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="256" font-size="12" fill="#444" font-weight="bold">同步前序遍历步骤（根 → 左 → 右，命中即短路返回）</text>

  <text x="50" y="280" font-size="11" fill="#555" font-family="monospace">① dfs(7, 7') : 7 is target? 否 → 进左子树</text>
  <text x="50" y="300" font-size="11" fill="#555" font-family="monospace">② dfs(4, 4') : 4 is target? 否 → 左空右空 → return null</text>
  <text x="50" y="320" font-size="11" fill="#888" font-family="monospace">       ↑ 回到 ①：L=null → 进右子树</text>
  <text x="50" y="340" font-size="11" fill="#b85450" font-family="monospace" font-weight="bold">③ dfs(3, 3') : 3 is target? 是 → return 3'  ✓</text>

  <text x="50" y="368" font-size="10" fill="#888">全程用指针身份 is 判定，从未读取 .val → 即便值重复也正确（满足 follow-up）</text>
  <text x="50" y="384" font-size="10" fill="#888">③ 命中后 3' 沿调用栈上抛：② 跳过、① 收到非空立即 return → 不再访问 3 的孩子 6/19</text>
  <text x="50" y="400" font-size="10" fill="#888">复杂度：最坏 O(n)（target 在最后或不存在），命中即短路；空间 O(h) 递归栈</text>
</svg>
