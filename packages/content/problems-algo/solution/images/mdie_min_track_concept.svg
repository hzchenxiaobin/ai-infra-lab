<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心直觉：维护「前缀最小值」，每个位置算一次差</text>

  <!-- Array row -->
  <text x="30" y="70" font-size="12" fill="#888">nums =</text>
  <rect x="80" y="54" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="104" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="130" y="54" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="75" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="180" y="54" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="204" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="204" y="100" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">当前 j=2</text>
  <rect x="230" y="54" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <!-- min_so_far annotation -->
  <text x="30" y="140" font-size="12" fill="#444" font-weight="bold">前缀最小值 min_so_far：</text>
  <rect x="230" y="128" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="285" y="146" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">= 1 （来自 j=1）</text>

  <!-- diff computation -->
  <text x="30" y="190" font-size="12" fill="#444" font-weight="bold">当前差值 diff = nums[j] − min_so_far：</text>
  <rect x="300" y="178" width="180" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="390" y="196" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5 − 1 = 4 ⭐</text>

  <!-- query arrow from current j down to min -->
  <path d="M 204 110 L 204 178" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 285 156 L 300 178" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- key insight box -->
  <rect x="60" y="240" width="480" height="138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="264" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">为什么这样一定能取到最大差？</text>
  <text x="80" y="288" font-size="11" fill="#555">• 对每个 j，能与之配对得到「nums[j] − nums[i]」最大的 i，</text>
  <text x="80" y="304" font-size="11" fill="#555">  一定是 [0, j−1] 中 nums[i] 最小的那个（min_so_far）。</text>
  <text x="80" y="324" font-size="11" fill="#555">• 枚举所有 j，每个 j 只需 O(1) 查询最小值 → 总体 O(n)。</text>
  <text x="80" y="344" font-size="11" fill="#555">• 同时维护 min_so_far = min(min_so_far, nums[j])，</text>
  <text x="80" y="360" font-size="11" fill="#555">  为下一个位置准备好「前缀最小」。</text>
  <text x="80" y="374" font-size="11" fill="#4a7a3a" font-weight="bold">  与 121. 买卖股票的最佳时机 完全同构（买点=最小值，卖点=当前价）。</text>
</svg>
