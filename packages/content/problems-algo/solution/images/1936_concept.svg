<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：每个间隔独立补梯级 = ⌈gap/dist⌉ − 1 = (gap−1)//dist</text>

  <!-- ====== Ladder (left) ====== -->
  <!-- vertical poles -->
  <path d="M 92 60 L 92 360" stroke="#446688" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <path d="M 168 60 L 168 360" stroke="#446688" stroke-width="2.5" fill="none" filter="url(#rough2)"/>

  <!-- ground label -->
  <text x="130" y="378" text-anchor="middle" font-size="11" fill="#888">地面 h=0</text>

  <!-- existing rung at h=0 (blue) -->
  <rect x="86" y="346" width="88" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="60" y="358" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">h=0</text>

  <!-- existing rung at h=5 (blue) -->
  <rect x="86" y="106" width="88" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="60" y="118" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">h=5</text>

  <!-- added rungs (green) at h=2, h=4 -->
  <rect x="88" y="250" width="84" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4,2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="260" text-anchor="end" font-size="10.5" fill="#4a7a3a">h=2 ✚</text>

  <rect x="88" y="154" width="84" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4,2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="164" text-anchor="end" font-size="10.5" fill="#4a7a3a">h=4 ✚</text>

  <!-- gap bracket on right of ladder -->
  <path d="M 178 352 L 196 352 L 196 112 L 178 112" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="206" y="236" font-size="12.5" fill="#b85450" font-weight="bold">gap=5</text>
  <text x="206" y="252" font-size="10.5" fill="#b85450">dist=2</text>

  <!-- step arrows on left of ladder (climbing up) -->
  <path d="M 80 352 L 80 256" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="72" y="308" text-anchor="end" font-size="10" fill="#4a7a3a">2</text>
  <path d="M 80 250 L 80 160" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="72" y="210" text-anchor="end" font-size="10" fill="#4a7a3a">2</text>
  <path d="M 80 154 L 80 118" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="72" y="140" text-anchor="end" font-size="10" fill="#4a7a3a">1</text>

  <!-- Divider -->
  <path d="M 260 50 L 260 380" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Formula derivation (right) ====== -->
  <text x="410" y="74" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">公式推导（gap=5, dist=2）</text>

  <!-- step 1 -->
  <rect x="300" y="92" width="220" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="410" y="118" text-anchor="middle" font-size="12" fill="#333">跨越 gap 需 ⌈5/2⌉ = 3 步</text>

  <path d="M 410 136 L 410 156" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="300" y="160" width="220" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="410" y="186" text-anchor="middle" font-size="12" fill="#333">终点梯级已存在 → 补 3−1 = 2 根</text>

  <path d="M 410 204 L 410 224" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- final formula -->
  <rect x="290" y="228" width="240" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="256" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">⌈gap/dist⌉ − 1 = (gap−1)//dist</text>

  <!-- equivalence note -->
  <text x="410" y="296" text-anchor="middle" font-size="10.5" fill="#888">⌈a/b⌉ = (a+b−1)//b，代入化简得 (gap−1)//dist</text>

  <!-- key notes -->
  <text x="290" y="328" font-size="11" fill="#555">• gap ≤ dist 时 (gap−1)//dist = 0，无需补</text>
  <text x="290" y="346" font-size="11" fill="#555">• 各间隔独立，求和即全局最小</text>
  <text x="290" y="364" font-size="11" fill="#555">• 贪心正确：补梯级不影响其他间隔</text>
</svg>
