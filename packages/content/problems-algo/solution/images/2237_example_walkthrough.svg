<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：3 盏灯差分打标 → 前缀和得亮度 → 与 requirement 比较得 4</text>

  <!-- Input summary -->
  <rect x="40" y="44" width="520" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="62" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">n=5, lights=[[0,1],[2,1],[3,2]], requirement=[0,2,1,4,1]</text>
  <text x="300" y="78" text-anchor="middle" font-size="10" fill="#888">灯1 照 [0,1]　灯2 照 [1,3]　灯3 照 [1,4]</text>

  <!-- ===== Table header ===== -->
  <!-- label column header -->
  <rect x="40" y="96" width="98" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="89" y="115" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">位置 / 灯</text>
  <!-- position columns -->
  <rect x="140" y="96" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="115" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="222" y="96" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="115" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="304" y="96" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="344" y="115" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="386" y="96" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="426" y="115" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="468" y="96" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="508" y="115" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <!-- ===== Row: 灯1 [0,1] -> [0,1] ===== -->
  <rect x="40" y="128" width="98" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="89" y="148" text-anchor="middle" font-size="10" fill="#555">灯1 [0,1]</text>
  <rect x="140" y="128" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>
  <rect x="222" y="128" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="262" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>
  <rect x="304" y="128" width="80" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="344" y="148" text-anchor="middle" font-size="11" fill="#ccc">·</text>
  <rect x="386" y="128" width="80" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="426" y="148" text-anchor="middle" font-size="11" fill="#ccc">·</text>
  <rect x="468" y="128" width="80" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="508" y="148" text-anchor="middle" font-size="11" fill="#ccc">·</text>

  <!-- ===== Row: 灯2 [2,1] -> [1,3] ===== -->
  <rect x="40" y="160" width="98" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="89" y="180" text-anchor="middle" font-size="10" fill="#555">灯2 [2,1]</text>
  <rect x="140" y="160" width="80" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="180" text-anchor="middle" font-size="11" fill="#ccc">·</text>
  <rect x="222" y="160" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="262" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>
  <rect x="304" y="160" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="344" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>
  <rect x="386" y="160" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="426" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>
  <rect x="468" y="160" width="80" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="508" y="180" text-anchor="middle" font-size="11" fill="#ccc">·</text>

  <!-- ===== Row: 灯3 [3,2] -> [1,4] ===== -->
  <rect x="40" y="192" width="98" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="89" y="212" text-anchor="middle" font-size="10" fill="#555">灯3 [3,2]</text>
  <rect x="140" y="192" width="80" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="212" text-anchor="middle" font-size="11" fill="#ccc">·</text>
  <rect x="222" y="192" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="262" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>
  <rect x="304" y="192" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="344" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>
  <rect x="386" y="192" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="426" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>
  <rect x="468" y="192" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="508" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>

  <!-- prefix sum arrow -->
  <path d="M 300 226 L 300 236" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="234" font-size="10" fill="#4a7a3a" font-weight="bold">前缀和</text>

  <!-- ===== Row: 亮度 (highlight) ===== -->
  <rect x="40" y="240" width="98" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="89" y="261" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">亮度</text>
  <rect x="140" y="240" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="180" y="261" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="222" y="240" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="262" y="261" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="304" y="240" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="344" y="261" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="386" y="240" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="426" y="261" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="468" y="240" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="508" y="261" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- ===== Row: requirement ===== -->
  <rect x="40" y="278" width="98" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="89" y="298" text-anchor="middle" font-size="10" fill="#555">requirement</text>
  <rect x="140" y="278" width="80" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="298" text-anchor="middle" font-size="11" fill="#555">0</text>
  <rect x="222" y="278" width="80" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="262" y="298" text-anchor="middle" font-size="11" fill="#555">2</text>
  <rect x="304" y="278" width="80" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="344" y="298" text-anchor="middle" font-size="11" fill="#555">1</text>
  <rect x="386" y="278" width="80" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="426" y="298" text-anchor="middle" font-size="11" fill="#555">4</text>
  <rect x="468" y="278" width="80" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="508" y="298" text-anchor="middle" font-size="11" fill="#555">1</text>

  <!-- ===== Row: 达标 >= ===== -->
  <rect x="40" y="314" width="98" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="89" y="335" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">达标 ≥?</text>
  <rect x="140" y="314" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="180" y="335" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="222" y="314" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="262" y="335" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="304" y="314" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="344" y="335" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="386" y="314" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="426" y="335" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  <rect x="468" y="314" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="508" y="335" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- note for pos3 failure -->
  <rect x="40" y="354" width="520" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="372" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">比较「亮度 ≥ requirement」：位置 3 亮度 2 &lt; 4 不达标</text>
  <text x="300" y="384" text-anchor="middle" font-size="10" fill="#888">位置 0/1/2/4 达标 → ans = 4</text>

  <!-- Result -->
  <rect x="40" y="398" width="520" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="420" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">输出 = 4</text>
  <text x="300" y="438" text-anchor="middle" font-size="10" fill="#888">差分打标 3 次 + 前缀和 1 趟，O(m+n) 完成</text>
</svg>
