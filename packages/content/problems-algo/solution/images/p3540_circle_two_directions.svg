<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrb2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a5a8a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">环形房屋：外圈 forward 顺时针单向，内圈 backward 逆时针单向</text>

  <circle cx="260.0" cy="163.0" r="100.0" fill="none" stroke="#c9d6e8" stroke-width="1" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <circle cx="260.0" cy="163.0" r="58.0" fill="none" stroke="#cfe3cf" stroke-width="1" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <path d="M 287.6 66.9 A 100.0 100.0 0 0 1 342.9 107.1" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 359.9 159.5 A 100.0 100.0 0 0 1 338.8 224.6" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 294.2 257.0 A 100.0 100.0 0 0 1 225.8 257.0" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 181.2 224.6 A 100.0 100.0 0 0 1 160.1 159.5" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 177.1 107.1 A 100.0 100.0 0 0 1 232.4 66.9" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <path d="M 244.0 107.2 A 58.0 58.0 0 0 0 211.9 130.6" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 308.1 130.6 A 58.0 58.0 0 0 0 276.0 107.2" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 305.7 198.7 A 58.0 58.0 0 0 0 318.0 161.0" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 240.2 217.5 A 58.0 58.0 0 0 0 279.8 217.5" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 202.0 161.0 A 58.0 58.0 0 0 0 214.3 198.7" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <path d="M 249.5 63.5 A 100.0 100.0 0 0 1 326.9 237.3" fill="none" stroke="#2a5a8a" stroke-width="3" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <path d="M 253.9 105.3 A 58.0 58.0 0 1 0 285.4 215.1" fill="none" stroke="#3a6a2a" stroke-width="3" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <circle cx="260.0" cy="83.0" r="13.0" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260.0" y="87.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a8a" filter="url(#rough2)">0</text>
  <circle cx="336.1" cy="138.3" r="13.0" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="336.1" y="142.8" text-anchor="middle" font-size="13" font-weight="bold" fill="#555555" filter="url(#rough2)">1</text>
  <circle cx="307.0" cy="227.7" r="13.0" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="307.0" y="232.2" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">2</text>
  <circle cx="213.0" cy="227.7" r="13.0" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="213.0" y="232.2" text-anchor="middle" font-size="13" font-weight="bold" fill="#555555" filter="url(#rough2)">3</text>
  <circle cx="183.9" cy="138.3" r="13.0" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="183.9" y="142.8" text-anchor="middle" font-size="13" font-weight="bold" fill="#555555" filter="url(#rough2)">4</text>

  <text x="260" y="56" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2a5a8a" filter="url(#rough2)">起点（房屋 0）</text>
  <text x="325.0" y="261.7" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">目标（房屋 2）</text>

  <text x="392" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a8a" filter="url(#rough2)">① 顺时针弧</text>
  <text x="392" y="164" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">forward 前缀和</text>
  <text x="260" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a6a2a" filter="url(#rough2)">② 逆时针弧</text>
  <text x="260" y="167" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">backward 前缀和</text>

  <text x="103" y="78" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">forward 环</text>
  <text x="103" y="93" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">i → i+1（顺时针）</text>
  <path d="M 140 96 L 180 92" stroke="#446688" stroke-width="1" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="110" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">backward 环</text>
  <text x="110" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">i → i−1（逆时针）</text>
  <path d="M 146 228 L 220 210" stroke="#4a7a3a" stroke-width="1" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="55" y="282" width="410" height="62" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">每段移动彼此独立：总时间 = Σ min(顺时针弧长, 逆时针弧长)</text>
  <text x="260" y="328" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">弧长 = 前缀和之差，回绕时补上整圈总和 F[n] / B[n]</text>

</svg>
