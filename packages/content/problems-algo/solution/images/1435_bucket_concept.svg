<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：时间轴分四桶，UNION 显式枚举桶标签</text>

  <!-- ============ Time axis ============ -->
  <text x="50" y="72" font-size="11" fill="#446688" font-weight="bold">duration（秒）</text>
  <line x1="40" y1="200" x2="540" y2="200" stroke="#446688" stroke-width="2" filter="url(#rough2)" marker-end="url(#arrB)"/>

  <!-- Tick marks on axis -->
  <line x1="40" y1="195" x2="40" y2="210" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="225" text-anchor="middle" font-size="10" fill="#446688">0</text>

  <line x1="145" y1="195" x2="145" y2="210" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="225" text-anchor="middle" font-size="10" fill="#446688">300</text>
  <text x="145" y="238" text-anchor="middle" font-size="8.5" fill="#888">5 min</text>

  <line x1="250" y1="195" x2="250" y2="210" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="225" text-anchor="middle" font-size="10" fill="#446688">600</text>
  <text x="250" y="238" text-anchor="middle" font-size="8.5" fill="#888">10 min</text>

  <line x1="355" y1="195" x2="355" y2="210" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="225" text-anchor="middle" font-size="10" fill="#446688">900</text>
  <text x="355" y="238" text-anchor="middle" font-size="8.5" fill="#888">15 min</text>

  <text x="530" y="225" text-anchor="middle" font-size="9" fill="#888">秒</text>

  <!-- ============ Bucket 1: [0-5> ============ -->
  <rect x="42" y="105" width="101" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="125" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">[0-5&gt;</text>
  <text x="92" y="142" text-anchor="middle" font-size="9" fill="#333">[0, 300)</text>
  <text x="92" y="156" text-anchor="middle" font-size="8.5" fill="#888">左闭右开</text>
  <text x="92" y="175" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">SELECT ①</text>
  <text x="92" y="188" text-anchor="middle" font-size="8.5" fill="#4a7a3a">WHERE &lt; 300</text>

  <!-- ============ Bucket 2: [5-10> ============ -->
  <rect x="147" y="105" width="101" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="197" y="125" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[5-10&gt;</text>
  <text x="197" y="142" text-anchor="middle" font-size="9" fill="#333">[300, 600)</text>
  <text x="197" y="156" text-anchor="middle" font-size="8.5" fill="#888">左闭右开</text>
  <text x="197" y="175" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">SELECT ②</text>
  <text x="197" y="188" text-anchor="middle" font-size="8.5" fill="#4a7a3a">300 ≤ d &lt; 600</text>

  <!-- ============ Bucket 3: [10-15> (EMPTY, highlighted) ============ -->
  <rect x="252" y="105" width="101" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="302" y="125" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">[10-15&gt;</text>
  <text x="302" y="142" text-anchor="middle" font-size="9" fill="#333">[600, 900)</text>
  <text x="302" y="156" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">空桶！</text>
  <text x="302" y="175" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">SELECT ③</text>
  <text x="302" y="188" text-anchor="middle" font-size="8.5" fill="#d6a040">COUNT = 0 ✓</text>

  <!-- ============ Bucket 4: 15 or more ============ -->
  <rect x="357" y="105" width="101" height="90" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="407" y="125" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">15 or more</text>
  <text x="407" y="142" text-anchor="middle" font-size="9" fill="#333">[900, +∞)</text>
  <text x="407" y="156" text-anchor="middle" font-size="8.5" fill="#888">闭左开右无界</text>
  <text x="407" y="175" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">SELECT ④</text>
  <text x="407" y="188" text-anchor="middle" font-size="8.5" fill="#4a7a3a">≥ 900</text>

  <!-- ============ UNION ALL bracket below axis ============ -->
  <text x="290" y="262" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">UNION ALL（四个 SELECT 纵向拼接）</text>
  <path d="M42,245 L42,255 L458,255 L458,245" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="250" y1="255" x2="250" y2="265" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- ============ Result table ============ -->
  <text x="290" y="285" text-anchor="middle" font-size="10" fill="#888">每个 SELECT 显式输出桶标签 → 空桶行也存在，COUNT(*) 对空集返回 0</text>

  <rect x="190" y="295" width="200" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="310" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">bin</text>
  <text x="335" y="310" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">total</text>

  <rect x="190" y="317" width="200" height="18" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="330" text-anchor="middle" font-size="9" fill="#333">[0-5&gt;</text>
  <text x="335" y="330" text-anchor="middle" font-size="9" fill="#333">3</text>

  <rect x="190" y="335" width="200" height="18" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="348" text-anchor="middle" font-size="9" fill="#333">[5-10&gt;</text>
  <text x="335" y="348" text-anchor="middle" font-size="9" fill="#333">1</text>

  <!-- Empty bucket row highlighted -->
  <rect x="190" y="353" width="200" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="235" y="366" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">[10-15&gt;</text>
  <text x="335" y="366" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">0</text>

  <rect x="190" y="371" width="200" height="18" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="384" text-anchor="middle" font-size="9" fill="#333">15 or more</text>
  <text x="335" y="384" text-anchor="middle" font-size="9" fill="#333">1</text>

  <text x="290" y="396" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">↑ 空桶保留：COUNT(*) 空集返回 0（非 NULL），行照样输出</text>
</svg>
