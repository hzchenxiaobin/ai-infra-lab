<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：expTime = 生成时刻 + timeToLive，过期判定 expTime ≤ currentTime</text>

  <!-- Time axis ticks (t = 0..15, 28px per unit, origin x=60) -->
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="60" y="196" filter="url(#rough2)">0</text>
    <text x="116" y="196" filter="url(#rough2)">2</text>
    <text x="200" y="196" filter="url(#rough2)">5</text>
    <text x="228" y="196" filter="url(#rough2)">6</text>
    <text x="256" y="196" filter="url(#rough2)">7</text>
    <text x="284" y="196" filter="url(#rough2)">8</text>
    <text x="340" y="196" filter="url(#rough2)">10</text>
    <text x="396" y="196" filter="url(#rough2)">12</text>
    <text x="480" y="196" filter="url(#rough2)">15</text>
  </g>

  <!-- Time axis line -->
  <path d="M 50 184 L 510 184" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="520" y="188" font-size="10" fill="#888" filter="url(#rough2)">t</text>

  <!-- Token aaa lifeline: gen@2 exp@7 -->
  <text x="44" y="134" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">aaa</text>
  <rect x="116" y="118" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="186" y="137" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">gen@2 → exp@7</text>
  <!-- gen dot -->
  <circle cx="116" cy="132" r="3" fill="#446688" filter="url(#rough2)"/>
  <!-- exp dot (boundary) -->
  <circle cx="256" cy="132" r="3" fill="#b85450" filter="url(#rough2)"/>

  <!-- Token bbb lifeline: gen@7 exp@12, renewed@10 exp@15 -->
  <text x="44" y="86" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">bbb</text>
  <!-- original segment 7->12 -->
  <rect x="256" y="70" width="140" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="326" y="89" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">gen@7 → exp@12</text>
  <!-- renewed extension 12->15 (dashed border, orange) -->
  <rect x="396" y="70" width="84" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,2" rx="4" filter="url(#rough2)"/>
  <text x="438" y="89" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">renew@10</text>
  <!-- gen dot -->
  <circle cx="256" cy="84" r="3" fill="#4a7a3a" filter="url(#rough2)"/>
  <!-- old exp dot -->
  <circle cx="396" cy="84" r="3" fill="#bbb" filter="url(#rough2)"/>
  <!-- new exp dot -->
  <circle cx="480" cy="84" r="3" fill="#d6a040" filter="url(#rough2)"/>

  <!-- Boundary marker at t=7: aaa expires -->
  <path d="M 256 60 L 256 184" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="256" y="56" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">aaa 过期@7</text>

  <!-- count(6) annotation: vertical line at t=6 -->
  <path d="M 228 108 L 228 184" stroke="#446688" stroke-width="1.2" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <text x="228" y="214" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">count(6)=1</text>

  <!-- count(15) annotation -->
  <path d="M 480 60 L 480 184" stroke="#888" stroke-width="1.2" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <text x="480" y="214" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">count(15)=0</text>

  <!-- dashed separator -->
  <path d="M 40 234 L 520 234" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Key rules -->
  <text x="56" y="256" font-size="11.5" fill="#555" filter="url(#rough2)">• <tspan fill="#446688" font-weight="bold">generate(id, t)</tspan>：记录 expTime = t + timeToLive</text>
  <text x="56" y="278" font-size="11.5" fill="#555" filter="url(#rough2)">• <tspan fill="#4a7a3a" font-weight="bold">renew(id, t)</tspan>：仅当 expTime &gt; t（未过期）才续期为 t + timeToLive</text>
  <text x="56" y="300" font-size="11.5" fill="#555" filter="url(#rough2)">• <tspan fill="#d6a040" font-weight="bold">count(t)</tspan>：统计 expTime &gt; t 的 token 数</text>
  <text x="56" y="324" font-size="11" fill="#b85450" filter="url(#rough2)">⚠ 过期边界：expTime ≤ currentTime 即过期（时刻 t 操作与 t 过期同时发生时，过期优先）</text>
  <text x="56" y="344" font-size="10.5" fill="#888" filter="url(#rough2)">renew 不删除旧记录、只追加新 expTime → 堆中残留旧条目，需惰性清理</text>
</svg>
