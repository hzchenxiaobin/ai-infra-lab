<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">使数组唯一的最小增量：算法流程</text>

  <!-- Step 1: Sort -->
  <rect x="170" y="42" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 升序排序 nums</text>
  <text x="260" y="78" text-anchor="middle" font-size="10" fill="#888">O(n log n)</text>

  <path d="M 260 86 L 260 94" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Step 2: Init -->
  <rect x="170" y="98" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② prev = nums[0], moves = 0</text>

  <path d="M 260 138 L 260 146" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Step 3: Loop -->
  <rect x="150" y="150" width="220" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="174" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 遍历 i = 1 → n−1</text>

  <path d="M 260 190 L 260 198" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Decision: nums[i] > prev? -->
  <path d="M 260 200 L 360 240 L 260 280 L 160 240 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="236" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">nums[i]</text>
  <text x="260" y="252" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">&gt; prev ?</text>

  <!-- Yes branch (left) -->
  <path d="M 160 240 L 100 240" stroke="#82b366" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="130" y="232" text-anchor="middle" font-size="11" fill="#82b366">是</text>

  <rect x="30" y="220" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="90" y="238" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">无需增量</text>
  <text x="90" y="254" text-anchor="middle" font-size="10" fill="#555">prev = nums[i]</text>

  <!-- No branch (right) -->
  <path d="M 360 240 L 420 240" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="390" y="232" text-anchor="middle" font-size="11" fill="#d6a040">否</text>

  <rect x="370" y="220" width="120" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="238" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">顶到 prev+1</text>
  <text x="430" y="254" text-anchor="middle" font-size="10" fill="#555">moves += prev+1−x</text>

  <!-- Loop back arrow -->
  <path d="M 90 264 L 90 300 L 260 300 L 260 170" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,2" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <path d="M 430 264 L 430 300 L 260 300" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <text x="175" y="294" font-size="10" fill="#888">i++，继续遍历</text>

  <!-- Final result -->
  <path d="M 260 300 L 260 318" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)" opacity="0"/>

  <rect x="160" y="318" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ 遍历结束</text>
  <text x="260" y="354" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return moves</text>

  <!-- Summary -->
  <rect x="30" y="330" width="110" height="32" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="85" y="350" text-anchor="middle" font-size="10" fill="#888">O(n log n) 时间</text>
  <rect x="380" y="330" width="110" height="32" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="435" y="350" text-anchor="middle" font-size="10" fill="#888">O(log n) 空间</text>
</svg>
