<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：最近叶子可能在"另一侧子树"，须经父指针上溯</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">把树当作无向图（加父指针），从 target 做 BFS → 首个叶子即最近</text>

  <!-- ===== Left: example tree ===== -->
  <text x="30" y="72" font-size="12" fill="#446688" font-weight="bold">示例树（k=2）</text>

  <!-- edges -->
  <line x1="100" y1="86" x2="78" y2="118" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="112" y1="86" x2="144" y2="118" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="73" y1="132" x2="62" y2="166" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="60" y1="180" x2="52" y2="214" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="50" y1="228" x2="44" y2="262" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- nodes -->
  <!-- 1 -->
  <circle cx="106" cy="72" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="106" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <!-- 2 (target) -->
  <circle cx="74" cy="118" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="74" y="122" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <text x="74" y="142" text-anchor="middle" font-size="9" fill="#d6a040">target k</text>
  <!-- 3 (leaf) -->
  <circle cx="150" cy="118" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="122" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="150" y="142" text-anchor="middle" font-size="9" fill="#b85450">叶子</text>
  <!-- 4 -->
  <circle cx="58" cy="172" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <!-- 5 -->
  <circle cx="48" cy="220" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="224" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <!-- 6 (leaf) -->
  <circle cx="42" cy="272" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="42" y="276" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6</text>
  <text x="42" y="296" text-anchor="middle" font-size="9" fill="#b85450">叶子</text>

  <!-- path A: down to 6 -->
  <path d="M 64 134 Q 30 200 28 272" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="20" y="206" font-size="10" fill="#b85450" font-weight="bold">向下</text>
  <text x="20" y="220" font-size="10" fill="#b85450">dist=3</text>

  <!-- path B: up to parent 1 then to 3 -->
  <path d="M 82 106 Q 110 88 138 110" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="112" y="92" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">经父指针</text>
  <text x="112" y="104" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">dist=2 ⭐</text>

  <!-- ===== Middle arrow ===== -->
  <rect x="208" y="150" width="150" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="283" y="170" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">加父指针 → 无向图</text>
  <text x="283" y="186" text-anchor="middle" font-size="10" fill="#666">每个点连左/右子 + 父</text>

  <!-- ===== Right: BFS layers ===== -->
  <text x="392" y="72" font-size="12" fill="#4a7a3a" font-weight="bold">从 target 做 BFS 逐层扩散</text>

  <!-- layer 0 -->
  <rect x="380" y="86" width="180" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="390" y="105" font-size="10" fill="#888">层0</text>
  <circle cx="430" cy="101" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="105" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>
  <text x="552" y="105" text-anchor="end" font-size="9" fill="#888">非叶</text>

  <!-- layer 1 -->
  <rect x="380" y="124" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="390" y="143" font-size="10" fill="#888">层1</text>
  <circle cx="430" cy="139" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="143" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <circle cx="470" cy="139" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="143" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">4</text>
  <text x="552" y="143" text-anchor="end" font-size="9" fill="#888">非叶</text>

  <!-- layer 2 (contains leaf) -->
  <rect x="380" y="162" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="390" y="181" font-size="10" fill="#888">层2</text>
  <circle cx="430" cy="177" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="430" y="181" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <circle cx="470" cy="177" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="181" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">5</text>
  <text x="552" y="181" text-anchor="end" font-size="9" fill="#b85450" font-weight="bold">3 是叶 ⭐</text>

  <!-- layer 3 (not reached) -->
  <rect x="380" y="200" width="180" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="390" y="219" font-size="10" fill="#bbb">层3</text>
  <circle cx="430" cy="215" r="11" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="430" y="219" text-anchor="middle" font-size="10" fill="#bbb" font-weight="bold">6</text>
  <text x="552" y="219" text-anchor="end" font-size="9" fill="#bbb">不会到达</text>

  <!-- arrow connecting layers down -->
  <path d="M 470 116 L 470 124" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 470 154 L 470 162" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- answer box -->
  <rect x="380" y="250" width="180" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="470" y="268" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">首个含叶子的层 → 返回 3</text>
  <text x="470" y="284" text-anchor="middle" font-size="9" fill="#666">同层多叶取最小值</text>

  <!-- footer -->
  <text x="290" y="352" text-anchor="middle" font-size="10" fill="#888">向下 DFS 只能到 6（dist=3）；BFS 在无向图上自动发现更近的 3（dist=2）</text>
</svg>
