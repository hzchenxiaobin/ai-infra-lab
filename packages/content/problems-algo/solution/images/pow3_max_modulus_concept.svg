<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：3 的幂互相整除</text>

  <!-- ===== Panel A: 列出 3 的幂序列 ===== -->
  <text x="40" y="54" font-size="12" fill="#446688" font-weight="bold">3 的幂序列（int32 范围内）</text>

  <text x="40" y="78" font-size="11" fill="#333">3^0=1</text>
  <text x="120" y="78" font-size="11" fill="#333">3^1=3</text>
  <text x="180" y="78" font-size="11" fill="#333">3^2=9</text>
  <text x="240" y="78" font-size="11" fill="#333">3^3=27</text>
  <text x="300" y="78" font-size="11" fill="#333">3^4=81</text>
  <text x="372" y="78" font-size="11" fill="#888">…</text>
  <text x="408" y="78" font-size="11" fill="#b85450" font-weight="bold">3^19</text>

  <!-- 3^19 highlighted box -->
  <rect x="400" y="92" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="460" y="114" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">3^19 = 1162261467</text>

  <!-- 溢出标记 -->
  <rect x="400" y="132" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="460" y="148" text-anchor="middle" font-size="10.5" fill="#d6a040">3^20 = 3486784401 &gt; 2^31−1</text>

  <!-- 说明 -->
  <rect x="40" y="100" width="320" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="200" y="118" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">32 位有符号整数范围内</text>
  <text x="200" y="134" text-anchor="middle" font-size="11" fill="#446688">最大的 3 的幂就是 3^19</text>

  <!-- divider -->
  <line x1="40" y1="170" x2="500" y2="170" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Panel B: 整除关系 ===== -->
  <text x="40" y="192" font-size="12" fill="#4a7a3a" font-weight="bold">关键性质：3^a 整除 3^b（当 a ≤ b）</text>

  <text x="40" y="216" font-size="11" fill="#333">因为 3^b / 3^a = 3^(b−a) 是整数</text>

  <!-- 整除链示意 -->
  <rect x="60" y="232" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="95" y="252" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3^0</text>

  <path d="M 130 247 L 158 247" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="144" y="240" text-anchor="middle" font-size="9.5" fill="#4a7a3a">整除</text>

  <rect x="160" y="232" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="195" y="252" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3^1</text>

  <path d="M 230 247 L 258 247" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="244" y="240" text-anchor="middle" font-size="9.5" fill="#4a7a3a">整除</text>

  <rect x="260" y="232" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="295" y="252" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3^2</text>

  <text x="345" y="252" font-size="11" fill="#888">…</text>

  <path d="M 360 247 L 388 247" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="374" y="240" text-anchor="middle" font-size="9.5" fill="#4a7a3a">整除</text>

  <rect x="390" y="228" width="110" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="445" y="252" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3^19（最大）</text>

  <!-- 结论框 -->
  <rect x="40" y="280" width="460" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="300" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">结论：每个 3^k（k = 0..19）都是 3^19 的因数</text>
  <text x="270" y="318" text-anchor="middle" font-size="11" fill="#4a7a3a">n 是 3 的幂  ⇔  n &gt; 0 且 3^19 mod n == 0</text>

  <!-- 对照说明 -->
  <rect x="40" y="348" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="368" font-size="11" fill="#d6a040" font-weight="bold">⚠️ 与 231（2 的幂）的差异</text>
  <text x="60" y="384" font-size="10.5" fill="#333">• 2 的幂：底数是 2，可用 n &amp; (n−1) 位运算判「恰一个 1」，O(1)</text>
  <text x="60" y="398" font-size="10.5" fill="#333">• 3 的幂：底数非 2，二进制无特殊形态，改用「最大幂取模」整数法</text>
</svg>
