<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：两桶求和，一眼定胜负</text>

  <!-- 表头 -->
  <rect x="35" y="44" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">输入 nums</text>
  <rect x="145" y="44" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="205" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">个位桶 → single</text>
  <rect x="265" y="44" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">dbl</text>
  <rect x="335" y="44" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="380" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">判定</text>
  <rect x="425" y="44" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="455" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">输出</text>

  <!-- 行 1：示例 1 -->
  <rect x="35" y="72" width="110" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="94" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[1,2,3,4,10]</text>
  <rect x="145" y="72" width="120" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="205" y="94" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">1+2+3+4 = 10</text>
  <rect x="265" y="72" width="70" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="300" y="94" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">10</text>
  <rect x="335" y="72" width="90" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="380" y="94" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">10 = 10 打平</text>
  <rect x="425" y="72" width="60" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="455" y="94" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>

  <!-- 行 2：示例 2 -->
  <rect x="35" y="108" width="110" height="36" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="130" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[1,2,3,4,5,14]</text>
  <rect x="145" y="108" width="120" height="36" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="205" y="130" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">1+2+3+4+5 = 15</text>
  <rect x="265" y="108" width="70" height="36" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="300" y="130" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">14</text>
  <rect x="335" y="108" width="90" height="36" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="380" y="130" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">15 &gt; 14 ✓</text>
  <rect x="425" y="108" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="455" y="130" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>

  <!-- 行 3：示例 3 -->
  <rect x="35" y="144" width="110" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="166" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[5,5,5,25]</text>
  <rect x="145" y="144" width="120" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="205" y="166" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">5+5+5 = 15</text>
  <rect x="265" y="144" width="70" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="300" y="166" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">25</text>
  <rect x="335" y="144" width="90" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="380" y="166" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">25 &gt; 15 ✓</text>
  <rect x="425" y="144" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="455" y="166" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>

  <!-- 示例 3 解读 -->
  <rect x="24" y="200" width="232" height="72" rx="8" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="220" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">示例③ 反直觉点</text>
  <text x="140" y="240" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">个位桶 3 个元素 vs 两位桶 1 个</text>
  <text x="140" y="260" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">个数占优 ≠ 和值占优：Alice 弃多选大</text>

  <!-- 示例 1 解读 -->
  <rect x="264" y="200" width="232" height="72" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="220" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例① 唯一败因</text>
  <text x="380" y="240" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">两桶和恰好都等于 10，怎么选都平手</text>
  <text x="380" y="260" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">「严格大于」不成立 → false</text>

  <!-- 结论带 -->
  <rect x="60" y="288" width="400" height="36" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="311" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">答案一句话：single ≠ dbl ? true : false</text>

  <text x="260" y="348" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">桶的胜负只看「和」，与桶里元素个数无关</text>
</svg>
