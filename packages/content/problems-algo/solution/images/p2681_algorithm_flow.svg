<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">单趟递推：贡献与状态 g 同步更新</text>

  <!-- current element x -->
  <text x="30" y="66" font-size="12" fill="#888">nums[j]:</text>
  <rect x="100" y="48" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="71" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">x</text>
  <text x="125" y="98" text-anchor="middle" font-size="10" fill="#999">当前元素</text>

  <!-- arrow down -->
  <path d="M 125 104 L 125 120" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step A box: contribution (red) -->
  <rect x="40" y="120" width="200" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="140" y="143" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">① 累加贡献</text>
  <text x="140" y="165" text-anchor="middle" font-size="13" fill="#333">ans += x² · (g + x)</text>
  <text x="140" y="186" text-anchor="middle" font-size="10" fill="#888">用进入时的 g（旧状态）</text>

  <!-- Step B box: update g (blue) -->
  <rect x="280" y="120" width="200" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="380" y="143" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">② 更新状态</text>
  <text x="380" y="165" text-anchor="middle" font-size="13" fill="#333">g = 2·g + x</text>
  <text x="380" y="186" text-anchor="middle" font-size="10" fill="#888">为下一个 j 准备新 g</text>

  <!-- arrow A -> B -->
  <path d="M 240 158 L 280 158" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="260" y="151" text-anchor="middle" font-size="9" fill="#b85450">先用后更</text>

  <!-- g evolution row -->
  <text x="30" y="236" font-size="12" fill="#888">g 演化:</text>

  <rect x="70" y="220" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="239" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="92" y="262" text-anchor="middle" font-size="9" fill="#999">g₀</text>

  <path d="M 114 234 L 144 234" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="129" y="226" text-anchor="middle" font-size="9" fill="#888">×2+1</text>

  <rect x="144" y="220" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="166" y="239" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="166" y="262" text-anchor="middle" font-size="9" fill="#999">g₁</text>

  <path d="M 188 234 L 218 234" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="203" y="226" text-anchor="middle" font-size="9" fill="#888">×2+2</text>

  <rect x="218" y="220" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="239" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="240" y="262" text-anchor="middle" font-size="9" fill="#999">g₂</text>

  <path d="M 262 234 L 292 234" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="277" y="226" text-anchor="middle" font-size="9" fill="#888">×2+3</text>

  <rect x="292" y="220" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="314" y="239" text-anchor="middle" font-size="12" fill="#333">11</text>
  <text x="314" y="262" text-anchor="middle" font-size="9" fill="#999">g₃</text>

  <text x="346" y="239" font-size="11" fill="#888">…  (以排序数组为例)</text>

  <!-- summary box -->
  <rect x="40" y="288" width="440" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">递推关键：g_{j+1} = 2·g_j + nums[j]</text>
  <text x="260" y="332" text-anchor="middle" font-size="11" fill="#888">排序 O(n log n) + 单趟 O(n)，全程取模</text>
</svg>
