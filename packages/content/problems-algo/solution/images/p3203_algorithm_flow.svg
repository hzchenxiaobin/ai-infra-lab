<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：两次 BFS 求直径，公式合并</text>

  <ellipse cx="260" cy="56" rx="36" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 260 71 L 260 82" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="86" width="260" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="105" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">建树1、树2 邻接表（无向边双向加入）</text>

  <path d="M 260 114 L 260 126" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="130" width="260" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="149" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">BFS① 树1 任取起点 → 最远点 u</text>

  <path d="M 260 158 L 260 170" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="174" width="260" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="193" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">BFS② 树1 从 u 出发 → 最远距离 = d₁</text>

  <path d="M 260 202 L 260 214" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="218" width="260" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="237" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">树2 同样两遍 BFS → d₂</text>

  <path d="M 260 246 L 260 258" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="85" y="262" width="350" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="283" text-anchor="middle" font-size="12" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">ans ← max(d₁, d₂, ⌈d₁/2⌉ + ⌈d₂/2⌉ + 1)</text>

  <path d="M 260 294 L 260 306" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <ellipse cx="260" cy="326" rx="46" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="331" text-anchor="middle" font-size="12" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <text x="260" y="372" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">⌈d/2⌉ 用 (d+1)//2 计算；n=1（无边）时 BFS 返回 0，无需特判</text>
  <text x="260" y="392" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">理论依据：从任意点出发的最远点必是某条直径的端点（两次 BFS 定理）</text>
  <text x="260" y="412" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">用 BFS 而非递归 DFS：链状树深达 10⁵，递归会爆栈（Python 尤甚）</text>
</svg>
