<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：a = [0,2,3,3,6,6,7,7]（n = 8），逐 k 检验</text>
  <text x="310" y="42" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">左检查 a[k−1] &lt; k（k=0 时哨兵 −1），右检查 a[k] &gt; k（k=n 时哨兵 +∞）</text>

  <!-- header -->
  <rect x="70" y="58" width="480" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="105" y="77" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">k</text>
  <text x="227" y="77" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">a[k−1] &lt; k ?</text>
  <text x="395" y="77" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">a[k] &gt; k ?</text>
  <text x="512" y="77" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">可行？</text>

  <!-- k = 0 (invalid) -->
  <rect x="70" y="86" width="480" height="28" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105" y="104" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">0</text>
  <text x="227" y="104" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">哨兵 −1 &lt; 0 ✓</text>
  <text x="395" y="104" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">a[0] = 0 &gt; 0 ✗</text>
  <text x="512" y="104" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- k = 1 (valid) -->
  <rect x="70" y="114" width="480" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="105" y="132" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="227" y="132" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a[0] = 0 &lt; 1 ✓</text>
  <text x="395" y="132" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a[1] = 2 &gt; 1 ✓</text>
  <text x="512" y="132" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- k = 2 (invalid) -->
  <rect x="70" y="142" width="480" height="28" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105" y="160" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">2</text>
  <text x="227" y="160" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">a[1] = 2 &lt; 2 ✗</text>
  <text x="395" y="160" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">—</text>
  <text x="512" y="160" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- k = 3 (invalid) -->
  <rect x="70" y="170" width="480" height="28" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105" y="188" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">3</text>
  <text x="227" y="188" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">a[2] = 3 &lt; 3 ✗</text>
  <text x="395" y="188" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">—</text>
  <text x="512" y="188" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- k = 4 (valid) -->
  <rect x="70" y="198" width="480" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="105" y="216" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="227" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a[3] = 3 &lt; 4 ✓</text>
  <text x="395" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a[4] = 6 &gt; 4 ✓</text>
  <text x="512" y="216" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- k = 5 (invalid) -->
  <rect x="70" y="226" width="480" height="28" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105" y="244" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">5</text>
  <text x="227" y="244" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">a[4] = 6 &lt; 5 ✗</text>
  <text x="395" y="244" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">—</text>
  <text x="512" y="244" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- k = 6 (invalid) -->
  <rect x="70" y="254" width="480" height="28" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105" y="272" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">6</text>
  <text x="227" y="272" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">a[5] = 6 &lt; 6 ✗</text>
  <text x="395" y="272" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">—</text>
  <text x="512" y="272" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- k = 7 (invalid) -->
  <rect x="70" y="282" width="480" height="28" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105" y="300" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">7</text>
  <text x="227" y="300" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">a[6] = 7 &lt; 7 ✗</text>
  <text x="395" y="300" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">—</text>
  <text x="512" y="300" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- k = 8 (valid) -->
  <rect x="70" y="310" width="480" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="105" y="328" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="227" y="328" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a[7] = 7 &lt; 8 ✓</text>
  <text x="395" y="328" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">哨兵 +∞ &gt; 8 ✓</text>
  <text x="512" y="328" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- conclusion box -->
  <rect x="70" y="358" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="382" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">可行 k = {1, 4, 8} → 答案 = 3</text>
  <text x="310" y="402" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">k=1 选值 0；k=4 选值 0,2,3,3；k=8 全选</text>

  <text x="310" y="432" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">对照：每个可行 k 的选中集合都被「值 &lt; k 必须入选」唯一锁定</text>
</svg>
