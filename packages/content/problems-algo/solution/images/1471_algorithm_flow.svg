<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：排序 → 取中位数 → 双指针循环 k 轮取较强端 → 返回</text>

  <!-- Start -->
  <ellipse cx="180" cy="48" rx="40" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="52" text-anchor="middle" font-size="12" fill="#333">开始</text>
  <path d="M 180 63 L 180 74" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- sort -->
  <rect x="100" y="76" width="160" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="95" text-anchor="middle" font-size="11.5" fill="#333">sort(arr)</text>
  <path d="M 180 106 L 180 117" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- median -->
  <rect x="84" y="119" width="192" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="138" text-anchor="middle" font-size="11.5" fill="#333">m = arr[(n − 1) / 2]</text>
  <path d="M 180 149 L 180 160" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="104" y="162" width="152" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="181" text-anchor="middle" font-size="11.5" fill="#333">l = 0, r = n−1, i = 0</text>
  <path d="M 180 192 L 180 203" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: i < k ? -->
  <polygon points="180,205 262,240 180,275 98,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="244" text-anchor="middle" font-size="12" fill="#333">i &lt; k ?</text>

  <!-- yes down -->
  <path d="M 180 275 L 180 287" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="283" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- inner diamond: |arr[r]-m| >= |arr[l]-m| ? -->
  <polygon points="180,289 286,326 180,363 74,326" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="322" text-anchor="middle" font-size="10.5" fill="#333">|arr[r]−m|</text>
  <text x="180" y="336" text-anchor="middle" font-size="10.5" fill="#333">≥ |arr[l]−m| ?</text>

  <!-- yes branch: left box res[i]=arr[r], r-- -->
  <path d="M 74 326 L 40 326 L 40 360" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="320" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="12" y="362" width="120" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="72" y="380" text-anchor="middle" font-size="11" fill="#333">res[i] = arr[r]</text>
  <text x="72" y="394" text-anchor="middle" font-size="11" fill="#333">r −−</text>

  <!-- no branch: right box res[i]=arr[l], l++ -->
  <path d="M 286 326 L 320 326 L 320 360" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="320" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="260" y="362" width="120" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="380" text-anchor="middle" font-size="11" fill="#333">res[i] = arr[l]</text>
  <text x="320" y="394" text-anchor="middle" font-size="11" fill="#333">l ++</text>

  <!-- both merge to i++ box at (180, 418) -->
  <path d="M 72 402 L 72 418 L 180 418" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 320 402 L 320 418 L 180 418" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <rect x="132" y="418" width="96" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="436" text-anchor="middle" font-size="11.5" fill="#333">i ++</text>

  <!-- loop back: i++ -> left -> up to diamond i<k left point (98,240) -->
  <path d="M 132 432 L 40 432 L 40 240 L 98 240" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="44" y="234" font-size="10.5" fill="#4a7a3a">回到 i&lt;k</text>

  <!-- no branch from i<k: right to return res -->
  <path d="M 262 240 L 360 240" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="234" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="360" y="224" width="120" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="244" text-anchor="middle" font-size="11.5" fill="#333">返回 res</text>
  <path d="M 420 256 L 420 268" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="420" cy="286" rx="40" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="290" text-anchor="middle" font-size="12" fill="#333">结束</text>

  <!-- footer note -->
  <rect x="40" y="316" width="0" height="0" fill="none"/>
</svg>
