<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：特判 k=0 → 排序 → 二分收工</text>

  <!-- 输入 -->
  <rect x="185" y="32" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="51" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入 nums, k</text>

  <path d="M 260 60 L 260 72" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形判断 k==0 -->
  <polygon points="260,74 325,98 260,122 195,98" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="103" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">k == 0 ?</text>

  <!-- 右分支：返回 n -->
  <path d="M 325 98 L 353 98" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="336" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="356" y="82" width="144" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="428" y="102" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">返回 n（全员合格）</text>

  <!-- 否：往下 -->
  <path d="M 260 122 L 260 136" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="133" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 排序 -->
  <rect x="170" y="138" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="158" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">排序 nums.sort()</text>

  <path d="M 260 168 L 260 182" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 门槛 -->
  <rect x="160" y="182" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">门槛 v = nums[n − k]</text>

  <path d="M 260 212 L 260 226" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 计数 -->
  <rect x="135" y="226" width="250" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="246" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = lower_bound(nums, v)</text>

  <path d="M 260 256 L 260 270" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="175" y="270" width="170" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">返回 ans</text>

  <!-- 注释 -->
  <rect x="40" y="314" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="331" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">lower_bound = bisect_left：第一个 ≥ v 的下标，恰为值 &lt; v 的个数</text>
  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">追求 O(n)：C++ nth_element 免全排序（见第 5 节）</text>
</svg>
