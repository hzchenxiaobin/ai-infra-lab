<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">直方图拆成横向条带，每次"上台阶"开新条带</text>

  <text x="102" y="76" text-anchor="end" font-size="9" fill="#aaa">h5</text>
  <text x="102" y="108" text-anchor="end" font-size="9" fill="#aaa">h4</text>
  <text x="102" y="140" text-anchor="end" font-size="9" fill="#aaa">h3</text>
  <text x="102" y="172" text-anchor="end" font-size="9" fill="#aaa">h2</text>
  <text x="102" y="204" text-anchor="end" font-size="9" fill="#aaa">h1</text>

  <rect x="214" y="56" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>

  <rect x="214" y="88" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="266" y="88" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <rect x="110" y="120" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="214" y="120" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="266" y="120" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <rect x="110" y="152" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="214" y="152" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="266" y="152" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="318" y="152" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <rect x="110" y="184" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="162" y="184" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="214" y="184" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="266" y="184" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="318" y="184" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <path d="M 110 216 L 110 120 L 162 120 L 162 184 L 214 184 L 214 56 L 266 56 L 266 88 L 318 88 L 318 152 L 370 152 L 370 216" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>

  <path d="M 110 216 L 110 120" stroke="#d6a040" stroke-width="5" fill="none" filter="url(#rough2)" opacity="0.5"/>
  <path d="M 214 184 L 214 56" stroke="#d6a040" stroke-width="5" fill="none" filter="url(#rough2)" opacity="0.5"/>

  <text x="136" y="232" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">pos0</text>
  <text x="188" y="232" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">pos1</text>
  <text x="240" y="232" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">pos2</text>
  <text x="292" y="232" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">pos3</text>
  <text x="344" y="232" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">pos4</text>

  <text x="136" y="248" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="188" y="248" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="240" y="248" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <text x="292" y="248" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="344" y="248" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>

  <rect x="390" y="50" width="155" height="56" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <rect x="400" y="60" width="16" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="422" y="70" font-size="9" fill="#555">蓝 = pos0 起的条带</text>
  <rect x="400" y="80" width="16" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="422" y="90" font-size="9" fill="#555">绿 = pos2 起的条带</text>

  <rect x="40" y="270" width="155" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="117" y="287" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">pos0: 0→3 上台阶</text>
  <text x="117" y="302" text-anchor="middle" font-size="10" fill="#555">3 个蓝条带新开</text>

  <rect x="205" y="270" width="155" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="282" y="287" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">pos2: 1→5 上台阶</text>
  <text x="282" y="302" text-anchor="middle" font-size="10" fill="#555">4 个绿条带新开</text>

  <rect x="370" y="270" width="175" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="457" y="287" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans = 3 + 4 = 7</text>
  <text x="457" y="302" text-anchor="middle" font-size="9" fill="#888">target[0] + (5−1)</text>

  <text x="280" y="340" text-anchor="middle" font-size="10" fill="#888">粗边框 = 新条带在此处"开张"；细边框 = 从左侧延续过来</text>
  <text x="280" y="358" text-anchor="middle" font-size="10" fill="#888">下台阶/平台 → 条带从左延续，无需新开</text>
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">最少操作数 = 所有"上台阶"的净增高之和</text>
</svg>
