<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：两遍扫描（取元音 + 放回）</text>

  <!-- ===== pass 1: collect vowels ===== -->
  <text x="40" y="58" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">第一遍：扫描 s，收集元音</text>

  <!-- decision: is vowel? -->
  <polygon points="120,80 200,108 120,136 40,108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="112" text-anchor="middle" font-size="11" fill="#b8741a" filter="url(#rough2)">s[i] 是元音?</text>

  <!-- yes branch: add to list -->
  <rect x="150" y="156" width="120" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="210" y="180" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">加入元音列表 vowels</text>

  <!-- no branch: skip -->
  <rect x="20" y="156" width="100" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="180" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">跳过（辅音）</text>

  <text x="120" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是 ↓</text>
  <text x="70" y="148" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">否 ↓</text>

  <!-- arrows from diamond -->
  <path d="M 150 120 L 210 156" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 90 120 L 70 156" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- loop back arrow -->
  <path d="M 210 194 Q 210 214 150 214 Q 60 214 60 120" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="208" font-size="9" fill="#888" filter="url(#rough2)">i++ 直到末尾</text>

  <!-- collected list -->
  <text x="300" y="170" font-size="10" fill="#888" filter="url(#rough2)">→</text>
  <rect x="316" y="156" width="200" height="38" fill="#fafafa" stroke="#888" stroke-width="1.2" stroke-dasharray="5 3" rx="6" filter="url(#rough2)"/>
  <text x="416" y="180" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">vowels = [E, e, O, e]</text>

  <!-- sort box -->
  <path d="M 416 194 L 416 218" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="336" y="220" width="160" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="416" y="238" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">sort(vowels) 按 ASCII</text>
  <text x="416" y="252" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">→ [E, O, e, e]</text>

  <!-- ===== pass 2: merge back ===== -->
  <text x="40" y="288" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第二遍：扫描 s，重建 t</text>

  <polygon points="120,300 200,328 120,356 40,328" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="332" text-anchor="middle" font-size="11" fill="#b8741a" filter="url(#rough2)">s[i] 是元音?</text>

  <text x="70" y="368" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">否 ↓</text>
  <text x="120" y="368" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是 ↓</text>

  <path d="M 150 340 L 210 376" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 90 340 L 70 376" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="150" y="376" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="230" y="397" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">取 vowels[k++] 填入 t[i]</text>

  <rect x="20" y="376" width="100" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="397" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">t[i] = s[i]</text>

  <!-- link sorted list to pass 2 vowel box -->
  <path d="M 416 258 Q 416 330 310 393" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="360" y="330" font-size="9" fill="#b85450" filter="url(#rough2)">按序消费</text>

  <text x="280" y="416" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">两遍各扫一次 s，辅音位照抄、元音位按排序结果依序填回</text>
</svg>
