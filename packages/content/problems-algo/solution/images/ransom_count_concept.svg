<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">哈希计数：magazine 是字母池，ransom 逐字扣减，&lt;0 即失败</text>

  <!-- ===== magazine row ===== -->
  <text x="40" y="74" font-size="12" fill="#888">magazine:</text>
  <rect x="110" y="56" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="78" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="152" y="56" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="78" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="194" y="56" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="78" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>

  <!-- arrow: 统计频次 -->
  <path d="M 172 92 L 172 116" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="184" y="108" font-size="10" fill="#888">统计频次</text>

  <!-- ===== count table ===== -->
  <text x="40" y="146" font-size="12" fill="#888">cnt[26]:</text>
  <rect x="110" y="128" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a: 2</text>
  <rect x="174" y="128" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="204" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b: 1</text>
  <text x="244" y="150" font-size="12" fill="#aaa">… 其余 0</text>

  <!-- ===== ransom row ===== -->
  <text x="40" y="206" font-size="12" fill="#888">ransom:</text>
  <rect x="120" y="188" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="210" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="170" y="188" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="210" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>

  <!-- arrows: consume -->
  <path d="M 140 222 L 140 242" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="150" y="236" font-size="10" fill="#4a7a3a">−1</text>
  <path d="M 190 222 L 200 242" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="206" y="236" font-size="10" fill="#4a7a3a">−1</text>

  <!-- ===== result count ===== -->
  <text x="40" y="272" font-size="12" fill="#888">结果:</text>
  <rect x="110" y="254" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="276" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a: 0</text>
  <rect x="174" y="254" width="60" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="204" y="276" text-anchor="middle" font-size="12" fill="#999">b: 1</text>
  <text x="244" y="276" font-size="11" fill="#4a7a3a">盈余无害</text>

  <!-- result tag -->
  <rect x="330" y="254" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="390" y="276" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">无赤字 → true</text>

  <!-- contrast note -->
  <rect x="40" y="306" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="326" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">关键：只判「赤字」(cnt&lt;0)，不判「全零」</text>
  <text x="270" y="346" text-anchor="middle" font-size="11" fill="#555">vs 242 异位词需频次双向相等(全零)；本题 magazine ⊇ ransom 即可，盈余字母无害</text>
</svg>
