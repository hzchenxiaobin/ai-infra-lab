<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,2,3,2,2,1,3]，k = 3</text>
  <text x="320" y="44" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">共 7 − 3 + 1 = 5 个窗口</text>

  <!-- Header row -->
  <text x="30" y="72" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="70" y="72" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">窗口</text>
  <text x="300" y="72" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">频率哈希表 freq</text>
  <text x="530" y="72" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">|freq|</text>
  <text x="600" y="72" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans[i]</text>

  <!-- Row i=0 : [1,2,3] -->
  <g filter="url(#rough2)">
    <rect x="20" y="80" width="610" height="60" fill="#ffffff" stroke="#eee" stroke-width="1"/>
    <text x="30" y="116" font-size="11" fill="#333" font-weight="bold">0</text>
    <!-- window cells 1 2 3 -->
    <rect x="64" y="92" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="81" y="115" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="100" y="92" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="117" y="115" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="136" y="92" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="153" y="115" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="290" y="116" font-size="11" fill="#333">{1:1, 2:1, 3:1}</text>
    <rect x="520" y="100" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5"/>
    <text x="537" y="116" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
    <text x="600" y="116" font-size="11" fill="#b85450" font-weight="bold">3</text>
  </g>

  <!-- Row i=1 : [2,3,2] -->
  <g filter="url(#rough2)">
    <rect x="20" y="140" width="610" height="60" fill="#fafafa" stroke="#eee" stroke-width="1"/>
    <text x="30" y="176" font-size="11" fill="#333" font-weight="bold">1</text>
    <rect x="64" y="152" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="81" y="175" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="100" y="152" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="117" y="175" text-anchor="middle" font-size="12" fill="#333">3</text>
    <rect x="136" y="152" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="153" y="175" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="290" y="176" font-size="11" fill="#333">{2:2, 3:1}   <tspan fill="#999" font-size="9">（删 1，加 2）</tspan></text>
    <rect x="520" y="160" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5"/>
    <text x="537" y="176" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
    <text x="600" y="176" font-size="11" fill="#b85450" font-weight="bold">2</text>
  </g>

  <!-- Row i=2 : [3,2,2] -->
  <g filter="url(#rough2)">
    <rect x="20" y="200" width="610" height="60" fill="#ffffff" stroke="#eee" stroke-width="1"/>
    <text x="30" y="236" font-size="11" fill="#333" font-weight="bold">2</text>
    <rect x="64" y="212" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="81" y="235" text-anchor="middle" font-size="12" fill="#333">3</text>
    <rect x="100" y="212" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="117" y="235" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="136" y="212" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="153" y="235" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="290" y="236" font-size="11" fill="#333">{2:2, 3:1}   <tspan fill="#999" font-size="9">（删 2→1，加 2→2）</tspan></text>
    <rect x="520" y="220" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5"/>
    <text x="537" y="236" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
    <text x="600" y="236" font-size="11" fill="#b85450" font-weight="bold">2</text>
  </g>

  <!-- Row i=3 : [2,2,1] -->
  <g filter="url(#rough2)">
    <rect x="20" y="260" width="610" height="60" fill="#fafafa" stroke="#eee" stroke-width="1"/>
    <text x="30" y="296" font-size="11" fill="#333" font-weight="bold">3</text>
    <rect x="64" y="272" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="81" y="295" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="100" y="272" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="117" y="295" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="136" y="272" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="153" y="295" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="290" y="296" font-size="11" fill="#333">{1:1, 2:2}   <tspan fill="#999" font-size="9">（删 3，加 1）</tspan></text>
    <rect x="520" y="280" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5"/>
    <text x="537" y="296" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
    <text x="600" y="296" font-size="11" fill="#b85450" font-weight="bold">2</text>
  </g>

  <!-- Row i=4 : [2,1,3] -->
  <g filter="url(#rough2)">
    <rect x="20" y="320" width="610" height="60" fill="#ffffff" stroke="#eee" stroke-width="1"/>
    <text x="30" y="356" font-size="11" fill="#333" font-weight="bold">4</text>
    <rect x="64" y="332" width="34" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="81" y="355" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="100" y="332" width="34" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="117" y="355" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="136" y="332" width="34" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="153" y="355" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="290" y="356" font-size="11" fill="#333">{1:1, 2:1, 3:1}   <tspan fill="#999" font-size="9">（删 2→1，加 3）</tspan></text>
    <rect x="520" y="340" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="537" y="356" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="600" y="356" font-size="11" fill="#b85450" font-weight="bold">3</text>
  </g>

  <!-- Result -->
  <rect x="20" y="392" width="610" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="40" y="416" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">输出 ans：</text>
  <g filter="url(#rough2)">
    <rect x="130" y="402" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5"/>
    <text x="147" y="418" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
    <rect x="166" y="402" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5"/>
    <text x="183" y="418" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
    <rect x="202" y="402" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5"/>
    <text x="219" y="418" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
    <rect x="238" y="402" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5"/>
    <text x="255" y="418" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
    <rect x="274" y="402" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5"/>
    <text x="291" y="418" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  </g>
  <text x="330" y="418" font-size="10.5" fill="#888" filter="url(#rough2)">长度 = 7 − 3 + 1 = 5</text>

  <!-- Note -->
  <text x="320" y="456" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">每个窗口只比前一个换两个元素 → freq 表增量维护，O(1) 滚动更新</text>
</svg>
