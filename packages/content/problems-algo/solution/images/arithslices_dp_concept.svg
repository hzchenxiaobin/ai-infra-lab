<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">计数型 DP 核心观察：延长一格新增 dp[i−1]+1 个</text>

  <text x="30" y="62" font-size="12" fill="#888">nums:</text>
  <rect x="80" y="46" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="67" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="150" y="46" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="220" y="46" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="290" y="46" width="60" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <text x="180" y="92" text-anchor="middle" font-size="10" fill="#d6a040">i−2</text>
  <text x="250" y="92" text-anchor="middle" font-size="10" fill="#d6a040">i−1</text>
  <text x="320" y="92" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">i</text>

  <path d="M 250 100 L 320 100" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="112" width="410" height="42" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="285" y="129" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">公差检查：4−3 = 1,  3−2 = 1  →  相等 ✓</text>
  <text x="285" y="146" text-anchor="middle" font-size="11" fill="#82b366">公差不变 → nums[i] 可接在 i−1 后面</text>

  <text x="30" y="184" font-size="12" fill="#888">dp[i−1] =</text>
  <rect x="110" y="168" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="140" y="188" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="180" y="188" font-size="11" fill="#888">以 i−1 结尾的等差子数组：[1,2,3]</text>

  <path d="M 200 183 L 235 183" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="245" y="184" font-size="12" fill="#888">dp[i] =</text>
  <rect x="300" y="168" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="188" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1 + 1 = 2</text>

  <rect x="40" y="218" width="445" height="118" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="60" y="240" font-size="12" fill="#333" font-weight="bold">以 i=3 结尾的 2 个等差子数组：</text>

  <rect x="60" y="250" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="120" y="272" text-anchor="middle" font-size="12" fill="#333">[2, 3, 4]</text>
  <text x="195" y="272" font-size="11" fill="#888">← 全新的长度 3（+1 的来源）</text>

  <rect x="60" y="292" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="150" y="314" text-anchor="middle" font-size="12" fill="#333">[1, 2, 3, 4]</text>
  <text x="255" y="314" font-size="11" fill="#888">← 把 dp[i−1] 的 [1,2,3] 延长</text>

  <rect x="40" y="350" width="445" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="262" y="365" text-anchor="middle" font-size="11" fill="#444">dp[i] = dp[i−1] + 1　|　答案 = Σdp[i]（计数型，不是取 max）</text>
</svg>
