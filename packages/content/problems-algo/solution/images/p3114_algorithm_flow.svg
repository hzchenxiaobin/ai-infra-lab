<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：四个判定依次过，时十位定时个位</text>

  <!-- start -->
  <rect x="170" y="36" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="260" y="55" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">读入 s（长度 5，s[2] = ':'）</text>

  <path d="M 260 64 L 260 78" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="260,82 340,112 260,142 180,112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="108" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">s[0] = '?' ?</text>
  <text x="260" y="126" text-anchor="middle" font-size="9" fill="#b08040" filter="url(#rough2)">时十位待填？</text>

  <path d="M 340 112 L 366 112" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="347" y="104" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="370" y="78" width="136" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="438" y="97" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">s[1]='?' 或 ≤'1'：</text>
  <text x="438" y="112" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">s[0] ← '1'（冲 1 档）</text>
  <text x="438" y="127" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">否则（个位 ≥2）：</text>
  <text x="438" y="140" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">s[0] ← '0'（退 0 档）</text>

  <path d="M 260 142 L 260 156" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="152" font-size="10.5" fill="#888" filter="url(#rough2)">否，跳过</text>

  <!-- diamond 2 -->
  <polygon points="260,160 340,190 260,220 180,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="186" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">s[1] = '?' ?</text>
  <text x="260" y="204" text-anchor="middle" font-size="9" fill="#b08040" filter="url(#rough2)">时个位待填？</text>

  <path d="M 340 190 L 366 190" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="347" y="182" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="370" y="156" width="136" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="438" y="175" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">看已定的 s[0]：</text>
  <text x="438" y="192" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">'0' → s[1] ← '9'</text>
  <text x="438" y="209" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">'1' → s[1] ← '1'</text>
  <text x="438" y="220" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">（依赖上一步结果）</text>

  <path d="M 260 220 L 260 234" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="230" font-size="10.5" fill="#888" filter="url(#rough2)">否，跳过</text>

  <!-- diamond 3 -->
  <polygon points="260,238 340,268 260,298 180,268" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">s[3] = '?' ?</text>
  <text x="260" y="282" text-anchor="middle" font-size="9" fill="#b08040" filter="url(#rough2)">分十位待填？</text>

  <path d="M 340 268 L 366 268" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="347" y="260" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="370" y="246" width="136" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="438" y="264" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">s[3] ← '5'</text>
  <text x="438" y="280" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">（十位上界 5，与个位无关）</text>

  <path d="M 260 298 L 260 312" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="308" font-size="10.5" fill="#888" filter="url(#rough2)">否，跳过</text>

  <!-- diamond 4 -->
  <polygon points="260,316 340,346 260,376 180,346" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">s[4] = '?' ?</text>
  <text x="260" y="360" text-anchor="middle" font-size="9" fill="#b08040" filter="url(#rough2)">分个位待填？</text>

  <path d="M 340 346 L 366 346" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="347" y="338" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="370" y="324" width="136" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="438" y="342" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">s[4] ← '9'</text>
  <text x="438" y="358" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">（个位 0~9 自由）</text>

  <path d="M 260 376 L 260 390" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="386" font-size="10.5" fill="#888" filter="url(#rough2)">否，跳过</text>

  <!-- end -->
  <rect x="160" y="394" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="415" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 s（最晚时刻）</text>

  <!-- bottom note -->
  <rect x="40" y="432" width="472" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="276" y="451" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">4 次定长判断，O(1) 时间 / O(1) 空间；顺序必须「先十位后个位」</text>
</svg>
