<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：3 名用户 → 逐赛事算注册率 → 排序输出</text>

  <!-- 总用户数 -->
  <rect x="220" y="46" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="74" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">总用户数 = 3（Alice, Bob, Alex）</text>

  <!-- 表头 -->
  <rect x="30" y="110" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="85" y="128" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">contest_id</text>
  <rect x="140" y="110" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="215" y="128" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">注册的 user_id</text>
  <rect x="290" y="110" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="325" y="128" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">COUNT</text>
  <rect x="360" y="110" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="420" y="128" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">COUNT×100/3</text>
  <rect x="480" y="110" width="130" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="545" y="128" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">percentage(ROUND)</text>

  <!-- 行 1: 208 -->
  <rect x="30" y="136" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="154" text-anchor="middle" font-size="10.5" fill="#333">208</text>
  <rect x="140" y="136" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="215" y="154" text-anchor="middle" font-size="10" fill="#333">2, 6, 7</text>
  <rect x="290" y="136" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="325" y="154" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <rect x="360" y="136" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="154" text-anchor="middle" font-size="10" fill="#333">300/3 = 100.0</text>
  <rect x="480" y="136" width="130" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="545" y="154" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">100.0</text>

  <!-- 行 2: 209 -->
  <rect x="30" y="162" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="180" text-anchor="middle" font-size="10.5" fill="#333">209</text>
  <rect x="140" y="162" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="215" y="180" text-anchor="middle" font-size="10" fill="#333">2, 7, 6</text>
  <rect x="290" y="162" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="325" y="180" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <rect x="360" y="162" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="180" text-anchor="middle" font-size="10" fill="#333">300/3 = 100.0</text>
  <rect x="480" y="162" width="130" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="545" y="180" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">100.0</text>

  <!-- 行 3: 210 -->
  <rect x="30" y="188" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="206" text-anchor="middle" font-size="10.5" fill="#333">210</text>
  <rect x="140" y="188" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="215" y="206" text-anchor="middle" font-size="10" fill="#333">6, 2, 7</text>
  <rect x="290" y="188" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="325" y="206" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <rect x="360" y="188" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="206" text-anchor="middle" font-size="10" fill="#333">300/3 = 100.0</text>
  <rect x="480" y="188" width="130" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="545" y="206" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">100.0</text>

  <!-- 行 4: 215 -->
  <rect x="30" y="214" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="232" text-anchor="middle" font-size="10.5" fill="#333">215</text>
  <rect x="140" y="214" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="215" y="232" text-anchor="middle" font-size="10" fill="#333">6, 7</text>
  <rect x="290" y="214" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="325" y="232" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="360" y="214" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="232" text-anchor="middle" font-size="10" fill="#333">200/3 = 66.66…</text>
  <rect x="480" y="214" width="130" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="545" y="232" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">66.67</text>

  <!-- 行 5: 207 -->
  <rect x="30" y="240" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="258" text-anchor="middle" font-size="10.5" fill="#333">207</text>
  <rect x="140" y="240" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="215" y="258" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="290" y="240" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="325" y="258" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="360" y="240" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="258" text-anchor="middle" font-size="10" fill="#333">100/3 = 33.33…</text>
  <rect x="480" y="240" width="130" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="545" y="258" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">33.33</text>

  <!-- 排序箭头 -->
  <path d="M545 268 L545 296" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="585" y="286" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">ORDER BY</text>
  <text x="585" y="300" text-anchor="middle" font-size="9" fill="#b85450">DESC, ASC</text>

  <!-- 排序后结果 -->
  <rect x="140" y="304" width="360" height="130" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="326" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">排序后输出（percentage DESC → contest_id ASC）</text>
  <rect x="160" y="336" width="140" height="24" fill="#fafafa" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="170" y="352" font-size="9.5" fill="#888">contest_id</text>
  <text x="270" y="352" text-anchor="end" font-size="9.5" fill="#888">percentage</text>
  <rect x="310" y="336" width="80" height="24" fill="#fafafa" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="330" y="352" font-size="9.5" fill="#888">contest_id</text>
  <text x="375" y="352" text-anchor="end" font-size="9.5" fill="#888">percentage</text>

  <text x="170" y="376" font-size="10" fill="#333">208</text>
  <text x="270" y="376" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">100.0</text>
  <text x="330" y="376" font-size="10" fill="#333">215</text>
  <text x="375" y="376" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">66.67</text>

  <text x="170" y="394" font-size="10" fill="#333">209</text>
  <text x="270" y="394" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">100.0</text>
  <text x="330" y="394" font-size="10" fill="#333">207</text>
  <text x="375" y="394" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">33.33</text>

  <text x="170" y="412" font-size="10" fill="#333">210</text>
  <text x="270" y="412" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">100.0</text>

  <text x="320" y="436" text-anchor="middle" font-size="9.5" fill="#888">三场 100% 并列 → 按 contest_id 升序 208 &lt; 209 &lt; 210</text>
</svg>
