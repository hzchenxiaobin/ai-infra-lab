<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrLoop" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">隔离病毒：每日三步循环 + 两个关键量</text>

  <!-- ===== Top: Daily cycle ===== -->
  <text x="30" y="58" font-size="11.5" fill="#888" font-weight="bold">每天重复：</text>

  <!-- Step 1 -->
  <rect x="30" y="68" width="150" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="105" y="88" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 找区域</text>
  <text x="105" y="106" text-anchor="middle" font-size="10.5" fill="#555">BFS 连通感染块</text>
  <text x="105" y="122" text-anchor="middle" font-size="10.5" fill="#555">每块算威胁集 + 墙数</text>

  <!-- arrow 1→2 -->
  <path d="M 180 102 L 200 102" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="205" y="68" width="150" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="88" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 隔离最大威胁</text>
  <text x="280" y="106" text-anchor="middle" font-size="10.5" fill="#555">ans += 该块墙数</text>
  <text x="280" y="122" text-anchor="middle" font-size="10.5" fill="#555">标记为 −1（隔离）</text>

  <!-- arrow 2→3 -->
  <path d="M 355 102 L 375 102" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="380" y="68" width="150" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="455" y="88" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 其余扩散</text>
  <text x="455" y="106" text-anchor="middle" font-size="10.5" fill="#555">威胁格 → 1（感染）</text>
  <text x="455" y="122" text-anchor="middle" font-size="10.5" fill="#555">重复直到无威胁</text>

  <!-- loop arrow from step3 back to step1 -->
  <path d="M 455 136 L 455 158 L 105 158 L 105 136" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrLoop)" filter="url(#rough2)"/>
  <text x="280" y="172" text-anchor="middle" font-size="10" fill="#888">下一轮（隔离块不再扩散）</text>

  <!-- divider -->
  <line x1="20" y1="190" x2="560" y2="190" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Bottom: threat set vs wall count ===== -->
  <text x="30" y="212" font-size="11.5" fill="#888" font-weight="bold">关键区分：威胁集（不同格子数）vs 墙数（每条共享边界）</text>

  <!-- Left mini-grid: single infected cell, 3 threats -->
  <text x="120" y="232" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">情形 A：1 个感染格</text>
  <!-- 3x3 grid, cell=34, origin x=54, y=240 -->
  <!-- row 0 -->
  <rect x="54" y="240" width="34" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="88" y="240" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <rect x="122" y="240" width="34" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <!-- row 1 -->
  <rect x="54" y="274" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <rect x="88" y="274" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="105" y="296" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="122" y="274" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <!-- row 2 -->
  <rect x="54" y="308" width="34" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="88" y="308" width="34" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="122" y="308" width="34" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>

  <!-- firewall lines (red thick) on shared borders -->
  <line x1="88" y1="274" x2="88" y2="308" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <line x1="122" y1="274" x2="122" y2="308" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <line x1="88" y1="274" x2="122" y2="274" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>

  <!-- labels for A -->
  <text x="120" y="360" text-anchor="middle" font-size="11" fill="#4a7a3a">威胁集 = 3 个不同格子</text>
  <text x="120" y="376" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">墙数 = 3（3 条边界）</text>

  <!-- Right mini-grid: two infected cells sharing one threat -->
  <text x="430" y="232" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">情形 B：2 个感染格共享 1 个威胁</text>
  <!-- 3x3 grid, cell=34, origin x=364, y=240 -->
  <!-- row 0 -->
  <rect x="364" y="240" width="34" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="398" y="240" width="34" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="432" y="240" width="34" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <!-- row 1: infected, infected, threat -->
  <rect x="364" y="274" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="381" y="296" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="398" y="274" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="415" y="296" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="432" y="274" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <!-- row 2 -->
  <rect x="364" y="308" width="34" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="398" y="308" width="34" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="432" y="308" width="34" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>

  <!-- firewall lines: two borders to the same threat cell -->
  <line x1="432" y1="274" x2="432" y2="308" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <line x1="432" y1="274" x2="466" y2="274" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>

  <!-- labels for B -->
  <text x="430" y="360" text-anchor="middle" font-size="11" fill="#4a7a3a">威胁集 = 1（同一个格子）</text>
  <text x="430" y="376" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">墙数 = 2（2 条边界）</text>

  <!-- legend -->
  <rect x="40" y="398" width="16" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <text x="62" y="408" font-size="10" fill="#555">感染</text>
  <rect x="100" y="398" width="16" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="122" y="408" font-size="10" fill="#555">威胁格(未感染)</text>
  <line x1="210" y1="404" x2="232" y2="404" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <text x="238" y="408" font-size="10" fill="#555">防火墙</text>

  <!-- key insight note -->
  <rect x="300" y="394" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="430" y="408" text-anchor="middle" font-size="10.5" fill="#444">选块看威胁集大小，建墙看边界条数</text>
  <text x="430" y="422" text-anchor="middle" font-size="10" fill="#888">两个量独立计算，切勿混淆</text>
</svg>
