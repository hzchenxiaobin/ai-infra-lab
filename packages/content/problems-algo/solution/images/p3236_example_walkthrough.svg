<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：递归 CTE 一轮产出一整层（BFS 波前一圈圈外推）</text>

  <text x="66" y="66" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">第 0 轮 · 锚点</text>
  <rect x="130" y="50" width="86" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="173" y="67" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">Alice · lv0</text>
  <text x="228" y="67" text-anchor="start" font-size="9" fill="#888" filter="url(#rough2)">← 留在 T 里，但最后被 WHERE 剔除</text>

  <path d="M 173 77 L 173 88" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <text x="66" y="106" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第 1 轮</text>
  <rect x="130" y="90" width="86" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="173" y="107" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Bob · lv1</text>
  <rect x="224" y="90" width="92" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="270" y="107" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Charlie · lv1</text>

  <path d="M 173 117 L 173 128" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <text x="66" y="146" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">第 2 轮</text>
  <rect x="130" y="130" width="86" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="173" y="147" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">David · lv2</text>
  <rect x="224" y="130" width="78" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="263" y="147" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">Eve · lv2</text>
  <rect x="310" y="130" width="84" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="352" y="147" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">Frank · lv2</text>
  <rect x="402" y="130" width="90" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="447" y="147" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">Grace · lv2</text>

  <path d="M 173 157 L 173 168" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <text x="66" y="186" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">第 3 轮</text>
  <rect x="130" y="170" width="86" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="173" y="187" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">Helen · lv3</text>

  <path d="M 173 197 L 173 208" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <text x="66" y="226" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">第 4 轮</text>
  <text x="135" y="226" text-anchor="start" font-size="10" fill="#888" filter="url(#rough2)">∅ 无新行 → 递归终止（T 共 1+2+4+1 = 8 行）</text>

  <path d="M 40 246 L 480 246" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="8 6" filter="url(#rough2)"/>

  <text x="260" y="266" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">最终输出（hierarchy_level 升序 → subordinate_id 升序），diff = salary − 150000</text>

  <rect x="90" y="276" width="70" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="276" width="100" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="260" y="276" width="50" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="310" y="276" width="120" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="290" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">sub_id</text>
  <text x="210" y="290" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">sub_name</text>
  <text x="285" y="290" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">lv</text>
  <text x="370" y="290" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">salary_difference</text>

  <g filter="url(#rough2)">
    <rect x="90" y="296" width="70" height="16" fill="none" stroke="#446688" stroke-width="1"/>
    <rect x="160" y="296" width="100" height="16" fill="none" stroke="#446688" stroke-width="1"/>
    <rect x="260" y="296" width="50" height="16" fill="none" stroke="#446688" stroke-width="1"/>
    <rect x="310" y="296" width="120" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <text x="125" y="308" text-anchor="middle" font-size="9.5" fill="#333">2</text>
    <text x="210" y="308" text-anchor="middle" font-size="9.5" fill="#333">Bob</text>
    <text x="285" y="308" text-anchor="middle" font-size="9.5" fill="#333">1</text>
    <text x="370" y="308" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">120k−150k = −30000</text>

    <rect x="90" y="312" width="70" height="16" fill="none" stroke="#446688" stroke-width="1"/>
    <rect x="160" y="312" width="100" height="16" fill="none" stroke="#446688" stroke-width="1"/>
    <rect x="260" y="312" width="50" height="16" fill="none" stroke="#446688" stroke-width="1"/>
    <rect x="310" y="312" width="120" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <text x="125" y="324" text-anchor="middle" font-size="9.5" fill="#333">3</text>
    <text x="210" y="324" text-anchor="middle" font-size="9.5" fill="#333">Charlie</text>
    <text x="285" y="324" text-anchor="middle" font-size="9.5" fill="#333">1</text>
    <text x="370" y="324" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">110k−150k = −40000</text>

    <rect x="90" y="328" width="70" height="16" fill="none" stroke="#446688" stroke-width="1"/>
    <rect x="160" y="328" width="100" height="16" fill="none" stroke="#446688" stroke-width="1"/>
    <rect x="260" y="328" width="50" height="16" fill="none" stroke="#446688" stroke-width="1"/>
    <rect x="310" y="328" width="120" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <text x="125" y="340" text-anchor="middle" font-size="9.5" fill="#333">4</text>
    <text x="210" y="340" text-anchor="middle" font-size="9.5" fill="#333">David</text>
    <text x="285" y="340" text-anchor="middle" font-size="9.5" fill="#333">2</text>
    <text x="370" y="340" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">105k−150k = −45000</text>

    <rect x="90" y="344" width="70" height="16" fill="none" stroke="#446688" stroke-width="1"/>
    <rect x="160" y="344" width="100" height="16" fill="none" stroke="#446688" stroke-width="1"/>
    <rect x="260" y="344" width="50" height="16" fill="none" stroke="#446688" stroke-width="1"/>
    <rect x="310" y="344" width="120" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <text x="125" y="356" text-anchor="middle" font-size="9.5" fill="#333">5</text>
    <text x="210" y="356" text-anchor="middle" font-size="9.5" fill="#333">Eve</text>
    <text x="285" y="356" text-anchor="middle" font-size="9.5" fill="#333">2</text>
    <text x="370" y="356" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">100k−150k = −50000</text>

    <rect x="90" y="360" width="70" height="16" fill="none" stroke="#446688" stroke-width="1"/>
    <rect x="160" y="360" width="100" height="16" fill="none" stroke="#446688" stroke-width="1"/>
    <rect x="260" y="360" width="50" height="16" fill="none" stroke="#446688" stroke-width="1"/>
    <rect x="310" y="360" width="120" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <text x="125" y="372" text-anchor="middle" font-size="9.5" fill="#333">6</text>
    <text x="210" y="372" text-anchor="middle" font-size="9.5" fill="#333">Frank</text>
    <text x="285" y="372" text-anchor="middle" font-size="9.5" fill="#333">2</text>
    <text x="370" y="372" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">95k−150k = −55000</text>

    <rect x="90" y="376" width="70" height="16" fill="none" stroke="#446688" stroke-width="1"/>
    <rect x="160" y="376" width="100" height="16" fill="none" stroke="#446688" stroke-width="1"/>
    <rect x="260" y="376" width="50" height="16" fill="none" stroke="#446688" stroke-width="1"/>
    <rect x="310" y="376" width="120" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <text x="125" y="388" text-anchor="middle" font-size="9.5" fill="#333">7</text>
    <text x="210" y="388" text-anchor="middle" font-size="9.5" fill="#333">Grace</text>
    <text x="285" y="388" text-anchor="middle" font-size="9.5" fill="#333">2</text>
    <text x="370" y="388" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">98k−150k = −52000</text>

    <rect x="90" y="392" width="70" height="16" fill="none" stroke="#446688" stroke-width="1"/>
    <rect x="160" y="392" width="100" height="16" fill="none" stroke="#446688" stroke-width="1"/>
    <rect x="260" y="392" width="50" height="16" fill="none" stroke="#446688" stroke-width="1"/>
    <rect x="310" y="392" width="120" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1"/>
    <text x="125" y="404" text-anchor="middle" font-size="9.5" fill="#333">8</text>
    <text x="210" y="404" text-anchor="middle" font-size="9.5" fill="#333">Helen</text>
    <text x="285" y="404" text-anchor="middle" font-size="9.5" fill="#333">3</text>
    <text x="370" y="404" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">90k−150k = −60000</text>
  </g>

  <text x="260" y="422" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">「k」为千：120k = 120000。输出行数 = 8 − 1（CEO 行被剔除）= 7</text>
</svg>
