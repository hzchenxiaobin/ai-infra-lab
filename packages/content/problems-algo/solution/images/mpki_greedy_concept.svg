<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：每次 +1 给当前最小值，边际乘积增益最大</text>

  <rect x="120" y="46" width="360" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="72" text-anchor="middle" font-size="12" fill="#333">P = a₁ × a₂ × … × aₙ ，给 aᵢ +1 → P′ = P · (aᵢ+1)/aᵢ</text>

  <text x="300" y="108" text-anchor="middle" font-size="12" fill="#555">增益系数 = (aᵢ+1)/aᵢ = 1 + 1/aᵢ ， aᵢ 越小 → 增益越大</text>

  <rect x="28" y="128" width="266" height="232" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="161" y="150" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓ 给最小值 +1</text>

  <rect x="60" y="168" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="88" y="194" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>

  <path d="M 120 188 L 180 188" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>

  <rect x="186" y="168" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="214" y="194" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>

  <rect x="60" y="228" width="200" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="248" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">增益 = 3 / 2 = 1.5</text>
  <text x="160" y="265" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">×1.5  大 ⭐</text>

  <path d="M 160 288 L 160 330" stroke="#4a7a3a" stroke-width="3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="161" y="350" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">乘积涨得多</text>

  <rect x="306" y="128" width="266" height="232" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="439" y="150" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗ 给最大值 +1</text>

  <rect x="338" y="168" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="366" y="194" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">6</text>

  <path d="M 398 188 L 458 188" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="428" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+1</text>

  <rect x="464" y="168" width="56" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="492" y="194" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">7</text>

  <rect x="338" y="228" width="200" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="438" y="248" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">增益 = 7 / 6 ≈ 1.17</text>
  <text x="438" y="265" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">×1.17  小</text>

  <path d="M 438 290 L 438 318" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="439" y="338" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">乘积涨得少</text>

  <rect x="80" y="376" width="440" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="397" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">贪心策略：每步选当前最小值 +1 → 最小堆维护，k 轮后求积取模</text>
</svg>
