<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">键盘 6 列网格：字母坐标 = (行, 列)</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">id = c−'A'；行 = id÷6；列 = id%6；距离 = |Δ行| + |Δ列|（曼哈顿）</text>

  <!-- column headers c=0..5 -->
  <g font-size="9" fill="#888">
    <text x="175" y="84" text-anchor="middle">列0</text>
    <text x="217" y="84" text-anchor="middle">列1</text>
    <text x="259" y="84" text-anchor="middle">列2</text>
    <text x="301" y="84" text-anchor="middle">列3</text>
    <text x="343" y="84" text-anchor="middle">列4</text>
    <text x="385" y="84" text-anchor="middle">列5</text>
  </g>
  <!-- row headers r=0..4 -->
  <g font-size="9" fill="#888">
    <text x="150" y="121" text-anchor="end">行0</text>
    <text x="150" y="159" text-anchor="end">行1</text>
    <text x="150" y="197" text-anchor="end">行2</text>
    <text x="150" y="235" text-anchor="end">行3</text>
    <text x="150" y="273" text-anchor="end">行4</text>
  </g>

  <!-- ===== keyboard grid: key size 38x34, pitch 42, start (156,104) ===== -->
  <g font-size="13">
    <!-- Row 0: A B C D E F -->
    <rect x="156" y="104" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="175" y="126" text-anchor="middle" fill="#333" font-weight="bold">A</text>
    <rect x="198" y="104" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="217" y="126" text-anchor="middle" fill="#333">B</text>
    <rect x="240" y="104" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="259" y="126" text-anchor="middle" fill="#446688" font-weight="bold">C</text>
    <rect x="282" y="104" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="301" y="126" text-anchor="middle" fill="#333">D</text>
    <rect x="324" y="104" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="343" y="126" text-anchor="middle" fill="#333">E</text>
    <rect x="366" y="104" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="385" y="126" text-anchor="middle" fill="#333">F</text>
    <!-- Row 1: G H I J K L -->
    <rect x="156" y="142" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="175" y="164" text-anchor="middle" fill="#333">G</text>
    <rect x="198" y="142" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="217" y="164" text-anchor="middle" fill="#333">H</text>
    <rect x="240" y="142" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="259" y="164" text-anchor="middle" fill="#333">I</text>
    <rect x="282" y="142" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="301" y="164" text-anchor="middle" fill="#333">J</text>
    <rect x="324" y="142" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="343" y="164" text-anchor="middle" fill="#4a7a3a" font-weight="bold">K</text>
    <rect x="366" y="142" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="385" y="164" text-anchor="middle" fill="#333">L</text>
    <!-- Row 2: M N O P Q R -->
    <rect x="156" y="180" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="175" y="202" text-anchor="middle" fill="#333">M</text>
    <rect x="198" y="180" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="217" y="202" text-anchor="middle" fill="#333">N</text>
    <rect x="240" y="180" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="259" y="202" text-anchor="middle" fill="#333">O</text>
    <rect x="282" y="180" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="301" y="202" text-anchor="middle" fill="#333" font-weight="bold">P</text>
    <rect x="324" y="180" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="343" y="202" text-anchor="middle" fill="#333">Q</text>
    <rect x="366" y="180" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="385" y="202" text-anchor="middle" fill="#333">R</text>
    <!-- Row 3: S T U V W X -->
    <rect x="156" y="218" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="175" y="240" text-anchor="middle" fill="#333">S</text>
    <rect x="198" y="218" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="217" y="240" text-anchor="middle" fill="#333">T</text>
    <rect x="240" y="218" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="259" y="240" text-anchor="middle" fill="#333">U</text>
    <rect x="282" y="218" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="301" y="240" text-anchor="middle" fill="#333">V</text>
    <rect x="324" y="218" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="343" y="240" text-anchor="middle" fill="#333">W</text>
    <rect x="366" y="218" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="385" y="240" text-anchor="middle" fill="#333">X</text>
    <!-- Row 4: Y Z -->
    <rect x="156" y="256" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="175" y="278" text-anchor="middle" fill="#333" font-weight="bold">Y</text>
    <rect x="198" y="256" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="217" y="278" text-anchor="middle" fill="#333" font-weight="bold">Z</text>
  </g>

  <!-- coordinate annotations on A, P, Z -->
  <g font-size="8" fill="#d6a040">
    <text x="175" y="148" text-anchor="middle">(0,0)</text>
    <text x="301" y="224" text-anchor="middle">(2,3)</text>
    <text x="217" y="302" text-anchor="middle">(4,1)</text>
  </g>

  <!-- finger markers: 打字指 on C, 闲置指 on K -->
  <circle cx="259" cy="117" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="259" y="94" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">打字指 word[i−1]</text>
  <circle cx="343" cy="155" r="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="392" y="159" font-size="9" fill="#4a7a3a" font-weight="bold">闲置指 位置 j</text>

  <!-- free-state badge -->
  <rect x="40" y="256" width="100" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="90" y="272" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">空闲态 j = 26</text>
  <text x="90" y="284" text-anchor="middle" font-size="9" fill="#666">手指未落过键</text>
  <path d="M 140 273 L 156 200" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 2" fill="none" filter="url(#rough2)"/>
  <text x="120" y="220" font-size="8" fill="#b85450">落键代价 0</text>

  <!-- bottom state definition box -->
  <rect x="30" y="330" width="480" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="270" y="352" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">状态定义：dp[i][j]</text>
  <text x="270" y="372" text-anchor="middle" font-size="11" fill="#333">打完前 i 个字符的最小代价；此时一指停在 word[i−1]，另一指停在位置 j</text>
  <text x="270" y="390" text-anchor="middle" font-size="11" fill="#333">j ∈ {0..25（某字母坐标），26（空闲，落键免费）}</text>
  <text x="270" y="408" text-anchor="middle" font-size="10" fill="#888">每步恰好一指落键 word[i]，另一指原地不动 → 只需记录“另一指”在哪</text>
</svg>
