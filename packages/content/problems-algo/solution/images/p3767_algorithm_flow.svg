<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：差值降序 + 前 k 个强制换 + 正差值续吃</text>

  <rect x="160" y="42" width="200" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">① 计算 d[i] = t1[i] − t2[i]</text>

  <path d="M 260 78 L 260 92" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="160" y="94" width="200" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="117" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">② base = Σt2，d 降序排序</text>

  <path d="M 260 130 L 260 144" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="160" y="146" width="200" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="166" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">③ 取下一个 d[i]（i = 0…n−1）</text>

  <path d="M 260 178 L 260 200" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <polygon points="260,202 338,232 260,262 182,232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="236" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i &lt; k ?</text>

  <path d="M 182 232 L 138 232" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="224" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="24" y="212" width="112" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="228" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans += d[i]</text>
  <text x="80" y="244" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">（强制换）</text>

  <path d="M 80 212 L 80 170 L 158 170" fill="none" stroke="#4a7a3a" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="163" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">继续</text>

  <path d="M 260 262 L 260 286" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="270" y="278" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <polygon points="260,288 338,316 260,344 182,316" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">d[i] &gt; 0 ?</text>

  <path d="M 182 316 L 138 316" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="308" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="24" y="296" width="112" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="312" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans += d[i]</text>
  <text x="80" y="328" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">（赚，继续换）</text>

  <path d="M 24 316 L 12 316 L 12 158 L 158 158" fill="none" stroke="#4a7a3a" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="152" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">继续</text>

  <path d="M 260 344 L 260 358" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="270" y="356" font-size="10.5" fill="#b85450" filter="url(#rough2)">否（亏）</text>

  <rect x="180" y="360" width="160" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="381" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">break → 返回 ans</text>

  <rect x="356" y="216" width="152" height="108" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="432" y="238" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">停下位置</text>
  <text x="432" y="258" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">m* = max(k, 正差值个数)</text>
  <text x="432" y="278" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">k = 0：只吃正差值</text>
  <text x="432" y="298" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">k = n：ans = Σt1</text>
  <text x="432" y="316" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">遍历完 i = n 也自然结束</text>
</svg>
