<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心直觉：右端点越早结束，后面能接的数对越多</text>

  <!-- number line origin x=70, unit=40, values 0..10 -->
  <!-- A [1,8] the long one (red) -->
  <rect x="110" y="64" width="280" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="81" text-anchor="end" font-size="11.5" fill="#b85450" font-weight="bold">A [1,8]</text>
  <text x="396" y="81" font-size="11" fill="#b85450" font-weight="bold">右=8</text>

  <!-- B [2,3] -->
  <rect x="150" y="98" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="60" y="115" text-anchor="end" font-size="11.5" fill="#446688" font-weight="bold">B [2,3]</text>
  <text x="196" y="115" font-size="11" fill="#446688">右=3</text>

  <!-- C [4,5] -->
  <rect x="230" y="132" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="60" y="149" text-anchor="end" font-size="11.5" fill="#446688" font-weight="bold">C [4,5]</text>
  <text x="276" y="149" font-size="11" fill="#446688">右=5</text>

  <!-- D [6,7] -->
  <rect x="310" y="166" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="60" y="183" text-anchor="end" font-size="11.5" fill="#446688" font-weight="bold">D [6,7]</text>
  <text x="356" y="183" font-size="11" fill="#446688">右=7</text>

  <!-- number line -->
  <line x1="70" y1="208" x2="478" y2="208" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 478 208 L 470 204 L 470 212 Z" fill="#888" filter="url(#rough2)"/>
  <text x="486" y="212" font-size="10.5" fill="#888">x</text>
  <g font-size="10.5" fill="#888" text-anchor="middle">
    <line x1="70" y1="204" x2="70" y2="214" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="70" y="228">0</text>
    <line x1="150" y1="204" x2="150" y2="214" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="150" y="228">2</text>
    <line x1="230" y1="204" x2="230" y2="214" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="230" y="228">4</text>
    <line x1="310" y1="204" x2="310" y2="214" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="310" y="228">6</text>
    <line x1="390" y1="204" x2="390" y2="214" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="390" y="228">8</text>
    <line x1="470" y1="204" x2="470" y2="214" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="470" y="228">10</text>
  </g>
  <text x="260" y="246" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">数对端点（链要求 b &lt; c，严格不相等）</text>

  <!-- conclusion: correct (by end) -->
  <rect x="32" y="258" width="456" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="48" y="278" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 按右端点排：B(3) → C(5) → D(7)，3&lt;4, 5&lt;6 严格递进</text>
  <text x="48" y="295" font-size="11" fill="#4a7a3a">链长 3；A 右=8 最晚，左=1 不满足 8&lt;1，跳过</text>

  <!-- conclusion: wrong (pick long first) -->
  <rect x="32" y="308" width="456" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="48" y="328" font-size="12" fill="#b85450" font-weight="bold">✗ 若先选 A[1,8]：右=8，需后续 left &gt; 8</text>
  <text x="48" y="345" font-size="11" fill="#b85450">B/C/D 全被挡住 → 链长仅 1，这就是按右端点贪心的理由</text>
</svg>
