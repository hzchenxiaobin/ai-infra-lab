<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：low = 1200，high = 1230（区间内全是 12cd 形态）</text>

  <!-- Structure row -->
  <rect x="110" y="44" width="32" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="126" y="66" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="146" y="44" width="32" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="162" y="66" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <line x1="180" y1="40" x2="180" y2="84" stroke="#999" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="182" y="44" width="32" height="34" fill="#fafafa" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="5 4" rx="4" filter="url(#rough2)"/>
  <text x="198" y="66" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="218" y="44" width="32" height="34" fill="#fafafa" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="5 4" rx="4" filter="url(#rough2)"/>
  <text x="234" y="66" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="128" y="98" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">前半和 1+2 = 3（固定）</text>
  <text x="216" y="98" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">后半待定</text>
  <text x="300" y="66" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">条件：c + d = 3</text>

  <!-- Hit rows: (0,3) (1,2) (2,1) (3,0) -->
  <!-- row 1: 1203 -->
  <text x="44" y="137" font-size="12" fill="#555" filter="url(#rough2)">(0,3)</text>
  <rect x="110" y="116" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="135" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="146" y="116" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="135" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="182" y="116" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="135" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="218" y="116" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="135" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="290" y="137" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1203</text>
  <text x="360" y="137" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3 == 3 ✓</text>

  <!-- row 2: 1212 -->
  <text x="44" y="173" font-size="12" fill="#555" filter="url(#rough2)">(1,2)</text>
  <rect x="110" y="152" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="171" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="146" y="152" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="171" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="182" y="152" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="171" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="218" y="152" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="171" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="290" y="173" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1212</text>
  <text x="360" y="173" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3 == 3 ✓</text>

  <!-- row 3: 1221 -->
  <text x="44" y="209" font-size="12" fill="#555" filter="url(#rough2)">(2,1)</text>
  <rect x="110" y="188" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="207" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="146" y="188" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="207" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="182" y="188" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="207" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="218" y="188" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="207" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="290" y="209" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1221</text>
  <text x="360" y="209" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3 == 3 ✓</text>

  <!-- row 4: 1230 -->
  <text x="44" y="245" font-size="12" fill="#555" filter="url(#rough2)">(3,0)</text>
  <rect x="110" y="224" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="243" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="146" y="224" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="243" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="182" y="224" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="243" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="218" y="224" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="243" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="290" y="245" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1230</text>
  <text x="360" y="245" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3 == 3 ✓</text>

  <!-- fail note -->
  <text x="44" y="274" font-size="12" fill="#b85450" filter="url(#rough2)">其余组合 c+d ≠ 3 全部 ✗（如 1200 → 0+0，1215 → 1+5）</text>

  <!-- result -->
  <rect x="150" y="288" width="320" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="310" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = 4，与示例 2 一致 ✓</text>

  <!-- footnote -->
  <text x="30" y="344" font-size="11" fill="#999" filter="url(#rough2)">对照示例 1：[1,100] 只有两位数可能对称 → 11, 22, …, 99 共 9 个（100 三位出局）</text>
</svg>
