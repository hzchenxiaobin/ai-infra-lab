<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：单趟扫描，每位 O(1) 定位</text>

  <!-- start -->
  <rect x="185" y="36" width="150" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="54" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">rem = k，i = 0</text>
  <path d="M 260 64 C 260 68, 260 72, 260 76" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- process -->
  <rect x="150" y="80" width="220" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="99" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">o = s[i] − 'a'，cost = min(o, 26 − o)</text>
  <path d="M 260 110 C 260 114, 260 118, 260 122" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision 1 -->
  <polygon points="260,126 372,170 260,214 148,170" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="163" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">买得起 'a' 吗？</text>
  <text x="260" y="181" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">（rem ≥ cost）</text>

  <!-- yes branch -->
  <path d="M 372 170 C 378 170, 384 170, 390 170" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="381" y="160" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="396" y="144" width="112" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="452" y="164" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">t[i] = 'a'</text>
  <text x="452" y="182" text-anchor="middle" font-size="11" fill="#3a5a2e" filter="url(#rough2)">rem −= cost</text>

  <!-- no branch -->
  <path d="M 260 214 C 260 220, 260 226, 260 232" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="270" y="228" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="152" y="236" width="216" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="255" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">t[i] = 'a' + (o − rem)</text>
  <text x="260" y="272" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">朝 'a' 退 rem 步</text>
  <text x="260" y="287" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">rem = 0（后面全原样）</text>

  <path d="M 260 292 C 260 296, 260 299, 260 302" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- green box down to loop diamond -->
  <path d="M 452 196 C 462 290, 415 332, 362 333" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop decision -->
  <polygon points="260,306 356,334 260,362 164,334" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">i+1 &lt; n 且 rem &gt; 0 ?</text>

  <!-- loop back -->
  <path d="M 164 334 C 52 326, 46 104, 146 95" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="56" y="215" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">是：下一轮</text>

  <!-- exit -->
  <path d="M 260 362 C 260 367, 260 371, 260 375" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="372" font-size="9.5" fill="#446688" filter="url(#rough2)">否 / 扫完</text>
  <rect x="210" y="378" width="100" height="20" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="392" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">返回 t</text>
</svg>
