<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：价格词的判定 — '$' 后跟非空纯数字串</text>
  <text x="270" y="42" text-anchor="middle" font-size="10.5" fill="#888">输入仅含小写字母 / 数字 / 空格 / '$'，故「数字串」= 连续数字字符</text>

  <!-- Rule box -->
  <rect x="70" y="56" width="400" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="78" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">w[0] == '$' 且 w[1:] 全为数字（至少 1 位）</text>

  <!-- Left column header: valid prices -->
  <text x="135" y="112" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 是价格 → 打折扣</text>

  <!-- Valid: $100 -->
  <rect x="40" y="122" width="72" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="76" y="142" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">$100</text>
  <text x="124" y="142" font-size="10" fill="#4a7a3a">$ → 100 全数字</text>

  <!-- Valid: $1 -->
  <rect x="40" y="158" width="72" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="76" y="178" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">$1</text>
  <text x="124" y="178" font-size="10" fill="#4a7a3a">$ → 1 全数字</text>

  <!-- Valid: $6 -->
  <rect x="40" y="194" width="72" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="76" y="214" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">$6</text>
  <text x="124" y="214" font-size="10" fill="#4a7a3a">$ → 6 全数字</text>

  <!-- divider -->
  <path d="M 270 108 L 270 240" stroke="#ccc" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <!-- Right column header: invalid -->
  <text x="405" y="112" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ 非价格 → 原样保留</text>

  <!-- Invalid: 100 -->
  <rect x="300" y="122" width="64" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="332" y="140" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">100</text>
  <text x="372" y="140" font-size="10" fill="#b85450">不以 '$' 开头</text>

  <!-- Invalid: $ -->
  <rect x="300" y="154" width="64" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="332" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">$</text>
  <text x="372" y="172" font-size="10" fill="#b85450">'$' 后无数字</text>

  <!-- Invalid: $1e5 -->
  <rect x="300" y="186" width="64" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="332" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">$1e5</text>
  <text x="372" y="204" font-size="10" fill="#b85450">含非数字 'e'</text>

  <!-- Invalid: $10$ -->
  <rect x="300" y="218" width="64" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="332" y="236" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">$10$</text>
  <text x="372" y="236" font-size="10" fill="#b85450">含非数字 '$'</text>

  <!-- Invalid: 5$ -->
  <rect x="300" y="250" width="64" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="332" y="268" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5$</text>
  <text x="372" y="268" font-size="10" fill="#b85450">不以 '$' 开头</text>

  <!-- Bottom note: integer arithmetic -->
  <rect x="40" y="296" width="460" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="316" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">折扣计算用「分」为单位，全程整数运算</text>
  <text x="270" y="334" text-anchor="middle" font-size="10.5" fill="#555">cents = price × (100 − discount)，再拆 dollars = cents / 100、frac = cents % 100</text>
  <text x="270" y="350" text-anchor="middle" font-size="10" fill="#888">price × (100 − disc) 恒为 100 的倍数级，结果恰为 0.01 的整数倍 → 无浮点误差</text>
</svg>
