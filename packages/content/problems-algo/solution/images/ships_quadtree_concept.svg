<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思想：四叉树分治 + 剪枝</text>

  <!-- Rectangle [0,0]-[4,4], 4 quadrants, each 90x90 -->
  <!-- Q2 (top-left): no ships -->
  <rect x="100" y="50" width="90" height="90" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <!-- Q1 (top-right): has ship -->
  <rect x="190" y="50" width="90" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <!-- Q3 (bottom-left): has ships -->
  <rect x="100" y="140" width="90" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <!-- Q4 (bottom-right): no ships -->
  <rect x="190" y="140" width="90" height="90" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="2" filter="url(#rough2)"/>

  <!-- Split lines -->
  <path d="M 190 50 L 190 230" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <path d="M 100 140 L 280 140" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- Ships (red dots) -->
  <circle cx="235" cy="85" r="5" fill="#b85450" stroke="#8a3a36" stroke-width="1" filter="url(#rough2)"/>
  <text x="250" y="82" font-size="9" fill="#b85450">(3,3)</text>

  <circle cx="130" cy="205" r="5" fill="#b85450" stroke="#8a3a36" stroke-width="1" filter="url(#rough2)"/>
  <text x="115" y="220" font-size="9" fill="#b85450">(1,1)</text>

  <circle cx="175" cy="160" r="5" fill="#b85450" stroke="#8a3a36" stroke-width="1" filter="url(#rough2)"/>
  <text x="183" y="157" font-size="9" fill="#b85450">(2,2)</text>

  <!-- Quadrant labels -->
  <text x="145" y="100" text-anchor="middle" font-size="10" fill="#999">✗ 剪枝</text>
  <text x="235" y="100" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 递归</text>
  <text x="145" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 递归</text>
  <text x="235" y="190" text-anchor="middle" font-size="10" fill="#999">✗ 剪枝</text>

  <!-- Coordinate labels -->
  <text x="95" y="242" text-anchor="end" font-size="9" fill="#888">(0,0)</text>
  <text x="285" y="46" font-size="9" fill="#888">(4,4)</text>

  <!-- Right side: explanation -->
  <text x="310" y="60" font-size="12" fill="#555" font-weight="bold">分治三步：</text>

  <rect x="310" y="72" width="230" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="320" y="90" font-size="10" fill="#333">① 查询 hasShips → false 则返回 0</text>

  <rect x="310" y="108" width="230" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="320" y="126" font-size="10" fill="#333">② 单点 → hasShips 为真则返回 1</text>

  <rect x="310" y="144" width="230" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="320" y="162" font-size="10" fill="#333">③ 否则四等分 → 递归四个子矩形</text>

  <rect x="310" y="184" width="230" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="320" y="200" font-size="10" fill="#b85450" font-weight="bold">剪枝是关键：</text>
  <text x="320" y="216" font-size="9" fill="#b85450">hasShips=false 的子区域</text>
  <text x="320" y="228" font-size="9" fill="#b85450">直接跳过，不再递归</text>

  <!-- Key insight box -->
  <rect x="40" y="300" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">至多 10 艘船 → 递归树极小 → hasShips 调用次数远低于 400 上限</text>
  <text x="280" y="332" text-anchor="middle" font-size="10" fill="#888">每次调用要么剪枝（false→0），要么缩小到单点（true→1），无中间浪费</text>
</svg>
