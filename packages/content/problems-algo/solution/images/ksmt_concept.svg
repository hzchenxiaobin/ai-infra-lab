<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="410" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：阈值 x 越大 → 乘法表中 ≤ x 的元素数 count(x) 越多（单调递增）</text>

  <!-- ===== Left: multiplication table m=3, n=3 ===== -->
  <text x="40" y="56" font-size="12" fill="#888">乘法表 m=3, n=3（第 i 行 j 列 = i×j）：</text>

  <!-- row labels -->
  <text x="68" y="92" text-anchor="middle" font-size="10" fill="#999">i=1</text>
  <text x="68" y="126" text-anchor="middle" font-size="10" fill="#999">i=2</text>
  <text x="68" y="160" text-anchor="middle" font-size="10" fill="#999">i=3</text>
  <!-- col labels -->
  <text x="108" y="74" text-anchor="middle" font-size="10" fill="#999">j=1</text>
  <text x="148" y="74" text-anchor="middle" font-size="10" fill="#999">j=2</text>
  <text x="188" y="74" text-anchor="middle" font-size="10" fill="#999">j=3</text>

  <!-- row 1: 1 2 3 -->
  <rect x="88" y="78" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="108" y="97" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="128" y="78" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="97" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="168" y="78" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="97" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <!-- row 2: 2 4 6 -->
  <rect x="88" y="112" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="108" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="128" y="112" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="148" y="131" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="168" y="112" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="188" y="131" text-anchor="middle" font-size="12" fill="#333">6</text>
  <!-- row 3: 3 6 9 -->
  <rect x="88" y="146" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="108" y="165" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="128" y="146" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="148" y="165" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="168" y="146" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="188" y="165" text-anchor="middle" font-size="12" fill="#333">9</text>

  <text x="138" y="196" text-anchor="middle" font-size="11" fill="#888">升序拍平：1, 2, 2, 3, 3, 4, 6, 6, 9</text>
  <text x="138" y="212" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">k=5 → 第 5 小 = 3</text>

  <!-- arrow from table to curve -->
  <path d="M 230 130 L 270 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="250" y="122" text-anchor="middle" font-size="10" fill="#666">count(x)</text>
  <text x="250" y="148" text-anchor="middle" font-size="10" fill="#666">单调递增</text>

  <!-- ===== Right: monotonic count curve ===== -->
  <line x1="290" y1="70" x2="290" y2="330" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="290" y1="330" x2="540" y2="330" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="284" y="76" text-anchor="end" font-size="10" fill="#888">count</text>
  <text x="544" y="334" font-size="10" fill="#888">x →</text>
  <text x="284" y="334" text-anchor="end" font-size="9" fill="#999">0</text>

  <!-- y axis ticks: count 0..9 -->
  <text x="284" y="312" text-anchor="end" font-size="9" fill="#aaa">5</text>
  <text x="284" y="262" text-anchor="end" font-size="9" fill="#aaa">7</text>
  <text x="284" y="214" text-anchor="end" font-size="9" fill="#aaa">9</text>

  <!-- step curve: x:1..9 mapped to 310..520 (~26px each), y:cnt 0..9 mapped to 330..150 (~20px each)
       x=1 cnt=1; x=2 cnt=3; x=3 cnt=5; x=4 cnt=6; x=6 cnt=8; x=9 cnt=9 -->
  <path d="M 310 330 L 310 310 L 336 310 L 336 270 L 362 270 L 362 230 L 388 230 L 388 210 L 440 210 L 440 170 L 520 170" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="430" y="200" font-size="11" fill="#446688" font-weight="bold">x ↑ ⇒ count ↑</text>

  <!-- x axis labels -->
  <text x="310" y="346" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="336" y="346" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="362" y="346" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">3</text>
  <text x="388" y="346" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="440" y="346" text-anchor="middle" font-size="9" fill="#aaa">6</text>
  <text x="520" y="346" text-anchor="middle" font-size="9" fill="#aaa">9</text>

  <!-- k threshold line -->
  <line x1="290" y1="310" x2="540" y2="310" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="544" y="314" font-size="11" fill="#b85450" font-weight="bold">k = 5</text>

  <!-- answer point at x=3 (count jumps to 5) -->
  <circle cx="362" cy="230" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="362" y1="230" x2="362" y2="330" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="362" y="362" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">x* = 3</text>

  <!-- feasible / infeasible labels -->
  <text x="320" y="304" font-size="10" fill="#b85450">count &lt; k ✗</text>
  <text x="450" y="304" font-size="10" fill="#4a7a3a">count ≥ k ✓</text>

  <!-- summary note -->
  <rect x="40" y="372" width="500" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="390" text-anchor="middle" font-size="11" fill="#d6a040">答案 x ∈ [1, m·n]；求最小的 x 使 count(x) ≥ k；count 关于 x 单调 ⇒ 可二分！</text>
</svg>
