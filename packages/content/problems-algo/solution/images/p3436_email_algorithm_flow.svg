<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">SQL 执行流程：正则过滤 + 排序</text>

  <!-- FROM box -->
  <rect x="60" y="44" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="150" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">FROM Users（逐行扫描）</text>

  <path d="M 150 74 L 150 88" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- WHERE box -->
  <rect x="30" y="90" width="240" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="150" y="108" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">WHERE email REGEXP</text>
  <text x="150" y="126" text-anchor="middle" font-size="10" fill="#4a7a3a">'^[A-Za-z0-9_]+@[A-Za-z]+[.]com$'</text>

  <path d="M 150 136 L 150 150" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond -->
  <polygon points="150,152 226,178 150,204 74,178" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="182" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">整串完全匹配？</text>

  <!-- yes branch -->
  <path d="M 226 178 L 248 178" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="237" y="170" text-anchor="middle" font-size="10" fill="#4a7a3a">✓</text>
  <rect x="250" y="164" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="285" y="182" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">保留该行</text>

  <!-- no branch -->
  <path d="M 150 204 L 150 220" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="158" y="216" font-size="10" fill="#b85450">✗</text>
  <rect x="100" y="222" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="239" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">跳过，看下一行</text>

  <!-- dashed loop back to FROM -->
  <path d="M 100 235 L 40 235 L 40 59 L 58 59" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- green box down to ORDER BY -->
  <path d="M 285 192 L 285 267 L 246 267" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ORDER BY box -->
  <rect x="60" y="252" width="186" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="153" y="271" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">ORDER BY user_id ASC</text>

  <path d="M 153 282 L 153 296" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- SELECT box -->
  <rect x="45" y="298" width="216" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="153" y="317" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">SELECT user_id, email（输出）</text>

  <!-- right panel: regex engine -->
  <rect x="322" y="88" width="224" height="188" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="434" y="110" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">正则引擎：一次线性扫描</text>
  <text x="338" y="134" font-size="10.5" fill="#444">① ^ 锚定串首</text>
  <text x="338" y="156" font-size="10.5" fill="#444">② [A-Za-z0-9_]+ 吃掉前缀</text>
  <text x="338" y="178" font-size="10.5" fill="#444">③ @ 恰好一次分界</text>
  <text x="338" y="200" font-size="10.5" fill="#444">④ [A-Za-z]+ 吃掉域名</text>
  <text x="338" y="222" font-size="10.5" fill="#444">⑤ [.]com 匹配字面后缀</text>
  <text x="338" y="244" font-size="10.5" fill="#444">⑥ $ 锚定串尾</text>
  <text x="338" y="266" font-size="9.5" fill="#888">（字符类互斥，回溯有界，线性 O(m)）</text>

  <!-- bottom right note -->
  <rect x="322" y="286" width="224" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="434" y="304" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">任一步失配 ⇒ 整行淘汰</text>
  <text x="434" y="320" text-anchor="middle" font-size="10" fill="#b85450">失配位置即「违规原因」</text>
</svg>
