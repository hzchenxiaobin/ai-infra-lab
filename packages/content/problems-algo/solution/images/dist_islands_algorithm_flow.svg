<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>

  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：扫描 + DFS 记录路径签名</text>
  <path d="M 170 42 Q 340 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- main flow column (left) -->
  <!-- start -->
  <g filter="url(#rough2)"><rect x="120" y="66" width="170" height="36" rx="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="205" y="89" text-anchor="middle" font-size="13" fill="#2b4a66" font-weight="bold">开始：shapes = ∅</text>
  <path d="M 205 102 L 205 120" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop -->
  <g filter="url(#rough2)"><rect x="110" y="122" width="190" height="40" rx="6" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.5"/></g>
  <text x="205" y="147" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">行优先遍历每个 (i, j)</text>
  <path d="M 205 162 L 205 180" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision -->
  <g filter="url(#rough2)"><polygon points="205,182 290,222 205,262 120,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="205" y="219" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">grid[i][j]</text>
  <text x="205" y="236" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">== 1 ?</text>

  <!-- No branch -->
  <path d="M 290 222 L 340 222" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="216" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">否</text>
  <g filter="url(#rough2)"><rect x="342" y="206" width="92" height="32" rx="6" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3"/></g>
  <text x="388" y="226" text-anchor="middle" font-size="12" fill="#666">跳过该格</text>
  <path d="M 388 238 Q 388 268 300 258" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="266" font-size="10" fill="#aaa">下一格</text>

  <!-- Yes branch -->
  <path d="M 205 262 L 205 282" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="216" y="276" font-size="11" fill="#b85450" font-weight="bold">是</text>

  <!-- DFS call -->
  <g filter="url(#rough2)"><rect x="100" y="284" width="210" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="205" y="303" text-anchor="middle" font-size="12" fill="#2e5a26" font-weight="bold">path = ""</text>
  <text x="205" y="320" text-anchor="middle" font-size="12" fill="#2e5a26" font-weight="bold">dfs(i, j, 'O', path)</text>
  <path d="M 205 328 L 205 346" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- insert signature -->
  <g filter="url(#rough2)"><rect x="100" y="348" width="210" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="205" y="373" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold">shapes.insert(path)</text>
  <path d="M 205 388 L 205 406" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop back -->
  <g filter="url(#rough2)"><rect x="120" y="408" width="170" height="34" rx="6" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.5"/></g>
  <text x="205" y="430" text-anchor="middle" font-size="12" fill="#444">继续下一格</text>
  <path d="M 120 425 Q 60 425 60 142 L 110 142" stroke="#9e9e9e" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- end -->
  <g filter="url(#rough2)"><rect x="430" y="406" width="180" height="40" rx="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="520" y="431" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">return shapes.size()</text>
  <path d="M 290 425 Q 360 425 430 425" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="418" text-anchor="middle" font-size="10" fill="#aaa">遍历结束</text>

  <!-- ===== right: DFS detail box ===== -->
  <g filter="url(#rough2)">
    <rect x="450" y="66" width="210" height="310" rx="10" fill="#fffdf3" stroke="#4a7a3a" stroke-dasharray="5 3" stroke-width="1.5"/>
  </g>
  <text x="466" y="90" font-size="13" font-weight="bold" fill="#2e5a26">dfs(i, j, dir, path)</text>
  <path d="M 466 98 Q 555 104 644 98" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <text x="466" y="122" font-size="12" fill="#444">若越界 / grid≠1：返回</text>
  <text x="466" y="146" font-size="12" fill="#444" font-weight="bold">沉岛 grid[i][j] = 0</text>
  <text x="466" y="170" font-size="12" fill="#444" font-weight="bold">path.append(dir)</text>
  <text x="480" y="188" font-size="11" fill="#888">记录「如何进入本格」</text>

  <text x="466" y="212" font-size="12" fill="#444" font-weight="bold">递归四方向：</text>
  <text x="466" y="230" font-size="11" fill="#446688">U: dfs(i−1, j, 'U')</text>
  <text x="466" y="246" font-size="11" fill="#446688">D: dfs(i+1, j, 'D')</text>
  <text x="466" y="262" font-size="11" fill="#446688">L: dfs(i, j−1, 'L')</text>
  <text x="466" y="278" font-size="11" fill="#446688">R: dfs(i, j+1, 'R')</text>

  <text x="466" y="302" font-size="12" fill="#b85450" font-weight="bold">path.append('B')</text>
  <text x="480" y="320" font-size="11" fill="#888">回溯标记：退出本格</text>

  <g filter="url(#rough2)"><rect x="466" y="334" width="180" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="556" y="354" text-anchor="middle" font-size="11" fill="#b85450">方向顺序全程一致</text>
</svg>
