    <rect x="180" y="466" width="40" height="28" rx="4" fill="#bcd6f0" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="230" y="466" width="40" height="28" rx="4" fill="#bcd6f0" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="280" y="466" width="40" height="28" rx="4" fill="#bcd6f0" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="330" y="466" width="40" height="28" rx="4" fill="#bcd6f0" stroke="#4a8edb" stroke-width="1.5"/>
