    <rect x="430" y="466" width="40" height="28" rx="4" fill="#bcd6f0" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="480" y="466" width="40" height="28" rx="4" fill="#bcd6f0" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="530" y="466" width="40" height="28" rx="4" fill="#bcd6f0" stroke="#4a8edb" stroke-width="1.5"/>
