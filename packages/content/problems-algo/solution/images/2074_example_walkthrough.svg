  <text x="30" y="398" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">actual=4 偶 → 反转 [7,3,8,4]→[4,8,3,7]</text>
  <g filter="url(#rough2)">
    <rect x="30" y="406" width="40" height="28" rx="4" fill="#eee" stroke="#999" stroke-width="1"/>
    <rect x="80" y="406" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="130" y="406" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="180" y="406" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="230" y="406" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="280" y="406" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="330" y="406" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="380" y="406" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="430" y="406" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="480" y="406" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="50" y="425" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">d</text>
  <text x="100" y="425" text-anchor="middle" font-size="11" fill="#2e5e2e" filter="url(#rough2)">5</text>
  <text x="150" y="425" text-anchor="middle" font-size="11" fill="#2e5e2e" filter="url(#rough2)">6</text>
  <text x="200" y="425" text-anchor="middle" font-size="11" fill="#2e5e2e" filter="url(#rough2)">2</text>
  <text x="250" y="425" text-anchor="middle" font-size="11" fill="#2e5e2e" filter="url(#rough2)">3</text>
  <text x="300" y="425" text-anchor="middle" font-size="11" fill="#2e5e2e" filter="url(#rough2)">9</text>
  <text x="350" y="425" text-anchor="middle" font-size="11" fill="#2e5e2e" filter="url(#rough2)">1</text>
  <text x="400" y="425" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="450" y="425" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="500" y="425" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="550" y="425" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="350" y="448" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">prev→1</text>

  <!-- Result -->
  <text x="30" y="482" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#rough2)">最终结果</text>
  <g filter="url(#rough2)">
