  <text x="100" y="485" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="150" y="485" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="200" y="485" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="250" y="485" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="300" y="485" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="350" y="485" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="400" y="485" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="450" y="485" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold" filter="url(#rough2)">8</text>
