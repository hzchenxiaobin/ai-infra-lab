  <!-- legend -->
  <rect x="620" y="466" width="14" height="14" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="640" y="478" font-size="10" fill="#444" filter="url(#rough2)">已处理</text>
  <rect x="700" y="466" width="14" height="14" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="720" y="478" font-size="10" fill="#444" filter="url(#rough2)">当前组</text>
  <rect x="780" y="466" width="14" height="14" rx="2" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="2,1" filter="url(#rough2)"/>
  <text x="800" y="478" font-size="10" fill="#444" filter="url(#rough2)">待处理</text>

  <!-- bottom note -->
  <rect x="30" y="510" width="880" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="50" y="532" font-size="11" font-weight="bold" fill="#7a2828" filter="url(#rough2)">注意：prev 始终是「当前组的前驱」</text>
  <text x="50" y="550" font-size="10" fill="#444" filter="url(#rough2)">不反转时 prev = 组尾 node；反转时 prev = 原组头（翻转后变新尾）。两种情况 prev 都指向下一组的前驱，循环不变式成立。</text>
