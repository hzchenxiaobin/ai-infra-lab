<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="940" height="580" fill="#fafafa"/>

  <text x="470" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：head = [5,2,6,3,9,1,7,3,8,4]</text>
  <text x="470" y="48" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">prev 始终指向当前组的前驱节点；绿色=已处理，橙色=当前组，灰色=待处理</text>

  <!-- Step 1: expected=1, group=[5], actual=1 odd, keep -->
  <text x="30" y="82" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">第1组 expected=1</text>
  <text x="30" y="98" font-size="10" fill="#666" filter="url(#rough2)">actual=1 奇 → 保留</text>
  <!-- boxes: dummy, [5](orange), 2,6,3,9,1,7,3,8,4 -->
  <g filter="url(#rough2)">
    <rect x="30" y="106" width="40" height="28" rx="4" fill="#eee" stroke="#999" stroke-width="1"/>
    <rect x="80" y="106" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="130" y="106" width="40" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="180" y="106" width="40" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="230" y="106" width="40" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="280" y="106" width="40" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="330" y="106" width="40" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="380" y="106" width="40" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="430" y="106" width="40" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="480" y="106" width="40" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2"/>
  </g>
  <text x="50" y="125" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">d</text>
  <text x="100" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="150" y="125" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="200" y="125" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">6</text>
  <text x="250" y="125" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">3</text>
  <text x="300" y="125" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">9</text>
