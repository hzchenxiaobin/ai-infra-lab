    <rect x="130" y="206" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="180" y="206" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="230" y="206" width="40" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="280" y="206" width="40" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="330" y="206" width="40" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="380" y="206" width="40" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="430" y="206" width="40" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="480" y="206" width="40" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2"/>
  </g>
  <text x="50" y="225" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">d</text>
  <text x="100" y="225" text-anchor="middle" font-size="12" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="150" y="225" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="200" y="225" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="250" y="225" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">3</text>
  <text x="300" y="225" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">9</text>
  <text x="350" y="225" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="400" y="225" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">7</text>
  <text x="450" y="225" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">3</text>
  <text x="500" y="225" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">8</text>
  <text x="550" y="225" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">4</text>
  <!-- reverse arrow -->
  <path d="M 200 198 Q 165 188 150 198" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="248" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">prev→5</text>

  <!-- Step 3: expected=3, group=[3,9,1], actual=3 odd, keep -->
  <text x="30" y="282" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">第3组 expected=3</text>
  <text x="30" y="298" font-size="10" fill="#666" filter="url(#rough2)">actual=3 奇 → 保留 [3,9,1]</text>
  <g filter="url(#rough2)">
    <rect x="30" y="306" width="40" height="28" rx="4" fill="#eee" stroke="#999" stroke-width="1"/>
    <rect x="80" y="306" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="130" y="306" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="180" y="306" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="230" y="306" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="280" y="306" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="330" y="306" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="380" y="306" width="40" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="430" y="306" width="40" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="480" y="306" width="40" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2"/>
  </g>
  <text x="50" y="325" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">d</text>
  <text x="100" y="325" text-anchor="middle" font-size="11" fill="#2e5e2e" filter="url(#rough2)">5</text>
  <text x="150" y="325" text-anchor="middle" font-size="11" fill="#2e5e2e" filter="url(#rough2)">6</text>
  <text x="200" y="325" text-anchor="middle" font-size="11" fill="#2e5e2e" filter="url(#rough2)">2</text>
  <text x="250" y="325" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="300" y="325" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="350" y="325" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="400" y="325" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">7</text>
  <text x="450" y="325" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">3</text>
  <text x="500" y="325" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">8</text>
  <text x="550" y="325" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">4</text>
  <text x="200" y="348" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">prev→2</text>

