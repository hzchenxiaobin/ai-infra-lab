<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：解析建表 → DFS 按位置法则走树</text>

  <!-- Step 1: parse -->
  <rect x="110" y="44" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 解析 nums → 哈希表 tree</text>
  <text x="260" y="80" text-anchor="middle" font-size="10" fill="#666">tree[num÷10] = num%10  ⇒  key=D×10+P → V</text>
  <path d="M 260 88 L 260 104" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 2: DFS start -->
  <rect x="160" y="106" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="260" y="127" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② dfs(key=11, cur=0)</text>
  <path d="M 260 138 L 260 154" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Diamond 1: key in tree? -->
  <path d="M 260 158 L 350 196 L 260 234 L 170 196 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="194" text-anchor="middle" font-size="11" fill="#333">key ∈ tree ?</text>
  <text x="260" y="210" text-anchor="middle" font-size="10" fill="#888">(该位置有节点?)</text>
  <!-- No branch: right -->
  <path d="M 350 196 L 410 196" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="362" y="190" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="410" y="180" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="470" y="201" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return（无此路径）</text>
  <!-- Yes branch: down -->
  <path d="M 260 234 L 260 250" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="268" y="246" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Step 3: compute val + child keys -->
  <rect x="110" y="252" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">③ val=tree[key]；d=key÷10, p=key%10</text>
  <text x="260" y="288" text-anchor="middle" font-size="10" fill="#666">left=(d+1)×10+(2p−1)，right=(d+1)×10+(2p)</text>
  <path d="M 260 296 L 260 312" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Diamond 2: leaf? -->
  <path d="M 260 316 L 370 356 L 260 396 L 150 356 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="354" text-anchor="middle" font-size="11" fill="#333">左右孩子都不在 tree ?</text>
  <text x="260" y="370" text-anchor="middle" font-size="10" fill="#888">(叶子节点?)</text>
  <!-- Yes branch: right -->
  <path d="M 370 356 L 410 356" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="380" y="350" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="410" y="338" width="130" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="475" y="356" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans += cur + val</text>
  <text x="475" y="370" text-anchor="middle" font-size="9" fill="#4a7a3a">累加此路径</text>
  <!-- No branch: down -->
  <path d="M 260 396 L 260 412" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="268" y="408" font-size="11" fill="#446688" font-weight="bold">否</text>

  <!-- Step 4: recurse -->
  <rect x="100" y="414" width="320" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="434" text-anchor="middle" font-size="11" fill="#333">④ dfs(left, cur+val)</text>
  <text x="380" y="434" font-size="13" fill="#b85450" font-weight="bold">＋</text>
  <text x="260" y="448" text-anchor="middle" font-size="11" fill="#333">dfs(right, cur+val)</text>

  <!-- bottom note -->
  <rect x="30" y="460" width="500" height="0" fill="none"/>
  <text x="280" y="472" text-anchor="middle" font-size="10" fill="#888">不建树、不分配节点——哈希表 + 位置法则即可还原满二叉树结构</text>
</svg>
