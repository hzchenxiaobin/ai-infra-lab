<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)" font-weight="bold">算法流程</text>

  <!-- 步骤1 -->
  <rect x="70" y="50" width="400" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="86" y="77" font-size="13" fill="#333" filter="url(#rough2)">① 算 base = sum(reward2)，即假设全给老鼠2</text>

  <path d="M 270 98 L 270 118" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤2 -->
  <rect x="70" y="122" width="400" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="86" y="144" font-size="13" fill="#333" filter="url(#rough2)">② 对每块算增量 gain[i] = reward1[i] − reward2[i]</text>
  <text x="86" y="166" font-size="12" fill="#888" filter="url(#rough2)">　 （gain&gt;0 转给老鼠1 更划算；gain&lt;0 则亏）</text>

  <path d="M 270 184 L 270 204" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤3 -->
  <rect x="70" y="208" width="400" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="86" y="235" font-size="13" fill="#333" filter="url(#rough2)">③ 把 gain 从大到小排序，取前 k 个求和</text>

  <path d="M 270 254 L 270 274" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤4 -->
  <rect x="70" y="278" width="400" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="86" y="305" font-size="13" fill="#333" filter="url(#rough2)">④ 答案 = base + topK 之和</text>

  <!-- 小贴士 -->
  <rect x="70" y="340" width="400" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough)"/>
  <text x="86" y="361" font-size="12" fill="#333" filter="url(#rough)">💡 也可部分排序 nth_element 取前 k 大，</text>
  <text x="86" y="378" font-size="12" fill="#333" filter="url(#rough)">　 避免完整排序，C++ 里更省常数。</text>
</svg>
