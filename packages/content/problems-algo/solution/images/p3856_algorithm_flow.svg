<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：倒序扫描定位切割点，返回前缀</text>
  <text x="260" y="33" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">循环条件两件套「i ≥ 0 且 s[i] 是元音」缺一不可，且顺序敏感（短路求值）</text>

  <!-- step 1 -->
  <rect x="170" y="46" width="180" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">① i = n − 1（从末位出发）</text>

  <path d="M 260 72 L 260 82" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="260,86 380,128 260,170 140,128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">i ≥ 0 且</text>
  <text x="260" y="138" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">s[i] ∈ {a,e,i,o,u} ?</text>

  <!-- yes branch -->
  <path d="M 380 128 L 404 128" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="392" y="120" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="408" y="112" width="104" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="126" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">i ← i − 1</text>
  <text x="460" y="138" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">（继续左移一步）</text>

  <!-- loop back arrow -->
  <path d="M 460 112 L 460 89 L 278 89" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="374" y="84" text-anchor="middle" font-size="7.5" fill="#b85450" filter="url(#rough2)">左移后再判（回到判定）</text>

  <!-- no branch -->
  <path d="M 260 170 L 260 182" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="268" y="164" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="284" y="168" font-size="7.5" fill="#888" filter="url(#rough2)">s[i] 非元音，或 i 已扫穿（&lt; 0）</text>

  <!-- step 2 -->
  <rect x="170" y="186" width="180" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="203" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">② i = 最右非元音下标（切割点）</text>

  <path d="M 260 212 L 260 226" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="170" y="230" width="180" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="247" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">③ 返回 s[0..i]：substr(0, i+1)</text>

  <path d="M 260 256 L 260 268" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- final box -->
  <rect x="170" y="272" width="180" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="286" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">全元音时 i = −1 ⇒ substr(0, 0)</text>
  <text x="260" y="298" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">天然返回 ""，零 if 特判 ✓</text>

  <!-- left note -->
  <rect x="16" y="186" width="136" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="84" y="201" text-anchor="middle" font-size="7.5" fill="#333" filter="url(#rough2)">⚠️ 条件顺序：先判 i ≥ 0</text>
  <text x="84" y="212" text-anchor="middle" font-size="7.5" fill="#333" filter="url(#rough2)">短路防 s[−1]（Python 合法但</text>
  <text x="84" y="223" text-anchor="middle" font-size="7.5" fill="#333" filter="url(#rough2)">取末位）与 C++ 越界 UB</text>

  <!-- right note -->
  <rect x="372" y="186" width="132" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="438" y="201" text-anchor="middle" font-size="7.5" fill="#333" filter="url(#rough2)">早停：s[i] 非元音即止</text>
  <text x="438" y="212" text-anchor="middle" font-size="7.5" fill="#333" filter="url(#rough2)">更左边字符与答案无关</text>
  <text x="438" y="223" text-anchor="middle" font-size="7.5" fill="#333" filter="url(#rough2)">最坏（全元音）也只 O(n)</text>

  <!-- bottom annotation -->
  <rect x="30" y="330" width="460" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="346" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">复杂度：时间 O(n)（最坏全元音扫全串）；空间 O(1) 额外（C++ 可 resize 原地收尾，substr 则 O(n) 拷贝）</text>
  <text x="260" y="362" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">一行流：C++ find_last_not_of("aeiou")+1（npos+1=0 恰空串）；Python rstrip("aeiou")（参数是字符集合）</text>
</svg>
