<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：带方向标记的无向树 + 自根 DFS 数朝外边</text>

  <!-- 1. Build graph -->
  <rect x="100" y="40" width="360" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">建无向邻接表 adj</text>
  <text x="280" y="77" text-anchor="middle" font-size="10.5" fill="#555">每条 [a,b] → adj[a].push((b,1))；adj[b].push((a,0))</text>
  <line x1="280" y1="86" x2="280" y2="104" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. DFS start -->
  <rect x="180" y="106" width="200" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">DFS(u=0, parent=-1)</text>
  <line x1="280" y1="140" x2="280" y2="158" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. Loop -->
  <rect x="150" y="160" width="260" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="182" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">遍历 adj[u] 的每个 (v, need)</text>
  <line x1="280" y1="194" x2="280" y2="208" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. Diamond: v == parent ? -->
  <polygon points="280,210 355,245 280,280 205,245" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="242" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">v == parent?</text>
  <text x="280" y="256" text-anchor="middle" font-size="10" fill="#555">（防回头）</text>

  <!-- yes -> skip (right) -->
  <line x1="355" y1="245" x2="438" y2="245" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="238" text-anchor="middle" font-size="10" fill="#888">是</text>
  <rect x="438" y="228" width="86" height="34" rx="8" fill="#f2f2f2" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="481" y="250" text-anchor="middle" font-size="11" fill="#555">跳过</text>
  <!-- skip loops back up to loop box (right side) -->
  <path d="M 481 228 L 481 177 L 412 177" fill="none" stroke="#999" stroke-width="1.5"
        stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no -> down to need==1 diamond -->
  <line x1="280" y1="280" x2="280" y2="300" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="294" font-size="10" fill="#888">否</text>

  <!-- 5. Diamond: need == 1 ? -->
  <polygon points="280,302 350,335 280,368 210,335" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">need == 1?</text>
  <text x="280" y="346" text-anchor="middle" font-size="9.5" fill="#555">（朝外?）</text>

  <!-- yes -> ans+=1 (left, red) -->
  <line x1="210" y1="335" x2="148" y2="335" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="328" text-anchor="middle" font-size="10" fill="#b85450">是</text>
  <rect x="40" y="318" width="108" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="94" y="340" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans += 1 翻转</text>

  <!-- no -> not count (right, green) -->
  <line x1="350" y1="335" x2="412" y2="335" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="328" text-anchor="middle" font-size="10" fill="#4a7a3a">否</text>
  <rect x="412" y="318" width="108" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="466" y="340" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">不计 朝内</text>

  <!-- both converge to dfs(v,u) -->
  <path d="M 94 352 L 94 392 L 200 392" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 466 352 L 466 392 L 360 392" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 6. dfs(v, u) -->
  <rect x="200" y="378" width="160" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="400" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">dfs(v, u) 递归</text>
  <!-- loops back to loop box (left side) -->
  <path d="M 200 395 L 130 395 L 130 177 L 150 177" fill="none" stroke="#999" stroke-width="1.5"
        stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="285" text-anchor="middle" font-size="9.5" fill="#999" transform="rotate(-90 120 285)">下一邻居</text>

  <!-- return -->
  <line x1="280" y1="412" x2="280" y2="430" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="190" y="432" width="180" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="452" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">返回 ans（遍历结束）</text>
</svg>
