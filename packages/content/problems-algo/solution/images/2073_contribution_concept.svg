<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：k 买 T 张 ⇒ T 轮 ⇒ 按位置贡献</text>

  <text x="40" y="58" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① k 恰好在第 T = tickets[k] 轮完成买票</text>

  <rect x="40" y="70" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="92" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">每轮 k 买 1 张 ⇒ 买 T 张需 T 轮 ⇒ T 是参与轮数上界</text>

  <text x="40" y="132" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 队伍按 k 分两段：i ≤ k（前/含k） / i &gt; k（后）</text>

  <rect x="40" y="146" width="58" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="69" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i=0</text>
  <text x="69" y="180" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">≤k</text>

  <rect x="102" y="146" width="58" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="131" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">...</text>
  <text x="131" y="180" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">≤k</text>

  <rect x="164" y="146" width="58" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="193" y="166" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">i=k</text>
  <text x="193" y="180" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">目标</text>

  <rect x="226" y="146" width="58" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">k+1</text>
  <text x="255" y="180" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">&gt;k</text>

  <rect x="288" y="146" width="58" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="317" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">...</text>
  <text x="317" y="180" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">&gt;k</text>

  <rect x="350" y="146" width="58" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="379" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">n-1</text>
  <text x="379" y="180" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">&gt;k</text>

  <path d="M 40 196 L 222 196" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 222 196 L 408 196" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <text x="131" y="212" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">前段：完整参与 T 轮</text>
  <text x="315" y="212" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">后段：仅 T−1 轮（末轮被打断）</text>

  <text x="40" y="244" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 每人贡献 = min(自身票数, 参与轮数上界)</text>

  <rect x="40" y="258" width="232" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="156" y="278" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i ≤ k</text>
  <text x="156" y="296" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">min(tickets[i], T)</text>

  <rect x="288" y="258" width="232" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="404" y="278" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i &gt; k</text>
  <text x="404" y="296" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">min(tickets[i], T−1)</text>

  <text x="40" y="334" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">answer = Σ(前段贡献) + Σ(后段贡献)</text>

  <rect x="40" y="346" width="480" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">一次遍历 O(n) 求和，无需逐秒模拟 ✅</text>
</svg>
