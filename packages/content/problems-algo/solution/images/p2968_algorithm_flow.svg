<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 + 前缀和 + 同向双指针</text>

  <!-- 开始 -->
  <rect x="90" y="32" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="170" y="51" text-anchor="middle" font-size="12" fill="#333">排序 nums，建前缀和 pre</text>

  <path d="M 170 60 L 170 76" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="90" y="78" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="97" text-anchor="middle" font-size="12" fill="#333">left = 0，ans = 0</text>

  <path d="M 170 106 L 170 122" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="90" y="124" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="143" text-anchor="middle" font-size="12" fill="#333">for right = 0 … n−1</text>

  <path d="M 170 152 L 170 168" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <!-- 计算代价 -->
  <rect x="90" y="170" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="186" text-anchor="middle" font-size="12" fill="#333">mid = ⌊(l+r)/2⌋，O(1) 算</text>
  <text x="170" y="202" text-anchor="middle" font-size="12" fill="#333">cost(left, right)</text>

  <path d="M 170 210 L 170 226" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <!-- 菱形判断 -->
  <polygon points="170,228 248,258 170,288 92,258" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="263" text-anchor="middle" font-size="12" fill="#333">cost ≤ k ?</text>

  <path d="M 170 288 L 170 306" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrg)"/>
  <text x="178" y="304" font-size="11" fill="#4a7a3a">是</text>

  <!-- 收缩分支 -->
  <path d="M 248 258 L 318 258" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrr)"/>
  <text x="280" y="252" text-anchor="middle" font-size="11" fill="#b85450">否</text>

  <rect x="320" y="240" width="210" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="425" y="262" text-anchor="middle" font-size="12" fill="#333">left++（收缩后重算 cost）</text>

  <path d="M 424 240 L 424 190 L 252 190" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrr)"/>
  <text x="430" y="216" font-size="10" fill="#b85450">仍超预算则继续收</text>

  <!-- ans 更新 -->
  <rect x="90" y="308" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="327" text-anchor="middle" font-size="12" fill="#333">ans = max(ans, r−l+1)</text>

  <!-- 循环回路 -->
  <path d="M 250 322 L 300 322 L 300 138 L 250 138" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="306" y="234" font-size="11" fill="#446688">right+1</text>

  <!-- 循环出口 -->
  <path d="M 90 138 L 34 138 L 34 352 L 98 352" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="40" y="244" font-size="10" fill="#555">right 用尽</text>

  <!-- 返回 -->
  <rect x="100" y="338" width="140" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="170" y="357" text-anchor="middle" font-size="12" fill="#333">返回 ans</text>

  <!-- 右下要点 -->
  <rect x="320" y="308" width="216" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="428" y="328" text-anchor="middle" font-size="11" fill="#333">排序 O(n log n) 主导；</text>
  <text x="428" y="344" text-anchor="middle" font-size="11" fill="#333">窗口阶段 left/right 各走 n 步，</text>
  <text x="428" y="360" text-anchor="middle" font-size="11" fill="#333">均摊 O(n)；全程 64 位整数</text>
</svg>
