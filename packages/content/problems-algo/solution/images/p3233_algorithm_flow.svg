<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：筛到 √r，数平方落在 [l, r] 内的质数</text>

  <rect x="90" y="34" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="52" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">输入 l, r</text>

  <path d="M 150 62 V 70" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="90" y="72" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="90" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">n = ⌊√r⌋</text>
  <text x="220" y="90" font-size="9" fill="#888" filter="url(#rough2)">Python: math.isqrt 精确 / C++: sqrt 后双向修正</text>

  <path d="M 150 100 V 126" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- 循环容器 -->
  <rect x="56" y="130" width="408" height="224" fill="#fdfdfd" stroke="#999" stroke-width="1.3" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="72" y="148" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">循环：for i = 2 … n</text>

  <path d="M 150 100 V 152" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <polygon points="150,158 216,180 150,202 84,180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="184" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">comp[i] 合数？</text>

  <path d="M 216 180 H 250" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="228" y="173" font-size="9.5" fill="#d6a040" filter="url(#rough2)">是</text>
  <rect x="254" y="165" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="289" y="184" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">跳过 i</text>

  <path d="M 150 202 V 214" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="158" y="212" font-size="9.5" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="78" y="218" width="144" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="235" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">划掉 i², i²+i, … ≤ n</text>
  <text x="230" y="235" font-size="9" fill="#888" filter="url(#rough2)">从 i² 起划，更小倍数已被划</text>

  <path d="M 150 244 V 254" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <polygon points="150,260 210,284 150,308 90,284" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="288" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">i² ≥ l ？</text>

  <path d="M 210 284 H 244" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="220" y="277" font-size="9.5" fill="#446688" filter="url(#rough2)">是</text>
  <rect x="248" y="269" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="293" y="288" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">special += 1</text>

  <path d="M 150 308 V 336" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="158" y="324" font-size="9.5" fill="#446688" filter="url(#rough2)">否</text>
  <path d="M 293 299 V 336" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 324 180 C 404 214, 396 300, 336 336" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 150 336 H 336" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="360" y="330" font-size="9" fill="#888" filter="url(#rough2)">→ 下一个 i</text>

  <path d="M 245 336 V 360" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="252" y="354" font-size="9" fill="#888" filter="url(#rough2)">i &gt; n（循环结束）</text>

  <rect x="145" y="364" width="200" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="245" y="384" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return (r − l + 1) − special</text>

  <rect x="56" y="408" width="408" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="424" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 边界：r &lt; 4 ⇒ n &lt; 2 ⇒ 循环体不执行</text>
  <text x="260" y="440" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">special = 0，直接返回 r − l + 1，无需特判</text>
</svg>
