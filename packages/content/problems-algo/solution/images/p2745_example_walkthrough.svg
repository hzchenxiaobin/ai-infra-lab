<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2745w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：交替块数 × 2 + 2z</text>

  <!-- Example 1 -->
  <text x="30" y="58" font-size="13" fill="#446688" font-weight="bold">示例 1：x=2, y=5, z=1</text>
  <text x="230" y="58" font-size="11" fill="#888">y &gt; x ⇒ 以 BB 开头，末尾是 BB</text>

  <!-- chain: BB AA BB AA BB + AB -->
  <rect x="30" y="70" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="48" y="87" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">BB</text>
  <text x="72" y="87" font-size="12" fill="#888">|</text>
  <rect x="78" y="70" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="96" y="87" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">AA</text>
  <text x="120" y="87" font-size="12" fill="#888">|</text>
  <rect x="126" y="70" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="144" y="87" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">BB</text>
  <text x="168" y="87" font-size="12" fill="#888">|</text>
  <rect x="174" y="70" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="192" y="87" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">AA</text>
  <text x="216" y="87" font-size="12" fill="#888">|</text>
  <rect x="222" y="70" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="87" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">BB</text>
  <path d="M264,83 L284,83" stroke="#d6a040" stroke-width="2" marker-end="url(#arr2745w)" filter="url(#rough2)"/>
  <rect x="290" y="70" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="306" y="87" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">AB</text>

  <text x="340" y="82" font-size="10" fill="#4a7a3a" font-weight="bold">3 BB + 2 AA = 5 块</text>
  <text x="340" y="95" font-size="10" fill="#d6a040" font-weight="bold">+ 1 AB</text>

  <rect x="30" y="104" width="440" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="250" y="121" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">BBAABBAABBAB  =  (2·2+1)×2 + 2×1 = 10+2 = 12 ✓</text>

  <path d="M250,134 L250,154" stroke="#446688" stroke-width="2" marker-end="url(#arr2745w)" filter="url(#rough2)"/>

  <!-- Example 2 -->
  <text x="30" y="178" font-size="13" fill="#446688" font-weight="bold">示例 2：x=3, y=2, z=2</text>
  <text x="230" y="178" font-size="11" fill="#888">x &gt; y ⇒ 以 AA 开头，末尾是 AA</text>

  <!-- chain: AB AB AA BB AA BB AA (AB at front since ends with AA) -->
  <rect x="30" y="190" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="46" y="207" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">AB</text>
  <text x="68" y="207" font-size="12" fill="#888">|</text>
  <rect x="74" y="190" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="207" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">AB</text>
  <text x="112" y="207" font-size="12" fill="#888">|</text>
  <rect x="118" y="190" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="136" y="207" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">AA</text>
  <text x="160" y="207" font-size="12" fill="#888">|</text>
  <rect x="166" y="190" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="207" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">BB</text>
  <text x="208" y="207" font-size="12" fill="#888">|</text>
  <rect x="214" y="190" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="232" y="207" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">AA</text>
  <text x="256" y="207" font-size="12" fill="#888">|</text>
  <rect x="262" y="190" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="207" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">BB</text>
  <text x="304" y="207" font-size="12" fill="#888">|</text>
  <rect x="310" y="190" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="207" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">AA</text>

  <text x="356" y="200" font-size="10" fill="#4a7a3a" font-weight="bold">3 AA + 2 BB = 5 块</text>
  <text x="356" y="213" font-size="10" fill="#d6a040" font-weight="bold">+ 2 AB（放开头）</text>

  <rect x="30" y="224" width="440" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="250" y="241" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ABABAABBAABBAA = (2·2+1)×2 + 2×2 = 10+4 = 14 ✓</text>

  <!-- Summary table -->
  <text x="30" y="280" font-size="13" fill="#446688" font-weight="bold">公式验证</text>

  <rect x="30" y="292" width="500" height="150" fill="#fafafa" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>

  <text x="50" y="316" font-size="11" fill="#888" font-weight="bold">情况</text>
  <text x="170" y="316" font-size="11" fill="#888" font-weight="bold">交替块数 blocks</text>
  <text x="360" y="316" font-size="11" fill="#888" font-weight="bold">answer = 2·blocks + 2·z</text>

  <line x1="40" y1="324" x2="520" y2="324" stroke="#ddd" stroke-width="1"/>

  <text x="50" y="344" font-size="11" fill="#4a7a3a" font-weight="bold">x == y</text>
  <text x="170" y="344" font-size="11" fill="#333">2·min(x,y)</text>
  <text x="360" y="344" font-size="11" fill="#333">2·(x+y) + 2·z = 4·min + 2·z</text>

  <text x="50" y="368" font-size="11" fill="#b85450" font-weight="bold">x ≠ y</text>
  <text x="170" y="368" font-size="11" fill="#333">2·min(x,y) + 1</text>
  <text x="360" y="368" font-size="11" fill="#333">2·(2·min+1) + 2·z = 4·min+2+2·z</text>

  <line x1="40" y1="380" x2="520" y2="380" stroke="#ddd" stroke-width="1"/>

  <text x="50" y="400" font-size="10" fill="#888">示例1: min=2, x≠y → 4·2+2+2·1 = 12</text>
  <text x="50" y="418" font-size="10" fill="#888">示例2: min=2, x≠y → 4·2+2+2·2 = 14</text>

  <text x="50" y="436" font-size="10" fill="#d6a040" font-weight="bold">AB 始终全用，z 只贡献 2z 长度</text>
</svg>
