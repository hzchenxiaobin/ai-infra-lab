<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：i 从 0 按步长 2k 推进，每段反转前 k 个</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">内层反转可套用 344 的对撞双指针模板，O(n) / O(1)</text>

  <!-- Start -->
  <rect x="190" y="58" width="180" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="280" y="77" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i = 0</text>

  <path d="M 280 88 L 280 106" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: i < n ? -->
  <polygon points="280,108 380,150 280,192 180,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">i &lt; n ?</text>
  <text x="280" y="162" text-anchor="middle" font-size="9" fill="#8a6a20">（还有字符未处理）</text>

  <!-- No -->
  <text x="160" y="146" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 180 150 L 110 150" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="134" width="70" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="75" y="154" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 s</text>

  <!-- Yes -->
  <text x="300" y="208" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 280 192 L 280 216" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 计算 end = min(i+k, n) -->
  <rect x="150" y="218" width="260" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">end = min(i + k, n)</text>

  <path d="M 280 250 L 280 268" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 反转 [i, end) -->
  <rect x="120" y="270" width="320" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">reverse(s[i .. end))   ← 对撞双指针，左&lt;右则 swap</text>

  <path d="M 280 302 L 280 320" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i += 2k -->
  <rect x="190" y="322" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i ← i + 2k</text>

  <!-- loop back to diamond -->
  <path d="M 370 338 L 430 338 L 430 150 L 380 150" stroke="#666" stroke-width="1.1" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="246" font-size="9" fill="#888">回到判定</text>

  <!-- 关键提示 -->
  <rect x="30" y="382" width="500" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="42" y="402" font-size="11" fill="#8a6a20" font-weight="bold">关键：步长固定 2k，但每段「只反转前 k 个」</text>
  <text x="42" y="420" font-size="10" fill="#666">① r ≥ 2k：反转 [i, i+k)，后 k 个不动，i += 2k 继续下一段</text>
  <text x="42" y="436" font-size="10" fill="#666">② k ≤ r &lt; 2k：反转 [i, i+k)，剩余不动，本轮后 i += 2k ≥ n 自动结束</text>
  <text x="42" y="452" font-size="10" fill="#666">③ r &lt; k：end = n，反转 [i, n) 全部，i += 2k ≥ n 结束</text>
</svg>
