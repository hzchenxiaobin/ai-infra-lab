<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="560" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：求长度 → 算 base/rem → 逐段切段</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">两趟 O(n)：先求 n，再按段长 size 走 size-1 步到段尾后切断</text>

  <!-- 1. 求长度 -->
  <rect x="60" y="64" width="400" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="80" y="84" font-size="10" fill="#446688" font-weight="bold">① 求链表长度 n</text>
  <text x="80" y="100" font-size="10" fill="#333">p = head; while p: n += 1; p = p.next</text>

  <line x1="260" y1="112" x2="260" y2="128" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. 算 base / rem -->
  <rect x="60" y="132" width="400" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="80" y="152" font-size="10" fill="#8a6a20" font-weight="bold">② 整除定基长，余数补前段</text>
  <text x="80" y="168" font-size="10" fill="#333">base = n / k ;  rem = n % k ;  段长 size = base + (i &lt; rem ? 1 : 0)</text>

  <line x1="260" y1="180" x2="260" y2="196" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. 循环判段号 -->
  <polygon points="170,200 350,200 330,230 150,230" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="219" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">i &lt; k ?</text>

  <!-- No 分支：返回 -->
  <text x="362" y="218" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <path d="M 345 215 Q 420 215 420 470" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Yes 分支：记段头 -->
  <text x="150" y="250" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="160" y1="230" x2="160" y2="256" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="260" width="280" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="80" y="280" font-size="10" fill="#4a7a3a" font-weight="bold">③ 记段头</text>
  <text x="80" y="294" font-size="10" fill="#333">parts[i] = curr   ← 当前游标即该段头</text>

  <line x1="200" y1="300" x2="200" y2="316" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. 判 size == 0 -->
  <polygon points="120,320 300,320 280,348 100,348" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="338" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">size == 0 ?</text>

  <!-- Yes: continue（空段） -->
  <text x="40" y="340" font-size="10" fill="#d6a040" font-weight="bold">是</text>
  <path d="M 100 334 Q 40 334 40 215 Q 40 215 150 215" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="44" y="358" font-size="9" fill="#888">留 null，下一段</text>

  <!-- No: 走到段尾 -->
  <text x="312" y="340" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <line x1="300" y1="334" x2="320" y2="362" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="364" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="200" y="384" font-size="10" fill="#446688" font-weight="bold">④ 走到段尾</text>
  <text x="200" y="398" font-size="10" fill="#333">for step in 1..size-1: curr = curr.next</text>

  <line x1="320" y1="404" x2="320" y2="420" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. 切断 -->
  <rect x="180" y="424" width="280" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="444" font-size="10" fill="#b85450" font-weight="bold">⑤ 切断并跳到下一段头</text>
  <text x="200" y="458" font-size="10" fill="#333">nxt = curr.next   ← 先记！</text>
  <text x="200" y="470" font-size="10" fill="#333">curr.next = null;  curr = nxt</text>

  <!-- 回到循环判段号 -->
  <path d="M 320 472 Q 320 500 500 500 Q 500 215 350 215" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="496" font-size="9" fill="#888">i++，回到判段号</text>

  <!-- 6. 返回 -->
  <rect x="320" y="470" width="180" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="492" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">⑥ 返回 parts</text>

  <!-- 底部说明 -->
  <rect x="20" y="524" width="480" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="542" text-anchor="middle" font-size="10" fill="#8a6a20">要点：先记 nxt 再置空 ｜ size=0 走 continue 留 null ｜ base=0 时前 rem 段长度恰为 1，天然处理空段</text>
</svg>
