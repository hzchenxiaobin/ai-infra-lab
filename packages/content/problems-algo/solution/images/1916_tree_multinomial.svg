<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">
    树形依赖 + 多项式系数：先建根，再交错子树
  </text>

  <!-- Root node u -->
  <circle cx="280" cy="66" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="71" text-anchor="middle" font-size="13" fill="#7a3a38" font-weight="bold" filter="url(#rough2)">u</text>
  <text x="280" y="44" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">先建根</text>

  <!-- Edges root -> children -->
  <path d="M 266 80 L 150 138" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 280 86 L 280 138" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 294 80 L 410 138" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Child nodes v1 v2 v3 -->
  <circle cx="150" cy="156" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v₁</text>
  <circle cx="280" cy="156" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v₂</text>
  <circle cx="410" cy="156" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v₃</text>

  <!-- Subtree triangles -->
  <polygon points="150,176 120,232 180,232" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="222" text-anchor="middle" font-size="10" fill="#3a5a2a" filter="url(#rough2)">子树</text>
  <text x="150" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">sz=s₁</text>

  <polygon points="280,176 250,232 310,232" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="222" text-anchor="middle" font-size="10" fill="#3a5a2a" filter="url(#rough2)">子树</text>
  <text x="280" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">sz=s₂</text>

  <polygon points="410,176 380,232 440,232" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="222" text-anchor="middle" font-size="10" fill="#3a5a2a" filter="url(#rough2)">子树</text>
  <text x="410" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">sz=s₃</text>

  <!-- dp label per subtree -->
  <text x="150" y="262" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">dp[v₁] 种</text>
  <text x="280" y="262" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">dp[v₂] 种</text>
  <text x="410" y="262" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">dp[v₃] 种</text>

  <!-- Interleaving bracket -->
  <path d="M 110 276 Q 280 296 450 276" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">
    交错 (sz[u]−1) 个位置，各组内部顺序固定
  </text>

  <!-- Formula box -->
  <rect x="40" y="312" width="480" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="12" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">
    多项式系数（多重排列数）
  </text>
  <text x="280" y="356" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    dp[u] = (sz[u]−1)! · ∏ ( dp[v] / sz[v]! )
  </text>
  <text x="280" y="374" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    = (s₁+s₂+s₃)! / (s₁!·s₂!·s₃!) · dp[v₁]·dp[v₂]·dp[v₃]
  </text>
</svg>
