<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">单位段分解：把每一跳按单位长度摊开</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">段 [m, m+1] 的贡献 = 承包它的那一跳的起点值，而那一跳的起点 ≤ m</text>

  <!-- 数组格子：[1,3,1,5]，4 格 w=56 gap=12，start x=130 -->
  <rect x="130" y="86" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="158" y="111" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="158" y="140" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">0·起点</text>

  <rect x="198" y="86" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="226" y="111" text-anchor="middle" font-size="13.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="226" y="140" text-anchor="middle" font-size="10" fill="#a06a10" filter="url(#rough2)">1</text>

  <rect x="266" y="86" width="56" height="40" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="111" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="294" y="140" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>

  <rect x="334" y="86" width="56" height="40" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="362" y="111" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="362" y="140" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">3·终点</text>

  <!-- 路径弧 -->
  <path d="M 158 82 Q 192 56 226 82" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="192" y="64" text-anchor="middle" font-size="10" fill="#8a3a34" filter="url(#rough2)">0→1</text>
  <path d="M 230 80 Q 294 40 358 80" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="294" y="52" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">1→3</text>
  <text x="410" y="74" text-anchor="start" font-size="10.5" fill="#888" filter="url(#rough2)">路径 0→1→3</text>

  <!-- 行 1：路径贡献 -->
  <text x="130" y="166" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">沿路径摊开：段 [m, m+1] 记 nums[起点(m)]</text>
  <rect x="158" y="174" width="68" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="192" y="193" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="226" y="174" width="68" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="193" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="294" y="174" width="68" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="328" y="193" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="148" y="193" text-anchor="end" font-size="10.5" fill="#446688" filter="url(#rough2)">路径贡献</text>

  <path d="M 260 204 L 260 216" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 行 2：前缀最大值 -->
  <text x="130" y="236" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">每段贡献 ≤ max(nums[0..m])（前缀最大值）</text>
  <rect x="158" y="244" width="68" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="192" y="263" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="226" y="244" width="68" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="263" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="294" y="244" width="68" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="328" y="263" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="148" y="263" text-anchor="end" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">前缀 max</text>
  <text x="376" y="263" text-anchor="start" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">逐段相等 ✓</text>

  <text x="260" y="296" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">总分 = 1 + 3 + 3 = 7 = 前缀最大值之和</text>

  <!-- 底部两框：上界 / 可达 -->
  <rect x="30" y="312" width="225" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="142" y="333" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">上界：那一跳起点 ≤ m</text>
  <text x="142" y="351" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">⟹ 段 [m, m+1] 贡献</text>
  <text x="142" y="365" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">≤ max(nums[0..m])</text>

  <rect x="272" y="312" width="218" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="381" y="333" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">可达：沿「下一个更大值」落脚</text>
  <text x="381" y="351" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">落脚点 = 严格前缀最大值位置</text>
  <text x="381" y="365" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">每段恰好取满上界</text>
</svg>
