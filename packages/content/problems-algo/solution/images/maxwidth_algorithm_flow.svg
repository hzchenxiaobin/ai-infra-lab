<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="560" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：BFS 逐层处理 + 相对编号防溢出</text>

  <!-- 1. 特判 -->
  <rect x="170" y="44" width="200" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">特判 root == null → 返回 0</text>
  <line x1="270" y1="78" x2="270" y2="92" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. 初始化 -->
  <rect x="150" y="94" width="240" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="116" text-anchor="middle" font-size="12" fill="#333">队列 q = [(root, 0)]，ans = 0</text>
  <line x1="270" y1="128" x2="270" y2="142" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. 判空菱形 -->
  <polygon points="270,144 360,184 270,224 180,184" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="180" text-anchor="middle" font-size="12" fill="#333">队列 q 为空？</text>
  <text x="270" y="196" text-anchor="middle" font-size="11" fill="#888">每轮处理一整层</text>

  <!-- Yes 分支 -->
  <line x1="360" y1="184" x2="430" y2="184" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="430" y="166" width="90" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="475" y="189" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 ans</text>

  <!-- No 分支 向下 -->
  <line x1="270" y1="224" x2="270" y2="238" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="234" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- 4. 取本层首编号 -->
  <rect x="120" y="240" width="300" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="262" text-anchor="middle" font-size="12" fill="#333">size = q.size()；left = q.front().id；right = left</text>
  <line x1="270" y1="274" x2="270" y2="288" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. 循环框 -->
  <rect x="80" y="290" width="380" height="86" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="270" y="310" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">for i = 0 .. size（遍历当前层全部节点）</text>
  <text x="270" y="332" text-anchor="middle" font-size="11" fill="#333">(node, id) = q.pop_front()；right = id</text>
  <text x="270" y="350" text-anchor="middle" font-size="11" fill="#333">rel = id − left  （相对编号，避免数值爆炸）</text>
  <text x="270" y="368" text-anchor="middle" font-size="11" fill="#333">左→q.push((left, 2·rel+1))；右→q.push((right, 2·rel+2))</text>
  <line x1="270" y1="376" x2="270" y2="390" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 6. 更新 ans -->
  <rect x="120" y="392" width="300" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="414" text-anchor="middle" font-size="12" fill="#333">ans = max(ans, right − left + 1)</text>

  <!-- 回到判空菱形 -->
  <path d="M 120 409 L 60 409 L 60 184 L 180 184" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="300" font-size="11" fill="#888">本层结束</text>
  <text x="40" y="316" font-size="11" fill="#888">回到判空</text>

  <!-- 防溢出提示 -->
  <rect x="330" y="440" width="200" height="96" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="350" y="462" font-size="11" fill="#4a7a3a" font-weight="bold">为什么用 rel = id − left？</text>
  <text x="350" y="482" font-size="10" fill="#444">每层把首编号「归零」</text>
  <text x="350" y="498" font-size="10" fill="#444">孩子按相对值 2·rel+1/+2</text>
  <text x="350" y="514" font-size="10" fill="#444">编号只与本层宽度相关</text>
  <text x="350" y="530" font-size="10" fill="#b85450">避免深树 id 超过 2^63 溢出</text>
</svg>
