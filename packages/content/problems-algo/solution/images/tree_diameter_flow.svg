<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">两次 BFS 算法流程</text>

  <!-- Step 0: special case -->
  <rect x="170" y="46" width="180" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="11" fill="#333">n == 1 ? 返回 0 : 继续</text>
  <path d="M 260 80 L 260 96" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: build graph -->
  <rect x="140" y="100" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 建邻接表 g（无向，双向加边）</text>
  <path d="M 260 138 L 260 154" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: first BFS -->
  <rect x="110" y="158" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="178" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② BFS(start = 0)</text>
  <text x="260" y="194" text-anchor="middle" font-size="10" fill="#666">逐层扩散，记录最远节点 A 及距离</text>
  <path d="M 260 202 L 260 218" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: get A -->
  <rect x="160" y="222" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="244" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">得到 A = 最远节点</text>
  <path d="M 260 256 L 260 272" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: second BFS -->
  <rect x="100" y="276" width="320" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ BFS(start = A)</text>
  <text x="260" y="312" text-anchor="middle" font-size="10" fill="#666">重置 dist 数组，逐层扩散到所有节点</text>
  <path d="M 260 320 L 260 336" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: return -->
  <rect x="130" y="340" width="260" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">返回最远距离 = 直径</text>

  <!-- side annotations -->
  <text x="440" y="180" font-size="10" fill="#d6a040" font-weight="bold">第一次</text>
  <text x="440" y="194" font-size="10" fill="#d6a040">找端点</text>
  <text x="440" y="298" font-size="10" fill="#d6a040" font-weight="bold">第二次</text>
  <text x="440" y="312" font-size="10" fill="#d6a040">求长度</text>

  <!-- footer -->
  <text x="260" y="402" text-anchor="middle" font-size="10" fill="#888">每次 BFS 用队列逐层扩散，dist[v] = dist[u] + 1，O(n) 时间</text>
</svg>
