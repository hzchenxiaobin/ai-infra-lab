<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">双向累计求和找中位数：a1 ≥ N/2 且 a2 ≥ N/2</text>

  <!-- Numbers table (left) -->
  <text x="75" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Numbers（压缩表）</text>
  <rect x="20" y="64" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="48" y="81" font-size="10" fill="#333">num</text>
  <text x="92" y="81" font-size="10" fill="#333">freq</text>
  <line x1="68" y1="64" x2="68" y2="90" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="90" width="110" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="48" y="105" font-size="10" fill="#333">0</text>
  <text x="92" y="105" font-size="10" fill="#b85450" font-weight="bold">7</text>
  <line x1="68" y1="90" x2="68" y2="112" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="112" width="110" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="48" y="127" font-size="10" fill="#333">1</text>
  <text x="92" y="127" font-size="10" fill="#d6a040" font-weight="bold">1</text>
  <line x1="68" y1="112" x2="68" y2="134" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="134" width="110" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="48" y="149" font-size="10" fill="#333">2</text>
  <text x="92" y="149" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>
  <line x1="68" y1="134" x2="68" y2="156" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="156" width="110" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="48" y="171" font-size="10" fill="#333">3</text>
  <text x="92" y="171" font-size="10" fill="#d6a040" font-weight="bold">1</text>
  <line x1="68" y1="156" x2="68" y2="178" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="75" y="196" text-anchor="middle" font-size="9.5" fill="#888">N = Σfreq = 12</text>
  <text x="75" y="210" text-anchor="middle" font-size="9.5" fill="#888">N/2 = 6</text>

  <!-- expand arrow -->
  <path d="M140 128 L185 128" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="162" y="122" text-anchor="middle" font-size="9" fill="#4a7a3a">展开</text>

  <!-- Expanded sequence (middle) -->
  <text x="370" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">展开排序后的序列（位置 1..12）</text>
  <rect x="195" y="64" width="350" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="220" y="80" font-size="9.5" fill="#333">0</text>
  <text x="248" y="80" font-size="9.5" fill="#333">0</text>
  <text x="276" y="80" font-size="9.5" fill="#333">0</text>
  <text x="304" y="80" font-size="9.5" fill="#333">0</text>
  <text x="332" y="80" font-size="9.5" fill="#333">0</text>
  <text x="360" y="80" font-size="9.5" fill="#333">0</text>
  <text x="388" y="80" font-size="9.5" fill="#333">0</text>
  <text x="416" y="80" font-size="9.5" fill="#333">1</text>
  <text x="444" y="80" font-size="9.5" fill="#333">2</text>
  <text x="472" y="80" font-size="9.5" fill="#333">2</text>
  <text x="500" y="80" font-size="9.5" fill="#333">2</text>
  <text x="528" y="80" font-size="9.5" fill="#333">3</text>

  <text x="220" y="100" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="248" y="100" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="276" y="100" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="304" y="100" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="332" y="100" text-anchor="middle" font-size="9" fill="#888">5</text>
  <text x="360" y="100" text-anchor="middle" font-size="9" fill="#888">6</text>
  <text x="388" y="100" text-anchor="middle" font-size="9" fill="#888">7</text>
  <text x="416" y="100" text-anchor="middle" font-size="9" fill="#888">8</text>
  <text x="444" y="100" text-anchor="middle" font-size="9" fill="#888">9</text>
  <text x="472" y="100" text-anchor="middle" font-size="9" fill="#888">10</text>
  <text x="500" y="100" text-anchor="middle" font-size="9" fill="#888">11</text>
  <text x="528" y="100" text-anchor="middle" font-size="9" fill="#888">12</text>

  <!-- median bracket: positions 6 and 7 -->
  <path d="M346 110 L346 122 L374 122 L374 110" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="360" y="136" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">中位区间</text>
  <text x="360" y="148" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">N/2=6</text>

  <!-- a1 ascending arrow -->
  <path d="M215 158 L525 158" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="370" y="172" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">a1 = SUM(freq) OVER (ORDER BY num ↑) 升序累计</text>

  <!-- a2 descending arrow -->
  <path d="M525 192 L215 192" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="370" y="206" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">a2 = SUM(freq) OVER (ORDER BY num ↓) 降序累计</text>

  <!-- key takeaway box -->
  <rect x="40" y="240" width="540" height="142" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="264" font-size="11.5" fill="#333" font-weight="bold">核心：中位数 = 同时满足「左侧累计 ≥ N/2」与「右侧累计 ≥ N/2」的 num</text>
  <text x="60" y="286" font-size="10.5" fill="#555">• a1（升序累计）≥ N/2  →  「≤ num 的出现次数」不少于一半</text>
  <text x="60" y="304" font-size="10.5" fill="#555">• a2（降序累计）≥ N/2  →  「≥ num 的出现次数」不少于一半</text>
  <text x="60" y="322" font-size="10.5" fill="#555">• 奇数个：唯一一个 num 同时满足两条 → 即为中位数</text>
  <text x="60" y="340" font-size="10.5" fill="#555">• 偶数个：可能两个相邻 num 都满足 → AVG 取均值</text>
  <text x="60" y="360" font-size="10.5" fill="#4a7a3a">💡 用双向累计避免「真正展开」序列，O(n) 空间 O(n log n) 时间</text>
</svg>
