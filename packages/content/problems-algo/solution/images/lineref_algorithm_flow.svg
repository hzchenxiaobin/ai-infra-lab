<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：扫描定轴 → 哈希验证</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">O(n) = 一次扫描定轴 + 一次扫描验证</text>

  <g font-size="10" fill="#333">
    <!-- Step 1: build set -->
    <rect x="40" y="64" width="440" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="84" font-size="12" fill="#446688" font-weight="bold">① 建哈希集合</text>
    <text x="170" y="84" font-family="monospace" font-size="10" fill="#555">point_set = {(x, y) for p in points}</text>
    <text x="54" y="102" font-size="9" fill="#888">把所有点放入集合（天然去重），支持 O(1) 查"某点是否存在"</text>

    <path d="M 260 118 L 260 132" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 2: find axis -->
    <rect x="40" y="136" width="440" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="156" font-size="12" fill="#4a7a3a" font-weight="bold">② 扫描定轴</text>
    <text x="150" y="156" font-family="monospace" font-size="10" fill="#555">min_x = min(x);  max_x = max(x)</text>
    <text x="54" y="174" font-family="monospace" font-size="10" fill="#4a7a3a">sum = min_x + max_x   // 即 2c，整数无浮点</text>
    <text x="54" y="190" font-size="9" fill="#888">对称轴被极值唯一确定，无需枚举</text>

    <path d="M 260 204 L 260 218" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 3: verify -->
    <rect x="40" y="222" width="440" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="242" font-size="12" fill="#d6a040" font-weight="bold">③ 逐点验证镜像</text>
    <text x="200" y="242" font-family="monospace" font-size="10" fill="#555">for (x, y) in points:</text>
    <text x="54" y="260" font-family="monospace" font-size="10" fill="#d6a040">  mirror = (sum - x, y)</text>
    <text x="54" y="276" font-family="monospace" font-size="10" fill="#b85450">  if mirror not in point_set: return false</text>
    <text x="54" y="290" font-size="9" fill="#888">镜像 x 坐标 = sum − x（整数运算，零精度误差）</text>

    <path d="M 260 300 L 260 314" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 4: result -->
    <rect x="40" y="318" width="440" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="338" font-size="12" fill="#b85450" font-weight="bold">④ 全部命中</text>
    <text x="170" y="338" font-family="monospace" font-size="10" fill="#555">return true</text>
    <text x="54" y="354" font-size="9" fill="#888">所有点都有镜像 → 点集关于 x = sum / 2 对称</text>

    <!-- Complexity bar -->
    <rect x="40" y="378" width="440" height="48" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
    <text x="260" y="398" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">时间 O(n) · 空间 O(n) · 全程整数运算</text>
    <text x="260" y="414" text-anchor="middle" font-size="9" fill="#888">对称轴位置 O(1) 确定，无需搜索</text>
  </g>
</svg>
