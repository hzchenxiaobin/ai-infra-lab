<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：互质 ⟺ 前/后缀质因子集不相交</text>
  <text x="290" y="46" text-anchor="middle" font-size="10.5" fill="#888">gcd(前缀积, 后缀积)=1 ⟺ 没有质数同时整除两侧乘积（无共享质因子）</text>

  <!-- ===== Valid case ===== -->
  <text x="40" y="74" font-size="11.5" fill="#4a7a3a" font-weight="bold">① 有效分割 i=2：两侧质因子不相交</text>

  <!-- cells 4 7 8 | 15 3 5 ; cell w=46 gap=6 start x=66 -->
  <g filter="url(#rough2)"><rect x="66" y="84" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="89" y="104" text-anchor="middle" font-size="13" fill="#224466">4</text>
  <g filter="url(#rough2)"><rect x="118" y="84" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="141" y="104" text-anchor="middle" font-size="13" fill="#224466">7</text>
  <g filter="url(#rough2)"><rect x="170" y="84" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="193" y="104" text-anchor="middle" font-size="13" fill="#224466">8</text>
  <g filter="url(#rough2)"><rect x="222" y="84" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="245" y="104" text-anchor="middle" font-size="13" fill="#3a5a2a">15</text>
  <g filter="url(#rough2)"><rect x="274" y="84" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="297" y="104" text-anchor="middle" font-size="13" fill="#3a5a2a">3</text>
  <g filter="url(#rough2)"><rect x="326" y="84" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="349" y="104" text-anchor="middle" font-size="13" fill="#3a5a2a">5</text>

  <!-- prime factor tags -->
  <text x="89" y="132" text-anchor="middle" font-size="10" fill="#666">质因子: 2</text>
  <text x="141" y="132" text-anchor="middle" font-size="10" fill="#666">质因子: 7</text>
  <text x="193" y="132" text-anchor="middle" font-size="10" fill="#666">质因子: 2</text>
  <text x="245" y="132" text-anchor="middle" font-size="10" fill="#666">质因子: 3,5</text>
  <text x="297" y="132" text-anchor="middle" font-size="10" fill="#666">质因子: 3</text>
  <text x="349" y="132" text-anchor="middle" font-size="10" fill="#666">质因子: 5</text>

  <!-- dashed split line -->
  <path d="M 219 78 L 219 150" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="219" y="72" text-anchor="middle" font-size="9.5" fill="#b85450">split i=2</text>

  <!-- set boxes -->
  <g filter="url(#rough2)"><rect x="66" y="160" width="100" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="116" y="177" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">前缀 {2, 7}</text>
  <g filter="url(#rough2)"><rect x="272" y="160" width="100" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="322" y="177" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">后缀 {3, 5}</text>
  <text x="219" y="177" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">∩ = ∅</text>
  <text x="404" y="177" font-size="11.5" fill="#4a7a3a" font-weight="bold">→ gcd = 1 ✓</text>

  <!-- ===== Invalid case ===== -->
  <text x="40" y="214" font-size="11.5" fill="#b85450" font-weight="bold">② 无效分割 i=2：质因子 2 / 3 / 5 跨越分割线</text>

  <g filter="url(#rough2)"><rect x="66" y="224" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="89" y="244" text-anchor="middle" font-size="13" fill="#224466">4</text>
  <g filter="url(#rough2)"><rect x="118" y="224" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="141" y="244" text-anchor="middle" font-size="13" fill="#224466">7</text>
  <g filter="url(#rough2)"><rect x="170" y="224" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="193" y="244" text-anchor="middle" font-size="13" fill="#224466">15</text>
  <g filter="url(#rough2)"><rect x="222" y="224" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="245" y="244" text-anchor="middle" font-size="13" fill="#3a5a2a">8</text>
  <g filter="url(#rough2)"><rect x="274" y="224" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="297" y="244" text-anchor="middle" font-size="13" fill="#3a5a2a">3</text>
  <g filter="url(#rough2)"><rect x="326" y="224" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="349" y="244" text-anchor="middle" font-size="13" fill="#3a5a2a">5</text>

  <text x="89" y="272" text-anchor="middle" font-size="10" fill="#666">质因子: 2</text>
  <text x="141" y="272" text-anchor="middle" font-size="10" fill="#666">质因子: 7</text>
  <text x="193" y="272" text-anchor="middle" font-size="10" fill="#666">质因子: 3,5</text>
  <text x="245" y="272" text-anchor="middle" font-size="10" fill="#666">质因子: 2</text>
  <text x="297" y="272" text-anchor="middle" font-size="10" fill="#666">质因子: 3</text>
  <text x="349" y="272" text-anchor="middle" font-size="10" fill="#666">质因子: 5</text>

  <path d="M 219 218 L 219 296" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="219" y="212" text-anchor="middle" font-size="9.5" fill="#b85450">split i=2</text>

  <!-- bracket under cells indicating crossing -->
  <path d="M 66 286 L 66 292 L 372 292 L 372 286" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="219" y="308" text-anchor="middle" font-size="10.5" fill="#b85450">质因子 {2, 3, 5} 在前缀与后缀都出现 → 跨越分割线</text>

  <g filter="url(#rough2)"><rect x="56" y="316" width="120" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="116" y="333" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">前缀 {2,3,5,7}</text>
  <g filter="url(#rough2)"><rect x="266" y="316" width="100" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="316" y="333" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">后缀 {2,3,5}</text>
  <text x="219" y="333" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">∩={2,3,5}</text>
  <text x="404" y="333" font-size="11.5" fill="#b85450" font-weight="bold">→ gcd ≥ 2 ✗</text>

  <!-- summary -->
  <text x="290" y="378" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">结论：分割 i 有效 ⟺ 前缀出现的每个质数 p，其最后出现位置 last[p] ≤ i（不进入后缀）</text>
  <text x="290" y="402" text-anchor="middle" font-size="11" fill="#446688">→ 转化为「质因子最后出现位置」的右边界推进问题，同构于 763 划分字母区间</text>
</svg>
