<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：日产 ÷ 配对 → 最小化「最大天数」</text>

  <!-- Worker box -->
  <rect x="40" y="48" width="180" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="70" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">工人 j</text>
  <text x="130" y="89" text-anchor="middle" font-size="11" fill="#446688">日产 = workers[j]（每天工时）</text>

  <!-- Job box -->
  <rect x="340" y="48" width="180" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="70" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">工作 i</text>
  <text x="430" y="89" text-anchor="middle" font-size="11" fill="#d6a040">工时 = jobs[i]（总量）</text>

  <!-- arrows to formula -->
  <path d="M 130 100 L 230 120" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 430 100 L 330 120" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Formula box -->
  <rect x="110" y="124" width="340" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">天数 d = ⌈ jobs[i] / workers[j] ⌉</text>
  <text x="280" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a">工人并行 → 总天数 = max(d)，求其最小</text>

  <!-- Divider -->
  <path d="M 40 188 L 520 188" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Greedy pairing title -->
  <text x="280" y="208" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">排序后「同序配对」：小工配慢人，大工配快人</text>

  <!-- jobs sorted ascending row -->
  <text x="46" y="238" font-size="11" fill="#888">jobs↑</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="80" y="224" width="64" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="112" y="246">2</text>
    <rect x="168" y="224" width="64" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="200" y="246">4</text>
    <rect x="256" y="224" width="64" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="288" y="246">5</text>
    <text x="340" y="246" font-size="12" fill="#888">（升序）</text>
  </g>

  <!-- pairing double arrows -->
  <path d="M 112 260 L 112 296" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 200 260 L 200 296" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 288 260 L 288 296" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ratio labels (between) -->
  <text x="138" y="282" font-size="11" fill="#4a7a3a">⌈2/1⌉=2</text>
  <text x="226" y="282" font-size="11" fill="#888">⌈4/5⌉=1</text>
  <text x="314" y="282" font-size="11" fill="#888">⌈5/7⌉=1</text>

  <!-- workers sorted ascending row -->
  <text x="46" y="320" font-size="11" fill="#888">work↑</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="80" y="306" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="112" y="328">1</text>
    <rect x="168" y="306" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="200" y="328">5</text>
    <rect x="256" y="306" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="288" y="328">7</text>
    <text x="340" y="328" font-size="11" fill="#888">（慢→快）</text>
  </g>

  <!-- max highlight -->
  <rect x="78" y="350" width="68" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="112" y="368" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">瓶颈 = 2</text>
  <path d="M 112 376 L 112 392" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- answer -->
  <rect x="80" y="396" width="220" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="190" y="416" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans = max(⌈jobs[i]/workers[i]⌉) = 2</text>

  <!-- side note -->
  <rect x="320" y="350" width="216" height="78" fill="#fafafa" stroke="#888" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="330" y="370" font-size="11" fill="#666">⚠ 若交叉配对（小工给快人）：</text>
  <text x="330" y="388" font-size="11" fill="#b85450">大工落到慢人 → ⌈5/1⌉=5</text>
  <text x="330" y="404" font-size="11" fill="#b85450">max 飙到 5 &gt; 2，更差</text>
  <text x="330" y="420" font-size="10.5" fill="#666">故同序配对最优</text>
</svg>
