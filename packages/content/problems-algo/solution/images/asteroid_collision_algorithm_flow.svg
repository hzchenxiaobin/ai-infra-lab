<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">栈模拟算法流程</text>

  <!-- Start -->
  <rect x="225" y="40" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#333">遍历每个小行星 a</text>

  <!-- Arrow down -->
  <path d="M 280 70 L 280 84" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: a > 0? -->
  <polygon points="280,86 370,126 280,166 190,126" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="12" fill="#333">a &gt; 0?</text>
  <text x="280" y="140" text-anchor="middle" font-size="10" fill="#888">(向右)</text>

  <!-- Yes branch: push -->
  <path d="M 370 126 L 420 126" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="118" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="420" y="110" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="130" text-anchor="middle" font-size="11" fill="#333">push(a) 入栈</text>

  <!-- No branch: collision check -->
  <path d="M 280 166 L 280 184" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="180" font-size="11" fill="#b85450" font-weight="bold">否(向左)</text>

  <!-- Decision: stack non-empty & top > 0? -->
  <polygon points="280,186 390,226 280,266 170,226" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="220" text-anchor="middle" font-size="11" fill="#333">栈非空 且</text>
  <text x="280" y="236" text-anchor="middle" font-size="11" fill="#333">栈顶 &gt; 0?</text>
  <text x="280" y="252" text-anchor="middle" font-size="10" fill="#888">(向右→碰撞)</text>

  <!-- No: push a -->
  <path d="M 170 226 L 110 226" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="218" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="20" y="210" width="88" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="64" y="230" text-anchor="middle" font-size="11" fill="#333">push(a)</text>

  <!-- Yes: compare abs values -->
  <path d="M 280 266 L 280 284" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="280" font-size="11" fill="#d6a040" font-weight="bold">是</text>

  <!-- Three-way decision -->
  <polygon points="280,286 390,316 310,346 250,346 170,316" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#333">比较 |a| 与 栈顶</text>

  <!-- top < |a| -->
  <path d="M 170 316 L 120 316" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="310" font-size="10" fill="#b85450">栈顶&lt;|a|</text>
  <rect x="20" y="300" width="88" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="64" y="316" text-anchor="middle" font-size="10" fill="#333">pop() 栈顶</text>
  <text x="64" y="328" text-anchor="middle" font-size="10" fill="#888">继续比较</text>

  <!-- top == |a| -->
  <path d="M 250 346 L 180 366" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="195" y="360" font-size="10" fill="#b85450">=|a|</text>
  <rect x="90" y="356" width="88" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="134" y="376" text-anchor="middle" font-size="10" fill="#333">pop() 都爆炸</text>

  <!-- top > |a| -->
  <path d="M 310 346 L 380 366" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="360" font-size="10" fill="#b85450">栈顶&gt;|a|</text>
  <rect x="380" y="356" width="88" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="424" y="376" text-anchor="middle" font-size="10" fill="#333">a 爆炸，跳过</text>

  <!-- Loop back arrow -->
  <path d="M 470 110 L 470 86 L 280 86 L 280 84" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="480" y="80" font-size="10" fill="#888">下一个小行星</text>
</svg>
