<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">前往目标的最小代价：只取关键位置做 Dijkstra</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">网格 10⁵×10⁵ 太大 → 节点 = 起点 + 终点 + 道路两端</text>

  <!-- grid lines -->
  <g stroke="#e0e0e0" stroke-width="0.5" filter="url(#rough2)">
    <line x1="100" y1="100" x2="100" y2="310"/>
    <line x1="180" y1="100" x2="180" y2="310"/>
    <line x1="260" y1="100" x2="260" y2="310"/>
    <line x1="340" y1="100" x2="340" y2="310"/>
    <line x1="100" y1="100" x2="340" y2="100"/>
    <line x1="100" y1="150" x2="340" y2="150"/>
    <line x1="100" y1="200" x2="340" y2="200"/>
    <line x1="100" y1="250" x2="340" y2="250"/>
    <line x1="100" y1="300" x2="340" y2="300"/>
  </g>

  <!-- axis labels -->
  <text x="100" y="324" text-anchor="middle" font-size="9" fill="#aaa">x=1</text>
  <text x="340" y="324" text-anchor="middle" font-size="9" fill="#aaa">x=4</text>
  <text x="88" y="304" text-anchor="end" font-size="9" fill="#aaa">y=1</text>
  <text x="88" y="104" text-anchor="end" font-size="9" fill="#aaa">y=5</text>

  <!-- direct path (gray dashed) -->
  <path d="M 112 288 L 328 112" stroke="#ccc" stroke-width="1.5" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="232" y="195" font-size="10" fill="#bbb" font-weight="bold" transform="rotate(-37 232 195)">直接步行 = 7</text>

  <!-- optimal path segments -->
  <!-- (1,1) → (1,2) walk 1 -->
  <path d="M 100 282 L 100 258" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="60" y="272" font-size="10" fill="#4a7a3a" font-weight="bold">步 1</text>

  <!-- (1,2) → (3,3) road 0 cost 2 -->
  <path d="M 112 242 L 248 208" stroke="#d6a040" stroke-width="2.4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="175" y="210" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">道路 2</text>

  <!-- (3,3) → (3,4) walk 1 -->
  <path d="M 260 188 L 260 162" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="278" y="178" font-size="10" fill="#4a7a3a" font-weight="bold">步 1</text>

  <!-- (3,4) → (4,5) road 1 cost 1 -->
  <path d="M 272 138 L 328 112" stroke="#d6a040" stroke-width="2.4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="310" y="140" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">道路 1</text>

  <!-- points -->
  <!-- Start (1,1) -->
  <ellipse cx="100" cy="295" rx="18" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="100" y="299" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">S</text>
  <text x="100" y="338" text-anchor="middle" font-size="9" fill="#446688">(1,1) 起点</text>

  <!-- road0 start (1,2) -->
  <ellipse cx="100" cy="248" rx="14" ry="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="252" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">A</text>
  <text x="70" y="240" font-size="9" fill="#888">(1,2)</text>

  <!-- road0 end (3,3) -->
  <ellipse cx="260" cy="198" rx="14" ry="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="202" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">B</text>
  <text x="260" y="182" text-anchor="middle" font-size="9" fill="#888">(3,3)</text>

  <!-- road1 start (3,4) -->
  <ellipse cx="260" cy="148" rx="14" ry="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="152" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">C</text>
  <text x="284" y="142" font-size="9" fill="#888">(3,4)</text>

  <!-- Target (4,5) -->
  <ellipse cx="340" cy="100" rx="18" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="340" y="104" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">T</text>
  <text x="340" y="84" text-anchor="middle" font-size="9" fill="#b85450">(4,5) 终点</text>

  <!-- result box -->
  <rect x="380" y="100" width="148" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="454" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最优代价 = 5</text>
  <text x="454" y="138" text-anchor="middle" font-size="9" fill="#666">1+2+1+1 = 5</text>
  <text x="454" y="150" text-anchor="middle" font-size="9" fill="#aaa">vs 直接步行 7</text>

  <!-- insight box -->
  <rect x="380" y="170" width="148" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="454" y="190" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">关键观察</text>
  <text x="390" y="208" font-size="9" fill="#444">节点 = 起点 + 终点</text>
  <text x="390" y="222" font-size="9" fill="#444">       + 道路两端</text>
  <text x="390" y="240" font-size="9" fill="#444">边 = 曼哈顿距离</text>
  <text x="390" y="254" font-size="9" fill="#444">   + 特殊道路(有向)</text>
  <text x="390" y="270" font-size="9" fill="#b85450" font-weight="bold">→ Dijkstra</text>

  <!-- legend -->
  <g font-size="9" fill="#666">
    <line x1="80" y1="360" x2="108" y2="360" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="116" y="364">步行（曼哈顿距离）</text>
    <line x1="240" y1="360" x2="268" y2="360" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="276" y="364">特殊道路</text>
    <line x1="360" y1="360" x2="388" y2="360" stroke="#ccc" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>
    <text x="396" y="364">直接步行（对照）</text>
  </g>

  <text x="270" y="388" text-anchor="middle" font-size="9" fill="#aaa">示例 1：start=[1,1], target=[4,5], roads=[[1,2,3,3,2],[3,4,4,5,1]]</text>
</svg>
