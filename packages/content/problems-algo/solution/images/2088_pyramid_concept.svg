<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrDn" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#446688"/>
    </marker>
    <marker id="arrUp" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto">
      <path d="M0,7 L4,0 L8,7 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">金字塔 vs 倒金字塔</text>

  <!-- ===== Left: Pyramid (apex at top) ===== -->
  <text x="130" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">金字塔 (apex 在顶部)</text>

  <!-- Row 0: apex -->
  <rect x="117" y="66" width="26" height="26" fill="#6c8ebf" fill-opacity="0.85" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough)"/>
  <text x="130" y="83" text-anchor="middle" font-size="11" fill="#fff">1</text>
  <!-- Row 1: 3 cells -->
  <rect x="89" y="94" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough)"/>
  <rect x="117" y="94" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough)"/>
  <rect x="145" y="94" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough)"/>
  <!-- Row 2: 5 cells -->
  <rect x="61" y="122" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough)"/>
  <rect x="89" y="122" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough)"/>
  <rect x="117" y="122" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough)"/>
  <rect x="145" y="122" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough)"/>
  <rect x="173" y="122" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough)"/>

  <!-- apex arrow -->
  <path d="M 130 42 L 130 62" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrDn)" filter="url(#rough2)"/>
  <text x="148" y="46" font-size="10" fill="#446688">apex</text>

  <!-- height bracket -->
  <path d="M 205 66 L 212 66 L 212 148 L 205 148" stroke="#aaa" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="218" y="111" font-size="10" fill="#888">h=3</text>

  <text x="130" y="172" text-anchor="middle" font-size="11" fill="#555">贡献 h−1 = 2 个金字塔</text>
  <text x="130" y="188" text-anchor="middle" font-size="10" fill="#888">(高度 2、高度 3 各算 1 个)</text>

  <!-- Divider -->
  <line x1="260" y1="48" x2="260" y2="200" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Right: Inverted pyramid (apex at bottom) ===== -->
  <text x="385" y="52" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">倒金字塔 (apex 在底部)</text>

  <!-- Row 0: 5 cells -->
  <rect x="316" y="66" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough)"/>
  <rect x="344" y="66" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough)"/>
  <rect x="372" y="66" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough)"/>
  <rect x="400" y="66" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough)"/>
  <rect x="428" y="66" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough)"/>
  <!-- Row 1: 3 cells -->
  <rect x="344" y="94" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough)"/>
  <rect x="372" y="94" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough)"/>
  <rect x="400" y="94" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough)"/>
  <!-- Row 2: apex -->
  <rect x="372" y="122" width="26" height="26" fill="#d6a040" fill-opacity="0.85" stroke="#b8860b" stroke-width="2" rx="3" filter="url(#rough)"/>
  <text x="385" y="139" text-anchor="middle" font-size="11" fill="#fff">1</text>

  <!-- apex arrow (from below pointing up) -->
  <path d="M 385 168 L 385 152" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrUp)" filter="url(#rough2)"/>
  <text x="403" y="164" font-size="10" fill="#d6a040">apex</text>

  <!-- height bracket -->
  <path d="M 315 66 L 308 66 L 308 148 L 315 148" stroke="#aaa" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="282" y="111" font-size="10" fill="#888">h=3</text>

  <text x="385" y="188" text-anchor="middle" font-size="11" fill="#555">贡献 h−1 = 2 个倒金字塔</text>

  <!-- Bottom explanation -->
  <rect x="40" y="212" width="440" height="112" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="237" font-size="11.5" fill="#444">• 每个 apex 的最大高度 f 决定该 apex 贡献 max(0, f − 1) 个金字塔</text>
  <text x="60" y="257" font-size="11.5" fill="#444">• 高度 1 = 单格，题目要求格子数 &gt; 1，不计入</text>
  <text x="60" y="277" font-size="11.5" fill="#444">• 同一 apex 的不同高度各自独立计数（高度 2, 3, …, f 共 f−1 个）</text>
  <text x="60" y="297" font-size="11.5" fill="#444">• 倒金字塔同理，仅方向翻转</text>
  <text x="60" y="315" font-size="10.5" fill="#888">关键：求出每个 apex 的最大高度 f，再累加所有 (f − 1)</text>
</svg>
