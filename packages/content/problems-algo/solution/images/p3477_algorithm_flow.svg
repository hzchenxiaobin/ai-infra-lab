<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="16" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">逐水果模拟：找到第一个装得下的篮子就占用，扫到头就计数</text>

  <rect x="175" y="26" width="170" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="43" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">unplaced = 0</text>

  <path d="M 260 52 L 260 60" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="175" y="62" width="170" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="81" text-anchor="middle" font-size="11" fill="#333">取下一种水果 f</text>

  <path d="M 260 92 L 260 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="99" font-size="9" fill="#666">j = 0（从最左篮子起）</text>

  <polygon points="200,124 260,102 320,124 260,146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="121" text-anchor="middle" font-size="10.5" fill="#333">水果都</text>
  <text x="260" y="135" text-anchor="middle" font-size="10.5" fill="#333">处理完？</text>

  <path d="M 320 124 L 373 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340" y="117" font-size="9.5" fill="#666">是</text>
  <rect x="375" y="110" width="115" height="28" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="432" y="128" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回 unplaced</text>

  <path d="M 260 146 L 260 158" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="156" font-size="9.5" fill="#666">否</text>

  <polygon points="165,190 260,162 355,190 260,218" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="183" text-anchor="middle" font-size="10.5" fill="#333">j &lt; n 且</text>
  <text x="260" y="197" text-anchor="middle" font-size="10.5" fill="#333">baskets[j] &lt; f ?</text>

  <path d="M 355 190 L 383 190" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="366" y="183" font-size="9.5" fill="#666">是</text>
  <rect x="385" y="175" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="188" text-anchor="middle" font-size="10" fill="#333">j++</text>
  <text x="430" y="200" text-anchor="middle" font-size="10" fill="#333">继续右扫</text>

  <path d="M 430 175 L 430 152 L 262 152 L 262 159" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 260 218 L 260 230" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="228" font-size="9.5" fill="#666">否</text>

  <polygon points="195,254 260,232 325,254 260,276" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="251" text-anchor="middle" font-size="10.5" fill="#333">j &lt; n ?</text>
  <text x="260" y="265" text-anchor="middle" font-size="9" fill="#888">（找到篮子？）</text>

  <path d="M 195 254 L 140 254" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="247" font-size="9.5" fill="#666">否，扫到头</text>
  <rect x="45" y="239" width="95" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="258" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">unplaced++</text>

  <path d="M 260 276 L 260 288" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="286" font-size="9.5" fill="#666">是，找到</text>

  <rect x="165" y="290" width="190" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="309" text-anchor="middle" font-size="10.5" fill="#333">放入：baskets[j] ← 0（占用）</text>

  <path d="M 260 320 L 260 342 L 32 342 L 32 77 L 173 77" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 45 254 L 32 254" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="95" y="71" font-size="9.5" fill="#666">下一种水果</text>

  <text x="430" y="232" text-anchor="middle" font-size="9" fill="#888">占用的篮子已置 0，</text>
  <text x="430" y="246" text-anchor="middle" font-size="9" fill="#888">天然不满足条件</text>
</svg>
