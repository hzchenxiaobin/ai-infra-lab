<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="30" y="22" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：候选只有前缀 n 个 + 后缀 n 个，逐个试除到 √x 即可</text>

  <!-- 面板一：3137 的前缀与后缀 -->
  <rect x="20" y="38" width="520" height="246" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="58" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">① num = 3137：前缀从左往右长，后缀从右往左长，每个都要是质数</text>

  <!-- 前缀行 -->
  <text x="36" y="96" font-size="11" fill="#33506b" filter="url(#rough2)">前缀</text>
  <text x="36" y="110" font-size="10" fill="#33506b" filter="url(#rough2)">（前 k 位）</text>
  <rect x="196" y="76" width="44" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="218" y="97" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">3</text>
  <rect x="248" y="76" width="44" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="97" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">31</text>
  <rect x="300" y="76" width="44" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="322" y="97" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">313</text>
  <rect x="352" y="76" width="44" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="374" y="97" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">3137</text>
  <text x="404" y="97" font-size="11" fill="#4a7a3a" filter="url(#rough2)">全是质数 ✓</text>

  <!-- 前缀生长箭头（蓝色） -->
  <path d="M 229 154 C 229 138 218 132 218 116" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 252 154 C 252 136 270 132 270 116" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 271 154 C 271 130 322 132 322 116" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 290 154 C 290 126 374 130 374 116" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 数字本体 -->
  <text x="196" y="184" text-anchor="end" font-size="12" fill="#33506b" filter="url(#rough2)">num =</text>
  <rect x="210" y="158" width="38" height="42" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="229" y="185" text-anchor="middle" font-size="15" fill="#33506b" filter="url(#rough2)">3</text>
  <rect x="256" y="158" width="38" height="42" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="275" y="185" text-anchor="middle" font-size="15" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="302" y="158" width="38" height="42" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="321" y="185" text-anchor="middle" font-size="15" fill="#33506b" filter="url(#rough2)">3</text>
  <rect x="348" y="158" width="38" height="42" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="367" y="185" text-anchor="middle" font-size="15" fill="#33506b" filter="url(#rough2)">7</text>

  <!-- 后缀生长箭头（绿色） -->
  <path d="M 367 204 C 367 210 367 210 367 216" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 344 204 C 344 214 318 206 318 216" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 321 204 C 321 216 266 202 266 216" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 298 204 C 298 218 214 198 214 216" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 后缀行 -->
  <text x="36" y="240" font-size="11" fill="#2d5a24" filter="url(#rough2)">后缀</text>
  <text x="36" y="254" font-size="10" fill="#2d5a24" filter="url(#rough2)">（后 k 位）</text>
  <rect x="192" y="220" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="214" y="241" text-anchor="middle" font-size="13" fill="#2d5a24" filter="url(#rough2)">3137</text>
  <rect x="244" y="220" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="266" y="241" text-anchor="middle" font-size="13" fill="#2d5a24" filter="url(#rough2)">137</text>
  <rect x="296" y="220" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="318" y="241" text-anchor="middle" font-size="13" fill="#2d5a24" filter="url(#rough2)">37</text>
  <rect x="348" y="220" width="38" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="367" y="241" text-anchor="middle" font-size="13" fill="#2d5a24" filter="url(#rough2)">7</text>
  <text x="394" y="241" font-size="11" fill="#4a7a3a" filter="url(#rough2)">全是质数 ✓</text>

  <text x="36" y="276" font-size="10.5" fill="#33506b" filter="url(#rough2)">n ≤ 10 位 ⇒ 前缀 + 后缀至多 20 个候选，每个试除到 √x ≤ √10⁹ ≈ 3.2 万</text>

  <!-- 面板二：剪枝 -->
  <rect x="20" y="292" width="520" height="122" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="314" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">② 免费剪枝：数字组成被锁死，看一眼就能毙掉绝大多数输入</text>
  <text x="36" y="340" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">• 首位 ∈ {2,3,5,7} —— 长度 1 的前缀必须是质数</text>
  <text x="36" y="364" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">• 末位 ∈ {3,7} —— 既是一位后缀（须为质数），又是多位质数的个位（1/3/7/9），取交集</text>
  <text x="36" y="388" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">• 中间位 ∈ {1,3,7,9} —— 每个中间位都是某个多位前缀的末位</text>
  <text x="36" y="408" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">6k±1 试除后总账 ≈ 2×10⁵ 次取模 —— 微秒级收官</text>
</svg>
