<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：钢筋分三组，两组等高求最大</text>

  <!-- 广告牌（顶部横板）-->
  <rect x="120" y="52" width="320" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">广告牌（横板）</text>

  <!-- 左支架（绿色，高度=6）-->
  <rect x="140" y="74" width="50" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="165" y="130" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="165" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a">左支架</text>

  <!-- 右支架（绿色，高度=6）-->
  <rect x="370" y="74" width="50" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="130" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="395" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a">右支架</text>

  <!-- 等高标注 -->
  <path d="M 165 74 L 165 64 L 395 64 L 395 74" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">两边等高 → 广告牌高度 = 6</text>

  <!-- 钢筋分组（底部）-->
  <text x="280" y="212" text-anchor="middle" font-size="12" fill="#888">rods = [1, 2, 3, 6]</text>

  <!-- 左支架钢筋 -->
  <rect x="100" y="226" width="120" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="244" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">左支架组</text>
  <rect x="108" y="252" width="26" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="121" y="268" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>
  <rect x="138" y="252" width="26" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="151" y="268" text-anchor="middle" font-size="11" fill="#4a7a3a">2</text>
  <rect x="168" y="252" width="26" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="181" y="268" text-anchor="middle" font-size="11" fill="#4a7a3a">3</text>
  <text x="200" y="268" font-size="13" fill="#4a7a3a" font-weight="bold">=6</text>

  <!-- 右支架钢筋 -->
  <rect x="340" y="226" width="120" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="244" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">右支架组</text>
  <rect x="378" y="252" width="34" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="395" y="268" text-anchor="middle" font-size="11" fill="#4a7a3a">6</text>
  <text x="420" y="268" font-size="13" fill="#4a7a3a" font-weight="bold">=6</text>

  <!-- 未使用组（空）-->
  <rect x="240" y="226" width="80" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">未使用</text>
  <text x="280" y="268" text-anchor="middle" font-size="11" fill="#888">（空）</text>

  <!-- 连线：左支架组 → 左支架 -->
  <path d="M 160 226 L 165 174" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- 连线：右支架组 → 右支架 -->
  <path d="M 400 226 L 395 174" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 底部说明 -->
  <rect x="30" y="300" width="500" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="50" y="322" font-size="12" fill="#b85450" font-weight="bold">问题本质：把 rods 分成三个不相交子集</text>
  <text x="50" y="342" font-size="11" fill="#555">• 左支架组 L、右支架组 R：要求 sum(L) == sum(R)，最大化这个公共和</text>
  <text x="50" y="360" font-size="11" fill="#555">• 未使用组 U：剩下的钢筋，不参与</text>
  <text x="50" y="378" font-size="11" fill="#555">• 答案 = max{ sum(L) : sum(L)==sum(R), L∩R=∅ }</text>
</svg>
