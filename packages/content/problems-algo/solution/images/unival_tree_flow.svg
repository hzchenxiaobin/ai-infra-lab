<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">基准值法 DFS 流程：短路判定</text>

  <!-- 起点 -->
  <rect x="170" y="44" width="180" height="34" rx="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="12" fill="#333">调用 dfs(node, target)</text>

  <line x1="260" y1="78" x2="260" y2="100" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形1 node 为空? -->
  <polygon points="260,104 350,140 260,176 170,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="144" text-anchor="middle" font-size="11" fill="#333">node 为空?</text>

  <!-- 是 → return true -->
  <line x1="350" y1="140" x2="408" y2="140" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="134" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="410" y="124" width="92" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="456" y="144" text-anchor="middle" font-size="11" fill="#333">return true</text>

  <!-- 否 ↓ -->
  <line x1="260" y1="176" x2="260" y2="198" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="266" y="192" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- 菱形2 node.val != target? -->
  <polygon points="260,202 360,238 260,274 160,238" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="242" text-anchor="middle" font-size="11" fill="#333">val ≠ target?</text>

  <!-- 是 → return false -->
  <line x1="360" y1="238" x2="408" y2="238" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="232" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="410" y="222" width="92" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="456" y="242" text-anchor="middle" font-size="11" fill="#333">return false</text>

  <!-- 否 ↓ -->
  <line x1="260" y1="274" x2="260" y2="296" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="266" y="290" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- 递归 -->
  <rect x="110" y="298" width="300" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="11" fill="#333">return dfs(left, target) &amp;&amp; dfs(right, target)</text>
</svg>
