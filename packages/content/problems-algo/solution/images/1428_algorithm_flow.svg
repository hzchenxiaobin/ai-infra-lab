<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：右上角出发，见 1 左移 / 见 0 下移</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">主循环每轮恰好一次 get；r 单调增、c 单调减，至多 rows+cols 次调用</text>

  <!-- ===== Top: init ===== -->
  <rect x="220" y="64" width="180" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="86" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">初始化</text>
  <text x="310" y="104" text-anchor="middle" font-size="10" fill="#333">[rows, cols] = dimensions()</text>
  <text x="310" y="118" text-anchor="middle" font-size="10" fill="#333">r=0, c=cols−1, ans=−1</text>

  <path d="M 310 124 L 310 140" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop condition diamond -->
  <polygon points="310,144 410,184 310,224 210,184" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="180" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">r &lt; rows</text>
  <text x="310" y="194" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">且 c ≥ 0 ?</text>

  <!-- No -> return -->
  <path d="M 410 184 L 470 184" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="178" text-anchor="middle" font-size="9" fill="#888">否</text>
  <rect x="470" y="168" width="120" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="530" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return ans</text>

  <!-- Yes -> get -->
  <path d="M 310 224 L 310 242" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="324" y="236" font-size="9" fill="#888">是</text>

  <rect x="240" y="246" width="140" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="268" text-anchor="middle" font-size="10" fill="#333">v = get(r, c)</text>

  <path d="M 310 280 L 310 296" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond: v==1? -->
  <polygon points="310,300 390,336 310,372 230,336" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="332" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">v == 1 ?</text>

  <!-- Yes branch (left): ans=c, c-- -->
  <path d="M 230 336 L 170 336" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="200" y="330" text-anchor="middle" font-size="9" fill="#b85450">是</text>
  <rect x="50" y="316" width="120" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="336" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">ans = c</text>
  <text x="110" y="350" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">c −−</text>

  <!-- No branch (right): r++ -->
  <path d="M 390 336 L 450 336" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="330" text-anchor="middle" font-size="9" fill="#446688">否(v=0)</text>
  <rect x="450" y="316" width="120" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="510" y="342" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">r ++</text>

  <!-- loop back arrows to top diamond -->
  <!-- from left box up to loop diamond left side (210,184) -->
  <path d="M 110 316 L 110 184 L 210 184" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="98" y="250" text-anchor="middle" font-size="8" fill="#888">回循环</text>
  <!-- from right box up -->
  <path d="M 510 316 L 510 250 L 410 230 L 410 210" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 510 250 L 410 250 L 410 224" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="524" y="284" font-size="8" fill="#888">回循环</text>

  <!-- ===== Bottom: get-call count ===== -->
  <rect x="30" y="392" width="560" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="414" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">get 调用次数分析</text>
  <text x="46" y="434" font-size="10" fill="#555">• 每轮循环恰好一次 get；r 从 0 单调增到 rows、c 从 cols−1 单调减到 −1，二者之和 r−c 单调变化 ⇒ 总轮数 ≤ rows + cols。</text>
  <text x="46" y="448" font-size="10" fill="#555">• rows, cols ≤ 100 ⇒ 至多 200 次调用 ≪ 1000 次上限，远优于暴力 O(rows·cols) ≈ 10⁴。</text>
</svg>
