<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：n=5, edges=[[0,1,7],[1,3,7],[1,2,1]]</text>

  <!-- Graph: component {0,1,2,3} -->
  <text x="170" y="50" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">分量 {0,1,2,3}：边权 7、7、1</text>

  <path d="M 78 92 L 148 92" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="113" y="84" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">7</text>

  <path d="M 186 92 L 256 92" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="221" y="84" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">7</text>

  <path d="M 167 110 L 167 168" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="144" font-size="11" fill="#446688" filter="url(#rough2)">1</text>

  <circle cx="60" cy="92" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="97" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="167" cy="92" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="167" y="97" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="167" cy="186" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="167" y="191" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="274" cy="92" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="274" y="97" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- isolated node 4 -->
  <circle cx="428" cy="92" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="428" y="97" text-anchor="middle" font-size="13" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="428" y="64" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">孤立点：自成一分量</text>

  <!-- walk arrows -->
  <path d="M 66 111 C 90 152 138 158 158 142" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="58" y="160" font-size="10.5" fill="#b85450" filter="url(#rough2)">0→1</text>
  <path d="M 158 202 C 200 226 236 226 176 202" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="216" y="238" font-size="10.5" fill="#b85450" filter="url(#rough2)">1→2→1（折返）</text>
  <path d="M 180 80 C 208 58 240 62 262 76" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="216" y="56" font-size="10.5" fill="#b85450" filter="url(#rough2)">1→3</text>

  <text x="170" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">旅途 0→1→2→1→3：代价 = 7 &amp; 1 &amp; 1 &amp; 7 = 1</text>
  <text x="170" y="282" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">分量全体 AND = 7 &amp; 7 &amp; 1 = 1，与上面一致</text>

  <!-- query table -->
  <rect x="330" y="140" width="70" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="365" y="157" text-anchor="middle" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">查询</text>
  <rect x="400" y="140" width="70" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="435" y="157" text-anchor="middle" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">答案</text>

  <rect x="330" y="164" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="365" y="181" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">[0, 3]</text>
  <rect x="400" y="164" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="435" y="181" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="330" y="188" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="365" y="205" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">[3, 4]</text>
  <rect x="400" y="188" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="435" y="205" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">-1</text>

  <path d="M 300 92 L 404 92" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="3 4" filter="url(#rough2)"/>
  <text x="352" y="84" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">不可达</text>

  <!-- bottom note -->
  <rect x="70" y="308" width="380" height="52" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">要点：同一分量内不管 s、t 是谁，答案都是 7 &amp; 7 &amp; 1 = 1；</text>
  <text x="260" y="346" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">跨分量（含孤立点）一律 -1 —— 查询只做 find 比对</text>
</svg>
