<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：3-序列 = 按时间顺序的任意三元组</text>

  <!-- joe row -->
  <text x="48" y="78" font-size="12" fill="#666" filter="url(#rough2)">joe</text>
  <rect x="100" y="62" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="82" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">home</text>
  <rect x="166" y="62" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="82" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">about</text>
  <rect x="232" y="62" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="82" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">career</text>

  <!-- james row -->
  <text x="48" y="138" font-size="12" fill="#666" filter="url(#rough2)">james</text>
  <rect x="100" y="122" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">home</text>
  <rect x="166" y="122" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cart</text>
  <rect x="232" y="122" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">maps</text>
  <rect x="298" y="122" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="328" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">home</text>
  <rect x="364" y="122" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="394" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">career</text>

  <!-- mary row -->
  <text x="48" y="198" font-size="12" fill="#666" filter="url(#rough2)">mary</text>
  <rect x="100" y="182" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">home</text>
  <rect x="166" y="182" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">about</text>
  <rect x="232" y="182" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">career</text>
  <rect x="298" y="182" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="328" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">maps</text>
  <rect x="364" y="182" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="394" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">career</text>

  <!-- arrow from joe to pattern, james no-about note -->
  <path d="M 262 96 L 262 112" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="232" width="280" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="200" y="248" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">joe 与 mary 都含 (home, about, career)</text>

  <!-- james note: no about -->
  <rect x="350" y="232" width="190" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="445" y="248" text-anchor="middle" font-size="11" fill="#8a3a3a" filter="url(#rough2)">james 无 about → 不命中该模式</text>

  <!-- counting box -->
  <rect x="60" y="270" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">模式 (home,about,career) → 命中用户数 = 2（joe + mary）</text>

  <!-- key insight -->
  <rect x="60" y="316" width="440" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">三元组无需相邻，只要 i &lt; j &lt; k（按时间）</text>
  <text x="280" y="354" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">每个用户对同一模式只计一次</text>
</svg>
