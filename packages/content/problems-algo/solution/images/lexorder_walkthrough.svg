<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.2"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="860" height="560" fill="#fdfcf7"/>

  <!-- Title -->
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：n = 13 的 13 轮游标游走</text>
  <path d="M 230 42 Q 430 50 630 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="430" y="62" text-anchor="middle" font-size="11" fill="#888">每轮先加入 cur，再决定下一个 cur；颜色标注决策类型</text>

  <!-- Legend -->
  <g font-size="10.5" filter="url(#sk2)">
    <rect x="120" y="76" width="16" height="12" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <text x="142" y="86" fill="#2b6e9e" font-weight="bold">深入</text>
    <rect x="200" y="76" width="16" height="12" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <text x="222" y="86" fill="#2e6e2e" font-weight="bold">右兄弟</text>
    <rect x="290" y="76" width="16" height="12" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="312" y="86" fill="#7a5415" font-weight="bold">回溯后转右兄弟</text>
    <rect x="430" y="76" width="16" height="12" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="452" y="86" fill="#b03a3a" font-weight="bold">回溯到根（停止）</text>
  </g>

  <!-- ===== 13 step boxes ===== -->
  <!-- Each box: width 52, gap 8, start x=50 -->
  <!-- box i at x = 50 + i*60, y=110, w=52, h=80 -->
  <!-- Top: round number, middle: value, bottom: decision tag -->

  <g font-family="'Comic Sans MS','Kaiti SC',楷体,cursive">
    <!-- Round 1: value=1, decision=深入 (blue) -->
    <g filter="url(#sk)"><rect x="50" y="110" width="52" height="80" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
    <text x="76" y="126" text-anchor="middle" font-size="9" fill="#888">轮 1</text>
    <text x="76" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6e9e">1</text>
    <text x="76" y="172" text-anchor="middle" font-size="9" fill="#2b6e9e" font-weight="bold">深入</text>
    <text x="76" y="184" text-anchor="middle" font-size="8" fill="#5a8a7a">×10→10</text>

    <!-- Round 2: value=10, decision=右兄弟 (green) -->
    <g filter="url(#sk)"><rect x="110" y="110" width="52" height="80" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
    <text x="136" y="126" text-anchor="middle" font-size="9" fill="#888">轮 2</text>
    <text x="136" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">10</text>
    <text x="136" y="172" text-anchor="middle" font-size="9" fill="#2e6e2e" font-weight="bold">右兄弟</text>
    <text x="136" y="184" text-anchor="middle" font-size="8" fill="#5a8a5a">+1→11</text>

    <!-- Round 3: value=11, decision=右兄弟 (green) -->
    <g filter="url(#sk)"><rect x="170" y="110" width="52" height="80" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
    <text x="196" y="126" text-anchor="middle" font-size="9" fill="#888">轮 3</text>
    <text x="196" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">11</text>
    <text x="196" y="172" text-anchor="middle" font-size="9" fill="#2e6e2e" font-weight="bold">右兄弟</text>
    <text x="196" y="184" text-anchor="middle" font-size="8" fill="#5a8a5a">+1→12</text>

    <!-- Round 4: value=12, decision=右兄弟 (green) -->
    <g filter="url(#sk)"><rect x="230" y="110" width="52" height="80" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
    <text x="256" y="126" text-anchor="middle" font-size="9" fill="#888">轮 4</text>
    <text x="256" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">12</text>
    <text x="256" y="172" text-anchor="middle" font-size="9" fill="#2e6e2e" font-weight="bold">右兄弟</text>
    <text x="256" y="184" text-anchor="middle" font-size="8" fill="#5a8a5a">+1→13</text>

    <!-- Round 5: value=13, decision=回溯后转右兄弟 (orange) - KEY MOMENT -->
    <g filter="url(#sk)"><rect x="290" y="110" width="52" height="80" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/></g>
    <text x="316" y="126" text-anchor="middle" font-size="9" fill="#888">轮 5</text>
    <text x="316" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">13</text>
    <text x="316" y="172" text-anchor="middle" font-size="8.5" fill="#7a5415" font-weight="bold">回溯→兄弟</text>
    <text x="316" y="184" text-anchor="middle" font-size="8" fill="#a07a2a">13→1→2</text>
    <!-- star marker for key moment -->
    <text x="316" y="108" text-anchor="middle" font-size="12" fill="#b85450">★</text>

    <!-- Round 6: value=2, decision=右兄弟 (green) -->
    <g filter="url(#sk)"><rect x="350" y="110" width="52" height="80" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
    <text x="376" y="126" text-anchor="middle" font-size="9" fill="#888">轮 6</text>
    <text x="376" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e6e2e">2</text>
    <text x="376" y="172" text-anchor="middle" font-size="9" fill="#2e6e2e" font-weight="bold">右兄弟</text>
    <text x="376" y="184" text-anchor="middle" font-size="8" fill="#5a8a5a">+1→3</text>

    <!-- Round 7: value=3 -->
    <g filter="url(#sk)"><rect x="410" y="110" width="52" height="80" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="436" y="126" text-anchor="middle" font-size="9" fill="#888">轮 7</text>
    <text x="436" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e6e2e">3</text>
    <text x="436" y="172" text-anchor="middle" font-size="9" fill="#2e6e2e" font-weight="bold">右兄弟</text>
    <text x="436" y="184" text-anchor="middle" font-size="8" fill="#5a8a5a">+1→4</text>

    <!-- Round 8: value=4 -->
    <g filter="url(#sk)"><rect x="470" y="110" width="52" height="80" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="496" y="126" text-anchor="middle" font-size="9" fill="#888">轮 8</text>
    <text x="496" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e6e2e">4</text>
    <text x="496" y="172" text-anchor="middle" font-size="9" fill="#2e6e2e" font-weight="bold">右兄弟</text>
    <text x="496" y="184" text-anchor="middle" font-size="8" fill="#5a8a5a">+1→5</text>

    <!-- Round 9: value=5 -->
    <g filter="url(#sk)"><rect x="530" y="110" width="52" height="80" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="556" y="126" text-anchor="middle" font-size="9" fill="#888">轮 9</text>
    <text x="556" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e6e2e">5</text>
    <text x="556" y="172" text-anchor="middle" font-size="9" fill="#2e6e2e" font-weight="bold">右兄弟</text>
    <text x="556" y="184" text-anchor="middle" font-size="8" fill="#5a8a5a">+1→6</text>

    <!-- Round 10: value=6 -->
    <g filter="url(#sk)"><rect x="590" y="110" width="52" height="80" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="616" y="126" text-anchor="middle" font-size="9" fill="#888">轮 10</text>
    <text x="616" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e6e2e">6</text>
    <text x="616" y="172" text-anchor="middle" font-size="9" fill="#2e6e2e" font-weight="bold">右兄弟</text>
    <text x="616" y="184" text-anchor="middle" font-size="8" fill="#5a8a5a">+1→7</text>

    <!-- Round 11: value=7 -->
    <g filter="url(#sk)"><rect x="650" y="110" width="52" height="80" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="676" y="126" text-anchor="middle" font-size="9" fill="#888">轮 11</text>
    <text x="676" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e6e2e">7</text>
    <text x="676" y="172" text-anchor="middle" font-size="9" fill="#2e6e2e" font-weight="bold">右兄弟</text>
    <text x="676" y="184" text-anchor="middle" font-size="8" fill="#5a8a5a">+1→8</text>

    <!-- Round 12: value=8 -->
    <g filter="url(#sk)"><rect x="710" y="110" width="52" height="80" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="736" y="126" text-anchor="middle" font-size="9" fill="#888">轮 12</text>
    <text x="736" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e6e2e">8</text>
    <text x="736" y="172" text-anchor="middle" font-size="9" fill="#2e6e2e" font-weight="bold">右兄弟</text>
    <text x="736" y="184" text-anchor="middle" font-size="8" fill="#5a8a5a">+1→9</text>

    <!-- Round 13: value=9, decision=回溯到根 (red) - KEY MOMENT -->
    <g filter="url(#sk)"><rect x="770" y="110" width="52" height="80" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/></g>
    <text x="796" y="126" text-anchor="middle" font-size="9" fill="#888">轮 13</text>
    <text x="796" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#b03a3a">9</text>
    <text x="796" y="172" text-anchor="middle" font-size="8.5" fill="#b03a3a" font-weight="bold">回溯到根</text>
    <text x="796" y="184" text-anchor="middle" font-size="8" fill="#a05a5a">9→0→1</text>
    <text x="796" y="108" text-anchor="middle" font-size="12" fill="#b85450">★</text>
  </g>

  <!-- arrows between consecutive boxes (light gray) -->
  <g stroke="#ccc" stroke-width="1" fill="none" filter="url(#sk)">
    <path d="M 102 150 L 110 150" marker-end="url(#ar)"/>
    <path d="M 162 150 L 170 150" marker-end="url(#ar)"/>
    <path d="M 222 150 L 230 150" marker-end="url(#ar)"/>
    <path d="M 282 150 L 290 150" marker-end="url(#ar)"/>
    <path d="M 342 150 L 350 150" marker-end="url(#ar)"/>
    <path d="M 402 150 L 410 150" marker-end="url(#ar)"/>
    <path d="M 462 150 L 470 150" marker-end="url(#ar)"/>
    <path d="M 522 150 L 530 150" marker-end="url(#ar)"/>
    <path d="M 582 150 L 590 150" marker-end="url(#ar)"/>
    <path d="M 642 150 L 650 150" marker-end="url(#ar)"/>
    <path d="M 702 150 L 710 150" marker-end="url(#ar)"/>
    <path d="M 762 150 L 770 150" marker-end="url(#ar)"/>
  </g>

  <!-- ===== Result bar ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="208" width="780" height="40" rx="8" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.6"/>
  </g>
  <text x="60" y="234" font-size="12" fill="#888">最终结果：</text>
  <g font-size="13" fill="#2b2b2b" font-weight="bold">
    <text x="140" y="234">[1, 10, 11, 12, 13, 2, 3, 4, 5, 6, 7, 8, 9]</text>
  </g>
  <text x="560" y="234" font-size="11" fill="#4a8e4a" font-weight="bold">✓ 与字典序一致</text>

  <!-- ===== Key moment 1: Round 5 (backtrack) ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="266" width="380" height="130" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="230" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">★ 轮 5：cur = 13 → 回溯后转右兄弟</text>
  <text x="56" y="312" font-size="11" fill="#555">1. cur×10 = 130 &gt; 13 → 不能深入</text>
  <text x="56" y="330" font-size="11" fill="#555">2. cur+1 = 14 &gt; 13 → 右兄弟越界</text>
  <text x="56" y="348" font-size="11" fill="#555">3. while 回溯：cur = 13÷10 = <tspan font-weight="bold" fill="#7a5415">1</tspan></text>
  <text x="56" y="366" font-size="11" fill="#555">4. 1%10=1≠9 且 1+1=2≤13 → 停止回溯</text>
  <text x="56" y="384" font-size="11" fill="#555">5. cur = 1+1 = <tspan font-weight="bold" fill="#2e6e2e">2</tspan>（转向右兄弟）</text>

  <!-- arrow from key moment 1 up to round 5 box -->
  <path d="M 230 266 Q 230 230 316 192" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="4 3" filter="url(#sk)"/>

  <!-- ===== Key moment 2: Round 13 (backtrack to root) ===== -->
  <g filter="url(#sk)">
    <rect x="440" y="266" width="380" height="130" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="630" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">★ 轮 13：cur = 9 → 回溯到虚拟根</text>
  <text x="456" y="312" font-size="11" fill="#555">1. cur×10 = 90 &gt; 13 → 不能深入</text>
  <text x="456" y="330" font-size="11" fill="#555">2. cur%10 = 9 → 结构上无右兄弟（末位最右）</text>
  <text x="456" y="348" font-size="11" fill="#555">3. while 回溯：cur = 9÷10 = <tspan font-weight="bold" fill="#b03a3a">0</tspan></text>
  <text x="456" y="366" font-size="11" fill="#555">4. 0%10=0≠9 且 0+1=1≤13 → 停止回溯</text>
  <text x="456" y="384" font-size="11" fill="#555">5. cur = 0+1 = <tspan font-weight="bold" fill="#b85450">1</tspan>（但已满 13 轮，停止）</text>

  <!-- arrow from key moment 2 up to round 13 box -->
  <path d="M 630 266 Q 630 230 796 192" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3" filter="url(#sk)"/>

  <!-- ===== Bottom summary ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="412" width="780" height="128" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="430" y="436" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">游标游走的本质：在 10 叉树上做前序遍历</text>
  <text x="430" y="458" text-anchor="middle" font-size="11" fill="#555">
    <tspan font-weight="bold" fill="#2b6e9e">深入（×10）</tspan> = 走向第一个子节点
    <tspan fill="#888"> · </tspan>
    <tspan font-weight="bold" fill="#2e6e2e">右兄弟（+1）</tspan> = 走向同层下一个
    <tspan fill="#888"> · </tspan>
    <tspan font-weight="bold" fill="#7a5415">回溯（÷10）</tspan> = 回到父节点
  </text>
  <text x="430" y="478" text-anchor="middle" font-size="11" fill="#666">
    轮 1-4：从 1 深入到 10，再沿右兄弟走到 13（子树内部遍历）
  </text>
  <text x="430" y="496" text-anchor="middle" font-size="11" fill="#666">
    轮 5：13 的子树走完，<tspan font-weight="bold" fill="#7a5415">回溯到父 1</tspan>，转右兄弟到 2（跨子树切换）
  </text>
  <text x="430" y="514" text-anchor="middle" font-size="11" fill="#666">
    轮 6-12：2-9 都是叶子（×10&gt;13），逐个右兄弟推进
  </text>
  <text x="430" y="532" text-anchor="middle" font-size="11" fill="#666">
    轮 13：9 末位为 9 无右兄弟，<tspan font-weight="bold" fill="#b03a3a">回溯到虚拟根 0</tspan> 再 +1 = 1（循环结束）
  </text>
</svg>
