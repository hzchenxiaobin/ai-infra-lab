<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：6 块石头 → 1 个连通分量 → 移除 5 块</text>

  <!-- table header -->
  <rect x="24" y="46" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步骤</text>
  <rect x="80" y="46" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">石头 (x,y)</text>
  <rect x="170" y="46" width="170" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">union 操作</text>
  <rect x="340" y="46" width="176" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="428" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">连接的行列</text>

  <!-- row 1: (0,0) -->
  <rect x="24" y="72" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="91" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">①</text>
  <rect x="80" y="72" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="91" text-anchor="middle" font-size="11" fill="#333">(0, 0)</text>
  <rect x="170" y="72" width="170" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="91" text-anchor="middle" font-size="11" fill="#333">union(0, ~0) = union(0, −1)</text>
  <rect x="340" y="72" width="176" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="428" y="91" text-anchor="middle" font-size="11" fill="#4a7a3a">行0 ↔ 列0</text>

  <!-- row 2: (0,1) -->
  <rect x="24" y="100" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="119" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">②</text>
  <rect x="80" y="100" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="119" text-anchor="middle" font-size="11" fill="#333">(0, 1)</text>
  <rect x="170" y="100" width="170" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="119" text-anchor="middle" font-size="11" fill="#333">union(0, ~1) = union(0, −2)</text>
  <rect x="340" y="100" width="176" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="428" y="119" text-anchor="middle" font-size="11" fill="#4a7a3a">行0 ↔ 列1</text>

  <!-- row 3: (1,0) -->
  <rect x="24" y="128" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="147" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">③</text>
  <rect x="80" y="128" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="147" text-anchor="middle" font-size="11" fill="#333">(1, 0)</text>
  <rect x="170" y="128" width="170" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="147" text-anchor="middle" font-size="11" fill="#333">union(1, ~0) = union(1, −1)</text>
  <rect x="340" y="128" width="176" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="428" y="147" text-anchor="middle" font-size="11" fill="#4a7a3a">行1 ↔ 列0</text>

  <!-- row 4: (1,2) -->
  <rect x="24" y="156" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="175" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④</text>
  <rect x="80" y="156" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="175" text-anchor="middle" font-size="11" fill="#333">(1, 2)</text>
  <rect x="170" y="156" width="170" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="175" text-anchor="middle" font-size="11" fill="#333">union(1, ~2) = union(1, −3)</text>
  <rect x="340" y="156" width="176" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="428" y="175" text-anchor="middle" font-size="11" fill="#4a7a3a">行1 ↔ 列2</text>

  <!-- row 5: (2,1) -->
  <rect x="24" y="184" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="203" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">⑤</text>
  <rect x="80" y="184" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="203" text-anchor="middle" font-size="11" fill="#333">(2, 1)</text>
  <rect x="170" y="184" width="170" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="203" text-anchor="middle" font-size="11" fill="#333">union(2, ~1) = union(2, −2)</text>
  <rect x="340" y="184" width="176" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="428" y="203" text-anchor="middle" font-size="11" fill="#4a7a3a">行2 ↔ 列1</text>

  <!-- row 6: (2,2) -->
  <rect x="24" y="212" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="231" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">⑥</text>
  <rect x="80" y="212" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="231" text-anchor="middle" font-size="11" fill="#333">(2, 2)</text>
  <rect x="170" y="212" width="170" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="231" text-anchor="middle" font-size="11" fill="#333">union(2, ~2) = union(2, −3)</text>
  <rect x="340" y="212" width="176" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="428" y="231" text-anchor="middle" font-size="11" fill="#4a7a3a">行2 ↔ 列2</text>

  <!-- connectivity chain -->
  <rect x="24" y="250" width="492" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="273" text-anchor="middle" font-size="11" fill="#444">union 后：行0 ~ 列0 ~ 行1 ~ 列2 ~ 行2 ~ 列1 ~ 行0 → 全部同根</text>

  <!-- result -->
  <rect x="24" y="296" width="492" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="316" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">6 块石头的 find(x) 均相同 → 1 个连通分量</text>
  <text x="270" y="332" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = 6 − 1 = 5 ⭐</text>

  <!-- bottom note -->
  <rect x="60" y="348" width="420" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="365" text-anchor="middle" font-size="10.5" fill="#666">行列通过 ~y 隔离，每块石头把行号与列号 union 起来</text>
</svg>
