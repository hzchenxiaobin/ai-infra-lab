<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="560" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：归并排序 + 索引数组（对 idx 切分，按 nums 比较）</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">递归切分 idx[lo..hi]，合并时按 nums[idx[·]] 取小；取左半才计数</text>

  <!-- ===== Start ===== -->
  <rect x="200" y="56" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="290" y="75" text-anchor="middle" font-size="11" fill="#333">mergeSort(idx, lo, hi)</text>
  <path d="M 290 84 L 290 96" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision: lo >= hi ===== -->
  <polygon points="290,98 380,128 290,158 200,128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="124" text-anchor="middle" font-size="10" fill="#444">lo ≥ hi ?</text>
  <text x="290" y="138" text-anchor="middle" font-size="9" fill="#888">(长度≤1)</text>

  <!-- Yes branch: return -->
  <path d="M 380 128 L 430 128" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="122" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="432" y="116" width="110" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="487" y="132" text-anchor="middle" font-size="10" fill="#4a7a3a">return（无逆序）</text>

  <!-- No branch: down -->
  <path d="M 290 158 L 290 170" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="298" y="168" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- ===== mid + recurse ===== -->
  <rect x="170" y="172" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="190" text-anchor="middle" font-size="10" fill="#333">mid = (lo+hi)/2</text>
  <text x="290" y="205" text-anchor="middle" font-size="10" fill="#333">递归 mergeSort(lo,mid) + mergeSort(mid+1,hi)</text>
  <path d="M 290 212 L 290 224" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Init ===== -->
  <rect x="190" y="226" width="200" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="245" text-anchor="middle" font-size="10" fill="#333">初始化 i=lo, j=mid+1, k=lo</text>
  <path d="M 290 254 L 290 266" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Loop decision ===== -->
  <polygon points="290,268 400,300 290,332 180,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="296" text-anchor="middle" font-size="10" fill="#444">i ≤ mid 且 j ≤ hi ?</text>
  <text x="290" y="310" text-anchor="middle" font-size="9" fill="#888">(两半都未耗尽)</text>

  <!-- No branch: to drain (right) -->
  <path d="M 400 300 L 460 300 L 460 388" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="294" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Yes branch: down to compare -->
  <path d="M 290 332 L 290 344" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="298" y="342" font-size="10" fill="#b85450" font-weight="bold">是</text>

  <!-- ===== Compare decision ===== -->
  <polygon points="290,346 410,376 290,406 170,376" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="374" text-anchor="middle" font-size="10" fill="#444">nums[idx[i]] ≤ nums[idx[j]] ?</text>

  <!-- Yes (left): take left + count -->
  <path d="M 170 376 L 110 376" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="140" y="370" font-size="10" fill="#446688" font-weight="bold">是</text>
  <rect x="20" y="362" width="88" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="64" y="378" text-anchor="middle" font-size="9" fill="#446688">count[idx[i]]</text>
  <text x="64" y="388" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">+= j−(mid+1)</text>
  <text x="64" y="406" text-anchor="middle" font-size="9" fill="#333">tmp[k++]=idx[i++]</text>

  <!-- No (right): take right, no count -->
  <path d="M 410 376 L 470 376" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="430" y="370" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="472" y="362" width="88" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="516" y="378" text-anchor="middle" font-size="9" fill="#b85450">右半更小</text>
  <text x="516" y="388" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">不计数</text>
  <text x="516" y="406" text-anchor="middle" font-size="9" fill="#333">tmp[k++]=idx[j++]</text>

  <!-- loop back arrows from both branches up to loop decision -->
  <path d="M 64 410 L 64 300 L 178 300" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 516 410 L 516 300 L 402 300" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="20" y="294" font-size="9" fill="#888">回循环</text>

  <!-- ===== Drain remaining left ===== -->
  <rect x="380" y="390" width="190" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="475" y="406" text-anchor="middle" font-size="9" fill="#446688">剩余左半：count[idx[i]] += j−(mid+1)</text>
  <text x="475" y="418" text-anchor="middle" font-size="9" fill="#333">tmp[k++]=idx[i++]</text>
  <path d="M 460 300 L 460 388" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Drain remaining right ===== -->
  <rect x="380" y="438" width="190" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="475" y="457" text-anchor="middle" font-size="9" fill="#b85450">剩余右半：tmp[k++]=idx[j++]（不计数）</text>
  <path d="M 475 426 L 475 436" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Copy back ===== -->
  <rect x="320" y="486" width="250" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="445" y="505" text-anchor="middle" font-size="10" fill="#4a7a3a">拷贝 tmp[lo..hi] 回 idx[lo..hi]</text>
  <path d="M 475 468 L 475 484" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- arrow from drain-right to copy -->
  <path d="M 475 468 L 475 484" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Notes ===== -->
  <text x="20" y="486" font-size="10" fill="#888" font-weight="bold">⚡ 三条计数时机：</text>
  <text x="20" y="502" font-size="10" fill="#888">① 比较取左 → count += j−(mid+1)</text>
  <text x="20" y="518" font-size="10" fill="#888">② 左半耗尽前剩余左 → 同公式</text>
  <text x="20" y="534" font-size="10" fill="#888">③ 取右半 / 右半剩余 → 不计数</text>
</svg>
