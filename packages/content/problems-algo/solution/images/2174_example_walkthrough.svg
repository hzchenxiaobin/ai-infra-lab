<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：grid = [[1,1,1],[1,1,1],[0,1,0]] → 答案 2</text>

  <!-- ===== Step 0: Initial state ===== -->
  <text x="80" y="52" font-size="11" fill="#446688" font-weight="bold">初始状态</text>
  <text x="80" y="66" font-size="9.5" fill="#888">7 个 1，state≠0</text>

  <!-- 3x3 grid: [[1,1,1],[1,1,1],[0,1,0]] -->
  <!-- row 0 -->
  <rect x="50" y="74" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="66" y="93" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="82" y="74" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="98" y="93" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="114" y="74" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="130" y="93" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <!-- row 1 -->
  <rect x="50" y="102" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="66" y="121" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="82" y="102" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="98" y="121" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="114" y="102" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="130" y="121" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <!-- row 2 -->
  <rect x="50" y="130" width="32" height="28" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="66" y="149" text-anchor="middle" font-size="13" fill="#aaa">0</text>
  <rect x="82" y="130" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="98" y="149" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="114" y="130" width="32" height="28" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="130" y="149" text-anchor="middle" font-size="13" fill="#aaa">0</text>

  <!-- arrow step 0 -> step 1 -->
  <path d="M 150 116 L 190 116" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="170" y="108" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">选(1,1)</text>
  <text x="170" y="128" text-anchor="middle" font-size="8.5" fill="#888">清行1+列1</text>

  <!-- ===== Step 1: After op 1 ===== -->
  <text x="210" y="52" font-size="11" fill="#d6a040" font-weight="bold">第 1 步</text>
  <text x="210" y="66" font-size="9.5" fill="#888">清零第1行+第1列</text>

  <!-- 3x3 grid: [[1,0,1],[0,0,0],[0,0,0]] -->
  <!-- row 0 -->
  <rect x="200" y="74" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="216" y="93" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="232" y="74" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="248" y="93" text-anchor="middle" font-size="13" fill="#4a7a3a">0</text>
  <rect x="264" y="74" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="280" y="93" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <!-- row 1: all cleared, highlight as cleared -->
  <rect x="200" y="102" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="216" y="121" text-anchor="middle" font-size="13" fill="#4a7a3a">0</text>
  <rect x="232" y="102" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="248" y="121" text-anchor="middle" font-size="13" fill="#4a7a3a">0</text>
  <rect x="264" y="102" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="280" y="121" text-anchor="middle" font-size="13" fill="#4a7a3a">0</text>
  <!-- row 2 -->
  <rect x="200" y="130" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="216" y="149" text-anchor="middle" font-size="13" fill="#4a7a3a">0</text>
  <rect x="232" y="130" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="248" y="149" text-anchor="middle" font-size="13" fill="#4a7a3a">0</text>
  <rect x="264" y="130" width="32" height="28" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="280" y="149" text-anchor="middle" font-size="13" fill="#aaa">0</text>

  <!-- cleared labels -->
  <text x="248" y="172" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">绿色 = 本次清零</text>

  <!-- arrow step 1 -> step 2 -->
  <path d="M 300 116 L 340 116" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="320" y="108" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">选(0,0)</text>
  <text x="320" y="128" text-anchor="middle" font-size="8.5" fill="#888">清行0+列0</text>

  <!-- ===== Step 2: After op 2 ===== -->
  <text x="360" y="52" font-size="11" fill="#4a7a3a" font-weight="bold">第 2 步 ✓</text>
  <text x="360" y="66" font-size="9.5" fill="#888">全 0，完成！</text>

  <!-- 3x3 grid: all zeros -->
  <rect x="350" y="74" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="366" y="93" text-anchor="middle" font-size="13" fill="#4a7a3a">0</text>
  <rect x="382" y="74" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="398" y="93" text-anchor="middle" font-size="13" fill="#4a7a3a">0</text>
  <rect x="414" y="74" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="430" y="93" text-anchor="middle" font-size="13" fill="#4a7a3a">0</text>

  <rect x="350" y="102" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="366" y="121" text-anchor="middle" font-size="13" fill="#4a7a3a">0</text>
  <rect x="382" y="102" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="398" y="121" text-anchor="middle" font-size="13" fill="#4a7a3a">0</text>
  <rect x="414" y="102" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="430" y="121" text-anchor="middle" font-size="13" fill="#4a7a3a">0</text>

  <rect x="350" y="130" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="366" y="149" text-anchor="middle" font-size="13" fill="#4a7a3a">0</text>
  <rect x="382" y="130" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="398" y="149" text-anchor="middle" font-size="13" fill="#4a7a3a">0</text>
  <rect x="414" y="130" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="430" y="149" text-anchor="middle" font-size="13" fill="#4a7a3a">0</text>

  <!-- ===== BFS layers explanation ===== -->
  <rect x="36" y="186" width="488" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">BFS 逐层展开</text>
  <text x="280" y="222" text-anchor="middle" font-size="10" fill="#555">第 0 层 = 初始状态 → 第 1 层 = 一次操作后的所有状态 → 第 2 层 = 两次操作后的状态（含全 0）</text>

  <!-- ===== Bottom: Operation detail table ===== -->
  <text x="36" y="252" font-size="11" fill="#446688" font-weight="bold">操作明细</text>

  <!-- table header -->
  <rect x="36" y="260" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="66" y="275" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">步数</text>
  <rect x="96" y="260" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="136" y="275" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">选 (i,j)</text>
  <rect x="176" y="260" width="180" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="266" y="275" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">清零范围</text>
  <rect x="356" y="260" width="168" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="440" y="275" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">剩余 1 的数量</text>

  <!-- row 1 -->
  <rect x="36" y="284" width="60" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="66" y="299" text-anchor="middle" font-size="10" fill="#333">第 1 步</text>
  <rect x="96" y="284" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="136" y="299" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">(1, 1)</text>
  <rect x="176" y="284" width="180" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="266" y="299" text-anchor="middle" font-size="9.5" fill="#555">第 1 行 + 第 1 列（5 格）</text>
  <rect x="356" y="284" width="168" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="440" y="299" text-anchor="middle" font-size="10" fill="#333">7 → 2</text>

  <!-- row 2 -->
  <rect x="36" y="308" width="60" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="66" y="323" text-anchor="middle" font-size="10" fill="#333">第 2 步</text>
  <rect x="96" y="308" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="136" y="323" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">(0, 0)</text>
  <rect x="176" y="308" width="180" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="266" y="323" text-anchor="middle" font-size="9.5" fill="#555">第 0 行 + 第 0 列（5 格）</text>
  <rect x="356" y="308" width="168" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="440" y="323" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2 → 0 ✓</text>

  <!-- ===== Bottom note ===== -->
  <rect x="36" y="346" width="488" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">关键：只能选当前值为 1 的格子</text>
  <text x="280" y="382" text-anchor="middle" font-size="10" fill="#555">第 1 步选 (1,1)：grid[1][1]=1 ✓ → 清零后剩余 (0,0) 和 (0,2) 为 1</text>
  <text x="280" y="396" text-anchor="middle" font-size="10" fill="#555">第 2 步选 (0,0)：grid[0][0]=1 ✓ → 清零第 0 行+第 0 列 → 全 0</text>
</svg>
