<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：「无公共边」⟺ 两端分属 c 的不同分支</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">✓ = 到 c 的距离可被 signalSpeed 整除（本图取 signalSpeed = 5）</text>

  <!-- root c -->
  <circle cx="260" cy="72" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="77" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">c</text>

  <!-- branch group boxes -->
  <rect x="26" y="132" width="142" height="150" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="10" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <rect x="196" y="132" width="128" height="150" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="10" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <rect x="352" y="132" width="142" height="150" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="10" stroke-dasharray="7 5" filter="url(#rough2)"/>

  <text x="97" y="152" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">分支① cnt₁=2</text>
  <text x="260" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">分支② cnt₂=1</text>
  <text x="423" y="152" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">分支③ cnt₃=1</text>

  <!-- edges from c -->
  <path d="M 247 88 L 110 174" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 260 91 L 260 172" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 273 88 L 410 174" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="176" y="122" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">w=5</text>
  <text x="272" y="126" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">w=3</text>
  <text x="348" y="122" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">w=4</text>

  <!-- branch 1 children -->
  <path d="M 88 203 L 62 242" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 106 203 L 132 242" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="60" y="222" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>
  <text x="132" y="222" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>

  <!-- branch 2 children -->
  <path d="M 251 203 L 228 242" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 269 203 L 292 242" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="226" y="222" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">12</text>
  <text x="294" y="222" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">6</text>

  <!-- branch 3 children -->
  <path d="M 414 203 L 390 242" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 432 203 L 456 242" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="388" y="222" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">6</text>
  <text x="458" y="222" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>

  <!-- level-1 nodes (children of c) -->
  <circle cx="97" cy="190" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="97" y="195" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">5✓</text>
  <circle cx="260" cy="190" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="195" text-anchor="middle" font-size="10.5" fill="#8c3a36" font-weight="bold" filter="url(#rough2)">3✗</text>
  <circle cx="423" cy="190" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="423" y="195" text-anchor="middle" font-size="10.5" fill="#8c3a36" font-weight="bold" filter="url(#rough2)">4✗</text>

  <!-- level-2 nodes -->
  <circle cx="55" cy="258" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="55" y="263" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">10✓</text>
  <circle cx="139" cy="258" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="139" y="263" text-anchor="middle" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">8✗</text>
  <circle cx="222" cy="258" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="222" y="263" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">15✓</text>
  <circle cx="298" cy="258" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="298" y="263" text-anchor="middle" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">9✗</text>
  <circle cx="385" cy="258" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="385" y="263" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">10✓</text>
  <circle cx="461" cy="258" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="461" y="263" text-anchor="middle" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">9✗</text>

  <!-- forbidden same-branch pair -->
  <path d="M 85 202 Q 42 224 57 244" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <circle cx="49" cy="222" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="49" y="226" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- allowed cross-branch pair -->
  <path d="M 68 270 Q 138 290 208 270" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="138" y="299" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">✓ 跨分支</text>

  <!-- summary box -->
  <rect x="20" y="306" width="480" height="94" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">通过 c 的可连接对数 = 不同分支的合格节点两两组合</text>
  <text x="260" y="350" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">= cnt₁·cnt₂ + cnt₁·cnt₃ + cnt₂·cnt₃ = 2×1 + 2×1 + 1×1 = 5</text>
  <text x="260" y="372" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">等价形式：(S² − Σcntᵢ²) / 2 = (4² − 4 − 1 − 1) / 2 = 5，其中 S = cnt₁+cnt₂+cnt₃</text>
  <text x="260" y="392" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">红色虚线对：同分支 ✗ —— 两条路径共享首边 c→v₁，违反「无公共边」</text>
</svg>
