<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">核心观察：删同一字母的任一出现，频率多重集不变 → 试 ≤26 类而非 n 个下标</text>

  <!-- ====== divider ====== -->
  <path d="M 270 46 L 270 280" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- ===================== LEFT: abcc → true ===================== -->
  <text x="135" y="58" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">word = "abcc" → true</text>

  <!-- 删除前 freq boxes: a:1 b:1 c:2 -->
  <text x="135" y="78" text-anchor="middle" font-size="11" fill="#888">删除前</text>
  <rect x="54" y="86" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="76" y="105" text-anchor="middle" font-size="12" fill="#333">a:1</text>
  <rect x="108" y="86" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="105" text-anchor="middle" font-size="12" fill="#333">b:1</text>
  <rect x="162" y="86" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="184" y="105" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">c:2</text>

  <!-- arrow down: 删一个 c -->
  <path d="M 184 118 L 184 142" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="222" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">删一个 c</text>

  <!-- 删除后 freq boxes: a:1 b:1 c:1 全部=1 -->
  <text x="135" y="156" text-anchor="middle" font-size="11" fill="#888">删除后</text>
  <rect x="54" y="164" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="76" y="183" text-anchor="middle" font-size="12" fill="#333">a:1</text>
  <rect x="108" y="164" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="130" y="183" text-anchor="middle" font-size="12" fill="#333">b:1</text>
  <rect x="162" y="164" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="184" y="183" text-anchor="middle" font-size="12" fill="#333">c:1</text>

  <!-- level line -->
  <path d="M 50 162 L 210 162" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5,3" fill="none" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="60" y="212" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="135" y="234" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">频率统一 = 1 ✓</text>

  <!-- ===================== RIGHT: aazz → false ===================== -->
  <text x="405" y="58" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">word = "aazz" → false</text>

  <!-- 删除前 freq boxes: a:2 z:2 -->
  <text x="405" y="78" text-anchor="middle" font-size="11" fill="#888">删除前</text>
  <rect x="361" y="86" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="383" y="105" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">a:2</text>
  <rect x="415" y="86" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="437" y="105" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">z:2</text>

  <!-- two arrows: 删 a (left), 删 z (right) -->
  <path d="M 383 118 L 350 142" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="338" y="134" text-anchor="end" font-size="10.5" fill="#b85450" font-weight="bold">删 a</text>
  <path d="M 437 118 L 470 142" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="482" y="134" text-anchor="start" font-size="10.5" fill="#b85450" font-weight="bold">删 z</text>

  <!-- 删 a 结果 -->
  <text x="338" y="158" text-anchor="end" font-size="10.5" fill="#888">删 a →</text>
  <rect x="345" y="164" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="181" text-anchor="middle" font-size="11" fill="#333">a:1</text>
  <rect x="389" y="164" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="409" y="181" text-anchor="middle" font-size="11" fill="#333">z:2</text>
  <text x="438" y="181" font-size="13" fill="#b85450" font-weight="bold">✗ 不等</text>

  <!-- 删 z 结果 -->
  <text x="338" y="204" text-anchor="end" font-size="10.5" fill="#888">删 z →</text>
  <rect x="345" y="210" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="227" text-anchor="middle" font-size="11" fill="#333">a:2</text>
  <rect x="389" y="210" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="409" y="227" text-anchor="middle" font-size="11" fill="#333">z:1</text>
  <text x="438" y="227" font-size="13" fill="#b85450" font-weight="bold">✗ 不等</text>

  <!-- result -->
  <rect x="345" y="246" width="150" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="266" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">两种删法都不统一 ✗</text>

  <!-- ===================== bottom insight ===================== -->
  <rect x="40" y="300" width="460" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="320" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">删同一字母的任一出现，结果频率多重集完全相同</text>
  <text x="270" y="338" text-anchor="middle" font-size="10.5" fill="#888">故只需对每个出现过的字母试删一次（≤26 次），无需对每个下标试删（≤100 次）；每次 O(26) 判等</text>
</svg>
