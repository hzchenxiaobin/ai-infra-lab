<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：每个 x 的伴侣可能是 2x 或 x/2，双向各查一次</text>

  <!-- Array row -->
  <text x="30" y="72" font-size="12" fill="#888">arr =</text>
  <rect x="80" y="56" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>
  <text x="108" y="102" text-anchor="middle" font-size="10" fill="#888">i=0</text>

  <rect x="140" y="56" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="168" y="102" text-anchor="middle" font-size="10" fill="#888">i=1</text>

  <rect x="200" y="56" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="228" y="102" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">i=2 ← 当前</text>

  <rect x="260" y="56" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="288" y="102" text-anchor="middle" font-size="10" fill="#888">i=3</text>

  <!-- Seen set -->
  <text x="380" y="72" font-size="12" fill="#888">已见集合 seen：</text>
  <rect x="380" y="80" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="408" y="98" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>
  <rect x="442" y="80" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="98" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- Two lookup directions -->
  <text x="30" y="150" font-size="12" fill="#444" font-weight="bold">对当前 x = 5，伴侣可能是：</text>

  <!-- Direction 1: 2x -->
  <rect x="40" y="168" width="250" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="190" font-size="12" fill="#b85450" font-weight="bold">方向①：2 × x = 10</text>
  <text x="60" y="210" font-size="11" fill="#333">x 当 M，找它的两倍 N</text>
  <text x="60" y="228" font-size="11" fill="#4a7a3a" font-weight="bold">→ 10 在 seen 里！命中 ✓</text>

  <!-- Direction 2: x/2 -->
  <rect x="310" y="168" width="250" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="330" y="190" font-size="12" fill="#d6a040" font-weight="bold">方向②：x / 2 = 2.5</text>
  <text x="330" y="210" font-size="11" fill="#333">x 当 N，找它的一半 M</text>
  <text x="330" y="228" font-size="11" fill="#888">→ 非整数，跳过</text>

  <!-- arrows from current 5 to both directions -->
  <path d="M 228 110 Q 165 140 105 168" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 228 110 Q 295 140 375 168" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- zero special note -->
  <line x1="20" y1="266" x2="580" y2="266" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="290" font-size="12" fill="#444" font-weight="bold">⚠️ 特殊情况：x = 0</text>
  <text x="30" y="310" font-size="11" fill="#333">0 的两倍仍是 0，方向①查 2×0=0 会查到自己。故需两个 0 才算命中。</text>
  <text x="30" y="328" font-size="11" fill="#333">"先查后存"天然解决：第一个 0 查时 seen 空 → 存入；第二个 0 查时 seen 有 0 → 命中。</text>
  <text x="30" y="350" font-size="11" fill="#4a7a3a" font-weight="bold">→ [0,0] 返回 true，[0,1] 返回 false，符合 i ≠ j 要求。</text>
</svg>
