<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：角落四面体 — 两面墙 + 三角形逐层递减</text>

  <!-- ===== Left: Top-down view of ground triangle (side 3) ===== -->
  <text x="140" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">俯视：地面三角形（边长 3）</text>

  <!-- Walls -->
  <g filter="url(#rough2)">
    <rect x="60" y="68" width="160" height="10" fill="#d6a040" stroke="#b8860b" stroke-width="1.5" rx="2"/>
    <text x="140" y="76" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">墙 A</text>
    <rect x="50" y="78" width="10" height="120" fill="#d6a040" stroke="#b8860b" stroke-width="1.5" rx="2"/>
    <text x="55" y="140" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold" transform="rotate(-90 55 140)">墙 B</text>
  </g>

  <!-- Ground boxes (triangle side 3): row 1 has 1, row 2 has 2, row 3 has 3 -->
  <!-- Using isometric-ish offset for clarity -->
  <g filter="url(#rough2)" font-size="11" font-weight="bold" text-anchor="middle">
    <!-- Row 1 (corner) -->
    <rect x="72" y="88" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="87" y="104" fill="#446688">●</text>
    <!-- Row 2 -->
    <rect x="72" y="114" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="87" y="130" fill="#446688">●</text>
    <rect x="104" y="114" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="119" y="130" fill="#446688">●</text>
    <!-- Row 3 (edge boxes can't support) -->
    <rect x="72" y="140" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="87" y="156" fill="#d6a040">○</text>
    <rect x="104" y="140" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="119" y="156" fill="#446688">●</text>
    <rect x="136" y="140" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="151" y="156" fill="#d6a040">○</text>
  </g>

  <!-- Legend -->
  <g filter="url(#rough2)" font-size="9" fill="#555">
    <rect x="72" y="180" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2"/>
    <text x="92" y="191">● 可支撑上方</text>
    <rect x="72" y="198" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2"/>
    <text x="92" y="209">○ 边缘（缺邻居）</text>
  </g>

  <!-- Annotation: non-edge forms smaller triangle -->
  <path d="M 68 86 L 68 86" stroke="none" fill="none"/>
  <text x="140" y="228" text-anchor="middle" font-size="9" fill="#446688" font-style="italic" filter="url(#rough2)">非边缘 ● 构成边长 2 的三角形 → 第 2 层</text>

  <!-- ===== Right: Side view of tetrahedron (height 3) ===== -->
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">侧视：四面体（高度 3）</text>

  <!-- Layer 3 (top, 1 box) -->
  <g filter="url(#rough2)">
    <rect x="390" y="74" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
    <text x="404" y="90" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  </g>
  <text x="440" y="90" font-size="9" fill="#b85450" filter="url(#rough2)">第 3 层: 1 个</text>

  <!-- Layer 2 (3 boxes) -->
  <g filter="url(#rough2)" font-size="10" font-weight="bold" text-anchor="middle">
    <rect x="376" y="102" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="390" y="118" fill="#4a7a3a">3</text>
    <rect x="406" y="102" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="420" y="118" fill="#4a7a3a">3</text>
    <rect x="436" y="102" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="450" y="118" fill="#4a7a3a">3</text>
  </g>
  <text x="480" y="118" font-size="9" fill="#4a7a3a" filter="url(#rough2)">第 2 层: 3 个</text>

  <!-- Layer 1 (ground, 6 boxes) -->
  <g filter="url(#rough2)" font-size="10" font-weight="bold" text-anchor="middle">
    <rect x="362" y="130" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="376" y="146" fill="#446688">6</text>
    <rect x="392" y="130" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="406" y="146" fill="#446688">6</text>
    <rect x="422" y="130" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="436" y="146" fill="#446688">6</text>
    <rect x="452" y="130" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="466" y="146" fill="#446688">6</text>
    <rect x="482" y="130" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="496" y="146" fill="#446688">6</text>
    <rect x="512" y="130" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="526" y="146" fill="#446688">6</text>
  </g>
  <text x="400" y="170" font-size="9" fill="#446688" filter="url(#rough2)">地面层: 6 个 (边长 3)</text>

  <!-- Ground line -->
  <line x1="340" y1="158" x2="548" y2="158" stroke="#b8860b" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="345" y="172" font-size="8" fill="#b8860b" filter="url(#rough2)">地面</text>

  <!-- Wall labels for side view -->
  <text x="345" y="80" font-size="8" fill="#d6a040" filter="url(#rough2)">墙</text>
  <text x="540" y="80" font-size="8" fill="#d6a040" filter="url(#rough2)">墙</text>

  <!-- Arrow: layers decrease -->
  <path d="M 350 100 L 350 140" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="334" y="124" font-size="8" fill="#d6a040" filter="url(#rough2)" transform="rotate(-90 334 124)">边长递减</text>

  <!-- ===== Bottom: Key formulas ===== -->
  <rect x="40" y="250" width="240" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="270" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">完整四面体（高度 m）</text>
  <line x1="52" y1="278" x2="268" y2="278" stroke="#c0d0e8" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="294" font-size="10" fill="#555" filter="url(#rough2)">第 k 层: k(k+1)/2 个盒子</text>
  <text x="52" y="310" font-size="10" fill="#555" filter="url(#rough2)">地面: m(m+1)/2 个</text>
  <text x="52" y="328" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">总计 T(m) = m(m+1)(m+2)/6</text>

  <rect x="296" y="250" width="224" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="408" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">扩展地面（k 个新盒子）</text>
  <line x1="308" y1="278" x2="508" y2="278" stroke="#c0d0c8" stroke-width="1" filter="url(#rough2)"/>
  <text x="308" y="294" font-size="10" fill="#555" filter="url(#rough2)">已有四面体当"墙"</text>
  <text x="308" y="310" font-size="10" fill="#555" filter="url(#rough2)">k 个地面 → k-1 → … → 1</text>
  <text x="308" y="328" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">新增容量 = k(k+1)/2</text>

  <!-- Footer key insight -->
  <rect x="40" y="360" width="480" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="380" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">两步策略：建最高完整四面体 → 残余盒子扩展地面</text>
  <text x="52" y="398" font-size="10" fill="#555" filter="url(#rough2)">① 二分找最大 m: T(m) = m(m+1)(m+2)/6 ≤ n</text>
  <text x="52" y="414" font-size="10" fill="#555" filter="url(#rough2)">② 残余 r = n − T(m)，二分找最小 k: k(k+1)/2 ≥ r</text>
  <text x="52" y="436" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">答案 = m(m+1)/2 + k，全程 O(log n)</text>
</svg>
