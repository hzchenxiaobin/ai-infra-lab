<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [2, -1, -4, -3] → ans = 17</text>

  <!-- 表头 -->
  <rect x="40" y="46" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="70" y="65" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <rect x="100" y="46" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="135" y="65" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">x</text>
  <rect x="170" y="46" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="215" y="65" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">f（未平方）</text>
  <rect x="260" y="46" width="90" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="305" y="65" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">g（已平方）</text>
  <rect x="350" y="46" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="385" y="65" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans</text>
  <rect x="420" y="46" width="120" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="480" y="65" text-anchor="middle" font-size="10.5" fill="#666">说明</text>

  <!-- 行 0: x=2 -->
  <rect x="40" y="78" width="60" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="97" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="100" y="78" width="70" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="135" y="97" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="170" y="78" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="215" y="97" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="260" y="78" width="90" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="305" y="97" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="350" y="78" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="385" y="97" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="420" y="78" width="120" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="480" y="97" text-anchor="middle" font-size="9.5" fill="#777">f=0+2, g=0+2²</text>

  <!-- 行 1: x=-1 -->
  <rect x="40" y="110" width="60" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="129" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="100" y="110" width="70" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="135" y="129" text-anchor="middle" font-size="11" fill="#333">-1</text>
  <rect x="170" y="110" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="215" y="129" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="260" y="110" width="90" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="305" y="129" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="350" y="110" width="70" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="385" y="129" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="420" y="110" width="120" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="480" y="129" text-anchor="middle" font-size="9.5" fill="#777">g=max(2+1, 4-1)</text>

  <!-- 行 2: x=-4 (关键行) -->
  <rect x="40" y="142" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="70" y="161" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="100" y="142" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="135" y="161" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">-4</text>
  <rect x="170" y="142" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="215" y="161" text-anchor="middle" font-size="11" fill="#333">-3</text>
  <rect x="260" y="142" width="90" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="305" y="161" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">17 ⭐</text>
  <rect x="350" y="142" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="385" y="161" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">17</text>
  <rect x="420" y="142" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="480" y="161" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">f+(-4)²=1+16</text>

  <!-- 行 3: x=-3 -->
  <rect x="40" y="174" width="60" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="193" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="100" y="174" width="70" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="135" y="193" text-anchor="middle" font-size="11" fill="#333">-3</text>
  <rect x="170" y="174" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="215" y="193" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="260" y="174" width="90" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="305" y="193" text-anchor="middle" font-size="11" fill="#333">14</text>
  <rect x="350" y="174" width="70" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="385" y="193" text-anchor="middle" font-size="11" fill="#333">17</text>
  <rect x="420" y="174" width="120" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="480" y="193" text-anchor="middle" font-size="9.5" fill="#777">g=17+(-3)=14</text>

  <!-- 关键步骤详解 -->
  <rect x="40" y="226" width="480" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="60" y="250" font-size="12" fill="#333" font-weight="bold">关键步骤 i=2（x = -4）拆解：</text>

  <text x="60" y="276" font-size="11" fill="#4a7a3a" font-weight="bold">f 更新（未平方）：</text>
  <text x="200" y="276" font-size="11" fill="#555">ff = max(f, 0) + x = max(1, 0) + (-4) = -3</text>

  <text x="60" y="304" font-size="11" fill="#d6a040" font-weight="bold">g 更新（已平方，二选一）：</text>
  <text x="80" y="326" font-size="11" fill="#b85450">候选① 在此处平方：max(f, 0) + x² = 1 + 16 = 17  ← 选中</text>
  <text x="80" y="348" font-size="11" fill="#446688">候选② 延展已操作段：g + x = 3 + (-4) = -1</text>
  <text x="200" y="370" font-size="11" fill="#333" font-weight="bold">gg = max(17, -1) = 17 ⭐</text>
</svg>
