<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">核心观察：枚举合法时间，逐字符匹配</text>

  <!-- pattern label -->
  <text x="120" y="80" text-anchor="end" font-size="12" fill="#888" filter="url(#rough2)">pattern</text>

  <!-- pattern row: ? 5 : 0 0 -->
  <g filter="url(#rough2)">
    <rect x="162" y="56" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="210" y="56" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="258" y="56" width="44" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="306" y="56" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="354" y="56" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="18" fill="#333" filter="url(#rough2)">
    <text x="184" y="84" text-anchor="middle" fill="#d6a040" font-weight="bold">?</text>
    <text x="232" y="84" text-anchor="middle">5</text>
    <text x="280" y="84" text-anchor="middle">:</text>
    <text x="328" y="84" text-anchor="middle">0</text>
    <text x="376" y="84" text-anchor="middle">0</text>
  </g>
  <text x="430" y="84" font-size="11" fill="#888" filter="url(#rough2)">← '?' 未知，通配任意数字</text>

  <!-- arrow down: 枚举合法时间 -->
  <path d="M280 110 L280 128" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="124" font-size="11" fill="#446688" filter="url(#rough2)">枚举 0..1439</text>

  <!-- candidate row 1: 05:00 ✓ -->
  <g filter="url(#rough2)">
    <rect x="162" y="132" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="210" y="132" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="258" y="132" width="44" height="40" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="306" y="132" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="354" y="132" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="16" fill="#333" filter="url(#rough2)">
    <text x="184" y="158" text-anchor="middle">0</text>
    <text x="232" y="158" text-anchor="middle">5</text>
    <text x="280" y="158" text-anchor="middle">:</text>
    <text x="328" y="158" text-anchor="middle">0</text>
    <text x="376" y="158" text-anchor="middle">0</text>
  </g>
  <text x="412" y="158" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 合法</text>

  <!-- candidate row 2: 15:00 ✓ -->
  <g filter="url(#rough2)">
    <rect x="162" y="178" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="210" y="178" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="258" y="178" width="44" height="40" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="306" y="178" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="354" y="178" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="16" fill="#333" filter="url(#rough2)">
    <text x="184" y="204" text-anchor="middle">1</text>
    <text x="232" y="204" text-anchor="middle">5</text>
    <text x="280" y="204" text-anchor="middle">:</text>
    <text x="328" y="204" text-anchor="middle">0</text>
    <text x="376" y="204" text-anchor="middle">0</text>
  </g>
  <text x="412" y="204" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 合法</text>

  <!-- candidate row 3: 25:00 — pattern matches but illegal, NOT in enum set -->
  <g filter="url(#rough2)">
    <rect x="162" y="224" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="210" y="224" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="258" y="224" width="44" height="40" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="306" y="224" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="354" y="224" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="16" fill="#999" filter="url(#rough2)">
    <text x="184" y="250" text-anchor="middle" fill="#b85450">2</text>
    <text x="232" y="250" text-anchor="middle">5</text>
    <text x="280" y="250" text-anchor="middle">:</text>
    <text x="328" y="250" text-anchor="middle">0</text>
    <text x="376" y="250" text-anchor="middle">0</text>
  </g>
  <!-- strike through 25:00 -->
  <path d="M158 244 L402 244" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="412" y="250" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 非法 (25&gt;23)</text>
  <text x="412" y="265" font-size="10" fill="#b85450" filter="url(#rough2)">本就不在枚举集</text>

  <!-- insight box 1 -->
  <rect x="30" y="288" width="500" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">枚举 0..1439 → 每个 t 都是合法时间 00:00..23:59，无需校验合法性</text>

  <!-- insight box 2 -->
  <rect x="30" y="332" width="500" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">'?' 视为通配符： pattern[i]=='?' 或 pattern[i]==s[i] 即匹配</text>
  <text x="280" y="366" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">匹配的合法时间数 = 答案</text>
</svg>
