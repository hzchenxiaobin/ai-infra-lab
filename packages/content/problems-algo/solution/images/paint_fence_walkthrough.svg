<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 3, k = 2（颜色 A / B）</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">逐根递推 diff[i] / same[i]，total = diff + same</text>

  <!-- Column headers -->
  <text x="90" y="76" font-size="12" fill="#888">i</text>
  <text x="210" y="76" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">diff[i]</text>
  <text x="330" y="76" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">same[i]</text>
  <text x="450" y="76" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">total[i]</text>

  <!-- i = 0 -->
  <rect x="60" y="84" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="90" y="105" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="150" y="84" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="210" y="105" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="270" y="84" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="330" y="105" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="390" y="84" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="450" y="105" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="90" y="130" font-size="10" fill="#888">第一根：k=2 种，无前驱 → 全归 diff，same=0</text>

  <!-- i = 1 -->
  <rect x="60" y="140" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="90" y="161" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="150" y="140" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="210" y="161" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="270" y="140" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="330" y="161" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="390" y="140" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="450" y="161" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="90" y="186" font-size="10" fill="#888">diff=(2+0)×1=2    same=旧 diff=2    total=4</text>

  <!-- i = 2 -->
  <rect x="60" y="196" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="90" y="217" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="150" y="196" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="210" y="217" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="270" y="196" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="330" y="217" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="390" y="196" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="217" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="90" y="242" font-size="10" fill="#888">diff=(2+2)×1=4    same=旧 diff=2    total=6</text>

  <!-- Answer -->
  <rect x="60" y="258" width="450" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="285" y="281" text-anchor="middle" font-size="13" fill="#333">答案 = total[2] = diff + same = 4 + 2 = </text>
  <text x="492" y="281" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">6</text>

  <!-- Enumerate all 6 valid schemes (8 total minus AAA, BBB which are 3-consecutive) -->
  <text x="60" y="316" font-size="12" fill="#555" font-weight="bold">枚举验证（k=2 共 2³=8 种，去掉三连的 A A A 与 B B B，余 6 种合法）：</text>

  <!-- ① A A B -->
  <g filter="url(#rough2)">
    <rect x="60" y="328" width="28" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="74" y="353" text-anchor="middle" font-size="11" fill="#333">A</text>
    <rect x="88" y="328" width="28" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="102" y="353" text-anchor="middle" font-size="11" fill="#333">A</text>
    <rect x="116" y="328" width="28" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
    <text x="130" y="353" text-anchor="middle" font-size="11" fill="#333">B</text>
    <text x="155" y="353" font-size="10" fill="#4a7a3a">①</text>
  </g>

  <!-- ② A B A -->
  <g filter="url(#rough2)">
    <rect x="180" y="328" width="28" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="194" y="353" text-anchor="middle" font-size="11" fill="#333">A</text>
    <rect x="208" y="328" width="28" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
    <text x="222" y="353" text-anchor="middle" font-size="11" fill="#333">B</text>
    <rect x="236" y="328" width="28" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="250" y="353" text-anchor="middle" font-size="11" fill="#333">A</text>
    <text x="275" y="353" font-size="10" fill="#4a7a3a">②</text>
  </g>

  <!-- ③ A B B -->
  <g filter="url(#rough2)">
    <rect x="300" y="328" width="28" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="314" y="353" text-anchor="middle" font-size="11" fill="#333">A</text>
    <rect x="328" y="328" width="28" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
    <text x="342" y="353" text-anchor="middle" font-size="11" fill="#333">B</text>
    <rect x="356" y="328" width="28" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
    <text x="370" y="353" text-anchor="middle" font-size="11" fill="#333">B</text>
    <text x="395" y="353" font-size="10" fill="#4a7a3a">③</text>
  </g>

  <!-- ④ B B A -->
  <g filter="url(#rough2)">
    <rect x="60" y="378" width="28" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
    <text x="74" y="403" text-anchor="middle" font-size="11" fill="#333">B</text>
    <rect x="88" y="378" width="28" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
    <text x="102" y="403" text-anchor="middle" font-size="11" fill="#333">B</text>
    <rect x="116" y="378" width="28" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="130" y="403" text-anchor="middle" font-size="11" fill="#333">A</text>
    <text x="155" y="403" font-size="10" fill="#4a7a3a">④</text>
  </g>

  <!-- ⑤ B A B -->
  <g filter="url(#rough2)">
    <rect x="180" y="378" width="28" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
    <text x="194" y="403" text-anchor="middle" font-size="11" fill="#333">B</text>
    <rect x="208" y="378" width="28" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="222" y="403" text-anchor="middle" font-size="11" fill="#333">A</text>
    <rect x="236" y="378" width="28" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
    <text x="250" y="403" text-anchor="middle" font-size="11" fill="#333">B</text>
    <text x="275" y="403" font-size="10" fill="#4a7a3a">⑤</text>
  </g>

  <!-- ⑥ B A A -->
  <g filter="url(#rough2)">
    <rect x="300" y="378" width="28" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
    <text x="314" y="403" text-anchor="middle" font-size="11" fill="#333">B</text>
    <rect x="328" y="378" width="28" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="342" y="403" text-anchor="middle" font-size="11" fill="#333">A</text>
    <rect x="356" y="378" width="28" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="370" y="403" text-anchor="middle" font-size="11" fill="#333">A</text>
    <text x="395" y="403" font-size="10" fill="#4a7a3a">⑥</text>
  </g>

  <text x="448" y="378" font-size="11" fill="#888">合法 6 种</text>
  <text x="448" y="395" font-size="11" fill="#b85450">与 DP 一致 ✓</text>
</svg>
