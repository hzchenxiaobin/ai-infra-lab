<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：康托展开——逐位统计「更小候选 × 剩余阶乘」（perm = [3,1,2]）</text>

  <!-- segment 1: first digit = 1 -->
  <rect x="50" y="38" width="168" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="134" y="53" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">首位 = 1 · 共 2! = 2 个</text>
  <text x="92" y="70" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">0</text>
  <rect x="100" y="58" width="22" height="16" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="124" y="58" width="22" height="16" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="148" y="58" width="22" height="16" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="111" y="70" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="135" y="70" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="159" y="70" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="92" y="90" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <rect x="100" y="78" width="22" height="16" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="124" y="78" width="22" height="16" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="148" y="78" width="22" height="16" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="111" y="90" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="135" y="90" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="159" y="90" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>

  <!-- segment 2: first digit = 2 -->
  <rect x="50" y="102" width="168" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="134" y="117" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">首位 = 2 · 共 2! = 2 个</text>
  <text x="92" y="134" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>
  <rect x="100" y="122" width="22" height="16" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="124" y="122" width="22" height="16" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="148" y="122" width="22" height="16" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="111" y="134" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="135" y="134" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="159" y="134" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="92" y="154" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <rect x="100" y="142" width="22" height="16" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="124" y="142" width="22" height="16" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="148" y="142" width="22" height="16" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="111" y="154" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="135" y="154" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="159" y="154" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>

  <!-- segment 3: first digit = 3 -->
  <rect x="50" y="166" width="168" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="134" y="181" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">首位 = 3 · 共 2! = 2 个</text>
  <text x="92" y="198" text-anchor="end" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="100" y="186" width="22" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="124" y="186" width="22" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="148" y="186" width="22" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="111" y="198" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="135" y="198" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="159" y="198" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="174" y="198" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">← perm</text>
  <text x="92" y="218" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">5</text>
  <rect x="100" y="206" width="22" height="16" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="124" y="206" width="22" height="16" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="148" y="206" width="22" height="16" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="111" y="218" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="135" y="218" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="159" y="218" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>

  <!-- step cards -->
  <rect x="236" y="38" width="264" height="54" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="368" y="60" text-anchor="middle" font-size="10.8" fill="#333" filter="url(#rough2)">i=0 放 3：更小剩余候选 {1, 2} → 2 个</text>
  <text x="368" y="81" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">跳过 2 段，2 × 2! = 4</text>

  <rect x="236" y="100" width="264" height="54" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="368" y="122" text-anchor="middle" font-size="10.8" fill="#333" filter="url(#rough2)">i=1 放 1：剩余候选 {1, 2}，更小 → ∅</text>
  <text x="368" y="143" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">0 × 1! = 0</text>

  <rect x="236" y="162" width="264" height="54" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="368" y="184" text-anchor="middle" font-size="10.8" fill="#333" filter="url(#rough2)">i=2 放 2：剩余候选 {2}，更小 → ∅</text>
  <text x="368" y="205" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">0 × 0! = 0</text>

  <!-- result box -->
  <rect x="236" y="226" width="264" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="368" y="252" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">rank = 2×2! + 0×1! + 0×0! = 4</text>

  <!-- bottom note -->
  <rect x="36" y="282" width="448" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">每个更小候选放在位置 i，右侧 n−1−i 位可任意排 → (n−1−i)! 个更靠前的排列</text>
  <text x="260" y="328" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">逐位累加「整段跳过」的排列数 = perm 之前的排列总数 = 字典序下标（0-based）</text>
</svg>
