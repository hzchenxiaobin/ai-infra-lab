<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：除以最大真因子 = 变成最小质因子</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">因子成对 d ↔ x/d，最大真因子 ↔ 最小的大于 1 的因子 = SPF(x)</text>

  <!-- 区1：12 的主演示 -->
  <text x="260" y="68" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">以 x = 12 为例：12 = 2 × 6，最小质因子 2 ↔ 最大真因子 6</text>

  <rect x="140" y="80" width="60" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="170" y="107" text-anchor="middle" font-size="18" fill="#33506b" font-weight="bold" filter="url(#rough2)">12</text>

  <path d="M 204 101 L 230 101" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="234" y="84" width="112" height="34" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="105" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">÷ 最大真因子 6</text>

  <path d="M 350 101 L 374 101" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="378" y="80" width="52" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="404" y="107" text-anchor="middle" font-size="18" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="260" y="148" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">6 = 12 / SPF(12)，于是 12 ÷ 6 = SPF(12) = 2 —— 操作的终点永远是最小质因子</text>

  <!-- 区2：映射行 -->
  <text x="260" y="176" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">一次操作的映射：合数 → 最小质因子</text>

  <!-- 组1: 25 -> 5 -->
  <rect x="30" y="188" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="48" y="207" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">25</text>
  <path d="M 68 202 L 84 202" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="88" y="188" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="106" y="207" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">5</text>
  <text x="77" y="234" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">25 = 5×5</text>

  <!-- 组2: 12 -> 2 -->
  <rect x="146" y="188" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="207" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">12</text>
  <path d="M 184 202 L 200 202" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="204" y="188" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="207" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">2</text>
  <text x="193" y="234" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">12 = 2×6</text>

  <!-- 组3: 9 -> 3 -->
  <rect x="262" y="188" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="207" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">9</text>
  <path d="M 300 202 L 316 202" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="320" y="188" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="207" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">3</text>
  <text x="309" y="234" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">9 = 3×3</text>

  <!-- 组4: 8 -> 2 -->
  <rect x="378" y="188" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="396" y="207" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">8</text>
  <path d="M 416 202 L 432 202" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="436" y="188" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="454" y="207" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">2</text>
  <text x="425" y="234" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">8 = 2×4</text>

  <!-- 区3：死子 -->
  <text x="260" y="262" text-anchor="middle" font-size="11.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">质数与 1 是「死子」——动不了，也动不了第二次</text>

  <text x="46" y="292" font-size="10.5" fill="#555" filter="url(#rough2)">质数：</text>
  <rect x="92" y="276" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="110" y="295" text-anchor="middle" font-size="12" fill="#8a3833" filter="url(#rough2)">7</text>
  <path d="M 130 290 L 156 290" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="163" y="288" text-anchor="middle" font-size="8.5" fill="#8a3833" filter="url(#rough2)">÷ 1</text>
  <rect x="182" y="276" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="295" text-anchor="middle" font-size="12" fill="#8a3833" filter="url(#rough2)">7</text>
  <text x="232" y="294" font-size="10" fill="#8a3833" filter="url(#rough2)">原地不动，永远卡死</text>

  <text x="46" y="330" font-size="10.5" fill="#555" filter="url(#rough2)">合数：</text>
  <rect x="92" y="314" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="333" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">12</text>
  <path d="M 130 328 L 156 328" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="160" y="314" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="333" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">2</text>
  <path d="M 198 328 L 224 328" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="234" y="332" font-size="10" fill="#8a3833" filter="url(#rough2)">2 是质数，到头了</text>

  <text x="46" y="366" font-size="10.5" fill="#555" filter="url(#rough2)">数字 1：</text>
  <rect x="92" y="350" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="110" y="369" text-anchor="middle" font-size="12" fill="#8a3833" filter="url(#rough2)">1</text>
  <text x="142" y="368" font-size="10" fill="#8a3833" filter="url(#rough2)">没有严格小于 1 的正因子，无从操作</text>

  <text x="300" y="368" font-size="10" fill="#555" filter="url(#rough2)">（好在 1 也最小，</text>
  <text x="300" y="382" font-size="10" fill="#555" filter="url(#rough2)">pre ≥ 1 时它从不挡路）</text>

  <!-- 底部结论 -->
  <rect x="20" y="396" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="411" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">每个位置的终值只有两种可能：final[i] ∈ { nums[i], SPF(nums[i]) }</text>
  <text x="260" y="425" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">操作 = 一次性的「跳崖开关」：不按（保持原值）或按一下（落到最小质因子）</text>
</svg>
