<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 510" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="510" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：digits=[1,3,5,7]，n=100 → 答案 20</text>

  <!-- ===== 设定 ===== -->
  <rect x="60" y="40" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="300" y="62" text-anchor="middle" font-size="11" fill="#333">m = 4　｜　s = "100"　｜　k = 3</text>

  <path d="M 300 76 L 300 90" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Part 1 ===== -->
  <text x="34" y="110" font-size="11" fill="#446688" font-weight="bold">① 位数 &lt; 3 的数（全部有效）</text>

  <rect x="40" y="118" width="520" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <g font-size="11" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="90" y="138">长度</text>
    <text x="200" y="138">个数公式</text>
    <text x="330" y="138">具体数字</text>
    <text x="490" y="138">小计</text>
  </g>

  <rect x="40" y="150" width="520" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="90" y="169" font-weight="bold" filter="url(#rough2)">1</text>
    <text x="200" y="169" filter="url(#rough2)">m¹ = 4</text>
    <text x="330" y="169" filter="url(#rough2)">1, 3, 5, 7</text>
    <text x="490" y="169" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  </g>

  <rect x="40" y="180" width="520" height="28" fill="#f6f8fb" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="90" y="199" font-weight="bold" filter="url(#rough2)">2</text>
    <text x="200" y="199" filter="url(#rough2)">m² = 16</text>
    <text x="330" y="199" filter="url(#rough2)">11,13,…,77（共16个）</text>
    <text x="490" y="199" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">16</text>
  </g>

  <rect x="40" y="210" width="520" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)" opacity="0.6"/>
  <text x="430" y="228" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">第一部分合计 = 4 + 16 = 20</text>

  <path d="M 300 238 L 300 252" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Part 2 ===== -->
  <text x="34" y="270" font-size="11" fill="#4a7a3a" font-weight="bold">② 位数 = 3 且 ≤ 100（逐位匹配 "1 0 0"）</text>

  <!-- n digit strip -->
  <text x="34" y="294" font-size="10" fill="#888">n =</text>
  <rect x="70" y="280" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="90" y="299" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="114" y="280" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="134" y="299" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="158" y="280" width="40" height="28" fill="#f6f8fb" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="178" y="299" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">0</text>
  <text x="210" y="294" font-size="9" fill="#888">pos0</text>
  <text x="252" y="294" font-size="9" fill="#b85450">pos1 停</text>
  <text x="300" y="294" font-size="9" fill="#888">pos2</text>

  <!-- Part 2 table -->
  <rect x="40" y="312" width="520" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <g font-size="11" fill="#4a7a3a" font-weight="bold" text-anchor="middle">
    <text x="80" y="330">i</text>
    <text x="150" y="330">c=s[i]</text>
    <text x="240" y="330">less(&lt;c)</text>
    <text x="340" y="330">贡献=less×m^(k-1-i)</text>
    <text x="490" y="330">c∈D?</text>
  </g>

  <rect x="40" y="342" width="520" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="80" y="361" font-weight="bold" filter="url(#rough2)">0</text>
    <text x="150" y="361" filter="url(#rough2)">1</text>
    <text x="240" y="361" filter="url(#rough2)">0</text>
    <text x="340" y="361" filter="url(#rough2)">0 × 4² = 0</text>
    <text x="490" y="361" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是 → 继续</text>
  </g>

  <rect x="40" y="372" width="520" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="80" y="391" font-weight="bold" filter="url(#rough2)">1</text>
    <text x="150" y="391" filter="url(#rough2)">0</text>
    <text x="240" y="391" filter="url(#rough2)">0</text>
    <text x="340" y="391" filter="url(#rough2)">0 × 4¹ = 0</text>
    <text x="490" y="391" fill="#b85450" font-weight="bold" filter="url(#rough2)">否 → 停止</text>
  </g>

  <rect x="40" y="402" width="520" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)" opacity="0.6"/>
  <text x="300" y="420" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">第二部分合计 = 0（未走完，不加 n 本身）</text>

  <path d="M 300 430 L 300 444" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Result ===== -->
  <rect x="120" y="446" width="360" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="464" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">总答案 = 第一部分 + 第二部分</text>
  <text x="300" y="482" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">20 + 0 = 20  ✓</text>

  <rect x="120" y="492" width="360" height="14" fill="none"/>
</svg>
