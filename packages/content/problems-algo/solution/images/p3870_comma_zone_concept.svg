<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：逗号数只由位数决定，区间一档数完</text>

  <!-- 示例行：四个数字的书写对比 -->
  <rect x="42" y="40" width="104" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="94" y="58" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">999</text>
  <text x="94" y="78" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">→ 999</text>

  <rect x="154" y="40" width="104" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="206" y="58" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">1000</text>
  <text x="206" y="78" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">→ 1<tspan fill="#b85450" font-weight="bold">,</tspan>000</text>

  <rect x="266" y="40" width="104" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="318" y="58" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">56789</text>
  <text x="318" y="78" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">→ 56<tspan fill="#b85450" font-weight="bold">,</tspan>789</text>

  <rect x="378" y="40" width="104" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="58" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">100000</text>
  <text x="430" y="78" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">→ 100<tspan fill="#b85450" font-weight="bold">,</tspan>000</text>

  <text x="94" y="100" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">0 个逗号</text>
  <text x="206" y="100" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">1 个</text>
  <text x="318" y="100" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">1 个</text>
  <text x="430" y="100" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">1 个</text>

  <!-- 数轴分档带 -->
  <rect x="50" y="125" width="140" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="143" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">1 ~ 999</text>
  <text x="120" y="159" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">无逗号（1~3 位）</text>

  <rect x="190" y="125" width="280" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="143" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1000 ~ 100000（= 10⁵）</text>
  <text x="330" y="159" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">每个数恰好 1 个逗号（4~6 位）</text>

  <!-- 门槛虚线 -->
  <path d="M 190 118 L 190 172" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="190" y="113" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">门槛 1000</text>

  <!-- 数轴刻度 -->
  <text x="56" y="182" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="182" y="182" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">999</text>
  <text x="198" y="182" font-size="9.5" fill="#888" filter="url(#rough2)">1000</text>
  <text x="464" y="182" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">100000</text>

  <!-- 公式框 -->
  <rect x="95" y="200" width="330" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="222" text-anchor="middle" font-size="14" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">答案 = max(0, n − 999)</text>
  <text x="260" y="240" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">= 区间 [1000, n] 的整数个数（每数恰好 1 个逗号）</text>

  <!-- 阈值阶梯说明 -->
  <rect x="55" y="262" width="410" height="68" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="281" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">阈值阶梯（通用视角）</text>
  <text x="260" y="298" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">x ≥ 10³ ⇒ 至少 1 个逗号；x ≥ 10⁶ ⇒ 至少 2 个；依此类推</text>
  <text x="260" y="316" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">本题 n ≤ 10⁵ &lt; 10⁶，永远停在第一档 ⇒ 一档数完</text>

  <text x="260" y="348" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">通式：Total(n) = Σ（m ≥ 1）max(0, n − 10^(3·m) + 1)</text>
</svg>
