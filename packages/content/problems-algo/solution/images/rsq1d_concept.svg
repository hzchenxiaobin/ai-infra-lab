<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="340" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">一维前缀和：两段相减求区间和</text>

  <!-- nums 索引标号 0..5 -->
  <text x="120" y="52" text-anchor="middle" font-size="10" fill="#999">i=0</text>
  <text x="168" y="52" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="216" y="52" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="264" y="52" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="312" y="52" text-anchor="middle" font-size="10" fill="#999">4</text>
  <text x="360" y="52" text-anchor="middle" font-size="10" fill="#999">5</text>

  <!-- nums 标签 -->
  <text x="70" y="92" text-anchor="end" font-size="12" fill="#777" font-weight="bold">nums</text>

  <!-- nums 单元格：[2..5] 高亮橙色，其余白色 -->
  <rect x="96" y="62" width="48" height="48" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="144" y="62" width="48" height="48" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="192" y="62" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="240" y="62" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="288" y="62" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="336" y="62" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>

  <!-- nums 值 -->
  <text x="120" y="92" text-anchor="middle" font-size="14" fill="#666">−2</text>
  <text x="168" y="92" text-anchor="middle" font-size="14" fill="#666">0</text>
  <text x="216" y="92" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">3</text>
  <text x="264" y="92" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">−5</text>
  <text x="312" y="92" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">2</text>
  <text x="360" y="92" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">−1</text>

  <!-- 目标段标注（橙色括号线） -->
  <path d="M192 116 L192 122 L384 122 L384 116" fill="none" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="288" y="120" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">目标区间 nums[left..right]</text>

  <!-- pre 索引标号（在 nums 边界处）-->
  <text x="96" y="146" text-anchor="middle" font-size="10" fill="#999">pre[0]</text>
  <text x="144" y="146" text-anchor="middle" font-size="10" fill="#999">[1]</text>
  <text x="192" y="146" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">[2]</text>
  <text x="240" y="146" text-anchor="middle" font-size="10" fill="#999">[3]</text>
  <text x="288" y="146" text-anchor="middle" font-size="10" fill="#999">[4]</text>
  <text x="336" y="146" text-anchor="middle" font-size="10" fill="#999">[5]</text>
  <text x="384" y="146" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">[6]</text>

  <!-- pre 标签 -->
  <text x="70" y="178" text-anchor="end" font-size="12" fill="#777" font-weight="bold">pre</text>

  <!-- pre 单元格（居中在边界处 = nums[i] 左边缘，体现 pre[i]=前 i 个元素之和）-->
  <rect x="75" y="154" width="42" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="123" y="154" width="42" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="171" y="154" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="219" y="154" width="42" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="267" y="154" width="42" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="315" y="154" width="42" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="363" y="154" width="42" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>

  <!-- pre 值 -->
  <text x="96" y="178" text-anchor="middle" font-size="13" fill="#666">0</text>
  <text x="144" y="178" text-anchor="middle" font-size="13" fill="#666">−2</text>
  <text x="192" y="178" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">−2</text>
  <text x="240" y="178" text-anchor="middle" font-size="13" fill="#666">1</text>
  <text x="288" y="178" text-anchor="middle" font-size="13" fill="#666">−4</text>
  <text x="336" y="178" text-anchor="middle" font-size="13" fill="#666">−2</text>
  <text x="384" y="178" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−3</text>

  <!-- +/− 角色标记 -->
  <text x="192" y="208" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">−</text>
  <text x="384" y="208" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">+</text>
  <text x="192" y="222" text-anchor="middle" font-size="9" fill="#446688">pre[left]</text>
  <text x="384" y="222" text-anchor="middle" font-size="9" fill="#b85450">pre[right+1]</text>

  <!-- 公式框 -->
  <rect x="32" y="234" width="476" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="270" y="260" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">两段相减查询公式（pre[i] = nums[0]+…+nums[i−1]，pre[0]=0）</text>
  <text x="270" y="288" text-anchor="middle" font-size="16" fill="#444">
    <tspan fill="#333">sumRange = </tspan>
    <tspan fill="#b85450" font-weight="bold">pre[right+1]</tspan>
    <tspan fill="#333">  −  </tspan>
    <tspan fill="#446688" font-weight="bold">pre[left]</tspan>
  </text>
  <text x="270" y="309" text-anchor="middle" font-size="12" fill="#777">本例 sumRange(2, 5) = (−3) − (−2) = −1 ✓</text>
</svg>
