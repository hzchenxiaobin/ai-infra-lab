<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "dcab", pairs = [[0,3],[1,2]]</text>

  <!-- Table header -->
  <rect x="24" y="46" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="59" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步骤</text>
  <rect x="94" y="46" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="129" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">pair</text>
  <rect x="164" y="46" width="130" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">parent[]</text>
  <rect x="294" y="46" width="220" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="404" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">说明</text>

  <!-- Row 0: init -->
  <rect x="24" y="72" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="59" y="91" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">init</text>
  <rect x="94" y="72" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="129" y="91" text-anchor="middle" font-size="11" fill="#888">—</text>
  <rect x="164" y="72" width="130" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="229" y="91" text-anchor="middle" font-size="11" fill="#333">[0, 1, 2, 3]</text>
  <rect x="294" y="72" width="220" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="404" y="91" text-anchor="middle" font-size="10.5" fill="#666">各自为根</text>

  <!-- Row 1: (0,3) -->
  <rect x="24" y="100" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="59" y="119" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">①</text>
  <rect x="94" y="100" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="129" y="119" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(0,3)</text>
  <rect x="164" y="100" width="130" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="119" text-anchor="middle" font-size="11" fill="#333">[0, 1, 2, <tspan fill="#b85450" font-weight="bold">0</tspan>]</text>
  <rect x="294" y="100" width="220" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="404" y="119" text-anchor="middle" font-size="10.5" fill="#446688">union(0,3): parent[3]=0</text>

  <!-- Row 2: (1,2) -->
  <rect x="24" y="128" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="59" y="147" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">②</text>
  <rect x="94" y="128" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="129" y="147" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">(1,2)</text>
  <rect x="164" y="128" width="130" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="147" text-anchor="middle" font-size="11" fill="#333">[0, 1, <tspan fill="#b85450" font-weight="bold">1</tspan>, 0]</text>
  <rect x="294" y="128" width="220" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="404" y="147" text-anchor="middle" font-size="10.5" fill="#4a7a3a">union(1,2): parent[2]=1</text>

  <!-- Row 3: 分组 -->
  <rect x="24" y="160" width="490" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="179" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">③ 分组：find(0)=0, find(1)=1, find(2)=1, find(3)=0 → {0,3} 根 0, {1,2} 根 1</text>

  <!-- Row 4: 排序 -->
  <rect x="24" y="192" width="490" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④ 各分量内排序</text>
  <text x="270" y="226" text-anchor="middle" font-size="10.5" fill="#666">{0,3}: chars [d,b] → sorted [b,d]　|　{1,2}: chars [c,a] → sorted [a,c]</text>

  <!-- Row 5: 回填 -->
  <rect x="24" y="238" width="490" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="256" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">⑤ 回填：res[0]=b, res[1]=a, res[2]=c, res[3]=d</text>
  <text x="270" y="272" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结果 = "bacd"</text>

  <!-- Result visualization -->
  <text x="270" y="298" text-anchor="middle" font-size="10.5" fill="#888">原串 d c a b → 排序后 b a c d</text>

  <rect x="140" y="308" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="160" y="330" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>
  <rect x="184" y="308" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="204" y="330" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="228" y="308" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="248" y="330" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">c</text>
  <rect x="272" y="308" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="292" y="330" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">d</text>
  <text x="332" y="330" font-size="12" fill="#4a7a3a" font-weight="bold">= "bacd"</text>

  <!-- Bottom note -->
  <rect x="40" y="352" width="460" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="367" text-anchor="middle" font-size="10" fill="#444">两分量独立排序，互不影响 → 全局字典序最小</text>
</svg>
