<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="860" height="640" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">move(direction) 算法流程</text>
  <path d="M 300 44 Q 430 52 560 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 1. start -->
  <g filter="url(#sk)"><rect x="350" y="62" width="160" height="36" rx="18" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="430" y="86" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">move(direction)</text>
  <path d="M 430 100 L 430 116" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 2. compute new head -->
  <g filter="url(#sk)"><rect x="330" y="120" width="200" height="48" rx="6" fill="#fff" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="430" y="140" text-anchor="middle" font-size="12" fill="#333">从队首取头 (i,j)</text>
  <text x="430" y="158" text-anchor="middle" font-size="12" fill="#333">按方向得新头 (x,y)</text>
  <path d="M 430 170 L 430 184" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 3. decision: 越界 -->
  <g filter="url(#sk)"><path d="M 430 188 L 530 222 L 430 256 L 330 222 Z" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="430" y="218" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">越界?</text>
  <text x="430" y="234" text-anchor="middle" font-size="10.5" fill="#7a5415">x/y 出界</text>
  <!-- yes -> return -1 -->
  <path d="M 530 222 L 620 222" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="566" y="216" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="624" y="204" width="120" height="36" rx="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="684" y="228" text-anchor="middle" font-size="12.5" fill="#b03a3a" font-weight="bold">return -1</text>
  <path d="M 430 256 L 430 270" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="446" y="266" font-size="11" fill="#3a6e2e" font-weight="bold">否</text>

  <!-- 4. decision: 食物 -->
  <g filter="url(#sk)"><path d="M 430 274 L 540 312 L 430 350 L 320 312 Z" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="430" y="308" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">食物在 (x,y)?</text>
  <text x="430" y="324" text-anchor="middle" font-size="10" fill="#2e6e2e">foodIdx 处</text>
  <!-- yes branch (left) -->
  <path d="M 320 312 L 230 312" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="276" y="306" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="70" y="290" width="160" height="50" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="150" y="310" text-anchor="middle" font-size="11.5" fill="#b03a3a" font-weight="bold">score++, foodIdx++</text>
  <text x="150" y="328" text-anchor="middle" font-size="11" fill="#b03a3a">不弹尾（蛇变长）</text>
  <!-- no branch (right) -->
  <path d="M 540 312 L 640 312" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="588" y="306" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">否</text>
  <g filter="url(#sk)"><rect x="644" y="290" width="176" height="50" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="732" y="310" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">pop_back + erase</text>
  <text x="732" y="328" text-anchor="middle" font-size="11" fill="#2e6e2e">弹尾（尾前移）</text>

  <!-- merge down -->
  <path d="M 150 340 Q 150 372 320 372" stroke="#5a5a5a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 732 340 Q 732 372 540 372" stroke="#5a5a5a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 430 372 L 430 392" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- critical callout -->
  <g filter="url(#sk)"><rect x="540" y="356" width="220" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 3"/></g>
  <text x="650" y="376" text-anchor="middle" font-size="11.5" fill="#a06820" font-weight="bold">★ 关键顺序</text>
  <text x="650" y="392" text-anchor="middle" font-size="10.5" fill="#a06820">先弹尾 → 再判撞身</text>

  <!-- 5. decision: 撞身 -->
  <g filter="url(#sk)"><path d="M 430 396 L 530 432 L 430 468 L 330 432 Z" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="430" y="428" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">(x,y) in vis?</text>
  <text x="430" y="444" text-anchor="middle" font-size="10.5" fill="#7a5415">撞移动后身体</text>
  <!-- yes -> return -1 -->
  <path d="M 530 432 L 620 432" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="566" y="426" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="624" y="414" width="120" height="36" rx="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="684" y="438" text-anchor="middle" font-size="12.5" fill="#b03a3a" font-weight="bold">return -1</text>
  <path d="M 430 468 L 430 484" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="446" y="478" font-size="11" fill="#3a6e2e" font-weight="bold">否</text>

  <!-- 6. push head -->
  <g filter="url(#sk)"><rect x="320" y="488" width="220" height="48" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="430" y="508" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">push_front + insert</text>
  <text x="430" y="526" text-anchor="middle" font-size="11.5" fill="#2e6e2e">新头入队首 + 入集合</text>
  <path d="M 430 538 L 430 554" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 7. return score -->
  <g filter="url(#sk)"><rect x="350" y="558" width="160" height="36" rx="18" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="430" y="582" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">return score</text>

  <!-- bottom note -->
  <text x="430" y="618" text-anchor="middle" font-size="10.5" fill="#888">弹尾在判撞身之前 → 蛇头可进入「上一刻的尾巴位置」（尾已前移）；吃食物时不弹尾 → 全身保留</text>
</svg>
