<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：单次遍历 + 段内维护 (sum, max)</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">颜色变化时结算上一段：ans += sum − max；末尾再结算一次</text>

  <!-- Start -->
  <rect x="200" y="58" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="78" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">ans=0, sum=0, mx=0</text>

  <!-- Arrow down to loop -->
  <path d="M 260 90 L 260 108" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop box -->
  <rect x="60" y="110" width="400" height="150" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6,4" rx="8" filter="url(#rough2)"/>
  <text x="74" y="128" font-size="11" fill="#d6a040" font-weight="bold">for i = 0 .. n−1</text>

  <!-- Decision: colors[i] != colors[i-1]? -->
  <polygon points="260,140 380,180 260,220 140,180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="176" text-anchor="middle" font-size="10.5" fill="#333">i &gt; 0 且</text>
  <text x="260" y="190" text-anchor="middle" font-size="10.5" fill="#333">colors[i] ≠ colors[i−1]?</text>

  <!-- Yes branch (left) -->
  <path d="M 140 180 L 100 180 L 100 236" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="108" y="174" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="40" y="238" width="120" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="252" text-anchor="middle" font-size="9.5" fill="#333">结算：ans += sum−mx</text>

  <!-- No branch (right) -->
  <path d="M 380 180 L 420 180 L 420 236" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="174" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="360" y="238" width="120" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="252" text-anchor="middle" font-size="9.5" fill="#333">同色段继续</text>

  <!-- Common: update sum & mx -->
  <path d="M 100 258 L 100 274 L 260 274" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 258 L 420 274 L 260 274" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="276" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">sum += t[i]; mx = max(mx, t[i])</text>
  <text x="120" y="248" font-size="9.5" fill="#b85450">↓ 顺便重置 sum=mx=0</text>

  <!-- Loop back arrow -->
  <path d="M 370 291 L 470 291 L 470 185 L 380 185" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="240" font-size="9.5" fill="#888">下个 i</text>

  <!-- After loop: flush last run -->
  <path d="M 260 308 L 260 326" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="130" y="328" width="260" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="346" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">末尾结算：ans += sum − mx（最后一段）</text>

  <!-- Return -->
  <text x="260" y="372" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">return ans</text>
</svg>
