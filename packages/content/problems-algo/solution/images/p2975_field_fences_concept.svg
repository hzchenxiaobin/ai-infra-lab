<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">「移除栅栏」=「任选两条水平线 + 两条垂直线」</text>

  <!-- ===== left: field of example 1 ===== -->
  <!-- square highlight x∈[1,3] y∈[1,3] -->
  <rect x="70" y="62" width="104" height="86" fill="#e6f4ea" fill-opacity="0.65" stroke="#4a7a3a" stroke-width="2.4" rx="3" filter="url(#rough2)"/>

  <!-- outer boundary fences (cannot remove): solid blue -->
  <path d="M 70 62 L 174 62" stroke="#446688" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <path d="M 70 192 L 174 192" stroke="#446688" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <path d="M 70 62 L 70 192" stroke="#446688" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <path d="M 174 62 L 174 192" stroke="#446688" stroke-width="2.6" fill="none" filter="url(#rough2)"/>

  <!-- inner removable fences: dashed orange -->
  <path d="M 70 105 L 174 105" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>
  <path d="M 70 148 L 174 148" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>
  <path d="M 122 62 L 122 192" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>

  <!-- y coordinate labels -->
  <text x="58" y="66" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">y=1</text>
  <text x="58" y="109" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">y=2</text>
  <text x="58" y="152" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">y=3</text>
  <text x="58" y="196" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">y=4</text>

  <!-- x coordinate labels -->
  <text x="70" y="208" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">x=1</text>
  <text x="122" y="208" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">x=2</text>
  <text x="174" y="208" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">x=3</text>

  <!-- legend -->
  <path d="M 52 228 L 74 228" stroke="#446688" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <text x="80" y="232" font-size="10.5" fill="#555" filter="url(#rough2)">外围栅栏（不可移除）</text>
  <path d="M 52 248 L 74 248" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <text x="80" y="252" font-size="10.5" fill="#555" filter="url(#rough2)">内部栅栏（可移除）</text>
  <rect x="52" y="262" width="22" height="14" fill="#e6f4ea" fill-opacity="0.65" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="80" y="274" font-size="10.5" fill="#555" filter="url(#rough2)">留下的正方形（边长 2）</text>

  <text x="122" y="302" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例 1：m=4, n=3（3×2 格）</text>

  <!-- ===== right: explanation ===== -->
  <rect x="222" y="52" width="252" height="170" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="348" y="76" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">正方形四条边 = 留下的栅栏：</text>
  <text x="348" y="100" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">上边 y=1（外围），下边 y=3（保留）</text>
  <text x="348" y="124" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">左边 x=1（外围），右边 x=3（外围）</text>
  <text x="348" y="148" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">中间的 y=2、x=2 全部拆掉</text>
  <text x="348" y="176" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">边长 d = |1−3| = |1−3| = 2</text>
  <text x="348" y="202" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">面积 = d² = 4</text>

  <path d="M 180 150 L 218 150" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="40" y="312" width="440" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="327" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">中间的栅栏不构成任何限制：选定四条边后，夹在中间的一律可拆</text>
</svg>
