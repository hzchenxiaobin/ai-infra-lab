<svg xmlns="http://www.w3.org/2000/svg" width="860" height="740" viewBox="0 0 860 740" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="860" height="740" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">BFS 求最少拨动次数 · 算法流程</text>
  <path d="M 300 42 Q 430 50 560 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ① start -->
  <g filter="url(#sk)">
    <rect x="370" y="62" width="200" height="40" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="470" y="87" text-anchor="middle" font-size="12.5" fill="#34506e">① deadends 放入 dead 集合</text>

  <!-- D1: 0000 ∈ dead ? -->
  <g filter="url(#sk)">
    <polygon points="390,150 470,122 550,150 470,178" fill="#fef6e8" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="470" y="154" text-anchor="middle" font-size="12" fill="#7a5415">0000 ∈ dead ?</text>
  <path d="M 470 104 L 470 122" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  <!-- D1 Yes -> return -1 -->
  <path d="M 550 150 L 686 150" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="600" y="144" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="686" y="132" width="120" height="36" rx="6" fill="#fdecee" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="746" y="154" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">返回 -1</text>

  <!-- D1 No -> D2 -->
  <path d="M 470 178 L 470 206" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  <text x="478" y="196" font-size="11" fill="#2e6e2e" font-weight="bold">否</text>

  <!-- D2: target == 0000 ? -->
  <g filter="url(#sk)">
    <polygon points="384,234 470,206 556,234 470,262" fill="#fef6e8" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="470" y="238" text-anchor="middle" font-size="12" fill="#7a5415">target == "0000" ?</text>
  <path d="M 556 234 L 686 234" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="600" y="228" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="686" y="216" width="120" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="746" y="238" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">返回 0</text>
  <path d="M 470 262 L 470 290" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  <text x="478" y="280" font-size="11" fill="#2e6e2e" font-weight="bold">否</text>

  <!-- ② init queue -->
  <g filter="url(#sk)">
    <rect x="348" y="290" width="244" height="42" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="470" y="307" text-anchor="middle" font-size="12" fill="#34506e">② 队列 q=[("0000",0)]</text>
  <text x="470" y="324" text-anchor="middle" font-size="12" fill="#34506e">visited = {"0000"}（入队即标记）</text>
  <path d="M 470 332 L 470 352" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

  <!-- D3: q 为空 ? -->
  <g filter="url(#sk)">
    <polygon points="392,380 470,352 548,380 470,408" fill="#fef6e8" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="470" y="384" text-anchor="middle" font-size="12" fill="#7a5415">队列为空 ?</text>
  <path d="M 548 380 L 686 380" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="600" y="374" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="686" y="362" width="120" height="36" rx="6" fill="#fdecee" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="746" y="384" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">返回 -1</text>
  <path d="M 470 408 L 470 436" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  <text x="478" y="426" font-size="11" fill="#2e6e2e" font-weight="bold">否</text>

  <!-- ③ pop front -->
  <g filter="url(#sk)">
    <rect x="354" y="436" width="232" height="40" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="470" y="461" text-anchor="middle" font-size="12.5" fill="#34506e">③ 取出队首 (cur, step)</text>
  <path d="M 470 476 L 470 500" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

  <!-- D4: cur == target ? -->
  <g filter="url(#sk)">
    <polygon points="392,528 470,500 548,528 470,556" fill="#fef6e8" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="470" y="532" text-anchor="middle" font-size="12" fill="#7a5415">cur == target ?</text>
  <path d="M 548 528 L 686 528" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="600" y="522" font-size="11" fill="#4a8e4a" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="686" y="510" width="120" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="746" y="532" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">返回 step ⭐</text>
  <path d="M 470 556 L 470 584" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  <text x="478" y="574" font-size="11" fill="#2e6e2e" font-weight="bold">否</text>

  <!-- ④ enumerate neighbors -->
  <g filter="url(#sk)">
    <rect x="338" y="584" width="264" height="42" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="470" y="602" text-anchor="middle" font-size="12" fill="#34506e">④ 枚举 8 个邻居 next</text>
  <text x="470" y="619" text-anchor="middle" font-size="11" fill="#7a7a7a">i ∈ 0..3, d ∈ {-1, +1}</text>
  <path d="M 470 626 L 470 648" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

  <!-- D5: next valid ? -->
  <g filter="url(#sk)">
    <polygon points="372,676 470,648 568,676 470,704" fill="#fef6e8" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="470" y="673" text-anchor="middle" font-size="11.5" fill="#7a5415">next ∉ visited</text>
  <text x="470" y="688" text-anchor="middle" font-size="11.5" fill="#7a5415">且 ∉ dead ?</text>

  <!-- D5 Yes -> F (enqueue) on left -->
  <path d="M 372 676 L 300 676" stroke="#4a8e4a" stroke-width="1.5" fill="none" marker-end="url(#arg)"/>
  <text x="320" y="670" font-size="11" fill="#4a8e4a" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="60" y="654" width="240" height="46" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="180" y="672" text-anchor="middle" font-size="11.5" fill="#2e6e2e">visited.add(next)</text>
  <text x="180" y="690" text-anchor="middle" font-size="11.5" fill="#2e6e2e">q.push((next, step+1))</text>

  <!-- F -> back up to ④ (next neighbor) -->
  <path d="M 180 654 L 180 605 L 338 605" stroke="#4a8e4a" stroke-width="1.3" fill="none" stroke-dasharray="5 3" marker-end="url(#arg)"/>
  <text x="186" y="636" font-size="10" fill="#4a8e4a">继续下一邻居</text>

  <!-- D5 No -> loop back up to ③ (pop next) along right -->
  <path d="M 568 676 L 624 676 L 624 456 L 586 456" stroke="#5a5a5a" stroke-width="1.3" fill="none" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="630" y="566" font-size="10" fill="#5a5a5a">处理完 8 个邻居</text>
  <text x="630" y="580" font-size="10" fill="#5a5a5a">→ 取下一队首</text>
  <text x="600" y="670" font-size="11" fill="#7a7a7a" font-weight="bold">否</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="60" y="716" width="740" height="0" fill="none"/>
  </g>
  <text x="430" y="730" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">关键纪律：入队时即标记 visited，保证每个状态只入队一次；首次到达 target 即最短</text>
</svg>
