<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#778899"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：离线区间 [ts, ts+60) 与三类提及的判定</text>

  <g filter="url(#rough2)">
    <text x="110" y="44" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">OFFLINE 10 id0</text>
    <text x="352" y="44" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a">t = 10+60 = 70 自动重新上线</text>

    <rect x="70" y="52" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="90" y="71" text-anchor="middle" font-size="10" fill="#2f5d24">在线</text>
    <rect x="110" y="52" width="240" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="230" y="71" text-anchor="middle" font-size="11" font-weight="bold" fill="#8f3a35">用户 0 离线 [10, 70)</text>
    <rect x="350" y="52" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="410" y="71" text-anchor="middle" font-size="10" fill="#2f5d24">在线</text>

    <text x="70" y="102" text-anchor="middle" font-size="10" fill="#666">0</text>
    <text x="110" y="102" text-anchor="middle" font-size="10" fill="#666">10</text>
    <text x="230" y="102" text-anchor="middle" font-size="10" fill="#666">40</text>
    <text x="350" y="102" text-anchor="middle" font-size="10" fill="#666">70</text>
    <text x="470" y="102" text-anchor="middle" font-size="10" fill="#666">100</text>

    <path d="M 55 112 L 486 112" stroke="#778899" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>
    <text x="492" y="116" font-size="10" fill="#666">t</text>

    <path d="M 110 150 L 110 120" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)" fill="none"/>
    <path d="M 230 150 L 230 120" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)" fill="none"/>
    <path d="M 350 150 L 350 120" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)" fill="none"/>

    <rect x="25" y="152" width="150" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="100" y="170" text-anchor="middle" font-size="10" fill="#8f3a35">MESSAGE t=10 "HERE"</text>
    <text x="100" y="186" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">✗ 不提及 id0</text>
    <text x="100" y="200" text-anchor="middle" font-size="9" fill="#8f3a35">（离线即刻生效）</text>

    <rect x="182" y="152" width="150" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="257" y="170" text-anchor="middle" font-size="10" fill="#8f3a35">MESSAGE t=40 "HERE"</text>
    <text x="257" y="186" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">✗ 不提及 id0</text>
    <text x="257" y="200" text-anchor="middle" font-size="9" fill="#8f3a35">（仍在离线区间内）</text>

    <rect x="339" y="152" width="150" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="414" y="170" text-anchor="middle" font-size="10" fill="#2f5d24">MESSAGE t=70 "HERE"</text>
    <text x="414" y="186" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a">✓ 提及 id0</text>
    <text x="414" y="200" text-anchor="middle" font-size="9" fill="#2f5d24">（t ≥ 70 已在线）</text>

    <text x="260" y="232" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">三类提及标识符</text>

    <rect x="25" y="240" width="150" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="100" y="258" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33506b">id&lt;number&gt;</text>
    <text x="100" y="276" text-anchor="middle" font-size="9.5" fill="#33506b">点名：离线用户也算</text>
    <text x="100" y="292" text-anchor="middle" font-size="9.5" fill="#33506b">重复出现 → 逐次 +1</text>

    <rect x="185" y="240" width="150" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="260" y="258" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5d24">HERE</text>
    <text x="260" y="276" text-anchor="middle" font-size="9.5" fill="#2f5d24">只提及当前在线用户</text>
    <text x="260" y="292" text-anchor="middle" font-size="9.5" fill="#2f5d24">判定：t ≥ offlineUntil</text>

    <rect x="345" y="240" width="150" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="420" y="258" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f">ALL</text>
    <text x="420" y="276" text-anchor="middle" font-size="9.5" fill="#8a6d1f">提及所有用户</text>
    <text x="420" y="292" text-anchor="middle" font-size="9.5" fill="#8a6d1f">（包括离线用户）</text>

    <text x="260" y="336" text-anchor="middle" font-size="10" fill="#8a6d1f">⚠ 同一时刻：状态变更（离线 / 重新上线）先于 MESSAGE 处理</text>
    <text x="260" y="352" text-anchor="middle" font-size="10" fill="#8a6d1f">故 t=10 已离线、t=70 已在线——两个边界都"偏向状态变更"</text>
  </g>
</svg>
