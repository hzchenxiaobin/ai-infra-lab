<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：扫描字符变化边界，闭合时段长 ≥ 3 则记录</text>

  <!-- Start -->
  <ellipse cx="260" cy="64" rx="40" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="13" fill="#333">开始</text>
  <path d="M 260 81 L 260 100" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="170" y="100" width="180" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="122" text-anchor="middle" font-size="13" fill="#333">start = 0, res = []</text>
  <path d="M 260 134 L 260 154" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop header -->
  <rect x="150" y="154" width="220" height="30" rx="6" fill="#f6f6f6" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="174" text-anchor="middle" font-size="11.5" fill="#333">for i = 1 → n（i = n 收尾末段）</text>
  <path d="M 260 184 L 260 205" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision1: boundary? -->
  <path d="M 260 205 L 360 240 L 260 275 L 160 240 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="236" text-anchor="middle" font-size="11.5" fill="#333">i == n 或</text>
  <text x="260" y="252" text-anchor="middle" font-size="11.5" fill="#333">s[i] ≠ s[i−1] ?</text>

  <!-- No: same group → loop back right -->
  <path d="M 360 240 L 420 240 L 420 169 L 370 169" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="398" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">否·同组</text>

  <!-- Yes: boundary → down -->
  <path d="M 260 275 L 260 300" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="282" y="292" font-size="11" fill="#b85450" font-weight="bold">是·断点</text>

  <!-- Decision2: length >= 3 ? -->
  <path d="M 260 300 L 360 335 L 260 370 L 160 335 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="340" text-anchor="middle" font-size="11.5" fill="#333">i − start ≥ 3 ?</text>

  <!-- Yes → append box (right) -->
  <path d="M 360 335 L 395 335" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="378" y="327" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="395" y="317" width="120" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="455" y="340" text-anchor="middle" font-size="11" fill="#333">res.append</text>
  <text x="455" y="354" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">([start, i−1])</text>
  <!-- append → start=i -->
  <path d="M 455 353 L 455 387 L 325 387" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- No → start=i (left/down) -->
  <path d="M 160 335 L 110 335 L 110 355 L 240 355 L 240 370" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="327" font-size="11" fill="#888" font-weight="bold">否·跳过</text>

  <!-- start = i box -->
  <rect x="200" y="370" width="125" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="262" y="392" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">start = i</text>

  <!-- loop back left to loop header -->
  <path d="M 200 387 L 80 387 L 80 169 L 150 169" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="282" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">下一轮 i</text>

  <!-- exit dashed down to return -->
  <path d="M 262 404 L 262 428" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="282" y="420" font-size="10.5" fill="#446688" font-style="italic">i &gt; n（循环结束）</text>

  <!-- return res -->
  <rect x="200" y="428" width="125" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="262" y="449" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">return res</text>
</svg>
