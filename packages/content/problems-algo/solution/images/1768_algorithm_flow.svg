<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：单索引 k 遍历到 max(n1,n2)，按位双判追加</text>

  <!-- Start -->
  <ellipse cx="260" cy="56" rx="42" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 260 74 L 260 92" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="150" y="96" width="220" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="117" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">res = [], k = 0</text>
  <text x="260" y="133" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">n1 = len(word1), n2 = len(word2)</text>

  <path d="M 260 142 L 260 162" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop header (diamond) -->
  <path d="M 260 168 L 360 200 L 260 232 L 160 200 Z" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">k &lt; max(n1, n2)?</text>
  <text x="260" y="212" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">否 → 跳到返回</text>

  <path d="M 260 232 L 260 252" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop body: two conditional appends -->
  <rect x="90" y="256" width="340" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">if k &lt; n1：res.append(word1[k])</text>
  <text x="260" y="297" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">if k &lt; n2：res.append(word2[k])</text>
  <text x="260" y="316" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">k += 1</text>

  <!-- loop back arrow -->
  <path d="M 90 292 Q 50 292 50 200 Q 50 188 160 200" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="40" y="250" font-size="9" fill="#888" filter="url(#rough2)">回</text>

  <path d="M 360 200 L 430 200 L 430 338 L 260 338 L 260 352" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return -->
  <ellipse cx="260" cy="372" rx="92" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="377" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 "".join(res)</text>
</svg>
