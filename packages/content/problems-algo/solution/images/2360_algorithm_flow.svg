<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">时间戳法（一次遍历）算法流程</text>

  <!-- Step 1: init -->
  <rect x="150" y="48" width="240" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">① 初始化</text>
  <text x="270" y="86" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">vis[0..n]=0, clock=1, ans=−1</text>
  <line x1="270" y1="96" x2="270" y2="118" stroke="#446688" stroke-width="2" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: pick unvisited -->
  <rect x="120" y="122" width="300" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="144" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">② 选起点 s（vis[s]==0）</text>
  <text x="270" y="162" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">start = clock，u = s</text>
  <text x="270" y="175" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">对每个节点各选一次，外层 n 轮</text>
  <line x1="270" y1="178" x2="270" y2="200" stroke="#446688" stroke-width="2" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: walk & stamp -->
  <rect x="100" y="204" width="340" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="226" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">③ 沿出边走并盖时间戳</text>
  <text x="270" y="244" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">vis[u] = clock; clock++; u = edges[u]</text>
  <text x="270" y="257" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">直到 u==−1 或 vis[u]!=0</text>
  <line x1="270" y1="260" x2="270" y2="282" stroke="#446688" stroke-width="2" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: decision diamond -->
  <polygon points="270,286 380,330 270,374 160,330" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="322" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">u≠−1 且</text>
  <text x="270" y="338" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">vis[u] ≥ start ?</text>

  <!-- yes -> cycle (left) -->
  <line x1="160" y1="330" x2="60" y2="330" stroke="#b85450" stroke-width="2" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="110" y="322" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="20" y="316" width="40" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="40" y="335" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">发现环</text>

  <!-- no -> old comp (right) -->
  <line x1="380" y1="330" x2="460" y2="330" stroke="#446688" stroke-width="2" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="420" y="322" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="416" y="316" width="60" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="446" y="335" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">汇入旧分量</text>

  <!-- Step 5: update ans (below, from yes branch) -->
  <line x1="40" y1="344" x2="40" y2="378" stroke="#b85450" stroke-width="2" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="120" y="384" width="300" height="28" rx="10" fill="#b85450" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="402" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold" filter="url(#rough2)">④ 环长 = clock − vis[u]，更新 ans；⑤ 返回 ans</text>

  <!-- Side notes -->
  <text x="452" y="234" font-size="11" fill="#d6a040" filter="url(#rough2)">每点只盖</text>
  <text x="452" y="250" font-size="11" fill="#d6a040" filter="url(#rough2)">一次戳 O(n)</text>
</svg>
