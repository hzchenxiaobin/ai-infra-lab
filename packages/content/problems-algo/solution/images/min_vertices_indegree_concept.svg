<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    DAG 中入度为 0 的顶点必选
  </text>

  <!-- 节点 0 (入度0, 答案) -->
  <ellipse cx="70" cy="120" rx="26" ry="22" fill="#fce4ec"
           stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="70" y="126" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="70" y="162" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">入度=0 ✅</text>

  <!-- 节点 1 -->
  <ellipse cx="210" cy="80" rx="24" ry="20" fill="#e8f0fe"
           stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="86" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="210" y="122" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">入度=1</text>

  <!-- 节点 2 -->
  <ellipse cx="350" cy="120" rx="24" ry="20" fill="#e8f0fe"
           stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="126" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="350" y="162" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">入度=2</text>

  <!-- 节点 3 (入度0, 答案) -->
  <ellipse cx="70" cy="250" rx="26" ry="22" fill="#fce4ec"
           stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="70" y="256" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="70" y="292" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">入度=0 ✅</text>

  <!-- 节点 4 -->
  <ellipse cx="210" cy="250" rx="24" ry="20" fill="#e8f0fe"
           stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="256" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="210" y="292" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">入度=1</text>

  <!-- 节点 5 -->
  <ellipse cx="470" cy="120" rx="24" ry="20" fill="#e8f0fe"
           stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="126" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <text x="470" y="162" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">入度=1</text>

  <!-- 边 0->1 -->
  <path d="M94,110 Q150,90 186,82" fill="none" stroke="#446688"
        stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 边 0->2 -->
  <path d="M96,128 Q220,140 326,124" fill="none" stroke="#446688"
        stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 边 2->5 -->
  <path d="M374,118 Q420,112 446,118" fill="none" stroke="#446688"
        stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 边 3->4 -->
  <path d="M96,250 Q150,250 186,250" fill="none" stroke="#446688"
        stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 边 4->2 -->
  <path d="M226,236 Q300,180 332,142" fill="none" stroke="#446688"
        stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 回溯示意: 2 <- 4 <- 3 (虚线) -->
  <path d="M332,138 Q300,180 230,238" fill="none" stroke="#b85450"
        stroke-width="1.2" stroke-dasharray="4,3" opacity="0.55" filter="url(#rough2)"/>

  <!-- 说明框 -->
  <rect x="350" y="220" width="200" height="130" rx="8" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="244" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    <tspan x="450" dy="0">必要：0、3 无人指向</tspan>
    <tspan x="450" dy="20">必须自己入选</tspan>
    <tspan x="450" dy="28">充分：1,2,4,5 沿入边</tspan>
    <tspan x="450" dy="18">回溯都到 0 或 3</tspan>
    <tspan x="450" dy="18">（虚线示回溯路径）</tspan>
  </text>
</svg>
