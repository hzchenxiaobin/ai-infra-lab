  <rect x="178" y="227" width="64" height="17" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="242" y="227" width="168" height="17" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="410" y="227" width="74" height="17" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="38" y="239" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">1</text>
  <text x="70" y="239" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">3</text>
  <text x="104" y="239" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">2</text>
  <text x="149" y="239" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">[0,2]</text>
  <text x="210" y="239" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">aba</text>
  <text x="326" y="239" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">奇：2·d1[1]−1＝3 ≥ 3</text>
  <text x="447" y="239" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">true</text>

  <!-- 行 2（false 红底） -->
  <rect x="24" y="244" width="28" height="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="52" y="244" width="36" height="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
