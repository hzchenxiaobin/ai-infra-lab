  <text x="326" y="273" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">奇：2·d1[0]−1＝1 ≥ 1</text>
  <text x="447" y="273" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">true</text>

  <!-- 行 4 -->
  <rect x="24" y="278" width="28" height="17" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="52" y="278" width="36" height="17" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
