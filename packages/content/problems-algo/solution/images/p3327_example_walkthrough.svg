  <text x="38" y="222" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">0</text>
  <text x="70" y="222" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">6</text>
  <text x="104" y="222" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">5</text>
  <text x="149" y="222" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">[0,5]</text>
  <text x="210" y="222" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">abaaba</text>
  <text x="326" y="222" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">偶：2·d2[3]＝6 ≥ 6</text>
  <text x="447" y="222" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">true</text>

  <!-- 行 1 -->
  <rect x="24" y="227" width="28" height="17" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="52" y="227" width="36" height="17" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="88" y="227" width="32" height="17" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
