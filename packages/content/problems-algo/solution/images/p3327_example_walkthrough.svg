  <!-- 结论 -->
  <rect x="36" y="332" width="448" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">输出 answer ＝ [true, true, false, true, true, true]</text>
  <text x="260" y="370" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">与官方示例一致 ✓　（size 由 order 正序一遍累加而得：孩子先出现、size 先就绪）</text>
</svg>
