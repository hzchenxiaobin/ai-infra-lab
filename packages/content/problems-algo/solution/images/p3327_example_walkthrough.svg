<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：parent＝[−1,0,0,1,1,2]，s＝"aababa"</text>

  <text x="36" y="52" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 显式栈后序遍历，完成顺序：3 → 4 → 1 → 5 → 2 → 0</text>

  <text x="36" y="76" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">② 每完成一个节点就填入它的字符：</text>
  <rect x="60" y="86" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="94" y="86" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="128" y="86" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="162" y="86" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="196" y="86" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="230" y="86" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="77" y="106" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="111" y="106" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="145" y="106" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="179" y="106" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="213" y="106" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="247" y="106" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="77" y="130" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">s[3]</text>
  <text x="111" y="130" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">s[4]</text>
  <text x="145" y="130" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">s[1]</text>
  <text x="179" y="130" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">s[5]</text>
  <text x="213" y="130" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">s[2]</text>
  <text x="247" y="130" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">s[0]</text>
  <text x="284" y="106" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">→ T＝"abaaba"</text>

  <text x="36" y="156" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">③ Manacher：d1＝[1,2,1,1,2,1]（奇），d2＝[–,0,0,3,0,0]（偶，d2[0] 不用）</text>
  <text x="36" y="180" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">④ 逐节点 O(1) 查询：</text>

