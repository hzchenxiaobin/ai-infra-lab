  <text x="104" y="256" text-anchor="middle" font-size="9" fill="#8a3a36" filter="url(#rough2)">4</text>
  <text x="149" y="256" text-anchor="middle" font-size="9" fill="#8a3a36" filter="url(#rough2)">[3,4]</text>
  <text x="210" y="256" text-anchor="middle" font-size="9" fill="#8a3a36" filter="url(#rough2)">ab</text>
  <text x="326" y="256" text-anchor="middle" font-size="9" fill="#8a3a36" filter="url(#rough2)">偶：2·d2[4]＝0 ＜ 1</text>
  <text x="447" y="256" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>

  <!-- 行 3 -->
  <rect x="24" y="261" width="28" height="17" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="52" y="261" width="36" height="17" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="88" y="261" width="32" height="17" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="120" y="261" width="58" height="17" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
