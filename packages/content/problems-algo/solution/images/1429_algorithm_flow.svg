<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：add 与 showFirstUnique 双操作均摊 O(1)</text>

  <!-- ===== Left column: add(value) ===== -->
  <rect x="30" y="46" width="280" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="72" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">add(value)</text>

  <!-- step boxes -->
  <rect x="50" y="102" width="240" height="44" rx="6" fill="#fff" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="170" y="120" text-anchor="middle" font-size="11" fill="#333">count[value] += 1</text>
  <text x="170" y="136" text-anchor="middle" font-size="10" fill="#888">频率 +1（O(1) 哈希）</text>

  <path d="M 170 146 L 170 158" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <path d="M 170 162 L 240 196 L 170 230 L 100 196 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="194" text-anchor="middle" font-size="11" fill="#333">count[value]</text>
  <text x="170" y="208" text-anchor="middle" font-size="11" fill="#333">== 1 ?</text>

  <!-- Yes branch -->
  <path d="M 240 196 L 290 196 L 290 250" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="252" y="188" font-size="10" fill="#4a7a3a" font-weight="bold">是（首次出现）</text>
  <rect x="50" y="250" width="240" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="268" text-anchor="middle" font-size="11" fill="#333">queue.push(value)</text>
  <text x="170" y="284" text-anchor="middle" font-size="10" fill="#4a7a3a">入候选队列（O(1)）</text>

  <!-- No branch -->
  <path d="M 100 196 L 50 196 L 50 250" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="188" font-size="10" fill="#b85450" font-weight="bold">否（已重复）</text>
  <rect x="50" y="250" width="240" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="170" y="268" text-anchor="middle" font-size="11" fill="#333">不做任何出队操作</text>
  <text x="170" y="284" text-anchor="middle" font-size="10" fill="#b85450">留到查询时惰性清理</text>

  <!-- merge -->
  <path d="M 170 294 L 170 308" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="50" y="312" width="240" height="40" rx="6" fill="#fff" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="170" y="338" text-anchor="middle" font-size="11" fill="#555">结束（add 完成）</text>

  <text x="170" y="372" text-anchor="middle" font-size="10" fill="#888">均摊 O(1)：仅哈希更新 + 至多一次入队</text>

  <!-- ===== Right column: showFirstUnique() ===== -->
  <rect x="330" y="46" width="280" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="72" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">showFirstUnique()</text>

  <!-- loop decision -->
  <path d="M 470 96 L 560 140 L 470 184 L 380 140 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="134" text-anchor="middle" font-size="11" fill="#333">队非空 且</text>
  <text x="470" y="150" text-anchor="middle" font-size="11" fill="#333">count[队首] &gt; 1 ?</text>

  <!-- Yes: pop loop -->
  <path d="M 560 140 L 600 140 L 600 96 L 560 96" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="568" y="120" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="380" y="196" width="180" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="470" y="214" text-anchor="middle" font-size="11" fill="#333">queue.pop()</text>
  <text x="470" y="228" text-anchor="middle" font-size="10" fill="#b85450">弹出陈旧候选</text>
  <path d="M 470 196 L 470 184" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No: exit loop -->
  <path d="M 380 140 L 340 140 L 340 250" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="132" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- decision: queue empty? -->
  <path d="M 470 254 L 540 288 L 470 322 L 400 288 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="284" text-anchor="middle" font-size="11" fill="#333">队列为空?</text>

  <!-- empty -> -1 -->
  <path d="M 540 288 L 600 288 L 600 330" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="548" y="280" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="510" y="334" width="100" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="560" y="358" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return -1</text>

  <!-- not empty -> peek -->
  <path d="M 400 288 L 340 288 L 340 330" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="296" y="280" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="290" y="334" width="150" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="365" y="358" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return 队首</text>

  <text x="470" y="394" text-anchor="middle" font-size="10" fill="#888">均摊 O(1)：每个元素至多被 pop 一次，跨所有调用线性总和</text>

  <!-- ===== Bottom: amortized analysis ===== -->
  <rect x="30" y="424" width="580" height="100" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="448" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">均摊分析：为什么单次 showFirstUnique 是 O(1)？</text>
  <text x="46" y="470" font-size="11" fill="#555">• pop 的总次数 ≤ push 的总次数 ≤ add 调用次数 N</text>
  <text x="46" y="488" font-size="11" fill="#555">• 把 N 次 pop 摊到所有 showFirstUnique 调用上，单次均摊 &lt; N / Q，常数级</text>
  <text x="46" y="506" font-size="11" fill="#555">• 最坏某次查询可能连续 pop 多个陈旧值，但「一生只 pop 一次」保证总体线性</text>
</svg>
