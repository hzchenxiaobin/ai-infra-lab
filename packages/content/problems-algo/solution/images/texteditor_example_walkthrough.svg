<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="470" fill="#fafafa"/>

  <text x="380" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：双栈逐步执行 8 个操作</text>
  <text x="380" y="44" text-anchor="middle" font-size="10.5" fill="#888">全文 = left + reverse(right)；left/right 均按栈底→栈顶书写（右端=栈顶=紧邻光标）</text>

  <!-- table outer frame -->
  <rect x="14" y="54" width="732" height="370" fill="none" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>

  <!-- header row -->
  <rect x="14" y="54" width="732" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="36" y="73" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步</text>
  <text x="131" y="73" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">操作</text>
  <text x="311" y="73" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">left（栈底→栈顶）</text>
  <text x="521" y="73" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">right（栈底→栈顶·逆序存）</text>
  <text x="691" y="73" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">返回</text>

  <!-- column dividers -->
  <line x1="56" y1="54" x2="56" y2="424" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="206" y1="54" x2="206" y2="424" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="416" y1="54" x2="416" y2="424" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="626" y1="54" x2="626" y2="424" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- row heights: 36 each, start y=82 -->
  <!-- Row 0 init -->
  <rect x="14" y="82" width="732" height="36" fill="#fafafa" filter="url(#rough2)"/>
  <text x="36" y="105" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">0</text>
  <text x="131" y="105" text-anchor="middle" font-size="10.5" fill="#666">TextEditor()</text>
  <text x="311" y="105" text-anchor="middle" font-size="10.5" fill="#888">（空）</text>
  <text x="521" y="105" text-anchor="middle" font-size="10.5" fill="#888">（空）</text>
  <text x="691" y="105" text-anchor="middle" font-size="10.5" fill="#888">—</text>

  <!-- Row 1 addText leetcode -->
  <rect x="14" y="118" width="732" height="36" fill="#fff8e1" filter="url(#rough2)"/>
  <text x="36" y="141" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">1</text>
  <text x="131" y="141" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">addText("leetcode")</text>
  <text x="311" y="141" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">leetcode<tspan fill="#b85450">→</tspan></text>
  <text x="521" y="141" text-anchor="middle" font-size="10.5" fill="#888">（空）</text>
  <text x="691" y="141" text-anchor="middle" font-size="10.5" fill="#888">—</text>

  <!-- Row 2 deleteText 4 -->
  <rect x="14" y="154" width="732" height="36" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="36" y="177" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">2</text>
  <text x="131" y="177" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">deleteText(4)</text>
  <text x="311" y="177" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">leet<tspan fill="#b85450">→</tspan></text>
  <text x="521" y="177" text-anchor="middle" font-size="10.5" fill="#888">（空）</text>
  <text x="691" y="177" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>

  <!-- Row 3 addText practice -->
  <rect x="14" y="190" width="732" height="36" fill="#fff8e1" filter="url(#rough2)"/>
  <text x="36" y="213" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">3</text>
  <text x="131" y="213" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">addText("practice")</text>
  <text x="311" y="213" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">leetpractice<tspan fill="#b85450">→</tspan></text>
  <text x="521" y="213" text-anchor="middle" font-size="10.5" fill="#888">（空）</text>
  <text x="691" y="213" text-anchor="middle" font-size="10.5" fill="#888">—</text>

  <!-- Row 4 cursorRight 3 (no move) -->
  <rect x="14" y="226" width="732" height="36" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="36" y="249" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">4</text>
  <text x="131" y="249" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">cursorRight(3)</text>
  <text x="311" y="249" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">leetpractice<tspan fill="#b85450">→</tspan></text>
  <text x="521" y="249" text-anchor="middle" font-size="10.5" fill="#888">（空，mv=0）</text>
  <text x="691" y="249" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">etpractice</text>

  <!-- Row 5 cursorLeft 8 -->
  <rect x="14" y="262" width="732" height="36" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="36" y="285" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">5</text>
  <text x="131" y="285" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">cursorLeft(8)</text>
  <text x="311" y="285" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">leet<tspan fill="#b85450">→</tspan></text>
  <text x="521" y="285" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">ecitcarp<tspan fill="#b85450">→</tspan></text>
  <text x="691" y="285" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">leet</text>

  <!-- Row 6 deleteText 10 -->
  <rect x="14" y="298" width="732" height="36" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="36" y="321" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">6</text>
  <text x="131" y="321" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">deleteText(10)</text>
  <text x="311" y="321" text-anchor="middle" font-size="10.5" fill="#888">（空）</text>
  <text x="521" y="321" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">ecitcarp<tspan fill="#b85450">→</tspan></text>
  <text x="691" y="321" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>

  <!-- Row 7 cursorLeft 2 (no move) -->
  <rect x="14" y="334" width="732" height="36" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="36" y="357" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">7</text>
  <text x="131" y="357" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">cursorLeft(2)</text>
  <text x="311" y="357" text-anchor="middle" font-size="10.5" fill="#888">（空，mv=0）</text>
  <text x="521" y="357" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">ecitcarp<tspan fill="#b85450">→</tspan></text>
  <text x="691" y="357" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">""</text>

  <!-- Row 8 cursorRight 6 -->
  <rect x="14" y="370" width="732" height="36" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="36" y="393" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">8</text>
  <text x="131" y="393" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">cursorRight(6)</text>
  <text x="311" y="393" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">practi<tspan fill="#b85450">→</tspan></text>
  <text x="521" y="393" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ec<tspan fill="#b85450">→</tspan></text>
  <text x="691" y="393" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">practi</text>

  <!-- legend / note -->
  <rect x="14" y="432" width="732" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="380" y="451" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">步 5：left 栈顶 e,c,i,t,c,a,r,p 越过光标推入 right（逆序存→reverse 得 "practice"）；步 8 反向搬运</text>
</svg>
