<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：排序后 |x − m| 呈 V 形，最强值在两端 → 双指针从两端向内取</text>

  <!-- ===== sorted array cells (y=56..90) ===== -->
  <text x="70" y="74" font-size="11" fill="#888">排序后</text>
  <!-- idx0 val 1 -->
  <rect x="150" y="56" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="78" text-anchor="middle" font-size="14" fill="#333">1</text>
  <!-- idx1 val 2 -->
  <rect x="210" y="56" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="78" text-anchor="middle" font-size="14" fill="#333">2</text>
  <!-- idx2 val 3 = median (highlight orange) -->
  <rect x="270" y="56" width="60" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="300" y="78" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <!-- idx3 val 4 -->
  <rect x="330" y="56" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="78" text-anchor="middle" font-size="14" fill="#333">4</text>
  <!-- idx4 val 5 -->
  <rect x="390" y="56" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="78" text-anchor="middle" font-size="14" fill="#333">5</text>

  <!-- median label -->
  <path d="M 300 92 L 300 104" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="118" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">中位数 m = 3</text>

  <!-- index labels -->
  <text x="180" y="140" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="240" y="140" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="300" y="140" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="360" y="140" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="420" y="140" text-anchor="middle" font-size="10" fill="#999">4</text>

  <!-- ===== strength V-shape (baseline y=320) ===== -->
  <text x="70" y="200" font-size="11" fill="#888">强度</text>
  <text x="70" y="214" font-size="11" fill="#888">|x−m|</text>

  <!-- baseline -->
  <path d="M 150 320 L 460 320" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- V-shape curve connecting bar tops: (180,240)->(240,280)->(300,320)->(360,280)->(420,240) -->
  <path d="M 180 240 Q 240 280 300 320 Q 360 280 420 240" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- strength bars going up from baseline -->
  <!-- val1 str2: height 80, y=240..320 -->
  <rect x="160" y="240" width="40" height="80" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="232" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">2</text>
  <!-- val2 str1: height 40, y=280..320 -->
  <rect x="220" y="280" width="40" height="40" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="240" y="272" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <!-- val3 str0: dot at baseline -->
  <circle cx="300" cy="320" r="4" fill="#d6a040" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="338" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0</text>
  <!-- val4 str1 -->
  <rect x="340" y="280" width="40" height="40" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="272" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <!-- val5 str2 -->
  <rect x="400" y="240" width="40" height="80" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="232" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">2</text>

  <!-- V label -->
  <text x="470" y="284" font-size="16" fill="#446688" font-weight="bold" font-style="italic">V</text>
  <text x="470" y="300" font-size="9.5" fill="#888">形</text>

  <!-- ===== two pointers L / R ===== -->
  <!-- L pointer under val1 -->
  <path d="M 180 350 L 180 332" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="156" y="352" width="48" height="22" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="367" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">L = 0</text>

  <!-- R pointer under val5 -->
  <path d="M 420 350 L 420 332" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="396" y="352" width="48" height="22" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="367" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">R = 4</text>

  <!-- compare annotation between L and R -->
  <path d="M 204 363 L 392 363" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 392 363 L 204 363" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- footer note -->
  <rect x="60" y="384" width="480" height="12" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)" opacity="0"/>
</svg>
