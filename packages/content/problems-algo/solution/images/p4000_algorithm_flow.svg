<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">算法流程：两个特判 + 一个循环</text>

  <!-- 开始 -->
  <ellipse cx="225" cy="56" rx="72" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="225" y="61" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">读入 n, s</text>

  <path d="M 225 78 L 225 94" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形1：s = 0 ? -->
  <polygon points="225,98 297,130 225,162 153,130" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="225" y="135" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">s = 0 ?</text>

  <path d="M 297 130 L 346 130" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="123" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="350" y="110" width="112" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="406" y="135" text-anchor="middle" font-size="13.5" fill="#7a5518" filter="url(#rough2)">返回 0</text>

  <path d="M 225 162 L 225 180" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="235" y="175" font-size="11.5" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 菱形2：s > 9n ? -->
  <polygon points="225,184 302,216 225,248 148,216" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="225" y="221" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">s &gt; 9n ?</text>

  <path d="M 302 216 L 346 216" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="209" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="350" y="196" width="112" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="406" y="221" text-anchor="middle" font-size="13.5" fill="#8a3a34" filter="url(#rough2)">返回 −1</text>

  <path d="M 225 248 L 225 266" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="235" y="261" font-size="11.5" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- res = 0 -->
  <rect x="165" y="270" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="225" y="292" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">res = 0</text>

  <path d="M 225 304 L 225 320" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环框 -->
  <rect x="88" y="324" width="274" height="94" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <path d="M 100 331 L 100 411" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 350 331 L 350 411" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="225" y="346" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5330" filter="url(#rough2)">循环 i = 0 … n−1</text>
  <text x="225" y="368" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">d = min(9, s)</text>
  <text x="225" y="388" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">res = 10·res + d</text>
  <text x="225" y="408" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">s = s − d</text>

  <path d="M 225 418 L 225 429" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 res -->
  <ellipse cx="225" cy="448" rx="64" ry="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="225" y="453" text-anchor="middle" font-size="13.5" fill="#7a5518" filter="url(#rough2)">返回 res</text>
</svg>
