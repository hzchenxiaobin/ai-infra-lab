<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">为什么状态要带上「钥匙位掩码」？</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">同一格子，不同钥匙集合 = 不同通过能力 = 不同状态</text>

  <!-- ===== Left: mini grid 3x3 ===== -->
  <text x="123" y="70" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">网格片段</text>

  <!-- Row 0 -->
  <rect x="60" y="80" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="81" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">@</text>
  <rect x="102" y="80" width="42" height="42" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="123" y="108" text-anchor="middle" font-size="13" fill="#bbb">.</text>
  <rect x="144" y="80" width="42" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="108" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">a</text>

  <!-- Row 1 -->
  <rect x="60" y="122" width="42" height="42" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="81" y="150" text-anchor="middle" font-size="13" fill="#bbb">.</text>
  <rect x="102" y="122" width="42" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="123" y="150" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">★</text>
  <rect x="144" y="122" width="42" height="42" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="165" y="150" text-anchor="middle" font-size="13" fill="#bbb">.</text>

  <!-- Row 2 -->
  <rect x="60" y="164" width="42" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="81" y="192" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">b</text>
  <rect x="102" y="164" width="42" height="42" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="123" y="192" text-anchor="middle" font-size="13" fill="#bbb">.</text>
  <rect x="144" y="164" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="165" y="192" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">B</text>

  <!-- highlight center cell -->
  <rect x="100" y="120" width="46" height="46" rx="6" fill="none" stroke="#d6a040" stroke-width="2.5" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="123" y="226" text-anchor="middle" font-size="10" fill="#888">两次到达同一格子 ★</text>

  <!-- ===== Right: two states ===== -->
  <text x="415" y="70" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">到达 ★ 时的两种状态</text>

  <!-- State A: keys={a} -->
  <rect x="300" y="82" width="230" height="78" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="415" y="102" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">状态 A：在 ★，钥匙 {a}</text>
  <rect x="345" y="114" width="38" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="364" y="133" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="391" y="114" width="38" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="133" text-anchor="middle" font-size="13" fill="#999">0</text>
  <text x="415" y="152" text-anchor="middle" font-size="10" fill="#666">mask=01，遇锁 B ✗ 无法通过</text>

  <!-- State B: keys={a,b} -->
  <rect x="300" y="178" width="230" height="78" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="415" y="198" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">状态 B：在 ★，钥匙 {a, b}</text>
  <rect x="345" y="210" width="38" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="364" y="229" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="391" y="210" width="38" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="229" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="415" y="248" text-anchor="middle" font-size="10" fill="#666">mask=11，遇锁 B ✓ 可以通过</text>

  <!-- bit labels -->
  <text x="364" y="168" text-anchor="middle" font-size="9" fill="#888">a</text>
  <text x="410" y="168" text-anchor="middle" font-size="9" fill="#888">b</text>

  <!-- ===== Bottom takeaway ===== -->
  <rect x="40" y="280" width="480" height="80" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">普通 BFS 只记「格子已访问」→ 漏掉带新钥匙的二次到达</text>
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#444">状态 = (行, 列, 钥匙位掩码)，三者缺一不可</text>
  <text x="280" y="344" text-anchor="middle" font-size="11" fill="#666">k ≤ 6 → 2^k ≤ 64 种 mask，状态空间 m·n·2^k 可承受</text>

  <!-- arrows from ★ to two states -->
  <path d="M 148 143 Q 230 108 298 121" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 148 148 Q 230 175 298 217" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
