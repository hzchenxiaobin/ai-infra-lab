<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.8"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#888" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="580" height="560" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 状压 BFS 逐层展开</text>
  <text x="290" y="42" text-anchor="middle" font-size="11" fill="#888">graph=[[1,2,3],[0],[0],[0]], n=4, full=1111₂ — 红色为最优路径</text>

  <!-- ===== Layer 0 ===== -->
  <text x="40" y="76" font-size="11" fill="#4a7a3a" font-weight="bold">第 0 层</text>
  <text x="40" y="90" font-size="10" fill="#888">steps=0</text>
  <!-- states: highlight (1,0010) on path -->
  <rect x="110" y="62" width="78" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="149" y="83" text-anchor="middle" font-size="11" fill="#333">(0,0001)</text>
  <rect x="196" y="62" width="78" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="235" y="83" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">(1,0010)</text>
  <rect x="282" y="62" width="78" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="321" y="83" text-anchor="middle" font-size="11" fill="#333">(2,0100)</text>
  <rect x="368" y="62" width="78" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="407" y="83" text-anchor="middle" font-size="11" fill="#333">(3,1000)</text>

  <!-- arrow down (path) -->
  <path d="M 235 96 L 235 116" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Layer 1 ===== -->
  <text x="40" y="134" font-size="11" fill="#4a7a3a" font-weight="bold">第 1 层</text>
  <text x="40" y="148" font-size="10" fill="#888">steps=1</text>
  <rect x="110" y="120" width="78" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="149" y="141" text-anchor="middle" font-size="11" fill="#333">(1,0011)</text>
  <!-- path state (0,0011) -->
  <rect x="196" y="120" width="78" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="235" y="141" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">(0,0011)</text>
  <rect x="282" y="120" width="78" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="321" y="141" text-anchor="middle" font-size="11" fill="#333">(2,0101)</text>
  <rect x="368" y="120" width="78" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="407" y="141" text-anchor="middle" font-size="11" fill="#333">(3,1001)</text>
  <text x="460" y="141" font-size="10" fill="#888">…共 6 个</text>

  <!-- path arrow down to layer 2 (0,0011)->(2,0111) -->
  <path d="M 235 154 Q 235 170 321 178" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Layer 2 ===== -->
  <text x="40" y="192" font-size="11" fill="#4a7a3a" font-weight="bold">第 2 层</text>
  <text x="40" y="206" font-size="10" fill="#888">steps=2</text>
  <rect x="110" y="178" width="78" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="149" y="199" text-anchor="middle" font-size="11" fill="#333">(3,1011)</text>
  <!-- path state (2,0111) -->
  <rect x="282" y="178" width="78" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="321" y="199" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">(2,0111)</text>
  <rect x="368" y="178" width="78" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="407" y="199" text-anchor="middle" font-size="11" fill="#333">(1,0111)</text>
  <text x="460" y="199" font-size="10" fill="#888">…共 6 个</text>
  <text x="460" y="212" font-size="9" fill="#888">mask 含 3 个 1</text>

  <!-- path arrow down (2,0111)->(0,0111) -->
  <path d="M 321 212 Q 235 228 235 236" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Layer 3 ===== -->
  <text x="40" y="250" font-size="11" fill="#d6a040" font-weight="bold">第 3 层</text>
  <text x="40" y="264" font-size="10" fill="#888">steps=3</text>
  <text x="40" y="278" font-size="9" fill="#d6a040">重复回 0!</text>
  <!-- path state (0,0111) -->
  <rect x="196" y="236" width="78" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="235" y="257" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">(0,0111)</text>
  <rect x="282" y="236" width="78" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="321" y="257" text-anchor="middle" font-size="11" fill="#333">(0,1011)</text>
  <rect x="368" y="236" width="78" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="407" y="257" text-anchor="middle" font-size="11" fill="#333">(0,1101)</text>
  <text x="460" y="257" font-size="10" fill="#888">均停在 0</text>

  <!-- path arrow down to layer 4 (0,0111)->(3,1111) -->
  <path d="M 235 270 Q 235 286 321 294" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Layer 4 ===== -->
  <text x="40" y="308" font-size="11" fill="#b85450" font-weight="bold">第 4 层</text>
  <text x="40" y="322" font-size="10" fill="#888">steps=4</text>
  <text x="40" y="336" font-size="9" fill="#b85450">命中!</text>
  <!-- path state (3,1111) -->
  <rect x="282" y="294" width="78" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="321" y="315" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">(3,1111)</text>
  <rect x="368" y="294" width="78" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="407" y="315" text-anchor="middle" font-size="11" fill="#333">(2,1111)</text>
  <rect x="196" y="294" width="78" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="235" y="315" text-anchor="middle" font-size="11" fill="#333">(1,1111)</text>
  <text x="110" y="315" font-size="10" fill="#888">mask=full</text>

  <!-- arrow to answer -->
  <path d="M 321 328 L 321 354" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Answer box ===== -->
  <rect x="120" y="358" width="360" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="380" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">弹出 (3,1111) → mask==full → 返回 steps=4</text>
  <text x="300" y="396" text-anchor="middle" font-size="10" fill="#666">最优路径：1→0→2→0→3，4 条边</text>

  <!-- ===== Path mask evolution ===== -->
  <rect x="40" y="420" width="500" height="120" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="442" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">最优路径的 mask 演化（注意 0 被经过两次）</text>
  <text x="60" y="472" font-size="11" fill="#333">节点:</text>
  <text x="120" y="472" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="160" y="472" font-size="11" fill="#888">→</text>
  <text x="190" y="472" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <text x="230" y="472" font-size="11" fill="#888">→</text>
  <text x="260" y="472" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="300" y="472" font-size="11" fill="#888">→</text>
  <text x="330" y="472" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <text x="370" y="472" font-size="11" fill="#888">→</text>
  <text x="400" y="472" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="450" y="472" font-size="10" fill="#888">(4 条边)</text>

  <text x="60" y="500" font-size="11" fill="#333">mask:</text>
  <text x="120" y="500" font-size="11" fill="#444" font-weight="bold">0010</text>
  <text x="190" y="500" font-size="11" fill="#444" font-weight="bold">0011</text>
  <text x="260" y="500" font-size="11" fill="#444" font-weight="bold">0111</text>
  <text x="330" y="500" font-size="11" fill="#d6a040" font-weight="bold">0111</text>
  <text x="400" y="500" font-size="11" fill="#b85450" font-weight="bold">1111</text>

  <text x="290" y="524" text-anchor="middle" font-size="10" fill="#666">第 3 步「0111→0111」：重访 0 但 mask 不变 —— 这一步正是普通 BFS 会丢掉的关键</text>
</svg>
