<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟相向扫描</text>

  <!-- start -->
  <rect x="200" y="34" width="120" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="52" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">开始，i = 0</text>
  <path d="M 260 62 L 260 74" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision: i in range? -->
  <polygon points="260,78 340,106 260,134 180,106" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="103" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">i ≤ (n−1)/2 ？</text>
  <text x="260" y="117" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">（还没越过中点）</text>
  <path d="M 340 106 L 396 106" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="352" y="100" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- return -1 -->
  <rect x="398" y="92" width="104" height="28" rx="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="110" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 −1</text>

  <path d="M 260 134 L 260 146" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="272" y="144" text-anchor="start" font-size="9.5" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- decision: equal? -->
  <polygon points="260,150 352,180 260,210 168,180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="177" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">s[i] == s[n−1−i] ？</text>
  <text x="260" y="191" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">（镜像搭档相等？）</text>
  <path d="M 352 180 L 408 180" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="368" y="174" text-anchor="middle" font-size="9.5" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">相等</text>

  <!-- return i -->
  <rect x="410" y="166" width="92" height="28" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="456" y="184" text-anchor="middle" font-size="10.5" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">返回 i ✓</text>

  <path d="M 260 210 L 260 224" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="272" y="221" text-anchor="start" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">不等</text>

  <!-- advance -->
  <rect x="196" y="226" width="128" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="245" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i 加一（j 自动减一）</text>

  <!-- loop back -->
  <path d="M 196 241 Q 120 241 120 106 Q 120 78 178 106" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="5,4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="112" y="176" text-anchor="middle" font-size="9" fill="#446688" transform="rotate(-90 112 176)" filter="url(#rough2)">回到范围判断</text>

  <!-- example strip -->
  <rect x="30" y="282" width="460" height="100" rx="10" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">三示例走查</text>
  <text x="44" y="324" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">"abcacbd"（n=7）：a/d ✗ → b/b ✓ ⟹ 1</text>
  <text x="44" y="342" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">"abc"（n=3）：a/c ✗ → i=1 到中点，b 即 b ✓ ⟹ 1（自己比自己恒相等）</text>
  <text x="44" y="360" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">"abcdab"（n=6）：a/b ✗ → b/a ✗ → c/d ✗，i=3 > (6−1)/2=2 ⟹ −1</text>
  <text x="44" y="378" text-anchor="start" font-size="9.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">注意：i 无需真的维护 j 变量，j = n−1−i 随 i 一步算出</text>
</svg>
