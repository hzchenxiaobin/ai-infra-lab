<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M9,1 L0,5 L9,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="34" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">双射 = 两个方向都是单射</text>
  <text x="280" y="56" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">s = "paper"  ↔  t = "title"</text>

  <!-- s 行标签 -->
  <text x="40" y="108" text-anchor="end" font-size="13" fill="#446688" filter="url(#rough2)">s</text>
  <!-- s 字符格子 -->
  <rect x="70" y="88" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="114" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">p</text>
  <rect x="150" y="88" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="114" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">a</text>
  <rect x="230" y="88" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="114" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">p</text>
  <rect x="310" y="88" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="114" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">e</text>
  <rect x="390" y="88" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="415" y="114" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">r</text>

  <!-- t 行标签 -->
  <text x="40" y="268" text-anchor="end" font-size="13" fill="#4a7a3a" filter="url(#rough2)">t</text>
  <rect x="70" y="248" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="274" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">t</text>
  <rect x="150" y="248" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="274" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">i</text>
  <rect x="230" y="248" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="274" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">t</text>
  <rect x="310" y="248" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="274" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">l</text>
  <rect x="390" y="248" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="415" y="274" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">e</text>

  <!-- 双向箭头：p↔t（位置0，重复位置3用虚线连） -->
  <line x1="95" y1="130" x2="95" y2="246" stroke="#446688" stroke-width="1.6" marker-end="url(#arrR)" marker-start="url(#arrL)" filter="url(#rough2)"/>
  <!-- a↔i -->
  <line x1="175" y1="130" x2="175" y2="246" stroke="#446688" stroke-width="1.6" marker-end="url(#arrR)" marker-start="url(#arrL)" filter="url(#rough2)"/>
  <!-- p(位置3) 与 位置0 同映射，用虚线指向位置0 -->
  <path d="M 255 130 Q 175 180 175 246" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="200" y="190" font-size="11" fill="#b85450" filter="url(#rough2)">老字符：核对一致</text>
  <!-- e↔l -->
  <line x1="335" y1="130" x2="335" y2="246" stroke="#446688" stroke-width="1.6" marker-end="url(#arrR)" marker-start="url(#arrL)" filter="url(#rough2)"/>
  <!-- r↔e -->
  <line x1="415" y1="130" x2="415" y2="246" stroke="#446688" stroke-width="1.6" marker-end="url(#arrR)" marker-start="url(#arrL)" filter="url(#rough2)"/>

  <!-- 两个方向说明 -->
  <rect x="470" y="150" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="510" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">s→t 单射</text>
  <text x="510" y="180" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">不同源不同目标</text>
  <rect x="470" y="196" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="510" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">t→s 单射</text>
  <text x="510" y="226" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">不同目标不同源</text>

  <!-- 底部结论 -->
  <rect x="120" y="318" width="320" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">两方向均单射 → 双射 → 同构 ✓</text>
</svg>
