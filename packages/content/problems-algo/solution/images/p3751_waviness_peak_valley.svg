<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">峰谷的局部性：只看相邻三位，乘积一步定音</text>

  <!-- ① digit row -->
  <text x="124" y="112" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">① 数位 s</text>

  <rect x="134" y="78" width="64" height="56" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="210" y="78" width="64" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="286" y="78" width="64" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="362" y="78" width="64" height="56" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <text x="166" y="108" text-anchor="middle" font-size="20" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="166" y="127" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="242" y="108" text-anchor="middle" font-size="20" font-weight="bold" fill="#333" filter="url(#rough2)">8</text>
  <text x="242" y="127" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="318" y="108" text-anchor="middle" font-size="20" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="318" y="127" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="394" y="108" text-anchor="middle" font-size="20" font-weight="bold" fill="#333" filter="url(#rough2)">8</text>
  <text x="394" y="127" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=3</text>

  <!-- peak marker above box i=1 -->
  <polygon points="234,56 250,56 242,68" fill="#b85450" filter="url(#rough2)"/>
  <text x="242" y="48" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">峰：8 &gt; 4 且 8 &gt; 4</text>

  <!-- valley marker below box i=2 -->
  <polygon points="310,146 326,146 318,158" fill="#446688" filter="url(#rough2)"/>
  <text x="318" y="178" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">谷：4 &lt; 8 且 4 &lt; 8</text>

  <!-- endpoint note -->
  <text x="455" y="62" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">首尾数位</text>
  <text x="455" y="76" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">不判定峰谷</text>

  <!-- ② diff row -->
  <text x="124" y="258" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">② 相邻差值 d</text>

  <rect x="172" y="232" width="64" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="248" y="232" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="324" y="232" width="64" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>

  <text x="204" y="256" text-anchor="middle" font-size="16" font-weight="bold" fill="#3a6a2a" filter="url(#rough2)">+4</text>
  <text x="204" y="269" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">d₀</text>
  <text x="280" y="256" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">−4</text>
  <text x="280" y="269" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">d₁</text>
  <text x="356" y="256" text-anchor="middle" font-size="16" font-weight="bold" fill="#3a6a2a" filter="url(#rough2)">+4</text>
  <text x="356" y="269" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">d₂</text>

  <!-- sign-change marks in the gaps -->
  <text x="242" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">×</text>
  <text x="318" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">×</text>
  <text x="242" y="296" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">异号 ⇒ 峰</text>
  <text x="318" y="296" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">异号 ⇒ 谷</text>

  <!-- ③ formula box -->
  <text x="124" y="337" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">③ 判定</text>
  <rect x="130" y="306" width="300" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">峰或谷 ⇔ d(i−1) · d(i) &lt; 0</text>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4848：(+4, −4, +4) 两次变号 → 波动值 2</text>
</svg>
