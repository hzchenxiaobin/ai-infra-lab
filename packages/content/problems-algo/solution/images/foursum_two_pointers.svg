<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：固定 i、j → 双指针扫 [j+1, n-1]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">排序后三层降维：i → j → 双指针，把 O(n⁴) 降到 O(n³)</text>

  <!-- sorted array cells: [-2,-1,0,0,1,2] -->
  <text x="20" y="86" font-size="12" fill="#888">nums(已排序)：</text>
  <rect x="120" y="70" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="144" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">-2</text>
  <rect x="170" y="70" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="194" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">-1</text>
  <rect x="220" y="70" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="244" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="270" y="70" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="294" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="320" y="70" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="344" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="370" y="70" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="394" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- index labels -->
  <text x="144" y="118" text-anchor="middle" font-size="9.5" fill="#aaa">0</text>
  <text x="194" y="118" text-anchor="middle" font-size="9.5" fill="#aaa">1</text>
  <text x="244" y="118" text-anchor="middle" font-size="9.5" fill="#aaa">2</text>
  <text x="294" y="118" text-anchor="middle" font-size="9.5" fill="#aaa">3</text>
  <text x="344" y="118" text-anchor="middle" font-size="9.5" fill="#aaa">4</text>
  <text x="394" y="118" text-anchor="middle" font-size="9.5" fill="#aaa">5</text>

  <!-- i pointer (blue) pointing to index 0 -->
  <path d="M 144 130 L 144 120" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="144" y="146" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">i</text>
  <text x="144" y="160" text-anchor="middle" font-size="9.5" fill="#446688">固定①</text>

  <!-- j pointer (green) pointing to index 1 -->
  <path d="M 194 130 L 194 120" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="194" y="146" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">j</text>
  <text x="194" y="160" text-anchor="middle" font-size="9.5" fill="#4a7a3a">固定②</text>

  <!-- left/right pointers (orange) pointing to index 2 and 5 -->
  <path d="M 244 200 L 244 110" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="244" y="214" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">left</text>

  <path d="M 394 200 L 394 110" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="394" y="214" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">right</text>

  <!-- two-pointer sweep bracket below -->
  <path d="M 244 232 L 244 238 L 394 238 L 394 232" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="319" y="256" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">双指针夹逼区间 [j+1, n-1]</text>

  <!-- key idea box -->
  <rect x="40" y="276" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">need = target − nums[i] − nums[j]，在区间内找两数之和 = need</text>

  <!-- move rule box -->
  <rect x="40" y="312" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="11.5" fill="#444">和 &lt; need → left++    和 &gt; need → right--    和 = need → 记录并跳过相邻重复</text>
  <text x="280" y="346" text-anchor="middle" font-size="10.5" fill="#888">数组有序保证单调性：双指针不漏解</text>
</svg>
