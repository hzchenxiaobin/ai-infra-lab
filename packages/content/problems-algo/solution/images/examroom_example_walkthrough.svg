<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="520" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：ExamRoom(10)，依次 seat×4 → leave(4) → seat</text>

  <!-- index header -->
  <text x="30" y="58" font-size="9" fill="#888">下标</text>
  <rect x="90" y="44" width="42" height="18" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="111" y="57" text-anchor="middle" font-size="9" fill="#888">0</text>
  <rect x="132" y="44" width="42" height="18" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="153" y="57" text-anchor="middle" font-size="9" fill="#888">1</text>
  <rect x="174" y="44" width="42" height="18" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="195" y="57" text-anchor="middle" font-size="9" fill="#888">2</text>
  <rect x="216" y="44" width="42" height="18" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="237" y="57" text-anchor="middle" font-size="9" fill="#888">3</text>
  <rect x="258" y="44" width="42" height="18" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="279" y="57" text-anchor="middle" font-size="9" fill="#888">4</text>
  <rect x="300" y="44" width="42" height="18" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="321" y="57" text-anchor="middle" font-size="9" fill="#888">5</text>
  <rect x="342" y="44" width="42" height="18" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="363" y="57" text-anchor="middle" font-size="9" fill="#888">6</text>
  <rect x="384" y="44" width="42" height="18" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="405" y="57" text-anchor="middle" font-size="9" fill="#888">7</text>
  <rect x="426" y="44" width="42" height="18" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="447" y="57" text-anchor="middle" font-size="9" fill="#888">8</text>
  <rect x="468" y="44" width="42" height="18" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="489" y="57" text-anchor="middle" font-size="9" fill="#888">9</text>

  <!-- Step 1: seat() → 0 -->
  <text x="30" y="92" font-size="10" fill="#4a7a3a" font-weight="bold">seat()①</text>
  <rect x="90" y="76" width="42" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="111" y="94" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">人</text>
  <rect x="132" y="76" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="174" y="76" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="216" y="76" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="258" y="76" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="300" y="76" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="342" y="76" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="384" y="76" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="426" y="76" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="468" y="76" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="520" y="76" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="550" y="94" text-anchor="middle" font-size="10" fill="#333">→0</text>
  <text x="300" y="112" text-anchor="middle" font-size="9" fill="#888">空房，坐 0</text>

  <!-- Step 2: seat() → 9 -->
  <text x="30" y="150" font-size="10" fill="#4a7a3a" font-weight="bold">seat()②</text>
  <rect x="90" y="134" width="42" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="111" y="152" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">人</text>
  <rect x="132" y="134" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="174" y="134" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="216" y="134" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="258" y="134" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="300" y="134" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="342" y="134" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="384" y="134" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="426" y="134" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="468" y="134" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="489" y="152" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">新</text>
  <rect x="520" y="134" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="550" y="152" text-anchor="middle" font-size="10" fill="#333">→9</text>
  <text x="300" y="170" text-anchor="middle" font-size="9" fill="#888">右端距离 = 9−0 = 9，最大 → 坐 9</text>

  <!-- Step 3: seat() → 4 -->
  <text x="30" y="208" font-size="10" fill="#4a7a3a" font-weight="bold">seat()③</text>
  <rect x="90" y="192" width="42" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="111" y="210" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">人</text>
  <rect x="132" y="192" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="174" y="192" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="216" y="192" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="258" y="192" width="42" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="279" y="210" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">新</text>
  <rect x="300" y="192" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="342" y="192" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="384" y="192" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="426" y="192" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="468" y="192" width="42" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="489" y="210" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">人</text>
  <rect x="520" y="192" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="550" y="210" text-anchor="middle" font-size="10" fill="#333">→4</text>
  <text x="300" y="228" text-anchor="middle" font-size="9" fill="#888">中间(0,9): dist=(9−0)÷2=4，坐 (0+9)÷2=4</text>

  <!-- Step 4: seat() → 2 -->
  <text x="30" y="266" font-size="10" fill="#4a7a3a" font-weight="bold">seat()④</text>
  <rect x="90" y="250" width="42" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="111" y="268" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">人</text>
  <rect x="132" y="250" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="174" y="250" width="42" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="268" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">新</text>
  <rect x="216" y="250" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="258" y="250" width="42" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="279" y="268" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">人</text>
  <rect x="300" y="250" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="342" y="250" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="384" y="250" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="426" y="250" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="468" y="250" width="42" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="489" y="268" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">人</text>
  <rect x="520" y="250" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="550" y="268" text-anchor="middle" font-size="10" fill="#333">→2</text>
  <text x="300" y="286" text-anchor="middle" font-size="9" fill="#888">(0,4):dist=2 vs (4,9):dist=2，平局→取小编号 2</text>

  <!-- Step 5: leave(4) -->
  <text x="30" y="324" font-size="10" fill="#b85450" font-weight="bold">leave(4)</text>
  <rect x="90" y="308" width="42" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="111" y="326" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">人</text>
  <rect x="132" y="308" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="174" y="308" width="42" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="326" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">人</text>
  <rect x="216" y="308" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="258" y="308" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="300" y="308" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="342" y="308" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="384" y="308" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="426" y="308" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="468" y="308" width="42" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="489" y="326" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">人</text>
  <rect x="520" y="308" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="550" y="326" text-anchor="middle" font-size="10" fill="#333">删4</text>
  <text x="300" y="344" text-anchor="middle" font-size="9" fill="#888">seats = {0, 2, 9}，区间自动合并</text>

  <!-- Step 6: seat() → 5 -->
  <text x="30" y="382" font-size="10" fill="#4a7a3a" font-weight="bold">seat()⑤</text>
  <rect x="90" y="366" width="42" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="111" y="384" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">人</text>
  <rect x="132" y="366" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="174" y="366" width="42" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="384" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">人</text>
  <rect x="216" y="366" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="258" y="366" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="300" y="366" width="42" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="321" y="384" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">新</text>
  <rect x="342" y="366" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="384" y="366" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="426" y="366" width="42" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="468" y="366" width="42" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="489" y="384" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">人</text>
  <rect x="520" y="366" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="550" y="384" text-anchor="middle" font-size="10" fill="#333">→5</text>
  <text x="300" y="402" text-anchor="middle" font-size="9" fill="#888">(2,9):dist=(9−2)÷2=3，最大 → 坐(2+9)÷2=5</text>

  <!-- summary -->
  <rect x="40" y="420" width="520" height="82" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="442" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输出序列：[0, 9, 4, 2, null, 5]</text>
  <text x="300" y="460" text-anchor="middle" font-size="10" fill="#444">关键：每次 seat() 遍历当前所有相邻已坐对，三类区间分别算距离取最大</text>
  <text x="300" y="476" text-anchor="middle" font-size="10" fill="#444">平局取最小编号：左→右遍历 + 严格 &gt; 更新 = 天然保留最小编号</text>
  <text x="300" y="494" text-anchor="middle" font-size="10" fill="#b85450">leave(4) 后区间(0,2)、(2,9) 自动可用，无需显式重建区间表</text>
</svg>
