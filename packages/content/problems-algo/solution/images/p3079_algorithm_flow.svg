<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一趟数位扫描，同时攒出 m 与 rep</text>

  <!-- start -->
  <rect x="170" y="40" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">ans = 0，遍历 nums</text>

  <path d="M 260 72 L 260 88" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="155" y="90" width="210" height="34" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="111" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">取下一个 x：m = 0，rep = 0</text>

  <path d="M 260 124 L 260 142" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1: x > 0 ? -->
  <polygon points="260,144 352,184 260,224 168,184" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="189" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">x &gt; 0 ？</text>

  <text x="358" y="176" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 352 184 L 368 184" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- digit processing box -->
  <rect x="370" y="150" width="138" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="439" y="170" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">m = max(m, x % 10)</text>
  <text x="439" y="186" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">rep = rep × 10 + 1</text>
  <text x="439" y="202" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">x = x / 10</text>
  <text x="439" y="216" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">吃掉一位</text>

  <!-- loop back to diamond top -->
  <path d="M 439 150 C 439 118, 320 112, 266 138" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="268" y="240" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否（数位吃完）</text>
  <path d="M 260 224 L 260 244" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- accumulate -->
  <rect x="155" y="246" width="210" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="267" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans += m × rep</text>

  <path d="M 260 280 L 260 296" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 2: more numbers? -->
  <polygon points="260,298 356,338 260,378 164,338" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="343" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">还有下一个 x ？</text>

  <text x="140" y="330" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 164 338 C 96 338, 96 107, 151 107" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="362" y="330" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 356 338 L 374 338" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- end -->
  <rect x="378" y="320" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="428" y="342" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- bottom note -->
  <rect x="48" y="396" width="424" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="416" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">n ≤ 50、nums[i] ≤ 1000（最多 4 位）→ 总循环次数 ≤ 200，int 远够用</text>
</svg>
