<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两种解法对比：相关子查询 vs DENSE_RANK 窗口函数</text>

  <!-- Left: Approach A - Correlated subquery -->
  <rect x="20" y="40" width="250" height="320" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="145" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">解法 A：相关子查询</text>

  <rect x="40" y="74" width="210" height="26" fill="#fff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="145" y="91" text-anchor="middle" font-size="10" fill="#333">对 Scores 每一行 s1…</text>

  <path d="M145 102 L145 114" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="40" y="116" width="210" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="50" y="134" font-size="9" fill="#333">SELECT COUNT(DISTINCT s2.score)</text>
  <text x="50" y="148" font-size="9" fill="#333">FROM Scores s2</text>
  <text x="50" y="162" font-size="9" fill="#333">WHERE s2.score &gt;= s1.score</text>

  <path d="M145 174 L145 186" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="40" y="188" width="210" height="26" fill="#fff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="145" y="205" text-anchor="middle" font-size="10" fill="#333">→ rank = 不同分数 ≥ s1 的个数</text>

  <!-- Example -->
  <rect x="40" y="226" width="210" height="52" fill="#fff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="242" font-size="9" fill="#888">示例：s1.score = 3.85</text>
  <text x="50" y="256" font-size="9" fill="#333">≥ 3.85 的不同分: {4.00, 3.85}</text>
  <text x="50" y="270" font-size="9" fill="#b85450" font-weight="bold">→ rank = 2 ✓</text>

  <!-- Complexity -->
  <rect x="40" y="290" width="210" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="50" y="308" font-size="10" fill="#b85450" font-weight="bold">时间 O(n²)</text>
  <text x="50" y="324" font-size="9" fill="#333">每行触发一次全表扫描，n 行共 n² 次</text>
  <text x="50" y="336" font-size="9" fill="#333">空间 O(k)，k = 不同分数个数</text>

  <!-- VS divider -->
  <text x="280" y="200" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">VS</text>

  <!-- Right: Approach B - Window function -->
  <rect x="290" y="40" width="250" height="320" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="415" y="62" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">解法 B：DENSE_RANK ★</text>

  <rect x="310" y="74" width="210" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="415" y="91" text-anchor="middle" font-size="10" fill="#333">按 score DESC 全局排序…</text>

  <path d="M415 102 L415 114" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="310" y="116" width="210" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="134" font-size="9" fill="#333">SELECT score,</text>
  <text x="320" y="148" font-size="9" fill="#333">  DENSE_RANK() OVER(</text>
  <text x="320" y="162" font-size="9" fill="#333">    ORDER BY score DESC) AS rank</text>

  <path d="M415 174 L415 186" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="310" y="188" width="210" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="415" y="205" text-anchor="middle" font-size="10" fill="#333">→ 排序后扫描一次即得 rank</text>

  <!-- Example -->
  <rect x="310" y="226" width="210" height="52" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="320" y="242" font-size="9" fill="#888">示例：排序后 4.00, 4.00, 3.85…</text>
  <text x="320" y="256" font-size="9" fill="#333">首个不同值 → rank 1</text>
  <text x="320" y="270" font-size="9" fill="#b85450" font-weight="bold">3.85 → 遇新值 rank+1 = 2 ✓</text>

  <!-- Complexity -->
  <rect x="310" y="290" width="210" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="320" y="308" font-size="10" fill="#4a7a3a" font-weight="bold">时间 O(n log n)</text>
  <text x="320" y="324" font-size="9" fill="#333">排序 O(n log n) + 单趟扫描 O(n)</text>
  <text x="320" y="336" font-size="9" fill="#333">空间 O(n)，缓存排序中间结果</text>
</svg>
