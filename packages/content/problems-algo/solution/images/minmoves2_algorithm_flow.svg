<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 → 取中位数 → 累加绝对差</text>

  <rect x="180" y="48" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">输入 nums</text>

  <path d="M 270 96 L 270 116" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="120" width="220" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="142" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">① sort(nums)</text>
  <text x="270" y="160" text-anchor="middle" font-size="11" fill="#666">O(n log n)</text>

  <path d="M 270 172 L 270 192" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="196" width="260" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="218" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">② median = nums[n / 2]</text>
  <text x="270" y="236" text-anchor="middle" font-size="11" fill="#666">奇偶长度通用：下中位数即最优点</text>

  <path d="M 270 248 L 270 268" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="272" width="300" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="294" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">③ ans += |nums[i] − median|</text>
  <text x="270" y="312" text-anchor="middle" font-size="11" fill="#666">遍历全体累加，O(n)</text>

  <path d="M 270 324 L 270 344" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="348" width="180" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="376" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">返回 ans</text>

  <rect x="40" y="408" width="460" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="432" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">两指针简化：sum(nums[r] − nums[l])，l&lt;r，省去显式求 median</text>
</svg>
