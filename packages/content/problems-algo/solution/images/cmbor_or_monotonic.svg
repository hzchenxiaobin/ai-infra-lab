<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：按位或的单调性</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">OR 进去的元素越多，置 1 的位只增不减 → 最大 OR = 全员 OR</text>

  <g filter="url(#rough2)" font-size="11">
    <!-- ===== Row 1: {3} ===== -->
    <rect x="40" y="66" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="100" y="84" text-anchor="middle" fill="#446688" font-weight="bold">{3}</text>
    <text x="100" y="98" text-anchor="middle" fill="#888" font-size="9">二进制 011</text>

    <!-- bit cells for OR=3 : 0 1 1 -->
    <rect x="200" y="68" width="34" height="36" fill="#f5f5f5" stroke="#888" stroke-width="1.2" rx="4"/>
    <text x="217" y="92" text-anchor="middle" fill="#888" font-weight="bold">0</text>
    <rect x="238" y="68" width="34" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="255" y="92" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="276" y="68" width="34" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="293" y="92" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>

    <text x="350" y="92" font-size="12" fill="#555" font-weight="bold">OR = 3</text>

    <!-- arrow down: OR-in 2 -->
    <path d="M 270 108 L 270 130" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)"/>
    <text x="284" y="124" font-size="10" fill="#4a7a3a" font-weight="bold">| 2  (010)</text>

    <!-- ===== Row 2: {3,2} ===== -->
    <rect x="40" y="134" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="100" y="152" text-anchor="middle" fill="#446688" font-weight="bold">{3,2}</text>
    <text x="100" y="166" text-anchor="middle" fill="#888" font-size="9">二进制 011</text>

    <rect x="200" y="136" width="34" height="36" fill="#f5f5f5" stroke="#888" stroke-width="1.2" rx="4"/>
    <text x="217" y="160" text-anchor="middle" fill="#888" font-weight="bold">0</text>
    <rect x="238" y="136" width="34" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="255" y="160" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="276" y="136" width="34" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="293" y="160" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>

    <text x="350" y="160" font-size="12" fill="#555" font-weight="bold">OR = 3</text>
    <text x="392" y="160" font-size="9" fill="#888">(无新位)</text>

    <!-- arrow down: OR-in 1 -->
    <path d="M 270 176 L 270 198" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)"/>
    <text x="284" y="192" font-size="10" fill="#4a7a3a" font-weight="bold">| 1  (001)</text>

    <!-- ===== Row 3: {3,2,1} ===== -->
    <rect x="40" y="202" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="100" y="220" text-anchor="middle" fill="#446688" font-weight="bold">{3,2,1}</text>
    <text x="100" y="234" text-anchor="middle" fill="#888" font-size="9">二进制 011</text>

    <rect x="200" y="204" width="34" height="36" fill="#f5f5f5" stroke="#888" stroke-width="1.2" rx="4"/>
    <text x="217" y="228" text-anchor="middle" fill="#888" font-weight="bold">0</text>
    <rect x="238" y="204" width="34" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="255" y="228" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="276" y="204" width="34" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="293" y="228" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>

    <text x="350" y="228" font-size="12" fill="#555" font-weight="bold">OR = 3</text>
    <text x="392" y="228" font-size="9" fill="#888">(无新位)</text>

    <!-- arrow down: OR-in 5 -->
    <path d="M 270 244 L 270 266" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="284" y="260" font-size="10" fill="#b85450" font-weight="bold">| 5  (101)</text>

    <!-- ===== Row 4: {3,2,1,5} ===== -->
    <rect x="40" y="270" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="100" y="288" text-anchor="middle" fill="#d6a040" font-weight="bold">{3,2,1,5}</text>
    <text x="100" y="302" text-anchor="middle" fill="#888" font-size="9">二进制 111</text>

    <rect x="200" y="272" width="34" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="217" y="296" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="238" y="272" width="34" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="255" y="296" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="276" y="272" width="34" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="293" y="296" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>

    <text x="350" y="296" font-size="12" fill="#d6a040" font-weight="bold">OR = 7</text>
    <text x="392" y="296" font-size="9" fill="#b85450" font-weight="bold">⭐新位置 1</text>

    <!-- bit position labels -->
    <text x="217" y="60" text-anchor="middle" font-size="9" fill="#888">位2</text>
    <text x="255" y="60" text-anchor="middle" font-size="9" fill="#888">位1</text>
    <text x="293" y="60" text-anchor="middle" font-size="9" fill="#888">位0</text>
  </g>

  <!-- ===== Key insight box ===== -->
  <rect x="30" y="324" width="480" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="344" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⚠️ OR 单调：a | b ≥ a，加入元素只会把更多位"点亮"，永不熄灭</text>
  <text x="270" y="360" text-anchor="middle" font-size="10" fill="#555">故 maxOR = nums[0] | nums[1] | … | nums[n−1]（全员 OR），一步算出</text>
</svg>
