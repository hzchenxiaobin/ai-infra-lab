<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：两阶段流水线 —— 先逐窗算代价，再划分 DP 选 k 个</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">示例 1（x=3, k=2）：选中下标 1..3 与 5..7 两个不重叠窗口</text>

  <!-- nums array -->
  <text x="56" y="73" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">nums</text>

  <rect x="62" y="54" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="84" y="73" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="106" y="54" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="73" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">−2</text>
  <rect x="150" y="54" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="172" y="73" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="194" y="54" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="73" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="238" y="54" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="260" y="73" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="282" y="54" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="304" y="73" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="326" y="54" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="348" y="73" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="370" y="54" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="392" y="73" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="414" y="54" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="436" y="73" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">−1</text>

  <!-- cost row -->
  <text x="100" y="117" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">cost[i]</text>

  <rect x="110" y="100" width="36" height="24" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="128" y="116" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">7</text>
  <rect x="154" y="100" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="172" y="116" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="198" y="100" width="36" height="24" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="216" y="116" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">6</text>
  <rect x="242" y="100" width="36" height="24" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="116" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">4</text>
  <rect x="286" y="100" width="36" height="24" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="304" y="116" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">4</text>
  <rect x="330" y="100" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="348" y="116" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="374" y="100" width="36" height="24" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="392" y="116" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">7</text>

  <!-- annotation -->
  <g filter="url(#rough2)">
    <rect x="70" y="132" width="380" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6"/>
    <text x="260" y="147" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8f3a36">不重叠 ⇒ cost[1] + cost[5] = 5 + 3 = 8（中位数 1 与 4）</text>
  </g>

  <!-- stage 1 box -->
  <g filter="url(#rough2)">
    <rect x="40" y="164" width="205" height="72" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="142" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506b">阶段①：滑动中位数求 cost[]</text>
    <text x="142" y="202" text-anchor="middle" font-size="9.5" fill="#55677d">cost[i] = Σ|a − m|，m 为窗口中位数</text>
    <text x="142" y="217" text-anchor="middle" font-size="9.5" fill="#55677d">双有序集合 lo / hi 一进一出，O(log x)</text>
    <text x="142" y="232" text-anchor="middle" font-size="9.5" fill="#55677d">两侧和 slo、shi ⇒ 结算 O(1)</text>
  </g>

  <!-- arrow between stages -->
  <path d="M 248 200 L 268 200" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 268 200 L 262 196 L 262 204 Z" fill="#888" filter="url(#rough2)"/>
  <text x="258" y="192" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">cost</text>

  <!-- stage 2 box -->
  <g filter="url(#rough2)">
    <rect x="272" y="164" width="208" height="72" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="376" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24">阶段②：划分 DP 选 k 个窗口</text>
    <text x="376" y="202" text-anchor="middle" font-size="9.5" fill="#55677d">dp[j][i] = min( dp[j][i−1],</text>
    <text x="376" y="215" text-anchor="middle" font-size="9.5" fill="#55677d">  dp[j−1][i−x] + cost[i−x] )</text>
    <text x="376" y="230" text-anchor="middle" font-size="9.5" fill="#55677d">定长 x ⇒ t = i−x 唯一，转移 O(1)</text>
  </g>

  <!-- two notes -->
  <g filter="url(#rough2)">
    <rect x="40" y="246" width="220" height="56" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="5 3" rx="8"/>
    <text x="150" y="266" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33506b">「不重叠」写进转移里</text>
    <text x="150" y="282" text-anchor="middle" font-size="9.5" fill="#55677d">第 j 个窗口起点为 i−x，前面</text>
    <text x="150" y="296" text-anchor="middle" font-size="9.5" fill="#55677d">只看前 i−x 个元素，天然隔开</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="280" y="246" width="220" height="56" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="5 3" rx="8"/>
    <text x="390" y="266" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24">k·x ≤ n ⇒ 恒有解</text>
    <text x="390" y="282" text-anchor="middle" font-size="9.5" fill="#55677d">答案 dp[k][n]；k ≤ 15 ⇒ DP 层</text>
    <text x="390" y="296" text-anchor="middle" font-size="9.5" fill="#55677d">数至多 15，共 ≤ 1.5×10⁶ 次转移</text>
  </g>

  <!-- bottom summary -->
  <g filter="url(#rough2)">
    <rect x="40" y="312" width="460" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8"/>
    <text x="270" y="328" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6d1f">总复杂度 O(n log n + nk)：滑动中位数 O(n log x) + 划分 DP O(nk)</text>
    <text x="270" y="343" text-anchor="middle" font-size="9.5" fill="#8a6d1f">空间 O(n)：cost 数组 + 两行滚动 dp；代价与 dp 均需 64 位整数</text>
  </g>
</svg>
