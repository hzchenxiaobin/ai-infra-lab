<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：单层循环 + 查表算跨度 + 覆盖更新</text>
  <path d="M 120 42 Q 280 50 440 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <ellipse cx="280" cy="70" rx="48" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="280" y="75" text-anchor="middle" font-size="13" fill="#333">开始</text>
  <path d="M 280 88 L 280 100" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <g filter="url(#rough2)">
    <rect x="180" y="102" width="200" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="280" y="125" text-anchor="middle" font-size="13" fill="#333">ans = ∞，last = {}</text>
  <path d="M 280 138 L 280 150" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取下一张 cards[i] -->
  <g filter="url(#rough2)">
    <rect x="190" y="152" width="180" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="280" y="175" text-anchor="middle" font-size="13" fill="#333">取下一张 cards[i]</text>
  <path d="M 280 188 L 280 200" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 决策菱形 1 -->
  <g filter="url(#rough2)">
    <polygon points="280,202 400,244 280,286 160,244" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="280" y="240" text-anchor="middle" font-size="12" fill="#333">cards[i] ∈ last ?</text>
  <text x="280" y="256" text-anchor="middle" font-size="12" fill="#333">（之前见过同值）</text>

  <!-- 是 → 算跨度更新 ans -->
  <path d="M 400 244 L 432 244" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="416" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">是</text>
  <g filter="url(#rough2)">
    <rect x="402" y="266" width="148" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="476" y="284" text-anchor="middle" font-size="11" fill="#b85450">dist = i − last[cards[i]] + 1</text>
  <text x="476" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">ans = min(ans, dist)</text>
  <path d="M 476 310 L 476 322 L 380 322" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 否 → 直接到覆盖 -->
  <path d="M 280 286 L 280 322" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="306" font-size="11" font-weight="bold" fill="#666">否</text>

  <!-- 覆盖更新 -->
  <g filter="url(#rough2)">
    <rect x="190" y="324" width="190" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="285" y="347" text-anchor="middle" font-size="13" fill="#333">last[cards[i]] = i（覆盖）</text>
  <path d="M 285 360 L 285 370" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 决策菱形 2 -->
  <g filter="url(#rough2)">
    <polygon points="285,372 370,402 285,432 200,402" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="285" y="407" text-anchor="middle" font-size="12" fill="#333">i 还有下一个 ?</text>

  <!-- 是 → 回到取下一张 -->
  <path d="M 200 402 L 130 402 L 130 170 L 190 170" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="156" y="396" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">是</text>

  <!-- 否 → 返回 -->
  <path d="M 370 402 L 432 402" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="412" y="396" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">否</text>
  <g filter="url(#rough2)">
    <rect x="402" y="382" width="148" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="476" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">ans == ∞ ?</text>
  <text x="476" y="416" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">返回 −1 : 返回 ans</text>
</svg>
