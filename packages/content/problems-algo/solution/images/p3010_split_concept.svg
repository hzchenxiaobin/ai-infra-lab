<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：切成 3 段连续子数组，每段只付「首元素」的代价</text>

  <!-- nums array -->
  <text x="92" y="71" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">nums =</text>
  <rect x="108" y="48" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="71" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="160" y="48" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="182" y="71" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="212" y="48" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="71" text-anchor="middle" font-size="14" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="264" y="48" width="44" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="286" y="71" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">12</text>

  <!-- cut points -->
  <path d="M 156 40 L 156 88" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="149" y="36" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">切点 i</text>
  <path d="M 208 40 L 208 88" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="216" y="36" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">切点 j</text>

  <!-- segment brackets -->
  <path d="M 108 92 L 152 92" stroke="#446688" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <text x="130" y="108" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">第 1 段</text>
  <path d="M 160 92 L 204 92" stroke="#4a7a3a" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <text x="182" y="108" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第 2 段</text>
  <path d="M 212 92 L 308 92" stroke="#d6a040" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <text x="260" y="108" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">第 3 段</text>

  <!-- cost tags -->
  <path d="M 130 118 L 130 122" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 182 118 L 182 122" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 234 118 L 234 122" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="95" y="143" text-anchor="end" font-size="11.5" fill="#888" filter="url(#rough2)">各段代价：</text>
  <rect x="106" y="124" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="145" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="156" y="145" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">+</text>
  <rect x="158" y="124" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="182" y="145" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="208" y="145" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">+</text>
  <rect x="210" y="124" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="234" y="145" text-anchor="middle" font-size="14" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="300" y="143" font-size="10.5" fill="#999" filter="url(#rough2)">（都取各自段的首元素）</text>

  <!-- formula box -->
  <path d="M 182 160 L 182 172" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="58" y="176" width="404" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="199" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">总代价 = nums[0] + nums[i] + nums[j] = 1 + 2 + 3 = 6（最优）</text>
  <text x="260" y="221" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">i = 1、j = 2 是第 2、3 段首元素的下标（i &lt; j 即可）</text>

  <!-- key insight box -->
  <rect x="48" y="250" width="424" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="273" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 第 1 段必须从 nums[0] 开始 → 这份代价固定，没得选</text>
  <text x="260" y="295" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">② 第 2、3 段首元素 = 在 nums[1…n−1] 里任取两个下标 i &lt; j</text>
  <text x="260" y="317" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 任取两个下标都能切出合法的 3 段 → 取最小的两个！</text>

  <!-- bottom note -->
  <rect x="48" y="352" width="424" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="368" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">本例 nums[1:] = [2, 3, 12]，最小两个是 2 和 3 → 1 + 2 + 3 = 6 ✓</text>
  <text x="260" y="384" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">约束 3 ≤ n ≤ 50 保证 nums[1:] 至少有两个元素</text>
</svg>
