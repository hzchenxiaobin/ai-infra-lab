<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">LEFT JOIN：保留左表全部行，无匹配则补 NULL</text>

  <!-- Customers table -->
  <text x="95" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Customers（左表，全保留）</text>
  <rect x="40" y="62" width="110" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="77" font-size="10" fill="#333">id</text>
  <text x="105" y="77" font-size="10" fill="#333">name</text>
  <line x1="82" y1="62" x2="82" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="84" width="110" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="62" y="98" font-size="10" fill="#333">1</text>
  <text x="105" y="98" font-size="10" fill="#333">Joe</text>
  <line x1="82" y1="84" x2="82" y2="104" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="104" width="110" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="62" y="118" font-size="10" fill="#333">2</text>
  <text x="105" y="118" font-size="10" fill="#b85450" font-weight="bold">Henry</text>
  <line x1="82" y1="104" x2="82" y2="124" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="124" width="110" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="62" y="138" font-size="10" fill="#333">3</text>
  <text x="105" y="138" font-size="10" fill="#333">Sam</text>
  <line x1="82" y1="124" x2="82" y2="144" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="144" width="110" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="62" y="158" font-size="10" fill="#333">4</text>
  <text x="105" y="158" font-size="10" fill="#b85450" font-weight="bold">Max</text>
  <line x1="82" y1="144" x2="82" y2="164" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Orders table -->
  <text x="455" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Orders（右表，按需匹配）</text>
  <rect x="390" y="62" width="130" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="77" font-size="10" fill="#333">id</text>
  <text x="475" y="77" font-size="10" fill="#333">customerId</text>
  <line x1="440" y1="62" x2="440" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="390" y="84" width="130" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="420" y="98" font-size="10" fill="#333">1</text>
  <text x="475" y="98" font-size="10" fill="#333">3</text>
  <line x1="440" y1="84" x2="440" y2="104" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="390" y="104" width="130" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="420" y="118" font-size="10" fill="#333">2</text>
  <text x="475" y="118" font-size="10" fill="#333">1</text>
  <line x1="440" y1="104" x2="440" y2="124" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- JOIN arrows: matched (green), unmatched (red dashed) -->
  <!-- Joe(1) -> Orders id=2, customerId=1 -->
  <path d="M150 94 Q260 80 390 114" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- Henry(2) -> NULL -->
  <path d="M150 114 L230 114" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="195" y="108" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">NULL</text>
  <!-- Sam(3) -> Orders id=1, customerId=3 -->
  <path d="M150 134 Q260 120 390 94" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- Max(4) -> NULL -->
  <path d="M150 154 L230 154" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="195" y="148" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">NULL</text>

  <!-- Arrow down to result -->
  <path d="M290 175 L290 200" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="330" y="192" font-size="10" fill="#446688" font-weight="bold">WHERE o.id IS NULL</text>

  <!-- LEFT JOIN intermediate result -->
  <text x="290" y="218" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">LEFT JOIN 中间结果（4 行，无匹配补 NULL）</text>
  <rect x="150" y="224" width="280" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="239" font-size="10" fill="#333">c.id</text>
  <text x="230" y="239" font-size="10" fill="#333">c.name</text>
  <text x="310" y="239" font-size="10" fill="#333">o.id</text>
  <text x="380" y="239" font-size="10" fill="#333">o.customerId</text>
  <line x1="200" y1="224" x2="200" y2="246" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="280" y1="224" x2="280" y2="246" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="340" y1="224" x2="340" y2="246" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="150" y="246" width="280" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="260" font-size="10" fill="#333">1</text>
  <text x="230" y="260" font-size="10" fill="#333">Joe</text>
  <text x="310" y="260" font-size="10" fill="#333">2</text>
  <text x="380" y="260" font-size="10" fill="#333">1</text>

  <rect x="150" y="266" width="280" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="180" y="280" font-size="10" fill="#333">2</text>
  <text x="230" y="280" font-size="10" fill="#b85450" font-weight="bold">Henry</text>
  <text x="310" y="280" font-size="10" fill="#b85450" font-weight="bold">NULL</text>
  <text x="380" y="280" font-size="10" fill="#b85450" font-weight="bold">NULL</text>

  <rect x="150" y="286" width="280" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="300" font-size="10" fill="#333">3</text>
  <text x="230" y="300" font-size="10" fill="#333">Sam</text>
  <text x="310" y="300" font-size="10" fill="#333">1</text>
  <text x="380" y="300" font-size="10" fill="#333">3</text>

  <rect x="150" y="306" width="280" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="180" y="320" font-size="10" fill="#333">4</text>
  <text x="230" y="320" font-size="10" fill="#b85450" font-weight="bold">Max</text>
  <text x="310" y="320" font-size="10" fill="#b85450" font-weight="bold">NULL</text>
  <text x="380" y="320" font-size="10" fill="#b85450" font-weight="bold">NULL</text>

  <line x1="200" y1="246" x2="200" y2="326" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="280" y1="246" x2="280" y2="326" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="340" y1="246" x2="340" y2="326" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Arrow to final result -->
  <path d="M290 335 L290 355" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Final result -->
  <text x="290" y="370" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">最终结果（IS NULL 筛出的从未下单顾客）</text>
  <rect x="235" y="378" width="110" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="393" text-anchor="middle" font-size="10" fill="#333">Customers</text>
  <rect x="235" y="400" width="110" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="290" y="413" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Henry, Max</text>
</svg>
