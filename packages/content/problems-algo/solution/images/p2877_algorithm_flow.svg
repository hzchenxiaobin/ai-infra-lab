<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：装载 → 贴名 → 输出</text>

  <!-- Step 1 -->
  <rect x="30" y="80" width="140" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="106" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">① 输入</text>
  <text x="100" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">student_data</text>
  <text x="100" y="144" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">行式二维列表</text>
  <text x="100" y="158" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">每行 [id, age]</text>

  <path d="M 175 125 L 215 125" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="220" y="80" width="170" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="305" y="106" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">② 构造器装载</text>
  <text x="305" y="126" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">pd.DataFrame(data,</text>
  <text x="305" y="141" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)"> columns=['student_id',</text>
  <text x="305" y="156" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;'age'])</text>

  <path d="M 395 125 L 435 125" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="440" y="80" width="100" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="490" y="106" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">③ 输出</text>
  <text x="490" y="126" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">DataFrame</text>
  <text x="490" y="143" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">顺序 = 输入顺序</text>
  <text x="490" y="158" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">dtype: int64</text>

  <!-- annotations -->
  <path d="M 305 175 Q 305 200, 260 200 Q 160 200, 100 175" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="218" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">行顺序与行索引都由「按输入顺序写入」自动保证</text>

  <text x="100" y="66" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">n ≤ 10³，单趟 O(n)</text>

  <!-- Bottom checklist -->
  <rect x="60" y="238" width="440" height="44" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">自检：columns 个数 = 每行元素个数（都是 2）</text>
  <text x="280" y="273" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">名字按位置对应：第 0 个 → 第 0 列，第 1 个 → 第 1 列</text>
</svg>
