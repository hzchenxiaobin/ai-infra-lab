<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="860" height="400" fill="#fafafa"/>

  <text x="430" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：DFS 访问顺序与面积累加</text>
  <path d="M 280 40 Q 430 48 580 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <text x="60" y="70" font-size="12" font-weight="bold" fill="#d6a040">岛屿B 的 DFS 访问序号（面积 = 8）</text>

  <!-- grid 5x6, cell 42, origin (60,82) -->
  <!-- row0 : A A . . . . -->
  <g filter="url(#rough2)"><rect x="60" y="82" width="42" height="42" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="81" y="109" text-anchor="middle" font-size="13" fill="#2b4a66" font-weight="bold">1</text>
  <g filter="url(#rough2)"><rect x="102" y="82" width="42" height="42" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="123" y="109" text-anchor="middle" font-size="13" fill="#2b4a66" font-weight="bold">1</text>
  <g filter="url(#rough2)"><rect x="144" y="82" width="42" height="42" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="165" y="109" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="186" y="82" width="42" height="42" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="207" y="109" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="228" y="82" width="42" height="42" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="249" y="109" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="270" y="82" width="42" height="42" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="291" y="109" text-anchor="middle" font-size="12" fill="#bbb">0</text>

  <!-- row1 : A . . 1 2 3 -->
  <g filter="url(#rough2)"><rect x="60" y="124" width="42" height="42" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="81" y="151" text-anchor="middle" font-size="13" fill="#2b4a66" font-weight="bold">1</text>
  <g filter="url(#rough2)"><rect x="102" y="124" width="42" height="42" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="123" y="151" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="144" y="124" width="42" height="42" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="165" y="151" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="186" y="124" width="42" height="42" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="207" y="151" text-anchor="middle" font-size="15" fill="#7a5415" font-weight="bold">1</text>
  <g filter="url(#rough2)"><rect x="228" y="124" width="42" height="42" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="249" y="151" text-anchor="middle" font-size="15" fill="#7a5415" font-weight="bold">2</text>
  <g filter="url(#rough2)"><rect x="270" y="124" width="42" height="42" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="291" y="151" text-anchor="middle" font-size="15" fill="#7a5415" font-weight="bold">3</text>

  <!-- row2 : . . . 8 . 4 -->
  <g filter="url(#rough2)"><rect x="60" y="166" width="42" height="42" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="81" y="193" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="102" y="166" width="42" height="42" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="123" y="193" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="144" y="166" width="42" height="42" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="165" y="193" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="186" y="166" width="42" height="42" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="207" y="193" text-anchor="middle" font-size="15" fill="#7a5415" font-weight="bold">8</text>
  <g filter="url(#rough2)"><rect x="228" y="166" width="42" height="42" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="249" y="193" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="270" y="166" width="42" height="42" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="291" y="193" text-anchor="middle" font-size="15" fill="#7a5415" font-weight="bold">4</text>

  <!-- row3 : . . . 7 6 5 -->
  <g filter="url(#rough2)"><rect x="60" y="208" width="42" height="42" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="81" y="235" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="102" y="208" width="42" height="42" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="123" y="235" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="144" y="208" width="42" height="42" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="165" y="235" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="186" y="208" width="42" height="42" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="207" y="235" text-anchor="middle" font-size="15" fill="#7a5415" font-weight="bold">7</text>
  <g filter="url(#rough2)"><rect x="228" y="208" width="42" height="42" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="249" y="235" text-anchor="middle" font-size="15" fill="#7a5415" font-weight="bold">6</text>
  <g filter="url(#rough2)"><rect x="270" y="208" width="42" height="42" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="291" y="235" text-anchor="middle" font-size="15" fill="#7a5415" font-weight="bold">5</text>

  <!-- row4 : . . C . . . -->
  <g filter="url(#rough2)"><rect x="60" y="250" width="42" height="42" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="81" y="277" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="102" y="250" width="42" height="42" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="123" y="277" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="144" y="250" width="42" height="42" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="165" y="277" text-anchor="middle" font-size="13" fill="#2e5a26" font-weight="bold">1</text>
  <g filter="url(#rough2)"><rect x="186" y="250" width="42" height="42" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="207" y="277" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="228" y="250" width="42" height="42" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="249" y="277" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="270" y="250" width="42" height="42" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="291" y="277" text-anchor="middle" font-size="12" fill="#bbb">0</text>

  <!-- DFS direction hint -->
  <text x="207" y="318" text-anchor="middle" font-size="11" fill="#888">DFS 方向序：→ ↓ ← ↑，遇 0/越界/已沉 → 回溯</text>

  <!-- step table on right -->
  <g filter="url(#rough2)">
    <rect x="380" y="70" width="450" height="300" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="398" y="94" font-size="13" font-weight="bold" fill="#444">扫描过程（行优先）：</text>

  <!-- header -->
  <text x="398" y="118" font-size="11" font-weight="bold" fill="#446688">步骤</text>
  <text x="450" y="118" font-size="11" font-weight="bold" fill="#446688">遇到</text>
  <text x="520" y="118" font-size="11" font-weight="bold" fill="#446688">DFS 沉岛块</text>
  <text x="660" y="118" font-size="11" font-weight="bold" fill="#446688">area</text>
  <text x="720" y="118" font-size="11" font-weight="bold" fill="#b85450">max_area</text>
  <line x1="396" y1="126" x2="820" y2="126" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <text x="398" y="148" font-size="11" fill="#446688">①</text>
  <text x="450" y="148" font-size="11" fill="#333">(0,0)=1</text>
  <text x="520" y="148" font-size="11" fill="#333">沉岛屿A (3格)</text>
  <text x="660" y="148" font-size="11" fill="#333">3</text>
  <text x="720" y="148" font-size="12" fill="#b85450" font-weight="bold">3</text>

  <text x="398" y="176" font-size="11" fill="#d6a040" font-weight="bold">②</text>
  <text x="450" y="176" font-size="11" fill="#333">(1,3)=1</text>
  <text x="520" y="176" font-size="11" fill="#333">沉岛屿B (8格)</text>
  <text x="660" y="176" font-size="11" fill="#333">8</text>
  <text x="720" y="176" font-size="12" fill="#b85450" font-weight="bold">8</text>

  <text x="398" y="204" font-size="11" fill="#4a7a3a">③</text>
  <text x="450" y="204" font-size="11" fill="#333">(4,2)=1</text>
  <text x="520" y="204" font-size="11" fill="#333">沉岛屿C (1格)</text>
  <text x="660" y="204" font-size="11" fill="#333">1</text>
  <text x="720" y="204" font-size="12" fill="#b85450" font-weight="bold">8</text>

  <line x1="396" y1="216" x2="820" y2="216" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="398" y="238" font-size="12" fill="#444" font-weight="bold">遍历结束 → 返回</text>
  <text x="720" y="238" font-size="13" fill="#b85450" font-weight="bold">8</text>

  <text x="398" y="270" font-size="11" fill="#888">注：扫描到 (1,3) 时，岛屿A 的格子早已</text>
  <text x="398" y="286" font-size="11" fill="#888">被沉为 0，不会重复进入 DFS。每格至多访问一次。</text>

  <g filter="url(#rough2)"><rect x="398" y="300" width="120" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="458" y="320" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">最终答案 = 8</text>
</svg>
