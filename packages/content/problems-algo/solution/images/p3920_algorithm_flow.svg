<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序把二维条件压成一维，二分求最长非递减子序列</text>

  <!-- step 1 -->
  <rect x="150" y="40" width="260" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12.5" fill="#333">① 筛选：只保留 nums[i] ≤ i 的下标</text>

  <path d="M 280 78 L 280 96" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="150" y="100" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">② 建二元组 (v, d) 并排序</text>
  <text x="280" y="138" text-anchor="middle" font-size="10.5" fill="#666">v 升序；同 v 时 d 降序（挡住同值候选入同一条链）</text>

  <path d="M 280 144 L 280 162" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="150" y="166" width="260" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="188" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">③ 依序取出 d，二分找 pos</text>
  <text x="280" y="206" text-anchor="middle" font-size="10.5" fill="#666">pos = tails 中第一个 &gt; d 的位置</text>
  <text x="280" y="219" text-anchor="middle" font-size="9.5" fill="#999">tails[k]：长度 k+1 的非降链的最小结尾</text>

  <path d="M 280 224 L 280 242" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="280,244 400,276 280,308 160,276" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">pos == len(tails) ?</text>
  <text x="280" y="290" text-anchor="middle" font-size="10.5" fill="#777">d 不小于任何现有链尾？</text>

  <path d="M 400 276 L 460 312" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="443" y="288" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 160 276 L 100 312" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="118" y="288" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">否</text>

  <!-- outcome boxes -->
  <rect x="28" y="316" width="160" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="108" y="337" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">tails[pos] ← d</text>
  <text x="108" y="355" text-anchor="middle" font-size="10.5" fill="#444">结尾换小，给后面留机会</text>

  <rect x="372" y="316" width="160" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="452" y="337" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">tails 追加 d</text>
  <text x="452" y="355" text-anchor="middle" font-size="10.5" fill="#444">最长非降链长度 +1</text>

  <path d="M 108 368 L 225 396" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 452 368 L 335 396" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="280" y="386" text-anchor="middle" font-size="10" fill="#8899aa">重复 ③，处理完所有二元组后</text>

  <!-- step 4 -->
  <rect x="150" y="398" width="260" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="422" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">④ 答案 = len(tails)</text>

  <text x="280" y="454" text-anchor="middle" font-size="10.5" fill="#8899aa">示例 [1,0,1,2]：d 序列 1, 1, 1 → tails 演化 [1] → [1,1] → [1,1,1]，答案 3</text>
  <text x="280" y="471" text-anchor="middle" font-size="10.5" fill="#b85450">⚠️ 非递减须用 upper_bound / bisect_right，用 lower_bound 会退化成严格递增</text>
</svg>
