<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">固定右端点 i：左端点按 gcd 分组，组间构成整除链</text>

  <!-- Example A: [7,3,9], i=2 -->
  <text x="36" y="50" font-size="12" fill="#555">示例 2：以 9 结尾（i=2）的子数组</text>

  <rect x="36" y="58" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="78" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="78" y="58" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="78" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="120" y="58" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="139" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>

  <text x="55" y="102" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="97" y="102" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="139" y="102" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>
  <text x="150" y="102" font-size="10" fill="#d6a040" font-weight="bold">← i</text>

  <rect x="36" y="118" width="122" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="42" y="133" font-size="10" fill="#446688" font-weight="bold">L=0</text>
  <text x="166" y="133" font-size="11" fill="#333">gcd=1 · 和=19 → 1×19 = 19</text>

  <rect x="78" y="146" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="84" y="161" font-size="10" fill="#4a7a3a" font-weight="bold">L=1</text>
  <text x="166" y="161" font-size="11" fill="#333">gcd=3 · 和=12 → 3×12 = 36</text>

  <rect x="120" y="174" width="38" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="126" y="189" font-size="10" fill="#b85450" font-weight="bold">L=2</text>
  <text x="166" y="189" font-size="11" fill="#b85450" font-weight="bold">gcd=9 · 和=9 → 9×9 = 81 ★</text>

  <!-- chain box -->
  <rect x="336" y="112" width="166" height="116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="419" y="132" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">整除链：1 | 3 | 9</text>
  <text x="419" y="150" text-anchor="middle" font-size="10.5" fill="#333">G(L) | G(L+1)：</text>
  <text x="419" y="166" text-anchor="middle" font-size="10.5" fill="#333">长区间的 gcd 整除短区间的</text>
  <text x="419" y="186" text-anchor="middle" font-size="10.5" fill="#333">相邻不同值至少差 2 倍</text>
  <text x="419" y="204" text-anchor="middle" font-size="10.5" fill="#555">V ≤ 10⁶ &lt; 2²⁰</text>
  <text x="419" y="222" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">→ 至多 21 组！</text>

  <!-- Example B: [2,1,4,4,4,2], i=4 -->
  <text x="36" y="252" font-size="12" fill="#555">示例 1：以 i=4 结尾，gcd=4 的左端点连成一段区间</text>

  <rect x="36" y="260" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="280" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="78" y="260" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="280" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="120" y="260" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="139" y="280" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="162" y="260" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="181" y="280" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="204" y="260" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="223" y="280" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="246" y="260" width="38" height="30" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="265" y="280" text-anchor="middle" font-size="12" fill="#aaa">2</text>

  <text x="55" y="304" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="97" y="304" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="139" y="304" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="181" y="304" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="223" y="304" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">4</text>
  <text x="265" y="304" text-anchor="middle" font-size="10" fill="#bbb">5</text>
  <text x="274" y="304" font-size="10" fill="#d6a040" font-weight="bold">← i</text>

  <path d="M 122 312 L 122 322 L 240 322 L 240 312" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="181" y="340" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">gcd = 4 的组：L ∈ [2, 4]，最左 j = 2 → 4×12 = 48</text>

  <rect x="36" y="352" width="464" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="268" y="372" text-anchor="middle" font-size="11" fill="#333">元素全为正 → 同组取最左端点 j=2：区间和最大（4+4+4=12），长度也最长（最易满足 ≥ k）</text>
  <text x="268" y="392" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">每组只产生 1 个候选：g × (pre[i+1] − pre[j])，候选总数 O(n log V)</text>
</svg>
