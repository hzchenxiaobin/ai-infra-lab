<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：双指针跳链 + 尾接 evenHead</text>

  <!-- Start -->
  <rect x="210" y="46" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="17" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">入口 head</text>
  <line x1="280" y1="80" x2="280" y2="92" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: empty / single? -->
  <polygon points="160,130 280,92 400,130 280,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="11.5" fill="#333">head 为空</text>
  <text x="280" y="142" text-anchor="middle" font-size="11.5" fill="#333">或仅一个节点?</text>
  <!-- Yes -> return head -->
  <line x1="400" y1="130" x2="446" y2="130" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="406" y="122" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="448" y="113" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="498" y="135" text-anchor="middle" font-size="11.5" fill="#333">return head</text>
  <!-- No -> down -->
  <text x="288" y="182" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <line x1="280" y1="168" x2="280" y2="186" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init box -->
  <rect x="170" y="188" width="220" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="210" text-anchor="middle" font-size="12" fill="#333">odd = head</text>
  <text x="280" y="228" text-anchor="middle" font-size="12" fill="#333">even = head.next;  evenHead = even</text>
  <line x1="280" y1="244" x2="280" y2="256" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop decision diamond -->
  <polygon points="140,296 280,256 420,296 280,336" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="11.5" fill="#333">even != null</text>
  <text x="280" y="308" text-anchor="middle" font-size="11.5" fill="#333">&amp;&amp; even.next != null ?</text>
  <!-- No -> right to end -->
  <line x1="420" y1="296" x2="446" y2="296" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="426" y="288" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="448" y="274" width="104" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="500" y="296" text-anchor="middle" font-size="11.5" fill="#333">odd.next = evenHead</text>
  <text x="500" y="314" text-anchor="middle" font-size="11.5" fill="#333">return head</text>
  <!-- Yes -> down to process -->
  <text x="288" y="350" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <line x1="280" y1="336" x2="280" y2="358" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Process box -->
  <rect x="130" y="360" width="300" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="12" fill="#333">① odd.next = even.next;  odd = odd.next</text>
  <text x="280" y="402" text-anchor="middle" font-size="12" fill="#333">② even.next = odd.next;  even = even.next</text>

  <!-- loop back arrow: from process left side, up to loop diamond left -->
  <path d="M 130 390 Q 70 390 70 296 L 138 296" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="78" y="340" font-size="10.5" fill="#888" font-weight="bold">回到循环判断</text>

  <!-- note -->
  <rect x="130" y="436" width="360" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="310" y="454" text-anchor="middle" font-size="11" fill="#666">先动 odd 再动 even：odd 前移后，odd.next 正好是新的偶数位候选</text>
</svg>
