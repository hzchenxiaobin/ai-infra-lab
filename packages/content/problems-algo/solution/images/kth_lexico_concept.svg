<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="560" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：字典序 = 十叉字典树的前序遍历</text>

  <!-- ===== Row 1: n=13 的字典序序列 ===== -->
  <text x="30" y="58" font-size="11" fill="#446688" font-weight="bold">n=13 字典序</text>
  <rect x="78" y="44" width="470" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="88" y="65" font-size="11" fill="#333">1   10   11   12   13   2   3   4   5   6   7   8   9</text>

  <path d="M 290 80 Q 290 92 290 100" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 2: 十叉树 ===== -->
  <text x="30" y="124" font-size="11" fill="#4a7a3a" font-weight="bold">十叉树</text>

  <!-- 根节点 1..9 (y=130, 9 nodes) -->
  <!-- node 1 (highlighted, has children) -->
  <rect x="52" y="132" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="72" y="151" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="50" y="129" font-size="9" fill="#d6a040" font-weight="bold">①</text>

  <!-- nodes 2..9 -->
  <rect x="122" y="132" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="140" y="151" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="120" y="129" font-size="9" fill="#d6a040" font-weight="bold">⑥</text>

  <rect x="180" y="132" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="198" y="151" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="178" y="129" font-size="9" fill="#d6a040" font-weight="bold">⑦</text>

  <rect x="238" y="132" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="256" y="151" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="236" y="129" font-size="9" fill="#d6a040" font-weight="bold">⑧</text>

  <rect x="296" y="132" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="314" y="151" text-anchor="middle" font-size="12" fill="#333">5</text>

  <rect x="354" y="132" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="372" y="151" text-anchor="middle" font-size="12" fill="#333">6</text>

  <rect x="412" y="132" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="430" y="151" text-anchor="middle" font-size="12" fill="#333">7</text>

  <rect x="470" y="132" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="488" y="151" text-anchor="middle" font-size="12" fill="#333">8</text>

  <rect x="524" y="132" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="540" y="151" text-anchor="middle" font-size="12" fill="#333">9</text>

  <!-- 1 的子节点 10,11,12,13 (y=220) -->
  <path d="M 72 160 Q 72 184 60 206" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 72 160 Q 80 184 100 206" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 72 160 Q 90 188 160 206" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 72 160 Q 100 190 220 206" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="208" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="60" y="227" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>
  <text x="38" y="205" font-size="9" fill="#d6a040" font-weight="bold">②</text>

  <rect x="80" y="208" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="100" y="227" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">11</text>
  <text x="78" y="205" font-size="9" fill="#d6a040" font-weight="bold">③</text>

  <rect x="140" y="208" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="160" y="227" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">12</text>
  <text x="138" y="205" font-size="9" fill="#d6a040" font-weight="bold">④</text>

  <rect x="200" y="208" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="220" y="227" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">13</text>
  <text x="198" y="205" font-size="9" fill="#d6a040" font-weight="bold">⑤</text>

  <!-- note: 2..9 无子节点 -->
  <rect x="300" y="212" width="240" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)" opacity="0.55"/>
  <text x="420" y="231" text-anchor="middle" font-size="10" fill="#b85450">2~9 的子节点 20…93 &gt; 13，故无子节点</text>

  <!-- 前序遍历 = 字典序 标注 -->
  <rect x="40" y="262" width="500" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)" opacity="0.6"/>
  <text x="290" y="282" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">前序遍历顺序 ①②③④⑤⑥⑦…⑬ = 字典序序列</text>

  <path d="M 290 296 Q 290 306 290 316" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 3: countNodes 子树计数 ===== -->
  <text x="290" y="338" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">子树计数 countNodes(prefix, n) —— 整子树跳过的关键</text>

  <rect x="40" y="350" width="500" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="372" font-size="11" fill="#333">以 prefix 为根的子树 = 按层累加区间 [prefix·10^d, (prefix+1)·10^d) 与 [1, n] 的交集</text>
  <text x="56" y="394" font-size="11" fill="#333" font-family="'Comic Sans MS', monospace">cur=prefix, nxt=prefix+1, cnt=0</text>
  <text x="56" y="410" font-size="11" fill="#333" font-family="'Comic Sans MS', monospace">while cur ≤ n:  cnt += min(nxt, n+1) − cur;  cur*=10; nxt*=10</text>
  <text x="56" y="428" font-size="10" fill="#b85450">例：countNodes(1, 13) = (2−1) + (14−10) = 1 + 4 = 5</text>

  <path d="M 290 440 Q 290 450 290 460" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 4: 两种走法 ===== -->
  <text x="290" y="482" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">每步二选一：下探 or 横移</text>

  <rect x="40" y="492" width="240" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="160" y="512" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">下探（答案在子树内）</text>
  <text x="160" y="528" text-anchor="middle" font-size="10" fill="#333">cur *= 10，k −= 1</text>
  <text x="160" y="542" text-anchor="middle" font-size="10" fill="#666">走到第一个孩子</text>

  <rect x="300" y="492" width="240" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="420" y="512" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">横移（跳过整棵子树）</text>
  <text x="420" y="528" text-anchor="middle" font-size="10" fill="#333">cur += 1，k −= step</text>
  <text x="420" y="542" text-anchor="middle" font-size="10" fill="#666">走到右兄弟</text>

  <path d="M 280 520 L 300 520" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
</svg>
