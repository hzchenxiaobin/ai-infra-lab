<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">三种操作都从「两端」啃，剩下的永远是连续段</text>

  <!-- 数组格子 [4,2,8,5,7,1,3]，n=7 -->
  <rect x="74" y="52" width="48" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="128" y="52" width="48" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="182" y="52" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="236" y="52" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="290" y="52" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="344" y="52" width="48" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="398" y="52" width="48" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <text x="98" y="74" text-anchor="middle" font-size="13" fill="#7a3230" filter="url(#rough2)">4</text>
  <text x="152" y="74" text-anchor="middle" font-size="13" fill="#7a3230" filter="url(#rough2)">2</text>
  <text x="206" y="74" text-anchor="middle" font-size="13" fill="#2d5a1e" filter="url(#rough2)">8</text>
  <text x="260" y="74" text-anchor="middle" font-size="13" fill="#2d5a1e" filter="url(#rough2)">5</text>
  <text x="314" y="74" text-anchor="middle" font-size="13" fill="#2d5a1e" filter="url(#rough2)">7</text>
  <text x="368" y="74" text-anchor="middle" font-size="13" fill="#7a3230" filter="url(#rough2)">1</text>
  <text x="422" y="74" text-anchor="middle" font-size="13" fill="#7a3230" filter="url(#rough2)">3</text>

  <text x="98" y="99" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="152" y="99" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="206" y="99" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="260" y="99" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="314" y="99" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="368" y="99" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="422" y="99" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>

  <!-- 首尾虚线框 -->
  <rect x="70" y="48" width="56" height="42" rx="6" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <rect x="394" y="48" width="56" height="42" rx="6" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <!-- 三种操作标注 -->
  <text x="100" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">① 删最前两个</text>
  <path d="M 100 116 L 100 103" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="420" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">② 删最后两个</text>
  <path d="M 420 116 L 420 103" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="260" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">③ 删首尾各一个</text>
  <path d="M 215 118 L 132 104" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 305 118 L 388 104" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 中部说明框 -->
  <rect x="75" y="142" width="370" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="159" text-anchor="middle" font-size="12" fill="#6b5a1e" filter="url(#rough2)">每次只动端点 ⇒ 剩余必是连续区间</text>
  <text x="260" y="176" text-anchor="middle" font-size="12" fill="#6b5a1e" filter="url(#rough2)">固定删 ⌊(n−1)/2⌋ 步 ⇒ 剩 1 个（n 奇）或 2 个相邻（n 偶）</text>

  <!-- 左终态框：n 奇 -->
  <rect x="28" y="198" width="224" height="112" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a1e" filter="url(#rough2)">n 奇 → 剩 1 个，位置任选</text>
  <rect x="47" y="234" width="34" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="85" y="234" width="34" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="123" y="234" width="34" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="161" y="234" width="34" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="199" y="234" width="34" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="64" y="251" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="102" y="251" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−1</text>
  <text x="140" y="251" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="178" y="251" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="216" y="251" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <rect x="44" y="231" width="38" height="32" rx="5" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="196" y="231" width="38" height="32" rx="5" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="82" y="231" width="40" height="32" rx="5" fill="none" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="140" y="290" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">留下最小值 mi ⇒ 得分 = s − mi</text>

  <!-- 右终态框：n 偶 -->
  <rect x="268" y="198" width="224" height="112" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">n 偶 → 剩 2 个相邻，位置任选</text>
  <rect x="280" y="234" width="30" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="314" y="234" width="30" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="348" y="234" width="30" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="382" y="234" width="30" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="416" y="234" width="30" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="450" y="234" width="30" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="295" y="251" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="329" y="251" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−1</text>
  <text x="363" y="251" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="397" y="251" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="431" y="251" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <text x="465" y="251" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="277" y="231" width="70" height="32" rx="5" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="413" y="231" width="70" height="32" rx="5" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="311" y="231" width="70" height="32" rx="5" fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="380" y="290" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">留下和最小的相邻对 ⇒ 得分 = s − t</text>

  <!-- 底部公式框 -->
  <rect x="40" y="322" width="440" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="341" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a3230" filter="url(#rough2)">得分 = Σnums − 剩余和 ⇒ 最大化得分 ⟺ 最小化剩余</text>
</svg>
