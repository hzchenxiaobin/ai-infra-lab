<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一遍计数 → 桶内组合数求和</text>

  <!-- Phase 1 label -->
  <text x="40" y="46" font-size="11" fill="#446688" font-weight="bold">阶段一：遍历每张多米诺，归一化计数</text>

  <!-- Start -->
  <ellipse cx="270" cy="74" rx="150" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="78" text-anchor="middle" font-size="12" fill="#333">开始: ans = 0, cnt = {}</text>

  <path d="M 270 92 L 270 102" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 1: more dominoes? -->
  <polygon points="270,104 390,134 270,164 150,134" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="130" text-anchor="middle" font-size="12" fill="#333">还有多米诺</text>
  <text x="270" y="146" text-anchor="middle" font-size="11" fill="#666">dominoes[i] ?</text>

  <!-- Yes -> down -->
  <path d="M 270 164 L 270 180" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="176" font-size="11" fill="#82b366">是</text>

  <!-- Normalize box -->
  <rect x="120" y="184" width="300" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="204" text-anchor="middle" font-size="12" fill="#333">归一化：key = min(a,b)×10 + max(a,b)</text>

  <path d="M 270 214 L 270 226" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Count box -->
  <rect x="170" y="230" width="200" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="249" text-anchor="middle" font-size="12" fill="#333">cnt[key] ++ ，i++</text>

  <!-- loop back LEFT to diamond1 -->
  <path d="M 170 244 L 64 244 L 64 134 L 150 134" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="190" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 48 190)">下一张</text>

  <!-- No -> right then down to phase 2 -->
  <path d="M 390 134 L 432 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="126" text-anchor="middle" font-size="11" fill="#b85450">否</text>

  <!-- Phase 2 label -->
  <text x="40" y="288" font-size="11" fill="#4a7a3a" font-weight="bold">阶段二：遍历每个桶，组合数求和</text>

  <!-- connector from phase1 No down to diamond2 top -->
  <path d="M 432 134 L 432 304 L 270 304" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 2: more buckets? -->
  <polygon points="270,306 390,336 270,366 150,336" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="332" text-anchor="middle" font-size="12" fill="#333">还有桶</text>
  <text x="270" y="348" text-anchor="middle" font-size="11" fill="#666">cnt[key] ?</text>

  <!-- Yes -> down -->
  <path d="M 270 366 L 270 380" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="376" font-size="11" fill="#82b366">是</text>

  <!-- Accumulate box -->
  <rect x="110" y="384" width="320" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="405" text-anchor="middle" font-size="11" fill="#333">c = cnt[key]；ans += c × (c − 1) / 2</text>

  <!-- loop back RIGHT to diamond2 -->
  <path d="M 430 401 L 488 401 L 488 336 L 390 336" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="504" y="370" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 504 370)">下一桶</text>

  <!-- No -> left to end -->
  <path d="M 150 336 L 110 336" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="328" text-anchor="middle" font-size="11" fill="#b85450">否</text>

  <!-- End node -->
  <ellipse cx="62" cy="336" rx="48" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="332" text-anchor="middle" font-size="11" fill="#333">返回</text>
  <text x="62" y="346" text-anchor="middle" font-size="11" fill="#333">ans</text>

  <!-- summary -->
  <text x="270" y="452" text-anchor="middle" font-size="10" fill="#888">阶段一 O(n) + 阶段二 O(81) → 总 O(n)；空间 O(81) = O(1)</text>
</svg>
