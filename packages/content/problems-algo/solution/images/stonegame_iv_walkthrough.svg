  <!-- ===== 说明框 ===== -->
  <rect x="40" y="192" width="648" height="172" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="364" y="212" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">逐格解读</text>
  <text x="56" y="230" font-size="10.5" fill="#333">• n=1：取 1²→0（dp[0]=F）⇒ Alice 胜（示例 1）　　n=4：取 2²→0 ⇒ 一次拿完胜（示例 3）</text>
  <text x="56" y="246" font-size="10.5" fill="#333">• n=2：只能取 1²→1（dp[1]=T）⇒ 对手必胜，Alice 负（示例 2）</text>
  <text x="56" y="262" font-size="10.5" fill="#333">• n=7：可取 1²→6(T)、2²→3(T)，两路对手皆胜 ⇒ Alice 负（示例 4）</text>
  <text x="56" y="278" font-size="10.5" fill="#333">• n=17：可取 1²→16(T)、2²→13(T)、3²→8(T)、4²→1(T)，四路皆胜 ⇒ Alice 负（示例 5）</text>
  <text x="56" y="296" font-size="10.5" fill="#d6a040" font-weight="bold">⚠️ 表面规律：败位 0,2,5,7,10,12,15,17 ≡ 0 或 2 (mod 5)，制胜操作循环 1,1,4 —— 但这是「小样本假象」！</text>
  <text x="56" y="312" font-size="10.5" fill="#b85450" font-weight="bold">　n=25 起 5²=25 进入可选集：Alice 可「一次取完 25」直接胜，败位规则从此被打破（下一个败位是 34 而非 25）。</text>
  <text x="56" y="330" font-size="10.5" fill="#333">　⇒ 平方数集「不规则」，无奇偶/同余不变量，不能像 1025/292 那样化简为 O(1)，必须 DP。</text>
  <text x="56" y="350" font-size="10.5" fill="#446688" font-weight="bold">　教训：博弈题小样本的周期性须验证到大数后再下结论，切忌「归纳过快」。</text>
</svg>
