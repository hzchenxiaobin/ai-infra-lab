  <rect x="292" y="100" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/><text x="310" y="120" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">F</text>
  <rect x="328" y="100" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/><text x="346" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="364" y="100" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/><text x="382" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="400" y="100" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/><text x="418" y="120" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">F</text>
  <rect x="436" y="100" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/><text x="454" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="472" y="100" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/><text x="490" y="120" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">F</text>
  <rect x="508" y="100" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/><text x="526" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="544" y="100" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/><text x="562" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="580" y="100" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/><text x="598" y="120" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">F</text>
  <rect x="616" y="100" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/><text x="634" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="652" y="100" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/><text x="670" y="120" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">F</text>

  <!-- ===== 行 3：制胜 k² ===== -->
  <text x="34" y="168" text-anchor="end" font-size="11" fill="#888" font-weight="bold">制胜 k²</text>
  <g font-size="11.5" fill="#4a7a3a" font-weight="bold">
    <rect x="40"  y="148" width="36" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="58"  y="168" text-anchor="middle" fill="#888">—</text>
    <rect x="76"  y="148" width="36" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="94"  y="168" text-anchor="middle">1</text>
    <rect x="112" y="148" width="36" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="130" y="168" text-anchor="middle" fill="#888">—</text>
    <rect x="148" y="148" width="36" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="166" y="168" text-anchor="middle">1</text>
    <rect x="184" y="148" width="36" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="202" y="168" text-anchor="middle">4</text>
    <rect x="220" y="148" width="36" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="238" y="168" text-anchor="middle" fill="#888">—</text>
    <rect x="256" y="148" width="36" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="274" y="168" text-anchor="middle">1</text>
    <rect x="292" y="148" width="36" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="310" y="168" text-anchor="middle" fill="#888">—</text>
    <rect x="328" y="148" width="36" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="346" y="168" text-anchor="middle">1</text>
    <rect x="364" y="148" width="36" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="382" y="168" text-anchor="middle">4</text>
    <rect x="400" y="148" width="36" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="418" y="168" text-anchor="middle" fill="#888">—</text>
