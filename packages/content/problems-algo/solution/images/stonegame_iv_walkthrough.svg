  <rect x="76"  y="100" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/><text x="94"  y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">T</text>
