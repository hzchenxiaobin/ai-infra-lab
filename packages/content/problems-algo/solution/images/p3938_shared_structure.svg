<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 412" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="412" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：共享格子必落在同一行（或同一列）且连续</text>

  <!-- ===== 网格（示例 1） ===== -->
  <!-- 普通格 -->
  <rect x="170" y="52" width="56" height="42" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="226" y="94" width="56" height="42" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−2</text>
  <rect x="114" y="178" width="56" height="42" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="204" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="170" y="178" width="56" height="42" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="204" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="170" y="220" width="56" height="42" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="246" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <!-- 玩家①独占格（浅红） -->
  <rect x="58" y="52" width="56" height="42" fill="#fce4ec" stroke="#b8b8b8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="86" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="58" y="94" width="56" height="42" fill="#fce4ec" stroke="#b8b8b8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="86" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="58" y="136" width="56" height="42" fill="#fce4ec" stroke="#b8b8b8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="86" y="162" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−4</text>
  <rect x="226" y="178" width="56" height="42" fill="#fce4ec" stroke="#b8b8b8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="204" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−2</text>
  <rect x="226" y="220" width="56" height="42" fill="#fce4ec" stroke="#b8b8b8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="246" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <!-- 玩家②独占格（浅蓝） -->
  <rect x="226" y="52" width="56" height="42" fill="#e8f0fe" stroke="#b8b8b8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−3</text>
  <rect x="226" y="94" width="56" height="42" fill="#e8f0fe" stroke="#b8b8b8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="114" y="178" width="56" height="42" fill="#e8f0fe" stroke="#b8b8b8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="204" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−3</text>
  <rect x="58" y="220" width="56" height="42" fill="#e8f0fe" stroke="#b8b8b8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="86" y="246" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="114" y="220" width="56" height="42" fill="#e8f0fe" stroke="#b8b8b8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="246" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−5</text>

  <!-- 共享格（橙） -->
  <rect x="114" y="136" width="56" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="162" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="170" y="136" width="56" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="162" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="226" y="136" width="56" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="162" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- 路径：先画②（蓝虚线），再画①（红实线），共享段用橙粗线覆盖 -->
  <path d="M 86 241 L 142 241 L 142 157 L 254 157 L 254 73" fill="none" stroke="#446688" stroke-width="3.2" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <path d="M 86 73 L 86 157 L 254 157 L 254 241" fill="none" stroke="#b85450" stroke-width="3.2" filter="url(#rough2)"/>
  <path d="M 142 157 L 254 157" fill="none" stroke="#d6a040" stroke-width="4.2" filter="url(#rough2)"/>

  <!-- 起终点 -->
  <circle cx="86" cy="73" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="254" cy="241" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="86" cy="241" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="254" cy="73" r="4.5" fill="#446688" filter="url(#rough2)"/>

  <!-- 角标 -->
  <text x="58" y="44" font-size="11" fill="#b85450" filter="url(#rough2)">①起 (0,0)</text>
  <text x="282" y="44" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">②终 (0,3)</text>
  <text x="58" y="276" font-size="11" fill="#446688" filter="url(#rough2)">②起 (4,0)</text>
  <text x="282" y="276" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">①终 (4,3)</text>

  <!-- 图例 -->
  <path d="M 58 300 L 88 300" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <text x="94" y="304" font-size="10.5" fill="#444" filter="url(#rough2)">玩家①：只能向右 / 向下</text>
  <path d="M 58 318 L 88 318" stroke="#446688" stroke-width="3" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="94" y="322" font-size="10.5" fill="#444" filter="url(#rough2)">玩家②：只能向右 / 向上</text>
  <rect x="58" y="328" width="20" height="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="94" y="340" font-size="10.5" fill="#444" filter="url(#rough2)">共享格（两人都经过）</text>

  <!-- ===== 右侧引理面板 ===== -->
  <rect x="316" y="52" width="300" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="326" y="72" font-size="12" fill="#2e5a1e" font-weight="bold" filter="url(#rough2)">引理①：不同列 ⟹ 必同行</text>
  <text x="326" y="89" font-size="10.5" fill="#333" filter="url(#rough2)">两人列坐标都不减 ⇒ 访问先后一致：</text>
  <text x="326" y="103" font-size="10.5" fill="#333" filter="url(#rough2)">①行不降给 r ≤ r′，②行不升给 r ≥ r′，</text>
  <text x="326" y="117" font-size="10.5" fill="#333" filter="url(#rough2)">夹出 r = r′；对偶地，行不同 ⟹ 必同列。</text>

  <rect x="316" y="148" width="300" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="326" y="168" font-size="12" fill="#2e5a1e" font-weight="bold" filter="url(#rough2)">引理②：同行 ⟹ 中间无空洞</text>
  <text x="326" y="185" font-size="10.5" fill="#333" filter="url(#rough2)">(r,c₁)、(r,c₃) 都共享时，①的行坐标</text>
  <text x="326" y="199" font-size="10.5" fill="#333" filter="url(#rough2)">被首尾夹逼成常数 r，只能沿行逐格</text>
  <text x="326" y="213" font-size="10.5" fill="#333" filter="url(#rough2)">右移；②同理 ⇒ 中间每格都共享。</text>

  <rect x="316" y="244" width="300" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="326" y="264" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">结论：候选只有三种形态</text>
  <text x="326" y="281" font-size="10.5" fill="#333" filter="url(#rough2)">共享集合 = 某一行（列）上的连续线段：</text>
  <text x="326" y="295" font-size="10.5" fill="#333" filter="url(#rough2)">长度 ≥ 2 可落在任何位置（含边界）；</text>
  <text x="326" y="309" font-size="10.5" fill="#333" filter="url(#rough2)">长度 = 1 时须四邻格都存在 ⟹ 必在内部。</text>

  <!-- 底部小结 -->
  <rect x="58" y="356" width="552" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="334" y="375" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">本例：共享集合 = 行 2 上的连续段 (2,1)(2,2)(2,3)，和 = 2 + (−1) + 3 = 4，即答案。</text>
  <text x="334" y="392" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">它不可能「斜着铺开」或「中间断开」——候选只剩水平 / 垂直连续线段与内部单格。</text>
</svg>
