<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="680" height="500" fill="#fafafa"/>

  <text x="340" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐产品对四列金额求和</text>

  <!-- ===== Column header labels ===== -->
  <text x="120" y="56" font-size="9.5" fill="#888">invoice</text>
  <text x="250" y="56" font-size="9.5" fill="#888">rest</text>
  <text x="320" y="56" font-size="9.5" fill="#888">paid</text>
  <text x="395" y="56" font-size="9.5" fill="#888">canceled</text>
  <text x="475" y="56" font-size="9.5" fill="#888">refunded</text>

  <!-- ===== ham group (pid=0) ===== -->
  <rect x="30" y="64" width="540" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.55"/>
  <text x="50" y="84" font-size="11" fill="#4a7a3a" font-weight="bold">ham（product_id = 0，2 笔发票）</text>

  <!-- invoice rows -->
  <text x="120" y="106" font-size="10" fill="#333">#23</text>
  <text x="250" y="106" font-size="10" fill="#333">2</text>
  <text x="320" y="106" font-size="10" fill="#333">0</text>
  <text x="395" y="106" font-size="10" fill="#333">5</text>
  <text x="475" y="106" font-size="10" fill="#333">0</text>

  <text x="120" y="126" font-size="10" fill="#333">#12</text>
  <text x="250" y="126" font-size="10" fill="#333">0</text>
  <text x="320" y="126" font-size="10" fill="#333">4</text>
  <text x="395" y="126" font-size="10" fill="#333">0</text>
  <text x="475" y="126" font-size="10" fill="#333">3</text>

  <!-- SUM row ham -->
  <rect x="100" y="134" width="320" height="20" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="0.6" rx="3" filter="url(#rough2)" opacity="0.15"/>
  <text x="120" y="150" font-size="10" fill="#4a7a3a" font-weight="bold">SUM</text>
  <text x="250" y="150" font-size="10.5" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="320" y="150" font-size="10.5" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="395" y="150" font-size="10.5" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="475" y="150" font-size="10.5" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- arrow ham -> result -->
  <path d="M300 164 C 300 200, 220 200, 220 330" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" opacity="0.7" stroke-dasharray="5,3"/>

  <!-- ===== bacon group (pid=1) ===== -->
  <rect x="30" y="176" width="540" height="156" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.55"/>
  <text x="50" y="196" font-size="11" fill="#d6a040" font-weight="bold">bacon（product_id = 1，4 笔发票）</text>

  <text x="120" y="218" font-size="10" fill="#333">#1</text>
  <text x="250" y="218" font-size="10" fill="#333">1</text>
  <text x="320" y="218" font-size="10" fill="#333">1</text>
  <text x="395" y="218" font-size="10" fill="#333">0</text>
  <text x="475" y="218" font-size="10" fill="#333">1</text>

  <text x="120" y="238" font-size="10" fill="#333">#2</text>
  <text x="250" y="238" font-size="10" fill="#333">1</text>
  <text x="320" y="238" font-size="10" fill="#333">0</text>
  <text x="395" y="238" font-size="10" fill="#333">1</text>
  <text x="475" y="238" font-size="10" fill="#333">1</text>

  <text x="120" y="258" font-size="10" fill="#333">#3</text>
  <text x="250" y="258" font-size="10" fill="#333">0</text>
  <text x="320" y="258" font-size="10" fill="#333">1</text>
  <text x="395" y="258" font-size="10" fill="#333">1</text>
  <text x="475" y="258" font-size="10" fill="#333">1</text>

  <text x="120" y="278" font-size="10" fill="#333">#4</text>
  <text x="250" y="278" font-size="10" fill="#333">1</text>
  <text x="320" y="278" font-size="10" fill="#333">1</text>
  <text x="395" y="278" font-size="10" fill="#333">1</text>
  <text x="475" y="278" font-size="10" fill="#333">0</text>

  <!-- SUM row bacon -->
  <rect x="100" y="290" width="320" height="22" fill="#d6a040" stroke="#d6a040" stroke-width="0.6" rx="3" filter="url(#rough2)" opacity="0.18"/>
  <text x="120" y="306" font-size="10" fill="#d6a040" font-weight="bold">SUM</text>
  <text x="250" y="306" font-size="10.5" fill="#d6a040" font-weight="bold">3</text>
  <text x="320" y="306" font-size="10.5" fill="#d6a040" font-weight="bold">3</text>
  <text x="395" y="306" font-size="10.5" fill="#d6a040" font-weight="bold">3</text>
  <text x="475" y="306" font-size="10.5" fill="#d6a040" font-weight="bold">3</text>

  <!-- arrow bacon -> result -->
  <path d="M300 316 C 300 326, 460 326, 460 330" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)" opacity="0.8" stroke-dasharray="5,3"/>

  <!-- ===== ORDER BY name box ===== -->
  <rect x="200" y="346" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="340" y="368" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">ORDER BY name（bacon &lt; ham）</text>

  <path d="M340 380 L340 402" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== Final result table ===== -->
  <rect x="140" y="406" width="400" height="74" fill="#fff" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="340" y="422" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">最终结果</text>
  <text x="160" y="440" font-size="9.5" fill="#888" font-weight="bold">name     rest  paid  canc  ref</text>
  <text x="160" y="458" font-size="10.5" fill="#d6a040" font-weight="bold">bacon     3     3     3     3</text>
  <text x="160" y="474" font-size="10.5" fill="#4a7a3a" font-weight="bold">ham       2     4     5     3</text>
</svg>
