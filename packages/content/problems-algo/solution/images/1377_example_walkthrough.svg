<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="440" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1 演算：t=2, target=4，概率沿树逐秒扩散</text>
  <text x="330" y="46" text-anchor="middle" font-size="11" fill="#888">绿=本步有概率，橙=卡住(叶子)停留，红=target 命中，灰=未达</text>

  <!-- ====== Mini tree t=0, center cx=115 ====== -->
  <text x="115" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">t = 0</text>
  <g font-size="10">
    <!-- edges -->
    <line x1="115" y1="90" x2="70" y2="140" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="115" y1="90" x2="115" y2="140" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="115" y1="90" x2="160" y2="140" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="70" y1="150" x2="50" y2="200" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="70" y1="150" x2="90" y2="200" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="115" y1="150" x2="115" y2="200" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <!-- nodes -->
    <circle cx="115" cy="88" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="115" y="92" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <circle cx="70" cy="145" r="11" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="70" y="149" text-anchor="middle" fill="#bbb">2</text>
    <circle cx="115" cy="145" r="11" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="115" y="149" text-anchor="middle" fill="#bbb">3</text>
    <circle cx="160" cy="145" r="11" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="160" y="149" text-anchor="middle" fill="#bbb">7</text>
    <circle cx="50" cy="205" r="10" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="50" y="208" text-anchor="middle" fill="#bbb">4</text>
    <circle cx="90" cy="205" r="10" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="90" y="208" text-anchor="middle" fill="#bbb">6</text>
    <circle cx="115" cy="205" r="10" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="115" y="208" text-anchor="middle" fill="#bbb">5</text>
  </g>
  <rect x="78" y="222" width="74" height="18" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="115" y="235" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">prob[1]=1.0</text>
  <text x="115" y="256" text-anchor="middle" font-size="9" fill="#888">起点 1，cnt=3</text>
  <text x="115" y="270" text-anchor="middle" font-size="9" fill="#888">等分到 {2,3,7}</text>

  <!-- arrow t0 -> t1 -->
  <line x1="195" y1="170" x2="225" y2="170" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="162" text-anchor="middle" font-size="9" fill="#666">÷3</text>

  <!-- ====== Mini tree t=1, center cx=335 ====== -->
  <text x="335" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">t = 1</text>
  <g font-size="10">
    <line x1="335" y1="90" x2="290" y2="140" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="335" y1="90" x2="335" y2="140" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="335" y1="90" x2="380" y2="140" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="290" y1="150" x2="270" y2="200" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="290" y1="150" x2="310" y2="200" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="335" y1="150" x2="335" y2="200" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <!-- node 1 gray (prob moved) -->
    <circle cx="335" cy="88" r="14" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="335" y="92" text-anchor="middle" fill="#bbb">1</text>
    <!-- 2,3 green -->
    <circle cx="290" cy="145" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="290" y="149" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <circle cx="335" cy="145" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="335" y="149" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <!-- 7 orange stuck -->
    <circle cx="380" cy="145" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="380" y="149" text-anchor="middle" fill="#d6a040" font-weight="bold">7</text>
    <circle cx="270" cy="205" r="10" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="270" y="208" text-anchor="middle" fill="#bbb">4</text>
    <circle cx="310" cy="205" r="10" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="310" y="208" text-anchor="middle" fill="#bbb">6</text>
    <circle cx="335" cy="205" r="10" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="335" y="208" text-anchor="middle" fill="#bbb">5</text>
  </g>
  <rect x="282" y="222" width="44" height="18" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="304" y="235" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1/3</text>
  <rect x="327" y="222" width="44" height="18" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="349" y="235" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1/3</text>
  <rect x="360" y="222" width="54" height="18" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="387" y="235" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1/3卡</text>
  <text x="335" y="256" text-anchor="middle" font-size="9" fill="#888">2: cnt=2 →{4,6}</text>
  <text x="335" y="270" text-anchor="middle" font-size="9" fill="#888">3: cnt=1 →{5}；7: cnt=0 停</text>

  <!-- arrow t1 -> t2 -->
  <line x1="415" y1="170" x2="445" y2="170" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="162" text-anchor="middle" font-size="9" fill="#666">÷2/1</text>

  <!-- ====== Mini tree t=2, center cx=555 ====== -->
  <text x="555" y="74" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">t = 2（命中）</text>
  <g font-size="10">
    <line x1="555" y1="90" x2="510" y2="140" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="555" y1="90" x2="555" y2="140" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="555" y1="90" x2="600" y2="140" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="510" y1="150" x2="490" y2="200" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <line x1="510" y1="150" x2="530" y2="200" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="555" y1="150" x2="555" y2="200" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <circle cx="555" cy="88" r="14" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="555" y="92" text-anchor="middle" fill="#bbb">1</text>
    <circle cx="510" cy="145" r="11" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="510" y="149" text-anchor="middle" fill="#bbb">2</text>
    <circle cx="555" cy="145" r="11" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="555" y="149" text-anchor="middle" fill="#bbb">3</text>
    <circle cx="600" cy="145" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="600" y="149" text-anchor="middle" fill="#d6a040" font-weight="bold">7</text>
    <!-- 4 red target -->
    <circle cx="490" cy="205" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
    <text x="490" y="209" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <circle cx="530" cy="205" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="530" y="208" text-anchor="middle" fill="#4a7a3a" font-weight="bold">6</text>
    <circle cx="555" cy="205" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="555" y="208" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
  </g>
  <rect x="468" y="222" width="50" height="20" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="493" y="236" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1/6 ✓</text>
  <rect x="518" y="222" width="40" height="18" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="538" y="235" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1/6</text>
  <rect x="543" y="222" width="40" height="18" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="563" y="235" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1/3</text>
  <rect x="588" y="222" width="44" height="18" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="610" y="235" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1/3卡</text>
  <text x="555" y="256" text-anchor="middle" font-size="9" fill="#888">4 = 1/3×1/2</text>
  <text x="555" y="270" text-anchor="middle" font-size="9" fill="#888">time==t 且 u==target</text>

  <!-- ====== bottom note ====== -->
  <rect x="40" y="296" width="580" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="316" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">概率 = 1/3 × 1/2 = 1/6 ≈ 0.16667</text>
  <text x="330" y="336" text-anchor="middle" font-size="11" fill="#666">节点 7 在 t=1 卡住（叶子），但 7 ≠ target 故不计入</text>
  <text x="330" y="352" text-anchor="middle" font-size="11" fill="#666">节点 4 在 t=2 恰为 target，情形 A 返回 prob=1/6</text>

  <rect x="40" y="372" width="580" height="22" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="330" y="388" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">每秒把概率按 1/cnt 等分给未访问邻居；cnt=0 则概率留在原节点不动</text>
</svg>
