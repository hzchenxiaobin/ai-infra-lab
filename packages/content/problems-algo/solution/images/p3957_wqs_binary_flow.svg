<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">WQS 二分 × 单调队列 DP</text>

  <!-- 框1：二分罚金 -->
  <rect x="185" y="40" width="150" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="13" fill="#33507a" font-weight="bold" filter="url(#rough2)">二分罚金 x</text>
  <text x="260" y="72" text-anchor="middle" font-size="9.5" fill="#667788" filter="url(#rough2)">lo = 0，hi = r·10⁵ + 1</text>

  <path d="M 260 78 L 260 90" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 框2：固定 x 的 DP -->
  <rect x="95" y="94" width="330" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="116" text-anchor="middle" font-size="12.5" fill="#2d4d24" font-weight="bold" filter="url(#rough2)">对固定罚金 x 跑一次 O(n) DP</text>
  <text x="260" y="136" text-anchor="middle" font-size="9.5" fill="#445544" filter="url(#rough2)">dp[i] = max( dp[i−1], P[i] − x + max h(j) )</text>
  <text x="260" y="151" text-anchor="middle" font-size="9.5" fill="#445544" filter="url(#rough2)">h(j) = max(0, dp[j]) − P[j]，j ∈ [i−r, i−l]</text>

  <path d="M 260 158 L 260 170" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形：count(x) ≤ m ? -->
  <polygon points="260,174 354,213 260,252 166,213" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="218" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">count(x) ≤ m ?</text>

  <!-- 是分支 -->
  <text x="140" y="206" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 166 213 L 120 213" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="20" y="197" width="96" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="68" y="217" text-anchor="middle" font-size="12" fill="#2d4d24" font-weight="bold" filter="url(#rough2)">hi = x</text>

  <!-- 否分支 -->
  <text x="382" y="206" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 354 213 L 400 213" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="404" y="197" width="96" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="452" y="217" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">lo = x + 1</text>

  <!-- 回环：继续二分 -->
  <path d="M 68 197 L 68 126 L 91 126" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="76" y="163" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">继续二分</text>
  <path d="M 452 197 L 452 126 L 429 126" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="444" y="163" text-anchor="end" font-size="9.5" fill="#d6a040" filter="url(#rough2)">继续二分</text>

  <!-- 收敛输出 -->
  <path d="M 260 252 L 260 264" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="262" font-size="9.5" fill="#888" filter="url(#rough2)">收敛：x = x*</text>
  <rect x="148" y="268" width="224" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="293" text-anchor="middle" font-size="13" fill="#8f3a35" font-weight="bold" filter="url(#rough2)">ans = g(x*) + x*·m</text>

  <!-- 底注 -->
  <text x="260" y="336" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">count(x)：最优值下的最少段数 —— 等值取段数小，是 WQS 正确性的开关</text>
</svg>
