<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrf" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">countPairs(target)：有序数组双指针计数流程</text>

  <!-- Start -->
  <rect x="160" y="46" width="200" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">left=0, right=n−1, cnt=0</text>

  <!-- arrow down to diamond1 -->
  <path d="M260 86 L260 110" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrf)" filter="url(#rough2)"/>

  <!-- Diamond1: left < right ? -->
  <polygon points="260,112 360,150 260,188 160,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="155" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">left &lt; right ?</text>

  <!-- No -> return cnt -->
  <path d="M360 150 L420 150" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrf)" filter="url(#rough2)"/>
  <text x="384" y="144" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="424" y="132" width="86" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="467" y="156" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return cnt</text>

  <!-- Yes -> down to diamond2 -->
  <path d="M260 188 L260 208" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrf)" filter="url(#rough2)"/>
  <text x="276" y="202" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Diamond2: nums[left]+nums[right] <= target ? -->
  <polygon points="260,210 410,254 260,298 110,254" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="250" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums[left]+nums[right]</text>
  <text x="260" y="266" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">≤ target ?</text>

  <!-- Yes -> left box: cnt += right-left; left++ -->
  <path d="M110 254 L60 254" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrf)" filter="url(#rough2)"/>
  <text x="92" y="248" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="12" y="276" width="100" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="62" y="296" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">cnt +=</text>
  <text x="62" y="310" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">right − left</text>
  <text x="62" y="326" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">left++</text>

  <!-- No: right box (decrement right) -->
  <path d="M410 254 L460 254" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrf)" filter="url(#rough2)"/>
  <text x="436" y="248" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="464" y="276" width="46" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="487" y="310" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">right−−</text>

  <!-- loop back arrows to diamond1 -->
  <path d="M62 276 L62 150 L160 150" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrf)" filter="url(#rough2)"/>
  <path d="M487 276 L487 150 L360 150" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrf)" filter="url(#rough2)"/>
  <text x="62" y="138" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-style="italic">回到判定</text>
</svg>
