<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：两阶段 —— 先建乘积频次表，再按组累加</text>

  <!-- ===== Stage 1: build freq map ===== -->
  <rect x="36" y="48" width="488" height="158" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="52" y="68" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">阶段一：枚举所有 i&lt;j 数对，建 freq 表</text>

  <!-- double loop node -->
  <rect x="56" y="84" width="180" height="50" fill="#fafafa" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="146" y="104" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">双层循环 i &lt; j</text>
  <text x="146" y="120" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">C(n,2) = n(n−1)/2 对</text>

  <!-- arrow -->
  <path d="M 238 109 L 276 109" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- compute product -->
  <rect x="280" y="84" width="120" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="340" y="104" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">p = nums[i]·nums[j]</text>
  <text x="340" y="120" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">乘积最大 10⁸</text>

  <!-- arrow -->
  <path d="M 402 109 L 440 109" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- increment freq -->
  <rect x="444" y="84" width="68" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="478" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">freq[p]++</text>
  <text x="478" y="120" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">哈希 O(1)</text>

  <!-- freq map snapshot -->
  <rect x="56" y="148" width="456" height="48" fill="#fafafa" stroke="#c0d0e8" stroke-width="1.2" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="68" y="166" font-size="10" fill="#888" filter="url(#rough2)">完成后 freq（以 [2,3,4,6] 为例）：</text>
  <text x="68" y="184" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">{6:1, 8:1, 12:2, 18:1, 24:1}</text>
  <text x="300" y="184" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">↑ 仅 c≥2 的组有贡献</text>

  <!-- arrow down between stages -->
  <path d="M 280 208 L 280 226" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Stage 2: sum contributions ===== -->
  <rect x="36" y="230" width="488" height="158" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="52" y="250" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">阶段二：遍历 freq，每组累加 4·c·(c−1)</text>

  <!-- iterate node -->
  <rect x="56" y="266" width="160" height="50" fill="#fafafa" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="136" y="286" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">遍历 freq 每项 (p, c)</text>
  <text x="136" y="302" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">c = freq[p]</text>

  <!-- arrow -->
  <path d="M 218 291 L 256 291" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="320,266 384,291 320,316 256,291" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="288" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">c ≥ 2 ?</text>
  <text x="320" y="302" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">否 ⇒ 跳过</text>

  <!-- arrow yes -->
  <path d="M 384 291 L 422 291" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="392" y="284" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- accumulate -->
  <rect x="426" y="266" width="86" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="469" y="286" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans +=</text>
  <text x="469" y="302" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4·c·(c−1)</text>

  <!-- worked line -->
  <rect x="56" y="330" width="456" height="48" fill="#fafafa" stroke="#e8c8c0" stroke-width="1.2" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="68" y="348" font-size="10" fill="#888" filter="url(#rough2)">示例演算（[2,3,4,6]）：</text>
  <text x="68" y="366" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">p=12, c=2 ⇒ ans += 4·2·1 = 8；其余 c=1 跳过 ⇒ ans = 8</text>

  <!-- footer -->
  <text x="280" y="410" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">两阶段都线性扫描数对集合，整体 O(n²) 时间 / O(n²) 空间</text>
  <text x="280" y="428" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">n ≤ 1000 ⇒ 数对至多约 5×10⁵，哈希表轻松承载</text>
  <text x="280" y="446" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">注：元素互异保证同积两对必不相交，无需额外去重</text>
</svg>
