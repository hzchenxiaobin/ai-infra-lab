<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b5" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">半串决定一切：升序半串 + 中心 + 镜像</text>

  <!-- Row A: 原串 babab -->
  <text x="72" y="88" text-anchor="end" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">s =</text>

  <rect x="84" y="64" width="42" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">b</text>

  <rect x="130" y="64" width="42" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="151" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">a</text>

  <rect x="176" y="64" width="42" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="197" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">b</text>

  <rect x="222" y="64" width="42" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="243" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">a</text>

  <rect x="268" y="64" width="42" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="289" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">b</text>

  <path d="M 105 62 C 105 38, 289 38, 289 62" fill="none" stroke="#9aa7b5" stroke-width="1.6" marker-start="url(#arrs)" marker-end="url(#arrs)" filter="url(#rough2)"/>
  <path d="M 151 62 C 151 44, 243 44, 243 62" fill="none" stroke="#9aa7b5" stroke-width="1.6" marker-start="url(#arrs)" marker-end="url(#arrs)" filter="url(#rough2)"/>

  <text x="260" y="122" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">对称位置两两配对（弧线）⇒ 计数全为偶数；红格是中心字符，计数为奇</text>

  <!-- Row B: 计数 → 半串 -->
  <text x="84" y="137" font-size="9.5" fill="#888" filter="url(#rough2)">计数</text>

  <rect x="84" y="142" width="58" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="113" y="161" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">a × 2</text>

  <rect x="150" y="142" width="58" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="179" y="161" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">b × 3</text>

  <path d="M 216 157 L 244 157" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="252" y="142" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="272" y="161" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">a</text>

  <rect x="294" y="142" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="314" y="161" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">b</text>

  <text x="293" y="137" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">半串 half = 每种取一半（升序）</text>

  <text x="196" y="190" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">b 计数为奇 ⇒ 挤出 1 个当中心 mid = b</text>

  <!-- Row C: 结果 abbba -->
  <text x="72" y="244" text-anchor="end" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">ans =</text>

  <rect x="84" y="220" width="42" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="105" y="244" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">a</text>

  <rect x="130" y="220" width="42" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="151" y="244" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">b</text>

  <rect x="176" y="220" width="42" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="197" y="244" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">b</text>

  <rect x="222" y="220" width="42" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="243" y="244" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">b</text>

  <rect x="268" y="220" width="42" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="289" y="244" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">a</text>

  <text x="128" y="276" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">半串</text>
  <text x="197" y="276" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">中心</text>
  <text x="272" y="276" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">镜像 rev(half)</text>

  <!-- 结论 -->
  <rect x="70" y="292" width="380" height="54" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">整串字典序 ⇔ 半串字典序：半串升序即最优</text>
  <text x="260" y="336" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">中心由唯一的奇数计数强制决定，无选择余地</text>
</svg>
