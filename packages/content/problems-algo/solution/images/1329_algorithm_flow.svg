<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="520" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：分组 → 排序 → 写回（两趟扫描）</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">用哈希表 diag[i−j] 收集同对角线元素，排序后按原顺序写回</text>

  <!-- step 1 -->
  <rect x="80" y="58" width="380" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 第一趟：收集</text>
  <text x="270" y="98" text-anchor="middle" font-size="11" fill="#333">for i,j：diag[i − j].push(mat[i][j])</text>
  <text x="270" y="112" text-anchor="middle" font-size="9" fill="#888">O(m·n)，每格 O(1) 入桶</text>
  <path d="M 270 118 L 270 138" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- mini map illustration -->
  <g font-size="10">
    <rect x="150" y="142" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="174" y="159" text-anchor="middle" fill="#333">k=0</text>
    <rect x="210" y="142" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="234" y="159" text-anchor="middle" fill="#333">k=−1</text>
    <rect x="270" y="142" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="294" y="159" text-anchor="middle" fill="#333">k=−2</text>
    <rect x="330" y="142" width="48" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="354" y="159" text-anchor="middle" fill="#333">…</text>
  </g>
  <text x="270" y="184" text-anchor="middle" font-size="9" fill="#888">哈希表：每个 key 对应一条对角线的元素列表</text>
  <path d="M 270 190 L 270 210" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="80" y="212" width="380" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② 组内排序（降序，尾部最小）</text>
  <text x="270" y="252" text-anchor="middle" font-size="11" fill="#333">for each key k：sort(diag[k], 降序)</text>
  <text x="270" y="266" text-anchor="middle" font-size="9" fill="#888">单条 O(L log L)，L ≤ min(m,n)；总计 O(m·n log min(m,n))</text>
  <path d="M 270 272 L 270 292" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- sorted buckets illustration -->
  <g font-size="10">
    <rect x="150" y="296" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="174" y="313" text-anchor="middle" fill="#333">3·2·1</text>
    <rect x="210" y="296" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="234" y="313" text-anchor="middle" fill="#333">3·2·1</text>
    <rect x="270" y="296" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="294" y="313" text-anchor="middle" fill="#333">2·1</text>
    <rect x="330" y="296" width="48" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="354" y="313" text-anchor="middle" fill="#333">…</text>
  </g>
  <text x="270" y="338" text-anchor="middle" font-size="9" fill="#888">每条对角线已升序就位（从尾部取即最小）</text>
  <path d="M 270 344 L 270 364" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="80" y="366" width="380" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="388" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③ 第二趟：写回</text>
  <text x="270" y="406" text-anchor="middle" font-size="11" fill="#333">for i,j：mat[i][j] = diag[i−j].back(); pop_back()</text>
  <text x="270" y="420" text-anchor="middle" font-size="9" fill="#888">按 i 升序遍历 → 同对角线先到先取最小，天然升序</text>
  <path d="M 270 426 L 270 446" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="150" y="448" width="240" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="270" y="471" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">④ return mat</text>

  <text x="270" y="504" text-anchor="middle" font-size="10" fill="#888">两趟扫描 + 哈希分组，无需显式枚举对角线起点</text>
</svg>
