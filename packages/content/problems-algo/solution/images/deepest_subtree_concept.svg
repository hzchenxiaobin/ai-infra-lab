<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">最深节点的最小子树 = 所有最深节点的 LCA</text>

  <!-- 树节点 -->
  <!-- 根 3 -->
  <circle cx="280" cy="70" r="20" fill="#fff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="75" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <!-- 5 和 1 (depth 1) -->
  <line x1="280" y1="90" x2="190" y2="135" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="280" y1="90" x2="370" y2="135" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="190" cy="150" r="20" fill="#fff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="155" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <circle cx="370" cy="150" r="20" fill="#fff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="155" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <!-- depth 2: 6, 2, 0, 8 -->
  <line x1="190" y1="170" x2="135" y2="215" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="190" y1="170" x2="245" y2="215" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="370" y1="170" x2="315" y2="215" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="370" y1="170" x2="425" y2="215" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <circle cx="135" cy="230" r="20" fill="#fff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="135" y="235" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>

  <!-- 2: 答案节点，黄色高亮 -->
  <circle cx="245" cy="230" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="245" y="235" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>

  <circle cx="315" cy="230" r="20" fill="#fff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="315" y="235" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <circle cx="425" cy="230" r="20" fill="#fff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="425" y="235" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>

  <!-- depth 3: 7 和 4 (最深节点，蓝色) -->
  <line x1="245" y1="252" x2="210" y2="290" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="245" y1="252" x2="280" y2="290" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="210" cy="305" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="210" y="310" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <circle cx="280" cy="305" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>

  <!-- 深度标尺 -->
  <text x="40" y="75" font-size="12" fill="#888" filter="url(#rough2)">d=0</text>
  <text x="40" y="155" font-size="12" fill="#888" filter="url(#rough2)">d=1</text>
  <text x="40" y="235" font-size="12" fill="#888" filter="url(#rough2)">d=2</text>
  <text x="40" y="310" font-size="12" fill="#888" filter="url(#rough2)">d=3</text>

  <!-- 图例 -->
  <rect x="390" y="300" width="160" height="62" rx="8" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="408" cy="316" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="422" y="320" font-size="11" fill="#333" filter="url(#rough2)">最深节点 (7,4)</text>
  <circle cx="408" cy="338" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="422" y="342" font-size="11" fill="#333" filter="url(#rough2)">答案 = LCA(7,4) = 2</text>

  <!-- 箭头从答案框指向说明 -->
  <path d="M390,335 Q330,335 270,250" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
