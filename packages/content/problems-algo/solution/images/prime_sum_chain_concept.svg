<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：质因数之和 ≤ n，序列单调不增 → 只在「质数」和「4」停住</text>

  <!-- Left descending chain: 15 -> 8 -> 6 -> 5 -->
  <!-- 15 -->
  <rect x="70" y="56" width="64" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="80" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">15</text>
  <path d="M 102 94 L 102 120" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 8 -->
  <rect x="70" y="120" width="64" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="144" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">8</text>
  <path d="M 102 158 L 102 184" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 6 -->
  <rect x="70" y="184" width="64" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="208" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">6</text>
  <path d="M 102 222 L 102 248" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 5 prime fixed point -->
  <rect x="70" y="248" width="64" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="102" y="272" text-anchor="middle" font-size="15" fill="#2f5d20" font-weight="bold">5</text>

  <!-- Factorization annotations to the right of each box -->
  <text x="150" y="80" font-size="12" fill="#333"><tspan font-weight="bold" fill="#446688">15</tspan> = 3 × 5  →  3 + 5 = 8</text>
  <text x="150" y="144" font-size="12" fill="#333"><tspan font-weight="bold" fill="#446688">8</tspan> = 2 · 2 · 2  →  2+2+2 = 6</text>
  <text x="150" y="208" font-size="12" fill="#333"><tspan font-weight="bold" fill="#446688">6</tspan> = 2 × 3  →  2 + 3 = 5</text>
  <text x="150" y="272" font-size="12" fill="#2f5d20" font-weight="bold">5 是质数 → 替换后仍为 5（不动）</text>

  <!-- Right special case: n = 4 -->
  <rect x="370" y="110" width="210" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="475" y="138" text-anchor="middle" font-size="13" fill="#b07820" font-weight="bold">⚠ 唯一的合数不动点</text>
  <text x="475" y="170" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">n = 4</text>
  <text x="475" y="196" text-anchor="middle" font-size="12" fill="#333">4 = 2 × 2</text>
  <text x="475" y="218" text-anchor="middle" font-size="12" fill="#333">和 = 2 + 2 = 4 = n</text>
  <text x="475" y="244" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">→ 替换后不变，停住</text>

  <!-- Bottom monotonicity note -->
  <rect x="30" y="290" width="540" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="313" text-anchor="middle" font-size="12" fill="#333">为什么单调不增？<tspan font-weight="bold">a + b ≤ a · b</tspan>（a, b ≥ 2），等号仅当 a = b = 2（即 n = 4）</text>
  <text x="300" y="329" text-anchor="middle" font-size="11" fill="#666">→ 合数里只有 4 不缩；其余合数严格缩小，质数保持自身。故序列必终止。</text>
</svg>
