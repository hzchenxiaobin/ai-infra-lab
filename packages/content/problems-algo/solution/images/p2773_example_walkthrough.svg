<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">示例 1：root = [1,2,3,null,null,4,5]</text>

  <!-- 树边 -->
  <line x1="248" y1="82" x2="158" y2="142" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="272" y1="82" x2="362" y2="142" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="358" y1="162" x2="308" y2="222" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="382" y1="162" x2="422" y2="222" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 节点 1：内部，order⑤ -->
  <circle cx="260" cy="70" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="76" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">1</text>
  <circle cx="236" cy="54" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="236" y="58" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">5</text>
  <text x="290" y="76" font-size="12" fill="#446688" filter="url(#rough2)">h=3</text>

  <!-- 节点 2：叶子，order① -->
  <circle cx="150" cy="150" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="150" y="156" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">2</text>
  <path d="M134,160 C104,176 104,128 132,144" stroke="#d6a040" stroke-width="1.8"
        marker-end="url(#arrO)" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <circle cx="126" cy="134" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="126" y="138" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="96" y="156" font-size="12" fill="#b85450" filter="url(#rough2)">h=1</text>

  <!-- 节点 3：内部，order④ -->
  <circle cx="370" cy="150" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="370" y="156" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">3</text>
  <circle cx="346" cy="134" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="346" y="138" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">4</text>
  <text x="398" y="156" font-size="12" fill="#446688" filter="url(#rough2)">h=2</text>

  <!-- 节点 4：叶子，order② -->
  <circle cx="300" cy="230" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="300" y="236" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">4</text>
  <path d="M284,240 C254,256 254,208 282,224" stroke="#d6a040" stroke-width="1.8"
        marker-end="url(#arrO)" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <circle cx="276" cy="214" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="276" y="218" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="252" y="236" font-size="12" fill="#b85450" filter="url(#rough2)">h=1</text>

  <!-- 节点 5：叶子，order③ -->
  <circle cx="430" cy="230" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="430" y="236" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">5</text>
  <path d="M414,240 C384,256 384,208 412,224" stroke="#d6a040" stroke-width="1.8"
        marker-end="url(#arrO)" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <circle cx="406" cy="214" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="406" y="218" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">3</text>
  <text x="458" y="236" font-size="12" fill="#b85450" filter="url(#rough2)">h=1</text>

  <!-- 图例 -->
  <text x="40" y="288" font-size="11" fill="#888888" filter="url(#rough2)">橙圈=后序序号　橙虚弧=叶子回指标记</text>

  <!-- 结论框 -->
  <rect x="50" y="300" width="420" height="46" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">后序累加：h(1) = 1 + max(h(2)=1, h(3)=2) = 3</text>
  <text x="260" y="340" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">答案 = 3 ✓</text>
</svg>
