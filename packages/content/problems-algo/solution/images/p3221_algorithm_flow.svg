<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：从右往左一趟（ans 记得用 long long）</text>

  <ellipse cx="170" cy="52" rx="36" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="57" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 170 67 L 170 76" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="76" y="80" width="188" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="100" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans ← 0（long long）；mx ← 0；i ← n−1</text>

  <path d="M 170 110 L 170 120" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="170,124 242,152 170,180 98,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="157" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">i ≥ 1 ?</text>

  <text x="258" y="144" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 242 152 L 356 152" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <ellipse cx="412" cy="152" rx="56" ry="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="412" y="157" text-anchor="middle" font-size="11.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">返回 ans（64 位）</text>

  <text x="180" y="198" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 170 180 L 170 194" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="198" width="220" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="218" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">mx ← max(mx, nums[i])</text>

  <path d="M 170 228 L 170 238" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="242" width="240" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="262" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans ← ans + mx（段 [i−1,i] 贡献）</text>

  <path d="M 170 272 L 170 282" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="286" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="305" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">i ← i − 1</text>

  <path d="M 100 300 L 44 300 L 44 152 L 94 152" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="38" y="230" font-size="10" fill="#888" filter="url(#rough2)" transform="rotate(-90 38 230)">回到循环判断</text>

  <!-- 旁注 1：不变式 -->
  <rect x="322" y="198" width="180" height="74" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="412" y="220" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">循环不变式</text>
  <text x="412" y="239" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">mx = max(nums[i..n−1])</text>
  <text x="412" y="256" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">ans = Σ max(nums[t..n−1])</text>
  <text x="412" y="271" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">（t = i..n−1 已入账）</text>

  <!-- 旁注 2：本题两个坑 -->
  <rect x="322" y="284" width="180" height="82" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="412" y="306" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">本题两个坑</text>
  <text x="412" y="324" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">① ans 上界 ≈ 10¹⁰ 超 int32</text>
  <text x="412" y="340" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">必须声明为 long long</text>
  <text x="412" y="358" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">② 循环从 n−1 倒序到 1，</text>
  <text x="412" y="362" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">下标 0 只是起点不计费</text>

  <text x="260" y="386" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">时间 O(n)，空间 O(1)：n = 10⁵ 毫秒级稳过</text>
</svg>
