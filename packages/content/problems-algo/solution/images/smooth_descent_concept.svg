<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">平滑下降：每日股价恰好比前一日少 1</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">相邻差 prices[i] − prices[i−1] = −1，即 prices[i] = prices[i−1] − 1</text>

  <!-- ===== Array row: boxes 60 wide, 20 gap, start x=80 ===== -->
  <text x="30" y="92" font-size="11" fill="#446688" font-weight="bold">prices = [3, 2, 1, 4]</text>
  <g font-size="12">
    <rect x="80" y="100" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="110" y="122" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <text x="110" y="94" text-anchor="middle" font-size="9" fill="#888">i=0</text>

    <rect x="160" y="100" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="190" y="122" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <text x="190" y="94" text-anchor="middle" font-size="9" fill="#888">i=1</text>

    <rect x="240" y="100" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="270" y="122" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="270" y="94" text-anchor="middle" font-size="9" fill="#888">i=2</text>

    <rect x="320" y="100" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="350" y="122" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <text x="350" y="94" text-anchor="middle" font-size="9" fill="#888">i=3</text>
  </g>

  <!-- ===== diff arrows (gap midpoints: 150, 230, 310) ===== -->
  <g font-size="10">
    <path d="M 142 117 L 158 117" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="150" y="158" text-anchor="middle" fill="#4a7a3a" font-weight="bold">−1 ✓</text>

    <path d="M 222 117 L 238 117" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="230" y="158" text-anchor="middle" fill="#4a7a3a" font-weight="bold">−1 ✓</text>

    <path d="M 302 117 L 318 117" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="310" y="158" text-anchor="middle" fill="#b85450" font-weight="bold">+3 ✗</text>
  </g>

  <!-- ===== Maximal smooth segments ===== -->
  <text x="30" y="200" font-size="11" fill="#b85450" font-weight="bold">极大平滑段（被不合法相邻对切断）</text>
  <g font-size="10">
    <rect x="76" y="210" width="228" height="40" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
    <text x="190" y="235" text-anchor="middle" fill="#b85450" font-weight="bold">[3, 2, 1]  长度 m=3</text>

    <rect x="316" y="210" width="68" height="40" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
    <text x="350" y="235" text-anchor="middle" fill="#b85450" font-weight="bold">[4]  m=1</text>
  </g>

  <!-- ===== Formula ===== -->
  <rect x="30" y="270" width="500" height="44" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="6" filter="url(#rough2)"/>
  <text x="40" y="288" font-size="10" fill="#555">长度为 m 的极大平滑段内含 m·(m+1)/2 个平滑子数组（每个连续子段都满足条件）</text>
  <text x="40" y="304" font-size="10" fill="#555">合法子数组计数 ⇔ 对每个极大段求组合数后求和（等价于 DP：dp[i]=dp[i−1]+1 或 1）</text>

  <!-- ===== Result ===== -->
  <rect x="80" y="328" width="320" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="240" y="352" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">总数 = 3·4/2 + 1·2/2 = 6 + 1 = 7</text>
</svg>
