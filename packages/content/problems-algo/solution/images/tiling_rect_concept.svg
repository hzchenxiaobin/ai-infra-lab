<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心策略：填最左上空格 → 从大到小试正方形</text>

  <!-- Left grid: empty 5×8 -->
  <text x="122" y="54" text-anchor="middle" font-size="11" fill="#888">5 × 8 矩形（空）</text>
  <path d="M50,62 L194,62 M50,80 L194,80 M50,98 L194,98 M50,116 L194,116 M50,134 L194,134 M50,152 L194,152 M50,62 L50,152 M68,62 L68,152 M86,62 L86,152 M104,62 L104,152 M122,62 L122,152 M140,62 L140,152 M158,62 L158,152 M176,62 L176,152 M194,62 L194,152" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <rect x="50" y="62" width="144" height="90" fill="none" stroke="#446688" stroke-width="2" rx="2" filter="url(#rough2)"/>

  <!-- highlight cell (0,0) -->
  <rect x="50" y="62" width="18" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="2" filter="url(#rough2)"/>
  <text x="59" y="76" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">★</text>
  <text x="122" y="174" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">① 找最左上空格 (r,c)</text>

  <!-- arrow between grids -->
  <path d="M 200 107 L 324 107" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="262" y="100" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">放置 5×5</text>

  <!-- Right grid: 5×5 placed -->
  <text x="402" y="54" text-anchor="middle" font-size="11" fill="#888">5 × 8（已放 5×5）</text>
  <path d="M330,62 L474,62 M330,80 L474,80 M330,98 L474,98 M330,116 L474,116 M330,134 L474,134 M330,152 L474,152 M330,62 L330,152 M348,62 L348,152 M366,62 L366,152 M384,62 L384,152 M402,62 L402,152 M420,62 L420,152 M438,62 L438,152 M456,62 L456,152 M474,62 L474,152" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <rect x="330" y="62" width="144" height="90" fill="none" stroke="#446688" stroke-width="2" rx="2" filter="url(#rough2)"/>

  <!-- 5×5 block -->
  <rect x="330" y="62" width="90" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="375" y="110" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">5×5</text>

  <!-- highlight next empty cell (0,5) -->
  <rect x="420" y="62" width="18" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="2" filter="url(#rough2)"/>
  <text x="429" y="76" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">★</text>
  <text x="402" y="174" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">② 递归：下一空格</text>

  <!-- Divider -->
  <path d="M 40 195 L 520 195" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Size choices -->
  <text x="280" y="216" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">从大到小尝试（大的优先 → 尽快得较优解 → 启用剪枝）</text>

  <rect x="100" y="228" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="130" y="247" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5×5</text>

  <rect x="172" y="228" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="202" y="247" text-anchor="middle" font-size="11" fill="#446688">4×4</text>

  <rect x="244" y="228" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="274" y="247" text-anchor="middle" font-size="11" fill="#4a7a3a">3×3</text>

  <rect x="316" y="228" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="346" y="247" text-anchor="middle" font-size="11" fill="#d6a040">2×2</text>

  <rect x="388" y="228" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="418" y="247" text-anchor="middle" font-size="11" fill="#b85450">1×1</text>

  <!-- Pruning box -->
  <rect x="110" y="272" width="340" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">剪枝：count ≥ best → 直接返回（当前已不优）</text>

  <!-- Greedy warning -->
  <text x="280" y="324" text-anchor="middle" font-size="11" fill="#b85450">⚠ 贪心（总选最大）不一定最优：11×13 贪心 = 7，回溯 = 6</text>
</svg>
