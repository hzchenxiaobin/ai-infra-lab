<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">找到数组的中间位置：算法流程</text>

  <!-- Step 1: total = sum(nums) -->
  <rect x="200" y="46" width="160" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="12" fill="#333">① total = sum(nums)</text>
  <line x1="280" y1="84" x2="280" y2="104" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: init leftSum = 0, i = 0 -->
  <rect x="200" y="104" width="160" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="12" fill="#333">② leftSum = 0, i = 0</text>
  <line x1="280" y1="142" x2="280" y2="162" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: i < n ? -->
  <polygon points="280,162 360,202 280,242 200,202" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="198" text-anchor="middle" font-size="11" fill="#333">i &lt; n ?</text>
  <text x="280" y="214" text-anchor="middle" font-size="10" fill="#888">(遍历完？)</text>

  <!-- No branch: return -1 -->
  <line x1="360" y1="202" x2="420" y2="202" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="194" font-size="10" fill="#b85450" font-weight="bold">No</text>
  <rect x="420" y="184" width="100" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="470" y="208" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return -1</text>

  <!-- Yes branch: down to decision 2 -->
  <line x1="280" y1="242" x2="280" y2="262" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="256" font-size="10" fill="#4a7a3a" font-weight="bold">Yes</text>

  <!-- Decision: 2*leftSum + nums[i] == total ? -->
  <polygon points="280,262 380,302 280,342 180,302" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="10" fill="#333">2×leftSum + nums[i]</text>
  <text x="280" y="312" text-anchor="middle" font-size="10" fill="#333">== total ?</text>
  <text x="280" y="326" text-anchor="middle" font-size="9" fill="#888">(命中中间位置？)</text>

  <!-- Yes: return i -->
  <line x1="180" y1="302" x2="120" y2="302" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="294" font-size="10" fill="#4a7a3a" font-weight="bold">Yes</text>
  <rect x="20" y="284" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="70" y="308" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return i</text>

  <!-- No: leftSum += nums[i]; i++ ; loop back -->
  <line x1="380" y1="302" x2="440" y2="302" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="294" font-size="10" fill="#b85450" font-weight="bold">No</text>
  <rect x="440" y="284" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="490" y="302" text-anchor="middle" font-size="10" fill="#333">leftSum += nums[i]</text>
  <text x="490" y="314" text-anchor="middle" font-size="10" fill="#333">i++</text>

  <!-- loop back arrow from No-branch box up to decision i<n -->
  <path d="M 490 284 q 0 -40 -110 -40 q -100 0 -100 0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>

  <!-- Notes -->
  <rect x="24" y="362" width="512" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="382" font-size="11" fill="#555">要点：</text>
  <text x="78" y="382" font-size="11" fill="#b85450" font-weight="bold">① 判等在累加之前</text>
  <text x="232" y="382" font-size="11" fill="#555">（leftSum 是 nums[i] 左侧的和）</text>
  <text x="40" y="398" font-size="11" fill="#4a7a3a" font-weight="bold">② +nums[i] 不可漏</text>
  <text x="160" y="398" font-size="11" fill="#555">（中心元素本身从 total 扣除的那一份）</text>
</svg>
