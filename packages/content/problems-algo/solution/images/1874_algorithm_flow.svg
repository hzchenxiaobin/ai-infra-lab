<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：排序 + 逆序配对求和</text>

  <!-- Step 1: sort nums1 ascending -->
  <rect x="130" y="44" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 将 nums1 升序排序</text>
  <text x="260" y="78" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">sort(nums1)   // 升序</text>
  <path d="M 260 84 L 260 100" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: sort nums2 descending -->
  <rect x="130" y="100" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 将 nums2 降序排序</text>
  <text x="260" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">sort(nums2, reverse)   // 降序</text>
  <path d="M 260 140 L 260 156" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: loop and accumulate -->
  <rect x="110" y="156" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 逐位相乘累加</text>
  <text x="260" y="192" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">ans = Σ nums1[i] × nums2[i]</text>
  <path d="M 260 200 L 260 216" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop detail box -->
  <rect x="80" y="216" width="360" height="56" fill="#fafafa" stroke="#999" stroke-width="1" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="260" y="234" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">for i = 0 to n−1:</text>
  <text x="260" y="250" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">    ans += nums1[i] * nums2[i]</text>
  <text x="260" y="266" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">// nums1[i] 小 → 配 nums2[i] 大（逆序配对）</text>
  <path d="M 260 272 L 260 288" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: return ans -->
  <rect x="150" y="288" width="220" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">④ return ans</text>

  <!-- complexity note -->
  <rect x="80" y="338" width="360" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">复杂度：O(n log n) / O(log n)</text>
  <text x="260" y="376" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">两次排序主导；值域有界时可计数排序到 O(n)</text>
</svg>
