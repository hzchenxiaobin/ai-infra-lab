<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心直觉：遍历到 x 时，能配对的值只有 x+k 与 x−k</text>

  <!-- Array row -->
  <text x="30" y="70" font-size="12" fill="#888">nums =</text>
  <rect x="80" y="54" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="130" y="54" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="180" y="54" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="204" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="204" y="100" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">当前 x=1</text>
  <rect x="230" y="54" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="280" y="54" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="304" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <!-- k annotation -->
  <rect x="380" y="54" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="435" y="75" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">k = 2</text>

  <!-- complement -->
  <text x="30" y="140" font-size="12" fill="#444" font-weight="bold">当前 x=1，可配对的值：</text>
  <rect x="230" y="128" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="265" y="146" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">x+k = 3</text>
  <rect x="330" y="128" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="365" y="146" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">x−k = −1</text>

  <!-- HashMap -->
  <text x="30" y="190" font-size="12" fill="#888">频次表 cnt（只统计当前 x 之前出现过的数）：</text>
  <rect x="80" y="200" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="218" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">值</text>
  <text x="195" y="218" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">次数</text>
  <line x1="155" y1="200" x2="155" y2="226" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="80" y="228" width="150" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="115" y="244" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="195" y="244" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="80" y="254" width="150" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="115" y="270" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="195" y="270" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- query arrow -->
  <text x="300" y="236" font-size="12" fill="#b85450" font-weight="bold">查 cnt[3] = 1</text>
  <path d="M 300 242 L 235 242" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="300" y="262" font-size="11" fill="#4a7a3a" font-weight="bold">→ 累加 1 对 ⭐</text>

  <!-- key insight box -->
  <rect x="60" y="300" width="480" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="324" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">关键：边查边加，i&lt;j 天然成立</text>
  <text x="300" y="346" text-anchor="middle" font-size="11" fill="#555">遍历到 x 时，表里只有「下标更早」的元素，</text>
  <text x="300" y="364" text-anchor="middle" font-size="11" fill="#555">查 cnt[x+k] + cnt[x−k] 即得到所有 (j=当前, i=更早) 的配对数</text>
</svg>
