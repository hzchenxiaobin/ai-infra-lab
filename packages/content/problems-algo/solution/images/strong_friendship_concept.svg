<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：共同好友 = friends(x) ∩ friends(y)</text>

  <!-- Pair indicator -->
  <rect x="160" y="50" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="73" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">评估好友对 (1, 2) — 二人是好友</text>

  <!-- Venn: left ellipse friends(1) -->
  <ellipse cx="200" cy="215" rx="140" ry="95" fill="#e8f0fe" fill-opacity="0.45" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="135" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">friends(1)</text>

  <!-- Venn: right ellipse friends(2) -->
  <ellipse cx="380" cy="215" rx="140" ry="95" fill="#e6f4ea" fill-opacity="0.45" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="135" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">friends(2)</text>

  <!-- Left-only friend nodes: 2, 7 -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <circle cx="120" cy="200" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="120" y="204">2</text>
    <circle cx="120" cy="245" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="120" y="249">7</text>
  </g>

  <!-- Right-only friend node: 1 -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <circle cx="460" cy="222" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="460" y="226">1</text>
  </g>

  <!-- Intersection friend nodes: 3,4,5,6 -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <circle cx="265" cy="195" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="265" y="199">3</text>
    <circle cx="315" cy="195" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="315" y="199">4</text>
    <circle cx="265" cy="240" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="265" y="244">5</text>
    <circle cx="315" cy="240" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="315" y="244">6</text>
  </g>

  <!-- intersection label -->
  <text x="290" y="285" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">共同好友 = {3,4,5,6}</text>

  <!-- Threshold box -->
  <rect x="70" y="328" width="420" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">判定公式</text>
  <text x="280" y="366" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">|friends(x) ∩ friends(y)| ≥ 3  →  坚定的友谊 ✓</text>

  <!-- Notes -->
  <text x="40" y="396" font-size="11" fill="#555">• 好友关系无向，但表中 user1_id &lt; user2_id 为有向存储 → 需 UNION ALL 展开双向</text>
  <text x="40" y="414" font-size="11" fill="#555">• 1∈friends(2)、2∈friends(1)，但都不在交集中 → 配对双方自然被排除</text>
  <text x="40" y="432" font-size="11" fill="#555">• 交集 = 4 ≥ 3 → (1,2) 坚定；本例最终输出 (1,2,4) 与 (1,3,3)</text>
</svg>
