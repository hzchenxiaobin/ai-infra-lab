<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">后序 DFS 决策流程：处理孩子 → 判叶 → 判值</text>

  <!-- Start -->
  <rect x="215" y="40" width="110" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">dfs(node)</text>

  <!-- arrow start -> D1 -->
  <path d="M 270 70 L 270 86" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- D1: node == null? -->
  <polygon points="270,88 350,116 270,144 190,116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="120" text-anchor="middle" font-size="11" fill="#444">node == null?</text>

  <!-- D1 yes -> return null (top right) -->
  <path d="M 350 116 L 398 116" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="372" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="400" y="100" width="110" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="455" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return null</text>

  <!-- D1 no -> R_left -->
  <path d="M 270 144 L 270 162" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="282" y="156" font-size="10" fill="#b85450">否</text>

  <!-- R_left -->
  <rect x="160" y="164" width="220" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="184" text-anchor="middle" font-size="11" fill="#333">node.left = dfs(node.left)</text>

  <path d="M 270 194 L 270 210" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- R_right -->
  <rect x="160" y="212" width="220" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="232" text-anchor="middle" font-size="11" fill="#333">node.right = dfs(node.right)</text>

  <path d="M 270 242 L 270 254" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- D2: is leaf? -->
  <polygon points="270,256 372,290 270,324 168,290" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="287" text-anchor="middle" font-size="11" fill="#444">左右都为 null?</text>
  <text x="270" y="301" text-anchor="middle" font-size="9" fill="#888">(孩子删完后成新叶)</text>

  <!-- D2 no -> return node (right middle) -->
  <path d="M 372 290 L 398 290" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="384" y="284" text-anchor="middle" font-size="10" fill="#4a7a3a">否</text>
  <rect x="400" y="274" width="110" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="455" y="294" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return node</text>

  <!-- D2 yes -> D3 -->
  <path d="M 270 324 L 270 336" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="282" y="332" font-size="10" fill="#b85450">是</text>

  <!-- D3: val == target? -->
  <polygon points="270,338 360,366 270,394 180,366" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="370" text-anchor="middle" font-size="11" fill="#444">node.val == target?</text>

  <!-- D3 no -> return node (up to the box at y=290) -->
  <path d="M 360 366 L 400 366 L 400 308" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="374" y="360" font-size="10" fill="#4a7a3a">否</text>

  <!-- D3 yes -> return null (delete) bottom -->
  <path d="M 270 394 L 270 408" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="282" y="404" font-size="10" fill="#b85450">是</text>
  <rect x="200" y="410" width="140" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="431" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return null（删除）</text>

  <!-- legend bottom -->
  <text x="270" y="462" text-anchor="middle" font-size="10" fill="#888">关键：判定「是否成叶」必须在 dfs(孩子) 之后——这就是后序的本质</text>
</svg>
