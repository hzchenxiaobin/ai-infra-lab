<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">删两边的三段异或：祖先嵌套 vs 平行子树</text>
  <line x1="280" y1="36" x2="280" y2="296" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- ============ Case A: ancestor (left) ============ -->
  <text x="145" y="50" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">情况 A：i 是 j 的祖先</text>

  <!-- rest (orange) -->
  <rect x="55" y="60" width="180" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="76" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">其余 (z)</text>
  <text x="145" y="92" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">z = total ^ xor[i]</text>

  <!-- cut i -->
  <line x1="145" y1="100" x2="145" y2="114" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="160" y="110" font-size="11" fill="#b85450" filter="url(#rough2)">切 i</text>

  <!-- subtree(i) \ subtree(j) (blue) -->
  <rect x="35" y="116" width="220" height="172" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="134" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">subtree(i) \ subtree(j)  (y)</text>
  <text x="145" y="150" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">y = xor[i] ^ xor[j]</text>

  <!-- cut j: dashed red around green -->
  <rect x="61" y="160" width="168" height="110" rx="9" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- subtree(j) (green) -->
  <rect x="65" y="164" width="160" height="102" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">subtree(j)  (x)</text>
  <text x="145" y="202" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">x = xor[j]</text>
  <text x="92" y="282" font-size="11" fill="#b85450" filter="url(#rough2)">切 j</text>

  <!-- ============ Case B: parallel (right) ============ -->
  <text x="415" y="50" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">情况 B：i、j 平行子树</text>

  <!-- rest (orange) -->
  <rect x="305" y="60" width="220" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="78" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">其余 (z)</text>
  <text x="415" y="96" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">z = total ^ xor[i] ^ xor[j]</text>

  <!-- cut i / cut j -->
  <line x1="360" y1="110" x2="360" y2="126" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="374" y="122" font-size="11" fill="#b85450" filter="url(#rough2)">切 i</text>
  <line x1="470" y1="110" x2="470" y2="126" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="484" y="122" font-size="11" fill="#b85450" filter="url(#rough2)">切 j</text>

  <!-- subtree(i) (blue) -->
  <rect x="320" y="128" width="80" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="146" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">subtree(i)</text>
  <text x="360" y="158" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">(x)</text>
  <text x="360" y="180" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">x = xor[i]</text>

  <!-- subtree(j) (green) -->
  <rect x="430" y="128" width="80" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="146" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">subtree(j)</text>
  <text x="470" y="158" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">(y)</text>
  <text x="470" y="180" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">y = xor[j]</text>

  <text x="415" y="226" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">两段被摘子树不交</text>
  <text x="415" y="242" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">第三段 = 全树 ⊖ 两子树</text>
</svg>
