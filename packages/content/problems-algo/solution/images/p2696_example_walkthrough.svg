<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = “ABFCACDB”</text>
  <text x="300" y="42" text-anchor="middle" font-size="11" fill="#888">蓝=压入，橙=当前字符，红=成对弹出</text>

  <!-- Header -->
  <text x="24" y="68" font-size="12" fill="#444" font-weight="bold">步</text>
  <text x="64" y="68" font-size="12" fill="#444" font-weight="bold">当前 c</text>
  <text x="150" y="68" font-size="12" fill="#444" font-weight="bold">动作</text>
  <text x="290" y="68" font-size="12" fill="#444" font-weight="bold">栈（底→顶）</text>
  <text x="500" y="68" font-size="12" fill="#444" font-weight="bold">说明</text>
  <line x1="16" y1="76" x2="584" y2="76" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 1: A push -->
  <text x="24" y="100" font-size="11" fill="#333">1</text>
  <rect x="70" y="86" width="28" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="84" y="102" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A</text>
  <text x="150" y="100" font-size="11" fill="#4a7a3a" font-weight="bold">push</text>
  <rect x="290" y="88" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="304" y="104" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A</text>
  <text x="500" y="100" font-size="11" fill="#888">栈空，直接入栈</text>

  <!-- Step 2: B, top A + B = AB -> pop -->
  <text x="24" y="132" font-size="11" fill="#333">2</text>
  <rect x="70" y="118" width="28" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="84" y="134" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">B</text>
  <text x="150" y="132" font-size="11" fill="#b85450" font-weight="bold">pop ✕</text>
  <text x="190" y="132" font-size="11" fill="#555">A+B=AB</text>
  <rect x="290" y="120" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="304" y="136" text-anchor="middle" font-size="10" fill="#999">空</text>
  <text x="500" y="132" font-size="11" fill="#b85450">栈顶 A + B = “AB” → 弹出</text>

  <!-- Step 3: F push -->
  <text x="24" y="164" font-size="11" fill="#333">3</text>
  <rect x="70" y="150" width="28" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="84" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">F</text>
  <text x="150" y="164" font-size="11" fill="#4a7a3a" font-weight="bold">push</text>
  <rect x="290" y="152" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="304" y="168" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">F</text>
  <text x="500" y="164" font-size="11" fill="#888">栈空，入栈</text>

  <!-- Step 4: C push -->
  <text x="24" y="196" font-size="11" fill="#333">4</text>
  <rect x="70" y="182" width="28" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="84" y="198" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">C</text>
  <text x="150" y="196" font-size="11" fill="#4a7a3a" font-weight="bold">push</text>
  <text x="190" y="196" font-size="11" fill="#555">F+C≠</text>
  <rect x="290" y="184" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="304" y="200" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">F</text>
  <rect x="324" y="184" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="200" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">C</text>
  <text x="500" y="196" font-size="11" fill="#888">FC 不成对，入栈</text>

  <!-- Step 5: A push -->
  <text x="24" y="228" font-size="11" fill="#333">5</text>
  <rect x="70" y="214" width="28" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="84" y="230" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A</text>
  <text x="150" y="228" font-size="11" fill="#4a7a3a" font-weight="bold">push</text>
  <text x="190" y="228" font-size="11" fill="#555">C+A≠</text>
  <rect x="290" y="216" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="304" y="232" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">F</text>
  <rect x="324" y="216" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="232" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">C</text>
  <rect x="358" y="216" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="232" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A</text>
  <text x="500" y="228" font-size="11" fill="#888">CA 不成对，入栈</text>

  <!-- Step 6: C push -->
  <text x="24" y="260" font-size="11" fill="#333">6</text>
  <rect x="70" y="246" width="28" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="84" y="262" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">C</text>
  <text x="150" y="260" font-size="11" fill="#4a7a3a" font-weight="bold">push</text>
  <text x="190" y="260" font-size="11" fill="#555">A+C≠</text>
  <rect x="290" y="248" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="304" y="264" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">F</text>
  <rect x="324" y="248" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="264" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">C</text>
  <rect x="358" y="248" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="264" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">A</text>
  <rect x="392" y="248" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="406" y="264" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">C</text>
  <text x="500" y="260" font-size="11" fill="#888">AC 不成对，入栈</text>

  <!-- Step 7: D, top C + D = CD -> pop -->
  <text x="24" y="292" font-size="11" fill="#333">7</text>
  <rect x="70" y="278" width="28" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="84" y="294" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">D</text>
  <text x="150" y="292" font-size="11" fill="#b85450" font-weight="bold">pop ✕</text>
  <text x="190" y="292" font-size="11" fill="#555">C+D=CD</text>
  <rect x="290" y="280" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="304" y="296" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">F</text>
  <rect x="324" y="280" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="296" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">C</text>
  <rect x="358" y="280" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="296" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">A</text>
  <text x="500" y="292" font-size="11" fill="#b85450">栈顶 C + D = “CD” → 弹出</text>

  <!-- Step 8: B, top A + B = AB -> pop -->
  <text x="24" y="324" font-size="11" fill="#333">8</text>
  <rect x="70" y="310" width="28" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="84" y="326" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">B</text>
  <text x="150" y="324" font-size="11" fill="#b85450" font-weight="bold">pop ✕</text>
  <text x="190" y="324" font-size="11" fill="#555">A+B=AB</text>
  <rect x="290" y="312" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="304" y="328" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">F</text>
  <rect x="324" y="312" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="328" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">C</text>
  <text x="500" y="324" font-size="11" fill="#b85450">栈顶 A + B = “AB” → 弹出</text>

  <!-- Result -->
  <line x1="16" y1="352" x2="584" y2="352" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="60" y="368" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="389" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">结果：栈 = [F, C]，长度 = 2</text>
  <text x="300" y="404" text-anchor="middle" font-size="10.5" fill="#888">FC 无 AB/CD 子串 ⇔ 已是最小（与示例 1 = 2 一致）</text>

  <!-- footer -->
  <text x="300" y="436" text-anchor="middle" font-size="10.5" fill="#888">对比示例 2：s = “ACBBD” → 栈 = [A,C,B,B,D]，无任何成对，长度 = 5</text>
</svg>
