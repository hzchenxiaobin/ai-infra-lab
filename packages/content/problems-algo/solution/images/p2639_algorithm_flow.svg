<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：逐元素算宽度，按列下标归集 max</text>

  <!-- Step 1: init -->
  <rect x="40" y="56" width="520" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="74" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 初始化</text>
  <text x="60" y="92" font-size="11" fill="#555" filter="url(#rough2)">m = 行数, n = 列数；ans = [0]*n（每列最大值初值 0）</text>

  <!-- arrow -->
  <path d="M 300 100 L 300 116" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: double loop header -->
  <rect x="40" y="120" width="520" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="138" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② 双层遍历</text>
  <text x="60" y="156" font-size="11" fill="#555" filter="url(#rough2)">for i in 0..m-1:   for j in 0..n-1:   （行主序，但按列 j 归集）</text>

  <!-- arrow -->
  <path d="M 300 164 L 300 180" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: compute width (decision) -->
  <polygon points="300,184 460,238 300,292 140,238" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="226" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 算 width(grid[i][j])</text>
  <text x="300" y="246" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">len(str(x))  或  digits(|x|)+[x&lt;0]</text>
  <text x="300" y="266" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">注意：x=0 特判为 1，负数 +1</text>

  <!-- arrow to update -->
  <path d="M 300 292 L 300 308" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: update -->
  <rect x="40" y="312" width="520" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="330" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">④ 更新该列最大值</text>
  <text x="60" y="348" font-size="11" fill="#555" filter="url(#rough2)">ans[j] = max(ans[j], w)   ← 只动第 j 列的累加器</text>

  <!-- return note -->
  <rect x="40" y="362" width="520" height="0" fill="none"/>

  <text x="300" y="374" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">遍历完所有 (i,j) 后 ans 即所求；时间 O(mn)，空间 O(n)</text>
</svg>
