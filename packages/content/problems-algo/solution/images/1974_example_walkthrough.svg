<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="500" height="440" fill="#fafafa"/>

  <text x="250" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：三组输入的逐字符移动与键入</text>

  <!-- ===== Example 1: "abc" ===== -->
  <text x="60" y="52" font-size="12" fill="#555" font-weight="bold">示例 1：word = "abc" → 5</text>

  <!-- Column headers -->
  <g font-size="9.5" fill="#888" text-anchor="middle">
    <text x="80" y="70">步骤</text>
    <text x="145" y="70">from→to</text>
    <text x="205" y="70">diff</text>
    <text x="250" y="70">min</text>
    <text x="295" y="70">+1</text>
    <text x="350" y="70">total</text>
  </g>

  <!-- Row 1: a→a -->
  <g font-size="10.5" fill="#333" text-anchor="middle">
    <text x="80" y="88">1</text>
    <text x="145" y="88">a→a</text>
    <text x="205" y="88">0</text>
  </g>
  <rect x="232" y="78" width="36" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="250" y="91" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">0</text>
  <text x="295" y="88" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="332" y="78" width="36" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="350" y="91" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- Row 2: a→b -->
  <g font-size="10.5" fill="#333" text-anchor="middle">
    <text x="80" y="108">2</text>
    <text x="145" y="108">a→b</text>
    <text x="205" y="108">1</text>
  </g>
  <rect x="232" y="98" width="36" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="250" y="111" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">1</text>
  <text x="295" y="108" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="332" y="98" width="36" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="350" y="111" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- Row 3: b→c -->
  <g font-size="10.5" fill="#333" text-anchor="middle">
    <text x="80" y="128">3</text>
    <text x="145" y="128">b→c</text>
    <text x="205" y="128">1</text>
  </g>
  <rect x="232" y="118" width="36" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="250" y="131" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">1</text>
  <text x="295" y="128" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="332" y="118" width="36" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="350" y="131" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">5</text>

  <!-- Result 1 -->
  <rect x="60" y="140" width="120" height="22" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="155" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return 5 ✓</text>

  <!-- Divider -->
  <path d="M 40 170 L 460 170" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Example 2: "bza" ===== -->
  <text x="60" y="188" font-size="12" fill="#555" font-weight="bold">示例 2：word = "bza" → 7</text>

  <g font-size="9.5" fill="#888" text-anchor="middle">
    <text x="80" y="206">步骤</text>
    <text x="145" y="206">from→to</text>
    <text x="205" y="206">diff</text>
    <text x="250" y="206">min</text>
    <text x="295" y="206">+1</text>
    <text x="350" y="206">total</text>
  </g>

  <!-- Row 1: a→b -->
  <g font-size="10.5" fill="#333" text-anchor="middle">
    <text x="80" y="224">1</text>
    <text x="145" y="224">a→b</text>
    <text x="205" y="224">1</text>
  </g>
  <rect x="232" y="214" width="36" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="250" y="227" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">1</text>
  <text x="295" y="224" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="332" y="214" width="36" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="350" y="227" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- Row 2: b→z (key step: 24 vs 2) -->
  <g font-size="10.5" fill="#333" text-anchor="middle">
    <text x="80" y="244">2</text>
    <text x="145" y="244">b→z</text>
    <text x="205" y="244">24</text>
  </g>
  <rect x="228" y="234" width="44" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="247" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">2</text>
  <text x="295" y="244" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <rect x="332" y="234" width="36" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="350" y="247" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">5</text>

  <!-- Row 3: z→a -->
  <g font-size="10.5" fill="#333" text-anchor="middle">
    <text x="80" y="264">3</text>
    <text x="145" y="264">z→a</text>
    <text x="205" y="264">1</text>
  </g>
  <rect x="232" y="254" width="36" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="250" y="267" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">1</text>
  <text x="295" y="264" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="332" y="254" width="36" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="350" y="267" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">7</text>

  <!-- Result 2 -->
  <rect x="60" y="276" width="120" height="22" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="291" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return 7 ✓</text>

  <!-- Divider -->
  <path d="M 40 306 L 460 306" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Example 3: "zjpc" ===== -->
  <text x="60" y="324" font-size="12" fill="#555" font-weight="bold">示例 3：word = "zjpc" → 34</text>

  <g font-size="9.5" fill="#888" text-anchor="middle">
    <text x="80" y="342">步骤</text>
    <text x="145" y="342">from→to</text>
    <text x="205" y="342">diff</text>
    <text x="250" y="342">min</text>
    <text x="295" y="342">+1</text>
    <text x="350" y="342">total</text>
  </g>

  <!-- Row 1: a→z -->
  <g font-size="10.5" fill="#333" text-anchor="middle">
    <text x="80" y="360">1</text>
    <text x="145" y="360">a→z</text>
    <text x="205" y="360">25</text>
  </g>
  <rect x="228" y="350" width="44" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="363" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">1</text>
  <text x="295" y="360" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="332" y="350" width="36" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="350" y="363" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- Row 2: z→j -->
  <g font-size="10.5" fill="#333" text-anchor="middle">
    <text x="80" y="380">2</text>
    <text x="145" y="380">z→j</text>
    <text x="205" y="380">16</text>
  </g>
  <rect x="228" y="370" width="44" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="383" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">10</text>
  <text x="295" y="380" text-anchor="middle" font-size="10.5" fill="#333">11</text>
  <rect x="332" y="370" width="36" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="350" y="383" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">13</text>

  <!-- Row 3: j→p -->
  <g font-size="10.5" fill="#333" text-anchor="middle">
    <text x="80" y="400">3</text>
    <text x="145" y="400">j→p</text>
    <text x="205" y="400">6</text>
  </g>
  <rect x="232" y="390" width="36" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="250" y="403" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">6</text>
  <text x="295" y="400" text-anchor="middle" font-size="10.5" fill="#333">7</text>
  <rect x="332" y="390" width="36" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="350" y="403" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">20</text>

  <!-- Row 4: p→c -->
  <g font-size="10.5" fill="#333" text-anchor="middle">
    <text x="80" y="420">4</text>
    <text x="145" y="420">p→c</text>
    <text x="205" y="420">13</text>
  </g>
  <rect x="232" y="410" width="36" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="250" y="423" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">13</text>
  <text x="295" y="420" text-anchor="middle" font-size="10.5" fill="#333">14</text>
  <rect x="332" y="410" width="36" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="350" y="423" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">34</text>

  <!-- Notes -->
  <text x="60" y="436" font-size="10" fill="#888">观察：diff > 13 时逆时针更短（如 b→z: 24→2）；diff = 13 时两方向等长（如 p→c）</text>
</svg>
