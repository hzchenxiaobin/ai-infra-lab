<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：s = "1212" 全部子串逐对判定</text>
  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888">10 个子串 → 6 个好子串 → 哈希去重后 5 个不同 → 答案 5</text>

  <!-- 表头 -->
  <rect x="30" y="62" width="540" height="30" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g font-size="11" fill="#fff" font-weight="bold">
    <text x="60" y="82" text-anchor="middle">(i,j)</text>
    <text x="130" y="82" text-anchor="middle">子串</text>
    <text x="220" y="82" text-anchor="middle">数字频率</text>
    <text x="330" y="82" text-anchor="middle">好?</text>
    <text x="420" y="82" text-anchor="middle">哈希 h</text>
    <text x="520" y="82" text-anchor="middle">入集合?</text>
  </g>

  <!-- 行数据：y 起点 96，行高 34 -->
  <!-- row1 (0,0) "1" good new -->
  <rect x="30" y="96" width="540" height="32" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="11" fill="#333">
    <text x="60" y="116" text-anchor="middle">(0,0)</text>
    <text x="130" y="116" text-anchor="middle" font-weight="bold">"1"</text>
    <text x="220" y="116" text-anchor="middle">{1:1}</text>
    <text x="330" y="116" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="420" y="116" text-anchor="middle" font-family="monospace">2</text>
    <text x="520" y="116" text-anchor="middle" fill="#4a7a3a" font-weight="bold">＋新增</text>
  </g>

  <!-- row2 (0,1) "12" -->
  <rect x="30" y="128" width="540" height="32" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="11" fill="#333">
    <text x="60" y="148" text-anchor="middle">(0,1)</text>
    <text x="130" y="148" text-anchor="middle" font-weight="bold">"12"</text>
    <text x="220" y="148" text-anchor="middle">{1:1,2:1}</text>
    <text x="330" y="148" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="420" y="148" text-anchor="middle" font-family="monospace">25</text>
    <text x="520" y="148" text-anchor="middle" fill="#4a7a3a" font-weight="bold">＋新增</text>
  </g>

  <!-- row3 (0,2) "121" bad -->
  <rect x="30" y="160" width="540" height="32" fill="#fce4ec" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="11" fill="#333">
    <text x="60" y="180" text-anchor="middle">(0,2)</text>
    <text x="130" y="180" text-anchor="middle" font-weight="bold">"121"</text>
    <text x="220" y="180" text-anchor="middle" fill="#b85450">{1:2,2:1}</text>
    <text x="330" y="180" text-anchor="middle" fill="#b85450" font-weight="bold">✗</text>
    <text x="420" y="180" text-anchor="middle" fill="#aaa" font-family="monospace">—</text>
    <text x="520" y="180" text-anchor="middle" fill="#aaa">跳过</text>
  </g>

  <!-- row4 (0,3) "1212" good new -->
  <rect x="30" y="192" width="540" height="32" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="11" fill="#333">
    <text x="60" y="212" text-anchor="middle">(0,3)</text>
    <text x="130" y="212" text-anchor="middle" font-weight="bold">"1212"</text>
    <text x="220" y="212" text-anchor="middle">{1:2,2:2}</text>
    <text x="330" y="212" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="420" y="212" text-anchor="middle" font-family="monospace">3050</text>
    <text x="520" y="212" text-anchor="middle" fill="#4a7a3a" font-weight="bold">＋新增</text>
  </g>

  <!-- row5 (1,1) "2" good new -->
  <rect x="30" y="224" width="540" height="32" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="11" fill="#333">
    <text x="60" y="244" text-anchor="middle">(1,1)</text>
    <text x="130" y="244" text-anchor="middle" font-weight="bold">"2"</text>
    <text x="220" y="244" text-anchor="middle">{2:1}</text>
    <text x="330" y="244" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="420" y="244" text-anchor="middle" font-family="monospace">3</text>
    <text x="520" y="244" text-anchor="middle" fill="#4a7a3a" font-weight="bold">＋新增</text>
  </g>

  <!-- row6 (1,2) "21" good new -->
  <rect x="30" y="256" width="540" height="32" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="11" fill="#333">
    <text x="60" y="276" text-anchor="middle">(1,2)</text>
    <text x="130" y="276" text-anchor="middle" font-weight="bold">"21"</text>
    <text x="220" y="276" text-anchor="middle">{2:1,1:1}</text>
    <text x="330" y="276" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="420" y="276" text-anchor="middle" font-family="monospace">35</text>
    <text x="520" y="276" text-anchor="middle" fill="#4a7a3a" font-weight="bold">＋新增</text>
  </g>

  <!-- row7 (1,3) "212" bad -->
  <rect x="30" y="288" width="540" height="32" fill="#fce4ec" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="11" fill="#333">
    <text x="60" y="308" text-anchor="middle">(1,3)</text>
    <text x="130" y="308" text-anchor="middle" font-weight="bold">"212"</text>
    <text x="220" y="308" text-anchor="middle" fill="#b85450">{2:2,1:1}</text>
    <text x="330" y="308" text-anchor="middle" fill="#b85450" font-weight="bold">✗</text>
    <text x="420" y="308" text-anchor="middle" fill="#aaa" font-family="monospace">—</text>
    <text x="520" y="308" text-anchor="middle" fill="#aaa">跳过</text>
  </g>

  <!-- row8 (2,2) "1" dup -->
  <rect x="30" y="320" width="540" height="32" fill="#fff8e1" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="11" fill="#333">
    <text x="60" y="340" text-anchor="middle">(2,2)</text>
    <text x="130" y="340" text-anchor="middle" font-weight="bold">"1"</text>
    <text x="220" y="340" text-anchor="middle">{1:1}</text>
    <text x="330" y="340" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="420" y="340" text-anchor="middle" font-family="monospace">2</text>
    <text x="520" y="340" text-anchor="middle" fill="#d6a040" font-weight="bold">⊙重复</text>
  </g>

  <!-- row9 (2,3) "12" dup -->
  <rect x="30" y="352" width="540" height="32" fill="#fff8e1" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="11" fill="#333">
    <text x="60" y="372" text-anchor="middle">(2,3)</text>
    <text x="130" y="372" text-anchor="middle" font-weight="bold">"12"</text>
    <text x="220" y="372" text-anchor="middle">{1:1,2:1}</text>
    <text x="330" y="372" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="420" y="372" text-anchor="middle" font-family="monospace">25</text>
    <text x="520" y="372" text-anchor="middle" fill="#d6a040" font-weight="bold">⊙重复</text>
  </g>

  <!-- row10 (3,3) "2" dup -->
  <rect x="30" y="384" width="540" height="32" fill="#fff8e1" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="11" fill="#333">
    <text x="60" y="404" text-anchor="middle">(3,3)</text>
    <text x="130" y="404" text-anchor="middle" font-weight="bold">"2"</text>
    <text x="220" y="404" text-anchor="middle">{2:1}</text>
    <text x="330" y="404" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="420" y="404" text-anchor="middle" font-family="monospace">3</text>
    <text x="520" y="404" text-anchor="middle" fill="#d6a040" font-weight="bold">⊙重复</text>
  </g>

  <!-- 结论框 -->
  <rect x="30" y="426" width="540" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="447" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">6 个好子串 − 3 个重复 = 5 个不同 → 答案 = 5 ✓</text>
</svg>
