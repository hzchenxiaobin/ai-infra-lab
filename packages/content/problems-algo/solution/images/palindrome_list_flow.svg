<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：四步走判定回文</text>

  <!-- 决策1：边界 -->
  <polygon points="280,52 400,92 280,132 160,92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="88" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">head 为空</text>
  <text x="280" y="104" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">或单节点?</text>

  <!-- 是 → return true -->
  <line x1="400" y1="92" x2="452" y2="92" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="84" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="456" y="76" width="92" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="502" y="97" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- 否 → 下 -->
  <line x1="280" y1="132" x2="280" y2="162" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="152" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- ① 找前中点 -->
  <rect x="120" y="166" width="320" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="187" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 找前中点</text>
  <text x="280" y="205" text-anchor="middle" font-size="10" fill="#555">while fast.next &amp;&amp; fast.next.next</text>

  <line x1="280" y1="216" x2="280" y2="244" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 反转后半 -->
  <rect x="120" y="248" width="320" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="269" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">② 反转后半段</text>
  <text x="280" y="287" text-anchor="middle" font-size="10" fill="#555">second = reverse(slow.next)</text>

  <line x1="280" y1="298" x2="280" y2="326" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 比较 -->
  <rect x="120" y="330" width="320" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="351" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 双指针逐节点比较</text>
  <text x="280" y="369" text-anchor="middle" font-size="10" fill="#555">p1=head, p2=second，while p2</text>

  <line x1="280" y1="380" x2="280" y2="408" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 决策2：全相等? -->
  <polygon points="280,412 380,446 280,472 180,446" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="444" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">全部相等?</text>
  <text x="280" y="460" text-anchor="middle" font-size="9" fill="#888">（p2 已走完）</text>

  <!-- 否 → return false -->
  <line x1="180" y1="446" x2="108" y2="446" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="438" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="12" y="429" width="92" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="58" y="450" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return false</text>

  <!-- 是 → 恢复 + return true -->
  <line x1="380" y1="446" x2="452" y2="446" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="438" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="456" y="429" width="98" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="505" y="446" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">恢复链表</text>
  <text x="505" y="458" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">return true</text>
</svg>
