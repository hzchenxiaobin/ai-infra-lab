<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="500" fill="#fafafa"/>

  <text x="300" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：3 个用户 → 按用户去重会话 → 求平均</text>

  <!-- ===== Step 0: Activity table (input) ===== -->
  <text x="300" y="44" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Activity 表（输入，按会话着色，均在 06-28~07-27 窗口内）</text>

  <!-- Header -->
  <rect x="160" y="50" width="280" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="180" y="64" font-size="8" fill="#446688" font-weight="bold">user_id</text>
  <text x="222" y="64" font-size="8" fill="#446688" font-weight="bold">session_id</text>
  <text x="280" y="64" font-size="8" fill="#446688" font-weight="bold">activity_date</text>
  <text x="365" y="64" font-size="8" fill="#446688" font-weight="bold">activity_type</text>
  <line x1="205" y1="50" x2="205" y2="70" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="245" y1="50" x2="245" y2="70" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="320" y1="50" x2="320" y2="70" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Session 1: user 1, 3 rows (green) -->
  <rect x="160" y="70" width="280" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="180" y="80" font-size="7.5" fill="#333">1</text>
  <text x="222" y="80" font-size="7.5" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="280" y="80" font-size="7.5" fill="#333">2019-07-20</text>
  <text x="365" y="80" font-size="7.5" fill="#4a7a3a">open_session</text>
  <line x1="205" y1="70" x2="205" y2="82" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="245" y1="70" x2="245" y2="82" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="320" y1="70" x2="320" y2="82" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>

  <rect x="160" y="82" width="280" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="180" y="92" font-size="7.5" fill="#333">1</text>
  <text x="222" y="92" font-size="7.5" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="280" y="92" font-size="7.5" fill="#333">2019-07-20</text>
  <text x="365" y="92" font-size="7.5" fill="#4a7a3a">scroll</text>
  <line x1="205" y1="82" x2="205" y2="94" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="245" y1="82" x2="245" y2="94" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="320" y1="82" x2="320" y2="94" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>

  <rect x="160" y="94" width="280" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="180" y="104" font-size="7.5" fill="#333">1</text>
  <text x="222" y="104" font-size="7.5" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="280" y="104" font-size="7.5" fill="#333">2019-07-20</text>
  <text x="365" y="104" font-size="7.5" fill="#4a7a3a">end_session</text>
  <line x1="205" y1="94" x2="205" y2="106" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="245" y1="94" x2="245" y2="106" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="320" y1="94" x2="320" y2="106" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>

  <!-- Session 4: user 2, 3 rows (blue) -->
  <rect x="160" y="106" width="280" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="180" y="116" font-size="7.5" fill="#333">2</text>
  <text x="222" y="116" font-size="7.5" fill="#446688" font-weight="bold">4</text>
  <text x="280" y="116" font-size="7.5" fill="#333">2019-07-20</text>
  <text x="365" y="116" font-size="7.5" fill="#446688">open_session</text>
  <line x1="205" y1="106" x2="205" y2="118" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="245" y1="106" x2="245" y2="118" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="320" y1="106" x2="320" y2="118" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>

  <rect x="160" y="118" width="280" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="180" y="128" font-size="7.5" fill="#333">2</text>
  <text x="222" y="128" font-size="7.5" fill="#446688" font-weight="bold">4</text>
  <text x="280" y="128" font-size="7.5" fill="#333">2019-07-21</text>
  <text x="365" y="128" font-size="7.5" fill="#446688">scroll</text>
  <line x1="205" y1="118" x2="205" y2="130" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="245" y1="118" x2="245" y2="130" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="320" y1="118" x2="320" y2="130" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>

  <rect x="160" y="130" width="280" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="180" y="140" font-size="7.5" fill="#333">2</text>
  <text x="222" y="140" font-size="7.5" fill="#446688" font-weight="bold">4</text>
  <text x="280" y="140" font-size="7.5" fill="#333">2019-07-21</text>
  <text x="365" y="140" font-size="7.5" fill="#446688">end_session</text>
  <line x1="205" y1="130" x2="205" y2="142" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="245" y1="130" x2="245" y2="142" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="320" y1="130" x2="320" y2="142" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>

  <!-- Session 2: user 3, 3 rows (orange) -->
  <rect x="160" y="142" width="280" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="180" y="152" font-size="7.5" fill="#333">3</text>
  <text x="222" y="152" font-size="7.5" fill="#d6a040" font-weight="bold">2</text>
  <text x="280" y="152" font-size="7.5" fill="#333">2019-07-21</text>
  <text x="365" y="152" font-size="7.5" fill="#d6a040">open_session</text>
  <line x1="205" y1="142" x2="205" y2="154" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="245" y1="142" x2="245" y2="154" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="320" y1="142" x2="320" y2="154" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>

  <rect x="160" y="154" width="280" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="180" y="164" font-size="7.5" fill="#333">3</text>
  <text x="222" y="164" font-size="7.5" fill="#d6a040" font-weight="bold">2</text>
  <text x="280" y="164" font-size="7.5" fill="#333">2019-07-21</text>
  <text x="365" y="164" font-size="7.5" fill="#d6a040">scroll</text>
  <line x1="205" y1="154" x2="205" y2="166" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="245" y1="154" x2="245" y2="166" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="320" y1="154" x2="320" y2="166" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>

  <rect x="160" y="166" width="280" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="180" y="176" font-size="7.5" fill="#333">3</text>
  <text x="222" y="176" font-size="7.5" fill="#d6a040" font-weight="bold">2</text>
  <text x="280" y="176" font-size="7.5" fill="#333">2019-07-21</text>
  <text x="365" y="176" font-size="7.5" fill="#d6a040">end_session</text>
  <line x1="205" y1="166" x2="205" y2="178" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="245" y1="166" x2="245" y2="178" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="320" y1="166" x2="320" y2="178" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>

  <!-- Session 5: user 3, 3 rows (red) -->
  <rect x="160" y="178" width="280" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="180" y="188" font-size="7.5" fill="#333">3</text>
  <text x="222" y="188" font-size="7.5" fill="#b85450" font-weight="bold">5</text>
  <text x="280" y="188" font-size="7.5" fill="#333">2019-07-21</text>
  <text x="365" y="188" font-size="7.5" fill="#b85450">open_session</text>
  <line x1="205" y1="178" x2="205" y2="190" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="245" y1="178" x2="245" y2="190" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="320" y1="178" x2="320" y2="190" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>

  <rect x="160" y="190" width="280" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="180" y="200" font-size="7.5" fill="#333">3</text>
  <text x="222" y="200" font-size="7.5" fill="#b85450" font-weight="bold">5</text>
  <text x="280" y="200" font-size="7.5" fill="#333">2019-07-21</text>
  <text x="365" y="200" font-size="7.5" fill="#b85450">scroll</text>
  <line x1="205" y1="190" x2="205" y2="202" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="245" y1="190" x2="245" y2="202" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="320" y1="190" x2="320" y2="202" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>

  <rect x="160" y="202" width="280" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="180" y="212" font-size="7.5" fill="#333">3</text>
  <text x="222" y="212" font-size="7.5" fill="#b85450" font-weight="bold">5</text>
  <text x="280" y="212" font-size="7.5" fill="#333">2019-07-21</text>
  <text x="365" y="212" font-size="7.5" fill="#b85450">end_session</text>
  <line x1="205" y1="202" x2="205" y2="214" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="245" y1="202" x2="245" y2="214" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="320" y1="202" x2="320" y2="214" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>

  <!-- Arrow down -->
  <path d="M300 220 L300 236" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="320" y="232" font-size="8" fill="#888">WHERE 日期 + 去重 session_id</text>

  <!-- ===== Step 1: Per-user session count ===== -->
  <text x="300" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">按用户去重会话：GROUP BY user_id → COUNT(DISTINCT session_id)</text>

  <!-- User 1 box -->
  <rect x="40" y="258" width="150" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="115" y="276" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">user 1</text>
  <text x="115" y="290" text-anchor="middle" font-size="8" fill="#333">会话 {1}</text>
  <text x="115" y="306" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">→ 1</text>

  <!-- User 2 box -->
  <rect x="210" y="258" width="150" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="285" y="276" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">user 2</text>
  <text x="285" y="290" text-anchor="middle" font-size="8" fill="#333">会话 {4}</text>
  <text x="285" y="306" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">→ 1</text>

  <!-- User 3 box -->
  <rect x="380" y="258" width="170" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="465" y="276" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">user 3</text>
  <text x="465" y="290" text-anchor="middle" font-size="8" fill="#333">会话 {2, 5}</text>
  <text x="465" y="306" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">→ 2</text>

  <!-- Arrow down -->
  <path d="M300 322 L300 340" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ===== Step 2: Average calculation ===== -->
  <rect x="80" y="344" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="364" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">求平均：AVG(每人会话数) = (1 + 1 + 2) / 3</text>
  <text x="300" y="386" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">= 4 / 3 = 1.33</text>

  <!-- Arrow down -->
  <path d="M300 406 L300 422" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ===== Step 3: Result ===== -->
  <rect x="150" y="426" width="300" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="447" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">输出：average_sessions_per_user = 1.33</text>

  <!-- Side note: two approaches equivalence -->
  <rect x="20" y="344" width="50" height="56" fill="#f0f0f0" stroke="#ccc" stroke-width="0.6" rx="4" filter="url(#rough2)"/>
  <text x="45" y="366" text-anchor="middle" font-size="7" fill="#888">等价</text>
  <text x="45" y="378" text-anchor="middle" font-size="7" fill="#888">总会话</text>
  <text x="45" y="388" text-anchor="middle" font-size="7" fill="#888">÷总用户</text>
  <text x="45" y="397" text-anchor="middle" font-size="7" fill="#888">=4÷3</text>

  <rect x="530" y="344" width="50" height="56" fill="#f0f0f0" stroke="#ccc" stroke-width="0.6" rx="4" filter="url(#rough2)"/>
  <text x="555" y="366" text-anchor="middle" font-size="7" fill="#888">等价</text>
  <text x="555" y="378" text-anchor="middle" font-size="7" fill="#888">COUNT</text>
  <text x="555" y="388" text-anchor="middle" font-size="7" fill="#888">(DISTINCT</text>
  <text x="555" y="397" text-anchor="middle" font-size="7" fill="#888">sess)/users</text>
</svg>
