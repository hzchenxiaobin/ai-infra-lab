<svg xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="880" height="640" fill="#fdfcf7"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">BFS 判定无向图两点连通 —— 算法流程</text>
  <path d="M 300 40 Q 440 48 580 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 1. start: 特判 -->
  <g filter="url(#sk)">
    <rect x="340" y="62" width="200" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="440" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#34506e">source == destination ?</text>
  <!-- yes branch -->
  <path d="M 440 102 L 440 122" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="450" y="118" font-size="11" font-weight="bold" fill="#4a8e4a">是</text>
  <g filter="url(#sk)">
    <rect x="360" y="124" width="160" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="440" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">返回 true</text>
  <!-- no branch -->
  <path d="M 540 82 L 612 82" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="556" y="76" font-size="11" font-weight="bold" fill="#5a5a5a">否</text>

  <!-- 2. 建邻接表 -->
  <g filter="url(#sk)">
    <rect x="612" y="62" width="220" height="40" rx="8" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.6"/>
  </g>
  <text x="722" y="88" text-anchor="middle" font-size="12.5" fill="#7a5415">建邻接表 adj（每条边加两次）</text>
  <path d="M 722 102 L 722 132" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 3. init: visited + queue -->
  <g filter="url(#sk)">
    <rect x="612" y="134" width="220" height="44" rx="8" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.6"/>
  </g>
  <text x="722" y="154" text-anchor="middle" font-size="12" fill="#7a5415">visited[source] = true</text>
  <text x="722" y="170" text-anchor="middle" font-size="12" fill="#7a5415">q.push(source)</text>
  <path d="M 722 178 L 722 208" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 4. decision: 队列空? -->
  <g filter="url(#sk)">
    <polygon points="722,210 812,250 722,290 632,250" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="722" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">队列为空?</text>
  <text x="722" y="264" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415"></text>
  <!-- yes → false -->
  <path d="M 812 250 L 852 250 L 852 470 L 822 470" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="820" y="244" font-size="11" font-weight="bold" fill="#b85450">是</text>
  <!-- no → 出队 -->
  <path d="M 632 250 L 540 250" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="566" y="244" font-size="11" font-weight="bold" fill="#5a5a5a">否</text>

  <!-- 5. 出队 u -->
  <g filter="url(#sk)">
    <rect x="340" y="230" width="200" height="40" rx="8" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.6"/>
  </g>
  <text x="440" y="256" text-anchor="middle" font-size="12.5" fill="#7a5415">u = q.pop()（出队）</text>
  <path d="M 440 270 L 440 300" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 6. 遍历邻居 v -->
  <g filter="url(#sk)">
    <rect x="320" y="302" width="240" height="44" rx="8" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.6"/>
  </g>
  <text x="440" y="322" text-anchor="middle" font-size="12.5" fill="#7a5415">遍历 u 的每个邻居 v</text>
  <text x="440" y="338" text-anchor="middle" font-size="11" fill="#9a7a35">（adj[u] 中取）</text>
  <path d="M 440 346 L 440 376" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 7. decision: v == dest? -->
  <g filter="url(#sk)">
    <polygon points="440,378 540,418 440,458 340,418" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="440" y="416" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">v == dest?</text>
  <!-- yes → true -->
  <path d="M 440 458 L 440 488" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="450" y="482" font-size="11" font-weight="bold" fill="#4a8e4a">是</text>
  <g filter="url(#sk)">
    <rect x="360" y="490" width="160" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="440" y="512" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">返回 true</text>

  <!-- no → decision visited[v]? -->
  <path d="M 340 418 L 230 418" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="262" y="412" font-size="11" font-weight="bold" fill="#5a5a5a">否</text>
  <g filter="url(#sk)">
    <polygon points="150,378 230,418 150,458 70,418" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="150" y="416" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">!visited[v]?</text>
  <!-- yes → mark + enqueue -->
  <path d="M 70 418 L 36 418 L 36 322 L 60 322" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="44" y="372" font-size="11" font-weight="bold" fill="#34506e">是</text>
  <g filter="url(#sk)">
    <rect x="60" y="300" width="220" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="170" y="320" text-anchor="middle" font-size="12" fill="#34506e">visited[v] = true</text>
  <text x="170" y="336" text-anchor="middle" font-size="12" fill="#34506e">q.push(v)</text>
  <!-- loop back to neighbor iteration -->
  <path d="M 280 322 L 320 322" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <!-- no → next neighbor -->
  <path d="M 150 458 L 150 560 L 440 560" stroke="#5a5a5a" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="180" y="554" font-size="10.5" fill="#5a5a5a">否（已访问，跳过）→ 取下一个 v</text>

  <!-- loop: after neighbors exhausted, back to queue-empty check -->
  <path d="M 440 560 L 540 560 L 540 540 L 700 540 L 700 290" stroke="#5a5a5a" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="600" y="534" font-size="10.5" fill="#5a5a5a">邻居遍历完 → 回到「队列空?」</text>

  <!-- false result -->
  <g filter="url(#sk)">
    <rect x="660" y="452" width="160" height="36" rx="6" fill="#fdecee" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="740" y="474" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">返回 false</text>

  <!-- legend -->
  <g filter="url(#sk)">
    <rect x="40" y="588" width="800" height="40" rx="6" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="56" y="612" font-size="11" fill="#7a5415">• 蓝框=初始化/标记  • 黄框/菱形=判定  • 绿框=命中返回 true  • 红框=未命中返回 false  • 虚线=循环回边</text>
</svg>
