<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：每个携带者向一段「传播窗口」每天贡献 1 人</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">第 L 天发现 → 等待 delay 天 → 传播 (forget−delay) 天 → 第 L+forget 天遗忘</text>

  <!-- phase brackets above the cells -->
  <!-- 等待期 over days 1..2 (x 100..228) -->
  <path d="M104 70 L104 60 L228 60 L228 70" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="166" y="56" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">等待期（delay 天）</text>

  <!-- 传播期 over days 3..4 (x 228..356) -->
  <path d="M232 70 L232 60 L356 60 L356 70" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="294" y="56" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">传播期（forget−delay 天）</text>

  <!-- 5 day cells, width 64, x=100..420 ; example L=1, delay=2, forget=4 -->
  <!-- day 1: L 等待 -->
  <rect x="100" y="80" width="64" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="132" y="98" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">第 1 天</text>
  <text x="132" y="113" text-anchor="middle" font-size="10" fill="#888">L · 发现</text>

  <!-- day 2: 等待 -->
  <rect x="164" y="80" width="64" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="196" y="98" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">第 2 天</text>
  <text x="196" y="113" text-anchor="middle" font-size="10" fill="#888">L+1</text>

  <!-- day 3: 传播 (L+delay) -->
  <rect x="228" y="80" width="64" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="260" y="98" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">第 3 天</text>
  <text x="260" y="113" text-anchor="middle" font-size="10" fill="#4a7a3a">L+delay</text>

  <!-- day 4: 传播 (L+forget-1) -->
  <rect x="292" y="80" width="64" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="324" y="98" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">第 4 天</text>
  <text x="324" y="113" text-anchor="middle" font-size="10" fill="#4a7a3a">L+forget−1</text>

  <!-- day 5: 遗忘 (L+forget) -->
  <rect x="356" y="80" width="64" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="388" y="98" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">第 5 天</text>
  <text x="388" y="113" text-anchor="middle" font-size="10" fill="#b85450">L+forget ✗</text>

  <!-- +1 新人 arrows under sharing days -->
  <path d="M260 122 L260 148" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="260" y="164" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">+1 新人</text>
  <path d="M324 122 L324 148" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="324" y="164" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">+1 新人</text>

  <!-- summary line -->
  <text x="280" y="190" text-anchor="middle" font-size="11" fill="#333">一人贡献区间 = [L+delay, L+forget−1]，共 forget−delay 天，每天 +1 人</text>

  <!-- divider -->
  <line x1="40" y1="208" x2="520" y2="208" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Part B: window -> recurrence -->
  <text x="280" y="232" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">从「单人生涯」推出「第 i 天新增」的窗口</text>

  <!-- line 1 -->
  <text x="48" y="262" text-anchor="start" font-size="11.5" fill="#333">第 i 天的新增 dp[i]，等于所有满足</text>
  <text x="290" y="262" text-anchor="start" font-size="11.5" fill="#446688" font-weight="bold">j + delay ≤ i ≤ j + forget − 1</text>
  <text x="470" y="262" text-anchor="start" font-size="11.5" fill="#333">的携带者各 +1</text>

  <!-- line 2: equivalence -->
  <text x="48" y="286" text-anchor="start" font-size="11.5" fill="#888">解不等式 ⟺</text>
  <text x="160" y="286" text-anchor="start" font-size="12.5" fill="#b85450" font-weight="bold">i − forget + 1  ≤  j  ≤  i − delay</text>

  <!-- window bracket -->
  <path d="M160 296 L160 306 L300 306 L300 296" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="230" y="324" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">一段连续的 j 区间（长度 forget−delay）</text>

  <!-- line 3: recurrence -->
  <rect x="40" y="340" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">dp[i] = Σ_{j = i−forget+1}^{i−delay} dp[j]</text>
  <text x="280" y="382" text-anchor="middle" font-size="10.5" fill="#446688">连续区间和 → 用前缀和 prefix[] 每次 O(1) 取出</text>

  <!-- footer -->
  <text x="280" y="412" text-anchor="middle" font-size="10" fill="#888">例：delay=2, forget=4 ⟹ 传播窗口长度 2（第 3、4 天各 +1）</text>
</svg>
