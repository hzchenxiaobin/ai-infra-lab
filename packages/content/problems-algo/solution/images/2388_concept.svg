<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="380" fill="#fafafa"/>

  <text x="380" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：按 id 升序，NULL 用「最近的非空值」向下填充（LOCF）</text>
  <text x="380" y="46" text-anchor="middle" font-size="11" fill="#888">每个非空 drink 开启一个「岛」，其后的连续 NULL 行归入同岛 → 岛内共享该非空值</text>

  <!-- ===== Island backgrounds (sorted by id) ===== -->
  <!-- Island 1: id=1(A), id=2(null) -->
  <rect x="66" y="66" width="202" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <!-- Island 2: id=3(B), id=6(null), id=7(null) -->
  <rect x="280" y="66" width="300" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <!-- Island 3: id=9(C) -->
  <rect x="592" y="66" width="104" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>

  <!-- ===== 6 cells (id order: 1,2,3,6,7,9) ===== -->
  <!-- cell1 id=1 A -->
  <rect x="72" y="72" width="92" height="80" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="118" y="90" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">id = 1</text>
  <text x="118" y="124" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">A</text>
  <text x="118" y="142" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">非空</text>

  <!-- cell2 id=2 null -->
  <rect x="170" y="72" width="92" height="80" fill="#ffffff" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="216" y="90" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">id = 2</text>
  <text x="216" y="120" text-anchor="middle" font-size="14" fill="#bbb" filter="url(#rough2)" text-decoration="line-through">null</text>
  <text x="216" y="142" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ A</text>

  <!-- cell3 id=3 B -->
  <rect x="286" y="72" width="92" height="80" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="332" y="90" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">id = 3</text>
  <text x="332" y="124" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="332" y="142" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">非空</text>

  <!-- cell4 id=6 null -->
  <rect x="384" y="72" width="92" height="80" fill="#ffffff" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="430" y="90" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">id = 6</text>
  <text x="430" y="120" text-anchor="middle" font-size="14" fill="#bbb" filter="url(#rough2)" text-decoration="line-through">null</text>
  <text x="430" y="142" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ B</text>

  <!-- cell5 id=7 null -->
  <rect x="482" y="72" width="92" height="80" fill="#ffffff" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="528" y="90" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">id = 7</text>
  <text x="528" y="120" text-anchor="middle" font-size="14" fill="#bbb" filter="url(#rough2)" text-decoration="line-through">null</text>
  <text x="528" y="142" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ B</text>

  <!-- cell6 id=9 C -->
  <rect x="598" y="72" width="92" height="80" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="644" y="90" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">id = 9</text>
  <text x="644" y="124" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold" filter="url(#rough2)">C</text>
  <text x="644" y="142" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">非空</text>

  <!-- ===== carry-forward arrows (anchor -> nulls, drawn above cells) ===== -->
  <!-- Island1: A(1) -> null(2) -->
  <path d="M 118 70 Q 166 40 216 70" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="167" y="48" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">填充</text>

  <!-- Island2: B(3) -> null(6) & null(7) -->
  <path d="M 332 70 Q 380 38 430 70" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 332 64 Q 430 16 528 70" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="430" y="28" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">填充</text>

  <!-- ===== Island labels below ===== -->
  <rect x="96" y="168" width="142" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="13" filter="url(#rough2)"/>
  <text x="167" y="186" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">岛1 = {id 1, 2} → A</text>

  <rect x="324" y="168" width="212" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="13" filter="url(#rough2)"/>
  <text x="430" y="186" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">岛2 = {id 3, 6, 7} → B</text>

  <rect x="600" y="168" width="88" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="13" filter="url(#rough2)"/>
  <text x="644" y="186" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">岛3 → C</text>

  <!-- ===== cnt grouping note ===== -->
  <rect x="40" y="214" width="680" height="64" fill="#fafafa" stroke="#ccc" stroke-width="1.2" stroke-dasharray="5,3" rx="8" filter="url(#rough2)"/>
  <text x="60" y="236" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">如何用 SQL「圈出每个岛」？——累计非空计数 cnt：</text>
  <text x="60" y="256" font-size="10.5" fill="#555" filter="url(#rough2)">• cnt = COUNT(drink) OVER (ORDER BY id)，即「到当前行（含）为止的非空行数」</text>
  <text x="60" y="272" font-size="10.5" fill="#555" filter="url(#rough2)">• 非空行 cnt 自增 → 开新岛；NULL 行 cnt 不变 → 与前一同岛 → 故 PARTITION BY cnt 即「按岛分组」</text>

  <!-- ===== legend A/B/C -> actual drinks ===== -->
  <rect x="40" y="296" width="680" height="70" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="60" y="318" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例数据按 id 升序排好后的对应关系（id 原始顺序为 9,6,7,3,1,2，需先 ORDER BY id）：</text>
  <text x="60" y="340" font-size="10.5" fill="#446688" filter="url(#rough2)">A = Orange Margarita（id=1）　　B = St Germain Spritz（id=3）　　C = Rum and Coke（id=9）</text>
  <text x="60" y="358" font-size="10.5" fill="#888" filter="url(#rough2)">结果：id=2→A，id=6→B，id=7→B；NULL 行均被其所在岛的「锚值」填充</text>
</svg>
