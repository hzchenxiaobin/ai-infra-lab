<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：因子成对、关于 √area 对称 ⇒ 取 ≤ √area 的最大因子即最优 W</text>

  <!-- ===== Left panel: candidate rectangles for area = 12 ===== -->
  <text x="40" y="56" font-size="12" fill="#888" font-weight="bold">area = 12 的三种合法构造</text>

  <!-- [12, 1] diff = 11 -->
  <rect x="40" y="74" width="156" height="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="204" y="84" font-size="11" fill="#b85450" font-weight="bold">[12, 1]  差 11</text>

  <!-- [6, 2] diff = 4 -->
  <rect x="40" y="118" width="78" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="126" y="134" font-size="11" fill="#d6a040" font-weight="bold">[6, 2]  差 4</text>

  <!-- [4, 3] diff = 1 (optimal) -->
  <rect x="40" y="170" width="52" height="39" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="2" filter="url(#rough2)"/>
  <text x="100" y="184" font-size="11" fill="#4a7a3a" font-weight="bold">[4, 3]  差 1 ✓</text>
  <text x="100" y="200" font-size="10" fill="#4a7a3a">最接近 √12</text>

  <!-- arrow showing "差距递减" -->
  <path d="M 50 96 L 50 110 L 50 132 L 50 162" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="58" y="150" font-size="10" fill="#888" transform="rotate(90 58 150)">差距递减</text>

  <!-- answer callout -->
  <rect x="30" y="232" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="252" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最优：L,W 最接近 √area</text>
  <text x="150" y="268" text-anchor="middle" font-size="10" fill="#888">L×W 固定 ⇒ 越接近，差距越小</text>

  <!-- ===== Right panel: number line with factor pairs ===== -->
  <text x="300" y="56" font-size="12" fill="#888" font-weight="bold">因子对关于 √area 对称（area = 12）</text>

  <!-- arcs connecting factor pairs (above line) -->
  <!-- pair (1,12): 310 -> 530, arc peak y=96 -->
  <path d="M 310 150 Q 420 80 530 150" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="420" y="92" text-anchor="middle" font-size="10" fill="#b85450">(1, 12)</text>
  <!-- pair (2,6): 330 -> 410, arc peak y=112 -->
  <path d="M 330 150 Q 370 112 410 150" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="370" y="120" text-anchor="middle" font-size="10" fill="#d6a040">(2, 6)</text>
  <!-- pair (3,4): 350 -> 370, arc peak y=128 -->
  <path d="M 350 150 Q 360 128 370 150" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="360" y="136" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">(3, 4)</text>

  <!-- number line -->
  <line x1="300" y1="150" x2="540" y2="150" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- W side segment (green): 300 -> 359 (sqrt) -->
  <line x1="300" y1="150" x2="359" y2="150" stroke="#4a7a3a" stroke-width="4" filter="url(#rough2)"/>
  <!-- L side segment (blue): 359 -> 540 -->
  <line x1="359" y1="150" x2="540" y2="150" stroke="#446688" stroke-width="4" filter="url(#rough2)"/>

  <!-- sqrt marker -->
  <line x1="359" y1="140" x2="359" y2="178" stroke="#b85450" stroke-width="1.8" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="359" y="194" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">√12≈3.46</text>

  <!-- factor dots: W side (green): 1,2,3 -->
  <circle cx="310" cy="150" r="4.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="168" text-anchor="middle" font-size="10" fill="#4a7a3a">1</text>
  <circle cx="330" cy="150" r="4.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="168" text-anchor="middle" font-size="10" fill="#4a7a3a">2</text>
  <!-- optimal W=3 highlighted -->
  <circle cx="350" cy="150" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="350" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- factor dots: L side (blue): 4,6,12 -->
  <circle cx="370" cy="150" r="4.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="370" y="168" text-anchor="middle" font-size="10" fill="#446688">4</text>
  <circle cx="410" cy="150" r="4.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="168" text-anchor="middle" font-size="10" fill="#446688">6</text>
  <circle cx="530" cy="150" r="4.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="530" y="168" text-anchor="middle" font-size="10" fill="#446688">12</text>

  <!-- region labels -->
  <text x="324" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">W ≤ √area</text>
  <text x="470" y="142" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">L ≥ √area</text>

  <!-- arrow: pick largest W -->
  <path d="M 350 222 L 350 184" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="238" text-anchor="middle" font-size="10" fill="#4a7a3a">从 √area 向下，</text>
  <text x="350" y="252" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">首个因子即最大 W</text>

  <!-- formula box -->
  <rect x="300" y="272" width="240" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="294" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">算法一句话</text>
  <text x="420" y="316" text-anchor="middle" font-size="11" fill="#444">w = ⌊√area⌋</text>
  <text x="420" y="334" text-anchor="middle" font-size="11" fill="#444">while area % w ≠ 0: w−−</text>
  <text x="420" y="350" text-anchor="middle" font-size="10" fill="#888">return [area/w, w]</text>
</svg>
