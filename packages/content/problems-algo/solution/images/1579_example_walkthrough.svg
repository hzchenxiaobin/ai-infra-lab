<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="560" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n=4, edges=[[3,1,2],[3,2,3],[1,1,3],[1,2,4],[1,1,2],[2,3,4]]</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">按 type 降序处理：先类型 3，再类型 1，最后类型 2</text>

  <!-- ===== Table header ===== -->
  <rect x="30" y="58" width="70" height="26" fill="#eee" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="76" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">边</text>
  <rect x="100" y="58" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="175" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Alice 并查集</text>
  <rect x="250" y="58" width="150" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="325" y="76" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">Bob 并查集</text>
  <rect x="400" y="58" width="80" height="26" fill="#eee" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="440" y="76" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">动作</text>
  <rect x="480" y="58" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="515" y="76" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">removed</text>

  <!-- ===== Row 1: [3,1,2] ===== -->
  <rect x="30" y="84" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3,1,2</text>
  <text x="65" y="116" text-anchor="middle" font-size="9" fill="#4a7a3a">类型3</text>
  <rect x="100" y="84" width="150" height="40" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="175" y="108" text-anchor="middle" font-size="11" fill="#333">{1,2} {3} {4}</text>
  <rect x="250" y="84" width="150" height="40" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="325" y="108" text-anchor="middle" font-size="11" fill="#333">{1,2} {3} {4}</text>
  <rect x="400" y="84" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="440" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a">两人 union</text>
  <rect x="480" y="84" width="70" height="40" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="515" y="108" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- ===== Row 2: [3,2,3] ===== -->
  <rect x="30" y="124" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="140" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3,2,3</text>
  <text x="65" y="156" text-anchor="middle" font-size="9" fill="#4a7a3a">类型3</text>
  <rect x="100" y="124" width="150" height="40" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="175" y="148" text-anchor="middle" font-size="11" fill="#333">{1,2,3} {4}</text>
  <rect x="250" y="124" width="150" height="40" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="325" y="148" text-anchor="middle" font-size="11" fill="#333">{1,2,3} {4}</text>
  <rect x="400" y="124" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="440" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a">两人 union</text>
  <rect x="480" y="124" width="70" height="40" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="515" y="148" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- separator: type3 done -->
  <line x1="30" y1="168" x2="550" y2="168" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="565" y="164" font-size="9" fill="#4a7a3a">↑ 共享骨架完成</text>

  <!-- ===== Row 3: [1,1,3] REDUNDANT ===== -->
  <rect x="30" y="172" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1,1,3</text>
  <text x="65" y="204" text-anchor="middle" font-size="9" fill="#446688">类型1</text>
  <rect x="100" y="172" width="150" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="175" y="190" text-anchor="middle" font-size="10" fill="#b85450">1,3 已连通</text>
  <text x="175" y="204" text-anchor="middle" font-size="11" fill="#333">{1,2,3} {4}</text>
  <rect x="250" y="172" width="150" height="40" fill="#eee" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="325" y="196" text-anchor="middle" font-size="10" fill="#999">— 不动 —</text>
  <rect x="400" y="172" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="440" y="196" text-anchor="middle" font-size="10" fill="#b85450">冗余!删除</text>
  <rect x="480" y="172" width="70" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="515" y="196" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <!-- ===== Row 4: [1,2,4] useful ===== -->
  <rect x="30" y="212" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="228" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1,2,4</text>
  <text x="65" y="244" text-anchor="middle" font-size="9" fill="#446688">类型1</text>
  <rect x="100" y="212" width="150" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="236" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">{1,2,3,4}</text>
  <rect x="250" y="212" width="150" height="40" fill="#eee" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="325" y="236" text-anchor="middle" font-size="10" fill="#999">— 不动 —</text>
  <rect x="400" y="212" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="440" y="236" text-anchor="middle" font-size="10" fill="#446688">A: union</text>
  <rect x="480" y="212" width="70" height="40" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="515" y="236" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- ===== Row 5: [1,1,2] REDUNDANT ===== -->
  <rect x="30" y="252" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="268" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1,1,2</text>
  <text x="65" y="284" text-anchor="middle" font-size="9" fill="#446688">类型1</text>
  <rect x="100" y="252" width="150" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="175" y="270" text-anchor="middle" font-size="10" fill="#b85450">1,2 已连通</text>
  <text x="175" y="284" text-anchor="middle" font-size="11" fill="#333">{1,2,3,4}</text>
  <rect x="250" y="252" width="150" height="40" fill="#eee" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="325" y="276" text-anchor="middle" font-size="10" fill="#999">— 不动 —</text>
  <rect x="400" y="252" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="440" y="276" text-anchor="middle" font-size="10" fill="#b85450">冗余!删除</text>
  <rect x="480" y="252" width="70" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="515" y="276" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>

  <!-- separator: type1 done, Alice connected -->
  <line x1="30" y1="296" x2="550" y2="296" stroke="#446688" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="565" y="292" font-size="9" fill="#446688">↑ Alice 已全连通</text>

  <!-- ===== Row 6: [2,3,4] useful ===== -->
  <rect x="30" y="300" width="70" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2,3,4</text>
  <text x="65" y="332" text-anchor="middle" font-size="9" fill="#d6a040">类型2</text>
  <rect x="100" y="300" width="150" height="40" fill="#eee" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="175" y="324" text-anchor="middle" font-size="10" fill="#999">— 不动 —</text>
  <rect x="250" y="300" width="150" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="325" y="324" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">{1,2,3,4}</text>
  <rect x="400" y="300" width="80" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="440" y="324" text-anchor="middle" font-size="10" fill="#d6a040">B: union</text>
  <rect x="480" y="300" width="70" height="40" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="515" y="324" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- separator: type2 done, Bob connected -->
  <line x1="30" y1="344" x2="550" y2="344" stroke="#d6a040" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="565" y="340" font-size="9" fill="#d6a040">↑ Bob 已全连通</text>

  <!-- ===== Final result ===== -->
  <rect x="40" y="360" width="500" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="384" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">最终：Alice ✓ 连通，Bob ✓ 连通</text>
  <text x="290" y="404" text-anchor="middle" font-size="12" fill="#333">删除的边：[1,1,3] 与 [1,1,2] → removed = 2</text>

  <!-- ===== Final graph kept ===== -->
  <text x="290" y="438" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">保留的边（共 4 条，两人各自一棵生成树）</text>

  <!-- Alice kept graph -->
  <rect x="40" y="450" width="240" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="468" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Alice 保留：3,1,2 / 3,2,3 / 1,2,4</text>
  <circle cx="80" cy="498" r="12" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="502" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">1</text>
  <circle cx="160" cy="490" r="12" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="494" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2</text>
  <circle cx="240" cy="498" r="12" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="502" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">3</text>
  <circle cx="160" cy="528" r="12" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="532" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">4</text>
  <line x1="80" y1="498" x2="160" y2="490" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="160" y1="490" x2="240" y2="498" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="160" y1="490" x2="160" y2="528" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <!-- Bob kept graph -->
  <rect x="300" y="450" width="240" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="468" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">Bob 保留：3,1,2 / 3,2,3 / 2,3,4</text>
  <circle cx="340" cy="498" r="12" fill="#fff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="502" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">1</text>
  <circle cx="420" cy="490" r="12" fill="#fff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="494" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2</text>
  <circle cx="500" cy="498" r="12" fill="#fff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="502" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">3</text>
  <circle cx="420" cy="528" r="12" fill="#fff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="532" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">4</text>
  <line x1="340" y1="498" x2="420" y2="490" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="420" y1="490" x2="500" y2="498" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="500" y1="498" x2="420" y2="528" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
</svg>
