<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：root = [4,2,6,1,3]（示例 1）</text>

  <!-- 左：原 BST -->
  <text x="40" y="56" font-size="12" fill="#888">原 BST：</text>

  <line x1="142" y1="102" x2="108" y2="148" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="158" y1="102" x2="200" y2="148" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="92" y1="172" x2="73" y2="218" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="112" y1="172" x2="137" y2="218" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- 节点 4 (根, ④) -->
  <circle cx="150" cy="90" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="94" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="174" y="84" font-size="10" fill="#b85450" font-weight="bold">④</text>

  <!-- 节点 2 (②) -->
  <circle cx="100" cy="160" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="164" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="122" y="156" font-size="10" fill="#b85450" font-weight="bold">②</text>

  <!-- 节点 6 (⑤) -->
  <circle cx="210" cy="160" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="164" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="232" y="156" font-size="10" fill="#b85450" font-weight="bold">⑤</text>

  <!-- 节点 1 (①) -->
  <circle cx="65" cy="230" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="65" y="234" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="83" y="226" font-size="10" fill="#d6a040" font-weight="bold">①</text>

  <!-- 节点 3 (③) -->
  <circle cx="145" cy="230" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="145" y="234" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="163" y="226" font-size="10" fill="#b85450" font-weight="bold">③</text>

  <text x="40" y="270" font-size="11" fill="#888">中序：1 → 2 → 3 → 4 → 6</text>

  <!-- 右：逐步演变表 -->
  <text x="290" y="56" font-size="12" fill="#888">逐步演变（prev, diff, minDiff）：</text>

  <!-- ① 访问 1 -->
  <text x="290" y="84" font-size="11" fill="#d6a040" font-weight="bold">① 访问 1：prev=null → 跳过算差</text>
  <rect x="290" y="90" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="106" text-anchor="middle" font-size="10" fill="#333">1</text>
  <path d="M 324 102 L 348 102" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="336" y="96" font-size="9" fill="#888">无</text>
  <rect x="352" y="90" width="120" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="412" y="106" text-anchor="middle" font-size="10" fill="#888">diff=—, min=∞</text>

  <!-- ② 访问 2 -->
  <text x="290" y="132" font-size="11" fill="#b85450" font-weight="bold">② 访问 2：prev=1 → |2−1|=1</text>
  <rect x="290" y="138" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="154" text-anchor="middle" font-size="10" fill="#333">2</text>
  <path d="M 324 150 L 348 150" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="336" y="144" font-size="9" fill="#888">1</text>
  <rect x="352" y="138" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="412" y="154" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">diff=1, min=1</text>

  <!-- ③ 访问 3 -->
  <text x="290" y="180" font-size="11" fill="#b85450" font-weight="bold">③ 访问 3：prev=2 → |3−2|=1</text>
  <rect x="290" y="186" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="202" text-anchor="middle" font-size="10" fill="#333">3</text>
  <path d="M 324 198 L 348 198" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="336" y="192" font-size="9" fill="#888">1</text>
  <rect x="352" y="186" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="412" y="202" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">diff=1, min=1</text>

  <!-- ④ 访问 4 -->
  <text x="290" y="228" font-size="11" fill="#b85450" font-weight="bold">④ 访问 4：prev=3 → |4−3|=1</text>
  <rect x="290" y="234" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="250" text-anchor="middle" font-size="10" fill="#333">4</text>
  <path d="M 324 246 L 348 246" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="336" y="240" font-size="9" fill="#888">1</text>
  <rect x="352" y="234" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="412" y="250" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">diff=1, min=1</text>

  <!-- ⑤ 访问 6 -->
  <text x="290" y="276" font-size="11" fill="#446688" font-weight="bold">⑤ 访问 6：prev=4 → |6−4|=2</text>
  <rect x="290" y="282" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="298" text-anchor="middle" font-size="10" fill="#333">6</text>
  <path d="M 324 294 L 348 294" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="336" y="288" font-size="9" fill="#888">2</text>
  <rect x="352" y="282" width="120" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="412" y="298" text-anchor="middle" font-size="10" fill="#888">diff=2, min=1</text>

  <!-- 结果标注 -->
  <text x="290" y="332" font-size="13" fill="#b85450" font-weight="bold">返回 minDiff = 1 ✓</text>

  <!-- 说明框 -->
  <rect x="40" y="348" width="500" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="372" font-size="12" fill="#333" font-weight="bold">关键：每步只与中序前驱比较，无需回看更早的值</text>
  <text x="60" y="392" font-size="11" fill="#555">① 首节点无前驱，跳过；②③④ 各算出 diff=1 刷新 min；⑤ diff=2 未刷新</text>
  <text x="60" y="410" font-size="11" fill="#4a7a3a" font-weight="bold">最终 minDiff=1，返回 1</text>
</svg>
