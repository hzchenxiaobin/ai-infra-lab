<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">双栈法算法流程</text>

  <!-- Step 1: Initialize -->
  <rect x="40" y="48" width="480" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="68" cy="73" r="15" fill="#446688" filter="url(#rough2)"/>
  <text x="68" y="77" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">1</text>
  <text x="100" y="69" font-size="12" fill="#333" font-weight="bold">初始化</text>
  <text x="100" y="87" font-size="11" fill="#555">创建空栈 nodeStack（存树节点）和 opStack（存运算符 / 括号）</text>

  <!-- arrow -->
  <path d="M 280 98 L 280 116" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Read char (loop) -->
  <rect x="40" y="118" width="480" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="68" cy="143" r="15" fill="#d6a040" filter="url(#rough2)"/>
  <text x="68" y="147" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">2</text>
  <text x="100" y="139" font-size="12" fill="#333" font-weight="bold">读取下一个字符 ch（循环遍历 s）</text>
  <text x="100" y="157" font-size="11" fill="#555">根据 ch 的类型执行不同操作（见下方四个分支）</text>

  <!-- arrow to decision -->
  <path d="M 280 168 L 280 184" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <path d="M 280 186 L 380 220 L 280 254 L 180 220 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="218" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">ch 是什么类型？</text>
  <text x="280" y="234" text-anchor="middle" font-size="10" fill="#888">数字 / '(' / ')' / 运算符</text>

  <!-- Four branches -->
  <!-- Branch 1: digit -->
  <path d="M 180 220 L 40 220 L 40 270" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="44" y="214" font-size="10" fill="#446688" font-weight="bold">数字</text>
  <rect x="40" y="272" width="120" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="290" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">创建叶子节点</text>
  <text x="100" y="306" text-anchor="middle" font-size="10" fill="#555">Node(数字)</text>
  <text x="100" y="320" text-anchor="middle" font-size="10" fill="#446688">→ push nodeStack</text>

  <!-- Branch 2: '(' -->
  <path d="M 220 254 L 180 310" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="280" font-size="10" fill="#4a7a3a" font-weight="bold">'('</text>
  <rect x="170" y="272" width="100" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="220" y="290" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">压入标记</text>
  <text x="220" y="306" text-anchor="middle" font-size="10" fill="#555">push '('</text>
  <text x="220" y="320" text-anchor="middle" font-size="10" fill="#4a7a3a">→ opStack</text>

  <!-- Branch 3: ')' -->
  <path d="M 340 254 L 380 310" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="356" y="280" font-size="10" fill="#b85450" font-weight="bold">')'</text>
  <rect x="290" y="272" width="130" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="355" y="290" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">弹出至 '(' 建树</text>
  <text x="355" y="306" text-anchor="middle" font-size="10" fill="#555">while top ≠ '(': build</text>
  <text x="355" y="320" text-anchor="middle" font-size="10" fill="#b85450">→ pop '('</text>

  <!-- Branch 4: operator -->
  <path d="M 380 220 L 520 220 L 520 270" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="214" font-size="10" fill="#d6a040" font-weight="bold">运算符</text>
  <rect x="430" y="272" width="120" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="490" y="290" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">弹出高优建树</text>
  <text x="490" y="306" text-anchor="middle" font-size="10" fill="#555">while prec ≥ :</text>
  <text x="490" y="320" text-anchor="middle" font-size="10" fill="#d6a040">build → push ch</text>

  <!-- Merge arrows back to loop -->
  <path d="M 100 328 L 100 352" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 220 328 L 220 352" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 355 328 L 355 352" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 490 328 L 490 352" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: More chars? -->
  <rect x="40" y="354" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="68" cy="374" r="13" fill="#d6a040" filter="url(#rough2)"/>
  <text x="68" y="378" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">3</text>
  <text x="100" y="370" font-size="11.5" fill="#333" font-weight="bold">还有字符？</text>
  <text x="180" y="370" font-size="11" fill="#4a7a3a">是 → 回到步骤 2</text>
  <text x="340" y="370" font-size="11" fill="#b85450">否 → 进入步骤 4</text>
  <text x="100" y="386" font-size="10" fill="#888">i &lt; len(s) ?</text>

  <!-- Loop back arrow -->
  <path d="M 530 374 L 545 374 L 545 143 L 522 143" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="548" y="260" font-size="9" fill="#888" writing-mode="tb">循环</text>

  <!-- arrow to step 4 -->
  <path d="M 280 394 L 280 412" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: Pop remaining -->
  <rect x="40" y="414" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="68" cy="434" r="13" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="68" y="438" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">4</text>
  <text x="100" y="430" font-size="11.5" fill="#333" font-weight="bold">弹出 opStack 中所有剩余运算符，逐一建树</text>
  <text x="100" y="446" font-size="10.5" fill="#555">while opStack 非空: build(nodeStack, opStack)</text>

  <!-- arrow to step 5 -->
  <path d="M 280 454 L 280 468" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: Return -->
  <rect x="40" y="470" width="480" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <circle cx="68" cy="482" r="10" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="68" y="486" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">5</text>
  <text x="100" y="486" font-size="11.5" fill="#4a7a3a" font-weight="bold">返回 nodeStack 栈顶 = 表达式树根节点</text>
</svg>
