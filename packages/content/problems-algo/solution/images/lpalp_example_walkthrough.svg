<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 2，upper = 99，lower = 10</text>

  <!-- ===== table header ===== -->
  <rect x="40" y="46" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="80" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">x</text>
  <rect x="122" y="46" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="172" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">P（回文）</text>
  <rect x="224" y="46" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="314" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">内层检查（y 从 99↓）</text>
  <rect x="406" y="46" width="114" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="463" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">结果</text>

  <!-- ===== Row x=99 ===== -->
  <rect x="40" y="84" width="80" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="104" text-anchor="middle" font-size="12" fill="#333">99</text>
  <rect x="122" y="84" width="100" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="172" y="104" text-anchor="middle" font-size="12" fill="#333">9999</text>
  <rect x="224" y="84" width="180" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="314" y="104" text-anchor="middle" font-size="10.5" fill="#888">P &gt; 99²，跳过</text>
  <rect x="406" y="84" width="114" height="30" fill="#fce4ec" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="463" y="104" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>

  <!-- ===== Row x=98 ===== -->
  <rect x="40" y="116" width="80" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="136" text-anchor="middle" font-size="12" fill="#333">98</text>
  <rect x="122" y="116" width="100" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="172" y="136" text-anchor="middle" font-size="12" fill="#333">9889</text>
  <rect x="224" y="116" width="180" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="314" y="136" text-anchor="middle" font-size="10.5" fill="#888">P &gt; 99²，跳过</text>
  <rect x="406" y="116" width="114" height="30" fill="#fce4ec" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="463" y="136" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>

  <!-- ===== Row x=97 ===== -->
  <rect x="40" y="148" width="80" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="168" text-anchor="middle" font-size="12" fill="#333">97</text>
  <rect x="122" y="148" width="100" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="172" y="168" text-anchor="middle" font-size="12" fill="#333">9779</text>
  <rect x="224" y="148" width="180" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="314" y="168" text-anchor="middle" font-size="10.5" fill="#888">y=99：9779 % 99 = 77</text>
  <rect x="406" y="148" width="114" height="30" fill="#fce4ec" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="463" y="168" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>

  <!-- ===== Row x=96 ===== -->
  <rect x="40" y="180" width="80" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="200" text-anchor="middle" font-size="12" fill="#333">96</text>
  <rect x="122" y="180" width="100" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="172" y="200" text-anchor="middle" font-size="12" fill="#333">9669</text>
  <rect x="224" y="180" width="180" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="314" y="200" text-anchor="middle" font-size="10.5" fill="#888">y=99：9669 % 99 = 66</text>
  <rect x="406" y="180" width="114" height="30" fill="#fce4ec" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="463" y="200" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>

  <!-- ===== Row ellipsis ===== -->
  <rect x="40" y="212" width="480" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="14" fill="#888">⋯</text>

  <!-- ===== Row x=90 (highlighted) ===== -->
  <rect x="40" y="246" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="267" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">90</text>
  <text x="172" y="267" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">9009</text>
  <text x="314" y="267" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">y=99：9009 % 99 = 0，z=91 ✓</text>
  <text x="463" y="267" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 987</text>

  <!-- ===== bottom note ===== -->
  <rect x="40" y="296" width="480" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">9009 = 99 × 91，9009 mod 1337 = 987</text>
  <text x="280" y="336" text-anchor="middle" font-size="10.5" fill="#d6a040">x 仅从 99 降到 90 即命中——答案总在上界附近</text>

  <rect x="40" y="362" width="480" height="0" fill="none"/>
</svg>
