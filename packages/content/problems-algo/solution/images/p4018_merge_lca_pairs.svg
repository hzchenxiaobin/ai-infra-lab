<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="16" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：同组点对在 LCA 处配对 —— 两个聚合量一次算清</text>
  <text x="260" y="31" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">橙色 = 同组 g 的节点 ｜ 每个子树对每组只维护 (cnt, Σdepth) 两个聚合量</text>

  <!-- 节点 u（本身也在组 g） -->
  <rect x="234" y="44" width="52" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">u ∈ g</text>
  <text x="298" y="60" font-size="9.5" fill="#888" filter="url(#rough2)">depth(u)</text>

  <!-- u 到两个孩子子树的边 -->
  <path d="M 247 76 Q 196 100 159 122" fill="none" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 273 76 Q 324 100 381 122" fill="none" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 子树 ① -->
  <rect x="56" y="114" width="186" height="142" rx="10" fill="none" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="74" y="131" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">子树①</text>
  <rect x="137" y="124" width="44" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="159" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">c₁</text>
  <path d="M 150 152 Q 132 172 118 190" fill="none" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 168 152 Q 186 172 196 190" fill="none" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="96" y="192" width="44" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="118" y="211" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">a₁</text>
  <rect x="174" y="192" width="44" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="196" y="211" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">a₂</text>
  <text x="118" y="234" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">d(a₁)</text>
  <text x="196" y="234" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">d(a₂)</text>
  <text x="149" y="248" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">c₁ = 2 个 g 组点 ｜ S₁ = Σdepth</text>

  <!-- 子树 ② -->
  <rect x="278" y="114" width="186" height="142" rx="10" fill="none" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="296" y="131" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">子树②</text>
  <rect x="359" y="124" width="44" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="381" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">c₂</text>
  <path d="M 372 152 Q 356 172 346 190" fill="none" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 390 152 Q 406 172 422 190" fill="none" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="324" y="192" width="44" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="346" y="211" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">b₁</text>
  <rect x="400" y="192" width="44" height="28" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="422" y="211" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">他组</text>
  <text x="346" y="234" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">d(b₁)</text>
  <text x="371" y="248" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">c₂ = 1 个 g 组点 ｜ S₂ = Σdepth</text>

  <!-- 跨子树同组配对（虚线红箭头） -->
  <path d="M 220 208 Q 272 240 320 210" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="270" y="250" text-anchor="middle" font-size="9" font-weight="bold" fill="#b85450" filter="url(#rough2)">同组配对</text>

  <!-- 距离拆解 -->
  <rect x="30" y="262" width="460" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="281" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a3b36" filter="url(#rough2)">跨子树同组点对：dist(a,b) = depth(a) + depth(b) − 2·depth(u)</text>
  <text x="260" y="298" text-anchor="middle" font-size="9.5" fill="#7a3b36" filter="url(#rough2)">a、b 分居 u 的不同子树 ⇒ LCA 恰为 u（u 与子树内同组点的配对同样在 u 处结算）</text>

  <!-- 合并公式 -->
  <rect x="30" y="312" width="460" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="331" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5527" filter="url(#rough2)">合并时一次算清：ans += c₁·S₂ + c₂·S₁ − 2·depth(u)·c₁·c₂</text>
  <text x="260" y="347" text-anchor="middle" font-size="9.5" fill="#2f5527" filter="url(#rough2)">存 (cnt, Σdepth) 绝对量上抛免调整；小表并大表 ⇒ 总搬运 O(n log n)</text>
</svg>
