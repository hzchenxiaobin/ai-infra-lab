<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：枚举 s 充当「和」，逐个检验 cand = total − 2s</text>

  <!-- 示例 1 -->
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">示例 1：nums = [2, 3, 5, 10]，total = 20</text>

  <rect x="40" y="52" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="68" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">s</text>
  <rect x="100" y="52" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="68" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">cand = 20 − 2s</text>
  <rect x="220" y="52" width="180" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="68" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">存在性判定</text>
  <rect x="400" y="52" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="68" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">结果</text>

  <rect x="40" y="76" width="60" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="92" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <rect x="100" y="76" width="120" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="92" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">16</text>
  <rect x="220" y="76" width="180" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="92" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">cnt[16] = 0 ✗</text>
  <rect x="400" y="76" width="80" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="92" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">—</text>

  <rect x="40" y="100" width="60" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="116" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <rect x="100" y="100" width="120" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="116" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">14</text>
  <rect x="220" y="100" width="180" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="116" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">cnt[14] = 0 ✗</text>
  <rect x="400" y="100" width="80" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="116" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">—</text>

  <rect x="40" y="124" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="70" y="140" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="100" y="124" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="140" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="220" y="124" width="180" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="310" y="140" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">cnt[10] = 1 ≥ 1（10≠5）✓</text>
  <rect x="400" y="124" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="440" y="140" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans=10</text>

  <rect x="40" y="148" width="60" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="164" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">10</text>
  <rect x="100" y="148" width="120" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="164" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="220" y="148" width="180" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="164" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">cnt[0] = 0 ✗</text>
  <rect x="400" y="148" width="80" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="164" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">—</text>

  <text x="440" y="184" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">答案 10 ✓</text>

  <!-- 示例 3 -->
  <text x="260" y="210" text-anchor="middle" font-size="11" fill="#8a3833" font-weight="bold" filter="url(#rough2)">示例 3（重复值陷阱）：nums = [1,1,1,1,1,5,5]，total = 15</text>

  <rect x="40" y="218" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="234" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">s</text>
  <rect x="100" y="218" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="234" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">cand = 15 − 2s</text>
  <rect x="220" y="218" width="180" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="234" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">存在性判定</text>
  <rect x="400" y="218" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="234" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">结果</text>

  <rect x="40" y="242" width="60" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="258" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="100" y="242" width="120" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="258" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">13</text>
  <rect x="220" y="242" width="180" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="258" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">cnt[13] = 0 ✗</text>
  <rect x="400" y="242" width="80" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="258" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">—</text>

  <rect x="40" y="266" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="282" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="100" y="266" width="120" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="282" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="220" y="266" width="180" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="282" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">cand==s！需 cnt[5] ≥ 2，实际 = 2 ✓</text>
  <rect x="400" y="266" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="282" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">ans=5</text>

  <text x="440" y="304" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">答案 5 ✓</text>

  <!-- 底部说明 -->
  <rect x="24" y="316" width="472" height="56" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="38" y="336" font-size="9.8" fill="#333" filter="url(#rough2)">两个 5 各司其职：一个当「和」元素（特殊数字 1+1+1+1+1 = 5），另一个当异常值</text>
  <text x="38" y="354" font-size="9.8" fill="#555" filter="url(#rough2)">下标互异、值相同，完全合法；对照示例 2：total = −8，s = −6 → cand = 4，答案 4</text>
</svg>
