<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    回溯树演算：num = "232", target = 8
  </text>
  <text x="320" y="40" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    节点标注：path（curVal, prevOperand）　✅ = 命中 8
  </text>

  <!-- Level 0: "2" -->
  <rect x="280" y="56" width="80" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="320" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"2"</text>
  <text x="320" y="90" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">(2, +2)</text>

  <!-- Level 1: three branches -->
  <!-- to 2+3 -->
  <path d="M300,98 Q200,120 130,150" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="116" font-size="10" fill="#d6a040" filter="url(#rough2)">+3</text>
  <rect x="70" y="150" width="120" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="130" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"2+3"</text>
  <text x="130" y="186" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">(5, +3)</text>

  <!-- to 2-3 -->
  <path d="M320,98 L320,150" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="328" y="128" font-size="10" fill="#d6a040" filter="url(#rough2)">−3</text>
  <rect x="260" y="150" width="120" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="320" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"2-3"</text>
  <text x="320" y="186" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">(−1, −3)</text>

  <!-- to 2*3 -->
  <path d="M340,98 Q440,120 510,150" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="116" font-size="10" fill="#b85450" filter="url(#rough2)">*3</text>
  <rect x="450" y="150" width="120" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="510" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"2*3"</text>
  <text x="510" y="186" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">(6, +6) 撤销+2→2*3</text>

  <!-- Level 2 under 2+3 -->
  <path d="M110,198 L60,250" fill="none" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M130,198 L130,250" fill="none" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M150,198 L200,250" fill="none" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="22" y="252" width="76" height="44" fill="#fff" stroke="#888" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="60" y="269" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">"2+3+2"</text>
  <text x="60" y="283" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">=7 ✗</text>
  <rect x="92" y="252" width="76" height="44" fill="#fff" stroke="#888" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="130" y="269" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">"2+3-2"</text>
  <text x="130" y="283" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">=3 ✗</text>
  <rect x="162" y="252" width="84" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="204" y="269" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">"2+3*2"</text>
  <text x="204" y="283" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">=8 ✅</text>
  <text x="204" y="244" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">*2</text>

  <!-- Level 2 under 2-3 -->
  <path d="M300,198 L250,250" fill="none" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M320,198 L320,250" fill="none" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M340,198 L390,250" fill="none" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="212" y="252" width="76" height="44" fill="#fff" stroke="#888" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="250" y="269" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">"2-3+2"</text>
  <text x="250" y="283" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">=1 ✗</text>
  <rect x="282" y="252" width="76" height="44" fill="#fff" stroke="#888" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="320" y="269" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">"2-3-2"</text>
  <text x="320" y="283" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">=−3 ✗</text>
  <rect x="352" y="252" width="84" height="44" fill="#fff" stroke="#888" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="394" y="269" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">"2-3*2"</text>
  <text x="394" y="283" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">=−4 ✗</text>
  <text x="394" y="244" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">*2</text>

  <!-- Level 2 under 2*3 -->
  <path d="M490,198 L440,250" fill="none" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M510,198 L510,250" fill="none" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M530,198 L580,250" fill="none" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="402" y="252" width="84" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="444" y="269" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">"2*3+2"</text>
  <text x="444" y="283" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">=8 ✅</text>
  <text x="444" y="244" text-anchor="middle" font-size="8" fill="#d6a040" filter="url(#rough2)">+2</text>
  <rect x="472" y="252" width="76" height="44" fill="#fff" stroke="#888" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="510" y="269" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">"2*3-2"</text>
  <text x="510" y="283" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">=4 ✗</text>
  <rect x="542" y="252" width="84" height="44" fill="#fff" stroke="#888" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="584" y="269" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">"2*3*2"</text>
  <text x="584" y="283" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">=12 ✗</text>

  <!-- Annotation box -->
  <rect x="40" y="318" width="560" height="128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="340" font-size="11" fill="#b85450" filter="url(#rough2)">★ 乘法撤销对比（同为插 *2，因 prev 符号不同结果迥异）：</text>
  <text x="60" y="362" font-size="11" fill="#333" filter="url(#rough2)">"2+3" → 插 *2：curVal = 5 − (+3) + (+3)×2 = 5−3+6 = 8　→ "2+3*2" ✅</text>
  <text x="60" y="382" font-size="11" fill="#333" filter="url(#rough2)">"2-3" → 插 *2：curVal = −1 − (−3) + (−3)×2 = −1+3−6 = −4　→ "2-3*2" ✗</text>
  <text x="60" y="406" font-size="11" fill="#4a7a3a" filter="url(#rough2)">★ 连续乘法的链式撤销：prev' = prev × n</text>
  <text x="60" y="424" font-size="11" fill="#333" filter="url(#rough2)">"2*3" (prev=+6) → 插 *2：prev' = +6×2 = +12，下次再插 *d 时撤销的是 12 整体而非 3</text>
  <text x="60" y="440" font-size="10" fill="#888" filter="url(#rough2)">（另：拼接分支 "23"→"23+2"=25 等、整体 "232"=232 均不命中 8，此处略）</text>
</svg>
