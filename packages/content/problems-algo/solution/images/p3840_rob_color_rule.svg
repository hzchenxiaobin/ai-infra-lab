<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：相邻且同色才互斥，异色放行 → 转移多一条分支</text>

  <!-- ===== 行 1：同色相邻 → 互斥 ===== -->
  <text x="16" y="84" font-size="12.5" fill="#555" filter="url(#rough2)">同色相邻</text>
  <rect x="110" y="56" width="68" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="144" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a4a68" filter="url(#rough2)">5</text>
  <text x="144" y="95" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">色 2</text>
  <rect x="210" y="56" width="68" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="244" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a4a68" filter="url(#rough2)">3</text>
  <text x="244" y="95" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">色 2</text>
  <text x="194" y="86" text-anchor="middle" font-size="17" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="296" y="76" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">不能同时偷窃</text>
  <text x="296" y="94" font-size="10.5" fill="#888" filter="url(#rough2)">互斥只看相邻对；不相邻的同色房无冲突</text>

  <!-- ===== 行 2：异色相邻 → 放行 ===== -->
  <text x="16" y="160" font-size="12.5" fill="#555" filter="url(#rough2)">异色相邻</text>
  <rect x="110" y="132" width="68" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="144" y="154" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a4a68" filter="url(#rough2)">4</text>
  <text x="144" y="171" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">色 2</text>
  <rect x="210" y="132" width="68" height="46" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="244" y="154" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">5</text>
  <text x="244" y="171" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">色 3</text>
  <text x="194" y="162" text-anchor="middle" font-size="17" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="296" y="152" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">可以同时偷窃</text>
  <text x="296" y="170" font-size="10.5" fill="#888" filter="url(#rough2)">相邻异色放行 —— 分支③的收益来源</text>

  <!-- ===== 三分支转移 ===== -->
  <text x="280" y="216" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333" filter="url(#rough2)">偷到第 i 间房：三种选择取 max</text>
  <rect x="64" y="226" width="432" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="12.5" fill="#2a4a68" filter="url(#rough2)">① 不偷 i ：dp[i] ← dp[i−1]</text>
  <rect x="64" y="264" width="432" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="12.5" fill="#2a4a68" filter="url(#rough2)">② 偷 i、i−1 未偷 ：dp[i] ← nums[i] + dp[i−2]</text>
  <rect x="64" y="302" width="432" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">③ 偷 i、i−1 也偷 ：dp[i] ← nums[i] + dp[i−1]（colors[i] ≠ colors[i−1] 才可用）</text>

  <!-- ===== 底部结论 ===== -->
  <rect x="20" y="348" width="520" height="44" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">与 198 对照：互斥从「无条件相邻」放松为「同色相邻」→ 两分支变三分支</text>
  <text x="280" y="384" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">dp 单调不降且 nums[i] ≥ 1 ⇒ 异色时分支③支配①②：dp[i] = nums[i] + dp[i−1]</text>
</svg>
