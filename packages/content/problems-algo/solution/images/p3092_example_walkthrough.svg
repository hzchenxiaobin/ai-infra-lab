<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1 演算：nums = [2,3,2,1]，freq = [3,2,−3,1]</text>

  <!-- table header -->
  <rect x="40" y="44" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="58" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="76" y="44" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="126" y="64" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">操作 (id, f)</text>
  <rect x="176" y="44" width="170" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="261" y="64" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">cnt 变化（本步）</text>
  <rect x="346" y="44" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="406" y="64" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ms（升序）</text>
  <rect x="466" y="44" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="488" y="64" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- row 0 -->
  <rect x="40" y="78" width="36" height="48" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="58" y="107" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <rect x="76" y="78" width="100" height="48" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="126" y="107" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">(2, +3)</text>
  <rect x="176" y="78" width="170" height="48" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="261" y="107" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">2: 0 → 3</text>
  <rect x="346" y="78" width="120" height="48" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="418" y="86" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="433" y="103" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="466" y="78" width="44" height="48" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="488" y="107" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- row 1 -->
  <rect x="40" y="130" width="36" height="48" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="58" y="159" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <rect x="76" y="130" width="100" height="48" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="126" y="159" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">(3, +2)</text>
  <rect x="176" y="130" width="170" height="48" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="261" y="159" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3: 0 → 2</text>
  <rect x="346" y="130" width="120" height="48" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="380" y="138" width="30" height="24" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="395" y="155" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <rect x="418" y="138" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="433" y="155" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="466" y="130" width="44" height="48" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="488" y="159" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- row 2 -->
  <rect x="40" y="182" width="36" height="48" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="58" y="211" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <rect x="76" y="182" width="100" height="48" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="126" y="211" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">(2, −3)</text>
  <rect x="176" y="182" width="170" height="48" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="261" y="211" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">2: 3 → 0（删空）</text>
  <rect x="346" y="182" width="120" height="48" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="380" y="190" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="395" y="207" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="418" y="190" width="30" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="433" y="207" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <path d="M 421 193 L 446 211" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 446 193 L 421 211" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="466" y="182" width="44" height="48" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="488" y="211" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- row 3 -->
  <rect x="40" y="234" width="36" height="48" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="58" y="263" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">3</text>
  <rect x="76" y="234" width="100" height="48" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="126" y="263" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">(1, +1)</text>
  <rect x="176" y="234" width="170" height="48" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="261" y="263" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1: 0 → 1</text>
  <rect x="346" y="234" width="120" height="48" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="380" y="242" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="395" y="259" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="418" y="242" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="433" y="259" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="466" y="234" width="44" height="48" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="488" y="263" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="260" y="300" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">绿色 = 本步新插入的值；红叉 = 本步删掉的旧值；橙色 = 最大值</text>

  <!-- example 2 -->
  <path d="M 40 312 L 480 312" stroke="#bbb" stroke-width="1.2" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="260" y="334" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例 2：nums = [5,5,3]，freq = [2,−2,1]</text>
  <rect x="60" y="348" width="130" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="125" y="369" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">第 0 步：ms = {2}</text>
  <path d="M 192 364 L 216 364" stroke="#446688" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="220" y="348" width="170" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="305" y="369" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">第 1 步：删空 ⟹ ans = 0</text>
  <path d="M 392 364 L 416 364" stroke="#446688" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="420" y="348" width="70" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="455" y="369" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">ans = 1</text>
</svg>
