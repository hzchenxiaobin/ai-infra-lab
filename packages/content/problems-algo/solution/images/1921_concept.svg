<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：怪物 → 到达截止分钟 → 按截止排序贪心</text>

  <!-- Step 1: dist & speed -->
  <text x="40" y="58" font-size="11.5" fill="#888">怪物参数（示例 2）：</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="40" y="80" font-size="11" fill="#888" text-anchor="start">dist</text>
    <rect x="70" y="68" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="90" y="87">1</text>
    <rect x="114" y="68" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="134" y="87">1</text>
    <rect x="158" y="68" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="178" y="87">2</text>
    <rect x="202" y="68" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="222" y="87">3</text>

    <text x="40" y="112" font-size="11" fill="#888" text-anchor="start">speed</text>
    <rect x="70" y="100" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="90" y="119">1</text>
    <rect x="114" y="100" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="134" y="119">1</text>
    <rect x="158" y="100" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="178" y="119">1</text>
    <rect x="202" y="100" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="222" y="119">1</text>
  </g>

  <!-- arrow down: compute arrival -->
  <path d="M 146 138 L 146 160" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="160" y="156" font-size="11" fill="#b85450" font-weight="bold">arrival = ⌈dist/speed⌉</text>

  <!-- Step 2: arrival minutes (unsorted) -->
  <text x="40" y="180" font-size="11.5" fill="#888">到达分钟（未排序）：</text>
  <g font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="70" y="188" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="90" y="207">1</text>
    <rect x="114" y="188" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="134" y="207">1</text>
    <rect x="158" y="188" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="178" y="207">2</text>
    <rect x="202" y="188" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="222" y="207">3</text>
  </g>

  <!-- arrow down: sort -->
  <path d="M 146 224 L 146 246" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="160" y="242" font-size="11" fill="#b85450" font-weight="bold">升序排序</text>

  <!-- Step 3: sorted arrival with slot indices -->
  <text x="40" y="266" font-size="11.5" fill="#888">排序后 + 分钟槽位：</text>
  <!-- slot index row -->
  <g font-size="11" fill="#888" text-anchor="middle">
    <text x="90" y="282">k=0</text>
    <text x="134" y="282">k=1</text>
    <text x="178" y="282">k=2</text>
    <text x="222" y="282">k=3</text>
  </g>
  <g font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="70" y="290" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="90" y="309">1</text>
    <rect x="114" y="290" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="134" y="309">1</text>
    <rect x="158" y="290" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="178" y="309">2</text>
    <rect x="202" y="290" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="222" y="309">3</text>
  </g>

  <!-- verdict row -->
  <g font-size="11.5" text-anchor="middle" font-weight="bold">
    <text x="90" y="338" fill="#4a7a3a">1 &gt; 0 ✓</text>
    <text x="134" y="338" fill="#b85450">1 &gt; 1 ✗</text>
    <text x="178" y="338" fill="#888">停</text>
    <text x="222" y="338" fill="#888">停</text>
  </g>

  <!-- Divider -->
  <path d="M 40 354 L 520 354" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Conclusion -->
  <text x="280" y="378" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">贪心判定：arrival[k] &gt; k 则第 k 分钟可消灭，否则游戏结束</text>

  <rect x="60" y="392" width="440" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="411" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">答案 = 首个 arrival[k] ≤ k 时的 k（示例 2 → k=1 → 答案 1）</text>

  <!-- notes -->
  <text x="40" y="440" font-size="11" fill="#555">• arrival = ⌈dist/speed⌉：恰在第 m 分钟到达则 m 分钟不可出手，须更早消灭</text>
  <text x="40" y="454" font-size="11" fill="#555">• 排序后逐槽位匹配：第 k 分钟只能消灭排序后第 k 个，一旦失败立即停止</text>
</svg>
