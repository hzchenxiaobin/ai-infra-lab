<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 2：n=4，4 个奇点，枚举 3 种配对找两条可加边</text>

  <!-- ===== original graph ===== -->
  <text x="280" y="52" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">原图：边 (1,2)、(3,4)，4 点度数均为 1（奇）</text>

  <!-- existing edges -->
  <line x1="100" y1="90" x2="200" y2="90" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="300" y1="90" x2="400" y2="90" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- nodes (all odd = red) -->
  <circle cx="100" cy="90" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="95" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1</text>
  <circle cx="200" cy="90" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="95" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">2</text>
  <circle cx="300" cy="90" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="95" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">3</text>
  <circle cx="400" cy="90" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="95" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">4</text>

  <text x="100" y="128" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">deg1 奇</text>
  <text x="200" y="128" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">deg1 奇</text>
  <text x="300" y="128" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">deg1 奇</text>
  <text x="400" y="128" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">deg1 奇</text>

  <!-- ===== pairing A ===== -->
  <text x="40" y="160" font-size="12" fill="#333" filter="url(#rough2)">配对 A：(1,2)+(3,4)</text>
  <line x1="100" y1="186" x2="200" y2="186" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <line x1="300" y1="186" x2="400" y2="186" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="150" y="180" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">已存在 ✗</text>
  <text x="350" y="180" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">已存在 ✗</text>
  <circle cx="100" cy="186" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="190" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1</text>
  <circle cx="200" cy="186" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="190" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">2</text>
  <circle cx="300" cy="186" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="190" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3</text>
  <circle cx="400" cy="186" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="400" y="190" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="500" y="190" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">失败</text>

  <!-- ===== pairing B (winner) ===== -->
  <text x="40" y="230" font-size="12" fill="#333" filter="url(#rough2)">配对 B：(1,3)+(2,4)</text>
  <path d="M 112 252 Q 150 240, 200 230 Q 250 220, 288 252" fill="none" stroke="#4a7a3a" stroke-width="2.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M 212 252 Q 250 264, 300 230 Q 350 196, 388 252" fill="none" stroke="#4a7a3a" stroke-width="2.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="150" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">可加 ✓</text>
  <text x="350" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">可加 ✓</text>
  <circle cx="100" cy="252" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="256" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <circle cx="200" cy="252" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="256" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <circle cx="300" cy="252" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="256" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <circle cx="400" cy="252" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="256" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <text x="500" y="256" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">命中 ✓</text>

  <!-- ===== pairing C ===== -->
  <text x="40" y="300" font-size="12" fill="#333" filter="url(#rough2)">配对 C：(1,4)+(2,3)</text>
  <path d="M 112 322 Q 200 358, 388 322" fill="none" stroke="#4a7a3a" stroke-width="2.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M 212 322 Q 250 290, 288 322" fill="none" stroke="#4a7a3a" stroke-width="2.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="250" y="356" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">可加 ✓</text>
  <text x="250" y="290" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">可加 ✓</text>
  <circle cx="100" cy="322" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="326" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <circle cx="200" cy="322" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="326" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <circle cx="300" cy="322" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="326" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <circle cx="400" cy="322" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="400" y="326" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <text x="500" y="326" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">亦可 ✓</text>

  <!-- result -->
  <rect x="60" y="382" width="440" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="402" text-anchor="middle" font-size="12" fill="#2c4a26" filter="url(#rough2)">B 命中 ⇒ 加 (1,3) 与 (2,4)，4 点度数全变 2（偶）⇒ return true</text>
</svg>
