<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：二进制分解 → 指数前缀和 → 查询（前缀和差 + 快速幂）</text>

  <!-- ① Input -->
  <rect x="195" y="42" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">① 输入 n, queries</text>
  <line x1="270" y1="76" x2="270" y2="96" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 二进制分解 -->
  <rect x="96" y="100" width="348" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="120" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 二进制分解：枚举 k，若 n &gt;&gt; k &amp; 1</text>
  <text x="270" y="136" text-anchor="middle" font-size="11" fill="#446688">则 e = k 入数组（天然升序）</text>
  <line x1="270" y1="144" x2="270" y2="164" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 前缀和 -->
  <rect x="96" y="168" width="348" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="192" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 前缀和 pref[0]=0；pref[i+1]=pref[i]+e_i</text>
  <line x1="270" y1="208" x2="270" y2="228" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ◇ Diamond: 还有查询? -->
  <polygon points="270,232 372,276 270,320 168,276" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="273" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">还有查询?</text>
  <text x="270" y="289" text-anchor="middle" font-size="9.5" fill="#888">（遍历 queries）</text>

  <!-- No branch (left) → return -->
  <line x1="168" y1="276" x2="132" y2="276" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="150" y="270" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="22" y="258" width="110" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="77" y="280" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⑥ return ans</text>

  <!-- Yes branch (down) -->
  <line x1="270" y1="320" x2="270" y2="342" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="284" y="336" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ⑤ per query -->
  <rect x="70" y="346" width="400" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="366" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">⑤ s = pref[r+1] − pref[l]</text>
  <text x="270" y="384" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">ans = 2^s mod (10⁹+7)  ← 快速幂</text>

  <!-- loop back: ⑤ right → up → diamond right -->
  <path d="M 470 372 L 502 372 L 502 276 L 376 276" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="516" y="324" text-anchor="middle" font-size="9.5" fill="#888">下一查询</text>

  <!-- footer -->
  <rect x="30" y="412" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="431" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">构建 O(log n)；查询 O(log log n) 快速幂；共 q 次查询</text>
</svg>
