<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 444" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="444" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：入口判长度 → 逐字符四分桶 → 收尾查两旗</text>

  <rect x="205" y="34" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="13" filter="url(#rough2)"/>
  <text x="260" y="52" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 260 60 L 260 74" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="260,78 348,112 260,146 172,112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="110" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">长度 ≥ 3？</text>
  <text x="260" y="128" text-anchor="middle" font-size="9.5" fill="#b08040" filter="url(#rough2)">len &lt; 3 直接出局</text>

  <path d="M 172 112 L 130 112" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="146" y="104" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="26" y="96" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="76" y="116" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">return false</text>

  <path d="M 260 146 L 260 162" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="158" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <polygon points="260,166 348,200 260,234 172,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="198" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">还有字符？</text>
  <text x="260" y="216" text-anchor="middle" font-size="9.5" fill="#b08040" filter="url(#rough2)">word 扫完了吗？</text>

  <path d="M 348 200 L 390 200" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="358" y="192" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="394" y="174" width="116" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="452" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">收尾判定</text>
  <text x="452" y="209" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return hasVowel</text>
  <text x="452" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">&amp;&amp; hasCons</text>

  <path d="M 260 234 L 260 250" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="246" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="170" y="254" width="180" height="28" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="260" y="273" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">取出下一个字符 c</text>

  <path d="M 225 284 C 190 302 130 296 78 306" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 243 284 C 235 298 218 300 206 306" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 277 284 C 285 298 302 300 334 306" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 295 284 C 330 302 400 296 454 306" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="16" y="310" width="118" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="75" y="328" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">元音字母</text>
  <text x="75" y="345" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">→ hasVowel = true</text>

  <rect x="146" y="310" width="118" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="205" y="328" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">其它字母</text>
  <text x="205" y="345" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">→ hasCons = true</text>

  <rect x="276" y="310" width="118" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="335" y="328" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">数字 0-9</text>
  <text x="335" y="345" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">合法 · 不置旗</text>

  <rect x="406" y="310" width="100" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="456" y="328" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">非法字符</text>
  <text x="456" y="345" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">→ return false</text>

  <path d="M 335 354 L 335 372 L 10 372 L 10 200 L 168 200" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 75 354 L 75 372" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 205 354 L 205 372" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="18" y="250" font-size="10" fill="#888" filter="url(#rough2)">下一轮</text>

  <rect x="48" y="390" width="424" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="406" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">元音/辅音记账、数字旁观、非法出局（短路）—— 三个状态一趟扫完</text>
  <text x="260" y="423" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">最坏 O(n)：全串合法时也要扫到头才做收尾判定</text>
</svg>
