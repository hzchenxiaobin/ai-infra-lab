<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b5" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">BFS 一遍：每条边只「乘」一次</text>

  <!-- A -->
  <rect x="140" y="40" width="240" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 建邻接表 adj（n = len + 1）</text>
  <line x1="260" y1="72" x2="260" y2="84" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B -->
  <rect x="140" y="86" width="240" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② ans[0] = 1；队列 q = [0]</text>
  <line x1="260" y1="118" x2="260" y2="132" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- C decision -->
  <polygon points="260,138 340,172 260,206 180,172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="177" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">队列空？</text>

  <!-- C -> E (yes) -->
  <line x1="340" y1="172" x2="382" y2="172" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="164" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="384" y="156" width="104" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="436" y="176" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">输出 ans</text>

  <!-- C -> D (no) -->
  <line x1="260" y1="206" x2="260" y2="216" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="214" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- D -->
  <rect x="140" y="218" width="240" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="238" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 出队 u，遍历邻边 (v, w)</text>
  <line x1="260" y1="250" x2="260" y2="260" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- F highlighted -->
  <rect x="112" y="262" width="296" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="286" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">④ ans[v] = ans[u] × w mod 10⁹+7</text>
  <line x1="260" y1="300" x2="260" y2="310" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- G -->
  <rect x="175" y="312" width="170" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="331" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⑤ v 入队</text>

  <!-- loop back -->
  <path d="M 175 327 L 78 327 L 78 172 L 176 172" fill="none" stroke="#9aa7b5" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrs)" filter="url(#rough2)"/>
  <text x="112" y="317" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">下一轮</text>

  <!-- note -->
  <text x="428" y="352" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">每结点恰入队一次 ⇒ O(n)</text>
</svg>
