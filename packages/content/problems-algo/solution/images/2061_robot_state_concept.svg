<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：机器人状态 = (位置, 朝向)，有限状态必成环</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">朝向 ∈ {右,下,左,上}，状态数 = m·n·4 → 轨迹是 ρ 形（尾 + 环）</text>

  <!-- ===== Left: room grid with robot path (example 1) ===== -->
  <text x="144" y="72" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">room = [[0,0,0],[1,1,0],[0,0,0]]</text>

  <!-- cells: origin (60,88), cell 56x56 -->
  <!-- (0,0) cleaned step1 -->
  <rect x="60" y="88" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="122" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <!-- (0,1) cleaned step2 -->
  <rect x="116" y="88" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="122" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>
  <!-- (0,2) cleaned step3 -->
  <rect x="172" y="88" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="122" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- (1,0) wall -->
  <rect x="60" y="144" width="56" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="178" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">█</text>
  <!-- (1,1) wall -->
  <rect x="116" y="144" width="56" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="178" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">█</text>
  <!-- (1,2) cleaned step4 -->
  <rect x="172" y="144" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="178" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- (2,0) cleaned step7 -->
  <rect x="60" y="200" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="234" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">7</text>
  <!-- (2,1) cleaned step6 -->
  <rect x="116" y="200" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="234" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">6</text>
  <!-- (2,2) cleaned step5 -->
  <rect x="172" y="200" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="234" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">5</text>

  <!-- direction arrows on path -->
  <!-- right along row 0: 1->2->3 -->
  <path d="M 116 116 L 138 116" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 172 116 L 194 116" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- down col 2: 3->4->5 -->
  <path d="M 200 144 L 200 166" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 200 200 L 200 222" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- left along row 2: 5->6->7 -->
  <path d="M 172 228 L 150 228" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 116 228 L 94 228" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- turn markers -->
  <text x="216" y="100" font-size="10" fill="#d6a040" font-weight="bold">↳转下</text>
  <text x="216" y="212" font-size="10" fill="#d6a040" font-weight="bold">↳转左</text>

  <!-- legend -->
  <rect x="60" y="268" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="80" y="279" font-size="10" fill="#555">清扫过的空格</text>
  <rect x="160" y="268" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="180" y="279" font-size="10" fill="#555">物体/墙</text>

  <!-- ===== Right: state-cycle concept ===== -->
  <rect x="270" y="68" width="232" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="386" y="88" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">状态三元组 (i, j, k)</text>
  <text x="386" y="106" text-anchor="middle" font-size="10.5" fill="#555">i,j = 当前坐标；k = 朝向</text>
  <text x="386" y="122" text-anchor="middle" font-size="10.5" fill="#555">k=0右 / 1下 / 2左 / 3上</text>
  <text x="386" y="140" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">状态总数 ≤ m·n·4</text>

  <!-- deterministic mapping -->
  <rect x="270" y="160" width="232" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="386" y="178" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">每个状态只对应一个后继</text>
  <text x="386" y="194" text-anchor="middle" font-size="10.5" fill="#555">能走 → 前进；越界/墙 → 顺时针转</text>

  <!-- rho shape -->
  <rect x="270" y="214" width="232" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="386" y="232" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">有限状态 + 确定性 → 必然成环</text>
  <text x="386" y="250" text-anchor="middle" font-size="10.5" fill="#555">状态重复即停止，不再访问新格</text>

  <!-- footer -->
  <text x="260" y="290" text-anchor="middle" font-size="10.5" fill="#888">清扫过的格子仍可通行（只标 -1），只有墙(1)阻挡</text>
  <text x="260" y="306" text-anchor="middle" font-size="10" fill="#aaa">模拟到状态重复为止 · 去重计数清扫格 · O(m·n)</text>
</svg>
