<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：前缀最小值（瓶颈效应）+ 贪心匹配</text>

  <!-- ===== Section 1: Warehouse rooms and bottleneck ===== -->
  <text x="40" y="52" font-size="12" fill="#888">仓库 warehouse = [5, 3, 3, 4, 1]，箱子从左推入</text>

  <!-- Room labels -->
  <text x="80" y="76" text-anchor="middle" font-size="10" fill="#999">room 0</text>
  <text x="160" y="76" text-anchor="middle" font-size="10" fill="#999">room 1</text>
  <text x="240" y="76" text-anchor="middle" font-size="10" fill="#999">room 2</text>
  <text x="320" y="76" text-anchor="middle" font-size="10" fill="#999">room 3</text>
  <text x="400" y="76" text-anchor="middle" font-size="10" fill="#999">room 4</text>

  <!-- Warehouse rooms (heights as bars) -->
  <rect x="60" y="120" width="40" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="140" y="150" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="220" y="150" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="300" y="120" width="40" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="380" y="174" width="40" height="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- Height labels -->
  <text x="80" y="192" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5</text>
  <text x="160" y="192" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <text x="240" y="192" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <text x="320" y="192" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <text x="400" y="192" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <!-- Ground line -->
  <line x1="50" y1="182" x2="430" y2="182" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- Push direction arrow -->
  <path d="M 30 110 L 50 110" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="22" y="114" text-anchor="end" font-size="10" fill="#888">推入→</text>

  <!-- arrow down -->
  <path d="M 280 200 L 280 218" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Section 2: Prefix minimum ===== -->
  <text x="40" y="232" font-size="12" fill="#888">前缀最小值 minH[i] = min(warehouse[0..i])：room 3 的实际高度被 room 1 的瓶颈压到 3</text>

  <!-- Prefix min rooms -->
  <rect x="60" y="250" width="40" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="140" y="280" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="220" y="280" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="300" y="280" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="380" y="304" width="40" height="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- Prefix min labels -->
  <text x="80" y="322" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="160" y="322" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="240" y="322" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="320" y="322" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="400" y="322" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- Ground line -->
  <line x1="50" y1="312" x2="430" y2="312" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- Annotation for room 3 bottleneck -->
  <path d="M 160 275 C 220 262 280 262 300 275" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="230" y="260" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">room 1 的 3 压住了 room 3</text>

  <!-- arrow down -->
  <path d="M 280 330 L 280 348" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Section 3: Greedy matching ===== -->
  <text x="40" y="362" font-size="12" fill="#888">贪心：箱子升序 [1,3,4,4]，最小箱子优先放最右（最受限）位置</text>

  <!-- Sorted boxes -->
  <rect x="60" y="378" width="36" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="392" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="100" y="378" width="36" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="392" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="140" y="378" width="36" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="392" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="180" y="378" width="36" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="392" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <text x="40" y="392" font-size="10" fill="#888">箱子↑</text>

  <!-- Matching arrows: box 1 -> room 4, box 3 -> room 3, box 4 -> room 0 -->
  <path d="M 78 376 C 200 356 340 350 400 348" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 118 376 C 180 360 260 350 320 348" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 158 376 C 140 366 110 360 80 348" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Match labels -->
  <text x="400" y="342" text-anchor="middle" font-size="9" fill="#4a7a3a">✓1≤1</text>
  <text x="320" y="342" text-anchor="middle" font-size="9" fill="#4a7a3a">✓3≤3</text>
  <text x="80" y="342" text-anchor="middle" font-size="9" fill="#4a7a3a">✓4≤5</text>

  <!-- Result box -->
  <rect x="340" y="378" width="200" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="440" y="394" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最多放 3 个箱子</text>

  <!-- Fourth box crossed out -->
  <path d="M 198 376 L 218 402" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="240" y="418" font-size="10" fill="#b85450">第4个箱子无处可放</text>
</svg>
