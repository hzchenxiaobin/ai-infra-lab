<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="340" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 3 演算：9 个元素，含重复值 12</text>
  <text x="320" y="42" text-anchor="middle" font-size="11" fill="#888">排序去重得 8 个不同值 → 名次 1~8；两个 12 共享名次 3</text>

  <!-- Rank map: sorted unique with ranks -->
  <text x="40" y="72" font-size="11" fill="#4a7a3a" font-weight="bold">排序去重（名次表）</text>
  <g font-size="11">
    <rect x="100" y="60" width="50" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="125" y="79" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="152" y="60" width="50" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="177" y="79" text-anchor="middle" fill="#4a7a3a" font-weight="bold">9</text>
    <rect x="204" y="60" width="50" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="229" y="79" text-anchor="middle" fill="#4a7a3a" font-weight="bold">12</text>
    <rect x="256" y="60" width="50" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="281" y="79" text-anchor="middle" fill="#4a7a3a" font-weight="bold">28</text>
    <rect x="308" y="60" width="50" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="333" y="79" text-anchor="middle" fill="#4a7a3a" font-weight="bold">37</text>
    <rect x="360" y="60" width="50" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="385" y="79" text-anchor="middle" fill="#4a7a3a" font-weight="bold">56</text>
    <rect x="412" y="60" width="50" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="437" y="79" text-anchor="middle" fill="#4a7a3a" font-weight="bold">80</text>
    <rect x="464" y="60" width="50" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="489" y="79" text-anchor="middle" fill="#4a7a3a" font-weight="bold">100</text>
  </g>
  <g font-size="10" fill="#d6a040" font-weight="bold">
    <text x="125" y="104" text-anchor="middle">1</text>
    <text x="177" y="104" text-anchor="middle">2</text>
    <text x="229" y="104" text-anchor="middle">3</text>
    <text x="281" y="104" text-anchor="middle">4</text>
    <text x="333" y="104" text-anchor="middle">5</text>
    <text x="385" y="104" text-anchor="middle">6</text>
    <text x="437" y="104" text-anchor="middle">7</text>
    <text x="489" y="104" text-anchor="middle">8</text>
  </g>

  <!-- arrow down: lookup -->
  <path d="M 320 114 L 320 138" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="330" y="130" font-size="10" fill="#888">逐元素查表</text>

  <!-- Original array row -->
  <text x="40" y="166" font-size="11" fill="#446688" font-weight="bold">原数组 arr</text>
  <g font-size="12">
    <rect x="100" y="154" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="126" y="174" text-anchor="middle" fill="#446688" font-weight="bold">37</text>
    <rect x="154" y="154" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="180" y="174" text-anchor="middle" fill="#446688" font-weight="bold">12</text>
    <rect x="208" y="154" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="234" y="174" text-anchor="middle" fill="#446688" font-weight="bold">28</text>
    <rect x="262" y="154" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="288" y="174" text-anchor="middle" fill="#446688" font-weight="bold">9</text>
    <rect x="316" y="154" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="342" y="174" text-anchor="middle" fill="#446688" font-weight="bold">100</text>
    <rect x="370" y="154" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="396" y="174" text-anchor="middle" fill="#446688" font-weight="bold">56</text>
    <rect x="424" y="154" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="450" y="174" text-anchor="middle" fill="#446688" font-weight="bold">80</text>
    <rect x="478" y="154" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="504" y="174" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
    <rect x="532" y="154" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="558" y="174" text-anchor="middle" fill="#446688" font-weight="bold">12</text>
  </g>

  <!-- result row -->
  <text x="40" y="216" font-size="11" fill="#b85450" font-weight="bold">结果 result</text>
  <g font-size="12">
    <rect x="100" y="204" width="52" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="126" y="224" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <rect x="154" y="204" width="52" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="180" y="224" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <rect x="208" y="204" width="52" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="234" y="224" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <rect x="262" y="204" width="52" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="288" y="224" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="316" y="204" width="52" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="342" y="224" text-anchor="middle" fill="#b85450" font-weight="bold">8</text>
    <rect x="370" y="204" width="52" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="396" y="224" text-anchor="middle" fill="#b85450" font-weight="bold">6</text>
    <rect x="424" y="204" width="52" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="450" y="224" text-anchor="middle" fill="#b85450" font-weight="bold">7</text>
    <rect x="478" y="204" width="52" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="504" y="224" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="532" y="204" width="52" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="558" y="224" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
  </g>

  <!-- highlight note: two 12s share rank 3 -->
  <path d="M 180 234 L 180 246" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="3 2" fill="none" filter="url(#rough2)"/>
  <path d="M 558 234 L 558 246" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="3 2" fill="none" filter="url(#rough2)"/>

  <rect x="60" y="252" width="520" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="276" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">两个 12 → 同名次 3（去重后只占一个下标）</text>
  <text x="320" y="296" text-anchor="middle" font-size="11" fill="#666">名次连续 1~8，无跳号；最大值 100 名次为 8（不同值个数）</text>
  <text x="320" y="314" text-anchor="middle" font-size="10" fill="#888">输出：[5,3,4,2,8,6,7,1,3] ✓</text>
</svg>
