<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">操作真值表：s[i]←s[i] OR s[j]，s[j]←s[i] XOR s[j]</text>
  <text x="280" y="56" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">（两处都用操作前的原值，是一次同步更新）</text>

  <!-- Header -->
  <g filter="url(#rough2)" font-size="13" fill="#446688" font-weight="bold">
    <rect x="55" y="74" width="470" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="135" y="94" text-anchor="middle">输入 s[i] s[j]</text>
    <text x="265" y="94" text-anchor="middle">输出 (OR, XOR)</text>
    <text x="430" y="94" text-anchor="middle">效果</text>
  </g>
  <line x1="190" y1="74" x2="190" y2="330" stroke="#446688" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <line x1="340" y1="74" x2="340" y2="330" stroke="#446688" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <!-- Row 1: (0,0)->(0,0)  yc=125 -->
  <g filter="url(#rough2)" font-size="15">
    <rect x="95" y="107" width="34" height="34" fill="#ececec" stroke="#999" stroke-width="1.5" rx="4"/>
    <text x="112" y="129" text-anchor="middle" fill="#333">0</text>
    <rect x="140" y="107" width="34" height="34" fill="#ececec" stroke="#999" stroke-width="1.5" rx="4"/>
    <text x="157" y="129" text-anchor="middle" fill="#333">0</text>
    <line x1="200" y1="124" x2="255" y2="124" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="230" y="107" width="34" height="34" fill="#ececec" stroke="#999" stroke-width="1.5" rx="4"/>
    <text x="247" y="129" text-anchor="middle" fill="#333">0</text>
    <rect x="275" y="107" width="34" height="34" fill="#ececec" stroke="#999" stroke-width="1.5" rx="4"/>
    <text x="292" y="129" text-anchor="middle" fill="#333">0</text>
    <text x="430" y="129" text-anchor="middle" fill="#888">无变化</text>
  </g>

  <!-- Row 2: (0,1)->(1,1)  yc=180 -->
  <g filter="url(#rough2)" font-size="15">
    <rect x="95" y="162" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="112" y="184" text-anchor="middle" fill="#333">0</text>
    <rect x="140" y="162" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="157" y="184" text-anchor="middle" fill="#333">1</text>
    <line x1="200" y1="179" x2="255" y2="179" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)"/>
    <rect x="230" y="162" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <text x="247" y="184" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <rect x="275" y="162" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="292" y="184" text-anchor="middle" fill="#333">1</text>
    <text x="430" y="184" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0 → 1（传播 1）</text>
  </g>

  <!-- Row 3: (1,0)->(1,1)  yc=235 -->
  <g filter="url(#rough2)" font-size="15">
    <rect x="95" y="217" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="112" y="239" text-anchor="middle" fill="#333">1</text>
    <rect x="140" y="217" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="157" y="239" text-anchor="middle" fill="#333">0</text>
    <line x1="200" y1="234" x2="255" y2="234" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)"/>
    <rect x="230" y="217" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="247" y="239" text-anchor="middle" fill="#333">1</text>
    <rect x="275" y="217" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <text x="292" y="239" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <text x="430" y="239" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0 → 1（传播 1）</text>
  </g>

  <!-- Row 4: (1,1)->(1,0)  yc=290 -->
  <g filter="url(#rough2)" font-size="15">
    <rect x="95" y="272" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="112" y="294" text-anchor="middle" fill="#333">1</text>
    <rect x="140" y="272" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="157" y="294" text-anchor="middle" fill="#333">1</text>
    <line x1="200" y1="289" x2="255" y2="289" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)"/>
    <rect x="230" y="272" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="247" y="294" text-anchor="middle" fill="#333">1</text>
    <rect x="275" y="272" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="292" y="294" text-anchor="middle" fill="#333" font-weight="bold">0</text>
    <text x="430" y="294" text-anchor="middle" fill="#b85450" font-weight="bold">1 → 0（消减 1）</text>
  </g>

  <!-- Bottom insight box -->
  <g filter="url(#rough2)">
    <rect x="40" y="345" width="480" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
  </g>
  <text x="280" y="372" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    <tspan font-weight="bold" fill="#4a7a3a">生 1</tspan> 必须靠一个已有的 1 配对（绿行）→ <tspan font-weight="bold">全 0 无法造出 1</tspan>
  </text>
  <text x="280" y="396" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    <tspan font-weight="bold" fill="#b85450">灭 1</tspan> 必须靠两个 1 配对、且剩一个（红行）→ <tspan font-weight="bold">有 1 则永远至少剩 1 个</tspan>
  </text>
</svg>
