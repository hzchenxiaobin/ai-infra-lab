<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：每个城市的 value 被累加「度数」次 → 总和 = Σ degree·value</text>

  <!-- ===== Graph (example 1) ===== -->
  <text x="48" y="60" font-size="11.5" fill="#446688" font-weight="bold">原图：每条边贡献 value[a]+value[b]</text>

  <!-- edges -->
  <line x1="90" y1="100" x2="200" y2="170" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="200" y1="170" x2="310" y2="100" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="310" y1="100" x2="420" y2="170" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="90" y1="100" x2="310" y2="100" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="200" y1="170" x2="420" y2="170" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="310" y1="100" x2="360" y2="250" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- nodes: 0(deg2) 1(deg3) 2(deg4) 3(deg2) 4(deg1) -->
  <circle cx="90" cy="100" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="104" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="64" y="92" text-anchor="end" font-size="10" fill="#446688">度2</text>

  <circle cx="200" cy="170" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="174" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="184" y="162" text-anchor="end" font-size="10" fill="#446688">度3</text>

  <circle cx="310" cy="100" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="310" y="104" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="332" y="92" font-size="10.5" fill="#b85450" font-weight="bold">度4 ←最大</text>

  <circle cx="420" cy="170" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="420" y="174" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="442" y="162" font-size="10" fill="#446688">度2</text>

  <circle cx="360" cy="250" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="254" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="382" y="246" font-size="10" fill="#4a7a3a">度1</text>

  <!-- ===== derivation arrow ===== -->
  <path d="M 470 175 L 470 195" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Formula box ===== -->
  <rect x="40" y="270" width="480" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">合并同类项：每城的 value 出现 degree 次</text>
  <text x="280" y="316" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">Σ (value[a]+value[b])  =  Σ degree[v] · value[v]</text>
  <text x="280" y="340" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">重排不等式：度数大 → 配大值（n, n−1, …）</text>
  <text x="280" y="356" text-anchor="middle" font-size="10.5" fill="#888">度数升序排 → 依次赋 1,2,…,n 即得最大加权和</text>
</svg>
