<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：mat = [[3,1,6],[−9,5,7]]，按值升序逐格推进</text>

  <!-- Table header -->
  <rect x="30" y="40" width="46" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="53" y="60" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">步</text>
  <rect x="76" y="40" width="110" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="131" y="60" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">值（格子）</text>
  <rect x="186" y="40" width="190" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="281" y="60" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">dp = 1 + max(rM[i], cM[j])</text>
  <rect x="376" y="40" width="194" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="473" y="60" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">更新后 rM / cM</text>

  <!-- Step 1: -9 (1,0) -->
  <rect x="30" y="72" width="46" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="53" y="95" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="76" y="72" width="110" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="131" y="95" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−9 ((1,0))</text>
  <rect x="186" y="72" width="190" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="281" y="95" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 + max(0, 0) = 1</text>
  <rect x="376" y="72" width="194" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="473" y="95" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">rM=[0,1], cM=[1,0,0]</text>

  <!-- Step 2: 1 (0,1) -->
  <rect x="30" y="110" width="46" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="53" y="133" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="76" y="110" width="110" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="131" y="133" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 ((0,1))</text>
  <rect x="186" y="110" width="190" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="281" y="133" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 + max(0, 0) = 1</text>
  <rect x="376" y="110" width="194" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="473" y="133" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">rM=[1,1], cM=[1,1,0]</text>

  <!-- Step 3: 3 (0,0) -->
  <rect x="30" y="148" width="46" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="53" y="171" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="76" y="148" width="110" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="131" y="171" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3 ((0,0))</text>
  <rect x="186" y="148" width="190" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="281" y="171" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 + max(1, 1) = 2</text>
  <rect x="376" y="148" width="194" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="473" y="171" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">rM=[2,1], cM=[2,1,0]</text>

  <!-- Step 4: 5 (1,1) -->
  <rect x="30" y="186" width="46" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="53" y="209" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="76" y="186" width="110" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="131" y="209" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5 ((1,1))</text>
  <rect x="186" y="186" width="190" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="281" y="209" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 + max(1, 1) = 2</text>
  <rect x="376" y="186" width="194" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="473" y="209" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">rM=[2,2], cM=[2,2,0]</text>

  <!-- Step 5: 6 (0,2) -->
  <rect x="30" y="224" width="46" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="53" y="247" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="76" y="224" width="110" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="131" y="247" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6 ((0,2))</text>
  <rect x="186" y="224" width="190" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="281" y="247" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 + max(2, 0) = 3</text>
  <rect x="376" y="224" width="194" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="473" y="247" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">rM=[3,2], cM=[2,2,3]</text>

  <!-- Step 6: 7 (1,2) — answer -->
  <rect x="30" y="262" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="53" y="285" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="76" y="262" width="110" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="131" y="285" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">7 ((1,2))</text>
  <rect x="186" y="262" width="190" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="285" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1 + max(2, 3) = 4 ⭐</text>
  <rect x="376" y="262" width="194" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="473" y="285" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">rM=[3,4], cM=[2,2,4]</text>

  <!-- dp matrix result -->
  <text x="30" y="320" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">最终 dp 矩阵</text>

  <rect x="80" y="328" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="350" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="140" y="328" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="170" y="350" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="200" y="328" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="350" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="80" y="362" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="110" y="384" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="140" y="362" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="170" y="384" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="200" y="362" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="384" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- answer -->
  <rect x="290" y="340" width="280" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="365" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">max(dp) = <tspan font-weight="bold" fill="#b85450">4</tspan> ⭐  对应路径 −9→3→6→7</text>

  <!-- note -->
  <rect x="30" y="404" width="540" height="50" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="42" y="424" font-size="11" fill="#888" filter="url(#rough2)">每步只读「旧」rM[i] / cM[j] 两值，O(1) 算 dp；同值格成批算完再回写，保证严格递增。</text>
  <text x="42" y="444" font-size="11" fill="#888" filter="url(#rough2)">全表 m·n 个格，排序 O(mn log mn) + 扫描 O(mn)，rM/cM 仅 O(m+n) 空间。</text>
</svg>
