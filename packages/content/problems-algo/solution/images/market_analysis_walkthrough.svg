<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：4 用户 × 6 订单 → LEFT JOIN(2019) → COUNT</text>

  <!-- ===== Step ①: Orders filtered to 2019 via ON ===== -->
  <text x="105" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① Orders 表（右表）</text>
  <rect x="20" y="58" width="180" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="45" y="73" font-size="7.5" fill="#446688" font-weight="bold">order_id</text>
  <text x="100" y="73" font-size="7.5" fill="#446688" font-weight="bold">order_date</text>
  <text x="155" y="73" font-size="7.5" fill="#446688" font-weight="bold">buyer_id</text>
  <line x1="68" y1="58" x2="68" y2="80" stroke="#446688" stroke-width="0.7" filter="url(#rough2)"/>
  <line x1="130" y1="58" x2="130" y2="80" stroke="#446688" stroke-width="0.7" filter="url(#rough2)"/>

  <rect x="20" y="80" width="180" height="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="45" y="92" text-anchor="middle" font-size="8" fill="#333">1</text>
  <text x="100" y="92" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">2019-08-01</text>
  <text x="155" y="92" text-anchor="middle" font-size="8" fill="#333">1</text>

  <rect x="20" y="95" width="180" height="15" fill="#fce4ec" stroke="#bbb" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="45" y="107" text-anchor="middle" font-size="8" fill="#888">2</text>
  <text x="100" y="107" text-anchor="middle" font-size="7.5" fill="#888">2018-08-02</text>
  <text x="155" y="107" text-anchor="middle" font-size="8" fill="#888">1</text>

  <rect x="20" y="110" width="180" height="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="45" y="122" text-anchor="middle" font-size="8" fill="#333">3</text>
  <text x="100" y="122" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">2019-08-03</text>
  <text x="155" y="122" text-anchor="middle" font-size="8" fill="#333">2</text>

  <rect x="20" y="125" width="180" height="15" fill="#fce4ec" stroke="#bbb" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="45" y="137" text-anchor="middle" font-size="8" fill="#888">4</text>
  <text x="100" y="137" text-anchor="middle" font-size="7.5" fill="#888">2018-08-04</text>
  <text x="155" y="137" text-anchor="middle" font-size="8" fill="#888">4</text>

  <rect x="20" y="140" width="180" height="15" fill="#fce4ec" stroke="#bbb" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="45" y="152" text-anchor="middle" font-size="8" fill="#888">5</text>
  <text x="100" y="152" text-anchor="middle" font-size="7.5" fill="#888">2018-08-04</text>
  <text x="155" y="152" text-anchor="middle" font-size="8" fill="#888">3</text>

  <rect x="20" y="155" width="180" height="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="45" y="167" text-anchor="middle" font-size="8" fill="#333">6</text>
  <text x="100" y="167" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">2019-08-05</text>
  <text x="155" y="167" text-anchor="middle" font-size="8" fill="#333">2</text>

  <text x="110" y="184" text-anchor="middle" font-size="7.5" fill="#b85450">ON YEAR=2019 → 只留绿框 3 行</text>

  <!-- arrow ① → ② -->
  <path d="M202 120 L242 120" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="222" y="113" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">①</text>
  <text x="222" y="132" text-anchor="middle" font-size="6.5" fill="#d6a040">LEFT JOIN</text>

  <!-- ===== Step ②: JOIN result with NULLs ===== -->
  <text x="335" y="52" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">② LEFT JOIN 结果（保留全部用户）</text>
  <rect x="245" y="58" width="180" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="73" font-size="8" fill="#b85450" font-weight="bold">user_id</text>
  <text x="335" y="73" font-size="8" fill="#b85450" font-weight="bold">join_date</text>
  <text x="390" y="73" font-size="7.5" fill="#b85450" font-weight="bold">order_id</text>
  <line x1="320" y1="58" x2="320" y2="80" stroke="#b85450" stroke-width="0.7" filter="url(#rough2)"/>
  <line x1="365" y1="58" x2="365" y2="80" stroke="#b85450" stroke-width="0.7" filter="url(#rough2)"/>

  <rect x="245" y="80" width="180" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="285" y="92" text-anchor="middle" font-size="8" fill="#333">1</text>
  <text x="335" y="92" text-anchor="middle" font-size="7.5" fill="#333">2018-01-01</text>
  <text x="390" y="92" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">1</text>

  <rect x="245" y="96" width="180" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="285" y="108" text-anchor="middle" font-size="8" fill="#333">2</text>
  <text x="335" y="108" text-anchor="middle" font-size="7.5" fill="#333">2018-02-09</text>
  <text x="390" y="108" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">3</text>

  <rect x="245" y="112" width="180" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="285" y="124" text-anchor="middle" font-size="8" fill="#333">2</text>
  <text x="335" y="124" text-anchor="middle" font-size="7.5" fill="#333">2018-02-09</text>
  <text x="390" y="124" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">6</text>

  <rect x="245" y="128" width="180" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="285" y="140" text-anchor="middle" font-size="8" fill="#333">3</text>
  <text x="335" y="140" text-anchor="middle" font-size="7.5" fill="#333">2018-01-19</text>
  <text x="390" y="140" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">NULL</text>

  <rect x="245" y="144" width="180" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="285" y="156" text-anchor="middle" font-size="8" fill="#333">4</text>
  <text x="335" y="156" text-anchor="middle" font-size="7.5" fill="#333">2018-05-21</text>
  <text x="390" y="156" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">NULL</text>

  <text x="335" y="174" text-anchor="middle" font-size="7.5" fill="#b85450">用户 3、4 的 2018 单被 ON 过滤 → NULL</text>

  <!-- arrow ② → ③ -->
  <path d="M427 120 L462 120" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="445" y="113" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">②</text>
  <text x="445" y="132" text-anchor="middle" font-size="6.5" fill="#d6a040">COUNT</text>

  <!-- ===== Step ③: Final result ===== -->
  <text x="540" y="52" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">③ 最终结果</text>
  <rect x="465" y="58" width="135" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="495" y="73" font-size="7.5" fill="#4a7a3a" font-weight="bold">buyer_id</text>
  <text x="555" y="73" font-size="6.5" fill="#4a7a3a" font-weight="bold">orders_in_2019</text>
  <line x1="525" y1="58" x2="525" y2="80" stroke="#4a7a3a" stroke-width="0.7" filter="url(#rough2)"/>

  <rect x="465" y="80" width="135" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="495" y="93" text-anchor="middle" font-size="8.5" fill="#333" font-weight="bold">1</text>
  <text x="555" y="93" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>

  <rect x="465" y="98" width="135" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="495" y="111" text-anchor="middle" font-size="8.5" fill="#333" font-weight="bold">2</text>
  <text x="555" y="111" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>

  <rect x="465" y="116" width="135" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="495" y="129" text-anchor="middle" font-size="8.5" fill="#333" font-weight="bold">3</text>
  <text x="555" y="129" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">0</text>

  <rect x="465" y="134" width="135" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="495" y="147" text-anchor="middle" font-size="8.5" fill="#333" font-weight="bold">4</text>
  <text x="555" y="147" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">0</text>

  <text x="533" y="166" text-anchor="middle" font-size="7" fill="#b85450">NULL → COUNT=0</text>

  <!-- ===== Bottom: per-user reasoning ===== -->
  <rect x="20" y="200" width="580" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="40" y="218" font-size="10" fill="#333">关键：<tspan fill="#b85450" font-weight="bold">COUNT(o.order_id)</tspan> 只数非 NULL 值 → 用户 3、4 虽有行但 order_id 为 NULL，自然计 0</text>
  <text x="40" y="232" font-size="10" fill="#333">⚠️ 若误用 <tspan fill="#b85450">COUNT(*)</tspan>，NULL 行也算 1 行 → 用户 3、4 会错算成 1 单</text>

  <!-- per-user breakdown -->
  <rect x="20" y="246" width="580" height="220" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="266" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">逐用户推演</text>

  <text x="40" y="288" font-size="9.5" fill="#333">• <tspan fill="#4a7a3a" font-weight="bold">用户 1</tspan>（2018-01-01 加入）：2019 年作为买家 1 单（order 1，2019-08-01）→ orders_in_2019 = <tspan fill="#4a7a3a" font-weight="bold">1</tspan></text>
  <text x="40" y="308" font-size="9.5" fill="#333">• <tspan fill="#4a7a3a" font-weight="bold">用户 2</tspan>（2018-02-09 加入）：2019 年作为买家 2 单（order 3，2019-08-03；order 6，2019-08-05）→ <tspan fill="#4a7a3a" font-weight="bold">2</tspan></text>
  <text x="40" y="328" font-size="9.5" fill="#333">• <tspan fill="#b85450" font-weight="bold">用户 3</tspan>（2018-01-19 加入）：只有 order 5（2018-08-04，非 2019）→ NULL → <tspan fill="#b85450" font-weight="bold">0</tspan></text>
  <text x="40" y="348" font-size="9.5" fill="#333">• <tspan fill="#b85450" font-weight="bold">用户 4</tspan>（2018-05-21 加入）：只有 order 4（2018-08-04，非 2019）→ NULL → <tspan fill="#b85450" font-weight="bold">0</tspan></text>

  <text x="40" y="372" font-size="9.5" fill="#333">• ⚠️ <tspan fill="#b85450">order 2</tspan>（buyer 1，2018）虽属用户 1，但 2018 年不计入 2019 统计 → 被 ON 过滤掉</text>
  <text x="40" y="390" font-size="9.5" fill="#333">• <tspan fill="#888">join_date 与订单年份无关</tspan>：用户 1 的 join_date 是 2018，但 2019 年订单仍算他的</text>
  <text x="40" y="408" font-size="9.5" fill="#333">• <tspan fill="#446688" font-weight="bold">buyer_id = user_id</tspan>：用户作为"买家"时，buyer_id 即其 user_id（题目只数买家订单，不数卖家）</text>
  <text x="40" y="426" font-size="9.5" fill="#333">• <tspan fill="#888">seller_id / item_id / Items 表</tspan> 本题均用不到，仅市场分析 II（按品牌统计）才需</text>
  <text x="40" y="446" font-size="9.5" fill="#333">• 输出列名 <tspan fill="#d6a040" font-weight="bold">buyer_id</tspan>（非 user_id）：题目要求重命名，值仍是用户 id</text>
</svg>
