<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：叉积符号序列对比</text>

  <!-- ===== 示例①：凸 ===== -->
  <text x="24" y="58" font-size="12.5" fill="#4a7a3a" font-weight="bold">① [[0,0],[0,4],[4,4],[4,0]]</text>
  <text x="232" y="58" font-size="11" fill="#666">正方形（顺时针）</text>

  <!-- 小多边形图 -->
  <polygon points="40,160 40,96 104,96 104,160" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="40" cy="160" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="40" cy="96" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="104" cy="96" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="104" cy="160" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="28" y="172" font-size="10" fill="#555">0,0</text>
  <text x="28" y="92" font-size="10" fill="#555">0,4</text>
  <text x="108" y="92" font-size="10" fill="#555">4,4</text>
  <text x="108" y="172" font-size="10" fill="#555">4,0</text>

  <!-- 叉积序列 -->
  <text x="150" y="92" font-size="11" fill="#666">连续三元组（含首尾衔接）的叉积：</text>
  <rect x="150" y="104" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="178" y="121" text-anchor="middle" font-size="11" fill="#333">−16</text>
  <rect x="214" y="104" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="242" y="121" text-anchor="middle" font-size="11" fill="#333">−16</text>
  <rect x="278" y="104" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="306" y="121" text-anchor="middle" font-size="11" fill="#333">−16</text>
  <rect x="342" y="104" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="370" y="121" text-anchor="middle" font-size="11" fill="#333">−16</text>

  <text x="412" y="121" font-size="11" fill="#4a7a3a">符号：全 − （同号）</text>

  <rect x="150" y="138" width="86" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="10" filter="url(#rough2)"/>
  <text x="193" y="156" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">→ true</text>
  <text x="246" y="156" font-size="11" fill="#666">四个顶点全右转，无冲突</text>

  <path d="M 24 188 L 556 188" stroke="#eee" stroke-width="1.4" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <!-- ===== 示例②：凹 ===== -->
  <text x="24" y="214" font-size="12.5" fill="#b85450" font-weight="bold">② [[0,0],[0,4],[2,2],[4,4],[4,0]]</text>
  <text x="276" y="214" font-size="11" fill="#666">顶部凹进（顶点 2,2）</text>

  <!-- 小多边形图：BL->TL->中凹->TR->BR -->
  <polygon points="40,316 40,252 72,284 104,252 104,316" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="40" cy="316" r="4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="40" cy="252" r="4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="72" cy="284" r="5" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="104" cy="252" r="4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="104" cy="316" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="22" y="328" font-size="10" fill="#555">0,0</text>
  <text x="22" y="248" font-size="10" fill="#555">0,4</text>
  <text x="74" y="276" font-size="10" fill="#d6a040" font-weight="bold">2,2</text>
  <text x="108" y="248" font-size="10" fill="#555">4,4</text>
  <text x="108" y="328" font-size="10" fill="#555">4,0</text>

  <!-- 叉积序列 -->
  <text x="150" y="248" font-size="11" fill="#666">连续三元组的叉积：</text>
  <rect x="150" y="260" width="48" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="174" y="277" text-anchor="middle" font-size="11" fill="#333">−8</text>
  <rect x="206" y="260" width="48" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="277" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">+8</text>
  <rect x="262" y="260" width="48" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="286" y="277" text-anchor="middle" font-size="11" fill="#333">−8</text>
  <rect x="318" y="260" width="56" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="346" y="277" text-anchor="middle" font-size="11" fill="#333">−16</text>
  <rect x="382" y="260" width="56" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="410" y="277" text-anchor="middle" font-size="11" fill="#333">−16</text>

  <path d="M 214 264 L 218 250 L 226 250" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="248" font-size="10.5" fill="#d6a040">★此处左转，与其余冲突</text>

  <rect x="150" y="294" width="86" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="10" filter="url(#rough2)"/>
  <text x="193" y="312" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">→ false</text>
  <text x="246" y="312" font-size="11" fill="#666">hasPos 与 hasNeg 同时为真</text>

  <!-- 结论框 -->
  <rect x="24" y="356" width="532" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="40" y="378" font-size="12" fill="#7a5415" font-weight="bold">关键结论</text>
  <text x="40" y="397" font-size="11" fill="#555">• 凸性 = 拐弯方向一致 = 叉积同号；只要正、负同时出现即存在凹角，返回 false。</text>
  <text x="40" y="413" font-size="11" fill="#555">• 叉积为 0（共线点）不改变方向，直接跳过；下标对 n 取模以衔接首尾闭合处。</text>
  <text x="40" y="425" font-size="10.5" fill="#999">坐标 ≤ 10⁴，叉积 ≤ 8×10⁸，C++ 用 long long 防溢出更稳妥。</text>
</svg>
