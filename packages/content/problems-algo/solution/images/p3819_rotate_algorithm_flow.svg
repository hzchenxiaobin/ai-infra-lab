<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟收集 + 一次取模 + 一趟回填</text>

  <!-- Start -->
  <rect x="185" y="36" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="260" y="54" text-anchor="middle" font-size="11" fill="#335" filter="url(#rough2)">开始：nums, k</text>
  <path d="M 260 64 L 260 80" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 1 -->
  <rect x="150" y="84" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="102" text-anchor="middle" font-size="11" fill="#335" font-weight="bold" filter="url(#rough2)">① 扫描收集非负下标 idx</text>
  <text x="260" y="119" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">x ≥ 0 入链（0 也参与轮替！）</text>
  <path d="M 260 128 L 260 144" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Note C: example -->
  <rect x="386" y="86" width="122" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="447" y="104" text-anchor="middle" font-size="8.5" fill="#335" filter="url(#rough2)">示例1：idx = [0, 2]</text>
  <text x="447" y="121" text-anchor="middle" font-size="8.5" fill="#335" filter="url(#rough2)">vals = [1, 3]，k ← 1</text>

  <!-- Diamond: m == 0? -->
  <polygon points="260,146 348,174 260,202 172,174" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="178" text-anchor="middle" font-size="11" fill="#335" font-weight="bold" filter="url(#rough2)">m == 0 ?</text>

  <!-- Yes branch -->
  <path d="M 348 174 L 380 174" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="362" y="166" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="384" y="156" width="126" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="447" y="172" text-anchor="middle" font-size="10" fill="#335" filter="url(#rough2)">返回原数组</text>
  <text x="447" y="187" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">（全负数·防除零）</text>
  <path d="M 447 194 L 447 364 L 341 364" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5 3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- No branch -->
  <path d="M 260 202 L 260 224" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="272" y="218" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- Note A -->
  <rect x="14" y="88" width="118" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="73" y="106" text-anchor="middle" font-size="8.5" fill="#335" filter="url(#rough2)">负数下标不入 idx</text>
  <text x="73" y="123" text-anchor="middle" font-size="8.5" fill="#335" filter="url(#rough2)">回填天然跳过</text>

  <!-- Step 2 -->
  <rect x="150" y="228" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="11" fill="#335" font-weight="bold" filter="url(#rough2)">② k %= m（压进 [0, m)）</text>
  <path d="M 260 260 L 260 276" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Note B -->
  <rect x="14" y="226" width="118" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="73" y="244" text-anchor="middle" font-size="8.5" fill="#335" filter="url(#rough2)">k ≤ 1e5，m 可能为 1</text>
  <text x="73" y="259" text-anchor="middle" font-size="8.5" fill="#335" filter="url(#rough2)">⇒ 取模后 0 ≤ k &lt; m</text>
  <text x="73" y="274" text-anchor="middle" font-size="8.5" fill="#335" filter="url(#rough2)">m = 0 已早退防除零</text>

  <!-- Step 3 -->
  <rect x="138" y="280" width="244" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="11" fill="#335" font-weight="bold" filter="url(#rough2)">③ for i = 0 .. m-1：</text>
  <text x="260" y="315" text-anchor="middle" font-size="10" fill="#335" filter="url(#rough2)">nums[idx[i]] ← vals[(i+k) % m]</text>
  <text x="260" y="328" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">负数槽位不读不写，天然不动</text>
  <path d="M 260 332 L 260 348" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- End -->
  <rect x="185" y="352" width="150" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="260" y="370" text-anchor="middle" font-size="11" fill="#335" filter="url(#rough2)">返回 nums</text>
</svg>
