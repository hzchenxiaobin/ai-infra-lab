<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 4，穷举乘客 1 的四种选择</text>

  <!-- ===== Case 1: P1 picks seat 1 ===== -->
  <rect x="20" y="42" width="250" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="34" y="60" font-size="11" fill="#4a7a3a" font-weight="bold">情况 A：P1 选座位 1（1/4）</text>
  <text x="34" y="78" font-size="10" fill="#888">P2→2 ✓, P3→3 ✓, P4→4 ✓</text>
  <text x="34" y="96" font-size="10" fill="#888">无冲突，全部坐对</text>
  <text x="34" y="110" font-size="11" fill="#4a7a3a" font-weight="bold">P(成功) = 1 → 贡献 1/4</text>

  <!-- ===== Case 2: P1 picks seat 4 ===== -->
  <rect x="290" y="42" width="250" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="304" y="60" font-size="11" fill="#b85450" font-weight="bold">情况 B：P1 选座位 4（1/4）</text>
  <text x="304" y="78" font-size="10" fill="#888">P2→2 ✓, P3→3 ✓</text>
  <text x="304" y="96" font-size="10" fill="#888">但 P4 的座位已被 P1 占</text>
  <text x="304" y="110" font-size="11" fill="#b85450" font-weight="bold">P(成功) = 0 → 贡献 0</text>

  <!-- ===== Case 3: P1 picks seat 2 ===== -->
  <rect x="20" y="128" width="520" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="34" y="146" font-size="11" fill="#d6a040" font-weight="bold">情况 C：P1 选座位 2（1/4）→ P2 被迫从 {1,3,4} 随机选</text>

  <!-- sub-case C1 -->
  <rect x="34" y="154" width="150" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="109" y="170" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">P2 选座位 1（1/3）</text>
  <text x="109" y="184" text-anchor="middle" font-size="9" fill="#888">P3→3, P4→4 ✓ 成功</text>

  <!-- sub-case C2 -->
  <rect x="200" y="154" width="160" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="170" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">P2 选座位 3（1/3）</text>
  <text x="280" y="184" text-anchor="middle" font-size="9" fill="#888">P3 从 {1,4} 选</text>

  <!-- sub-case C3 -->
  <rect x="376" y="154" width="150" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="451" y="170" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">P2 选座位 4（1/3）</text>
  <text x="451" y="184" text-anchor="middle" font-size="9" fill="#888">P3→3, P4 失败 ✗</text>

  <!-- expand C2: P3 picks 1 or 4 -->
  <path d="M 280 192 L 280 206" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="210" width="74" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="237" y="224" text-anchor="middle" font-size="9" fill="#4a7a3a">P3→1(1/2) ✓</text>

  <rect x="286" y="210" width="74" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="323" y="224" text-anchor="middle" font-size="9" fill="#b85450">P3→4(1/2) ✗</text>

  <!-- C subtotal -->
  <text x="34" y="230" font-size="10" fill="#d6a040" font-weight="bold">小计：1/3 + 1/3·1/2 = 1/2 → 贡献 1/4·1/2 = 1/8</text>

  <!-- ===== Case 4: P1 picks seat 3 ===== -->
  <rect x="20" y="250" width="520" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="34" y="268" font-size="11" fill="#d6a040" font-weight="bold">情况 D：P1 选座位 3（1/4）→ P2→2 ✓, P3 被迫从 {1,4} 随机选</text>

  <rect x="34" y="278" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="109" y="294" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">P3 选座位 1（1/2）</text>
  <text x="109" y="307" text-anchor="middle" font-size="9" fill="#888">P4→4 ✓ 成功</text>

  <rect x="200" y="278" width="150" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="275" y="294" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">P3 选座位 4（1/2）</text>
  <text x="275" y="307" text-anchor="middle" font-size="9" fill="#888">P4 失败 ✗</text>

  <text x="376" y="299" font-size="10" fill="#d6a040" font-weight="bold">小计：1/2</text>
  <text x="376" y="313" font-size="10" fill="#d6a040" font-weight="bold">→ 贡献 1/4·1/2 = 1/8</text>

  <!-- ===== Total ===== -->
  <path d="M 290 324 L 290 342" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="348" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">汇总：f(4) = 1/4·1 + 1/4·0 + 1/8 + 1/8</text>
  <text x="280" y="386" text-anchor="middle" font-size="12" fill="#333">= 1/4 + 0 + 1/4 = 1/2  ✓</text>
  <text x="280" y="398" text-anchor="middle" font-size="9" fill="#888">（递推公式 f(4) = 1/4·[1 + f(2) + f(3)] = 1/4·[1 + 1/2 + 1/2] = 1/4·2 = 1/2 一致）</text>

  <!-- ===== Insight box ===== -->
  <rect x="40" y="414" width="480" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="430" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">观察：每次冲突都只在"座位1 vs 座位n"间二选一</text>
  <text x="280" y="445" text-anchor="middle" font-size="10" fill="#888">→ 对称性使概率恒为 1/2，与 n 无关</text>
</svg>
