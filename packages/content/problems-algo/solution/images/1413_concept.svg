<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：最低前缀和决定 startValue——把它抬到 1 即可</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">startValue ≥ 1 − min(prefix)，最紧约束来自前缀和的“最低谷”</text>

  <!-- nums label -->
  <text x="40" y="80" font-size="10.5" fill="#666">nums</text>

  <!-- nums boxes: -3, 2, -3, 4, 2  (w=52 h=40 gap=8 start x=134) -->
  <rect x="134" y="58" width="52" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="84" text-anchor="middle" font-size="14" fill="#333">−3</text>
  <rect x="194" y="58" width="52" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="84" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="254" y="58" width="52" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="84" text-anchor="middle" font-size="14" fill="#333">−3</text>
  <rect x="314" y="58" width="52" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="84" text-anchor="middle" font-size="14" fill="#333">4</text>
  <rect x="374" y="58" width="52" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="400" y="84" text-anchor="middle" font-size="14" fill="#333">2</text>

  <!-- arrow down -->
  <path d="M 280 100 L 280 116" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="112" font-size="10" fill="#666">累加得前缀和</text>

  <!-- prefix label -->
  <text x="40" y="148" font-size="10.5" fill="#666">prefix</text>

  <!-- prefix boxes: -3, -1, -4(min), 0, 2 -->
  <rect x="134" y="126" width="52" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="152" text-anchor="middle" font-size="14" fill="#333">−3</text>
  <rect x="194" y="126" width="52" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="152" text-anchor="middle" font-size="14" fill="#333">−1</text>
  <!-- min highlighted red -->
  <rect x="254" y="126" width="52" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="280" y="152" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">−4</text>
  <text x="280" y="122" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">★ 最低谷</text>
  <rect x="314" y="126" width="52" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="152" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="374" y="126" width="52" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="400" y="152" text-anchor="middle" font-size="14" fill="#333">2</text>

  <!-- arrow down: +startValue -->
  <path d="M 280 168 L 280 184" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="292" y="180" font-size="10" fill="#4a7a3a" font-weight="bold">+ startValue = 5</text>

  <!-- lifted label -->
  <text x="40" y="216" font-size="10.5" fill="#666">+5 后</text>

  <!-- lifted boxes: 2, 4, 1, 5, 7  all >=1 green -->
  <rect x="134" y="194" width="52" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="220" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="194" y="194" width="52" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="220" text-anchor="middle" font-size="14" fill="#333">4</text>
  <!-- the one that touches threshold exactly = 1 -->
  <rect x="254" y="194" width="52" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="280" y="220" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="280" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a">恰好=1</text>
  <rect x="314" y="194" width="52" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="220" text-anchor="middle" font-size="14" fill="#333">5</text>
  <rect x="374" y="194" width="52" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="400" y="220" text-anchor="middle" font-size="14" fill="#333">7</text>

  <!-- formula box -->
  <rect x="80" y="256" width="400" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">startValue = 1 − min(prefix)</text>
  <text x="280" y="294" text-anchor="middle" font-size="11" fill="#555">= 1 − (−4) = 5，最低谷 −4 被抬到恰好 1，其余更高</text>

  <!-- footer note -->
  <rect x="80" y="318" width="400" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="10.5" fill="#555">只关心最低谷：它满足 ≥1 时，所有更高的前缀和自然满足</text>
  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#888">min(prefix) ≤ 0 恒成立（含“空前缀”0），故结果 ≥ 1 无需再取 max</text>
</svg>
