<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="20" y="26" font-size="13" fill="#333" filter="url(#rough2)">流程：特判 → 双指针决斗求最大后缀 → 截断，均摊 O(n)</text>

  <!-- start -->
  <rect x="185" y="38" width="150" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="12" fill="#2d4d22" filter="url(#rough2)">开始：word, numFriends</text>
  <path d="M260,68 L260,80" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1: numFriends == 1 ? -->
  <polygon points="260,84 372,120 260,156 148,120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">numFriends = 1 ?</text>
  <text x="260" y="134" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">（盒子只有整个 word）</text>

  <text x="378" y="112" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M372,120 L396,120" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="400" y="103" width="100" height="34" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="125" text-anchor="middle" font-size="12.5" fill="#2d4d22" filter="url(#rough2)">返回 word</text>

  <text x="270" y="172" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M260,156 L260,180" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="150" y="184" width="220" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="204" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">K ← n − numFriends + 1</text>
  <text x="260" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i = 0，j = 1，k = 0</text>
  <path d="M260,230 L260,242" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 2: j + k < n ? -->
  <polygon points="260,246 372,282 260,318 148,282" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">j + k &lt; n ?</text>
  <text x="260" y="296" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">还有得比？</text>

  <text x="378" y="274" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M372,282 L394,282" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="398" y="262" width="118" height="40" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="457" y="282" text-anchor="middle" font-size="11" fill="#2d4d22" filter="url(#rough2)">返回 word[i : i+K]</text>
  <text x="457" y="297" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">（S 比 K 短时自动到串尾）</text>

  <text x="270" y="334" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M260,318 L260,338" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- duel loop body -->
  <rect x="60" y="342" width="350" height="86" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="362" font-size="12" fill="#446688" filter="url(#rough2)">循环体：比较 word[i+k] 与 word[j+k]</text>
  <text x="75" y="382" font-size="11.5" fill="#333" filter="url(#rough2)">相等 → k += 1（继续向后比）</text>
  <text x="75" y="400" font-size="11.5" fill="#333" filter="url(#rough2)">i 侧小 → i += k+1，k = 0（i ≥ j 则 j = i+1）</text>
  <text x="75" y="418" font-size="11.5" fill="#333" filter="url(#rough2)">j 侧小 → j += k+1，k = 0</text>

  <!-- loop back -->
  <path d="M60,385 L24,385 L24,282 L146,282" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="28" y="270" font-size="10" fill="#666" filter="url(#rough2)">回到条件判断</text>

  <!-- bottom note -->
  <rect x="40" y="440" width="440" height="26" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="458" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i、j 只前进不后退，一次失配淘汰 k+1 个起点 → 均摊 O(n)</text>
</svg>
