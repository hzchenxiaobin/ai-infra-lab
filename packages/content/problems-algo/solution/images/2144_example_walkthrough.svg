<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：costs = [6,5,7,9,2,2]</text>

  <rect x="40" y="44" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#333">排序降序 → [9, 7, 6, 5, 2, 2]</text>

  <rect x="40" y="86" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="103" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">i</text>
  <rect x="90" y="86" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="103" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">costs[i]</text>
  <rect x="150" y="86" width="70" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="103" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">(i+1)%3</text>
  <rect x="220" y="86" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="103" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">操作</text>
  <rect x="300" y="86" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="103" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">total</text>
  <rect x="390" y="86" width="130" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="455" y="103" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">备注</text>

  <rect x="40" y="114" width="50" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="131" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="90" y="114" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="131" text-anchor="middle" font-size="11" fill="#333">9</text>
  <rect x="150" y="114" width="70" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="185" y="131" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="220" y="114" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="260" y="131" text-anchor="middle" font-size="11" fill="#4a7a3a">付费</text>
  <rect x="300" y="114" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="345" y="131" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">9</text>
  <rect x="390" y="114" width="130" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="455" y="131" text-anchor="middle" font-size="10" fill="#888">第1组第1个</text>

  <rect x="40" y="142" width="50" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="159" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="90" y="142" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="159" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="150" y="142" width="70" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="185" y="159" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="220" y="142" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="260" y="159" text-anchor="middle" font-size="11" fill="#4a7a3a">付费</text>
  <rect x="300" y="142" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="345" y="159" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">16</text>
  <rect x="390" y="142" width="130" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="455" y="159" text-anchor="middle" font-size="10" fill="#888">第1组第2个</text>

  <rect x="40" y="170" width="50" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="187" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="90" y="170" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="187" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="150" y="170" width="70" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="185" y="187" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="220" y="170" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="260" y="187" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">免费</text>
  <rect x="300" y="170" width="90" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="345" y="187" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">16</text>
  <rect x="390" y="170" width="130" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="455" y="187" text-anchor="middle" font-size="10" fill="#b85450">第1组第3个→免费</text>

  <rect x="40" y="198" width="50" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="215" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="90" y="198" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="215" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="150" y="198" width="70" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="185" y="215" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="220" y="198" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="260" y="215" text-anchor="middle" font-size="11" fill="#4a7a3a">付费</text>
  <rect x="300" y="198" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="345" y="215" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">21</text>
  <rect x="390" y="198" width="130" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="455" y="215" text-anchor="middle" font-size="10" fill="#888">第2组第1个</text>

  <rect x="40" y="226" width="50" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="243" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="90" y="226" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="243" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="150" y="226" width="70" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="185" y="243" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="220" y="226" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="260" y="243" text-anchor="middle" font-size="11" fill="#4a7a3a">付费</text>
  <rect x="300" y="226" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="345" y="243" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">23</text>
  <rect x="390" y="226" width="130" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="455" y="243" text-anchor="middle" font-size="10" fill="#888">第2组第2个</text>

  <rect x="40" y="254" width="50" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="271" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="90" y="254" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="271" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="150" y="254" width="70" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="185" y="271" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="220" y="254" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="260" y="271" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">免费</text>
  <rect x="300" y="254" width="90" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="345" y="271" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">23</text>
  <rect x="390" y="254" width="130" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="455" y="271" text-anchor="middle" font-size="10" fill="#b85450">第2组第3个→免费</text>

  <rect x="40" y="300" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="12" fill="#333">付费：9 + 7 + 5 + 2 = 23</text>
  <text x="280" y="333" text-anchor="middle" font-size="11" fill="#b85450">免费：6 + 2 = 8（每组第 3 个最小值）</text>

  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#888">结果 = 23，与示例 2 一致 ✓</text>
</svg>
