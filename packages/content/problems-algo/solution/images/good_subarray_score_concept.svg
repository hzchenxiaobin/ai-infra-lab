<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心直觉：从 k 出发向两侧扩展，最小值是"地板"</text>

  <!-- Array label -->
  <text x="60" y="56" font-size="11" fill="#888">nums = [1, 4, 3, 7, 4, 5],  k = 3</text>

  <!-- Ground line -->
  <line x1="90" y1="300" x2="410" y2="300" stroke="#7f8c8d" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- Bars: scale 1 unit = 18px, bar width=42, gap=8, start x=100 -->
  <!-- bar 0: h=1 -->
  <rect x="100" y="282" width="42" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="121" y="296" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="121" y="316" text-anchor="middle" font-size="9" fill="#888">i=0</text>

  <!-- bar 1: h=4 -->
  <rect x="150" y="228" width="42" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="171" y="296" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="171" y="316" text-anchor="middle" font-size="9" fill="#888">i=1</text>

  <!-- bar 2: h=3 -->
  <rect x="200" y="246" width="42" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="221" y="296" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="221" y="316" text-anchor="middle" font-size="9" fill="#888">i=2</text>

  <!-- bar 3: h=7 (k, highlighted) -->
  <rect x="250" y="174" width="42" height="126" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="271" y="296" text-anchor="middle" font-size="10" fill="#333">7</text>
  <text x="271" y="316" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">k=3</text>

  <!-- bar 4: h=4 -->
  <rect x="300" y="228" width="42" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="321" y="296" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="321" y="316" text-anchor="middle" font-size="9" fill="#888">i=4</text>

  <!-- bar 5: h=5 -->
  <rect x="350" y="210" width="42" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="371" y="296" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="371" y="316" text-anchor="middle" font-size="9" fill="#888">i=5</text>

  <!-- Optimal window [1,5] dashed border -->
  <rect x="148" y="168" width="246" height="134" fill="none" stroke="#4a7a3a" stroke-width="2.5" stroke-dasharray="6,3" filter="url(#rough2)"/>
  <text x="271" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">最优窗口 [1, 5]</text>

  <!-- Min floor line at height 3: y = 300 - 54 = 246 -->
  <line x1="150" y1="246" x2="392" y2="246" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="400" y="244" font-size="10" fill="#b85450" font-weight="bold">min = 3</text>
  <text x="400" y="256" font-size="9" fill="#b85450">(地板)</text>

  <!-- Width bracket below window -->
  <path d="M 150 332 L 150 340 L 392 340 L 392 332" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="271" y="354" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">宽 = 5</text>

  <!-- Right side: formula box -->
  <text x="465" y="56" font-size="11" fill="#444" font-weight="bold">分数公式：</text>
  <rect x="445" y="70" width="140" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="515" y="92" text-anchor="middle" font-size="11" fill="#333">score = min × 宽</text>
  <text x="515" y="112" text-anchor="middle" font-size="11" fill="#333">= 3 × 5</text>
  <text x="515" y="132" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">= 15</text>

  <!-- Right side: greedy insight box -->
  <text x="465" y="168" font-size="11" fill="#444" font-weight="bold">贪心策略：</text>
  <rect x="445" y="182" width="140" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="515" y="202" text-anchor="middle" font-size="10" fill="#333">从 k 出发，</text>
  <text x="515" y="218" text-anchor="middle" font-size="10" fill="#333">比较两侧：</text>
  <text x="515" y="236" text-anchor="middle" font-size="10" fill="#333">nums[l-1] vs nums[r+1]</text>
  <text x="515" y="254" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">选较大的一侧扩展</text>
  <text x="515" y="270" text-anchor="middle" font-size="9" fill="#888">→ 地板降得最慢</text>

  <!-- Bottom summary -->
  <rect x="40" y="372" width="520" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="392" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">最小值随扩展单调下降 → 贪心让"地板"降得越慢，宽度越大时分数越高</text>
  <text x="300" y="406" text-anchor="middle" font-size="10" fill="#888">扩展到较大的一侧：min 不变或降幅更小 → 同等宽度下分数更优</text>
</svg>
