<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="450" fill="#fafafa"/>

  <text x="28" y="22" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：数位 DP 记忆化搜索 dfs(i, started, par, diff, tight)</text>

  <!-- 入口 -->
  <rect x="90" y="40" width="230" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="205" y="61" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">dfs(i, started, par, diff, tight)</text>
  <path d="M 205 74 L 205 90" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 1：i == n ? -->
  <polygon points="205,94 275,116 205,138 135,116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="205" y="121" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">i == n ?</text>
  <text x="284" y="108" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 275 116 L 298 116" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="300" y="96" width="228" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="414" y="112" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">return started &amp;&amp; diff == 0</text>
  <text x="414" y="127" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">? 1 : 0（一位数自动落选）</text>

  <text x="214" y="152" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 205 138 L 205 156" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 枚举数位 -->
  <rect x="90" y="158" width="230" height="40" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="205" y="174" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">up = tight ? s[i] : 9</text>
  <text x="205" y="190" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">枚举 d = 0..up，nt = tight &amp;&amp; d == up</text>
  <path d="M 205 198 L 205 214" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 2：started ? -->
  <polygon points="205,218 258,240 205,262 152,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="205" y="245" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">started ?</text>

  <!-- 左分支：未开始 -->
  <path d="M 152 240 H 148 V 278" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="142" y="262" text-anchor="end" font-size="10" fill="#b85450" filter="url(#rough2)">未开始</text>

  <rect x="36" y="282" width="228" height="66" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="300" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">d = 0：仍跳过前导零</text>
  <text x="150" y="315" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">→ dfs(i+1, 0, 0, 0, nt)</text>
  <text x="150" y="330" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">d ≥ 1：首位落奇位置 1</text>
  <text x="150" y="344" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">→ dfs(i+1, 1, 1, d, nt)</text>

  <!-- 右分支：已开始 -->
  <path d="M 258 240 L 322 240" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="233" font-size="10" fill="#4a7a3a" filter="url(#rough2)">已开始</text>

  <polygon points="390,218 455,240 390,262 325,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="236" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">par == 0 ?</text>
  <text x="390" y="250" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">（已填位数奇偶）</text>

  <path d="M 390 262 L 390 272" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 370 272 L 498 272" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 370 272 L 370 280" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 498 272 L 498 280" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="354" y="268" text-anchor="end" font-size="9.5" fill="#446688" filter="url(#rough2)">par=0</text>
  <text x="514" y="268" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">par=1</text>

  <rect x="312" y="284" width="116" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="301" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">下一位置：奇</text>
  <text x="370" y="318" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">diff += d</text>

  <rect x="440" y="284" width="116" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="498" y="301" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">下一位置：偶</text>
  <text x="498" y="318" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">diff -= d</text>

  <path d="M 370 328 L 370 340" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 498 328 L 498 340" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="310" y="342" width="246" height="24" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="433" y="358" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">→ dfs(i+1, 1, par ⊕ 1, ±d, nt)</text>

  <!-- 递归回边 -->
  <path d="M 60 350 C 24 350, 24 60, 86 58" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="26" y="206" font-size="9" fill="#b85450" filter="url(#rough2)">递归</text>

  <!-- 底部备忘 -->
  <rect x="20" y="384" width="520" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="406" font-size="10.5" fill="#b85450" filter="url(#rough2)">记忆化：仅缓存非 tight 状态 (i, started, par, diff)——tight 链 O(n) 个节点，不值得缓存</text>
  <text x="36" y="426" font-size="10.5" fill="#b85450" filter="url(#rough2)">状态量级 16 × 2 × 2 × 145 ≈ 9.3 千格；答案 = f(high) − f(low−1)</text>
</svg>
