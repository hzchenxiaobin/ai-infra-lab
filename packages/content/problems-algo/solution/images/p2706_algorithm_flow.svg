<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2706f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次扫描维护两个最小值</text>

  <!-- start -->
  <rect x="220" y="48" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">m1 = +∞, m2 = +∞</text>

  <path d="M280,86 L280,108" stroke="#446688" stroke-width="2" marker-end="url(#arr2706f)" filter="url(#rough2)"/>

  <!-- loop header -->
  <path d="M280,112 L380,150 L280,188 L180,150 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="148" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">还有未处理的价格</text>
  <text x="280" y="164" text-anchor="middle" font-size="11" fill="#d6a040">p ← 下一个价格</text>

  <!-- yes branch left -->
  <text x="150" y="146" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M180,150 L120,150 L120,210" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr2706f)" filter="url(#rough2)"/>

  <!-- condition diamond -->
  <path d="M120,214 L200,252 L120,290 L40,252 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="250" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">p &lt; m1 ?</text>

  <!-- p < m1 yes -->
  <text x="206" y="248" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M200,252 L300,252" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr2706f)" filter="url(#rough2)"/>
  <rect x="300" y="234" width="170" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="385" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">m2 = m1; m1 = p</text>

  <!-- p < m1 no -->
  <text x="106" y="312" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M120,290 L120,310 L200,310" stroke="#b85450" stroke-width="2" marker-end="url(#arr2706f)" filter="url(#rough2)"/>
  <rect x="200" y="292" width="170" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="285" y="316" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">else if p &lt; m2: m2 = p</text>

  <!-- loop back -->
  <path d="M385,272 L385,150 L380,150" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr2706f)" filter="url(#rough2)"/>
  <path d="M285,330 L120,330 L120,188" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr2706f)" filter="url(#rough2)"/>

  <!-- no exit -->
  <text x="386" y="146" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M380,150 L460,150 L460,120" stroke="#b85450" stroke-width="2" marker-end="url(#arr2706f)" filter="url(#rough2)"/>
  <rect x="400" y="86" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="460" y="108" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">cost = m1 + m2</text>

  <path d="M460,120 L460,360" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr2706f)" filter="url(#rough2)"/>

  <!-- final decision -->
  <path d="M460,362 L540,392 L460,422 L380,392 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="390" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">cost ≤ money ?</text>
  <text x="460" y="404" text-anchor="middle" font-size="10" fill="#b85450">money−cost : money</text>
</svg>
