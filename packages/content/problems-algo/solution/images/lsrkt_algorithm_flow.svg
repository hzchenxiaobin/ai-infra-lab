<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：预处理 next_pos 表 + BFS 逐层扩展</text>

  <!-- Phase 1: Preprocess -->
  <rect x="30" y="48" width="250" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="155" y="67" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">阶段一：预处理 next_pos 表</text>

  <path d="M 155 80 L 155 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="100" width="250" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="120" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">从右向左扫描 s</text>
  <text x="155" y="136" text-anchor="middle" font-size="10" fill="#666">next_pos[i][c] = next_pos[i+1][c]</text>
  <text x="155" y="150" text-anchor="middle" font-size="10" fill="#666">next_pos[i][s[i]] = i</text>

  <path d="M 155 160 L 155 176" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="180" width="250" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="200" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">统计频次，筛选 available</text>
  <text x="155" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a">available = { ch : freq[ch] ≥ k }</text>

  <!-- Phase 2: BFS -->
  <rect x="320" y="48" width="250" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="445" y="67" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">阶段二：BFS 逐层扩展</text>

  <path d="M 445 80 L 445 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="320" y="100" width="250" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="445" y="123" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">level = [""],  L = 0</text>

  <path d="M 445 140 L 445 156" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop box -->
  <rect x="310" y="160" width="280" height="140" fill="#fafafa" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,3" rx="8" filter="url(#rough2)"/>
  <text x="450" y="180" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">while level 非空：</text>

  <rect x="325" y="190" width="250" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="450" y="207" text-anchor="middle" font-size="10" fill="#555">for cur in level:</text>
  <text x="450" y="220" text-anchor="middle" font-size="10" fill="#555">  for ch in available:</text>

  <rect x="325" y="230" width="250" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="247" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">cand = cur + ch</text>
  <text x="450" y="260" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">isSubseq(cand, k)?  → next_pos 表 O(1) 跳转</text>

  <rect x="325" y="270" width="250" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="450" y="286" text-anchor="middle" font-size="10" fill="#4a7a3a">合法 → 加入 nxt；全部完成 → level = nxt</text>

  <!-- loop back arrow -->
  <path d="M 590 230 Q 600 230 600 200 Q 600 175 590 175" stroke="#666" stroke-width="1" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 445 304 L 445 320" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Check empty -->
  <rect x="320" y="324" width="250" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="445" y="342" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nxt 为空？</text>
  <text x="445" y="358" text-anchor="middle" font-size="10" fill="#888">是 → break；否 → 继续扩展</text>

  <path d="M 445 368 L 445 384" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return -->
  <rect x="320" y="388" width="250" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="445" y="406" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return max(level)</text>
  <text x="445" y="422" text-anchor="middle" font-size="10" fill="#4a7a3a">最长层中字典序最大者</text>

  <!-- Side note: next_pos explanation -->
  <rect x="30" y="250" width="250" height="100" fill="#fafafa" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" rx="6" filter="url(#rough2)"/>
  <text x="155" y="270" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">next_pos 表的作用</text>
  <text x="40" y="288" font-size="10" fill="#555">从位置 i 找下一个字符 c：</text>
  <text x="40" y="304" font-size="10" fill="#555">  暴力扫描 → O(n)</text>
  <text x="40" y="320" font-size="10" fill="#b85450" font-weight="bold">  查表 next_pos[i][c] → O(1)</text>
  <text x="40" y="338" font-size="10" fill="#4a7a3a">建表 O(26n)，所有查询均摊 O(1)</text>

  <!-- Bottom note -->
  <rect x="30" y="388" width="250" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="155" y="408" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">总时间复杂度</text>
  <text x="155" y="424" text-anchor="middle" font-size="10" fill="#555">O(26n + C·L·k)</text>
  <text x="155" y="438" text-anchor="middle" font-size="9" fill="#888">L ≤ 7, C = 候选数（被剪枝压小）</text>
</svg>
