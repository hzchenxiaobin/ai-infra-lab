<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：非递增 ⇔ 翻转后求非递减，大根堆 slope trick</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">原 nums=[3,2,4,5,0]，翻转得 [0,5,4,2,3]，对每个 x：push x；若堆顶&gt;x 则 ans+=堆顶−x 并替换堆顶</text>

  <!-- column headers -->
  <text x="50" y="72" font-size="11" fill="#666" font-weight="bold">step</text>
  <text x="110" y="72" font-size="11" fill="#666" font-weight="bold">x</text>
  <text x="190" y="72" font-size="11" fill="#666" font-weight="bold">大根堆（推入后）</text>
  <text x="370" y="72" font-size="11" fill="#666" font-weight="bold">堆顶&gt;x?</text>
  <text x="470" y="72" font-size="11" fill="#666" font-weight="bold">ans</text>
  <line x1="32" y1="78" x2="540" y2="78" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- ===== Step 1: x=0 ===== -->
  <text x="50" y="104" font-size="11.5" fill="#333" font-weight="bold">①</text>
  <text x="110" y="104" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="170" y="88" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="187" y="106" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="370" y="104" font-size="11" fill="#4a7a3a" font-weight="bold">否(0=0)</text>
  <text x="470" y="104" font-size="12" fill="#b85450" font-weight="bold">0</text>

  <!-- ===== Step 2: x=5 ===== -->
  <text x="50" y="148" font-size="11.5" fill="#333" font-weight="bold">②</text>
  <text x="110" y="148" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="170" y="132" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="187" y="150" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="206" y="132" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="223" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="370" y="148" font-size="11" fill="#4a7a3a" font-weight="bold">否(5=5)</text>
  <text x="470" y="148" font-size="12" fill="#b85450" font-weight="bold">0</text>

  <!-- ===== Step 3: x=4, top=5>4 yes ===== -->
  <text x="50" y="192" font-size="11.5" fill="#333" font-weight="bold">③</text>
  <text x="110" y="192" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="170" y="176" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="187" y="194" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="206" y="176" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="223" y="194" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="242" y="176" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="259" y="194" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="300" y="194" font-size="10" fill="#888">(弹5,补4)</text>
  <text x="370" y="192" font-size="11" fill="#b85450" font-weight="bold">是(5&gt;4)</text>
  <text x="470" y="192" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <!-- ===== Step 4: x=2, top=4>2 yes ===== -->
  <text x="50" y="236" font-size="11.5" fill="#333" font-weight="bold">④</text>
  <text x="110" y="236" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="160" y="220" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="238" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <rect x="192" y="220" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="207" y="238" text-anchor="middle" font-size="10.5" fill="#333">4</text>
  <rect x="224" y="220" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="238" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="256" y="220" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="271" y="238" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="300" y="238" font-size="10" fill="#888">(弹4,补2)</text>
  <text x="370" y="236" font-size="11" fill="#b85450" font-weight="bold">是(4&gt;2)</text>
  <text x="470" y="236" font-size="12" fill="#b85450" font-weight="bold">3</text>

  <!-- ===== Step 5: x=3, top=4>3 yes ===== -->
  <text x="50" y="280" font-size="11.5" fill="#333" font-weight="bold">⑤</text>
  <text x="110" y="280" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="160" y="264" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="282" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <rect x="192" y="264" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="207" y="282" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <rect x="224" y="264" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="282" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="256" y="264" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="271" y="282" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="288" y="264" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="303" y="282" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="324" y="282" font-size="10" fill="#888">(弹4,补3)</text>
  <text x="370" y="280" font-size="11" fill="#b85450" font-weight="bold">是(4&gt;3)</text>
  <text x="470" y="280" font-size="12" fill="#b85450" font-weight="bold">4</text>

  <line x1="32" y1="300" x2="540" y2="300" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- ===== Result ===== -->
  <rect x="120" y="312" width="320" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">solve([0,5,4,2,3]) = 4 → 原数组非递增代价 4</text>

  <!-- ===== legend ===== -->
  <rect x="40" y="358" width="480" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="377" font-size="10.5" fill="#333" font-weight="bold">读法：</text>
  <text x="100" y="377" font-size="10.5" fill="#555">蓝色=新推入的 x；粉色=当前堆顶；绿色=替换后保留的副本</text>
  <text x="56" y="394" font-size="10.5" fill="#555">每次「堆顶&gt;x」表示 x 把前面某个过高点压低，代价累加 (堆顶−x)；替换堆顶为 x 保持斜率结构</text>
  <text x="56" y="408" font-size="10.5" fill="#555">非递减方向 solve([3,2,4,5,0])=6；min(6, 4) = 4 ✓</text>
</svg>
