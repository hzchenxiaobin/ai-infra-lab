<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="700" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="350" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：intervals = [[1,2],[3,5],[6,7],[8,10],[12,16]]，newInterval = [4,8]</text>

  <!-- Column headers -->
  <text x="40" y="52" font-size="10" fill="#888" font-weight="bold">步骤</text>
  <text x="90" y="52" font-size="10" fill="#888" font-weight="bold">当前区间</text>
  <text x="210" y="52" font-size="10" fill="#888" font-weight="bold">阶段判定</text>
  <text x="340" y="52" font-size="10" fill="#888" font-weight="bold">操作</text>
  <text x="490" y="52" font-size="10" fill="#888" font-weight="bold">newInterval</text>
  <text x="610" y="52" font-size="10" fill="#888" font-weight="bold">结果</text>

  <!-- Separator line -->
  <g filter="url(#rough2)">
    <line x1="30" y1="58" x2="680" y2="58" stroke="#ddd" stroke-width="1"/>
  </g>

  <!-- ===== Step 1: [1,2] -> phase 1 ===== -->
  <text x="50" y="80" font-size="11" fill="#333" font-weight="bold">1</text>
  <g filter="url(#rough2)"><rect x="86" y="66" width="48" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="110" y="81" text-anchor="middle" font-size="11" fill="#446688">[1,2]</text>
  <text x="216" y="80" font-size="10" fill="#4a7a3a" font-weight="bold">① 2 &lt; 4</text>
  <text x="340" y="80" font-size="10" fill="#333">直接加入</text>
  <g filter="url(#rough2)"><rect x="486" y="66" width="56" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="514" y="81" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">[4,8]</text>
  <text x="610" y="80" font-size="10" fill="#888">[[1,2]]</text>

  <!-- ===== Step 2: [3,5] -> phase 2 ===== -->
  <text x="50" y="118" font-size="11" fill="#333" font-weight="bold">2</text>
  <g filter="url(#rough2)"><rect x="86" y="104" width="48" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="110" y="119" text-anchor="middle" font-size="11" fill="#b85450">[3,5]</text>
  <text x="216" y="118" font-size="10" fill="#d6a040" font-weight="bold">② 3 ≤ 8</text>
  <text x="340" y="118" font-size="10" fill="#333">合并: ns=3,ne=8</text>
  <g filter="url(#rough2)"><rect x="486" y="104" width="56" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/></g>
  <text x="514" y="119" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">[3,8]</text>
  <text x="610" y="118" font-size="10" fill="#888">[[1,2]]</text>

  <!-- ===== Step 3: [6,7] -> phase 2 ===== -->
  <text x="50" y="156" font-size="11" fill="#333" font-weight="bold">3</text>
  <g filter="url(#rough2)"><rect x="86" y="142" width="48" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="110" y="157" text-anchor="middle" font-size="11" fill="#b85450">[6,7]</text>
  <text x="216" y="156" font-size="10" fill="#d6a040" font-weight="bold">② 6 ≤ 8</text>
  <text x="340" y="156" font-size="10" fill="#333">合并: ne=max(8,7)</text>
  <g filter="url(#rough2)"><rect x="486" y="142" width="56" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/></g>
  <text x="514" y="157" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">[3,8]</text>
  <text x="610" y="156" font-size="10" fill="#888">[[1,2]]</text>

  <!-- ===== Step 4: [8,10] -> phase 2 ===== -->
  <text x="50" y="194" font-size="11" fill="#333" font-weight="bold">4</text>
  <g filter="url(#rough2)"><rect x="86" y="180" width="56" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="114" y="195" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[8,10]</text>
  <text x="216" y="194" font-size="10" fill="#d6a040" font-weight="bold">② 8 ≤ 8</text>
  <text x="340" y="194" font-size="10" fill="#333">合并: ne=max(8,10)</text>
  <g filter="url(#rough2)"><rect x="486" y="180" width="56" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/></g>
  <text x="514" y="195" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">[3,10]</text>
  <text x="610" y="194" font-size="10" fill="#888">[[1,2]]</text>

  <!-- Separator: phase 2 ends, push merged -->
  <g filter="url(#rough2)">
    <rect x="30" y="212" width="650" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4,2"/>
  </g>
  <text x="50" y="231" font-size="11" fill="#d6a040" font-weight="bold">—</text>
  <text x="90" y="231" font-size="10" fill="#d6a040">② 阶段结束</text>
  <text x="340" y="231" font-size="10" fill="#d6a040" font-weight="bold">res.push([3,10])</text>
  <text x="610" y="231" font-size="10" fill="#d6a040" font-weight="bold">[[1,2],[3,10]]</text>

  <!-- ===== Step 5: [12,16] -> phase 3 ===== -->
  <text x="50" y="266" font-size="11" fill="#333" font-weight="bold">5</text>
  <g filter="url(#rough2)"><rect x="86" y="252" width="64" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="118" y="267" text-anchor="middle" font-size="11" fill="#446688">[12,16]</text>
  <text x="216" y="266" font-size="10" fill="#4a7a3a" font-weight="bold">③ 12 &gt; 10</text>
  <text x="340" y="266" font-size="10" fill="#333">直接加入</text>
  <text x="514" y="266" text-anchor="middle" font-size="10" fill="#bbb">—</text>
  <text x="610" y="266" font-size="10" fill="#4a7a3a" font-weight="bold">[[1,2],[3,10],[12,16]]</text>

  <!-- ===== Visual summary on number line ===== -->
  <text x="350" y="304" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">数轴可视化</text>

  <!-- number line -->
  <g filter="url(#rough2)">
    <line x1="60" y1="330" x2="660" y2="330" stroke="#999" stroke-width="1.2"/>
  </g>
  <g font-size="9" fill="#999">
    <text x="60" y="344">0</text>
    <text x="150" y="344">3</text>
    <text x="270" y="344">6</text>
    <text x="390" y="344">9</text>
    <text x="510" y="344">12</text>
    <text x="630" y="344">16</text>
  </g>

  <!-- Original intervals (top row) -->
  <text x="30" y="362" font-size="9" fill="#888">原始:</text>
  <g font-size="9">
    <g filter="url(#rough2)"><rect x="60" y="354" width="30" height="16" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1"/></g>
    <text x="75" y="365" text-anchor="middle" fill="#446688">[1,2]</text>
    <g filter="url(#rough2)"><rect x="150" y="354" width="60" height="16" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
    <text x="180" y="365" text-anchor="middle" fill="#b85450">[3,5]</text>
    <g filter="url(#rough2)"><rect x="270" y="354" width="30" height="16" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
    <text x="285" y="365" text-anchor="middle" fill="#b85450">[6,7]</text>
    <g filter="url(#rough2)"><rect x="300" y="354" width="60" height="16" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
    <text x="330" y="365" text-anchor="middle" fill="#b85450">[8,10]</text>
    <g filter="url(#rough2)"><rect x="510" y="354" width="120" height="16" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1"/></g>
    <text x="570" y="365" text-anchor="middle" fill="#446688">[12,16]</text>
  </g>

  <!-- New interval (middle row) -->
  <text x="30" y="392" font-size="9" fill="#888">新区间:</text>
  <g filter="url(#rough2)">
    <rect x="190" y="382" width="180" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,3"/>
  </g>
  <text x="280" y="395" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">[4,8]</text>

  <!-- Result (bottom row) -->
  <text x="30" y="424" font-size="9" fill="#888">结果:</text>
  <g font-size="10">
    <g filter="url(#rough2)"><rect x="60" y="414" width="30" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
    <text x="75" y="427" text-anchor="middle" fill="#446688">[1,2]</text>
    <g filter="url(#rough2)"><rect x="150" y="414" width="210" height="18" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/></g>
    <text x="255" y="427" text-anchor="middle" fill="#d6a040" font-weight="bold">[3,10] ← 3+5+6+7+8+10 合并</text>
    <g filter="url(#rough2)"><rect x="510" y="414" width="120" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
    <text x="570" y="427" text-anchor="middle" fill="#446688">[12,16]</text>
  </g>

  <!-- Final answer box -->
  <g filter="url(#rough2)">
    <rect x="120" y="450" width="460" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="350" y="472" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">输出：[[1,2],[3,10],[12,16]] ✓  O(n) 一次遍历</text>

  <!-- Legend -->
  <g font-size="9" fill="#888">
    <rect x="120" y="498" width="12" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2"/>
    <text x="138" y="507">①③ 无重叠（直接拷贝）</text>
    <rect x="300" y="498" width="12" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2"/>
    <text x="318" y="507">② 原始重叠区间</text>
    <rect x="450" y="498" width="12" height="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2"/>
    <text x="468" y="507">新区间 / 合并后</text>
  </g>
</svg>
