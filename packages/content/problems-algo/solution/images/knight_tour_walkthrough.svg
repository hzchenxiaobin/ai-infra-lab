<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 2 演算：3×3 棋盘，前 7 步合法，第 7→8 步非法</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">grid = [[0,3,6],[5,8,1],[2,7,4]]　输出：false</text>

  <!-- 3x3 grid: cell=50, start x=40, y=64 -->
  <!-- grid lines -->
  <path d="M40 64 L190 64 M40 114 L190 114 M40 164 L190 164 M40 214 L190 214
           M40 64 L40 214 M90 64 L90 214 M140 64 L140 214 M190 64 L190 214"
        stroke="#cfd8e8" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- cells (light fill), step number per grid value -->
  <!-- (0,0)=0 -->
  <rect x="40" y="64" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="65" y="96" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <!-- (0,1)=3 -->
  <rect x="90" y="64" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="115" y="96" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <!-- (0,2)=6 -->
  <rect x="140" y="64" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="165" y="96" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>

  <!-- (1,0)=5 -->
  <rect x="40" y="114" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="65" y="146" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <!-- (1,1)=8  highlight red (target of illegal move) -->
  <rect x="90" y="114" width="50" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="115" y="146" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">8</text>
  <!-- (1,2)=1 -->
  <rect x="140" y="114" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="165" y="146" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- (2,0)=2 -->
  <rect x="40" y="164" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="65" y="196" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <!-- (2,1)=7  highlight red (source of illegal move) -->
  <rect x="90" y="164" width="50" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="115" y="196" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">7</text>
  <!-- (2,2)=4 -->
  <rect x="140" y="164" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="165" y="196" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>

  <!-- illegal move arrow 7->8 : (2,1) center (115,189) -> (1,1) center (115,139) -->
  <path d="M 115 188 L 115 142" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="156" y="170" font-size="9.5" fill="#b85450" font-weight="bold">非法!</text>

  <!-- coord axis hint -->
  <text x="115" y="58" text-anchor="middle" font-size="9" fill="#aaa">col1</text>
  <text x="30" y="92" text-anchor="middle" font-size="9" fill="#aaa">row0</text>
  <text x="30" y="192" text-anchor="middle" font-size="9" fill="#aaa">row2</text>

  <!-- ===== right side: verification table ===== -->
  <text x="350" y="58" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">逐相邻步校验</text>

  <!-- header -->
  <text x="214" y="78" font-size="9.5" fill="#888">k</text>
  <text x="248" y="78" font-size="9.5" fill="#888">pos[k]→pos[k+1]</text>
  <text x="372" y="78" font-size="9.5" fill="#888">dr,dc</text>
  <text x="416" y="78" font-size="9.5" fill="#888">dr×dc</text>
  <text x="466" y="78" font-size="9.5" fill="#888">结果</text>
  <path d="M210 82 L492 82" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- rows -->
  <!-- 0->1: (0,0)->(1,2) dr1 dc2 ->2 -->
  <text x="216" y="98" font-size="10" fill="#333">0</text>
  <text x="250" y="98" font-size="10" fill="#333">(0,0)→(1,2)</text>
  <text x="376" y="98" font-size="10" fill="#333">1,2</text>
  <text x="420" y="98" font-size="10" fill="#333">2</text>
  <text x="470" y="98" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- 1->2: (1,2)->(2,0) -->
  <text x="216" y="116" font-size="10" fill="#333">1</text>
  <text x="250" y="116" font-size="10" fill="#333">(1,2)→(2,0)</text>
  <text x="376" y="116" font-size="10" fill="#333">1,2</text>
  <text x="420" y="116" font-size="10" fill="#333">2</text>
  <text x="470" y="116" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- 2->3: (2,0)->(0,1) -->
  <text x="216" y="134" font-size="10" fill="#333">2</text>
  <text x="250" y="134" font-size="10" fill="#333">(2,0)→(0,1)</text>
  <text x="376" y="134" font-size="10" fill="#333">2,1</text>
  <text x="420" y="134" font-size="10" fill="#333">2</text>
  <text x="470" y="134" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- 3->4: (0,1)->(2,2) -->
  <text x="216" y="152" font-size="10" fill="#333">3</text>
  <text x="250" y="152" font-size="10" fill="#333">(0,1)→(2,2)</text>
  <text x="376" y="152" font-size="10" fill="#333">2,1</text>
  <text x="420" y="152" font-size="10" fill="#333">2</text>
  <text x="470" y="152" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- 4->5: (2,2)->(1,0) -->
  <text x="216" y="170" font-size="10" fill="#333">4</text>
  <text x="250" y="170" font-size="10" fill="#333">(2,2)→(1,0)</text>
  <text x="376" y="170" font-size="10" fill="#333">1,2</text>
  <text x="420" y="170" font-size="10" fill="#333">2</text>
  <text x="470" y="170" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- 5->6: (1,0)->(0,2) -->
  <text x="216" y="188" font-size="10" fill="#333">5</text>
  <text x="250" y="188" font-size="10" fill="#333">(1,0)→(0,2)</text>
  <text x="376" y="188" font-size="10" fill="#333">1,2</text>
  <text x="420" y="188" font-size="10" fill="#333">2</text>
  <text x="470" y="188" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- 6->7: (0,2)->(2,1) -->
  <text x="216" y="206" font-size="10" fill="#333">6</text>
  <text x="250" y="206" font-size="10" fill="#333">(0,2)→(2,1)</text>
  <text x="376" y="206" font-size="10" fill="#333">2,1</text>
  <text x="420" y="206" font-size="10" fill="#333">2</text>
  <text x="470" y="206" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- 7->8: (2,1)->(1,1) ILLEGAL -->
  <rect x="208" y="214" width="286" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="228" font-size="10" fill="#b85450" font-weight="bold">7</text>
  <text x="250" y="228" font-size="10" fill="#b85450" font-weight="bold">(2,1)→(1,1)</text>
  <text x="376" y="228" font-size="10" fill="#b85450" font-weight="bold">1,0</text>
  <text x="420" y="228" font-size="10" fill="#b85450" font-weight="bold">0</text>
  <text x="470" y="228" font-size="11" fill="#b85450" font-weight="bold">✗</text>

  <!-- conclusion -->
  <rect x="208" y="248" width="286" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="351" y="268" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">第 7→8 步：同列相邻 dr×dc=0≠2 → return false</text>

  <!-- bottom note -->
  <rect x="40" y="298" width="454" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="267" y="316" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">关键：把「按顺序巡视」转为「相邻下标坐标差校验」</text>
  <text x="267" y="332" text-anchor="middle" font-size="10" fill="#555">反查表 pos[] 让我们从「值→坐标」一次遍历完成全部相邻校验，O(n²)</text>
</svg>
