<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：2k 个端点排序后顺序配对（n=4, k=2）</text>

  <!-- Reference number line -->
  <line x1="120" y1="74" x2="380" y2="74" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="140" cy="74" r="4" fill="#fff" stroke="#666" stroke-width="1.5"/>
    <circle cx="210" cy="74" r="4" fill="#fff" stroke="#666" stroke-width="1.5"/>
    <circle cx="280" cy="74" r="4" fill="#fff" stroke="#666" stroke-width="1.5"/>
    <circle cx="350" cy="74" r="4" fill="#fff" stroke="#666" stroke-width="1.5"/>
  </g>
  <g font-size="11" fill="#666" text-anchor="middle">
    <text x="140" y="64">0</text>
    <text x="210" y="64">1</text>
    <text x="280" y="64">2</text>
    <text x="350" y="64">3</text>
  </g>

  <!-- Five configurations -->
  <!-- Row 1: [0,1],[1,2] -->
  <g filter="url(#rough2)">
    <circle cx="140" cy="120" r="3" fill="#888"/><circle cx="210" cy="120" r="3" fill="#888"/>
    <circle cx="280" cy="120" r="3" fill="#888"/><circle cx="350" cy="120" r="3" fill="#888"/>
    <path d="M 140 120 Q 175 104 210 120" fill="none" stroke="#b85450" stroke-width="2.5"/>
    <path d="M 210 120 Q 245 92 280 120" fill="none" stroke="#446688" stroke-width="2.5"/>
  </g>
  <text x="90" y="124" font-size="11" fill="#555" text-anchor="middle" font-weight="bold" filter="url(#rough2)">①</text>
  <text x="400" y="124" font-size="10" fill="#888" filter="url(#rough2)">[0,1]+[1,2]</text>

  <!-- Row 2: [0,1],[1,3] -->
  <g filter="url(#rough2)">
    <circle cx="140" cy="162" r="3" fill="#888"/><circle cx="210" cy="162" r="3" fill="#888"/>
    <circle cx="280" cy="162" r="3" fill="#888"/><circle cx="350" cy="162" r="3" fill="#888"/>
    <path d="M 140 162 Q 175 146 210 162" fill="none" stroke="#b85450" stroke-width="2.5"/>
    <path d="M 210 162 Q 280 118 350 162" fill="none" stroke="#446688" stroke-width="2.5"/>
  </g>
  <text x="90" y="166" font-size="11" fill="#555" text-anchor="middle" font-weight="bold" filter="url(#rough2)">②</text>
  <text x="400" y="166" font-size="10" fill="#888" filter="url(#rough2)">[0,1]+[1,3]</text>

  <!-- Row 3: [0,1],[2,3] -->
  <g filter="url(#rough2)">
    <circle cx="140" cy="204" r="3" fill="#888"/><circle cx="210" cy="204" r="3" fill="#888"/>
    <circle cx="280" cy="204" r="3" fill="#888"/><circle cx="350" cy="204" r="3" fill="#888"/>
    <path d="M 140 204 Q 175 188 210 204" fill="none" stroke="#b85450" stroke-width="2.5"/>
    <path d="M 280 204 Q 315 188 350 204" fill="none" stroke="#446688" stroke-width="2.5"/>
  </g>
  <text x="90" y="208" font-size="11" fill="#555" text-anchor="middle" font-weight="bold" filter="url(#rough2)">③</text>
  <text x="400" y="208" font-size="10" fill="#888" filter="url(#rough2)">[0,1]+[2,3]</text>

  <!-- Row 4: [0,2],[2,3] -->
  <g filter="url(#rough2)">
    <circle cx="140" cy="246" r="3" fill="#888"/><circle cx="210" cy="246" r="3" fill="#888"/>
    <circle cx="280" cy="246" r="3" fill="#888"/><circle cx="350" cy="246" r="3" fill="#888"/>
    <path d="M 140 246 Q 210 202 280 246" fill="none" stroke="#b85450" stroke-width="2.5"/>
    <path d="M 280 246 Q 315 230 350 246" fill="none" stroke="#446688" stroke-width="2.5"/>
  </g>
  <text x="90" y="250" font-size="11" fill="#555" text-anchor="middle" font-weight="bold" filter="url(#rough2)">④</text>
  <text x="400" y="250" font-size="10" fill="#888" filter="url(#rough2)">[0,2]+[2,3]</text>

  <!-- Row 5: [1,2],[2,3] -->
  <g filter="url(#rough2)">
    <circle cx="140" cy="288" r="3" fill="#888"/><circle cx="210" cy="288" r="3" fill="#888"/>
    <circle cx="280" cy="288" r="3" fill="#888"/><circle cx="350" cy="288" r="3" fill="#888"/>
    <path d="M 210 288 Q 245 272 280 288" fill="none" stroke="#b85450" stroke-width="2.5"/>
    <path d="M 280 288 Q 315 272 350 288" fill="none" stroke="#446688" stroke-width="2.5"/>
  </g>
  <text x="90" y="292" font-size="11" fill="#555" text-anchor="middle" font-weight="bold" filter="url(#rough2)">⑤</text>
  <text x="400" y="292" font-size="10" fill="#888" filter="url(#rough2)">[1,2]+[2,3]</text>

  <!-- Legend -->
  <g filter="url(#rough2)">
    <line x1="430" y1="318" x2="455" y2="318" stroke="#b85450" stroke-width="2.5"/>
    <line x1="430" y1="334" x2="455" y2="334" stroke="#446688" stroke-width="2.5"/>
  </g>
  <g font-size="10" fill="#666">
    <text x="462" y="322" filter="url(#rough2)">第 1 条</text>
    <text x="462" y="338" filter="url(#rough2)">第 2 条</text>
  </g>

  <!-- Insight box -->
  <rect x="30" y="356" width="500" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="48" y="376" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">关键洞察</text>
  <text x="48" y="394" font-size="11" fill="#555" filter="url(#rough2)">k 条不重叠线段 ⟺ 2k 个端点排序后顺序配对 (e₁,e₂),(e₃,e₄)…</text>
  <text x="48" y="412" font-size="11" fill="#555" filter="url(#rough2)">不等式链：e₁&lt;e₂≤e₃&lt;e₄≤…≤e_{2k-1}&lt;e_{2k}（段内严格、段间可等）</text>
</svg>
