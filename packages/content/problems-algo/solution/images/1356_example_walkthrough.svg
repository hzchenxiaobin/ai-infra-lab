<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：arr = [0,1,2,3,4,5,6,7,8] 的 popcount 分组</text>

  <!-- 表格外框 x=40..500, y=46..292 (h=246) -->
  <rect x="40" y="46" width="460" height="246" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 表头 row y=46..74 -->
  <rect x="40" y="46" width="460" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="65" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">数 x</text>
  <text x="200" y="65" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">二进制</text>
  <text x="320" y="65" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1 的个数</text>
  <text x="430" y="65" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">所属组</text>

  <!-- 列分隔线 x=140, 260, 380 -->
  <path d="M 140 46 L 140 292" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 260 46 L 260 292" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 380 46 L 380 292" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行分隔线 y=74,98,...,268 (每 24) -->
  <path d="M 40 74 L 500 74" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 40 98 L 500 98" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 40 122 L 500 122" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 40 146 L 500 146" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 40 170 L 500 170" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 40 194 L 500 194" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 40 218 L 500 218" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 40 242 L 500 242" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 40 266 L 500 266" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 数据行：row i y_top = 74 + i*24, 文本 y = y_top+16 -->
  <!-- row0: 0 | 0₂ | 0 | 第0组(gray) -->
  <text x="90" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="200" y="90" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0₂</text>
  <text x="320" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="380" y="74" width="120" height="24" fill="#f5f5f5" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="430" y="90" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">第 0 组</text>

  <!-- row1: 1 | 1₂ | 1 | 第1组(blue) -->
  <text x="90" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="200" y="114" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1₂</text>
  <text x="320" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="380" y="98" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="430" y="114" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">第 1 组</text>

  <!-- row2: 2 | 10₂ | 1 | 第1组 -->
  <text x="90" y="138" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="200" y="138" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">10₂</text>
  <text x="320" y="138" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="380" y="122" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="430" y="138" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">第 1 组</text>

  <!-- row3: 3 | 11₂ | 2 | 第2组(orange) -->
  <text x="90" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="200" y="162" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">11₂</text>
  <text x="320" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="380" y="146" width="120" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="430" y="162" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">第 2 组</text>

  <!-- row4: 4 | 100₂ | 1 | 第1组 -->
  <text x="90" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="200" y="186" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">100₂</text>
  <text x="320" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="380" y="170" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="430" y="186" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">第 1 组</text>

  <!-- row5: 5 | 101₂ | 2 | 第2组 -->
  <text x="90" y="210" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="200" y="210" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">101₂</text>
  <text x="320" y="210" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="380" y="194" width="120" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="430" y="210" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">第 2 组</text>

  <!-- row6: 6 | 110₂ | 2 | 第2组 -->
  <text x="90" y="234" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="200" y="234" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">110₂</text>
  <text x="320" y="234" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="380" y="218" width="120" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="430" y="234" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">第 2 组</text>

  <!-- row7: 7 | 111₂ | 3 | 第3组(red) -->
  <text x="90" y="258" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="200" y="258" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">111₂</text>
  <text x="320" y="258" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="380" y="242" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="430" y="258" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">第 3 组</text>

  <!-- row8: 8 | 1000₂ | 1 | 第1组 -->
  <text x="90" y="282" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="200" y="282" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1000₂</text>
  <text x="320" y="282" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="380" y="266" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="430" y="282" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">第 1 组</text>

  <!-- 拼接说明 -->
  <text x="270" y="318" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">各组按值升序后拼接 → 排序结果</text>

  <!-- 结果 chips: [0,1,2,4,8,3,5,6,7], width 42 gap 6, start x=57, centers 78,126,...,462 -->
  <rect x="57" y="328" width="42" height="30" rx="4" fill="#f5f5f5" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="348" text-anchor="middle" font-size="14" fill="#666" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="105" y="328" width="42" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="126" y="348" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="153" y="328" width="42" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="174" y="348" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="201" y="328" width="42" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="222" y="348" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="249" y="328" width="42" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="348" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="297" y="328" width="42" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="318" y="348" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="345" y="328" width="42" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="366" y="348" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="393" y="328" width="42" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="414" y="348" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="441" y="328" width="42" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="462" y="348" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>

  <text x="270" y="382" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">第 1 组 [1,2,4,8] 同 popcount=1，组内按值升序 ✓</text>
</svg>
