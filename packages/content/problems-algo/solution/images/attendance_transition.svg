<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.8"/>
    </marker>
    <marker id="arrP" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#446688" stroke-width="1.8"/>
    </marker>
    <marker id="arrA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#d6a040" stroke-width="1.8"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">状态转移图：追加 P / A / L 对 (a, l) 的影响</text>

  <!-- legend -->
  <rect x="200" y="40" width="60" height="22" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="56" font-size="11" fill="#446688">P：l 归 0</text>
  <rect x="360" y="40" width="60" height="22" fill="none" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="56" font-size="11" fill="#d6a040">A：a+1,l归0</text>
  <rect x="200" y="68" width="60" height="22" fill="none" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="84" font-size="11" fill="#4a7a3a">L：l+1</text>

  <!-- Top row label -->
  <text x="60" y="130" font-size="11" fill="#888">a=0</text>
  <!-- Bottom row label -->
  <text x="60" y="270" font-size="11" fill="#888">a=1</text>

  <!-- Top row: S0, S1, S2 -->
  <rect x="120" y="110" width="90" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="165" y="132" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">S0</text>
  <text x="165" y="150" text-anchor="middle" font-size="10" fill="#666">(0,0)</text>

  <rect x="280" y="110" width="90" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="325" y="132" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">S1</text>
  <text x="325" y="150" text-anchor="middle" font-size="10" fill="#666">(0,1)</text>

  <rect x="440" y="110" width="90" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="485" y="132" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">S2</text>
  <text x="485" y="150" text-anchor="middle" font-size="10" fill="#666">(0,2)</text>

  <!-- Bottom row: S3, S4, S5 -->
  <rect x="120" y="250" width="90" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="165" y="272" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">S3</text>
  <text x="165" y="290" text-anchor="middle" font-size="10" fill="#666">(1,0)</text>

  <rect x="280" y="250" width="90" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="325" y="272" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">S4</text>
  <text x="325" y="290" text-anchor="middle" font-size="10" fill="#666">(1,1)</text>

  <rect x="440" y="250" width="90" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="485" y="272" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">S5</text>
  <text x="485" y="290" text-anchor="middle" font-size="10" fill="#666">(1,2)</text>

  <!-- L transitions: S0->S1, S1->S2 (green, rightward) -->
  <path d="M 210 135 L 278 135" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="244" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a">L</text>
  <path d="M 370 135 L 438 135" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="404" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a">L</text>

  <!-- L transitions: S3->S4, S4->S5 (green) -->
  <path d="M 210 275 L 278 275" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="244" y="268" text-anchor="middle" font-size="10" fill="#4a7a3a">L</text>
  <path d="M 370 275 L 438 275" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="404" y="268" text-anchor="middle" font-size="10" fill="#4a7a3a">L</text>

  <!-- P transitions: S1->S0, S2->S0 (blue, leftward to col0) -->
  <path d="M 280 145 Q 245 175 212 158" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrP)" filter="url(#rough2)"/>
  <text x="258" y="176" font-size="10" fill="#446688">P</text>
  <path d="M 440 145 Q 330 200 214 158" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrP)" filter="url(#rough2)"/>
  <text x="350" y="186" font-size="10" fill="#446688">P</text>

  <!-- P transitions: S4->S3, S5->S3 (blue) -->
  <path d="M 280 285 Q 245 315 212 298" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrP)" filter="url(#rough2)"/>
  <text x="258" y="316" font-size="10" fill="#446688">P</text>
  <path d="M 440 285 Q 330 340 214 298" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrP)" filter="url(#rough2)"/>
  <text x="350" y="326" font-size="10" fill="#446688">P</text>

  <!-- P self loops: S0->S0, S3->S3 (blue) -->
  <path d="M 150 110 Q 130 90 150 108" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrP)" filter="url(#rough2)"/>
  <text x="125" y="96" font-size="9" fill="#446688">P</text>
  <path d="M 150 250 Q 130 230 150 248" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrP)" filter="url(#rough2)"/>
  <text x="125" y="236" font-size="9" fill="#446688">P</text>

  <!-- A transitions: S0->S3, S1->S3, S2->S3 (orange, downward) -->
  <path d="M 165 160 L 165 248" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrA)" filter="url(#rough2)"/>
  <text x="175" y="208" font-size="10" fill="#d6a040" font-weight="bold">A</text>
  <path d="M 325 160 Q 250 205 214 268" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrA)" filter="url(#rough2)"/>
  <text x="265" y="222" font-size="10" fill="#d6a040" font-weight="bold">A</text>
  <path d="M 485 160 Q 340 215 216 270" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arrA)" filter="url(#rough2)"/>
  <text x="395" y="238" font-size="10" fill="#d6a040" font-weight="bold">A</text>

  <!-- blocked transitions note -->
  <rect x="40" y="360" width="540" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="310" y="382" text-anchor="middle" font-size="11" fill="#b85450">非法转移（剪枝）：S2 放 L → 3 连 L；a=1 任状态放 A → 第 2 个 A</text>

  <!-- footnote -->
  <rect x="40" y="402" width="540" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="310" y="422" text-anchor="middle" font-size="11" fill="#555">初始（长度 1）：P→S0=1, L→S1=1, A→S3=1；每步把 6 个状态按上表全推一遍</text>
</svg>
