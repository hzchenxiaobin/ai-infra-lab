<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [2, 1, 3]，k = 4，sum = 6</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">在和阈值区间 [1, 6] 上二分，滑动窗口统计和 ≤ mid 的子数组数 cnt</text>

  <!-- ===== Binary search table ===== -->
  <text x="30" y="72" font-size="11" fill="#444" font-weight="bold">步骤</text>
  <text x="74" y="72" font-size="11" fill="#444" font-weight="bold">lo</text>
  <text x="110" y="72" font-size="11" fill="#444" font-weight="bold">hi</text>
  <text x="146" y="72" font-size="11" fill="#444" font-weight="bold">mid</text>
  <text x="300" y="72" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">滑动窗口计数（各 right 的贡献）</text>
  <text x="430" y="72" font-size="11" fill="#444" font-weight="bold">cnt</text>
  <text x="476" y="72" font-size="11" fill="#444" font-weight="bold">判定</text>
  <text x="560" y="72" font-size="11" fill="#444" font-weight="bold">更新</text>

  <line x1="18" y1="80" x2="600" y2="80" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 1: lo=1, hi=6, mid=3 -->
  <text x="30" y="100" font-size="11" fill="#333">1</text>
  <text x="74" y="100" font-size="11" fill="#333">1</text>
  <text x="110" y="100" font-size="11" fill="#333">6</text>
  <text x="146" y="100" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="300" y="100" text-anchor="middle" font-size="11" fill="#333">1 + 2 + 1</text>
  <text x="430" y="100" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="476" y="100" font-size="11" fill="#82b366">≥ 4 ✓</text>
  <text x="560" y="100" font-size="11" fill="#4a7a3a" font-weight="bold">ans=3,hi=2</text>

  <!-- Step 2: lo=1, hi=2, mid=1 -->
  <text x="30" y="120" font-size="11" fill="#333">2</text>
  <text x="74" y="120" font-size="11" fill="#333">1</text>
  <text x="110" y="120" font-size="11" fill="#333">2</text>
  <text x="146" y="120" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="300" y="120" text-anchor="middle" font-size="11" fill="#333">0 + 1 + 0</text>
  <text x="430" y="120" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="476" y="120" font-size="11" fill="#b85450">&lt; 4 ✗</text>
  <text x="560" y="120" font-size="11" fill="#b85450" font-weight="bold">lo=2</text>

  <!-- Step 3: lo=2, hi=2, mid=2 -->
  <text x="30" y="140" font-size="11" fill="#333">3</text>
  <text x="74" y="140" font-size="11" fill="#333">2</text>
  <text x="110" y="140" font-size="11" fill="#333">2</text>
  <text x="146" y="140" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="300" y="140" text-anchor="middle" font-size="11" fill="#333">1 + 1 + 0</text>
  <text x="430" y="140" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="476" y="140" font-size="11" fill="#b85450">&lt; 4 ✗</text>
  <text x="560" y="140" font-size="11" fill="#b85450" font-weight="bold">lo=3</text>

  <!-- Step 4: end -->
  <text x="30" y="160" font-size="11" fill="#333">4</text>
  <text x="74" y="160" font-size="11" fill="#999">3</text>
  <text x="110" y="160" font-size="11" fill="#999">2</text>
  <text x="146" y="160" font-size="11" fill="#999">—</text>
  <text x="300" y="160" text-anchor="middle" font-size="11" fill="#999">lo &gt; hi，循环结束</text>
  <text x="430" y="160" font-size="11" fill="#999">—</text>
  <text x="476" y="160" font-size="11" fill="#999">—</text>
  <text x="560" y="160" font-size="11" fill="#d6a040" font-weight="bold">返回 ans</text>

  <!-- ===== Sliding window detail for mid=3 ===== -->
  <rect x="30" y="180" width="560" height="134" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="48" y="200" font-size="11.5" fill="#444" font-weight="bold">第 1 轮 mid=3 的滑动窗口计数过程（nums = [2, 1, 3]）：</text>

  <!-- right=0 -->
  <text x="48" y="222" font-size="11" fill="#333">right=0：</text>
  <rect x="104" y="210" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="226" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="148" y="222" font-size="10.5" fill="#555">sum=2 ≤ 3 ✓ → cnt += 1（子数组 [2]）</text>

  <!-- right=1 -->
  <text x="48" y="248" font-size="11" fill="#333">right=1：</text>
  <rect x="104" y="236" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="252" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="144" y="236" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="252" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="188" y="248" font-size="10.5" fill="#555">sum=3 ≤ 3 ✓ → cnt += 2（子数组 [2,1] 和 [1]）</text>

  <!-- right=2 -->
  <text x="48" y="274" font-size="11" fill="#333">right=2：</text>
  <rect x="104" y="262" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="278" text-anchor="middle" font-size="9" fill="#999">✗</text>
  <rect x="144" y="262" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="278" text-anchor="middle" font-size="9" fill="#999">✗</text>
  <rect x="184" y="262" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="278" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="228" y="274" font-size="10.5" fill="#555">sum=6&gt;3，左缩掉 2、1 → sum=3 ≤ 3 ✓ → cnt += 1（子数组 [3]）</text>

  <!-- total -->
  <text x="48" y="302" font-size="11" fill="#d6a040" font-weight="bold">合计 cnt = 1 + 2 + 1 = 4 ≥ k=4 → 可行，ans=3</text>

  <!-- ===== Interval narrowing ===== -->
  <text x="30" y="334" font-size="12" fill="#444" font-weight="bold">区间收缩：</text>

  <!-- step1 interval [1,6] -->
  <text x="30" y="358" font-size="10" fill="#888">①</text>
  <rect x="54" y="348" width="436" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <line x1="54" y1="346" x2="54" y2="366" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="54" y="340" text-anchor="middle" font-size="9" fill="#666">1</text>
  <line x1="490" y1="346" x2="490" y2="366" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="340" text-anchor="middle" font-size="9" fill="#666">6</text>
  <text x="254" y="360" text-anchor="middle" font-size="10" fill="#333">mid=3 → cnt=4 ≥ k → 可行 → 去左半找更小</text>

  <!-- step2 interval [1,2] -->
  <text x="30" y="386" font-size="10" fill="#888">②</text>
  <rect x="54" y="376" width="144" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <line x1="54" y1="374" x2="54" y2="394" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="54" y="368" text-anchor="middle" font-size="9" fill="#666">1</text>
  <line x1="198" y1="374" x2="198" y2="394" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="198" y="368" text-anchor="middle" font-size="9" fill="#666">2</text>
  <text x="126" y="388" text-anchor="middle" font-size="10" fill="#333">mid=1 → cnt=1 &lt; k → 不够 → 去右半</text>

  <!-- step3 interval [2,2] -->
  <text x="30" y="414" font-size="10" fill="#888">③</text>
  <rect x="198" y="404" width="0" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <line x1="198" y1="402" x2="198" y2="422" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="198" y="396" text-anchor="middle" font-size="9" fill="#666">2</text>
  <text x="350" y="416" text-anchor="middle" font-size="10" fill="#333">mid=2 → cnt=2 &lt; k → 不够 → lo=3（收窄到空）</text>

  <!-- result box -->
  <rect x="54" y="440" width="510" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="309" y="464" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">答案 = 3（mid=3 时恰有 4 个子数组和 ≤ 3，且 mid&lt;3 时不足 4 个）</text>
  <text x="309" y="486" text-anchor="middle" font-size="11" fill="#888">全正 → 滑动窗口 O(n) 计数；二分 O(log S) 次，S = sum(nums) ≤ 2×10⁹</text>
</svg>
