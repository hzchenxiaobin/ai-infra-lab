<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：按 startDate 降序排，每人取第 2 条；只有一条则取那一条</text>

  <!-- ===== timeline axis ===== -->
  <text x="40" y="62" font-size="10" fill="#888">时间轴 →</text>
  <line x1="100" y1="60" x2="620" y2="60" stroke="#888" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="610" y="56" font-size="9" fill="#888">较新</text>
  <text x="112" y="56" font-size="9" fill="#888">较旧</text>

  <!-- ===== Alice: 3 activities ===== -->
  <text x="40" y="104" font-size="12" fill="#446688" font-weight="bold">Alice</text>
  <text x="40" y="118" font-size="9" fill="#888">cnt=3</text>

  <!-- Alice Travel 02-24~28 (most recent, rn=1) -->
  <rect x="430" y="80" width="150" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="505" y="96" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Travel</text>
  <text x="505" y="112" text-anchor="middle" font-size="9" fill="#666">02-24 ~ 02-28</text>
  <rect x="588" y="84" width="26" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="601" y="98" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">rn1</text>

  <!-- Alice Dancing 02-21~23 (2nd most recent, rn=2) SELECT -->
  <rect x="270" y="80" width="150" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" rx="5" filter="url(#rough2)"/>
  <text x="345" y="96" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Dancing</text>
  <text x="345" y="112" text-anchor="middle" font-size="9" fill="#666">02-21 ~ 02-23</text>
  <rect x="428" y="84" width="26" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="441" y="98" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">rn2</text>
  <text x="345" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">↓ 第 2 近 → 选中 ✓</text>

  <!-- Alice Travel 02-12~20 (3rd, rn=3) -->
  <rect x="110" y="80" width="150" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="185" y="96" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">Travel</text>
  <text x="185" y="112" text-anchor="middle" font-size="9" fill="#666">02-12 ~ 02-20</text>
  <rect x="268" y="84" width="26" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="281" y="98" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">rn3</text>

  <!-- ===== Bob: 1 activity ===== -->
  <text x="40" y="208" font-size="12" fill="#446688" font-weight="bold">Bob</text>
  <text x="40" y="222" font-size="9" fill="#888">cnt=1</text>

  <!-- Bob Travel 02-11~18 (only one, rn=1, cnt=1) SELECT -->
  <rect x="270" y="184" width="150" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" rx="5" filter="url(#rough2)"/>
  <text x="345" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Travel</text>
  <text x="345" y="216" text-anchor="middle" font-size="9" fill="#666">02-11 ~ 02-18</text>
  <rect x="428" y="188" width="26" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="441" y="202" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">rn1</text>
  <text x="345" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">↓ 仅 1 条 → 选中 ✓</text>

  <!-- ===== filter bar ===== -->
  <rect x="60" y="262" width="540" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="330" y="282" text-anchor="middle" font-size="11" fill="#333">WHERE rn = 2  OR  cnt = 1</text>

  <!-- arrows from selected to result -->
  <path d="M345 138 L345 262" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M345 244 L345 262" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== result ===== -->
  <rect x="190" y="300" width="280" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <rect x="190" y="300" width="280" height="20" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="314" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">结果（每用户一行）</text>
  <text x="200" y="336" font-size="10" fill="#333" font-weight="bold">Alice | Dancing  | 02-21 ~ 02-23</text>
  <text x="200" y="354" font-size="10" fill="#333" font-weight="bold">Bob   | Travel   | 02-11 ~ 02-18</text>

  <!-- bottom note -->
  <rect x="20" y="372" width="620" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="330" y="387" text-anchor="middle" font-size="10" fill="#333">题眼：<tspan fill="#b85450" font-weight="bold">「每人取倒数第 2」</tspan> + <tspan fill="#b85450" font-weight="bold">「单活动兜底」</tspan>——rn=2 抓多活动的次近，cnt=1 兜底唯一活动</text>
</svg>
