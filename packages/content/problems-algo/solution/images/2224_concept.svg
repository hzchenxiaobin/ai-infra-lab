<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：面额整除链 1 | 5 | 15 | 60 → 贪心最优</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">每个大面额都是下一档的整数倍，小硬币总能向上合并</text>

  <!-- ===== Four denomination coins ===== -->
  <text x="28" y="72" font-size="10.5" fill="#666">四种操作面额</text>

  <!-- 60 -->
  <rect x="68" y="56" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="100" y="76" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">60</text>
  <text x="100" y="92" text-anchor="middle" font-size="9.5" fill="#888">分钟</text>

  <!-- 15 -->
  <rect x="170" y="56" width="64" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="202" y="76" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">15</text>
  <text x="202" y="92" text-anchor="middle" font-size="9.5" fill="#888">分钟</text>

  <!-- 5 -->
  <rect x="272" y="56" width="64" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="304" y="76" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <text x="304" y="92" text-anchor="middle" font-size="9.5" fill="#888">分钟</text>

  <!-- 1 -->
  <rect x="374" y="56" width="64" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="406" y="76" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="406" y="92" text-anchor="middle" font-size="9.5" fill="#888">分钟</text>

  <!-- divisibility relations between coins -->
  <!-- 60 = 4 × 15 -->
  <path d="M 132 78 L 170 78" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="151" y="52" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">= 4×</text>

  <!-- 15 = 3 × 5 -->
  <path d="M 234 78 L 272 78" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="253" y="52" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">= 3×</text>

  <!-- 5 = 5 × 1 -->
  <path d="M 336 78 L 374 78" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="355" y="52" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">= 5×</text>

  <!-- ===== Merge rules ===== -->
  <text x="28" y="130" font-size="10.5" fill="#666">合并规则（小硬币凑满即可换大硬币）</text>

  <rect x="40" y="138" width="440" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="158" text-anchor="middle" font-size="11" fill="#333">5 个 1 分钟 → 1 个 5 分钟（省 4 次）</text>
  <text x="260" y="174" text-anchor="middle" font-size="11" fill="#333">3 个 5 分钟 → 1 个 15 分钟（省 2 次）</text>
  <text x="260" y="190" text-anchor="middle" font-size="11" fill="#333">4 个 15 分钟 → 1 个 60 分钟（省 3 次）</text>

  <!-- ===== Greedy walk: diff=125 ===== -->
  <text x="28" y="222" font-size="10.5" fill="#666">贪心分配示例：差值 d = 125 分钟</text>

  <!-- step 1: 125 / 60 = 2, rem 5 -->
  <rect x="40" y="230" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="100" y="248" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">125 ÷ 60 = 2</text>
  <text x="100" y="263" text-anchor="middle" font-size="9.5" fill="#888">余 5，ops += 2</text>

  <path d="M 162 250 L 190 250" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: 5 / 15 = 0 -->
  <rect x="194" y="230" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="254" y="248" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">5 ÷ 15 = 0</text>
  <text x="254" y="263" text-anchor="middle" font-size="9.5" fill="#888">余 5，ops += 0</text>

  <path d="M 316 250 L 344 250" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3: 5 / 5 = 1 -->
  <rect x="348" y="230" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="408" y="248" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">5 ÷ 5 = 1</text>
  <text x="408" y="263" text-anchor="middle" font-size="9.5" fill="#888">余 0，ops += 1</text>

  <!-- result -->
  <rect x="120" y="284" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">合计 2 + 0 + 1 = 3 次操作 ✓</text>

  <!-- ===== Footer note ===== -->
  <text x="260" y="338" text-anchor="middle" font-size="10" fill="#888">整除链保证：任一最优解中 1 分钟&lt;5 个 / 5 分钟&lt;3 个 / 15 分钟&lt;4 个</text>
  <text x="260" y="352" text-anchor="middle" font-size="10" fill="#888">→ 超出即可向上合并减次数，故贪心从大面额取商必最优</text>
</svg>
