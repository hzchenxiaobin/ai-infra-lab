<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：只需检查相邻 1 的间距 ≥ k，非相邻 1 间距更大天然满足</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">nums = [1, 0, 0, 0, 1, 0, 0, 1]，k = 2</text>

  <!-- Array cells: 8 cells, width 50, gap 6, start x=80 -->
  <!-- idx0 = 1 (highlight) center 105 -->
  <rect x="80" y="74" width="50" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="105" y="102" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <!-- idx1 = 0 -->
  <rect x="136" y="74" width="50" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="161" y="102" text-anchor="middle" font-size="15" fill="#333">0</text>
  <!-- idx2 = 0 -->
  <rect x="192" y="74" width="50" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="217" y="102" text-anchor="middle" font-size="15" fill="#333">0</text>
  <!-- idx3 = 0 -->
  <rect x="248" y="74" width="50" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="273" y="102" text-anchor="middle" font-size="15" fill="#333">0</text>
  <!-- idx4 = 1 (highlight) center 329 -->
  <rect x="304" y="74" width="50" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="329" y="102" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <!-- idx5 = 0 -->
  <rect x="360" y="74" width="50" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="385" y="102" text-anchor="middle" font-size="15" fill="#333">0</text>
  <!-- idx6 = 0 -->
  <rect x="416" y="74" width="50" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="441" y="102" text-anchor="middle" font-size="15" fill="#333">0</text>
  <!-- idx7 = 1 (highlight) center 497 -->
  <rect x="472" y="74" width="50" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="497" y="102" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>

  <!-- index labels -->
  <text x="105" y="134" text-anchor="middle" font-size="10.5" fill="#888">0</text>
  <text x="161" y="134" text-anchor="middle" font-size="10.5" fill="#888">1</text>
  <text x="217" y="134" text-anchor="middle" font-size="10.5" fill="#888">2</text>
  <text x="273" y="134" text-anchor="middle" font-size="10.5" fill="#888">3</text>
  <text x="329" y="134" text-anchor="middle" font-size="10.5" fill="#888">4</text>
  <text x="385" y="134" text-anchor="middle" font-size="10.5" fill="#888">5</text>
  <text x="441" y="134" text-anchor="middle" font-size="10.5" fill="#888">6</text>
  <text x="497" y="134" text-anchor="middle" font-size="10.5" fill="#888">7</text>

  <!-- Adjacent arc 1: idx0(105) -> idx4(329), gap = 3 -->
  <path d="M 105 140 Q 217 178 329 140" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <rect x="178" y="158" width="78" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="217" y="176" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">间距 = 3 ✓</text>

  <!-- Adjacent arc 2: idx4(329) -> idx7(497), gap = 2 -->
  <path d="M 329 140 Q 413 206 497 140" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <rect x="374" y="186" width="78" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="413" y="204" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">间距 = 2 ✓</text>

  <!-- Non-adjacent dashed arc: idx0(105) -> idx7(497), grayed -->
  <path d="M 105 140 Q 301 252 497 140" stroke="#b0b0b0" stroke-width="1.6" stroke-dasharray="6,4" fill="none" filter="url(#rough2)"/>
  <rect x="232" y="230" width="138" height="26" rx="6" fill="#f2f2f2" stroke="#b0b0b0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="301" y="248" text-anchor="middle" font-size="11" fill="#888">非相邻：间距 = 6（无需检查）</text>

  <!-- k threshold note -->
  <text x="540" y="102" font-size="11" fill="#d6a040" font-weight="bold">k = 2</text>

  <!-- bottom note box -->
  <rect x="60" y="288" width="500" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="310" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">相邻 1 间距 ≥ k ⟹ 所有 1 间距 ≥ k</text>
  <text x="310" y="330" text-anchor="middle" font-size="10.5" fill="#555">检查对数从 O(m²) 降到 O(m)：只需维护上一个 1 的下标 prev，</text>
  <text x="310" y="346" text-anchor="middle" font-size="10.5" fill="#555">遇新 1 判 curr − prev − 1 ≥ k 即可（m 为 1 的个数）</text>
</svg>
