<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL" markerWidth="10" markerHeight="10" refX="2" refY="3" orient="auto">
      <path d="M10,0 L2,3 L10,6" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="540" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：从右向左每三位一组，组间插入点</text>

  <!-- Original number label -->
  <text x="270" y="66" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">原始数字 n = 123456789</text>

  <!-- Direction arrow -->
  <text x="270" y="92" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">← 从右端起，每 3 位切一组</text>
  <path d="M 430 104 L 110 104" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrL)" filter="url(#rough2)"/>

  <!-- Digit boxes: 9 digits, width 42, start x=81 -->
  <!-- Group 1 (123): blue -->
  <rect x="81" y="120" width="42" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="150" text-anchor="middle" font-size="16" fill="#333" font-family="monospace">1</text>
  <rect x="123" y="120" width="42" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="150" text-anchor="middle" font-size="16" fill="#333" font-family="monospace">2</text>
  <rect x="165" y="120" width="42" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="150" text-anchor="middle" font-size="16" fill="#333" font-family="monospace">3</text>

  <!-- Group 2 (456): green -->
  <rect x="207" y="120" width="42" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="150" text-anchor="middle" font-size="16" fill="#333" font-family="monospace">4</text>
  <rect x="249" y="120" width="42" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="150" text-anchor="middle" font-size="16" fill="#333" font-family="monospace">5</text>
  <rect x="291" y="120" width="42" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="312" y="150" text-anchor="middle" font-size="16" fill="#333" font-family="monospace">6</text>

  <!-- Group 3 (789): orange -->
  <rect x="333" y="120" width="42" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="354" y="150" text-anchor="middle" font-size="16" fill="#333" font-family="monospace">7</text>
  <rect x="375" y="120" width="42" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="396" y="150" text-anchor="middle" font-size="16" fill="#333" font-family="monospace">8</text>
  <rect x="417" y="120" width="42" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="438" y="150" text-anchor="middle" font-size="16" fill="#333" font-family="monospace">9</text>

  <!-- Group labels below -->
  <text x="144" y="182" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">第 3 组</text>
  <text x="270" y="182" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">第 2 组</text>
  <text x="396" y="182" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">第 1 组（最右）</text>

  <!-- Down arrow to result -->
  <path d="M 270 196 L 270 214" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Result label -->
  <text x="270" y="238" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">组间插入点 → 结果字符串</text>

  <!-- Result string "123.456.789" -->
  <rect x="90" y="252" width="360" height="44" fill="#f0f7ff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="282" text-anchor="middle" font-size="18" fill="#333" font-family="monospace" font-weight="bold">123<tspan fill="#b85450" font-size="22">.</tspan>456<tspan fill="#b85450" font-size="22">.</tspan>789</text>

  <!-- Dot callout -->
  <text x="270" y="318" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">红色点 = 组间分隔符（每满 3 位插一个，最左不足 3 位不补点）</text>
</svg>
