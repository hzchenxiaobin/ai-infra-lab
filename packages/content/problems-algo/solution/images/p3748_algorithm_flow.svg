<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：O(n) 预处理 + 每查询二分定位、三式拼装</text>

  <!-- 开始 -->
  <rect x="205" y="38" width="110" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="55" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入 nums, queries</text>
  <path d="M 260 64 L 260 76" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 预处理① -->
  <rect x="85" y="78" width="350" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="96" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① 一趟扫描：nums[i] &lt; nums[i−1] 处开新段 → starts[]</text>
  <text x="260" y="114" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">段 j 起点 starts[j]，终点 starts[j+1] − 1（末段为 n−1）</text>
  <path d="M 260 120 L 260 132" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 预处理② -->
  <rect x="85" y="134" width="350" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="152" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">② 每段贡献 L(L+1)/2，做段前缀和 pref[]</text>
  <text x="260" y="170" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">pref[j] = 段 0..j 的贡献总和（完整中段求和用）</text>
  <path d="M 260 176 L 260 188" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 查询定位 -->
  <rect x="85" y="190" width="350" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="208" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">③ 对每个查询 [l, r]：二分 starts 定位 jl、jr</text>
  <text x="260" y="226" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">jl = 含 l 的段号 = upper_bound(starts, l) − 1</text>
  <path d="M 260 232 L 260 244" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 决策菱形 -->
  <polygon points="170,276 260,244 350,276 260,308" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="281" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">jl == jr ？</text>

  <!-- 分支箭头与标签 -->
  <path d="M 170 276 L 208 276" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 350 276 L 312 276" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="185" y="268" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="330" y="268" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 同段分支 -->
  <rect x="18" y="248" width="190" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="113" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans[i] = tri(r−l+1)</text>
  <text x="113" y="288" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">= (r−l+1)(r−l+2)/2</text>
  <text x="113" y="300" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">查询整体落在同一段内</text>

  <!-- 跨段分支 -->
  <rect x="312" y="248" width="190" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="407" y="264" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans[i] = tri(左残长)</text>
  <text x="407" y="280" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">+ pref[jr−1] − pref[jl]</text>
  <text x="407" y="296" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">+ tri(右残长)</text>

  <!-- 底注 -->
  <text x="260" y="328" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">左残长 = starts[jl+1] − l ，右残长 = r − starts[jr] + 1</text>
  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">总复杂度 O(n + q log n)；预存 segId[] 段号可省二分 → O(n + q)</text>
</svg>
