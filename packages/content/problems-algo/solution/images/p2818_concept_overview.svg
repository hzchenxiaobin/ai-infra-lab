<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    贡献法：每个元素被选中的子数组数
  </text>

  <!-- Example array nums = [19, 12, 14, 6, 10, 18], prime scores = [1, 2, 2, 2, 2, 2] -->
  <!-- 6 cells, each 55px wide, starting x=70 -->
  <!-- Row: nums values -->
  <text x="50" y="75" font-size="12" fill="#666" filter="url(#rough2)">nums</text>
  <rect x="70" y="58" width="55" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">19</text>
  <rect x="125" y="58" width="55" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">12</text>
  <rect x="180" y="58" width="55" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="207" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">14</text>
  <rect x="235" y="58" width="55" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <rect x="290" y="58" width="55" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="317" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">10</text>
  <rect x="345" y="58" width="55" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">18</text>

  <!-- index labels -->
  <text x="97" y="105" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">i=0</text>
  <text x="152" y="105" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="207" y="105" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="262" y="105" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">3</text>
  <text x="317" y="105" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">4</text>
  <text x="372" y="105" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">5</text>

  <!-- prime scores -->
  <text x="50" y="135" font-size="12" fill="#666" filter="url(#rough2)">s[i]</text>
  <rect x="70" y="118" width="55" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="137" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">1</text>
  <rect x="125" y="118" width="55" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="137" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="180" y="118" width="55" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="207" y="137" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="235" y="118" width="55" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="137" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="290" y="118" width="55" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="317" y="137" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="345" y="118" width="55" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="137" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <!-- Highlight i=1 (value 12, score 2) as example -->
  <rect x="123" y="56" width="59" height="92" fill="none" stroke="#b85450" stroke-width="2.5" stroke-dasharray="5,3" rx="6" filter="url(#rough2)"/>
  <text x="152" y="52" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">以 i=1 为例</text>

  <!-- left boundary -->
  <text x="50" y="178" font-size="12" fill="#666" filter="url(#rough2)">left</text>
  <text x="97" y="178" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">-1</text>
  <rect x="140" y="165" width="24" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="152" y="181" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">-1</text>
  <text x="207" y="178" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">1</text>
  <text x="262" y="178" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">2</text>
  <text x="317" y="178" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">3</text>
  <text x="372" y="178" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">4</text>

  <!-- right boundary -->
  <text x="50" y="208" font-size="12" fill="#666" filter="url(#rough2)">right</text>
  <text x="97" y="208" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">1</text>
  <rect x="140" y="195" width="24" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="152" y="211" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">6</text>
  <text x="207" y="208" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">6</text>
  <text x="262" y="208" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">6</text>
  <text x="317" y="208" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">6</text>
  <text x="372" y="208" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">6</text>

  <!-- ranges -->
  <text x="50" y="240" font-size="12" fill="#666" filter="url(#rough2)">ranges</text>
  <text x="97" y="240" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">1</text>
  <rect x="132" y="227" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="152" y="243" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">10</text>
  <text x="207" y="240" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">4</text>
  <text x="262" y="240" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">3</text>
  <text x="317" y="240" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">2</text>
  <text x="372" y="240" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">1</text>

  <!-- Formula box -->
  <rect x="60" y="265" width="400" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="289" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    ranges[i] = (i − left[i]) × (right[i] − i)
  </text>

  <!-- i=1 example: (1-(-1)) × (6-1) = 2 × 5 = 10 -->
  <text x="260" y="322" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">
    i=1：(1−(−1)) × (6−1) = 2 × 5 = 10 个子数组选中 12
  </text>
  <text x="260" y="340" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">
    左 ≥ 挡住同分，右 > 不挡同分 → 不重不漏
  </text>
</svg>
