<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,9 Z" fill="#b85450"/>
    </marker>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,9 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n=4, connections=[[0,1],[1,2],[2,0],[1,3]]</text>

  <!-- ===== Left: DFS tree graph ===== -->
  <rect x="24" y="44" width="232" height="260" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="140" y="64" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">DFS 生成树（绿实线）+ 回边（橙虚线）</text>

  <!-- tree edges: 0->1, 1->2, 1->3 -->
  <line x1="118" y1="118" x2="118" y2="158" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="134" y1="180" x2="178" y2="218" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="102" y1="180" x2="62" y2="218" stroke="#b85450" stroke-width="2.6" stroke-dasharray="6,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- back edge 2->0 (orange dashed curve) -->
  <path d="M 188 232 Q 250 150 138 108" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- nodes -->
  <circle cx="120" cy="100" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <text x="120" y="86" text-anchor="middle" font-size="9" fill="#888">disc=0 low=0</text>

  <circle cx="120" cy="176" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="181" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="120" y="162" text-anchor="middle" font-size="9" fill="#888">disc=1 low=0</text>

  <circle cx="190" cy="234" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="239" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="190" y="220" text-anchor="middle" font-size="9" fill="#888">disc=2 low=0</text>

  <circle cx="56" cy="234" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="56" y="239" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="56" y="220" text-anchor="middle" font-size="9" fill="#b85450">disc=3 low=3</text>

  <!-- legend -->
  <rect x="40" y="274" width="200" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="50" y="289" font-size="9.5" fill="#4a7a3a" font-weight="bold">━ 树边</text>
  <text x="112" y="289" font-size="9.5" fill="#d6a040" font-weight="bold">⇢ 回边</text>
  <text x="172" y="289" font-size="9.5" fill="#b85450" font-weight="bold">━ 桥</text>

  <!-- ===== Right: step table ===== -->
  <rect x="276" y="44" width="260" height="360" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="406" y="64" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">逐步演算</text>

  <!-- table header -->
  <rect x="286" y="74" width="240" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="298" y="89" font-size="9.5" fill="#333" font-weight="bold">步</text>
  <text x="332" y="89" font-size="9.5" fill="#333" font-weight="bold">动作</text>
  <text x="452" y="89" font-size="9.5" fill="#333" font-weight="bold">disc/low 更新</text>

  <!-- rows -->
  <text x="298" y="112" font-size="9.5" fill="#333">1</text>
  <text x="324" y="112" font-size="9" fill="#333">访问 0</text>
  <text x="452" y="112" font-size="9" fill="#446688">d[0]=0 l[0]=0</text>

  <text x="298" y="130" font-size="9.5" fill="#333">2</text>
  <text x="324" y="130" font-size="9" fill="#333">树边→1</text>
  <text x="452" y="130" font-size="9" fill="#446688">d[1]=1 l[1]=1</text>

  <text x="298" y="148" font-size="9.5" fill="#333">3</text>
  <text x="324" y="148" font-size="9" fill="#333">树边→2</text>
  <text x="452" y="148" font-size="9" fill="#446688">d[2]=2 l[2]=2</text>

  <text x="298" y="166" font-size="9.5" fill="#333">4</text>
  <text x="324" y="166" font-size="9" fill="#d6a040">回边 2→0</text>
  <text x="452" y="166" font-size="9" fill="#d6a040">l[2]=min(2,0)=0</text>

  <text x="298" y="184" font-size="9.5" fill="#333">5</text>
  <text x="324" y="184" font-size="9" fill="#333">回 1←2</text>
  <text x="452" y="184" font-size="9" fill="#446688">l[1]=min(1,0)=0</text>

  <text x="298" y="202" font-size="9.5" fill="#333">6</text>
  <text x="324" y="202" font-size="9" fill="#b85450">判(1,2)</text>
  <text x="452" y="202" font-size="9" fill="#888">0&gt;1? 否,非桥</text>

  <text x="298" y="220" font-size="9.5" fill="#333">7</text>
  <text x="324" y="220" font-size="9" fill="#333">树边→3</text>
  <text x="452" y="220" font-size="9" fill="#446688">d[3]=3 l[3]=3</text>

  <text x="298" y="238" font-size="9.5" fill="#333">8</text>
  <text x="324" y="238" font-size="9" fill="#333">回 1←3</text>
  <text x="452" y="238" font-size="9" fill="#446688">l[1]=min(0,3)=0</text>

  <text x="298" y="256" font-size="9.5" fill="#333">9</text>
  <text x="324" y="256" font-size="9" fill="#b85450" font-weight="bold">判(1,3)</text>
  <text x="452" y="256" font-size="9" fill="#b85450" font-weight="bold">3&gt;1? 是,桥!</text>

  <text x="298" y="274" font-size="9.5" fill="#333">10</text>
  <text x="324" y="274" font-size="9" fill="#333">回 0←1</text>
  <text x="452" y="274" font-size="9" fill="#446688">l[0]=min(0,0)=0</text>

  <text x="298" y="292" font-size="9.5" fill="#333">11</text>
  <text x="324" y="292" font-size="9" fill="#b85450">判(0,1)</text>
  <text x="452" y="292" font-size="9" fill="#888">0&gt;0? 否,非桥</text>

  <!-- result box -->
  <rect x="286" y="312" width="240" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="406" y="332" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">结果：[[1,3]]</text>
  <text x="406" y="350" text-anchor="middle" font-size="9.5" fill="#666">2 的子树经回边 2→0 绕回了 0（l[2]=0），</text>
  <text x="406" y="364" text-anchor="middle" font-size="9.5" fill="#666">所以 (1,2) 非桥；</text>
  <text x="406" y="378" text-anchor="middle" font-size="9.5" fill="#666">3 是叶子无回边，l[3]=3&gt;1 → (1,3) 为桥</text>

  <!-- bottom summary -->
  <rect x="24" y="320" width="232" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="140" y="340" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">关键转折：第 4 步</text>
  <text x="140" y="358" text-anchor="middle" font-size="9.5" fill="#666">回边 2→0 把 low[2] 拉到 0</text>
  <text x="140" y="372" text-anchor="middle" font-size="9.5" fill="#666">进而 low[1] 也变成 0</text>
  <text x="140" y="388" text-anchor="middle" font-size="9.5" fill="#666">→ 环上边全部"非桥"</text>

  <rect x="40" y="410" width="480" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="426" text-anchor="middle" font-size="10" fill="#444">环上每条边的子树都能经回边绕回 → low[v] ≤ disc[u] → 非桥；只有"挂"在环外的边才是桥</text>
</svg>
