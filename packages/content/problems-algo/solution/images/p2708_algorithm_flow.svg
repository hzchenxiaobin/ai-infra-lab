<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一遍扫描维护 (curMax, curMin)</text>

  <!-- Start -->
  <rect x="180" y="40" width="160" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">curMax = curMin = nums[0]</text>

  <path d="M 260 80 L 260 100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Loop condition -->
  <polygon points="260,100 360,140 260,180 160,140" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="138" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">i &lt; n ?</text>
  <text x="260" y="154" text-anchor="middle" font-size="10" fill="#888">遍历下个元素</text>

  <!-- No -> return -->
  <path d="M 360 140 L 420 140" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="388" y="132" text-anchor="middle" font-size="11" fill="#888">否</text>
  <rect x="420" y="120" width="92" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="466" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return curMax</text>
  <text x="466" y="152" text-anchor="middle" font-size="9" fill="#888">答案</text>

  <!-- Yes -> process -->
  <path d="M 260 180 L 260 198" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="194" font-size="11" fill="#888">是</text>

  <!-- snapshot -->
  <rect x="150" y="200" width="220" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="218" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">快照旧值</text>
  <text x="260" y="234" text-anchor="middle" font-size="11" fill="#555">a = curMax·num,  b = curMin·num</text>

  <path d="M 260 240 L 260 258" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- update -->
  <rect x="110" y="260" width="300" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">四候选取极值</text>
  <text x="260" y="298" text-anchor="middle" font-size="11" fill="#444">curMax=max(curMax,num,a,b)</text>
  <text x="260" y="312" text-anchor="middle" font-size="10" fill="#888">curMin=min(curMin,num,a,b)</text>

  <!-- loop back arrow -->
  <path d="M 110 285 L 60 285 L 60 140 L 160 140" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)" stroke-dasharray="5 3"/>
  <text x="62" y="210" font-size="10" fill="#888" transform="rotate(-90 62 210)">i++, 回到判断</text>

  <!-- right note -->
  <rect x="410" y="260" width="100" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="460" y="280" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">关键</text>
  <text x="460" y="296" text-anchor="middle" font-size="9" fill="#555">候选含 curMax</text>
  <text x="460" y="308" text-anchor="middle" font-size="9" fill="#555">即「不选 num」</text>
  <path d="M 410 285 L 410 285" stroke="#888" stroke-width="1" fill="none"/>

  <!-- bottom summary -->
  <rect x="20" y="332" width="480" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#333">O(n) 一遍扫描 + O(1) 滚动，天然覆盖全负/含零/单元素</text>
</svg>
