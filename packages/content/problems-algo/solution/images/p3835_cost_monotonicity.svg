<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：开销对窗口包含单调，合法左端点是连续后缀</text>

  <!-- 顶部左侧：数组与嵌套窗口 -->
  <g filter="url(#rough2)">
    <rect x="90"  y="40" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="146" y="40" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="202" y="40" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="116" y="61" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="172" y="61" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="228" y="61" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="116" y="84" text-anchor="middle" font-size="9" fill="#999">0</text>
    <text x="172" y="84" text-anchor="middle" font-size="9" fill="#999">1</text>
    <text x="228" y="84" text-anchor="middle" font-size="9" fill="#999">2</text>

    <rect x="88" y="96" width="168" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="172" y="111" text-anchor="middle" font-size="10" fill="#8a3030" font-weight="bold">窗口 [0..2]：开销 6 &gt; 4 ✗</text>

    <rect x="144" y="124" width="112" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="200" y="139" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold">[1..2]：开销 2 ≤ 4 ✓</text>

    <path d="M 100 121 C 115 126, 128 129, 141 131" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrR)"/>
    <text x="98" y="141" text-anchor="middle" font-size="9.5" fill="#b85450">缩 l</text>
  </g>

  <!-- 顶部右侧：包含单调性说明框 -->
  <g filter="url(#rough2)">
    <rect x="286" y="36" width="250" height="112" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="411" y="58" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">包含单调性</text>
    <text x="411" y="78" text-anchor="middle" font-size="10" fill="#333">扩窗：max 只增、min 只减 ⇒ 极差不减</text>
    <text x="411" y="95" text-anchor="middle" font-size="10" fill="#333">且长度增大，两因子均非负</text>
    <text x="411" y="112" text-anchor="middle" font-size="10" fill="#333">⇒ 开销不减；缩窗对称 ⇒ 开销不增</text>
    <text x="411" y="132" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">A ⊆ B ⇒ cost(A) ≤ cost(B)</text>
  </g>

  <!-- 底部标题 -->
  <text x="280" y="168" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">固定 r = 2、k = 4：l 增大开销不增，合法左端点连成后缀</text>

  <!-- 行 l=0：非法 -->
  <g filter="url(#rough2)">
    <text x="34" y="199" font-size="11" fill="#33506b" font-weight="bold">l=0</text>
    <rect x="66"  y="182" width="26" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="92"  y="182" width="26" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="118" y="182" width="26" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="79"  y="199" text-anchor="middle" font-size="10.5" fill="#333">1</text>
    <text x="105" y="199" text-anchor="middle" font-size="10.5" fill="#333">3</text>
    <text x="131" y="199" text-anchor="middle" font-size="10.5" fill="#333">2</text>
    <text x="156" y="199" font-size="10.5" fill="#333">(3−1)×3 = 6</text>
    <rect x="246" y="182" width="74" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="283" y="199" text-anchor="middle" font-size="10.5" fill="#8a3030" font-weight="bold">✗ 超 k</text>
  </g>

  <!-- 行 l=1：合法（l₀） -->
  <g filter="url(#rough2)">
    <text x="34" y="231" font-size="11" fill="#33506b" font-weight="bold">l=1</text>
    <rect x="66"  y="214" width="26" height="26" rx="3" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="92"  y="214" width="26" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="118" y="214" width="26" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="79"  y="231" text-anchor="middle" font-size="10.5" fill="#999">1</text>
    <text x="105" y="231" text-anchor="middle" font-size="10.5" fill="#333">3</text>
    <text x="131" y="231" text-anchor="middle" font-size="10.5" fill="#333">2</text>
    <text x="156" y="231" font-size="10.5" fill="#333">(3−2)×2 = 2</text>
    <rect x="246" y="214" width="74" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="283" y="231" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">✓ 合法</text>
  </g>
  <path d="M 322 227 L 342 227" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 行 l=2：合法 -->
  <g filter="url(#rough2)">
    <text x="34" y="263" font-size="11" fill="#33506b" font-weight="bold">l=2</text>
    <rect x="66"  y="246" width="26" height="26" rx="3" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="92"  y="246" width="26" height="26" rx="3" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="118" y="246" width="26" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="79"  y="263" text-anchor="middle" font-size="10.5" fill="#999">1</text>
    <text x="105" y="263" text-anchor="middle" font-size="10.5" fill="#999">3</text>
    <text x="131" y="263" text-anchor="middle" font-size="10.5" fill="#333">2</text>
    <text x="156" y="263" font-size="10.5" fill="#333">(2−2)×1 = 0</text>
    <rect x="246" y="246" width="74" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="283" y="263" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">✓ 合法</text>
  </g>

  <!-- 右侧：后缀性质说明框 -->
  <g filter="url(#rough2)">
    <rect x="346" y="188" width="196" height="84" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="444" y="208" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">后缀性质（本题题眼）</text>
    <text x="444" y="226" text-anchor="middle" font-size="10" fill="#333">合法左端点连成后缀 [l₀, r]</text>
    <text x="444" y="243" text-anchor="middle" font-size="10" fill="#333">以 r 结尾合法个数 = r−l₀+1</text>
    <text x="444" y="260" text-anchor="middle" font-size="10" fill="#333">l₀ 随 r 单调不减 → 双指针 O(n)</text>
  </g>

  <!-- 底部结论框 -->
  <g filter="url(#rough2)">
    <rect x="30" y="284" width="505" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="282" y="304" text-anchor="middle" font-size="10.3" fill="#8a6d1a">① 窗口 max / min 由双单调队列队头 O(1) 读取（239 同款），无需 multiset</text>
    <text x="282" y="321" text-anchor="middle" font-size="10.3" fill="#8a6d1a">② l₀ 单调不减 ⇒ 每个下标进出窗口各一次，双指针总耗时 O(n)</text>
    <text x="282" y="338" text-anchor="middle" font-size="10.3" fill="#8a6d1a">③ 中间量 (max−min)×len ~ 10¹⁴、答案 ~ 5×10⁹ —— 全程 long long</text>
  </g>
</svg>
