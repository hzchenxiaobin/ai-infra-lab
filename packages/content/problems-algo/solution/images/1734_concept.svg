<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    核心观察：奇偶配对抵消，反推首元素 arr[0]
  </text>

  <!-- Row 1: permutation total XOR known -->
  <rect x="70" y="44" width="400" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    arr 是 [1..n] 的排列 → 全集异或 P = 1 ⊕ 2 ⊕ … ⊕ n 已知
  </text>

  <!-- Row 2: arr cells with pairing -->
  <text x="44" y="100" font-size="11" fill="#888" filter="url(#rough2)">arr</text>

  <!-- arr[0]: unknown (red) -->
  <rect x="70" y="86" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="94" y="108" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">arr[0]</text>
  <text x="94" y="135" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">?</text>

  <!-- pair 1: arr[1] arr[2] -->
  <rect x="140" y="86" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="164" y="108" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">arr[1]</text>
  <rect x="190" y="86" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="214" y="108" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">arr[2]</text>
  <!-- bracket under pair 1 -->
  <path d="M140,124 L140,132 L238,132 L238,124" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="189" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">= encoded[1]</text>

  <!-- pair 2: arr[3] arr[4] -->
  <rect x="260" y="86" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="284" y="108" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">arr[3]</text>
  <rect x="310" y="86" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="334" y="108" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">arr[4]</text>
  <path d="M260,124 L260,132 L358,132 L358,124" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="309" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">= encoded[3]</text>

  <!-- ellipsis -->
  <text x="380" y="106" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">…</text>

  <!-- last pair: arr[n-2] arr[n-1] -->
  <rect x="400" y="86" width="58" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="429" y="108" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">arr[n-2]</text>
  <rect x="460" y="86" width="58" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="489" y="108" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">arr[n-1]</text>
  <path d="M400,124 L400,132 L518,132 L518,124" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="459" y="148" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">= encoded[n-2]</text>

  <!-- arrow down to formula -->
  <path d="M94,140 L94,168" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Formula box -->
  <rect x="50" y="172" width="440" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="194" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">
    arr[0] = P ⊕ (encoded[1] ⊕ encoded[3] ⊕ … ⊕ encoded[n-2])
  </text>
  <text x="270" y="214" text-anchor="middle" font-size="10" fill="#5a3a3a" filter="url(#rough2)">
    n 为奇数 → arr[1..n-1] 恰好偶数项，两两配对抵消
  </text>

  <!-- Phase 2: degrade to 1720 -->
  <path d="M270,228 L270,248" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="252" width="400" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="268" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">
    求出 arr[0] 后，逐项递推退化成 1720
  </text>
  <text x="270" y="284" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    arr[i+1] = arr[i] ⊕ encoded[i]
  </text>

  <!-- Insight box -->
  <rect x="50" y="306" width="440" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="326" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    与 1720 唯一差异：首元素不再白送
  </text>
  <text x="270" y="344" text-anchor="middle" font-size="10" fill="#5a4a1a" filter="url(#rough2)">
    用「排列的全集异或 + 奇数下标配对抵消」补出 arr[0]
  </text>
  <text x="270" y="360" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    预处理 O(n) + 递推 O(n) → 整体 O(n)
  </text>
</svg>
