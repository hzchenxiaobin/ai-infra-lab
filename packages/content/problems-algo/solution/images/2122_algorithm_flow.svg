<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 600"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="600" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 枚举候选 2k → 频率表贪心配对</text>
  <text x="310" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">最小值必为 lower → 2k 来自 nums[j]−nums[0]；每步最小未配对被迫当 lower</text>

  <!-- Step 1: sort -->
  <rect x="220" y="60" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="79" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">排序 nums</text>
  <text x="310" y="93" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">O(n log n)</text>

  <path d="M 310 100 L 310 120" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: enumerate candidate 2k -->
  <rect x="200" y="124" width="220" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="144" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">枚举候选 2k = nums[j]−nums[0]</text>
  <text x="310" y="160" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">d &gt; 0 且 d 偶，去重；j = 1..2n−1</text>

  <path d="M 310 172 L 310 192" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Loop: for each candidate k -->
  <rect x="210" y="196" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="310" y="218" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">for 每个候选 2k</text>

  <path d="M 310 230 L 310 250" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Build freq map -->
  <rect x="220" y="254" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="273" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">建频率表 freq + 升序键</text>
  <text x="310" y="287" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">Counter(nums)</text>

  <path d="M 310 294 L 310 314" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Inner loop: for x in sorted keys -->
  <rect x="200" y="318" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="310" y="340" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">for x in 升序键</text>

  <path d="M 310 352 L 310 372" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Decision: freq[x]==0? -->
  <polygon points="310,376 400,416 310,456 220,416" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="412" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">freq[x]==0?</text>
  <text x="310" y="430" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">已被消耗</text>

  <!-- Yes: skip -> loop back -->
  <path d="M 400 416 L 480 416 L 480 335 L 420 335" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="440" y="408" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">跳过</text>

  <!-- No: down to check freq[x+2k] -->
  <path d="M 310 456 L 310 478" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="324" y="474" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Decision: freq[x+2k] >= freq[x]? -->
  <polygon points="310,482 410,522 310,562 210,522" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="518" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">freq[x+2k]≥c?</text>
  <text x="310" y="536" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">c = freq[x]</text>

  <!-- No: this k invalid -> back to outer loop -->
  <path d="M 210 522 L 130 522 L 130 213 L 210 213" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="150" y="370" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">k 无效</text>
  <text x="150" y="384" font-size="9.5" fill="#b85450" filter="url(#rough2)">换下一个</text>

  <!-- Yes: consume and record -->
  <path d="M 410 522 L 500 522 L 500 335 L 420 335" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="520" y="430" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">消耗</text>
  <text x="520" y="444" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">freq[2k]</text>
  <text x="520" y="458" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">记 x+k</text>

  <!-- All paired? -> return -->
  <path d="M 500 335 L 560 335 L 560 213 L 420 213" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="470" y="196" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="16" filter="url(#rough2)"/>
  <text x="535" y="218" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">配满→返回</text>
  <text x="535" y="232" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">arr = [x+k]</text>
  <path d="M 470 213 L 420 213" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Bottom note -->
  <rect x="40" y="572" width="540" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="588" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">题目保证至少一组解 → 必有某候选 k 配满 n 对即返回</text>
</svg>
