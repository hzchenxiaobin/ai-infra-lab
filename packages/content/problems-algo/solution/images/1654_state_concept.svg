<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">状态空间：位置 × 方向</text>

  <!-- ===== 数轴 ===== -->
  <line x1="40" y1="70" x2="520" y2="70" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <polygon points="520,70 512,66 512,74" fill="#446688" filter="url(#rough2)"/>

  <!-- 数轴刻度 -->
  <g filter="url(#rough2)">
    <line x1="80" y1="66" x2="80" y2="74" stroke="#446688" stroke-width="1.5"/>
    <text x="80" y="90" text-anchor="middle" font-size="13" fill="#333">0</text>
    <text x="80" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a">起点</text>

    <line x1="200" y1="66" x2="200" y2="74" stroke="#446688" stroke-width="1.5"/>
    <text x="200" y="90" text-anchor="middle" font-size="13" fill="#333">x</text>
    <text x="200" y="106" text-anchor="middle" font-size="11" fill="#b85450">家</text>
  </g>

  <!-- 跳蚤图标 -->
  <ellipse cx="80" cy="56" rx="10" ry="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="60" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">跳</text>

  <!-- 向前跳箭头（绿色，右） -->
  <path d="M 95 50 Q 140 38 185 50" fill="none" stroke="#4a7a3a" stroke-width="2.5"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="140" y="35" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">向前 +a</text>

  <!-- 向后跳箭头（橙色，左） -->
  <path d="M 185 130 Q 140 142 95 130" fill="none" stroke="#d6a040" stroke-width="2.5"
        marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="140" y="155" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">向后 −b</text>

  <!-- 禁止连续后退标注 -->
  <rect x="230" y="120" width="150" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="305" y="138" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">⚠ 不能连续后退 2 次</text>

  <!-- forbidden 标记 -->
  <text x="150" y="90" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="260" y="90" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="150" y="106" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">禁区</text>

  <!-- ===== 分隔线 ===== -->
  <line x1="30" y1="180" x2="530" y2="180" stroke="#ccc" stroke-width="1" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- ===== 状态空间网格 ===== -->
  <text x="280" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">二维状态：visited[pos][dir]</text>

  <!-- 列标题 -->
  <text x="180" y="230" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">dir = 0（向前到达）</text>
  <text x="380" y="230" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">dir = 1（向后到达）</text>

  <!-- 位置列 -->
  <text x="55" y="262" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">pos=0</text>
  <text x="55" y="292" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">pos=a</text>
  <text x="55" y="322" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">pos=x</text>

  <!-- dir=0 列方格 -->
  <rect x="90" y="248" width="180" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="267" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">(0, F) ✓ 可向后跳</text>

  <rect x="90" y="278" width="180" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="297" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">(a, F) ✓ 可向后跳</text>

  <rect x="90" y="308" width="180" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="327" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">(x, F) ✓ 可向后跳</text>

  <!-- dir=1 列方格 -->
  <rect x="290" y="248" width="180" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="267" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">— (0 无法向后到达)</text>

  <rect x="290" y="278" width="180" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="297" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">(a, B) ✗ 只能向前</text>

  <rect x="290" y="308" width="180" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="327" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">(x, B) ✗ 只能向前</text>

  <!-- 核心洞察标注 -->
  <rect x="40" y="350" width="480" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="367" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">💡 同一位置 pos 有两个独立状态，方向决定能否向后扩展</text>
</svg>
