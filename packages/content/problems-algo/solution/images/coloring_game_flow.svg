<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">算法流程：两遍 DFS + 不等式判定</text>

  <!-- 步骤1：定位 x -->
  <rect x="150" y="50" width="220" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="72" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 定位 x</text>
  <text x="260" y="88" text-anchor="middle" font-size="10" fill="#666">DFS 找值为 x 的节点 node</text>

  <path d="M 260 100 L 260 122" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤2：数子树 -->
  <rect x="120" y="124" width="280" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 数左右子树大小</text>
  <text x="260" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" font-family="'Comic Sans MS', monospace">left = count(node.left)</text>
  <text x="260" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" font-family="'Comic Sans MS', monospace">right = count(node.right)</text>

  <path d="M 260 188 L 260 210" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤3：算父方 -->
  <rect x="110" y="212" width="300" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="234" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 算父方区域</text>
  <text x="260" y="252" text-anchor="middle" font-size="11" fill="#d6a040" font-family="'Comic Sans MS', monospace">parent = n - 1 - left - right</text>

  <path d="M 260 266 L 260 292" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="260,294 410,348 260,402 110,348" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="340" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ max(left,right,parent)</text>
  <text x="260" y="358" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">&gt; n / 2 ?</text>

  <!-- 是 → true -->
  <path d="M 410 348 L 450 348 L 450 392" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="425" y="340" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="395" y="394" width="110" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="412" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return true</text>
  <text x="450" y="427" text-anchor="middle" font-size="9" fill="#666">最大块过半⇒必胜</text>

  <!-- 否 → false -->
  <path d="M 110 348 L 70 348 L 70 392" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="80" y="340" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="15" y="394" width="110" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="70" y="412" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">return false</text>
  <text x="70" y="427" text-anchor="middle" font-size="9" fill="#666">无块过半⇒不胜</text>

  <text x="260" y="448" text-anchor="middle" font-size="10" fill="#555">时间 O(n) · 空间 O(n)（递归栈）</text>
</svg>
