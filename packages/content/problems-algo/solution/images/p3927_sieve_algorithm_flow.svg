<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：值域升序筛倍数，「先到先得」标记最小在场约数</text>

  <!-- ===== left flow ===== -->
  <rect x="40" y="44" width="250" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="165" y="63" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 统计出现过的值</text>
  <text x="165" y="80" text-anchor="middle" font-size="10.5" fill="#555">present[v] = true（v ∈ S）</text>
  <path d="M 165 90 L 165 104" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="40" y="108" width="250" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="165" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② v = 1 … maxV 升序扫描</text>
  <path d="M 165 144 L 165 158" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="165,163 237,194 165,225 93,194" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="165" y="199" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">present[v] ?</text>
  <path d="M 237 194 C 268 194 268 126 288 126" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="263" y="178" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 165 225 L 165 244" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="178" y="240" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="40" y="248" width="250" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="165" y="267" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 枚举 v 的倍数 m</text>
  <text x="165" y="284" text-anchor="middle" font-size="10.5" fill="#555">m = v, 2v, 3v, … ≤ maxV</text>
  <path d="M 165 294 L 165 308" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="40" y="312" width="250" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="165" y="331" text-anchor="middle" font-size="12" fill="#2f5e23" font-weight="bold">④ best[m] 为空 → 记 best[m] = v</text>
  <text x="165" y="350" text-anchor="middle" font-size="10.5" fill="#555">升序先到先得，最小者获胜</text>
  <path d="M 165 364 L 165 378" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="40" y="382" width="250" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="165" y="407" text-anchor="middle" font-size="12.5" fill="#8a3a36" font-weight="bold">⑤ ans = Σ best[nums[i]]</text>

  <!-- ===== right example ===== -->
  <text x="435" y="48" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">示例 nums = [4, 2, 8, 3]，maxV = 8</text>
  <text x="435" y="64" text-anchor="middle" font-size="10.5" fill="#888">S = {2, 3, 4, 8}，格子记录每个 m 归谁标记</text>

  <text x="348" y="74" text-anchor="end" font-size="9.5" fill="#8899aa">m →</text>
  <text x="374" y="74" text-anchor="middle" font-size="9.5" fill="#8899aa">2</text>
  <text x="414" y="74" text-anchor="middle" font-size="9.5" fill="#8899aa">3</text>
  <text x="454" y="74" text-anchor="middle" font-size="9.5" fill="#8899aa">4</text>
  <text x="494" y="74" text-anchor="middle" font-size="9.5" fill="#8899aa">6</text>
  <text x="534" y="74" text-anchor="middle" font-size="9.5" fill="#8899aa">8</text>

  <text x="348" y="95" text-anchor="end" font-size="10.5" fill="#446688" font-weight="bold">v=2</text>
  <rect x="356" y="78" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="436" y="78" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="476" y="78" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="516" y="78" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="374" y="96" text-anchor="middle" font-size="11" fill="#2f5e23" font-weight="bold">2</text>
  <text x="454" y="96" text-anchor="middle" font-size="11" fill="#2f5e23" font-weight="bold">2</text>
  <text x="494" y="96" text-anchor="middle" font-size="11" fill="#2f5e23" font-weight="bold">2</text>
  <text x="534" y="96" text-anchor="middle" font-size="11" fill="#2f5e23" font-weight="bold">2</text>

  <text x="348" y="127" text-anchor="end" font-size="10.5" fill="#446688" font-weight="bold">v=3</text>
  <rect x="396" y="110" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="476" y="110" width="36" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="414" y="128" text-anchor="middle" font-size="11" fill="#2f5e23" font-weight="bold">3</text>
  <text x="494" y="128" text-anchor="middle" font-size="11" fill="#999" font-weight="bold">×</text>

  <text x="348" y="159" text-anchor="end" font-size="10.5" fill="#446688" font-weight="bold">v=4</text>
  <rect x="436" y="142" width="36" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="516" y="142" width="36" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="454" y="160" text-anchor="middle" font-size="11" fill="#999" font-weight="bold">×</text>
  <text x="534" y="160" text-anchor="middle" font-size="11" fill="#999" font-weight="bold">×</text>

  <text x="348" y="191" text-anchor="end" font-size="10.5" fill="#446688" font-weight="bold">v=8</text>
  <rect x="516" y="174" width="36" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="534" y="192" text-anchor="middle" font-size="11" fill="#999" font-weight="bold">×</text>

  <text x="348" y="229" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">best</text>
  <rect x="356" y="212" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="396" y="212" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="436" y="212" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="476" y="212" width="36" height="28" fill="#f5f5f5" stroke="#aaa" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="516" y="212" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="374" y="231" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2</text>
  <text x="414" y="231" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>
  <text x="454" y="231" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2</text>
  <text x="494" y="231" text-anchor="middle" font-size="11.5" fill="#999" font-weight="bold">2</text>
  <text x="534" y="231" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2</text>

  <rect x="356" y="252" width="196" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="454" y="270" text-anchor="middle" font-size="10.5" fill="#2f5e23">ans = best[4]+best[2]+best[8]+best[3]</text>
  <text x="454" y="288" text-anchor="middle" font-size="12.5" fill="#2f5e23" font-weight="bold">= 2 + 2 + 2 + 3 = 9</text>

  <text x="356" y="318" font-size="10" fill="#777">绿 = 首次标记（先到先得）    灰 × = 已被更小的 v 占据</text>

  <rect x="356" y="332" width="196" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="372" y="352" font-size="11.5" fill="#a87020" font-weight="bold">为什么对？</text>
  <text x="372" y="370" font-size="10" fill="#444">best[m] 有值 ⇔ 存在 v ∈ S 且</text>
  <text x="372" y="385" font-size="10" fill="#444">v | m；v 升序扫描 ⇒ 首个标记</text>
  <text x="372" y="400" font-size="10" fill="#444">m 的 v 恰是 S 中最小的约数</text>

  <text x="280" y="444" text-anchor="middle" font-size="11" fill="#8899aa">总操作数 Σ⌊maxV/v⌋ ≤ maxV·(1+1/2+1/3+…) ≈ maxV·ln maxV——调和级数</text>
</svg>
