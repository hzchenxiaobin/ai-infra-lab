<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">执行流程：FROM → 剔除最大月 → 窗口累计 → 排序输出</text>

  <!-- Step 1: FROM -->
  <rect x="40" y="46" width="170" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="125" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">① FROM Employee</text>
  <text x="125" y="84" text-anchor="middle" font-size="9.5" fill="#666">读取全部行（id, month, salary）</text>

  <!-- Step 2: WHERE filter max month -->
  <rect x="300" y="46" width="220" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="410" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">② 剔除每人最大月份</text>
  <text x="410" y="82" text-anchor="middle" font-size="9" fill="#666">WHERE (id, month) NOT IN</text>
  <text x="410" y="93" text-anchor="middle" font-size="9" fill="#666">(SELECT id, MAX(month) ...)</text>

  <path d="M210 71 L300 71" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 3: Window sort -->
  <rect x="40" y="126" width="220" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">③ 窗口排序</text>
  <text x="150" y="164" text-anchor="middle" font-size="9.5" fill="#666">PARTITION BY id</text>
  <text x="150" y="176" text-anchor="middle" font-size="9.5" fill="#666">ORDER BY month ASC</text>

  <path d="M410 96 L410 112 L150 112 L150 126" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 4: SUM OVER cumulative -->
  <rect x="300" y="126" width="220" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="410" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④ 窗口累计求和</text>
  <text x="410" y="164" text-anchor="middle" font-size="9.5" fill="#666">SUM(salary) OVER (...)</text>
  <text x="410" y="176" text-anchor="middle" font-size="9.5" fill="#666">→ 每行附累计 Salary</text>

  <path d="M260 154 L300 154" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 5: ORDER BY + SELECT -->
  <rect x="150" y="206" width="260" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="228" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">⑤ SELECT + ORDER BY</text>
  <text x="280" y="244" text-anchor="middle" font-size="9.5" fill="#666">id, month, Salary  ORDER BY id ASC, month DESC</text>

  <path d="M410 182 L410 196 L280 196 L280 206" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Detail box: employee 1 walkthrough -->
  <rect x="30" y="276" width="500" height="190" fill="#fcfcf6" stroke="#b85450" stroke-width="1.3" stroke-dasharray="5,3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">员工 1 逐行视图（步骤 ②③④ 细节）</text>

  <!-- header -->
  <rect x="50" y="308" width="250" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="68" y="322" font-size="8.5" fill="#333">id</text>
  <text x="108" y="322" font-size="8.5" fill="#333">month</text>
  <text x="160" y="322" font-size="8.5" fill="#333">salary</text>
  <text x="225" y="322" font-size="8.5" fill="#333">累计 Salary</text>
  <text x="290" y="322" font-size="8.5" fill="#333">状态</text>

  <!-- row month=1 -->
  <rect x="50" y="328" width="250" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="68" y="340" font-size="8.5" fill="#333">1</text>
  <text x="108" y="340" font-size="8.5" fill="#333">1</text>
  <text x="160" y="340" font-size="8.5" fill="#333">20</text>
  <text x="225" y="340" font-size="8.5" fill="#b85450" font-weight="bold">20</text>
  <text x="290" y="340" font-size="8.5" fill="#4a7a3a">保留</text>

  <!-- row month=2 -->
  <rect x="50" y="344" width="250" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="68" y="356" font-size="8.5" fill="#333">1</text>
  <text x="108" y="356" font-size="8.5" fill="#333">2</text>
  <text x="160" y="356" font-size="8.5" fill="#333">30</text>
  <text x="225" y="356" font-size="8.5" fill="#b85450" font-weight="bold">50</text>
  <text x="290" y="356" font-size="8.5" fill="#4a7a3a">保留</text>

  <!-- row month=3 -->
  <rect x="50" y="360" width="250" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="68" y="372" font-size="8.5" fill="#333">1</text>
  <text x="108" y="372" font-size="8.5" fill="#333">3</text>
  <text x="160" y="372" font-size="8.5" fill="#333">40</text>
  <text x="225" y="372" font-size="8.5" fill="#b85450" font-weight="bold">90</text>
  <text x="290" y="372" font-size="8.5" fill="#4a7a3a">保留</text>

  <!-- row month=4 -->
  <rect x="50" y="376" width="250" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="68" y="388" font-size="8.5" fill="#333">1</text>
  <text x="108" y="388" font-size="8.5" fill="#333">4</text>
  <text x="160" y="388" font-size="8.5" fill="#333">60</text>
  <text x="225" y="388" font-size="8.5" fill="#b85450" font-weight="bold">150</text>
  <text x="290" y="388" font-size="8.5" fill="#4a7a3a">保留</text>

  <!-- row month=5 (excluded) -->
  <rect x="50" y="392" width="250" height="16" fill="#eeeeee" stroke="#888" stroke-width="0.8" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="68" y="404" font-size="8.5" fill="#888">1</text>
  <text x="108" y="404" font-size="8.5" fill="#888">5</text>
  <text x="160" y="404" font-size="8.5" fill="#888">50</text>
  <text x="225" y="404" font-size="8.5" fill="#888">—</text>
  <text x="290" y="404" font-size="8.5" fill="#b85450" font-weight="bold">剔除(MAX)</text>
  <line x1="54" y1="400" x2="296" y2="400" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- annotation -->
  <text x="50" y="430" font-size="9.5" fill="#b85450">累计 = 20 → 20+30=50 → 50+40=90 → 90+60=150</text>
  <text x="50" y="446" font-size="9" fill="#888">month=5 被剔除，不参与累计（WHERE 先于窗口函数执行）</text>
  <text x="50" y="460" font-size="9" fill="#888">最终输出按 id ASC, month DESC：1/4→150, 1/3→90, 1/2→50, 1/1→20</text>
</svg>
