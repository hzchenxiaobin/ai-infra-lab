<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">总产能 g(t) 随时间单调不降 → 二分定位最小可行 t*</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">每人产能 = ⌊√(t/r)⌋，全体求和 = g(t)</text>

  <!-- ===== coordinate plot ===== -->
  <!-- axes -->
  <line x1="90" y1="250" x2="470" y2="250" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>   <!-- x axis -->
  <line x1="90" y1="250" x2="90" y2="80" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>      <!-- y axis -->
  <!-- arrow tips -->
  <path d="M 466 246 L 474 250 L 466 254" fill="none" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 86 84 L 90 76 L 94 84" fill="none" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <!-- axis labels -->
  <text x="478" y="254" font-size="11" fill="#666">时间 t</text>
  <text x="96" y="80" font-size="11" fill="#666">g(t) 可修车数</text>

  <!-- rising curve (concave-ish, hand drawn) -->
  <path d="M 90 248 Q 160 232 200 200 Q 250 165 300 150 Q 360 132 430 120"
        fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- cars threshold dashed line -->
  <line x1="90" y1="170" x2="470" y2="170" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="476" y="174" font-size="11" fill="#d6a040" font-weight="bold">cars</text>

  <!-- intersection point (curve crosses y=170 near x≈190) -->
  <circle cx="196" cy="170" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <!-- vertical dashed to x-axis -->
  <line x1="196" y1="170" x2="196" y2="250" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="196" y="266" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">t*  答案</text>

  <!-- left side (infeasible) label -->
  <text x="130" y="160" font-size="10" fill="#b85450">g(t)&lt;cars 修不完 ✗</text>
  <!-- right side (feasible) label -->
  <text x="300" y="160" font-size="10" fill="#4a7a3a">g(t)≥cars 修得完 ✓</text>

  <!-- two sample points on curve -->
  <circle cx="300" cy="150" r="3.5" fill="#446688" filter="url(#rough2)"/>
  <text x="308" y="146" font-size="10" fill="#888">t 越大产能越高</text>

  <!-- ===== bottom key idea box ===== -->
  <rect x="40" y="296" width="480" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">核心观察</text>
  <text x="58" y="340" font-size="11" fill="#444">① 等级 r 工人在 t 分钟内可修 ⌊√(t/r)⌋ 辆（由 r·n² ≤ t）</text>
  <text x="58" y="358" font-size="11" fill="#444">   ⇒ g(t) = Σ ⌊√(t/r)⌋ 随 t 单调不降 ⇒ 二段性 ⇒ 二分答案</text>
  <text x="58" y="378" font-size="11" fill="#446688" font-weight="bold">② ranks[i] ∈[1,100]：按值分组后 check 仅 O(100)，上界取 r_min·cars²</text>
</svg>
