<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="680" height="310" fill="#fafafa"/>

  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：26 个字母 ↔ 26 个比特位</text>

  <!-- 26 letter boxes: a(0) b(1) c(2) d(3) e(4) f(5) g(6) h(7) i(8) j(9) k(10) l(11) m(12) n(13) o(14) p(15) q(16) r(17) s(18) t(19) u(20) v(21) w(22) x(23) y(24) z(25) -->
  <!-- a -->
  <rect x="32" y="46" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="43" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <text x="43" y="98" text-anchor="middle" font-size="9" fill="#888">0</text>
  <!-- b -->
  <rect x="56" y="46" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="67" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <text x="67" y="98" text-anchor="middle" font-size="9" fill="#888">1</text>
  <!-- c -->
  <rect x="80" y="46" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="91" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <text x="91" y="98" text-anchor="middle" font-size="9" fill="#888">2</text>
  <!-- d -->
  <rect x="104" y="46" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="115" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>
  <text x="115" y="98" text-anchor="middle" font-size="9" fill="#888">3</text>
  <!-- e -->
  <rect x="128" y="46" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="139" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>
  <text x="139" y="98" text-anchor="middle" font-size="9" fill="#888">4</text>
  <!-- f -->
  <rect x="152" y="46" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="163" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">f</text>
  <text x="163" y="98" text-anchor="middle" font-size="9" fill="#888">5</text>
  <!-- g -->
  <rect x="176" y="46" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="187" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">g</text>
  <text x="187" y="98" text-anchor="middle" font-size="9" fill="#888">6</text>
  <!-- h -->
  <rect x="200" y="46" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="211" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">h</text>
  <text x="211" y="98" text-anchor="middle" font-size="9" fill="#888">7</text>
  <!-- i -->
  <rect x="224" y="46" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="235" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">i</text>
  <text x="235" y="98" text-anchor="middle" font-size="9" fill="#888">8</text>
  <!-- j -->
  <rect x="248" y="46" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="259" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">j</text>
  <text x="259" y="98" text-anchor="middle" font-size="9" fill="#888">9</text>
  <!-- k -->
  <rect x="272" y="46" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="283" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">k</text>
  <text x="283" y="98" text-anchor="middle" font-size="9" fill="#888">10</text>
  <!-- l -->
  <rect x="296" y="46" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="307" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">l</text>
  <text x="307" y="98" text-anchor="middle" font-size="9" fill="#888">11</text>
  <!-- m -->
  <rect x="320" y="46" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="331" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">m</text>
  <text x="331" y="98" text-anchor="middle" font-size="9" fill="#888">12</text>
  <!-- n -->
  <rect x="344" y="46" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="355" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">n</text>
  <text x="355" y="98" text-anchor="middle" font-size="9" fill="#888">13</text>
  <!-- o -->
  <rect x="368" y="46" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="379" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">o</text>
  <text x="379" y="98" text-anchor="middle" font-size="9" fill="#888">14</text>
  <!-- p -->
  <rect x="392" y="46" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="403" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">p</text>
  <text x="403" y="98" text-anchor="middle" font-size="9" fill="#888">15</text>
  <!-- q -->
  <rect x="416" y="46" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="427" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">q</text>
  <text x="427" y="98" text-anchor="middle" font-size="9" fill="#888">16</text>
  <!-- r -->
  <rect x="440" y="46" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="451" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">r</text>
  <text x="451" y="98" text-anchor="middle" font-size="9" fill="#888">17</text>
  <!-- s -->
  <rect x="464" y="46" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="475" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">s</text>
  <text x="475" y="98" text-anchor="middle" font-size="9" fill="#888">18</text>
  <!-- t (HIGHLIGHTED) -->
  <rect x="486" y="43" width="26" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="499" y="67" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">t</text>
  <text x="499" y="98" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">19</text>
  <!-- u -->
  <rect x="512" y="46" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="523" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">u</text>
  <text x="523" y="98" text-anchor="middle" font-size="9" fill="#888">20</text>
  <!-- v -->
  <rect x="536" y="46" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="547" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">v</text>
  <text x="547" y="98" text-anchor="middle" font-size="9" fill="#888">21</text>
  <!-- w -->
  <rect x="560" y="46" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="571" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">w</text>
  <text x="571" y="98" text-anchor="middle" font-size="9" fill="#888">22</text>
  <!-- x -->
  <rect x="584" y="46" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="595" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">x</text>
  <text x="595" y="98" text-anchor="middle" font-size="9" fill="#888">23</text>
  <!-- y -->
  <rect x="608" y="46" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="619" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">y</text>
  <text x="619" y="98" text-anchor="middle" font-size="9" fill="#888">24</text>
  <!-- z -->
  <rect x="632" y="46" width="22" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="643" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">z</text>
  <text x="643" y="98" text-anchor="middle" font-size="9" fill="#888">25</text>

  <!-- Bit position label -->
  <text x="18" y="67" text-anchor="middle" font-size="9" fill="#888">字母</text>
  <text x="18" y="98" text-anchor="middle" font-size="9" fill="#888">位</text>

  <!-- Arrow from 't' box to formula -->
  <path d="M 499 106 L 499 118" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Formula box -->
  <rect x="120" y="120" width="440" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="340" y="142" text-anchor="middle" font-size="12" fill="#333">字符 c → 1 &lt;&lt; (c − 'a') → mask |= (1 &lt;&lt; (c − 'a'))</text>

  <!-- Example annotation -->
  <text x="560" y="112" font-size="10" fill="#d6a040" font-weight="bold">c = 't' → 第 19 位</text>

  <!-- Target box -->
  <rect x="60" y="168" width="560" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="340" y="190" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">目标：mask == (1 &lt;&lt; 26) − 1 = 0x3FFFFFF（低 26 位全 1）⟺ 全字母句</text>

  <!-- Insight box -->
  <rect x="40" y="216" width="600" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="340" y="242" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">关键直觉：26 个字母 = 26 比特信息 → 一个 int 装下整个「出现过」状态</text>
  <text x="340" y="264" text-anchor="middle" font-size="11" fill="#666">按位或 |= 累积「出现过」的状态；整数 == 判满替代集合大小判定</text>
  <text x="340" y="282" text-anchor="middle" font-size="11" fill="#666">每次 OR 后 O(1) 检查 mask == FULL → 天然支持提前终止</text>
  <text x="340" y="298" text-anchor="middle" font-size="10" fill="#888">时间 O(n)，空间 O(1)（一个 32 位整数）</text>
</svg>
