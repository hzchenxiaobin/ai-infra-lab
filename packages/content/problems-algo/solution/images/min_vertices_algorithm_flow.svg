<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    算法流程：统计入度 → 收集 0 入度顶点
  </text>

  <!-- 步骤1: 初始化入度数组 -->
  <rect x="60" y="60" width="220" height="50" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="82" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    初始化 indeg[0..n-1] = 0
  </text>
  <text x="170" y="100" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    O(n) 空间
  </text>

  <!-- 箭头 -->
  <path d="M170,114 L170,140" stroke="#4a7a3a" stroke-width="2"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤2: 遍历边累加入度 -->
  <rect x="60" y="146" width="220" height="60" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="170" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    for e in edges:
  </text>
  <text x="170" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    indeg[e.to] += 1
  </text>

  <!-- 箭头 -->
  <path d="M170,210 L170,236" stroke="#4a7a3a" stroke-width="2"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤3: 扫描收集 -->
  <rect x="60" y="242" width="220" height="60" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="266" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    for i in 0..n-1:
  </text>
  <text x="170" y="286" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    if indeg[i]==0: ans.add(i)
  </text>

  <!-- 箭头 -->
  <path d="M170,306 L170,332" stroke="#4a7a3a" stroke-width="2"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤4: 返回 -->
  <rect x="60" y="338" width="220" height="50" rx="8" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="360" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    return ans
  </text>
  <text x="170" y="378" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">
    即所有入度为 0 的顶点
  </text>

  <!-- 右侧说明 -->
  <rect x="320" y="146" width="210" height="120" rx="8" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="425" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    <tspan x="425" dy="0">为什么只看入度？</tspan>
    <tspan x="425" dy="22">入度=0 ⇒ 无人指向</tspan>
    <tspan x="425" dy="18">必选（不可替代）</tspan>
    <tspan x="425" dy="22">入度&gt;0 ⇒ 沿入边回溯</tspan>
    <tspan x="425" dy="18">必到入度 0 顶点</tspan>
    <tspan x="425" dy="18">已被覆盖</tspan>
  </text>

  <!-- 复杂度标注 -->
  <rect x="320" y="282" width="210" height="70" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="425" y="306" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    <tspan x="425" dy="0">时间 O(n + m)</tspan>
    <tspan x="425" dy="22">空间 O(n)</tspan>
  </text>
  <text x="425" y="372" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">
    m = edges.length
  </text>
</svg>
