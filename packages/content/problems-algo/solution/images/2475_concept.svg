<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold">核心观察：补集计数——「不等三元组」= 总数 − 「至少一对相等」</text>

  <!-- Total triplets -->
  <rect x="150" y="46" width="260" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">全部三元组 C(n,3)</text>
  <text x="280" y="83" text-anchor="middle" font-size="10.5" fill="#446688">= n·(n−1)·(n−2) / 6</text>

  <!-- minus sign -->
  <text x="280" y="110" text-anchor="middle" font-size="22" fill="#b85450" font-weight="bold">−</text>

  <!-- two invalid boxes -->
  <rect x="28" y="120" width="236" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="146" y="142" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">三同：Σ_v C(cnt[v], 3)</text>
  <text x="146" y="160" text-anchor="middle" font-size="10" fill="#d6a040">三位置都取值 v</text>
  <text x="146" y="175" text-anchor="middle" font-size="9.5" fill="#888">cnt[v]≥3 才有贡献</text>

  <rect x="296" y="120" width="236" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="414" y="142" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">两同一异：Σ_v C(cnt[v],2)·(n−cnt[v])</text>
  <text x="414" y="160" text-anchor="middle" font-size="10" fill="#d6a040">恰两位置取 v，第三不同</text>
  <text x="414" y="175" text-anchor="middle" font-size="9.5" fill="#888">第三个从「非 v」任选</text>

  <!-- equals sign -->
  <text x="280" y="206" text-anchor="middle" font-size="20" fill="#4a7a3a" font-weight="bold">=</text>

  <!-- result -->
  <rect x="110" y="214" width="340" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="234" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">不等三元组（答案）</text>
  <text x="280" y="251" text-anchor="middle" font-size="10.5" fill="#4a7a3a">C(n,3) − Σ_v [C(cnt[v],3) + C(cnt[v],2)·(n−cnt[v])]</text>

  <!-- note box: disjointness -->
  <rect x="24" y="284" width="512" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="10.5" fill="#333">⚠️ 两类互斥且完备：三同（全等 v）与两同一异（恰两等 v）不重叠；合起来即「至少一对相等」。</text>
  <text x="280" y="320" text-anchor="middle" font-size="10.5" fill="#333">两同一异按「重复值 v」唯一归属——第三个 ≠ v，故每个等值三元组恰被一个 v 统计，不重不漏。</text>
  <text x="280" y="336" text-anchor="middle" font-size="10.5" fill="#333">正向数「两两不同」要枚举三值组合 O(m³)；反向按频次 O(n) 搞定。</text>

  <text x="24" y="370" font-size="10.5" fill="#888">• 频次表 cnt[v] 一次遍历建立，再一趟求和，整体 O(n + U)，U 为值域。</text>
  <text x="24" y="388" font-size="10.5" fill="#888">• 暴力三重循环 O(n³) 对 n≤100 也能 AC，但补集法把复杂度压到线性。</text>
  <text x="24" y="406" font-size="10.5" fill="#888">• 与 2364 坏数对同构：好/坏 = 总数对 − 同差对，本题为 不等 = 总三元组 − 等值三元组。</text>
</svg>
