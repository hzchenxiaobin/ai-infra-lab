<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：链表 1→0→1，ans 从 0 演化到 5</text>

  <!-- Linked list above the table -->
  <rect x="70" y="44" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="98" y="65" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <line x1="126" y1="60" x2="158" y2="60" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="164" y="44" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="192" y="65" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <line x1="220" y1="60" x2="252" y2="60" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="258" y="44" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="286" y="65" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="330" y="65" font-size="11" fill="#888">head 从左向右走</text>

  <!-- Table header -->
  <rect x="40" y="92" width="60" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="111" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">步骤</text>
  <rect x="100" y="92" width="90" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="145" y="111" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">当前位</text>
  <rect x="190" y="92" width="150" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="265" y="111" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">运算</text>
  <rect x="340" y="92" width="80" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="380" y="111" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">ans</text>
  <rect x="420" y="92" width="130" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="485" y="111" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">二进制含义</text>

  <!-- Row: init -->
  <rect x="40" y="120" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="139" text-anchor="middle" font-size="11" fill="#333">初始</text>
  <rect x="100" y="120" width="90" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="145" y="139" text-anchor="middle" font-size="11" fill="#888">—</text>
  <rect x="190" y="120" width="150" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="265" y="139" text-anchor="middle" font-size="11" fill="#333">ans = 0</text>
  <rect x="340" y="120" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="139" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">0</text>
  <rect x="420" y="120" width="130" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="485" y="139" text-anchor="middle" font-size="11" fill="#888">(空)</text>

  <!-- Row: step 1 -->
  <rect x="40" y="148" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="167" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="100" y="148" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="167" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <rect x="190" y="148" width="150" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="265" y="167" text-anchor="middle" font-size="11" fill="#333">0 × 2 + 1</text>
  <rect x="340" y="148" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="167" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <rect x="420" y="148" width="130" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="485" y="167" text-anchor="middle" font-size="11" fill="#555">"1" = 1</text>

  <!-- Row: step 2 -->
  <rect x="40" y="176" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="195" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="100" y="176" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="195" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0</text>
  <rect x="190" y="176" width="150" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="265" y="195" text-anchor="middle" font-size="11" fill="#333">1 × 2 + 0</text>
  <rect x="340" y="176" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="195" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>
  <rect x="420" y="176" width="130" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="485" y="195" text-anchor="middle" font-size="11" fill="#555">"10" = 2</text>

  <!-- Row: step 3 (final, highlighted) -->
  <rect x="40" y="204" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="223" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="100" y="204" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="223" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="190" y="204" width="150" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="265" y="223" text-anchor="middle" font-size="11" fill="#333">2 × 2 + 1</text>
  <rect x="340" y="204" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="223" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">5</text>
  <rect x="420" y="204" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="485" y="223" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"101" = 5 ✓</text>

  <!-- Connecting arrows from list nodes to table rows -->
  <path d="M 98 76 L 98 100 L 145 100 L 145 148" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 192 76 L 192 100 L 145 100 L 145 176" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 286 76 L 286 100 L 145 100 L 145 204" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Bottom note -->
  <rect x="60" y="256" width="460" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="74" y="278" font-size="12" fill="#333" font-weight="bold">💡 不变式验证</text>
  <text x="74" y="296" font-size="11" fill="#555">每步 ans 恰好 = 已遍历位串的十进制值：</text>
  <text x="74" y="312" font-size="11" fill="#555">"1"→1，"10"→2，"101"→5。左移（×2）把旧位升高一级，新位填入最低位。</text>
</svg>
