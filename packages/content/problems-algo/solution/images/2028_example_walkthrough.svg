<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：rolls=[1,5,6], mean=3, n=4</text>
  <text x="270" y="42" text-anchor="middle" font-size="10.5" fill="#888">缺失和 9 → 商余均匀分配为 [3,2,2,2]</text>

  <!-- Step 1: total -->
  <text x="40" y="74" font-size="11" fill="#666" font-weight="bold">① 总和</text>
  <rect x="120" y="58" width="300" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="76" text-anchor="middle" font-size="11" fill="#333">mean×(n+m) = 3×(4+3) = 21</text>

  <path d="M 270 88 L 270 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: observed sum -->
  <text x="40" y="118" font-size="11" fill="#666" font-weight="bold">② 已观测</text>
  <rect x="120" y="102" width="300" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="120" text-anchor="middle" font-size="11" fill="#333">Σrolls = 1+5+6 = 12</text>

  <path d="M 270 132 L 270 144" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: missing sum (highlight) -->
  <text x="40" y="162" font-size="11" fill="#b85450" font-weight="bold">③ 缺失和</text>
  <rect x="120" y="146" width="300" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="164" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">s = 21 − 12 = 9</text>

  <path d="M 270 176 L 270 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: feasibility -->
  <text x="40" y="206" font-size="11" fill="#666" font-weight="bold">④ 判可行</text>
  <rect x="120" y="190" width="300" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a">n=4 ≤ 9 ≤ 24=6n ✓ 有解</text>

  <path d="M 270 220 L 270 232" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: quotient/remainder -->
  <text x="40" y="250" font-size="11" fill="#666" font-weight="bold">⑤ 商余</text>
  <rect x="120" y="234" width="300" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="252" text-anchor="middle" font-size="11" fill="#333">q = 9÷4 = 2，r = 9 mod 4 = 1</text>

  <path d="M 270 264 L 270 278" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6: fill dice -->
  <text x="40" y="300" font-size="11" fill="#666" font-weight="bold">⑥ 分配</text>

  <!-- first r=1 die: q+1=3 (orange) -->
  <rect x="150" y="284" width="40" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="5" filter="url(#rough2)"/>
  <text x="170" y="308" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="170" y="334" text-anchor="middle" font-size="9" fill="#d6a040">q+1</text>

  <!-- rest n-r=3 dice: q=2 (blue) -->
  <rect x="200" y="284" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="220" y="308" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="250" y="284" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="270" y="308" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="300" y="284" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="320" y="308" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="270" y="334" text-anchor="middle" font-size="9" fill="#446688">q（共 n−r=3 个）</text>

  <!-- verify box -->
  <rect x="100" y="352" width="340" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="368" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">验证：3+2+2+2 = 9 ✓  每个 ∈[1,6] ✓</text>
  <text x="270" y="380" text-anchor="middle" font-size="10" fill="#888">注：[1,2,3,3] 同样合法，题目允许任意解</text>
</svg>
