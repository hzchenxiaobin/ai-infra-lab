<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold" filter="url(#rough2)">示例 2 演算：3×3 矩阵的菱形和</text>

  <!-- ===== Left: 3x3 grid, origin x0=50 y0=80, cell 56 ===== -->
  <!-- normal cells -->
  <g filter="url(#rough2)">
    <rect x="50" y="80" width="56" height="56" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="106" y="80" width="56" height="56" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="162" y="80" width="56" height="56" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="50" y="136" width="56" height="56" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="106" y="136" width="56" height="56" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="162" y="136" width="56" height="56" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="50" y="192" width="56" height="56" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="106" y="192" width="56" height="56" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="162" y="192" width="56" height="56" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
  </g>

  <!-- center (1,1)=5 light green -->
  <rect x="106" y="136" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="134" y="170" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="134" y="154" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">C(1,1)</text>

  <!-- blue rhombus corners: T(0,1)=2 R(1,2)=6 B(2,1)=8 L(1,0)=4 -->
  <rect x="106" y="80" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="134" y="114" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="134" y="98" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">T</text>

  <rect x="162" y="136" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="170" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="214" y="150" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">R</text>

  <rect x="106" y="192" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="134" y="226" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="134" y="254" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">B</text>

  <rect x="50" y="136" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="78" y="170" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="58" y="150" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">L</text>

  <!-- remaining cells values: (0,0)=1 (0,2)=3 (1,1) done (2,0)=7 (2,2)=9 -->
  <text x="78" y="114" text-anchor="middle" font-size="16" fill="#999" filter="url(#rough2)">1</text>
  <text x="190" y="114" text-anchor="middle" font-size="16" fill="#999" filter="url(#rough2)">3</text>
  <text x="78" y="226" text-anchor="middle" font-size="16" fill="#999" filter="url(#rough2)">7</text>
  <text x="190" y="226" text-anchor="middle" font-size="16" fill="#999" filter="url(#rough2)">9</text>

  <!-- rhombus outline T(134,108) R(190,164) B(134,220) L(78,164) -->
  <polygon points="134,108 190,164 134,220 78,164" fill="none" stroke="#446688" stroke-width="2" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- caption under grid -->
  <rect x="40" y="262" width="190" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="135" y="280" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">中心 (1,1)，k=1</text>
  <text x="135" y="296" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">2 + 6 + 8 + 4 = 20</text>

  <!-- formula note -->
  <rect x="40" y="312" width="190" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="135" y="330" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">四边闭区间和 − 四角</text>
  <text x="135" y="346" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">= (2+6)+(6+8)+(4+8)+(2+4)</text>
  <text x="135" y="362" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">− (2+6+8+4) = 40−20 = 20</text>

  <!-- ===== Right: candidate table ===== -->
  <text x="445" y="68" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">候选菱形和（降序去重）</text>

  <!-- table header -->
  <rect x="270" y="80" width="350" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="96" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">中心 (cx,cy)</text>
  <text x="400" y="96" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">k</text>
  <text x="470" y="96" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">边界格</text>
  <text x="575" y="96" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">和</text>

  <!-- row 1: (1,1) k=1 -> 20 -->
  <rect x="270" y="104" width="350" height="26" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="320" y="121" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(1,1)</text>
  <text x="400" y="121" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="470" y="121" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2,6,8,4</text>
  <text x="575" y="121" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">20</text>

  <!-- row 2: (2,2) k=0 -> 9 -->
  <rect x="270" y="130" width="350" height="26" fill="#fce4ec" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="320" y="147" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(2,2)</text>
  <text x="400" y="147" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="470" y="147" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">9</text>
  <text x="575" y="147" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">9</text>

  <!-- row 3: (2,1) k=0 -> 8 -->
  <rect x="270" y="156" width="350" height="26" fill="#e6f4ea" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="320" y="173" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(2,1)</text>
  <text x="400" y="173" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="470" y="173" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">8</text>
  <text x="575" y="173" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">8</text>

  <!-- row 4: (2,0) k=0 -> 7 -->
  <rect x="270" y="182" width="350" height="26" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="320" y="199" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">(2,0)</text>
  <text x="400" y="199" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="470" y="199" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">7</text>
  <text x="575" y="199" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">7</text>

  <!-- row 5: others <= 6 -->
  <rect x="270" y="208" width="350" height="26" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="320" y="225" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">其余</text>
  <text x="400" y="225" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0/1</text>
  <text x="470" y="225" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1,3,4,5,6…</text>
  <text x="575" y="225" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">≤6</text>

  <!-- top-3 result -->
  <rect x="270" y="252" width="350" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="445" y="274" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">前三（降序）= [20, 9, 8]</text>

  <!-- note -->
  <rect x="270" y="296" width="350" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="282" y="316" font-size="10" fill="#555" filter="url(#rough2)">• k=0：退化单格，菱形和 = 该格值</text>
  <text x="282" y="334" font-size="10" fill="#555" filter="url(#rough2)">• k=1：四角即全部边界格（无内部边格）</text>
  <text x="282" y="352" font-size="10" fill="#555" filter="url(#rough2)">• 7 进不了前三，被丢弃；只需前三不同</text>
</svg>
