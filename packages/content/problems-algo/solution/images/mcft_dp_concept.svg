<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8edb"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
    <marker id="aro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="860" height="520" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">最低票价：日历 DP 核心观察</text>
  <path d="M 270 42 Q 430 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- intro line -->
  <text x="430" y="74" text-anchor="middle" font-size="12" fill="#555">站在「最后一个旅行日 d」往回看：最后一张通行证只可能是三种之一</text>

  <!-- ===== Timeline ===== -->
  <g filter="url(#sk)">
    <line x1="80" y1="150" x2="780" y2="150" stroke="#888" stroke-width="1.5"/>
  </g>

  <!-- day d marker (right end) -->
  <g filter="url(#sk2)">
    <rect x="720" y="138" width="60" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="750" y="156" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">day d</text>
  <text x="750" y="180" text-anchor="middle" font-size="10" fill="#b03a3a">旅行日</text>

  <!-- three lookback regions -->
  <!-- 1-day: covers d -->
  <g filter="url(#sk2)">
    <rect x="720" y="200" width="60" height="22" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="750" y="215" text-anchor="middle" font-size="10" fill="#2b6e9e">1 天</text>
  <path d="M 750 222 L 750 240" stroke="#4a8edb" stroke-width="1.4" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>

  <!-- 7-day: covers d-6 .. d, lookback to d-7 -->
  <g filter="url(#sk2)">
    <rect x="540" y="200" width="240" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="660" y="215" text-anchor="middle" font-size="10" fill="#2e6e2e">7 天通行证覆盖 d−6 … d</text>
  <path d="M 540 222 L 540 240" stroke="#4a8e4a" stroke-width="1.4" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="540" y="138" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">d−7</text>
  <g filter="url(#sk)"><line x1="540" y1="142" x2="540" y2="150" stroke="#4a8e4a" stroke-width="1.2"/></g>

  <!-- 30-day: covers d-29 .. d, lookback to d-30 -->
  <g filter="url(#sk2)">
    <rect x="120" y="200" width="660" height="22" rx="3" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="420" y="215" text-anchor="middle" font-size="10" fill="#7a5415">30 天通行证覆盖 d−29 … d</text>
  <path d="M 120 222 L 120 240" stroke="#c98a2b" stroke-width="1.4" fill="none" marker-end="url(#aro)" filter="url(#sk)"/>
  <text x="120" y="138" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">d−30</text>
  <g filter="url(#sk)"><line x1="120" y1="142" x2="120" y2="150" stroke="#c98a2b" stroke-width="1.2"/></g>

  <!-- lookback dp labels -->
  <g filter="url(#sk2)">
    <rect x="90" y="246" width="64" height="26" rx="4" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="122" y="264" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">dp[d−30]</text>

  <g filter="url(#sk2)">
    <rect x="510" y="246" width="64" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="542" y="264" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">dp[d−7]</text>

  <g filter="url(#sk2)">
    <rect x="710" y="246" width="80" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="750" y="264" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">dp[d−1]</text>

  <!-- ===== Recurrence formula box ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="300" width="740" height="92" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="430" y="326" text-anchor="middle" font-size="13" fill="#2b6e2e" font-weight="bold">旅行日 d 的转移方程</text>
  <text x="430" y="352" text-anchor="middle" font-size="13" fill="#2b6e9e" font-family="monospace" font-weight="bold">dp[d] = min( dp[d−1]+costs[0],  dp[d−7]+costs[1],  dp[d−30]+costs[2] )</text>
  <text x="430" y="376" text-anchor="middle" font-size="11" fill="#888">下标越界视为 0（即 dp[负数] = 0，通行证从第 1 天起可用）</text>

  <!-- ===== Non-travel day rule ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="412" width="740" height="46" rx="8" fill="#f4f4f4" stroke="#9e9e9e" stroke-width="1.1" stroke-dasharray="5 3"/>
  </g>
  <text x="430" y="440" text-anchor="middle" font-size="12" fill="#555">非旅行日 d：<tspan font-family="monospace" font-weight="bold" fill="#333">dp[d] = dp[d−1]</tspan>（不买票，费用与前一天相同）</text>

  <!-- footer note -->
  <text x="430" y="488" text-anchor="middle" font-size="10" fill="#888">关键：只关心「最后一张票是哪种」，它把日子切成「票覆盖段 + 之前的子问题」</text>
</svg>
