<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">仅仅反转字母：算法流程</text>

  <!-- Step 1: Init -->
  <rect x="120" y="44" width="160" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="200" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 初始化</text>
  <text x="200" y="78" text-anchor="middle" font-size="11" fill="#555">L = 0, R = n − 1</text>

  <!-- Arrow down -->
  <path d="M 200 86 L 200 100" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Diamond L < R? -->
  <path d="M 200 100 L 280 140 L 200 180 L 120 140 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">L &lt; R ?</text>
  <text x="200" y="152" text-anchor="middle" font-size="10" fill="#888">（② 循环条件）</text>

  <!-- No branch (right) -->
  <path d="M 280 140 L 380 140" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="132" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="380" y="120" width="110" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="435" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 s</text>

  <!-- Yes branch (down) -->
  <path d="M 200 180 L 200 196" stroke="#82b366" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="192" font-size="11" fill="#82b366">是</text>

  <!-- Step 3: Diamond s[L] 是字母? -->
  <path d="M 200 196 L 290 236 L 200 276 L 110 236 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="232" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">s[L] 是字母?</text>
  <text x="200" y="248" text-anchor="middle" font-size="10" fill="#888">（③）</text>

  <!-- No branch (right) -->
  <path d="M 290 236 L 380 236" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="335" y="228" text-anchor="middle" font-size="11" fill="#d6a040">否</text>
  <rect x="380" y="216" width="80" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="242" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">L++</text>

  <!-- Yes branch (down) -->
  <path d="M 200 276 L 200 292" stroke="#82b366" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="288" font-size="11" fill="#82b366">是</text>

  <!-- Step 4: Diamond s[R] 是字母? -->
  <path d="M 200 292 L 290 332 L 200 372 L 110 332 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="328" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">s[R] 是字母?</text>
  <text x="200" y="344" text-anchor="middle" font-size="10" fill="#888">（④）</text>

  <!-- No branch (right) -->
  <path d="M 290 332 L 380 332" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="335" y="324" text-anchor="middle" font-size="11" fill="#d6a040">否</text>
  <rect x="380" y="312" width="80" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="338" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">R−−</text>

  <!-- Yes branch (down) -->
  <path d="M 200 372 L 200 388" stroke="#82b366" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="384" font-size="11" fill="#82b366">是</text>

  <!-- Step 5: Swap box -->
  <rect x="90" y="388" width="220" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="200" y="408" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⑤ swap(s[L], s[R])</text>
  <text x="200" y="424" text-anchor="middle" font-size="11" fill="#555">L++; R−−</text>

  <!-- Loop-back arrows: L++, R--, swap all feed back to diamond ② -->
  <!-- From L++ right to loop column -->
  <path d="M 460 237 L 500 237" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <!-- From R-- right to loop column -->
  <path d="M 460 333 L 500 333" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <!-- From swap right to loop column -->
  <path d="M 310 411 L 500 411" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <!-- Vertical loop line up -->
  <path d="M 500 411 L 500 88" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <!-- Horizontal back to top of diamond ② -->
  <path d="M 500 88 L 200 88 L 200 100" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop-back label -->
  <text x="510" y="180" font-size="10" fill="#888" transform="rotate(-90 510 180)">回到 ② 判断</text>

  <!-- Summary -->
  <rect x="60" y="448" width="440" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="280" y="464" text-anchor="middle" font-size="11" fill="#888">每个字符至多被访问一次，O(n) 时间 O(1) 空间</text>
</svg>
