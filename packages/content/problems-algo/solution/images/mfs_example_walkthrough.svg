<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a8e4a"/>
    </marker>
  </defs>

  <rect width="720" height="600" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,1,1,2,1,2]，k = 3 → 最大频率得分 5</text>
  <text x="360" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">cur 始终保持取模，答案取各窗口 cur 的最大值</text>

  <!-- 表头 -->
  <g font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="150" y="72">窗口（值 / 下标）</text>
    <text x="360" y="72">cnt 频次表</text>
    <text x="560" y="72">score 与 cur</text>
  </g>

  <!-- 窗口 1：[1,1,1] -->
  <rect x="30" y="82" width="660" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="60" y="96" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="106" y="96" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="152" y="96" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle" fill="#3a4e7a" filter="url(#rough2)">
    <text x="81" y="118">1</text><text x="127" y="118">1</text><text x="173" y="118">1</text>
  </g>
  <g font-size="8.5" fill="#bbb" text-anchor="middle" filter="url(#rough2)">
    <text x="81" y="146">0</text><text x="127" y="146">1</text><text x="173" y="146">2</text>
  </g>
  <text x="360" y="118" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{ 1 : 3 }</text>
  <text x="560" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1³ = 1</text>
  <text x="560" y="132" text-anchor="middle" font-size="12.5" fill="#3a4e7a" font-weight="bold" filter="url(#rough2)">cur = 1　ans = 1</text>

  <!-- 转移 1 -->
  <text x="360" y="162" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">i=3：a = nums[0]=1，b = nums[3]=2，a≠b → Δ_b = +2（新值入窗），Δ_a = −0（1 的贡献 1³→1²）</text>
  <path d="M 360 168 L 360 182" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 窗口 2：[1,1,2] -->
  <rect x="30" y="186" width="660" height="64" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="60" y="200" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="106" y="200" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="152" y="200" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="81" y="222" fill="#3a4e7a">1</text><text x="127" y="222" fill="#3a4e7a">1</text><text x="173" y="222" fill="#3a5a2a">2</text>
  </g>
  <g font-size="8.5" fill="#bbb" text-anchor="middle" filter="url(#rough2)">
    <text x="81" y="250">1</text><text x="127" y="250">2</text><text x="173" y="250">3</text>
  </g>
  <text x="360" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{ 1 : 2,  2 : 1 }</text>
  <text x="560" y="214" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1² + 2¹ = 3</text>
  <text x="560" y="236" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">cur = 3　ans = 3</text>

  <!-- 转移 2 -->
  <text x="360" y="266" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#rough2)">i=4：a = nums[1]=1，b = nums[4]=1，a == b → 频次不变，跳过</text>
  <path d="M 360 272 L 360 286" stroke="#7a5415" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 窗口 3：[1,2,1] -->
  <rect x="30" y="290" width="660" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="60" y="304" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="106" y="304" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="152" y="304" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="81" y="326" fill="#3a4e7a">1</text><text x="127" y="326" fill="#3a5a2a">2</text><text x="173" y="326" fill="#3a4e7a">1</text>
  </g>
  <g font-size="8.5" fill="#bbb" text-anchor="middle" filter="url(#rough2)">
    <text x="81" y="354">2</text><text x="127" y="354">3</text><text x="173" y="354">4</text>
  </g>
  <text x="360" y="326" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{ 1 : 2,  2 : 1 }</text>
  <text x="560" y="318" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1² + 2¹ = 3</text>
  <text x="560" y="340" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold" filter="url(#rough2)">cur = 3（不变）ans = 3</text>

  <!-- 转移 3 -->
  <text x="360" y="370" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">i=5：a = nums[2]=1，b = nums[5]=2，a≠b → Δ_b = +(2−1)·2¹ = +2，Δ_a = −0</text>
  <path d="M 360 376 L 360 390" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 窗口 4：[2,1,2] -->
  <rect x="30" y="394" width="660" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="60" y="408" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="106" y="408" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="152" y="408" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="81" y="430" fill="#3a5a2a">2</text><text x="127" y="430" fill="#3a4e7a">1</text><text x="173" y="430" fill="#3a5a2a">2</text>
  </g>
  <g font-size="8.5" fill="#bbb" text-anchor="middle" filter="url(#rough2)">
    <text x="81" y="458">3</text><text x="127" y="458">4</text><text x="173" y="458">5</text>
  </g>
  <text x="360" y="430" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{ 1 : 1,  2 : 2 }</text>
  <text x="560" y="422" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1¹ + 2² = 5</text>
  <text x="560" y="444" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">cur = 5　ans = 5 ✓</text>

  <!-- 趋势条 -->
  <rect x="40" y="480" width="640" height="92" fill="#fffdf3" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="502" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">cur 走势</text>
  <g font-size="13" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="130" y="534" fill="#3a4e7a">1</text>
    <text x="180" y="534" fill="#888">─▶</text>
    <text x="260" y="534" fill="#2e6e2e">3</text>
    <text x="330" y="534" fill="#888">─(跳过)▶</text>
    <text x="460" y="534" fill="#7a5415">3</text>
    <text x="510" y="534" fill="#888">─▶</text>
    <text x="590" y="534" fill="#b85450">5</text>
  </g>
  <text x="360" y="560" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">答案 = max{1, 3, 3, 5} = 5　（子数组 [2,1,2] 取得最大）</text>
</svg>
