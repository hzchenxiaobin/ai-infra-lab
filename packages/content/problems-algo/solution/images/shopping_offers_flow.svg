<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：过滤劣质礼包 → 记忆化 DFS → 取最小</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">状态 = needs 元组，转移 = 套用一个合法礼包或直接原价兜底</text>

  <g font-size="10" fill="#333">
    <!-- Step 1: filter -->
    <rect x="40" y="64" width="440" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="84" font-size="12" fill="#446688" font-weight="bold">① 过滤劣质礼包</text>
    <text x="180" y="84" font-family="monospace" font-size="10" fill="#555">if offer[-1] &gt;= Σ offer[i]·price[i]: 丢弃</text>
    <text x="54" y="102" font-size="9" fill="#888">比单买还贵的礼包永远不会被选用，提前剔除缩小搜索空间</text>
    <text x="54" y="116" font-size="9" fill="#d6a040">等价于：只保留 offer price &lt; 单买总和 的礼包</text>

    <path d="M 260 122 L 260 136" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 2: DFS baseline -->
    <rect x="40" y="140" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="160" font-size="12" fill="#4a7a3a" font-weight="bold">② DFS(state)：先算原价兜底</text>
    <text x="54" y="178" font-family="monospace" font-size="10" fill="#555">cost = Σ needs[i] · price[i]</text>
    <text x="54" y="192" font-size="9" fill="#888">最朴素方案：剩余全按单品价买，作为初始上界</text>

    <path d="M 260 198 L 260 212" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 3: try offers -->
    <rect x="40" y="216" width="440" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="236" font-size="12" fill="#d6a040" font-weight="bold">③ 遍历每个好礼包，能套则套</text>
    <text x="54" y="254" font-family="monospace" font-size="10" fill="#555">for offer in good:</text>
    <text x="70" y="270" font-family="monospace" font-size="10" fill="#4a7a3a">if needs[i] &gt;= offer[i] ∀i:  // 不超量</text>
    <text x="86" y="286" font-family="monospace" font-size="10" fill="#b85450">cost = min(cost, offer[-1] + dfs(needs - offer))</text>
    <text x="54" y="298" font-size="9" fill="#888">套用后 needs 各分量减少，转移到更小子状态</text>

    <path d="M 260 304 L 260 318" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 4: memo + return -->
    <rect x="40" y="322" width="440" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="342" font-size="12" fill="#b85450" font-weight="bold">④ 记忆化缓存 + 返回</text>
    <text x="54" y="360" font-family="monospace" font-size="10" fill="#555">memo[state] = cost; return cost</text>
    <text x="54" y="374" font-size="9" fill="#888">首次算完即缓存，后续命中直接返回，避免指数级重复</text>

    <!-- complexity -->
    <rect x="40" y="392" width="440" height="36" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
    <text x="260" y="410" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">状态数 ≤ Π(needs[i]+1) ≤ 11⁶  ·  每状态遍历礼包 O(S)</text>
    <text x="260" y="424" text-anchor="middle" font-size="10" fill="#888">记忆化 DFS 只访问可达状态，实测远小于上界</text>
  </g>
</svg>
