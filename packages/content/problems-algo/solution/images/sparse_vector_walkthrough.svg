<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：nums1=[1,0,0,2,3], nums2=[0,3,0,4,0] → 8</text>

  <!-- ===== Row 1: build d1 from nums1 ===== -->
  <text x="30" y="62" font-size="12" fill="#888" font-weight="bold">① 构造 d1（遍历 nums1，非零入表）</text>

  <!-- nums1 cells -->
  <text x="30" y="88" font-size="10" fill="#aaa">idx:</text>
  <rect x="70" y="72" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="87" y="90" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="106" y="72" width="34" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="123" y="90" text-anchor="middle" font-size="11" fill="#ccc">0</text>
  <rect x="142" y="72" width="34" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="159" y="90" text-anchor="middle" font-size="11" fill="#ccc">0</text>
  <rect x="178" y="72" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="195" y="90" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="214" y="72" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="231" y="90" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- arrow to d1 -->
  <path d="M 258 85 L 296 85" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="277" y="78" text-anchor="middle" font-size="9" fill="#888">非零</text>

  <!-- d1 hashmap -->
  <rect x="300" y="68" width="115" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="357" y="89" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d1 = {0:1, 3:2, 4:3}</text>

  <!-- ===== Row 2: build d2 from nums2 ===== -->
  <text x="30" y="128" font-size="12" fill="#888" font-weight="bold">② 构造 d2（遍历 nums2，非零入表）</text>

  <text x="30" y="154" font-size="10" fill="#aaa">idx:</text>
  <rect x="70" y="138" width="34" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="87" y="156" text-anchor="middle" font-size="11" fill="#ccc">0</text>
  <rect x="106" y="138" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="123" y="156" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="142" y="138" width="34" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="159" y="156" text-anchor="middle" font-size="11" fill="#ccc">0</text>
  <rect x="178" y="138" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="195" y="156" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="214" y="138" width="34" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="231" y="156" text-anchor="middle" font-size="11" fill="#ccc">0</text>

  <path d="M 258 151 L 296 151" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="277" y="144" text-anchor="middle" font-size="9" fill="#888">非零</text>

  <rect x="300" y="134" width="115" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="357" y="155" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d2 = {1:3, 3:4}</text>

  <!-- ===== Row 3: pick smaller ===== -->
  <rect x="30" y="190" width="380" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="220" y="212" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">③ len(d2)=2 &lt; len(d1)=3 → 选 d2 遍历，查 d1</text>

  <!-- ===== Row 4: step table ===== -->
  <text x="30" y="248" font-size="12" fill="#888" font-weight="bold">④ 逐步累加</text>

  <!-- table header -->
  <rect x="30" y="258" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="90" y="276" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">下标 i</text>
  <rect x="150" y="258" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="210" y="276" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d1[i] × d2[i]</text>
  <rect x="270" y="258" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="320" y="276" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans</text>

  <!-- row: i=1 -->
  <rect x="30" y="284" width="120" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="302" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="150" y="284" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="210" y="302" text-anchor="middle" font-size="11" fill="#b85450">d1 无 → 0</text>
  <rect x="270" y="284" width="100" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="302" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- row: i=3 -->
  <rect x="30" y="310" width="120" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="328" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="150" y="310" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="210" y="328" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2 × 4 = 8</text>
  <rect x="270" y="310" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="320" y="328" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>

  <!-- ===== Result box ===== -->
  <rect x="30" y="355" width="520" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="378" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">结果：ans = 0 + 8 = 8 ✓</text>
  <text x="290" y="396" text-anchor="middle" font-size="11" fill="#555">只遍历 d2 的 2 项，比逐位 O(n) 快得多</text>
</svg>
