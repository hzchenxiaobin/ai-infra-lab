<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：0-1 BFS 双端队列松弛</text>

  <!-- 1. Init -->
  <rect x="200" y="44" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">① 初始化</text>
  <text x="280" y="77" text-anchor="middle" font-size="9.5" fill="#555">dist=INF, dist[0][0]=0, dq=[(0,0)]</text>

  <path d="M 280 86 L 280 104" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. pop front -->
  <rect x="200" y="106" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">② 取队首 (i,j)</text>
  <text x="280" y="139" text-anchor="middle" font-size="9.5" fill="#555">d = dist[i][j]</text>

  <path d="M 280 146 L 280 162" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. check empty -->
  <polygon points="280,166 380,210 280,254 180,210" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">队列空?</text>
  <text x="280" y="222" text-anchor="middle" font-size="9" fill="#888">(while dq)</text>

  <!-- yes -> return -->
  <text x="392" y="206" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 380 210 L 440 210" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="440" y="192" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="490" y="208" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">⑤ 返回</text>
  <text x="490" y="222" text-anchor="middle" font-size="9.5" fill="#4a7a3a">dist[m-1][n-1]</text>

  <!-- no -> expand -->
  <text x="168" y="206" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <path d="M 180 210 L 110 210 L 110 234" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. expand neighbors -->
  <rect x="40" y="236" width="140" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="254" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">③ 遍历四邻</text>
  <text x="110" y="269" text-anchor="middle" font-size="9.5" fill="#555">(ni,nj) 越界则跳过</text>

  <path d="M 110 276 L 110 292" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. relax decision -->
  <polygon points="110,296 220,338 110,380 0,338" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="334" text-anchor="middle" font-size="9.5" fill="#444" font-weight="bold">nd=d+grid[v]</text>
  <text x="110" y="350" text-anchor="middle" font-size="9.5" fill="#444" font-weight="bold">&lt; dist[v] ?</text>

  <!-- no -> skip -->
  <text x="234" y="338" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <path d="M 220 338 L 300 338" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="300" y="322" width="92" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="346" y="343" text-anchor="middle" font-size="9.5" fill="#b85450">跳过</text>

  <!-- yes -> choose queue end -->
  <text x="116" y="392" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 110 380 L 110 396" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="398" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="414" text-anchor="middle" font-size="9.8" fill="#4a7a3a" font-weight="bold">④ 更新 dist[v]=nd</text>
  <text x="110" y="427" text-anchor="middle" font-size="8.8" fill="#4a7a3a">grid[v]==0→队首 / ==1→队尾</text>

  <!-- loop back arrow to pop front -->
  <path d="M 110 432 L 110 432 Q 30 432 30 250 Q 30 126 199 126" stroke="#666" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="20" y="290" font-size="9" fill="#888" transform="rotate(-90 20 290)">循环至队列空</text>

  <!-- skip loop back -->
  <path d="M 392 338 Q 470 338 470 256 Q 470 126 360 126" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)" opacity="0.6"/>
</svg>
