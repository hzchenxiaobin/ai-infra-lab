<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：rectangles = [[5,8],[3,9],[5,12],[16,5]]</text>

  <!-- ===== Table ===== -->
  <!-- columns: 步骤(50) | 矩形[l,w](90) | k=min(80) | 判断(160) | maxLen(70) | count(70) -->
  <!-- x: 30, 80, 170, 250, 410, 480, 550 -->

  <!-- Header row -->
  <g filter="url(#rough2)">
    <rect x="30" y="44" width="520" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <line x1="80" y1="44" x2="80" y2="74" stroke="#446688" stroke-width="1"/>
    <line x1="170" y1="44" x2="170" y2="74" stroke="#446688" stroke-width="1"/>
    <line x1="250" y1="44" x2="250" y2="74" stroke="#446688" stroke-width="1"/>
    <line x1="410" y1="44" x2="410" y2="74" stroke="#446688" stroke-width="1"/>
    <line x1="480" y1="44" x2="480" y2="74" stroke="#446688" stroke-width="1"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="55" y="64">步骤</text>
    <text x="125" y="64">矩形 [l, w]</text>
    <text x="210" y="64">k = min(l,w)</text>
    <text x="330" y="64">判断</text>
    <text x="445" y="64">maxLen</text>
    <text x="515" y="64">count</text>
  </g>

  <!-- Row 0: init -->
  <g filter="url(#rough2)">
    <rect x="30" y="74" width="520" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <line x1="80" y1="74" x2="80" y2="106" stroke="#ccc" stroke-width="1"/>
    <line x1="170" y1="74" x2="170" y2="106" stroke="#ccc" stroke-width="1"/>
    <line x1="250" y1="74" x2="250" y2="106" stroke="#ccc" stroke-width="1"/>
    <line x1="410" y1="74" x2="410" y2="106" stroke="#ccc" stroke-width="1"/>
    <line x1="480" y1="74" x2="480" y2="106" stroke="#ccc" stroke-width="1"/>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="55" y="95" fill="#888">初始</text>
    <text x="125" y="95" fill="#888">—</text>
    <text x="210" y="95" fill="#888">—</text>
    <text x="330" y="95" fill="#888">—</text>
    <text x="445" y="95" fill="#888" font-weight="bold">0</text>
    <text x="515" y="95" fill="#888" font-weight="bold">0</text>
  </g>

  <!-- Row 1: [5,8] -> k=5 > 0, maxLen=5, count=1 -->
  <g filter="url(#rough2)">
    <rect x="30" y="106" width="520" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <line x1="80" y1="106" x2="80" y2="138" stroke="#ddd" stroke-width="1"/>
    <line x1="170" y1="106" x2="170" y2="138" stroke="#ddd" stroke-width="1"/>
    <line x1="250" y1="106" x2="250" y2="138" stroke="#ddd" stroke-width="1"/>
    <line x1="410" y1="106" x2="410" y2="138" stroke="#ddd" stroke-width="1"/>
    <line x1="480" y1="106" x2="480" y2="138" stroke="#ddd" stroke-width="1"/>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="55" y="127" fill="#555">①</text>
    <text x="125" y="127" fill="#446688" font-weight="bold">[5, 8]</text>
    <text x="210" y="127" fill="#d6a040" font-weight="bold">5</text>
    <text x="330" y="127" fill="#b85450" font-weight="bold">5 &gt; 0 → 更新</text>
    <text x="445" y="127" fill="#b85450" font-weight="bold">5</text>
    <text x="515" y="127" fill="#b85450" font-weight="bold">1</text>
  </g>

  <!-- Row 2: [3,9] -> k=3, not > 5, not == 5, skip -->
  <g filter="url(#rough2)">
    <rect x="30" y="138" width="520" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <line x1="80" y1="138" x2="80" y2="170" stroke="#ccc" stroke-width="1"/>
    <line x1="170" y1="138" x2="170" y2="170" stroke="#ccc" stroke-width="1"/>
    <line x1="250" y1="138" x2="250" y2="170" stroke="#ccc" stroke-width="1"/>
    <line x1="410" y1="138" x2="410" y2="170" stroke="#ccc" stroke-width="1"/>
    <line x1="480" y1="138" x2="480" y2="170" stroke="#ccc" stroke-width="1"/>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="55" y="159" fill="#555">②</text>
    <text x="125" y="159" fill="#446688" font-weight="bold">[3, 9]</text>
    <text x="210" y="159" fill="#888" font-weight="bold">3</text>
    <text x="330" y="159" fill="#888">3 &lt; 5 → 跳过</text>
    <text x="445" y="159" fill="#555" font-weight="bold">5</text>
    <text x="515" y="159" fill="#555" font-weight="bold">1</text>
  </g>

  <!-- Row 3: [5,12] -> k=5 == 5, count++ -->
  <g filter="url(#rough2)">
    <rect x="30" y="170" width="520" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <line x1="80" y1="170" x2="80" y2="202" stroke="#cdd" stroke-width="1"/>
    <line x1="170" y1="170" x2="170" y2="202" stroke="#cdd" stroke-width="1"/>
    <line x1="250" y1="170" x2="250" y2="202" stroke="#cdd" stroke-width="1"/>
    <line x1="410" y1="170" x2="410" y2="202" stroke="#cdd" stroke-width="1"/>
    <line x1="480" y1="170" x2="480" y2="202" stroke="#cdd" stroke-width="1"/>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="55" y="191" fill="#555">③</text>
    <text x="125" y="191" fill="#446688" font-weight="bold">[5, 12]</text>
    <text x="210" y="191" fill="#4a7a3a" font-weight="bold">5</text>
    <text x="330" y="191" fill="#4a7a3a" font-weight="bold">5 == 5 → count++</text>
    <text x="445" y="191" fill="#555" font-weight="bold">5</text>
    <text x="515" y="191" fill="#4a7a3a" font-weight="bold">2</text>
  </g>

  <!-- Row 4: [16,5] -> k=5 == 5, count++ -->
  <g filter="url(#rough2)">
    <rect x="30" y="202" width="520" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <line x1="80" y1="202" x2="80" y2="234" stroke="#cdd" stroke-width="1"/>
    <line x1="170" y1="202" x2="170" y2="234" stroke="#cdd" stroke-width="1"/>
    <line x1="250" y1="202" x2="250" y2="234" stroke="#cdd" stroke-width="1"/>
    <line x1="410" y1="202" x2="410" y2="234" stroke="#cdd" stroke-width="1"/>
    <line x1="480" y1="202" x2="480" y2="234" stroke="#cdd" stroke-width="1"/>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="55" y="223" fill="#555">④</text>
    <text x="125" y="223" fill="#446688" font-weight="bold">[16, 5]</text>
    <text x="210" y="223" fill="#4a7a3a" font-weight="bold">5</text>
    <text x="330" y="223" fill="#4a7a3a" font-weight="bold">5 == 5 → count++</text>
    <text x="445" y="223" fill="#555" font-weight="bold">5</text>
    <text x="515" y="223" fill="#4a7a3a" font-weight="bold">3</text>
  </g>

  <!-- Result -->
  <rect x="120" y="260" width="320" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最终 maxLen = 5，count = 3 → 返回 3</text>

  <!-- color legend -->
  <g filter="url(#rough2)" font-size="9" fill="#888">
    <rect x="60" y="318" width="14" height="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2"/>
    <text x="80" y="327">发现更大值（更新）</text>
    <rect x="200" y="318" width="14" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2"/>
    <text x="220" y="327">并列最大（count++）</text>
    <rect x="340" y="318" width="14" height="10" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="360" y="327">较小（跳过）</text>
  </g>
</svg>
