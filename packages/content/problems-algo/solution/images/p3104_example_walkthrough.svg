<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 432" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="432" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：s = "abacd"</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">起点只取每个字符的首次出现：i=0(a)、i=1(b)、i=3(c)、i=4(d)</text>

  <!-- table outer border -->
  <rect x="36" y="58" width="460" height="286" fill="#ffffff" stroke="#888" stroke-width="1.6" rx="4" filter="url(#rough2)"/>

  <!-- header row -->
  <rect x="36" y="58" width="460" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="68" y="75" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">起点 i</text>
  <text x="120" y="75" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="160" y="75" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">s[j]</text>
  <text x="221" y="75" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">first&lt;i ?</text>
  <text x="286" y="75" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">mx</text>
  <text x="339" y="75" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">mx==j ?</text>
  <text x="432" y="75" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">动作</text>

  <!-- row backgrounds -->
  <rect x="37" y="84" width="458" height="52" fill="#ffffff" filter="url(#rough2)"/>
  <rect x="37" y="136" width="458" height="26" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="37" y="162" width="458" height="26" fill="#d8ecd4" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="37" y="188" width="458" height="26" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="37" y="214" width="458" height="26" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="37" y="240" width="458" height="26" fill="#fce4ec" filter="url(#rough2)"/>
  <rect x="37" y="266" width="458" height="52" fill="#e6f4ea" filter="url(#rough2)"/>

  <!-- column separators -->
  <path d="M 100 58 L 100 344 M 140 58 L 140 344 M 180 58 L 180 344 M 262 58 L 262 344 M 310 58 L 310 344 M 368 58 L 368 344" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- group separators -->
  <path d="M 37 214 L 494 214 M 37 266 L 494 266 M 37 318 L 494 318 M 37 240 L 494 240" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- row 1: i=0, j=0 -->
  <text x="68" y="101" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0 (a)</text>
  <text x="120" y="101" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="160" y="101" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">a</text>
  <text x="221" y="101" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">否</text>
  <text x="286" y="101" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="339" y="101" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">否</text>
  <text x="432" y="101" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <!-- row 2: i=0, j=1 -->
  <text x="68" y="127" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0 (a)</text>
  <text x="120" y="127" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="160" y="127" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">b</text>
  <text x="221" y="127" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">否</text>
  <text x="286" y="127" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="339" y="127" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">否</text>
  <text x="432" y="127" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <!-- row 3: i=0, j=2, valid len 3 -->
  <text x="68" y="153" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">0 (a)</text>
  <text x="120" y="153" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">2</text>
  <text x="160" y="153" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">a</text>
  <text x="221" y="153" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">否</text>
  <text x="286" y="153" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">2</text>
  <text x="339" y="153" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是 ✓</text>
  <text x="432" y="153" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">len 3 → ans=3</text>

  <!-- row 4: i=0, j=3, valid len 4 (answer) -->
  <text x="68" y="179" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0 (a)</text>
  <text x="120" y="179" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="160" y="179" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="221" y="179" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="286" y="179" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="339" y="179" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是 ✓</text>
  <text x="432" y="179" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">len 4 → ans=4 ★</text>

  <!-- row 5: i=0, j=4, len == n excluded -->
  <text x="68" y="205" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">0 (a)</text>
  <text x="120" y="205" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">4</text>
  <text x="160" y="205" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">d</text>
  <text x="221" y="205" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">否</text>
  <text x="286" y="205" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">4</text>
  <text x="339" y="205" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">是</text>
  <text x="432" y="205" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">len 5 = n，排除 ✗</text>

  <!-- row 6: i=1, j=1, valid len 1 -->
  <text x="68" y="231" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">1 (b)</text>
  <text x="120" y="231" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="160" y="231" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">b</text>
  <text x="221" y="231" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">否</text>
  <text x="286" y="231" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="339" y="231" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">是 ✓</text>
  <text x="432" y="231" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">len 1</text>

  <!-- row 7: i=1, j=2, break -->
  <text x="68" y="257" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1 (b)</text>
  <text x="120" y="257" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="160" y="257" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">a</text>
  <text x="221" y="257" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是 (0&lt;1)</text>
  <text x="286" y="257" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">—</text>
  <text x="339" y="257" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">—</text>
  <text x="432" y="257" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">break ✗</text>

  <!-- row 8: i=3, j=3, valid len 1 -->
  <text x="68" y="283" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">3 (c)</text>
  <text x="120" y="283" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">3</text>
  <text x="160" y="283" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">c</text>
  <text x="221" y="283" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">否</text>
  <text x="286" y="283" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">3</text>
  <text x="339" y="283" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">是 ✓</text>
  <text x="432" y="283" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">len 1</text>

  <!-- row 9: i=3, j=4, valid len 2 -->
  <text x="68" y="309" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">3 (c)</text>
  <text x="120" y="309" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">4</text>
  <text x="160" y="309" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">d</text>
  <text x="221" y="309" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">否</text>
  <text x="286" y="309" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">4</text>
  <text x="339" y="309" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">是 ✓</text>
  <text x="432" y="309" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">len 2</text>

  <!-- row 10: i=4, j=4, valid len 1 -->
  <text x="68" y="335" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">4 (d)</text>
  <text x="120" y="335" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">4</text>
  <text x="160" y="335" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">d</text>
  <text x="221" y="335" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">否</text>
  <text x="286" y="335" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">4</text>
  <text x="339" y="335" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">是 ✓</text>
  <text x="432" y="335" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">len 1</text>

  <!-- bottom badge -->
  <rect x="48" y="358" width="424" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="379" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">最终 ans = 4 —— 子串 s[0..3]="abac"（a、b、c 全部出现都在内，d 只在门外）</text>

  <!-- legend -->
  <text x="260" y="412" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">绿 = mx==j 收到合法候选　橙 = 长度恰为 n 被 t≠s 排除　红 = first[s[j]]&lt;i 触发 break</text>
</svg>
