<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">Thue-Morse 观察：字符 = popcount(k−1) mod 2</text>

  <!-- Table frame -->
  <!-- column x positions: i=60, binary=150, popcount=250, mod2=330, char=410 ; col width ~70 -->
  <!-- header -->
  <rect x="40" y="44" width="460" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="64" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">i = k−1</text>
  <text x="170" y="64" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">二进制</text>
  <text x="270" y="64" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">popcount</text>
  <text x="360" y="64" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">mod 2</text>
  <text x="450" y="64" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">字符</text>

  <!-- data rows: i = 0..7 -->
  <!-- row 0 -->
  <rect x="40" y="78" width="460" height="26" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="95" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="170" y="95" text-anchor="middle" font-size="11" fill="#333">000</text>
  <text x="270" y="95" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="360" y="95" text-anchor="middle" font-size="11" fill="#4a7a3a">0</text>
  <text x="450" y="95" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- row 1 -->
  <rect x="40" y="106" width="460" height="26" fill="#fafafa" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="123" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="170" y="123" text-anchor="middle" font-size="11" fill="#333">001</text>
  <text x="270" y="123" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="360" y="123" text-anchor="middle" font-size="11" fill="#b85450">1</text>
  <text x="450" y="123" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <!-- row 2 -->
  <rect x="40" y="134" width="460" height="26" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="151" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="170" y="151" text-anchor="middle" font-size="11" fill="#333">010</text>
  <text x="270" y="151" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="360" y="151" text-anchor="middle" font-size="11" fill="#b85450">1</text>
  <text x="450" y="151" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <!-- row 3 -->
  <rect x="40" y="162" width="460" height="26" fill="#fafafa" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="179" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="170" y="179" text-anchor="middle" font-size="11" fill="#333">011</text>
  <text x="270" y="179" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="360" y="179" text-anchor="middle" font-size="11" fill="#4a7a3a">0</text>
  <text x="450" y="179" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- row 4 -->
  <rect x="40" y="190" width="460" height="26" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="207" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="170" y="207" text-anchor="middle" font-size="11" fill="#333">100</text>
  <text x="270" y="207" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="360" y="207" text-anchor="middle" font-size="11" fill="#b85450">1</text>
  <text x="450" y="207" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <!-- row 5 -->
  <rect x="40" y="218" width="460" height="26" fill="#fafafa" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="235" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="170" y="235" text-anchor="middle" font-size="11" fill="#333">101</text>
  <text x="270" y="235" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="360" y="235" text-anchor="middle" font-size="11" fill="#4a7a3a">0</text>
  <text x="450" y="235" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- row 6 -->
  <rect x="40" y="246" width="460" height="26" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="263" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="170" y="263" text-anchor="middle" font-size="11" fill="#333">110</text>
  <text x="270" y="263" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="360" y="263" text-anchor="middle" font-size="11" fill="#4a7a3a">0</text>
  <text x="450" y="263" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- row 7 -->
  <rect x="40" y="274" width="460" height="26" fill="#fafafa" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="291" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="170" y="291" text-anchor="middle" font-size="11" fill="#333">111</text>
  <text x="270" y="291" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="360" y="291" text-anchor="middle" font-size="11" fill="#b85450">1</text>
  <text x="450" y="291" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <!-- highlight: char column reads 01101001 = row 4 -->
  <rect x="430" y="78" width="40" height="222" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3" rx="6" filter="url(#rough2)"/>

  <!-- result strip -->
  <rect x="40" y="306" width="460" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="323" text-anchor="middle" font-size="11" fill="#b85450">字符列从上到下读 = 0 1 1 0 1 0 0 1 = 第 4 行 ✓</text>

  <!-- bottom insight -->
  <rect x="40" y="340" width="460" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="360" text-anchor="middle" font-size="11" fill="#4a7a3a">popcount(2i)=popcount(i), popcount(2i+1)=popcount(i)+1 ⇒ Thue-Morse</text>
</svg>
