<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：取余 → 判同余 → 归一 → 中位数 → 求和</text>

  <!-- 1. take remainder -->
  <rect x="160" y="44" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">① 取公共余数</text>
  <text x="270" y="78" text-anchor="middle" font-size="10.5" fill="#555">r = grid[0][0] mod x</text>

  <path d="M 270 84 L 270 102" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. decision: same remainder? -->
  <polygon points="270,102 410,148 270,194 130,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="142" text-anchor="middle" font-size="11.5" fill="#333">任一元素</text>
  <text x="270" y="158" text-anchor="middle" font-size="11.5" fill="#333">mod x ≠ r ?</text>
  <text x="270" y="174" text-anchor="middle" font-size="10" fill="#888">(余数不一致)</text>

  <!-- yes -> return -1 -->
  <path d="M 410 148 L 470 148" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="142" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="460" y="134" width="72" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="496" y="153" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return −1</text>

  <!-- no ↓ -->
  <path d="M 270 194 L 270 212" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="208" font-size="10.5" fill="#4a7a3a" font-weight="bold">否 ↓</text>

  <!-- 3. collect steps b -->
  <rect x="130" y="212" width="280" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="232" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">② 收集步数并排序</text>
  <text x="270" y="250" text-anchor="middle" font-size="10.5" fill="#555">b_k = (grid[i][j] − r) / x，升序排列</text>

  <path d="M 270 258 L 270 276" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. median -->
  <rect x="150" y="276" width="240" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="296" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">③ 取中位数</text>
  <text x="270" y="314" text-anchor="middle" font-size="10.5" fill="#555">t = b[N/2]，N = m × n</text>

  <path d="M 270 322 L 270 340" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. sum -->
  <rect x="130" y="340" width="280" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="360" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">④ 累加绝对偏差</text>
  <text x="270" y="378" text-anchor="middle" font-size="10.5" fill="#555">ans = Σ |b_k − t|</text>

  <path d="M 270 386 L 270 404" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 6. return -->
  <rect x="190" y="404" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="424" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">⑤ return ans</text>

  <!-- right side note -->
  <rect x="420" y="276" width="112" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="476" y="296" text-anchor="middle" font-size="10.5" fill="#a87020" font-weight="bold">为何不枚举？</text>
  <text x="476" y="313" text-anchor="middle" font-size="9.5" fill="#555">f(t)=Σ|b_i−t|</text>
  <text x="476" y="326" text-anchor="middle" font-size="9.5" fill="#555">为凸函数</text>
  <text x="476" y="339" text-anchor="middle" font-size="9.5" fill="#555">谷底=中位数</text>
  <text x="476" y="356" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">→ 闭式解 O(1)</text>

  <!-- footer -->
  <text x="270" y="432" text-anchor="middle" font-size="9.5" fill="#aaa">同余判定 O(mn) + 排序 O(mn log mn) + 求和 O(mn)，全程无回溯/DP</text>
</svg>
