<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">两棵 BST → 中序得有序数组 → 双指针归并</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">BST 中序遍历天然升序，把“排序”降为“线性归并”</text>

  <!-- ===== Tree 1 ===== -->
  <text x="135" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">root1</text>
  <g font-size="12">
    <line x1="135" y1="96" x2="100" y2="140" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="135" y1="96" x2="170" y2="140" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <circle cx="135" cy="88" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="135" y="93" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <circle cx="100" cy="148" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="100" y="153" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <circle cx="170" cy="148" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="170" y="153" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
  </g>
  <!-- inorder label for tree1 -->
  <text x="135" y="180" text-anchor="middle" font-size="9" fill="#888">中序: 1 → 2 → 4</text>

  <!-- ===== Tree 2 ===== -->
  <text x="405" y="74" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">root2</text>
  <g font-size="12">
    <line x1="405" y1="96" x2="370" y2="140" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="405" y1="96" x2="440" y2="140" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <circle cx="405" cy="88" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="405" y="93" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <circle cx="370" cy="148" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="370" y="153" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <circle cx="440" cy="148" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="440" y="153" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
  </g>
  <text x="405" y="180" text-anchor="middle" font-size="9" fill="#888">中序: 0 → 1 → 3</text>

  <!-- ===== arrows down to arrays ===== -->
  <path d="M 135 190 L 135 214" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 405 190 L 405 214" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== sorted arrays a / b ===== -->
  <text x="135" y="228" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">a = inorder(root1)</text>
  <g font-size="12">
    <rect x="95" y="236" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="113" y="254" text-anchor="middle" fill="#333">1</text>
    <rect x="131" y="236" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="149" y="254" text-anchor="middle" fill="#333">2</text>
    <rect x="167" y="236" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="185" y="254" text-anchor="middle" fill="#333">4</text>
  </g>
  <text x="135" y="282" text-anchor="middle" font-size="9" fill="#446688">↑ 已升序（BST 性质）</text>

  <text x="405" y="228" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">b = inorder(root2)</text>
  <g font-size="12">
    <rect x="365" y="236" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="383" y="254" text-anchor="middle" fill="#333">0</text>
    <rect x="401" y="236" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="419" y="254" text-anchor="middle" fill="#333">1</text>
    <rect x="437" y="236" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="455" y="254" text-anchor="middle" fill="#333">3</text>
  </g>
  <text x="405" y="282" text-anchor="middle" font-size="9" fill="#4a7a3a">↑ 已升序（BST 性质）</text>

  <!-- ===== merge funnel ===== -->
  <path d="M 113 290 Q 113 312 135 312 L 383 312 Q 405 312 405 290" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="270" y="332" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">双指针归并：i,j 各走一步，取较小者入 ans</text>

  <path d="M 270 338 L 270 362" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== merged result ===== -->
  <text x="270" y="378" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">ans（升序）</text>
  <g font-size="12">
    <rect x="78" y="386" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="96" y="404" text-anchor="middle" fill="#333">0</text>
    <rect x="114" y="386" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="132" y="404" text-anchor="middle" fill="#333">1</text>
    <rect x="150" y="386" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="168" y="404" text-anchor="middle" fill="#333">1</text>
    <rect x="186" y="386" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="204" y="404" text-anchor="middle" fill="#333">2</text>
    <rect x="222" y="386" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="240" y="404" text-anchor="middle" fill="#333">3</text>
    <rect x="258" y="386" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="276" y="404" text-anchor="middle" fill="#333">4</text>
  </g>
  <text x="150" y="436" text-anchor="middle" font-size="9" fill="#888">归并阶段 O(n+m)，无需再 sort()</text>

  <!-- ===== bottom note boxes ===== -->
  <rect x="20" y="448" width="250" height="0" fill="none"/>
  <text x="270" y="456" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">BST 性质 = 把“排序 O(k log k)”变成“归并 O(k)”</text>
</svg>
