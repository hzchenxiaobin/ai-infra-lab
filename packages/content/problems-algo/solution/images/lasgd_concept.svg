<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">以「值」为键：dp[v] = dp[v − d] + 1</text>

  <!-- prev value node -->
  <rect x="60" y="80" width="110" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="115" y="100" text-anchor="middle" font-size="11" fill="#888">前驱值</text>
  <text x="115" y="120" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">prev = v − d</text>

  <!-- arrow from prev to v -->
  <path d="M 175 105 L 245 105" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="96" text-anchor="middle" font-size="11" fill="#4a7a3a">+1 接上</text>

  <!-- current value node -->
  <rect x="250" y="80" width="110" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="305" y="100" text-anchor="middle" font-size="11" fill="#888">当前值</text>
  <text x="305" y="120" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">v</text>

  <!-- hash map illustration -->
  <text x="260" y="170" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">哈希表 dp：值 → 最长长度</text>

  <!-- hash map rows -->
  <rect x="120" y="185" width="280" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="205" text-anchor="middle" font-size="12" fill="#333">key: 7</text>
  <text x="250" y="205" text-anchor="middle" font-size="12" fill="#333">→</text>
  <text x="330" y="205" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">val: 1</text>

  <rect x="120" y="220" width="280" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="240" text-anchor="middle" font-size="12" fill="#333">key: 5</text>
  <text x="250" y="240" text-anchor="middle" font-size="12" fill="#333">→</text>
  <text x="330" y="240" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">val: 2</text>

  <rect x="120" y="255" width="280" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="275" text-anchor="middle" font-size="12" fill="#333">key: 3</text>
  <text x="250" y="275" text-anchor="middle" font-size="12" fill="#333">→</text>
  <text x="330" y="275" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">val: 3</text>

  <!-- lookup arrow -->
  <path d="M 115 135 L 115 185" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="78" y="165" font-size="10" fill="#4a7a3a">O(1) 查</text>

  <!-- Summary -->
  <rect x="40" y="305" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="12" fill="#444">前驱值唯一确定 → 哈希表一步查到 → 无需扫描所有下标</text>
  <text x="260" y="338" text-anchor="middle" font-size="11" fill="#888">一次遍历完成全部状态转移，O(n)</text>
</svg>
