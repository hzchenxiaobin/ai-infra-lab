<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="390" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">fix / unfix：把逻辑目标值翻译成物理目标值</text>
  <text x="270" y="44" text-anchor="middle" font-size="10.5" fill="#888">物理目标 = 逻辑目标 ⊕ flipped，判定当前值也用 bits ⊕ flipped</text>

  <!-- ===== Formula box ===== -->
  <rect x="40" y="58" width="460" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="80" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">核心公式：bits[i] = logical[i] ⊕ flipped</text>

  <!-- ===== Table header ===== -->
  <rect x="40" y="106" width="120" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="100" y="125" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">操作</text>
  <rect x="164" y="106" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="244" y="125" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">flipped = false</text>
  <rect x="328" y="106" width="160" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="408" y="125" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">flipped = true</text>

  <!-- ===== Row 1: fix (logical target = 1) ===== -->
  <rect x="40" y="138" width="120" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="160" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">fix(idx)</text>
  <text x="100" y="178" text-anchor="middle" font-size="9.5" fill="#888">逻辑位设 1</text>
  <text x="100" y="194" text-anchor="middle" font-size="9.5" fill="#888">target = 1</text>

  <!-- flipped=false cell -->
  <rect x="164" y="138" width="160" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="244" y="160" text-anchor="middle" font-size="10.5" fill="#333">物理目标 = 1⊕0</text>
  <rect x="216" y="170" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="244" y="188" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">写 1</text>
  <text x="244" y="204" text-anchor="middle" font-size="9" fill="#4a7a3a">ones++ (若原为0)</text>

  <!-- flipped=true cell -->
  <rect x="328" y="138" width="160" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="408" y="160" text-anchor="middle" font-size="10.5" fill="#333">物理目标 = 1⊕1</text>
  <rect x="380" y="170" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="408" y="188" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">写 0</text>
  <text x="408" y="204" text-anchor="middle" font-size="9" fill="#d6a040">反着想! ones++ (若原为1)</text>

  <!-- ===== Row 2: unfix (logical target = 0) ===== -->
  <rect x="40" y="214" width="120" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="236" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">unfix(idx)</text>
  <text x="100" y="254" text-anchor="middle" font-size="9.5" fill="#888">逻辑位设 0</text>
  <text x="100" y="270" text-anchor="middle" font-size="9.5" fill="#888">target = 0</text>

  <!-- flipped=false cell -->
  <rect x="164" y="214" width="160" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="244" y="236" text-anchor="middle" font-size="10.5" fill="#333">物理目标 = 0⊕0</text>
  <rect x="216" y="246" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="244" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">写 0</text>
  <text x="244" y="280" text-anchor="middle" font-size="9" fill="#4a7a3a">ones-- (若原为1)</text>

  <!-- flipped=true cell -->
  <rect x="328" y="214" width="160" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="408" y="236" text-anchor="middle" font-size="10.5" fill="#333">物理目标 = 0⊕1</text>
  <rect x="380" y="246" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="408" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">写 1</text>
  <text x="408" y="280" text-anchor="middle" font-size="9" fill="#d6a040">反着想! ones-- (若原为0)</text>

  <!-- ===== Symmetry note ===== -->
  <rect x="40" y="296" width="460" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="316" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">对称美：fix 目标 = 1 ⊕ flipped，unfix 目标 = 0 ⊕ flipped</text>
  <text x="270" y="332" text-anchor="middle" font-size="10" fill="#888">同一翻译规则，只换逻辑目标值；写与判必须用同一套公式</text>

  <!-- Footer -->
  <text x="270" y="356" text-anchor="middle" font-size="10" fill="#aaa">判定当前逻辑值：bits[idx] ⊕ flipped，与目标值比较决定是否改动</text>
  <text x="270" y="370" text-anchor="middle" font-size="10" fill="#aaa">ones 只在"实际发生改变"时增减，保证 count() 始终正确</text>
</svg>
