<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：双栈 + 优先级表 —— 运算符栈按优先级单调，新算符入栈前先归约</text>

  <!-- Expression token stream -->
  <text x="40" y="62" font-size="12" fill="#888">表达式:</text>
  <rect x="96" y="46" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="116" y="68" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="144" y="46" width="36" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="68" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">×</text>
  <rect x="186" y="46" width="32" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="68" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">(</text>
  <rect x="224" y="46" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="68" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="270" y="46" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="68" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">−</text>
  <rect x="312" y="46" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="68" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="358" y="46" width="32" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="374" y="68" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">)</text>
  <rect x="396" y="46" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="414" y="68" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">+</text>
  <rect x="438" y="46" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="458" y="68" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <text x="414" y="92" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">↑ 新算符到达</text>

  <!-- Precedence table (top right) -->
  <rect x="500" y="44" width="92" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="546" y="62" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">优先级表</text>
  <text x="510" y="80" font-size="11" fill="#b85450" font-weight="bold">× ÷</text>
  <text x="584" y="80" text-anchor="end" font-size="11" fill="#333">2</text>
  <text x="510" y="98" font-size="11" fill="#d6a040" font-weight="bold">+ −</text>
  <text x="584" y="98" text-anchor="end" font-size="11" fill="#333">1</text>
  <text x="510" y="116" font-size="11" fill="#888" font-weight="bold">(</text>
  <text x="584" y="116" text-anchor="end" font-size="11" fill="#333">0</text>

  <!-- Two stacks before '+' arrives (after ')' reduced (5-3)=2) -->
  <text x="120" y="128" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">读到 '+' 前的栈状态</text>

  <text x="86" y="152" font-size="11" fill="#4a7a3a" font-weight="bold">nums:</text>
  <rect x="130" y="138" width="46" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="153" y="157" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="130" y="166" width="46" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="153" y="185" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <text x="246" y="152" font-size="11" fill="#b85450" font-weight="bold">ops:</text>
  <rect x="290" y="138" width="46" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="313" y="157" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">×</text>

  <!-- Reduce trigger -->
  <path d="M 313 186 L 313 206" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="208" width="376" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="308" y="227" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">归约规则：prio(栈顶 ×) = 2 ≥ prio(新算符 +) = 1</text>
  <text x="308" y="244" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">→ 先弹 ×，弹 2、2，算 2×2=4 压回，再压 +</text>

  <path d="M 308 252 L 308 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- After reduce -->
  <text x="120" y="288" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">归约后压入 +</text>
  <text x="86" y="312" font-size="11" fill="#4a7a3a" font-weight="bold">nums:</text>
  <rect x="130" y="298" width="46" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="153" y="317" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="246" y="312" font-size="11" fill="#d6a040" font-weight="bold">ops:</text>
  <rect x="290" y="298" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="313" y="317" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">+</text>

  <!-- Two bottom callouts -->
  <rect x="30" y="348" width="270" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="165" y="368" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">括号 = 优先级 0（最低）</text>
  <text x="165" y="384" text-anchor="middle" font-size="10" fill="#555">'(' 入栈后挡住一切归约，直到 ')' 把子式归约完</text>
  <text x="165" y="397" text-anchor="middle" font-size="10" fill="#888">于是括号内的算式被「隔离」独立求值</text>

  <rect x="312" y="348" width="258" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="441" y="368" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">一元负号 → 先压 0 化为二元</text>
  <text x="441" y="384" text-anchor="middle" font-size="10" fill="#555">开头 '-' 或 '(-' 时往 nums 压一个 0</text>
  <text x="441" y="397" text-anchor="middle" font-size="10" fill="#888">−2 变 0−2，无需特判</text>
</svg>
