<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="380" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 甘特图：plantTime=[1,4,3]，growTime=[2,3,1]</text>
  <text x="330" y="44" text-anchor="middle" font-size="11" fill="#888">按 growTime 降序播种：种子1(g3) → 种子0(g2) → 种子2(g1)，ans = 9</text>

  <!-- legend -->
  <g font-size="10">
    <rect x="60" y="54" width="16" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="82" y="64" fill="#446688">播种</text>
    <rect x="120" y="54" width="16" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="142" y="64" fill="#b85450">生长</text>
    <circle cx="186" cy="60" r="3.5" fill="#b85450" filter="url(#rough2)"/>
    <text x="196" y="64" fill="#888">开花日</text>
  </g>

  <!-- overlap highlight box: 种子1 生长 ⟕ 播种 seed0,seed2 -->
  <rect x="182" y="74" width="112" height="116" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5,3" rx="4" filter="url(#rough2)"/>
  <text x="238" y="70" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">并行：生长 ⟂ 播种重叠</text>

  <!-- ===== 播种（串行）一条线 ===== -->
  <text x="60" y="93" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">播种</text>
  <rect x="70" y="80" width="112" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="126" y="98" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">种子1（4天）</text>
  <rect x="182" y="80" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="196" y="98" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">0</text>
  <rect x="210" y="80" width="84" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="252" y="98" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">种子2（3天）</text>
  <text x="300" y="98" font-size="10" fill="#888">← 串行，cur: 0→4→5→8</text>

  <!-- ===== 生长（并行）三行 ===== -->
  <!-- 种子1 grows days 4-6 -->
  <text x="60" y="128" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">种子1</text>
  <rect x="182" y="118" width="84" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="224" y="131" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">生长3天</text>

  <!-- 种子0 grows days 5-6 -->
  <text x="60" y="152" text-anchor="end" font-size="11" fill="#d6a040" font-weight="bold">种子0</text>
  <rect x="210" y="142" width="56" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="238" y="155" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">生长2天</text>

  <!-- 种子2 grows day 8 -->
  <text x="60" y="176" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">种子2</text>
  <rect x="294" y="166" width="28" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="308" y="179" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1天</text>

  <!-- ===== 开花标记 ===== -->
  <!-- 种子1, 种子0 都在 day 7 开花 (x=266) -->
  <line x1="266" y1="116" x2="266" y2="200" stroke="#b85450" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <circle cx="266" cy="127" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="266" cy="151" r="3" fill="#d6a040" filter="url(#rough2)"/>
  <text x="266" y="110" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">开7</text>

  <!-- 种子2 day 9 开花 (x=322) -->
  <line x1="322" y1="164" x2="322" y2="200" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <circle cx="322" cy="175" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="322" y="212" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">开9 ← ans</text>

  <!-- ===== day axis ===== -->
  <line x1="70" y1="200" x2="322" y2="200" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="9" fill="#888" text-anchor="middle">
    <text x="70" y="216">0</text>
    <text x="126" y="216">2</text>
    <text x="182" y="216">4</text>
    <text x="238" y="216">6</text>
    <text x="294" y="216">8</text>
    <text x="322" y="216">9</text>
  </g>
  <text x="196" y="232" text-anchor="middle" font-size="10" fill="#888">天</text>

  <!-- ===== ans result ===== -->
  <rect x="60" y="252" width="540" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="80" y="274" font-size="11" fill="#4a7a3a" font-weight="bold">并行收益：</text>
  <text x="80" y="292" font-size="10.5" fill="#333">种子1 在第 4~6 天生长时，同时播种了种子0（第4天）和种子2（第5~7天）——</text>
  <text x="80" y="306" font-size="10.5" fill="#333">3 天生长期「免费」藏在播种期内，无需额外占用工期，最终第 9 天全部开花。</text>

  <!-- footer -->
  <text x="330" y="338" text-anchor="middle" font-size="10.5" fill="#888">若反过来短生长先种：种子1 的 3 天生长会推到第 8~10 天，ans = 11 &gt; 9</text>
  <text x="330" y="356" text-anchor="middle" font-size="10" fill="#aaa">时间 O(n log n) · 空间 O(n) · 排序键 = growTime 降序</text>
</svg>
