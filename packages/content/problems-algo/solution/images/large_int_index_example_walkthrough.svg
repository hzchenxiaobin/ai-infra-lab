<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 358" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="358" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [7, 7, 7, 7, 7, 10, 7, 7, 7]  (n = 9)</text>
  <text x="280" y="40" text-anchor="middle" font-size="11" fill="#888">大数 10 位于下标 5，每轮取左右各 half 个比较和</text>

  <!-- ============ Row 1: left=0 right=8 half=4 ============ -->
  <text x="12" y="78" font-size="11" fill="#333" font-weight="bold">①</text>
  <text x="28" y="78" font-size="10.5" fill="#666">left=0, right=8, half=4 · 比较 [0..3] 与 [5..8]，中点 [4]</text>
  <g filter="url(#rough2)">
    <rect x="100" y="82" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="138" y="82" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="176" y="82" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="214" y="82" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="252" y="82" width="38" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="290" y="82" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="328" y="82" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="366" y="82" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="404" y="82" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <text x="119" y="99" text-anchor="middle" font-size="11" fill="#446688">7</text>
  <text x="157" y="99" text-anchor="middle" font-size="11" fill="#446688">7</text>
  <text x="195" y="99" text-anchor="middle" font-size="11" fill="#446688">7</text>
  <text x="233" y="99" text-anchor="middle" font-size="11" fill="#446688">7</text>
  <text x="271" y="99" text-anchor="middle" font-size="11" fill="#d6a040">7</text>
  <text x="309" y="99" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">10</text>
  <text x="347" y="99" text-anchor="middle" font-size="11" fill="#4a7a3a">7</text>
  <text x="385" y="99" text-anchor="middle" font-size="11" fill="#4a7a3a">7</text>
  <text x="423" y="99" text-anchor="middle" font-size="11" fill="#4a7a3a">7</text>
  <text x="12" y="124" font-size="10.5" fill="#666">Σ左 = 28  &lt;  Σ右 = 31</text>
  <text x="200" y="124" font-size="11" fill="#d6a040" font-weight="bold">cmp = −1</text>
  <text x="300" y="124" font-size="11" fill="#4a7a3a" font-weight="bold">⇒ left = right−half+1 = 5</text>

  <!-- ============ Row 2: left=5 right=8 half=2 ============ -->
  <text x="12" y="150" font-size="11" fill="#333" font-weight="bold">②</text>
  <text x="28" y="150" font-size="10.5" fill="#666">left=5, right=8, half=2 · 比较 [5..6] 与 [7..8]（偶数长度，无中点）</text>
  <g filter="url(#rough2)">
    <rect x="100" y="154" width="38" height="26" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <rect x="138" y="154" width="38" height="26" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <rect x="176" y="154" width="38" height="26" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <rect x="214" y="154" width="38" height="26" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <rect x="252" y="154" width="38" height="26" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <rect x="290" y="154" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="328" y="154" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="366" y="154" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="404" y="154" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <text x="119" y="171" text-anchor="middle" font-size="10.5" fill="#bbb">7</text>
  <text x="157" y="171" text-anchor="middle" font-size="10.5" fill="#bbb">7</text>
  <text x="195" y="171" text-anchor="middle" font-size="10.5" fill="#bbb">7</text>
  <text x="233" y="171" text-anchor="middle" font-size="10.5" fill="#bbb">7</text>
  <text x="271" y="171" text-anchor="middle" font-size="10.5" fill="#bbb">7</text>
  <text x="309" y="171" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">10</text>
  <text x="347" y="171" text-anchor="middle" font-size="11" fill="#446688">7</text>
  <text x="385" y="171" text-anchor="middle" font-size="11" fill="#4a7a3a">7</text>
  <text x="423" y="171" text-anchor="middle" font-size="11" fill="#4a7a3a">7</text>
  <text x="12" y="196" font-size="10.5" fill="#666">Σ左 = 17  &gt;  Σ右 = 14</text>
  <text x="200" y="196" font-size="11" fill="#d6a040" font-weight="bold">cmp = 1</text>
  <text x="300" y="196" font-size="11" fill="#446688" font-weight="bold">⇒ right = left+half−1 = 6</text>

  <!-- ============ Row 3: left=5 right=6 half=1 ============ -->
  <text x="12" y="222" font-size="11" fill="#333" font-weight="bold">③</text>
  <text x="28" y="222" font-size="10.5" fill="#666">left=5, right=6, half=1 · 比较 [5..5] 与 [6..6]</text>
  <g filter="url(#rough2)">
    <rect x="100" y="226" width="38" height="26" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <rect x="138" y="226" width="38" height="26" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <rect x="176" y="226" width="38" height="26" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <rect x="214" y="226" width="38" height="26" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <rect x="252" y="226" width="38" height="26" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <rect x="290" y="226" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="328" y="226" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="366" y="226" width="38" height="26" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <rect x="404" y="226" width="38" height="26" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" rx="4"/>
  </g>
  <text x="119" y="243" text-anchor="middle" font-size="10.5" fill="#bbb">7</text>
  <text x="157" y="243" text-anchor="middle" font-size="10.5" fill="#bbb">7</text>
  <text x="195" y="243" text-anchor="middle" font-size="10.5" fill="#bbb">7</text>
  <text x="233" y="243" text-anchor="middle" font-size="10.5" fill="#bbb">7</text>
  <text x="271" y="243" text-anchor="middle" font-size="10.5" fill="#bbb">7</text>
  <text x="309" y="243" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">10</text>
  <text x="347" y="243" text-anchor="middle" font-size="11" fill="#4a7a3a">7</text>
  <text x="385" y="243" text-anchor="middle" font-size="10.5" fill="#bbb">7</text>
  <text x="423" y="243" text-anchor="middle" font-size="10.5" fill="#bbb">7</text>
  <text x="12" y="268" font-size="10.5" fill="#666">Σ左 = 10  &gt;  Σ右 = 7</text>
  <text x="200" y="268" font-size="11" fill="#d6a040" font-weight="bold">cmp = 1</text>
  <text x="300" y="268" font-size="11" fill="#446688" font-weight="bold">⇒ right = left+half−1 = 5</text>

  <!-- ============ Row 4: end ============ -->
  <text x="12" y="294" font-size="11" fill="#333" font-weight="bold">④</text>
  <text x="28" y="294" font-size="10.5" fill="#666">left=5, right=5 · 区间只剩 1 个元素</text>
  <g filter="url(#rough2)">
    <rect x="100" y="298" width="38" height="26" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <rect x="138" y="298" width="38" height="26" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <rect x="176" y="298" width="38" height="26" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <rect x="214" y="298" width="38" height="26" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <rect x="252" y="298" width="38" height="26" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <rect x="290" y="298" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <rect x="328" y="298" width="38" height="26" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <rect x="366" y="298" width="38" height="26" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <rect x="404" y="298" width="38" height="26" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" rx="4"/>
  </g>
  <text x="119" y="315" text-anchor="middle" font-size="10.5" fill="#bbb">7</text>
  <text x="157" y="315" text-anchor="middle" font-size="10.5" fill="#bbb">7</text>
  <text x="195" y="315" text-anchor="middle" font-size="10.5" fill="#bbb">7</text>
  <text x="233" y="315" text-anchor="middle" font-size="10.5" fill="#bbb">7</text>
  <text x="271" y="315" text-anchor="middle" font-size="10.5" fill="#bbb">7</text>
  <text x="309" y="315" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">10</text>
  <text x="347" y="315" text-anchor="middle" font-size="10.5" fill="#bbb">7</text>
  <text x="385" y="315" text-anchor="middle" font-size="10.5" fill="#bbb">7</text>
  <text x="423" y="315" text-anchor="middle" font-size="10.5" fill="#bbb">7</text>
  <text x="280" y="340" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">返回 left = 5  ✓  即大数 10 的索引（共 3 次 compareSub 调用）</text>
</svg>
