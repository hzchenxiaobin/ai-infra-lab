<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：values = [8, 1, 5, 2, 6]　初始 maxLeft = 8, ans = −∞</text>

  <!-- ===== Table header ===== -->
  <rect x="40" y="44" width="45" height="28" fill="#ddd" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="62" y="63" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">j</text>

  <rect x="85" y="44" width="60" height="28" fill="#ddd" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="63" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">values[j]</text>

  <rect x="145" y="44" width="70" height="28" fill="#ddd" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="58" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">R(j)</text>
  <text x="180" y="68" text-anchor="middle" font-size="8" fill="#888">v[j]−j</text>

  <rect x="215" y="44" width="75" height="28" fill="#ddd" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="252" y="58" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">maxLeft</text>
  <text x="252" y="68" text-anchor="middle" font-size="8" fill="#888">(更新前)</text>

  <rect x="290" y="44" width="75" height="28" fill="#ddd" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="327" y="58" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">candidate</text>
  <text x="327" y="68" text-anchor="middle" font-size="8" fill="#888">maxLeft+R(j)</text>

  <rect x="365" y="44" width="60" height="28" fill="#ddd" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="63" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">ans</text>

  <rect x="425" y="44" width="75" height="28" fill="#ddd" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="462" y="58" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">L(j)</text>
  <text x="462" y="68" text-anchor="middle" font-size="8" fill="#888">v[j]+j</text>

  <!-- ===== Row j=1 ===== -->
  <rect x="40" y="76" width="45" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="62" y="95" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="85" y="76" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="95" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="145" y="76" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="95" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="215" y="76" width="75" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="252" y="95" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <rect x="290" y="76" width="75" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="327" y="95" text-anchor="middle" font-size="12" fill="#333">8</text>
  <rect x="365" y="76" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="95" text-anchor="middle" font-size="12" fill="#333">8</text>
  <rect x="425" y="76" width="75" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="462" y="95" text-anchor="middle" font-size="12" fill="#333">2</text>

  <!-- ===== Row j=2 (answer!) ===== -->
  <rect x="40" y="108" width="45" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="62" y="127" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="85" y="108" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="127" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="145" y="108" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="127" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="215" y="108" width="75" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="252" y="127" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <rect x="290" y="108" width="75" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="327" y="127" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">11</text>
  <rect x="365" y="108" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="127" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">11 ⭐</text>
  <rect x="425" y="108" width="75" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="462" y="127" text-anchor="middle" font-size="12" fill="#333">7</text>

  <!-- ===== Row j=3 ===== -->
  <rect x="40" y="140" width="45" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="62" y="159" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="85" y="140" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="159" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="145" y="140" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="159" text-anchor="middle" font-size="12" fill="#333">−1</text>
  <rect x="215" y="140" width="75" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="252" y="159" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <rect x="290" y="140" width="75" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="327" y="159" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="365" y="140" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="159" text-anchor="middle" font-size="12" fill="#333">11</text>
  <rect x="425" y="140" width="75" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="462" y="159" text-anchor="middle" font-size="12" fill="#333">5</text>

  <!-- ===== Row j=4 ===== -->
  <rect x="40" y="172" width="45" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="62" y="191" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="85" y="172" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="191" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="145" y="172" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="191" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="215" y="172" width="75" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="252" y="191" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <rect x="290" y="172" width="75" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="327" y="191" text-anchor="middle" font-size="12" fill="#333">10</text>
  <rect x="365" y="172" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="191" text-anchor="middle" font-size="12" fill="#333">11</text>
  <rect x="425" y="172" width="75" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="462" y="191" text-anchor="middle" font-size="12" fill="#333">10</text>

  <!-- maxLeft update annotation -->
  <path d="M 462 200 L 462 215 L 252 215 L 252 230" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="4,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="357" y="211" text-anchor="middle" font-size="9" fill="#4a7a3a">L(j) 更新 maxLeft（取 max，本例直到 j=4 才被超越）</text>

  <!-- ===== Bottom explanation ===== -->
  <rect x="40" y="232" width="500" height="148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="256" font-size="12" fill="#444" font-weight="bold">逐步解读：</text>
  <text x="60" y="278" font-size="11" fill="#555">• 初始 maxLeft = values[0]+0 = 8（i=0 的左贡献），j 从 1 起作为右景点</text>
  <text x="60" y="298" font-size="11" fill="#555">• j=1: R(1)=1−1=0, candidate=8+0=8 → ans=8；L(1)=2，不刷新 maxLeft</text>
  <text x="60" y="318" font-size="11" fill="#b85450" font-weight="bold">• j=2: R(2)=5−2=3, candidate=8+3=11 → ans=11 ⭐（i=0, j=2 即最优解）</text>
  <text x="60" y="338" font-size="11" fill="#555">• j=3: R(3)=2−3=−1, candidate=8+(−1)=7 &lt; 11，ans 不变</text>
  <text x="60" y="358" font-size="11" fill="#555">• j=4: R(4)=6−4=2, candidate=8+2=10 &lt; 11，ans 不变；L(4)=10 刷新 maxLeft</text>
  <text x="60" y="374" font-size="11" fill="#888">最终返回 ans = 11</text>
</svg>
