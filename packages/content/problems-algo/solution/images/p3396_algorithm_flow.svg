<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="20" y="26" font-size="13" fill="#333" filter="url(#rough2)">倒序扫描 + 哈希集合，O(n)</text>

  <!-- start -->
  <rect x="200" y="36" width="120" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="57" text-anchor="middle" font-size="13" fill="#2d4d22" filter="url(#rough2)">开始</text>
  <path d="M260,68 L260,86" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="170" y="90" width="180" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="111" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">seen = ∅，i = n−1</text>
  <path d="M260,124 L260,146" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond B: duplicate check -->
  <polygon points="260,152 365,192 260,232 155,192" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="197" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">nums[i] ∈ seen ?</text>

  <!-- yes: k = i+1 -->
  <text x="372" y="182" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M365,192 L400,192" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="404" y="175" width="102" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="455" y="196" text-anchor="middle" font-size="12" fill="#8c3a34" filter="url(#rough2)">k = i + 1</text>

  <!-- no: add and decrement -->
  <text x="270" y="252" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M260,232 L260,256" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="172" y="260" width="176" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="281" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">seen.add(nums[i])，i−−</text>
  <path d="M260,294 L260,316" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond A: bounds check -->
  <polygon points="260,322 345,358 260,394 175,358" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="363" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i ≥ 0 ?</text>

  <!-- yes: loop back to diamond B -->
  <text x="138" y="350" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M175,358 L75,358 L75,192 L151,192" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no: k = 0, fall through -->
  <text x="270" y="414" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="292" y="414" font-size="10" fill="#888" filter="url(#rough2)">（全部互异，k = 0）</text>
  <path d="M260,394 L260,416" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="180" y="420" width="160" height="34" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="441" text-anchor="middle" font-size="13" fill="#2d4d22" filter="url(#rough2)">返回 ⌈k/3⌉</text>

  <!-- k = i+1 branch merges into return -->
  <path d="M455,209 L455,437 L344,437" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
