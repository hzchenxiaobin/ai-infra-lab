<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：拼接的本质 = 左移腾位 + 按位或</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">以示例 1 的最优顺序 [3, 1, 2] 为例（结果 V = 30）</text>

  <!-- 行 1：初始化 v ← a = 3 -->
  <rect x="36" y="56" width="150" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="111" y="76" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">v ← a = 3</text>
  <rect x="210" y="58" width="22" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="236" y="58" width="22" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="221" y="74" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="247" y="74" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="234" y="92" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">bin(3) = "11"</text>
  <path d="M 111 88 L 111 100" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 行 2：v = (v << 1) | b -->
  <rect x="36" y="102" width="150" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="111" y="120" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">v = (v &lt;&lt; 1) | b</text>
  <text x="111" y="136" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">腾 1 个 0 位，或上 b = 1</text>
  <rect x="210" y="108" width="22" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="236" y="108" width="22" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="262" y="108" width="22" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="221" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="247" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="273" y="124" text-anchor="middle" font-size="12" fill="#2f5424" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="273" y="142" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">拼入 b = "1"</text>
  <path d="M 111 148 L 111 160" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 行 3：v = (v << 2) | c -->
  <rect x="36" y="162" width="150" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="111" y="180" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">v = (v &lt;&lt; 2) | c</text>
  <text x="111" y="196" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">腾 2 个 0 位，或上 c = 2</text>
  <rect x="210" y="168" width="22" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="236" y="168" width="22" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="262" y="168" width="22" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="288" y="168" width="22" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="314" y="168" width="22" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="221" y="184" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="247" y="184" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="273" y="184" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="299" y="184" text-anchor="middle" font-size="12" fill="#2f5424" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="325" y="184" text-anchor="middle" font-size="12" fill="#2f5424" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="312" y="202" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">拼入 c = "10"</text>
  <path d="M 111 208 L 111 220" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结果框 -->
  <rect x="36" y="222" width="190" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="131" y="243" text-anchor="middle" font-size="12" fill="#2f5424" font-weight="bold" filter="url(#rough2)">11110₂ = 30 ✓</text>

  <!-- 示例 2 框 -->
  <rect x="36" y="268" width="290" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="181" y="284" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">示例 2 同法：[2, 8, 16] 依次腾 4、5 个 0 位</text>
  <text x="181" y="300" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">2·2⁹ + 8·2⁵ + 16 = 1296 ✓</text>

  <!-- 右侧：公式框 -->
  <rect x="340" y="54" width="170" height="106" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="425" y="72" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">数值拼接公式</text>
  <text x="425" y="90" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">V(a,b,c) =</text>
  <text x="425" y="106" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">a·2^(Lb+Lc) + b·2^Lc + c</text>
  <text x="425" y="126" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">= ((a&lt;&lt;Lb)|b)&lt;&lt;Lc | c</text>
  <text x="425" y="146" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">Lx：x 的二进制位数</text>

  <!-- 右侧：等长性框 -->
  <rect x="340" y="172" width="170" height="82" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="425" y="190" text-anchor="middle" font-size="10.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">为什么直接比数值？</text>
  <text x="425" y="206" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">6 种排列总位数恒为</text>
  <text x="425" y="220" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">La + Lb + Lc ≤ 21</text>
  <text x="425" y="240" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">等长 ⇒ 值大即字典序大</text>

  <!-- 右侧：复杂度框 -->
  <rect x="340" y="266" width="170" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="425" y="288" text-anchor="middle" font-size="10" fill="#2f5424" filter="url(#rough2)">时间 O(1) · 空间 O(1)</text>
</svg>
