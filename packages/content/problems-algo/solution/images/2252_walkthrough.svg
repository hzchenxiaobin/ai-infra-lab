<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="860" height="620" fill="#fafafa"/>

  <!-- Title -->
  <text x="430" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">示例演算：6 行长表 → 动态拼 4 列 → 3 行宽表</text>
  <path d="M 240 36 Q 430 44 620 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Phase 1: input table ===== -->
  <text x="40" y="62" font-size="11" fill="#888" font-weight="bold">输入：Products 表（6 行，store 取值未知）</text>
  <g filter="url(#rough2)"><rect x="30" y="70" width="250" height="178" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6"/></g>
  <text x="155" y="88" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Products</text>
  <line x1="30" y1="96" x2="280" y2="96" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="48" y="112" font-size="9" fill="#888" font-weight="bold">product_id</text>
  <text x="138" y="112" font-size="9" fill="#888" font-weight="bold">store</text>
  <text x="218" y="112" font-size="9" fill="#888" font-weight="bold">price</text>
  <line x1="118" y1="98" x2="118" y2="248" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="192" y1="98" x2="192" y2="248" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="56" y="132" font-size="10" fill="#4a8edb" font-weight="bold">1</text>
  <text x="138" y="132" font-size="9" fill="#b85450" font-weight="bold">Shop</text>
  <text x="224" y="132" font-size="10" fill="#4a8edb">110</text>

  <text x="56" y="152" font-size="10" fill="#4a8edb" font-weight="bold">1</text>
  <text x="134" y="152" font-size="9" fill="#b85450" font-weight="bold">LC_Store</text>
  <text x="224" y="152" font-size="10" fill="#4a8edb">100</text>

  <text x="56" y="172" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="136" y="172" font-size="9" fill="#b85450" font-weight="bold">Nozama</text>
  <text x="224" y="172" font-size="10" fill="#4a7a3a">200</text>

  <text x="56" y="192" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="140" y="192" font-size="9" fill="#b85450" font-weight="bold">Souq</text>
  <text x="224" y="192" font-size="10" fill="#4a7a3a">190</text>

  <text x="56" y="212" font-size="10" fill="#d6a040" font-weight="bold">3</text>
  <text x="138" y="212" font-size="9" fill="#b85450" font-weight="bold">Shop</text>
  <text x="224" y="212" font-size="10" fill="#d6a040">1000</text>

  <text x="56" y="232" font-size="10" fill="#d6a040" font-weight="bold">3</text>
  <text x="140" y="232" font-size="9" fill="#b85450" font-weight="bold">Souq</text>
  <text x="224" y="232" font-size="10" fill="#d6a040">1900</text>

  <text x="155" y="258" text-anchor="middle" font-size="8" fill="#999">4 种 store 值，写 SQL 时不知道</text>

  <!-- Arrow down -->
  <path d="M 155 252 L 155 276" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Phase 2: DISTINCT store ===== -->
  <text x="40" y="292" font-size="11" fill="#888" font-weight="bold">步骤 ②：SELECT DISTINCT store ORDER BY store</text>
  <g filter="url(#rough2)"><rect x="30" y="300" width="250" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/></g>
  <g filter="url(#rough2)"><rect x="42" y="310" width="64" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/></g>
  <text x="74" y="325" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">LC_Store</text>
  <g filter="url(#rough2)"><rect x="114" y="310" width="56" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/></g>
  <text x="142" y="325" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">Nozama</text>
  <g filter="url(#rough2)"><rect x="178" y="310" width="44" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/></g>
  <text x="200" y="325" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">Shop</text>
  <g filter="url(#rough2)"><rect x="230" y="310" width="44" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/></g>
  <text x="252" y="325" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">Souq</text>
  <text x="155" y="358" text-anchor="middle" font-size="8" fill="#999">排序后：LC_Store &lt; Nozama &lt; Shop &lt; Souq</text>

  <!-- Arrow right to phase 3 -->
  <path d="M 286 322 L 330 322" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Phase 3: assembled @cols string ===== -->
  <text x="340" y="292" font-size="11" fill="#888" font-weight="bold">步骤 ③：GROUP_CONCAT → @cols 字符串</text>
  <g filter="url(#rough2)"><rect x="334" y="300" width="500" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/></g>
  <text x="346" y="318" font-size="8" fill="#d6a040">MAX(IF(store='LC_Store',price,NULL)) AS `LC_Store`,</text>
  <text x="346" y="334" font-size="8" fill="#d6a040">MAX(IF(store='Nozama',price,NULL)) AS `Nozama`,</text>
  <text x="346" y="350" font-size="8" fill="#d6a040">MAX(IF(store='Shop',price,NULL)) AS `Shop`,</text>
  <text x="346" y="366" font-size="8" fill="#d6a040">MAX(IF(store='Souq',price,NULL)) AS `Souq`</text>
  <line x1="346" y1="376" x2="820" y2="376" stroke="#e0c060" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="346" y="394" font-size="8" fill="#4a8edb">CONCAT('SELECT product_id, ', @cols,</text>
  <text x="346" y="408" font-size="8" fill="#4a8edb">  ' FROM Products GROUP BY product_id ORDER BY product_id') → @sql</text>
  <text x="346" y="424" font-size="7" fill="#888">PREPARE stmt FROM @sql; EXECUTE stmt;</text>

  <!-- ===== Phase 4: GROUP BY + condition per product ===== -->
  <text x="340" y="62" font-size="11" fill="#888" font-weight="bold">步骤 ④：EXECUTE 后逐组条件聚合</text>
  <g filter="url(#rough2)"><rect x="334" y="70" width="500" height="200" fill="#fff" stroke="#4a8edb" stroke-width="1.5" rx="6"/></g>

  <!-- product 1 group -->
  <g filter="url(#rough2)"><rect x="346" y="80" width="476" height="50" fill="#dbeafe" stroke="#4a8edb" stroke-width="1.2" rx="4"/></g>
  <text x="356" y="96" font-size="9" fill="#4a8edb" font-weight="bold">product 1（2 行 → 1 行）</text>
  <text x="356" y="112" font-size="8" fill="#4a8edb">Shop→110 ✓ | LC_Store→100 ✓ | Nozama→NULL ✗ | Souq→NULL ✗</text>
  <text x="356" y="126" font-size="8" fill="#b85450">→ [100, null, 110, null]（按列序 LC_Store,Nozama,Shop,Souq）</text>

  <!-- product 2 group -->
  <g filter="url(#rough2)"><rect x="346" y="136" width="476" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/></g>
  <text x="356" y="152" font-size="9" fill="#4a7a3a" font-weight="bold">product 2（2 行 → 1 行）</text>
  <text x="356" y="168" font-size="8" fill="#4a7a3a">Nozama→200 ✓ | Souq→190 ✓ | LC_Store→NULL ✗ | Shop→NULL ✗</text>
  <text x="356" y="182" font-size="8" fill="#b85450">→ [null, 200, null, 190]</text>

  <!-- product 3 group -->
  <g filter="url(#rough2)"><rect x="346" y="192" width="476" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/></g>
  <text x="356" y="208" font-size="9" fill="#d6a040" font-weight="bold">product 3（2 行 → 1 行）</text>
  <text x="356" y="224" font-size="8" fill="#d6a040">Shop→1000 ✓ | Souq→1900 ✓ | LC_Store→NULL ✗ | Nozama→NULL ✗</text>
  <text x="356" y="238" font-size="8" fill="#b85450">→ [null, null, 1000, 1900]</text>

  <text x="574" y="260" text-anchor="middle" font-size="8" fill="#999">每组：MAX(IF(store='X',price,NULL)) 挑出唯一值或 NULL</text>

  <!-- Arrow down from phase 3 to result -->
  <path d="M 584 432 L 584 460" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Phase 5: result table ===== -->
  <text x="40" y="478" font-size="11" fill="#888" font-weight="bold">输出：宽表（3 行 × 5 列，列名 = store 值）</text>
  <g filter="url(#rough2)"><rect x="30" y="486" width="800" height="118" fill="#fff" stroke="#4a7a3a" stroke-width="1.8" rx="6"/></g>
  <text x="155" y="506" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">结果表</text>
  <line x1="30" y1="514" x2="830" y2="514" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="60" y="530" font-size="9" fill="#888" font-weight="bold">product_id</text>
  <text x="240" y="530" font-size="9" fill="#888" font-weight="bold">LC_Store</text>
  <text x="400" y="530" font-size="9" fill="#888" font-weight="bold">Nozama</text>
  <text x="540" y="530" font-size="9" fill="#888" font-weight="bold">Shop</text>
  <text x="680" y="530" font-size="9" fill="#888" font-weight="bold">Souq</text>
  <line x1="180" y1="516" x2="180" y2="604" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="320" y1="516" x2="320" y2="604" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="470" y1="516" x2="470" y2="604" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="610" y1="516" x2="610" y2="604" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="100" y="556" font-size="11" fill="#4a8edb" font-weight="bold">1</text>
  <text x="256" y="556" font-size="11" fill="#4a8edb">100</text>
  <text x="416" y="556" font-size="11" fill="#b85450" font-weight="bold">null</text>
  <text x="556" y="556" font-size="11" fill="#4a8edb">110</text>
  <text x="696" y="556" font-size="11" fill="#b85450" font-weight="bold">null</text>

  <text x="100" y="580" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="256" y="580" font-size="11" fill="#b85450" font-weight="bold">null</text>
  <text x="416" y="580" font-size="11" fill="#4a7a3a">200</text>
  <text x="556" y="580" font-size="11" fill="#b85450" font-weight="bold">null</text>
  <text x="696" y="580" font-size="11" fill="#4a7a3a">190</text>

  <text x="100" y="600" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="256" y="600" font-size="11" fill="#b85450" font-weight="bold">null</text>
  <text x="416" y="600" font-size="11" fill="#b85450" font-weight="bold">null</text>
  <text x="556" y="600" font-size="11" fill="#d6a040">1000</text>
  <text x="696" y="600" font-size="11" fill="#d6a040">1900</text>
</svg>
