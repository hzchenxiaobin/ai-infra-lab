<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "{a,b}c{d,e}" 的 DFS 递归树</text>

  <!-- group level labels on left -->
  <text x="40" y="80" font-size="11" fill="#888" font-weight="bold">组1 [a,b]</text>
  <text x="40" y="160" font-size="11" fill="#888" font-weight="bold">组2 [c]</text>
  <text x="40" y="240" font-size="11" fill="#888" font-weight="bold">组3 [d,e]</text>
  <text x="40" y="330" font-size="11" fill="#4a7a3a" font-weight="bold">结果</text>

  <!-- root -->
  <ellipse cx="280" cy="58" rx="34" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="11" fill="#333">root</text>

  <!-- Level 1: a, b -->
  <line x1="266" y1="72" x2="200" y2="90" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="294" y1="72" x2="360" y2="90" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="172" y="90" width="56" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="332" y="90" width="56" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>

  <text x="200" y="128" text-anchor="middle" font-size="10" fill="#888">path="a"</text>
  <text x="360" y="128" text-anchor="middle" font-size="10" fill="#888">path="b"</text>

  <!-- Level 2: ac, bc -->
  <line x1="200" y1="116" x2="200" y2="148" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="360" y1="116" x2="360" y2="148" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="166" y="148" width="68" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ac</text>
  <rect x="326" y="148" width="68" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">bc</text>

  <text x="200" y="186" text-anchor="middle" font-size="10" fill="#888">选 c</text>
  <text x="360" y="186" text-anchor="middle" font-size="10" fill="#888">选 c</text>

  <!-- Level 3: acd, ace, bcd, bce -->
  <line x1="190" y1="174" x2="130" y2="220" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="210" y1="174" x2="250" y2="220" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="350" y1="174" x2="310" y2="220" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="370" y1="174" x2="430" y2="220" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="96" y="220" width="68" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="238" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">acd</text>
  <rect x="216" y="220" width="68" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="238" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ace</text>
  <rect x="276" y="220" width="68" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="238" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">bcd</text>
  <rect x="396" y="220" width="68" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="238" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">bce</text>

  <text x="130" y="258" text-anchor="middle" font-size="10" fill="#888">选 d</text>
  <text x="250" y="258" text-anchor="middle" font-size="10" fill="#888">选 e</text>
  <text x="310" y="258" text-anchor="middle" font-size="10" fill="#888">选 d</text>
  <text x="430" y="258" text-anchor="middle" font-size="10" fill="#888">选 e</text>

  <!-- arrows to result -->
  <line x1="130" y1="246" x2="130" y2="300" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="250" y1="246" x2="250" y2="300" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="310" y1="246" x2="310" y2="300" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="430" y1="246" x2="430" y2="300" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- result leaves -->
  <rect x="96" y="300" width="68" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="318" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"acd"</text>
  <rect x="216" y="300" width="68" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="318" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"ace"</text>
  <rect x="276" y="300" width="68" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="318" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"bcd"</text>
  <rect x="396" y="300" width="68" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="430" y="318" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"bce"</text>

  <!-- insight box -->
  <rect x="60" y="346" width="440" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="366" font-size="11" fill="#555">生成顺序：</text>
  <text x="150" y="366" font-size="11" fill="#b85450" font-weight="bold">acd</text>
  <text x="180" y="366" font-size="11" fill="#555">→</text>
  <text x="196" y="366" font-size="11" fill="#b85450" font-weight="bold">ace</text>
  <text x="226" y="366" font-size="11" fill="#555">→</text>
  <text x="242" y="366" font-size="11" fill="#b85450" font-weight="bold">bcd</text>
  <text x="272" y="366" font-size="11" fill="#555">→</text>
  <text x="288" y="366" font-size="11" fill="#b85450" font-weight="bold">bce</text>
  <text x="330" y="366" font-size="11" fill="#4a7a3a" font-weight="bold">= 字典序</text>
  <text x="80" y="382" font-size="10" fill="#888">各组排序 + 按序 DFS → 天然字典序，无需末尾 sorted()</text>
</svg>
