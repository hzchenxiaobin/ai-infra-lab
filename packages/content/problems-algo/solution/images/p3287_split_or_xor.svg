<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：保序 ⇒ 第 k 个与第 k+1 个选中元素之间必有分割线</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例：nums = [4, 2, 5, 6, 7]，k = 2，最优选法 4,5 ∣ 6,7</text>

  <!-- 数组格子 -->
  <rect x="104" y="56" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="132" y="84" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="168" y="56" width="56" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="196" y="84" text-anchor="middle" font-size="16" fill="#999" filter="url(#rough2)">2</text>

  <rect x="232" y="56" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="84" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>

  <rect x="296" y="56" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="324" y="84" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>

  <rect x="360" y="56" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="388" y="84" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>

  <!-- 下标 -->
  <text x="132" y="114" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="196" y="114" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="260" y="114" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="324" y="114" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">3</text>
  <text x="388" y="114" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">4</text>

  <!-- 分割线 -->
  <path d="M 292 50 L 292 118" stroke="#b85450" stroke-width="2" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="292" y="136" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">分割线 i = 2</text>

  <!-- 括弧 -->
  <path d="M 104 146 L 104 156 L 288 156 L 288 146" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="196" y="172" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">前半候选区 [0..i]</text>

  <path d="M 296 146 L 296 156 L 416 156 L 416 146" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="356" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">后半候选区 [i+1..n−1]</text>

  <!-- 前半 / 后半 -->
  <rect x="56" y="188" width="180" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="146" y="207" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">前半 k=2 个</text>
  <text x="146" y="225" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4 OR 5 = 5</text>

  <circle cx="260" cy="211" r="17" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="216" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">⊕</text>

  <rect x="284" y="188" width="180" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="374" y="207" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">后半 k=2 个</text>
  <text x="374" y="225" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6 OR 7 = 7</text>

  <!-- 结果 -->
  <path d="M 146 236 C 146 246, 190 248, 210 254" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 374 236 C 374 246, 330 248, 310 254" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="145" y="256" width="230" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="279" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">值 = 5 XOR 7 = 2</text>

  <!-- 结论 -->
  <rect x="40" y="308" width="440" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="325" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">左边任选 k 个 + 右边任选 k 个 ⇒ 拼起来必是有序子序列（充要）</text>
  <text x="260" y="342" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = max over i, s∈F[i], t∈G[i+1] 的 s ⊕ t</text>
</svg>
