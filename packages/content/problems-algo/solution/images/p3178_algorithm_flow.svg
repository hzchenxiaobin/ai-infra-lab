<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：取模折叠，两分支出答案</text>

  <rect x="205" y="44" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">输入 n, k</text>

  <path d="M 260 78 L 260 94" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="175" y="96" width="170" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="114" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">T = 2 × (n − 1)</text>
  <text x="260" y="131" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">一个完整往返的秒数</text>

  <path d="M 260 138 L 260 154" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="175" y="156" width="170" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="174" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">r = k mod T</text>
  <text x="260" y="191" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">把 k 折进一个周期内</text>

  <path d="M 260 198 L 260 216" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,218 352,258 260,298 168,258" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="263" text-anchor="middle" font-size="13.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">r &lt; n ?</text>

  <path d="M 168 258 L 152 258" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="160" y="248" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M 352 258 L 366 258" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="359" y="248" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="22" y="232" width="130" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="87" y="252" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">去程：返回 r</text>
  <text x="87" y="271" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">球还在向右传</text>

  <rect x="368" y="232" width="130" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="433" y="252" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">回程：返回 T − r</text>
  <text x="433" y="271" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">已折返向左传</text>

  <rect x="96" y="314" width="328" height="36" fill="#f5f5f5" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="337" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">整体 O(1)：一次取模 + 一次比较，k 放大到 10^18 也不慌</text>
</svg>
