<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums = [4,6,7,3,2]</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">cnt = {2:1, 3:1, 4:1, 6:1, 7:1}，所有 cnt=1 → 每个命中值组贡献 6（全互异）</text>

  <!-- ===== Group A: {4,3,2}, s=9 ===== -->
  <text x="40" y="76" font-size="11" fill="#446688" font-weight="bold">值组 A：{4, 3, 2}</text>

  <!-- three value chips -->
  <rect x="40" y="84" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="60" y="106" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="84" y="84" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="104" y="106" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="128" y="84" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="148" y="106" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- sum -->
  <text x="184" y="106" font-size="11" fill="#555">s = 4+3+2 =</text>
  <rect x="252" y="88" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="272" y="108" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">9</text>

  <!-- divisibility checks -->
  <text x="308" y="96" font-size="10" fill="#555">9 % 4 = 1  ✗</text>
  <text x="308" y="110" font-size="10" fill="#4a7a3a" font-weight="bold">9 % 3 = 0  ✓（唯一）</text>

  <!-- result count -->
  <rect x="430" y="88" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="485" y="108" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">6 种排列 ×1 = 6</text>

  <!-- ===== Group B: {4,7,3}, s=14 ===== -->
  <text x="40" y="146" font-size="11" fill="#4a7a3a" font-weight="bold">值组 B：{4, 7, 3}</text>

  <rect x="40" y="154" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="60" y="176" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="84" y="154" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="104" y="176" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="128" y="154" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="148" y="176" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <text x="184" y="176" font-size="11" fill="#555">s = 4+7+3 =</text>
  <rect x="252" y="158" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="272" y="178" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">14</text>

  <text x="308" y="166" font-size="10" fill="#555">14 % 4 = 2  ✗</text>
  <text x="308" y="180" font-size="10" fill="#4a7a3a" font-weight="bold">14 % 7 = 0  ✓（唯一）</text>

  <rect x="430" y="158" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="485" y="178" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">6 种排列 ×1 = 6</text>

  <!-- divider -->
  <path d="M 28 206 L 540 206" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Other value groups sampled (non-hits) ===== -->
  <text x="40" y="226" font-size="10.5" fill="#888">其余值组抽样（均不命中）：</text>

  <rect x="40" y="234" width="500" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="252" font-size="10" fill="#888">{4,6,7}：s=17，17%4=1 17%6=5 17%7=3 → t=0，跳过</text>

  <rect x="40" y="264" width="500" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="282" font-size="10" fill="#888">{6,7,2}：s=15，15%6=3 15%7=1 15%2=1 → t=0，跳过</text>

  <rect x="40" y="294" width="500" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="312" font-size="10" fill="#888">{6,3,2}：s=11，11%6=5 11%3=2 11%2=1 → t=0，跳过</text>

  <!-- ===== Final answer ===== -->
  <rect x="80" y="338" width="400" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = 6 + 6 = 12</text>

  <!-- ===== Bottom note ===== -->
  <rect x="60" y="384" width="440" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="402" text-anchor="middle" font-size="10" fill="#555">因所有 cnt=1，每组互异值贡献 6；若有重复值则按 P(cnt,2) 计排列数</text>
</svg>
