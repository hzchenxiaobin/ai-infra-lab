<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">最长重复子数组 —— DP 状态与转移</text>
  <path d="M 160 40 Q 280 48 400 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- nums1 row -->
  <text x="40" y="82" font-size="12" fill="#888" font-weight="bold">nums1</text>
  <g filter="url(#rough2)">
    <rect x="100" y="66" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="148" y="66" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="196" y="66" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="244" y="66" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="292" y="66" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
  </g>
  <text x="124" y="86" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="172" y="86" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="220" y="86" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <text x="268" y="86" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="316" y="86" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="220" y="60" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i−1</text>

  <!-- nums2 row -->
  <text x="40" y="124" font-size="12" fill="#888" font-weight="bold">nums2</text>
  <g filter="url(#rough2)">
    <rect x="100" y="108" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="148" y="108" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="196" y="108" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="244" y="108" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="292" y="108" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
  </g>
  <text x="124" y="128" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <text x="172" y="128" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="220" y="128" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="268" y="128" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="316" y="128" text-anchor="middle" font-size="13" fill="#333">7</text>
  <text x="124" y="152" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">j−1</text>

  <!-- match annotation -->
  <path d="M 220 96 L 220 106" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="350" y="100" font-size="12" fill="#4a7a3a" font-weight="bold">nums1[i−1] == nums2[j−1] ⭐</text>

  <!-- dp definition box -->
  <g filter="url(#rough2)">
    <rect x="60" y="168" width="440" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="280" y="190" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">dp[i][j] = 以 nums1[i−1]、nums2[j−1] 结尾的最长公共子数组长度</text>
  <text x="280" y="208" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">匹配 → dp[i−1][j−1] + 1　　　不匹配 → 0</text>

  <!-- comparison panel title -->
  <text x="280" y="244" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">子数组 vs 子序列：不匹配时的分野</text>
  <path d="M 150 252 Q 280 258 410 252" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- left: subarray (this problem) -->
  <g filter="url(#rough2)">
    <rect x="50" y="262" width="220" height="120" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3"/>
  </g>
  <text x="160" y="284" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">718 子数组（连续）</text>
  <text x="64" y="308" font-size="11.5" fill="#444">匹配：dp[i−1][j−1] + 1</text>
  <text x="64" y="330" font-size="11.5" fill="#b85450" font-weight="bold">不匹配：dp[i][j] = 0</text>
  <text x="64" y="352" font-size="11" fill="#888">连续段断裂，归零重计</text>
  <text x="64" y="372" font-size="11" fill="#888">答案 = max dp[i][j]</text>

  <!-- right: subsequence (1143) -->
  <g filter="url(#rough2)">
    <rect x="290" y="262" width="220" height="120" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" stroke-dasharray="5,3"/>
  </g>
  <text x="400" y="284" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">1143 子序列（可跳）</text>
  <text x="304" y="308" font-size="11.5" fill="#444">匹配：dp[i−1][j−1] + 1</text>
  <text x="304" y="330" font-size="11.5" fill="#446688" font-weight="bold">不匹配：max(上, 左)</text>
  <text x="304" y="352" font-size="11" fill="#888">跳过一个字符，续传</text>
  <text x="304" y="372" font-size="11" fill="#888">答案 = dp[m][n]</text>

  <text x="280" y="400" text-anchor="middle" font-size="11.5" fill="#888" font-style="italic">口诀：子序列不匹配取 max（可跳），子数组不匹配归零（必断）</text>
</svg>
