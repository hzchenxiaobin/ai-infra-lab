<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="380" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：s = "1101" → 6 步</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888">逐位消费 s[3..1]，每位用 sum = s[i] + carry 判定情形，最后用 carry 判最高位</text>

  <!-- header row -->
  <g font-size="11" fill="#444" font-weight="bold">
    <rect x="40" y="62" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="70" y="84" text-anchor="middle">i</text>
    <rect x="100" y="62" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="130" y="84" text-anchor="middle">s[i]</text>
    <rect x="160" y="62" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="195" y="84" text-anchor="middle">carry 入</text>
    <rect x="230" y="62" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="260" y="84" text-anchor="middle">sum</text>
    <rect x="290" y="62" width="130" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="355" y="84" text-anchor="middle">情形</text>
    <rect x="420" y="62" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="455" y="84" text-anchor="middle">步数</text>
    <rect x="490" y="62" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="525" y="84" text-anchor="middle">carry 出</text>
    <rect x="560" y="62" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="595" y="84" text-anchor="middle">累计</text>
  </g>

  <!-- row 1: i=3 -->
  <g font-size="12">
    <rect x="40" y="100" width="60" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="70" y="122" text-anchor="middle" fill="#666" font-weight="bold">3</text>
    <rect x="100" y="100" width="60" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="130" y="122" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="160" y="100" width="70" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="195" y="122" text-anchor="middle" fill="#666">0</text>
    <rect x="230" y="100" width="60" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="260" y="122" text-anchor="middle" fill="#666">1</text>
    <rect x="290" y="100" width="130" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="355" y="122" text-anchor="middle" fill="#b85450" font-weight="bold">奇数：+1,/2</text>
    <rect x="420" y="100" width="70" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="455" y="122" text-anchor="middle" fill="#b85450" font-weight="bold">+2</text>
    <rect x="490" y="100" width="70" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="525" y="122" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="560" y="100" width="70" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="595" y="122" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
  </g>

  <!-- row 2: i=2 -->
  <g font-size="12">
    <rect x="40" y="138" width="60" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="70" y="160" text-anchor="middle" fill="#666" font-weight="bold">2</text>
    <rect x="100" y="138" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="130" y="160" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
    <rect x="160" y="138" width="70" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="195" y="160" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="230" y="138" width="60" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="260" y="160" text-anchor="middle" fill="#666">1</text>
    <rect x="290" y="138" width="130" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="355" y="160" text-anchor="middle" fill="#b85450" font-weight="bold">奇数：+1,/2</text>
    <rect x="420" y="138" width="70" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="455" y="160" text-anchor="middle" fill="#b85450" font-weight="bold">+2</text>
    <rect x="490" y="138" width="70" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="525" y="160" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="560" y="138" width="70" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="595" y="160" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
  </g>

  <!-- row 3: i=1 -->
  <g font-size="12">
    <rect x="40" y="176" width="60" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="70" y="198" text-anchor="middle" fill="#666" font-weight="bold">1</text>
    <rect x="100" y="176" width="60" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="130" y="198" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="160" y="176" width="70" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="195" y="198" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="230" y="176" width="60" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="260" y="198" text-anchor="middle" fill="#666">2</text>
    <rect x="290" y="176" width="130" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="355" y="198" text-anchor="middle" fill="#d6a040" font-weight="bold">1+1=10：/2</text>
    <rect x="420" y="176" width="70" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="455" y="198" text-anchor="middle" fill="#d6a040" font-weight="bold">+1</text>
    <rect x="490" y="176" width="70" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="525" y="198" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="560" y="176" width="70" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="595" y="198" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
  </g>

  <!-- row 4: MSB -->
  <g font-size="12">
    <rect x="40" y="214" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="70" y="236" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
    <rect x="100" y="214" width="60" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="130" y="236" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="160" y="214" width="70" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="195" y="236" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="230" y="214" width="60" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="260" y="236" text-anchor="middle" fill="#999">—</text>
    <rect x="290" y="214" width="130" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="355" y="236" text-anchor="middle" fill="#446688" font-weight="bold">最高位：1+1=10,/2</text>
    <rect x="420" y="214" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="455" y="236" text-anchor="middle" fill="#446688" font-weight="bold">+1</text>
    <rect x="490" y="214" width="70" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="525" y="236" text-anchor="middle" fill="#999">—</text>
    <rect x="560" y="214" width="70" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="595" y="236" text-anchor="middle" fill="#b85450" font-weight="bold">6</text>
  </g>

  <!-- trace note -->
  <rect x="40" y="266" width="590" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="288" font-size="12" fill="#446688" font-weight="bold">对应实际数值轨迹（13 → 1）：</text>
  <text x="60" y="308" font-size="11" fill="#555">13(+1)→14(/2)→7(+1)→8(/2)→4(/2)→2(/2)→1</text>
  <text x="60" y="328" font-size="11" fill="#666">i=3 奇数 +1,/2 对应 13→7；i=2 奇数对应 7→4；i=1 偶数对应 4→2；最高位 carry=1 对应 2→1</text>
  <text x="60" y="348" font-size="11" fill="#b85450" font-weight="bold">最终 return steps + carry = 5 + 1 = 6 ✓</text>
</svg>
