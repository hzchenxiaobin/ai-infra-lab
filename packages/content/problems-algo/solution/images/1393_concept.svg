<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="480" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：符号化求和 — Buy 取负、Sell 取正，SUM 即净损益</text>
  <text x="330" y="46" text-anchor="middle" font-size="11" fill="#888">无需逐对配对买卖交易，总损益 = Σ(Sell 价) − Σ(Buy 价) = Σ(price × sign)</text>

  <!-- ====== Row 1: Corona Masks operations ====== -->
  <text x="110" y="84" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">操作</text>
  <text x="110" y="98" text-anchor="end" font-size="10" fill="#888">Corona Masks</text>

  <g font-size="9" fill="#888">
    <text x="180" y="62" text-anchor="middle">day2</text>
    <text x="260" y="62" text-anchor="middle">day3</text>
    <text x="340" y="62" text-anchor="middle">day4</text>
    <text x="420" y="62" text-anchor="middle">day5</text>
    <text x="500" y="62" text-anchor="middle">day6</text>
    <text x="580" y="62" text-anchor="middle">day10</text>
  </g>

  <g>
    <rect x="140" y="66" width="80" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="180" y="84" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">Buy</text>
    <text x="180" y="100" text-anchor="middle" font-size="11" fill="#555">1000</text>

    <rect x="220" y="66" width="80" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="260" y="84" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">Sell</text>
    <text x="260" y="100" text-anchor="middle" font-size="11" fill="#555">1010</text>

    <rect x="300" y="66" width="80" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="340" y="84" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">Buy</text>
    <text x="340" y="100" text-anchor="middle" font-size="11" fill="#555">1000</text>

    <rect x="380" y="66" width="80" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="420" y="84" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">Sell</text>
    <text x="420" y="100" text-anchor="middle" font-size="11" fill="#555">500</text>

    <rect x="460" y="66" width="80" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="500" y="84" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">Buy</text>
    <text x="500" y="100" text-anchor="middle" font-size="11" fill="#555">1000</text>

    <rect x="540" y="66" width="80" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="580" y="84" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">Sell</text>
    <text x="580" y="100" text-anchor="middle" font-size="11" fill="#555">10000</text>
  </g>

  <!-- arrow down 1 -->
  <path d="M 330 112 L 330 132" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="340" y="126" font-size="10" fill="#666">① 符号化：IF(operation='Sell', price, −price)</text>

  <!-- ====== Row 2: signed prices ====== -->
  <text x="110" y="162" text-anchor="end" font-size="12" fill="#d6a040" font-weight="bold">带符号</text>
  <text x="110" y="176" text-anchor="end" font-size="10" fill="#888">signed_price</text>

  <g font-size="15">
    <rect x="140" y="146" width="80" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="180" y="172" text-anchor="middle" fill="#b85450" font-weight="bold">−10</text>

    <rect x="220" y="146" width="80" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="260" y="172" text-anchor="middle" fill="#4a7a3a" font-weight="bold">+1010</text>

    <rect x="300" y="146" width="80" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="340" y="172" text-anchor="middle" fill="#b85450" font-weight="bold">−1000</text>

    <rect x="380" y="146" width="80" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="420" y="172" text-anchor="middle" fill="#4a7a3a" font-weight="bold">+500</text>

    <rect x="460" y="146" width="80" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="500" y="172" text-anchor="middle" fill="#b85450" font-weight="bold">−1000</text>

    <rect x="540" y="146" width="80" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="580" y="172" text-anchor="middle" fill="#4a7a3a" font-weight="bold">+10000</text>
  </g>

  <!-- arrow down 2 -->
  <path d="M 330 192 L 330 212" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="340" y="206" font-size="10" fill="#666">② GROUP BY stock_name + SUM(signed_price)</text>

  <!-- ====== Row 3: Result ====== -->
  <rect x="220" y="226" width="220" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="250" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">Corona Masks → 9500</text>
  <text x="330" y="266" text-anchor="middle" font-size="10" fill="#888">(−10)+1010+(−1000)+500+(−1000)+10000 = 9500</text>

  <!-- ====== Note box ====== -->
  <rect x="40" y="300" width="580" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="322" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">为什么无需配对买卖？</text>
  <text x="330" y="342" text-anchor="middle" font-size="11" fill="#666">总损益 = Σ(Sell 价格) − Σ(Buy 价格)，与买卖如何配对无关</text>
  <text x="330" y="358" text-anchor="middle" font-size="11" fill="#666">配对方式只影响「每笔盈亏」的拆分，不影响「总盈亏」的值</text>
  <text x="330" y="372" text-anchor="middle" font-size="10" fill="#888">⇒ 一行 IF + GROUP BY + SUM 即可，省去窗口函数配对</text>

  <!-- ====== Formula box ====== -->
  <rect x="120" y="396" width="420" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="330" y="418" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">capital_gain_loss = Σ price × sign(operation)</text>
  <text x="330" y="436" text-anchor="middle" font-size="11" fill="#666">sign(Buy) = −1, sign(Sell) = +1</text>
  <text x="330" y="450" text-anchor="middle" font-size="10" fill="#888">等价于 SUM(IF(operation='Sell', price, −price))</text>
</svg>
