<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：值的定义是分段函数，判别式 = 「是否全为数字」</text>

  <!-- ====== Input string ====== -->
  <rect x="200" y="38" width="140" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="56" text-anchor="middle" font-size="12" fill="#333">输入字符串 s</text>
  <text x="270" y="71" text-anchor="middle" font-size="10.5" fill="#888">仅小写字母 + 数字，长度 ≤ 9</text>

  <!-- arrow down to decision -->
  <path d="M 270 78 L 270 94" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== Decision diamond ====== -->
  <polygon points="270,96 336,128 270,160 204,128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="124" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">每个字符</text>
  <text x="270" y="139" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">都是 0-9？</text>

  <!-- Yes branch (left) -->
  <path d="M 204 128 L 130 128 L 130 152" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="168" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- No branch (right) -->
  <path d="M 336 128 L 410 128 L 410 152" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="372" y="122" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">否（含字母）</text>

  <!-- ====== Left: numeric value ====== -->
  <rect x="46" y="156" width="168" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="176" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">值 = int(s)（解析为数值）</text>
  <text x="130" y="194" text-anchor="middle" font-size="11" fill="#333">「3」→ 3</text>
  <text x="130" y="211" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">「00000」→ 0 ⚠️</text>

  <!-- ====== Right: length value ====== -->
  <rect x="326" y="156" width="168" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="410" y="176" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">值 = len(s)（取长度）</text>
  <text x="410" y="194" text-anchor="middle" font-size="11" fill="#333">「alic3」→ 5</text>
  <text x="410" y="211" text-anchor="middle" font-size="11" fill="#333">「bob」→ 3</text>

  <!-- converge arrows -->
  <path d="M 130 218 L 130 240 L 250 240" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 410 218 L 410 240 L 290 240" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 270 240 L 270 256" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== Max output ====== -->
  <rect x="170" y="258" width="200" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="281" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">ans = max(ans, 值)</text>

  <!-- ====== bottom note ====== -->
  <rect x="30" y="304" width="480" height="48" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="8" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="270" y="322" text-anchor="middle" font-size="10.5" fill="#555">两分支产出「计数 vs 解析数」两种不可直接比较的量，统一于「非负整数取 max」</text>
  <text x="270" y="340" text-anchor="middle" font-size="10.5" fill="#b85450">⚠ 前导零陷阱：「00000」值 = 0 而非 5 —— 全数字必须解析数值，绝不能当长度</text>
</svg>
