<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums=[7,1,5,4]</text>

  <!-- Header row -->
  <rect x="30" y="48" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="55" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">j</text>
  <rect x="80" y="48" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="110" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums[j]</text>
  <rect x="140" y="48" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="195" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">min_so_far</text>
  <rect x="250" y="48" width="200" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="350" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">diff = nums[j] − min_so_far</text>
  <rect x="450" y="48" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="490" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans</text>
  <rect x="530" y="48" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="570" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">更新 min</text>

  <!-- Row 0: j=0 (init) -->
  <rect x="30" y="78" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="55" y="99" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="80" y="78" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="99" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <rect x="140" y="78" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="195" y="99" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">7（初始化）</text>
  <rect x="250" y="78" width="200" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="99" text-anchor="middle" font-size="10" fill="#888">—（起点，无前缀）</text>
  <rect x="450" y="78" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="490" y="99" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−1</text>
  <rect x="530" y="78" width="80" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="570" y="99" text-anchor="middle" font-size="10" fill="#888">—</text>

  <!-- Row 1: j=1, x=1 -->
  <rect x="30" y="114" width="50" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="135" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="80" y="114" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="135" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="140" y="114" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="195" y="135" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="250" y="114" width="200" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="135" text-anchor="middle" font-size="10" fill="#888">1 − 7 = −6 ≤ 0，跳过</text>
  <rect x="450" y="114" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="490" y="135" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−1</text>
  <rect x="530" y="114" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="570" y="135" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">min←1</text>

  <!-- Row 2: j=2, x=5 HIT -->
  <rect x="30" y="150" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="55" y="171" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="80" y="150" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="171" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="140" y="150" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="195" y="171" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="250" y="150" width="200" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="350" y="171" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">5 − 1 = 4 &gt; 0 ✓</text>
  <rect x="450" y="150" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="490" y="171" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>
  <rect x="530" y="150" width="80" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="570" y="171" text-anchor="middle" font-size="10" fill="#888">不变</text>

  <!-- Row 3: j=3, x=4 -->
  <rect x="30" y="186" width="50" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="207" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="80" y="186" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="207" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="140" y="186" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="195" y="207" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="250" y="186" width="200" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="207" text-anchor="middle" font-size="10" fill="#888">4 − 1 = 3 &lt; ans=4，跳过</text>
  <rect x="450" y="186" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="490" y="207" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>
  <rect x="530" y="186" width="80" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="570" y="207" text-anchor="middle" font-size="10" fill="#888">不变</text>

  <!-- best pair box -->
  <rect x="30" y="244" width="580" height="74" fill="#fafafa" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" rx="6" filter="url(#rough2)"/>
  <text x="40" y="266" font-size="11" fill="#666" font-weight="bold">最佳配对（i&lt;j 且 nums[i]&lt;nums[j]）：</text>
  <text x="40" y="288" font-size="11" fill="#333">• i=1 (nums[i]=1) , j=2 (nums[j]=5)  →  差值 = 5 − 1 = 4 ⭐</text>
  <text x="40" y="308" font-size="11" fill="#888">i=1 是 [0..1] 中的最小值，正好是 j=2 时的 min_so_far。</text>

  <!-- result -->
  <rect x="170" y="332" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="360" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">最终 ans = 4 ⭐</text>

  <!-- footer note -->
  <rect x="60" y="388" width="520" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="320" y="412" text-anchor="middle" font-size="11" fill="#555">注意：min_so_far 在 j=1 处由 7 降到 1，之后不再变；ans 只在差值更大时更新。</text>
</svg>
