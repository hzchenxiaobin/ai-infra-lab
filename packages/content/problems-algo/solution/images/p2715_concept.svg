<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">核心：t 与 cancelTimeMs 的赛跑</text>

  <!-- 时间轴刻度（共用） -->
  <!-- 场景一：cancelTimeMs >= t，fn 执行 -->
  <text x="40" y="80" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">场景一 fn 执行</text>
  <line x1="80" y1="110" x2="500" y2="110" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="505" y="114" font-size="11" fill="#999" filter="url(#rough2)">t</text>

  <!-- t=20 处 fn 执行（绿） -->
  <line x1="160" y1="98" x2="160" y2="122" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="160" cy="110" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">t=20</text>
  <text x="160" y="140" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">fn(2)=10 ✓</text>

  <!-- cancelTimeMs=50 处（橙，no-op） -->
  <line x1="320" y1="98" x2="320" y2="122" stroke="#d6a040" stroke-width="2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <circle cx="320" cy="110" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">cancel=50</text>
  <text x="320" y="140" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">已触发，clearTimeout 无效</text>

  <!-- 输出 -->
  <rect x="200" y="155" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">输出 [{time:20, returned:10}]</text>

  <!-- 场景二：cancelTimeMs < t，fn 取消 -->
  <text x="40" y="225" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">场景二 fn 取消</text>
  <line x1="80" y1="255" x2="500" y2="255" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="505" y="259" font-size="11" fill="#999" filter="url(#rough2)">t</text>

  <!-- cancelTimeMs=50 处 clearTimeout（红） -->
  <line x1="200" y1="243" x2="200" y2="267" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="200" cy="255" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="237" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">cancel=50</text>
  <text x="200" y="285" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">clearTimeout(timer)</text>

  <!-- t=100 处 fn 本应执行但被取消（灰虚） -->
  <line x1="360" y1="243" x2="360" y2="267" stroke="#ccc" stroke-width="2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <circle cx="360" cy="255" r="6" fill="none" stroke="#ccc" stroke-width="2" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <text x="360" y="237" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">t=100</text>
  <text x="360" y="285" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">fn 不会触发 ✗</text>

  <!-- 输出 -->
  <rect x="200" y="300" width="160" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="317" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">输出 [] (空数组)</text>

  <!-- 图例 -->
  <rect x="50" y="345" width="470" height="28" fill="none" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="62" y="363" font-size="10" fill="#333" filter="url(#rough2)">● 绿=fn 实际执行</text>
  <text x="200" y="363" font-size="10" fill="#333" filter="url(#rough2)">● 橙=cancelFn 调用(已晚，无效)</text>
  <text x="400" y="363" font-size="10" fill="#333" filter="url(#rough2)">● 红=clearTimeout 成功取消</text>
</svg>
