<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">奇数求和恒等式：1 + 3 + 5 + 7 = 16 = 4²</text>

  <!-- ===== 4×4 grid showing L-shaped layers ===== -->
  <!-- grid origin at x=60, y=50, cell size 40 -->

  <!-- Layer 1 (value 1, green): cell (0,0) -->
  <rect x="60" y="50" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="80" y="74" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- Layer 3 (value 3, blue): cells (0,1),(1,0),(1,1) -->
  <rect x="100" y="50" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="60" y="90" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="100" y="90" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="120" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <text x="80" y="114" text-anchor="middle" font-size="10" fill="#446688">3</text>
  <text x="120" y="114" text-anchor="middle" font-size="10" fill="#446688">3</text>

  <!-- Layer 5 (value 5, orange): cells (0,2),(1,2),(2,0),(2,1),(2,2) -->
  <rect x="140" y="50" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="140" y="90" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="60" y="130" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="100" y="130" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="140" y="130" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="160" y="74" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">5</text>
  <text x="160" y="114" text-anchor="middle" font-size="10" fill="#d6a040">5</text>
  <text x="80" y="154" text-anchor="middle" font-size="9" fill="#d6a040">5</text>
  <text x="120" y="154" text-anchor="middle" font-size="9" fill="#d6a040">5</text>
  <text x="160" y="154" text-anchor="middle" font-size="9" fill="#d6a040">5</text>

  <!-- Layer 7 (value 7, pink): cells (0,3),(1,3),(2,3),(3,0),(3,1),(3,2),(3,3) -->
  <rect x="180" y="50" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="180" y="90" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="180" y="130" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="60" y="170" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="100" y="170" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="140" y="170" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="180" y="170" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="200" y="74" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">7</text>
  <text x="200" y="114" text-anchor="middle" font-size="9" fill="#b85450">7</text>
  <text x="200" y="154" text-anchor="middle" font-size="9" fill="#b85450">7</text>
  <text x="80" y="194" text-anchor="middle" font-size="9" fill="#b85450">7</text>
  <text x="120" y="194" text-anchor="middle" font-size="9" fill="#b85450">7</text>
  <text x="160" y="194" text-anchor="middle" font-size="9" fill="#b85450">7</text>
  <text x="200" y="194" text-anchor="middle" font-size="9" fill="#b85450">7</text>

  <!-- grid bracket / size labels -->
  <text x="40" y="74" text-anchor="end" font-size="10" fill="#999">1</text>
  <text x="40" y="114" text-anchor="end" font-size="10" fill="#999">2</text>
  <text x="40" y="154" text-anchor="end" font-size="10" fill="#999">3</text>
  <text x="40" y="194" text-anchor="end" font-size="10" fill="#999">4</text>

  <!-- equation below grid -->
  <rect x="50" y="226" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="170" y="252" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1 + 3 + 5 + 7 = 16 = 4²</text>

  <!-- ===== Right side: legend & progression ===== -->
  <text x="320" y="58" font-size="12" fill="#888" font-weight="bold">每层 = 一个奇数</text>

  <rect x="320" y="68" width="22" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="352" y="80" font-size="11" fill="#4a7a3a">1 → 1² = 1</text>

  <rect x="320" y="92" width="22" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="352" y="104" font-size="11" fill="#446688">3 → 2² = 4</text>

  <rect x="320" y="116" width="22" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="352" y="128" font-size="11" fill="#d6a040">5 → 3² = 9</text>

  <rect x="320" y="140" width="22" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="352" y="152" font-size="11" fill="#b85450">7 → 4² = 16</text>

  <!-- arrow from grid to legend showing L-shapes -->
  <path d="M 230 110 L 312 100" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- formula box -->
  <rect x="310" y="172" width="190" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="405" y="194" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">通用恒等式</text>
  <text x="405" y="216" text-anchor="middle" font-size="12" fill="#444">1+3+⋯+(2n−1) = n²</text>
  <text x="405" y="232" text-anchor="middle" font-size="10" fill="#888">(n+1)² − n² = 2n+1</text>

  <!-- bottom note -->
  <text x="260" y="310" text-anchor="middle" font-size="10" fill="#888">从 num 依次减 1, 3, 5, 7, … → 减到 0 即完全平方数，全程无乘法不溢出</text>
  <text x="260" y="326" text-anchor="middle" font-size="10" fill="#aaa">本题独有的数学解法，O(√n) 时间</text>
</svg>
