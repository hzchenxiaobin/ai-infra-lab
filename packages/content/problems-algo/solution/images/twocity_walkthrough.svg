<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    示例演算：costs = [[10,20],[30,200],[400,50],[30,20]]，n = 2
  </text>

  <!-- 表格外框 -->
  <rect x="28" y="46" width="504" height="152" rx="6" fill="none"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 表头背景 -->
  <rect x="28" y="46" width="504" height="32" fill="#e8f0fe" filter="url(#rough2)"/>

  <!-- 列竖线 92,156,220,316,396,460 -->
  <g stroke="#446688" stroke-width="1.2" filter="url(#rough2)">
    <line x1="92"  y1="46" x2="92"  y2="198"/>
    <line x1="156" y1="46" x2="156" y2="198"/>
    <line x1="220" y1="46" x2="220" y2="198"/>
    <line x1="316" y1="46" x2="316" y2="198"/>
    <line x1="396" y1="46" x2="396" y2="198"/>
    <line x1="460" y1="46" x2="460" y2="198"/>
  </g>
  <line x1="28" y1="78" x2="532" y2="78" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 表头文字 -->
  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="60"  y="67">人 i</text>
    <text x="124" y="67">aCost</text>
    <text x="188" y="67">bCost</text>
    <text x="268" y="67">diff = a − b</text>
    <text x="356" y="67">排序位次</text>
    <text x="428" y="67">派往</text>
    <text x="496" y="67">费用</text>
  </g>

  <!-- 行0 人0 -> a (green) -->
  <rect x="28" y="78" width="504" height="30" fill="#e6f4ea" fill-opacity="0.45" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="60"  y="99">0</text>
    <text x="124" y="99">10</text>
    <text x="188" y="99">20</text>
    <text x="268" y="99" fill="#b85450">−10</text>
    <text x="356" y="99">2</text>
    <text x="428" y="99" fill="#4a7a3a" font-weight="bold">a</text>
    <text x="496" y="99">10</text>
  </g>
  <line x1="28" y1="108" x2="532" y2="108" stroke="#cfd8e6" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行1 人1 -> a (green) -->
  <rect x="28" y="108" width="504" height="30" fill="#e6f4ea" fill-opacity="0.45" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="60"  y="129">1</text>
    <text x="124" y="129">30</text>
    <text x="188" y="129">200</text>
    <text x="268" y="129" fill="#b85450" font-weight="bold">−170</text>
    <text x="356" y="129">1</text>
    <text x="428" y="129" fill="#4a7a3a" font-weight="bold">a</text>
    <text x="496" y="129">30</text>
  </g>
  <line x1="28" y1="138" x2="532" y2="138" stroke="#cfd8e6" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行2 人2 -> b (blue) -->
  <rect x="28" y="138" width="504" height="30" fill="#e8f0fe" fill-opacity="0.45" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="60"  y="159">2</text>
    <text x="124" y="159">400</text>
    <text x="188" y="159">50</text>
    <text x="268" y="159" fill="#b85450">+350</text>
    <text x="356" y="159">4</text>
    <text x="428" y="159" fill="#446688" font-weight="bold">b</text>
    <text x="496" y="159">50</text>
  </g>
  <line x1="28" y1="168" x2="532" y2="168" stroke="#cfd8e6" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行3 人3 -> b (blue) -->
  <rect x="28" y="168" width="504" height="30" fill="#e8f0fe" fill-opacity="0.45" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="60"  y="189">3</text>
    <text x="124" y="189">30</text>
    <text x="188" y="189">20</text>
    <text x="268" y="189" fill="#b85450">+10</text>
    <text x="356" y="189">3</text>
    <text x="428" y="189" fill="#446688" font-weight="bold">b</text>
    <text x="496" y="189">20</text>
  </g>

  <!-- 图例 -->
  <text x="280" y="218" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">
    绿行 = 派往 a 市；蓝行 = 派往 b 市；红字 = diff（决定排序）
  </text>

  <!-- 排序与求和说明 -->
  <rect x="48" y="232" width="464" height="68" rx="8" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">
    按 diff 升序：人1(−170) → 人0(−10) → 人3(+10) → 人2(+350)
  </text>
  <text x="280" y="270" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">
    前 n=2 去 a：a=30 + a=10 = 40
  </text>
  <text x="280" y="288" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">
    后 n=2 去 b：b=20 + b=50 = 70
  </text>

  <!-- 结论 -->
  <rect x="80" y="312" width="400" height="38" rx="16" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    总费用 = 40 + 70 = 110 ✓
  </text>
</svg>
