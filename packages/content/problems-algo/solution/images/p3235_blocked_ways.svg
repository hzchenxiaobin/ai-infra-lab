<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">无路可走 ⇔ 一串接触的圆连接这四组边界（墙—路对偶）</text>

  <!-- 面板 A：左 ↔ 右 -->
  <rect x="16" y="42" width="252" height="164" fill="#ffffff" stroke="#b0b8c4" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="142" y="62" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">① 左 ↔ 右：横向切断</text>
  <rect x="52" y="78" width="120" height="96" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="52" cy="102" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="92" cy="124" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="132" cy="106" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="172" cy="128" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="52" cy="174" r="4.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="40" y="192" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">起点</text>
  <circle cx="172" cy="78" r="4.5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="178" y="72" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">终点</text>
  <path d="M 58 170 Q 88 158 98 148" stroke="#888" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="102" y="146" font-size="18" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="142" y="198" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">起、终点被墙分居两侧</text>

  <!-- 面板 B：上 ↔ 下 -->
  <rect x="288" y="42" width="252" height="164" fill="#ffffff" stroke="#b0b8c4" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="414" y="62" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">② 上 ↔ 下：纵向切断</text>
  <rect x="324" y="78" width="120" height="96" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="370" cy="78" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="392" cy="112" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="368" cy="146" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="340" cy="174" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="324" cy="174" r="4.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="312" y="192" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">起点</text>
  <circle cx="444" cy="78" r="4.5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="72" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">终点</text>
  <path d="M 332 164 Q 340 156 344 148" stroke="#888" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="346" y="144" font-size="18" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="414" y="198" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">起、终点被墙分居两侧</text>

  <!-- 面板 C：左 ↔ 下 围死起点 -->
  <rect x="16" y="222" width="252" height="164" fill="#ffffff" stroke="#b0b8c4" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="142" y="242" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 左 ↔ 下：围死起点</text>
  <rect x="52" y="258" width="120" height="96" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <polygon points="52,354 52,322 84,354" fill="#fce4ec" opacity="0.5" filter="url(#rough2)"/>
  <circle cx="52" cy="290" r="23" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="84" cy="322" r="23" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="116" cy="354" r="23" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="52" cy="354" r="4.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="372" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">起点</text>
  <circle cx="172" cy="258" r="4.5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="178" y="252" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">终点</text>
  <path d="M 56 350 Q 60 344 66 340" stroke="#888" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="70" y="340" font-size="18" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="142" y="378" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">墙 + 左边 + 下边围出含 (0,0) 的角域</text>

  <!-- 面板 D：上 ↔ 右 围死终点 -->
  <rect x="288" y="222" width="252" height="164" fill="#ffffff" stroke="#b0b8c4" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="414" y="242" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ 上 ↔ 右：围死终点</text>
  <rect x="324" y="258" width="120" height="96" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <polygon points="444,258 444,292 410,258" fill="#fce4ec" opacity="0.45" filter="url(#rough2)"/>
  <circle cx="382" cy="258" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="410" cy="286" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="444" cy="316" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="324" cy="354" r="4.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="312" y="372" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">起点</text>
  <circle cx="444" cy="258" r="4.5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="402" y="250" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">终点</text>
  <path d="M 438 262 Q 430 262 422 264" stroke="#888" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="414" y="258" font-size="18" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="414" y="378" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">墙 + 上边 + 右边围出含 (X,Y) 的角域</text>

  <!-- 底部对照说明 -->
  <rect x="16" y="394" width="524" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="278" y="409" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">对照：左↔上、下↔右 围的是「无人角」（左上 / 右下）→ 不阻断，路径可从墙的自由端绕行</text>
</svg>
