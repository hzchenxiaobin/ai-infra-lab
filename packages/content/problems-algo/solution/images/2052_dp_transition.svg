<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">DP 状态转移：dfs(i) 枚举分割点 j</text>

  <!-- Words array -->
  <text x="280" y="54" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">单词序列</text>
  <rect x="70" y="62" width="55" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="80" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">w[i]</text>
  <rect x="132" y="62" width="55" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="159" y="80" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">w[i+1]</text>
  <rect x="194" y="62" width="45" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="80" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">...</text>
  <rect x="246" y="62" width="55" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="273" y="80" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">w[j-1]</text>
  <rect x="308" y="62" width="55" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="80" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">w[j]</text>
  <rect x="370" y="62" width="45" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="393" y="80" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">...</text>
  <rect x="422" y="62" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="452" y="80" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">w[n-1]</text>

  <!-- Current row bracket: w[i..j-1] -->
  <path d="M 70 94 L 70 102 L 301 102 L 301 94" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="116" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">当前行 = w[i..j-1]，行宽 m = Σ长度 + (j−i−1) 空格</text>

  <!-- dfs(i) box -->
  <rect x="50" y="150" width="130" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="115" y="176" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">dfs(i)</text>

  <!-- Branch 1: j=i+1 -->
  <path d="M 180 162 L 320 134" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="320" y="116" width="160" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="132" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">j=i+1：行={w[i]}</text>
  <text x="400" y="147" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">(k−L[i])² + dfs(i+1)</text>

  <!-- Branch 2: j=i+2 -->
  <path d="M 180 172 L 320 186" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="320" y="168" width="160" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="184" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">j=i+2：行={w[i], w[i+1]}</text>
  <text x="400" y="199" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">(k−m)² + dfs(i+2)</text>

  <!-- Branch 3: j=... -->
  <path d="M 180 184 L 320 238" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="320" y="220" width="160" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="236" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">j = ...（枚举所有 m ≤ k）</text>
  <text x="400" y="251" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">(k−m)² + dfs(j)</text>

  <!-- Take min -->
  <path d="M 400 258 L 400 286" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="250" y="290" width="220" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="360" y="313" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">取所有 j 的最小值 → memo[i]</text>

  <!-- Base case -->
  <path d="M 115 192 L 115 288" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="125" y="244" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">余下全放得下</text>
  <rect x="40" y="290" width="160" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="120" y="310" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">基准情况</text>
  <text x="120" y="326" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">剩余单词一行放得下</text>

  <!-- Bottom notes -->
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">约束：m ≤ k（行宽不超限），j 从 i+1 枚举到首个超限即停</text>
  <text x="280" y="390" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">记忆化缓存 n 个状态，每个状态枚举 O(n) 个 j → 总 O(n²)</text>
</svg>
