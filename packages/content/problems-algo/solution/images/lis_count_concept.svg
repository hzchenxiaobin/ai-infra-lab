<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 420" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="420" fill="#fdfcf7"/>

  <text x="370" y="32" text-anchor="middle" font-size="18" fill="#2b2b2b" font-weight="bold">双数组 DP：length[] 记长度，count[] 记条数</text>
  <path d="M 230 42 Q 370 50 510 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="370" y="56" text-anchor="middle" font-size="11" fill="#888">nums = [1, 3, 5, 4, 7]　以 i=4 (7) 为例看两条转移规则</text>

  <!-- nums 行 -->
  <text x="50" y="92" font-size="12" fill="#888" font-weight="bold">nums</text>
  <g filter="url(#sk)">
    <rect x="90" y="76" width="56" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="146" y="76" width="56" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="202" y="76" width="56" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="258" y="76" width="56" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="314" y="76" width="56" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
  </g>
  <text x="118" y="96" text-anchor="middle" font-size="13" fill="#2b2b2b">1</text>
  <text x="174" y="96" text-anchor="middle" font-size="13" fill="#2b2b2b">3</text>
  <text x="230" y="96" text-anchor="middle" font-size="13" fill="#2b2b2b">5</text>
  <text x="286" y="96" text-anchor="middle" font-size="13" fill="#2b2b2b">4</text>
  <text x="342" y="96" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">7</text>
  <text x="50" y="124" font-size="11" fill="#888">i</text>
  <text x="118" y="124" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="174" y="124" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="230" y="124" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="286" y="124" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="342" y="124" text-anchor="middle" font-size="11" fill="#888">4</text>

  <!-- length 行 -->
  <text x="50" y="156" font-size="12" fill="#888" font-weight="bold">length</text>
  <g filter="url(#sk)">
    <rect x="90" y="140" width="56" height="30" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
    <rect x="146" y="140" width="56" height="30" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
    <rect x="202" y="140" width="56" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="258" y="140" width="56" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="314" y="140" width="56" height="30" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="118" y="160" text-anchor="middle" font-size="13" fill="#2b2b2b">1</text>
  <text x="174" y="160" text-anchor="middle" font-size="13" fill="#2b2b2b">2</text>
  <text x="230" y="160" text-anchor="middle" font-size="13" fill="#2b2b2b">3</text>
  <text x="286" y="160" text-anchor="middle" font-size="13" fill="#2b2b2b">3</text>
  <text x="342" y="160" text-anchor="middle" font-size="14" fill="#c98a2b" font-weight="bold">4</text>

  <!-- count 行 -->
  <text x="50" y="196" font-size="12" fill="#888" font-weight="bold">count</text>
  <g filter="url(#sk)">
    <rect x="90" y="180" width="56" height="30" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
    <rect x="146" y="180" width="56" height="30" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
    <rect x="202" y="180" width="56" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="258" y="180" width="56" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="314" y="180" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="118" y="200" text-anchor="middle" font-size="13" fill="#2b2b2b">1</text>
  <text x="174" y="200" text-anchor="middle" font-size="13" fill="#2b2b2b">1</text>
  <text x="230" y="200" text-anchor="middle" font-size="13" fill="#2b2b2b">1</text>
  <text x="286" y="200" text-anchor="middle" font-size="13" fill="#2b2b2b">1</text>
  <text x="342" y="200" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>

  <!-- 两条转移规则 -->
  <g filter="url(#sk)">
    <rect x="40" y="232" width="320" height="78" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" stroke-dasharray="5,3"/>
  </g>
  <text x="56" y="254" font-size="12" fill="#4a8e4a" font-weight="bold">规则一：发现更长的前驱</text>
  <text x="56" y="274" font-size="11" fill="#444">length[j]+1 &gt; length[i]</text>
  <text x="56" y="292" font-size="11" fill="#2b2b2b">→ length[i] = length[j]+1</text>
  <text x="56" y="306" font-size="11" fill="#2b2b2b">→ count[i] = count[j]  ← 推倒重来</text>
  <!-- 箭头：j=2 (5) 指向 i=4，length 3+1=4 > 旧值 -->
  <path d="M 230 156 Q 290 210 314 156" stroke="#4a8e4a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="296" y="220" font-size="10" fill="#4a8e4a">j=2: 3+1=4 &gt; 旧3</text>

  <g filter="url(#sk)">
    <rect x="380" y="232" width="320" height="78" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5,3"/>
  </g>
  <text x="396" y="254" font-size="12" fill="#b85450" font-weight="bold">规则二：遇到等长的新前驱</text>
  <text x="396" y="274" font-size="11" fill="#444">length[j]+1 == length[i]</text>
  <text x="396" y="292" font-size="11" fill="#2b2b2b">→ length[i] 不变</text>
  <text x="396" y="306" font-size="11" fill="#2b2b2b">→ count[i] += count[j]  ← 累加</text>
  <!-- 箭头：j=3 (4) 指向 i=4，length 3+1=4 == 已有4 -->
  <path d="M 286 196 Q 330 225 314 196" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="300" y="246" font-size="10" fill="#b85450">j=3: 3+1=4 == 4</text>

  <!-- 汇总答案 -->
  <g filter="url(#sk)">
    <rect x="40" y="328" width="660" height="70" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5,3"/>
  </g>
  <text x="60" y="350" font-size="12" fill="#2b2b2b" font-weight="bold">汇总答案：</text>
  <text x="60" y="370" font-size="11" fill="#444">① maxLen = max(length) = 4</text>
  <text x="60" y="388" font-size="11" fill="#b85450" font-weight="bold">② ans = Σ count[i]，对所有 length[i] == maxLen 的 i = count[4] = 2</text>
  <text x="500" y="388" font-size="11" fill="#888">即 [1,3,5,7] 与 [1,3,4,7] 两条</text>
</svg>
