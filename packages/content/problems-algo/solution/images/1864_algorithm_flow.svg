<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：统计频次 → 判可行 → 数错位 → 取最小</text>

  <!-- Start -->
  <ellipse cx="300" cy="56" rx="42" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 300 74 L 300 92" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Count -->
  <rect x="150" y="96" width="300" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="300" y="117" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">统计 cnt₀、cnt₁，n = len(s)</text>
  <text x="300" y="133" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">ans = ∞</text>

  <path d="M 300 142 L 300 162" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: Pattern A feasible? -->
  <polygon points="300,166 440,210 300,254 160,210" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="206" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">模式A可行？</text>
  <text x="300" y="222" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">cnt₀=⌈n/2⌉ 且 cnt₁=⌊n/2⌋</text>

  <!-- Yes branch -->
  <text x="448" y="206" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 440 210 L 470 210" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="470" y="188" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="530" y="206" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">misA = 错位数</text>
  <text x="530" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = min(ans, misA/2)</text>

  <path d="M 300 254 L 300 278" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="270" font-size="10" fill="#888" filter="url(#rough2)">否</text>

  <!-- Decision: Pattern B feasible? -->
  <polygon points="300,282 440,326 300,370 160,326" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="322" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">模式B可行？</text>
  <text x="300" y="338" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">cnt₁=⌈n/2⌉ 且 cnt₀=⌊n/2⌋</text>

  <!-- Yes branch -->
  <text x="448" y="322" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 440 326 L 470 326" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="470" y="304" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="530" y="322" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">misB = 错位数</text>
  <text x="530" y="338" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = min(ans, misB/2)</text>

  <path d="M 300 370 L 300 394" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="386" font-size="10" fill="#888" filter="url(#rough2)">否</text>

  <!-- Return -->
  <ellipse cx="300" cy="424" rx="110" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="429" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans == ∞ ? −1 : ans</text>
</svg>
