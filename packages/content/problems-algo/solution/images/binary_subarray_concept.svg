<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：0/1 单调性与「至多 K」转化</text>

  <!-- Top: nums array -->
  <text x="40" y="62" font-size="12" fill="#888">nums:</text>
  <rect x="90" y="48" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="67" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="136" y="48" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="67" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="182" y="48" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="67" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="228" y="48" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="67" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="274" y="48" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="296" y="67" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- arrows down (shifted to align prefix[i] under gap before nums[i]) -->
  <path d="M 112 80 L 112 94" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 158 80 L 158 94" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 204 80 L 204 94" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 250 80 L 250 94" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 296 80 L 296 94" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- prefix sum row: 6 values, prefix[0] sits before nums[0] -->
  <text x="36" y="114" font-size="12" fill="#888">前缀和:</text>
  <rect x="68" y="100" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="119" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="114" y="100" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="119" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="160" y="100" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="119" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="206" y="100" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="119" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="252" y="100" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="274" y="119" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="298" y="100" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="119" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>

  <text x="360" y="119" font-size="11" fill="#888">单调不减 ↗</text>

  <!-- Divider -->
  <path d="M 40 150 L 520 150" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Bottom: set diagram -->
  <text x="280" y="176" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">恰好 goal = 至多 goal − 至多 (goal−1)</text>

  <!-- Big circle: atMost(goal) -->
  <ellipse cx="280" cy="270" rx="180" ry="80" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="220" font-size="12" fill="#446688" font-weight="bold">至多 goal（和 ≤ goal）</text>
  <text x="130" y="236" font-size="10.5" fill="#888">atMost(goal)</text>

  <!-- Inner circle: atMost(goal-1) -->
  <ellipse cx="300" cy="280" rx="110" ry="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="300" font-size="12" fill="#4a7a3a" font-weight="bold">至多 goal−1（和 ≤ goal−1）</text>
  <text x="240" y="316" font-size="10.5" fill="#888">atMost(goal−1)</text>

  <!-- Ring label: exactly(goal) -->
  <text x="440" y="250" font-size="12" fill="#b85450" font-weight="bold">恰好 goal</text>
  <text x="440" y="266" font-size="12" fill="#b85450" font-weight="bold">= 环形区域</text>
  <path d="M 430 272 Q 410 272 390 280" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Formula box -->
  <rect x="100" y="360" width="360" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="381" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">exactly(goal) = atMost(goal) − atMost(goal−1)</text>
</svg>
