<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：a² + b² = c² → c 由 (a, b) 唯一确定</text>

  <!-- Left: Right triangle -->
  <!-- Triangle: A(90,250) B(240,250) C(240,135), right angle at B -->
  <path d="M 90 250 L 240 250 L 240 135 Z" fill="#e8f0fe" fill-opacity="0.4" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <!-- Right angle mark at B(240,250) -->
  <path d="M 226 250 L 226 236 L 240 236" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Side labels -->
  <text x="165" y="270" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">a</text>
  <text x="256" y="196" text-anchor="start" font-size="15" fill="#d6a040" font-weight="bold">b</text>
  <text x="150" y="185" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">c</text>

  <!-- Equation below triangle -->
  <rect x="100" y="288" width="130" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="165" y="308" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">a² + b² = c²</text>

  <!-- Right side: key insight chain -->
  <rect x="310" y="55" width="220" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c = √(a² + b²)</text>

  <path d="M 420 100 L 420 120" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="310" y="120" width="220" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="147" text-anchor="middle" font-size="12.5" fill="#333">c 为整数？c ≤ n？</text>

  <path d="M 420 165 L 420 185" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="310" y="185" width="220" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="212" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">命中一个平方和三元组 ✓</text>

  <!-- Divider -->
  <path d="M 40 250 L 520 250" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Bottom: two approaches -->
  <text x="280" y="272" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">降维关键：少枚举一个变量</text>

  <!-- O(n^3) box -->
  <rect x="60" y="284" width="220" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="307" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">O(n³) 枚举 a, b, c</text>
  <text x="170" y="326" text-anchor="middle" font-size="11" fill="#888">三重循环判等 → 冗余</text>

  <!-- O(n^2) box -->
  <rect x="300" y="284" width="220" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="307" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">O(n²) 枚举 a, b → 算 c</text>
  <text x="410" y="326" text-anchor="middle" font-size="11" fill="#4a7a3a">两重循环 + 开方判整 ✓</text>

  <!-- notes -->
  <text x="60" y="368" font-size="11" fill="#555">• a² + b² = c² 锁定 c，无需再枚举第三个变量</text>
  <text x="60" y="386" font-size="11" fill="#555">• n ≤ 250 → n² = 6.25×10⁴，O(n²) 轻松 AC</text>
  <text x="60" y="404" font-size="11" fill="#555">• a ≠ b 恒成立（2a² = c² 无整数解），(a,b,c) 与 (b,a,c) 成对出现</text>
</svg>
