<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：按 user_id 分组，COUNT(*) ≥ 2 即活跃用户</text>

  <!-- ===== Left: Users 表 ===== -->
  <text x="100" y="48" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Users 表（每行=一次购买）</text>

  <!-- header -->
  <rect x="20" y="54" width="44" height="22" fill="#446688" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="42" y="69" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">user_id</text>
  <rect x="64" y="54" width="116" height="22" fill="#446688" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="69" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">item</text>
  <rect x="180" y="54" width="80" height="22" fill="#446688" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="69" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">created_at</text>

  <!-- row1: 5 -->
  <rect x="20" y="76" width="44" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="42" y="90" text-anchor="middle" font-size="9" fill="#999">5</text>
  <rect x="64" y="76" width="116" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="122" y="90" text-anchor="middle" font-size="9" fill="#999">Smart Crock Pot</text>
  <rect x="180" y="76" width="80" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="220" y="90" text-anchor="middle" font-size="9" fill="#999">09-18</text>

  <!-- row2: 6 -->
  <rect x="20" y="96" width="44" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="42" y="110" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">6</text>
  <rect x="64" y="96" width="116" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="110" text-anchor="middle" font-size="9" fill="#4a7a3a">Smart Lock</text>
  <rect x="180" y="96" width="80" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="110" text-anchor="middle" font-size="9" fill="#4a7a3a">09-14</text>

  <!-- row3: 6 -->
  <rect x="20" y="116" width="44" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="42" y="130" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">6</text>
  <rect x="64" y="116" width="116" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="130" text-anchor="middle" font-size="9" fill="#4a7a3a">Smart Thermostat</text>
  <rect x="180" y="116" width="80" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="130" text-anchor="middle" font-size="9" fill="#4a7a3a">09-10</text>

  <!-- row4: 8 -->
  <rect x="20" y="136" width="44" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="42" y="150" text-anchor="middle" font-size="9" fill="#999">8</text>
  <rect x="64" y="136" width="116" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="122" y="150" text-anchor="middle" font-size="9" fill="#999">Smart Light Strip</text>
  <rect x="180" y="136" width="80" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="220" y="150" text-anchor="middle" font-size="9" fill="#999">09-29</text>

  <!-- row5: 4 -->
  <rect x="20" y="156" width="44" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="42" y="170" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">4</text>
  <rect x="64" y="156" width="116" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="170" text-anchor="middle" font-size="9" fill="#446688">Smart Cat Feeder</text>
  <rect x="180" y="156" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="170" text-anchor="middle" font-size="9" fill="#446688">09-02</text>

  <!-- row6: 4 -->
  <rect x="20" y="176" width="44" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="42" y="190" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">4</text>
  <rect x="64" y="176" width="116" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="190" text-anchor="middle" font-size="9" fill="#446688">Smart Bed</text>
  <rect x="180" y="176" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="190" text-anchor="middle" font-size="9" fill="#446688">09-13</text>

  <!-- Arrow: GROUP BY + HAVING -->
  <path d="M 275 146 L 355 146" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="280" y="108" width="78" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="319" y="125" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">GROUP BY</text>
  <text x="319" y="130" text-anchor="middle" font-size="9" fill="#d6a040">user_id</text>
  <rect x="280" y="158" width="78" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="319" y="176" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">HAVING</text>
  <text x="319" y="181" text-anchor="middle" font-size="9" fill="#d6a040">COUNT ≥ 2</text>

  <!-- ===== Right: 分组计数结果 ===== -->
  <text x="460" y="48" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">分组计数 + 过滤</text>

  <rect x="370" y="54" width="50" height="22" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="69" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">user_id</text>
  <rect x="420" y="54" width="46" height="22" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="443" y="69" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">COUNT</text>
  <rect x="466" y="54" width="80" height="22" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="506" y="69" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">是否活跃</text>

  <!-- user 4: count 2 -> active -->
  <rect x="370" y="76" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="93" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <rect x="420" y="76" width="46" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="443" y="93" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <rect x="466" y="76" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="506" y="93" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 活跃</text>

  <!-- user 5: count 1 -> not active -->
  <rect x="370" y="100" width="50" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="395" y="117" text-anchor="middle" font-size="11" fill="#999">5</text>
  <rect x="420" y="100" width="46" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="443" y="117" text-anchor="middle" font-size="11" fill="#999">1</text>
  <rect x="466" y="100" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="506" y="117" text-anchor="middle" font-size="10" fill="#b85450">✗ 不活跃</text>

  <!-- user 6: count 2 -> active -->
  <rect x="370" y="124" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="141" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>
  <rect x="420" y="124" width="46" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="443" y="141" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="466" y="124" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="506" y="141" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 活跃</text>

  <!-- user 8: count 1 -> not active -->
  <rect x="370" y="148" width="50" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="395" y="165" text-anchor="middle" font-size="11" fill="#999">8</text>
  <rect x="420" y="148" width="46" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="443" y="165" text-anchor="middle" font-size="11" fill="#999">1</text>
  <rect x="466" y="148" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="506" y="165" text-anchor="middle" font-size="10" fill="#b85450">✗ 不活跃</text>

  <!-- legend -->
  <rect x="370" y="188" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="390" y="199" font-size="9" fill="#4a7a3a">活跃（COUNT≥2）</text>
  <rect x="370" y="206" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="390" y="217" font-size="9" fill="#b85450">不活跃（COUNT&lt;2）</text>

  <!-- Bottom note -->
  <rect x="30" y="280" width="500" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">「活跃」= 至少购买 2 次 → 同一 user_id 出现在 ≥ 2 行</text>
  <text x="280" y="318" text-anchor="middle" font-size="10" fill="#666">GROUP BY user_id 把同用户多次购买归一组，COUNT(*) 数组内行数</text>
  <text x="280" y="336" text-anchor="middle" font-size="10" fill="#666">HAVING COUNT(*) ≥ 2 只留「购买 ≥ 2 次」的用户，ORDER BY 排序输出</text>
  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#666">蓝色=用户4，绿色=用户6，两行同色表示同一用户多次购买</text>
</svg>
