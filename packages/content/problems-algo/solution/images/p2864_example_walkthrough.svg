<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：数个数 → 三段拼接一步到位</text>

  <!-- panel 1 -->
  <rect x="28" y="42" width="504" height="158" fill="#ffffff" stroke="#ccc" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="52" y="68" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1：s = "010"（n = 3，k = 1）</text>

  <g filter="url(#rough2)">
    <rect x="52" y="82" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="122" y="103" text-anchor="middle" font-size="11" fill="#4a7a3a">(k−1)=0 个 '1'（空）</text>
    <text x="204" y="103" text-anchor="middle" font-size="13" fill="#888">＋</text>
    <rect x="216" y="82" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="286" y="103" text-anchor="middle" font-size="11" fill="#446688">(n−k)=2 个 '0'</text>
    <text x="368" y="103" text-anchor="middle" font-size="13" fill="#888">＋</text>
    <rect x="380" y="82" width="140" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="450" y="103" text-anchor="middle" font-size="11" fill="#b07818">末位 1 个 '1'</text>
  </g>

  <g filter="url(#rough2)">
    <text x="176" y="152" text-anchor="end" font-size="12" fill="#666">答案</text>
    <rect x="220" y="128" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="238" y="149" text-anchor="middle" font-size="13" fill="#446688">0</text>
    <rect x="262" y="128" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="280" y="149" text-anchor="middle" font-size="13" fill="#446688">0</text>
    <rect x="304" y="128" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="322" y="149" text-anchor="middle" font-size="13" fill="#b07818" font-weight="bold">1</text>
    <text x="366" y="150" text-anchor="start" font-size="12" fill="#4a7a3a" font-weight="bold">"001"</text>
  </g>
  <text x="52" y="186" text-anchor="start" font-size="11" fill="#888" filter="url(#rough2)">001₂ = 1（十进制），奇数 ✓ —— 唯一的 '1' 被末位征用，第 1 段为空（k=1 边界）</text>

  <!-- panel 2 -->
  <rect x="28" y="216" width="504" height="158" fill="#ffffff" stroke="#ccc" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="52" y="242" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">示例 2：s = "0101"（n = 4，k = 2）</text>

  <g filter="url(#rough2)">
    <rect x="52" y="256" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="122" y="277" text-anchor="middle" font-size="11" fill="#4a7a3a">(k−1)=1 个 '1'</text>
    <text x="204" y="277" text-anchor="middle" font-size="13" fill="#888">＋</text>
    <rect x="216" y="256" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="286" y="277" text-anchor="middle" font-size="11" fill="#446688">(n−k)=2 个 '0'</text>
    <text x="368" y="277" text-anchor="middle" font-size="13" fill="#888">＋</text>
    <rect x="380" y="256" width="140" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="450" y="277" text-anchor="middle" font-size="11" fill="#b07818">末位 1 个 '1'</text>
  </g>

  <g filter="url(#rough2)">
    <text x="176" y="326" text-anchor="end" font-size="12" fill="#666">答案</text>
    <rect x="198" y="302" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="216" y="323" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="240" y="302" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="258" y="323" text-anchor="middle" font-size="13" fill="#446688">0</text>
    <rect x="282" y="302" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="300" y="323" text-anchor="middle" font-size="13" fill="#446688">0</text>
    <rect x="324" y="302" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="342" y="323" text-anchor="middle" font-size="13" fill="#b07818" font-weight="bold">1</text>
    <text x="386" y="324" text-anchor="start" font-size="12" fill="#4a7a3a" font-weight="bold">"1001"</text>
  </g>
  <text x="52" y="360" text-anchor="start" font-size="11" fill="#888" filter="url(#rough2)">1001₂ = 9（十进制），奇数 ✓ —— 剩下的 1 个 '1' 冲到最高位（权重 2³ = 8）</text>
</svg>
