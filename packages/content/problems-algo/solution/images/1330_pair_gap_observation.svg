<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两对边界的间距决定增益</text>

  <path d="M 40 200 L 520 200" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Top: Non-overlapping ===== -->
  <text x="280" y="50" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">区间不重叠 → Δ = 2 × 间隙 > 0</text>

  <!-- Number line -->
  <path d="M 80 130 L 500 130" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 80 125 L 80 135" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 500 125 L 500 135" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="148" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="500" y="148" text-anchor="middle" font-size="9" fill="#aaa">16</text>

  <!-- Interval [a,b] = [3,5] (green) -->
  <rect x="155" y="116" width="50" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <circle cx="155" cy="130" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="205" cy="130" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="155" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">a=3</text>
  <text x="205" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">b=5</text>
  <text x="180" y="143" text-anchor="middle" font-size="9" fill="#4a7a3a">[a,b]</text>

  <!-- Interval [c,d] = [10,14] (blue) -->
  <rect x="330" y="116" width="100" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <circle cx="330" cy="130" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="430" cy="130" r="4" fill="#446688" filter="url(#rough2)"/>
  <text x="330" y="108" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">c=10</text>
  <text x="430" y="108" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">d=14</text>
  <text x="380" y="143" text-anchor="middle" font-size="9" fill="#446688">[c,d]</text>

  <!-- Gap arrow -->
  <path d="M 210 130 L 325 130" stroke="#d6a040" stroke-width="2.5" fill="none" marker-start="url(#arrL)" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="267" y="122" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">gap = 5</text>

  <!-- Result box -->
  <rect x="170" y="166" width="220" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="183" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Δ = 2 × (10 − 5) = 10</text>

  <!-- ===== Bottom: Overlapping ===== -->
  <text x="280" y="222" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">区间重叠 → Δ ≤ 0</text>

  <!-- Number line -->
  <path d="M 80 290 L 500 290" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 80 285 L 80 295" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 500 285 L 500 295" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="308" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="500" y="308" text-anchor="middle" font-size="9" fill="#aaa">16</text>

  <!-- Interval [a,b] = [3,10] (green) -->
  <rect x="155" y="278" width="175" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)" opacity="0.7"/>
  <circle cx="155" cy="290" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="330" cy="290" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="155" y="270" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">a=3</text>
  <text x="330" y="270" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">b=10</text>

  <!-- Interval [c,d] = [5,14] (blue) -->
  <rect x="205" y="284" width="225" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)" opacity="0.7"/>
  <circle cx="205" cy="290" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="430" cy="290" r="4" fill="#446688" filter="url(#rough2)"/>
  <text x="205" y="265" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">c=5</text>
  <text x="430" y="265" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">d=14</text>

  <!-- Overlap region -->
  <rect x="205" y="278" width="125" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="3,2" rx="2" filter="url(#rough2)" opacity="0.5"/>
  <text x="267" y="320" text-anchor="middle" font-size="9" fill="#b85450">重叠区</text>

  <!-- Result box -->
  <rect x="170" y="326" width="220" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="343" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">Δ = 2 × max(0, −) = 0</text>

  <!-- Formula box -->
  <rect x="30" y="362" width="500" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">Δ = 2 · max(0, min(a,b)−max(c,d), min(c,d)−max(a,b))</text>
</svg>
