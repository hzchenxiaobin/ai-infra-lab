<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：n=4，逐查询维护 ans（高亮=本次改色格）</text>

  <!-- column headers -->
  <g filter="url(#rough2)">
    <text x="40" y="62" font-size="11" font-weight="bold" fill="#888">查询</text>
    <text x="150" y="62" font-size="11" font-weight="bold" fill="#888">染后 colors</text>
    <text x="430" y="62" font-size="11" font-weight="bold" fill="#888">ans</text>
    <text x="490" y="62" font-size="11" font-weight="bold" fill="#888">Δ</text>
  </g>

  <!-- row 1: [0,2] -> [2,0,0,0] ans 0 -->
  <g filter="url(#rough2)">
    <text x="30" y="98" font-size="12" fill="#333">[0,2]</text>
    <rect x="150" y="82" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="171" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">2</text>
    <rect x="194" y="82" width="42" height="34" fill="#f3f3f3" stroke="#bbb" stroke-width="1.4" rx="4"/>
    <text x="215" y="105" text-anchor="middle" font-size="12" fill="#bbb">0</text>
    <rect x="238" y="82" width="42" height="34" fill="#f3f3f3" stroke="#bbb" stroke-width="1.4" rx="4"/>
    <text x="259" y="105" text-anchor="middle" font-size="12" fill="#bbb">0</text>
    <rect x="282" y="82" width="42" height="34" fill="#f3f3f3" stroke="#bbb" stroke-width="1.4" rx="4"/>
    <text x="303" y="105" text-anchor="middle" font-size="12" fill="#bbb">0</text>
    <text x="430" y="105" font-size="15" font-weight="bold" fill="#446688">0</text>
    <text x="490" y="105" font-size="12" fill="#7a5a10">old=0 不撤; 无匹配</text>
  </g>

  <!-- row 2: [1,2] -> [2,2,0,0] ans 1 -->
  <g filter="url(#rough2)">
    <text x="30" y="158" font-size="12" fill="#333">[1,2]</text>
    <rect x="150" y="142" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="171" y="165" text-anchor="middle" font-size="13" fill="#333">2</text>
    <rect x="194" y="142" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="215" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">2</text>
    <rect x="238" y="142" width="42" height="34" fill="#f3f3f3" stroke="#bbb" stroke-width="1.4" rx="4"/>
    <text x="259" y="165" text-anchor="middle" font-size="12" fill="#bbb">0</text>
    <rect x="282" y="142" width="42" height="34" fill="#f3f3f3" stroke="#bbb" stroke-width="1.4" rx="4"/>
    <text x="303" y="165" text-anchor="middle" font-size="12" fill="#bbb">0</text>
    <text x="430" y="165" font-size="15" font-weight="bold" fill="#4a7a3a">1</text>
    <text x="490" y="165" font-size="12" fill="#4a7a3a">左邻 2==2 → +1</text>
  </g>

  <!-- row 3: [3,1] -> [2,2,0,1] ans 1 -->
  <g filter="url(#rough2)">
    <text x="30" y="218" font-size="12" fill="#333">[3,1]</text>
    <rect x="150" y="202" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="171" y="225" text-anchor="middle" font-size="13" fill="#333">2</text>
    <rect x="194" y="202" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="215" y="225" text-anchor="middle" font-size="13" fill="#333">2</text>
    <rect x="238" y="202" width="42" height="34" fill="#f3f3f3" stroke="#bbb" stroke-width="1.4" rx="4"/>
    <text x="259" y="225" text-anchor="middle" font-size="12" fill="#bbb">0</text>
    <rect x="282" y="202" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="303" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">1</text>
    <text x="430" y="225" font-size="15" font-weight="bold" fill="#4a7a3a">1</text>
    <text x="490" y="225" font-size="12" fill="#7a5a10">old=0; 邻 0≠1 → +0</text>
  </g>

  <!-- row 4: [1,1] -> [2,1,0,1] ans 0 -->
  <g filter="url(#rough2)">
    <text x="30" y="278" font-size="12" fill="#333">[1,1]</text>
    <rect x="150" y="262" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="171" y="285" text-anchor="middle" font-size="13" fill="#333">2</text>
    <rect x="194" y="262" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="215" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">1</text>
    <rect x="238" y="262" width="42" height="34" fill="#f3f3f3" stroke="#bbb" stroke-width="1.4" rx="4"/>
    <text x="259" y="285" text-anchor="middle" font-size="12" fill="#bbb">0</text>
    <rect x="282" y="262" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="303" y="285" text-anchor="middle" font-size="13" fill="#333">1</text>
    <text x="430" y="285" font-size="15" font-weight="bold" fill="#b85450">0</text>
    <text x="490" y="278" font-size="11" fill="#b85450">旧 2==左邻2 → −1;</text>
    <text x="490" y="292" font-size="11" fill="#b85450">新 1 无匹配 → +0</text>
  </g>

  <!-- row 5: [2,1] -> [2,1,1,1] ans 2 -->
  <g filter="url(#rough2)">
    <text x="30" y="338" font-size="12" fill="#333">[2,1]</text>
    <rect x="150" y="322" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="171" y="345" text-anchor="middle" font-size="13" fill="#333">2</text>
    <rect x="194" y="322" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="215" y="345" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="238" y="322" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="259" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">1</text>
    <rect x="282" y="322" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="303" y="345" text-anchor="middle" font-size="13" fill="#333">1</text>
    <text x="430" y="345" font-size="15" font-weight="bold" fill="#4a7a3a">2</text>
    <text x="490" y="338" font-size="11" fill="#4a7a3a">old=0 不撤;</text>
    <text x="490" y="352" font-size="11" fill="#4a7a3a">左1==1、右1==1 → +2</text>
  </g>

  <!-- bottom note -->
  <g filter="url(#rough2)">
    <rect x="40" y="388" width="480" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="280" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07020">每行只动一格 → 仅左右两条邻接边重新计贡献，ans 全程 O(1) 增量维护</text>
    <text x="280" y="432" text-anchor="middle" font-size="11" fill="#7a5a10">第 4 行撤销旧色 2 的左邻贡献 −1；第 5 行新色 1 同时匹配左右两邻 → +2</text>
  </g>
</svg>
