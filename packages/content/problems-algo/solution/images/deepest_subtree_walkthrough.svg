<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：每节点返回 (depth, lca) 自底向上汇聚</text>

  <!-- 树结构，节点下方标注返回值 (d, node) -->
  <!-- 根 3 -->
  <circle cx="300" cy="70" r="20" fill="#fff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="75" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <!-- 5 和 1 -->
  <line x1="300" y1="90" x2="190" y2="140" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="300" y1="90" x2="410" y2="140" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="190" cy="155" r="20" fill="#fff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="160" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <circle cx="410" cy="155" r="20" fill="#fff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="160" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <!-- depth2: 6, 2, 0, 8 -->
  <line x1="190" y1="175" x2="120" y2="220" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="190" y1="175" x2="260" y2="220" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="410" y1="175" x2="340" y2="220" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="410" y1="175" x2="480" y2="220" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <circle cx="120" cy="235" r="20" fill="#fff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="240" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>

  <!-- 2: 答案，黄色高亮 -->
  <circle cx="260" cy="235" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>

  <circle cx="340" cy="235" r="20" fill="#fff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="240" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <circle cx="480" cy="235" r="20" fill="#fff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="480" y="240" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>

  <!-- depth3: 7, 4 (最深，蓝) -->
  <line x1="260" y1="257" x2="220" y2="295" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="260" y1="257" x2="300" y2="295" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="220" cy="310" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="220" y="315" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <circle cx="300" cy="310" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="300" y="315" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>

  <!-- 返回值标签 (depth, node) -->
  <!-- 叶子 -->
  <text x="120" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(1, 6)</text>
  <text x="340" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(1, 0)</text>
  <text x="480" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(1, 8)</text>
  <text x="220" y="345" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(1, 7)</text>
  <text x="300" y="345" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(1, 4)</text>

  <!-- 节点 2: 等深 → 返回自身 -->
  <rect x="225" y="360" width="70" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="375" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">(2, 2) ⭐</text>

  <!-- 节点 5: 右深 → 传右 -->
  <text x="190" y="195" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">(3, 2)</text>
  <!-- 节点 1: 等深 → 自身 -->
  <text x="410" y="195" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">(2, 1)</text>
  <!-- 根 3: 左深 → 传左 -->
  <rect x="265" y="100" width="70" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="115" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">(4, 2) ✓</text>

  <!-- 说明 -->
  <rect x="30" y="395" width="540" height="38" rx="8" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="412" font-size="11" fill="#333" filter="url(#rough2)">步骤：① 叶子 7,4 各返回 (1,自身)；② 节点 2 左右等深 → 返回 (2, 2)，2 成为候选 LCA；③ 节点 5 右侧更深 → 继续传 (3, 2)；</text>
  <text x="44" y="428" font-size="11" fill="#333" filter="url(#rough2)">④ 根 3 左侧(3,2) 深于 右侧(2,1) → 传 (4, 2)。最终答案 = node 2 ✅</text>
</svg>
