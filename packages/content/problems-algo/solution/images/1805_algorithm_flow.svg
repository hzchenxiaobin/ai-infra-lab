<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 490" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="490" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：遍历 → 判数字 → 提取块 → 去前导零 → 入集合</text>

  <!-- Start: init -->
  <rect x="160" y="46" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">初始化</text>
  <text x="260" y="80" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">i = 0, seen = ∅</text>

  <path d="M 260 92 L 260 110" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="372" y="116" font-size="9" fill="#aaa" filter="url(#rough2)">← 循环回跳</text>

  <!-- Decision: i < n ? -->
  <polygon points="260,114 340,154 260,194 180,154" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>
  <text x="260" y="166" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">是否未遍历完</text>

  <!-- No branch: return -->
  <path d="M 340 154 L 430 154" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="148" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="430" y="134" width="80" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="470" y="152" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回</text>
  <text x="470" y="168" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">|seen|</text>

  <!-- Yes branch: down -->
  <path d="M 260 194 L 260 212" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="208" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Decision: isdigit(s[i]) ? -->
  <polygon points="260,216 340,256 260,296 180,256" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">isdigit(s[i])?</text>
  <text x="260" y="268" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">当前字符是数字?</text>

  <!-- No branch: i++ -->
  <path d="M 340 256 L 400 256 L 400 388" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="250" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="360" y="372" width="80" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="400" y="394" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">i += 1</text>

  <!-- Yes branch: down to block extraction -->
  <path d="M 260 296 L 260 312" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="308" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Block extraction box -->
  <rect x="120" y="314" width="280" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">j = i; 扫描到非数字为止</text>
  <text x="260" y="348" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">block = s[i..j−1]</text>
  <text x="260" y="362" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">strip 前导零 → normalized</text>

  <!-- arrow to set add -->
  <path d="M 260 372 L 260 388" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- set.add + i=j -->
  <rect x="140" y="390" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="408" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">seen.add(normalized)</text>
  <text x="260" y="424" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">i = j（跳过整个数字块）</text>

  <!-- merge to i++ -->
  <path d="M 140 412 L 80 412 L 80 388" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 436 L 260 448 L 400 448 L 400 406" stroke="#888" stroke-width="1.6" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop back arrow: from i++ up to i<n? decision -->
  <path d="M 400 372 L 400 300 L 470 300 L 470 154 L 410 154" stroke="#666" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="230" font-size="9" fill="#aaa" filter="url(#rough2)">循环</text>

  <!-- loop back from set.add to i<n? -->
  <path d="M 80 388 L 80 154 L 180 154" stroke="#666" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="44" y="270" font-size="9" fill="#aaa" filter="url(#rough2)">循环</text>

  <!-- Footer -->
  <text x="260" y="476" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">单遍 O(n) / 集合去重 / 去前导零是归一化关键</text>
</svg>
