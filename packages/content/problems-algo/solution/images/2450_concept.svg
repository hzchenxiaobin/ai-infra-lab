<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold">核心观察：窗口 j 的最左覆盖位恰为 j，逐位贪心 → n−k+1 个自由位</text>
  <text x="280" y="40" text-anchor="middle" font-size="11" fill="#888">示意 n = 6, k = 3 → 窗口数 = n−k+1 = 4；自由位 p₀ p₁ p₂ p₃，确定位 p₄ p₅</text>

  <!-- position index labels above cells -->
  <text x="114" y="56" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">0</text>
  <text x="162" y="56" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">1</text>
  <text x="210" y="56" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">2</text>
  <text x="258" y="56" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">3</text>
  <text x="306" y="56" text-anchor="middle" font-size="10" fill="#aaa" font-weight="bold">4</text>
  <text x="354" y="56" text-anchor="middle" font-size="10" fill="#aaa" font-weight="bold">5</text>
  <text x="78" y="82" text-anchor="end" font-size="11.5" fill="#888" font-weight="bold">s</text>

  <!-- cells: free 0-3 green, determined 4-5 gray ; values 1 0 1 1 0 1 -->
  <rect x="90" y="60" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="114" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="138" y="60" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="162" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="186" y="60" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="210" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="234" y="60" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="258" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="282" y="60" width="48" height="34" fill="#f0f0f0" stroke="#aaa" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="306" y="82" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">0</text>
  <rect x="330" y="60" width="48" height="34" fill="#f0f0f0" stroke="#aaa" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="354" y="82" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">1</text>

  <!-- free / determined tags above cell groups -->
  <text x="186" y="110" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">↑ 自由位（可任意取 0/1）</text>
  <text x="318" y="110" text-anchor="middle" font-size="9.5" fill="#999" font-weight="bold">↑ 确定位</text>

  <!-- green connector lines: each window's left tip → its start cell -->
  <line x1="90" y1="122" x2="90" y2="94" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="138" y1="144" x2="138" y2="94" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="186" y1="166" x2="186" y2="94" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="234" y1="188" x2="234" y2="94" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- window bars: w0..w3, blue, each spanning its covered cells -->
  <rect x="90" y="124" width="144" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="84" y="136" text-anchor="end" font-size="10.5" fill="#446688" font-weight="bold">f₀</text>
  <rect x="138" y="146" width="144" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="132" y="158" text-anchor="end" font-size="10.5" fill="#446688" font-weight="bold">f₁</text>
  <rect x="186" y="168" width="144" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="180" text-anchor="end" font-size="10.5" fill="#446688" font-weight="bold">f₂</text>
  <rect x="234" y="190" width="144" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="228" y="202" text-anchor="end" font-size="10.5" fill="#446688" font-weight="bold">f₃</text>

  <!-- green up-triangles at each window's left tip (= start cell left edge) -->
  <path d="M 90 124 L 84 116 L 96 116 Z" fill="#4a7a3a" filter="url(#rough2)"/>
  <path d="M 138 146 L 132 138 L 144 138 Z" fill="#4a7a3a" filter="url(#rough2)"/>
  <path d="M 186 168 L 180 160 L 192 160 Z" fill="#4a7a3a" filter="url(#rough2)"/>
  <path d="M 234 190 L 228 182 L 240 182 Z" fill="#4a7a3a" filter="url(#rough2)"/>

  <!-- legend -->
  <rect x="400" y="124" width="150" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="412" y="142" font-size="10" fill="#d6a040" font-weight="bold">▲ = 窗口 j 的起点</text>
  <text x="412" y="158" font-size="10" fill="#555">= 最左覆盖位 = 位 j</text>

  <!-- p-row -->
  <text x="78" y="234" text-anchor="end" font-size="11.5" fill="#888" font-weight="bold">p</text>
  <rect x="92" y="222" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="114" y="237" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">p₀</text>
  <rect x="140" y="222" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="162" y="237" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">p₁</text>
  <rect x="188" y="222" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="210" y="237" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">p₂</text>
  <rect x="236" y="222" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="258" y="237" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">p₃</text>
  <rect x="284" y="222" width="44" height="22" fill="#f0f0f0" stroke="#aaa" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="306" y="237" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">p₄</text>
  <rect x="332" y="222" width="44" height="22" fill="#f0f0f0" stroke="#aaa" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="354" y="237" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">p₅</text>

  <!-- note boxes -->
  <rect x="40" y="262" width="480" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">窗口 j 覆盖 [j, j+k−1]，起点恰为位 j，不触及任何 &lt; j 的位</text>

  <rect x="40" y="300" width="480" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">逐位贪心：位 j 处，覆盖它的窗口里仅 f_j 未决 → 选 f_j 即自由设定 p_j</text>

  <rect x="40" y="338" width="480" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="357" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">n−k+1 个独立自由位 → 2^(n−k+1) 种翻转奇偶向量 p</text>
  <text x="280" y="373" text-anchor="middle" font-size="10.5" fill="#444">与 s 逐位异或是双射 ⟹ 不同串数 = 2^(n−k+1)，与 s 内容无关</text>
</svg>
