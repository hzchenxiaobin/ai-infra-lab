<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：同一对 s = "aabbcc"、t = "bbaacc"</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">k = 3 时块多重集吻合 → true；k = 2 时第一块就卡住 → false</text>

  <!-- 左面板：k=3 -->
  <rect x="18" y="56" width="234" height="290" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="135" y="78" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">k = 3，m = 2</text>

  <rect x="26" y="90" width="218" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="135" y="107" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">建表（s 的块）：{aa:1, bb:1, cc:1}</text>

  <rect x="26" y="126" width="218" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="135" y="143" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">扫 t 第①块 bb：cnt[bb] 1→0 ✓</text>

  <rect x="26" y="158" width="218" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="135" y="175" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">扫 t 第②块 aa：cnt[aa] 1→0 ✓</text>

  <rect x="26" y="190" width="218" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="135" y="207" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">扫 t 第③块 cc：cnt[cc] 1→0 ✓</text>

  <rect x="26" y="228" width="218" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="135" y="252" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">全程没扣空 → return true</text>

  <text x="135" y="290" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">t 的块顺序与 s 不同没关系，</text>
  <text x="135" y="306" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">每块都能在表里扣到货</text>

  <!-- 右面板：k=2 -->
  <rect x="268" y="56" width="234" height="290" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="385" y="78" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">k = 2，m = 3</text>

  <rect x="276" y="90" width="218" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="385" y="107" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">建表（s 的块）：{aab:1, bcc:1}</text>

  <rect x="276" y="126" width="218" height="26" fill="#ffffff" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="385" y="143" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">扫 t 第①块 bba：cnt[bba] = 0 ✗</text>

  <rect x="276" y="158" width="218" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="385" y="175" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（提前终止，第②块 acc 不用看）</text>

  <rect x="276" y="228" width="218" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="385" y="252" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">见零即假 → return false</text>

  <text x="385" y="290" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">s、t 用的字符明明是同一批，</text>
  <text x="385" y="306" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">但按 m = 3 切出来的块对不上</text>

  <!-- 底部要点 -->
  <rect x="18" y="354" width="484" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="377" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">两边块数同为 k：全程扣不空 ⟺ 块多重集相等 ⟺ true</text>
</svg>
