<svg xmlns="http://www.w3.org/2000/svg" width="520" height="560" viewBox="0 0 520 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="520" height="560" fill="#fdfcf7"/>
  <text x="260" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">BFS 判有效路径流程</text>
  <path d="M 130 36 Q 260 44 390 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Init -->
  <g filter="url(#sk)">
    <rect x="140" y="52" width="240" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="260" y="74" text-anchor="middle" font-size="11" fill="#2b4b6e" font-weight="bold">初始化</text>
  <text x="260" y="90" text-anchor="middle" font-size="10" fill="#555">vis[0][0]=true，队列放入 (0,0)</text>
  <path d="M 260 98 L 260 116" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- queue empty? -->
  <g filter="url(#sk)">
    <path d="M 260 120 L 340 156 L 260 192 L 180 156 Z" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="260" y="154" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">队列空?</text>
  <text x="260" y="170" text-anchor="middle" font-size="9" fill="#888">Yes → return false</text>
  <path d="M 340 156 L 408 156" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="408" y="140" width="92" height="34" rx="6" fill="#fce4ec" stroke="#b85450"/>
  </g>
  <text x="454" y="162" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">无路径 false</text>
  <text x="246" y="206" font-size="10" fill="#2e6e2e" font-weight="bold">No</text>
  <path d="M 260 192 L 260 212" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- pop (r,c) -->
  <g filter="url(#sk)">
    <rect x="140" y="214" width="240" height="40" rx="8" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="260" y="240" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">弹出 (r,c)</text>
  <path d="M 260 254 L 260 272" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond: reach target? -->
  <g filter="url(#sk)">
    <path d="M 260 276 L 340 312 L 260 348 L 180 312 Z" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="260" y="310" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">(r,c)==终点?</text>
  <path d="M 340 312 L 408 312" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="408" y="296" width="92" height="34" rx="6" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="454" y="318" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">return true</text>
  <text x="246" y="362" font-size="10" fill="#2e6e2e" font-weight="bold">No</text>
  <path d="M 260 348 L 260 368" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- for each dir -->
  <g filter="url(#sk)">
    <rect x="140" y="370" width="240" height="34" rx="8" fill="#f4f4f4" stroke="#888" stroke-width="1.3"/>
  </g>
  <text x="260" y="392" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">遍历 conn[grid[r][c]] 中每个方向 d</text>
  <path d="M 260 404 L 260 422" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond: 越界/已访问? -->
  <g filter="url(#sk)">
    <path d="M 260 426 L 340 460 L 260 494 L 180 460 Z" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="260" y="458" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">越界/已访问?</text>
  <text x="358" y="456" font-size="10" fill="#b03a3a" font-weight="bold">Yes → 跳过</text>
  <path d="M 260 494 L 260 512" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="246" y="508" font-size="10" fill="#2e6e2e" font-weight="bold">No</text>

  <!-- diamond: 邻居反向连通? -->
  <g filter="url(#sk)">
    <path d="M 260 516 L 348 542 L 260 568 L 172 542 Z" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="260" y="540" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">opp[d]∈conn[邻居]?</text>
  <text x="260" y="556" text-anchor="middle" font-size="9" fill="#888">(双向接通)</text>
  <text x="366" y="540" font-size="10" fill="#b03a3a" font-weight="bold">No → 跳过</text>

  <!-- push -->
  <path d="M 260 568 L 260 586" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="246" y="582" font-size="10" fill="#2e6e2e" font-weight="bold">Yes</text>
  <g filter="url(#sk)">
    <rect x="110" y="588" width="300" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="260" y="606" text-anchor="middle" font-size="10" fill="#2b4b6e" font-weight="bold">vis[nr][nc]=true，(nr,nc) 入队</text>

  <!-- loop back arrow -->
  <path d="M 110 601 L 54 601 L 54 156 L 178 156" stroke="#4a8e4a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="42" y="380" font-size="10" fill="#2e6e2e" font-weight="bold" transform="rotate(-90 42 380)">回到队首判断</text>
</svg>
