<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">树 + 1 条冗余边 = 出现唯一环</text>

  <!-- ===== Top: valid tree ===== -->
  <rect x="30" y="44" width="480" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">合法的树：n 个节点 + (n−1) 条边 → 连通且无环</text>

  <!-- nodes 1 2 3 4 in a path -->
  <line x1="116" y1="110" x2="204" y2="110" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="236" y1="110" x2="324" y2="110" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="356" y1="110" x2="444" y2="110" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <circle cx="100" cy="110" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <circle cx="220" cy="110" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <circle cx="340" cy="110" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <circle cx="460" cy="110" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <text x="160" y="98" text-anchor="middle" font-size="10" fill="#888">(1,2)</text>
  <text x="280" y="98" text-anchor="middle" font-size="10" fill="#888">(2,3)</text>
  <text x="400" y="98" text-anchor="middle" font-size="10" fill="#888">(3,4)</text>
  <text x="270" y="148" text-anchor="middle" font-size="10.5" fill="#4a7a3a">4 节点 3 边，任意两点恰有一条路径</text>

  <!-- arrow down: add one edge -->
  <line x1="270" y1="168" x2="270" y2="196" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="186" font-size="11" fill="#b85450" font-weight="bold">+1 条边</text>

  <!-- ===== Bottom: tree + redundant edge ===== -->
  <rect x="30" y="200" width="480" height="140" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="270" y="220" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">多加 1 条边 → 出现唯一环，删掉环上「输入中最后出现」的那条</text>

  <!-- tree edges (green) -->
  <line x1="116" y1="270" x2="204" y2="270" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="236" y1="270" x2="324" y2="270" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="356" y1="270" x2="444" y2="270" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <!-- redundant edge (1,4) as red curved arc below -->
  <path d="M 100 288 Q 280 340 460 288" stroke="#b85450" stroke-width="2.5" fill="none" stroke-dasharray="6,3" filter="url(#rough2)"/>

  <circle cx="100" cy="270" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <circle cx="220" cy="270" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <circle cx="340" cy="270" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <circle cx="460" cy="270" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">冗余边 (1,4)：1 与 4 已有路径 1→2→3→4</text>

  <!-- summary box -->
  <rect x="40" y="350" width="460" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="367" text-anchor="middle" font-size="10.5" fill="#444">关键：加边时两端「已同根」→ 这条边就是冗余边</text>
</svg>
