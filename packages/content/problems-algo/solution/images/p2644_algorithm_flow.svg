<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="320" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：去重升序 → 逐个计数 → 严格大于才更新 → 返回</text>

  <!-- ① sort + dedup -->
  <rect x="140" y="40" width="260" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 去重 + 升序排序 divisors</text>
  <path d="M 270 70 L 270 84" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② init best = -1 -->
  <rect x="140" y="84" width="260" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② best = -1（哨兵，首次必更新）</text>
  <path d="M 270 114 L 270 128" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ loop header: for each d ascending -->
  <rect x="130" y="128" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="230" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">③ 遍历每个除数 d（升序）</text>

  <!-- exit right to ⑦ (traversal done) -->
  <path d="M 330 145 L 380 145" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="355" y="138" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">遍历完</text>
  <rect x="380" y="128" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="450" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">⑦ 返回 bestVal</text>

  <!-- ③ down into body -->
  <path d="M 230 162 L 230 178" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ count score -->
  <rect x="100" y="178" width="280" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="240" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">④ score = #{x ∈ nums : x % d == 0}</text>
  <path d="M 240 208 L 240 222" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑤ diamond: score > best ? -->
  <polygon points="240,222 300,250 240,278 180,250" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="254" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">score &gt; best ?</text>

  <!-- 是: right to ⑥ update -->
  <path d="M 300 250 L 340 250" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="244" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="340" y="234" width="150" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="415" y="254" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⑥ 更新 best=score, bestVal=d</text>

  <!-- 否: left to return line -->
  <path d="M 180 250 L 95 250" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="244" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- ⑥ down then left joining return vertical -->
  <path d="M 415 266 L 415 295 L 95 295" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- return vertical line up to ③ (shared by both paths) -->
  <path d="M 95 295 L 95 145 L 126 145" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="62" y="222" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 62 222)" filter="url(#rough2)">继续下一个 d（等分不更新→留更小值）</text>
</svg>
