<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 演算：A=[4,1,8,4,5] B=[5,6,1,8,4,5]，相交于 8</text>
  <text x="310" y="44" text-anchor="middle" font-size="10" fill="#888">蓝=A 独有 · 绿=B 独有 · 红=共享后缀（相交点 8）</text>

  <!-- 列号 -->
  <g font-size="10" fill="#888">
    <text x="100" y="64" text-anchor="middle">步0</text>
    <text x="144" y="64" text-anchor="middle">1</text>
    <text x="188" y="64" text-anchor="middle">2</text>
    <text x="232" y="64" text-anchor="middle">3</text>
    <text x="276" y="64" text-anchor="middle">4</text>
    <text x="320" y="64" text-anchor="middle">5</text>
    <text x="364" y="64" text-anchor="middle">6</text>
    <text x="408" y="64" text-anchor="middle">7</text>
    <text x="452" y="64" text-anchor="middle">8</text>
    <text x="496" y="64" text-anchor="middle">9</text>
  </g>

  <!-- pA 标签 -->
  <text x="58" y="104" font-size="12" fill="#446688" font-weight="bold">pA</text>
  <!-- pB 标签 -->
  <text x="58" y="188" font-size="12" fill="#4a7a3a" font-weight="bold">pB</text>

  <!-- ===== pA 行：4 1 8 4 5 ∅ 5 6 1 8 ===== -->
  <!-- 0:4 blue -->
  <g filter="url(#rough2)"><rect x="80" y="88" width="40" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="100" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <!-- 1:1 blue -->
  <g filter="url(#rough2)"><rect x="124" y="88" width="40" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="144" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <!-- 2:8 red (首次经过) -->
  <g filter="url(#rough2)"><rect x="168" y="88" width="40" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="188" y="108" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">8</text>
  <!-- 3:4 red -->
  <g filter="url(#rough2)"><rect x="212" y="88" width="40" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="232" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <!-- 4:5 red -->
  <g filter="url(#rough2)"><rect x="256" y="88" width="40" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="276" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <!-- 5:∅ -->
  <g filter="url(#rough2)"><rect x="300" y="88" width="40" height="30" rx="5" fill="#fff" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2"/></g>
  <text x="320" y="108" text-anchor="middle" font-size="12" fill="#888">∅</text>
  <!-- 6:5 green (换头到B) -->
  <g filter="url(#rough2)"><rect x="344" y="88" width="40" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="364" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <!-- 7:6 green -->
  <g filter="url(#rough2)"><rect x="388" y="88" width="40" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="408" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <!-- 8:1 green -->
  <g filter="url(#rough2)"><rect x="432" y="88" width="40" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="452" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <!-- 9:8 red MEET -->
  <g filter="url(#rough2)"><rect x="476" y="88" width="40" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.6"/></g>
  <text x="496" y="108" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">8</text>

  <!-- ===== pB 行：5 6 1 8 4 5 ∅ 4 1 8 ===== -->
  <!-- 0:5 green -->
  <g filter="url(#rough2)"><rect x="80" y="172" width="40" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="100" y="192" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <!-- 1:6 green -->
  <g filter="url(#rough2)"><rect x="124" y="172" width="40" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="144" y="192" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <!-- 2:1 green -->
  <g filter="url(#rough2)"><rect x="168" y="172" width="40" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="188" y="192" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <!-- 3:8 red -->
  <g filter="url(#rough2)"><rect x="212" y="172" width="40" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="232" y="192" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">8</text>
  <!-- 4:4 red -->
  <g filter="url(#rough2)"><rect x="256" y="172" width="40" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="276" y="192" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <!-- 5:5 red -->
  <g filter="url(#rough2)"><rect x="300" y="172" width="40" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="320" y="192" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <!-- 6:∅ -->
  <g filter="url(#rough2)"><rect x="344" y="172" width="40" height="30" rx="5" fill="#fff" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2"/></g>
  <text x="364" y="192" text-anchor="middle" font-size="12" fill="#888">∅</text>
  <!-- 7:4 blue (换头到A) -->
  <g filter="url(#rough2)"><rect x="388" y="172" width="40" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="408" y="192" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <!-- 8:1 blue -->
  <g filter="url(#rough2)"><rect x="432" y="172" width="40" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="452" y="192" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <!-- 9:8 red MEET -->
  <g filter="url(#rough2)"><rect x="476" y="172" width="40" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.6"/></g>
  <text x="496" y="192" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">8</text>

  <!-- 换头标注 -->
  <text x="364" y="138" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">pA 换头→B</text>
  <text x="408" y="222" text-anchor="middle" font-size="9" fill="#9c6ade" font-weight="bold">pB 换头→A</text>

  <!-- 步2 注释：pA 首次到8 未相遇 -->
  <text x="188" y="138" text-anchor="middle" font-size="9" fill="#888">首次经8，pB≠8</text>

  <!-- 步8 重点：值同引用不同 -->
  <g filter="url(#rough2)">
    <rect x="424" y="226" width="56" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="452" y="241" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">步8</text>
  <text x="452" y="254" text-anchor="middle" font-size="9" fill="#555">值都=1</text>
  <line x1="452" y1="226" x2="452" y2="204" stroke="#d6a040" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- 步9 相遇 -->
  <g filter="url(#rough2)">
    <rect x="468" y="226" width="56" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="496" y="241" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">步9</text>
  <text x="496" y="254" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">同8 相遇</text>
  <line x1="496" y1="226" x2="496" y2="204" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3,2"/>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="40" y="285" width="540" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="310" y="306" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">走过 a+b+c = 8 个节点后（步8），下一步两指针同时指向相交点 8 → 步9 相遇</text>
  <text x="310" y="324" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">注意步8：两边都显示「1」但分属不同链表 → 引用不等，不算相交！</text>
  <text x="310" y="340" text-anchor="middle" font-size="10" fill="#555">比较的是节点引用，不是 val</text>
</svg>
