<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">二维列表 → DataFrame：一次构造</text>

  <!-- Left: 2D list -->
  <rect x="35" y="62" width="150" height="200" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="84" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">student_data</text>
  <text x="110" y="100" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">(list of lists · 行式)</text>

  <rect x="55" y="112" width="50" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="107" y="112" width="50" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="132" y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">15</text>

  <rect x="55" y="144" width="50" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="107" y="144" width="50" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="132" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11</text>

  <rect x="55" y="176" width="50" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="107" y="176" width="50" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="194" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="132" y="194" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11</text>

  <rect x="55" y="208" width="50" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="107" y="208" width="50" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="226" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="132" y="226" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">20</text>

  <text x="110" y="252" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">每个内层 list = 一行</text>

  <!-- Middle arrow + constructor -->
  <path d="M 190 150 L 268 150" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="185" y="168" width="90" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="230" y="190" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">pd.DataFrame</text>
  <text x="230" y="208" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">(data,</text>
  <text x="230" y="226" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">columns=[...])</text>

  <text x="230" y="130" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">行按输入顺序装载</text>
  <text x="230" y="264" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">列名按位置贴</text>

  <!-- Right: DataFrame table -->
  <rect x="300" y="62" width="225" height="200" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="412" y="84" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">DataFrame</text>

  <rect x="330" y="96" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="345" y="113" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)"></text>
  <rect x="362" y="96" width="75" height="24" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="399" y="113" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">student_id</text>
  <rect x="439" y="96" width="50" height="24" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="464" y="113" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">age</text>

  <rect x="330" y="122" width="30" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="345" y="139" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="362" y="122" width="75" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="399" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="439" y="122" width="50" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="464" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">15</text>

  <rect x="330" y="148" width="30" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="345" y="165" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <rect x="362" y="148" width="75" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="399" y="165" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="439" y="148" width="50" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="464" y="165" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">11</text>

  <rect x="330" y="174" width="30" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="345" y="191" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <rect x="362" y="174" width="75" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="399" y="191" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="439" y="174" width="50" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="464" y="191" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">11</text>

  <rect x="330" y="200" width="30" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="345" y="217" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>
  <rect x="362" y="200" width="75" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="399" y="217" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="439" y="200" width="50" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="464" y="217" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">20</text>

  <text x="412" y="248" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">行索引默认 RangeIndex 从 0 起</text>

  <!-- Bottom warning -->
  <rect x="55" y="290" width="450" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⚠️ 漏传 columns 的坑</text>
  <text x="280" y="336" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">不传 columns → 列名变成默认整数 0、1</text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">表建得出来、数据也对，但按列名取数直接失败</text>
</svg>
