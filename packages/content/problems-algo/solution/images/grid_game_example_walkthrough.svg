<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：grid = [[2,5,4],[1,5,1]]</text>
  <text x="290" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">row0=[2,5,4]  row1=[1,5,1]   初始 suffix=11, prefix=0</text>

  <!-- Grid mini view -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="60" y="78" font-size="10" fill="#888" font-weight="bold">grid</text>
    <rect x="90" y="62" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="108" y="81" fill="#446688" font-weight="bold">2</text>
    <rect x="128" y="62" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="146" y="81" fill="#446688" font-weight="bold">5</text>
    <rect x="166" y="62" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="184" y="81" fill="#446688" font-weight="bold">4</text>
    <rect x="90" y="92" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="108" y="111" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="128" y="92" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="146" y="111" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="166" y="92" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="184" y="111" fill="#4a7a3a" font-weight="bold">1</text>
  </g>

  <!-- Table header -->
  <g filter="url(#rough2)" font-size="11" text-anchor="middle" font-weight="bold">
    <rect x="240" y="60" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="268" y="80" fill="#d6a040">c</text>
    <rect x="298" y="60" width="92" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="344" y="80" fill="#4a7a3a">prefix(左下)</text>
    <rect x="392" y="60" width="92" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="438" y="80" fill="#446688">suffix(右上)</text>
    <rect x="486" y="60" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="514" y="80" fill="#b85450">max</text>
  </g>

  <!-- Row c=0 -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="240" y="94" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="268" y="114" fill="#d6a040" font-weight="bold">0</text>
    <rect x="298" y="94" width="92" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="344" y="114" fill="#4a7a3a">0</text>
    <rect x="392" y="94" width="92" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="438" y="114" fill="#446688" font-weight="bold">9</text>
    <rect x="486" y="94" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="514" y="114" fill="#b85450" font-weight="bold">9</text>
  </g>
  <text x="552" y="114" font-size="10" fill="#888" filter="url(#rough2)">ans=9</text>

  <!-- Row c=1 (best) -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="240" y="128" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="268" y="148" fill="#d6a040" font-weight="bold">1</text>
    <rect x="298" y="128" width="92" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="344" y="148" fill="#4a7a3a">1</text>
    <rect x="392" y="128" width="92" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="438" y="148" fill="#446688">4</text>
    <rect x="486" y="128" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="514" y="148" fill="#b85450" font-weight="bold">4</text>
  </g>
  <text x="552" y="148" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans=4 ★</text>

  <!-- Row c=2 -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="240" y="162" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="268" y="182" fill="#d6a040" font-weight="bold">2</text>
    <rect x="298" y="162" width="92" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="344" y="182" fill="#4a7a3a" font-weight="bold">6</text>
    <rect x="392" y="162" width="92" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="438" y="182" fill="#446688">0</text>
    <rect x="486" y="162" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="514" y="182" fill="#b85450" font-weight="bold">6</text>
  </g>
  <text x="552" y="182" font-size="10" fill="#888" filter="url(#rough2)">ans=4</text>

  <!-- Divider -->
  <line x1="40" y1="210" x2="540" y2="210" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Step-by-step explanation -->
  <text x="290" y="232" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">逐步跟踪 suffix / prefix 的变化</text>

  <!-- c=0 step -->
  <g filter="url(#rough2)" font-size="11" fill="#333">
    <text x="50" y="262" font-weight="bold" fill="#d6a040">c=0：</text>
    <text x="100" y="262">suffix -= row0[0]=2 → suffix = 11-2 = 9</text>
    <text x="50" y="280" fill="#888">max(prefix=0, suffix=9) = 9 → ans = min(∞, 9) = 9</text>
    <text x="50" y="298" fill="#4a7a3a">prefix += row1[0]=1 → prefix = 1</text>
  </g>

  <!-- c=1 step (best) -->
  <g filter="url(#rough2)" font-size="11" fill="#333">
    <rect x="40" y="312" width="500" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="50" y="332" font-weight="bold" fill="#d6a040">c=1：</text>
    <text x="100" y="332">suffix -= row0[1]=5 → suffix = 9-5 = 4</text>
    <text x="50" y="350" fill="#b85450" font-weight="bold">max(prefix=1, suffix=4) = 4 → ans = min(9, 4) = 4 ★ 最优</text>
    <text x="50" y="368" fill="#888" font-size="10">prefix += row1[1]=5 → prefix = 6（供下一轮）</text>
  </g>

  <!-- c=2 step -->
  <g filter="url(#rough2)" font-size="11" fill="#333">
    <text x="50" y="396" font-weight="bold" fill="#d6a040">c=2：</text>
    <text x="100" y="396">suffix -= row0[2]=4 → suffix = 4-4 = 0</text>
    <text x="50" y="414" fill="#888">max(prefix=6, suffix=0) = 6 → ans = min(4, 6) = 4（不变）</text>
  </g>

  <!-- Result -->
  <rect x="180" y="416" width="220" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="432" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans = 4 ✅</text>
</svg>
