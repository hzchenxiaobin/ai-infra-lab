<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">示例演算：9 条订单 → WEEKDAY 映射 → 按品类聚合为 4×7 矩阵</text>

  <!-- ===== Left: Orders after JOIN (9 rows) ===== -->
  <text x="170" y="48" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">JOIN 后的订单行（含品类 + 日期 + 数量）</text>

  <!-- header -->
  <rect x="30" y="56" width="280" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="70" text-anchor="middle" font-size="9" fill="#333">cat</text>
  <text x="110" y="70" text-anchor="middle" font-size="9" fill="#333">date</text>
  <text x="170" y="70" text-anchor="middle" font-size="9" fill="#333">qty</text>
  <text x="220" y="70" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">WEEKDAY</text>
  <text x="275" y="70" text-anchor="middle" font-size="9" fill="#333">day</text>

  <!-- Book rows (3) - blue tint -->
  <rect x="30" y="76" width="280" height="18" rx="2" fill="#f0f6ff" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="50" y="89" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">Book</text>
  <text x="110" y="89" text-anchor="middle" font-size="9" fill="#333">06-01</text>
  <text x="170" y="89" text-anchor="middle" font-size="9" fill="#333">10</text>
  <text x="220" y="89" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">0</text>
  <text x="275" y="89" text-anchor="middle" font-size="9" fill="#333">Mon</text>

  <rect x="30" y="94" width="280" height="18" rx="2" fill="#f0f6ff" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="50" y="107" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">Book</text>
  <text x="110" y="107" text-anchor="middle" font-size="9" fill="#333">06-08</text>
  <text x="170" y="107" text-anchor="middle" font-size="9" fill="#333">10</text>
  <text x="220" y="107" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">0</text>
  <text x="275" y="107" text-anchor="middle" font-size="9" fill="#333">Mon</text>

  <rect x="30" y="112" width="280" height="18" rx="2" fill="#f0f6ff" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="50" y="125" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">Book</text>
  <text x="110" y="125" text-anchor="middle" font-size="9" fill="#333">06-02</text>
  <text x="170" y="125" text-anchor="middle" font-size="9" fill="#333">5</text>
  <text x="220" y="125" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">1</text>
  <text x="275" y="125" text-anchor="middle" font-size="9" fill="#333">Tue</text>

  <!-- Book Friday row -->
  <rect x="30" y="130" width="280" height="18" rx="2" fill="#f0f6ff" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="50" y="143" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">Book</text>
  <text x="110" y="143" text-anchor="middle" font-size="9" fill="#333">06-05</text>
  <text x="170" y="143" text-anchor="middle" font-size="9" fill="#333">10</text>
  <text x="220" y="143" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">4</text>
  <text x="275" y="143" text-anchor="middle" font-size="9" fill="#333">Fri</text>

  <!-- Phone rows (3) - green tint -->
  <rect x="30" y="148" width="280" height="18" rx="2" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="50" y="161" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">Phone</text>
  <text x="110" y="161" text-anchor="middle" font-size="9" fill="#333">06-03</text>
  <text x="170" y="161" text-anchor="middle" font-size="9" fill="#333">5</text>
  <text x="220" y="161" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">2</text>
  <text x="275" y="161" text-anchor="middle" font-size="9" fill="#333">Wed</text>

  <rect x="30" y="166" width="280" height="18" rx="2" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="50" y="179" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">Phone</text>
  <text x="110" y="179" text-anchor="middle" font-size="9" fill="#333">06-04</text>
  <text x="170" y="179" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="220" y="179" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">3</text>
  <text x="275" y="179" text-anchor="middle" font-size="9" fill="#333">Thu</text>

  <rect x="30" y="184" width="280" height="18" rx="2" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="50" y="197" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">Phone</text>
  <text x="110" y="197" text-anchor="middle" font-size="9" fill="#333">06-14</text>
  <text x="170" y="197" text-anchor="middle" font-size="9" fill="#333">5</text>
  <text x="220" y="197" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">6</text>
  <text x="275" y="197" text-anchor="middle" font-size="9" fill="#333">Sun</text>

  <rect x="30" y="202" width="280" height="18" rx="2" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="50" y="215" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">Phone</text>
  <text x="110" y="215" text-anchor="middle" font-size="9" fill="#333">06-21</text>
  <text x="170" y="215" text-anchor="middle" font-size="9" fill="#333">5</text>
  <text x="220" y="215" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">6</text>
  <text x="275" y="215" text-anchor="middle" font-size="9" fill="#333">Sun</text>

  <!-- Glasses row (1) - orange tint -->
  <rect x="30" y="220" width="280" height="18" rx="2" fill="#fff5e0" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="50" y="233" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">Glasses</text>
  <text x="110" y="233" text-anchor="middle" font-size="9" fill="#333">06-05</text>
  <text x="170" y="233" text-anchor="middle" font-size="9" fill="#333">5</text>
  <text x="220" y="233" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">4</text>
  <text x="275" y="233" text-anchor="middle" font-size="9" fill="#333">Fri</text>

  <!-- T-shirt (no orders) -->
  <rect x="30" y="238" width="280" height="18" rx="2" fill="#f5f5f5" stroke="#aaa" stroke-width="0.8" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <text x="50" y="251" text-anchor="middle" font-size="9" fill="#aaa" font-weight="bold">T-shirt</text>
  <text x="170" y="251" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">(无订单，LEFT JOIN 补 NULL)</text>

  <!-- Grouping arrows: Book -->
  <path d="M 310 103 Q 340 103 350 290" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <!-- Phone -->
  <path d="M 310 185 Q 340 220 350 312" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <!-- Glasses -->
  <path d="M 310 229 Q 340 260 350 334" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== Right: Result matrix ===== -->
  <text x="490" y="272" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">聚合结果（GROUP BY item_category）</text>

  <!-- header row -->
  <rect x="360" y="280" width="260" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="294" text-anchor="middle" font-size="9" fill="#333">CATEGORY</text>
  <text x="438" y="294" text-anchor="middle" font-size="8.5" fill="#333">Mon</text>
  <text x="468" y="294" text-anchor="middle" font-size="8.5" fill="#333">Tue</text>
  <text x="498" y="294" text-anchor="middle" font-size="8.5" fill="#333">Wed</text>
  <text x="528" y="294" text-anchor="middle" font-size="8.5" fill="#333">Thu</text>
  <text x="558" y="294" text-anchor="middle" font-size="8.5" fill="#333">Fri</text>
  <text x="588" y="294" text-anchor="middle" font-size="8.5" fill="#333">Sat</text>
  <text x="612" y="294" text-anchor="middle" font-size="8.5" fill="#333">Sun</text>

  <!-- Book row -->
  <rect x="360" y="300" width="260" height="22" rx="3" fill="#f0f6ff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="395" y="314" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">Book</text>
  <text x="438" y="314" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">20</text>
  <text x="468" y="314" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">5</text>
  <text x="498" y="314" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="528" y="314" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="558" y="314" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">10</text>
  <text x="588" y="314" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="612" y="314" text-anchor="middle" font-size="9" fill="#bbb">0</text>

  <!-- Glasses row -->
  <rect x="360" y="322" width="260" height="22" rx="3" fill="#fff5e0" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="395" y="336" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">Glasses</text>
  <text x="438" y="336" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="468" y="336" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="498" y="336" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="528" y="336" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="558" y="336" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">5</text>
  <text x="588" y="336" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="612" y="336" text-anchor="middle" font-size="9" fill="#bbb">0</text>

  <!-- Phone row -->
  <rect x="360" y="344" width="260" height="22" rx="3" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="395" y="358" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">Phone</text>
  <text x="438" y="358" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="468" y="358" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="498" y="358" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">5</text>
  <text x="528" y="358" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">1</text>
  <text x="558" y="358" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="588" y="358" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="612" y="358" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">10</text>

  <!-- T-shirt row -->
  <rect x="360" y="366" width="260" height="22" rx="3" fill="#f5f5f5" stroke="#aaa" stroke-width="1" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <text x="395" y="380" text-anchor="middle" font-size="9.5" fill="#aaa" font-weight="bold">T-shirt</text>
  <text x="438" y="380" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="468" y="380" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="498" y="380" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="528" y="380" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="558" y="380" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="588" y="380" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="612" y="380" text-anchor="middle" font-size="9" fill="#bbb">0</text>

  <!-- ===== Bottom: aggregation notes ===== -->
  <rect x="30" y="404" width="590" height="60" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="424" font-size="10" fill="#555" font-weight="bold">Book 聚合：Mon=10+10=20  Tue=5  Fri=10（4 行合并 → 其余天 ELSE 0）</text>
  <text x="50" y="440" font-size="10" fill="#555" font-weight="bold">Phone 聚合：Wed=5  Thu=1  Sun=5+5=10（4 行合并）</text>
  <text x="50" y="456" font-size="10" fill="#555" font-weight="bold">T-shirt：LEFT JOIN 保留无订单品类 → 全 0 行（SUM(NULL) 由 ELSE 0 兜底）</text>
</svg>
