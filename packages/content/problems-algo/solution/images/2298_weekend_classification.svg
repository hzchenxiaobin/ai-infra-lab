<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">用 DAYOFWEEK(submit_date) 把提交日分成两类</text>

  <!-- 7 day boxes: Mon..Sun -->
  <rect x="60" y="56" width="56" height="56" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="80" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">周一</text>
  <text x="88" y="98" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">DOW=2</text>

  <rect x="124" y="56" width="56" height="56" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152" y="80" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">周二</text>
  <text x="152" y="98" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">DOW=3</text>

  <rect x="188" y="56" width="56" height="56" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="216" y="80" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">周三</text>
  <text x="216" y="98" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">DOW=4</text>

  <rect x="252" y="56" width="56" height="56" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">周四</text>
  <text x="280" y="98" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">DOW=5</text>

  <rect x="316" y="56" width="56" height="56" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="344" y="80" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">周五</text>
  <text x="344" y="98" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">DOW=6</text>

  <rect x="380" y="56" width="56" height="56" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="408" y="80" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">周六</text>
  <text x="408" y="98" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">DOW=7</text>

  <rect x="444" y="56" width="56" height="56" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="472" y="80" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">周日</text>
  <text x="472" y="98" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">DOW=1</text>

  <!-- brackets -->
  <path d="M 60 122 L 60 132 L 372 132 L 372 122" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 380 122 L 380 132 L 500 132 L 500 122" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- arrows down -->
  <path d="M 216 132 L 216 180" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 440 132 L 440 180" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 工作日 bucket -->
  <rect x="106" y="182" width="220" height="74" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="216" y="208" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">工作日 Mon–Fri</text>
  <text x="216" y="226" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">DAYOFWEEK BETWEEN 2 AND 6</text>
  <text x="216" y="244" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ working_days_tasks</text>

  <!-- 周末 bucket -->
  <rect x="350" y="182" width="180" height="74" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="440" y="208" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">周末 Sat, Sun</text>
  <text x="440" y="226" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">DAYOFWEEK IN (1, 7)</text>
  <text x="440" y="244" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ weekend_tasks</text>

  <!-- bottom note -->
  <rect x="60" y="284" width="440" height="56" rx="6" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">MySQL DAYOFWEEK：1=周日, 2=周一, …, 7=周六</text>
  <text x="280" y="324" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">周末 = 1 或 7；工作日 = 2~6。一次聚合即可同时出两列计数。</text>
</svg>
