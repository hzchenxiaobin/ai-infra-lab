<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：最小因式分解（贪心）</text>

  <!-- Step 1: Input -->
  <rect x="220" y="40" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输入正整数 a</text>
  <path d="M 280 70 L 280 84" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: a < 10? -->
  <polygon points="280,86 360,118 280,150 200,118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="116" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">a &lt; 10 ?</text>

  <!-- Yes: return a -->
  <path d="M 200 118 L 120 118" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="160" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="44" y="104" width="76" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="82" y="122" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">return a</text>

  <!-- No: down -->
  <path d="M 280 150 L 280 164" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="160" font-size="10" fill="#888">否</text>

  <!-- Step 3: Init -->
  <rect x="200" y="166" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="186" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">res = 0,  i = 9</text>
  <path d="M 280 196 L 280 210" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: i >= 2? -->
  <polygon points="280,212 355,240 280,268 205,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">i ≥ 2 ?</text>

  <!-- No: go right to a==1 check -->
  <path d="M 355 240 L 430 240" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="232" text-anchor="middle" font-size="10" fill="#888">否</text>

  <!-- Yes: down -->
  <path d="M 280 268 L 280 282" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="278" font-size="10" fill="#888">是</text>

  <!-- Step 5: a % i == 0? -->
  <polygon points="280,284 365,312 280,340 195,312" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">a % i == 0 ?</text>

  <!-- Yes: record + divide, loop back -->
  <path d="M 280 340 L 280 354" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="330" y="350" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="170" y="356" width="220" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">res = res×10 + i,  a = a ÷ i</text>
  <!-- loop back up to a%i==0 -->
  <path d="M 170 370 Q 140 370 140 312" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="128" y="345" font-size="9.5" fill="#4a7a3a" font-weight="bold">重新</text>
  <text x="128" y="356" font-size="9.5" fill="#4a7a3a" font-weight="bold">判定</text>

  <!-- No: i--, loop back to i>=2 -->
  <path d="M 365 312 L 430 312 L 430 240 L 355 240" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="400" y="304" font-size="10" fill="#b85450" font-weight="bold">否, i--</text>

  <!-- Step 6: a == 1? -->
  <rect x="430" y="252" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="480" y="272" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a == 1 ?</text>
  <path d="M 480 240 L 480 252" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No: return 0 -->
  <path d="M 530 267 L 540 267 L 540 340" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="544" y="300" font-size="9.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="470" y="346" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="510" y="364" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return 0</text>
  <path d="M 540 340 L 510 340 L 510 346" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Yes: reverse -->
  <path d="M 480 282 L 480 300" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="496" y="296" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="380" y="302" width="200" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="480" y="320" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">反转 res 各位 → 升序排列</text>
  <path d="M 480 330 L 480 344" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 7: overflow? -->
  <polygon points="480,346 545,372 480,398 415,372" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="480" y="370" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">res ≤ INT_MAX?</text>

  <!-- No: return 0 -->
  <path d="M 415 372 L 380 372 L 380 396" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="396" y="364" font-size="9.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="340" y="398" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="380" y="416" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return 0</text>

  <!-- Yes: return res -->
  <path d="M 480 398 L 480 412" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="496" y="408" font-size="9.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="420" y="414" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="15" filter="url(#rough2)"/>
  <text x="480" y="434" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return res ✓</text>

  <!-- bottom note -->
  <rect x="60" y="410" width="260" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="74" y="430" font-size="10.5" fill="#446688" font-weight="bold">图例：</text>
  <rect x="110" y="422" width="16" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="132" y="431" font-size="10" fill="#555">成功/返回</text>
  <rect x="190" y="422" width="16" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="212" y="431" font-size="10" fill="#555">失败/返回 0</text>
  <rect x="110" y="442" width="16" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="132" y="451" font-size="10" fill="#555">判定</text>
  <rect x="190" y="442" width="16" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="212" y="451" font-size="10" fill="#555">处理步骤</text>
</svg>
