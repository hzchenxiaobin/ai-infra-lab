<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="430" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一趟遍历，维护前缀最值</text>

  <rect x="30" y="30" width="140" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="100" y="48" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">j 遍历完</text>
  <text x="100" y="64" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 [−1, −1]</text>

  <path d="M 100 74 L 100 116 L 190 116" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="150" y="108" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">结束</text>

  <rect x="210" y="40" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="290" y="61" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">minIdx = maxIdx = 0</text>

  <path d="M 290 74 L 290 92" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="195" y="96" width="190" height="40" fill="#fff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="113" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">for j = D … n−1</text>
  <text x="290" y="128" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">D = indexDifference</text>

  <path d="M 290 136 L 290 166" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="170" width="240" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="190" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">纳入 r = j − D，更新前缀最值</text>
  <text x="290" y="208" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">nums[r] 更小 → minIdx = r</text>
  <text x="290" y="224" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">nums[r] 更大 → maxIdx = r</text>

  <path d="M 290 228 L 290 246 L 150 246 L 150 264" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="150,268 265,310 150,352 35,310" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="305" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">|nums[j] − nums[minIdx]|</text>
  <text x="150" y="321" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">≥ V ?</text>

  <path d="M 265 310 L 311 310" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="302" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">否</text>

  <polygon points="430,268 545,310 430,352 315,310" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="305" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">|nums[j] − nums[maxIdx]|</text>
  <text x="430" y="321" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">≥ V ?</text>

  <path d="M 150 352 L 150 380" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="162" y="370" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="80" y="384" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="150" y="405" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 [minIdx, j]</text>

  <path d="M 430 352 L 430 380" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="442" y="370" font-size="11" fill="#d6a040" filter="url(#rough2)">是</text>

  <rect x="360" y="384" width="140" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="405" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">返回 [maxIdx, j]</text>

  <path d="M 545 310 L 566 310 L 566 116 L 389 116" stroke="#999" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="560" y="215" font-size="10.5" fill="#999" transform="rotate(90 560 215)" text-anchor="middle" filter="url(#rough2)">否，j++</text>
</svg>
