<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：预处理 cost 表 → DP 逐层填表 → 返回 dp[n][k]</text>

  <!-- ===== Step 1: Precompute cost ===== -->
  <rect x="40" y="50" width="200" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 预处理 cost 表</text>
  <text x="50" y="88" font-size="10" fill="#555">枚举 l，向右扩展 r</text>
  <text x="50" y="102" font-size="10" fill="#555">滚动维护 mx 和 sum</text>
  <text x="50" y="118" font-size="10" fill="#333" font-weight="bold">cost[l][r] = mx·len − sum</text>
  <text x="50" y="130" font-size="9" fill="#888">时间 O(n²)</text>

  <!-- arrow 1->2 -->
  <path d="M 250 90 L 286 90" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== Step 2: Init DP ===== -->
  <rect x="300" y="50" width="200" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="70" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② 初始化 dp[i][0]</text>
  <text x="310" y="88" font-size="10" fill="#555">不调整 = 1 段</text>
  <text x="310" y="106" font-size="10" fill="#333" font-weight="bold">dp[i][0] = cost[0][i-1]</text>
  <text x="310" y="122" font-size="9" fill="#888">i = 1..n</text>

  <!-- arrow down to step 3 -->
  <path d="M 400 138 L 400 160" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== Step 3: DP triple loop ===== -->
  <rect x="150" y="166" width="240" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="186" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③ DP 三重循环填表</text>
  <text x="160" y="206" font-size="10" fill="#555">for j = 1..k:        （调整次数）</text>
  <text x="160" y="222" font-size="10" fill="#555">  for i = j+1..n:    （元素数≥段数）</text>
  <text x="160" y="238" font-size="10" fill="#555">    for m = j..i-1:  （最后一段起点）</text>
  <text x="160" y="256" font-size="10" fill="#b85450" font-weight="bold">      dp[i][j] = min(</text>
  <text x="178" y="256" font-size="10" fill="#333">dp[i][j],</text>
  <text x="270" y="260" text-anchor="middle" font-size="9" fill="#888" font-style="italic">枚举切分点 m，前 m 个用 j-1 次</text>

  <!-- arrow to step 4 -->
  <path d="M 270 270 L 270 290" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== Step 4: Return ===== -->
  <rect x="170" y="296" width="200" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="318" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">④ 返回 dp[n][k]</text>
  <text x="270" y="334" text-anchor="middle" font-size="10" fill="#888">前 n 个元素用 k 次调整的最小浪费</text>

  <!-- ===== Constraints note ===== -->
  <rect x="30" y="360" width="480" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="270" y="378" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">约束与复杂度</text>
  <text x="40" y="396" font-size="10" fill="#555">i ≥ j+1：j 次调整分 j+1 段，需 ≥ j+1 个元素（段数 ≤ 元素数）</text>
  <text x="40" y="408" font-size="10" fill="#555">时间 O(n²k)，空间 O(n² + nk)；n≤200, k≤199 → n²k ≈ 8×10⁶</text>
</svg>
