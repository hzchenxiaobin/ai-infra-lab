<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：n = 5, offers = [[0,0,1],[0,2,2],[1,3,2]]</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">橙色格 = 本行刚被更新的 dp[i+1]</text>

  <!-- header row -->
  <rect x="60" y="58" width="70" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="77" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">扫到房屋</text>
  <rect x="130" y="58" width="46" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="153" y="77" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">dp[0]</text>
  <rect x="176" y="58" width="46" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="199" y="77" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">dp[1]</text>
  <rect x="222" y="58" width="46" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="77" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">dp[2]</text>
  <rect x="268" y="58" width="46" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="291" y="77" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">dp[3]</text>
  <rect x="314" y="58" width="46" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="337" y="77" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">dp[4]</text>
  <rect x="360" y="58" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="383" y="77" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">dp[5]</text>
  <rect x="416" y="58" width="160" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="496" y="77" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">说明</text>

  <!-- row: init -->
  <rect x="60" y="92" width="70" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="95" y="111" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">初始</text>
  <rect x="130" y="92" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="153" y="111" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="176" y="92" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="199" y="111" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="222" y="92" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="245" y="111" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="268" y="92" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="291" y="111" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="314" y="92" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="337" y="111" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="360" y="92" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="383" y="111" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="424" y="111" font-size="10" fill="#888" filter="url(#rough2)">dp[0] = 0</text>

  <!-- row: i=0 -->
  <rect x="60" y="126" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="145" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">i = 0</text>
  <rect x="130" y="126" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="153" y="145" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="176" y="126" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="199" y="145" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="222" y="126" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="245" y="145" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="268" y="126" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="291" y="145" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="314" y="126" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="337" y="145" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="360" y="126" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="383" y="145" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="424" y="139" font-size="10" fill="#888" filter="url(#rough2)">dp[1]=dp[0]=0；报价(0,0,1)</text>
  <text x="424" y="152" font-size="10" fill="#b85450" filter="url(#rough2)">dp[1]=max(0, dp[0]+1)=1</text>

  <!-- row: i=1 -->
  <rect x="60" y="160" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="179" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">i = 1</text>
  <rect x="130" y="160" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="153" y="179" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="176" y="160" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="199" y="179" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="222" y="160" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="179" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="268" y="160" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="291" y="179" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="314" y="160" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="337" y="179" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="360" y="160" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="383" y="179" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="424" y="179" font-size="10" fill="#888" filter="url(#rough2)">dp[2]=dp[1]=1（无以 1 结尾的报价）</text>

  <!-- row: i=2 -->
  <rect x="60" y="194" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="213" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">i = 2</text>
  <rect x="130" y="194" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="153" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="176" y="194" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="199" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="222" y="194" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="245" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="268" y="194" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="291" y="213" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="314" y="194" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="337" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="360" y="194" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="383" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="424" y="207" font-size="10" fill="#888" filter="url(#rough2)">dp[3]=dp[2]=1；报价(0,2,2)</text>
  <text x="424" y="220" font-size="10" fill="#b85450" filter="url(#rough2)">dp[3]=max(1, dp[0]+2)=2</text>

  <!-- row: i=3 -->
  <rect x="60" y="228" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="247" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">i = 3</text>
  <rect x="130" y="228" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="153" y="247" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="176" y="228" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="199" y="247" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="222" y="228" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="245" y="247" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="268" y="228" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="291" y="247" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="314" y="228" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="337" y="247" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="360" y="228" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="383" y="247" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="424" y="241" font-size="10" fill="#888" filter="url(#rough2)">dp[4]=dp[3]=2；报价(1,3,2)</text>
  <text x="424" y="254" font-size="10" fill="#b85450" filter="url(#rough2)">dp[4]=max(2, dp[1]+2)=3 ⚡</text>

  <!-- row: i=4 -->
  <rect x="60" y="262" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="281" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">i = 4</text>
  <rect x="130" y="262" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="153" y="281" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="176" y="262" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="199" y="281" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="222" y="262" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="245" y="281" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="268" y="262" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="291" y="281" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="314" y="262" width="46" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="337" y="281" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="360" y="262" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="383" y="281" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="424" y="281" font-size="10" fill="#888" filter="url(#rough2)">dp[5]=dp[4]=3（无以 4 结尾的报价）</text>

  <!-- conclusion -->
  <rect x="70" y="308" width="480" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="328" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 dp[5] = 3：卖 [0,0]（得 1）+ 卖 [1,3]（得 2）</text>
  <text x="310" y="348" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">i=3 行是关键：dp[1]+2=3 &gt; dp[3]=2，选「以 3 结尾」的报价并接上 dp[1]</text>

  <text x="310" y="374" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">dp 单调不减：dp[i+1] 先继承 dp[i]，再尝试所有「以 i 结尾」的报价取最大</text>
</svg>
