<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="500" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：Trie 单趟行走 —— 命中吞词、失配吐一格</text>

  <!-- start -->
  <rect x="200" y="40" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="61" text-anchor="middle" font-size="11.5" fill="#333">预处理：zero~nine 建成 Trie（终端存数字）</text>
  <path d="M 310 74 L 310 88" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1: i < n ? -->
  <polygon points="245,120 310,88 375,120 310,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="125" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>
  <path d="M 375 120 L 453 120" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="405" y="112" text-anchor="middle" font-size="10.5" fill="#888">否</text>
  <rect x="455" y="102" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="515" y="124" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 res</text>
  <path d="M 310 152 L 310 170" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="166" font-size="10.5" fill="#888">是</text>

  <!-- B1 -->
  <rect x="215" y="172" width="190" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="191" text-anchor="middle" font-size="11.5" fill="#333">node = 根，j = i</text>
  <path d="M 310 202 L 310 216" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D2: j < n and child? -->
  <polygon points="180,258 310,220 440,258 310,296" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="252" text-anchor="middle" font-size="11.5" fill="#333">j &lt; n 且</text>
  <text x="310" y="270" text-anchor="middle" font-size="11.5" fill="#333">node 有 s[j] 子节点？</text>
  <path d="M 440 258 L 478 258" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="250" text-anchor="middle" font-size="10.5" fill="#888">否</text>
  <rect x="480" y="232" width="130" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="545" y="252" text-anchor="middle" font-size="11" fill="#333">失配：res += s[i]</text>
  <text x="545" y="270" text-anchor="middle" font-size="11" fill="#333">i += 1（吐一个字符）</text>
  <path d="M 310 296 L 310 310" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="308" font-size="10.5" fill="#888">是</text>

  <!-- B3 -->
  <rect x="215" y="312" width="190" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="331" text-anchor="middle" font-size="11.5" fill="#333">node = 子节点，j += 1</text>
  <path d="M 310 342 L 310 356" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D3: terminal? -->
  <polygon points="225,392 310,358 395,392 310,426" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="397" text-anchor="middle" font-size="11.5" fill="#333">node 是终端？</text>
  <!-- D3 no: loop back to D2 -->
  <path d="M 225 392 L 165 392 L 165 258 L 178 258" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="98" y="325" text-anchor="middle" font-size="10.5" fill="#888">否：继续走</text>
  <path d="M 310 426 L 310 440" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="438" font-size="10.5" fill="#888">是</text>

  <!-- B4: match -->
  <rect x="215" y="442" width="190" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="458" text-anchor="middle" font-size="11.5" fill="#333">命中：res += 数字</text>
  <text x="310" y="475" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">i = j（吞掉整词）</text>

  <!-- feedback bus -->
  <path d="M 545 284 L 545 492 L 110 492 L 110 120 L 243 120" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 482 L 310 492" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <circle cx="310" cy="492" r="3" fill="#b85450" filter="url(#rough2)"/>
  <text x="330" y="486" font-size="10.5" fill="#b85450">回到 i &lt; n</text>
</svg>
