<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">三个数的最大乘积算法流程（排序法）</text>

  <g filter="url(#rough2)">
    <rect x="150" y="44" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="260" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 对 nums 升序排序</text>
  </g>
  <path d="M 260 82 L 260 104" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="110" y="106" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="260" y="126" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">② 候选一 = nums[n-1] × nums[n-2] × nums[n-3]</text>
    <text x="260" y="142" text-anchor="middle" font-size="10" fill="#666">三个最大值相乘</text>
  </g>
  <path d="M 260 150 L 260 172" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="110" y="174" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="260" y="194" text-anchor="middle" font-size="12" fill="#a07820" font-weight="bold">③ 候选二 = nums[0] × nums[1] × nums[n-1]</text>
    <text x="260" y="210" text-anchor="middle" font-size="10" fill="#666">两个最小值 × 最大值</text>
  </g>
  <path d="M 260 218 L 260 240" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="260,242 350,278 260,314 170,278" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="260" y="274" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">候选一 vs 候选二</text>
    <text x="260" y="290" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">取 max</text>
  </g>
  <path d="M 260 314 L 260 336" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="150" y="338" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="260" y="360" text-anchor="middle" font-size="12.5" fill="#3a5a2a" font-weight="bold">④ 返回 max(候选一, 候选二)</text>
    <text x="260" y="376" text-anchor="middle" font-size="10" fill="#666">两种候选覆盖所有情况</text>
  </g>

  <rect x="20" y="44" width="74" height="100" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="57" y="64" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">复杂度</text>
  <text x="57" y="82" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">时间</text>
  <text x="57" y="96" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">O(n log n)</text>
  <text x="57" y="114" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">空间</text>
  <text x="57" y="128" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">O(log n)</text>
</svg>
