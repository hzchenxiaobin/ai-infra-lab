<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：逐位构造，每位从末位 d 分支出 d±k</text>

  <!-- Rule box -->
  <rect x="40" y="44" width="480" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="13" fill="#333">转移规则：当前末位 d → 下一位候选 = { d + k,  d − k } ∩ [0, 9]</text>
  <text x="280" y="88" text-anchor="middle" font-size="11" fill="#888">首位取 1–9（无前导零），后续每位最多 2 个分支；k = 0 时两分支重合用集合去重</text>

  <!-- Branching example: d=1, k=7 -->
  <text x="40" y="128" font-size="12" fill="#888">示例（k = 7）：从末位 d = 1 出发</text>

  <rect x="60" y="138" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="82" y="160" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- valid branch: 1+7=8 -->
  <path d="M 104 152 L 180 142" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="142" y="138" text-anchor="middle" font-size="10" fill="#4a7a3a">+7</text>
  <rect x="184" y="128" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="206" y="149" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">8</text>
  <text x="240" y="149" font-size="11" fill="#4a7a3a">✓ 合法</text>

  <!-- invalid branch: 1-7=-6 -->
  <path d="M 104 170 L 180 196" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="142" y="192" text-anchor="middle" font-size="10" fill="#b85450">−7</text>
  <rect x="184" y="186" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="206" text-anchor="middle" font-size="12" fill="#b85450">−6 ✗</text>
  <text x="256" y="206" font-size="11" fill="#b85450">越界丢弃</text>

  <!-- Tree concept -->
  <text x="40" y="252" font-size="12" fill="#888">DFS 树：每条根 → 叶路径 = 一个合法数字</text>

  <!-- Level labels -->
  <text x="78" y="262" text-anchor="middle" font-size="9" fill="#aaa">第1位</text>
  <text x="178" y="262" text-anchor="middle" font-size="9" fill="#aaa">第2位</text>
  <text x="278" y="262" text-anchor="middle" font-size="9" fill="#aaa">第3位</text>

  <!-- Level 0: root 1 -->
  <rect x="60" y="268" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="288" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- Level 1: 8 -->
  <path d="M 96 290 Q 138 296 160 304" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="160" y="296" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="316" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>

  <!-- Level 2: 1 -->
  <path d="M 196 318 Q 238 312 260 304" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="260" y="296" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="316" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- result -->
  <path d="M 296 311 L 338 311" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="342" y="296" width="76" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="380" y="317" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">181</text>

  <!-- side note -->
  <rect x="430" y="270" width="116" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="488" y="290" text-anchor="middle" font-size="11" fill="#555">叶节点 remain=0</text>
  <text x="488" y="306" text-anchor="middle" font-size="11" fill="#555">→ 收集为答案</text>
  <text x="488" y="320" text-anchor="middle" font-size="10" fill="#aaa">（最多 9·2^(n−1) 个）</text>
</svg>
