<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：k → 位定层 → 二进制映射</text>

  <!-- Input -->
  <rect x="226" y="50" width="108" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">输入 k（1-indexed）</text>
  <path d="M280,88 L280,108" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1 -->
  <rect x="80" y="110" width="400" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="132" font-size="13" fill="#4a7a3a" filter="url(#rough2)">① 定位数 c</text>
  <text x="100" y="152" font-size="12" fill="#333" filter="url(#rough2)">找最小 c 使 2ᶜ⁺¹ − 2 ≥ k （恰好 c 位有 2ᶜ 个）</text>
  <text x="410" y="152" font-size="11" fill="#888" filter="url(#rough2)">c = bitlen(k+1) − 1</text>
  <path d="M280,166 L280,186" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="80" y="188" width="400" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="210" font-size="13" fill="#d6a040" filter="url(#rough2)">② 算层内序号 idx</text>
  <text x="100" y="230" font-size="12" fill="#333" filter="url(#rough2)">idx = k − (2ᶜ − 2) − 1 = k − 2ᶜ + 1  （0-indexed）</text>
  <path d="M280,244 L280,264" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="80" y="266" width="400" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="288" font-size="13" fill="#b85450" filter="url(#rough2)">③ 二进制 → 幸运数</text>
  <text x="100" y="308" font-size="12" fill="#333" filter="url(#rough2)">idx 写成 c 位二进制，0→'4'，1→'7'，即答案</text>
  <path d="M280,322 L280,342" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Output -->
  <rect x="206" y="344" width="148" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="364" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">输出：第 k 个幸运数字</text>
</svg>
