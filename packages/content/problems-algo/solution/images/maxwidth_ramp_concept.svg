<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">候选左端点：只保留严格递减的前缀最小值</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">引理：若 i &lt; k 且 A[i] ≤ A[k]，则 k 被压制，不可能成为最优左端点</text>

  <!-- ===== Array row ===== -->
  <text x="30" y="74" font-size="11" fill="#446688" font-weight="bold">数组 A = [6, 0, 8, 2, 1, 5]</text>
  <g font-size="11">
    <!-- index labels -->
    <text x="65" y="92" text-anchor="middle" font-size="9" fill="#888">i=0</text>
    <text x="115" y="92" text-anchor="middle" font-size="9" fill="#888">i=1</text>
    <text x="165" y="92" text-anchor="middle" font-size="9" fill="#888">i=2</text>
    <text x="215" y="92" text-anchor="middle" font-size="9" fill="#888">i=3</text>
    <text x="265" y="92" text-anchor="middle" font-size="9" fill="#888">i=4</text>
    <text x="315" y="92" text-anchor="middle" font-size="9" fill="#888">i=5</text>

    <!-- boxes -->
    <rect x="45" y="98" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="65" y="119" text-anchor="middle" fill="#446688" font-weight="bold">6</text>

    <rect x="95" y="98" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="115" y="119" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>

    <rect x="145" y="98" width="40" height="32" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
    <text x="165" y="119" text-anchor="middle" fill="#999">8</text>
    <rect x="195" y="98" width="40" height="32" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
    <text x="215" y="119" text-anchor="middle" fill="#999">2</text>
    <rect x="245" y="98" width="40" height="32" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
    <text x="265" y="119" text-anchor="middle" fill="#999">1</text>
    <rect x="295" y="98" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="315" y="119" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
  </g>

  <!-- candidate marks -->
  <text x="65" y="146" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">✓ 候选</text>
  <text x="115" y="146" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓ 候选</text>
  <text x="165" y="146" text-anchor="middle" font-size="8" fill="#b85450">✗ 跳过</text>
  <text x="215" y="146" text-anchor="middle" font-size="8" fill="#b85450">✗ 跳过</text>
  <text x="265" y="146" text-anchor="middle" font-size="8" fill="#b85450">✗ 跳过</text>
  <text x="315" y="146" text-anchor="middle" font-size="8" fill="#b85450">✗ 跳过</text>

  <!-- ===== Candidate stack ===== -->
  <text x="30" y="176" font-size="11" fill="#d6a040" font-weight="bold">候选栈（值严格递减）</text>
  <g font-size="10">
    <rect x="80" y="186" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="125" y="205" text-anchor="middle" fill="#446688" font-weight="bold">下标 0 → 值 6</text>

    <rect x="80" y="218" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="125" y="237" text-anchor="middle" fill="#4a7a3a" font-weight="bold">下标 1 → 值 0</text>
  </g>

  <!-- why skip explanation -->
  <rect x="200" y="186" width="340" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="210" y="204" font-size="10" fill="#b85450" font-weight="bold">为什么 i=2,3,4,5 都跳过？</text>
  <text x="210" y="220" font-size="9" fill="#555">i=2 值 8 ≥ 栈顶值 0 → 栈顶下标 1 更早且值更小</text>
  <text x="210" y="234" font-size="9" fill="#555">→ 对任何 j，(1,j) 比 (2,j) 更宽 → i=2 被压制，无用</text>

  <!-- ===== Optimal ramp ===== -->
  <text x="30" y="278" font-size="11" fill="#4a7a3a" font-weight="bold">最优坡：(i=1, j=5)，宽度 = 5 − 1 = 4</text>

  <!-- ramp arrow from index 1 to index 5 -->
  <path d="M 115 270 Q 215 250 315 270" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="215" y="252" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">宽度 4</text>

  <!-- ===== Summary box ===== -->
  <rect x="60" y="300" width="440" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">建栈规则：仅当 A[i] &lt; A[栈顶] 才入栈（严格小于，等值也跳过）</text>
  <text x="280" y="340" text-anchor="middle" font-size="10" fill="#555">栈中下标对应的 A 值严格递减 → 每个候选都不被任何更早下标压制</text>
  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#555">候选数 ≤ n，通常远小于 n（本例 6 个元素只留 2 个候选）</text>
</svg>
