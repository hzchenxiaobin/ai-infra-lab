<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="540" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)" font-weight="bold">算法流程：四步类型分派决策树（先排雷 null）</text>

  <!-- 入口 -->
  <rect x="240" y="44" width="140" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="65" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">调用 jsonStringify(obj)</text>

  <!-- 判1: typeof string? -->
  <path d="M 310 76 L 310 96" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="310,98 380,138 310,178 240,138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">typeof obj</text>
  <text x="310" y="150" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">=== "string"?</text>

  <!-- 是 → 字符串分支 -->
  <path d="M 240 138 L 130 138 L 130 196" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="180" y="130" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">是</text>
  <rect x="50" y="196" width="160" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="218" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">return '"' + obj + '"'</text>

  <!-- 否 → 判2: null 或 非object? -->
  <path d="M 380 138 L 480 138 L 480 196" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="130" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)" font-weight="bold">否</text>
  <polygon points="480,198 560,248 480,298 400,248" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="480" y="244" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">obj===null ||</text>
  <text x="480" y="260" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">typeof!=="object"?</text>

  <!-- 是 → 原始类型分支 -->
  <path d="M 400 248 L 330 248 L 330 310" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="360" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">是</text>
  <rect x="250" y="310" width="160" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="332" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">return String(obj)</text>
  <text x="330" y="360" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">null→"null" 真→"true" 数→"123"</text>

  <!-- 否 → 判3: Array.isArray? -->
  <path d="M 560 248 L 560 248" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 480 298 L 480 318" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="312" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)" font-weight="bold">否</text>
  <polygon points="480,320 556,360 480,400 404,360" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="480" y="366" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Array.isArray?</text>

  <!-- 是 → 数组分支 -->
  <path d="M 404 360 L 330 360" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="100" y="344" width="230" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="215" y="366" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">return "[" + obj.map(f).join(",") + "]"</text>

  <!-- 否 → 对象分支 -->
  <path d="M 480 400 L 480 420" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="414" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)" font-weight="bold">否</text>
  <rect x="340" y="420" width="260" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="442" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">return "{" + keys.map(k=>'"'+k+'":'+f(v)).join(",") + "}"</text>

  <!-- 递归回环标注 -->
  <text x="215" y="392" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)" font-weight="bold">↑ map 里递归调用 f</text>
  <text x="470" y="470" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)" font-weight="bold">↑ map 里递归调用 f</text>

  <!-- 排雷提示框 -->
  <rect x="30" y="486" width="560" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="506" font-size="12" fill="#333" filter="url(#rough2)" font-weight="bold">⚠ 排雷：typeof null === "object"，须在判 object 前先拦 null！</text>
  <text x="46" y="522" font-size="11" fill="#555" filter="url(#rough2)">判2 把 null 与原始类型合并用 String() 收口，避免 null 冒充对象走错分支。</text>
</svg>
