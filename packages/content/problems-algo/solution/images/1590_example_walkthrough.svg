<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [6,3,5,2], p = 9, r = 7</text>

  <!-- ===== nums array ===== -->
  <text x="40" y="52" font-size="10" fill="#888">nums</text>
  <rect x="40" y="58" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">6</text>
  <rect x="100" y="58" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <rect x="160" y="58" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5</text>
  <rect x="220" y="58" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>

  <!-- index labels -->
  <text x="70" y="104" text-anchor="middle" font-size="9" fill="#888">i=0</text>
  <text x="130" y="104" text-anchor="middle" font-size="9" fill="#888">i=1</text>
  <text x="190" y="104" text-anchor="middle" font-size="9" fill="#888">i=2</text>
  <text x="250" y="104" text-anchor="middle" font-size="9" fill="#888">i=3</text>

  <!-- ===== Step table header ===== -->
  <text x="40" y="130" font-size="10" fill="#888">逐步演算（prefix 均为 mod 9 后的值）</text>

  <!-- table frame -->
  <rect x="40" y="136" width="520" height="216" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>

  <!-- column headers -->
  <rect x="40" y="136" width="520" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="70" y="152" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">i</text>
  <text x="130" y="152" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">num</text>
  <text x="200" y="152" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">prefix</text>
  <text x="290" y="152" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">target</text>
  <text x="380" y="152" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">命中?</text>
  <text x="480" y="152" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">ans</text>

  <!-- vertical separators -->
  <line x1="100" y1="136" x2="100" y2="352" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="160" y1="136" x2="160" y2="352" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="250" y1="136" x2="250" y2="352" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="330" y1="136" x2="330" y2="352" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="430" y1="136" x2="430" y2="352" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 0 (init) -->
  <text x="70" y="174" text-anchor="middle" font-size="9" fill="#888">−</text>
  <text x="130" y="174" text-anchor="middle" font-size="9" fill="#888">−</text>
  <text x="200" y="174" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">0</text>
  <text x="290" y="174" text-anchor="middle" font-size="9" fill="#888">−</text>
  <text x="380" y="174" text-anchor="middle" font-size="9" fill="#888">初始化</text>
  <text x="480" y="174" text-anchor="middle" font-size="9" fill="#888">4</text>

  <line x1="44" y1="180" x2="556" y2="180" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 1: i=0, num=6, prefix=6, target=8, miss -->
  <text x="70" y="198" text-anchor="middle" font-size="9" fill="#333">0</text>
  <text x="130" y="198" text-anchor="middle" font-size="9" fill="#333">6</text>
  <text x="200" y="198" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">6</text>
  <text x="290" y="198" text-anchor="middle" font-size="9" fill="#d6a040">8</text>
  <text x="380" y="198" text-anchor="middle" font-size="9" fill="#b85450">无</text>
  <text x="480" y="198" text-anchor="middle" font-size="9" fill="#888">4</text>

  <line x1="44" y1="204" x2="556" y2="204" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 2: i=1, num=3, prefix=0, target=2, miss; note last[0] updated to 1 -->
  <text x="70" y="222" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="130" y="222" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="200" y="222" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">0</text>
  <text x="290" y="222" text-anchor="middle" font-size="9" fill="#d6a040">2</text>
  <text x="380" y="222" text-anchor="middle" font-size="9" fill="#b85450">无</text>
  <text x="480" y="222" text-anchor="middle" font-size="9" fill="#888">4</text>

  <line x1="44" y1="228" x2="556" y2="228" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 3: i=2, num=5, prefix=5, target=7, miss -->
  <text x="70" y="246" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="130" y="246" text-anchor="middle" font-size="9" fill="#333">5</text>
  <text x="200" y="246" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">5</text>
  <text x="290" y="246" text-anchor="middle" font-size="9" fill="#d6a040">7</text>
  <text x="380" y="246" text-anchor="middle" font-size="9" fill="#b85450">无</text>
  <text x="480" y="246" text-anchor="middle" font-size="9" fill="#888">4</text>

  <line x1="44" y1="252" x2="556" y2="252" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 4: i=3, num=2, prefix=7, target=0, HIT last[0]=1, ans=2 -->
  <rect x="44" y="256" width="512" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="70" y="270" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">3</text>
  <text x="130" y="270" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2</text>
  <text x="200" y="270" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">7</text>
  <text x="290" y="270" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">0</text>
  <text x="380" y="270" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓ last[0]=1</text>
  <text x="480" y="270" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- ===== Result explanation ===== -->
  <rect x="40" y="366" width="520" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="386" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">i=3 时 target=0 命中 last[0]=1</text>
  <text x="300" y="402" text-anchor="middle" font-size="10" fill="#666">子数组 = nums[2..3] = [5, 2]，长度 = 3 − 1 = 2</text>
  <text x="300" y="414" text-anchor="middle" font-size="9" fill="#888">剩余 [6, 3] 之和 = 9，9 mod 9 = 0 ✓</text>

  <!-- ===== Highlight: last[0] update note ===== -->
  <rect x="40" y="424" width="520" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="6" filter="url(#rough2)" opacity="0.6"/>
  <text x="300" y="442" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">⚠ i=1 时 prefix 归 0，last[0] 从 −1 更新为 1，使后续能命中更短子数组</text>
</svg>
