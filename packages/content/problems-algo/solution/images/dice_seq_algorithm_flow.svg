<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：长度 2 起步 → 逐层滑窗 → 求和</text>

  <!-- Step 1: base -->
  <rect x="30" y="48" width="200" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="70" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 特判 n=1 → 6</text>
  <text x="130" y="90" text-anchor="middle" font-size="11" fill="#555">n≥2 时初始化 dp[a][b]=1</text>
  <text x="130" y="103" text-anchor="middle" font-size="10" fill="#888">a≠b 且 gcd(a,b)=1（22 对）</text>

  <!-- arrow down -->
  <path d="M130 108 L130 132" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop -->
  <rect x="30" y="138" width="200" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 循环 k = 3..n</text>
  <text x="130" y="180" text-anchor="middle" font-size="11" fill="#555">枚举状态 (a,b) 与新值 x</text>
  <text x="130" y="196" text-anchor="middle" font-size="11" fill="#555">过三关: gcd=1 / x≠b / x≠a</text>
  <text x="130" y="210" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">nd[b][x] += dp[a][b]</text>

  <!-- arrow down -->
  <path d="M130 220 L130 244" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: answer -->
  <rect x="30" y="250" width="200" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="272" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 求和所有 dp[a][b]</text>
  <text x="130" y="292" text-anchor="middle" font-size="11" fill="#555">即长度 n 的合法序列总数</text>

  <!-- right side: complexity + insight -->
  <rect x="270" y="48" width="220" height="100" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="380" y="72" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">复杂度</text>
  <text x="290" y="94" font-size="11" fill="#555">每步 6×6×6 = 216 次判定</text>
  <text x="290" y="112" font-size="11" fill="#555">时间 O(n) ≈ 2.16×10⁶</text>
  <text x="290" y="130" font-size="11" fill="#555">空间 O(1)：两份 6×6 表</text>

  <rect x="270" y="170" width="220" height="136" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="380" y="194" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">关键点</text>
  <text x="290" y="216" font-size="11" fill="#555">• 状态只两位，覆盖距离≤2</text>
  <text x="290" y="234" font-size="11" fill="#555">• 滑窗更新: (a,b)→(b,x)</text>
  <text x="290" y="252" font-size="11" fill="#555">• 滚动数组 nd / dp</text>
  <text x="290" y="270" font-size="11" fill="#555">• 转移表与 n 无关，常数</text>
  <text x="290" y="290" font-size="10" fill="#b85450">n 巨大可换矩阵快速幂</text>

  <!-- bottom modulus note -->
  <rect x="30" y="316" width="460" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="337" text-anchor="middle" font-size="11" fill="#555">全程对 10⁹+7 取余，ans = Σ dp[a][b] mod M</text>
</svg>
