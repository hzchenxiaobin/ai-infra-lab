<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">单词方块：第 i 行读出的单词 = 第 i 列读出的单词</text>

  <!-- column word labels (top) -->
  <g font-size="11" text-anchor="middle" filter="url(#rough2)">
    <text x="164" y="66" fill="#888">ball</text>
    <text x="212" y="66" fill="#888">area</text>
    <text x="260" y="66" fill="#4a7a3a" font-weight="bold">lead</text>
    <text x="308" y="66" fill="#888">lady</text>
  </g>

  <!-- grid cells 4x4, origin (140,80), cell 48 -->
  <g filter="url(#rough2)">
    <!-- row0 -->
    <rect x="140" y="80" width="48" height="48" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="188" y="80" width="48" height="48" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="236" y="80" width="48" height="48" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="284" y="80" width="48" height="48" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
    <!-- row1 -->
    <rect x="140" y="128" width="48" height="48" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="188" y="128" width="48" height="48" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="236" y="128" width="48" height="48" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="284" y="128" width="48" height="48" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
    <!-- row2 -->
    <rect x="140" y="176" width="48" height="48" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="188" y="176" width="48" height="48" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="236" y="176" width="48" height="48" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="284" y="176" width="48" height="48" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
    <!-- row3 -->
    <rect x="140" y="224" width="48" height="48" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="188" y="224" width="48" height="48" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="236" y="224" width="48" height="48" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="284" y="224" width="48" height="48" fill="#fff8e1" stroke="#888" stroke-width="1.3" rx="3"/>
  </g>

  <!-- highlight overlays: row2 (blue), col2 (green) -->
  <rect x="136" y="172" width="200" height="56" fill="#446688" opacity="0.18" filter="url(#rough2)"/>
  <rect x="232" y="76" width="56" height="200" fill="#4a7a3a" opacity="0.18" filter="url(#rough2)"/>

  <!-- letters -->
  <g font-size="18" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <!-- row0: b a l l -->
    <text x="164" y="110">b</text>
    <text x="212" y="110">a</text>
    <text x="260" y="110">l</text>
    <text x="308" y="110">l</text>
    <!-- row1: a r e a -->
    <text x="164" y="158">a</text>
    <text x="212" y="158">r</text>
    <text x="260" y="158">e</text>
    <text x="308" y="158">a</text>
    <!-- row2: l e a d -->
    <text x="164" y="206" fill="#446688" font-weight="bold">l</text>
    <text x="212" y="206" fill="#446688" font-weight="bold">e</text>
    <text x="260" y="206" fill="#b85450" font-weight="bold">a</text>
    <text x="308" y="206" fill="#446688" font-weight="bold">d</text>
    <!-- row3: l a d y -->
    <text x="164" y="254">l</text>
    <text x="212" y="254">a</text>
    <text x="260" y="254">d</text>
    <text x="308" y="254">y</text>
  </g>

  <!-- row word labels (right) -->
  <g font-size="11" filter="url(#rough2)">
    <text x="346" y="114" fill="#888">ball</text>
    <text x="346" y="162" fill="#888">area</text>
    <text x="346" y="210" fill="#446688" font-weight="bold">lead</text>
    <text x="346" y="258" fill="#888">lady</text>
  </g>

  <!-- arrows pointing to the highlighted row/col word -->
  <path d="M 336 202 L 343 206" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 256 74 L 256 70" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- legend -->
  <rect x="40" y="296" width="22" height="14" fill="#446688" opacity="0.18" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="68" y="308" font-size="11" fill="#446688">第 2 行 = lead</text>
  <rect x="40" y="318" width="22" height="14" fill="#4a7a3a" opacity="0.18" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="68" y="330" font-size="11" fill="#4a7a3a">第 2 列 = lead</text>

  <text x="200" y="316" font-size="11" fill="#444">行 i = 列 i ⇒ 矩阵对称，对角线为公共字符</text>
  <text x="200" y="332" font-size="10" fill="#888">填第 step 行时，前 step 个字符已被第 step 列锁死</text>
</svg>
