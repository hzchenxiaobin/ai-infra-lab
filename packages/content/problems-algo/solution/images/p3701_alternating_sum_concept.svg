<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="17" fill="#333"
        filter="url(#rough2)">核心观察：符号跟着下标走——绿格加、红格减</text>

  <!-- 数组格子（带符号） -->
  <text x="70" y="64" font-size="12" fill="#446688" filter="url(#rough2)">nums：</text>
  <g filter="url(#rough2)">
    <rect x="108" y="44" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="130" y="64" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">+1</text>
    <rect x="152" y="44" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="174" y="64" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−3</text>
    <rect x="196" y="44" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="218" y="64" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">+5</text>
    <rect x="240" y="44" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="262" y="64" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−7</text>
  </g>
  <!-- 下标标注 -->
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="130" y="92" fill="#446688">下标0·偶</text>
    <text x="174" y="92" fill="#446688">下标1·奇</text>
    <text x="218" y="92" fill="#446688">下标2·偶</text>
    <text x="262" y="92" fill="#446688">下标3·奇</text>
  </g>
  <text x="350" y="92" font-size="11" fill="#4a7a3a" filter="url(#rough2)">绿 = 偶下标取「+」</text>
  <text x="350" y="108" font-size="11" fill="#b85450" filter="url(#rough2)">红 = 奇下标取「−」</text>

  <!-- 表达式 -->
  <rect x="70" y="122" width="380" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="142" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">交替和 = nums[0] − nums[1] + nums[2] − nums[3] ⋯</text>
  <text x="260" y="163" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">= (+1) + (−3) + (+5) + (−7) = <tspan fill="#b85450" font-weight="bold">−4</tspan></text>

  <!-- sign 翻转状态机 -->
  <text x="78" y="236" font-size="12" fill="#446688" filter="url(#rough2)">sign 翻转：</text>
  <rect x="160" y="214" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="192" y="236" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1</text>
  <rect x="300" y="214" width="64" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="332" y="236" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <path d="M 228 220 Q 262 198 296 220" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="205" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">每处理一个元素就取反</text>
  <path d="M 296 242 Q 262 264 228 242" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="274" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">再取反 ⋯ +1 ⇄ −1 往复振荡</text>
  <path d="M 370 230 L 404 230" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="410" y="226" font-size="10.5" fill="#b85450" filter="url(#rough2)">等价于乘</text>
  <text x="410" y="240" font-size="10.5" fill="#b85450" filter="url(#rough2)">(−1)^i 权重</text>

  <!-- 审题警示 -->
  <rect x="40" y="282" width="440" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">⚠️ 「偶数下标 / 奇数下标」说的是下标的奇偶，不是元素值的奇偶！</text>
  <text x="260" y="318" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">示例 1 的 1,3,5,7 全是奇数值，仍按下标 0、2 取正号</text>

  <text x="260" y="346" text-anchor="middle" font-size="11" fill="#446688"
        filter="url(#rough2)">一遍扫描：ans += sign × x，sign = −sign：O(n) 时间 / O(1) 空间</text>
</svg>
