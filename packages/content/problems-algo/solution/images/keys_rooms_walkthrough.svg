<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrMini" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrRMini" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 2 DFS 演算：0 可达 {0,1,3}，2 不可达</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">rooms = [[1,3],[3,0,1],[2],[0]]</text>

  <!-- Table header -->
  <rect x="30" y="60" width="500" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="65" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步骤</text>
  <text x="135" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">当前 u</text>
  <text x="235" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">钥匙 rooms[u]</text>
  <text x="345" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">新访问</text>
  <text x="465" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">visited 集合</text>

  <!-- column separators -->
  <line x1="100" y1="60" x2="100" y2="240" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="170" y1="60" x2="170" y2="240" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="300" y1="60" x2="300" y2="240" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="390" y1="60" x2="390" y2="240" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1 -->
  <rect x="30" y="90" width="500" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="65" y="113" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">①</text>
  <text x="135" y="113" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">0</text>
  <text x="235" y="113" text-anchor="middle" font-size="12" fill="#333">1, 3</text>
  <text x="345" y="113" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1, 3</text>
  <text x="465" y="113" text-anchor="middle" font-size="12" fill="#333">{0, 1, 3}</text>

  <!-- Row 2 -->
  <rect x="30" y="126" width="500" height="36" fill="#f7f9fc" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="65" y="149" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">②</text>
  <text x="135" y="149" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="235" y="149" text-anchor="middle" font-size="12" fill="#333">3, 0, 1</text>
  <text x="345" y="149" text-anchor="middle" font-size="12" fill="#888">（都已访问）</text>
  <text x="465" y="149" text-anchor="middle" font-size="12" fill="#333">{0, 1, 3}</text>

  <!-- Row 3 -->
  <rect x="30" y="162" width="500" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="65" y="185" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③</text>
  <text x="135" y="185" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">3</text>
  <text x="235" y="185" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="345" y="185" text-anchor="middle" font-size="12" fill="#888">（已访问）</text>
  <text x="465" y="185" text-anchor="middle" font-size="12" fill="#333">{0, 1, 3}</text>

  <!-- Row 4: result -->
  <rect x="30" y="198" width="500" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="65" y="223" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">结果</text>
  <text x="235" y="218" text-anchor="middle" font-size="11" fill="#444">DFS 结束</text>
  <text x="235" y="232" text-anchor="middle" font-size="11" fill="#666">visited 大小 = 3 ≠ 4</text>
  <text x="465" y="218" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2 号不可达</text>
  <text x="465" y="232" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">→ 返回 false</text>

  <!-- Bottom: graph sketch -->
  <text x="280" y="270" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">对应有向图</text>

  <!-- mini graph -->
  <!-- 0 -> 1 -->
  <path d="M 110 295 L 230 295" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrMini)" filter="url(#rough2)"/>
  <!-- 0 -> 3 -->
  <path d="M 125 305 L 230 335" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrMini)" filter="url(#rough2)"/>
  <!-- 1 -> 3 -->
  <path d="M 268 308 L 268 326" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrMini)" filter="url(#rough2)"/>
  <!-- 1 -> 0 (back) -->
  <path d="M 232 288 Q 180 272 128 288" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrMini)" filter="url(#rough2)"/>
  <!-- 3 -> 0 (back) -->
  <path d="M 230 340 Q 175 355 128 312" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrMini)" filter="url(#rough2)"/>

  <!-- node 2 isolated with self loop (red) -->
  <path d="M 416 286 C 444 270 444 300 420 294" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrRMini)" filter="url(#rough2)"/>
  <!-- gap line to show 2 is disconnected -->

  <!-- nodes -->
  <circle cx="110" cy="298" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="303" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>

  <circle cx="250" cy="298" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="303" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <circle cx="250" cy="340" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="345" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <circle cx="410" cy="298" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="410" y="303" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- labels -->
  <text x="110" y="332" text-anchor="middle" font-size="9" fill="#446688">起点</text>
  <text x="410" y="332" text-anchor="middle" font-size="9" fill="#b85450">孤立</text>

  <!-- legend -->
  <rect x="30" y="355" width="12" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="47" y="365" font-size="10" fill="#555">可达</text>
  <rect x="90" y="355" width="12" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="107" y="365" font-size="10" fill="#555">不可达</text>
  <text x="280" y="365" text-anchor="middle" font-size="10" fill="#888">2 号房的钥匙只在 2 号房自己手里 → 自环，无外部入边</text>
</svg>
