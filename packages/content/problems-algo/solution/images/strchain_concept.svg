<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">前身关系与词链示意</text>

  <!-- 前身定义 -->
  <text x="40" y="58" font-size="11.5" fill="#888">前身（predecessor）：在 wordA 任意位置插入恰好一个字母得到 wordB</text>

  <rect x="40" y="70" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="95" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">"a"</text>

  <path d="M 260 90 L 300 90" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="84" text-anchor="middle" font-size="10" fill="#888">插入 'b'</text>

  <rect x="300" y="70" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="410" y="95" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">"ba"</text>

  <text x="280" y="128" text-anchor="middle" font-size="10.5" fill="#888">"a" 是 "ba" 的前身（在 a 前插入 b）</text>

  <!-- 反例 -->
  <rect x="40" y="142" width="220" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="150" y="164" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">"cba"</text>

  <path d="M 260 159 L 300 159" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="280" y="153" text-anchor="middle" font-size="10" fill="#b85450">顺序变了 ✗</text>

  <rect x="300" y="142" width="220" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="410" y="164" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">"bcad"</text>

  <text x="280" y="192" text-anchor="middle" font-size="10.5" fill="#b85450">"cba" 不是 "bcad" 的前身（字母顺序被改变）</text>

  <!-- 分隔线 -->
  <path d="M 60 206 L 500 206" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- 词链示例 -->
  <text x="280" y="228" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">词链：每个词是下一个词的前身</text>

  <rect x="30" y="244" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="70" y="267" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">"a"</text>

  <path d="M 110 262 L 130 262" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="244" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="170" y="267" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">"ba"</text>

  <path d="M 210 262 L 230 262" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="230" y="244" width="100" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="267" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">"bda"</text>

  <path d="M 330 262 L 350 262" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="350" y="244" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="410" y="267" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">"bdca"</text>

  <!-- 长度标注 -->
  <text x="70" y="296" text-anchor="middle" font-size="10" fill="#888">len=1</text>
  <text x="170" y="296" text-anchor="middle" font-size="10" fill="#888">len=2</text>
  <text x="280" y="296" text-anchor="middle" font-size="10" fill="#888">len=3</text>
  <text x="410" y="296" text-anchor="middle" font-size="10" fill="#888">len=4</text>

  <!-- 链长 -->
  <rect x="60" y="312" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">词链长度 = 4（最长可能长度）</text>

  <!-- 关键提示 -->
  <rect x="40" y="360" width="480" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="11.5" fill="#333">按长度从短到长处理，每个词删一个字符找前身</text>
  <text x="280" y="398" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">dp[word] = max(dp[predecessor] + 1)</text>
</svg>
