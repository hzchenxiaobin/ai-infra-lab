<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：预处理 cnt 表 + 二维 DP</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">W = words.length，m = words[i].length，n = target.length</text>

  <!-- Step 1: 预处理 -->
  <rect x="60" y="60" width="440" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="76" y="80" font-size="12" fill="#446688" font-weight="bold">① 预处理 cnt[j][c]</text>
  <text x="76" y="96" font-size="10" fill="#444">遍历每个 word，统计第 j 列各字符 c 的出现次数。O(W × m)</text>

  <path d="M 280 108 L 280 118" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: 初始化 -->
  <rect x="60" y="120" width="440" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="76" y="140" font-size="12" fill="#4a7a3a" font-weight="bold">② 初始化 DP 表</text>
  <text x="76" y="156" font-size="10" fill="#444">dp[0][j] = 1（∀j，空 target 唯一 1 种）；dp[i][0] = 0（i ≥ 1，无列可用）</text>

  <path d="M 280 168 L 280 178" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: 外层循环 -->
  <rect x="60" y="180" width="440" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="76" y="200" font-size="12" fill="#d6a040" font-weight="bold">③ 外层循环 i = 1 … n</text>
  <text x="76" y="216" font-size="10" fill="#444">逐个处理 target 的字符 target[i−1]，i 从 1 到 n</text>

  <path d="M 280 228 L 280 238" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: 内层循环 -->
  <rect x="60" y="240" width="440" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="76" y="260" font-size="12" fill="#d6a040" font-weight="bold">④ 内层循环 j = 1 … m</text>
  <text x="76" y="276" font-size="10" fill="#444">逐列扫描，决定第 j−1 列是否用于 target[i−1]</text>

  <path d="M 280 288 L 280 298" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: 递推（高亮） -->
  <rect x="40" y="300" width="480" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="56" y="322" font-size="12" fill="#b85450" font-weight="bold">⑤ 状态转移（核心递推，取模 10⁹+7）</text>
  <text x="56" y="342" font-size="11" fill="#333">dp[i][j] = ( dp[i][j−1] + dp[i−1][j−1] × cnt[j−1][ target[i−1] ] ) % MOD</text>
  <text x="56" y="358" font-size="10" fill="#888">跳过第 j−1 列            用第 j−1 列匹配 target[i−1]</text>

  <path d="M 280 364 L 280 372" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6: 返回 -->
  <rect x="60" y="374" width="440" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="398" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">⑥ 返回 dp[n][m]（答案）</text>

  <!-- 回环箭头：内层循环回到外层 -->
  <path d="M 500 263 Q 530 210 500 198" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="3 2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="535" y="232" font-size="9" fill="#d6a040" font-weight="bold">j+1</text>
  <path d="M 500 203 Q 540 160 500 201" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="3 2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="548" y="183" font-size="9" fill="#d6a040" font-weight="bold">i+1</text>
</svg>
