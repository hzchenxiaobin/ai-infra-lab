<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrU" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="36" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">一轮的净消耗 = 4 升</text>

  <!-- 主油箱竖条 -->
  <rect x="80" y="80" width="90" height="220" fill="#e8f0fe"
        stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="125" y="72" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">主油箱</text>

  <!-- 5 升烧掉（向下箭头） -->
  <line x1="125" y1="100" x2="125" y2="180" stroke="#b85450" stroke-width="3"
        marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="180" y="140" font-size="13" fill="#b85450" filter="url(#rough2)">烧 5 升</text>
  <text x="180" y="158" font-size="13" fill="#b85450" filter="url(#rough2)">+ 50 km</text>

  <!-- 转移 1 升回来（向上箭头） -->
  <line x1="125" y1="270" x2="125" y2="210" stroke="#4a7a3a" stroke-width="3"
        marker-end="url(#arrU)" filter="url(#rough2)"/>
  <text x="180" y="235" font-size="13" fill="#4a7a3a" filter="url(#rough2)">回流 1 升</text>
  <text x="180" y="253" font-size="13" fill="#4a7a3a" filter="url(#rough2)">(add - 1)</text>

  <!-- 净消耗 -->
  <rect x="350" y="150" width="130" height="60" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="415" y="178" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">净消耗 4 升</text>
  <text x="415" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">5 - 1 = 4</text>

  <!-- 等号连接 -->
  <path d="M175,180 L345,180" fill="none" stroke="#999" stroke-width="1.5"
        stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- 轮数公式 -->
  <rect x="70" y="310" width="380" height="40" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="335" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">轮数 r = min( (main-1)//4 , add )</text>
</svg>
