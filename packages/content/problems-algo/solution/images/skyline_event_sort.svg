<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="760" height="470" fill="#fafafa"/>
  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">事件编码与同 x 拼接规则</text>
  <path d="M 250 42 Q 380 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 顶部：建筑拆成两个事件 -->
  <g filter="url(#sk)">
    <rect x="300" y="58" width="160" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="380" y="78" text-anchor="middle" font-size="13" fill="#333">建筑 [L, R, H]</text>
  <text x="380" y="94" text-anchor="middle" font-size="11" fill="#666">例：[2, 9, 10]</text>

  <!-- 左箭头到进入事件 -->
  <path d="M 340 104 Q 260 130 200 150" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <!-- 右箭头到离开事件 -->
  <path d="M 420 104 Q 500 130 560 150" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 进入事件 chip -->
  <g filter="url(#sk)">
    <rect x="120" y="150" width="160" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="200" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">进入事件 (L, −H)</text>
  <text x="200" y="190" text-anchor="middle" font-size="11" fill="#333">=(2, −10)，高度入堆</text>

  <!-- 离开事件 chip -->
  <g filter="url(#sk)">
    <rect x="480" y="150" width="160" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="560" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040">离开事件 (R, +H)</text>
  <text x="560" y="190" text-anchor="middle" font-size="11" fill="#333">=(9, +10)，高度出堆</text>

  <!-- 排序后事件序列 -->
  <text x="380" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">按 (x, h) 升序排序后（负=进入，正=离开）</text>
  <g font-size="10" fill="#333">
    <!-- 10 个 chip -->
    <g filter="url(#sk)"><rect x="30"  y="246" width="62" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <text x="61"  y="263" text-anchor="middle">(2,−10)</text>
    <g filter="url(#sk)"><rect x="100" y="246" width="62" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <text x="131" y="263" text-anchor="middle">(3,−15)</text>
    <g filter="url(#sk)"><rect x="170" y="246" width="62" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <text x="201" y="263" text-anchor="middle">(5,−12)</text>
    <g filter="url(#sk)"><rect x="240" y="246" width="62" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
    <text x="271" y="263" text-anchor="middle">(7,+15)</text>
    <g filter="url(#sk)"><rect x="310" y="246" width="62" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
    <text x="341" y="263" text-anchor="middle">(9,+10)</text>
    <g filter="url(#sk)"><rect x="380" y="246" width="62" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
    <text x="411" y="263" text-anchor="middle">(12,+12)</text>
    <g filter="url(#sk)"><rect x="450" y="246" width="62" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <text x="481" y="263" text-anchor="middle">(15,−10)</text>
    <g filter="url(#sk)"><rect x="520" y="246" width="62" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <text x="551" y="263" text-anchor="middle">(19,−8)</text>
    <g filter="url(#sk)"><rect x="590" y="246" width="62" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
    <text x="621" y="263" text-anchor="middle">(20,+10)</text>
    <g filter="url(#sk)"><rect x="660" y="246" width="62" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
    <text x="691" y="263" text-anchor="middle">(24,+8)</text>
  </g>

  <!-- 分隔线 -->
  <line x1="40" y1="296" x2="720" y2="296" stroke="#ccc" stroke-width="1" stroke-dasharray="3 3" filter="url(#sk)"/>
  <text x="380" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">同 x 处三种情况：一个排序键全部搞定</text>

  <!-- 三列 -->
  <!-- 列1：都是进入 → 高的先 -->
  <text x="135" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">都是进入 → 高的先</text>
  <g filter="url(#sk)"><rect x="70" y="356" width="130" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="135" y="375" text-anchor="middle" font-size="11" fill="#333">(x, −15) 高的先进</text>
  <path d="M 135 388 L 135 402" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="70" y="406" width="130" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="135" y="425" text-anchor="middle" font-size="11" fill="#333">(x, −8) 矮的后进</text>
  <text x="135" y="452" text-anchor="middle" font-size="10" fill="#888">堆顶立刻=15，矮的不影响</text>

  <!-- 列2：都是离开 → 矮的先 -->
  <text x="380" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040">都是离开 → 矮的先</text>
  <g filter="url(#sk)"><rect x="315" y="356" width="130" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="380" y="375" text-anchor="middle" font-size="11" fill="#333">(x, +8) 矮的先删</text>
  <path d="M 380 388 L 380 402" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="315" y="406" width="130" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="380" y="425" text-anchor="middle" font-size="11" fill="#333">(x, +15) 高的后删</text>
  <text x="380" y="452" text-anchor="middle" font-size="10" fill="#888">矮的先走，堆顶仍=15</text>

  <!-- 列3：一进一离 → 进入先 -->
  <text x="625" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">一进一离 → 进入先</text>
  <g filter="url(#sk)"><rect x="560" y="356" width="130" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="625" y="375" text-anchor="middle" font-size="11" fill="#333">(x, −10) 进入先</text>
  <path d="M 625 388 L 625 402" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="560" y="406" width="130" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="625" y="425" text-anchor="middle" font-size="11" fill="#333">(x, +10) 离开后</text>
  <text x="625" y="452" text-anchor="middle" font-size="10" fill="#888">先加再删，堆顶始终=10</text>
</svg>
