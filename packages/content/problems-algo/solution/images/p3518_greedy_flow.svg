<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 512"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="512" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">流程：逐位贪心 + 组合数跳段</text>

  <!-- 起点 -->
  <rect x="170" y="32" width="180" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="52" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">取前半计数 cnt，T = m</text>
  <path d="M 260 62 L 260 76" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 初始计数 -->
  <rect x="150" y="80" width="220" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="101" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">A = m! / ∏ cnt(i)!</text>
  <path d="M 260 112 L 260 122" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 判空 -->
  <polygon points="260,126 355,160 260,194 165,160" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="165" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">A &lt; k ?</text>
  <path d="M 355 160 L 390 160" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="372" y="152" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="394" y="144" width="96" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="442" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 ""</text>
  <path d="M 260 194 L 260 214" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="273" y="208" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 枚举候选字符 -->
  <rect x="115" y="218" width="290" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">当前位从 'a' 起枚举 c（cnt[c] &gt; 0）</text>
  <path d="M 260 252 L 260 262" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 增量公式 -->
  <rect x="140" y="266" width="240" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="287" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">A' = A · cnt[c] / T</text>
  <text x="390" y="287" text-anchor="start" font-size="10" fill="#888" filter="url(#rough2)">（恒为整数）</text>
  <path d="M 260 298 L 260 312" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 判定 A' >= k ? -->
  <polygon points="260,316 365,356 260,396 155,356" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="361" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">A' ≥ k ?</text>

  <!-- 是：固定 c -->
  <path d="M 155 356 L 95 356 L 95 408" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="122" y="347" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="28" y="412" width="212" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="134" y="431" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">固定 c：A ← A'</text>
  <text x="134" y="450" text-anchor="middle" font-size="11" fill="#2a5a2a" filter="url(#rough2)">cnt[c]−1，T−1</text>

  <!-- 否：跳段 -->
  <path d="M 365 356 L 420 356 L 420 408" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="394" y="347" text-anchor="middle" font-size="11" fill="#8a6d3a" filter="url(#rough2)">否</text>
  <rect x="284" y="412" width="210" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="389" y="431" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">k ← k − A'</text>
  <text x="389" y="450" text-anchor="middle" font-size="11" fill="#8a6d3a" filter="url(#rough2)">跳过 c 开头整段，试下一个 c</text>

  <!-- 回环：下一位 -->
  <path d="M 28 435 L 10 435 L 10 235 L 111 235" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="16" y="300" text-anchor="start" font-size="10" fill="#4a7a3a" filter="url(#rough2)">下一位</text>
  <!-- 回环：换候选 -->
  <path d="M 494 435 L 510 435 L 510 235 L 409 235" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="506" y="300" text-anchor="end" font-size="10" fill="#8a6d3a" filter="url(#rough2)">换候选</text>

  <!-- 填满出口 -->
  <path d="M 134 458 L 134 470" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="144" y="468" text-anchor="start" font-size="9.5" fill="#666" filter="url(#rough2)">m 位填满</text>
  <rect x="100" y="474" width="320" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="494" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">输出 half + 中心 + reverse(half)</text>
</svg>
