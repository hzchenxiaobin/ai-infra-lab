<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="370" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [2,3,4,7], maximumBit = 3, mask = 7</text>
  <text x="310" y="42" text-anchor="middle" font-size="11" fill="#888">总异或 cur₀ = 2 ⊕ 3 ⊕ 4 ⊕ 7 = 2 (010)；从右到左逐个剔除</text>

  <!-- Header -->
  <text x="25" y="74" font-size="11" fill="#888" font-weight="bold">查询</text>
  <text x="133" y="74" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">当前数组</text>
  <text x="252" y="74" font-size="11" fill="#888" font-weight="bold">cur</text>
  <text x="355" y="74" font-size="11" fill="#888" font-weight="bold">k = cur⊕mask</text>
  <text x="475" y="74" font-size="11" fill="#888" font-weight="bold">cur ⊕ k</text>
  <line x1="20" y1="82" x2="600" y2="82" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Row 0: query 0, all active, remove 7 ===== -->
  <text x="35" y="124" font-size="12" fill="#446688" font-weight="bold">Q0</text>
  <!-- cells: 2,3,4 active; 7 red-dashed (to remove) -->
  <rect x="60" y="100" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="124" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="102" y="100" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="124" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="144" y="100" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="124" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="186" y="100" width="40" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="206" y="124" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">7</text>
  <text x="206" y="94" text-anchor="middle" font-size="9" fill="#b85450">删</text>
  <text x="252" y="120" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="252" y="134" font-size="10" fill="#888">010</text>
  <text x="355" y="120" font-size="12" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="355" y="134" font-size="10" fill="#888">101</text>
  <text x="475" y="120" font-size="12" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="475" y="134" font-size="10" fill="#888">111</text>

  <!-- ===== Row 1: 7 removed(grey), remove 4. cur = 2⊕7 = 5 ===== -->
  <text x="35" y="180" font-size="12" fill="#446688" font-weight="bold">Q1</text>
  <rect x="60" y="156" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="180" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="102" y="156" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="180" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="144" y="156" width="40" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="164" y="180" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">4</text>
  <text x="164" y="150" text-anchor="middle" font-size="9" fill="#b85450">删</text>
  <rect x="186" y="156" width="40" height="38" fill="#eeeeee" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="206" y="180" text-anchor="middle" font-size="14" fill="#aaaaaa" font-weight="bold">7</text>
  <line x1="190" y1="175" x2="222" y2="175" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="252" y="176" font-size="12" fill="#446688" font-weight="bold">5</text>
  <text x="252" y="190" font-size="10" fill="#888">101</text>
  <text x="355" y="176" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="355" y="190" font-size="10" fill="#888">010</text>
  <text x="475" y="176" font-size="12" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="475" y="190" font-size="10" fill="#888">111</text>

  <!-- ===== Row 2: 7,4 greyed; remove 3. cur = 5⊕4 = 1 ===== -->
  <text x="35" y="236" font-size="12" fill="#446688" font-weight="bold">Q2</text>
  <rect x="60" y="212" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="236" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="102" y="212" width="40" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="122" y="236" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">3</text>
  <text x="122" y="206" text-anchor="middle" font-size="9" fill="#b85450">删</text>
  <rect x="144" y="212" width="40" height="38" fill="#eeeeee" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="164" y="236" text-anchor="middle" font-size="14" fill="#aaaaaa" font-weight="bold">4</text>
  <line x1="150" y1="231" x2="178" y2="231" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="186" y="212" width="40" height="38" fill="#eeeeee" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="206" y="236" text-anchor="middle" font-size="14" fill="#aaaaaa" font-weight="bold">7</text>
  <line x1="192" y1="231" x2="220" y2="231" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="252" y="232" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="252" y="246" font-size="10" fill="#888">001</text>
  <text x="355" y="232" font-size="12" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="355" y="246" font-size="10" fill="#888">110</text>
  <text x="475" y="232" font-size="12" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="475" y="246" font-size="10" fill="#888">111</text>

  <!-- ===== Row 3: 7,4,3 greyed; remove 2. cur = 1⊕3 = 2 ===== -->
  <text x="35" y="292" font-size="12" fill="#446688" font-weight="bold">Q3</text>
  <rect x="60" y="268" width="40" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="292" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>
  <text x="80" y="262" text-anchor="middle" font-size="9" fill="#b85450">删</text>
  <rect x="102" y="268" width="40" height="38" fill="#eeeeee" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="122" y="292" text-anchor="middle" font-size="14" fill="#aaaaaa" font-weight="bold">3</text>
  <line x1="108" y1="287" x2="136" y2="287" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="144" y="268" width="40" height="38" fill="#eeeeee" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="164" y="292" text-anchor="middle" font-size="14" fill="#aaaaaa" font-weight="bold">4</text>
  <line x1="150" y1="287" x2="178" y2="287" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="186" y="268" width="40" height="38" fill="#eeeeee" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="206" y="292" text-anchor="middle" font-size="14" fill="#aaaaaa" font-weight="bold">7</text>
  <line x1="192" y1="287" x2="220" y2="287" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="252" y="288" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="252" y="302" font-size="10" fill="#888">010</text>
  <text x="355" y="288" font-size="12" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="355" y="302" font-size="10" fill="#888">101</text>
  <text x="475" y="288" font-size="12" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="475" y="302" font-size="10" fill="#888">111</text>

  <!-- separator -->
  <line x1="20" y1="318" x2="600" y2="318" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- answer -->
  <rect x="180" y="328" width="260" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="348" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">答案 = [5, 2, 6, 5]  ✓  每步 cur⊕k 恒为 7 = mask</text>
</svg>
