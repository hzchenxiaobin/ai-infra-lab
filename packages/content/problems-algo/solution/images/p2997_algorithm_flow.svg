<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一趟异或 → 差异掩码 → 数 1</text>

  <!-- 开始 -->
  <rect x="100" y="34" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="140" y="52" text-anchor="middle" font-size="12" fill="#33507a" filter="url(#rough2)">开始</text>
  <path d="M 140 60 L 140 72" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- x = 0 -->
  <rect x="76" y="76" width="128" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="95" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#rough2)">x = 0（异或和）</text>
  <path d="M 140 104 L 140 116" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取元素 -->
  <rect x="58" y="120" width="164" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="141" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#rough2)">取出下一个元素 v，x ^= v</text>
  <path d="M 140 152 L 140 166" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：遍历完？ -->
  <polygon points="140,170 218,198 140,226 62,198" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="195" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">遍历完？</text>
  <text x="140" y="211" text-anchor="middle" font-size="9.5" fill="#7a5a10" filter="url(#rough2)">（还剩元素吗）</text>

  <!-- 否：回环 -->
  <path d="M 62 198 L 30 198 L 30 136 L 54 136" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="44" y="188" text-anchor="middle" font-size="9.5" fill="#33507a" filter="url(#rough2)">否</text>

  <!-- 是 → d = x ^ k -->
  <path d="M 140 226 L 140 240" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="238" font-size="10.5" fill="#888" filter="url(#rough2)">是</text>

  <rect x="66" y="244" width="148" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="140" y="263" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">d = x ^ k（差异掩码）</text>
  <path d="M 140 272 L 140 284" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ans = popcount -->
  <rect x="56" y="288" width="168" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="140" y="308" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">ans = popcount(d)</text>
  <path d="M 140 318 L 140 328" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="84" y="330" width="112" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="140" y="348" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">返回 ans</text>

  <!-- 右侧要点框 -->
  <rect x="300" y="60" width="196" height="150" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="398" y="84" text-anchor="middle" font-size="11.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">要点</text>
  <text x="398" y="106" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">X = 各位 1 的个数的奇偶校验</text>
  <text x="398" y="126" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">一次操作 ⟺ X 翻转恰一位</text>
  <text x="398" y="146" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">差异位互不干扰，各需 1 次</text>
  <text x="398" y="166" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">答案 = popcount(X ⊕ k)</text>
  <text x="398" y="186" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">= X 与 k 的汉明距离</text>

  <!-- 右下补充框 -->
  <rect x="300" y="240" width="196" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="398" y="262" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">C++: __builtin_popcount</text>
  <text x="398" y="280" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">Python: (x^k).bit_count()</text>
  <text x="398" y="298" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">（低位版：bin().count('1')）</text>
</svg>
