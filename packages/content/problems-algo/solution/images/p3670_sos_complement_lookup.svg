<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#555" stroke-width="1.8" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：最佳搭档 = 子集最大值表里查补集</text>

  <!-- Row A: x = 3 -->
  <text x="52" y="99" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">x = 3</text>
  <rect x="160" y="70" width="34" height="34" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="177" y="93" text-anchor="middle" font-size="15" fill="#777" filter="url(#rough2)">0</text>
  <rect x="198" y="70" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="215" y="93" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c4257" filter="url(#rough2)">1</text>
  <rect x="236" y="70" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="253" y="93" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c4257" filter="url(#rough2)">1</text>
  <text x="177" y="121" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="215" y="121" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="253" y="121" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="330" y="85" font-size="11.5" fill="#555" filter="url(#rough2)">值 &lt; 2²⁰</text>
  <text x="330" y="103" font-size="11.5" fill="#555" filter="url(#rough2)">数本身就是掩码</text>

  <!-- arrow down -->
  <path d="M 205 128 L 205 158" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="216" y="148" font-size="11" fill="#666" filter="url(#rough2)">在全集 U = 2²⁰−1 内取补</text>

  <!-- Row B: complement mask -->
  <text x="46" y="195" font-size="14" font-weight="bold" fill="#2e4d24" filter="url(#rough2)">cm = U ⊕ x</text>
  <rect x="160" y="168" width="28" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e4d24" filter="url(#rough2)">1</text>
  <rect x="192" y="168" width="28" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="206" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e4d24" filter="url(#rough2)">1</text>
  <rect x="224" y="168" width="28" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e4d24" filter="url(#rough2)">1</text>
  <rect x="256" y="168" width="28" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e4d24" filter="url(#rough2)">1</text>
  <rect x="288" y="168" width="28" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e4d24" filter="url(#rough2)">1</text>
  <text x="332" y="191" text-anchor="middle" font-size="16" fill="#666" filter="url(#rough2)">⋯</text>
  <rect x="348" y="168" width="28" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="362" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e4d24" filter="url(#rough2)">1</text>
  <rect x="384" y="168" width="28" height="34" fill="#ffffff" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="398" y="190" text-anchor="middle" font-size="14" fill="#a07820" filter="url(#rough2)">0</text>
  <rect x="416" y="168" width="28" height="34" fill="#ffffff" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="190" text-anchor="middle" font-size="14" fill="#a07820" filter="url(#rough2)">0</text>
  <text x="414" y="219" text-anchor="middle" font-size="10.5" fill="#a07820" filter="url(#rough2)">x 的 1 ⇒ 这里必为 0</text>

  <!-- Row C: dp meaning + lookup -->
  <rect x="30" y="248" width="270" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="165" y="272" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4257" filter="url(#rough2)">SOS 传播后的 dp：</text>
  <text x="165" y="294" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">dp[m] = 1 全部落在 m 里的最大数</text>
  <path d="M 304 277 L 336 277" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="340" y="248" width="152" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="416" y="272" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e4d24" filter="url(#rough2)">查表 dp[cm]</text>
  <text x="416" y="294" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">= 4（100）</text>

  <!-- Row D: result -->
  <rect x="105" y="336" width="310" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5c10" filter="url(#rough2)">3 × 4 = 12（011 &amp; 100 = 0）</text>
</svg>
