<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：L 只能左移、R 只能右移，二者互不穿越</text>

  <!-- Operation 1: XL -> LX (L moves left) -->
  <text x="40" y="62" font-size="12" fill="#888">操作一：XL → LX</text>
  <rect x="120" y="46" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="66" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">X</text>
  <rect x="156" y="46" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="174" y="66" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">L</text>

  <path d="M 205 61 L 245 61" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="225" y="40" text-anchor="middle" font-size="10" fill="#4a7a3a">L 左移</text>

  <rect x="250" y="46" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="66" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">L</text>
  <rect x="286" y="46" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="304" y="66" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">X</text>

  <text x="370" y="66" font-size="11" fill="#666">L 从右走到左，穿过 X</text>

  <!-- Operation 2: RX -> XR (R moves right) -->
  <text x="40" y="112" font-size="12" fill="#888">操作二：RX → XR</text>
  <rect x="120" y="96" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="138" y="116" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">R</text>
  <rect x="156" y="96" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="116" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">X</text>

  <path d="M 205 111 L 245 111" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="225" y="90" text-anchor="middle" font-size="10" fill="#4a7a3a">R 右移</text>

  <rect x="250" y="96" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="268" y="116" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">X</text>
  <rect x="286" y="96" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="304" y="116" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">R</text>

  <text x="370" y="116" font-size="11" fill="#666">R 从左走到右，穿过 X</text>

  <!-- Separator -->
  <path d="M 40 150 L 520 150" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- L and R cannot cross -->
  <text x="40" y="178" font-size="12" fill="#888">禁止：L 与 R 互相穿越</text>

  <rect x="120" y="162" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="138" y="182" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">R</text>
  <rect x="156" y="162" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="174" y="182" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">L</text>

  <path d="M 205 177 L 245 177" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="225" y="156" text-anchor="middle" font-size="10" fill="#b85450">不可能！</text>

  <rect x="250" y="162" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="182" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">L</text>
  <rect x="286" y="162" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="304" y="182" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">R</text>

  <text x="370" y="182" font-size="11" fill="#b85450">没有 LR→RL 操作</text>

  <!-- Key insight boxes -->
  <rect x="40" y="210" width="240" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="232" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">条件 1：去 X 后 L/R 序列相同</text>
  <text x="160" y="250" text-anchor="middle" font-size="11" fill="#666">L 和 R 相对顺序是不变量</text>

  <rect x="300" y="210" width="220" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="232" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">条件 2：方向约束</text>
  <text x="410" y="250" text-anchor="middle" font-size="11" fill="#666">L: end 下标 ≤ start 下标</text>
  <text x="410" y="262" text-anchor="middle" font-size="11" fill="#666">R: end 下标 ≥ start 下标</text>

  <!-- Character role legend -->
  <text x="40" y="296" font-size="12" fill="#888">三种字符的角色：</text>

  <rect x="40" y="304" width="150" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="115" y="320" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">L：主动左移</text>
  <text x="115" y="336" text-anchor="middle" font-size="10" fill="#888">只能与左边的 X 交换</text>

  <rect x="205" y="304" width="150" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">R：主动右移</text>
  <text x="280" y="336" text-anchor="middle" font-size="10" fill="#888">只能与右边的 X 交换</text>

  <rect x="370" y="304" width="150" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="445" y="320" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">X：被动空位</text>
  <text x="445" y="336" text-anchor="middle" font-size="10" fill="#888">供 L/R 移动的空槽</text>

  <!-- Bottom summary -->
  <rect x="40" y="356" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="378" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">X 只是空位 → 去掉 X 比对 L/R 顺序 + 校验方向 = 充要条件</text>
</svg>
