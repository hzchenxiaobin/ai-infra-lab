<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：单改一个数可达差值 [0, M]，单对代价只有 0 / 1 / 2 三档</text>

  <!-- 左：四种单改 -->
  <rect x="20" y="42" width="234" height="176" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="137" y="64" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">一对 (a, b) 的四种「单改」</text>

  <rect x="34" y="74" width="206" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="137" y="90" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">改 a→0，差值可到 b</text>

  <rect x="34" y="102" width="206" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="137" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">改 a→k，差值可到 k−b</text>

  <rect x="34" y="130" width="206" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="137" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">改 b→0，差值可到 a</text>

  <rect x="34" y="158" width="206" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="137" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">改 b→k，差值可到 k−a</text>

  <rect x="34" y="186" width="206" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="137" y="202" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">M = max(a, b, k−a, k−b)</text>

  <!-- 右：数轴视角 -->
  <rect x="274" y="42" width="226" height="176" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="387" y="64" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">数轴视角（值域 [0, k]）</text>

  <rect x="292" y="82" width="150" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="367" y="93" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">单改覆盖 [0, M]</text>
  <rect x="442" y="82" width="40" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="462" y="93" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">两改</text>

  <path d="M 292 118 L 486 118" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 292 112 L 292 124" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 340 114 L 340 122" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 412 114 L 412 122" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="292" y="138" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">0</text>
  <text x="340" y="138" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">a</text>
  <text x="412" y="138" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">b</text>
  <text x="482" y="138" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">k</text>

  <text x="387" y="164" text-anchor="middle" font-size="10.5" fill="#8a6d1a" filter="url(#rough2)">a 与 k−a 必有一个 ≥ k/2</text>
  <text x="387" y="182" text-anchor="middle" font-size="10.5" fill="#8a6d1a" filter="url(#rough2)">⇒ M ≥ ⌈k/2⌉ 恒成立</text>
  <text x="387" y="202" text-anchor="middle" font-size="10.5" fill="#8a6d1a" filter="url(#rough2)">⇒ X ≤ ⌈k/2⌉ 时没有两改对</text>

  <!-- 下：代价三档 -->
  <rect x="20" y="234" width="480" height="112" fill="#ffffff" stroke="#888888" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="256" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">固定目标 X 后，单对 (a, b) 的修改次数（d = |a−b|）</text>

  <rect x="36" y="266" width="448" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="281" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">X = d　　　　 → 0 次（本来就是目标差值，白嫖）</text>

  <rect x="36" y="292" width="448" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="307" text-anchor="middle" font-size="11" fill="#8a6d1a" filter="url(#rough2)">X ≤ M 且 X ≠ d → 1 次（改一个数即可送到位）</text>

  <rect x="36" y="318" width="448" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="333" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">X &gt; M　　　　→ 2 次（两个都改：a′ = X，b′ = 0）</text>
</svg>
