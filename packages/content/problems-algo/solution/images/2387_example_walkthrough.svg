<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：grid = [[1,1,2],[2,3,3],[1,3,4]]</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888">N = 3×3 = 9，target = N/2 = 4，找最小 value 使 cnt(≤value) &gt; 4</text>

  <!-- 列宽：轮次52 lo,hi76 mid50 c0 60 c1 60 c2 60 cnt 62 cmp 62 更新 78 = 560, x: 20..580 -->
  <!-- 表头 -->
  <rect x="20" y="64" width="560" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <line x1="72" y1="64" x2="72" y2="98" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="148" y1="64" x2="148" y2="98" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="198" y1="64" x2="198" y2="98" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="258" y1="64" x2="258" y2="98" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="318" y1="64" x2="318" y2="98" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="378" y1="64" x2="378" y2="98" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="440" y1="64" x2="440" y2="98" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="502" y1="64" x2="502" y2="98" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="46" y="86" text-anchor="middle" font-size="11" fill="#335" font-weight="bold" filter="url(#rough2)">轮次</text>
  <text x="110" y="86" text-anchor="middle" font-size="11" fill="#335" font-weight="bold" filter="url(#rough2)">lo, hi</text>
  <text x="173" y="86" text-anchor="middle" font-size="11" fill="#335" font-weight="bold" filter="url(#rough2)">mid</text>
  <text x="228" y="86" text-anchor="middle" font-size="10.5" fill="#335" font-weight="bold" filter="url(#rough2)">行0计</text>
  <text x="288" y="86" text-anchor="middle" font-size="10.5" fill="#335" font-weight="bold" filter="url(#rough2)">行1计</text>
  <text x="348" y="86" text-anchor="middle" font-size="10.5" fill="#335" font-weight="bold" filter="url(#rough2)">行2计</text>
  <text x="409" y="86" text-anchor="middle" font-size="11" fill="#335" font-weight="bold" filter="url(#rough2)">cnt</text>
  <text x="471" y="86" text-anchor="middle" font-size="10.5" fill="#335" font-weight="bold" filter="url(#rough2)">cnt&gt;4?</text>
  <text x="541" y="86" text-anchor="middle" font-size="11" fill="#335" font-weight="bold" filter="url(#rough2)">更新</text>

  <!-- 第 1 轮 -->
  <rect x="20" y="98" width="560" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <line x1="72" y1="98" x2="72" y2="136" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <line x1="148" y1="98" x2="148" y2="136" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <line x1="198" y1="98" x2="198" y2="136" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <line x1="258" y1="98" x2="258" y2="136" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <line x1="318" y1="98" x2="318" y2="136" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <line x1="378" y1="98" x2="378" y2="136" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <line x1="440" y1="98" x2="440" y2="136" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <line x1="502" y1="98" x2="502" y2="136" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="46" y="122" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="110" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1, 4</text>
  <text x="173" y="122" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="228" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="288" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="348" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="409" y="122" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="471" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是 ✓</text>
  <text x="541" y="122" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">hi=2</text>

  <!-- 第 2 轮 -->
  <rect x="20" y="136" width="560" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <line x1="72" y1="136" x2="72" y2="174" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <line x1="148" y1="136" x2="148" y2="174" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <line x1="198" y1="136" x2="198" y2="174" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <line x1="258" y1="136" x2="258" y2="174" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <line x1="318" y1="136" x2="318" y2="174" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <line x1="378" y1="136" x2="378" y2="174" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <line x1="440" y1="136" x2="440" y2="174" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <line x1="502" y1="136" x2="502" y2="174" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="46" y="160" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="110" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1, 2</text>
  <text x="173" y="160" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="228" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="288" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="348" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="409" y="160" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="471" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否 ✗</text>
  <text x="541" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">lo=2</text>

  <!-- 结束行 -->
  <rect x="20" y="174" width="560" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="199" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">lo == hi == 2 → 返回中位数 2 ✓</text>

  <!-- 计数细节说明 -->
  <rect x="40" y="232" width="520" height="120" fill="#fafafa" stroke="#ccc" stroke-width="1.2" stroke-dasharray="5,3" rx="8" filter="url(#rough2)"/>
  <text x="60" y="256" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">每行计数 = bisect_right(row, mid)：</text>
  <text x="60" y="278" font-size="10.5" fill="#555" filter="url(#rough2)">• mid=2：行0[1,1,2]→3，行1[2,3,3]→1，行2[1,3,4]→1，cnt=5 &gt; 4 → 缩右 hi=2</text>
  <text x="60" y="298" font-size="10.5" fill="#555" filter="url(#rough2)">• mid=1：行0[1,1,2]→2，行1[2,3,3]→0，行2[1,3,4]→1，cnt=3 &le; 4 → 缩左 lo=2</text>
  <text x="60" y="320" font-size="10.5" fill="#555" filter="url(#rough2)">• 排序扁平化 [1,1,1,2,2,3,3,3,4]，第 5 小（index 4）= 2，与二分结果一致</text>
  <text x="60" y="342" font-size="10.5" fill="#888" filter="url(#rough2)">  关键：min=min(首列)，max=max(末列)，二者覆盖全部元素</text>
</svg>
