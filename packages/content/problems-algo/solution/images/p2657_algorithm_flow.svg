<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：一趟扫描，维护频率与公共计数</text>

  <!-- Start -->
  <ellipse cx="260" cy="58" rx="40" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M260,74 L260,82" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="170" y="84" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cnt[1..n]=0；common=0；i=0</text>
  <path d="M260,114 L260,122" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond i<n -->
  <polygon points="260,124 322,150 260,176 198,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i &lt; n ?</text>

  <!-- 否 -> End (left) -->
  <path d="M198,150 L116,150" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="142" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <ellipse cx="62" cy="150" rx="48" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="154" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">返回 C</text>

  <!-- 是 -> p1 (down) -->
  <path d="M260,176 L260,194" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="188" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- p1 -->
  <rect x="150" y="196" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="217" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cnt[A[i]] += 1；若 ==2 则 common += 1</text>
  <path d="M260,230 L260,238" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- p2 -->
  <rect x="150" y="240" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="261" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cnt[B[i]] += 1；若 ==2 则 common += 1</text>
  <path d="M260,274 L260,282" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- p3 -->
  <rect x="150" y="284" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="305" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">C[i] = common；i += 1</text>

  <!-- loop back: p3 right -> up -> diamond right -->
  <path d="M370,301 L404,301 L404,150 L322,150" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="226" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">回到</text>
  <text x="416" y="240" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">判断</text>
  <text x="416" y="254" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i&lt;n</text>
</svg>
