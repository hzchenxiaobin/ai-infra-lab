<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="280" y="24" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">核心观察：字母 'a'+k 的质量为 2^k，总质量守恒</text>

    <!-- row 1: merge chains -->
    <rect x="55" y="46" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="68" y="64" text-anchor="middle" font-size="13" fill="#333">a</text>
    <rect x="85" y="46" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="98" y="64" text-anchor="middle" font-size="13" fill="#333">a</text>
    <path d="M 115 59 L 141 59" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none"/>
    <rect x="145" y="46" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="158" y="64" text-anchor="middle" font-size="13" fill="#333">b</text>
    <text x="113" y="90" text-anchor="middle" font-size="9.5" fill="#6b7f99">aa → b</text>

    <rect x="215" y="46" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="228" y="64" text-anchor="middle" font-size="13" fill="#333">b</text>
    <rect x="245" y="46" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="258" y="64" text-anchor="middle" font-size="13" fill="#333">b</text>
    <path d="M 275 59 L 301 59" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none"/>
    <rect x="305" y="46" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="318" y="64" text-anchor="middle" font-size="13" fill="#333">c</text>
    <text x="273" y="90" text-anchor="middle" font-size="9.5" fill="#6b7f99">bb → c</text>

    <rect x="375" y="46" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="388" y="64" text-anchor="middle" font-size="13" fill="#333">c</text>
    <rect x="405" y="46" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="418" y="64" text-anchor="middle" font-size="13" fill="#333">c</text>
    <path d="M 435 59 L 461 59" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none"/>
    <rect x="465" y="46" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="478" y="64" text-anchor="middle" font-size="13" fill="#333">d</text>
    <text x="433" y="90" text-anchor="middle" font-size="9.5" fill="#6b7f99">cc → d</text>

    <!-- row 2: mass table -->
    <text x="60" y="116" font-size="10.5" fill="#333" font-weight="bold">每个字母的质量 = 2^k，合并前后总质量不变：</text>

    <rect x="60" y="126" width="54" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="87" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
    <text x="87" y="166" text-anchor="middle" font-size="10" fill="#6b7f99">1</text>

    <rect x="122" y="126" width="54" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="149" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
    <text x="149" y="166" text-anchor="middle" font-size="10" fill="#6b7f99">2</text>

    <rect x="184" y="126" width="54" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="211" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
    <text x="211" y="166" text-anchor="middle" font-size="10" fill="#6b7f99">4</text>

    <rect x="246" y="126" width="54" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="273" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>
    <text x="273" y="166" text-anchor="middle" font-size="10" fill="#6b7f99">8</text>

    <rect x="308" y="126" width="54" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="335" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>
    <text x="335" y="166" text-anchor="middle" font-size="10" fill="#6b7f99">16</text>

    <text x="382" y="156" text-anchor="middle" font-size="15" fill="#6b7f99">…</text>

    <rect x="400" y="126" width="104" height="50" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="452" y="146" text-anchor="middle" font-size="13" fill="#8a3a35" font-weight="bold">z</text>
    <text x="452" y="166" text-anchor="middle" font-size="10" fill="#b85450">2^25（封顶）</text>

    <!-- row 3: greedy demo x = 9 -->
    <text x="60" y="216" font-size="11" fill="#333" font-weight="bold">贪心演算 x = 9：</text>
    <rect x="170" y="196" width="64" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="202" y="216" text-anchor="middle" font-size="11" fill="#2f5527">d = 8</text>
    <text x="246" y="216" text-anchor="middle" font-size="12" fill="#333">+</text>
    <rect x="258" y="196" width="64" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="290" y="216" text-anchor="middle" font-size="11" fill="#2f5527">a = 1</text>
    <path d="M 332 211 L 358 211" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none"/>
    <rect x="364" y="196" width="120" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="424" y="216" text-anchor="middle" font-size="13" fill="#8a3a35" font-weight="bold">"da"</text>
    <text x="60" y="252" font-size="9.5" fill="#333">r=9 → 取质量 ≤ 9 的最大块 8（字母 d）→ r=1 → 取 1（字母 a）→ r=0 结束</text>

    <!-- row 4: two note boxes -->
    <rect x="46" y="280" width="236" height="104" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="164" y="302" text-anchor="middle" font-size="11" fill="#2f5527" font-weight="bold">贪心：首位支配</text>
    <text x="60" y="322" font-size="9.5" fill="#2f5527">每步取「质量 ≤ 余量」的最大字母；</text>
    <text x="60" y="340" font-size="9.5" fill="#2f5527">首位放最大 ⇒ 逐位压制其他方案；</text>
    <text x="60" y="358" font-size="9.5" fill="#2f5527">同 x 两串质量相等，不会互为前缀，</text>
    <text x="60" y="376" font-size="9.5" fill="#2f5527">逐位比字母即可，「长者大」不触发。</text>

    <rect x="302" y="280" width="212" height="104" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="408" y="302" text-anchor="middle" font-size="11" fill="#8a3a35" font-weight="bold">'z' 封顶 ⇒ 多个 z</text>
    <text x="314" y="322" font-size="9.5" fill="#8a3a35">zz 不能合并 ⇒ 字母封顶 2^25；</text>
    <text x="314" y="340" font-size="9.5" fill="#8a3a35">余量 ≥ 2^25 时连取 'z'，共 x÷2^25 个；</text>
    <text x="314" y="358" font-size="9.5" fill="#8a3a35">尾部 = 余数的二进制（每字母至多一次）；</text>
    <text x="314" y="376" font-size="9.5" fill="#8a3a35">10^8 → "zzyxwvusqponi"（13 个字母）。</text>
  </g>
</svg>
