<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：新元素与"之前所有同值元素"各配成一对</text>

  <!-- Array label -->
  <text x="30" y="74" font-size="11" fill="#888">nums =</text>

  <!-- Array boxes -->
  <rect x="70" y="56" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="93" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="93" y="102" text-anchor="middle" font-size="9" fill="#888">i=0</text>

  <rect x="124" y="56" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="147" y="102" text-anchor="middle" font-size="9" fill="#888">i=1</text>

  <rect x="178" y="56" width="46" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="201" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="201" y="102" text-anchor="middle" font-size="9" fill="#888">i=2</text>

  <rect x="232" y="56" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="255" y="102" text-anchor="middle" font-size="9" fill="#888">i=3</text>

  <rect x="286" y="56" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="309" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="309" y="102" text-anchor="middle" font-size="9" fill="#888">i=4</text>

  <rect x="340" y="56" width="46" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="363" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="363" y="102" text-anchor="middle" font-size="9" fill="#888">i=5</text>

  <!-- Pair arcs (bottom of boxes y=88, curving down) -->
  <!-- (3,4) val=1 blue, shallow -->
  <path d="M 255 88 Q 282 114 309 88" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="282" y="118" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">(3,4)</text>

  <!-- (0,3) val=1 blue, medium -->
  <path d="M 93 88 Q 174 142 255 88" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="160" y="132" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">(0,3)</text>

  <!-- (0,4) val=1 blue, deep -->
  <path d="M 93 88 Q 201 178 309 88" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="186" y="168" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">(0,4)</text>

  <!-- (2,5) val=3 red, medium -->
  <path d="M 201 88 Q 282 154 363 88" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="322" y="148" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">(2,5)</text>

  <!-- Legend -->
  <rect x="430" y="56" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="450" y="67" font-size="10" fill="#666">值 1 → 3 对</text>
  <rect x="430" y="76" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="450" y="87" font-size="10" fill="#666">值 3 → 1 对</text>

  <!-- Divider -->
  <line x1="30" y1="206" x2="530" y2="206" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Observation -->
  <text x="30" y="230" font-size="12" fill="#444" font-weight="bold">观察：每条弧 = 一个好数对，共 4 条弧 = 4 个好数对 ✓</text>

  <!-- Key insight box -->
  <rect x="30" y="244" width="500" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="266" font-size="12" fill="#444" font-weight="bold">关键直觉：遍历到 nums[i] 时，之前已有 count[nums[i]] 个同值元素</text>
  <text x="50" y="286" font-size="11" fill="#666">这些元素每个都能与当前位置 i 配成一对（满足 i &lt; j 且值相等）</text>
  <text x="50" y="306" font-size="11" fill="#666">所以这一步新增的好数对数 = count[nums[i]]</text>
  <text x="50" y="328" font-size="12" fill="#b85450" font-weight="bold">→ 累加：ans += count[nums[i]]；然后计数自增：count[nums[i]]++</text>
  <text x="50" y="350" font-size="11" fill="#888">一次遍历即可统计全部好数对，无需两两枚举</text>
</svg>
