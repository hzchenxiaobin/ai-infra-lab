<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">核心观察：A(y) 分段线性，断点只在各 y_i 与 y_i+l_i 处（共 2n 个）</text>

  <!-- 左图：示例 1 的正方形与分割线 -->
  <text x="155" y="52" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">示例 1：[[0,0,1],[2,2,1]]</text>

  <path d="M60,60 L60,300 L250,300" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="66" font-size="10" fill="#888" filter="url(#rough2)">y</text>
  <text x="252" y="314" font-size="10" fill="#888" filter="url(#rough2)">x</text>
  <text x="52" y="264" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="52" y="224" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <text x="52" y="184" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">3</text>

  <!-- 平台带 [1,2]：任意水平线均可平分 -->
  <rect x="60" y="220" width="190" height="40" fill="#e6f4ea" opacity="0.55" filter="url(#rough2)"/>
  <text x="158" y="244" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">y ∈ [1,2] 任取 → 最小取 y=1</text>

  <!-- 两个单位正方形 -->
  <rect x="75" y="260" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="284" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">1×1</text>
  <rect x="190" y="180" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="204" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">1×1</text>

  <!-- 分割线 y* = 1 -->
  <path d="M40,260 L250,260" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="7,5" filter="url(#rough2)"/>
  <text x="38" y="256" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">y* = 1</text>

  <text x="140" y="172" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">线上并集面积 = 1</text>
  <text x="150" y="292" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">线下并集面积 = 1</text>
  <text x="155" y="332" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">T = 2（两块 1×1，无重叠）</text>

  <!-- 右图：A(y) 分段线性曲线 -->
  <text x="400" y="52" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">A(y)：线下并集面积曲线</text>

  <path d="M310,80 L310,300 L500,300" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="298" y="86" font-size="10" fill="#888" filter="url(#rough2)">A</text>
  <text x="502" y="314" font-size="10" fill="#888" filter="url(#rough2)">y</text>
  <text x="302" y="264" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="302" y="224" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">2</text>

  <!-- T/2 虚线 -->
  <path d="M310,260 L465,260" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="314" y="254" font-size="10" fill="#d6a040" filter="url(#rough2)">T/2 = 1</text>

  <!-- A(y) 曲线：(0,0)→(1,1)→(2,1)→(3,2)→平 -->
  <path d="M330,300 L370,260 L410,260 L450,220 L490,220" fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- 断点标记 -->
  <circle cx="410" cy="260" r="3" fill="#999" filter="url(#rough2)"/>
  <circle cx="450" cy="220" r="3" fill="#999" filter="url(#rough2)"/>
  <text x="440" y="180" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">断点（事件 y）</text>
  <path d="M444,186 L450,212" fill="none" stroke="#999" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 斜率标注 -->
  <text x="338" y="278" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">W=1</text>
  <text x="384" y="250" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">W=0（空隙）</text>
  <text x="424" y="236" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">W=1</text>
  <text x="468" y="212" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">W=0</text>

  <!-- 解 y* = 1 -->
  <circle cx="370" cy="260" r="5" fill="#b85450" filter="url(#rough2)"/>
  <path d="M370,260 L370,300" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,4" filter="url(#rough2)"/>
  <text x="380" y="278" font-size="11" fill="#b85450" filter="url(#rough2)">y* = 1</text>
  <text x="370" y="316" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="410" y="316" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="450" y="316" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>

  <text x="400" y="332" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">每段斜率 = 该高度区间的并集宽度 W</text>

  <rect x="55" y="341" width="410" height="15" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)" opacity="0.6"/>
</svg>
