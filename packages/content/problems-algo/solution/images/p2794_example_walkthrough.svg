<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)" font-weight="bold">示例 2 演算：keys=[1,"1",false], values=[4,5,6]</text>

  <!-- 步骤 1: i=0 -->
  <text x="30" y="62" font-size="12" fill="#446688" filter="url(#rough2)" font-weight="bold">i=0</text>
  <rect x="60" y="48" width="70" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="95" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">key=1</text>
  <path d="M 130 63 L 170 63" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="48" width="90" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="215" y="68" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">String(1)="1"</text>
  <path d="M 260 63 L 300 63" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="300" y="48" width="120" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{"1": 4}（新增）</text>

  <!-- 步骤 2: i=1 撞键 -->
  <text x="30" y="112" font-size="12" fill="#b85450" filter="url(#rough2)" font-weight="bold">i=1</text>
  <rect x="60" y="98" width="70" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="95" y="118" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">key="1"</text>
  <path d="M 130 113 L 170 113" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="98" width="100" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="118" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">String("1")="1"</text>
  <path d="M 270 113 L 300 113" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="300" y="98" width="160" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="118" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)" font-weight="bold">"1" 已在 → 覆盖为 5</text>

  <text x="478" y="118" font-size="10" fill="#b85450" filter="url(#rough2)">⚠ 撞键！</text>

  <!-- 步骤 3: i=2 -->
  <text x="30" y="162" font-size="12" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">i=2</text>
  <rect x="60" y="148" width="70" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="95" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">key=false</text>
  <path d="M 130 163 L 170 163" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="148" width="110" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="225" y="168" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">String(false)="false"</text>
  <path d="M 280 163 L 300 163" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="300" y="148" width="160" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{"1":5,"false":6}（新增）</text>

  <!-- 最终结果 -->
  <path d="M 360 198 L 360 232" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="220" font-size="11" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">最终</text>
  <rect x="180" y="236" width="360" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="262" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)" font-weight="bold">{"1": 5, "false": 6}  （2 个键，非 3 个）</text>

  <!-- 对照说明：JS vs Python -->
  <line x1="40" y1="300" x2="600" y2="300" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="320" y="322" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)" font-weight="bold">语言对照：键转换规则差异</text>

  <!-- JS 行 -->
  <rect x="40" y="336" width="270" height="120" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="175" y="356" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)" font-weight="bold">JS：对象键恒为字符串</text>
  <text x="56" y="378" font-size="11" fill="#333" filter="url(#rough2)">1 → "1"  和  "1" → "1" 撞键</text>
  <text x="56" y="398" font-size="11" fill="#333" filter="url(#rough2)">false → "false"</text>
  <text x="56" y="420" font-size="11" fill="#b85450" filter="url(#rough2)" font-weight="bold">→ 2 个键 {1, false}</text>
  <text x="56" y="442" font-size="9" fill="#999" filter="url(#rough2)">数字/布尔被隐式 String()</text>

  <!-- Python 行 -->
  <rect x="330" y="336" width="270" height="120" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="465" y="356" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)" font-weight="bold">Python：键保留类型身份</text>
  <text x="346" y="378" font-size="11" fill="#333" filter="url(#rough2)">1 与 "1" 类型不同→不撞键</text>
  <text x="346" y="398" font-size="11" fill="#333" filter="url(#rough2)">False 与 0 同键（== 且同哈希）</text>
  <text x="346" y="420" font-size="11" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">→ 3 个键 {1, "1", False}</text>
  <text x="346" y="442" font-size="9" fill="#999" filter="url(#rough2)">hash + __eq__ 决定撞键</text>
</svg>
