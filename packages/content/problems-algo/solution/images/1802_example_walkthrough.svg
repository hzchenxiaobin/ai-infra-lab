<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">示例演算：n=4, index=2, maxSum=6</text>

  <!-- ===== Candidate x=3 (infeasible) ===== -->
  <text x="40" y="58" font-size="12" fill="#b85450" font-weight="bold">尝试 x = 3（mid=3）:</text>

  <!-- baseline -->
  <line x1="60" y1="150" x2="300" y2="150" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- index marker -->
  <line x1="180" y1="62" x2="180" y2="150" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- bars: [2, 1, 3, 2], index=2 -->
  <!-- val=2 at index 0 -->
  <rect x="92" y="110" width="36" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="135" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <!-- val=1 at index 1 -->
  <rect x="136" y="135" width="36" height="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="148" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <!-- peak val=3 at index 2 -->
  <rect x="180" y="90" width="36" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="125" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <!-- val=2 at index 3 -->
  <rect x="224" y="110" width="36" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="135" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- index labels -->
  <text x="110" y="166" text-anchor="middle" font-size="9" fill="#999">0</text>
  <text x="154" y="166" text-anchor="middle" font-size="9" fill="#999">1</text>
  <text x="198" y="166" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2</text>
  <text x="242" y="166" text-anchor="middle" font-size="9" fill="#999">3</text>

  <!-- sum computation -->
  <rect x="300" y="80" width="230" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="415" y="100" text-anchor="middle" font-size="11" fill="#333">total = 3 + 3 + 2</text>
  <text x="415" y="118" text-anchor="middle" font-size="11" fill="#333">= 8 &gt; 6</text>
  <text x="415" y="136" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ 超出 maxSum → hi = 2</text>

  <!-- arrow down -->
  <path d="M 280 172 L 280 188" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Candidate x=2 (feasible) ===== -->
  <text x="40" y="208" font-size="12" fill="#4a7a3a" font-weight="bold">尝试 x = 2（mid=2）:</text>

  <!-- baseline -->
  <line x1="60" y1="300" x2="300" y2="300" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- index marker -->
  <line x1="180" y1="212" x2="180" y2="300" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- bars: [1, 1, 2, 1], index=2 -->
  <!-- val=1 at index 0 -->
  <rect x="92" y="285" width="36" height="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="298" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <!-- val=1 at index 1 -->
  <rect x="136" y="285" width="36" height="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="298" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <!-- peak val=2 at index 2 -->
  <rect x="180" y="260" width="36" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="285" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <!-- val=1 at index 3 -->
  <rect x="224" y="285" width="36" height="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="298" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>

  <!-- index labels -->
  <text x="110" y="316" text-anchor="middle" font-size="9" fill="#999">0</text>
  <text x="154" y="316" text-anchor="middle" font-size="9" fill="#999">1</text>
  <text x="198" y="316" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2</text>
  <text x="242" y="316" text-anchor="middle" font-size="9" fill="#999">3</text>

  <!-- sum computation -->
  <rect x="300" y="230" width="230" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="415" y="250" text-anchor="middle" font-size="11" fill="#333">total = 2 + 2 + 1</text>
  <text x="415" y="268" text-anchor="middle" font-size="11" fill="#333">= 5 ≤ 6</text>
  <text x="415" y="286" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 可行 → ans = 2, lo = 3</text>

  <!-- ===== Result box ===== -->
  <rect x="40" y="350" width="480" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="12" fill="#5a4a1a" font-weight="bold">二分过程</text>
  <text x="60" y="396" font-size="11" fill="#333">[1,6] mid=3 → sum=8 &gt; 6 ✗ hi=2</text>
  <text x="300" y="396" font-size="11" fill="#333">[1,2] mid=1 → sum=4 ≤ 6 ✓ ans=1 lo=2</text>
  <text x="60" y="416" font-size="11" fill="#333">[2,2] mid=2 → sum=5 ≤ 6 ✓ ans=2 lo=3</text>
  <text x="300" y="416" font-size="11" fill="#d6a040" font-weight="bold">lo&gt;hi → 返回 ans = 2 ✓</text>
</svg>
