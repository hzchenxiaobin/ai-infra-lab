<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：大披萨按「计重名额」从大到小分配</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">示例 1 降序 b = [8, 7, 6, 5, 4, 3, 2, 1]：m = 2 天，奇数天 k = ⌈m/2⌉ = 1 个，偶数天 1 个</text>

  <!-- rank labels -->
  <text x="112" y="55" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">b1</text>
  <text x="156" y="55" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">b2</text>
  <text x="200" y="55" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">b3</text>
  <text x="244" y="55" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">b4</text>
  <text x="288" y="55" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">b5</text>
  <text x="332" y="55" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">b6</text>
  <text x="376" y="55" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">b7</text>
  <text x="420" y="55" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">b8</text>

  <!-- sorted pizzas -->
  <rect x="90" y="59" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="112" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="134" y="59" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="156" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="178" y="59" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="200" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="222" y="59" width="44" height="32" rx="4" fill="#f3f3f3" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="244" y="80" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">5</text>
  <rect x="266" y="59" width="44" height="32" rx="4" fill="#f3f3f3" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="288" y="80" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">4</text>
  <rect x="310" y="59" width="44" height="32" rx="4" fill="#f3f3f3" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="332" y="80" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">3</text>
  <rect x="354" y="59" width="44" height="32" rx="4" fill="#f3f3f3" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="376" y="80" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">2</text>
  <rect x="398" y="59" width="44" height="32" rx="4" fill="#f3f3f3" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="420" y="80" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">1</text>

  <!-- braces -->
  <path d="M 90 99 L 134 99" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 90 95 L 90 99 M 134 95 L 134 99" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 134 99 L 222 99" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 134 95 L 134 99 M 222 95 L 222 99" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 222 99 L 442 99" fill="none" stroke="#999999" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <path d="M 222 95 L 222 99 M 442 95 L 442 99" fill="none" stroke="#999999" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="112" y="116" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">b1：奇数天计重</text>
  <text x="332" y="116" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">b4…b8：垫背池</text>
  <text x="178" y="131" text-anchor="middle" font-size="9.5" fill="#8a6a1f" filter="url(#rough2)">b2 垫背 Z + b3 计重 Y = 偶数天一对</text>

  <!-- Day 1 -->
  <rect x="30" y="146" width="220" height="90" rx="10" fill="#f3f8ff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="166" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">第 1 天（奇数）：{8, 3, 2, 1}</text>
  <rect x="52" y="176" width="42" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="73" y="194" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="96" y="176" width="42" height="26" rx="4" fill="#f3f3f3" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="117" y="194" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">3</text>
  <rect x="140" y="176" width="42" height="26" rx="4" fill="#f3f3f3" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="161" y="194" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">2</text>
  <rect x="184" y="176" width="42" height="26" rx="4" fill="#f3f3f3" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="205" y="194" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">1</text>
  <text x="140" y="226" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">增重 = Z = 8</text>

  <!-- Day 2 -->
  <rect x="270" y="146" width="220" height="90" rx="10" fill="#f7fbf5" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="166" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">第 2 天（偶数）：{7, 6, 5, 4}</text>
  <rect x="292" y="176" width="42" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="313" y="194" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <rect x="336" y="176" width="42" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="357" y="194" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="380" y="176" width="42" height="26" rx="4" fill="#f3f3f3" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="401" y="194" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">5</text>
  <rect x="424" y="176" width="42" height="26" rx="4" fill="#f3f3f3" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="445" y="194" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">4</text>
  <text x="380" y="226" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">增重 = Y = 6（7 只能垫背）</text>

  <text x="260" y="254" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">总增重 = 8 + 6 = 14 ✓</text>

  <!-- bottom note -->
  <rect x="20" y="262" width="480" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">奇数天（k = ⌈m/2⌉ 个）：1 个大披萨换 1 份计重 → 前 k 大全部计重</text>
  <text x="260" y="300" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">偶数天（m−k 个）：2 个大披萨换 1 份计重 → 第 k+2, k+4, … 大计重</text>
  <text x="260" y="318" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">垫背池：其余 2m+k 个小披萨（3k + 2(m−k) = 2m+k，账目恰好闭合）</text>
  <text x="260" y="338" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">ans = b[1] + … + b[k] + b[k+2] + b[k+4] + … + b[k+2(m−k)]</text>
</svg>
