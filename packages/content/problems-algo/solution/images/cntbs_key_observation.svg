<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：操作成对消除 1-bit ⟺ 子数组异或和为 0</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888">一次操作清掉两个数「相同位」上的 1 → 该位 1 的总数减 2（奇偶不变）</text>

  <!-- ① operation illustration -->
  <text x="40" y="70" font-size="11" fill="#888" font-weight="bold">① 一次操作示例：取 3 与 2，k=1（同为 1）→ 各减 2¹</text>

  <!-- Card 3 = 0 1 1 -->
  <g filter="url(#rough2)"><rect x="50" y="80" width="90" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="95" y="104" text-anchor="middle" font-size="18" fill="#224466" font-weight="bold">3</text>
  <text x="78" y="128" text-anchor="middle" font-size="13" fill="#666" font-family="monospace">0</text>
  <text x="95" y="128" text-anchor="middle" font-size="14" fill="#b03a3a" font-weight="bold" font-family="monospace">1</text>
  <text x="112" y="128" text-anchor="middle" font-size="13" fill="#666" font-family="monospace">1</text>
  <rect x="86" y="116" width="18" height="18" rx="3" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- Card 2 = 0 1 0 -->
  <g filter="url(#rough2)"><rect x="150" y="80" width="90" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="195" y="104" text-anchor="middle" font-size="18" fill="#3a5a2a" font-weight="bold">2</text>
  <text x="178" y="128" text-anchor="middle" font-size="13" fill="#666" font-family="monospace">0</text>
  <text x="195" y="128" text-anchor="middle" font-size="14" fill="#b03a3a" font-weight="bold" font-family="monospace">1</text>
  <text x="212" y="128" text-anchor="middle" font-size="13" fill="#666" font-family="monospace">0</text>
  <rect x="186" y="116" width="18" height="18" rx="3" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- arrow with label -->
  <line x1="246" y1="109" x2="298" y2="109" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="100" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold">各 −2¹</text>

  <!-- Card 1 = 0 0 1 -->
  <g filter="url(#rough2)"><rect x="305" y="80" width="90" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="350" y="104" text-anchor="middle" font-size="18" fill="#224466" font-weight="bold">1</text>
  <text x="333" y="128" text-anchor="middle" font-size="13" fill="#999" font-family="monospace">0</text>
  <text x="350" y="128" text-anchor="middle" font-size="13" fill="#aaa" font-family="monospace">0</text>
  <text x="367" y="128" text-anchor="middle" font-size="13" fill="#666" font-family="monospace">1</text>

  <!-- Card 0 = 0 0 0 -->
  <g filter="url(#rough2)"><rect x="405" y="80" width="90" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="450" y="104" text-anchor="middle" font-size="18" fill="#3a5a2a" font-weight="bold">0</text>
  <text x="433" y="128" text-anchor="middle" font-size="13" fill="#999" font-family="monospace">0</text>
  <text x="450" y="128" text-anchor="middle" font-size="13" fill="#aaa" font-family="monospace">0</text>
  <text x="467" y="128" text-anchor="middle" font-size="13" fill="#999" font-family="monospace">0</text>

  <!-- caption -->
  <text x="280" y="156" text-anchor="middle" font-size="10.5" fill="#666">第 1 位的 1 成对消除 → 该位 1 的总数 <tspan fill="#b03a3a" font-weight="bold">2 → 0</tspan>（奇偶不变）</text>

  <!-- ② equivalence chain -->
  <text x="40" y="182" font-size="11" fill="#888" font-weight="bold">② 三者互相推出（充要条件链）</text>

  <!-- Box1 green -->
  <g filter="url(#rough2)"><rect x="120" y="194" width="320" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="280" y="220" text-anchor="middle" font-size="12.5" fill="#3a5a2a" font-weight="bold">每个 bit 上 1 的个数均为偶数</text>

  <!-- ⟺ arrow down -->
  <line x1="280" y1="238" x2="280" y2="258" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="298" y="252" font-size="11" fill="#666" font-weight="bold">⟺</text>

  <!-- Box2 blue -->
  <g filter="url(#rough2)"><rect x="120" y="262" width="320" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="280" y="288" text-anchor="middle" font-size="12.5" fill="#224466" font-weight="bold">子数组异或和 = 0（XOR 不计顺序/位置）</text>

  <!-- ⟺ arrow down -->
  <line x1="280" y1="306" x2="280" y2="326" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="298" y="320" font-size="11" fill="#666" font-weight="bold">⟺</text>

  <!-- Box3 orange -->
  <g filter="url(#rough2)"><rect x="100" y="330" width="360" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="280" y="356" text-anchor="middle" font-size="12.5" fill="#7a5a20" font-weight="bold" font-family="monospace">前缀异或值相等：prefix[r+1] == prefix[l]</text>

  <!-- result banner -->
  <g filter="url(#rough2)"><rect x="60" y="382" width="440" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="280" y="402" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">美丽子数组 ⟺ 前缀异或值相等 → 转为「数等值前缀对」</text>
</svg>
