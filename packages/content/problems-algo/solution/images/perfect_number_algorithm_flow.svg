<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：成对因子求和，O(√num)</text>

  <!-- Start -->
  <ellipse cx="270" cy="56" rx="58" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输入 num</text>
  <path d="M 270 74 L 270 90" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: num <= 1 -->
  <polygon points="270,92 350,124 270,156 190,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="122" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">num &lt;= 1 ?</text>
  <!-- Yes branch -> false -->
  <path d="M 350 124 L 410 124" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="118" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <rect x="412" y="110" width="76" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="450" y="128" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">return false</text>

  <!-- No branch -> init -->
  <path d="M 270 156 L 270 176" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="170" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>

  <rect x="200" y="178" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="198" text-anchor="middle" font-size="11.5" fill="#333">sum = 1, i = 2</text>
  <text x="350" y="198" font-size="10" fill="#888">① 1 必为因子</text>
  <path d="M 270 210 L 270 226" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: i*i <= num -->
  <polygon points="270,228 360,262 270,296 180,262" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="260" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">i * i &lt;= num ?</text>
  <text x="368" y="266" font-size="10.5" fill="#888">枚举到 √num</text>

  <!-- No branch -> return sum == num -->
  <path d="M 180 262 L 110 262 L 110 320" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="116" y="256" font-size="10.5" fill="#b85450" font-weight="bold">否，退出循环</text>
  <rect x="62" y="322" width="96" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="110" y="342" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">return sum==num</text>

  <!-- Yes branch -> num % i == 0 -->
  <path d="M 270 296 L 270 316" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="310" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <polygon points="270,318 360,350 270,382 180,350" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="348" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">num % i == 0 ?</text>

  <!-- No -> i++ (back to loop) -->
  <path d="M 360 350 L 410 350 L 410 262 L 360 262" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="344" font-size="10.5" fill="#888">否</text>
  <rect x="394" y="364" width="32" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="378" text-anchor="middle" font-size="10" fill="#888">i++</text>

  <!-- Yes -> add pair -->
  <path d="M 270 382 L 270 398" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="392" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="170" y="400" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="418" text-anchor="middle" font-size="11" fill="#333">sum += i</text>
  <text x="270" y="432" text-anchor="middle" font-size="10.5" fill="#4a7a3a">if i != num/i : sum += num/i</text>

  <!-- back to loop -->
  <path d="M 170 420 L 130 420 L 130 262 L 180 262" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="414" font-size="10" fill="#888">i++</text>

  <text x="270" y="452" text-anchor="middle" font-size="10" fill="#888">① 因子 1 预置入 sum，规避「i=1 时配对出 num 本身」；i*i==num 时只加一次</text>
</svg>
