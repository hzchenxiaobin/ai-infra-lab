<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="14.5" fill="#333" filter="url(#rough2)">流程：j 从 k 扫到 n−1，增量维护前缀最大</text>

  <!-- 开始 -->
  <ellipse cx="150" cy="38" rx="40" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="43" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">开始</text>
  <path d="M 150 52 L 150 60" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="70" y="62" width="160" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="79" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">prefixMax ← −∞ ，ans ← −∞</text>
  <path d="M 150 88 L 150 96" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- j 起步 -->
  <rect x="106" y="98" width="88" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="114" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">j ← k</text>
  <path d="M 150 122 L 150 130" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形：j < n ? -->
  <polygon points="150,132 222,170 150,208 78,170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="167" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">j &lt; n ?</text>
  <text x="150" y="183" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">右端点还有吗</text>

  <!-- 否 → 返回 -->
  <path d="M 222 170 L 240 170" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="231" y="162" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="242" y="154" width="100" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="292" y="174" text-anchor="middle" font-size="11.5" fill="#2f5527" font-weight="bold" filter="url(#rough2)">返回 ans ✓</text>

  <!-- 是 → 维护前缀最大 -->
  <path d="M 150 208 L 150 218" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="162" y="216" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="45" y="220" width="210" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="238" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">prefixMax ← max(prefixMax, nums[j−k])</text>
  <path d="M 150 248 L 150 256" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 更新答案 -->
  <rect x="45" y="258" width="210" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="275" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">ans ← max(ans, prefixMax + nums[j])</text>
  <path d="M 150 284 L 150 292" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- j++ -->
  <rect x="105" y="294" width="90" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="310" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">j ← j + 1</text>

  <!-- 回环 -->
  <path d="M 105 306 L 28 306 L 28 170 L 74 170" fill="none" stroke="#b85450" stroke-width="1.5"
        stroke-dasharray="6 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="56" y="300" font-size="9.5" fill="#b85450" filter="url(#rough2)">下一轮</text>

  <!-- 小抄 -->
  <rect x="368" y="60" width="140" height="236" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="438" y="80" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">小抄</text>
  <text x="438" y="100" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· 时间 O(n)：一趟扫描</text>
  <text x="438" y="117" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· 空间 O(1)：两个变量</text>
  <text x="438" y="134" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· k ≤ n−1 ⇒ j=k, i=0</text>
  <text x="438" y="150" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">  必有效，ans 必被更新</text>
  <text x="438" y="167" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· j−k 即新进下标，</text>
  <text x="438" y="183" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">  不重不漏</text>
  <text x="438" y="200" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· 和 ≤ 2×10⁹ &lt; INT_MAX</text>
  <text x="438" y="216" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">  C++ 建议 long long 中转</text>
  <text x="438" y="233" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· 可行域只增 ⇒ 滚动 max</text>
  <text x="438" y="249" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">  （若会缩 → 单调队列，</text>
  <text x="438" y="265" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">   见 1425）</text>
  <text x="438" y="286" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· 同构 121 股票题</text>

  <text x="150" y="342" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">定右端、缩左域、滚最值——一趟过</text>
</svg>
