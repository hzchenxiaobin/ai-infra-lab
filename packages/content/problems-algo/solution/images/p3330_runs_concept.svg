<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：按连续相同段分解，至多一段收缩</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">「至多犯一次错」⇒ 恰好允许一段少按几个 ⇒ 乘法变加法：ans = 1 + Σ(Lᵢ − 1)</text>

  <!-- run 分解 -->
  <text x="260" y="64" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">word = "abbcccc" 按极长连续段（run）切分：</text>

  <rect x="106" y="74" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="126" y="100" text-anchor="middle" font-size="15" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="160" y="74" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="180" y="100" text-anchor="middle" font-size="15" fill="#33506b" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="200" y="74" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="220" y="100" text-anchor="middle" font-size="15" fill="#33506b" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="254" y="74" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="274" y="100" text-anchor="middle" font-size="15" fill="#a07830" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="294" y="74" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="314" y="100" text-anchor="middle" font-size="15" fill="#a07830" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="334" y="74" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="354" y="100" text-anchor="middle" font-size="15" fill="#a07830" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="374" y="74" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="394" y="100" text-anchor="middle" font-size="15" fill="#a07830" font-weight="bold" filter="url(#rough2)">c</text>

  <text x="126" y="130" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">段1 L=1 → +0 种</text>
  <text x="200" y="130" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">段2 L=2 → +1 种</text>
  <text x="334" y="130" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">段3 L=4 → +3 种</text>

  <!-- 三类方案 -->
  <text x="260" y="154" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">全部合法方案分成互斥的三类：</text>

  <rect x="22" y="164" width="150" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="97" y="184" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">① 一次错都没犯</text>
  <text x="97" y="200" text-anchor="middle" font-size="10" fill="#4a4a4a" filter="url(#rough2)">t = "abbcccc"</text>
  <text x="97" y="216" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">每段都全保留 · 1 种</text>

  <rect x="185" y="164" width="150" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="184" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">② 错在 b 段</text>
  <text x="260" y="200" text-anchor="middle" font-size="10" fill="#4a4a4a" filter="url(#rough2)">t = "abcccc"</text>
  <text x="260" y="216" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">b 只按 1 次 · 2−1 = 1 种</text>

  <rect x="348" y="164" width="150" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="423" y="184" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">③ 错在 c 段</text>
  <text x="423" y="200" text-anchor="middle" font-size="10" fill="#4a4a4a" filter="url(#rough2)">t = "abbc/abbcc/abbccc"</text>
  <text x="423" y="216" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">c 按 1~3 次 · 4−1 = 3 种</text>

  <!-- 汇总 -->
  <rect x="60" y="238" width="400" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="14" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">ans = 1 + 0 + 1 + 3 = 5</text>

  <!-- 陷阱提示 -->
  <rect x="20" y="292" width="480" height="66" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="312" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 别按「删掉哪个多余字符」数位置：</text>
  <text x="34" y="328" font-size="10" fill="#333" filter="url(#rough2)">"aaaa" 删第 2 个还是第 3 个 'a'，得到的都是 "aaa"——按位置数会重！</text>
  <text x="34" y="344" font-size="10" fill="#333" filter="url(#rough2)">计数对象是「不同的目标串 t」，用（哪一段收缩, 保留几个）二元组唯一刻画，不重不漏。</text>

  <!-- 底部公式 -->
  <rect x="20" y="370" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="392" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">💡 等价三种写法：ans = 1 + Σ(Lᵢ − 1) = 1 + 相邻相同对数 = n − m + 1</text>
  <text x="260" y="412" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">（m 为段数；代码里数「word[i] == word[i−1]」最省事）</text>
</svg>
