<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#555" font-weight="bold">示例演算：initialEnergy=5, energy=[1,4,3,2], exp=3, experience=[2,6,3,1]</text>

  <!-- Energy banner -->
  <rect x="20" y="40" width="520" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="60" font-size="12" fill="#d6a040" font-weight="bold">精力训练（一次公式）</text>
  <text x="34" y="76" font-size="11.5" fill="#333">trainE = max(0, Σenergy + 1 − initialEnergy) = max(0, 10+1 − 5) = 6</text>
  <text x="300" y="76" font-size="11" fill="#888">总精力 11 → 10 → 6 → 3 → 1（逐场扣减，全程 &gt; 0）</text>

  <!-- Experience table title -->
  <text x="20" y="104" font-size="12" fill="#4a7a3a" font-weight="bold">经验训练（逐场贪心补足）</text>

  <!-- table frame -->
  <rect x="20" y="112" width="520" height="200" fill="none" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>

  <!-- header row -->
  <rect x="20" y="112" width="520" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="132" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">场次</text>
  <text x="130" y="132" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">对手经验</text>
  <text x="225" y="132" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">赛前经验</text>
  <text x="315" y="132" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">训练补足</text>
  <text x="410" y="132" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">达到值</text>
  <text x="485" y="132" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">胜后经验</text>

  <!-- column separators -->
  <path d="M 90 112 L 90 312" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 175 112 L 175 312" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 270 112 L 270 312" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 360 112 L 360 312" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 455 112 L 455 312" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 0 -->
  <text x="50" y="166" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="130" y="166" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="225" y="166" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="315" y="166" text-anchor="middle" font-size="12" fill="#4a7a3a">0</text>
  <text x="410" y="166" text-anchor="middle" font-size="12" fill="#333">3 &gt; 2 ✓</text>
  <text x="485" y="166" text-anchor="middle" font-size="12" fill="#333">5</text>
  <path d="M 20 178 L 540 178" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1 (highlight - has training) -->
  <rect x="20" y="178" width="520" height="34" fill="#fff8e1" opacity="0.7" filter="url(#rough2)"/>
  <text x="50" y="200" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="130" y="200" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">6</text>
  <text x="225" y="200" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="315" y="200" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">2</text>
  <text x="410" y="200" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">7 &gt; 6 ✓</text>
  <text x="485" y="200" text-anchor="middle" font-size="12" fill="#333">13</text>
  <text x="315" y="210" text-anchor="middle" font-size="8.5" fill="#b85450">6+1−5=2</text>
  <path d="M 20 212 L 540 212" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 2 -->
  <text x="50" y="234" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="130" y="234" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="225" y="234" text-anchor="middle" font-size="12" fill="#333">13</text>
  <text x="315" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a">0</text>
  <text x="410" y="234" text-anchor="middle" font-size="12" fill="#333">13 &gt; 3 ✓</text>
  <text x="485" y="234" text-anchor="middle" font-size="12" fill="#333">16</text>
  <path d="M 20 246 L 540 246" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 3 -->
  <text x="50" y="268" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="130" y="268" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="225" y="268" text-anchor="middle" font-size="12" fill="#333">16</text>
  <text x="315" y="268" text-anchor="middle" font-size="12" fill="#4a7a3a">0</text>
  <text x="410" y="268" text-anchor="middle" font-size="12" fill="#333">16 &gt; 1 ✓</text>
  <text x="485" y="268" text-anchor="middle" font-size="12" fill="#333">17</text>

  <!-- sum row -->
  <rect x="20" y="282" width="520" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="302" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Σ</text>
  <text x="225" y="302" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">经验训练 = 0+2+0+0 = 2</text>
  <text x="410" y="302" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">总训练</text>
  <text x="485" y="302" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">6+2=8</text>

  <!-- note -->
  <text x="20" y="338" font-size="10.5" fill="#555">• 精力只看总量 → 一次公式 trainE=6；经验逐场判断 → 仅第 1 场补 2 小时</text>
  <text x="20" y="356" font-size="10.5" fill="#555">• 两者解耦：精力训练与经验训练互不影响，分别求和即答案 = 8</text>
</svg>
