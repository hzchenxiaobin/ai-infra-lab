<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">示例演算：matrix=[[5,2],[1,6]]</text>

  <!-- 左侧：原始矩阵 -->
  <text x="120" y="62" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">matrix</text>
  <rect x="60" y="72" width="120" height="120" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M120 72 V192 M60 132 H180" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="106" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">5</text>
  <text x="150" y="106" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">2</text>
  <text x="90" y="166" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <text x="150" y="166" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">6</text>

  <!-- 箭头 -->
  <path d="M186 132 L220 132" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="203" y="124" text-anchor="middle" font-size="9" fill="#888">递推</text>

  <!-- 中间：前缀异或表 -->
  <text x="300" y="62" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">pref（二维前缀异或）</text>
  <rect x="240" y="72" width="120" height="120" fill="#e6f4ea" opacity="0.5" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M300 72 V192 M240 132 H360" stroke="#4a8a5a" stroke-width="1" filter="url(#rough2)"/>
  <!-- pref[0][0]=5 -->
  <text x="270" y="106" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">5</text>
  <!-- pref[0][1]=5^2=7 -->
  <text x="330" y="106" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">7</text>
  <!-- pref[1][0]=5^1=4 -->
  <text x="270" y="166" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">4</text>
  <!-- pref[1][1]=6^7^4^5=0 -->
  <text x="330" y="166" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">0</text>

  <!-- 右侧：计算说明 -->
  <rect x="380" y="72" width="150" height="120" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="455" y="92" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">逐格计算</text>
  <text x="390" y="110" font-size="9" fill="#444">pref[0][0] = 5</text>
  <text x="390" y="126" font-size="9" fill="#444">pref[0][1] = 5^2 = 7</text>
  <text x="390" y="142" font-size="9" fill="#444">pref[1][0] = 5^1 = 4</text>
  <text x="390" y="158" font-size="9" fill="#444">pref[1][1] =</text>
  <text x="395" y="172" font-size="9" fill="#d6a040">6^7^4^5 = 0</text>
  <text x="390" y="186" font-size="8" fill="#888">(5^2^1^6=0 验证)</text>

  <!-- 下方：收集 + 排序 -->
  <text x="280" y="222" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">收集全部 pref 值并降序排列</text>

  <!-- 收集的值 -->
  <rect x="80" y="240" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="263" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">5</text>

  <rect x="150" y="240" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="263" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">7</text>

  <rect x="220" y="240" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="263" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>

  <rect x="290" y="240" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="263" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">0</text>

  <text x="380" y="263" font-size="10" fill="#888">原始顺序</text>

  <!-- 箭头向下 -->
  <path d="M180 282 L180 308" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="298" font-size="9" fill="#888">降序排序</text>

  <!-- 排序后 -->
  <rect x="80" y="314" width="60" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="337" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">7</text>
  <text x="110" y="362" text-anchor="middle" font-size="9" fill="#b85450">k=1</text>

  <rect x="150" y="314" width="60" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="180" y="337" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">5</text>
  <text x="180" y="362" text-anchor="middle" font-size="9" fill="#d6a040">k=2</text>

  <rect x="220" y="314" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="250" y="337" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="250" y="362" text-anchor="middle" font-size="9" fill="#4a7a3a">k=3</text>

  <rect x="290" y="314" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="337" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">0</text>
  <text x="320" y="362" text-anchor="middle" font-size="9" fill="#446688">k=4</text>

  <!-- 底部结论框 -->
  <rect x="36" y="388" width="488" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="412" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">验证四个示例</text>
  <text x="280" y="432" text-anchor="middle" font-size="11" fill="#444">k=1→7 ✓  k=2→5 ✓  k=3→4 ✓  k=4→0 ✓</text>
</svg>
