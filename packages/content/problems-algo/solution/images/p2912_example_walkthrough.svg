<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例 2 演算：n=3, m=4, k=3, source=[1,2], dest=[2,3]</text>
  <text x="260" y="44" text-anchor="middle" font-size="10" fill="#888">f[0]：source 本身 ｜ f[1]：同列不同行 ｜ f[2]：同行不同列 ｜ f[3]：行列都不同</text>

  <!-- header row -->
  <rect x="55" y="58" width="95" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="79" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">轮次 t</text>
  <rect x="150" y="58" width="85" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="79" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">f[0]</text>
  <rect x="235" y="58" width="85" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="277" y="79" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">f[1]</text>
  <rect x="320" y="58" width="85" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="362" y="79" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">f[2]</text>
  <rect x="405" y="58" width="85" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="447" y="79" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">f[3]</text>

  <!-- t = 0 -->
  <rect x="55" y="90" width="95" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="102" y="114" text-anchor="middle" font-size="11" fill="#555">t = 0</text>
  <rect x="150" y="90" width="85" height="38" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="192" y="114" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="235" y="90" width="85" height="38" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="277" y="114" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="320" y="90" width="85" height="38" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="362" y="114" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="405" y="90" width="85" height="38" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="447" y="114" text-anchor="middle" font-size="12" fill="#333">0</text>

  <!-- t = 1 -->
  <rect x="55" y="128" width="95" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="102" y="152" text-anchor="middle" font-size="11" fill="#555">t = 1</text>
  <rect x="150" y="128" width="85" height="38" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="192" y="152" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="235" y="128" width="85" height="38" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="277" y="152" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="320" y="128" width="85" height="38" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="362" y="152" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="405" y="128" width="85" height="38" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="447" y="152" text-anchor="middle" font-size="12" fill="#333">0</text>

  <!-- t = 2 -->
  <rect x="55" y="166" width="95" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="102" y="190" text-anchor="middle" font-size="11" fill="#555">t = 2</text>
  <rect x="150" y="166" width="85" height="38" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="192" y="190" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="235" y="166" width="85" height="38" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="277" y="190" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="320" y="166" width="85" height="38" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="362" y="190" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="405" y="166" width="85" height="38" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="447" y="190" text-anchor="middle" font-size="12" fill="#333">2</text>

  <!-- t = 3 (final) -->
  <rect x="55" y="204" width="95" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="102" y="228" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">t = 3</text>
  <rect x="150" y="204" width="85" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="228" text-anchor="middle" font-size="12" fill="#333">8</text>
  <rect x="235" y="204" width="85" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="277" y="228" text-anchor="middle" font-size="12" fill="#333">12</text>
  <rect x="320" y="204" width="85" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="362" y="228" text-anchor="middle" font-size="12" fill="#333">13</text>
  <rect x="405" y="204" width="85" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="447" y="229" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">9</text>

  <!-- notes -->
  <text x="55" y="268" font-size="11" fill="#555">第 1 步只能跳到同行 / 同列格子：f[1] = f[2] = 1，f[0] = f[3] = 0</text>
  <text x="55" y="290" font-size="11" fill="#555">第 3 步：g[3] = f[1] + f[2] + (n−2)·f[3] + (m−2)·f[3] = 1 + 2 + 1×2 + 2×2 = 9</text>
  <text x="55" y="318" font-size="11.5" fill="#b85450" font-weight="bold">dest 与 source 行列都不同 → 答案 = f[3] = 9 ✓</text>
</svg>
