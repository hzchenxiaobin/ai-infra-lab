<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：解析车牌 → 逐词覆盖判定 → 取最短</text>

  <!-- Step 1: parse license -->
  <rect x="40" y="44" width="480" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="64" font-size="12" fill="#446688" font-weight="bold">步骤 1：解析车牌，构造需求频次表 need[26]</text>
  <text x="60" y="82" font-size="11" fill="#444" font-family="monospace">for (char c : licensePlate)</text>
  <text x="60" y="98" font-size="11" fill="#444" font-family="monospace">    if (isalpha(c)) need[tolower(c)-'a']++;   // 跳过数字/空格，统一小写</text>
  <text x="60" y="114" font-size="10" fill="#888">need 至多 7 个非零项（车牌长度 ≤ 7）</text>

  <path d="M 280 124 L 280 142" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: iterate words -->
  <rect x="40" y="146" width="480" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="166" font-size="12" fill="#d6a040" font-weight="bold">步骤 2：遍历 words 中每个单词 w</text>
  <text x="60" y="184" font-size="11" fill="#444" font-family="monospace">for (string w : words)  if (isCompleting(w, need)) ...</text>

  <path d="M 280 200 L 280 218" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: count + check coverage -->
  <rect x="40" y="222" width="480" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="242" font-size="12" fill="#d6a040" font-weight="bold">步骤 3：统计 w 频次 freq[26]，逐字母覆盖判定</text>
  <text x="60" y="260" font-size="11" fill="#444" font-family="monospace">int freq[26] = {0};</text>
  <text x="60" y="276" font-size="11" fill="#444" font-family="monospace">for (char c : w) freq[c-'a']++;</text>
  <text x="60" y="292" font-size="11" fill="#444" font-family="monospace">for (i=0; i&lt;26; ++i)</text>
  <text x="80" y="310" font-size="11" fill="#b85450" font-family="monospace">if (need[i] &gt; freq[i]) return false;   // 缺字母即非补全</text>
  <text x="60" y="328" font-size="11" fill="#4a7a3a" font-family="monospace">return true;   // 全部覆盖</text>

  <path d="M 280 346 L 280 364" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: track shortest -->
  <rect x="40" y="368" width="480" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="388" font-size="12" fill="#4a7a3a" font-weight="bold">步骤 4：若补全，更新最短答案（首次出现的更短者胜出）</text>
  <text x="60" y="406" font-size="11" fill="#444" font-family="monospace">if (best.empty() || w.size() &lt; best.size()) best = w;</text>

  <!-- loop back arrow -->
  <path d="M 500 171 Q 540 171 540 280 Q 540 393 500 393" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="548" y="282" font-size="10" fill="#888" text-anchor="middle" transform="rotate(90 548 282)">下一个单词</text>

  <!-- note -->
  <rect x="40" y="426" width="480" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="443" text-anchor="middle" font-size="10" fill="#888">⚠️ 题目保证至少存在一个补全词；并列长度取数组中首个，故用「&lt;」而非「&lt;=」即可保序</text>
</svg>
