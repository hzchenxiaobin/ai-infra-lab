<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：distance = [1,2,3,4]，total = 10</text>

  <!-- ============ Example 1: start=0, dest=1 ============ -->
  <text x="110" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">示例1：0 → 1</text>

  <!-- ring1 -->
  <ellipse cx="110" cy="150" rx="65" ry="50" fill="none" stroke="#dddddd" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <!-- highlight clockwise 0->1 (top-right) -->
  <path d="M 110 100 A 65 50 0 0 1 175 150" fill="none" stroke="#4a7a3a" stroke-width="3.5" filter="url(#rough2)"/>

  <!-- stops -->
  <circle cx="110" cy="100" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="104" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <circle cx="175" cy="150" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="175" y="154" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <circle cx="110" cy="200" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="204" text-anchor="middle" font-size="10" fill="#333">2</text>
  <circle cx="45" cy="150" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="45" y="154" text-anchor="middle" font-size="10" fill="#333">3</text>

  <!-- edge labels -->
  <text x="152" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="152" y="188" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="68" y="188" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="68" y="118" text-anchor="middle" font-size="10" fill="#999">4</text>

  <!-- result -->
  <rect x="45" y="250" width="130" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="270" text-anchor="middle" font-size="10" fill="#555">顺=1, 逆=9</text>
  <text x="110" y="289" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">min = 1 ✓</text>

  <!-- ============ Example 2: start=0, dest=2 ============ -->
  <text x="270" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">示例2：0 → 2</text>

  <!-- ring2 -->
  <ellipse cx="270" cy="150" rx="65" ry="50" fill="none" stroke="#dddddd" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <!-- highlight clockwise 0->1->2 (top-right + bottom-right) -->
  <path d="M 270 100 A 65 50 0 0 1 335 150 A 65 50 0 0 1 270 200" fill="none" stroke="#4a7a3a" stroke-width="3.5" filter="url(#rough2)"/>

  <circle cx="270" cy="100" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="104" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <circle cx="335" cy="150" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="335" y="154" text-anchor="middle" font-size="10" fill="#333">1</text>
  <circle cx="270" cy="200" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <circle cx="205" cy="150" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="205" y="154" text-anchor="middle" font-size="10" fill="#333">3</text>

  <text x="312" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="312" y="188" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="228" y="188" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="228" y="118" text-anchor="middle" font-size="10" fill="#999">4</text>

  <rect x="205" y="250" width="130" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="270" text-anchor="middle" font-size="10" fill="#555">顺=3, 逆=7</text>
  <text x="270" y="289" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">min = 3 ✓</text>

  <!-- ============ Example 3: start=0, dest=3 ============ -->
  <text x="430" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">示例3：0 → 3</text>

  <!-- ring3 -->
  <ellipse cx="430" cy="150" rx="65" ry="50" fill="none" stroke="#dddddd" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <!-- highlight counterclockwise 0->3 (top-left, sweep=0) -->
  <path d="M 430 100 A 65 50 0 0 0 365 150" fill="none" stroke="#b85450" stroke-width="3.5" filter="url(#rough2)"/>

  <circle cx="430" cy="100" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="430" y="104" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <circle cx="495" cy="150" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="495" y="154" text-anchor="middle" font-size="10" fill="#333">1</text>
  <circle cx="430" cy="200" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="430" y="204" text-anchor="middle" font-size="10" fill="#333">2</text>
  <circle cx="365" cy="150" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="365" y="154" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <text x="472" y="118" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="472" y="188" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="388" y="188" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="388" y="118" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>

  <rect x="365" y="250" width="130" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="270" text-anchor="middle" font-size="10" fill="#555">顺=6, 逆=4</text>
  <text x="430" y="289" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">min = 4 ✓</text>

  <!-- Bottom legend -->
  <rect x="60" y="325" width="210" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="165" y="342" text-anchor="middle" font-size="10" fill="#444">绿色 = 顺时针更短（示例1、2）</text>
  <text x="165" y="356" text-anchor="middle" font-size="9" fill="#888">顺时针 = Σ distance[start..dest−1]</text>

  <rect x="290" y="325" width="210" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="395" y="342" text-anchor="middle" font-size="10" fill="#444">红色 = 逆时针更短（示例3）</text>
  <text x="395" y="356" text-anchor="middle" font-size="9" fill="#888">逆时针 = total − 顺时针</text>
</svg>
