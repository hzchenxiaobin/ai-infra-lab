<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="390" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">URL 图的 BFS：同主机名过滤</text>

  <!-- ===== Section 1: Hostname extraction ===== -->
  <text x="36" y="58" font-size="11" fill="#888">URL：</text>
  <!-- protocol segment -->
  <rect x="76" y="44" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="61" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">http://</text>
  <!-- host segment -->
  <rect x="140" y="44" width="118" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="199" y="61" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">news.yahoo.com</text>
  <!-- path segment -->
  <rect x="258" y="44" width="112" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="314" y="61" text-anchor="middle" font-size="10" fill="#aaa">/news/topics</text>

  <!-- brace under protocol + host -->
  <path d="M 76 72 Q 76 84 86 84 L 194 84 Q 204 84 204 72" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="140" y="100" text-anchor="middle" font-size="10.5" fill="#446688">hostname（协议+主机）</text>

  <!-- hostname result box -->
  <rect x="396" y="42" width="146" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="469" y="64" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">hostname =</text>
  <text x="469" y="84" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">http://news.yahoo.com</text>

  <!-- divider -->
  <path d="M 36 116 L 524 116" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Section 2: BFS graph ===== -->
  <text x="36" y="136" font-size="11" fill="#888">BFS 遍历 URL 图：</text>

  <!-- Root: startUrl -->
  <rect x="190" y="146" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="167" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">startUrl（根节点）</text>

  <!-- arrows root -> children -->
  <path d="M 240 180 Q 200 196 70 218" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 270 180 Q 250 196 210 218" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 290 180 Q 320 196 350 218" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 320 180 Q 360 196 490 218" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Child A: same host (accepted) -->
  <rect x="14" y="222" width="112" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="70" y="241" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">yahoo.com/news</text>
  <text x="70" y="258" text-anchor="middle" font-size="9" fill="#4a7a3a">✓ 同主机名</text>

  <!-- Child B: same host (accepted) -->
  <rect x="154" y="222" width="112" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="210" y="241" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">yahoo.com/finance</text>
  <text x="210" y="258" text-anchor="middle" font-size="9" fill="#4a7a3a">✓ 同主机名</text>

  <!-- Child C: different protocol (filtered) -->
  <rect x="294" y="222" width="112" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="350" y="241" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" text-decoration="line-through">https://yahoo.com</text>
  <text x="350" y="258" text-anchor="middle" font-size="9" fill="#b85450">✗ 协议不同</text>

  <!-- Child D: different host (filtered) -->
  <rect x="434" y="222" width="112" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="490" y="241" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" text-decoration="line-through">google.com/news</text>
  <text x="490" y="258" text-anchor="middle" font-size="9" fill="#b85450">✗ 主机不同</text>

  <!-- divider -->
  <path d="M 36 288 L 524 288" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Legend ===== -->
  <text x="36" y="308" font-size="11" fill="#888" font-weight="bold">图例：</text>

  <rect x="40" y="320" width="24" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="72" y="334" font-size="10" fill="#555">起始 URL（根）</text>

  <rect x="180" y="320" width="24" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="334" font-size="10" fill="#555">同主机名 → 入队</text>

  <rect x="330" y="320" width="24" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <path d="M 332 336 L 352 322" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="362" y="334" font-size="10" fill="#555">异主机名 → 过滤</text>

  <!-- bottom note -->
  <rect x="60" y="352" width="440" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">仅爬取 hostname 相同的 URL，其余边直接剪枝</text>
</svg>
