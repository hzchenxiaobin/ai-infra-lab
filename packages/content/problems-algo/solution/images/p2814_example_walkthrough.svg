<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#2b5d8a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">示例演算：障碍挡捷径、踩平手逃生（示例 2）</text>
  <text x="280" y="44" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每格右下角小字 = flood[]；蓝箭头 = 人路径；绿框 = 与洪水同时到达（平手归你）</text>

  <!-- ===== Grid 3x3 ===== -->
  <!-- row0: D X * -->
  <rect x="40" y="70" width="60" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="70" y="106" text-anchor="middle" font-size="20" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">D</text>
  <text x="92" y="124" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">t=4</text>

  <rect x="100" y="70" width="60" height="60" fill="#dcdcdc" stroke="#888" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="130" y="106" text-anchor="middle" font-size="20" fill="#555" font-weight="bold" filter="url(#rough2)">X</text>
  <text x="130" y="124" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">不通</text>

  <rect x="160" y="70" width="60" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="190" y="106" text-anchor="middle" font-size="20" fill="#b03a3a" font-weight="bold" filter="url(#rough2)">*</text>
  <text x="212" y="124" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">t=0</text>

  <!-- row1: . . . -->
  <rect x="40" y="130" width="60" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="70" y="166" text-anchor="middle" font-size="16" fill="#888" filter="url(#rough2)">.</text>
  <text x="92" y="184" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">t=3</text>

  <rect x="100" y="130" width="60" height="60" fill="#fff" stroke="#bbb" rx="5" filter="url(#rough2)"/>
  <text x="130" y="166" text-anchor="middle" font-size="16" fill="#888" filter="url(#rough2)">.</text>
  <text x="152" y="184" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">t=2</text>

  <rect x="160" y="130" width="60" height="60" fill="#fff" stroke="#bbb" rx="5" filter="url(#rough2)"/>
  <text x="190" y="166" text-anchor="middle" font-size="16" fill="#888" filter="url(#rough2)">.</text>
  <text x="212" y="184" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">t=1</text>

  <!-- row2: . . S -->
  <rect x="40" y="190" width="60" height="60" fill="#fff" stroke="#bbb" rx="5" filter="url(#rough2)"/>
  <text x="70" y="226" text-anchor="middle" font-size="16" fill="#888" filter="url(#rough2)">.</text>
  <text x="92" y="244" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">t=4</text>

  <rect x="100" y="190" width="60" height="60" fill="#fff" stroke="#bbb" rx="5" filter="url(#rough2)"/>
  <text x="130" y="226" text-anchor="middle" font-size="16" fill="#888" filter="url(#rough2)">.</text>
  <text x="152" y="244" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">t=3</text>

  <rect x="160" y="190" width="60" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="190" y="226" text-anchor="middle" font-size="20" fill="#2b5d8a" font-weight="bold" filter="url(#rough2)">S</text>
  <text x="212" y="244" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">t=2</text>

  <!-- person path arrows: S(2,2)->(2,1)->(2,0)->(1,0)->(0,0)D ; centers (190,220)(130,220)(70,220)(70,160)(70,100) -->
  <path d="M 164 220 L 156 220" stroke="#2b5d8a" stroke-width="2" fill="none" marker-end="url(#arrp)" filter="url(#rough2)"/>
  <path d="M 104 220 L 96 220" stroke="#2b5d8a" stroke-width="2" fill="none" marker-end="url(#arrp)" filter="url(#rough2)"/>
  <path d="M 70 214 L 70 206" stroke="#2b5d8a" stroke-width="2" fill="none" marker-end="url(#arrp)" filter="url(#rough2)"/>
  <path d="M 70 154 L 70 146" stroke="#2b5d8a" stroke-width="2" fill="none" marker-end="url(#arrp)" filter="url(#rough2)"/>

  <!-- arrival labels -->
  <text x="222" y="258" text-anchor="middle" font-size="9" fill="#2b5d8a" font-weight="bold" filter="url(#rough2)">arr=0</text>
  <text x="100" y="284" text-anchor="middle" font-size="9" fill="#2b5d8a" font-weight="bold" filter="url(#rough2)">arr=1</text>
  <text x="36" y="222" text-anchor="end" font-size="9" fill="#2b5d8a" font-weight="bold" filter="url(#rough2)">arr=2</text>
  <text x="36" y="162" text-anchor="end" font-size="9" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">arr=3</text>
  <text x="36" y="102" text-anchor="end" font-size="9" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">arr=4</text>

  <text x="130" y="298" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">洪水绕行 *(0,2)→(1,2)→(1,1)→(1,0)→D，4 秒到 D（X 挡了捷径）</text>

  <!-- ===== Right panel: the two ties ===== -->
  <rect x="270" y="70" width="270" height="200" rx="10" fill="#f4fbf4" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="405" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">两处平手，均算你赢</text>

  <!-- tie 1: (1,0) -->
  <rect x="288" y="110" width="234" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="405" y="128" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">(1,0)：arr=3 ， flood=3</text>
  <text x="405" y="143" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">3 ≤ 3 ✓ 平手归人</text>

  <!-- tie 2: D -->
  <rect x="288" y="160" width="234" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="405" y="178" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">D(0,0)：arr=4 ， flood=4</text>
  <text x="405" y="193" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">4 ≤ 4 ✓ 平手归人</text>

  <!-- verdict -->
  <rect x="288" y="212" width="234" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="405" y="232" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">安全抵达 D</text>
  <text x="405" y="248" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">返回 4</text>

  <!-- bottom note -->
  <rect x="40" y="312" width="500" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="334" font-size="11" fill="#7a5415" font-weight="bold" filter="url(#rough2)">若无 X 挡捷径，洪水会沿 *(0,2)→(0,1)→D 两秒到 D，你必淹死（即示例 1）</text>
  <text x="56" y="352" font-size="10" fill="#555" filter="url(#rough2)">障碍把洪水到达时刻从 2 推迟到 4，恰好等于你的最短时间——你“踩着平手”逃生</text>
</svg>
