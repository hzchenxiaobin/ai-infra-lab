<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 580" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="500" height="580" fill="#fafafa"/>

  <text x="250" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：两遍扫描构造 x</text>

  <!-- Start -->
  <ellipse cx="250" cy="60" rx="70" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="65" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">输入 num1, num2</text>

  <line x1="250" y1="82" x2="250" y2="100" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="150" y="104" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="250" y="126" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">c = popcount(num2)；x = 0</text>

  <line x1="250" y1="138" x2="250" y2="156" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop 1 -->
  <rect x="80" y="160" width="340" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="250" y="184" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">① 遍历 i = 29 → 0（高位 → 低位）</text>
  <text x="250" y="204" text-anchor="middle" font-size="11.5" fill="#333">若 num1 的 bit i = 1 且 c &gt; 0：</text>
  <text x="250" y="222" text-anchor="middle" font-size="11.5" fill="#333">x |= 1 &lt;&lt; i； c −−</text>

  <line x1="250" y1="234" x2="250" y2="252" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="248" font-size="10.5" fill="#4a7a3a" font-weight="bold">高位优先匹配 num1 的 1</text>

  <!-- Loop 2 -->
  <rect x="80" y="256" width="340" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="250" y="280" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">② 遍历 i = 0 → 29（低位 → 高位）</text>
  <text x="250" y="300" text-anchor="middle" font-size="11.5" fill="#333">若 num1 的 bit i = 0 且 c &gt; 0：</text>
  <text x="250" y="318" text-anchor="middle" font-size="11.5" fill="#333">x |= 1 &lt;&lt; i； c −−</text>

  <line x1="250" y1="330" x2="250" y2="348" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="344" font-size="10.5" fill="#d6a040" font-weight="bold">低位优先填补 num1 的 0</text>

  <!-- guard note -->
  <rect x="120" y="352" width="260" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="250" y="372" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">两遍都用 c == 0 提前 break</text>

  <line x1="250" y1="382" x2="250" y2="402" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <ellipse cx="250" cy="430" rx="92" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="436" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">返回 x（popcount=c，XOR 最小）</text>

  <!-- bottom note -->
  <rect x="60" y="478" width="380" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="500" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">两遍扫描的分工</text>
  <text x="250" y="520" text-anchor="middle" font-size="11" fill="#333">① 消去 num1 高位的 1（差异最贵，先清）</text>
  <text x="250" y="538" text-anchor="middle" font-size="11" fill="#333">② 多余的 1 留给 num1 最低位的 0（差异最贱，后填）</text>
</svg>
