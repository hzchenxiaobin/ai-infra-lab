<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 枚举前 3 个候选（从 i=2 起）→ 双指针验证</text>

  <!-- start -->
  <rect x="165" y="38" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="12" filter="url(#rough2)"/>
  <text x="230" y="57" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 230 66 L 230 78" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- sort -->
  <rect x="140" y="82" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="230" y="102" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">排序 nums1 与 nums2</text>
  <path d="M 230 112 L 230 124" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- init i -->
  <rect x="140" y="128" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="230" y="148" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">i = 2（先试最小候选）</text>
  <path d="M 230 158 L 230 170" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- candidate x -->
  <rect x="115" y="174" width="230" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="230" y="195" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">候选 x = nums2[0] − nums1[i]</text>
  <path d="M 230 206 L 230 218" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- check -->
  <rect x="95" y="222" width="270" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="230" y="244" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">双指针验证：扫 nums1，与 nums2[j] 逐个比对</text>
  <path d="M 230 256 L 230 268" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="230,272 306,304 230,336 154,304" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="309" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">nums2 全配完？</text>

  <!-- yes -> return x -->
  <path d="M 306 304 L 352 304" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="322" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="356" y="288" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="426" y="309" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 x（即最小）</text>

  <!-- no -> diamond 2 -->
  <path d="M 230 336 L 230 348" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="242" y="346" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- diamond 2 -->
  <polygon points="230,352 296,380 230,408 164,380" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="385" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">i &gt; 0 ？</text>

  <!-- yes -> loop back (left edge) -->
  <path d="M 164 380 L 64 380 L 64 190 L 111 190" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="112" y="372" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">是：i ← i−1，换更大候选再验</text>

  <!-- no -> return 0 -->
  <path d="M 296 380 L 352 380" stroke="#888888" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="322" y="372" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="356" y="364" width="140" height="32" fill="#f0f0f0" stroke="#888888" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="426" y="385" text-anchor="middle" font-size="11" fill="#777" font-weight="bold" filter="url(#rough2)">返回 0（保证不达）</text>

  <!-- complexity note -->
  <rect x="60" y="416" width="400" height="18" fill="#fafafa" stroke="none" filter="url(#rough2)"/>
  <text x="260" y="430" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">排序 O(n log n) + 至多 3 次验证 × O(n)；题目保证有解 → 三个候选必有一个通过</text>
</svg>
