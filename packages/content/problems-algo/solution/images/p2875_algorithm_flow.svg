<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：取模分解 + 翻倍数组滑动窗口</text>

  <!-- start -->
  <rect x="210" y="44" width="200" height="32" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">开始：读入 nums 与 target</text>
  <line x1="310" y1="76" x2="310" y2="92" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- compute S -->
  <rect x="185" y="94" width="250" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="112" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">n = len(nums)，S = sum(nums)</text>
  <text x="310" y="130" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">⚠ S 最大 10¹⁰，必须用 64 位整数</text>
  <line x1="310" y1="138" x2="310" y2="154" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- divmod -->
  <rect x="185" y="156" width="250" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="178" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">k = target ÷ S，r = target mod S</text>
  <line x1="310" y1="190" x2="310" y2="206" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="310,206 420,232 310,258 200,232" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="237" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">r == 0 ?</text>

  <line x1="420" y1="232" x2="466" y2="232" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="442" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="470" y="215" width="110" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="525" y="236" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 k×n</text>

  <line x1="310" y1="258" x2="310" y2="272" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="324" y="270" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- sliding window -->
  <rect x="165" y="274" width="290" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="292" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">在 B = nums + nums 上滑动窗口</text>
  <text x="310" y="310" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">找和 == r 的最短窗口，记长度 len</text>
  <line x1="310" y1="318" x2="310" y2="332" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 2 -->
  <polygon points="310,334 420,360 310,386 200,360" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="365" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">找到 ?</text>

  <line x1="420" y1="360" x2="466" y2="360" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="442" y="352" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="470" y="343" width="120" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="530" y="364" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 k×n + len</text>

  <line x1="200" y1="360" x2="154" y2="360" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="352" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="40" y="343" width="110" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="364" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 −1</text>
</svg>
