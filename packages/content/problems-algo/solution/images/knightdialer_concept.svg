<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">骑士拨号器：电话键盘布局与跳跃转移图</text>

  <!-- ===== Left: Phone Pad ===== -->
  <text x="130" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">电话键盘（4×3）</text>

  <!-- Row 1: 1 2 3 -->
  <rect x="50" y="62" width="56" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="78" y="92" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">1</text>
  <rect x="106" y="62" width="56" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="134" y="92" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">2</text>
  <rect x="162" y="62" width="56" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="190" y="92" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">3</text>

  <!-- Row 2: 4 5 6 -->
  <rect x="50" y="110" width="56" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="78" y="140" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">4</text>
  <rect x="106" y="110" width="56" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="134" y="140" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">5</text>
  <rect x="162" y="110" width="56" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="190" y="140" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">6</text>

  <!-- Row 3: 7 8 9 -->
  <rect x="50" y="158" width="56" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="78" y="188" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">7</text>
  <rect x="106" y="158" width="56" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="134" y="188" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">8</text>
  <rect x="162" y="158" width="56" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="190" y="188" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">9</text>

  <!-- Row 4: * 0 # -->
  <rect x="50" y="206" width="56" height="48" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="78" y="236" text-anchor="middle" font-size="16" fill="#bbb">✕</text>
  <rect x="106" y="206" width="56" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="134" y="236" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">0</text>
  <rect x="162" y="206" width="56" height="48" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="190" y="236" text-anchor="middle" font-size="16" fill="#bbb">✕</text>

  <!-- * and # labels -->
  <text x="78" y="266" text-anchor="middle" font-size="9" fill="#bbb">*</text>
  <text x="190" y="266" text-anchor="middle" font-size="9" fill="#bbb">#</text>

  <!-- Example knight move arrows from 6 -->
  <!-- 6 → 0 (down 2, left 1 = L-shape) -->
  <path d="M 218 134 Q 250 190 162 222" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" stroke-dasharray="4,2"/>
  <!-- 6 → 1 (up 1, left 2 = L-shape) -->
  <path d="M 218 130 Q 180 60 106 80" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" stroke-dasharray="4,2"/>
  <!-- 6 → 7 (down 1, left 2 = L-shape) -->
  <path d="M 168 158 Q 100 160 84 176" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" stroke-dasharray="4,2"/>

  <text x="248" y="120" font-size="10" fill="#4a7a3a" font-weight="bold">L形跳跃</text>
  <text x="248" y="134" font-size="9" fill="#888">从 6 可跳到</text>
  <text x="248" y="146" font-size="9" fill="#888">0, 1, 7</text>

  <!-- 5 isolated note -->
  <text x="134" y="280" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">5：无任何骑士可达</text>

  <!-- ===== Right: Transition Table ===== -->
  <text x="420" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">骑士跳跃转移表</text>

  <!-- Row 0 -->
  <rect x="300" y="62" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="314" y="78" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="338" y="78" font-size="11" fill="#888">→</text>
  <text x="356" y="78" font-size="11" fill="#333">4, 6</text>

  <!-- Row 1 -->
  <rect x="300" y="88" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="314" y="104" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="338" y="104" font-size="11" fill="#888">→</text>
  <text x="356" y="104" font-size="11" fill="#333">6, 8</text>

  <!-- Row 2 -->
  <rect x="300" y="114" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="314" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="338" y="130" font-size="11" fill="#888">→</text>
  <text x="356" y="130" font-size="11" fill="#333">7, 9</text>

  <!-- Row 3 -->
  <rect x="300" y="140" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="314" y="156" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="338" y="156" font-size="11" fill="#888">→</text>
  <text x="356" y="156" font-size="11" fill="#333">4, 8</text>

  <!-- Row 4 -->
  <rect x="300" y="166" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="314" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="338" y="182" font-size="11" fill="#888">→</text>
  <text x="356" y="182" font-size="11" fill="#333">0, 3, 9</text>

  <!-- Row 5 (isolated) -->
  <rect x="300" y="192" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="314" y="208" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <text x="338" y="208" font-size="11" fill="#888">→</text>
  <text x="356" y="208" font-size="11" fill="#b85450">∅（孤立）</text>

  <!-- Row 6 -->
  <rect x="300" y="218" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="314" y="234" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="338" y="234" font-size="11" fill="#888">→</text>
  <text x="356" y="234" font-size="11" fill="#333">0, 1, 7</text>

  <!-- Row 7 -->
  <rect x="300" y="244" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="314" y="260" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="338" y="260" font-size="11" fill="#888">→</text>
  <text x="356" y="260" font-size="11" fill="#333">2, 6</text>

  <!-- Row 8 -->
  <rect x="300" y="270" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="314" y="286" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <text x="338" y="286" font-size="11" fill="#888">→</text>
  <text x="356" y="286" font-size="11" fill="#333">1, 3</text>

  <!-- Row 9 -->
  <rect x="300" y="296" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="314" y="312" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">9</text>
  <text x="338" y="312" font-size="11" fill="#888">→</text>
  <text x="356" y="312" font-size="11" fill="#333">2, 4</text>

  <!-- Note at bottom -->
  <rect x="40" y="336" width="480" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">核心观察：转移图是无向图（A→B 则 B→A），共 16 条边</text>
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#888">5 号键孤立 → n≥2 时 dp[d=5]=0；* 和 # 不可站</text>
</svg>
