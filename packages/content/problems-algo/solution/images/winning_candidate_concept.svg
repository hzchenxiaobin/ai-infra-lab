<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：JOIN 连表 + GROUP BY 计票 + ORDER BY COUNT DESC + LIMIT 1 取胜者</text>

  <!-- Candidate table (left) -->
  <text x="115" y="52" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">Candidate</text>
  <rect x="30" y="58" width="170" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="74" font-size="9.5" fill="#333">id</text>
  <text x="120" y="74" font-size="9.5" fill="#333">name</text>
  <line x1="80" y1="58" x2="80" y2="82" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="82" width="170" height="18" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="95" font-size="9" fill="#333">1</text>
  <text x="120" y="95" font-size="9" fill="#333">A</text>
  <line x1="80" y1="82" x2="80" y2="100" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="100" width="170" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="50" y="113" font-size="9" fill="#333">2</text>
  <text x="120" y="113" font-size="9" fill="#b85450" font-weight="bold">B</text>
  <line x1="80" y1="100" x2="80" y2="118" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="118" width="170" height="18" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="131" font-size="9" fill="#333">3</text>
  <text x="120" y="131" font-size="9" fill="#333">C</text>
  <line x1="80" y1="118" x2="80" y2="136" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="136" width="170" height="18" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="149" font-size="9" fill="#333">4</text>
  <text x="120" y="149" font-size="9" fill="#333">D</text>
  <line x1="80" y1="136" x2="80" y2="154" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="154" width="170" height="18" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="167" font-size="9" fill="#333">5</text>
  <text x="120" y="167" font-size="9" fill="#333">E</text>
  <line x1="80" y1="154" x2="80" y2="172" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Vote table (right) -->
  <text x="395" y="52" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">Vote</text>
  <rect x="310" y="58" width="170" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="74" font-size="9.5" fill="#333">id</text>
  <text x="420" y="74" font-size="9.5" fill="#b85450">CandidateId</text>
  <line x1="365" y1="58" x2="365" y2="82" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="310" y="82" width="170" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="335" y="95" font-size="9" fill="#333">1</text>
  <text x="440" y="95" font-size="9" fill="#b85450" font-weight="bold">2</text>
  <line x1="365" y1="82" x2="365" y2="100" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="310" y="100" width="170" height="18" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="335" y="113" font-size="9" fill="#333">2</text>
  <text x="440" y="113" font-size="9" fill="#333">4</text>
  <line x1="365" y1="100" x2="365" y2="118" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="310" y="118" width="170" height="18" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="335" y="131" font-size="9" fill="#333">3</text>
  <text x="440" y="131" font-size="9" fill="#333">3</text>
  <line x1="365" y1="118" x2="365" y2="136" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="310" y="136" width="170" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="335" y="149" font-size="9" fill="#333">4</text>
  <text x="440" y="149" font-size="9" fill="#b85450" font-weight="bold">2</text>
  <line x1="365" y1="136" x2="365" y2="154" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="310" y="154" width="170" height="18" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="335" y="167" font-size="9" fill="#333">5</text>
  <text x="440" y="167" font-size="9" fill="#333">5</text>
  <line x1="365" y1="154" x2="365" y2="172" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- JOIN arrow between tables -->
  <path d="M200 115 L310 115" stroke="#446688" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="255" y="108" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">JOIN</text>
  <text x="255" y="124" text-anchor="middle" font-size="8" fill="#446688">c.id = v.CandidateId</text>

  <!-- Highlight: CandidateId=2 appears twice -->
  <text x="395" y="186" text-anchor="middle" font-size="8.5" fill="#b85450">↑ CandidateId=2 出现 2 次（vote id 1、4）</text>

  <!-- Down arrow to GROUP BY result -->
  <path d="M280 200 L280 222" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="216" font-size="9" fill="#4a7a3a" font-weight="bold">GROUP BY</text>

  <!-- GROUP BY + COUNT result -->
  <text x="280" y="238" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">GROUP BY CandidateId + COUNT(*) 计票结果</text>
  <rect x="150" y="244" width="260" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="260" font-size="9" fill="#333">CandidateId</text>
  <text x="280" y="260" font-size="9" fill="#333">name</text>
  <text x="370" y="260" font-size="9" fill="#333">COUNT</text>
  <line x1="240" y1="244" x2="240" y2="268" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="335" y1="244" x2="335" y2="268" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="150" y="268" width="260" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="190" y="283" font-size="9.5" fill="#b85450" font-weight="bold">2</text>
  <text x="285" y="283" font-size="9.5" fill="#b85450" font-weight="bold">B</text>
  <text x="380" y="283" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <line x1="240" y1="268" x2="240" y2="290" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="335" y1="268" x2="335" y2="290" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="150" y="290" width="260" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="190" y="304" font-size="9" fill="#333">3</text>
  <text x="285" y="304" font-size="9" fill="#333">C</text>
  <text x="385" y="304" font-size="9" fill="#333">1</text>
  <line x1="240" y1="290" x2="240" y2="310" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="335" y1="290" x2="335" y2="310" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="150" y="310" width="260" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="190" y="324" font-size="9" fill="#333">4</text>
  <text x="285" y="324" font-size="9" fill="#333">D</text>
  <text x="385" y="324" font-size="9" fill="#333">1</text>
  <line x1="240" y1="310" x2="240" y2="330" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="335" y1="310" x2="335" y2="330" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="150" y="330" width="260" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="190" y="344" font-size="9" fill="#333">5</text>
  <text x="285" y="344" font-size="9" fill="#333">E</text>
  <text x="385" y="344" font-size="9" fill="#333">1</text>
  <line x1="240" y1="330" x2="240" y2="350" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="335" y1="330" x2="335" y2="350" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="280" y="364" text-anchor="middle" font-size="8.5" fill="#888">A（id=1）无票，INNER JOIN 后不出现</text>

  <!-- Down arrow: ORDER BY + LIMIT 1 -->
  <path d="M280 372 L280 396" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="335" y="388" font-size="9" fill="#d6a040" font-weight="bold">ORDER BY COUNT DESC</text>
  <text x="335" y="398" font-size="9" fill="#d6a040">LIMIT 1</text>

  <!-- Result -->
  <rect x="180" y="404" width="200" height="58" fill="#fff8e1" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="424" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">票数最多 → 当选者</text>
  <rect x="240" y="430" width="80" height="24" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="447" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">B</text>
</svg>
