<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrOrange" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1 &lt; k &lt; n 时：每个下标被几个子数组覆盖？</text>
  <text x="260" y="47" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">nums = [3, 9, 2, 1, 7]，k = 3，n = 5</text>

  <!-- 数组格子 -->
  <rect x="110" y="60" width="50" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="160" y="60" width="50" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="210" y="60" width="50" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="260" y="60" width="50" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="310" y="60" width="50" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="82" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="185" y="82" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <text x="235" y="82" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="285" y="82" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="335" y="82" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>

  <!-- 下标 -->
  <text x="135" y="110" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">下标0</text>
  <text x="185" y="110" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="235" y="110" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="285" y="110" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="335" y="110" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">n−1</text>

  <!-- 三个大小为 k 的子数组 -->
  <text x="100" y="141" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">s=0</text>
  <rect x="110" y="128" width="150" height="18" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="268" y="141" font-size="10" fill="#4a7a3a" filter="url(#rough2)">[3,9,2]</text>

  <text x="100" y="165" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">s=1</text>
  <rect x="160" y="152" width="150" height="18" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="318" y="165" font-size="10" fill="#4a7a3a" filter="url(#rough2)">[9,2,1]</text>

  <text x="100" y="189" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">s=2</text>
  <rect x="210" y="176" width="150" height="18" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="368" y="189" font-size="10" fill="#4a7a3a" filter="url(#rough2)">[2,1,7]</text>

  <!-- 覆盖数 -->
  <rect x="120" y="208" width="30" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="170" y="208" width="30" height="24" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="220" y="208" width="30" height="24" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="270" y="208" width="30" height="24" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="320" y="208" width="30" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="135" y="225" text-anchor="middle" font-size="12" fill="#2c5222" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="185" y="225" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">2</text>
  <text x="235" y="225" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">3</text>
  <text x="285" y="225" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">2</text>
  <text x="335" y="225" text-anchor="middle" font-size="12" fill="#2c5222" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="60" y="225" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">覆盖数</text>

  <!-- 汇总箭头 -->
  <path d="M135,236 Q120,250 108,262" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M335,236 Q300,255 210,264" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M235,236 Q300,250 360,262" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrOrange)" filter="url(#rough2)"/>

  <!-- 结论框 -->
  <rect x="36" y="266" width="220" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="146" y="290" text-anchor="middle" font-size="11.5" fill="#2c5222" filter="url(#rough2)">下标 0 / n−1：只被 1 个子数组覆盖</text>
  <text x="146" y="310" text-anchor="middle" font-size="11.5" fill="#2c5222" font-weight="bold" filter="url(#rough2)">唯一的候选（还需全数组频次 = 1）</text>

  <rect x="276" y="266" width="210" height="66" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="381" y="290" text-anchor="middle" font-size="11.5" fill="#7a3630" filter="url(#rough2)">内部下标：至少 2 个子数组覆盖</text>
  <text x="381" y="310" text-anchor="middle" font-size="11.5" fill="#7a3630" font-weight="bold" filter="url(#rough2)">永远出局 ✗</text>

  <text x="260" y="352" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">（覆盖下标 i 的起点区间：[max(0, i−k+1), min(i, n−k)]）</text>
</svg>
