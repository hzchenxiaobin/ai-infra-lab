<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">枚举中间窗口 b：左侧前缀最优，右侧后缀最优</text>

  <!-- nums row -->
  <text x="34" y="78" font-size="12" fill="#888" filter="url(#rough2)">nums:</text>
  <!-- 8 cells: 1,2,1,2,6,7,5,1 ; cell width 52 starting x=86 -->
  <rect x="86" y="62" width="52" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="112" y="82" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="138" y="62" width="52" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="164" y="82" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <rect x="190" y="62" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="82" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="242" y="62" width="52" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="82" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="294" y="62" width="52" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="82" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">6</text>
  <rect x="346" y="62" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="82" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="398" y="62" width="52" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="424" y="82" text-anchor="middle" font-size="12" fill="#a07820" font-weight="bold">5</text>
  <rect x="450" y="62" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="476" y="82" text-anchor="middle" font-size="12" fill="#333">1</text>

  <text x="112" y="106" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="164" y="106" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="216" y="106" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="268" y="106" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">3</text>
  <text x="320" y="106" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">4</text>
  <text x="372" y="106" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">5</text>
  <text x="424" y="106" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">6</text>
  <text x="476" y="106" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">7</text>

  <!-- region brackets below -->
  <!-- left region: start 0..b-k ; here b=3,k=2 -> a in [0,1] -->
  <path d="M 86 128 L 86 120 L 190 120 L 190 128" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="138" y="142" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">左：a ∈ [0, b−k]</text>
  <text x="138" y="156" text-anchor="middle" font-size="9.5" fill="#b85450">取 W 最大 → left[]</text>

  <!-- middle region: b=3..4 -> [3,4] -->
  <path d="M 242 128 L 242 120 L 346 120 L 346 128" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="294" y="142" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">中：b（枚举）</text>
  <text x="294" y="156" text-anchor="middle" font-size="9.5" fill="#4a7a3a">固定 W[b]</text>

  <!-- right region: c in [b+k, n-k] = [5,6] -->
  <path d="M 346 128 L 346 120 L 502 120 L 502 128" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="424" y="142" text-anchor="middle" font-size="10.5" fill="#a07820" font-weight="bold">右：c ∈ [b+k, n−k]</text>
  <text x="424" y="156" text-anchor="middle" font-size="9.5" fill="#a07820">取 W 最大 → right[]</text>

  <!-- W row label -->
  <text x="34" y="196" font-size="12" fill="#888" filter="url(#rough2)">W[i]:</text>
  <!-- W values: 3,3,3,8,13,12,6 ; highlight left-best=0(3), middle b=3(8), right-best=5(12) -->
  <rect x="86" y="180" width="52" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="112" y="198" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">3</text>
  <rect x="138" y="180" width="52" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="198" text-anchor="middle" font-size="11" fill="#b85450">3</text>
  <rect x="190" y="180" width="52" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="216" y="198" text-anchor="middle" font-size="11" fill="#999">3</text>
  <rect x="242" y="180" width="52" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="198" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">8</text>
  <rect x="294" y="180" width="52" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="320" y="198" text-anchor="middle" font-size="11" fill="#999">13</text>
  <rect x="346" y="180" width="52" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="372" y="198" text-anchor="middle" font-size="11.5" fill="#a07820" font-weight="bold">12</text>
  <rect x="398" y="180" width="52" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="424" y="198" text-anchor="middle" font-size="11" fill="#999">6</text>
  <!-- separator gap cell removed: W has 7 entries (0..6) -->
  <rect x="450" y="180" width="52" height="26" fill="none" stroke="none"/>
  <text x="476" y="198" text-anchor="middle" font-size="10" fill="#ccc">—</text>

  <text x="112" y="222" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">a=0</text>
  <text x="268" y="222" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">b=3</text>
  <text x="372" y="222" text-anchor="middle" font-size="9" fill="#a07820" filter="url(#rough2)">c=5</text>

  <!-- formula box -->
  <rect x="80" y="246" width="420" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="268" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">total = W[left[b−k]] + W[b] + W[right[b+k]]</text>
  <text x="290" y="284" text-anchor="middle" font-size="11" fill="#666">= 3 + 8 + 12 = 23</text>

  <!-- arrows from regions to W best -->
  <path d="M 138 160 L 112 178" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 294 160 L 268 178" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 424 160 L 372 178" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="40" y="312" width="500" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="336" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键洞察：枚举中间 b，左右选择互不耦合</text>
  <text x="290" y="354" text-anchor="middle" font-size="11" fill="#777">左侧只需 [0, b−k] 内 W 最大 → 前缀表 left[]</text>
  <text x="290" y="372" text-anchor="middle" font-size="11" fill="#777">右侧只需 [b+k, n−k] 内 W 最大 → 后缀表 right[]，各 O(1) 查表</text>
</svg>
