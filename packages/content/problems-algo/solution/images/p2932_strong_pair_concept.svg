<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：|x − y| ≤ min(x, y) ⟺ y ≤ 2x（设 x ≤ y）</text>

  <!-- 推导框 -->
  <rect x="105" y="36" width="310" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#rough2)">设 x ≤ y：|x − y| = y − x，min(x, y) = x</text>
  <text x="260" y="80" text-anchor="middle" font-size="12.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">y − x ≤ x ⟺ y ≤ 2x</text>

  <!-- 三个判定示例 -->
  <rect x="60" y="110" width="400" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="129" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">(3, 4)：4 ≤ 2×3 = 6 → ✓ 是强数对</text>

  <rect x="60" y="148" width="400" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="167" text-anchor="middle" font-size="11.5" fill="#8f3a36" filter="url(#rough2)">(2, 5)：5 &gt; 2×2 = 4 → ✗ 不是强数对</text>

  <rect x="60" y="186" width="400" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="205" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">(5, 6)：6 ≤ 2×5 = 10 → ✓ 是强数对</text>

  <!-- 数轴 -->
  <rect x="160" y="252" width="220" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="270" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">y ∈ [x, 2x] ⇒ 强数对</text>

  <path d="M 60 265 L 464 265" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 160 246 L 160 284" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 380 246 L 380 284" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="300" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="380" y="300" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2x</text>

  <!-- 结论 -->
  <rect x="90" y="316" width="340" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="13" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">一句话：大数不超过小数的 2 倍，即为强数对</text>
</svg>
