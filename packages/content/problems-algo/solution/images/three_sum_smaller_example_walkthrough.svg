<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [−2, 0, 1, 3]，target = 2</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">排序后仍为 [−2, 0, 1, 3]，n = 4，i 取 0..1</text>

  <!-- array grid with index labels -->
  <g font-size="12" fill="#333">
    <text x="40" y="86" font-size="11" fill="#888">下标：</text>
    <text x="120" y="86" text-anchor="middle" font-size="10" fill="#888">0</text>
    <text x="180" y="86" text-anchor="middle" font-size="10" fill="#888">1</text>
    <text x="240" y="86" text-anchor="middle" font-size="10" fill="#888">2</text>
    <text x="300" y="86" text-anchor="middle" font-size="10" fill="#888">3</text>

    <rect x="95" y="92" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="120" y="115" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">−2</text>

    <rect x="155" y="92" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="180" y="115" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">0</text>

    <rect x="215" y="92" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="240" y="115" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>

    <rect x="275" y="92" width="50" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="300" y="115" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">3</text>

    <text x="350" y="100" font-size="11" fill="#4a7a3a" font-weight="bold">绿=固定 i</text>
    <text x="350" y="116" font-size="11" fill="#446688" font-weight="bold">蓝=left 区间</text>
    <text x="350" y="132" font-size="11" fill="#d6a040" font-weight="bold">橙=right</text>
  </g>

  <!-- step table header -->
  <g font-size="10" fill="#555">
    <rect x="30" y="150" width="500" height="22" fill="#f0ede4" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="48" y="165" font-weight="bold">步</text>
    <text x="86" y="165" font-weight="bold">i</text>
    <text x="120" y="165" font-weight="bold">left</text>
    <text x="166" y="165" font-weight="bold">right</text>
    <text x="220" y="165" font-weight="bold">s</text>
    <text x="260" y="165" font-weight="bold">判定</text>
    <text x="370" y="165" font-weight="bold">动作</text>
    <text x="490" y="165" font-weight="bold">count</text>
  </g>

  <!-- row 1 -->
  <g font-size="10" fill="#333">
    <rect x="30" y="172" width="500" height="24" fill="#e6f4ea" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="48" y="188">1</text>
    <text x="86" y="188">0</text>
    <text x="120" y="188">1 (0)</text>
    <text x="166" y="188">3 (3)</text>
    <text x="220" y="188" font-weight="bold" fill="#4a7a3a">−2+0+3=1</text>
    <text x="260" y="188" fill="#4a7a3a" font-weight="bold">1 &lt; 2 ✓</text>
    <text x="370" y="188" fill="#4a7a3a">count += 3−1=2；left=2</text>
    <text x="490" y="188" font-weight="bold">2</text>
  </g>

  <!-- row 2 -->
  <g font-size="10" fill="#333">
    <rect x="30" y="196" width="500" height="24" fill="#fff8e1" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="48" y="212">2</text>
    <text x="86" y="212">0</text>
    <text x="120" y="212">2 (1)</text>
    <text x="166" y="212">3 (3)</text>
    <text x="220" y="212" font-weight="bold" fill="#d6a040">−2+1+3=2</text>
    <text x="260" y="212" fill="#d6a040" font-weight="bold">2 ≥ 2 ✗</text>
    <text x="370" y="212" fill="#d6a040">right−− → 2</text>
    <text x="490" y="212" font-weight="bold">2</text>
  </g>

  <!-- row 3 -->
  <g font-size="10" fill="#333">
    <rect x="30" y="220" width="500" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="48" y="236">3</text>
    <text x="86" y="236">0</text>
    <text x="120" y="236">2 (1)</text>
    <text x="166" y="236">2 (1)</text>
    <text x="220" y="236" fill="#888">—</text>
    <text x="260" y="236" fill="#888">left ≮ right</text>
    <text x="370" y="236" fill="#888">i=0 结束，进入 i=1</text>
    <text x="490" y="236" font-weight="bold">2</text>
  </g>

  <!-- row 4 -->
  <g font-size="10" fill="#333">
    <rect x="30" y="244" width="500" height="24" fill="#fff8e1" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="48" y="260">4</text>
    <text x="86" y="260">1</text>
    <text x="120" y="260">2 (1)</text>
    <text x="166" y="260">3 (3)</text>
    <text x="220" y="260" font-weight="bold" fill="#d6a040">0+1+3=4</text>
    <text x="260" y="260" fill="#d6a040" font-weight="bold">4 ≥ 2 ✗</text>
    <text x="370" y="260" fill="#d6a040">right−− → 2</text>
    <text x="490" y="260" font-weight="bold">2</text>
  </g>

  <!-- row 5 -->
  <g font-size="10" fill="#333">
    <rect x="30" y="268" width="500" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="48" y="284">5</text>
    <text x="86" y="284">1</text>
    <text x="120" y="284">2 (1)</text>
    <text x="166" y="284">2 (1)</text>
    <text x="220" y="284" fill="#888">—</text>
    <text x="260" y="284" fill="#888">left ≮ right</text>
    <text x="370" y="284" fill="#888">i=1 结束，i 已达 n−3</text>
    <text x="490" y="284" font-weight="bold">2</text>
  </g>

  <!-- highlight row 1 reasoning -->
  <rect x="30" y="308" width="500" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="44" y="328" font-size="11" fill="#4a7a3a" font-weight="bold">★ 步骤 1 的区间计数是全题关键：</text>
  <text x="44" y="344" font-size="10" fill="#555">固定 i=0(−2)、left=1(0) 时，right=3(3) 使 s=1 &lt; 2 命中。</text>
  <text x="44" y="358" font-size="10" fill="#555">因数组有序，right 取 2(1) 时 s=−2+0+1=−1 也 &lt; 2，故 [left+1 .. right] 共 (3−1)=2 个全命中。</text>

  <!-- final answer -->
  <rect x="30" y="384" width="500" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="408" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">最终答案 count = 2</text>

  <text x="280" y="442" text-anchor="middle" font-size="10" fill="#888">对应下标三元组 (0,1,2) 与 (0,1,3)——值不同但都靠步骤 1 的区间计数一次性收入</text>
</svg>
