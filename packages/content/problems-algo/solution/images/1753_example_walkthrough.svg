<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：a=4, b=4, c=6（a+b&gt;c，均衡情形）</text>

  <!-- table outer border -->
  <rect x="56" y="46" width="460" height="264" fill="none" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>

  <!-- header row -->
  <rect x="56" y="46" width="460" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="11" fill="#446688" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="86" y="66">步</text>
    <text x="186" y="66">三堆（排序后）</text>
    <text x="341" y="66">取两最大各消 1</text>
    <text x="471" y="66">得分</text>
  </g>

  <!-- column dividers -->
  <g stroke="#ddd" stroke-width="1" filter="url(#rough2)">
    <path d="M 116 76 L 116 310"/>
    <path d="M 256 76 L 256 310"/>
    <path d="M 426 76 L 426 310"/>
  </g>

  <!-- row backgrounds (alternating) -->
  <g filter="url(#rough2)">
    <rect x="57" y="76" width="458" height="29" fill="#fafafa"/>
    <rect x="57" y="105" width="458" height="29" fill="#f5f5f5"/>
    <rect x="57" y="134" width="458" height="29" fill="#fafafa"/>
    <rect x="57" y="163" width="458" height="29" fill="#f5f5f5"/>
    <rect x="57" y="192" width="458" height="29" fill="#fafafa"/>
    <rect x="57" y="221" width="458" height="29" fill="#f5f5f5"/>
    <rect x="57" y="250" width="458" height="29" fill="#fafafa"/>
    <rect x="57" y="279" width="458" height="31" fill="#e6f4ea"/>
  </g>

  <!-- row data -->
  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <!-- row 0 -->
    <text x="86" y="95">0</text>
    <text x="186" y="95">4, 4, 6</text>
    <text x="341" y="95">4 与 6</text>
    <text x="471" y="95" fill="#b85450" font-weight="bold">1</text>
    <!-- row 1 -->
    <text x="86" y="124">1</text>
    <text x="186" y="124">3, 4, 5</text>
    <text x="341" y="124">4 与 5</text>
    <text x="471" y="124" fill="#b85450" font-weight="bold">2</text>
    <!-- row 2 -->
    <text x="86" y="153">2</text>
    <text x="186" y="153">3, 3, 4</text>
    <text x="341" y="153">3 与 4</text>
    <text x="471" y="153" fill="#b85450" font-weight="bold">3</text>
    <!-- row 3 -->
    <text x="86" y="182">3</text>
    <text x="186" y="182">2, 3, 3</text>
    <text x="341" y="182">3 与 3</text>
    <text x="471" y="182" fill="#b85450" font-weight="bold">4</text>
    <!-- row 4 -->
    <text x="86" y="211">4</text>
    <text x="186" y="211">2, 2, 2</text>
    <text x="341" y="211">2 与 2</text>
    <text x="471" y="211" fill="#b85450" font-weight="bold">5</text>
    <!-- row 5 -->
    <text x="86" y="240">5</text>
    <text x="186" y="240">1, 1, 2</text>
    <text x="341" y="240">1 与 2</text>
    <text x="471" y="240" fill="#b85450" font-weight="bold">6</text>
    <!-- row 6 -->
    <text x="86" y="269">6</text>
    <text x="186" y="269">0, 1, 1</text>
    <text x="341" y="269">1 与 1</text>
    <text x="471" y="269" fill="#b85450" font-weight="bold">7</text>
    <!-- final row -->
    <text x="86" y="299" fill="#4a7a3a" font-weight="bold">终</text>
    <text x="186" y="299" fill="#4a7a3a" font-weight="bold">0, 0, 0</text>
    <text x="341" y="299" fill="#888">—</text>
    <text x="471" y="299" fill="#4a7a3a" font-weight="bold">7 = ⌊14/2⌋ ✓</text>
  </g>

  <!-- footer note -->
  <text x="280" y="338" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每步取两最大 → 三堆始终接近 → 不产生孤立堆 → 达到上界 ⌊(a+b+c)/2⌋</text>
</svg>
