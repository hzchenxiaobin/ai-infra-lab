<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="480" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：3 台机器 → 逐进程配对算耗时 → 按机器求平均</text>

  <!-- ===== 步骤①② 配对表 ===== -->
  <text x="330" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步骤 ①②：自连接 + 筛 start/end（每行 = 一个进程配对）</text>

  <!-- 表头 -->
  <rect x="40" y="60" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="85" y="76" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">m_id</text>
  <rect x="130" y="60" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="175" y="76" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">p_id</text>
  <rect x="220" y="60" width="130" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="285" y="76" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">start_ts</text>
  <rect x="350" y="60" width="130" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="415" y="76" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">end_ts</text>
  <rect x="480" y="60" width="140" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="550" y="76" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">耗时(end−start)</text>

  <!-- 行 m0 p0 -->
  <rect x="40" y="84" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="99" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="130" y="84" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="175" y="99" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="220" y="84" width="130" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="285" y="99" text-anchor="middle" font-size="10" fill="#4a7a3a">0.712</text>
  <rect x="350" y="84" width="130" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="415" y="99" text-anchor="middle" font-size="10" fill="#b85450">1.520</text>
  <rect x="480" y="84" width="140" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="550" y="99" text-anchor="middle" font-size="10" fill="#333">0.808</text>

  <!-- 行 m0 p1 -->
  <rect x="40" y="106" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="121" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="130" y="106" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="175" y="121" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="220" y="106" width="130" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="285" y="121" text-anchor="middle" font-size="10" fill="#4a7a3a">3.140</text>
  <rect x="350" y="106" width="130" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="415" y="121" text-anchor="middle" font-size="10" fill="#b85450">4.120</text>
  <rect x="480" y="106" width="140" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="550" y="121" text-anchor="middle" font-size="10" fill="#333">0.980</text>

  <!-- 行 m1 p0 -->
  <rect x="40" y="128" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="143" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="130" y="128" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="175" y="143" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="220" y="128" width="130" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="285" y="143" text-anchor="middle" font-size="10" fill="#4a7a3a">0.550</text>
  <rect x="350" y="128" width="130" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="415" y="143" text-anchor="middle" font-size="10" fill="#b85450">1.550</text>
  <rect x="480" y="128" width="140" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="550" y="143" text-anchor="middle" font-size="10" fill="#333">1.000</text>

  <!-- 行 m1 p1 -->
  <rect x="40" y="150" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="165" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="130" y="150" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="175" y="165" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="220" y="150" width="130" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="285" y="165" text-anchor="middle" font-size="10" fill="#4a7a3a">0.430</text>
  <rect x="350" y="150" width="130" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="415" y="165" text-anchor="middle" font-size="10" fill="#b85450">1.420</text>
  <rect x="480" y="150" width="140" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="550" y="165" text-anchor="middle" font-size="10" fill="#333">0.990</text>

  <!-- 行 m2 p0 -->
  <rect x="40" y="172" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="187" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="130" y="172" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="175" y="187" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="220" y="172" width="130" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="285" y="187" text-anchor="middle" font-size="10" fill="#4a7a3a">4.100</text>
  <rect x="350" y="172" width="130" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="415" y="187" text-anchor="middle" font-size="10" fill="#b85450">4.512</text>
  <rect x="480" y="172" width="140" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="550" y="187" text-anchor="middle" font-size="10" fill="#333">0.412</text>

  <!-- 行 m2 p1 -->
  <rect x="40" y="194" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="209" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="130" y="194" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="175" y="209" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="220" y="194" width="130" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="285" y="209" text-anchor="middle" font-size="10" fill="#4a7a3a">2.500</text>
  <rect x="350" y="194" width="130" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="415" y="209" text-anchor="middle" font-size="10" fill="#b85450">5.000</text>
  <rect x="480" y="194" width="140" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="550" y="209" text-anchor="middle" font-size="10" fill="#333">2.500</text>

  <!-- 分组箭头 -->
  <path d="M550 222 L550 250" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="600" y="240" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">GROUP BY</text>
  <text x="600" y="254" text-anchor="middle" font-size="9" fill="#b85450">machine_id</text>

  <!-- ===== 步骤③④ 分组求平均 ===== -->
  <text x="330" y="276" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">步骤 ③④：GROUP BY machine_id + ROUND(AVG(耗时), 3)</text>

  <!-- 分组求平均表头 -->
  <rect x="80" y="286" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="120" y="302" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">m_id</text>
  <rect x="160" y="286" width="160" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="240" y="302" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">各进程耗时</text>
  <rect x="320" y="286" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="380" y="302" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">求和÷2</text>
  <rect x="440" y="286" width="140" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="510" y="302" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">processing_time</text>

  <!-- m0 -->
  <rect x="80" y="310" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="328" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <rect x="160" y="310" width="160" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="240" y="328" text-anchor="middle" font-size="10" fill="#333">0.808, 0.980</text>
  <rect x="320" y="310" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="380" y="328" text-anchor="middle" font-size="10" fill="#333">1.788/2</text>
  <rect x="440" y="310" width="140" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="510" y="328" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">0.894</text>

  <!-- m1 -->
  <rect x="80" y="336" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="354" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="160" y="336" width="160" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="240" y="354" text-anchor="middle" font-size="10" fill="#333">1.000, 0.990</text>
  <rect x="320" y="336" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="380" y="354" text-anchor="middle" font-size="10" fill="#333">1.990/2</text>
  <rect x="440" y="336" width="140" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="510" y="354" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">0.995</text>

  <!-- m2 -->
  <rect x="80" y="362" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="380" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="160" y="362" width="160" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="240" y="380" text-anchor="middle" font-size="10" fill="#333">0.412, 2.500</text>
  <rect x="320" y="362" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="380" y="380" text-anchor="middle" font-size="10" fill="#333">2.912/2</text>
  <rect x="440" y="362" width="140" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="510" y="380" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1.456</text>

  <!-- 底部说明 -->
  <rect x="40" y="406" width="580" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="428" font-size="10.5" fill="#333">每台机器各 2 个进程 → AVG 分母 = 2 = 进程数（配对后每行非 NULL）</text>
  <text x="60" y="448" font-size="10.5" fill="#333">ROUND(..., 3) 既满足题意「保留 3 位小数」，又消除浮点累加的尾误差</text>
</svg>
