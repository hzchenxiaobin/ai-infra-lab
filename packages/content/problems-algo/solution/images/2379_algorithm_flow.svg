<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：定长滑动窗口 + W 计数滚动 + 维护最小值</text>

  <!-- Step 1: init first window -->
  <rect x="90" y="44" width="360" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① cnt = blocks[0:k) 中 'W' 的个数；ans = cnt</text>

  <!-- arrow -->
  <line x1="270" y1="82" x2="270" y2="100" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: for loop -->
  <rect x="120" y="104" width="300" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② for i = 1 .. n−k：</text>

  <!-- arrow into loop body -->
  <line x1="270" y1="138" x2="270" y2="154" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: remove head -->
  <rect x="70" y="158" width="400" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="180" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">若 blocks[i−1] == 'W'：cnt -= 1（去头）</text>

  <!-- arrow -->
  <line x1="270" y1="192" x2="270" y2="206" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: add tail -->
  <rect x="70" y="210" width="400" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="232" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">若 blocks[i+k−1] == 'W'：cnt += 1（加尾）</text>

  <!-- arrow -->
  <line x1="270" y1="244" x2="270" y2="258" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: update ans -->
  <rect x="120" y="262" width="300" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="284" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans = min(ans, cnt)</text>

  <!-- loop back arrow (right side) -->
  <path d="M 420 279 Q 500 279 500 121 L 420 121" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="510" y="200" font-size="9.5" fill="#888">下一 i</text>

  <!-- converge -->
  <line x1="270" y1="296" x2="270" y2="312" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: return -->
  <rect x="110" y="316" width="320" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="340" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">③ 遍历结束：返回 ans</text>

  <!-- footer -->
  <rect x="30" y="372" width="480" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="392" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">关键：相邻窗口只差去头/加尾一个字符，故 W 计数 O(1) 滚动更新</text>
  <text x="270" y="408" text-anchor="middle" font-size="10" fill="#888">去头判 W 减、加尾判 W 加；min(ans, cnt) 全程维护窗口 W 数的最小值</text>
  <text x="270" y="424" text-anchor="middle" font-size="10" fill="#888">首窗 O(k) 建表 + 后续 n−k 次 O(1) 滚动 = 总 O(n) 时间、O(1) 额外空间</text>
</svg>
