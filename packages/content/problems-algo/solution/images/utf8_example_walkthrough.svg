<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="320" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：data = [197, 130, 1] → true</text>

  <!-- Header row: 下标 | 0 | 1 | 2 -->
  <rect x="40" y="50" width="80" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="80" y="70" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">下标</text>
  <rect x="120" y="50" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="70" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="240" y="50" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="70" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="360" y="50" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="70" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- Row: 十进制 -->
  <rect x="40" y="80" width="80" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="80" y="100" text-anchor="middle" font-size="12" fill="#555">十进制</text>
  <rect x="120" y="80" width="120" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="180" y="100" text-anchor="middle" font-size="13" fill="#333">197</text>
  <rect x="240" y="80" width="120" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="300" y="100" text-anchor="middle" font-size="13" fill="#333">130</text>
  <rect x="360" y="80" width="120" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="420" y="100" text-anchor="middle" font-size="13" fill="#333">1</text>

  <!-- Row: 二进制 -->
  <rect x="40" y="110" width="80" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="80" y="130" text-anchor="middle" font-size="12" fill="#555">二进制</text>
  <rect x="120" y="110" width="120" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="180" y="130" text-anchor="middle" font-size="12" fill="#333">11000101</text>
  <rect x="240" y="110" width="120" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="300" y="130" text-anchor="middle" font-size="12" fill="#333">10000010</text>
  <rect x="360" y="110" width="120" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="420" y="130" text-anchor="middle" font-size="12" fill="#333">00000001</text>

  <!-- Row: 解读 -->
  <rect x="40" y="140" width="80" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="80" y="164" text-anchor="middle" font-size="12" fill="#555">解读</text>
  <rect x="120" y="140" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="180" y="158" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">首字节 110…</text>
  <text x="180" y="173" text-anchor="middle" font-size="10" fill="#555">k=2，需 1 个续字节</text>
  <rect x="240" y="140" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="300" y="158" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">续字节 10…</text>
  <text x="300" y="173" text-anchor="middle" font-size="10" fill="#555">✓ 合法续接</text>
  <rect x="360" y="140" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="420" y="158" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">首字节 0…</text>
  <text x="420" y="173" text-anchor="middle" font-size="10" fill="#555">k=1，独立字符</text>

  <!-- Grouping brackets -->
  <path d="M 125 192 L 125 202 L 355 202 L 355 192" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="240" y="220" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">字符 1（2 字节）</text>

  <path d="M 365 192 L 365 202 L 475 202 L 475 192" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="420" y="220" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">字符 2（1 字节）</text>

  <!-- Result -->
  <rect x="80" y="240" width="360" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="260" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">扫描结束：i = 3 = n，全部字节成功分组</text>
  <text x="260" y="278" text-anchor="middle" font-size="11" fill="#555">→ 返回 true</text>
</svg>
