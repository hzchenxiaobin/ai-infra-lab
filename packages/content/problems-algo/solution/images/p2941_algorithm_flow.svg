<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：滚动右端点，增量维护 (j, g) 分组表</text>

  <rect x="140" y="40" width="240" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="12" fill="#333">预处理前缀和 pre[0..n]</text>

  <path d="M 260 68 L 260 84" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="140" y="86" width="240" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="104" text-anchor="middle" font-size="12" fill="#333">for i = 0 … n−1：x = nums[i]</text>

  <path d="M 260 114 L 260 130" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="140" y="132" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="152" text-anchor="middle" font-size="11.5" fill="#333">① 全表合并：g ← gcd(g, x)</text>

  <path d="M 260 164 L 260 180" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="140" y="182" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="202" text-anchor="middle" font-size="11.5" fill="#333">② 相邻同 gcd：只保留 j 更小者</text>

  <path d="M 260 214 L 260 230" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="140" y="232" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="11.5" fill="#333">③ 追加 (i, x)；gcd 已存在则跳过</text>

  <path d="M 260 264 L 260 280" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="140" y="282" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="11" fill="#333">④ 遍历表：若 i − j + 1 ≥ k</text>
  <text x="260" y="314" text-anchor="middle" font-size="11" fill="#333">ans ← max(ans, g×(pre[i+1]−pre[j]))</text>

  <path d="M 260 322 L 260 338" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="140" y="340" width="240" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 ans</text>

  <!-- loop back rail -->
  <path d="M 380 302 L 428 302 L 428 100 L 380 100" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="434" y="204" font-size="10.5" fill="#d6a040" font-weight="bold">i ← i+1</text>

  <!-- left annotations -->
  <text x="118" y="152" text-anchor="end" font-size="10" fill="#888">整除链保持有序</text>
  <path d="M 122 148 L 138 148" stroke="#999" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="118" y="202" text-anchor="end" font-size="10" fill="#888">重复必相邻出现</text>
  <path d="M 122 198 L 138 198" stroke="#999" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="118" y="252" text-anchor="end" font-size="10" fill="#888">单元素组 [i..i]</text>
  <path d="M 122 248 L 138 248" stroke="#999" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="118" y="304" text-anchor="end" font-size="10" fill="#888">每组 1 个候选</text>
  <path d="M 122 300 L 138 300" stroke="#999" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <text x="30" y="384" font-size="11.5" fill="#4a7a3a" font-weight="bold">表长 ≤ ⌊log₂V⌋+1 ≈ 21 → 总时间 O(n log V)，空间 O(n)</text>
</svg>
