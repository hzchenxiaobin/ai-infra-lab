<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 405"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="405" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">从右向左单趟扫描：首次命中即答案</text>

  <!-- 初始化 -->
  <g filter="url(#rough2)">
    <rect x="215" y="38" width="130" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="58" text-anchor="middle" font-size="12.5" fill="#33506b">i ← n − 2</text>
  </g>
  <path d="M 280 70 L 280 84" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 1：i >= 0 ? -->
  <g filter="url(#rough2)">
    <polygon points="280,88 372,122 280,156 188,122" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="280" y="127" text-anchor="middle" font-size="12.5" fill="#33506b">i ≥ 0 ?</text>
  </g>
  <text x="388" y="112" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 372 122 L 420 122" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="424" y="100" width="122" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="485" y="118" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold">返回 0</text>
    <text x="485" y="135" text-anchor="middle" font-size="9" fill="#2f5d24">无违规 · 已严格递增</text>
  </g>

  <text x="293" y="172" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 280 156 L 280 170" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 2：违规？ -->
  <g filter="url(#rough2)">
    <polygon points="280,174 400,210 280,246 160,210" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="280" y="212" text-anchor="middle" font-size="11.5" fill="#33506b">nums[i] ≥ nums[i+1] ?</text>
    <text x="280" y="230" text-anchor="middle" font-size="9" fill="#33506b">（含相等）</text>
  </g>
  <text x="134" y="200" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 160 210 L 116 210" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="22" y="188" width="90" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="67" y="208" text-anchor="middle" font-size="12.5" fill="#8a6d1a" font-weight="bold">返回 i+1</text>
    <text x="67" y="225" text-anchor="middle" font-size="9" fill="#8a6d1a">命中即最右违规</text>
  </g>

  <text x="293" y="260" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 280 246 L 280 260" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 左移 -->
  <g filter="url(#rough2)">
    <rect x="215" y="264" width="130" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="284" text-anchor="middle" font-size="12.5" fill="#33506b">i ← i − 1</text>
  </g>

  <!-- 回环 -->
  <path d="M 215 280 L 90 280 L 90 122 L 184 122" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="271" font-size="10" fill="#7a8aa0" filter="url(#rough2)">继续左移</text>

  <!-- 易错提示 -->
  <g filter="url(#rough2)">
    <rect x="418" y="185" width="134" height="104" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="485" y="205" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">💡 易错三连</text>
    <text x="485" y="224" text-anchor="middle" font-size="10" fill="#8a6d1a">① ≥ 别写成 ＞</text>
    <text x="485" y="241" text-anchor="middle" font-size="10" fill="#8a6d1a">② 返回 i+1 非 i</text>
    <text x="485" y="258" text-anchor="middle" font-size="10" fill="#8a6d1a">③ n=1 天然返 0</text>
  </g>

  <!-- 底部说明 -->
  <g filter="url(#rough2)">
    <rect x="70" y="322" width="420" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="280" y="345" text-anchor="middle" font-size="10.5" fill="#2f5d24">从左向右扫也行：记「最后一个违规」扫完再答；</text>
    <text x="280" y="364" text-anchor="middle" font-size="10.5" fill="#2f5d24">从右向左首次命中即可 return——平均更早退出，最坏 O(n)</text>
  </g>
</svg>
