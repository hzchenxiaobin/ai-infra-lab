<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">流程：T 填充 → KMP 自动机 → 倒序 ok DP → 正向贪心</text>

  <!-- 行 1 -->
  <rect x="22" y="38" width="128" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="86" y="57" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">读入 str1, str2</text>
  <text x="86" y="73" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">L = n + m − 1</text>

  <rect x="180" y="38" width="142" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="251" y="57" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">阶段一：T 窗口逐位写入</text>
  <text x="251" y="73" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">str2 钉进 word</text>

  <polygon points="392,38 460,60 392,82 324,60" fill="#fff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="392" y="65" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">写入冲突?</text>

  <path d="M 150 60 L 178 60" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 322 60 L 324 60" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <rect x="452" y="38" width="60" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="482" y="57" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">返回</text>
  <text x="482" y="73" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">""</text>
  <path d="M 460 60 L 452 60" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="458" y="32" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- 行 1 → 行 2 -->
  <path d="M 392 82 L 392 96 L 86 96 L 86 118" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="234" y="92" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否（Fine–Wilf 保证逐对一致）</text>

  <!-- 行 2 -->
  <rect x="22" y="120" width="128" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="86" y="139" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">建 fail + 转移表</text>
  <text x="86" y="155" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">(m+1) × 26</text>

  <rect x="180" y="120" width="142" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="251" y="139" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">倒序 DP：ok[x][j]</text>
  <text x="251" y="155" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">F 端点禁态 m</text>

  <polygon points="392,120 460,142 392,164 324,142" fill="#fff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="392" y="140" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ok[0][0]</text>
  <text x="392" y="154" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">为真?</text>

  <path d="M 150 142 L 178 142" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 322 142 L 324 142" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <rect x="452" y="120" width="60" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="482" y="139" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">返回</text>
  <text x="482" y="155" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">""</text>
  <path d="M 460 142 L 452 142" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="458" y="114" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 行 2 → 行 3 -->
  <path d="M 392 164 L 392 178 L 86 178 L 86 200" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="174" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- 行 3 -->
  <rect x="22" y="202" width="180" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="112" y="221" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">正向贪心：固定位直行</text>
  <text x="112" y="238" text-anchor="middle" font-size="11.5" fill="#a07020" font-weight="bold" filter="url(#rough2)">自由位先 'a' 后 'b'</text>

  <rect x="240" y="202" width="150" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="315" y="221" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">拼接输出 word</text>
  <text x="315" y="238" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">字典序最小 ✓</text>

  <path d="M 202 225 L 238 225" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部复杂度框 -->
  <rect x="22" y="278" width="476" height="62" rx="8" fill="#fff" stroke="#888" stroke-width="1.3" stroke-dasharray="6,3" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">复杂度</text>
  <text x="260" y="316" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">时间 O(n·m + L·m)：T 写入 ≤ 5×10⁶，DP ≤ 2·L·(m+1) ≈ 10⁷</text>
  <text x="260" y="332" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">空间 O(L·m)：ok 表 ≈ 5 MB，转移表 O(26m) 可忽略</text>
</svg>
