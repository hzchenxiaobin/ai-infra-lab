<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">自顶向下 DFS 流程：dfs(node, parentVal, length)</text>

  <!-- 入口 -->
  <rect x="190" y="44" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333">dfs(node, parentVal, length)</text>

  <!-- 判空 菱形 -->
  <path d="M 280 80 L 345 112 L 280 144 L 215 112 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="116" text-anchor="middle" font-size="11" fill="#333">node == null?</text>
  <path d="M 280 72 L 280 80" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 是 → return -->
  <path d="M 345 112 L 420 112" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="104" font-size="10" fill="#4a7a3a">是</text>
  <rect x="420" y="98" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="116" text-anchor="middle" font-size="11" fill="#333">return</text>

  <!-- 否 → 判定续接 -->
  <path d="M 215 112 L 150 112" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="104" font-size="10" fill="#b85450">否</text>
  <rect x="60" y="98" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="105" y="116" text-anchor="middle" font-size="11" fill="#333">判定续接</text>

  <path d="M 105 126 L 105 150 L 280 150 L 280 168" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 续接? 菱形 -->
  <path d="M 280 168 L 365 200 L 280 232 L 195 200 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="10" fill="#333">node.val ==</text>
  <text x="280" y="210" text-anchor="middle" font-size="10" fill="#333">parentVal + 1 ?</text>

  <!-- 否 → length = 1 -->
  <path d="M 195 200 L 120 200" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="192" font-size="10" fill="#b85450">否</text>
  <rect x="40" y="186" width="90" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="85" y="204" text-anchor="middle" font-size="11" fill="#333">length = 1</text>

  <!-- 是 → length += 1 -->
  <path d="M 365 200 L 420 200" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="192" font-size="10" fill="#4a7a3a">是</text>
  <rect x="420" y="186" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="204" text-anchor="middle" font-size="11" fill="#333">length += 1</text>

  <!-- 两分支汇合到 maxLen 更新 -->
  <path d="M 85 214 L 85 256 L 280 256" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 470 214 L 470 256 L 280 256" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 280 256 L 280 268" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- maxLen 更新 -->
  <rect x="180" y="268" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">maxLen = max(maxLen, length)</text>

  <path d="M 280 298 L 280 312" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 递归左右 -->
  <rect x="110" y="312" width="340" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="11" fill="#333">dfs(node.left, node.val, length)</text>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#333">dfs(node.right, node.val, length)</text>

  <!-- 底部说明 -->
  <rect x="40" y="372" width="480" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#555">一次 DFS 遍历每条父→子边一次 · streak 沿递归参数向下传递</text>
  <text x="280" y="410" text-anchor="middle" font-size="11" fill="#b85450">根节点传 parentVal=root.val 使续接失败 → length 重置为 1（统一入口）</text>
</svg>
