<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历维护全局最值</text>

  <!-- init box -->
  <g filter="url(#rough2)">
    <rect x="100" y="48" width="300" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="250" y="67" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">初始化</text>
    <text x="250" y="82" text-anchor="middle" font-size="11" fill="#444">min_val = arrays[0][0], max_val = arrays[0][−1], result = 0, i = 1</text>
  </g>
  <path d="M 250 90 L 250 110" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: i < m ? -->
  <g filter="url(#rough2)">
    <polygon points="250,114 330,154 250,194 170,154" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="250" y="150" text-anchor="middle" font-size="12" fill="#a07820" font-weight="bold">i &lt; m ?</text>
    <text x="250" y="166" text-anchor="middle" font-size="9.5" fill="#888">还有数组</text>
  </g>

  <!-- no branch -->
  <path d="M 330 154 L 380 154" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="146" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="382" y="136" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="442" y="159" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 result</text>
  </g>

  <!-- yes branch -->
  <path d="M 250 194 L 250 216" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="210" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- cur_min / cur_max -->
  <g filter="url(#rough2)">
    <rect x="90" y="220" width="320" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="250" y="239" text-anchor="middle" font-size="11.5" fill="#333">取当前数组首尾</text>
    <text x="250" y="254" text-anchor="middle" font-size="11" fill="#444">cur_min = arrays[i][0],  cur_max = arrays[i][−1]</text>
  </g>
  <path d="M 250 262 L 250 282" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- compute result -->
  <g filter="url(#rough2)">
    <rect x="60" y="286" width="380" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="250" y="305" text-anchor="middle" font-size="11.5" fill="#a07820" font-weight="bold">先算（prev 来自之前的数组）</text>
    <text x="250" y="320" text-anchor="middle" font-size="11" fill="#444">result = max(result, cur_max − min_val, max_val − cur_min)</text>
  </g>
  <path d="M 250 328 L 250 348" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- update + i++ -->
  <g filter="url(#rough2)">
    <rect x="70" y="352" width="360" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="250" y="371" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">后更新</text>
    <text x="250" y="386" text-anchor="middle" font-size="11" fill="#444">min_val = min(min_val, cur_min), max_val = max(max_val, cur_max), i++</text>
  </g>

  <!-- loop back -->
  <path d="M 70 373 L 40 373 L 40 154 L 168 154" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="50" y="270" font-size="9" fill="#888" filter="url(#rough2)" transform="rotate(-90 50 270)">回到循环头</text>
</svg>
