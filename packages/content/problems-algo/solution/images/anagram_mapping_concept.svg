<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：为 B 建「倒排索引」(值→下标列表)，对每个 A[i] 查表取一个下标</text>

  <!-- Row A: nums1 -->
  <text x="30" y="70" font-size="12" fill="#888">A =</text>
  <rect x="70" y="54" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="98" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">12</text>
  <text x="98" y="100" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">i=0 ← 当前</text>

  <rect x="128" y="54" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="156" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">28</text>
  <text x="156" y="100" text-anchor="middle" font-size="10" fill="#888">i=1</text>

  <rect x="186" y="54" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">46</text>
  <text x="214" y="100" text-anchor="middle" font-size="10" fill="#888">i=2</text>

  <rect x="244" y="54" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">32</text>
  <text x="272" y="100" text-anchor="middle" font-size="10" fill="#888">i=3</text>

  <rect x="302" y="54" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">50</text>
  <text x="330" y="100" text-anchor="middle" font-size="10" fill="#888">i=4</text>

  <!-- query note -->
  <text x="380" y="75" font-size="12" fill="#b85450" font-weight="bold">A[0]=12</text>
  <text x="380" y="92" font-size="11" fill="#888">要找它在 B 里的下标</text>

  <!-- arrow from A[0] down to map -->
  <path d="M 98 108 L 98 150" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- HashMap box -->
  <text x="30" y="172" font-size="12" fill="#888">倒排索引 map（由 B 构建）：</text>
  <rect x="70" y="150" width="220" height="160" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="180" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">值 → B 中的下标</text>
  <line x1="80" y1="178" x2="280" y2="178" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>

  <rect x="80" y="184" width="200" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="120" y="200" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">12</text>
  <text x="220" y="200" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[1]</text>

  <rect x="80" y="208" width="200" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="224" text-anchor="middle" font-size="11" fill="#333">28</text>
  <text x="220" y="224" text-anchor="middle" font-size="11" fill="#333">[4]</text>

  <rect x="80" y="232" width="200" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="248" text-anchor="middle" font-size="11" fill="#333">46</text>
  <text x="220" y="248" text-anchor="middle" font-size="11" fill="#333">[3]</text>

  <rect x="80" y="256" width="200" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="272" text-anchor="middle" font-size="11" fill="#333">32</text>
  <text x="220" y="272" text-anchor="middle" font-size="11" fill="#333">[2]</text>

  <rect x="80" y="280" width="200" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="296" text-anchor="middle" font-size="11" fill="#333">50</text>
  <text x="220" y="296" text-anchor="middle" font-size="11" fill="#333">[0]</text>

  <!-- arrow from map to result -->
  <path d="M 290 195 L 360 335" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="262" font-size="11" fill="#b85450" font-weight="bold">取 1</text>

  <!-- Result P -->
  <text x="30" y="350" font-size="12" fill="#888">P =</text>
  <rect x="70" y="334" width="56" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="98" y="355" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="98" y="380" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">P[0]=1</text>

  <rect x="128" y="334" width="56" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3,3" rx="4" filter="url(#rough2)"/>
  <text x="156" y="355" text-anchor="middle" font-size="13" fill="#bbb">?</text>
  <rect x="186" y="334" width="56" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3,3" rx="4" filter="url(#rough2)"/>
  <text x="214" y="355" text-anchor="middle" font-size="13" fill="#bbb">?</text>
  <rect x="244" y="334" width="56" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3,3" rx="4" filter="url(#rough2)"/>
  <text x="272" y="355" text-anchor="middle" font-size="13" fill="#bbb">?</text>
  <rect x="302" y="334" width="56" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3,3" rx="4" filter="url(#rough2)"/>
  <text x="330" y="355" text-anchor="middle" font-size="13" fill="#bbb">?</text>

  <!-- side note -->
  <rect x="380" y="150" width="220" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="390" y="172" font-size="11" fill="#333" font-weight="bold">为什么存「列表」而非单值？</text>
  <text x="390" y="190" font-size="11" fill="#555">B 可能含重复元素，</text>
  <text x="390" y="206" font-size="11" fill="#555">同一值占多个下标。</text>
  <text x="390" y="222" font-size="11" fill="#555">用列表 + 逐个取出，</text>
  <text x="390" y="236" font-size="11" fill="#4a7a3a" font-weight="bold">保证下标不重复使用。</text>

  <!-- permutation note -->
  <rect x="380" y="256" width="220" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="390" y="278" font-size="11" fill="#333" font-weight="bold">B 是 A 的排列（变位）</text>
  <text x="390" y="296" font-size="11" fill="#555">⇒ 每个值的计数相同，</text>
  <text x="390" y="312" font-size="11" fill="#555">查表必能取到下标，</text>
  <text x="390" y="328" font-size="11" fill="#446688" font-weight="bold">不会取空。</text>
</svg>
