<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="370" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：曼哈顿等距层 = 菱形环，BFS 逐层扩展</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">5×5 网格，中心 (2,2)，同距离格子同色，构成旋转 45° 的菱形</text>

  <!-- 5x5 grid with distance-colored cells -->
  <g filter="url(#rough2)" font-size="15" font-weight="bold">
    <!-- Diamond ring overlays (dashed) -->
    <polygon points="180,136 224,180 180,224 136,180" fill="none" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.6"/>
    <polygon points="180,92 268,180 180,268 92,180" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.5"/>

    <!-- Row 0: d=4,3,2,3,4 -->
    <rect x="70" y="70" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="92" y="98" text-anchor="middle" fill="#b85450">4</text>
    <rect x="114" y="70" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="136" y="98" text-anchor="middle" fill="#b85450">3</text>
    <rect x="158" y="70" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="180" y="98" text-anchor="middle" fill="#446688">2</text>
    <rect x="202" y="70" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="224" y="98" text-anchor="middle" fill="#b85450">3</text>
    <rect x="246" y="70" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="268" y="98" text-anchor="middle" fill="#b85450">4</text>

    <!-- Row 1: d=3,2,1,2,3 -->
    <rect x="70" y="114" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="92" y="142" text-anchor="middle" fill="#b85450">3</text>
    <rect x="114" y="114" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="136" y="142" text-anchor="middle" fill="#446688">2</text>
    <rect x="158" y="114" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="180" y="142" text-anchor="middle" fill="#4a7a3a">1</text>
    <rect x="202" y="114" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="224" y="142" text-anchor="middle" fill="#446688">2</text>
    <rect x="246" y="114" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="268" y="142" text-anchor="middle" fill="#b85450">3</text>

    <!-- Row 2: d=2,1,0,1,2 -->
    <rect x="70" y="158" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="92" y="186" text-anchor="middle" fill="#446688">2</text>
    <rect x="114" y="158" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="136" y="186" text-anchor="middle" fill="#4a7a3a">1</text>
    <rect x="158" y="158" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="180" y="186" text-anchor="middle" fill="#d6a040">0</text>
    <rect x="202" y="158" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="224" y="186" text-anchor="middle" fill="#4a7a3a">1</text>
    <rect x="246" y="158" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="268" y="186" text-anchor="middle" fill="#446688">2</text>

    <!-- Row 3: d=3,2,1,2,3 -->
    <rect x="70" y="202" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="92" y="230" text-anchor="middle" fill="#b85450">3</text>
    <rect x="114" y="202" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="136" y="230" text-anchor="middle" fill="#446688">2</text>
    <rect x="158" y="202" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="180" y="230" text-anchor="middle" fill="#4a7a3a">1</text>
    <rect x="202" y="202" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="224" y="230" text-anchor="middle" fill="#446688">2</text>
    <rect x="246" y="202" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="268" y="230" text-anchor="middle" fill="#b85450">3</text>

    <!-- Row 4: d=4,3,2,3,4 -->
    <rect x="70" y="246" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="92" y="274" text-anchor="middle" fill="#b85450">4</text>
    <rect x="114" y="246" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="136" y="274" text-anchor="middle" fill="#b85450">3</text>
    <rect x="158" y="246" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="180" y="274" text-anchor="middle" fill="#446688">2</text>
    <rect x="202" y="246" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="224" y="274" text-anchor="middle" fill="#b85450">3</text>
    <rect x="246" y="246" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="268" y="274" text-anchor="middle" fill="#b85450">4</text>
  </g>

  <!-- Center marker -->
  <text x="180" y="64" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">↓ 中心 (2,2)</text>

  <!-- Right-side annotations -->
  <g filter="url(#rough2)" font-size="12">
    <!-- d=0 orange -->
    <rect x="320" y="78" width="200" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="420" y="96" text-anchor="middle" fill="#d6a040" font-weight="bold">d = 0：中心点</text>
    <text x="420" y="111" text-anchor="middle" fill="#d6a040" font-size="10">BFS 第 0 层，1 个格子</text>
    <path d="M 320 99 L 290 180" stroke="#d6a040" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arrO)"/>

    <!-- d=1 green -->
    <rect x="320" y="130" width="200" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="420" y="148" text-anchor="middle" fill="#4a7a3a" font-weight="bold">d = 1：小菱形（4 格）</text>
    <text x="420" y="163" text-anchor="middle" fill="#4a7a3a" font-size="10">BFS 第 1 层，4 个邻居</text>

    <!-- d=2 blue -->
    <rect x="320" y="182" width="200" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="420" y="200" text-anchor="middle" fill="#446688" font-weight="bold">d = 2：中菱形（8 格）</text>
    <text x="420" y="215" text-anchor="middle" fill="#446688" font-size="10">BFS 第 2 层，逐层扩展</text>

    <!-- d>=3 pink -->
    <rect x="320" y="234" width="200" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="420" y="252" text-anchor="middle" fill="#b85450" font-weight="bold">d ≥ 3：外层菱形</text>
    <text x="420" y="267" text-anchor="middle" fill="#b85450" font-size="10">越外层距离越大，后访问</text>

    <!-- Key insight box -->
    <rect x="320" y="286" width="200" height="56" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="8"/>
    <text x="420" y="304" text-anchor="middle" fill="#555" font-weight="bold" font-size="11">💡 BFS 出队顺序 = 距离升序</text>
    <text x="420" y="319" text-anchor="middle" fill="#777" font-size="10">边权为 1 ⟹ 最短路 = 曼哈顿距离</text>
    <text x="420" y="333" text-anchor="middle" fill="#777" font-size="10">无需排序，遍历即有序</text>
  </g>

  <!-- Diamond ring labels -->
  <text x="195" y="132" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">d=1</text>
  <text x="195" y="88" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">d=2</text>

  <text x="270" y="356" text-anchor="middle" font-size="10" fill="#888">数字 = 到中心的曼哈顿距离 | 虚线菱形 = 等距层轮廓 | BFS 逐层消化这些菱形环</text>
</svg>
