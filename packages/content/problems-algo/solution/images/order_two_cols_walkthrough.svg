<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：拆分 → 两组 rn → JOIN 配对（对比错误写法）</text>

  <!-- ===== Original Data ===== -->
  <rect x="195" y="40" width="150" height="116" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="56" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Data 原表</text>
  <line x1="195" y1="62" x2="345" y2="62" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="212" y="76" font-size="9" fill="#888">first   second</text>
  <text x="216" y="94" font-size="10" fill="#333">4         2</text>
  <text x="216" y="110" font-size="10" fill="#333">2         3</text>
  <text x="216" y="126" font-size="10" fill="#333">3         1</text>
  <text x="216" y="142" font-size="10" fill="#333">1         4</text>

  <!-- Split arrows -->
  <path d="M 250 156 Q 250 172 160 184" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290 156 Q 290 172 380 184" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="172" font-size="8" fill="#4a7a3a">first ASC</text>
  <text x="312" y="172" font-size="8" fill="#d6a040">second DESC</text>

  <!-- ===== CTE a: first_col ASC ===== -->
  <rect x="70" y="184" width="180" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">CTE a：first_col ↑ ASC</text>
  <line x1="70" y1="206" x2="250" y2="206" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="86" y="220" font-size="9" fill="#888">rn      first</text>
  <text x="90" y="238" font-size="10" fill="#333">1         1</text>
  <text x="90" y="254" font-size="10" fill="#333">2         2</text>
  <text x="90" y="270" font-size="10" fill="#333">3         3</text>
  <text x="90" y="286" font-size="10" fill="#333">4         4</text>

  <!-- ===== CTE b: second_col DESC ===== -->
  <rect x="290" y="184" width="180" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="380" y="200" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">CTE b：second_col ↓ DESC</text>
  <line x1="290" y1="206" x2="470" y2="206" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="306" y="220" font-size="9" fill="#888">rn      second</text>
  <text x="310" y="238" font-size="10" fill="#333">1         4</text>
  <text x="310" y="254" font-size="10" fill="#333">2         3</text>
  <text x="310" y="270" font-size="10" fill="#333">3         2</text>
  <text x="310" y="286" font-size="10" fill="#333">4         1</text>

  <!-- Converging arrows to result -->
  <path d="M 160 296 Q 160 312 160 324" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 296 Q 380 312 380 324" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="314" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">JOIN on rn：第 i 行配对</text>

  <!-- ===== Result (correct) ===== -->
  <rect x="70" y="326" width="180" height="112" fill="#fff" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="160" y="342" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">结果 ✓ JOIN on rn</text>
  <line x1="70" y1="348" x2="250" y2="348" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="86" y="362" font-size="9" fill="#888">first   second</text>
  <text x="90" y="380" font-size="10" fill="#333">1         4</text>
  <text x="90" y="396" font-size="10" fill="#333">2         3</text>
  <text x="90" y="412" font-size="10" fill="#333">3         2</text>
  <text x="90" y="428" font-size="10" fill="#333">4         1</text>

  <!-- ===== Wrong (single ORDER BY) ===== -->
  <rect x="290" y="326" width="180" height="112" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="380" y="342" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">单 ORDER BY ✗ 整行换序</text>
  <line x1="290" y1="348" x2="470" y2="348" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="306" y="362" font-size="9" fill="#888">first   second</text>
  <text x="310" y="380" font-size="10" fill="#333">1         4</text>
  <text x="310" y="396" font-size="10" fill="#333">2         3</text>
  <text x="310" y="412" font-size="10" fill="#b85450">3         1</text>
  <text x="310" y="428" font-size="10" fill="#b85450">4         2</text>

  <!-- ===== Bottom note ===== -->
  <rect x="30" y="446" width="480" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="464" text-anchor="middle" font-size="9" fill="#666">错误写法 second = 4,3,1,2（非降序，(3,1)(4,2) 仍同行耦合）；正确写法 second = 4,3,2,1（独立降序）</text>
</svg>
