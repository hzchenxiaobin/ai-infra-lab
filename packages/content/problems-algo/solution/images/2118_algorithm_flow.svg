<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：排序 → CASE 格式化 → 拼接 → 补 "=0"</text>

  <!-- Step 1: Read Terms -->
  <rect x="180" y="42" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="63" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">① 读取 Terms 表 (power, factor)</text>

  <path d="M 280 78 L 280 94" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Sort by power DESC -->
  <rect x="180" y="98" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="119" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">② 按 power 降序排序</text>

  <path d="M 280 134 L 280 148" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: CASE format (diamond) -->
  <polygon points="280,152 420,196 280,240 140,196" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="186" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">③ CASE 格式化每项</text>
  <text x="280" y="202" text-anchor="middle" font-size="10" fill="#555">按 power 值分三路</text>
  <text x="280" y="216" text-anchor="middle" font-size="10" fill="#555">生成 term 字符串</text>

  <!-- Three branches from diamond -->
  <!-- Left: power = 0 -->
  <path d="M 140 196 L 80 196 L 80 260" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="264" width="120" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="282" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">power = 0</text>
  <text x="80" y="298" text-anchor="middle" font-size="9.5" fill="#555">sign + ABS(factor)</text>
  <text x="80" y="310" text-anchor="middle" font-size="9" fill="#888">例：+2 / -3</text>

  <!-- Center: power = 1 -->
  <path d="M 280 240 L 280 260" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="220" y="264" width="120" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">power = 1</text>
  <text x="280" y="298" text-anchor="middle" font-size="9.5" fill="#555">sign + ABS(f) + "X"</text>
  <text x="280" y="310" text-anchor="middle" font-size="9" fill="#888">例：+3X / -4X</text>

  <!-- Right: power > 1 -->
  <path d="M 420 196 L 480 196 L 480 260" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="420" y="264" width="120" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="480" y="282" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">power &gt; 1</text>
  <text x="480" y="298" text-anchor="middle" font-size="9.5" fill="#555">sign+ABS(f)+"X^"+p</text>
  <text x="480" y="310" text-anchor="middle" font-size="9" fill="#888">例：+1X^2 / -4X^4</text>

  <!-- Merge arrows -->
  <path d="M 80 316 L 80 334 L 280 334" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 280 316 L 280 334" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 480 316 L 480 334 L 280 334" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <path d="M 280 336 L 280 350" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: GROUP_CONCAT -->
  <rect x="140" y="354" width="280" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="373" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④ GROUP_CONCAT 拼接 + 追加 "=0"</text>

  <!-- Footer note -->
  <text x="280" y="404" text-anchor="middle" font-size="10" fill="#888">MySQL：GROUP_CONCAT(term ORDER BY power DESC SEPARATOR "") 一次性完成排序+拼接</text>
  <text x="280" y="416" text-anchor="middle" font-size="10" fill="#aaa">pandas：sort_values + 字符串 join，逻辑同构</text>
</svg>
