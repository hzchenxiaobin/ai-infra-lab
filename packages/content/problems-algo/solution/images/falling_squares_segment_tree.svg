<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">坐标压缩 + 线段树：段级区间最值</text>
  <text x="270" y="42" text-anchor="middle" font-size="11" fill="#888">2n 个端点切成 O(n) 段，每段维护最高高度</text>

  <!-- ===== Coordinate compression ===== -->
  <text x="30" y="66" font-size="11.5" fill="#446688" font-weight="bold">① 坐标压缩</text>
  <text x="30" y="82" font-size="10" fill="#555">positions=[[1,2],[2,3],[6,1]] → 端点 {1,3,2,5,6,7} → 排序去重 xs=[1,2,3,5,6,7]</text>

  <!-- x-axis for compressed coords -->
  <line x1="60" y1="140" x2="500" y2="140" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- tick positions: 1→88, 2→160, 3→232, 5→304, 6→376, 7→448 (gap 72) -->
  <g stroke="#446688" stroke-width="1.2" filter="url(#rough2)">
    <line x1="88" y1="140" x2="88" y2="144"/>
    <line x1="160" y1="140" x2="160" y2="144"/>
    <line x1="232" y1="140" x2="232" y2="144"/>
    <line x1="304" y1="140" x2="304" y2="144"/>
    <line x1="376" y1="140" x2="376" y2="144"/>
    <line x1="448" y1="140" x2="448" y2="144"/>
  </g>
  <g font-size="10.5" fill="#446688" text-anchor="middle">
    <text x="88" y="156">1</text>
    <text x="160" y="156">2</text>
    <text x="232" y="156">3</text>
    <text x="304" y="156">5</text>
    <text x="376" y="156">6</text>
    <text x="448" y="156">7</text>
  </g>

  <!-- segments between consecutive coords (5 segments) -->
  <g font-size="9" fill="#4a7a3a" text-anchor="middle" font-weight="bold">
    <rect x="88" y="108" width="72" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="124" y="123">[1,2)</text>
    <rect x="160" y="108" width="72" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="196" y="123">[2,3)</text>
    <rect x="232" y="108" width="72" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="268" y="123">[3,5)</text>
    <rect x="304" y="108" width="72" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="340" y="123">[5,6)</text>
    <rect x="376" y="108" width="72" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="412" y="123">[6,7)</text>
  </g>
  <text x="460" y="123" font-size="9" fill="#888">← 5 个段</text>

  <!-- arrow down -->
  <path d="M 270 168 L 270 182" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Segment tree sketch ===== -->
  <text x="30" y="194" font-size="11.5" fill="#446688" font-weight="bold">② 线段树（叶子=段，节点=区间最大高度，lazy=赋值）</text>

  <!-- root -->
  <rect x="240" y="206" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="224" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">max=5</text>
  <text x="270" y="234" text-anchor="middle" font-size="8" fill="#888">lazy=5</text>
  <!-- lines to children -->
  <g stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)">
    <line x1="260" y1="234" x2="150" y2="258"/>
    <line x1="280" y1="234" x2="390" y2="258"/>
  </g>
  <!-- left child -->
  <rect x="110" y="258" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="276" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">max=5</text>
  <text x="150" y="286" text-anchor="middle" font-size="8" fill="#888">lazy=5</text>
  <!-- right child -->
  <rect x="350" y="258" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="390" y="276" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">max=1</text>
  <text x="390" y="286" text-anchor="middle" font-size="8" fill="#888">lazy=—</text>
  <!-- lines to leaves -->
  <g stroke="#aaa" stroke-width="1" fill="none" filter="url(#rough2)">
    <line x1="135" y1="286" x2="100" y2="312"/>
    <line x1="165" y1="286" x2="200" y2="312"/>
    <line x1="375" y1="286" x2="340" y2="312"/>
    <line x1="405" y1="286" x2="440" y2="312"/>
  </g>
  <!-- leaves -->
  <g font-size="9" text-anchor="middle">
    <rect x="70" y="312" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="100" y="327" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="170" y="312" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="200" y="327" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="310" y="312" width="60" height="22" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="340" y="327" fill="#888">0</text>
    <rect x="410" y="312" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="440" y="327" fill="#d6a040" font-weight="bold">1</text>
  </g>
  <!-- leaf labels -->
  <g font-size="8" fill="#888" text-anchor="middle">
    <text x="100" y="346">[1,2)</text>
    <text x="200" y="346">[2,3)</text>
    <text x="340" y="346">[3,5)</text>
    <text x="440" y="346">[6,7)</text>
  </g>

  <!-- ===== note box ===== -->
  <rect x="40" y="360" width="460" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="382" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">赋值而非取 max：new_h = base+side &gt; 区间内任一已有高度</text>
</svg>
