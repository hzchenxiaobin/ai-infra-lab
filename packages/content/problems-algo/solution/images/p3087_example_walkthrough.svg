<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：7 条推文 → 4 组 → 双降序 Top-3</text>

  <rect x="22" y="44" width="190" height="220" fill="#fff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="117" y="66" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">逐行提取（WHERE 2024-02：全过）</text>
  <text x="46" y="86" font-size="8.5" fill="#999" filter="url(#rough2)">tweet_id  日期    hashtag</text>
  <text x="46" y="106" font-size="9" fill="#333" filter="url(#rough2)">13        02-01   #HappyDay</text>
  <text x="46" y="124" font-size="9" fill="#8a6d1a" filter="url(#rough2)">14        02-03   #HappyDay</text>
  <text x="46" y="142" font-size="9" fill="#333" filter="url(#rough2)">15        02-04   #WorkLife</text>
  <text x="46" y="160" font-size="9" fill="#333" filter="url(#rough2)">16        02-04   #TechLife</text>
  <text x="46" y="178" font-size="9" fill="#8a6d1a" filter="url(#rough2)">17        02-05   #HappyDay</text>
  <text x="46" y="196" font-size="9" fill="#333" filter="url(#rough2)">18        02-07   #TechLife</text>
  <text x="46" y="214" font-size="9" fill="#333" filter="url(#rough2)">19        02-09   #Nature</text>
  <text x="117" y="244" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">橙色行 = 重复标签（同标签多行）</text>
  <text x="117" y="258" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">推文 14 的标签在句中，两刀才切干净</text>

  <path d="M 216 154 L 240 154" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="228" y="144" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">分组计数</text>

  <rect x="244" y="44" width="150" height="220" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="319" y="66" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">GROUP BY + COUNT(*)</text>
  <text x="258" y="96" font-size="9" fill="#333" filter="url(#rough2)">#HappyDay</text>
  <text x="382" y="96" text-anchor="end" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="258" y="116" font-size="8" fill="#999" filter="url(#rough2)">（推文 13 / 14 / 17）</text>
  <text x="258" y="140" font-size="9" fill="#333" filter="url(#rough2)">#TechLife</text>
  <text x="382" y="140" text-anchor="end" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="258" y="160" font-size="8" fill="#999" filter="url(#rough2)">（推文 16 / 18）</text>
  <text x="258" y="184" font-size="9" fill="#333" filter="url(#rough2)">#WorkLife</text>
  <text x="382" y="184" text-anchor="end" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="258" y="204" font-size="8" fill="#999" filter="url(#rough2)">（推文 15）</text>
  <text x="258" y="228" font-size="9" fill="#333" filter="url(#rough2)">#Nature</text>
  <text x="382" y="228" text-anchor="end" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="258" y="248" font-size="8" fill="#999" filter="url(#rough2)">（推文 19）</text>
  <text x="319" y="260" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">4 组：3 + 2 + 1 + 1 = 7 ✓</text>

  <path d="M 398 154 L 422 154" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="144" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">双降序</text>
  <text x="410" y="166" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">LIMIT 3</text>

  <rect x="426" y="44" width="134" height="220" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="493" y="66" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出（Top-3）</text>
  <text x="446" y="86" font-size="8.5" fill="#999" filter="url(#rough2)">hashtag      count</text>
  <rect x="438" y="96" width="110" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="446" y="111" font-size="9" fill="#4a7a3a" filter="url(#rough2)">#HappyDay</text>
  <text x="540" y="111" text-anchor="end" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="438" y="118" width="110" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="446" y="133" font-size="9" fill="#4a7a3a" filter="url(#rough2)">#TechLife</text>
  <text x="540" y="133" text-anchor="end" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="438" y="140" width="110" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="446" y="155" font-size="9" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">#WorkLife</text>
  <text x="540" y="155" text-anchor="end" font-size="9" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1 ★</text>
  <text x="493" y="186" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">#Nature（同为 1 次）出局：</text>
  <text x="493" y="200" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">hashtag 降序 W &gt; N，</text>
  <text x="493" y="214" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">#WorkLife 拿下第 3 行</text>
  <text x="493" y="244" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">第 3 行全靠并列规则，</text>
  <text x="493" y="258" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">不是「恰好多一次」</text>

  <rect x="40" y="278" width="500" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="290" y="300" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 本题最阴的坑：hashtag 也要降序</text>
  <text x="290" y="318" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">惯性写 ORDER BY hashtag_count DESC, hashtag ASC 会输出 #Nature —— 直接 WA；</text>
  <text x="290" y="334" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">题目要求两个关键字都降序，字典序 #WorkLife &gt; #Nature，前者晋级</text>
  <text x="290" y="352" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">且标签在组内唯一 ⇒ (count, hashtag) 全序 ⇒ LIMIT 3 截断结果唯一确定</text>

  <rect x="40" y="376" width="500" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="396" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">一条 SQL：过滤（2 月）→ 提取（两刀）→ 计数（GROUP BY）→ 双降序 → LIMIT 3</text>
</svg>
