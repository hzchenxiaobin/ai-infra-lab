<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 490" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="490" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">SQL 执行流程：WHERE 过滤 → GROUP BY 分组 → 聚合 → ROUND</text>

  <!-- Step 1: FROM + WHERE -->
  <rect x="60" y="44" width="460" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="64" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">① FROM Queries WHERE query_name IS NOT NULL</text>
  <text x="290" y="82" text-anchor="middle" font-size="10.5" fill="#555">读取原始表，过滤掉 query_name 为 NULL 的行</text>
  <text x="290" y="94" text-anchor="middle" font-size="10" fill="#999">WHERE 在分组前逐行过滤（题目测试用例含 NULL 行）</text>

  <path d="M 290 102 L 290 120" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: GROUP BY -->
  <rect x="60" y="124" width="460" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="144" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② GROUP BY query_name</text>
  <text x="290" y="161" text-anchor="middle" font-size="10.5" fill="#555">按查询名分组，同名的行合并为一个分组</text>

  <path d="M 290 174 L 290 192" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: 聚合 SELECT -->
  <rect x="60" y="196" width="460" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="216" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③ SELECT 阶段：每组算两个聚合值</text>
  <text x="80" y="236" font-size="11" fill="#555">quality      = AVG(rating / position)</text>
  <text x="80" y="254" font-size="11" fill="#555">poor_pct = AVG(rating &lt; 3) × 100</text>
  <text x="80" y="274" font-size="10" fill="#999">AVG 对每组的所有行求平均：比率取均值 / 布尔(1或0)取均值</text>
  <text x="80" y="286" font-size="10" fill="#999">rating/position 逐行算后再求平均；rating&lt;3 逐行判真假转 1/0 再求平均</text>

  <path d="M 290 294 L 290 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: ROUND -->
  <rect x="60" y="316" width="460" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="336" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">④ ROUND(..., 2) 四舍五入到两位小数</text>
  <text x="290" y="354" text-anchor="middle" font-size="10.5" fill="#555">quality 与 poor_query_percentage 均保留两位小数</text>
  <text x="290" y="366" text-anchor="middle" font-size="10" fill="#999">外层 ROUND 包裹 AVG 结果（不可在聚合内部 ROUND 再 AVG）</text>

  <path d="M 290 374 L 290 392" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: 输出 -->
  <rect x="60" y="396" width="460" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="416" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">⑤ 输出：query_name, quality, poor_query_percentage</text>
  <text x="290" y="434" text-anchor="middle" font-size="10.5" fill="#555">每个 query_name 一行，任意顺序</text>

  <!-- Footer note -->
  <rect x="60" y="456" width="460" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="290" y="474" text-anchor="middle" font-size="10.5" fill="#888">💡 ROUND 必须包在 AVG 外层：先求平均再取整，否则精度丢失</text>
</svg>
