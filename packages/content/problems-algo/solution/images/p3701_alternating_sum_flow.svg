<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="17" fill="#333"
        filter="url(#rough2)">算法流程：一遍扫描，累积后符号取反</text>

  <!-- ① 初始化 -->
  <rect x="60" y="48" width="310" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="215" y="70" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">① 初始化 ans = 0，sign = +1</text>

  <path d="M 215 84 L 215 98" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 取元素 -->
  <rect x="60" y="102" width="310" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="215" y="124" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">② 取下一个元素 x（未取完）</text>

  <path d="M 215 138 L 215 152" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 累积 -->
  <rect x="60" y="156" width="310" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="215" y="178" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ ans += sign × x（带符号累积）</text>

  <path d="M 215 192 L 215 206" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ 符号取反 -->
  <rect x="60" y="210" width="310" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="215" y="232" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">④ sign = −sign（+1 ⇄ −1）</text>

  <!-- 循环回环：④ → ② -->
  <path d="M 60 228 L 34 228 L 34 120 L 56 120" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="22" y="175" transform="rotate(-90 22 175)" font-size="10" fill="#446688" filter="url(#rough2)">处理下一个元素</text>

  <!-- 取完 → 返回 -->
  <path d="M 370 120 L 498 120 L 498 318 L 326 318" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="464" y="112" font-size="10" fill="#446688" filter="url(#rough2)">取完</text>

  <!-- ⑤ 返回 -->
  <rect x="140" y="300" width="180" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="230" y="324" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">⑤ 返回 ans</text>

  <!-- 注释框 -->
  <rect x="376" y="150" width="112" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" fill="#d6a040" text-anchor="middle">
    <text x="432" y="168" font-weight="bold">无须维护下标 i：</text>
    <text x="432" y="184">sign 本身就是</text>
    <text x="432" y="200">奇偶状态机，</text>
    <text x="432" y="216">流式（未知长度）</text>
    <text x="432" y="232">输入同样适用</text>
  </g>

  <rect x="330" y="300" width="176" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="418" y="316" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">示例 2 [100]：只走一轮</text>
  <text x="418" y="330" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">ans = +100，符号天然正确</text>
</svg>
