<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n=2, rollMax=[1,1,2,2,2,3]</text>

  <!-- rollMax legend -->
  <text x="20" y="50" font-size="10" fill="#888">rollMax：</text>
  <rect x="80" y="38" width="36" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="98" y="52" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1→1</text>
  <rect x="118" y="38" width="36" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="136" y="52" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2→1</text>
  <rect x="156" y="38" width="36" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="174" y="52" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">3→2</text>
  <rect x="194" y="38" width="36" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="212" y="52" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">4→2</text>
  <rect x="232" y="38" width="36" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="250" y="52" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">5→2</text>
  <rect x="270" y="38" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="288" y="52" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">6→3</text>
  <text x="320" y="52" font-size="9" fill="#888">（点数→连续上限）</text>

  <!-- Layer 1: i=1 -->
  <rect x="20" y="72" width="200" height="120" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <rect x="20" y="72" width="200" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="120" y="89" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">第 1 次掷骰 (i=1)</text>

  <text x="36" y="112" font-size="10" fill="#666">j=1..6, k=1:</text>
  <rect x="36" y="118" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="51" y="133" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="70" y="118" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="85" y="133" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="104" y="118" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="119" y="133" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="138" y="118" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="153" y="133" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="172" y="118" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="187" y="133" text-anchor="middle" font-size="10" fill="#333">1</text>

  <text x="36" y="158" font-size="9.5" fill="#888">每种点数各 1 种序列</text>
  <rect x="36" y="164" width="168" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="120" y="179" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">total = 6</text>

  <!-- Arrow to layer 2 -->
  <path d="M 120 196 L 120 216" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="140" y="210" font-size="9" fill="#888">rowSum[j]=1</text>

  <!-- Layer 2: i=2 -->
  <rect x="20" y="220" width="520" height="140" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <rect x="20" y="220" width="520" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="237" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">第 2 次掷骰 (i=2)：两种转移</text>

  <!-- k=1 row: switch to j -->
  <text x="30" y="260" font-size="10" fill="#4a7a3a" font-weight="bold">k=1 (换掷)</text>
  <text x="30" y="274" font-size="8.5" fill="#888">6−1=5</text>
  <rect x="100" y="252" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="266" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">j=1</text>
  <text x="120" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5</text>
  <rect x="144" y="252" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="266" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">j=2</text>
  <text x="164" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5</text>
  <rect x="188" y="252" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="266" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">j=3</text>
  <text x="208" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5</text>
  <rect x="232" y="252" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="252" y="266" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">j=4</text>
  <text x="252" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5</text>
  <rect x="276" y="252" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="296" y="266" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">j=5</text>
  <text x="296" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5</text>
  <rect x="320" y="252" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="266" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">j=6</text>
  <text x="340" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="380" y="270" font-size="9.5" fill="#888">小计：6×5 = 30</text>

  <!-- k=2 row: extend same j -->
  <text x="30" y="306" font-size="10" fill="#b85450" font-weight="bold">k=2 (续掷)</text>
  <text x="30" y="320" font-size="8.5" fill="#888">prev[j][1]</text>
  <rect x="100" y="298" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="312" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">j=1</text>
  <text x="120" y="322" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0 ✗</text>
  <rect x="144" y="298" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="312" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">j=2</text>
  <text x="164" y="322" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0 ✗</text>
  <rect x="188" y="298" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="312" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">j=3</text>
  <text x="208" y="322" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1 ✓</text>
  <rect x="232" y="298" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="252" y="312" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">j=4</text>
  <text x="252" y="322" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1 ✓</text>
  <rect x="276" y="298" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="296" y="312" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">j=5</text>
  <text x="296" y="322" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1 ✓</text>
  <rect x="320" y="298" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="312" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">j=6</text>
  <text x="340" y="322" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1 ✓</text>
  <text x="380" y="316" font-size="9.5" fill="#888">小计：4 (仅上限≥2)</text>

  <!-- Result -->
  <rect x="36" y="336" width="448" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="350" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">total = 30 + 4 = 34</text>

  <!-- Bottom explanation -->
  <rect x="20" y="372" width="520" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">被排除的序列：(1,1) 和 (2,2)</text>
  <text x="280" y="410" text-anchor="middle" font-size="10" fill="#666">rollMax[0]=rollMax[1]=1，续掷 j=1 或 j=2 的 k=2 超 限 → dp[1][2]=dp[2][2]=0</text>
  <text x="280" y="424" text-anchor="middle" font-size="10" fill="#888">无约束时 6×6=36，排除 2 种 → 36−2 = 34 ✓</text>
</svg>
