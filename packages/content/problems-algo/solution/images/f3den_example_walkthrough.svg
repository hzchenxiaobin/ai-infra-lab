<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：digits = [2,1,3,0]</text>

  <rect x="30" y="44" width="500" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="48" y="64" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">先建频次表 freq（扫一遍 digits）：</text>

  <rect x="60" y="74" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="82" y="90" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">0:1</text>
  <rect x="114" y="74" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="136" y="90" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1:1</text>
  <rect x="168" y="74" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="190" y="90" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2:1</text>
  <rect x="222" y="74" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="244" y="90" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3:1</text>
  <text x="290" y="90" font-size="10" fill="#888" filter="url(#rough2)">其余 4-9:0</text>

  <text x="30" y="124" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">枚举 x ∈ {100, 102, …, 998}，逐个验证：</text>

  <rect x="30" y="134" width="500" height="24" fill="#446688" rx="3" filter="url(#rough2)"/>
  <text x="60" y="151" font-size="10.5" fill="#fff" font-weight="bold" filter="url(#rough2)">候选 x</text>
  <text x="150" y="151" font-size="10.5" fill="#fff" font-weight="bold" filter="url(#rough2)">拆分 百/十/个</text>
  <text x="290" y="151" font-size="10.5" fill="#fff" font-weight="bold" filter="url(#rough2)">所需频次</text>
  <text x="400" y="151" font-size="10.5" fill="#fff" font-weight="bold" filter="url(#rough2)">freq 够?</text>
  <text x="490" y="151" font-size="10.5" fill="#fff" font-weight="bold" filter="url(#rough2)">结果</text>

  <rect x="30" y="158" width="500" height="22" fill="#fce4ec" stroke="#e8c4c0" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="60" y="173" font-size="10.5" fill="#333" filter="url(#rough2)">100</text>
  <text x="150" y="173" font-size="10.5" fill="#333" filter="url(#rough2)">1 / 0 / 0</text>
  <text x="290" y="173" font-size="10.5" fill="#333" filter="url(#rough2)">1×1, 0×2</text>
  <text x="400" y="173" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">0 只有 1 个</text>
  <text x="490" y="173" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <rect x="30" y="180" width="500" height="22" fill="#e6f4ea" stroke="#c4d8c0" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="60" y="195" font-size="10.5" fill="#333" filter="url(#rough2)">102</text>
  <text x="150" y="195" font-size="10.5" fill="#333" filter="url(#rough2)">1 / 0 / 2</text>
  <text x="290" y="195" font-size="10.5" fill="#333" filter="url(#rough2)">1×1, 0×1, 2×1</text>
  <text x="400" y="195" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">全部满足</text>
  <text x="490" y="195" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <rect x="30" y="202" width="500" height="22" fill="#e6f4ea" stroke="#c4d8c0" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="60" y="217" font-size="10.5" fill="#333" filter="url(#rough2)">120</text>
  <text x="150" y="217" font-size="10.5" fill="#333" filter="url(#rough2)">1 / 2 / 0</text>
  <text x="290" y="217" font-size="10.5" fill="#333" filter="url(#rough2)">1×1, 2×1, 0×1</text>
  <text x="400" y="217" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">全部满足</text>
  <text x="490" y="217" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <rect x="30" y="224" width="500" height="22" fill="#e6f4ea" stroke="#c4d8c0" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="60" y="239" font-size="10.5" fill="#333" filter="url(#rough2)">132</text>
  <text x="150" y="239" font-size="10.5" fill="#333" filter="url(#rough2)">1 / 3 / 2</text>
  <text x="290" y="239" font-size="10.5" fill="#333" filter="url(#rough2)">1×1, 3×1, 2×1</text>
  <text x="400" y="239" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">全部满足</text>
  <text x="490" y="239" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <rect x="30" y="246" width="500" height="22" fill="#fce4ec" stroke="#e8c4c0" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="60" y="261" font-size="10.5" fill="#333" filter="url(#rough2)">200</text>
  <text x="150" y="261" font-size="10.5" fill="#333" filter="url(#rough2)">2 / 0 / 0</text>
  <text x="290" y="261" font-size="10.5" fill="#333" filter="url(#rough2)">2×1, 0×2</text>
  <text x="400" y="261" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">0 只有 1 个</text>
  <text x="490" y="261" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <rect x="30" y="268" width="500" height="22" fill="#e6f4ea" stroke="#c4d8c0" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="60" y="283" font-size="10.5" fill="#333" filter="url(#rough2)">210</text>
  <text x="150" y="283" font-size="10.5" fill="#333" filter="url(#rough2)">2 / 1 / 0</text>
  <text x="290" y="283" font-size="10.5" fill="#333" filter="url(#rough2)">2×1, 1×1, 0×1</text>
  <text x="400" y="283" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">全部满足</text>
  <text x="490" y="283" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <rect x="30" y="290" width="500" height="22" fill="#fafafa" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="280" y="305" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic" filter="url(#rough2)">… 继续枚举 212 ✗, 214 ✗, … 230 ✓, 302 ✓, 310 ✓, 312 ✓, 320 ✓ …</text>

  <text x="30" y="332" font-size="11" fill="#888" filter="url(#rough2)">关键失败模式：候选含「重复数字」(如 100 的两个 0)，需 freq 中该数字 ≥2 才行</text>

  <rect x="30" y="346" width="500" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="48" y="368" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最终答案（枚举天然升序，无需再排序）：</text>

  <rect x="30" y="388" width="500" height="40" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="414" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[102, 120, 130, 132, 210, 230, 302, 310, 312, 320]</text>
</svg>
