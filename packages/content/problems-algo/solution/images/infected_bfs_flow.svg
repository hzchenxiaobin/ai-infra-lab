<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建无向图 + 从 start 做 BFS 取最大层</text>

  <rect x="190" y="48" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="69" text-anchor="middle" font-size="11" fill="#333">① DFS 建邻接表 graph[val]（含父边）</text>

  <path d="M 280 84 L 280 106" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="190" y="110" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="131" text-anchor="middle" font-size="11" fill="#333">② 起队 (start, 0)，visited = {start}</text>

  <path d="M 280 146 L 280 166" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="120" y="170" width="320" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="189" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">③ while queue 非空：</text>
  <text x="280" y="209" text-anchor="middle" font-size="11" fill="#333">(v, d) ← 出队；ans = max(ans, d)</text>
  <text x="280" y="229" text-anchor="middle" font-size="11" fill="#333">for nb in graph[v]：</text>
  <text x="280" y="249" text-anchor="middle" font-size="11" fill="#333">if nb 未访问 → 标记并入队 (nb, d+1)</text>

  <path d="M 280 268 L 280 290" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="200" y="294" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="315" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">④ return ans</text>

  <text x="470" y="200" font-size="10" fill="#888">每条无向边</text>
  <text x="470" y="216" font-size="10" fill="#888">最多入队一次</text>
  <text x="470" y="240" font-size="10" fill="#888">层序 = 距离</text>
  <text x="470" y="256" font-size="10" fill="#888">= 感染分钟</text>
  <text x="40" y="200" font-size="10" fill="#888">无权图求</text>
  <text x="40" y="216" font-size="10" fill="#888">单源最短路</text>
  <text x="40" y="240" font-size="10" fill="#888">首选 BFS</text>
</svg>
