<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：每个 key 下标照亮 [j−k, j+k] 区间</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">反转视角：不逐 i 找 key，而逐 key 标记 i</text>

  <!-- ===== nums array row ===== -->
  <text x="40" y="72" font-size="11" fill="#888">nums:</text>
  <!-- 7 cells: 3 4 9 1 3 9 5, indices 0..6 -->
  <rect x="80" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="78" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">3</text>
  <rect x="130" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="78" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>
  <rect x="180" y="58" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="78" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">9</text>
  <rect x="230" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="78" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <rect x="280" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="78" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">3</text>
  <rect x="330" y="58" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="78" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">9</text>
  <rect x="380" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="405" y="78" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">5</text>

  <!-- index labels -->
  <text x="105" y="102" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="155" y="102" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="205" y="102" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="255" y="102" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="305" y="102" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="355" y="102" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <text x="405" y="102" text-anchor="middle" font-size="9" fill="#aaa">6</text>

  <text x="445" y="78" font-size="10" fill="#888">key=9, k=1</text>

  <!-- ===== Interval 1: j=2, [1,3] ===== -->
  <text x="40" y="132" font-size="11" fill="#d6a040" font-weight="bold">j=2:</text>
  <text x="80" y="132" font-size="10.5" fill="#555">照亮 [2−1, 2+1] = [1, 3]</text>

  <!-- highlight bracket for [1,3] -->
  <rect x="130" y="142" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">下标 1, 2, 3 被标记</text>

  <!-- arrow from key cell 2 down to interval -->
  <path d="M 205 92 L 205 140" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- ===== Interval 2: j=5, [4,6] ===== -->
  <text x="40" y="196" font-size="11" fill="#d6a040" font-weight="bold">j=5:</text>
  <text x="80" y="196" font-size="10.5" fill="#555">照亮 [5−1, 5+1] = [4, 6]</text>

  <rect x="280" y="206" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="224" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">下标 4, 5, 6 被标记</text>

  <path d="M 355 92 L 355 204" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- ===== Union result ===== -->
  <rect x="40" y="250" width="440" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">并集 = [1,3] ∪ [4,6] = {1,2,3,4,5,6}（下标 0 未被照亮）</text>

  <!-- ===== Result row: mark which indices are in answer ===== -->
  <text x="40" y="300" font-size="11" fill="#888">答案:</text>
  <!-- index 0: red (not in answer) -->
  <rect x="80" y="286" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="306" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <!-- indices 1-6: green (in answer) -->
  <rect x="130" y="286" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="306" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="180" y="286" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="306" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="230" y="286" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="255" y="306" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="280" y="286" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="305" y="306" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="330" y="286" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="306" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="380" y="286" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="405" y="306" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Footer -->
  <text x="260" y="342" text-anchor="middle" font-size="10.5" fill="#888">橙色 = key 位置 · 绿色 = 被照亮的 K 近邻下标 · 红色 = 未被照亮</text>
</svg>
