<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：枚举候选 g，看 nums 中 g 的倍数的 GCD 是否等于 g</text>

  <!-- nums label -->
  <text x="40" y="60" font-size="12" fill="#444" font-weight="bold">nums = [6, 10, 3]</text>
  <text x="200" y="60" font-size="11" fill="#888">值域 1..M,  M = 10</text>

  <!-- Number line 1..10, nums members highlighted -->
  <text x="40" y="88" font-size="10" fill="#888">值轴：</text>
  <!-- cell i at x = 95 + i*30, w=28, h=22, y=76 -->
  <!-- value 1 -->
  <rect x="95" y="76" width="28" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="109" y="91" text-anchor="middle" font-size="10" fill="#999">1</text>
  <!-- value 2 -->
  <rect x="125" y="76" width="28" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="139" y="91" text-anchor="middle" font-size="10" fill="#999">2</text>
  <!-- value 3 in nums -->
  <rect x="155" y="76" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="169" y="91" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <!-- value 4 -->
  <rect x="185" y="76" width="28" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="199" y="91" text-anchor="middle" font-size="10" fill="#999">4</text>
  <!-- value 5 -->
  <rect x="215" y="76" width="28" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="229" y="91" text-anchor="middle" font-size="10" fill="#999">5</text>
  <!-- value 6 in nums -->
  <rect x="245" y="76" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="259" y="91" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">6</text>
  <!-- value 7 -->
  <rect x="275" y="76" width="28" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="289" y="91" text-anchor="middle" font-size="10" fill="#999">7</text>
  <!-- value 8 -->
  <rect x="305" y="76" width="28" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="319" y="91" text-anchor="middle" font-size="10" fill="#999">8</text>
  <!-- value 9 -->
  <rect x="335" y="76" width="28" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="349" y="91" text-anchor="middle" font-size="10" fill="#999">9</text>
  <!-- value 10 in nums -->
  <rect x="365" y="76" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="379" y="91" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">10</text>
  <!-- legend -->
  <rect x="430" y="78" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="89" font-size="10" fill="#666">= nums 中的值</text>

  <!-- section label -->
  <text x="40" y="128" font-size="12" fill="#444" font-weight="bold">逐个候选 g 判定可达性：</text>

  <!-- ===== Row g=2 (success) ===== -->
  <rect x="40" y="146" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="65" y="166" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">g=2</text>
  <text x="105" y="166" font-size="11" fill="#555">T(2) = nums 中 2 的倍数 →</text>
  <!-- multiples cells: 6, 10 -->
  <rect x="295" y="146" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <rect x="335" y="146" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>
  <text x="385" y="166" font-size="11" fill="#555">gcd = 2</text>
  <text x="445" y="166" font-size="12" fill="#4a7a3a" font-weight="bold">= g  ✓</text>
  <text x="505" y="166" font-size="10" fill="#4a7a3a">计入</text>

  <!-- ===== Row g=5 (fail: gcd != g) ===== -->
  <rect x="40" y="192" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="65" y="212" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">g=5</text>
  <text x="105" y="212" font-size="11" fill="#555">T(5) = nums 中 5 的倍数 →</text>
  <rect x="295" y="192" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="212" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>
  <text x="385" y="212" font-size="11" fill="#555">gcd = 10</text>
  <text x="445" y="212" font-size="12" fill="#b85450" font-weight="bold">≠ g  ✗</text>
  <text x="505" y="212" font-size="10" fill="#b85450">10≠5</text>

  <!-- ===== Row g=4 (fail: empty) ===== -->
  <rect x="40" y="238" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="65" y="258" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">g=4</text>
  <text x="105" y="258" font-size="11" fill="#555">T(4) = nums 中 4 的倍数 →</text>
  <rect x="295" y="238" width="74" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="332" y="258" text-anchor="middle" font-size="11" fill="#999">∅ (空集)</text>
  <text x="385" y="258" font-size="11" fill="#555">gcd = 0</text>
  <text x="445" y="258" font-size="12" fill="#b85450" font-weight="bold">≠ g  ✗</text>
  <text x="505" y="258" font-size="10" fill="#b85450">0≠4</text>

  <!-- divider -->
  <line x1="40" y1="295" x2="580" y2="295" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- ===== Theorem box ===== -->
  <rect x="40" y="305" width="540" height="138" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="310" y="328" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">判定定理</text>
  <text x="310" y="350" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">g 是某子序列的 GCD  ⟺  gcd( T(g) ) = g</text>
  <text x="310" y="368" text-anchor="middle" font-size="10" fill="#888">T(g) = nums 中所有 g 的倍数构成的子集</text>

  <text x="60" y="392" font-size="11" fill="#4a7a3a" font-weight="bold">充分性 (⇐)：</text>
  <text x="140" y="392" font-size="11" fill="#444">gcd(T)=g ⟹ T 本身就是 GCD=g 的子序列 ⟹ g 可达</text>

  <text x="60" y="412" font-size="11" fill="#446688" font-weight="bold">必要性 (⇒)：</text>
  <text x="140" y="412" font-size="11" fill="#444">S 的 GCD=g ⟹ S⊆T(g)；gcd(T)|gcd(S)=g 且 g|gcd(T) ⟹ gcd(T)=g</text>

  <text x="60" y="432" font-size="10" fill="#888">关键：① gcd 整除单调性 (子集⊆全集 ⟹ gcd(全集)|gcd(子集))   ② g 的倍数的 GCD 仍是 g 的倍数</text>
</svg>
