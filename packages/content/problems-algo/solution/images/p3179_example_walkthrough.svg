  <text x="336" y="268" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">C(7,4)=35</text>
  <text x="336" y="310" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">C(8,5)=56</text>

  <rect x="400" y="110" width="108" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="454" y="136" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">规律：任意时刻</text>
  <text x="454" y="156" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">a[i] = C(i+t, t)</text>
  <text x="454" y="180" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">右列即杨辉三角</text>
  <text x="454" y="196" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">的一条斜边</text>
  <text x="454" y="222" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">终值 = C(n+k−1, k)</text>

  <rect x="30" y="330" width="478" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="269" y="352" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">再验示例 2：n=5, k=3 ⇒ C(7,3) = 35 ✓，公式一次命中</text>
  <text x="269" y="372" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">整个过程相当于把杨辉三角斜着「铺」进 (下标, 时间) 表格</text>
