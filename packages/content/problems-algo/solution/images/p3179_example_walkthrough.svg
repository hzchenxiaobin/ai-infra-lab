  <text x="336" y="100" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">C(3,0)=1</text>
  <text x="336" y="142" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">C(4,1)=4</text>
  <text x="336" y="184" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">C(5,2)=10</text>
