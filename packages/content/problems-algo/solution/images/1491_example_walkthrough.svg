<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="340" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    示例演算：salary = [4000, 3000, 1000, 2000]
  </text>

  <!-- 表头 -->
  <rect x="20" y="44" width="580" height="30" rx="4" fill="#446688" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="64" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">步</text>
  <text x="130" y="64" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">salary[i]</text>
  <text x="240" y="64" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">total</text>
  <text x="360" y="64" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">minVal</text>
  <text x="480" y="64" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">maxVal</text>

  <!-- init 行 -->
  <rect x="20" y="78" width="580" height="32" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="99" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">init</text>
  <text x="130" y="99" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">—</text>
  <text x="240" y="99" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="360" y="99" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">+∞</text>
  <text x="480" y="99" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">−∞</text>

  <!-- i=0  4000 -->
  <rect x="20" y="114" width="580" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i=0</text>
  <text x="130" y="135" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4000</text>
  <text x="240" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4000</text>
  <text x="360" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4000</text>
  <text x="480" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4000</text>

  <!-- i=1  3000 -->
  <rect x="20" y="150" width="580" height="32" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="171" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i=1</text>
  <text x="130" y="171" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3000</text>
  <text x="240" y="171" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7000</text>
  <text x="360" y="171" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3000</text>
  <text x="480" y="171" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4000</text>

  <!-- i=2  1000 -->
  <rect x="20" y="186" width="580" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i=2</text>
  <text x="130" y="207" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1000</text>
  <text x="240" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8000</text>
  <text x="360" y="207" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1000</text>
  <text x="480" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4000</text>

  <!-- i=3  2000 -->
  <rect x="20" y="222" width="580" height="32" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="243" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i=3</text>
  <text x="130" y="243" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2000</text>
  <text x="240" y="243" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10000</text>
  <text x="360" y="243" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1000</text>
  <text x="480" y="243" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">4000</text>

  <!-- 计算结果框 -->
  <rect x="20" y="266" width="580" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="288" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    去掉 min=1000、max=4000，余下 n−2=2 项
  </text>
  <text x="310" y="308" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">
    avg = (total − min − max) / (n − 2)
  </text>
  <text x="310" y="324" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">
    = (10000 − 1000 − 4000) / 2 = 2500.0
  </text>
</svg>
