<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：Erdős–Gallai —— 前 k 大的需求 ≤ 供给上限</text>
  <text x="260" y="42" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">（示例 2：d = [3,3,1,1] 降序排列，取 k = 2）</text>

  <!-- 度数序列格子：前 k 个蓝色（需求方），其余橙色（供给方） -->
  <rect x="96" y="52" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="72" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">d<tspan font-size="8.5" dy="2">1</tspan><tspan dy="-2"> = 3</tspan></text>
  <rect x="148" y="52" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="72" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">d<tspan font-size="8.5" dy="2">2</tspan><tspan dy="-2"> = 3</tspan></text>
  <rect x="254" y="52" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="72" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">d<tspan font-size="8.5" dy="2">3</tspan><tspan dy="-2"> = 1</tspan></text>
  <rect x="306" y="52" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="328" y="72" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">d<tspan font-size="8.5" dy="2">4</tspan><tspan dy="-2"> = 1</tspan></text>

  <line x1="223" y1="46" x2="223" y2="108" stroke="#999" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- 分组花括号（手绘直线代替） -->
  <path d="M 96 90 L 96 95 L 192 95 L 192 90" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="144" y="107" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">前 k=2 大：需求方</text>
  <path d="M 254 90 L 254 95 L 350 95 L 350 90" fill="none" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="302" y="107" text-anchor="middle" font-size="10.5" fill="#a07820" filter="url(#rough2)">其余 n−k 个：供给方</text>

  <!-- 需求 vs 供给 -->
  <rect x="24" y="124" width="128" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="88" y="143" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">需求 L = 3+3 = 6</text>
  <text x="88" y="160" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">前 k 大点的总度数</text>

  <circle cx="163" cy="148" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163" y="152" text-anchor="middle" font-size="10" fill="#a07820" filter="url(#rough2)">vs</text>

  <rect x="182" y="124" width="164" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="264" y="143" text-anchor="middle" font-size="10.5" fill="#2f5d25" filter="url(#rough2)">供给① 内部互连 ≤ k(k−1)</text>
  <text x="264" y="160" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">C(k,2) 条边 × 每条 2 度 = 2</text>

  <text x="359" y="153" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">+</text>

  <rect x="372" y="124" width="128" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="436" y="143" text-anchor="middle" font-size="10.5" fill="#2f5d25" filter="url(#rough2)">供给② 跨边 ≤ 1+1 = 2</text>
  <text x="436" y="160" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">外部点 j ≤ min(d_j, k)</text>

  <!-- 汇入判定框 -->
  <path d="M 88 172 C 88 184, 112 188, 138 194" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 264 172 L 262 192" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 436 172 C 436 184, 408 188, 382 194" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定框 -->
  <rect x="56" y="196" width="408" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="218" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">Erdős–Gallai：对每个 k = 1..n 都要成立</text>
  <text x="260" y="241" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Σ(i≤k) d<tspan font-size="9" dy="2">i</tspan><tspan dy="-2">  ≤  k(k−1) + Σ(j&gt;k) min(d</tspan><tspan font-size="9" dy="2">j</tspan><tspan dy="-2">, k)</tspan></text>
  <text x="260" y="263" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">示例 2 取 k=2：左 = 6，右 = 2 + 2 = 4</text>
  <text x="260" y="285" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">6 &gt; 4 ✗ 需求超过供给上限 ⇒ false</text>

  <text x="260" y="310" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">另需握手引理：Σ d_i 为偶数（每条边贡献 2 度），奇和直接 false</text>

  <!-- 左下：内部边示意 -->
  <rect x="30" y="322" width="226" height="98" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="143" y="338" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">内部边：两端都在前 k 个</text>
  <circle cx="88" cy="366" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="370" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">u</text>
  <circle cx="160" cy="366" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="370" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">v</text>
  <line x1="101" y1="366" x2="147" y2="366" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="143" y="396" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">贡献 2 度（两端各 +1）</text>
  <text x="143" y="410" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">k 个点至多 C(k,2) 条 ⇒ 合计 ≤ k(k−1)</text>

  <!-- 右下：跨边示意 -->
  <rect x="284" y="322" width="206" height="98" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="387" y="338" text-anchor="middle" font-size="10.5" fill="#a07820" filter="url(#rough2)">跨边：一端在前、一端在外</text>
  <circle cx="325" cy="364" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="325" y="368" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">前部</text>
  <circle cx="435" cy="364" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="435" y="368" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">j</text>
  <path d="M 340 364 L 420 364" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="356" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">每对至多 1 条</text>
  <text x="387" y="396" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">只给需求方贡献 1 度</text>
  <text x="387" y="410" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">外部点 j 至多 min(d_j, k) 条</text>
</svg>
