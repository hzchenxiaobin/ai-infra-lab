<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：先递推一侧 g(n)，再平方</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">滚动斐波那契 O(n)/O(1) + 一次乘法</text>

  <!-- ===== Four steps ===== -->
  <g font-size="10" fill="#333">
    <!-- Step 1 -->
    <rect x="40" y="62" width="200" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="140" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 状态定义</text>
    <text x="140" y="98" text-anchor="middle" font-size="9" fill="#555">g(i) = 一侧前 i 个地块的放房方式数</text>
    <text x="140" y="110" text-anchor="middle" font-size="8" fill="#888">（同一侧相邻不放房）</text>

    <path d="M 140 114 L 140 126" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 2 -->
    <rect x="40" y="128" width="200" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="140" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② 转移方程</text>
    <text x="140" y="164" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">g(i) = g(i-1) + g(i-2)</text>
    <text x="140" y="176" text-anchor="middle" font-size="8" fill="#888">i 不放 / i 放(i-1 必空)</text>

    <path d="M 140 180 L 140 192" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 3 -->
    <rect x="40" y="194" width="200" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="140" y="212" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">③ 初始条件</text>
    <text x="140" y="230" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">g(0) = 1,  g(1) = 2</text>
    <text x="140" y="242" text-anchor="middle" font-size="8" fill="#888">0 块地=1 种；1 块地=放/不放</text>

    <path d="M 140 246 L 140 258" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 4 -->
    <rect x="40" y="260" width="200" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="140" y="278" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">④ 计算顺序</text>
    <text x="140" y="296" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">i = 2 → 3 → … → n</text>
    <text x="140" y="308" text-anchor="middle" font-size="8" fill="#888">自底向上，全程 mod p</text>
  </g>

  <!-- ===== Right: rolling + square ===== -->
  <rect x="278" y="62" width="210" height="118" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="383" y="84" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">滚动数组（O(1) 空间）</text>
  <text x="294" y="104" font-family="monospace" font-size="10" fill="#333">long long a = 1;  // g(0)</text>
  <text x="294" y="120" font-family="monospace" font-size="10" fill="#333">long long b = 2;  // g(1)</text>
  <text x="294" y="136" font-family="monospace" font-size="10" fill="#4a7a3a">for i = 2..n:</text>
  <text x="294" y="152" font-family="monospace" font-size="10" fill="#446688">  c = (a + b) % MOD;</text>
  <text x="294" y="168" font-family="monospace" font-size="10" fill="#b85450">  a = b; b = c;</text>

  <path d="M 383 184 L 383 200" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="278" y="202" width="210" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="383" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">一侧方式 = b = g(n)</text>
  <text x="383" y="242" text-anchor="middle" font-size="9" fill="#555">仅 2 个变量滚动，n≤10⁴ 安全</text>

  <path d="M 383 262 L 383 278" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="278" y="280" width="210" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="383" y="300" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">两侧独立 → 平方</text>
  <text x="383" y="320" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">ans = b * b % MOD</text>

  <rect x="60" y="324" width="400" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">时间 O(n)　空间 O(1)　全程对 10⁹+7 取模</text>
</svg>
