<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：前缀和盘子数 + 蜡烛边界 = O(1) 查询</text>

  <!-- ===== String row ===== -->
  <text x="40" y="78" font-size="12" fill="#555" font-weight="bold">s:</text>

  <!-- Cells: s = "**|**|***|", candle at 2,5,9 -->
  <!-- i=0 '*' plate -->
  <rect x="90" y="56" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="109" y="79" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">*</text>
  <!-- i=1 '*' plate -->
  <rect x="128" y="56" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="147" y="79" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">*</text>
  <!-- i=2 '|' candle  -> p1 (boundary) red -->
  <rect x="166" y="56" width="38" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="185" y="79" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">|</text>
  <!-- i=3 '*' plate (counted) green -->
  <rect x="204" y="56" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="223" y="79" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">*</text>
  <!-- i=4 '*' plate (counted) green -->
  <rect x="242" y="56" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="261" y="79" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">*</text>
  <!-- i=5 '|' candle -> p2 (boundary) red -->
  <rect x="280" y="56" width="38" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="299" y="79" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">|</text>
  <!-- i=6 '*' plate -->
  <rect x="318" y="56" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="337" y="79" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">*</text>
  <!-- i=7 '*' plate -->
  <rect x="356" y="56" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="375" y="79" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">*</text>
  <!-- i=8 '*' plate -->
  <rect x="394" y="56" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="413" y="79" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">*</text>
  <!-- i=9 '|' candle -->
  <rect x="432" y="56" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="451" y="79" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">|</text>

  <!-- Index labels -->
  <text x="109" y="106" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="147" y="106" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="185" y="106" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="223" y="106" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="261" y="106" text-anchor="middle" font-size="10" fill="#999">4</text>
  <text x="299" y="106" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">5</text>
  <text x="337" y="106" text-anchor="middle" font-size="10" fill="#999">6</text>
  <text x="375" y="106" text-anchor="middle" font-size="10" fill="#999">7</text>
  <text x="413" y="106" text-anchor="middle" font-size="10" fill="#999">8</text>
  <text x="451" y="106" text-anchor="middle" font-size="10" fill="#999">9</text>

  <!-- p1 / p2 annotation -->
  <text x="185" y="120" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">p1=2</text>
  <text x="299" y="120" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">p2=5</text>

  <!-- Query bracket [2,5] -->
  <path d="M 166 46 L 166 40 L 318 40 L 318 46" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="242" y="34" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">查询 [2,5]</text>

  <!-- Divider -->
  <path d="M 40 132 L 520 132" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== pre row ===== -->
  <text x="40" y="158" font-size="11.5" fill="#555" font-weight="bold">pre:</text>
  <text x="280" y="158" text-anchor="middle" font-size="10.5" fill="#888">pre[i] = s[0..i-1] 中的盘子数</text>

  <!-- pre values at gap positions (left edge of cell i) -->
  <!-- pre[0]=0 at x=90, pre[1]=1 at 128, pre[2]=2 at 166, pre[3]=2 at 204, pre[4]=3 at 242, pre[5]=4 at 280, pre[6]=4 at 318, pre[7]=5 at 356, pre[8]=6 at 394, pre[9]=7 at 432, pre[10]=7 at 470 -->
  <rect x="78" y="166" width="30" height="24" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="93" y="183" text-anchor="middle" font-size="12" fill="#666">0</text>

  <rect x="116" y="166" width="30" height="24" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="131" y="183" text-anchor="middle" font-size="12" fill="#666">1</text>

  <rect x="154" y="166" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="169" y="183" text-anchor="middle" font-size="12.5" fill="#a87020" font-weight="bold">2</text>

  <rect x="192" y="166" width="30" height="24" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="207" y="183" text-anchor="middle" font-size="12" fill="#666">2</text>

  <rect x="230" y="166" width="30" height="24" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="245" y="183" text-anchor="middle" font-size="12" fill="#666">3</text>

  <rect x="268" y="166" width="30" height="24" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="283" y="183" text-anchor="middle" font-size="12" fill="#666">4</text>

  <rect x="306" y="166" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="321" y="183" text-anchor="middle" font-size="12.5" fill="#a87020" font-weight="bold">4</text>

  <rect x="344" y="166" width="30" height="24" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="359" y="183" text-anchor="middle" font-size="12" fill="#666">5</text>

  <rect x="382" y="166" width="30" height="24" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="397" y="183" text-anchor="middle" font-size="12" fill="#666">6</text>

  <rect x="420" y="166" width="30" height="24" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="435" y="183" text-anchor="middle" font-size="12" fill="#666">7</text>

  <rect x="458" y="166" width="30" height="24" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="473" y="183" text-anchor="middle" font-size="12" fill="#666">7</text>

  <!-- pre index labels -->
  <text x="93" y="202" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="131" y="202" text-anchor="middle" font-size="9" fill="#bbb">1</text>
  <text x="169" y="202" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">2</text>
  <text x="207" y="202" text-anchor="middle" font-size="9" fill="#bbb">3</text>
  <text x="245" y="202" text-anchor="middle" font-size="9" fill="#bbb">4</text>
  <text x="283" y="202" text-anchor="middle" font-size="9" fill="#bbb">5</text>
  <text x="321" y="202" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">6</text>
  <text x="359" y="202" text-anchor="middle" font-size="9" fill="#bbb">7</text>
  <text x="397" y="202" text-anchor="middle" font-size="9" fill="#bbb">8</text>
  <text x="435" y="202" text-anchor="middle" font-size="9" fill="#bbb">9</text>
  <text x="473" y="202" text-anchor="middle" font-size="9" fill="#bbb">10</text>

  <!-- Arrows from boundary candles to pre values -->
  <path d="M 185 92 L 169 166" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="3,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 299 92 L 321 166" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="3,3" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Divider -->
  <path d="M 40 224 L 520 224" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Formula ===== -->
  <rect x="60" y="244" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">p1 = right[l]（子串最左蜡烛），p2 = left[r]（子串最右蜡烛）</text>
  <text x="280" y="288" text-anchor="middle" font-size="13.5" fill="#a87020" font-weight="bold">answer = pre[p2+1] − pre[p1] = 4 − 2 = 2</text>

  <!-- ===== Legend ===== -->
  <rect x="60" y="324" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="82" y="335" font-size="10.5" fill="#555">盘子 *</text>

  <rect x="150" y="324" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="172" y="335" font-size="10.5" fill="#555">蜡烛 |</text>

  <rect x="240" y="324" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="262" y="335" font-size="10.5" fill="#555">边界蜡烛 p1/p2</text>

  <rect x="360" y="324" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="382" y="335" font-size="10.5" fill="#555">被计入的盘子</text>

  <!-- Footnote -->
  <text x="280" y="372" text-anchor="middle" font-size="10.5" fill="#888">p1、p2 是蜡烛本身（不计入盘子），pre[p2+1]−pre[p1] 恰好是两蜡烛之间的盘子数</text>
</svg>
