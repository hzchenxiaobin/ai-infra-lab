<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：浮点二分 + check 谓词</text>

  <!-- 1. Init -->
  <rect x="170" y="44" width="200" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="12" fill="#333">① l = 0，r = max(buckets)</text>

  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. mid -->
  <rect x="170" y="100" width="200" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="124" text-anchor="middle" font-size="12" fill="#333">② mid = (l + r) / 2</text>

  <path d="M 270 138 L 270 156" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. check -->
  <rect x="100" y="156" width="340" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="178" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ check(mid)：</text>
  <text x="270" y="196" text-anchor="middle" font-size="10.5" fill="#555">a = Σ(x − mid)，x &gt; mid   （盈余）</text>
  <text x="270" y="212" text-anchor="middle" font-size="10.5" fill="#555">b = Σ(mid − x)·100/(100−loss)，x &lt; mid</text>

  <path d="M 270 218 L 270 236" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. Diamond a >= b ? -->
  <polygon points="270,236 370,276 270,316 170,276" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="272" text-anchor="middle" font-size="11.5" fill="#333">a ≥ b ?</text>
  <text x="270" y="288" text-anchor="middle" font-size="10.5" fill="#888">(盈余够补亏缺)</text>

  <!-- Yes -> l = mid -->
  <path d="M 170 276 L 90 276 L 90 120 L 168 120" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="262" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="65" y="280" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="50" y="248" font-size="10" fill="#4a7a3a">l = mid</text>
  <text x="50" y="234" font-size="9.5" fill="#4a7a3a">试更高</text>

  <!-- No -> r = mid -->
  <path d="M 370 276 L 450 276 L 450 120 L 372 120" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="430" y="262" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="455" y="280" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <text x="440" y="248" font-size="10" fill="#b85450">r = mid</text>
  <text x="440" y="234" font-size="9.5" fill="#b85450">试更低</text>

  <!-- loop note -->
  <text x="270" y="338" text-anchor="middle" font-size="10.5" fill="#888">↑ 回到 ② 重复，直到 r − l ≤ 1e−5</text>

  <!-- Exit -->
  <path d="M 270 316 L 270 352" stroke="#666" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Termination check -->
  <rect x="150" y="352" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="372" text-anchor="middle" font-size="11.5" fill="#333">④ r − l ≤ 1e−5 ?</text>
  <text x="270" y="386" text-anchor="middle" font-size="10" fill="#888">否 → 回到 ②；是 ↓</text>

  <path d="M 270 392 L 270 410" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return -->
  <rect x="190" y="410" width="160" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="434" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">return l</text>

  <!-- right note -->
  <rect x="392" y="350" width="140" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="462" y="370" text-anchor="middle" font-size="10" fill="#a87020" font-weight="bold">单调性</text>
  <text x="462" y="384" text-anchor="middle" font-size="9.5" fill="#555">v 越大 → 盈余↓亏缺↑</text>
  <text x="462" y="398" text-anchor="middle" font-size="9.5" fill="#555">可行域为 [0, ans]</text>
</svg>
