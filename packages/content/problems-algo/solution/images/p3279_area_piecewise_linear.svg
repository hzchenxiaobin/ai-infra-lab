<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">A(t) 是分段折线：拐点 = 活塞到达端点的时刻（示例 1）</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">height=5，positions=[2,5]，directions="UD"，A(0) = 2 + 5 = 7</text>

  <!-- 坐标轴 -->
  <path d="M 58 300 L 490 300" stroke="#555" stroke-width="1.8" marker-end="url(#axis)" filter="url(#rough2)"/>
  <path d="M 58 300 L 58 72" stroke="#555" stroke-width="1.8" marker-end="url(#axis)" filter="url(#rough2)"/>
  <text x="70" y="66" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">A(t)</text>
  <text x="486" y="318" text-anchor="end" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">t（秒）</text>

  <!-- 刻度 -->
  <text x="50" y="304" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">0</text>
  <text x="50" y="226" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <text x="50" y="122" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">7</text>
  <text x="58" y="316" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0</text>
  <text x="166" y="316" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <text x="238" y="316" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">5</text>
  <text x="346" y="316" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">8</text>
  <text x="418" y="316" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">10</text>

  <!-- A=7 虚线 -->
  <path d="M 58 118 L 470 118" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="472" y="110" text-anchor="end" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = 7（t=0 与 t=3 取得）</text>

  <!-- 折线 -->
  <path d="M 58 118 L 166 118 L 238 222 L 346 222 L 418 118" stroke="#446688" stroke-width="2.5" fill="none" filter="url(#rough2)"/>

  <!-- 拐点 -->
  <circle cx="58" cy="118" r="4.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="166" cy="118" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="238" cy="222" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="346" cy="222" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="418" cy="118" r="4.5" fill="#b85450" filter="url(#rough2)"/>

  <!-- 事件标注 -->
  <text x="70" y="98" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">t=0 起点</text>
  <text x="166" y="98" text-anchor="middle" font-size="10.5" fill="#8a3a34" filter="url(#rough2)">活塞0 到顶 U→D</text>
  <text x="238" y="246" text-anchor="middle" font-size="10.5" fill="#8a3a34" filter="url(#rough2)">活塞1 到底 D→U</text>
  <text x="346" y="246" text-anchor="middle" font-size="10.5" fill="#8a3a34" filter="url(#rough2)">活塞0 到底 D→U</text>
  <text x="418" y="98" text-anchor="middle" font-size="10.5" fill="#8a3a34" filter="url(#rough2)">活塞1 到顶 U→D</text>

  <!-- 斜率标注 -->
  <text x="112" y="108" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">斜率 0</text>
  <text x="196" y="168" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">斜率 −2</text>
  <text x="292" y="212" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">斜率 0</text>
  <text x="384" y="170" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">斜率 +2</text>

  <!-- 周期括线 -->
  <path d="M 58 330 L 58 338 M 418 330 L 418 338 M 62 334 L 414 334" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="238" y="352" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">一个周期 2h = 10 秒后完全重复——最大值只需在拐点与起点结算</text>
</svg>
