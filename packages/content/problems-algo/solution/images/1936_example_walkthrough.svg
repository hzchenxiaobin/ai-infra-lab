<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：rungs=[1,3,5,10]，dist=2</text>

  <!-- ====== Table ====== -->
  <!-- header row -->
  <rect x="40" y="52" width="480" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="70" y="73">步骤</text>
    <text x="137" y="73">prev</text>
    <text x="212" y="73">rung</text>
    <text x="287" y="73">gap</text>
    <text x="380" y="73">(gap−1)//2</text>
    <text x="477" y="73">ans</text>
  </g>
  <!-- column dividers -->
  <g stroke="#bbb" stroke-width="1" filter="url(#rough2)">
    <path d="M 104 52 L 104 236"/>
    <path d="M 174 52 L 174 236"/>
    <path d="M 250 52 L 250 236"/>
    <path d="M 325 52 L 325 236"/>
    <path d="M 435 52 L 435 236"/>
  </g>

  <!-- row 1 -->
  <rect x="40" y="84" width="480" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="70" y="106">1</text>
    <text x="137" y="106">0</text>
    <text x="212" y="106">1</text>
    <text x="287" y="106">1</text>
    <text x="380" y="106">0</text>
    <text x="477" y="106">0</text>
  </g>

  <!-- row 2 -->
  <rect x="40" y="118" width="480" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="70" y="140">2</text>
    <text x="137" y="140">1</text>
    <text x="212" y="140">3</text>
    <text x="287" y="140">2</text>
    <text x="380" y="140">0</text>
    <text x="477" y="140">0</text>
  </g>

  <!-- row 3 -->
  <rect x="40" y="152" width="480" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="70" y="174">3</text>
    <text x="137" y="174">3</text>
    <text x="212" y="174">5</text>
    <text x="287" y="174">2</text>
    <text x="380" y="174">0</text>
    <text x="477" y="174">0</text>
  </g>

  <!-- row 4 (highlight) -->
  <rect x="40" y="186" width="480" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="70" y="208">4</text>
    <text x="137" y="208">5</text>
    <text x="212" y="208">10</text>
    <text x="287" y="208" fill="#b85450">5</text>
    <text x="380" y="208" fill="#b85450">2</text>
    <text x="477" y="208" fill="#b85450">2</text>
  </g>

  <!-- bottom border -->
  <path d="M 40 220 L 520 220" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- result note -->
  <text x="280" y="252" text-anchor="middle" font-size="11.5" fill="#888">前三个间隔 ≤ dist 自动得 0；只有 5→10 的 gap=5 需补 2 根</text>

  <!-- ====== Mini ladder showing result ====== -->
  <text x="280" y="280" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">最终梯子：补在 5→10 之间，加 7、8 两根</text>

  <!-- poles -->
  <path d="M 232 296 L 232 384" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 288 296 L 288 384" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- ground -->
  <text x="260" y="396" text-anchor="middle" font-size="10" fill="#888">0</text>

  <!-- rungs: h=10(top), 9(add), 7(add), 5, 3, 1 -->
  <!-- map: h=1->372, h=3->356, h=5->340, h=7->316, h=9->300, h=10->296 (compressed) -->
  <g filter="url(#rough2)">
    <!-- h=1 blue -->
    <rect x="228" y="370" width="64" height="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2"/>
    <text x="312" y="377" font-size="9.5" fill="#446688">1</text>
    <!-- h=3 blue -->
    <rect x="228" y="354" width="64" height="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2"/>
    <text x="312" y="361" font-size="9.5" fill="#446688">3</text>
    <!-- h=5 blue -->
    <rect x="228" y="338" width="64" height="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2"/>
    <text x="312" y="345" font-size="9.5" fill="#446688">5</text>
    <!-- h=7 green added -->
    <rect x="228" y="314" width="64" height="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="3,2" rx="2"/>
    <text x="312" y="321" font-size="9.5" fill="#4a7a3a">7 ✚</text>
    <!-- h=8 green added -->
    <rect x="228" y="306" width="64" height="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="3,2" rx="2"/>
    <text x="312" y="313" font-size="9.5" fill="#4a7a3a">8 ✚</text>
    <!-- h=10 blue -->
    <rect x="228" y="292" width="64" height="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2"/>
    <text x="312" y="299" font-size="9.5" fill="#446688">10</text>
  </g>

  <!-- legend -->
  <g font-size="9.5">
    <rect x="392" y="338" width="14" height="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="412" y="346" fill="#555">原有梯级</text>
    <rect x="392" y="354" width="14" height="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
    <text x="412" y="362" fill="#555">新增梯级</text>
  </g>
</svg>
