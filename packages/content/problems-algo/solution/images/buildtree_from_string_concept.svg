<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：字符串是递归文法 rootVal(left)(right)</text>

  <!-- ===== Left: string decomposition ===== -->
  <text x="170" y="58" text-anchor="middle" font-size="11" fill="#888">字符串分解</text>

  <!-- rootVal segment -->
  <rect x="40" y="68" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="57" y="89" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="57" y="114" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">rootVal</text>

  <!-- left subtree segment (2(4)) -->
  <rect x="78" y="68" width="92" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="124" y="89" text-anchor="middle" font-size="13" fill="#333">(2(4))</text>
  <text x="124" y="114" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">(left)</text>

  <!-- right subtree segment (3(5)(6)) -->
  <rect x="174" y="68" width="118" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="233" y="89" text-anchor="middle" font-size="13" fill="#333">(3(5)(6))</text>
  <text x="233" y="114" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">(right)</text>

  <!-- arrows from segments down to tree nodes -->
  <path d="M 57 120 C 57 150, 230 160, 280 178" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 124 120 C 124 150, 200 175, 220 198" stroke="#446688" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 233 120 C 233 150, 340 175, 360 198" stroke="#4a7a3a" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- ===== Right: resulting tree ===== -->
  <text x="430" y="58" text-anchor="middle" font-size="11" fill="#888">构造结果</text>

  <!-- root 1 -->
  <circle cx="290" cy="190" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="195" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- left child 2 -->
  <line x1="278" y1="202" x2="232" y2="238" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="222" cy="248" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="222" y="253" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- right child 3 -->
  <line x1="302" y1="202" x2="348" y2="238" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="358" cy="248" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="358" y="253" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <!-- 2's left child 4 -->
  <line x1="210" y1="260" x2="170" y2="298" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="160" cy="308" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="313" text-anchor="middle" font-size="11" fill="#333">4</text>

  <!-- 3's left child 5 -->
  <line x1="346" y1="260" x2="324" y2="298" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="314" cy="308" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="314" y="313" text-anchor="middle" font-size="11" fill="#333">5</text>

  <!-- 3's right child 6 -->
  <line x1="370" y1="260" x2="396" y2="298" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="408" cy="308" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="408" y="313" text-anchor="middle" font-size="11" fill="#333">6</text>

  <!-- ===== Bottom: grammar definition ===== -->
  <line x1="20" y1="338" x2="560" y2="338" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="350" width="500" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="366" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">文法：Tree → val | val ( Tree ) | val ( Tree ) ( Tree )</text>
</svg>
