<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">双向链表当栈 + 大根堆按值定位 + 懒删除</text>
  <text x="310" y="48" text-anchor="middle" font-size="11.5" fill="#888">例：push(5), push(1), push(5) 后执行 pop() —— 链表删栈顶 5(2)，堆里 (5,2) 残留为脏条目</text>

  <!-- ============ 双向链表（栈） ============ -->
  <text x="40" y="84" font-size="12" fill="#2b6e9e" font-weight="bold">双向链表 dll（左→右 = 栈底→栈顶，哨兵 head/tail 不存数据）</text>

  <!-- head 哨兵 -->
  <g filter="url(#rough2)">
    <rect x="40" y="96" width="56" height="40" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.3" stroke-dasharray="3 2"/>
  </g>
  <text x="68" y="121" text-anchor="middle" font-size="12" fill="#777">head</text>

  <!-- 5(0) -->
  <g filter="url(#rough2)">
    <rect x="110" y="96" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="140" y="116" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">5</text>
  <text x="140" y="131" text-anchor="middle" font-size="9.5" fill="#888">[cnt 0]</text>

  <!-- 1(1) 栈顶 -->
  <g filter="url(#rough2)">
    <rect x="185" y="96" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="215" y="116" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <text x="215" y="131" text-anchor="middle" font-size="9.5" fill="#888">[cnt 1]</text>
  <!-- 栈顶标注 -->
  <text x="215" y="86" text-anchor="middle" font-size="10.5" fill="#b03a3a" font-weight="bold">↑ 栈顶</text>

  <!-- tail 哨兵 -->
  <g filter="url(#rough2)">
    <rect x="260" y="96" width="56" height="40" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.3" stroke-dasharray="3 2"/>
  </g>
  <text x="288" y="121" text-anchor="middle" font-size="12" fill="#777">tail</text>

  <!-- 双向箭头：链表节点之间 -->
  <path d="M 98 116 L 108 116" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)" filter="url(#rough2)"/>
  <path d="M 172 116 L 183 116" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)" filter="url(#rough2)"/>
  <path d="M 247 116 L 258 116" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)" filter="url(#rough2)"/>

  <!-- 已删的 5(2) 幽灵节点 -->
  <g filter="url(#rough2)">
    <rect x="370" y="96" width="64" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>
  <text x="402" y="116" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" text-decoration="line-through">5</text>
  <text x="402" y="131" text-anchor="middle" font-size="9.5" fill="#b85450">[cnt 2] removed</text>
  <text x="402" y="86" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">已被 pop 删除</text>

  <!-- 从 tail 到幽灵节点的虚线（表示曾在此位置） -->
  <path d="M 316 116 L 368 116" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>

  <!-- ============ 大根堆 ============ -->
  <text x="40" y="186" font-size="12" fill="#7a5415" font-weight="bold">大根堆 heap（条目 = (val, cnt, 节点引用)；val 大者优先，同 val 时 cnt 大者优先）</text>

  <!-- 堆顶（脏） (5,2) -->
  <g filter="url(#rough2)">
    <rect x="195" y="200" width="80" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3"/>
  </g>
  <text x="235" y="219" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">(5, 2)</text>
  <text x="235" y="233" text-anchor="middle" font-size="9.5" fill="#b85450">堆顶·脏</text>

  <!-- 左子 (5,0) -->
  <g filter="url(#rough2)">
    <rect x="115" y="270" width="80" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="155" y="289" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">(5, 0)</text>
  <text x="155" y="303" text-anchor="middle" font-size="9.5" fill="#4a7a3a">干净</text>

  <!-- 右子 (1,1) -->
  <g filter="url(#rough2)">
    <rect x="275" y="270" width="80" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="315" y="289" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">(1, 1)</text>
  <text x="315" y="303" text-anchor="middle" font-size="9.5" fill="#4a7a3a">干净</text>

  <!-- 堆的边 -->
  <path d="M 215 240 L 165 270" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 255 240 L 305 270" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 节点引用：堆顶 (5,2) 指向幽灵链表节点 5(2) -->
  <path d="M 275 220 C 330 180, 360 150, 398 138" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="345" y="172" font-size="10" fill="#b85450" font-weight="bold">节点引用</text>
  <text x="345" y="186" font-size="10" fill="#b85450">→ 已删节点</text>

  <!-- ============ 懒删除清理流程（右侧） ============ -->
  <g filter="url(#rough2)">
    <rect x="410" y="196" width="190" height="156" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="505" y="218" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">peekMax / popMax 清理</text>
  <text x="420" y="240" font-size="11" fill="#555">while heap.top().removed:</text>
  <text x="432" y="256" font-size="11" fill="#b85450" font-weight="bold">pop (5,2) ← 丢弃</text>
  <text x="420" y="276" font-size="11" fill="#555">下一个堆顶 = (5,0)</text>
  <text x="432" y="292" font-size="11" fill="#4a7a3a" font-weight="bold">未删 → 取用</text>
  <text x="420" y="314" font-size="11" fill="#888">→ peekMax 返回 5</text>
  <text x="420" y="332" font-size="10.5" fill="#888">每个脏条目至多清一次</text>
  <text x="420" y="346" font-size="10.5" fill="#888">均摊 O(log n)</text>

  <!-- ============ 底部不变量说明 ============ -->
  <g filter="url(#rough2)">
    <rect x="36" y="368" width="548" height="90" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="56" y="390" font-size="12" fill="#4a7a3a" font-weight="bold">三个关键不变量</text>
  <text x="56" y="410" font-size="11" fill="#555">① 链表只含"活"节点：top/pop 直接读 tail.prev，O(1) 无需清理</text>
  <text x="56" y="426" font-size="11" fill="#555">② 堆允许"死"条目残留：被删节点的堆条目不动，靠 node.removed 标记跳过</text>
  <text x="56" y="442" font-size="11" fill="#555">③ cnt 单调递增：同值时大 cnt（最近压入）排堆顶 → popMax 自然弹"最靠近栈顶"的最大值</text>
  <text x="56" y="456" font-size="11" fill="#b85450" font-weight="bold">→ 把"堆的随机删除 O(n)"转化为"堆顶顺次清理 O(log n)"，懒删除的精髓</text>
</svg>
