<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：失配只能被「操作 i」向右推</text>

  <!-- 行 A：初始 -->
  <text x="46" y="56" font-size="11" fill="#555" filter="url(#rough2)">初始</text>
  <text x="430" y="48" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">示例 1</text>
  <text x="430" y="63" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">目标全 1，k = 3</text>

  <rect x="90" y="36" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="113" y="56" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="144" y="36" width="46" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="167" y="56" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">−1</text>
  <rect x="198" y="36" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="221" y="56" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="252" y="36" width="46" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="275" y="56" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">−1</text>
  <rect x="306" y="36" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="329" y="56" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <text x="113" y="79" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">i=0</text>
  <text x="167" y="79" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">i=1</text>
  <text x="221" y="79" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">i=2</text>
  <text x="275" y="79" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">i=3</text>
  <text x="329" y="79" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">i=4</text>

  <!-- 箭头 ① -->
  <path d="M167,84 L167,104" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="180" y="98" font-size="10.5" fill="#b85450" filter="url(#rough2)">操作①：i=1 失配 → 强制翻 (1,2)</text>

  <!-- 行 B：①后 -->
  <text x="42" y="128" font-size="11" fill="#555" filter="url(#rough2)">①后</text>
  <rect x="90" y="108" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="113" y="128" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="144" y="108" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="167" y="128" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="198" y="108" width="46" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="221" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">−1</text>
  <rect x="252" y="108" width="46" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="275" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">−1</text>
  <rect x="306" y="108" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="329" y="128" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <text x="221" y="152" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">被①连带</text>
  <text x="275" y="152" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">原生失配</text>

  <!-- 箭头 ② -->
  <path d="M221,158 L221,178" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="234" y="172" font-size="10.5" fill="#b85450" filter="url(#rough2)">操作②：失配被推到 i=2 → 再翻 (2,3)</text>

  <!-- 行 C：②后 -->
  <text x="42" y="208" font-size="11" fill="#555" filter="url(#rough2)">②后</text>
  <rect x="90" y="188" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="113" y="208" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="144" y="188" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="167" y="208" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="198" y="188" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="221" y="208" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="252" y="188" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="275" y="208" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="306" y="188" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="329" y="208" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <text x="382" y="200" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">全 1 ✓</text>
  <text x="382" y="216" font-size="10" fill="#4a7a3a" filter="url(#rough2)">仅 2 次 ≤ k=3</text>

  <!-- 底部结论框 1 -->
  <rect x="30" y="232" width="460" height="74" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="253" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">配对视角：最少操作数 = 相邻失配两两配对的距离之和</text>
  <text x="260" y="272" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">示例：失配位 1 与 3 配对，代价 3 − 1 = 2；失配一路右推、遇同类湮灭</text>
  <text x="260" y="290" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">被迫性：左侧已对齐时修 i 只剩操作 i（操作 i−1 会把失配左移）</text>

  <!-- 底部结论框 2 -->
  <rect x="30" y="318" width="460" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="339" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">不变量：操作同时翻转相邻两个元素，数组总乘积不变</text>
  <text x="260" y="358" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">全变 1 需 −1 恰有偶数个；全变 −1 需 1 恰有偶数个（失配数奇 ⇒ 无解）</text>
  <text x="260" y="376" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">示例 2：[−1,−1,−1,1,1,1] 两种目标失配数都是 3（奇）→ false</text>
</svg>
