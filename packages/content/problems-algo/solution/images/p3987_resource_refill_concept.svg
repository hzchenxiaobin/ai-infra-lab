<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：不足才补 +，连续 x 次用等差数列一笔记账</text>

  <!-- ① 示例缺口 -->
  <text x="260" y="46" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 示例 2 走到 nums[3]=14：cur=3，缺口 11 → x = ⌈11/4⌉ = 3 次</text>

  <rect x="58" y="58" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="82" y="80" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">cur=3</text>

  <text x="116" y="80" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">+</text>

  <rect x="128" y="58" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="80" text-anchor="middle" font-size="12" fill="#2f5527" font-weight="bold" filter="url(#rough2)">+k</text>
  <rect x="180" y="58" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="202" y="80" text-anchor="middle" font-size="12" fill="#2f5527" font-weight="bold" filter="url(#rough2)">+k</text>
  <rect x="232" y="58" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="254" y="80" text-anchor="middle" font-size="12" fill="#2f5527" font-weight="bold" filter="url(#rough2)">+k</text>

  <text x="150" y="106" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">成本3</text>
  <text x="202" y="106" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">成本4</text>
  <text x="254" y="106" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">成本5</text>

  <path d="M288,75 L302,75" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="310" y="58" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="336" y="80" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">15</text>

  <text x="384" y="80" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">≥ 14 ✓</text>

  <text x="260" y="126" text-anchor="middle" font-size="10.5" fill="#2f5527" font-weight="bold" filter="url(#rough2)">三次补充一笔记账：3 + 4 + 5 = 12（已补 2 次，cnt=2 → 第 3、4、5 次）</text>

  <!-- ② 公式 -->
  <rect x="52" y="140" width="416" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="159" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② 一笔记账公式：已补 cnt 次后再补 x 次</text>
  <text x="260" y="177" text-anchor="middle" font-size="11" fill="#33506e" font-weight="bold" filter="url(#rough2)">(cnt+1) + (cnt+2) + … + (cnt+x)  =  x·cnt + x(x+1)/2</text>

  <!-- ③ 贪心与不变式 -->
  <rect x="40" y="204" width="222" height="68" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="151" y="224" text-anchor="middle" font-size="10.5" fill="#2f5527" font-weight="bold" filter="url(#rough2)">③ 贪心时机：不足才补，补到刚好够</text>
  <text x="151" y="242" text-anchor="middle" font-size="9.5" fill="#3a5c30" filter="url(#rough2)">每次操作恒 +k、成本只看总次数</text>
  <text x="151" y="258" text-anchor="middle" font-size="9.5" fill="#3a5c30" filter="url(#rough2)">资源不过期 → 提前补不减少总次数</text>

  <rect x="285" y="204" width="222" height="68" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="396" y="224" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">④ 不变式：每步结束 cur ∈ [0, k)</text>
  <text x="396" y="242" text-anchor="middle" font-size="9.5" fill="#7a6425" filter="url(#rough2)">补足后落在 [num, num+k)，处理完落回 [0,k)</text>
  <text x="396" y="258" text-anchor="middle" font-size="9.5" fill="#7a6425" filter="url(#rough2)">⇒ 贪心处处达到前缀和下界</text>

  <!-- 警示 -->
  <rect x="40" y="290" width="445" height="54" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="262" y="310" text-anchor="middle" font-size="9.5" fill="#8f3a35" font-weight="bold" filter="url(#rough2)">⚠️ 逐次 +k 模拟最坏 10¹⁴ 步（k=1、nums[i]=10⁹），必须公式折叠</text>
  <text x="262" y="328" text-anchor="middle" font-size="9.5" fill="#8f3a35" filter="url(#rough2)">cur 与 cnt 是精确物理量，参与比较与计费，千万别取模；只有 res 记账时取模</text>
</svg>
