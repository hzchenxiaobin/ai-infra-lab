<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：logs = [[1950,1961],[1960,1971],[1970,1981]]</text>
  <text x="310" y="42" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">三条寿命 → diff 标记 → 前缀和 = 每年人口 → 取最早的峰值</text>

  <!-- Year axis: x(year) = 80 + (year-1950)*15 ; 1950→80, 1960→230, 1961→245, 1970→380, 1971→395, 1981→545 -->
  <line x1="70" y1="60" x2="560" y2="60" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80" y="52" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1950</text>
  <text x="230" y="52" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1960</text>
  <text x="380" y="52" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1970</text>
  <text x="535" y="52" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1981</text>
  <line x1="80" y1="56" x2="80" y2="64" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="230" y1="54" x2="230" y2="66" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="380" y1="54" x2="380" y2="66" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="545" y1="56" x2="545" y2="64" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- Person bars: alive [birth, death-1] -->
  <text x="40" y="84" font-size="10" fill="#555" filter="url(#rough2)">P0</text>
  <rect x="80" y="74" width="165" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="162" y="88" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">[1950,1961) 存活 1950–1960</text>

  <text x="40" y="110" font-size="10" fill="#555" filter="url(#rough2)">P1</text>
  <rect x="230" y="100" width="165" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="312" y="114" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">[1960,1971) 存活 1960–1970</text>

  <text x="40" y="136" font-size="10" fill="#555" filter="url(#rough2)">P2</text>
  <rect x="380" y="126" width="165" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="462" y="140" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">[1970,1981) 存活 1970–1980</text>

  <!-- diff markers row -->
  <text x="30" y="172" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">diff</text>
  <!-- +1 at 1950 -->
  <rect x="64" y="160" width="32" height="22" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="175" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1</text>
  <text x="80" y="194" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">1950</text>
  <!-- +1 at 1960 -->
  <rect x="214" y="160" width="32" height="22" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="175" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1</text>
  <text x="230" y="194" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">1960</text>
  <!-- -1 at 1961 -->
  <rect x="229" y="200" width="32" height="22" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="245" y="215" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="245" y="234" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">1961</text>
  <!-- +1 at 1970 -->
  <rect x="364" y="160" width="32" height="22" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="175" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1</text>
  <text x="380" y="194" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">1970</text>
  <!-- -1 at 1971 -->
  <rect x="379" y="200" width="32" height="22" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="215" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="395" y="234" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">1971</text>
  <!-- -1 at 1981 -->
  <rect x="529" y="160" width="32" height="22" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="545" y="175" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="545" y="194" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">1981</text>

  <!-- separator -->
  <line x1="40" y1="246" x2="580" y2="246" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- Population step function: baseY=330, scale=30 ; pop0→330, pop1→300, pop2→270 -->
  <text x="30" y="304" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">人口</text>
  <text x="30" y="318" font-size="8.5" fill="#888" filter="url(#rough2)">(前缀和)</text>
  <!-- y-axis ticks -->
  <line x1="70" y1="270" x2="76" y2="270" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="64" y="274" text-anchor="end" font-size="8.5" fill="#888" filter="url(#rough2)">2</text>
  <line x1="70" y1="300" x2="76" y2="300" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="64" y="304" text-anchor="end" font-size="8.5" fill="#888" filter="url(#rough2)">1</text>
  <line x1="70" y1="330" x2="76" y2="330" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="64" y="334" text-anchor="end" font-size="8.5" fill="#888" filter="url(#rough2)">0</text>

  <!-- step area fill -->
  <path d="M 80 330 L 80 300 L 230 300 L 230 270 L 245 270 L 245 300 L 380 300 L 380 270 L 395 270 L 395 300 L 545 300 L 545 330 Z"
        fill="#e8f0fe" opacity="0.6" filter="url(#rough2)"/>
  <!-- step line -->
  <path d="M 80 300 L 230 300 L 230 270 L 245 270 L 245 300 L 380 300 L 380 270 L 395 270 L 395 300 L 545 300 L 545 330"
        stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <!-- baseline -->
  <line x1="80" y1="330" x2="545" y2="330" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- peak markers: 1960 (pop2) and 1970 (pop2) -->
  <circle cx="230" cy="270" r="4" fill="#d6a040" stroke="#fff" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="380" cy="270" r="4" fill="#d6a040" stroke="#fff" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="230" y="262" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="380" y="262" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- answer annotation pointing to 1960 -->
  <path d="M 230 352 L 230 340" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="140" y="354" width="180" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="374" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">答案：1960（最早峰值）</text>

  <!-- note about 1970 -->
  <text x="380" y="374" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">同为 2 但更晚</text>

  <!-- footer -->
  <rect x="40" y="392" width="540" height="12" fill="none"/>
  <text x="310" y="402" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">每人 +1/−1 两个标记；前缀和一次扫描即可读出所有年份人口</text>
</svg>
