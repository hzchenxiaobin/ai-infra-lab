<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- 开始 -->
  <ellipse cx="260" cy="22" rx="42" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="27" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">开始</text>

  <path d="M 260 37 L 260 50" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 预处理 -->
  <rect x="150" y="52" width="220" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">预处理 gmax[mask]：组内最大 time</text>

  <path d="M 260 76 L 260 89" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="140" y="91" width="240" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="107" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dist[满mask, 0, 营地] = 0，入堆 (0, FULL, 0, 0)</text>

  <path d="M 260 115 L 260 128" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 弹堆顶 -->
  <rect x="130" y="130" width="260" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="147" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">弹出堆顶 (d, mask, stage, side)，过期条目跳过</text>

  <path d="M 260 156 L 260 170" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 堆空？ -->
  <polygon points="260,170 310,192 260,214 210,192" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="196" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">堆空？</text>
  <path d="M 310 192 L 396 192" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="186" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">是</text>
  <rect x="400" y="180" width="96" height="24" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="448" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 -1.0</text>
  <path d="M 260 214 L 260 226" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="226" font-size="10.5" fill="#666" filter="url(#rough2)">否</text>

  <!-- mask==0? -->
  <polygon points="260,228 312,251 260,274 208,251" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="255" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">mask == 0？</text>
  <path d="M 312 251 L 396 251" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="348" y="245" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">是</text>
  <rect x="400" y="239" width="96" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="448" y="255" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">返回 d ✓</text>
  <path d="M 260 274 L 260 286" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="286" font-size="10.5" fill="#666" filter="url(#rough2)">否</text>

  <!-- side? -->
  <polygon points="260,288 318,310 260,332 202,310" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">船在营地？</text>

  <!-- 渡河枚举 -->
  <path d="M 202 310 L 128 310 L 128 322" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="168" y="303" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">是</text>
  <rect x="16" y="324" width="230" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="131" y="338" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">枚举渡河组 g ⊆ mask（|g| ≤ k）</text>
  <text x="131" y="351" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">松弛 (mask∖g, (stage+⌊gmax[g]·mul⌋)%m, 对岸)</text>

  <!-- 返回枚举 -->
  <path d="M 318 310 L 392 310 L 392 322" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="352" y="303" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">否</text>
  <rect x="274" y="324" width="230" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="389" y="338" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">枚举返回人 r ∉ mask（恰 1 人）</text>
  <text x="389" y="351" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">松弛 (mask∪r, (stage+⌊time[r]·mul⌋)%m, 营地)</text>

  <!-- 回环箭头 -->
  <path d="M 16 340 L 8 340 L 8 143 L 126 143" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 504 340 L 512 340 L 512 143 L 394 143" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
