<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">重构字符串：大根堆贪心算法流程</text>

  <!-- Start -->
  <ellipse cx="270" cy="62" rx="80" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">开始: 统计字符频率</text>

  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: max_count > (n+1)/2? -->
  <polygon points="270,104 390,154 270,204 150,154" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="148" text-anchor="middle" font-size="12" fill="#333">max_count</text>
  <text x="270" y="164" text-anchor="middle" font-size="12" fill="#333">&gt; (n+1)/2 ?</text>
  <text x="270" y="180" text-anchor="middle" font-size="10" fill="#888">(某字符太多放不下)</text>

  <!-- Yes -> return "" -->
  <path d="M 150 154 L 80 154" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="115" y="146" text-anchor="middle" font-size="11" fill="#b85450">是</text>
  <ellipse cx="48" cy="154" rx="38" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="158" text-anchor="middle" font-size="11" fill="#333">返回 ""</text>

  <!-- No -> build heap -->
  <path d="M 270 204 L 270 222" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="218" font-size="11" fill="#82b366">否</text>
  <rect x="160" y="226" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="248" text-anchor="middle" font-size="12" fill="#333">构建大根堆 (按频率排序)</text>

  <path d="M 270 260 L 270 278" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: heap size >= 2? -->
  <polygon points="270,282 370,326 270,370 170,326" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="322" text-anchor="middle" font-size="12" fill="#333">堆中元素</text>
  <text x="270" y="338" text-anchor="middle" font-size="12" fill="#333">≥ 2 ?</text>

  <!-- Yes -> pop two, append, push back -->
  <path d="M 370 326 L 440 326" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="405" y="318" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="380" y="306" width="140" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="450" y="324" text-anchor="middle" font-size="11" fill="#333">弹出 (ch1, c1)</text>
  <text x="450" y="340" text-anchor="middle" font-size="11" fill="#333">弹出 (ch2, c2)</text>

  <!-- Push back arrow -->
  <path d="M 450 350 L 450 380 L 310 380 L 310 370" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="394" text-anchor="middle" font-size="10" fill="#888">c1&gt;0 或 c2&gt;0 则推回</text>

  <!-- Loop back to heap size check -->
  <path d="M 380 326 L 370 326" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <path d="M 310 380 L 270 380 L 270 370" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)" style="display:none"/>

  <!-- No -> one left? -->
  <path d="M 270 370 L 270 388" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="384" font-size="11" fill="#b85450">否</text>

  <!-- Decision: heap has 1 left? -->
  <polygon points="270,392 350,420 270,448 190,420" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="424" text-anchor="middle" font-size="11" fill="#333">剩 1 个?</text>

  <!-- Yes append it -->
  <path d="M 190 420 L 120 420" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="155" y="412" text-anchor="middle" font-size="10" fill="#82b366">是</text>
  <rect x="30" y="406" width="86" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="73" y="425" text-anchor="middle" font-size="10" fill="#333">追加最后字符</text>

  <!-- No -> done -->
  <path d="M 270 448 L 270 452" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return result -->
  <ellipse cx="380" cy="420" rx="50" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="424" text-anchor="middle" font-size="11" fill="#333">返回结果</text>
  <path d="M 350 420 L 330 420" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340" y="412" text-anchor="middle" font-size="10" fill="#b85450">否</text>

  <!-- Summary -->
  <text x="270" y="454" text-anchor="middle" font-size="10" fill="#888">关键：每次取两个最高频交替放，保证相邻不同；剩一个必为 1 不会冲突</text>
</svg>
