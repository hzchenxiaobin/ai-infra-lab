<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：计数 → 特判 1 → 逐链头贪心走链</text>

  <rect x="95" y="36" width="250" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="220" y="56" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">Counter 计数 cnt[v]</text>
  <path d="M 220 66 L 220 78" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="75" y="80" width="290" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="220" y="100" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">ans = 1（单元素 [x] 也是合法模式）</text>
  <path d="M 220 110 L 220 122" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="60" y="124" width="320" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="220" y="144" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">特判 1：c = cnt[1]，偶数用 c−1，奇数用 c</text>
  <path d="M 220 154 L 220 166" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="85" y="168" width="270" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="220" y="188" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">遍历每个 x &gt; 1 且 cnt[x] ≥ 2 作链头</text>
  <path d="M 220 198 L 220 210" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="150" y="212" width="140" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="220" y="231" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">cur = x，len = 1</text>
  <path d="M 220 240 L 220 252" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="220,254 300,280 220,306 140,280" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="285" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">cnt[cur] ≥ 2 ?</text>

  <text x="230" y="318" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 220 306 L 220 318" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="309" y="273" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 302 280 L 336 280" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="340" y="264" width="160" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="420" y="277" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">ans = max(ans, len)</text>
  <text x="420" y="292" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">取下一个链头</text>

  <rect x="150" y="320" width="140" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="220" y="339" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">nxt = cur × cur</text>
  <path d="M 220 348 L 220 358" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="220,360 320,386 220,412 120,386" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="384" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">nxt ≤ 10⁹ 且</text>
  <text x="220" y="399" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">cnt[nxt] ≥ 1 ?</text>

  <text x="107" y="376" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 120 386 L 64 386 L 64 280 L 136 280" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="100" y="270" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">len += 2，cur = nxt</text>
  <text x="100" y="298" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">回到上面 ↺</text>

  <text x="330" y="379" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 322 386 L 336 386" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="340" y="368" width="160" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="420" y="382" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">break，cur 当峰顶收尾</text>
  <text x="420" y="397" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">ans = max(ans, len)</text>

  <path d="M 500 281 L 510 281" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <path d="M 500 386 L 510 386" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <path d="M 510 386 L 510 183 L 358 183" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <path d="M 85 183 L 40 183 L 40 451 L 56 451" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="40" y="436" text-anchor="start" font-size="9.5" fill="#888" filter="url(#rough2)">链头耗尽</text>

  <rect x="60" y="436" width="210" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="165" y="456" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">所有链头试完 → return ans</text>
</svg>
