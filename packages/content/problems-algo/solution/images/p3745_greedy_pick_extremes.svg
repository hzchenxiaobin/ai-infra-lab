<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：+ 槽吃前两大，− 槽吃最小</text>
  <text x="260" y="42" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">nums = [−2, 0, 5, −2, 4]，n = 5（示例 2）</text>

  <!-- 槽位标签 -->
  <text x="132" y="60" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">c（−）</text>
  <text x="260" y="60" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">a（+）</text>
  <text x="388" y="60" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">b（+）</text>

  <!-- 数组格子 -->
  <rect x="104" y="68" width="56" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="93" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">−2</text>
  <rect x="168" y="68" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="93" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="232" y="68" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="93" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <rect x="296" y="68" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="324" y="93" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">−2</text>
  <rect x="360" y="68" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="388" y="93" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">4</text>

  <text x="132" y="120" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="196" y="120" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="260" y="120" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="324" y="120" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="388" y="120" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>

  <text x="260" y="140" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">选中的下标 0 / 2 / 4 互异 ✓（n ≥ 3 时排序位 0、n−2、n−1 永不撞车）</text>

  <!-- 公式组装 -->
  <text x="260" y="166" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">最大值 = max1 + max2 − min1 = 前两大之和 − 全局最小</text>
  <text x="260" y="192" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">= <tspan fill="#4a7a3a" font-weight="bold">5</tspan> + <tspan fill="#4a7a3a" font-weight="bold">4</tspan> − <tspan fill="#b85450" font-weight="bold">(−2)</tspan> = <tspan font-weight="bold" font-size="18">11</tspan></text>

  <!-- 说明框 -->
  <rect x="16" y="206" width="488" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="28" y="228" font-size="10" fill="#333" filter="url(#rough2)">① a、b 对称（都是 + 槽）⇒ 各吃前两大；c 是 − 槽 ⇒ 吃最小——符号固定，槽位互不牵连</text>
  <text x="28" y="248" font-size="10" fill="#333" filter="url(#rough2)">② c 为负是白捡的：−(−2) = +2；全负数组时「前两大」= 负得最浅的两个</text>
  <text x="28" y="268" font-size="10" fill="#333" filter="url(#rough2)">③ 交换论证：任何可行解 a+b ≤ v[n−1]+v[n−2] 且 c ≥ v[0] ⇒ 上界恰被贪心取到</text>
  <text x="28" y="288" font-size="10" fill="#333" filter="url(#rough2)">④ 对照 628 三数最大乘积：符号与大小耦合才须比两组候选，本题符号固定纯贪心即最优</text>

  <text x="16" y="320" font-size="9.5" fill="#999" filter="url(#rough2)">⚠️ 暴力 O(n³)：n = 100 时约 9.7×10⁵ 组三元组，能过但毫无必要</text>
  <text x="16" y="336" font-size="9.5" fill="#999" filter="url(#rough2)">💡 一趟维护 max1 / max2 / min1：O(n) 时间、O(1) 空间、不改动原数组</text>
  <text x="16" y="352" font-size="9.5" fill="#999" filter="url(#rough2)">排序版三行：sort 后返回 nums[n−1] + nums[n−2] − nums[0]</text>
</svg>
