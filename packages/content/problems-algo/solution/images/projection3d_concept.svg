<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="480" fill="#fafafa"/>

  <text x="340" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">三个投影面 = 俯视(非空格子) + 正视(行最大值和) + 侧视(列最大值和)</text>

  <!-- ===== Grid 2x2 [[1,2],[3,4]] ===== -->
  <text x="340" y="56" text-anchor="middle" font-size="12" fill="#888">grid = [[1,2],[3,4]]</text>
  <text x="252" y="98" text-anchor="end" font-size="11" fill="#888">行0</text>
  <text x="252" y="150" text-anchor="end" font-size="11" fill="#888">行1</text>
  <rect x="266" y="74" width="54" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="293" y="101" text-anchor="middle" font-size="16" fill="#333">1</text>
  <rect x="322" y="74" width="54" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="349" y="101" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">2</text>
  <rect x="266" y="120" width="54" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="293" y="147" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">3</text>
  <rect x="322" y="120" width="54" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="349" y="147" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">4</text>
  <text x="293" y="178" text-anchor="middle" font-size="11" fill="#888">列0</text>
  <text x="349" y="178" text-anchor="middle" font-size="11" fill="#888">列1</text>

  <!-- arrows from grid down to three panels -->
  <path d="M 293 186 Q 200 200 130 214" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340 186 L 340 214" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 349 186 Q 460 200 540 214" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Panel A: 俯视图 xy ===== -->
  <rect x="40" y="218" width="180" height="160" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="130" y="242" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">俯视图 (xy 平面)</text>
  <text x="130" y="258" text-anchor="middle" font-size="10" fill="#888">从正上方往下看</text>
  <!-- mini 2x2 all filled -->
  <rect x="100" y="272" width="26" height="22" fill="#4a7a3a" stroke="#3a5a2a" stroke-width="1.5" rx="3" filter="url(#rough2)" opacity="0.75"/>
  <rect x="128" y="272" width="26" height="22" fill="#4a7a3a" stroke="#3a5a2a" stroke-width="1.5" rx="3" filter="url(#rough2)" opacity="0.75"/>
  <rect x="100" y="296" width="26" height="22" fill="#4a7a3a" stroke="#3a5a2a" stroke-width="1.5" rx="3" filter="url(#rough2)" opacity="0.75"/>
  <rect x="128" y="296" width="26" height="22" fill="#4a7a3a" stroke="#3a5a2a" stroke-width="1.5" rx="3" filter="url(#rough2)" opacity="0.75"/>
  <text x="130" y="338" text-anchor="middle" font-size="11" fill="#555">4 个非空格子</text>
  <text x="130" y="358" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">= 4</text>

  <!-- ===== Panel B: 正视图 zx ===== -->
  <rect x="250" y="218" width="180" height="160" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="340" y="242" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">正视图 (zx 平面)</text>
  <text x="340" y="258" text-anchor="middle" font-size="10" fill="#888">每行最高点决定高度</text>
  <!-- baseline -->
  <line x1="285" y1="328" x2="395" y2="328" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- bar row0 max=2 -->
  <rect x="290" y="304" width="32" height="24" fill="#446688" stroke="#334466" stroke-width="1.5" rx="3" filter="url(#rough2)" opacity="0.7"/>
  <text x="306" y="298" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="306" y="346" text-anchor="middle" font-size="10" fill="#888">行0</text>
  <!-- bar row1 max=4 -->
  <rect x="350" y="280" width="32" height="48" fill="#446688" stroke="#334466" stroke-width="1.5" rx="3" filter="url(#rough2)" opacity="0.85"/>
  <text x="366" y="274" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <text x="366" y="346" text-anchor="middle" font-size="10" fill="#888">行1</text>
  <text x="340" y="366" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">= 2 + 4 = 6</text>

  <!-- ===== Panel C: 侧视图 yz ===== -->
  <rect x="460" y="218" width="180" height="160" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="550" y="242" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">侧视图 (yz 平面)</text>
  <text x="550" y="258" text-anchor="middle" font-size="10" fill="#888">每列最高点决定高度</text>
  <!-- baseline -->
  <line x1="495" y1="328" x2="605" y2="328" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- bar col0 max=3 -->
  <rect x="500" y="292" width="32" height="36" fill="#b85450" stroke="#88333a" stroke-width="1.5" rx="3" filter="url(#rough2)" opacity="0.7"/>
  <text x="516" y="286" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="516" y="346" text-anchor="middle" font-size="10" fill="#888">列0</text>
  <!-- bar col1 max=4 -->
  <rect x="560" y="280" width="32" height="48" fill="#b85450" stroke="#88333a" stroke-width="1.5" rx="3" filter="url(#rough2)" opacity="0.85"/>
  <text x="576" y="274" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="576" y="346" text-anchor="middle" font-size="10" fill="#888">列1</text>
  <text x="550" y="366" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">= 3 + 4 = 7</text>

  <!-- ===== Total ===== -->
  <rect x="180" y="402" width="320" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="340" y="438" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">总面积 = 4 + 6 + 7 = 17</text>
</svg>
