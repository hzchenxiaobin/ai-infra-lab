<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [51, 71, 17, 24, 42]</text>

  <!-- table header -->
  <rect x="40" y="44" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="63" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">原数</text>
  <rect x="140" y="44" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="63" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">数位</text>
  <rect x="260" y="44" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="63" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">最大数位</text>
  <rect x="380" y="44" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="63" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">入桶</text>

  <!-- row 51 -->
  <rect x="40" y="74" width="100" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="92" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">51</text>
  <rect x="140" y="74" width="120" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="200" y="92" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5, 1</text>
  <rect x="260" y="74" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="92" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="380" y="74" width="100" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="430" y="92" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">桶5</text>

  <!-- row 71 -->
  <rect x="40" y="102" width="100" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">71</text>
  <rect x="140" y="102" width="120" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="200" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7, 1</text>
  <rect x="260" y="102" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="120" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="380" y="102" width="100" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="430" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">桶7</text>

  <!-- row 17 -->
  <rect x="40" y="130" width="100" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="148" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">17</text>
  <rect x="140" y="130" width="120" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="200" y="148" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1, 7</text>
  <rect x="260" y="130" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="148" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="380" y="130" width="100" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="430" y="148" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">桶7</text>

  <!-- row 24 -->
  <rect x="40" y="158" width="100" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="176" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">24</text>
  <rect x="140" y="158" width="120" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="200" y="176" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2, 4</text>
  <rect x="260" y="158" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="380" y="158" width="100" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="430" y="176" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">桶4</text>

  <!-- row 42 -->
  <rect x="40" y="186" width="100" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="204" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">42</text>
  <rect x="140" y="186" width="120" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="200" y="204" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4, 2</text>
  <rect x="260" y="186" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="204" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="380" y="186" width="100" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="430" y="204" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">桶4</text>

  <!-- 分隔 -->
  <line x1="40" y1="226" x2="580" y2="226" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- 分桶结果 -->
  <text x="40" y="250" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">分桶与 Top-2 求和：</text>

  <rect x="40" y="258" width="170" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="278" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">桶7: [71,17] → 71+17=88</text>

  <rect x="225" y="258" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="278" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">桶5: [51] 跳过</text>

  <rect x="360" y="258" width="170" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="445" y="278" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">桶4: [24,42] → 42+24=66</text>

  <!-- answer -->
  <rect x="120" y="304" width="340" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="329" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">ans = max(88, 66) = 88</text>
</svg>
