<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">构建回文串检测：预处理 + 查询流程</text>

  <!-- step 1: preprocess -->
  <rect x="40" y="44" width="440" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">① 预处理：构建前缀奇偶掩码数组 pref[n+1]</text>
  <line x1="52" y1="72" x2="468" y2="72" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="260" y="92" text-anchor="middle" font-size="11" fill="#444">pref[0] = 0</text>
  <text x="260" y="110" text-anchor="middle" font-size="11" fill="#444">pref[i+1] = pref[i] ^ (1 &lt;&lt; (s[i] − 'a'))</text>
  <text x="260" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">O(n) 一次遍历，空间 O(n)</text>

  <path d="M 260 144 L 260 164" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- step 2: per query -->
  <rect x="40" y="168" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="188" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">② 对每个 query = [left, right, k]</text>
  <text x="260" y="210" text-anchor="middle" font-size="11" fill="#555">取子串 s[left..right] 的奇偶掩码</text>

  <path d="M 260 226 L 260 246" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- step 3: XOR -->
  <rect x="100" y="250" width="320" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="270" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">mask = pref[right+1] ^ pref[left]</text>
  <text x="260" y="292" text-anchor="middle" font-size="10.5" fill="#4a7a3a">两次出现抵消 → 剩 1 的位即奇频字符</text>

  <path d="M 260 308 L 260 328" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- step 4: popcount + judge -->
  <rect x="100" y="332" width="320" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">odd = popcount(mask)</text>
  <text x="260" y="372" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">need = odd / 2   （整数除法 = ⌊odd/2⌋）</text>
  <text x="260" y="392" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">answer = (need &lt;= k)</text>

  <!-- side note -->
  <rect x="30" y="332" width="64" height="72" fill="#fafafa" stroke="#aaa" stroke-width="1" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
  <text x="62" y="354" text-anchor="middle" font-size="9" fill="#888">每次查询</text>
  <text x="62" y="370" text-anchor="middle" font-size="9" fill="#888">O(1)</text>
  <text x="62" y="386" text-anchor="middle" font-size="9" fill="#888">popcount</text>

  <text x="260" y="424" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">预处理 O(n)  ·  查询 O(1)  ·  总 O(n + q)</text>
</svg>
