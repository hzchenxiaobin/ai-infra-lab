<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">贪心分层：频率降序排队，每 8 个一层，层号就是按键次数</text>
  <text x="260" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">先按出现次数从高到低排好 26 个字母（没出现的频率算 0）</text>

  <!-- 26 descending bars -->
  <text x="52" y="72" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">高频 f₁ ←</text>
  <text x="490" y="72" font-size="11" fill="#b85450" font-weight="bold" text-anchor="end" filter="url(#rough2)">→ 低频 f₂₆</text>

  <rect x="56"   y="98"  width="12" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="72.5" y="106" width="12" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="89"   y="114" width="12" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="105.5" y="122" width="12" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="122"  y="130" width="12" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="138.5" y="138" width="12" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="155"  y="146" width="12" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="171.5" y="154" width="12" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>

  <rect x="188"  y="158" width="12" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="204.5" y="159" width="12" height="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="221"  y="160" width="12" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="237.5" y="161" width="12" height="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="254"  y="162" width="12" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="270.5" y="163" width="12" height="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="287"  y="164" width="12" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="303.5" y="165" width="12" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <rect x="320"  y="166" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="336.5" y="166" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="353"  y="167" width="12" height="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="369.5" y="167" width="12" height="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="386"  y="168" width="12" height="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="402.5" y="168" width="12" height="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="419"  y="169" width="12" height="9"  fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="435.5" y="169" width="12" height="9"  fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>

  <rect x="452" y="170" width="12" height="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="468.5" y="170" width="12" height="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- layer brackets -->
  <path d="M 56 184 L 56 194 L 183.5 194 L 183.5 184" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="212" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">层1 · 按1次</text>

  <path d="M 188 184 L 188 194 L 315.5 194 L 315.5 184" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="252" y="212" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">层2 · 按2次</text>

  <path d="M 320 184 L 320 194 L 447.5 194 L 447.5 184" fill="none" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="384" y="212" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">层3 · 按3次</text>

  <path d="M 452 184 L 452 194 L 484 194 L 484 184" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="468" y="212" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">层4·按4次</text>

  <text x="260" y="232" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">26 个字母 ⇒ 代价槽位固定：1×8、2×8、3×8、4×2（每层最多 8 个 = 键数）</text>

  <!-- exchange argument -->
  <rect x="40" y="246" width="440" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="266" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">交换论证：为什么高频字母必须进浅层</text>
  <text x="260" y="286" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">若 f_a ≥ f_b 却让 a 在深层（c_a &gt; c_b）、b 在浅层，交换二者：</text>
  <text x="260" y="304" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">Δ = f_a·c_b + f_b·c_a − f_a·c_a − f_b·c_b = (f_a − f_b)(c_b − c_a) ≤ 0</text>
  <text x="260" y="322" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">总代价不增 ⇒ 换到没有逆序对为止，恰是「频率降序 × 代价升序」最优</text>

  <!-- formula -->
  <rect x="40" y="344" width="440" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = Σ freq_sorted[i] × (⌊i / 8⌋ + 1)</text>
</svg>
