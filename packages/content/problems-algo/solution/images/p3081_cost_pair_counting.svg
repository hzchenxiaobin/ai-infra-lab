<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">分数的本质：每一对相同字符贡献 1</text>

  <!-- string t = aab -->
  <text x="52" y="72" font-size="12" fill="#888" filter="url(#rough2)">t =</text>
  <rect x="86" y="50" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="109" y="75" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="140" y="50" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="163" y="75" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="194" y="50" width="46" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="217" y="75" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>

  <text x="109" y="102" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="163" y="102" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="217" y="102" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=2</text>

  <text x="109" y="122" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">cost=0</text>
  <text x="163" y="122" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">cost=1</text>
  <text x="217" y="122" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">cost=0</text>

  <!-- pair arc between the two a -->
  <path d="M 109 46 C 109 26 163 26 163 46" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 256 60 L 300 60" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="310" y="58" font-size="11.5" fill="#b85450" filter="url(#rough2)">cost(1) 的来源：</text>
  <text x="310" y="76" font-size="11.5" fill="#b85450" filter="url(#rough2)">两个 a 组成一对 (0,1)</text>

  <!-- formula box -->
  <rect x="46" y="140" width="428" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="162" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">cost(i) = 前面与 t[i] 相同的字符个数</text>
  <text x="260" y="186" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">分数 = Σ (相同字符对 i&lt;j 的个数) = Σ x_c·(x_c−1)/2</text>

  <!-- example computation -->
  <rect x="46" y="214" width="428" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="232" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">"aab"：x_a = 2 → 2·1/2 = 1；x_b = 1 → 0</text>
  <text x="260" y="250" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">分数 = 1，与示例一致</text>

  <!-- bottom insight -->
  <rect x="46" y="274" width="428" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">交换任意两个字符的位置，相同字符对的个数不变</text>
  <text x="260" y="316" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 分数与「位置」无关，只与每个字母的出现次数有关</text>
  <text x="260" y="334" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 只要定下填入的字母多重集，怎么排都不影响分数</text>
</svg>
