<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：反转一半数字判定回文</text>

  <!-- Step 1: 判负 & 末尾 0 -->
  <rect x="40" y="46" width="480" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="66" font-size="12" fill="#b85450" font-weight="bold">步骤 1：快速判否</text>
  <text x="60" y="84" font-size="11" fill="#444">若 x &lt; 0，或 x ≠ 0 且 x % 10 == 0（末位为 0），直接返回 false</text>
  <text x="60" y="98" font-size="10" fill="#888">例：-121 → false；10、100 → false；0 → 继续到步骤 2</text>

  <path d="M 280 104 L 280 124" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: 循环反转一半 -->
  <rect x="40" y="128" width="480" height="116" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="148" font-size="12" fill="#446688" font-weight="bold">步骤 2：循环弹出末位，压入 reverted</text>
  <text x="60" y="168" font-size="11" fill="#444" font-family="monospace">while (x &gt; reverted) {</text>
  <text x="80" y="186" font-size="11" fill="#444" font-family="monospace">digit = x % 10;        // 取末位</text>
  <text x="80" y="204" font-size="11" fill="#444" font-family="monospace">reverted = reverted * 10 + digit;   // 压入</text>
  <text x="80" y="222" font-size="11" fill="#444" font-family="monospace">x = x / 10;            // 去掉末位</text>
  <text x="60" y="238" font-size="11" fill="#444" font-family="monospace">}</text>

  <path d="M 280 248 L 280 268" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: 比较两半 -->
  <rect x="40" y="272" width="480" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="292" font-size="12" fill="#4a7a3a" font-weight="bold">步骤 3：比较左半 x 与右半 reverted</text>
  <text x="60" y="312" font-size="11" fill="#444">偶数位长度：x == reverted ⇒ 回文</text>
  <text x="60" y="330" font-size="11" fill="#444">奇数位长度：x == reverted / 10 ⇒ 回文（中点数字可忽略）</text>

  <path d="M 280 348 L 280 368" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="120" y="372" width="320" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="395" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">返回 true / false</text>
</svg>
