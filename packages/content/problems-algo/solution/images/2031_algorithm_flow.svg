<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：树状数组维护前缀和计数</text>
  <text x="270" y="42" text-anchor="middle" font-size="10.5" fill="#888">查询 &lt; 当前 s 的个数 → 累加 → 插入 s</text>

  <!-- 1. init -->
  <rect x="120" y="58" width="300" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="78" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">① 初始化</text>
  <text x="270" y="95" text-anchor="middle" font-size="10.5" fill="#555">base = n+1；update(base, 1) 插入 pref[0]=0</text>

  <path d="M 270 104 L 270 122" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. loop: update s -->
  <rect x="120" y="122" width="300" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="142" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">② 遍历 num ∈ nums</text>
  <text x="270" y="159" text-anchor="middle" font-size="10.5" fill="#555">s += (num == 0) ? −1 : 1</text>

  <path d="M 270 168 L 270 186" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. query -->
  <rect x="120" y="186" width="300" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="206" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">③ 查询并累加</text>
  <text x="270" y="223" text-anchor="middle" font-size="10.5" fill="#b85450">ans += query(s − 1 + base)；ans %= mod</text>

  <path d="M 270 232 L 270 250" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. insert -->
  <rect x="120" y="250" width="300" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="270" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">④ 插入当前前缀和</text>
  <text x="270" y="287" text-anchor="middle" font-size="10.5" fill="#4a7a3a">update(s + base, 1)</text>

  <!-- loop back arrow: from ④ right side up to ② right side -->
  <path d="M 420 273 L 470 273 L 470 145 L 420 145" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="478" y="212" font-size="10.5" fill="#b85450" font-weight="bold">循环</text>
  <text x="478" y="226" font-size="9.5" fill="#b85450">下一个 num</text>

  <path d="M 270 296 L 270 314" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="310" font-size="10.5" fill="#888">遍历完</text>

  <!-- 5. return -->
  <rect x="170" y="314" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="339" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">⑤ return ans</text>

  <!-- side note: offset & strict-less -->
  <rect x="60" y="376" width="420" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="396" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">为何 base = n+1，query(s−1) ？</text>
  <text x="270" y="413" text-anchor="middle" font-size="10" fill="#555">偏移 base 把前缀和 [−n, n] 映射到 [1, 2n+1]，适配树状数组 1 下标</text>
  <text x="270" y="428" text-anchor="middle" font-size="10" fill="#555">query(s−1+base) 统计 ≤ s−1 即严格 &lt; s 的个数 → pref[i] &lt; pref[j]</text>

  <!-- footer -->
  <text x="270" y="452" text-anchor="middle" font-size="10" fill="#aaa">时间 O(n log n)，空间 O(n)；单次遍历 + 树状数组查询/更新各 O(log n)</text>
</svg>
