<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="920" height="380" fill="#fafafa"/>
  <text x="460" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：4 步输入</text>
  <path d="M 280 36 Q 460 44 640 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Step 1: input('i') ===== -->
  <g filter="url(#sk2)">
    <rect x="15" y="52" width="210" height="312" rx="8" fill="#f6f9ff" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="120" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">① input('i')</text>
  <line x1="30" y1="82" x2="210" y2="82" stroke="#ccc" stroke-width="0.8" filter="url(#sk)"/>
  <g font-size="10" fill="#444">
    <text x="28" y="100">query = "i"</text>
    <text x="28" y="118" fill="#2b6e9e" font-weight="bold">cur → "i" 节点</text>
    <text x="28" y="138" fill="#888">freq:</text>
    <text x="40" y="154">i love you → 5</text>
    <text x="40" y="170">island → 3</text>
    <text x="40" y="186">iroman → 2</text>
    <text x="40" y="202">i love leetcode → 2</text>
  </g>
  <line x1="30" y1="214" x2="210" y2="214" stroke="#ccc" stroke-width="0.8" filter="url(#sk)"/>
  <text x="28" y="232" font-size="9" fill="#888">sort(-hot, s):</text>
  <text x="40" y="248" font-size="9" fill="#444">(-5, i love you)</text>
  <text x="40" y="262" font-size="9" fill="#444">(-3, island)</text>
  <text x="40" y="276" font-size="9" fill="#444">(-2, i love leetcode)</text>
  <text x="40" y="290" font-size="9" fill="#999">(-2, iroman) ✗落选</text>
  <line x1="30" y1="300" x2="210" y2="300" stroke="#ccc" stroke-width="0.8" filter="url(#sk)"/>
  <text x="28" y="318" font-size="10" fill="#2e6e2e" font-weight="bold">返回 top 3:</text>
  <text x="40" y="334" font-size="9" fill="#2e6e2e">"i love you"</text>
  <text x="40" y="348" font-size="9" fill="#2e6e2e">"island"</text>
  <text x="40" y="360" font-size="9" fill="#2e6e2e">"i love leetcode"</text>

  <!-- ===== Step 2: input(' ') ===== -->
  <g filter="url(#sk2)">
    <rect x="240" y="52" width="210" height="312" rx="8" fill="#f6fff8" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="345" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">② input(' ')</text>
  <line x1="255" y1="82" x2="435" y2="82" stroke="#ccc" stroke-width="0.8" filter="url(#sk)"/>
  <g font-size="10" fill="#444">
    <text x="253" y="100">query = "i "</text>
    <text x="253" y="118" fill="#2e6e2e" font-weight="bold">cur → "' '" 节点</text>
    <text x="253" y="138" fill="#888">freq:</text>
    <text x="265" y="154">i love you → 5</text>
    <text x="265" y="170">i love leetcode → 2</text>
  </g>
  <text x="253" y="196" font-size="9" fill="#d6a040">↑ 缩窄到 "i " 前缀</text>
  <text x="253" y="210" font-size="9" fill="#888">island / iroman 已排除</text>
  <line x1="255" y1="222" x2="435" y2="222" stroke="#ccc" stroke-width="0.8" filter="url(#sk)"/>
  <text x="253" y="244" font-size="10" fill="#2e6e2e" font-weight="bold">返回 top 3:</text>
  <text x="265" y="262" font-size="9" fill="#2e6e2e">"i love you"</text>
  <text x="265" y="278" font-size="9" fill="#2e6e2e">"i love leetcode"</text>
  <text x="265" y="298" font-size="9" fill="#999">(仅 2 条匹配)</text>

  <!-- arrow from step 1 to step 2 -->
  <path d="M 225 200 L 240 200" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Step 3: input('a') ===== -->
  <g filter="url(#sk2)">
    <rect x="465" y="52" width="210" height="312" rx="8" fill="#fff5f6" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="570" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">③ input('a')</text>
  <line x1="480" y1="82" x2="660" y2="82" stroke="#ccc" stroke-width="0.8" filter="url(#sk)"/>
  <g font-size="10" fill="#444">
    <text x="478" y="100">query = "i a"</text>
    <text x="478" y="118" fill="#b85450" font-weight="bold">cur → null ✗</text>
  </g>
  <text x="478" y="140" font-size="9" fill="#888">"' ' 节点无 'a' 子节点"</text>
  <text x="478" y="156" font-size="9" fill="#888">→ cur 置 null</text>
  <g filter="url(#sk)">
    <rect x="478" y="168" width="180" height="44" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="4 2"/>
  </g>
  <text x="490" y="186" font-size="9" fill="#b85450">⚠ query 仍追加 'a'</text>
  <text x="490" y="200" font-size="9" fill="#b85450">后续字符继续返回 []</text>
  <text x="490" y="210" font-size="9" fill="#b85450">直到 '#' 触发记录</text>
  <line x1="480" y1="222" x2="660" y2="222" stroke="#ccc" stroke-width="0.8" filter="url(#sk)"/>
  <text x="478" y="250" font-size="10" fill="#b85450" font-weight="bold">返回: [ ]</text>
  <text x="478" y="272" font-size="9" fill="#888">无匹配，但 "i a" 已</text>
  <text x="478" y="286" font-size="9" fill="#888">暂存在 query 中</text>

  <!-- arrow from step 2 to step 3 -->
  <path d="M 450 200 L 465 200" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Step 4: input('#') ===== -->
  <g filter="url(#sk2)">
    <rect x="690" y="52" width="210" height="312" rx="8" fill="#fffcf0" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="795" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040">④ input('#')</text>
  <line x1="705" y1="82" x2="885" y2="82" stroke="#ccc" stroke-width="0.8" filter="url(#sk)"/>
  <g font-size="10" fill="#444">
    <text x="703" y="100">query = "i a"</text>
    <text x="703" y="118" fill="#d6a040" font-weight="bold">→ insert("i a", 1)</text>
  </g>
  <text x="703" y="138" font-size="9" fill="#888">记录新句子 "i a"</text>
  <text x="703" y="154" font-size="9" fill="#888">热度 = 1</text>
  <g filter="url(#sk)">
    <rect x="703" y="166" width="180" height="56" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
  </g>
  <text x="715" y="184" font-size="9" fill="#7a5415">Trie 新增路径:</text>
  <text x="715" y="198" font-size="9" fill="#7a5415">root→i→' '→a (is_end)</text>
  <text x="715" y="212" font-size="9" fill="#7a5415">各节点 freq["i a"] += 1</text>
  <line x1="705" y1="232" x2="885" y2="232" stroke="#ccc" stroke-width="0.8" filter="url(#sk)"/>
  <g font-size="10" fill="#444">
    <text x="703" y="252">query = ""</text>
    <text x="703" y="270">cur = root</text>
  </g>
  <text x="703" y="290" font-size="9" fill="#888">重置，等待下一轮输入</text>
  <line x1="705" y1="300" x2="885" y2="300" stroke="#ccc" stroke-width="0.8" filter="url(#sk)"/>
  <text x="703" y="322" font-size="10" fill="#b85450" font-weight="bold">返回: [ ]</text>

  <!-- arrow from step 3 to step 4 -->
  <path d="M 675 200 L 690 200" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- bottom flow arrows -->
  <text x="120" y="372" text-anchor="middle" font-size="9" fill="#888">前缀 "i"</text>
  <text x="345" y="372" text-anchor="middle" font-size="9" fill="#888">前缀 "i "</text>
  <text x="570" y="372" text-anchor="middle" font-size="9" fill="#888">前缀 "i a" (无匹配)</text>
  <text x="795" y="372" text-anchor="middle" font-size="9" fill="#888">记录 "i a", 重置</text>
</svg>
