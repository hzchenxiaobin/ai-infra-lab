<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描，cur 一归零就切割</text>

  <!-- start box -->
  <rect x="110" y="38" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="210" y="63" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始：cur = −1（全 1），cnt = 0</text>
  <path d="M 210 78 L 210 96" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- loop container -->
  <rect x="100" y="100" width="250" height="252" fill="none" stroke="#bbb" stroke-width="1.4" stroke-dasharray="6 4" rx="12" filter="url(#rough2)"/>
  <text x="225" y="118" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">遍历 nums 中的每个 x（元素用尽则跳出）</text>

  <!-- process: AND -->
  <rect x="135" y="130" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="225" y="153" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">cur = cur ∧ x</text>
  <path d="M 225 166 L 225 184" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- diamond: cur == 0? -->
  <polygon points="225,190 295,235 225,280 155,235" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="225" y="240" text-anchor="middle" font-size="13" fill="#b07818" font-weight="bold" filter="url(#rough2)">cur == 0 ?</text>

  <!-- yes branch: cut -->
  <path d="M 295 235 L 376 235" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="333" y="227" text-anchor="middle" font-size="12" fill="#b07818" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="380" y="215" width="150" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="455" y="232" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">cnt++（多切一段）</text>
  <text x="455" y="248" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">cur 重置为 −1（全 1）</text>
  <!-- loop back from cut box -->
  <path d="M 455 215 V 148 H 320" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="466" y="186" text-anchor="start" font-size="11" fill="#b07818" filter="url(#rough2)">取下一个 x</text>

  <!-- no branch: continue -->
  <path d="M 225 280 V 310 H 70 V 148 H 130" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="228" y="300" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="148" y="326" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">还没清零，继续攒位</text>

  <!-- exit to result -->
  <path d="M 225 352 L 225 368" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- result box -->
  <rect x="130" y="370" width="190" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="225" y="390" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 max(cnt, 1)</text>
  <text x="225" y="408" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">cnt = 0 ⇔ total &gt; 0，只能不切</text>

  <!-- side notes -->
  <rect x="375" y="275" width="165" height="60" fill="#fafafa" stroke="#bbb" stroke-width="1.4" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="457" y="297" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">⚠ cur 必须重置为全 1（−1）</text>
  <text x="457" y="315" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">初始化 / 重置成 0 是经典 bug</text>

  <rect x="375" y="345" width="165" height="70" fill="#fafafa" stroke="#bbb" stroke-width="1.4" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="457" y="367" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">末尾清不零的尾巴：</text>
  <text x="457" y="385" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">并回上一段（0 ∧ 尾 = 0），</text>
  <text x="457" y="403" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">不计数、不影响最优性</text>
</svg>
