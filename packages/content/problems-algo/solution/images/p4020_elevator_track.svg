<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：顺序处理 ⇒ 轨迹唯一 ⇒ 总时间 = 相邻楼层差之和</text>
    <text x="310" y="42" text-anchor="middle" font-size="11" fill="#888">示例 1：n = 5，requests = [2,1,4,3]，电梯从 0 层出发（楼层–时间轨迹）</text>

    <!-- axes -->
    <path d="M 70 330 H 445" stroke="#999" stroke-width="1.6" marker-end="url(#arrO)" fill="none"/>
    <path d="M 70 336 V 62" stroke="#999" stroke-width="1.6" marker-end="url(#arrO)" fill="none"/>
    <text x="60" y="58" text-anchor="middle" font-size="10" fill="#777" font-weight="bold">楼层</text>
    <text x="255" y="368" text-anchor="middle" font-size="10" fill="#777" font-weight="bold">时间（秒）</text>

    <!-- floor gridlines & labels -->
    <path d="M 70 70 H 440" stroke="#ddd" stroke-width="1" stroke-dasharray="4,5"/>
    <path d="M 70 135 H 440" stroke="#ddd" stroke-width="1" stroke-dasharray="4,5"/>
    <path d="M 70 200 H 440" stroke="#ddd" stroke-width="1" stroke-dasharray="4,5"/>
    <path d="M 70 265 H 440" stroke="#ddd" stroke-width="1" stroke-dasharray="4,5"/>
    <text x="60" y="74" text-anchor="end" font-size="10" fill="#889">4</text>
    <text x="60" y="139" text-anchor="end" font-size="10" fill="#889">3</text>
    <text x="60" y="204" text-anchor="end" font-size="10" fill="#889">2</text>
    <text x="60" y="269" text-anchor="end" font-size="10" fill="#889">1</text>
    <text x="60" y="334" text-anchor="end" font-size="10" fill="#889">0</text>

    <!-- time ticks -->
    <text x="70" y="348" text-anchor="middle" font-size="9" fill="#889">0</text>
    <text x="120" y="348" text-anchor="middle" font-size="9" fill="#889">1</text>
    <text x="170" y="348" text-anchor="middle" font-size="9" fill="#889">2</text>
    <text x="220" y="348" text-anchor="middle" font-size="9" fill="#889">3</text>
    <text x="270" y="348" text-anchor="middle" font-size="9" fill="#889">4</text>
    <text x="320" y="348" text-anchor="middle" font-size="9" fill="#889">5</text>
    <text x="370" y="348" text-anchor="middle" font-size="9" fill="#889">6</text>
    <text x="420" y="348" text-anchor="middle" font-size="9" fill="#889">7</text>

    <!-- trajectory: 0->2->1->4->3 -->
    <path d="M 70 330 L 170 200" stroke="#446688" stroke-width="2.4" fill="none"/>
    <path d="M 170 200 L 220 265" stroke="#4a7a3a" stroke-width="2.4" fill="none"/>
    <path d="M 220 265 L 370 70" stroke="#d6a040" stroke-width="2.4" fill="none"/>
    <path d="M 370 70 L 420 135" stroke="#b85450" stroke-width="2.4" fill="none"/>

    <!-- segment durations -->
    <text x="100" y="252" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">+2s</text>
    <text x="203" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1s</text>
    <text x="278" y="152" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">+3s</text>
    <text x="390" y="122" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+1s</text>

    <!-- nodes -->
    <circle cx="70" cy="330" r="4.5" fill="#fafafa" stroke="#888" stroke-width="1.8"/>
    <text x="78" y="322" font-size="9.5" fill="#777">start（0 层）</text>
    <circle cx="170" cy="200" r="4.5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="126" y="192" text-anchor="end" font-size="9.5" fill="#a87020" font-weight="bold">r₀ = 2</text>
    <circle cx="220" cy="265" r="4.5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="230" y="284" font-size="9.5" fill="#a87020" font-weight="bold">r₁ = 1</text>
    <circle cx="370" cy="70" r="4.5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="360" y="62" text-anchor="end" font-size="9.5" fill="#a87020" font-weight="bold">r₂ = 4</text>
    <circle cx="420" cy="135" r="4.5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="430" y="152" font-size="9.5" fill="#a87020" font-weight="bold">r₃ = 3</text>

    <!-- right: summation box -->
    <rect x="465" y="70" width="140" height="210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
    <text x="535" y="92" text-anchor="middle" font-size="10.5" fill="#7a5c1a" font-weight="bold">一步求和（免逐秒）</text>
    <text x="535" y="116" text-anchor="middle" font-size="10" fill="#33506b">|0−2| = 2</text>
    <text x="535" y="136" text-anchor="middle" font-size="10" fill="#33506b">|2−1| = 1</text>
    <text x="535" y="156" text-anchor="middle" font-size="10" fill="#33506b">|1−4| = 3</text>
    <text x="535" y="176" text-anchor="middle" font-size="10" fill="#33506b">|4−3| = 1</text>
    <path d="M 485 188 H 585" stroke="#d6a040" stroke-width="1.4"/>
    <text x="535" y="210" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold">合计 = 7 秒</text>
    <text x="535" y="230" text-anchor="middle" font-size="8.5" fill="#a87020">每段时长 = 楼层差的绝对值</text>
    <text x="535" y="246" text-anchor="middle" font-size="8.5" fill="#a87020">差为 0 即「已在目标层」</text>
    <text x="535" y="262" text-anchor="middle" font-size="8.5" fill="#a87020">n 不参与计算，只定值域</text>

    <!-- bottom takeaway -->
    <rect x="40" y="385" width="560" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="58" y="405" font-size="10.5" fill="#446688" font-weight="bold">为什么不用逐秒模拟？</text>
    <text x="58" y="423" font-size="9" fill="#33506b">① 请求按给定顺序处理，轨迹 0 → r₀ → r₁ → … → rₘ₋₁ 完全确定，没有任何决策空间</text>
    <text x="58" y="441" font-size="9" fill="#33506b">② 电梯每秒恰好移动一层 ⇒ 每段耗时就是 |cur − r|，一趟累加即为答案</text>
  </g>
</svg>
