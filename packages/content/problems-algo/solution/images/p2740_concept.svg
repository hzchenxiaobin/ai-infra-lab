<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2740c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
    <marker id="arr2740b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：排序后在相邻间隙处切一刀，分区值 = 该间隙宽度</text>

  <!-- sorted array boxes 1..6 -->
  <text x="40" y="74" font-size="12" fill="#888" font-weight="bold">排序后</text>
  <g font-size="18" font-weight="bold">
    <rect x="80" y="86" width="56" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="108" y="118" text-anchor="middle" fill="#333">1</text>
    <rect x="136" y="86" width="56" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="164" y="118" text-anchor="middle" fill="#333">2</text>
    <rect x="192" y="86" width="56" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="220" y="118" text-anchor="middle" fill="#333">3</text>
    <rect x="248" y="86" width="56" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="276" y="118" text-anchor="middle" fill="#333">5</text>
    <rect x="304" y="86" width="56" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="332" y="118" text-anchor="middle" fill="#333">8</text>
    <rect x="360" y="86" width="56" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="388" y="118" text-anchor="middle" fill="#333">9</text>
  </g>

  <!-- cut markers between adjacent boxes; gaps:1,1,2,3,1 -->
  <!-- cut0 between 1 and 2  gap1 -->
  <line x1="136" y1="86" x2="136" y2="60" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="136" y="54" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">切0</text>

  <!-- cut1 between 2 and 3 gap1 -->
  <line x1="192" y1="86" x2="192" y2="60" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="192" y="54" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">切1</text>

  <!-- cut2 between 3 and 5 gap2 -->
  <line x1="248" y1="86" x2="248" y2="60" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="248" y="54" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">切2</text>

  <!-- cut3 between 5 and 8 gap3 -->
  <line x1="304" y1="86" x2="304" y2="60" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="304" y="54" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">切3</text>

  <!-- cut4 between 8 and 9 gap1  (min, highlight) -->
  <line x1="360" y1="86" x2="360" y2="56" stroke="#b85450" stroke-width="2.6" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="360" y="50" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">切4 ★</text>

  <!-- gap labels under each cut -->
  <g font-size="11" fill="#888">
    <text x="136" y="156" text-anchor="middle">gap=1</text>
    <text x="192" y="156" text-anchor="middle">gap=1</text>
    <text x="248" y="156" text-anchor="middle">gap=2</text>
    <text x="304" y="156" text-anchor="middle">gap=3</text>
    <text x="360" y="156" text-anchor="middle" fill="#b85450" font-weight="bold">gap=1 ★min</text>
  </g>

  <!-- example partition for cut4: nums1=prefix(1..8), nums2=suffix(9) -->
  <text x="40" y="196" font-size="12" fill="#888" font-weight="bold">取切4</text>
  <g font-size="16" font-weight="bold">
    <rect x="80" y="208" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="108" y="236" text-anchor="middle" fill="#4a7a3a">1</text>
    <rect x="136" y="208" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="164" y="236" text-anchor="middle" fill="#4a7a3a">2</text>
    <rect x="192" y="208" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="220" y="236" text-anchor="middle" fill="#4a7a3a">3</text>
    <rect x="248" y="208" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="276" y="236" text-anchor="middle" fill="#4a7a3a">5</text>
    <rect x="304" y="208" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="332" y="236" text-anchor="middle" fill="#4a7a3a">8</text>
    <rect x="360" y="208" width="56" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
    <text x="388" y="236" text-anchor="middle" fill="#b85450">9</text>
  </g>
  <!-- brace labels -->
  <path d="M80,260 Q80,268 88,268 L320,268 Q328,268 328,260" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="284" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">nums1（前缀） max=8</text>
  <path d="M362,260 Q362,268 370,268 L410,268 Q418,268 418,260" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="284" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">nums2 min=9</text>

  <!-- value arrow -->
  <text x="470" y="232" font-size="11" fill="#d6a040" font-weight="bold">分区值</text>
  <path d="M440,226 L406,232" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr2740c)" filter="url(#rough2)"/>
  <text x="470" y="248" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">=|8−9|=1</text>

  <!-- bottom note -->
  <rect x="60" y="306" width="440" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">答案 = 所有相邻间隙的最小值</text>
  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#d6a040">每个切点都对应一种「前缀→nums1、后缀→nums2」的合法划分</text>
  <text x="280" y="366" text-anchor="middle" font-size="11" fill="#d6a040">min(1,1,2,3,1) = 1 ⭐</text>
</svg>
