<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：定长滑窗，O(1) 增量维护元音计数</text>

  <!-- Start -->
  <ellipse cx="240" cy="46" rx="36" ry="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="50" text-anchor="middle" font-size="12" fill="#333">开始</text>
  <path d="M 240 59 L 240 69" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box: vowel set = {a,e,i,o,u}; count = 0 -->
  <rect x="120" y="71" width="240" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="90" text-anchor="middle" font-size="11" fill="#333">vowel = {a,e,i,o,u}；count = 0；maxV = 0</text>
  <path d="M 240 101 L 240 111" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box: 统计首窗 [0..k-1] 元音数 -> count -->
  <rect x="120" y="113" width="240" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="134" text-anchor="middle" font-size="11" fill="#333">for i in [0, k)：if s[i]∈vowel → count++</text>
  <path d="M 240 147 L 240 157" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box: maxV = count -->
  <rect x="160" y="159" width="160" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="177" text-anchor="middle" font-size="11.5" fill="#333">maxV = count</text>
  <path d="M 240 187 L 240 197" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box: right = k -->
  <rect x="180" y="199" width="120" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="217" text-anchor="middle" font-size="11.5" fill="#333">right = k</text>
  <path d="M 240 227 L 240 237" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: right &lt; n ? -->
  <polygon points="240,239 326,273 240,307 154,273" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="277" text-anchor="middle" font-size="12" fill="#333">right &lt; n ?</text>

  <!-- No branch left -> return maxV -->
  <path d="M 154 273 L 130 273" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="267" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="40" y="257" width="90" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="85" y="277" text-anchor="middle" font-size="11.5" fill="#333">返回 maxV</text>
  <path d="M 85 289 L 85 301" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="85" cy="314" rx="30" ry="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="85" y="318" text-anchor="middle" font-size="11.5" fill="#333">结束</text>

  <!-- Yes branch down -->
  <path d="M 240 307 L 240 317" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="248" y="314" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Diamond: s[right] 是元音? -->
  <polygon points="240,319 332,353 240,387 148,353" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="350" text-anchor="middle" font-size="11" fill="#333">s[right]</text>
  <text x="240" y="365" text-anchor="middle" font-size="11" fill="#333">∈ vowel ?</text>

  <!-- Yes branch left -> count += 1 -->
  <path d="M 148 353 L 134 353" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="142" y="347" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="40" y="339" width="94" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="87" y="357" text-anchor="middle" font-size="11" fill="#333">count += 1</text>
  <path d="M 87 367 L 87 397 L 240 397" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- No branch right -> go to next diamond -->
  <path d="M 332 353 L 372 353" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="344" y="347" font-size="10.5" fill="#b85450" font-weight="bold">否</text>

  <!-- Diamond: s[right-k] 是元音? -->
  <polygon points="412,319 504,353 412,387 320,353" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="412" y="350" text-anchor="middle" font-size="11" fill="#333">s[right−k]</text>
  <text x="412" y="365" text-anchor="middle" font-size="11" fill="#333">∈ vowel ?</text>

  <!-- Yes branch right -> count -= 1 -->
  <path d="M 504 353 L 520 353" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="510" y="347" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="466" y="395" width="86" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="509" y="413" text-anchor="middle" font-size="11" fill="#333">count −= 1</text>
  <path d="M 509 395 L 509 387 L 412 387" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- No branch down -> join -->
  <path d="M 412 387 L 412 397" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- merge point at (240,397) -> down to maxV update -->
  <!-- the count-=1 path joins: from (412,387) down to (412,397) then left to (240,397) already covered by arrG arrow above ending at 240,397 -->
  <path d="M 412 397 L 280 397" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- maxV = max(maxV, count) -->
  <rect x="170" y="407" width="140" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="425" text-anchor="middle" font-size="11" fill="#333">maxV = max(maxV, count)</text>
  <path d="M 240 435 L 240 443" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- right += 1 -->
  <rect x="190" y="445" width="100" height="22" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="460" text-anchor="middle" font-size="11" fill="#333">right += 1</text>
  <!-- loop back to right < n? diamond -->
  <path d="M 290 456 L 412 456 L 412 273 L 326 273" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="360" y="270" font-size="10" fill="#4a7a3a">回到判断</text>

  <!-- footer note -->
  <rect x="330" y="40" width="210" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="435" y="60" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">每步只看两端两个字符</text>
  <text x="435" y="76" text-anchor="middle" font-size="10" fill="#888">入端 +1 / 出端 −1，O(1) 增量</text>
  <text x="435" y="90" text-anchor="middle" font-size="10" fill="#888">总时间 O(n)，空间 O(1)</text>
</svg>
