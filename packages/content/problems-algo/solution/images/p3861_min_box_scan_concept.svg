<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：一趟扫描打擂台——合法者中取最小，严格 &lt; 保最左</text>
  <text x="260" y="33" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">合法 ⟺ capacity[i] ≥ itemSize；换代条件：合法 且 capacity[i] &lt; bestCap（严格小于，平局不换）</text>

  <!-- ======== Row 1: example 1 ======== -->
  <text x="30" y="58" font-size="10" fill="#888" filter="url(#rough2)">示例 1：capacity = [1,5,3,7]，itemSize = 3</text>

  <rect x="96" y="66" width="40" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="116" y="89" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="136" y="66" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="156" y="89" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="176" y="66" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="196" y="89" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="216" y="66" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="236" y="89" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>

  <text x="116" y="114" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">下标 0</text>
  <text x="156" y="114" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">下标 1</text>
  <text x="196" y="114" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">下标 2</text>
  <text x="236" y="114" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">下标 3</text>

  <line x1="256" y1="126" x2="106" y2="126" stroke="#999" stroke-width="1.5" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="181" y="140" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">一趟从左到右：每个箱子判一次「合法且更小？」</text>

  <text x="306" y="80" font-size="9" fill="#b85450" filter="url(#rough2)">1 &lt; 3：不合法，出局</text>
  <text x="306" y="96" font-size="9" fill="#333" filter="url(#rough2)">5 上位 → 3 换代 → 7 不动</text>
  <text x="306" y="112" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案：下标 2（容量 3）✓</text>

  <!-- ======== Row 2: example 2 (tie) ======== -->
  <text x="30" y="164" font-size="10" fill="#888" filter="url(#rough2)">示例 2：capacity = [3,5,4,3]，itemSize = 2</text>

  <rect x="96" y="172" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="116" y="195" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="136" y="172" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="156" y="195" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="176" y="172" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="196" y="195" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="216" y="172" width="40" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="236" y="195" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <text x="116" y="220" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">下标 0</text>
  <text x="156" y="220" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">下标 1</text>
  <text x="196" y="220" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">下标 2</text>
  <text x="236" y="220" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">下标 3</text>

  <text x="306" y="182" font-size="9" fill="#333" filter="url(#rough2)">全员 ≥ 2：都合法</text>
  <text x="306" y="198" font-size="9" fill="#333" filter="url(#rough2)">下标 3 的 3 == 擂主 3：</text>
  <text x="306" y="214" font-size="9" fill="#b85450" filter="url(#rough2)">3 &lt; 3 不成立 → 平局不换代</text>

  <text x="30" y="240" font-size="9" fill="#b85450" filter="url(#rough2)">⚠️ 若误用 ≤（小于等于）换代，答案会错成下标 3——严格 &lt; 才保最左</text>

  <!-- ======== Row 3: example 3 (no valid) ======== -->
  <text x="30" y="262" font-size="10" fill="#888" filter="url(#rough2)">示例 3：capacity = [4]，itemSize = 5</text>

  <rect x="96" y="270" width="40" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="116" y="293" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="116" y="318" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">下标 0</text>

  <text x="306" y="280" font-size="9" fill="#333" filter="url(#rough2)">4 &lt; 5：唯一的箱子也不合法</text>
  <text x="306" y="296" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">bestIdx 保持 −1 → 返回 −1 ✓</text>

  <!-- legend -->
  <rect x="16" y="328" width="14" height="10" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="34" y="337" font-size="8.5" fill="#666" filter="url(#rough2)">擂主（答案）</text>
  <rect x="106" y="328" width="14" height="10" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="124" y="337" font-size="8.5" fill="#666" filter="url(#rough2)">合法但更大</text>
  <rect x="190" y="328" width="14" height="10" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="208" y="337" font-size="8.5" fill="#666" filter="url(#rough2)">不合法</text>
  <rect x="262" y="328" width="14" height="10" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="280" y="337" font-size="8.5" fill="#666" filter="url(#rough2)">平局（不换代）</text>

  <!-- insight box -->
  <rect x="16" y="344" width="488" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">换代条件合起来就是区间判断 itemSize ≤ capacity[i] &lt; bestCap；严格 &lt; ⇒ 平局留最左；bestCap 初值 101（&gt; 值域上界）⇒ 首个合法必上位</text>
  <text x="260" y="370" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">bestIdx = −1 兜底无解；合法容量 ≥ itemSize ⇒ bestCap == itemSize 即下界可早停；一趟 O(n) / O(1) 空间</text>
</svg>
