<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：四个学生逐一判定 → 输出 {1, 3}</text>

  <!-- Alice -->
  <rect x="16" y="36" width="242" height="118" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="137" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">Alice（id 1）· CS</text>
  <rect x="30" y="66" width="104" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="82" y="82" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">101 → A</text>
  <rect x="142" y="66" width="104" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="194" y="82" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">102 → A</text>
  <text x="137" y="114" text-anchor="middle" font-size="9" fill="#557799" filter="url(#rough2)">应修宇宙展开：(1,101) (1,102) → grade A、A</text>
  <text x="137" y="140" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">A 行 2 / 应修 2 → ✓ 输出</text>

  <!-- Bob -->
  <rect x="262" y="36" width="242" height="118" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="383" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">Bob（id 2）· CS</text>
  <rect x="276" y="66" width="104" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="328" y="82" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">101 → B</text>
  <rect x="388" y="66" width="104" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="440" y="82" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">102 → A</text>
  <text x="383" y="114" text-anchor="middle" font-size="9" fill="#557799" filter="url(#rough2)">应修宇宙展开：(2,101) (2,102) → grade B、A</text>
  <text x="383" y="140" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">A 行 1 / 应修 2 → ✗ 剔除</text>

  <!-- Charlie -->
  <rect x="16" y="164" width="242" height="118" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="137" y="184" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">Charlie（id 3）· Mathematics</text>
  <rect x="30" y="194" width="104" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="82" y="210" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">103 → A</text>
  <rect x="142" y="194" width="104" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="194" y="210" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">104 → A</text>
  <text x="137" y="242" text-anchor="middle" font-size="9" fill="#557799" filter="url(#rough2)">应修宇宙展开：(3,103) (3,104) → grade A、A</text>
  <text x="137" y="268" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">A 行 2 / 应修 2 → ✓ 输出</text>

  <!-- David -->
  <rect x="262" y="164" width="242" height="118" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="383" y="184" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">David（id 4）· Mathematics</text>
  <rect x="276" y="194" width="104" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="328" y="210" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">103 → A</text>
  <rect x="388" y="194" width="104" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="440" y="210" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">104 → B</text>
  <text x="383" y="242" text-anchor="middle" font-size="9" fill="#557799" filter="url(#rough2)">应修宇宙展开：(4,103) (4,104) → grade A、B</text>
  <text x="383" y="268" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">A 行 1 / 应修 2 → ✗ 剔除</text>

  <!-- bottom output strip -->
  <rect x="16" y="294" width="490" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="110" y="316" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">HAVING 后只剩</text>
  <text x="110" y="332" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">Alice 与 Charlie</text>
  <text x="238" y="325" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">ORDER BY student_id →</text>
  <rect x="330" y="304" width="150" height="16" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="405" y="316" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">student_id</text>
  <rect x="330" y="320" width="72" height="16" fill="#ffffff" stroke="#8aa4c0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="366" y="332" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="402" y="320" width="72" height="16" fill="#ffffff" stroke="#8aa4c0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="438" y="332" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
</svg>
