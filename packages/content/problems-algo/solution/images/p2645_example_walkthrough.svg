<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：word = "aaa"（逐步推进 i / j / ans）</text>

  <!-- header row -->
  <rect x="40" y="46" width="540" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="74" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">步</text>
  <text x="132" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="186" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="250" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">期望</text>
  <text x="318" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">word[i]</text>
  <text x="430" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">动作</text>
  <text x="552" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- step1 i=0 j=0 a/a match -->
  <rect x="40" y="74" width="540" height="30" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="74" y="93" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="132" y="93" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="186" y="93" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="250" y="93" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="318" y="93" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="430" y="93" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">匹配，i++ j++</text>
  <text x="552" y="93" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- step2 i=1 j=1 b/a mismatch -->
  <rect x="40" y="104" width="540" height="30" fill="#fce4ec" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="74" y="123" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="132" y="123" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="186" y="123" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="250" y="123" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="318" y="123" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="430" y="123" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">不等，插入 b，只 j++</text>
  <text x="552" y="123" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- step3 i=1 j=2 c/a mismatch -->
  <rect x="40" y="134" width="540" height="30" fill="#fce4ec" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="74" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="132" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="186" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="250" y="153" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="318" y="153" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="430" y="153" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">不等，插入 c，只 j++</text>
  <text x="552" y="153" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- step4 i=1 j=0 a/a match -->
  <rect x="40" y="164" width="540" height="30" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="74" y="183" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="132" y="183" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="186" y="183" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="250" y="183" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="318" y="183" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="430" y="183" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">匹配，i++ j++（新组开始）</text>
  <text x="552" y="183" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- step5 i=2 j=1 b/a mismatch -->
  <rect x="40" y="194" width="540" height="30" fill="#fce4ec" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="74" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="132" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="186" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="250" y="213" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="318" y="213" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="430" y="213" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">不等，插入 b，只 j++</text>
  <text x="552" y="213" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- step6 i=2 j=2 c/a mismatch -->
  <rect x="40" y="224" width="540" height="30" fill="#fce4ec" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="74" y="243" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="132" y="243" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="186" y="243" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="250" y="243" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="318" y="243" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="430" y="243" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">不等，插入 c，只 j++</text>
  <text x="552" y="243" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- step7 i=2 j=0 a/a match -->
  <rect x="40" y="254" width="540" height="30" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="74" y="273" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <text x="132" y="273" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="186" y="273" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="250" y="273" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="318" y="273" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="430" y="273" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">匹配，i++ j++（i 到 3 退出）</text>
  <text x="552" y="273" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- step8 tail: i=3 j=1 complete -->
  <rect x="40" y="284" width="540" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="74" y="303" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <text x="132" y="303" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">3</text>
  <text x="186" y="303" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="250" y="303" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">b,c</text>
  <text x="318" y="303" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="430" y="303" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">补全末组 ans += (3−1)%3 = 2</text>
  <text x="552" y="303" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- final answer -->
  <rect x="40" y="324" width="540" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="310" y="346" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最终 ans = 6 → 目标串 "abcabcabc"，3 组 abc 各补 2 个字符</text>

  <!-- legend -->
  <rect x="40" y="374" width="16" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="62" y="386" font-size="10" fill="#555" filter="url(#rough2)">匹配步（吃掉 word 字符，i 前进）</text>
  <rect x="250" y="374" width="16" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="272" y="386" font-size="10" fill="#555" filter="url(#rough2)">插入步（补一个字符，i 不动）</text>
  <rect x="440" y="374" width="16" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="462" y="386" font-size="10" fill="#555" filter="url(#rough2)">补全末组</text>

  <text x="310" y="412" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j 在 0/1/2 循环表示当前缺 a/b/c；i 到尾后仍需把当前 abc 组补满到 j=0</text>
</svg>
