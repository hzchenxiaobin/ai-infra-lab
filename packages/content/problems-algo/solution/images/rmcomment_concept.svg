<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="390" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">删除注释：两种注释风格与状态机</text>

  <!-- Legend -->
  <rect x="30" y="40" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="50" y="52" font-size="11" fill="#666">保留代码</text>
  <rect x="120" y="40" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="140" y="52" font-size="11" fill="#666">注释(删除)</text>

  <!-- Line comment example -->
  <text x="30" y="82" font-size="12" fill="#444" font-weight="bold">行注释 //</text>
  <rect x="30" y="92" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="38" y="110" font-size="11" fill="#333">int a = 1;</text>
  <rect x="184" y="92" width="130" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="110" font-size="11" fill="#b85450">// comment</text>
  <line x1="186" y1="96" x2="312" y2="114" stroke="#b85450" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="330" y="110" font-size="11" fill="#888">// 后整行删除</text>

  <!-- Block comment example (same line) -->
  <text x="30" y="142" font-size="12" fill="#444" font-weight="bold">块注释 /* ... */（同行）</text>
  <rect x="30" y="152" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="36" y="170" font-size="11" fill="#333">int b =</text>
  <rect x="94" y="152" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="170" font-size="11" fill="#b85450">/* x */</text>
  <rect x="158" y="152" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="170" font-size="11" fill="#333"> 2;</text>
  <text x="210" y="170" font-size="11" fill="#888">→ int b =  2;</text>

  <!-- Block comment example (cross line) -->
  <text x="30" y="202" font-size="12" fill="#444" font-weight="bold">块注释 /* ... */（跨行）</text>
  <rect x="30" y="212" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="36" y="229" font-size="11" fill="#333">a = 1;</text>
  <rect x="104" y="212" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="229" font-size="11" fill="#b85450">/* start</text>
  <rect x="30" y="240" width="174" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="36" y="257" font-size="11" fill="#b85450">  middle */</text>
  <rect x="208" y="240" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="257" font-size="11" fill="#333"> b;</text>
  <text x="260" y="229" font-size="11" fill="#888">换行也被吞</text>
  <text x="260" y="257" font-size="11" fill="#888">→ a = 1; b;</text>

  <!-- State machine -->
  <text x="30" y="292" font-size="12" fill="#444" font-weight="bold">状态机：一个布尔标志 in_block 贯穿所有行</text>

  <!-- Normal state -->
  <rect x="50" y="305" width="140" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="120" y="328" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">正常代码</text>
  <text x="120" y="344" text-anchor="middle" font-size="10" fill="#888">in_block = false</text>

  <!-- Block state -->
  <rect x="370" y="305" width="140" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="440" y="328" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">块注释内</text>
  <text x="440" y="344" text-anchor="middle" font-size="10" fill="#888">in_block = true</text>

  <!-- Arrow: normal -> block (/*) -->
  <path d="M 190 323 L 365 323" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="316" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">遇 /*</text>

  <!-- Arrow: block -> normal (*/) -->
  <path d="M 365 340 L 195 340" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="356" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">遇 */</text>

  <!-- // note -->
  <rect x="50" y="365" width="460" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="379" text-anchor="middle" font-size="11" fill="#444">正常代码中遇 // → 跳过本行剩余（不切状态，行内生效）</text>
</svg>
