<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例演算：date = "2080-02-29"</text>
  <text x="137" y="48" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">year = 2080 短除法（÷2 取余）</text>

  <!-- 表头 -->
  <rect x="40" y="56" width="105" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="92" y="69" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">num</text>
  <rect x="145" y="56" width="90" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="190" y="69" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">余 num%2</text>

  <!-- 12 行短除法 -->
  <rect x="40" y="74" width="105" height="17" rx="2" fill="#ffffff" stroke="#99a8b8" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="92" y="86" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2080</text>
  <rect x="145" y="74" width="90" height="17" rx="2" fill="#ffffff" stroke="#99a8b8" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="190" y="86" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>

  <rect x="40" y="91" width="105" height="17" rx="2" fill="#f7f9fb" stroke="#99a8b8" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="92" y="103" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1040</text>
  <rect x="145" y="91" width="90" height="17" rx="2" fill="#f7f9fb" stroke="#99a8b8" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="190" y="103" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>

  <rect x="40" y="108" width="105" height="17" rx="2" fill="#ffffff" stroke="#99a8b8" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="92" y="120" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">520</text>
  <rect x="145" y="108" width="90" height="17" rx="2" fill="#ffffff" stroke="#99a8b8" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="190" y="120" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>

  <rect x="40" y="125" width="105" height="17" rx="2" fill="#f7f9fb" stroke="#99a8b8" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="92" y="137" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">260</text>
  <rect x="145" y="125" width="90" height="17" rx="2" fill="#f7f9fb" stroke="#99a8b8" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="190" y="137" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>

  <rect x="40" y="142" width="105" height="17" rx="2" fill="#ffffff" stroke="#99a8b8" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="92" y="154" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">130</text>
  <rect x="145" y="142" width="90" height="17" rx="2" fill="#ffffff" stroke="#99a8b8" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="190" y="154" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>

  <rect x="40" y="159" width="105" height="17" rx="2" fill="#f7f9fb" stroke="#99a8b8" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="92" y="171" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">65</text>
  <rect x="145" y="159" width="90" height="17" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="171" text-anchor="middle" font-size="10" font-weight="bold" fill="#a06a10" filter="url(#rough2)">1</text>

  <rect x="40" y="176" width="105" height="17" rx="2" fill="#ffffff" stroke="#99a8b8" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="92" y="188" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">32</text>
  <rect x="145" y="176" width="90" height="17" rx="2" fill="#ffffff" stroke="#99a8b8" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="190" y="188" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>

  <rect x="40" y="193" width="105" height="17" rx="2" fill="#f7f9fb" stroke="#99a8b8" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="92" y="205" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">16</text>
  <rect x="145" y="193" width="90" height="17" rx="2" fill="#f7f9fb" stroke="#99a8b8" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="190" y="205" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>

  <rect x="40" y="210" width="105" height="17" rx="2" fill="#ffffff" stroke="#99a8b8" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="92" y="222" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">8</text>
  <rect x="145" y="210" width="90" height="17" rx="2" fill="#ffffff" stroke="#99a8b8" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="190" y="222" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>

  <rect x="40" y="227" width="105" height="17" rx="2" fill="#f7f9fb" stroke="#99a8b8" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="92" y="239" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <rect x="145" y="227" width="90" height="17" rx="2" fill="#f7f9fb" stroke="#99a8b8" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="190" y="239" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>

  <rect x="40" y="244" width="105" height="17" rx="2" fill="#ffffff" stroke="#99a8b8" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="92" y="256" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <rect x="145" y="244" width="90" height="17" rx="2" fill="#ffffff" stroke="#99a8b8" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="190" y="256" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>

  <rect x="40" y="261" width="105" height="17" rx="2" fill="#f7f9fb" stroke="#99a8b8" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="92" y="273" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="145" y="261" width="90" height="17" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="273" text-anchor="middle" font-size="10" font-weight="bold" fill="#a06a10" filter="url(#rough2)">1</text>

  <!-- 逆序读方向 -->
  <path d="M243,272 L243,94" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="243" y="290" text-anchor="middle" font-size="9" fill="#a06a10" filter="url(#rough2)">从下往上读</text>

  <!-- 年份结果 -->
  <path d="M137,280 L137,290" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <rect x="40" y="292" width="195" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="137" y="311" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2080 → 100000100000</text>

  <text x="137" y="344" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">第 12 轮 num=1：余 1，正是最高位</text>

  <!-- 右列：三段与拼接 -->
  <rect x="300" y="56" width="195" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="397" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">year：2080 → 100000100000</text>
  <text x="397" y="92" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2¹¹ + 2⁵ = 2048 + 32（左表）</text>

  <path d="M397,100 L397,112" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="300" y="114" width="195" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="397" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">month：02 → 10</text>
  <text x="397" y="145" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2 = 2¹（"02" 的前导 0 已消失）</text>

  <path d="M397,150 L397,162" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="300" y="164" width="195" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="397" y="181" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">day：29 → 11101</text>
  <text x="397" y="195" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">16 + 8 + 4 + 1 = 29</text>

  <path d="M397,200 L397,212" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="300" y="214" width="195" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="397" y="232" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">"-" 拼接</text>
  <text x="397" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">100000100000-10-11101</text>

  <rect x="300" y="276" width="195" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="397" y="296" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">三段位数：12 / 2 / 5</text>
  <text x="397" y="314" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">最高位都是 1</text>
  <text x="397" y="328" text-anchor="middle" font-size="10" font-weight="bold" fill="#a06a10" filter="url(#rough2)">→ 天然无前导零 ✓</text>
</svg>
