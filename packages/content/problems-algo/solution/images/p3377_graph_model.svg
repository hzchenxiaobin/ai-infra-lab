<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">把「数值变化过程」看成一个带权有向图</text>
  <text x="260" y="52" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">点 = 非质数值 · 边 = 一次数位 ±1 · 边权 = 走入的新值 y</text>

  <!-- start node 10 -->
  <rect x="50" y="162" width="46" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="73" y="185" text-anchor="middle" font-size="15" fill="#2a4a1e" filter="url(#rough2)">10</text>
  <text x="73" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">起点 n</text>

  <!-- 20 21 22 -->
  <rect x="162" y="94" width="46" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="185" y="117" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">20</text>
  <rect x="277" y="94" width="46" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="117" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">21</text>
  <rect x="392" y="94" width="46" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="415" y="117" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">22</text>

  <!-- target node 12 -->
  <rect x="392" y="232" width="46" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="415" y="255" text-anchor="middle" font-size="15" fill="#8a6a1a" filter="url(#rough2)">12</text>
  <text x="415" y="286" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">终点 m</text>

  <!-- prime nodes 11 / 9 (forbidden) -->
  <rect x="162" y="244" width="46" height="36" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="185" y="267" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">11</text>
  <text x="185" y="296" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗ 质数禁入</text>
  <rect x="50" y="300" width="46" height="36" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="73" y="323" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">9</text>
  <text x="73" y="352" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗ 质数禁入</text>

  <!-- edges -->
  <path d="M96,168 Q135,150 163,124" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="140" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">+10</text>
  <path d="M208,112 L276,112" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="242" y="104" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">+1</text>
  <path d="M323,112 L391,112" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="357" y="104" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">+1</text>
  <path d="M415,130 L415,231" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="441" y="185" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">−10</text>

  <!-- forbidden edges -->
  <path d="M86,198 Q130,222 161,246" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="128" y="228" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>
  <path d="M70,198 Q64,250 71,299" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="90" y="255" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- bottom note -->
  <rect x="120" y="318" width="330" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285" y="336" text-anchor="middle" font-size="12" fill="#2a4a1e" filter="url(#rough2)">dis[n] = n（初始值计入）</text>
  <text x="285" y="354" text-anchor="middle" font-size="12" fill="#2a4a1e" filter="url(#rough2)">每走一步再累加新值 y ⟹ 最小总代价 = 最短路</text>
</svg>
