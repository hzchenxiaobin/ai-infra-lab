<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：总长固定 ⇒ 字典序最大即数值最大</text>
  <text x="260" y="37" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">片段形如 1ᵃ0ᵇ；交换论证：A 在 B 前 ⇔ A+B ≥ B+A（字典序）</text>

  <!-- ① 交换论证 -->
  <text x="30" y="64" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 交换论证：都含 0 时，1 多的在前</text>
  <text x="340" y="64" font-size="9" fill="#777" filter="url(#rough2)">蓝 = A = 1³0² ，绿 = B = 1²0¹</text>

  <!-- row 1: A+B -->
  <text x="30" y="94" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">A+B：</text>
  <rect x="95" y="76" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="108" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="121" y="76" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="147" y="76" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="173" y="76" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="186" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="199" y="76" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="212" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="225" y="76" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="238" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="251" y="76" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="264" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="277" y="76" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="315" y="94" font-size="10" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">= 11100110 → 230 ✓ 更大</text>

  <!-- row 2: B+A -->
  <text x="30" y="140" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">B+A：</text>
  <rect x="95" y="122" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="108" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="121" y="122" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="147" y="122" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="173" y="122" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="186" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="199" y="122" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="212" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="225" y="122" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="238" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="251" y="122" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="264" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="277" y="122" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="315" y="140" font-size="10" fill="#777" filter="url(#rough2)">= 11011100 → 220</text>

  <!-- highlight cell 2 on both rows -->
  <rect x="147" y="76" width="26" height="26" rx="4" fill="none" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="147" y="122" width="26" height="26" rx="4" fill="none" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>

  <text x="260" y="170" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">红框 = 第 2 位（= c）：上排是 1、下排是 0 ⟹ A+B 胜，A 在前（a = 3 &gt; c = 2）</text>

  <!-- ② 三层排序键 -->
  <text x="30" y="198" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 三层排序键（贪心核心）</text>
  <rect x="25" y="206" width="470" height="84" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="230" font-size="10" fill="#333" filter="url(#rough2)">第 1 层：b = 0（全 1 片段）无条件最先 —— 前导 1 游程拉满到 Σaᵢ</text>
  <text x="40" y="252" font-size="10" fill="#333" filter="url(#rough2)">第 2 层：其余片段按 a（1 的个数）降序 —— a 多者高位先见 1</text>
  <text x="40" y="274" font-size="10" fill="#333" filter="url(#rough2)">第 3 层：a 相同时按 b（0 的个数）升序 —— 0 少者更早迎来下一个 1</text>

  <!-- ③ 反例 -->
  <text x="30" y="310" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">③ 反例：只按「1 的个数」降序会翻车</text>
  <rect x="25" y="318" width="470" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="340" font-size="10" fill="#333" filter="url(#rough2)">A = "11100000"（a=3，含 0） vs B = "11"（a=2，全 1）</text>
  <text x="40" y="362" font-size="10" fill="#333" filter="url(#rough2)">A 前 → 1110000011 = 899 ✗ ； B 前 → 1111100000 = 992 ✓</text>
  <text x="40" y="382" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">全 1 片段哪怕 1 的个数更少，也要「插队」到最前面！</text>
</svg>
