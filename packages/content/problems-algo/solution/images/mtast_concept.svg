<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="30" y="34" font-size="13" fill="#b85450" filter="url(#rough2)">两个预算约束（二维费用）：</text>
  <rect x="30" y="46" width="150" height="18" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="59" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">总花销 ≤ maxAmount（钱）</text>
  <rect x="30" y="70" width="150" height="18" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="83" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">用券数 ≤ maxCoupons（券）</text>

  <rect x="40" y="150" width="120" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="176" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">水果 i</text>
  <text x="100" y="196" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">价格 p · 口味 t</text>

  <rect x="230" y="44" width="260" height="44" rx="6" fill="#f1f3f5" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="245" y="71" font-size="12" fill="#333" filter="url(#rough2)">① 跳过：付 0、花 0 券，+0</text>

  <rect x="230" y="160" width="260" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="245" y="187" font-size="12" fill="#333" filter="url(#rough2)">② 原价买：付 p、花 0 券，+t</text>

  <rect x="230" y="276" width="260" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="245" y="303" font-size="12" fill="#333" filter="url(#rough2)">③ 优惠券买：付 ⌊p/2⌋、花 1 券，+t</text>

  <path d="M160,166 C195,120 200,82 230,66" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M160,182 L230,182" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M160,198 C195,246 200,290 230,298" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>

  <text x="120" y="282" font-size="11" fill="#888" filter="url(#rough2)">三选一（互斥）</text>
</svg>
