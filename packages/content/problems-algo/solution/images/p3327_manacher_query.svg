<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">Manacher 预处理一次，n 个区间回文查询每次 O(1)</text>

  <!-- T 格子 -->
  <rect x="100" y="44" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="140" y="44" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="44" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="220" y="44" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="260" y="44" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="300" y="44" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="65" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="160" y="65" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="200" y="65" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="240" y="65" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="280" y="65" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="320" y="65" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="120" y="88" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">0</text>
  <text x="160" y="88" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">1</text>
  <text x="200" y="88" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">2</text>
  <text x="240" y="88" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">3</text>
  <text x="280" y="88" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">4</text>
  <text x="320" y="88" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">5</text>
  <text x="88" y="65" font-size="10" fill="#888" filter="url(#rough2)">T＝</text>

  <!-- d2 行（偶回文半径，中心在缝隙） -->
  <circle cx="140" cy="112" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="140" y="116" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">0</text>
  <circle cx="180" cy="112" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="180" y="116" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">0</text>
  <circle cx="220" cy="112" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="220" y="116" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="260" cy="112" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260" y="116" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">0</text>
  <circle cx="300" cy="112" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="116" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">0</text>
  <text x="362" y="108" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">d2[i]＝偶回文半径</text>
  <text x="362" y="123" font-size="8.5" fill="#7a5a20" filter="url(#rough2)">（中心落在 i−1 与 i 的缝隙）</text>

  <!-- d1 行（奇回文半径，以 i 为中心） -->
  <rect x="106" y="132" width="28" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="120" y="145" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="146" y="132" width="28" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="160" y="145" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">2</text>
  <rect x="186" y="132" width="28" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="200" y="145" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="226" y="132" width="28" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="240" y="145" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="266" y="132" width="28" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="145" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">2</text>
  <rect x="306" y="132" width="28" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="320" y="145" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="362" y="138" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">d1[i]＝奇回文半径</text>
  <text x="362" y="153" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">（以 i 为中心，半径＝d1[i]）</text>

  <text x="36" y="185" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">三个代表性查询：</text>

  <!-- 查询 1：子树(1) [0,2] 奇 -->
  <rect x="36" y="198" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="198" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="84" y="198" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="108" y="198" width="24" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="132" y="198" width="24" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="156" y="198" width="24" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="48" y="213" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">a</text>
  <text x="72" y="213" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">b</text>
  <text x="96" y="213" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">a</text>
  <text x="120" y="213" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">a</text>
  <text x="144" y="213" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">b</text>
  <text x="168" y="213" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">a</text>
  <circle cx="72" cy="228" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="196" y="208" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">子树(1)：区间 [0,2]，m＝3（奇）</text>
  <text x="196" y="222" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">中心 c＝1 → 2·d1[1]−1＝3 ≥ 3 → ✓ 回文</text>

  <!-- 查询 2：子树(2) [3,4] 偶 -->
  <rect x="36" y="252" width="24" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="252" width="24" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="84" y="252" width="24" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="108" y="252" width="24" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="132" y="252" width="24" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="156" y="252" width="24" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="48" y="267" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">a</text>
  <text x="72" y="267" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">b</text>
  <text x="96" y="267" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">a</text>
  <text x="120" y="267" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">a</text>
  <text x="144" y="267" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">b</text>
  <text x="168" y="267" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">a</text>
  <circle cx="132" cy="282" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="196" y="262" font-size="9.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">子树(2)：区间 [3,4]，m＝2（偶）</text>
  <text x="196" y="276" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">中心在 3|4 → 2·d2[4]＝0 ＜ 1 → ✗ 非回文</text>

  <!-- 查询 3：子树(0) [0,5] 偶 -->
  <rect x="36" y="306" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="306" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="84" y="306" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="108" y="306" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="132" y="306" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="156" y="306" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="48" y="321" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">a</text>
  <text x="72" y="321" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">b</text>
  <text x="96" y="321" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">a</text>
  <text x="120" y="321" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">a</text>
  <text x="144" y="321" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">b</text>
  <text x="168" y="321" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">a</text>
  <circle cx="108" cy="336" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="196" y="316" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">子树(0)：区间 [0,5]，m＝6（偶）</text>
  <text x="196" y="330" font-size="9.5" fill="#33506b" filter="url(#rough2)">中心在 2|3 → 2·d2[3]＝6 ≥ 6 → ✓ 回文</text>

  <!-- 底部结论 -->
  <rect x="36" y="352" width="448" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="368" text-anchor="middle" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">查询口诀：奇长看 d1[(l+r)/2]，偶长看 d2[l+m/2]</text>
  <text x="260" y="382" text-anchor="middle" font-size="9" fill="#7a5a20" filter="url(#rough2)">只要半径盖住半长（2·d1−1 ≥ m 或 2·d2 ≥ m），区间就是回文</text>
</svg>
