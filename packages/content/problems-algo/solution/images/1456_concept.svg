<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：定长窗口滑动，仅出入两端影响元音计数</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">s = "abciiidef"，k = 3，元音 = a/e/i/o/u</text>

  <!-- ===== Window snapshot: window at [3,5] = "iii", count=3 (max) ===== -->
  <text x="60" y="78" font-size="12" fill="#333" font-weight="bold">窗口滑动到 [3..5] = "iii"，元音数 = 3（最大值）</text>

  <!-- char boxes: 8 chars, each 50 wide, starting x=70 -->
  <!-- indices:    0:a  1:b  2:c  3:i  4:i  5:i  6:d  7:e  8:f  (wait 9 chars) -->
  <!-- s = "abciiidef" = a b c i i i d e f -> 9 chars -->
  <!-- use 9 boxes, width 46 each, start x=70, gap 0 -->

  <!-- index labels -->
  <text x="93" y="100" text-anchor="middle" font-size="9.5" fill="#888">0</text>
  <text x="139" y="100" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <text x="185" y="100" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <text x="231" y="100" text-anchor="middle" font-size="9.5" fill="#888">3</text>
  <text x="277" y="100" text-anchor="middle" font-size="9.5" fill="#888">4</text>
  <text x="323" y="100" text-anchor="middle" font-size="9.5" fill="#888">5</text>
  <text x="369" y="100" text-anchor="middle" font-size="9.5" fill="#888">6</text>
  <text x="415" y="100" text-anchor="middle" font-size="9.5" fill="#888">7</text>
  <text x="461" y="100" text-anchor="middle" font-size="9.5" fill="#888">8</text>

  <!-- char 0: a (vowel, but outside window) -> light blue -->
  <rect x="70" y="108" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="93" y="134" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">a</text>
  <!-- char 1: b (consonant, outside) -->
  <rect x="116" y="108" width="46" height="40" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="139" y="134" text-anchor="middle" font-size="16" fill="#777" font-weight="bold">b</text>
  <!-- char 2: c (consonant, outside) -->
  <rect x="162" y="108" width="46" height="40" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="185" y="134" text-anchor="middle" font-size="16" fill="#777" font-weight="bold">c</text>
  <!-- char 3: i (vowel, IN window) -> green highlight -->
  <rect x="208" y="108" width="46" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="231" y="134" text-anchor="middle" font-size="16" fill="#2a5a1a" font-weight="bold">i</text>
  <!-- char 4: i (vowel, IN window) -->
  <rect x="254" y="108" width="46" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="277" y="134" text-anchor="middle" font-size="16" fill="#2a5a1a" font-weight="bold">i</text>
  <!-- char 5: i (vowel, IN window) -->
  <rect x="300" y="108" width="46" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="323" y="134" text-anchor="middle" font-size="16" fill="#2a5a1a" font-weight="bold">i</text>
  <!-- char 6: d (consonant, outside) -->
  <rect x="346" y="108" width="46" height="40" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="369" y="134" text-anchor="middle" font-size="16" fill="#777" font-weight="bold">d</text>
  <!-- char 7: e (vowel, outside) -> light blue -->
  <rect x="392" y="108" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="415" y="134" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">e</text>
  <!-- char 8: f (consonant, outside) -->
  <rect x="438" y="108" width="46" height="40" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="461" y="134" text-anchor="middle" font-size="16" fill="#777" font-weight="bold">f</text>

  <!-- window bracket: covers [3,5] -> x=208 to 346 -->
  <path d="M 208 160 L 208 168 L 346 168 L 346 160" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <rect x="252" y="170" width="50" height="22" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="277" y="185" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">窗口 k=3</text>

  <!-- ===== Slide transition: show out-left / in-right ===== -->
  <text x="60" y="222" font-size="12" fill="#333" font-weight="bold">窗口右移一格：左端 s[left] 出、右端 s[right] 入 → 仅按两端是否元音增减</text>

  <!-- "previous" window [2,4] = "cii", count=2 -->
  <text x="60" y="246" font-size="10.5" fill="#888">前窗 [2..4] = "cii"（count=2）</text>
  <!-- boxes small: indices 2,3,4 -->
  <rect x="120" y="252" width="40" height="34" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="140" y="274" text-anchor="middle" font-size="14" fill="#777" font-weight="bold">c</text>
  <rect x="160" y="252" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="274" text-anchor="middle" font-size="14" fill="#2a5a1a" font-weight="bold">i</text>
  <rect x="200" y="252" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="274" text-anchor="middle" font-size="14" fill="#2a5a1a" font-weight="bold">i</text>

  <!-- arrow right -->
  <path d="M 256 269 L 296 269" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- "current" window [3,5] = "iii", count=3 -->
  <text x="300" y="246" font-size="10.5" fill="#888">现窗 [3..5] = "iii"（count=3）</text>
  <rect x="300" y="252" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="320" y="274" text-anchor="middle" font-size="14" fill="#2a5a1a" font-weight="bold">i</text>
  <rect x="340" y="252" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="360" y="274" text-anchor="middle" font-size="14" fill="#2a5a1a" font-weight="bold">i</text>
  <rect x="380" y="252" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="400" y="274" text-anchor="middle" font-size="14" fill="#2a5a1a" font-weight="bold">i</text>

  <!-- out / in annotations -->
  <text x="140" y="300" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">c 出（非元音，count 不变）</text>
  <text x="400" y="300" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">i 入（元音，count +1）</text>

  <!-- ===== Key insight box ===== -->
  <rect x="40" y="320" width="540" height="86" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="344" font-size="11.5" fill="#555" font-weight="bold">关键：定长窗口每次右移一格，中间 k−1 个字符不变，只有两端的「出」与「入」会改变元音数。</text>
  <text x="60" y="364" font-size="11" fill="#888">• 若 s[right]  是元音 → count++      • 若 s[right−k]  是元音 → count−−</text>
  <text x="60" y="384" font-size="11" fill="#888">• 每步 O(1) 增量更新，无需重新扫描整个窗口 → 总复杂度 O(n)</text>
  <text x="60" y="400" font-size="11" fill="#888">• 元音判定用哈希集合 / 位掩码（a/e/i/o/u）O(1) 完成</text>
</svg>
