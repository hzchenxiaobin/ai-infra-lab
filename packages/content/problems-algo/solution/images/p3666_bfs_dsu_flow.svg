<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="17" fill="#333"
        filter="url(#rough2)">算法流程：区间 BFS ＋ 并查集跳表（近 O(n)）</text>

  <!-- ① 统计 z0 -->
  <rect x="36" y="44" width="230" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="151" y="69" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">① 统计 z0 = '0' 的个数</text>

  <path d="M 151 84 L 151 96" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 z0=0 -->
  <polygon points="96,126 151,98 206,126 151,154" fill="#fafafa" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="151" y="131" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">z0 = 0 ?</text>

  <path d="M 206 126 L 296 126" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="242" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="300" y="108" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="350" y="131" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 0</text>
  <text x="350" y="160" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">本来就全 1</text>

  <path d="M 151 154 L 151 168" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="165" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- ② 入队 -->
  <rect x="36" y="170" width="230" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="151" y="195" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② z0 入队，parent[z0] = z0+2</text>

  <path d="M 151 210 L 151 222" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 取队首 -->
  <rect x="36" y="224" width="230" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="151" y="245" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 取队首 z（d = dist[z]）</text>
  <text x="151" y="263" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">队列已空 ⇒ 返回 −1</text>

  <path d="M 151 272 L 151 284" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ 算区间 -->
  <rect x="36" y="286" width="230" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="151" y="307" text-anchor="middle" font-size="12" fill="#b3541e" font-weight="bold" filter="url(#rough2)">④ L = |z−k|，R = min(z+k, 2n−k−z)</text>
  <text x="151" y="327" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">v = find(L)＝首个未访问同奇偶点</text>

  <path d="M 151 338 L 151 350" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 v<=R -->
  <polygon points="96,378 151,350 206,378 151,406" fill="#fafafa" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="151" y="383" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">v ≤ R ?</text>

  <path d="M 151 406 L 151 420" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="417" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- ⑤ 访问 v -->
  <rect x="36" y="422" width="230" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="151" y="447" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑤ 访问 v：dist[v]=d+1，入队</text>

  <!-- v==0 返回 -->
  <path d="M 266 442 L 296 442" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="300" y="424" width="130" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="365" y="441" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">v = 0 ?</text>
  <text x="365" y="458" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">是 ⇒ 返回 d+1</text>

  <!-- 区间耗尽回环：回到 ③ -->
  <path d="M 206 378 L 285 378 L 285 248 L 270 248" stroke="#b85450" stroke-width="1.4" stroke-dasharray="6 4" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="240" y="370" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">v &gt; R</text>
  <text x="300" y="220" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">换下一个 z</text>

  <!-- v=find(v+2) 回环：回到 ④判断 -->
  <path d="M 266 428 Q 292 396 214 382" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="404" font-size="11" fill="#446688" filter="url(#rough2)">v = find(v+2)</text>

  <!-- 并查集跳表注释框 -->
  <rect x="310" y="170" width="220" height="130" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="324" y="192" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">并查集跳表（核心加速）</text>
  <text x="324" y="214" font-size="12" fill="#446688" filter="url(#rough2)">parent[v] = v ⇒ v 未访问</text>
  <text x="324" y="234" font-size="12" fill="#446688" filter="url(#rough2)">访问后 parent[v] = v + 2</text>
  <text x="324" y="254" font-size="12" fill="#446688" filter="url(#rough2)">find(L)＝≥L 的首个未访问点</text>
  <text x="324" y="274" font-size="12" fill="#446688" filter="url(#rough2)">+2 步长 ⇒ 奇偶天然保住</text>
  <text x="324" y="292" font-size="11" fill="#888" filter="url(#rough2)">每点只弹出一次 ⇒ 近 O(n)</text>
</svg>
