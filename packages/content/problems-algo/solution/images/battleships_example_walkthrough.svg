<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：行优先扫描，逐个 X 判定是否为「头」</text>

  <!-- ===== Grid ===== -->
  <!-- Column labels -->
  <text x="95" y="52" text-anchor="middle" font-size="9.5" fill="#aaa">j=0</text>
  <text x="145" y="52" text-anchor="middle" font-size="9.5" fill="#aaa">j=1</text>
  <text x="195" y="52" text-anchor="middle" font-size="9.5" fill="#aaa">j=2</text>
  <text x="245" y="52" text-anchor="middle" font-size="9.5" fill="#aaa">j=3</text>
  <!-- Row labels -->
  <text x="58" y="90" text-anchor="middle" font-size="9.5" fill="#aaa">i=0</text>
  <text x="58" y="140" text-anchor="middle" font-size="9.5" fill="#aaa">i=1</text>
  <text x="58" y="190" text-anchor="middle" font-size="9.5" fill="#aaa">i=2</text>

  <!-- Row 0 -->
  <rect x="70" y="70" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="104" text-anchor="middle" font-size="20" fill="#4a7a3a" font-weight="bold">X</text>
  <text x="114" y="80" text-anchor="end" font-size="8.5" fill="#4a7a3a" font-weight="bold">①</text>

  <rect x="120" y="70" width="50" height="50" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="104" text-anchor="middle" font-size="18" fill="#ccc">.</text>
  <text x="164" y="80" text-anchor="end" font-size="8.5" fill="#bbb">②</text>

  <rect x="170" y="70" width="50" height="50" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="104" text-anchor="middle" font-size="18" fill="#ccc">.</text>
  <text x="214" y="80" text-anchor="end" font-size="8.5" fill="#bbb">③</text>

  <rect x="220" y="70" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="104" text-anchor="middle" font-size="20" fill="#4a7a3a" font-weight="bold">X</text>
  <text x="264" y="80" text-anchor="end" font-size="8.5" fill="#4a7a3a" font-weight="bold">④</text>

  <!-- Row 1 -->
  <rect x="70" y="120" width="50" height="50" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="154" text-anchor="middle" font-size="18" fill="#ccc">.</text>
  <text x="114" y="130" text-anchor="end" font-size="8.5" fill="#bbb">⑤</text>

  <rect x="120" y="120" width="50" height="50" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="154" text-anchor="middle" font-size="18" fill="#ccc">.</text>
  <text x="164" y="130" text-anchor="end" font-size="8.5" fill="#bbb">⑥</text>

  <rect x="170" y="120" width="50" height="50" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="154" text-anchor="middle" font-size="18" fill="#ccc">.</text>
  <text x="214" y="130" text-anchor="end" font-size="8.5" fill="#bbb">⑦</text>

  <rect x="220" y="120" width="50" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="245" y="154" text-anchor="middle" font-size="20" fill="#b85450">X</text>
  <text x="264" y="130" text-anchor="end" font-size="8.5" fill="#b85450" font-weight="bold">⑧</text>

  <!-- Row 2 -->
  <rect x="70" y="170" width="50" height="50" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="204" text-anchor="middle" font-size="18" fill="#ccc">.</text>
  <text x="114" y="180" text-anchor="end" font-size="8.5" fill="#bbb">⑨</text>

  <rect x="120" y="170" width="50" height="50" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="204" text-anchor="middle" font-size="18" fill="#ccc">.</text>
  <text x="164" y="180" text-anchor="end" font-size="8.5" fill="#bbb">⑩</text>

  <rect x="170" y="170" width="50" height="50" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="204" text-anchor="middle" font-size="18" fill="#ccc">.</text>
  <text x="214" y="180" text-anchor="end" font-size="8.5" fill="#bbb">⑪</text>

  <rect x="220" y="170" width="50" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="245" y="204" text-anchor="middle" font-size="20" fill="#b85450">X</text>
  <text x="264" y="180" text-anchor="end" font-size="8.5" fill="#b85450" font-weight="bold">⑫</text>

  <!-- scan direction arrow -->
  <path d="M 70 235 L 270 235" stroke="#888" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="248" text-anchor="middle" font-size="10" fill="#888">行优先扫描方向 →</text>

  <!-- ===== Callout boxes on right ===== -->
  <!-- Callout 1: (0,0) -->
  <path d="M 120 95 Q 200 95 300 80" stroke="#4a7a3a" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="300" y="60" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="312" y="78" font-size="10.5" fill="#4a7a3a" font-weight="bold">① (0,0) X</text>
  <text x="312" y="94" font-size="10" fill="#555">i=0 上无X ✓, j=0 左无X ✓ → 头</text>
  <text x="530" y="78" text-anchor="end" font-size="10.5" fill="#4a7a3a" font-weight="bold">count=1</text>

  <!-- Callout 2: (0,3) -->
  <path d="M 270 95 Q 290 110 300 118" stroke="#4a7a3a" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="300" y="118" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="312" y="136" font-size="10.5" fill="#4a7a3a" font-weight="bold">④ (0,3) X</text>
  <text x="312" y="152" font-size="10" fill="#555">i=0 上无X ✓, 左[0][2]=. 无X ✓ → 头</text>
  <text x="530" y="136" text-anchor="end" font-size="10.5" fill="#4a7a3a" font-weight="bold">count=2</text>

  <!-- Callout 3: (1,3) -->
  <path d="M 270 145 L 300 176" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="300" y="176" width="240" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="312" y="194" font-size="10.5" fill="#b85450" font-weight="bold">⑧ (1,3) X</text>
  <text x="312" y="210" font-size="10" fill="#555">上方 [0][3]=X ✗ → 续接竖船，跳过</text>
  <text x="530" y="194" text-anchor="end" font-size="10.5" fill="#b85450" font-weight="bold">skip</text>

  <!-- Callout 4: (2,3) -->
  <path d="M 270 195 L 300 234" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="300" y="234" width="240" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="312" y="252" font-size="10.5" fill="#b85450" font-weight="bold">⑫ (2,3) X</text>
  <text x="312" y="268" font-size="10" fill="#555">上方 [1][3]=X ✗ → 续接竖船，跳过</text>
  <text x="530" y="252" text-anchor="end" font-size="10.5" fill="#b85450" font-weight="bold">skip</text>

  <!-- ===== Result ===== -->
  <rect x="70" y="300" width="470" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="305" y="322" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">4 个 X 中：2 个为「头」（绿）→ 计 2 艘；2 个为「续接」（红）→ 不计</text>
  <text x="305" y="340" text-anchor="middle" font-size="11" fill="#666">判定仅看上方 + 左方两格，无需访问 visited、不改 board</text>

  <text x="305" y="380" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">count = 2 ✓</text>

  <!-- legend -->
  <rect x="70" y="398" width="16" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="92" y="409" font-size="10" fill="#555">头（新战舰）</text>
  <rect x="190" y="398" width="16" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="212" y="409" font-size="10" fill="#555">续接（非头）</text>
  <rect x="310" y="398" width="16" height="14" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="332" y="409" font-size="10" fill="#555">空位</text>
  <text x="430" y="409" font-size="9.5" fill="#aaa">右上角数字 = 扫描序号</text>
</svg>
