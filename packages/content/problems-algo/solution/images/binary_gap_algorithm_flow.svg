<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="500" height="460" fill="#fafafa"/>

  <text x="250" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次遍历跟踪上一个 1</text>

  <!-- Start oval -->
  <ellipse cx="250" cy="56" rx="42" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="61" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">开始</text>

  <line x1="250" y1="74" x2="250" y2="86" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init box -->
  <rect x="140" y="90" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="250" y="112" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">pos=0, last=−1, ans=0</text>

  <line x1="250" y1="124" x2="250" y2="136" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: n != 0 ? -->
  <polygon points="250,140 330,180 250,220 170,180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="176" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">n ≠ 0 ?</text>
  <text x="250" y="192" text-anchor="middle" font-size="10" fill="#888">还有位未处理</text>

  <!-- No branch: left to return -->
  <text x="150" y="174" font-size="11" fill="#d6a040" font-weight="bold">否</text>
  <path d="M 170 180 Q 110 180 100 180" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return ans -->
  <rect x="28" y="164" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="63" y="185" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">return ans</text>

  <line x1="63" y1="196" x2="63" y2="210" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End oval -->
  <ellipse cx="63" cy="228" rx="38" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="63" y="233" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结束</text>

  <!-- Yes branch: down -->
  <text x="262" y="234" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="250" y1="220" x2="250" y2="236" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 2: n & 1 ? -->
  <polygon points="250,240 330,276 250,312 170,276" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="273" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">n &amp; 1 ?</text>
  <text x="250" y="288" text-anchor="middle" font-size="10" fill="#888">最低位是 1</text>

  <!-- No branch: right bypass to shift -->
  <text x="338" y="270" font-size="11" fill="#d6a040" font-weight="bold">否</text>
  <path d="M 330 276 L 390 276 L 390 374" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="328" font-size="10" fill="#888">跳过</text>

  <!-- Yes branch: down -->
  <text x="262" y="326" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="250" y1="312" x2="250" y2="324" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Action box: update ans + last -->
  <rect x="110" y="328" width="280" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="250" y="348" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">若 last ≠ −1：ans = max(ans, pos − last)</text>
  <text x="250" y="366" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">last = pos</text>

  <line x1="250" y1="374" x2="250" y2="382" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Shift box -->
  <rect x="150" y="386" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="250" y="408" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">n &gt;&gt;= 1,  pos++</text>

  <!-- loop back to Decision 1 -->
  <path d="M 350 403 L 440 403 L 440 180 L 332 180" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="400" y="280" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="430" y="296" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">回判</text>

  <!-- bottom complexity tag -->
  <rect x="130" y="432" width="240" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="250" y="446" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">时间 O(log n)，空间 O(1)</text>
</svg>
