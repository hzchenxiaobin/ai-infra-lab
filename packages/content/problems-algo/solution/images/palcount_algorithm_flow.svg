<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="30" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">算法流程：区间 DP（按长度枚举 + 端点判定）</text>
  <path d="M 130 40 Q 290 48 450 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- init box -->
  <g filter="url(#rough2)">
    <rect x="210" y="58" width="180" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="300" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">预处理 nextPos / prevPos</text>
  <text x="300" y="90" text-anchor="middle" font-size="10.5" fill="#666">dp[i][i]=1，i&gt;j 时 dp=0</text>
  <path d="M 300 96 L 300 110" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop box -->
  <g filter="url(#rough2)">
    <rect x="210" y="112" width="180" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="300" y="134" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for len=2..n, i=0..n−len, j=i+len−1</text>
  <path d="M 300 146 L 300 162" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision 1: S[i]==S[j]? -->
  <g filter="url(#rough2)">
    <path d="M 300 164 L 376 196 L 300 228 L 224 196 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="300" y="192" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">S[i] == S[j] ?</text>
  <text x="300" y="206" text-anchor="middle" font-size="10.5" fill="#888">（同为字符 c）</text>

  <!-- No branch: left -->
  <path d="M 224 196 L 90 196 L 90 232" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="188" font-size="11" fill="#888" font-weight="bold">否</text>
  <g filter="url(#rough2)">
    <rect x="22" y="234" width="136" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="90" y="254" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">容斥（不匹配）</text>
  <text x="90" y="272" text-anchor="middle" font-size="10.5" fill="#446688">dp[i][j−1]+dp[i+1][j]</text>
  <text x="90" y="288" text-anchor="middle" font-size="10.5" fill="#446688">−dp[i+1][j−1]</text>

  <!-- Yes branch: down -->
  <path d="M 300 228 L 300 246" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="242" font-size="11" fill="#888" font-weight="bold">是</text>
  <g filter="url(#rough2)">
    <rect x="216" y="248" width="168" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="300" y="268" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">low=nextPos[i], high=prevPos[j]</text>

  <!-- decision 2: low vs high -->
  <path d="M 300 278 L 300 296" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <path d="M 300 298 L 392 336 L 300 374 L 208 336 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="300" y="332" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">low ? high</text>
  <text x="300" y="348" text-anchor="middle" font-size="10.5" fill="#888">（内部 c 的个数）</text>

  <!-- three branches -->
  <path d="M 208 336 L 80 336 L 80 376" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="328" font-size="10.5" fill="#d6a040" font-weight="bold">&gt;（无 c）</text>
  <g filter="url(#rough2)">
    <rect x="18" y="378" width="124" height="50" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="80" y="398" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">2·dp[i+1][j−1]</text>
  <text x="80" y="414" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">+ 2</text>

  <path d="M 300 374 L 300 376" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="368" font-size="10.5" fill="#4a7a3a" font-weight="bold">=（恰 1）</text>
  <g filter="url(#rough2)">
    <rect x="238" y="378" width="124" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="300" y="398" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">2·dp[i+1][j−1]</text>
  <text x="300" y="414" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+ 1</text>

  <path d="M 392 336 L 510 336 L 510 376" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="328" font-size="10.5" fill="#b85450" font-weight="bold">&lt;（≥2）</text>
  <g filter="url(#rough2)">
    <rect x="448" y="378" width="124" height="50" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="510" y="396" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2·dp[i+1][j−1]</text>
  <text x="510" y="410" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">−dp[low+1][high−1]</text>

  <!-- merge note -->
  <g filter="url(#rough2)">
    <rect x="170" y="378" width="60" height="22" rx="6" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2"/>
  </g>
  <text x="200" y="393" text-anchor="middle" font-size="10" fill="#888">% MOD</text>
  <text x="200" y="416" text-anchor="middle" font-size="9.5" fill="#888">负数 +MOD</text>

  <text x="290" y="432" text-anchor="middle" font-size="11" fill="#888" font-style="italic">枚举顺序：长度从小到大 ⇒ dp[i+1][j−1] 等更短区间已就绪</text>
</svg>
