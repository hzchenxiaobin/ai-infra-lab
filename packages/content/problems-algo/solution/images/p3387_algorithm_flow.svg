<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 556"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="556" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：建双向图 → 两遍 BFS → 枚举取商</text>
  <text x="260" y="38" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">两个 BFS 源点相同（都是 initialCurrency），复杂度 O(n + m)</text>

  <!-- 开始 -->
  <rect x="215" y="50" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="13" filter="url(#rough2)"/>
  <text x="260" y="67" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 260 76 L 260 88" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B1 建图1 -->
  <rect x="100" y="90" width="320" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="107" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">建图 1：哈希邻接表，每条 pair 加双向边</text>
  <text x="260" y="123" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">(u→v, r) 与 (v→u, 1/r)</text>
  <path d="M 260 132 L 260 144" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B2 BFS1 -->
  <rect x="100" y="146" width="320" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="164" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">BFS₁：d₁[IC] ← 1.0，队列扩展</text>
  <text x="260" y="180" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">邻点 v 未标记 ⇒ d₁[v] ← d₁[u] × r，v 入队</text>
  <text x="260" y="196" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">（森林无环：首次到达即最优，不再更新）</text>
  <path d="M 260 202 L 260 214" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B3 BFS2 -->
  <rect x="100" y="216" width="320" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="233" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">对图 2 同样建边 + BFS₂（源点仍是 IC）得 d₂</text>
  <text x="260" y="249" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">d₂[X] = 第 2 天 1 单位 IC 换到的 X ⇒ 反程倍率 = 1/d₂[X]</text>
  <path d="M 260 258 L 260 270" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B4 枚举初始化 -->
  <rect x="100" y="272" width="320" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">ans ← 1.0（X = IC：两天都不换，保底）；枚举 X ∈ d₁</text>
  <path d="M 260 308 L 260 320" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1 判断 -->
  <polygon points="260,322 344,360 260,398 176,360" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="357" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">X 在 d₂ 中？</text>
  <text x="260" y="372" text-anchor="middle" font-size="8.5" fill="#7a5a10" filter="url(#rough2)">（第 2 天 X 换得回 IC 吗）</text>

  <path d="M 344 360 L 388 360" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="366" y="352" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">是</text>
  <rect x="392" y="340" width="116" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="450" y="355" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">ans ← max(ans,</text>
  <text x="450" y="369" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">d₁[X] / d₂[X])</text>

  <path d="M 260 398 L 260 410" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="408" font-size="9.5" fill="#a07830" filter="url(#rough2)">否</text>

  <!-- D2 枚举完? -->
  <polygon points="260,412 338,444 260,476 182,444" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="441" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">d₁ 枚举完？</text>
  <text x="260" y="455" text-anchor="middle" font-size="8.5" fill="#7a5a10" filter="url(#rough2)">（没完则取下一个 X）</text>

  <!-- 循环回边：更新框 → 右侧 → 回 B4；D2 否 → 汇入回边 -->
  <path d="M 450 380 L 450 444 L 502 444 L 502 290 L 424 290" fill="none" stroke="#888" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrd)" filter="url(#rough2)"/>
  <path d="M 338 444 L 448 444" fill="none" stroke="#888" stroke-width="1.3" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <path d="M 260 476 L 260 490" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="488" font-size="9" fill="#a07830" filter="url(#rough2)">完</text>

  <!-- 返回 -->
  <rect x="200" y="492" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="511" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <rect x="60" y="528" width="400" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="543" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">边数 ≤ 20、答案 ≤ 5×10¹⁰：double 精度足够，无溢出风险</text>
</svg>
