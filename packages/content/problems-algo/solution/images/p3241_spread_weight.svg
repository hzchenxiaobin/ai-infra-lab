<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">标记传播 = 沿路径累加点权</text>

  <rect x="26" y="52" width="200" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="126" y="76" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">奇数节点：w = 1</text>
  <text x="126" y="97" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">邻居 t 拍标记 → 我 t+1 拍标记</text>

  <rect x="26" y="126" width="200" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="126" y="150" text-anchor="middle" font-size="12.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">偶数节点：w = 2</text>
  <text x="126" y="171" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">邻居 t 拍标记 → 我 t+2 拍标记</text>

  <text x="126" y="212" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">进入哪个点，就付哪个点的延迟</text>

  <text x="380" y="56" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">示例 1 的树（0—1、0—2），以 1 为源</text>

  <line x1="302" y1="115" x2="364" y2="115" stroke="#bbb" stroke-width="2" filter="url(#rough2)"/>
  <line x1="400" y1="115" x2="452" y2="115" stroke="#bbb" stroke-width="2" filter="url(#rough2)"/>
  <text x="333" y="98" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">+w(0)=2</text>
  <text x="426" y="98" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">+w(2)=2</text>

  <circle cx="283" cy="115" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="283" y="120" text-anchor="middle" font-size="13" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="283" y="90" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">源 t=0</text>
  <text x="283" y="152" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">t=0</text>

  <circle cx="383" cy="115" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="383" y="120" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="383" y="146" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">偶 w=2</text>
  <text x="383" y="165" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">t=2</text>

  <circle cx="469" cy="115" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="469" y="120" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="469" y="146" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">偶 w=2</text>
  <text x="469" y="165" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">t=4</text>

  <text x="380" y="200" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">times[1] = w(0) + w(2) = 4</text>
  <text x="380" y="222" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">（树上信号只能从已标记的邻居传过来）</text>

  <rect x="45" y="300" width="430" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">t(v) = 路径上除源点外的点权之和</text>
  <text x="260" y="335" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">times[r] = max t(v)，即 r 的加权偏心距</text>
</svg>
