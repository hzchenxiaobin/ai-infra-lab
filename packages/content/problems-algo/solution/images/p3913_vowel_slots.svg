<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：槽位与内容分离——辅音冻结，元音管道重装</text>
  <text x="260" y="36" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">仅元音可动 ⇒ 元音槽位是一条保序管道：倒出多重集 → 按键重排 → 依次装回</text>

  <!-- ===== input string "leetcode" ===== -->
  <text x="55" y="66" font-size="10" fill="#888" filter="url(#rough2)">输入</text>
  <!-- l e e t c o d e : 8 boxes, w=46 gap=6, start x=88 -->
  <rect x="88"  y="50" width="46" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="140" y="50" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="192" y="50" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="244" y="50" width="46" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="296" y="50" width="46" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="348" y="50" width="46" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="400" y="50" width="46" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="452" y="50" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="111" y="71" text-anchor="middle" font-size="14" fill="#777" font-weight="bold" filter="url(#rough2)">l</text>
  <text x="163" y="71" text-anchor="middle" font-size="14" fill="#33507a" font-weight="bold" filter="url(#rough2)">e</text>
  <text x="215" y="71" text-anchor="middle" font-size="14" fill="#33507a" font-weight="bold" filter="url(#rough2)">e</text>
  <text x="267" y="71" text-anchor="middle" font-size="14" fill="#777" font-weight="bold" filter="url(#rough2)">t</text>
  <text x="319" y="71" text-anchor="middle" font-size="14" fill="#777" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="371" y="71" text-anchor="middle" font-size="14" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">o</text>
  <text x="423" y="71" text-anchor="middle" font-size="14" fill="#777" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="475" y="71" text-anchor="middle" font-size="14" fill="#33507a" font-weight="bold" filter="url(#rough2)">e</text>
  <!-- brackets -->
  <path d="M 140 96 L 140 92 L 238 92 L 238 96" fill="none" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="189" y="106" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">元音槽位</text>
  <path d="M 348 96 L 348 92 L 394 92 L 394 96" fill="none" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <path d="M 452 96 L 452 92 L 498 92 L 498 96" fill="none" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="423" y="106" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">槽位</text>
  <text x="55" y="94" font-size="9" fill="#999" filter="url(#rough2)">灰=辅音
冻结</text>

  <!-- ===== arrow: slots -> count panel ===== -->
  <path d="M 160 112 C 130 122 118 128 118 138" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="128" y="126" font-size="8.5" fill="#446688" filter="url(#rough2)">第一遍扫描</text>

  <!-- ===== left panel: count + first ===== -->
  <rect x="32" y="142" width="200" height="104" rx="10" fill="#f5f7fa" stroke="#8aa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="132" y="160" text-anchor="middle" font-size="10.5" fill="#456" font-weight="bold" filter="url(#rough2)">计数 + 首次出现位置</text>
  <rect x="46" y="170" width="172" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="132" y="187" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">e × 3 ，首现 @1</text>
  <rect x="46" y="202" width="172" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="132" y="219" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">o × 1 ，首现 @5</text>
  <text x="132" y="240" text-anchor="middle" font-size="8.5" fill="#789" filter="url(#rough2)">首现互不相同 ⇒ 排序键无平局</text>

  <!-- ===== arrow: count -> sort ===== -->
  <path d="M 236 194 L 268 194" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ===== right panel: sort keys + seq ===== -->
  <rect x="272" y="142" width="216" height="104" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="380" y="160" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">排序键：( 频率↓ ，平局→首现↑ )</text>
  <rect x="288" y="168" width="64" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="184" text-anchor="middle" font-size="10" fill="#33507a" font-weight="bold" filter="url(#rough2)">e (3)</text>
  <text x="360" y="184" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">→</text>
  <rect x="372" y="168" width="64" height="24" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="404" y="184" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">o (1)</text>
  <text x="380" y="206" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">按序展开 ⇒ 目标序列 seq：</text>
  <rect x="300" y="212" width="26" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="330" y="212" width="26" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="360" y="212" width="26" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="390" y="212" width="26" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="313" y="227" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">e</text>
  <text x="343" y="227" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">e</text>
  <text x="373" y="227" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">e</text>
  <text x="403" y="227" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">o</text>
  <text x="424" y="227" font-size="8.5" fill="#a06a66" filter="url(#rough2)">←长度=槽位数</text>

  <!-- ===== arrow: seq -> result (second pass) ===== -->
  <path d="M 380 250 C 380 262 300 266 240 268" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="330" y="264" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">第二遍扫描：按槽位顺序装填</text>

  <!-- ===== result string "leetcedo" ===== -->
  <text x="55" y="298" font-size="10" fill="#888" filter="url(#rough2)">结果</text>
  <rect x="88"  y="282" width="46" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="140" y="282" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="192" y="282" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="244" y="282" width="46" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="296" y="282" width="46" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="348" y="282" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="400" y="282" width="46" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="452" y="282" width="46" height="32" rx="4" fill="#fff8e1" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="111" y="303" text-anchor="middle" font-size="14" fill="#777" font-weight="bold" filter="url(#rough2)">l</text>
  <text x="163" y="303" text-anchor="middle" font-size="14" fill="#33507a" font-weight="bold" filter="url(#rough2)">e</text>
  <text x="215" y="303" text-anchor="middle" font-size="14" fill="#33507a" font-weight="bold" filter="url(#rough2)">e</text>
  <text x="267" y="303" text-anchor="middle" font-size="14" fill="#777" font-weight="bold" filter="url(#rough2)">t</text>
  <text x="319" y="303" text-anchor="middle" font-size="14" fill="#777" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="371" y="303" text-anchor="middle" font-size="14" fill="#33507a" font-weight="bold" filter="url(#rough2)">e</text>
  <text x="423" y="303" text-anchor="middle" font-size="14" fill="#777" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="475" y="303" text-anchor="middle" font-size="14" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">o</text>
  <text x="260" y="328" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">红框 = 被重新装填的槽位；辅音 l、t、c、d 原位未动</text>

  <!-- ===== takeaway ===== -->
  <rect x="30" y="340" width="460" height="50" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="42" y="358" text-anchor="start" font-size="9" fill="#3a4a3a" filter="url(#rough2)">① 辅音槽位冻结 ⇒ 元音槽位是一条保序管道：重排 = 同一多重集换序装填，恰好装满</text>
  <text x="42" y="373" text-anchor="start" font-size="9" fill="#3a4a3a" filter="url(#rough2)">② 排序对象是 ≤ 5 种元音「种类」：键 (频率↓, 首现↑)，与串长 n 无关</text>
  <text x="42" y="386" text-anchor="start" font-size="9" fill="#3a4a3a" filter="url(#rough2)">③ 两遍线性扫描 + 常数级排序 ⇒ O(n) 时间 / O(1) 额外空间</text>
</svg>
