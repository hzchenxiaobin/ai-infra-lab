<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="500" height="430" fill="#fafafa"/>

  <text x="250" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：最低位 DP（O(n) 一趟）</text>

  <!-- Start oval -->
  <ellipse cx="250" cy="60" rx="48" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="65" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">开始</text>

  <line x1="250" y1="80" x2="250" y2="96" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ans[0]=0 -->
  <rect x="170" y="100" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="250" y="122" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">ans[0] = 0  // 边界</text>

  <line x1="250" y1="134" x2="250" y2="150" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i = 1 -->
  <rect x="190" y="154" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="250" y="174" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">i = 1</text>

  <line x1="250" y1="184" x2="250" y2="200" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: i <= n ? -->
  <polygon points="250,204 332,246 250,288 168,246" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="242" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i ≤ n ?</text>
  <text x="250" y="258" text-anchor="middle" font-size="10.5" fill="#888">循环条件</text>

  <!-- Yes branch: down -->
  <text x="262" y="300" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="250" y1="288" x2="250" y2="306" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ans[i] = ans[i>>1] + (i&1) -->
  <rect x="120" y="310" width="260" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="250" y="334" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">ans[i] = ans[i&gt;&gt;1] + (i &amp; 1)</text>

  <!-- i++ then loop back -->
  <line x1="380" y1="329" x2="430" y2="329" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="392" y="240" width="76" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="430" y="258" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i++</text>
  <path d="M 430 240 Q 430 246 332 246" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="232" font-size="10.5" fill="#888">回判</text>

  <!-- No branch: left to return -->
  <text x="150" y="240" font-size="11" fill="#d6a040" font-weight="bold">否</text>
  <path d="M 168 246 Q 90 246 90 329" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return ans -->
  <rect x="20" y="312" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="90" y="334" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">return ans</text>

  <line x1="90" y1="346" x2="90" y2="372" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End oval -->
  <ellipse cx="90" cy="392" rx="42" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="397" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结束</text>

  <!-- bottom note -->
  <rect x="150" y="376" width="320" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="310" y="394" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">每个 ans[i] 由更小的子问题 ans[i&gt;&gt;1] 推出</text>
  <text x="310" y="410" text-anchor="middle" font-size="11" fill="#446688">i&gt;&gt;1 = i/2，天然满足无后效性</text>
</svg>
