<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="18" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 演算：排序 → 相邻检查，第一对即命中</text>

  <!-- ① 原始顺序 -->
  <text x="42" y="68" font-size="10.5" fill="#555" filter="url(#rough2)">① 原始顺序</text>

  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#777">
    <rect x="108" y="48" width="62" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="139" y="68" filter="url(#rough2)">001</text>
    <rect x="178" y="48" width="62" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="209" y="68" filter="url(#rough2)">007</text>
    <rect x="248" y="48" width="46" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="271" y="68" filter="url(#rough2)">15</text>
    <rect x="302" y="48" width="78" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="341" y="68" filter="url(#rough2)">00153</text>
  </g>

  <!-- 排序箭头 -->
  <path d="M 225 84 L 225 112" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="238" y="102" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">按字典序排序</text>

  <!-- ② 排序后 -->
  <text x="42" y="136" font-size="10.5" fill="#555" filter="url(#rough2)">② 排序后</text>

  <g text-anchor="middle" font-size="13" font-weight="bold">
    <rect x="108" y="116" width="62" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="139" y="136" fill="#333" filter="url(#rough2)">001</text>
    <rect x="178" y="116" width="78" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="217" y="136" fill="#b85450" filter="url(#rough2)">00153</text>
    <rect x="264" y="116" width="62" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="295" y="136" fill="#777" filter="url(#rough2)">007</text>
    <rect x="334" y="116" width="46" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="357" y="136" fill="#777" filter="url(#rough2)">15</text>
  </g>

  <!-- 字典序说明 -->
  <rect x="100" y="156" width="400" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="300" y="175" text-anchor="middle" font-size="10" fill="#8a6d3a" filter="url(#rough2)">注意 "00153" 排在 "007" 前面：逐字符比较 0=0、0=0、第三位 1&lt;7</text>
  <text x="300" y="193" text-anchor="middle" font-size="10" fill="#8a6d3a" filter="url(#rough2)">字典序在第一个不同的字符处分胜负，与数值大小 153 &gt; 7 无关</text>

  <!-- ③ 相邻检查表 -->
  <text x="42" y="224" font-size="10.5" fill="#555" filter="url(#rough2)">③ 依次检查相邻对</text>

  <g font-size="10.5" filter="url(#rough2)">
    <!-- 表头 -->
    <rect x="55" y="230" width="130" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="185" y="230" width="175" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="360" y="230" width="115" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="120" y="246" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">相邻对</text>
    <text x="272" y="246" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">前缀判断</text>
    <text x="417" y="246" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">结果</text>

    <!-- 行1：命中 -->
    <rect x="55" y="254" width="130" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="185" y="254" width="175" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="360" y="254" width="115" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="120" y="273" text-anchor="middle" fill="#333" filter="url(#rough2)">("001","00153")</text>
    <text x="272" y="273" text-anchor="middle" fill="#333" filter="url(#rough2)">"00153" 以 "001" 为前缀 ✓</text>
    <text x="417" y="273" text-anchor="middle" fill="#b85450" font-weight="bold" filter="url(#rough2)">命中 → false</text>

    <!-- 行2 -->
    <rect x="55" y="284" width="130" height="30" fill="#ffffff" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="185" y="284" width="175" height="30" fill="#ffffff" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="360" y="284" width="115" height="30" fill="#ffffff" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
    <text x="120" y="303" text-anchor="middle" fill="#555" filter="url(#rough2)">("00153","007")</text>
    <text x="272" y="303" text-anchor="middle" fill="#555" filter="url(#rough2)">第三位 1 vs 7 不同</text>
    <text x="417" y="303" text-anchor="middle" fill="#999" filter="url(#rough2)">未命中</text>

    <!-- 行3 -->
    <rect x="55" y="314" width="130" height="30" fill="#ffffff" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="185" y="314" width="175" height="30" fill="#ffffff" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="360" y="314" width="115" height="30" fill="#ffffff" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
    <text x="120" y="333" text-anchor="middle" fill="#555" filter="url(#rough2)">("007","15")</text>
    <text x="272" y="333" text-anchor="middle" fill="#555" filter="url(#rough2)">首字符就不同</text>
    <text x="417" y="333" text-anchor="middle" fill="#999" filter="url(#rough2)">未命中</text>
  </g>

  <text x="300" y="356" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">第一对即命中 → 立即返回 false，后续相邻对无需再查</text>
</svg>
