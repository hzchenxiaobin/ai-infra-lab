<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：奇位数直接构造，偶位数逐个递推</text>

  <!-- Step 1: count -->
  <rect x="120" y="46" width="320" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 统计 n 的位数 k、奇数位 a、偶数位 b</text>
  <text x="280" y="88" text-anchor="middle" font-size="11" fill="#555">a + b = k</text>

  <!-- arrow down -->
  <path d="M 280 104 L 280 124" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: k odd? -->
  <polygon points="280,128 390,178 280,228 170,178" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="174" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">k 是奇数？</text>
  <text x="280" y="192" text-anchor="middle" font-size="10" fill="#888">奇位数必无公平数</text>

  <!-- Yes branch (right): direct construct -->
  <path d="M 390 178 L 440 178" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="400" y="172" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="440" y="150" width="104" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="492" y="172" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">② 直接构造</text>
  <text x="492" y="190" text-anchor="middle" font-size="10" fill="#b85450">10^k + repunit(k÷2)</text>
  <text x="492" y="204" text-anchor="middle" font-size="10" fill="#555">最小 (k+1) 位公平数</text>

  <!-- No branch (left): k even -->
  <path d="M 170 178 L 120 178" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="138" y="172" font-size="11" fill="#446688" font-weight="bold">否</text>

  <!-- Decision diamond 2: a == b? -->
  <polygon points="120,178 60,228 120,278 180,228" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="224" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">a == b ?</text>
  <text x="120" y="242" text-anchor="middle" font-size="10" fill="#888">n 本身公平？</text>

  <!-- Yes branch (left) -> return n -->
  <path d="M 60 228 L 30 228 L 30 410 L 200 410" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="222" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="200" y="394" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="415" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">③ 返回 n（自身公平）</text>

  <!-- No branch (down): n += 1, loop -->
  <path d="M 120 278 L 120 312" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="128" y="300" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="60" y="312" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="120" y="337" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">④ n ← n + 1</text>

  <!-- loop back arrow to step 1 -->
  <path d="M 60 332 L 24 332 L 24 73 L 120 73" stroke="#446688" stroke-width="1.8" stroke-dasharray="5 3" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="34" y="200" font-size="10" fill="#446688" font-weight="bold" transform="rotate(-90 34 200)">回到①重统</text>

  <!-- direct construct also returns -->
  <path d="M 492 208 L 492 410 L 340 410" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- final return box (shared) -->
  <rect x="200" y="394" width="140" height="32" fill="none" stroke="none"/>
  <text x="430" y="448" text-anchor="middle" font-size="11" fill="#555">奇数分支与偶数递推最终都汇到「返回 ≥ n 的最小公平数」</text>
</svg>
