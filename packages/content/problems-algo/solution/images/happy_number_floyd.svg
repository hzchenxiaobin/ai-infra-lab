<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">快慢指针判环：slow 走 1 步，fast 走 2 步</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">把 f(x) 当作 next 指针——序列就是一条隐式链表（承接 141 环形链表）</text>

  <!-- ===== Implicit linked list with a cycle ===== -->
  <text x="30" y="78" font-size="11" fill="#446688" font-weight="bold">隐式链表（数字序列）</text>
  <g font-size="11">
    <!-- tail nodes -->
    <circle cx="60" cy="120" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="60" y="124" text-anchor="middle" fill="#446688" font-weight="bold">n</text>
    <circle cx="130" cy="120" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="130" y="124" text-anchor="middle" fill="#446688" font-weight="bold">f(n)</text>
    <path d="M 78 120 L 110 120" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- cycle nodes: entry, a, b, c, back to entry -->
    <circle cx="230" cy="120" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="230" y="124" text-anchor="middle" fill="#b85450" font-weight="bold">环入口</text>
    <circle cx="330" cy="120" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="330" y="124" text-anchor="middle" fill="#b85450" font-weight="bold">a</text>
    <circle cx="380" cy="190" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="380" y="194" text-anchor="middle" fill="#b85450" font-weight="bold">b</text>
    <circle cx="280" cy="190" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="280" y="194" text-anchor="middle" fill="#b85450" font-weight="bold">c</text>

    <path d="M 148 120 L 208 120" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 250 120 L 310 120" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
    <path d="M 344 134 Q 366 160 372 174" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
    <path d="M 362 190 L 300 190" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
    <path d="M 268 176 Q 246 150 244 136" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
    <text x="230" y="158" text-anchor="middle" font-size="8" fill="#b85450">环回</text>

    <text x="60" y="152" text-anchor="middle" font-size="8" fill="#888">尾巴</text>
    <text x="230" y="158" text-anchor="middle" font-size="8" fill="#b85450">成环</text>
  </g>

  <!-- ===== Fast & Slow ===== -->
  <text x="30" y="232" font-size="11" fill="#444" font-weight="bold">运动规则：</text>

  <rect x="30" y="242" width="230" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="44" y="260" font-family="monospace" font-size="10" fill="#446688">slow = f(slow)        // 走 1 步</text>
  <text x="44" y="274" font-size="9" fill="#888">🐢 每轮做 1 次平方和</text>

  <rect x="280" y="242" width="230" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="294" y="260" font-family="monospace" font-size="10" fill="#b85450">fast = f(f(fast))     // 走 2 步</text>
  <text x="294" y="274" font-size="9" fill="#888">🐰 每轮做 2 次平方和，追近 slow 1 步</text>

  <!-- ===== Two outcomes ===== -->
  <rect x="30" y="290" width="232" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="146" y="310" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">fast == 1 → 快乐数 ✓</text>
  <text x="146" y="326" text-anchor="middle" font-size="9" fill="#555">1 是不动点，到了 1 就停下</text>
  <text x="146" y="338" text-anchor="middle" font-size="9" fill="#555">不会再进入其他环</text>

  <rect x="278" y="290" width="232" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="394" y="310" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">slow == fast → 成环 ✗</text>
  <text x="394" y="326" text-anchor="middle" font-size="9" fill="#555">速度差 1，必在某轮相遇</text>
  <text x="394" y="338" text-anchor="middle" font-size="9" fill="#555">环不含 1（否则已停在 1）</text>
</svg>
