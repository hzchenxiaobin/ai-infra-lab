<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="450" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：差分事件 → 升序排序 → 一趟扫描取最大值</text>

  <!-- start -->
  <rect x="170" y="44" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">开始：读入折线 y[0..n−1]</text>
  <path d="M 260 76 L 260 92" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 1: diff events -->
  <rect x="140" y="96" width="240" height="62" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="115" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">遍历相邻点对 (y[i], y[i+1])：</text>
  <text x="260" y="132" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">lo = min(y[i], y[i+1])，hi = max(y[i], y[i+1])</text>
  <text x="260" y="149" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">diff[lo] += 1；diff[hi] −= 1</text>
  <text x="392" y="130" text-anchor="start" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">O(n)</text>
  <path d="M 260 158 L 260 176" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 2: sort -->
  <rect x="170" y="180" width="180" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">事件高度升序排序</text>
  <text x="362" y="204" text-anchor="start" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">O(n log n)</text>
  <path d="M 260 212 L 260 230" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 3: sweep -->
  <rect x="150" y="234" width="220" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="255" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">取下一高度 h：cur += diff[h]</text>
  <text x="382" y="258" text-anchor="start" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">O(n) 合计</text>
  <path d="M 260 268 L 260 286" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 4: update ans -->
  <rect x="150" y="290" width="220" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="310" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans = max(ans, cur)</text>
  <path d="M 260 322 L 260 340" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond -->
  <path d="M 260 344 L 348 382 L 260 420 L 172 382 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="386" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">还有高度未处理？</text>

  <!-- yes: loop back -->
  <path d="M 172 382 L 106 382 L 106 251 L 144 251" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="150" y="376" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- no: end -->
  <path d="M 348 382 L 396 382" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="368" y="374" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="400" y="364" width="92" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="18" filter="url(#rough2)"/>
  <text x="446" y="386" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>
</svg>
