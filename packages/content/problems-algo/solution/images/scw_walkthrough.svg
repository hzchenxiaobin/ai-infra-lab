<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="590" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="295" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：licensePlate = "1s3 PSt"</text>

  <!-- need line -->
  <rect x="30" y="40" width="540" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="44" y="62" font-size="11" fill="#446688" font-weight="bold">车牌提取字母</text>
  <text x="44" y="78" font-size="11" fill="#444">"1s3 PSt" → s, s, p, t  ⇒  need = { s:2, p:1, t:1 }</text>

  <!-- table header -->
  <text x="34" y="108" font-size="12" fill="#444" font-weight="bold">候选词</text>
  <text x="150" y="108" font-size="12" fill="#444" font-weight="bold">关键频次</text>
  <text x="340" y="108" font-size="12" fill="#444" font-weight="bold">覆盖判定</text>
  <text x="490" y="108" font-size="12" fill="#444" font-weight="bold">结果</text>
  <line x1="20" y1="116" x2="570" y2="116" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- step -->
  <text x="34" y="140" font-size="12" fill="#333" font-weight="bold">step</text>
  <rect x="146" y="124" width="46" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="169" y="141" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">s:1</text>
  <text x="210" y="141" font-size="11" fill="#999">p:1 t:1</text>
  <text x="340" y="141" font-size="11" fill="#b85450" font-weight="bold">s:1 &lt; need 2  ✗</text>
  <rect x="484" y="124" width="86" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="527" y="141" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">非补全 ✗</text>

  <!-- steps -->
  <text x="34" y="174" font-size="12" fill="#333" font-weight="bold">steps</text>
  <rect x="146" y="158" width="46" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="169" y="175" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">s:2</text>
  <text x="210" y="175" font-size="11" fill="#444">p:1 t:1</text>
  <text x="340" y="175" font-size="11" fill="#4a7a3a" font-weight="bold">全覆盖 ✓（长度 5）</text>
  <rect x="484" y="158" width="86" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="527" y="175" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">补全 ✓ best</text>

  <!-- stripe -->
  <text x="34" y="208" font-size="12" fill="#333" font-weight="bold">stripe</text>
  <rect x="146" y="192" width="46" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="169" y="209" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">s:1</text>
  <text x="210" y="209" font-size="11" fill="#999">p:1 t:1</text>
  <text x="340" y="209" font-size="11" fill="#b85450" font-weight="bold">s:1 &lt; need 2  ✗</text>
  <rect x="484" y="192" width="86" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="527" y="209" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">非补全 ✗</text>

  <!-- stepple -->
  <text x="34" y="242" font-size="12" fill="#333" font-weight="bold">stepple</text>
  <rect x="146" y="226" width="46" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="169" y="243" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">s:1</text>
  <text x="210" y="243" font-size="11" fill="#999">p:2 t:1</text>
  <text x="340" y="243" font-size="11" fill="#b85450" font-weight="bold">s:1 &lt; need 2  ✗</text>
  <rect x="484" y="226" width="86" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="527" y="243" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">非补全 ✗</text>

  <!-- result summary -->
  <rect x="30" y="278" width="540" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="300" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">最终结果</text>
  <text x="300" y="322" text-anchor="middle" font-size="14" fill="#333" font-family="monospace" font-weight="bold">"steps"</text>
  <text x="300" y="340" text-anchor="middle" font-size="10" fill="#888">唯一补全词即答案；step/stripe/stepple 均因 s 不足被淘汰</text>

  <!-- second example -->
  <rect x="30" y="356" width="540" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="44" y="378" font-size="11" fill="#4a7a3a" font-weight="bold">并列情形：licensePlate = "1s3 456" ⇒ need = { s:1 }</text>
  <text x="44" y="396" font-size="11" fill="#444">looks(5) ✓ / pest(4) ✓ / stew(4) ✓ / show(4) ✓  —— 四词均补全，长度 4 最短</text>
  <text x="44" y="416" font-size="11" fill="#b85450" font-weight="bold">并列取首个 → 返回 "pest"（用 w.size() &lt; best.size()，等长不替换保序）</text>
</svg>
