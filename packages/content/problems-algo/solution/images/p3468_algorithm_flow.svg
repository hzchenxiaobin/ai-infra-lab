<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">算法流程：单趟扫描维护交集 [lo, hi]，空了就提前返回 0</text>

  <rect x="170" y="32" width="190" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="49" text-anchor="middle" font-size="11" fill="#333">开始：lo = −∞，hi = +∞，i = 0</text>

  <path d="M 265 58 L 265 74" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="265,78 322,104 265,130 208,104" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="108" text-anchor="middle" font-size="11" fill="#333">i &lt; n ?</text>

  <path d="M 324 104 L 368 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="98" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="372" y="88" width="130" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="437" y="108" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">返回 hi − lo + 1</text>

  <path d="M 265 130 L 265 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="274" y="139" font-size="10" fill="#4a7a3a">是</text>

  <rect x="130" y="142" width="270" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="160" text-anchor="middle" font-size="10.5" fill="#333">lo = max(lo, uᵢ − original[i])</text>
  <text x="265" y="178" text-anchor="middle" font-size="10.5" fill="#333">hi = min(hi, vᵢ − original[i])</text>

  <path d="M 265 188 L 265 198" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="265,202 330,230 265,258 200,230" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="234" text-anchor="middle" font-size="11" fill="#333">lo &gt; hi ?</text>

  <path d="M 332 230 L 376 230" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="353" y="224" text-anchor="middle" font-size="10" fill="#b85450">是</text>
  <rect x="380" y="214" width="110" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="435" y="234" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 0</text>

  <path d="M 265 258 L 265 268" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="274" y="267" font-size="10" fill="#4a7a3a">否</text>

  <rect x="210" y="270" width="110" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="288" text-anchor="middle" font-size="11" fill="#333">i = i + 1</text>

  <path d="M 265 300 L 265 318 L 150 318 L 150 104 L 202 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="313" text-anchor="middle" font-size="9.5" fill="#999">继续下一个 i</text>

  <rect x="30" y="150" width="90" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="75" y="168" text-anchor="middle" font-size="9.5" fill="#555">交集只会越缩</text>
  <text x="75" y="182" text-anchor="middle" font-size="9.5" fill="#555">越小，一旦为空</text>
  <text x="75" y="196" text-anchor="middle" font-size="9.5" fill="#555">即可提前剪枝，</text>
  <text x="75" y="210" text-anchor="middle" font-size="9.5" fill="#555">不必扫完全程</text>
</svg>
