<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：排序后逐元素算贡献，最大值次数减最小值次数</text>

  <!-- Sorted array label -->
  <text x="60" y="62" font-size="11" fill="#888">排序后 nums:</text>

  <!-- Sorted array boxes: [1, 2, 3, 4] -->
  <rect x="130" y="48" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="70" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="154" y="96" text-anchor="middle" font-size="10" fill="#888">i=0</text>

  <rect x="186" y="48" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="70" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="210" y="96" text-anchor="middle" font-size="10" fill="#888">i=1</text>

  <rect x="242" y="48" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="266" y="70" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="266" y="96" text-anchor="middle" font-size="10" fill="#888">i=2</text>

  <rect x="298" y="48" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="70" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="322" y="96" text-anchor="middle" font-size="10" fill="#888">i=3</text>

  <text x="360" y="70" font-size="10" fill="#888">(n = 4)</text>

  <!-- Divider -->
  <path d="M 40 116 L 520 116" stroke="#ddd" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- Focus on i=2 (value 3) -->
  <text x="60" y="142" font-size="11" fill="#555" font-weight="bold">以 i=2 (nums[2]=3) 为例：</text>

  <!-- As MAX: elements before can be freely chosen -->
  <rect x="40" y="158" width="480" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="180" font-size="11" fill="#b85450" font-weight="bold">作为最大值 ↑</text>
  <text x="60" y="198" font-size="10" fill="#666">nums[2] 必选，左侧元素任意选/不选，右侧不选</text>

  <!-- left elements (freely chosen) -->
  <rect x="130" y="206" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="224" text-anchor="middle" font-size="11" fill="#446688">?</text>
  <rect x="186" y="206" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="224" text-anchor="middle" font-size="11" fill="#446688">?</text>
  <!-- chosen element -->
  <rect x="242" y="206" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="266" y="224" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3 ✓</text>
  <!-- right elements (not chosen) -->
  <rect x="298" y="206" width="48" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="224" text-anchor="middle" font-size="11" fill="#ccc">×</text>

  <text x="370" y="214" font-size="11" fill="#444">左侧 i=2 个元素</text>
  <text x="370" y="232" font-size="11" fill="#d6a040" font-weight="bold">各选/不选 → 2² = 4 种</text>

  <!-- As MIN: elements after can be freely chosen -->
  <rect x="40" y="256" width="480" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="278" font-size="11" fill="#446688" font-weight="bold">作为最小值 ↓</text>
  <text x="60" y="296" font-size="10" fill="#666">nums[2] 必选，右侧元素任意选/不选，左侧不选</text>

  <!-- left elements (not chosen) -->
  <rect x="130" y="304" width="48" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="322" text-anchor="middle" font-size="11" fill="#ccc">×</text>
  <rect x="186" y="304" width="48" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="322" text-anchor="middle" font-size="11" fill="#ccc">×</text>
  <!-- chosen element -->
  <rect x="242" y="304" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="266" y="322" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3 ✓</text>
  <!-- right elements (freely chosen) -->
  <rect x="298" y="304" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="322" text-anchor="middle" font-size="11" fill="#446688">?</text>

  <text x="370" y="312" font-size="11" fill="#444">右侧 n−1−i = 1 个</text>
  <text x="370" y="330" font-size="11" fill="#446688" font-weight="bold">各选/不选 → 2¹ = 2 种</text>

  <!-- Contribution formula -->
  <rect x="40" y="356" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">nums[i] 的净贡献 = nums[i] × (2^i − 2^(n−1−i))</text>
  <text x="280" y="392" text-anchor="middle" font-size="10" fill="#666">i=2: 3 × (4 − 2) = 6</text>

  <!-- Bottom note -->
  <rect x="40" y="410" width="480" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="430" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">排序不改变子序列的 (max, min) 取值 → 可安全排序后按位置计数</text>
  <text x="280" y="446" text-anchor="middle" font-size="10" fill="#888">每个子序列的 max 归给最高下标元素、min 归给最低下标元素，不重不漏</text>
</svg>
