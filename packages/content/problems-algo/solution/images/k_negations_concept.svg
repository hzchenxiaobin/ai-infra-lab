<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心策略：先翻负数，再处理剩余 k</text>

  <!-- 第1步：排序 -->
  <text x="40" y="56" font-size="11.5" fill="#888">第 1 步：排序 —— 负数集中到左侧，天然给出翻转优先级</text>
  <rect x="40" y="64" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="85" text-anchor="middle" font-size="11.5" fill="#333">排序前: [2, -3, -1, 5, -4]</text>
  <path d="M 280 80 L 300 80" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="304" y="64" width="216" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="412" y="85" text-anchor="middle" font-size="11.5" fill="#333">排序后: [-4,-3,-1,2,5]</text>

  <path d="M 280 100 L 280 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第2步：贪心翻转负数 -->
  <text x="40" y="134" font-size="11.5" fill="#888">第 2 步：贪心翻转负数 —— 从左到右翻，优先翻绝对值最大的负数</text>
  <rect x="40" y="142" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <!-- 负数格子 -->
  <rect x="56" y="150" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="170" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">-4</text>
  <rect x="112" y="150" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="136" y="170" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">-3</text>
  <rect x="168" y="150" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="192" y="170" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">-1</text>
  <!-- 正数格子 -->
  <rect x="224" y="150" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="248" y="170" text-anchor="middle" font-size="12" fill="#4a7a3a">2</text>
  <rect x="280" y="150" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="304" y="170" text-anchor="middle" font-size="12" fill="#4a7a3a">5</text>
  <!-- 翻转箭头标注 -->
  <text x="80" y="184" text-anchor="middle" font-size="9.5" fill="#d6a040">翻→4</text>
  <text x="136" y="184" text-anchor="middle" font-size="9.5" fill="#d6a040">翻→3</text>
  <text x="192" y="184" text-anchor="middle" font-size="9.5" fill="#d6a040">翻→1</text>

  <!-- 中间说明 -->
  <text x="348" y="166" font-size="10.5" fill="#888">负数翻正</text>
  <text x="348" y="180" font-size="10.5" fill="#888">收益 = 2|x|</text>

  <path d="M 280 200 L 280 218" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第3步：处理剩余 k -->
  <text x="40" y="234" font-size="11.5" fill="#888">第 3 步：翻完负数后处理剩余 k</text>

  <!-- k为偶数 -->
  <rect x="40" y="242" width="230" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="155" y="262" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">剩余 k 为偶数</text>
  <text x="155" y="280" text-anchor="middle" font-size="11" fill="#333">翻同一元素两次 → x → -x → x</text>
  <text x="155" y="293" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">净效果为零，和不变 ✓</text>

  <!-- k为奇数 -->
  <rect x="290" y="242" width="230" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="405" y="262" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">剩余 k 为奇数</text>
  <text x="405" y="280" text-anchor="middle" font-size="11" fill="#333">必须净翻转一个元素</text>
  <text x="405" y="293" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">翻最小绝对值，损失最少</text>

  <path d="M 280 300 L 280 318" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结果 -->
  <rect x="60" y="322" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">结果：数组全非负 + 最小损失 = 最大化和</text>

  <!-- 底部备注 -->
  <text x="280" y="385" text-anchor="middle" font-size="10" fill="#aaa">核心：排序建立优先级 → 贪心翻负数 → 奇偶处理剩余 k</text>
</svg>
