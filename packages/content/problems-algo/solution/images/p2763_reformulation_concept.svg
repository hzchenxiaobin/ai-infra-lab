<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2763a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：不平衡数 = 不同值数 − 1 − 相邻值对数</text>

  <!-- sorted distinct value row : 1, 3, 4 -->
  <text x="60" y="86" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">排序去重</text>

  <rect x="110" y="58" width="60" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="140" y="89" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">1</text>

  <rect x="250" y="58" width="60" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="280" y="89" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">3</text>

  <rect x="390" y="58" width="60" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="420" y="89" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">4</text>

  <!-- gaps -->
  <!-- gap 1 -> 3 : diff 2 > 1  => imbalance break -->
  <path d="M170,82 L248,82" stroke="#b85450" stroke-width="2.2" marker-end="url(#arr2763a)" filter="url(#rough2)"/>
  <rect x="183" y="106" width="58" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="212" y="121" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">差 2 &gt; 1</text>

  <!-- gap 3 -> 4 : diff 1 => consecutive -->
  <path d="M310,82 L388,82" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arr2763a)" filter="url(#rough2)"/>
  <rect x="323" y="106" width="58" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="352" y="121" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">差 1 连续</text>

  <!-- count labels -->
  <text x="212" y="148" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">不平衡 +1</text>
  <text x="352" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">不计</text>

  <!-- formula boxes -->
  <rect x="50" y="172" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="194" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">相邻对总数 = k − 1 = 3 − 1 = 2</text>
  <text x="280" y="214" text-anchor="middle" font-size="12" fill="#d6a040">不平衡 = (k−1) − 相邻连续对 = |D| − 1 − C</text>

  <!-- C explanation -->
  <rect x="50" y="248" width="460" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="268" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">C = 同时含 v 与 v+1 的值对数（此处 v=3,4 → C=1）</text>
  <text x="280" y="284" text-anchor="middle" font-size="11" fill="#4a7a3a">不平衡 = 2 − 1 = 1 ✓</text>

  <!-- duplicate note -->
  <rect x="50" y="310" width="460" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">重复值不影响：相邻同值差为 0</text>
  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#446688">[3,3,3,4] 排序去重 → {3,4}，与原数组不平衡数一致</text>
</svg>
