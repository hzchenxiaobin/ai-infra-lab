<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：FROM → GROUP BY → COUNT → ORDER BY</text>

  <!-- ===== Step 1: FROM Spotify ===== -->
  <rect x="40" y="48" width="220" height="40" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="66" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">① FROM Spotify</text>
  <text x="150" y="80" text-anchor="middle" font-size="8" fill="#888">读取全部行（5 行曲目）</text>
  <!-- mini table preview -->
  <rect x="280" y="48" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="64" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">5</text>
  <text x="300" y="78" text-anchor="middle" font-size="7" fill="#888">行</text>

  <!-- Arrow down -->
  <path d="M 150 88 L 150 106" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: GROUP BY artist ===== -->
  <rect x="40" y="110" width="220" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="128" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">② GROUP BY artist</text>
  <text x="150" y="142" text-anchor="middle" font-size="8" fill="#888">按艺术家归并 → 3 组</text>
  <!-- mini groups preview -->
  <rect x="280" y="110" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="126" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">3</text>
  <text x="300" y="140" text-anchor="middle" font-size="7" fill="#888">组</text>

  <!-- Arrow down -->
  <path d="M 150 150 L 150 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: COUNT(*) AS occurrences ===== -->
  <rect x="40" y="172" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">③ COUNT(*) AS occurrences</text>
  <text x="150" y="204" text-anchor="middle" font-size="8" fill="#888">每组数行数 = 出现次数</text>
  <!-- mini counts preview -->
  <text x="300" y="188" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">2, 2, 1</text>
  <text x="300" y="202" text-anchor="middle" font-size="7" fill="#888">计数</text>

  <!-- Arrow down -->
  <path d="M 150 212 L 150 230" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: ORDER BY ===== -->
  <rect x="40" y="234" width="220" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="252" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">④ ORDER BY occurrences DESC, artist ASC</text>
  <text x="150" y="266" text-anchor="middle" font-size="8" fill="#888">按次数降序 + 艺术家名升序</text>

  <!-- Arrow right to output table -->
  <path d="M 260 254 L 318 254" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Output table ===== -->
  <text x="450" y="220" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">输出结果</text>
  <!-- Header -->
  <rect x="340" y="228" width="220" height="22" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="420" y="243" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">artist</text>
  <text x="520" y="243" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">occurrences</text>
  <!-- Row 1: DJ Khalid, 2 -->
  <rect x="340" y="250" width="220" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="265" text-anchor="middle" font-size="9" fill="#d6a040">DJ Khalid</text>
  <text x="520" y="265" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2</text>
  <!-- Row 2: Ed Sheeran, 2 -->
  <rect x="340" y="272" width="220" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="287" text-anchor="middle" font-size="9" fill="#446688">Ed Sheeran</text>
  <text x="520" y="287" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2</text>
  <!-- Row 3: Sia, 1 -->
  <rect x="340" y="294" width="220" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="309" text-anchor="middle" font-size="9" fill="#4a7a3a">Sia</text>
  <text x="520" y="309" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">1</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="340" width="500" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="290" y="360" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">SQL 子句执行顺序：FROM → GROUP BY → 聚合(COUNT) → SELECT → ORDER BY</text>
  <text x="290" y="378" text-anchor="middle" font-size="9" fill="#666">GROUP BY 先把行归组，COUNT(*) 在组内数行数，ORDER BY 最后排序输出</text>
  <text x="290" y="396" text-anchor="middle" font-size="9" fill="#b85450">⚠ COUNT(*) 数的是组内行数，无需 DISTINCT——GROUP BY 已保证每组一个艺术家</text>
  <text x="290" y="412" text-anchor="middle" font-size="9" fill="#666">排序：occurrences DESC（多者在前）→ artist ASC（同次数按名字）</text>
</svg>
