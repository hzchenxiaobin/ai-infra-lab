<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrA" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrK" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">保留/缩写 二叉决策树（以 word 前 3 字符 "wor" 示意）</text>
  <text x="380" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">左=缩写A(计数+1，不写字符)　右=保留K(落盘计数再写字符)；每片叶子=一个缩写</text>

  <!-- ===== Tree ===== -->
  <g font-size="11" filter="url(#rough2)">
    <!-- Layer labels -->
    <text x="28" y="80" font-size="10" fill="#888" font-weight="bold">根</text>
    <text x="28" y="150" font-size="10" fill="#888" font-weight="bold">决策w</text>
    <text x="28" y="240" font-size="10" fill="#888" font-weight="bold">决策o</text>
    <text x="28" y="330" font-size="10" fill="#888" font-weight="bold">决策r</text>

    <!-- Root: ∅ -->
    <rect x="350" y="62" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="380" y="80" text-anchor="middle" fill="#446688" font-weight="bold">∅ c=0</text>

    <!-- Level 1: decide w -->
    <rect x="150" y="132" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="180" y="150" text-anchor="middle" fill="#d6a040" font-weight="bold">·1</text>
    <rect x="550" y="132" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="580" y="150" text-anchor="middle" fill="#4a7a3a" font-weight="bold">w</text>

    <!-- Level 2: decide o -->
    <rect x="50" y="222" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="80" y="240" text-anchor="middle" fill="#d6a040" font-weight="bold">·2</text>
    <rect x="250" y="222" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="280" y="240" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1o</text>
    <rect x="450" y="222" width="64" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="482" y="240" text-anchor="middle" fill="#b85450" font-weight="bold">w·1</text>
    <rect x="650" y="222" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="680" y="240" text-anchor="middle" fill="#4a7a3a" font-weight="bold">wo</text>

    <!-- Level 3: leaves (decide r) -->
    <rect x="20" y="312" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <text x="50" y="330" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <rect x="120" y="312" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <text x="150" y="330" text-anchor="middle" fill="#b85450" font-weight="bold">2r</text>
    <rect x="220" y="312" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <text x="250" y="330" text-anchor="middle" fill="#b85450" font-weight="bold">1o1</text>
    <rect x="320" y="312" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <text x="350" y="330" text-anchor="middle" fill="#b85450" font-weight="bold">1or</text>
    <rect x="420" y="312" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <text x="450" y="330" text-anchor="middle" fill="#b85450" font-weight="bold">w2</text>
    <rect x="520" y="312" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <text x="550" y="330" text-anchor="middle" fill="#b85450" font-weight="bold">w1r</text>
    <rect x="620" y="312" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <text x="650" y="330" text-anchor="middle" fill="#b85450" font-weight="bold">wo1</text>
    <rect x="720" y="312" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <text x="750" y="330" text-anchor="middle" fill="#b85450" font-weight="bold">wor</text>

    <!-- edges: root → L1 -->
    <path d="M 365 88 L 200 132" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arrA)"/>
    <path d="M 395 88 L 560 132" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrK)"/>
    <text x="250" y="112" font-size="9" fill="#d6a040" font-weight="bold">缩写w</text>
    <text x="510" y="112" font-size="9" fill="#4a7a3a" font-weight="bold">保留w</text>

    <!-- edges: L1 → L2 -->
    <path d="M 165 158 L 100 222" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arrA)"/>
    <path d="M 195 158 L 260 222" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrK)"/>
    <path d="M 565 158 L 470 222" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arrA)"/>
    <path d="M 595 158 L 660 222" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrK)"/>
    <text x="115" y="196" font-size="9" fill="#d6a040">A</text>
    <text x="252" y="196" font-size="9" fill="#4a7a3a">K</text>
    <text x="485" y="196" font-size="9" fill="#d6a040">A</text>
    <text x="650" y="196" font-size="9" fill="#4a7a3a">K</text>

    <!-- edges: L2 → leaves -->
    <path d="M 70 248 L 50 312" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrA)"/>
    <path d="M 95 248 L 140 312" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrK)"/>
    <path d="M 270 248 L 250 312" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrA)"/>
    <path d="M 295 248 L 340 312" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrK)"/>
    <path d="M 472 248 L 450 312" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrA)"/>
    <path d="M 497 248 L 540 312" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrK)"/>
    <path d="M 670 248 L 650 312" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrA)"/>
    <path d="M 695 248 L 740 312" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrK)"/>
  </g>

  <!-- ===== Legend ===== -->
  <rect x="40" y="362" width="680" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="56" y="376" width="16" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
  <text x="80" y="388" font-size="10" fill="#d6a040" filter="url(#rough2)">缩写A：该位字符不计入串，只让计数+1（·N 表示 N 个待落盘）</text>
  <rect x="56" y="396" width="16" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
  <text x="80" y="408" font-size="10" fill="#4a7a3a" filter="url(#rough2)">保留K：先把待落盘计数写进串，再写该字符，计数清零</text>
  <rect x="430" y="376" width="16" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3"/>
  <text x="454" y="388" font-size="10" fill="#b85450" filter="url(#rough2)">叶子：落盘剩余计数 = 一个完整缩写</text>
  <text x="430" y="408" font-size="10" fill="#666" filter="url(#rough2)">"wor" 共 2³=8 个；"word" 再二分一层 → 2⁴=16 个</text>
</svg>
