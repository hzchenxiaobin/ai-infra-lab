<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 412"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="412" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">出度恒为 1 ⇒ 轨迹是一条链：要么越界，要么撞上自己的脚印</text>

  <!-- ══════════ 示例 1：尾 + 环 ══════════ -->
  <text x="24" y="46" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1：蓝弧 = jump 跳转，绿弧 = add 得分右移，灰格 = 被跨过未执行</text>

  <!-- 轨迹弧线（上方） -->
  <path d="M 77 74 C 77 46, 217 46, 217 72" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 217 74 C 217 58, 287 58, 287 72" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 287 74 C 287 58, 357 58, 357 72" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 357 74 C 357 58, 427 58, 427 72" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 六个指令格子 -->
  <rect x="46" y="78" width="62" height="58" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="77" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">jump</text>
  <text x="77" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">+2</text>

  <rect x="116" y="78" width="62" height="58" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="147" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#999" filter="url(#rough2)">add</text>
  <text x="147" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#999" filter="url(#rough2)">1</text>

  <rect x="186" y="78" width="62" height="58" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="217" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">add</text>
  <text x="217" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">+3</text>

  <rect x="256" y="78" width="62" height="58" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="287" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">jump</text>
  <text x="287" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">+1</text>

  <rect x="326" y="78" width="62" height="58" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="357" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">add</text>
  <text x="357" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">−2</text>

  <rect x="396" y="78" width="62" height="58" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="427" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">jump</text>
  <text x="427" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">−3</text>

  <!-- 下标 + 执行序号 -->
  <text x="77" y="154" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">① #0</text>
  <text x="147" y="154" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">#1 未执行</text>
  <text x="217" y="154" text-anchor="middle" font-size="10.5" fill="#2a5a2a" filter="url(#rough2)">② #2</text>
  <text x="287" y="154" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">③ #3</text>
  <text x="357" y="154" text-anchor="middle" font-size="10.5" fill="#2a5a2a" filter="url(#rough2)">④ #4</text>
  <text x="427" y="154" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">⑤ #5</text>

  <!-- 红色回跳弧线（下方）：5 -> 2 重访 -->
  <path d="M 427 140 C 427 172, 217 172, 217 142" fill="none" stroke="#b85450" stroke-width="2.4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="330" y="192" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">⑥ 下一跳（jump −3）撞回已执行的 #2 ⇒ 终止</text>

  <text x="280" y="212" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">只有 ②④ 得分：score = 3 + (−2) = 1（下标 1 白躺枪，不得分）</text>

  <!-- ══════════ 示例 2：越界 ══════════ -->
  <text x="24" y="244" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2：一步飞出边界（越界即停）</text>

  <path d="M 137 242 C 137 210, 470 208, 470 240" fill="none" stroke="#446688" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="106" y="246" width="62" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="137" y="266" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">jump</text>
  <text x="137" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">+3</text>

  <rect x="196" y="246" width="62" height="52" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="227" y="266" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#999" filter="url(#rough2)">add</text>
  <text x="227" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#999" filter="url(#rough2)">1</text>

  <rect x="286" y="246" width="62" height="52" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="317" y="266" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#999" filter="url(#rough2)">add</text>
  <text x="317" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#999" filter="url(#rough2)">1</text>

  <text x="137" y="314" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">① #0</text>
  <text x="227" y="314" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">#1 未执行</text>
  <text x="317" y="314" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">#2 未执行</text>

  <text x="487" y="262" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ i=3 越界</text>
  <text x="487" y="280" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">score = 0</text>

  <!-- ══════════ 结论框 ══════════ -->
  <rect x="48" y="336" width="464" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">鸽笼：n 个下标每个至多执行一次 ⇒ 至多 n+1 步必停</text>
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">往回跳也绕不完 —— 标记 visited 的线性模拟就是 O(n) 最优解</text>
</svg>
