<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="500" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">堆优化 Dijkstra 算法流程</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">主流程纵向推进；虚线分支表示回到循环顶部</text>

  <!-- ===== Step 1 (start) ===== -->
  <rect x="60" y="58" width="250" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="185" y="80" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">① 初始化</text>
  <text x="185" y="98" text-anchor="middle" font-size="10" fill="#555">建邻接表；dist[k]=0，其余=∞；堆=[(0,k)]</text>

  <path d="M 185 110 L 185 132" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Diamond: heap empty? ===== -->
  <polygon points="185,134 245,168 185,202 125,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="185" y="164" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">堆为空?</text>
  <text x="185" y="180" text-anchor="middle" font-size="9" fill="#888">是 → 结束</text>

  <!-- yes arrow to end box (right) -->
  <path d="M 245 168 L 360 168" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="362" y="146" width="160" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="442" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">④ 结束</text>
  <text x="442" y="182" text-anchor="middle" font-size="9" fill="#555">有 ∞ → -1；</text>
  <text x="442" y="194" text-anchor="middle" font-size="9" fill="#555">否则 max(dist)</text>

  <!-- no arrow down -->
  <path d="M 185 202 L 185 224" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="216" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- ===== Step 2: pop ===== -->
  <rect x="100" y="226" width="170" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="185" y="250" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">② 弹出堆顶 (d, u)</text>

  <path d="M 185 264 L 185 286" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Diamond: stale? ===== -->
  <polygon points="185,288 255,322 185,356 115,322" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="185" y="318" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">d &gt; dist[u] ?</text>
  <text x="185" y="334" text-anchor="middle" font-size="9" fill="#888">过期记录?</text>

  <!-- yes branch (right): skip -->
  <path d="M 255 322 L 360 322" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="314" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="362" y="304" width="150" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="437" y="320" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">懒删除：continue</text>
  <text x="437" y="334" text-anchor="middle" font-size="9" fill="#888">跳过，回 ① 循环</text>

  <!-- no down -->
  <path d="M 185 356 L 185 378" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="370" font-size="10" fill="#446688" font-weight="bold">否</text>

  <!-- ===== Step 3: relax edges ===== -->
  <rect x="90" y="380" width="190" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="185" y="404" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">③ 遍历出边 u→v(w) 松弛</text>

  <!-- relax decision + update box combined note -->
  <path d="M 280 399 L 360 399" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="362" y="378" width="150" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="437" y="396" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">若 dist[u]+w &lt; dist[v]</text>
  <text x="437" y="412" text-anchor="middle" font-size="9" fill="#555">更新 dist[v]，push(nd,v)</text>

  <!-- loop back note -->
  <path d="M 185 420 L 185 452" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="185" y="448" text-anchor="middle" font-size="9" fill="#888">（虚线 = 回到 ① 循环顶部）</text>
  <text x="270" y="478" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">每个节点确定一次 → 总松弛 O(E)，每次堆操作 O(log V)</text>
</svg>
