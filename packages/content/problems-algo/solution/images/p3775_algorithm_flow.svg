<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333"
        filter="url(#rough2)">流程：先定基准 k，再逐词「数一数 → 比一比 → 翻不翻」</text>

  <!-- ① -->
  <rect x="140" y="40" width="240" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="59" text-anchor="middle" font-size="12.5" fill="#333"
        filter="url(#rough2)">① 扫描第一个单词，统计元音数 k</text>
  <path d="M 260 70 L 260 82" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② -->
  <rect x="140" y="86" width="240" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="105" text-anchor="middle" font-size="12.5" fill="#333"
        filter="url(#rough2)">② 取下一个单词 w</text>
  <path d="M 260 116 L 260 126" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ -->
  <rect x="140" y="130" width="240" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="149" text-anchor="middle" font-size="12.5" fill="#333"
        filter="url(#rough2)">③ 统计 w 的元音数 cnt</text>
  <path d="M 260 160 L 260 170" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形判断 -->
  <polygon points="260,172 338,208 260,244 182,208" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="213" text-anchor="middle" font-size="13" fill="#333" font-weight="bold"
        filter="url(#rough2)">cnt = k ?</text>

  <text x="158" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold"
        filter="url(#rough2)">是</text>
  <path d="M 182 208 L 116 208 L 116 262" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <text x="364" y="198" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold"
        filter="url(#rough2)">否</text>
  <path d="M 338 208 L 404 208 L 404 262" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④a 反转 -->
  <rect x="46" y="266" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="116" y="287" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold"
        filter="url(#rough2)">④a 反转 w</text>

  <!-- ④b 保持 -->
  <rect x="334" y="266" width="140" height="32" fill="#ffffff" stroke="#999999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="404" y="287" text-anchor="middle" font-size="12.5" fill="#666"
        filter="url(#rough2)">④b 保持不变</text>

  <!-- 汇合 -->
  <path d="M 116 298 L 116 326 L 214 326" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 404 298 L 404 326 L 306 326" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 230 326 L 244 326" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290 326 L 292 326" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑤ 拼入结果 -->
  <rect x="150" y="336" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="356" text-anchor="middle" font-size="12.5" fill="#333"
        filter="url(#rough2)">⑤ 拼入结果串</text>

  <!-- 回边：还有单词 -->
  <path d="M 150 351 L 36 351 L 36 101 L 134 101" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="56" y="342" font-size="10.5" fill="#4a7a3a"
        filter="url(#rough2)">还有单词</text>

  <!-- 退出边：单词耗尽 → ⑥ -->
  <path d="M 380 101 L 500 101 L 500 351 L 478 351" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="92" font-size="10.5" fill="#b85450"
        filter="url(#rough2)">单词耗尽</text>

  <!-- ⑥ 返回 -->
  <rect x="338" y="336" width="140" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="408" y="356" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold"
        filter="url(#rough2)">⑥ 单空格连接返回</text>
</svg>
