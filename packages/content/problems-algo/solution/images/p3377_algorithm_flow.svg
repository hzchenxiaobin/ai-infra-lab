<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 448"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="448" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：筛质数 ⟹ Dijkstra</text>

  <!-- A: sieve -->
  <rect x="150" y="40" width="220" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">埃氏筛预处理 is_prime[0..9999]</text>
  <path d="M260,72 L260,86" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1: prime check -->
  <polygon points="260,88 340,114 260,140 180,114" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">n 或 m 是质数？</text>
  <path d="M340,114 L392,114" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="360" y="106" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="396" y="98" width="90" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="441" y="119" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">返回 -1</text>
  <path d="M260,140 L260,154" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="152" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- B2: init -->
  <rect x="150" y="156" width="220" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="177" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">初始化 dis[n]=n，堆放入 (n, n)</text>
  <path d="M260,188 L260,202" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B3: pop -->
  <rect x="140" y="204" width="240" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="223" text-anchor="middle" font-size="12" fill="#2a4a1e" filter="url(#rough2)">弹出堆顶 (dx, x)（懒惰删除）</text>
  <text x="260" y="241" text-anchor="middle" font-size="12" fill="#2a4a1e" filter="url(#rough2)">若 x == m ⟹ 直接返回 dx</text>
  <path d="M260,248 L260,262" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B4: enumerate digits -->
  <rect x="140" y="264" width="240" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="283" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">枚举 x 的每个数位 d（位值 pow10）</text>
  <text x="260" y="301" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">候选 y = x ± pow10（d∈[0,9] 内）</text>
  <path d="M260,308 L260,322" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D3: valid check -->
  <polygon points="260,324 355,352 260,380 165,352" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="11.5" fill="#8a6a1a" filter="url(#rough2)">y≥1 且非质数</text>
  <text x="260" y="364" text-anchor="middle" font-size="11.5" fill="#8a6a1a" filter="url(#rough2)">且 dx+y &lt; dis[y]？</text>

  <!-- yes: relax -->
  <path d="M260,380 L260,394" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="392" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="150" y="396" width="220" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="416" text-anchor="middle" font-size="12" fill="#2a4a1e" filter="url(#rough2)">松弛 dis[y]=dx+y，(dis[y],y) 入堆</text>

  <!-- loop back: right side from relax box up to pop box -->
  <path d="M370,411 Q445,411 445,226 L384,226" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="462" y="330" text-anchor="middle" font-size="11" fill="#4a7a3a" transform="rotate(90 462 330)" filter="url(#rough2)">回到主循环</text>

  <!-- no: skip, left side back to pop -->
  <path d="M165,352 Q75,352 75,226 L136,226" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="72" y="300" text-anchor="middle" font-size="11" fill="#b85450" transform="rotate(-90 72 300)" filter="url(#rough2)">否，跳过该候选</text>

  <!-- heap empty note -->
  <text x="260" y="441" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">（堆空仍未弹出 m ⟹ 返回 -1）</text>
</svg>
