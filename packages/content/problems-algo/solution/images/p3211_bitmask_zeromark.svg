<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">位运算判定：把 0 的位置标出来，看它们是否相邻</text>
  <text x="260" y="50" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">设 m = (1 &lt;&lt; n) − 1，下图 n = 4，m = 1111；y = ~x &amp; m 标出 x 中 0 的位置</text>

  <!-- 左块：x = 1001 非法 -->
  <text x="162" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">x = "1001"（非法）</text>

  <text x="92" y="100" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">x</text>
  <rect x="100" y="84" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="134" y="84" width="30" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="149" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="168" y="84" width="30" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="183" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="202" y="84" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="217" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <text x="92" y="130" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">y = ~x &amp; m</text>
  <rect x="100" y="114" width="30" height="24" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="115" y="130" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <rect x="134" y="114" width="30" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="149" y="130" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="168" y="114" width="30" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="183" y="130" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="202" y="114" width="30" height="24" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="217" y="130" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>

  <text x="92" y="160" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">y &gt;&gt; 1</text>
  <rect x="100" y="144" width="30" height="24" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="115" y="160" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <rect x="134" y="144" width="30" height="24" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="149" y="160" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <rect x="168" y="144" width="30" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="183" y="160" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="202" y="144" width="30" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="217" y="160" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>

  <text x="92" y="190" text-anchor="end" font-size="10.5" font-weight="bold" fill="#555" filter="url(#rough2)">y &amp; (y&gt;&gt;1)</text>
  <rect x="100" y="174" width="30" height="24" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="115" y="190" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <rect x="134" y="174" width="30" height="24" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="149" y="190" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <rect x="168" y="174" width="30" height="24" rx="4" fill="#b85450" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="183" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff" filter="url(#rough2)">1</text>
  <rect x="202" y="174" width="30" height="24" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="217" y="190" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>

  <text x="162" y="222" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">≠ 0 → 有相邻的 00 ✗</text>

  <!-- 右块：x = 0101 合法 -->
  <text x="412" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">x = "0101"（合法）</text>

  <text x="354" y="100" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">x</text>
  <rect x="362" y="84" width="30" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="377" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="396" y="84" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="411" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="430" y="84" width="30" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="445" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="464" y="84" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="479" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <text x="354" y="130" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">y = ~x &amp; m</text>
  <rect x="362" y="114" width="30" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="377" y="130" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="396" y="114" width="30" height="24" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="411" y="130" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <rect x="430" y="114" width="30" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="445" y="130" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="464" y="114" width="30" height="24" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="479" y="130" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>

  <text x="354" y="160" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">y &gt;&gt; 1</text>
  <rect x="362" y="144" width="30" height="24" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="377" y="160" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <rect x="396" y="144" width="30" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="411" y="160" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="430" y="144" width="30" height="24" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="445" y="160" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <rect x="464" y="144" width="30" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="479" y="160" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>

  <text x="354" y="190" text-anchor="end" font-size="10.5" font-weight="bold" fill="#555" filter="url(#rough2)">y &amp; (y&gt;&gt;1)</text>
  <rect x="362" y="174" width="30" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="377" y="190" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="396" y="174" width="30" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="411" y="190" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="430" y="174" width="30" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="445" y="190" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="464" y="174" width="30" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="479" y="190" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0</text>

  <text x="412" y="222" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">== 0 → 无相邻 00 ✓</text>

  <!-- 公式框 -->
  <rect x="30" y="240" width="460" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="260" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">合法 ⟺ y &amp; (y &gt;&gt; 1) == 0，其中 y = ~x &amp; m</text>
  <text x="260" y="279" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">枚举 x ∈ [0, 2ⁿ)，O(1) 判定，合法的 x 再格式化成 n 位二进制串</text>

  <!-- 警告框 -->
  <rect x="30" y="300" width="460" height="66" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">⚠️ 易错判据：「每格都被相邻的 1 覆盖」是错的！</text>
  <text x="260" y="339" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(x | x&lt;&lt;1 | x&gt;&gt;1) &amp; m == m 会把 "1001" 误判为合法</text>
  <text x="260" y="357" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">—— 它每格都挨着 1，却明明白白含 "00" 子串</text>
</svg>
