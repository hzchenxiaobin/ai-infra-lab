<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：定位 ch 首次出现 → 反转前缀 [0..i]</text>

  <!-- ===== Row 1: original word "abcdefd", ch='d' at index 3 ===== -->
  <text x="50" y="72" font-size="11" fill="#888">原串</text>

  <!-- index labels -->
  <text x="112" y="60" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="152" y="60" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="192" y="60" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="232" y="60" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">3 ← ch</text>
  <text x="272" y="60" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="312" y="60" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <text x="352" y="60" text-anchor="middle" font-size="9" fill="#aaa">6</text>

  <!-- prefix blocks [0..3] BLUE -->
  <rect x="92" y="72" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="95" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>

  <rect x="132" y="72" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="95" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>

  <rect x="172" y="72" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="95" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>

  <rect x="212" y="72" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="232" y="95" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>

  <!-- suffix blocks [4..6] GREY -->
  <rect x="252" y="72" width="40" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="272" y="95" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">e</text>

  <rect x="292" y="72" width="40" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="95" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">f</text>

  <rect x="332" y="72" width="40" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="95" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">d</text>

  <!-- prefix bracket -->
  <path d="M 92 116 Q 92 124 98 124 L 246 124 Q 252 124 252 116" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="172" y="140" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">前缀 [0..3]：待反转</text>

  <!-- suffix bracket -->
  <path d="M 252 116 Q 252 124 258 124 L 366 124 Q 372 124 372 116" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="312" y="140" text-anchor="middle" font-size="11" fill="#888">后缀 [4..]：不动</text>

  <!-- ===== Reverse arrow ===== -->
  <path d="M 232 158 Q 232 178 212 178" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="290" y="182" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">reverse [0..i]</text>
  <path d="M 348 158 Q 348 178 368 178" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- ===== Row 2: result "dcbaefd" ===== -->
  <text x="50" y="212" font-size="11" fill="#888">结果</text>

  <rect x="92" y="212" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="112" y="235" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>

  <rect x="132" y="212" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="152" y="235" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>

  <rect x="172" y="212" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="192" y="235" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>

  <rect x="212" y="212" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="232" y="235" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>

  <rect x="252" y="212" width="40" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="272" y="235" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">e</text>

  <rect x="292" y="212" width="40" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="235" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">f</text>

  <rect x="332" y="212" width="40" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="235" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">d</text>

  <path d="M 92 256 Q 92 264 98 264 L 246 264 Q 252 264 252 256" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="172" y="280" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">已反转："dcba"</text>

  <path d="M 252 256 Q 252 264 258 264 L 366 264 Q 372 264 372 256" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="312" y="280" text-anchor="middle" font-size="11" fill="#888">保持不变："efd"</text>

  <!-- ===== Core idea box ===== -->
  <rect x="40" y="298" width="500" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="320" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键直觉：ch 第一次出现的下标 i 把串切成两段</text>
  <text x="290" y="338" text-anchor="middle" font-size="11" fill="#666">前缀 [0..i] 原地双指针反转，后缀 [i+1..] 原封不动</text>
</svg>
