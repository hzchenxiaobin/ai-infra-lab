<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="370" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心：行 → 接缝掩码，墙坚实 ⟺ 所有行掩码按位与 = 0</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">width = 3，接缝位置 x ↔ 掩码第 x−1 位（位置1→第0位，位置2→第1位）</text>

  <!-- Position labels above wall -->
  <g font-size="10" fill="#b85450" font-weight="bold" text-anchor="middle">
    <text x="118" y="64">位置1</text>
    <text x="166" y="64">位置2</text>
  </g>

  <!-- ===== Row 1: [1,2]  (brick width1 | brick width2) ===== -->
  <text x="56" y="96" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">行1</text>
  <g filter="url(#rough2)">
    <rect x="70"  y="72" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3"/>
    <rect x="118" y="72" width="96" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
  </g>
  <g font-size="12" fill="#333" font-weight="bold" text-anchor="middle">
    <text x="94"  y="99">1</text>
    <text x="166" y="99">2</text>
    <text x="166" y="113" font-size="10" fill="#555">[1,2]</text>
  </g>
  <!-- crack at position 1 (x=118) for row 1 -->
  <line x1="118" y1="68" x2="118" y2="120" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Row 2: [2,1] ===== -->
  <text x="56" y="156" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">行2</text>
  <g filter="url(#rough2)">
    <rect x="70"  y="132" width="96" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="166" y="132" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3"/>
  </g>
  <g font-size="12" fill="#333" font-weight="bold" text-anchor="middle">
    <text x="118" y="159">2</text>
    <text x="190" y="159">1</text>
    <text x="118" y="173" font-size="10" fill="#555">[2,1]</text>
  </g>
  <!-- crack at position 2 (x=166) for row 2 -->
  <line x1="166" y1="128" x2="166" y2="180" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Vertical "贯穿检验" lines (full height, dashed) ===== -->
  <g stroke="#b85450" stroke-width="1.4" stroke-dasharray="2,3" opacity="0.55" filter="url(#rough2)">
    <line x1="118" y1="60" x2="118" y2="184"/>
    <line x1="166" y1="60" x2="166" y2="184"/>
  </g>
  <!-- Blocked marks: ✕ where a brick blocks the line -->
  <g stroke="#b85450" stroke-width="2.2" filter="url(#rough2)">
    <!-- position 1 (x=118): row2 has brick → blocked at row2 -->
    <line x1="111" y1="149" x2="125" y2="159"/>
    <line x1="125" y1="149" x2="111" y2="159"/>
    <!-- position 2 (x=166): row1 has brick → blocked at row1 -->
    <line x1="159" y1="89"  x2="173" y2="99"/>
    <line x1="173" y1="89"  x2="159" y2="99"/>
  </g>
  <g font-size="9.5" fill="#b85450" text-anchor="middle">
    <text x="118" y="198">位置1：行1有缝</text>
    <text x="118" y="210">行2砖阻断 ✕</text>
    <text x="166" y="198">位置2：行2有缝</text>
    <text x="166" y="210">行1砖阻断 ✕</text>
  </g>

  <!-- ===== Mask mapping (right side) ===== -->
  <g filter="url(#rough2)">
    <rect x="290" y="78" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <rect x="290" y="138" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <g font-size="12" fill="#333" font-weight="bold">
    <text x="300" y="100">行1 [1,2] → 接缝{1} → 掩码 01</text>
    <text x="300" y="160">行2 [2,1] → 接缝{2} → 掩码 10</text>
  </g>

  <!-- AND result box -->
  <rect x="290" y="196" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="410" y="216" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">按位与：01 &amp; 10 = 00</text>
  <text x="410" y="230" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">→ 每个位置都被某行砖阻断 ✓ 坚实</text>

  <!-- Bottom legend -->
  <rect x="40" y="252" width="480" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="11.5" fill="#555">
    红虚线 = 接缝（crack） · 红 ✕ = 砖块阻断竖线 · 掩码第 k 位 = 位置 k+1 是否有接缝
  </text>

  <!-- Sturdy vs non-sturdy mini contrast -->
  <g font-size="11" fill="#444">
    <text x="48" y="312" font-weight="bold" fill="#446688">对照（不坚实）：</text>
    <text x="160" y="312">若两行都为 [1,2] → 掩码 01 &amp; 01 = 01 ≠ 0</text>
    <text x="160" y="328" fill="#b85450">→ 位置1 在两行都有缝，竖线贯穿 ✗ 不坚实</text>
  </g>
  <rect x="40" y="296" width="480" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="48" y="312" font-size="11" fill="#446688" font-weight="bold">对照（不坚实）：</text>
  <text x="160" y="312" font-size="11" fill="#444">若两行都为 [1,2] → 掩码 01 &amp; 01 = 01 ≠ 0</text>
  <text x="160" y="330" font-size="11" fill="#b85450">→ 位置1 在两行都有缝，竖线贯穿 ✗ 不坚实</text>
</svg>
