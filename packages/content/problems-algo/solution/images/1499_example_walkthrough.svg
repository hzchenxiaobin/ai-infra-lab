<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：points=[[1,3],[2,0],[5,10],[6,−10]], k=1</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888">v = y − x，阈值 = xj − k，答案 ans 初始 −∞</text>

  <!-- ===== Table header ===== -->
  <g font-size="10" fill="#446688" font-weight="bold">
    <rect x="20" y="58" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="40" y="74" text-anchor="middle">步</text>
    <rect x="60" y="58" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="80" y="74" text-anchor="middle">j</text>
    <rect x="100" y="58" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="140" y="74" text-anchor="middle">(x, y)</text>
    <rect x="180" y="58" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="205" y="74" text-anchor="middle">v=y−x</text>
    <rect x="230" y="58" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="255" y="74" text-anchor="middle">xj−k</text>
    <rect x="280" y="58" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="340" y="74" text-anchor="middle">deque（下标:v）</text>
    <rect x="400" y="58" width="150" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="475" y="74" text-anchor="middle">动作</text>
    <rect x="550" y="58" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="570" y="74" text-anchor="middle">ans</text>
  </g>

  <!-- ===== Row 1: j=0 ===== -->
  <g font-size="10" fill="#333">
    <rect x="20" y="82" width="40" height="40" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
    <text x="40" y="106" text-anchor="middle">1</text>
    <rect x="60" y="82" width="40" height="40" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
    <text x="80" y="106" text-anchor="middle">0</text>
    <rect x="100" y="82" width="80" height="40" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
    <text x="140" y="106" text-anchor="middle">(1, 3)</text>
    <rect x="180" y="82" width="50" height="40" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
    <text x="205" y="106" text-anchor="middle">2</text>
    <rect x="230" y="82" width="50" height="40" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
    <text x="255" y="106" text-anchor="middle">0</text>
    <rect x="280" y="82" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="340" y="106" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[0:2]</text>
    <rect x="400" y="82" width="150" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="475" y="100" text-anchor="middle" fill="#555">队空无候选</text>
    <text x="475" y="114" text-anchor="middle" fill="#555">入队 0</text>
    <rect x="550" y="82" width="40" height="40" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
    <text x="570" y="106" text-anchor="middle" fill="#888">−∞</text>
  </g>

  <!-- ===== Row 2: j=1 (candidate=4) ===== -->
  <g font-size="10" fill="#333">
    <rect x="20" y="122" width="40" height="48" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
    <text x="40" y="150" text-anchor="middle">2</text>
    <rect x="60" y="122" width="40" height="48" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
    <text x="80" y="150" text-anchor="middle">1</text>
    <rect x="100" y="122" width="80" height="48" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
    <text x="140" y="150" text-anchor="middle">(2, 0)</text>
    <rect x="180" y="122" width="50" height="48" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
    <text x="205" y="150" text-anchor="middle">−2</text>
    <rect x="230" y="122" width="50" height="48" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
    <text x="255" y="150" text-anchor="middle">1</text>
    <rect x="280" y="122" width="120" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="340" y="150" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[0:2, 1:−2]</text>
    <rect x="400" y="122" width="150" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="475" y="136" text-anchor="middle" fill="#555">x₀=1≥1 不过期</text>
    <text x="475" y="150" text-anchor="middle" fill="#b85450" font-weight="bold">候选=2+(0+2)=4</text>
    <text x="475" y="164" text-anchor="middle" fill="#555">v₀&gt;−2 不弹；入队1</text>
    <rect x="550" y="122" width="40" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="570" y="150" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
  </g>

  <!-- ===== Row 3: j=2 (expire both) ===== -->
  <g font-size="10" fill="#333">
    <rect x="20" y="170" width="40" height="56" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
    <text x="40" y="202" text-anchor="middle">3</text>
    <rect x="60" y="170" width="40" height="56" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
    <text x="80" y="202" text-anchor="middle">2</text>
    <rect x="100" y="170" width="80" height="56" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
    <text x="140" y="202" text-anchor="middle">(5, 10)</text>
    <rect x="180" y="170" width="50" height="56" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
    <text x="205" y="202" text-anchor="middle">5</text>
    <rect x="230" y="170" width="50" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="255" y="202" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <rect x="280" y="170" width="120" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="340" y="202" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[2:5]</text>
    <rect x="400" y="170" width="150" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="475" y="184" text-anchor="middle" fill="#b85450" font-weight="bold">x₀=1&lt;4 过期弹</text>
    <text x="475" y="198" text-anchor="middle" fill="#b85450" font-weight="bold">x₁=2&lt;4 过期弹</text>
    <text x="475" y="212" text-anchor="middle" fill="#555">队空无候选；入队2</text>
    <rect x="550" y="170" width="40" height="56" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
    <text x="570" y="202" text-anchor="middle" fill="#888">4</text>
  </g>

  <!-- ===== Row 4: j=3 (candidate=1) ===== -->
  <g font-size="10" fill="#333">
    <rect x="20" y="226" width="40" height="48" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
    <text x="40" y="254" text-anchor="middle">4</text>
    <rect x="60" y="226" width="40" height="48" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
    <text x="80" y="254" text-anchor="middle">3</text>
    <rect x="100" y="226" width="80" height="48" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
    <text x="140" y="254" text-anchor="middle">(6, −10)</text>
    <rect x="180" y="226" width="50" height="48" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
    <text x="205" y="254" text-anchor="middle">−16</text>
    <rect x="230" y="226" width="50" height="48" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
    <text x="255" y="254" text-anchor="middle">5</text>
    <rect x="280" y="226" width="120" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="340" y="254" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[2:5, 3:−16]</text>
    <rect x="400" y="226" width="150" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="475" y="240" text-anchor="middle" fill="#555">x₂=5≥5 不过期</text>
    <text x="475" y="254" text-anchor="middle" fill="#555">候选=5+(−10+6)=1</text>
    <text x="475" y="268" text-anchor="middle" fill="#555">v₂&gt;−16 不弹；入队3</text>
    <rect x="550" y="226" width="40" height="48" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
    <text x="570" y="254" text-anchor="middle" fill="#888">4</text>
  </g>

  <!-- ===== Key insight box ===== -->
  <rect x="20" y="296" width="600" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="316" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">步骤 3 是关键：j=2 时阈值升到 4，队头 x₀=1、x₁=2 都 &lt; 4，连续过期弹出</text>
  <text x="320" y="332" text-anchor="middle" font-size="10" fill="#555">尽管 v₀=2 是此前最大的 (y−x)，但已超出 k 的距离限制，必须丢弃</text>
  <text x="320" y="346" text-anchor="middle" font-size="10" fill="#555">这正是"x 差窗口"与"下标差窗口"的区别：过期看 x 值而非下标</text>

  <!-- ===== Answer ===== -->
  <rect x="20" y="366" width="600" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="388" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最终答案 = 4，对应 i=0, j=1：3 + 0 + |1−2| = 4</text>
  <text x="320" y="406" text-anchor="middle" font-size="10" fill="#555">每点入队 1 次、出队 1 次，总操作 ≤ 2n，均摊 O(n)</text>
</svg>
