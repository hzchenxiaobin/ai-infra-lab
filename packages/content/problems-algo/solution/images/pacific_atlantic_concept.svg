<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：从海洋边界反向搜索</text>
  <text x="270" y="48" text-anchor="middle" font-size="11" fill="#888">水往低处流 → 反过来从海洋往内陆"逆流而上"（往不低于当前的高度走）</text>

  <!-- Pacific ocean strips (top + left) -->
  <g filter="url(#rough2)">
    <rect x="110" y="74" width="260" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="240" y="88" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">太平洋 Pacific（上边）</text>
    <rect x="92" y="92" width="20" height="200" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="102" y="195" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" transform="rotate(-90 102 195)">太平洋（左边）</text>

    <!-- Atlantic ocean strips (bottom + right) -->
    <rect x="110" y="294" width="260" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="240" y="308" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">大西洋 Atlantic（下边）</text>
    <rect x="368" y="92" width="20" height="200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="378" y="195" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" transform="rotate(-90 378 195)">大西洋（右边）</text>
  </g>

  <!-- 4x4 height grid -->
  <g filter="url(#rough2)" font-size="14" font-weight="bold">
    <!-- row0 -->
    <rect x="112" y="94" width="62" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/><text x="143" y="123" text-anchor="middle" fill="#555">4</text>
    <rect x="174" y="94" width="62" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/><text x="205" y="123" text-anchor="middle" fill="#555">3</text>
    <rect x="236" y="94" width="62" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/><text x="267" y="123" text-anchor="middle" fill="#555">2</text>
    <rect x="298" y="94" width="62" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/><text x="329" y="123" text-anchor="middle" fill="#555">1</text>
    <!-- row1 -->
    <rect x="112" y="142" width="62" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/><text x="143" y="171" text-anchor="middle" fill="#555">3</text>
    <rect x="174" y="142" width="62" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/><text x="205" y="171" text-anchor="middle" fill="#555">2</text>
    <rect x="236" y="142" width="62" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/><text x="267" y="171" text-anchor="middle" fill="#555">3</text>
    <rect x="298" y="142" width="62" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/><text x="329" y="171" text-anchor="middle" fill="#555">2</text>
    <!-- row2 -->
    <rect x="112" y="190" width="62" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/><text x="143" y="219" text-anchor="middle" fill="#555">2</text>
    <rect x="174" y="190" width="62" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/><text x="205" y="219" text-anchor="middle" fill="#555">1</text>
    <rect x="236" y="190" width="62" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/><text x="267" y="219" text-anchor="middle" fill="#555">2</text>
    <rect x="298" y="190" width="62" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/><text x="329" y="219" text-anchor="middle" fill="#555">3</text>
    <!-- row3 -->
    <rect x="112" y="238" width="62" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/><text x="143" y="267" text-anchor="middle" fill="#555">1</text>
    <rect x="174" y="238" width="62" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/><text x="205" y="267" text-anchor="middle" fill="#555">2</text>
    <rect x="236" y="238" width="62" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/><text x="267" y="267" text-anchor="middle" fill="#555">3</text>
    <rect x="298" y="238" width="62" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/><text x="329" y="267" text-anchor="middle" fill="#555">4</text>
  </g>

  <!-- reverse search arrows: Pacific (top→down into row0, left→right into col0) -->
  <g filter="url(#rough2)">
    <path d="M 143 96 L 143 84" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" transform="translate(0,0)"/>
    <path d="M 329 96 L 329 84" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)"/>
    <path d="M 114 265 L 100 265" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)"/>
    <path d="M 114 119 L 100 119" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)"/>

    <!-- reverse search arrows: Atlantic (bottom→up into last row, right→left into last col) -->
    <path d="M 143 292 L 143 282" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arrO)"/>
    <path d="M 329 292 L 329 282" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arrO)"/>
    <path d="M 366 265 L 356 265" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arrO)"/>
    <path d="M 366 119 L 356 119" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arrO)"/>
  </g>

  <!-- explanation boxes on the right -->
  <g filter="url(#rough2)" font-size="11">
    <rect x="410" y="96" width="118" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="469" y="116" text-anchor="middle" fill="#446688" font-weight="bold">太平洋搜索 P</text>
    <text x="469" y="132" text-anchor="middle" fill="#555" font-size="10">从第 0 行、第 0 列</text>
    <text x="469" y="146" text-anchor="middle" fill="#555" font-size="10">逆流而上 → 集合 P</text>

    <rect x="410" y="170" width="118" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8"/>
    <text x="469" y="190" text-anchor="middle" fill="#d6a040" font-weight="bold">大西洋搜索 A</text>
    <text x="469" y="206" text-anchor="middle" fill="#555" font-size="10">从末行、末列</text>
    <text x="469" y="220" text-anchor="middle" fill="#555" font-size="10">逆流而上 → 集合 A</text>

    <rect x="410" y="244" width="118" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="469" y="262" text-anchor="middle" fill="#4a7a3a" font-weight="bold">答案 = P ∩ A</text>
    <text x="469" y="278" text-anchor="middle" fill="#555" font-size="10">两集合交集</text>
  </g>

  <text x="270" y="354" text-anchor="middle" font-size="11" fill="#888">蓝箭头=太平洋反向扩散方向｜橙箭头=大西洋反向扩散方向｜只走"高度 ≥ 当前"的邻居</text>
</svg>
