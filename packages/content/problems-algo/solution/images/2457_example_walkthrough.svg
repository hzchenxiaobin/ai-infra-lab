<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 467, target = 6</text>

  <!-- ===== Example 1 table ===== -->
  <!-- columns: p | base | prefix | prefix+1 | dsum | m_p | verdict -->
  <!-- centers: 70 | 140 | 210 | 285 | 360 | 435 | 515 -->
  <rect x="40" y="42" width="540" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <g font-size="11" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="70" y="60">p</text>
    <text x="140" y="60">base=10^p</text>
    <text x="210" y="60">prefix</text>
    <text x="285" y="60">prefix+1</text>
    <text x="360" y="60">dsum</text>
    <text x="435" y="60">候选 m_p</text>
    <text x="515" y="60">≤6?</text>
  </g>

  <!-- row p=0 -->
  <rect x="40" y="72" width="540" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="70" y="90" font-weight="bold">0</text>
    <text x="140" y="90">1</text>
    <text x="210" y="90">467</text>
    <text x="285" y="90">468</text>
    <text x="360" y="90">18</text>
    <text x="435" y="90">468</text>
    <text x="515" y="90" fill="#b85450" font-weight="bold">✗</text>
  </g>

  <!-- row p=1 -->
  <rect x="40" y="102" width="540" height="28" fill="#f6f8fb" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="70" y="120" font-weight="bold">1</text>
    <text x="140" y="120">10</text>
    <text x="210" y="120">46</text>
    <text x="285" y="120">47</text>
    <text x="360" y="120">11</text>
    <text x="435" y="120">470</text>
    <text x="515" y="120" fill="#b85450" font-weight="bold">✗</text>
  </g>

  <!-- row p=2 (winner) -->
  <rect x="40" y="132" width="540" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="70" y="151" fill="#4a7a3a">2</text>
    <text x="140" y="151">100</text>
    <text x="210" y="151">4</text>
    <text x="285" y="151">5</text>
    <text x="360" y="151" fill="#4a7a3a">5</text>
    <text x="435" y="151">500</text>
    <text x="515" y="151" fill="#4a7a3a">✓</text>
  </g>

  <!-- arrow to result -->
  <path d="M 270 164 L 270 180" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- result box ex1 -->
  <rect x="120" y="182" width="300" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="204" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">x = m_2 − n = 500 − 467 = 33  ✓</text>

  <!-- ===== Example 2 ===== -->
  <text x="300" y="246" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">再验：n = 16, target = 6</text>

  <rect x="120" y="256" width="360" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <g font-size="11" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="160" y="274">p</text>
    <text x="240" y="274">prefix+1</text>
    <text x="335" y="274">dsum</text>
    <text x="430" y="274">候选 m_p</text>
  </g>

  <rect x="120" y="286" width="360" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="160" y="304" font-weight="bold">0</text>
    <text x="240" y="304">17</text>
    <text x="335" y="304">8</text>
    <text x="430" y="304">17</text>
    <text x="450" y="304" fill="#b85450" font-weight="bold" text-anchor="start"> ✗</text>
  </g>

  <rect x="120" y="314" width="360" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="160" y="333" fill="#4a7a3a">1</text>
    <text x="240" y="333">2</text>
    <text x="335" y="333" fill="#4a7a3a">2</text>
    <text x="430" y="333">20</text>
    <text x="450" y="333" fill="#4a7a3a" text-anchor="start"> ✓</text>
  </g>

  <!-- arrow -->
  <path d="M 300 344 L 300 360" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- result box ex2 -->
  <rect x="150" y="362" width="300" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="384" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">x = 20 − 16 = 4  ✓</text>

  <!-- note -->
  <rect x="40" y="416" width="520" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)" opacity="0.55"/>
  <text x="300" y="434" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">观察：数位和随 p 递减（17→18→11→5；7→8→2）</text>
  <text x="300" y="450" text-anchor="middle" font-size="10" fill="#888">非 9 结尾时 p=0 不进位、和反升；首个 ≤ target 的候选即最小 m，无需枚举 x</text>
</svg>
