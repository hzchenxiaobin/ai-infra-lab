<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">括号的分数：三种计分规则</text>
  <path d="M 170 38 Q 280 46 390 38" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 规则 1: () = 1 -->
  <rect x="40" y="60" width="150" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="115" y="82" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">规则 1 · 原子</text>
  <rect x="64" y="92" width="26" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="77" y="111" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">()</text>
  <text x="104" y="111" font-size="13" fill="#888">→</text>
  <rect x="120" y="92" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="140" y="111" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>
  <text x="115" y="128" text-anchor="middle" font-size="9.5" fill="#666">一对相邻括号 = 1 分</text>

  <!-- 规则 2: AB = A + B -->
  <rect x="205" y="60" width="160" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="285" y="82" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">规则 2 · 拼接</text>
  <text x="285" y="112" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">AB → A + B</text>
  <text x="285" y="128" text-anchor="middle" font-size="9.5" fill="#666">相邻两段：分数相加</text>

  <!-- 规则 3: (A) = 2 * A -->
  <rect x="380" y="60" width="150" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="455" y="82" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">规则 3 · 嵌套</text>
  <text x="455" y="112" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">(A) → 2 × A</text>
  <text x="455" y="128" text-anchor="middle" font-size="9.5" fill="#666">外层包一层：分数翻倍</text>

  <!-- 栈建模分隔 -->
  <text x="280" y="172" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">栈建模：每一层一个累加器</text>

  <!-- 栈规则框 -->
  <rect x="40" y="184" width="490" height="120" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.4" rx="10" filter="url(#rough2)"/>

  <text x="60" y="208" font-size="11" fill="#333" font-weight="bold">① 初始：栈 = [0]（最外层累加器）</text>

  <rect x="60" y="220" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="240" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">(</text>
  <text x="172" y="240" font-size="11.5" fill="#555">→ 压入 0（为新嵌套层开一个累加器）</text>

  <rect x="60" y="258" width="100" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="278" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">)</text>
  <text x="172" y="270" font-size="11" fill="#555">→ 弹出 v：</text>
  <text x="172" y="286" font-size="10.5" fill="#b85450">v==0 即 "()" 得 1；否则 "(A)" 得 2×v；</text>
  <text x="330" y="286" font-size="10.5" fill="#4a7a3a" font-weight="bold">再加到新栈顶</text>

  <!-- 结算示意 -->
  <text x="280" y="332" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">扫描结束 → 栈底那唯一的值即答案</text>

  <rect x="200" y="344" width="160" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="11" fill="#666">栈（仅剩一个值）</text>
  <text x="280" y="380" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">→ score</text>

  <path d="M 280 388 L 280 402" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="280" y="420" text-anchor="middle" font-size="10.5" fill="#888">时间 O(n)　空间 O(n)</text>
</svg>
