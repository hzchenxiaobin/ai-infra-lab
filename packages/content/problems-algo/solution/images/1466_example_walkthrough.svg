<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1 演算：DFS 逐边判定，3 条朝外边 → ans = 3</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">connections = [[0,1],[1,3],[2,3],[4,0],[4,5]]，以 0 为根</text>

  <!-- Table frame -->
  <rect x="40" y="60" width="480" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- Header text -->
  <text x="65"  y="83" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步骤</text>
  <text x="112" y="83" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">u</text>
  <text x="157" y="83" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">v</text>
  <text x="227" y="83" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">原始方向</text>
  <text x="315" y="83" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">u 为父?</text>
  <text x="387" y="83" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">need</text>
  <text x="470" y="83" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans</text>

  <!-- Column separators (header) -->
  <line x1="90"  y1="60" x2="90"  y2="96" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="135" y1="60" x2="135" y2="96" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="180" y1="60" x2="180" y2="96" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="275" y1="60" x2="275" y2="96" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="355" y1="60" x2="355" y2="96" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="420" y1="60" x2="420" y2="96" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- Row 1: 0->1 red -->
  <rect x="40" y="96" width="480" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65"  y="120" text-anchor="middle" font-size="11.5" fill="#333">①</text>
  <text x="112" y="120" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="157" y="120" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="227" y="120" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">0 → 1</text>
  <text x="315" y="120" text-anchor="middle" font-size="11.5" fill="#333">是</text>
  <text x="387" y="120" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">1</text>
  <text x="470" y="120" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">1</text>

  <!-- Row 2: 1->3 red -->
  <rect x="40" y="134" width="480" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65"  y="158" text-anchor="middle" font-size="11.5" fill="#333">②</text>
  <text x="112" y="158" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="157" y="158" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="227" y="158" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">1 → 3</text>
  <text x="315" y="158" text-anchor="middle" font-size="11.5" fill="#333">是</text>
  <text x="387" y="158" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">1</text>
  <text x="470" y="158" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2</text>

  <!-- Row 3: 2->3 green -->
  <rect x="40" y="172" width="480" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65"  y="196" text-anchor="middle" font-size="11.5" fill="#333">③</text>
  <text x="112" y="196" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="157" y="196" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="227" y="196" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">2 → 3</text>
  <text x="315" y="196" text-anchor="middle" font-size="11.5" fill="#333">是</text>
  <text x="387" y="196" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="470" y="196" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2</text>

  <!-- Row 4: 4->0 green -->
  <rect x="40" y="210" width="480" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65"  y="234" text-anchor="middle" font-size="11.5" fill="#333">④</text>
  <text x="112" y="234" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="157" y="234" text-anchor="middle" font-size="11.5" fill="#333">4</text>
  <text x="227" y="234" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">4 → 0</text>
  <text x="315" y="234" text-anchor="middle" font-size="11.5" fill="#333">是</text>
  <text x="387" y="234" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="470" y="234" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2</text>

  <!-- Row 5: 4->5 red (final) -->
  <rect x="40" y="248" width="480" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="65"  y="272" text-anchor="middle" font-size="11.5" fill="#333">⑤</text>
  <text x="112" y="272" text-anchor="middle" font-size="11.5" fill="#333">4</text>
  <text x="157" y="272" text-anchor="middle" font-size="11.5" fill="#333">5</text>
  <text x="227" y="272" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">4 → 5</text>
  <text x="315" y="272" text-anchor="middle" font-size="11.5" fill="#333">是</text>
  <text x="387" y="272" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">1</text>
  <text x="470" y="272" text-anchor="middle" font-size="12"   fill="#b85450" font-weight="bold">3</text>

  <!-- Summary box -->
  <rect x="60" y="300" width="440" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="321" text-anchor="middle" font-size="11" fill="#333">红行 need=1 朝外翻转（3 条）；绿行 need=0 朝内不动 — 合计 ans = 3</text>
</svg>
