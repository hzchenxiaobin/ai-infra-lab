<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：滚动余数 r，一遍扫描逐位判断可整除性</text>

  <!-- Step 1: r = 0 -->
  <rect x="160" y="44" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="61" text-anchor="middle" font-size="11.5" fill="#888">第 1 步（初始化）</text>
  <text x="270" y="78" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">r = 0</text>

  <path d="M 270 86 L 270 100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop diamond -->
  <polygon points="270,102 380,150 270,198 160,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="11.5" fill="#888">遍历</text>
  <text x="270" y="162" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">i = 0 … n−1</text>
  <text x="270" y="178" text-anchor="middle" font-size="10.5" fill="#888">d = word[i] − '0'</text>

  <path d="M 270 198 L 270 212" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop body -->
  <rect x="60" y="216" width="420" height="92" fill="#fafafa" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="233" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">循环体（余数滚动）</text>

  <rect x="78" y="240" width="384" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="259" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">① r = (r × 10 + d) % m</text>

  <rect x="78" y="272" width="384" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="291" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">② div[i] = 1 if r == 0 else 0</text>

  <!-- loop back arrow to diamond right side -->
  <path d="M 480 256 Q 510 256 510 150 Q 510 122 380 150" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5,4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="520" y="206" text-anchor="middle" font-size="10.5" fill="#4a7a3a">回到</text>
  <text x="520" y="220" text-anchor="middle" font-size="10.5" fill="#4a7a3a">下一个 i</text>

  <!-- exit arrow to return -->
  <path d="M 270 316 L 270 332" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: return div -->
  <rect x="160" y="336" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="353" text-anchor="middle" font-size="11.5" fill="#888">第 3 步</text>
  <text x="270" y="370" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">返回 div</text>

  <!-- side note: no overflow -->
  <rect x="40" y="400" width="460" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="270" y="419" text-anchor="middle" font-size="10.5" fill="#888">注：r &lt; m ≤ 10⁹，故 r×10+d ≤ 10¹⁰，C++ 用 long long 即可，不会溢出</text>
</svg>
