<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：enc1=[[1,3],[2,1],[3,2]], enc2=[[2,3],[3,3]]</text>

  <!-- ===== Step table ===== -->
  <text x="40" y="48" font-size="11" fill="#555" font-weight="bold">逐步执行（展开后等价 [1,1,1,2,3,3] × [2,2,2,3,3,3] = [2,2,2,6,9,9]）</text>

  <!-- table header -->
  <rect x="30" y="56" width="40" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="72" text-anchor="middle" font-size="10" fill="#666">步</text>
  <rect x="70" y="56" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="115" y="72" text-anchor="middle" font-size="10" fill="#666">enc1[i]</text>
  <rect x="160" y="56" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="72" text-anchor="middle" font-size="10" fill="#666">enc2[j]</text>
  <rect x="250" y="56" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="275" y="72" text-anchor="middle" font-size="10" fill="#666">f</text>
  <rect x="300" y="56" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="335" y="72" text-anchor="middle" font-size="10" fill="#666">v=v₁×v₂</text>
  <rect x="370" y="56" width="160" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="450" y="72" text-anchor="middle" font-size="10" fill="#666">ans（追加/合并）</text>

  <!-- row 1 -->
  <rect x="30" y="80" width="40" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="96" text-anchor="middle" font-size="10" fill="#666">1</text>
  <rect x="70" y="80" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="115" y="96" text-anchor="middle" font-size="10" fill="#333">[1, 3]</text>
  <rect x="160" y="80" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="96" text-anchor="middle" font-size="10" fill="#333">[2, 3]</text>
  <rect x="250" y="80" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="275" y="96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="300" y="80" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="335" y="96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="370" y="80" width="160" height="24" fill="#f5f5f5" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="450" y="96" text-anchor="middle" font-size="10" fill="#333">[[2, 3]] ← 追加</text>

  <!-- row 2 -->
  <rect x="30" y="104" width="40" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="120" text-anchor="middle" font-size="10" fill="#666">2</text>
  <rect x="70" y="104" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="115" y="120" text-anchor="middle" font-size="10" fill="#333">[2, 1]</text>
  <rect x="160" y="104" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="120" text-anchor="middle" font-size="10" fill="#333">[3, 3]</text>
  <rect x="250" y="104" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="275" y="120" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="300" y="104" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="335" y="120" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <rect x="370" y="104" width="160" height="24" fill="#f5f5f5" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="450" y="120" text-anchor="middle" font-size="10" fill="#333">[[2,3],[6,1]] ← 追加</text>

  <!-- row 3 -->
  <rect x="30" y="128" width="40" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="144" text-anchor="middle" font-size="10" fill="#666">3</text>
  <rect x="70" y="128" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="115" y="144" text-anchor="middle" font-size="10" fill="#333">[3, 2]</text>
  <rect x="160" y="128" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="144" text-anchor="middle" font-size="10" fill="#333">[3, 2]</text>
  <rect x="250" y="128" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="275" y="144" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="300" y="128" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="335" y="144" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">9</text>
  <rect x="370" y="128" width="160" height="24" fill="#f5f5f5" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="450" y="144" text-anchor="middle" font-size="10" fill="#333">[…,[9,2]] ← 追加</text>

  <!-- note for step 3 -->
  <text x="280" y="170" text-anchor="middle" font-size="10" fill="#888">步骤 3：enc1[2] 剩余 freq 2 = enc2[1] 剩余 freq 2，同时耗尽，i、j 均前进</text>

  <!-- ===== Visual: expanded arrays and product ===== -->
  <text x="40" y="198" font-size="12" fill="#555" font-weight="bold">展开视角（验证正确性）</text>

  <!-- nums1 -->
  <text x="40" y="224" font-size="11" fill="#446688">nums1:</text>
  <rect x="92" y="208" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="227" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="134" y="208" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="227" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="176" y="208" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="197" y="227" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="218" y="208" width="42" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="227" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="260" y="208" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="281" y="227" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="302" y="208" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="323" y="227" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <!-- multiply sign -->
  <text x="365" y="227" font-size="16" fill="#888">×</text>

  <!-- nums2 -->
  <text x="40" y="262" font-size="11" fill="#4a7a3a">nums2:</text>
  <rect x="92" y="246" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="265" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="134" y="246" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="265" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="176" y="246" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="197" y="265" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="218" y="246" width="42" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="265" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="260" y="246" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="281" y="265" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="302" y="246" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="323" y="265" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <!-- arrow down -->
  <path d="M 205 280 L 205 296" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- prodNums -->
  <text x="40" y="320" font-size="11" fill="#b85450">prod:</text>
  <rect x="92" y="304" width="42" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="113" y="323" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="134" y="304" width="42" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="323" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="176" y="304" width="42" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="197" y="323" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="218" y="304" width="42" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="239" y="323" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <rect x="260" y="304" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="323" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <rect x="302" y="304" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="323" y="323" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>

  <!-- grouping brackets -->
  <path d="M 92 340 Q 113 348 134 340" stroke="#b85450" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 134 340 Q 155 348 176 340" stroke="#b85450" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 134 340 L 134 350" stroke="#b85450" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="134" y="364" text-anchor="middle" font-size="10" fill="#b85450">→ [2,3]</text>

  <text x="239" y="364" text-anchor="middle" font-size="10" fill="#d6a040">→ [6,1]</text>

  <path d="M 260 340 Q 281 348 302 340" stroke="#4a7a3a" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 302 340 Q 323 348 344 340" stroke="#4a7a3a" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 302 340 L 302 350" stroke="#4a7a3a" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="302" y="364" text-anchor="middle" font-size="10" fill="#4a7a3a">→ [9,2]</text>

  <!-- final answer -->
  <rect x="100" y="384" width="360" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="408" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">答案：[[2,3], [6,1], [9,2]]</text>

  <!-- footnote -->
  <text x="280" y="440" text-anchor="middle" font-size="10" fill="#888">三步双指针模拟，无需真正展开数组；同值段自动合并保证最短</text>
  <text x="280" y="456" text-anchor="middle" font-size="10" fill="#888">步骤 1 中 min(3,3)=3 一次性消耗完两段，i、j 同时前进</text>
</svg>
