<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：排序定取数顺序，「Bob 先放」定组内交换</text>

  <!-- legend -->
  <rect x="336" y="38" width="12" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="352" y="49" font-size="10.5" fill="#446688" filter="url(#rough2)">Alice（先取，后放）</text>
  <rect x="336" y="54" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="352" y="65" font-size="10.5" fill="#d6a040" filter="url(#rough2)">Bob（后取，先放）</text>

  <!-- Section A: sorted array, grouped in pairs -->
  <text x="28" y="52" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">排序后两两一组：</text>

  <text x="86" y="94" text-anchor="end" font-size="11" fill="#4a7a3a" filter="url(#rough2)">第 1 轮</text>
  <text x="242" y="94" text-anchor="end" font-size="11" fill="#4a7a3a" filter="url(#rough2)">第 2 轮</text>

  <rect x="90" y="64" width="112" height="54" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <rect x="246" y="64" width="112" height="54" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>

  <!-- row A cells -->
  <rect x="96" y="70" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="91" text-anchor="middle" font-size="14" fill="#2f4d6b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="118" y="105" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">A</text>

  <rect x="150" y="70" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="172" y="91" text-anchor="middle" font-size="14" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="172" y="105" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">B</text>

  <rect x="252" y="70" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="274" y="91" text-anchor="middle" font-size="14" fill="#2f4d6b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="274" y="105" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">A</text>

  <rect x="306" y="70" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="91" text-anchor="middle" font-size="14" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="328" y="105" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">B</text>

  <!-- arrows down -->
  <path d="M 146 122 L 146 166" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 302 122 L 302 166" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="384" y="140" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">Bob 先放 b（大的）</text>
  <text x="384" y="158" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">Alice 后放 a（小的）</text>

  <!-- Section B: arr cells -->
  <rect x="96" y="172" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="193" text-anchor="middle" font-size="14" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="118" y="207" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">B</text>

  <rect x="150" y="172" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="172" y="193" text-anchor="middle" font-size="14" fill="#2f4d6b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="172" y="207" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">A</text>

  <rect x="252" y="172" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="274" y="193" text-anchor="middle" font-size="14" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="274" y="207" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">B</text>

  <rect x="306" y="172" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="193" text-anchor="middle" font-size="14" fill="#2f4d6b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="328" y="207" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">A</text>

  <text x="118" y="228" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">b₁</text>
  <text x="172" y="228" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">a₁</text>
  <text x="274" y="228" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">b₂</text>
  <text x="328" y="228" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">a₂</text>

  <!-- conclusion box -->
  <rect x="48" y="244" width="424" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">每轮：Alice 取剩余最小 a，Bob 取次小 b，arr 依序追加 b、a</text>
  <text x="260" y="292" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">arr = 排序后相邻两两交换的结果</text>
  <text x="260" y="314" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">即 [a₁,a₂,a₃,a₄,…] → [a₂,a₁,a₄,a₃,…]</text>

  <!-- warning box -->
  <rect x="48" y="344" width="424" height="44" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="362" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">⚠️ 长度为偶数：恰好配成 n/2 对，交换不落单、不越界</text>
  <text x="260" y="380" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">若规则改为 Alice 先放：组内不交换 ⇒ arr = sort(nums)</text>
</svg>
