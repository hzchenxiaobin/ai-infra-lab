<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">锁定与可改：两趟扫描的两条不变式</text>
  <text x="290" y="50" text-anchor="middle" font-size="11" fill="#888">s = “))()))”，locked = “010100” —— 锁定位固定，可改位二义（左/右，无空）</text>

  <!-- ===== 顶部：字符串格子 ===== -->
  <text x="60" y="86" font-size="11" fill="#888">下标</text>
  <text x="60" y="110" font-size="11" fill="#888">s</text>
  <text x="60" y="134" font-size="11" fill="#888">locked</text>

  <!-- 6 格 s -->
  <g filter="url(#rough2)">
    <!-- 0 可改 -->
    <rect x="120" y="96" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4,3" rx="4"/>
    <text x="143" y="116" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">)</text>
    <!-- 1 锁定 ) -->
    <rect x="168" y="96" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="191" y="116" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">)</text>
    <!-- 2 可改 -->
    <rect x="216" y="96" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4,3" rx="4"/>
    <text x="239" y="116" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">(</text>
    <!-- 3 锁定 ) -->
    <rect x="264" y="96" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="287" y="116" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">)</text>
    <!-- 4 可改 -->
    <rect x="312" y="96" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4,3" rx="4"/>
    <text x="335" y="116" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">)</text>
    <!-- 5 可改 -->
    <rect x="360" y="96" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4,3" rx="4"/>
    <text x="383" y="116" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">)</text>
  </g>

  <!-- 下标行 -->
  <g filter="url(#rough2)" font-size="10" fill="#888" text-anchor="middle">
    <text x="143" y="86">0</text><text x="191" y="86">1</text><text x="239" y="86">2</text>
    <text x="287" y="86">3</text><text x="335" y="86">4</text><text x="383" y="86">5</text>
  </g>
  <!-- locked 行 -->
  <g filter="url(#rough2)" font-size="10" fill="#555" text-anchor="middle">
    <text x="143" y="134">0</text><text x="191" y="134">1</text><text x="239" y="134">0</text>
    <text x="287" y="134">1</text><text x="335" y="134">0</text><text x="383" y="134">0</text>
  </g>

  <!-- 图例 -->
  <g filter="url(#rough2)" font-size="10" fill="#555">
    <rect x="425" y="100" width="16" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="3,2" rx="3"/>
    <text x="448" y="110">可改位（左/右）</text>
    <rect x="425" y="118" width="16" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
    <text x="448" y="128">锁定位（固定）</text>
  </g>

  <!-- ===== 左侧：第一趟 左→右 ===== -->
  <rect x="40" y="168" width="240" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="190" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">第一趟：左 → 右</text>
  <text x="160" y="208" text-anchor="middle" font-size="11" fill="#333">可改位 当 ‘(’ （乐观上界）</text>
  <text x="160" y="226" text-anchor="middle" font-size="11" fill="#333">balance += 1（可改 / 锁‘(’）</text>
  <text x="160" y="242" text-anchor="middle" font-size="11" fill="#333">balance −= 1（锁‘)’）</text>
  <text x="160" y="258" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">若 balance &lt; 0 → false</text>
  <path d="M 150 278 L 170 278" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="160" y="294" text-anchor="middle" font-size="10" fill="#446688">盯「右括号不过早」</text>

  <!-- ===== 右侧：第二趟 右→左 ===== -->
  <rect x="300" y="168" width="240" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="190" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">第二趟：右 → 左</text>
  <text x="420" y="208" text-anchor="middle" font-size="11" fill="#333">可改位 当 ‘)’ （乐观上界）</text>
  <text x="420" y="226" text-anchor="middle" font-size="11" fill="#333">balance += 1（可改 / 锁‘)’）</text>
  <text x="420" y="242" text-anchor="middle" font-size="11" fill="#333">balance −= 1（锁‘(’）</text>
  <text x="420" y="258" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">若 balance &lt; 0 → false</text>
  <path d="M 430 278 L 410 278" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="420" y="294" text-anchor="middle" font-size="10" fill="#b85450">盯「左括号不过早」</text>

  <!-- ===== 底部：总闸 + 结论 ===== -->
  <rect x="40" y="312" width="500" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="334" font-size="12" fill="#d6a040" font-weight="bold">💡 三条件充分必要</text>
  <text x="60" y="352" font-size="11" fill="#555">① 长度为偶数（总闸，放最前快速失败）</text>
  <text x="60" y="368" font-size="11" fill="#555">② 任意前缀「潜在‘(’」≥「锁‘)’」   ③ 任意后缀「潜在‘)’」≥「锁‘(’」</text>
  <text x="60" y="382" font-size="11" fill="#4a7a3a" font-weight="bold">三条同时成立 ⟺ 存在合法赋值 → true</text>
</svg>
