<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：建表 → 扣表 → 见零即假，扫完即真</text>

  <rect x="150" y="42" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">块长 m = n / k（题目保证整除）</text>

  <path d="M 260 74 L 260 90" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="135" y="94" width="250" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="117" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">① 把 s 切成 k 块：cnt[s 块] += 1</text>

  <path d="M 260 130 L 260 144" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="135" y="148" width="250" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="171" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">② 取 t 的下一块 t[i : i+m]</text>

  <path d="M 260 184 L 260 200" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,200 344,240 260,280 176,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="237" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">cnt[块] &gt; 0 ?</text>
  <text x="260" y="254" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">（s 里还有这块存货吗）</text>

  <path d="M 344 240 L 398 240" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="366" y="232" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="402" y="222" width="104" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="454" y="245" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">return false</text>

  <path d="M 260 280 L 260 296" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="292" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="135" y="300" width="250" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="323" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">③ cnt[块] −= 1，i += m</text>

  <path d="M 135 318 H 70 V 166 H 131" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="66" y="244" text-anchor="middle" font-size="9.5" fill="#2f5d24" transform="rotate(-90 66 244)" filter="url(#rough2)">还有块 → 回到 ②</text>

  <path d="M 260 336 L 260 352" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="274" y="348" font-size="10" fill="#4a7a3a" filter="url(#rough2)">k 块全过</text>

  <rect x="160" y="356" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="378" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">return true</text>
</svg>
