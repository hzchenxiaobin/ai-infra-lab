<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思想：最大堆 — 每次取最重两块相撞</text>

  <!-- 原始数组 -->
  <text x="40" y="56" font-size="11.5" fill="#888">原始石头数组</text>
  <rect x="40" y="64" width="500" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="88" text-anchor="middle" font-size="12" fill="#333">stones = [2, 7, 4, 1, 8, 1]</text>

  <path d="M 290 106 L 290 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 建最大堆 -->
  <rect x="50" y="128" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="153" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">① 全部入最大堆 → 堆顶始终是最重石头</text>

  <path d="M 290 170 L 290 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环框 -->
  <rect x="30" y="192" width="520" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="212" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">② 循环：当堆中 ≥ 2 块石头时</text>

  <!-- 取出两块 -->
  <rect x="50" y="222" width="220" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="160" y="242" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">弹出 y（最重）、x（次重）</text>

  <!-- 相撞 -->
  <rect x="290" y="222" width="100" height="30" fill="#fafafa" stroke="#888" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="340" y="242" text-anchor="middle" font-size="11.5" fill="#333">y 与 x 相撞</text>

  <!-- 结果 -->
  <rect x="410" y="222" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="470" y="242" text-anchor="middle" font-size="11" fill="#333">y &gt; x → push y−x</text>

  <text x="290" y="276" text-anchor="middle" font-size="10.5" fill="#888">y == x → 两块都消失，不 push</text>

  <path d="M 290 294 L 290 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回结果 -->
  <rect x="60" y="316" width="460" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="335" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">③ 堆空 → 返回 0；堆剩 1 块 → 返回它</text>
  <text x="290" y="351" text-anchor="middle" font-size="10.5" fill="#888">每轮必消去至少一块石头，故最多 n−1 轮必终止</text>

  <!-- 底部对比备注 -->
  <rect x="50" y="372" width="480" height="56" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="392" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">对比 1049（任选两块求最优 → DP）</text>
  <text x="290" y="408" text-anchor="middle" font-size="10.5" fill="#888">本题固定选最大两块 → 纯模拟，无需优化策略</text>
  <text x="290" y="422" text-anchor="middle" font-size="10.5" fill="#888">最大堆 O(log n) 取最值是关键</text>
</svg>
