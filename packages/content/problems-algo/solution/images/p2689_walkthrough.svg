<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：[10,4,"abcpoe","g","rta"]，k=6</text>

  <!-- ===== Tree (left) ===== -->
  <!-- root len=10 -->
  <rect x="110" y="66" width="76" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="148" y="83" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">len=10</text>
  <text x="148" y="96" text-anchor="middle" font-size="9" fill="#b85450">val=""</text>

  <!-- L1 left internal len=4 -->
  <rect x="50" y="150" width="66" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="83" y="166" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">len=4</text>
  <text x="83" y="179" text-anchor="middle" font-size="9" fill="#446688">val=""</text>

  <!-- L1 right leaf abcpoe (highlighted, on path) -->
  <rect x="160" y="150" width="80" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6" rx="6" filter="url(#rough2)"/>
  <text x="200" y="166" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">"abcpoe"</text>
  <text x="200" y="179" text-anchor="middle" font-size="9" fill="#d6a040">len=6</text>

  <!-- edges root-L1 -->
  <line x1="130" y1="104" x2="100" y2="150" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 166 104 L 196 150" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- L2 leaves under len=4 -->
  <rect x="14" y="232" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="42" y="248" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">"g"</text>
  <text x="42" y="261" text-anchor="middle" font-size="9" fill="#4a7a3a">len=1</text>

  <rect x="90" y="232" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="122" y="248" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">"rta"</text>
  <text x="122" y="261" text-anchor="middle" font-size="9" fill="#4a7a3a">len=3</text>

  <!-- edges L1-L2 -->
  <line x1="72" y1="186" x2="56" y2="232" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="94" y1="186" x2="110" y2="232" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- path label -->
  <text x="184" y="138" font-size="10" fill="#b85450" font-weight="bold">导航路径</text>

  <!-- tree caption -->
  <text x="120" y="294" text-anchor="middle" font-size="10" fill="#888">S(root) = "g"+"rta"+"abcpoe" = "grtaabcpoe"</text>

  <!-- ===== Step table (right) ===== -->
  <text x="430" y="64" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">逐步定位</text>

  <!-- header -->
  <g font-size="10">
    <rect x="310" y="78" width="240" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="346" y="93" text-anchor="middle" fill="#446688" font-weight="bold">步骤</text>
    <text x="398" y="93" text-anchor="middle" fill="#446688" font-weight="bold">节点</text>
    <text x="452" y="93" text-anchor="middle" fill="#446688" font-weight="bold">k</text>
    <text x="510" y="93" text-anchor="middle" fill="#446688" font-weight="bold">决策</text>
  </g>

  <!-- row 1 -->
  <g font-size="10">
    <rect x="310" y="100" width="240" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="346" y="121" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <text x="398" y="115" text-anchor="middle" fill="#333">root</text>
    <text x="398" y="128" text-anchor="middle" font-size="9" fill="#888">len=10</text>
    <text x="452" y="121" text-anchor="middle" fill="#333" font-weight="bold">6</text>
    <text x="510" y="115" text-anchor="middle" fill="#b85450">6&gt;4 → 右</text>
    <text x="510" y="128" text-anchor="middle" font-size="9" fill="#888">leftLen=4</text>
  </g>

  <!-- row 2 -->
  <g font-size="10">
    <rect x="310" y="134" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="346" y="155" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <text x="398" y="149" text-anchor="middle" fill="#333">"abcpoe"</text>
    <text x="398" y="162" text-anchor="middle" font-size="9" fill="#888">叶子 len=6</text>
    <text x="452" y="155" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <text x="510" y="155" text-anchor="middle" fill="#4a7a3a">return val[1]</text>
  </g>

  <!-- k transform note -->
  <text x="448" y="118" font-size="9" fill="#b85450">k'=6−4=2</text>

  <!-- result box -->
  <rect x="310" y="186" width="240" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="207" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结果 = 'b'</text>
  <text x="430" y="224" text-anchor="middle" font-size="9" fill="#888">"abcpoe"[1] = 'b'</text>

  <!-- ===== full string with position ===== -->
  <text x="290" y="300" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">整串 S(root) 与第 6 位</text>
  <g font-size="11">
    <!-- positions 1..10 -->
    <!-- chars: g r t a a b c p o e -->
    <!-- draw 10 boxes centered -->
  </g>
  <!-- char boxes row at y=312 -->
  <g font-size="11">
    <!-- 10 chars, box width 26 starting x=170 -> 170..430 -->
    <!-- positions: 1 g, 2 r, 3 t, 4 a, 5 a, 6 b, 7 c, 8 p, 9 o, 10 e -->
  </g>
  <!-- Manual drawing of 10 cells width 26 each from x=170 -->
  <!-- cell 6 highlighted -->
  <rect x="296" y="312" width="26" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="309" y="332" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">b</text>
  <!-- other cells -->
  <rect x="170" y="312" width="26" height="30" fill="#fff" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="183" y="332" text-anchor="middle" font-size="12" fill="#666">g</text>
  <rect x="196" y="312" width="26" height="30" fill="#fff" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="209" y="332" text-anchor="middle" font-size="12" fill="#666">r</text>
  <rect x="222" y="312" width="26" height="30" fill="#fff" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="235" y="332" text-anchor="middle" font-size="12" fill="#666">t</text>
  <rect x="248" y="312" width="26" height="30" fill="#fff" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="261" y="332" text-anchor="middle" font-size="12" fill="#666">a</text>
  <rect x="272" y="312" width="26" height="30" fill="#fff" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="285" y="332" text-anchor="middle" font-size="12" fill="#666">a</text>
  <rect x="322" y="312" width="26" height="30" fill="#fff" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="335" y="332" text-anchor="middle" font-size="12" fill="#666">c</text>
  <rect x="348" y="312" width="26" height="30" fill="#fff" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="361" y="332" text-anchor="middle" font-size="12" fill="#666">p</text>
  <rect x="374" y="312" width="26" height="30" fill="#fff" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="387" y="332" text-anchor="middle" font-size="12" fill="#666">o</text>
  <rect x="400" y="312" width="26" height="30" fill="#fff" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="413" y="332" text-anchor="middle" font-size="12" fill="#666">e</text>
  <!-- position numbers -->
  <g font-size="9" fill="#aaa">
    <text x="183" y="358" text-anchor="middle">1</text>
    <text x="209" y="358" text-anchor="middle">2</text>
    <text x="235" y="358" text-anchor="middle">3</text>
    <text x="261" y="358" text-anchor="middle">4</text>
    <text x="285" y="358" text-anchor="middle">5</text>
    <text x="309" y="358" text-anchor="middle" fill="#b85450" font-weight="bold">6</text>
    <text x="335" y="358" text-anchor="middle">7</text>
    <text x="361" y="358" text-anchor="middle">8</text>
    <text x="387" y="358" text-anchor="middle">9</text>
    <text x="413" y="358" text-anchor="middle">10</text>
  </g>

  <!-- arrow from pos6 box up to result -->
  <path d="M 309 286 Q 380 268 430 240" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="290" y="404" text-anchor="middle" font-size="10" fill="#888">导航只走过 1 条「右」边 + 1 个叶子，无需拼接 10 字符整串</text>
</svg>
