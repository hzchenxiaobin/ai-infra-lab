<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次比较即可</text>

  <!-- 起始 -->
  <rect x="225" y="48" width="110" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="71" text-anchor="middle" font-size="12" fill="#333">输入 root</text>
  <path d="M 280 86 L 280 108" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="280,110 380,160 280,210 180,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="156" text-anchor="middle" font-size="11" fill="#333">root.val ==</text>
  <text x="280" y="172" text-anchor="middle" font-size="11" fill="#333">left.val + right.val ?</text>

  <!-- 是 -->
  <path d="M 380 160 L 430 160 L 430 248" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="152" font-size="12" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="370" y="250" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">return true</text>

  <!-- 否 -->
  <path d="M 180 160 L 130 160 L 130 248" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="152" font-size="12" fill="#b85450" font-weight="bold">否</text>
  <rect x="70" y="250" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">return false</text>

  <!-- 说明 -->
  <rect x="60" y="308" width="440" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="333" text-anchor="middle" font-size="11" fill="#555">题目保证恰有 3 个节点，无需判空指针 / 无需递归</text>
</svg>
