<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：大 k 直接暴力，小 k 分组差分 + 前缀积摊回</text>

  <rect x="215" y="26" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="12" filter="url(#rough2)"/>
  <text x="260" y="43" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">开始</text>

  <path d="M 260 50 L 260 58" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="60" width="260" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="78" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">B ← ⌊√q⌋；线性递推逆元表 inv[1..vmax]</text>

  <path d="M 260 86 L 260 94" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="185" y="96" width="150" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="112" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">取出查询 [l, r, k, v]</text>

  <path d="M 260 120 L 260 128" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,132 322,161 260,190 198,161" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="166" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">k &gt; B ?</text>

  <path d="M 322 161 L 430 161 L 430 170" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="338" y="154" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">是</text>

  <path d="M 260 190 L 260 198" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="271" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="135" y="200" width="250" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">小 k：small[k] ← (l, r, v)</text>

  <rect x="355" y="172" width="150" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="190" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">大 k：沿 l, l+k, … ≤ r</text>
  <text x="430" y="206" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a[idx] ← a[idx]·v mod p</text>
  <text x="430" y="222" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">（每查询 ≤ n/B 个落点）</text>

  <path d="M 135 212 L 58 212" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 430 228 L 430 244 L 58 244" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 58 244 L 58 108 L 183 108" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="66" y="260" text-anchor="start" font-size="10" fill="#666" filter="url(#rough2)">还有查询 → 回上取下一个；用完 → 向下进入摊回</text>

  <path d="M 260 224 L 260 266" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="268" width="220" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="284" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">遍历 k = 1..B（small[k] 非空）</text>

  <path d="M 260 292 L 260 300" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="95" y="302" width="330" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">last ← l + ⌊(r−l)/k⌋·k；diff[l] ×= v</text>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">last+k &lt; n 时 diff[last+k] ×= inv[v]</text>

  <path d="M 260 344 L 260 352" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="95" y="354" width="330" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="370" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">逐有标记的余数类 c：沿 c, c+k, … 前缀积 P</text>
  <text x="260" y="388" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">P ≠ 1 时 a[idx] ← a[idx]·P mod p</text>

  <path d="M 425 375 L 492 375 L 492 280 L 372 280" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="492" y="330" text-anchor="middle" font-size="10" fill="#4a7a3a" transform="rotate(-90 492 330)" filter="url(#rough2)">下一种 k</text>

  <path d="M 260 396 L 260 404" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="135" y="406" width="250" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="422" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans ← a[0] ⊕ a[1] ⊕ … ⊕ a[n−1]</text>

  <path d="M 260 430 L 260 438" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="215" y="440" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="12" filter="url(#rough2)"/>
  <text x="260" y="457" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 ans</text>
</svg>
