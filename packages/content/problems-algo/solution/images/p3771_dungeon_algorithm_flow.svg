<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：前缀和 + 按终点二分计数</text>

  <!-- 主流程 -->
  <rect x="50" y="44" width="250" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="64" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">预处理前缀和 pref[0..n]（严格递增）</text>
  <path d="M 175 76 L 175 94" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="50" y="96" width="250" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="116" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">j ← 1，ans ← 0</text>
  <path d="M 175 128 L 175 146" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="50" y="148" width="250" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="168" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">T ← requirement[j] − hp + pref[j]</text>
  <path d="M 175 180 L 175 198" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="50" y="200" width="250" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="175" y="220" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">k ← pref[0..j−1] 中首个 ≥ T 的下标</text>
  <path d="M 175 232 L 175 250" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="50" y="252" width="250" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="272" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ans += j − k</text>
  <path d="M 175 284 L 175 302" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="175,304 245,330 175,356 105,330" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="175" y="334" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">j = n ?</text>

  <!-- 是 → 输出 -->
  <path d="M 245 330 L 328 330" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="286" y="322" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="330" y="312" width="170" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="415" y="334" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">返回 ans（long long）</text>

  <!-- 否 → 回环（经 j+1） -->
  <path d="M 105 330 L 34 330 L 34 284" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="322" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="8" y="252" width="52" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="34" y="271" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">j+1</text>
  <path d="M 34 252 L 34 164 L 48 164" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 右侧要点面板 -->
  <rect x="330" y="48" width="210" height="180" rx="10" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="435" y="70" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">要点</text>
  <text x="435" y="94" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">① 条件解耦：pref[i−1] ≥ T[j]</text>
  <text x="435" y="118" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">② damage 全正 ⇒ pref 有序</text>
  <text x="435" y="142" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">③ 合格起点数 = j − k</text>
  <text x="435" y="166" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">④ T 非单调 ⇒ 二分非滑窗</text>
  <text x="435" y="190" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">⑤ 上界 5×10⁹ 须 long long</text>

  <!-- 底部复杂度条 -->
  <rect x="50" y="366" width="460" height="30" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="385" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">每个 j 一次二分 O(log n) ⇒ 总时间 O(n log n)，空间 O(n)</text>
</svg>
