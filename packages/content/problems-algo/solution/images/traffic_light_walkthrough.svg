<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="600" height="380" fill="#fdfcf7"/>

  <text x="300" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例 1 演算：5 辆车依次通过路口</text>
  <path d="M 160 34 Q 300 42 440 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Car boxes (y=60) -->
  <g filter="url(#sk)"><rect x="60" y="60" width="92" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="106" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">车 1</text>
  <text x="106" y="96" text-anchor="middle" font-size="9" fill="#666">A路·方向2</text>

  <g filter="url(#sk)"><rect x="160" y="60" width="92" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="206" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">车 3</text>
  <text x="206" y="96" text-anchor="middle" font-size="9" fill="#666">A路·方向1</text>

  <g filter="url(#sk)"><rect x="260" y="60" width="92" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="306" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">车 5</text>
  <text x="306" y="96" text-anchor="middle" font-size="9" fill="#666">A路·方向2</text>

  <g filter="url(#sk)"><rect x="360" y="60" width="92" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/></g>
  <text x="406" y="80" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">车 2</text>
  <text x="406" y="96" text-anchor="middle" font-size="9" fill="#666">B路·方向4</text>

  <g filter="url(#sk)"><rect x="460" y="60" width="92" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="506" y="80" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">车 4</text>
  <text x="506" y="96" text-anchor="middle" font-size="9" fill="#666">B路·方向3</text>

  <!-- arrival time labels -->
  <text x="106" y="122" text-anchor="middle" font-size="10" fill="#888">t=10</text>
  <text x="206" y="122" text-anchor="middle" font-size="10" fill="#888">t=20</text>
  <text x="306" y="122" text-anchor="middle" font-size="10" fill="#888">t=30</text>
  <text x="406" y="122" text-anchor="middle" font-size="10" fill="#888">t=40</text>
  <text x="506" y="122" text-anchor="middle" font-size="10" fill="#888">t=50</text>

  <!-- connectors to timeline -->
  <path d="M 106 124 L 106 168" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 206 124 L 206 168" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 306 124 L 306 168" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 406 124 L 406 168" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 506 124 L 506 168" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- timeline axis -->
  <path d="M 50 172 L 560 172" stroke="#888" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)"><circle cx="106" cy="172" r="3.5" fill="#446688"/></g>
  <g filter="url(#sk)"><circle cx="206" cy="172" r="3.5" fill="#446688"/></g>
  <g filter="url(#sk)"><circle cx="306" cy="172" r="3.5" fill="#446688"/></g>
  <g filter="url(#sk)"><circle cx="406" cy="172" r="3.5" fill="#4a7a3a"/></g>
  <g filter="url(#sk)"><circle cx="506" cy="172" r="3.5" fill="#4a7a3a"/></g>

  <!-- Road state bar -->
  <text x="50" y="206" font-size="10" fill="#888" font-weight="bold">绿灯归属：</text>
  <g filter="url(#sk)">
    <rect x="50" y="212" width="356" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="228" y="231" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">A 路绿灯（方向 1、2 通行）</text>

  <g filter="url(#sk)">
    <rect x="406" y="212" width="154" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="483" y="231" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">B 路绿灯</text>

  <!-- switch marker -->
  <path d="M 406 200 L 406 252" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>
  <text x="412" y="198" font-size="10" fill="#b85450" font-weight="bold">⚠ 切换</text>

  <!-- turnGreen callout -->
  <g filter="url(#sk)">
    <rect x="300" y="262" width="212" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="406" y="280" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">turnGreen() 仅在此处调用一次</text>
  <text x="406" y="296" text-anchor="middle" font-size="10" fill="#7a5415">road 标志：1（A）→ 2（B）</text>
  <path d="M 406 262 L 406 244" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- output order -->
  <g filter="url(#sk)">
    <rect x="40" y="322" width="520" height="44" rx="8" fill="#f6f6f6" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3"/>
  </g>
  <text x="300" y="342" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">通过顺序：车1(A) → 车3(A) → 车5(A) → 🟢灯B绿 → 车2(B) → 车4(B)</text>
  <text x="300" y="358" text-anchor="middle" font-size="9" fill="#888">前三辆同属 A 路，绿灯不变；到车2 才切到 B 路，turnGreen 触发一次</text>
</svg>
