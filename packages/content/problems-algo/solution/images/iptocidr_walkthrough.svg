<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="320" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：ip = "255.0.0.7", n = 10（三步分解）</text>
  <text x="310" y="42" text-anchor="middle" font-size="10" fill="#888">start 用末段表示，前三段 255.0.0. 不变</text>

  <!-- header -->
  <text x="44"  y="68" font-size="11" fill="#444" font-weight="bold">步骤</text>
  <text x="100" y="68" font-size="11" fill="#444" font-weight="bold">start末段</text>
  <text x="178" y="68" font-size="11" fill="#444" font-weight="bold">n</text>
  <text x="212" y="68" font-size="11" fill="#444" font-weight="bold">aligned</text>
  <text x="278" y="68" font-size="11" fill="#444" font-weight="bold">maxByN</text>
  <text x="340" y="68" font-size="11" fill="#444" font-weight="bold">block</text>
  <text x="392" y="68" font-size="11" fill="#444" font-weight="bold">prefix</text>
  <text x="446" y="68" font-size="11" fill="#444" font-weight="bold">输出</text>
  <line x1="20" y1="76" x2="600" y2="76" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: start=7, n=10 -->
  <text x="48"  y="100" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="108" y="100" font-size="11" fill="#333" font-family="monospace">.7  (0111)</text>
  <text x="182" y="100" font-size="11" fill="#444" font-family="monospace">10</text>
  <rect x="208" y="86" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="101" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="296" y="100" font-size="11" fill="#444" font-family="monospace">8</text>
  <rect x="328" y="86" width="34" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="345" y="101" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <rect x="384" y="86" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="398" y="101" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">32</text>
  <rect x="440" y="86" width="150" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="515" y="101" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" font-family="monospace">255.0.0.7/32</text>

  <!-- Row 2: start=8, n=9 -->
  <text x="48"  y="132" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="108" y="132" font-size="11" fill="#333" font-family="monospace">.8  (1000)</text>
  <text x="182" y="132" font-size="11" fill="#444" font-family="monospace">9</text>
  <rect x="208" y="118" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="133" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">8</text>
  <text x="296" y="132" font-size="11" fill="#444" font-family="monospace">8</text>
  <rect x="328" y="118" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="345" y="133" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">8</text>
  <rect x="384" y="118" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="398" y="133" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">29</text>
  <rect x="440" y="118" width="150" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="515" y="133" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" font-family="monospace">255.0.0.8/29</text>

  <!-- Row 3: start=16, n=1 -->
  <text x="48"  y="164" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="108" y="164" font-size="11" fill="#333" font-family="monospace">.16 (10000)</text>
  <text x="182" y="164" font-size="11" fill="#444" font-family="monospace">1</text>
  <rect x="208" y="150" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="165" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">16</text>
  <text x="296" y="164" font-size="11" fill="#444" font-family="monospace">1</text>
  <rect x="328" y="150" width="34" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="345" y="165" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <rect x="384" y="150" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="398" y="165" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">32</text>
  <rect x="440" y="150" width="150" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="515" y="165" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" font-family="monospace">255.0.0.16/32</text>

  <!-- summary box -->
  <rect x="20" y="188" width="580" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="40" y="208" font-size="11" fill="#d6a040" font-weight="bold">最终结果（3 块，最优）</text>
  <text x="40" y="226" font-size="11" fill="#333" font-family="monospace">["255.0.0.7/32", "255.0.0.8/29", "255.0.0.16/32"]   合计 1 + 8 + 1 = 10</text>
  <text x="40" y="240" font-size="10" fill="#888">第 1 步 start=7 奇数只能取 /32；推进到 8 后 8 对齐且 ≤9，一次吞 8 个；最后剩 1 个单点。</text>

  <!-- example 2 note -->
  <rect x="20" y="254" width="580" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="40" y="274" font-size="11" fill="#4a7a3a" font-weight="bold">示例 2：ip = "0.0.0.0", n = 10（start=0 视为无界，块由 maxByN 决定）</text>
  <text x="40" y="292" font-size="11" fill="#444" font-family="monospace">block=8 (/29) 覆盖 0~7 → block=2 (/31) 覆盖 8~9  ⇒  ["0.0.0.0/29", "0.0.0.8/31"]   合计 8+2=10</text>
  <text x="40" y="306" font-size="10" fill="#888">0 对任意大小都对齐，故首块直接取 ≤n 的最大 2 幂 8。</text>
</svg>
