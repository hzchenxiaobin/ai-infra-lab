<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：O(1) 枚举 count = 1..10</text>

  <!-- Start diamond: num == 0 ? -->
  <polygon points="280,44 360,78 280,112 200,78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="74" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">num == 0 ?</text>
  <text x="280" y="90" text-anchor="middle" font-size="10.5" fill="#888">空多重集</text>

  <!-- Yes branch -> return 0 -->
  <path d="M 200 78 L 120 78 L 120 110" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="160" y="72" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="78" y="114" width="84" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="120" y="135" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return 0</text>

  <!-- No branch down -->
  <path d="M 280 112 L 280 140" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="296" y="132" font-size="11" fill="#888">否</text>

  <!-- Loop init -->
  <rect x="180" y="144" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for cnt = 1 to 10</text>

  <!-- Diamond: (cnt*k)%10 == num%10 ? -->
  <path d="M 280 188 L 380 222 L 280 256 L 180 222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="218" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(cnt·K) % 10</text>
  <text x="280" y="234" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">== num % 10 ?</text>

  <!-- No branch: next cnt -->
  <path d="M 380 222 L 430 222 L 430 178 L 380 178" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="392" y="216" font-size="11" fill="#888">否, cnt++</text>
  <text x="392" y="252" font-size="10.5" fill="#888">周期内无匹配</text>

  <!-- Yes branch down -->
  <path d="M 280 256 L 280 284" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="296" y="276" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Diamond: cnt*k <= num ? -->
  <polygon points="280,288 370,322 280,356 190,322" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cnt·K ≤ num ?</text>

  <!-- Yes -> return cnt -->
  <path d="M 190 322 L 120 322 L 120 354" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="150" y="316" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="70" y="358" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="120" y="379" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return cnt ✓</text>

  <!-- No -> return -1 (smallest matching too big) -->
  <path d="M 370 322 L 440 322 L 440 354" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="400" y="316" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="390" y="358" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="440" y="379" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return -1</text>

  <!-- loop fallthrough -->
  <path d="M 430 200 L 470 200 L 470 408 L 392 408" stroke="#888" stroke-width="1.8" stroke-dasharray="4,3" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="290" y="392" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="340" y="413" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return -1</text>
  <text x="478" y="300" font-size="10.5" fill="#888">10 个全</text>
  <text x="478" y="314" font-size="10.5" fill="#888">部不匹配</text>

  <!-- legend -->
  <text x="60" y="442" font-size="11" fill="#888">注：个位 (cnt·K)%10 周期 = 10/gcd(K,10)，故 1..10 必覆盖所有可达个位；首个匹配即最小 count。</text>
</svg>
