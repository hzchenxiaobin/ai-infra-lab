<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2, 5, 9]，答案 = 10</text>

  <!-- cnt / pre summary -->
  <rect x="120" y="44" width="380" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="64" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">频数 cnt：cnt[2]=1, cnt[5]=1, cnt[9]=1（M = 9）</text>
  <text x="310" y="78" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">前缀 pre：pre[2]=1, pre[4]=1, pre[5]=2, pre[7]=2, pre[8]=2, pre[9]=3</text>

  <!-- ===== u = 2 ===== -->
  <rect x="20" y="100" width="64" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="52" y="134" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">u=2</text>
  <text x="52" y="152" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">cnt=1</text>

  <g filter="url(#rough2)">
    <!-- k=1 [2,3] count=1 contrib=1 -->
    <rect x="96" y="106" width="120" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="156" y="121" text-anchor="middle" font-size="9.5" fill="#2a4a1a">k=1 [2,3]</text>
    <text x="156" y="134" text-anchor="middle" font-size="9.5" fill="#2a4a1a" font-weight="bold">个数1 → 1×1=1</text>
    <!-- k=2 [4,5] count=1 contrib=2 -->
    <rect x="222" y="106" width="120" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="282" y="121" text-anchor="middle" font-size="9.5" fill="#7a5a20">k=2 [4,5]</text>
    <text x="282" y="134" text-anchor="middle" font-size="9.5" fill="#7a5a20" font-weight="bold">个数1 → 2×1=2</text>
    <!-- k=3 [6,7] count=0 greyed -->
    <rect x="348" y="106" width="120" height="34" rx="6" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="408" y="121" text-anchor="middle" font-size="9.5" fill="#aaa">k=3 [6,7]</text>
    <text x="408" y="134" text-anchor="middle" font-size="9.5" fill="#aaa">个数0 → 跳过</text>
    <!-- k=4 [8,9] count=1 contrib=4 -->
    <rect x="474" y="106" width="120" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="534" y="121" text-anchor="middle" font-size="9.5" fill="#7a5a20">k=4 [8,9]</text>
    <text x="534" y="134" text-anchor="middle" font-size="9.5" fill="#7a5a20" font-weight="bold">个数1 → 4×1=4</text>
  </g>
  <text x="310" y="162" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">u=2 小计 = 1 + 2 + 0 + 4 = 7</text>

  <!-- ===== u = 5 ===== -->
  <rect x="20" y="184" width="64" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="52" y="210" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">u=5</text>
  <text x="52" y="226" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">cnt=1</text>

  <g filter="url(#rough2)">
    <rect x="96" y="190" width="200" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="196" y="205" text-anchor="middle" font-size="9.5" fill="#2a4a1a">k=1 [5, 9]（含 v=5 与 v=9）</text>
    <text x="196" y="218" text-anchor="middle" font-size="9.5" fill="#2a4a1a" font-weight="bold">个数2 → 1×2=2</text>
  </g>
  <text x="310" y="240" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">u=5 小计 = 2</text>

  <!-- ===== u = 9 ===== -->
  <rect x="20" y="252" width="64" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="52" y="278" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">u=9</text>
  <text x="52" y="294" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">cnt=1</text>

  <g filter="url(#rough2)">
    <rect x="96" y="258" width="200" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="196" y="273" text-anchor="middle" font-size="9.5" fill="#7a5a20">k=1 [9, 9]</text>
    <text x="196" y="286" text-anchor="middle" font-size="9.5" fill="#7a5a20" font-weight="bold">个数1 → 1×1=1</text>
  </g>
  <text x="310" y="308" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">u=9 小计 = 1</text>

  <!-- ===== total ===== -->
  <rect x="160" y="322" width="300" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="348" text-anchor="middle" font-size="13" fill="#7a3030" font-weight="bold" filter="url(#rough2)">总和 = 7 + 2 + 1 = 10 ✓</text>

  <!-- ===== brute-force verification grid ===== -->
  <text x="310" y="382" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">暴力验算：所有 9 个数对 ⌊v/u⌋</text>

  <g filter="url(#rough2)" font-size="9.5">
    <!-- header row: v\u | 2 5 9 -->
    <rect x="180" y="390" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="210" y="405" text-anchor="middle" fill="#446688" font-weight="bold">v \ u</text>
    <rect x="240" y="390" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3"/>
    <text x="270" y="405" text-anchor="middle" fill="#7a5a20" font-weight="bold">2</text>
    <rect x="300" y="390" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3"/>
    <text x="330" y="405" text-anchor="middle" fill="#7a5a20" font-weight="bold">5</text>
    <rect x="360" y="390" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3"/>
    <text x="390" y="405" text-anchor="middle" fill="#7a5a20" font-weight="bold">9</text>

    <!-- row v=2: 1,0,0 -->
    <rect x="180" y="412" width="60" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="210" y="426" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="240" y="412" width="60" height="20" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="270" y="426" text-anchor="middle" fill="#333">1</text>
    <rect x="300" y="412" width="60" height="20" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="330" y="426" text-anchor="middle" fill="#999">0</text>
    <rect x="360" y="412" width="60" height="20" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="390" y="426" text-anchor="middle" fill="#999">0</text>

    <!-- row v=5: 2,1,0 -->
    <rect x="180" y="432" width="60" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="210" y="446" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
    <rect x="240" y="432" width="60" height="20" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="270" y="446" text-anchor="middle" fill="#333">2</text>
    <rect x="300" y="432" width="60" height="20" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="330" y="446" text-anchor="middle" fill="#333">1</text>
    <rect x="360" y="432" width="60" height="20" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="390" y="446" text-anchor="middle" fill="#999">0</text>

    <!-- row v=9: 4,1,1 -->
    <rect x="180" y="452" width="60" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="210" y="466" text-anchor="middle" fill="#446688" font-weight="bold">9</text>
    <rect x="240" y="452" width="60" height="20" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="270" y="466" text-anchor="middle" fill="#333">4</text>
    <rect x="300" y="452" width="60" height="20" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="330" y="466" text-anchor="middle" fill="#333">1</text>
    <rect x="360" y="452" width="60" height="20" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="390" y="466" text-anchor="middle" fill="#333">1</text>
  </g>
  <text x="310" y="466" text-anchor="start" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 和 = 1+0+0+2+1+0+4+1+1 = 10 ✓</text>
</svg>
