<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="440" fill="#fafafa"/>

  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">8 种刚体变换（二面体群 D₄）取字典序最小作规范形</text>
  <path d="M 200 42 Q 390 50 580 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== left: example grid 4x5, cell=28, origin (50,75) ===== -->
  <!-- row0: 1 1 0 0 0 -->
  <g filter="url(#rough2)"><rect x="50" y="75" width="28" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="64" y="94" text-anchor="middle" font-size="13" fill="#2b4a66" font-weight="bold">1</text>
  <g filter="url(#rough2)"><rect x="78" y="75" width="28" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="92" y="94" text-anchor="middle" font-size="13" fill="#2b4a66" font-weight="bold">1</text>
  <g filter="url(#rough2)"><rect x="106" y="75" width="28" height="28" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="120" y="94" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="134" y="75" width="28" height="28" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="148" y="94" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="162" y="75" width="28" height="28" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="176" y="94" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <!-- row1: 1 0 0 0 0 -->
  <g filter="url(#rough2)"><rect x="50" y="103" width="28" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="64" y="122" text-anchor="middle" font-size="13" fill="#2b4a66" font-weight="bold">1</text>
  <g filter="url(#rough2)"><rect x="78" y="103" width="28" height="28" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="92" y="122" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="106" y="103" width="28" height="28" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="120" y="122" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="134" y="103" width="28" height="28" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="148" y="122" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="162" y="103" width="28" height="28" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="176" y="122" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <!-- row2: 0 0 0 0 1 -->
  <g filter="url(#rough2)"><rect x="50" y="131" width="28" height="28" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="64" y="150" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="78" y="131" width="28" height="28" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="92" y="150" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="106" y="131" width="28" height="28" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="120" y="150" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="134" y="131" width="28" height="28" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="148" y="150" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="162" y="131" width="28" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="176" y="150" text-anchor="middle" font-size="13" fill="#2e5a26" font-weight="bold">1</text>
  <!-- row3: 0 0 0 1 1 -->
  <g filter="url(#rough2)"><rect x="50" y="159" width="28" height="28" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="64" y="178" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="78" y="159" width="28" height="28" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="92" y="178" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="106" y="159" width="28" height="28" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/></g>
  <text x="120" y="178" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <g filter="url(#rough2)"><rect x="134" y="159" width="28" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="148" y="178" text-anchor="middle" font-size="13" fill="#2e5a26" font-weight="bold">1</text>
  <g filter="url(#rough2)"><rect x="162" y="159" width="28" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="176" y="178" text-anchor="middle" font-size="13" fill="#2e5a26" font-weight="bold">1</text>

  <text x="78" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">岛屿 A</text>
  <text x="162" y="206" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">岛屿 B</text>

  <!-- rotation arrow A -> B -->
  <path d="M 100 130 Q 130 170 150 172" stroke="#b85450" stroke-width="2"
        fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="158" font-size="11" fill="#b85450" font-weight="bold">180°旋转</text>

  <!-- ===== right: 8 transformations ===== -->
  <text x="540" y="68" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">8 种刚体变换（D₄群）</text>

  <!-- 8 small grids: 2 rows x 4 cols, cell=18, grid=36x36, spacing=12 -->
  <!-- Row 1: T1, T2, T3, T4 -->
  <!-- T1: (x,y) → 11/1.  CANONICAL -->
  <g filter="url(#rough2)"><rect x="360" y="85" width="18" height="18" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <g filter="url(#rough2)"><rect x="378" y="85" width="18" height="18" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <g filter="url(#rough2)"><rect x="360" y="103" width="18" height="18" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <g filter="url(#rough2)"><rect x="378" y="103" width="18" height="18" rx="2" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="2 2"/></g>
  <text x="378" y="137" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">①(x,y) ✓最小</text>

  <!-- T2: (x,-y) → 11/.1 -->
  <g filter="url(#rough2)"><rect x="420" y="85" width="18" height="18" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><rect x="438" y="85" width="18" height="18" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><rect x="420" y="103" width="18" height="18" rx="2" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="2 2"/></g>
  <g filter="url(#rough2)"><rect x="438" y="103" width="18" height="18" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="438" y="137" text-anchor="middle" font-size="9" fill="#446688">②(x,-y)</text>

  <!-- T3: (-x,y) → 1./11 -->
  <g filter="url(#rough2)"><rect x="480" y="85" width="18" height="18" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><rect x="498" y="85" width="18" height="18" rx="2" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="2 2"/></g>
  <g filter="url(#rough2)"><rect x="480" y="103" width="18" height="18" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><rect x="498" y="103" width="18" height="18" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="498" y="137" text-anchor="middle" font-size="9" fill="#446688">③(-x,y)</text>

  <!-- T4: (-x,-y) → .1/11 -->
  <g filter="url(#rough2)"><rect x="540" y="85" width="18" height="18" rx="2" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="2 2"/></g>
  <g filter="url(#rough2)"><rect x="558" y="85" width="18" height="18" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><rect x="540" y="103" width="18" height="18" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><rect x="558" y="103" width="18" height="18" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="558" y="137" text-anchor="middle" font-size="9" fill="#446688">④(-x,-y)</text>

  <!-- Row 2: T5, T6, T7, T8 (duplicates for L-tromino) -->
  <!-- T5: (y,x) = T1 -->
  <g filter="url(#rough2)"><rect x="360" y="155" width="18" height="18" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><rect x="378" y="155" width="18" height="18" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><rect x="360" y="173" width="18" height="18" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><rect x="378" y="173" width="18" height="18" rx="2" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="2 2"/></g>
  <text x="378" y="207" text-anchor="middle" font-size="9" fill="#888">⑤(y,x)=①</text>

  <!-- T6: (y,-x) = T2 -->
  <g filter="url(#rough2)"><rect x="420" y="155" width="18" height="18" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><rect x="438" y="155" width="18" height="18" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><rect x="420" y="173" width="18" height="18" rx="2" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="2 2"/></g>
  <g filter="url(#rough2)"><rect x="438" y="173" width="18" height="18" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="438" y="207" text-anchor="middle" font-size="9" fill="#888">⑥(y,-x)=②</text>

  <!-- T7: (-y,x) = T3 -->
  <g filter="url(#rough2)"><rect x="480" y="155" width="18" height="18" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><rect x="498" y="155" width="18" height="18" rx="2" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="2 2"/></g>
  <g filter="url(#rough2)"><rect x="480" y="173" width="18" height="18" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><rect x="498" y="173" width="18" height="18" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="498" y="207" text-anchor="middle" font-size="9" fill="#888">⑦(-y,x)=③</text>

  <!-- T8: (-y,-x) = T4 -->
  <g filter="url(#rough2)"><rect x="540" y="155" width="18" height="18" rx="2" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="2 2"/></g>
  <g filter="url(#rough2)"><rect x="558" y="155" width="18" height="18" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><rect x="540" y="173" width="18" height="18" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><rect x="558" y="173" width="18" height="18" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="558" y="207" text-anchor="middle" font-size="9" fill="#888">⑧(-y,-x)=④</text>

  <!-- arrow from 8 grids down to "sort + pick min" -->
  <path d="M 460 218 L 460 238" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- sort + pick min box -->
  <g filter="url(#rough2)"><rect x="350" y="240" width="220" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="460" y="262" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">排序 → 取字典序最小 → 规范形</text>

  <!-- ===== bottom: both islands → same canonical ===== -->
  <!-- Island A arrow -->
  <path d="M 80 210 Q 80 290 280 290 Q 380 290 400 276" stroke="#446688" stroke-width="1.6"
        fill="none" stroke-dasharray="5 3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="84" y="250" font-size="11" fill="#446688" font-weight="bold">岛屿 A 规范形</text>

  <!-- Island B arrow -->
  <path d="M 162 210 Q 162 300 300 300 Q 400 300 420 278" stroke="#4a7a3a" stroke-width="1.6"
        fill="none" stroke-dasharray="5 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="166" y="270" font-size="11" fill="#4a7a3a" font-weight="bold">岛屿 B 规范形</text>

  <!-- canonical form box -->
  <g filter="url(#rough2)"><rect x="350" y="286" width="220" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="460" y="302" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">规范形（字典序最小）</text>
  <text x="460" y="318" text-anchor="middle" font-size="12" fill="#b85450" font-family="'Comic Sans MS',monospace">[(0,0),(0,1),(1,0)]</text>

  <!-- arrows to set -->
  <path d="M 460 326 L 460 346" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- set box -->
  <g filter="url(#rough2)"><rect x="350" y="348" width="220" height="40" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.5"/></g>
  <text x="460" y="364" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">shapes 集合（去重）</text>
  <text x="460" y="380" text-anchor="middle" font-size="12" fill="#444" font-family="'Comic Sans MS',monospace">{ [(0,0),(0,1),(1,0)] }</text>

  <!-- result -->
  <g filter="url(#rough2)"><rect x="380" y="402" width="160" height="30" rx="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="460" y="422" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">不同岛屿 = 1</text>

  <!-- ===== left bottom: legend ===== -->
  <g filter="url(#rough2)"><rect x="50" y="232" width="14" height="12" rx="2" fill="#e8f0fe" stroke="#446688"/></g>
  <text x="70" y="243" font-size="10" fill="#444">岛屿 A</text>
  <g filter="url(#rough2)"><rect x="50" y="250" width="14" height="12" rx="2" fill="#e6f4ea" stroke="#4a7a3a"/></g>
  <text x="70" y="261" font-size="10" fill="#444">岛屿 B（旋转同形）</text>
  <g filter="url(#rough2)"><rect x="50" y="268" width="14" height="12" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="70" y="279" font-size="10" fill="#444">规范形（最小）</text>
  <g filter="url(#rough2)"><rect x="50" y="286" width="14" height="12" rx="2" fill="#f5f5f5" stroke="#bbb" stroke-dasharray="2 2"/></g>
  <text x="70" y="297" font-size="10" fill="#444">空格</text>

  <text x="50" y="324" font-size="10" fill="#888">L 三联骨牌关于主对角线</text>
  <text x="50" y="338" font-size="10" fill="#888">对称，故 8 种变换中</text>
  <text x="50" y="352" font-size="10" fill="#888">⑤⑥⑦⑧ 分别与 ①②③④ 重复。</text>
  <text x="50" y="372" font-size="10" fill="#888">手性形状（如 S 形）则</text>
  <text x="50" y="386" font-size="10" fill="#888">8 种全不同，规范形仍唯一。</text>
</svg>
