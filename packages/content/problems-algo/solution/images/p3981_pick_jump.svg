<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 414"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="414" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">核心观察：一个方案 = 一串「跳跃式选取」，状态只需 (i, j, k, mask)</text>

  <!-- word1 行 -->
  <text x="96" y="58" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">word1</text>
  <g filter="url(#rough2)">
    <rect x="104" y="40" width="34" height="28" rx="4" fill="#cfe0f7" stroke="#446688" stroke-width="2.4"/>
    <rect x="142" y="40" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="180" y="40" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#446688" filter="url(#rough2)">
    <text x="121" y="59" font-weight="bold">a</text>
    <text x="159" y="59">b</text>
    <text x="197" y="59">c</text>
  </g>
  <g font-size="9" text-anchor="middle" fill="#888" filter="url(#rough2)">
    <text x="121" y="80">0</text>
    <text x="159" y="80">1</text>
    <text x="197" y="80">2</text>
  </g>

  <!-- word2 行 -->
  <text x="256" y="58" text-anchor="end" font-size="12" fill="#d6a040" filter="url(#rough2)">word2</text>
  <g filter="url(#rough2)">
    <rect x="264" y="40" width="34" height="28" rx="4" fill="#ffe7ae" stroke="#d6a040" stroke-width="2.4"/>
    <rect x="302" y="40" width="34" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="340" y="40" width="34" height="28" rx="4" fill="#ffe7ae" stroke="#d6a040" stroke-width="2.4"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#d6a040" filter="url(#rough2)">
    <text x="281" y="59" font-weight="bold">b</text>
    <text x="319" y="59">a</text>
    <text x="357" y="59" font-weight="bold">c</text>
  </g>
  <g font-size="9" text-anchor="middle" fill="#888" filter="url(#rough2)">
    <text x="281" y="80">0</text>
    <text x="319" y="80">1</text>
    <text x="357" y="80">2</text>
  </g>

  <!-- target 行 -->
  <text x="162" y="189" text-anchor="end" font-size="12" fill="#4a7a3a" filter="url(#rough2)">target</text>
  <g filter="url(#rough2)">
    <rect x="170" y="170" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="208" y="170" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="246" y="170" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#4a7a3a" filter="url(#rough2)">
    <text x="187" y="189">a</text>
    <text x="225" y="189">b</text>
    <text x="263" y="189">c</text>
  </g>
  <g font-size="9" text-anchor="middle" fill="#888" filter="url(#rough2)">
    <text x="187" y="210">0</text>
    <text x="225" y="210">1</text>
    <text x="263" y="210">2</text>
  </g>

  <!-- 选取箭头：a←word1[0]，b←word2[0]，c←word2[2] -->
  <path d="M 187 166 L 126 74" fill="none" stroke="#446688" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 225 166 L 278 74" fill="none" stroke="#d6a040" stroke-width="1.7" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 263 166 L 353 74" fill="none" stroke="#d6a040" stroke-width="1.7" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 步骤徽章 -->
  <circle cx="156" cy="120" r="9" fill="#fff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="156" y="124" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <circle cx="252" cy="120" r="9" fill="#fff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="252" y="124" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">2</text>
  <circle cx="308" cy="120" r="9" fill="#fff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="308" y="124" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">3</text>

  <!-- 状态演进链 -->
  <text x="44" y="242" font-size="12" fill="#666" filter="url(#rough2)">状态 (i, j, k, mask) 的演进：</text>
  <text x="300" y="242" font-size="10.5" fill="#999" filter="url(#rough2)">mask：01=用过word1，10=用过word2，11=都用</text>
  <g filter="url(#rough2)">
    <rect x="44" y="252" width="88" height="30" rx="6" fill="#fff" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="172" y="252" width="88" height="30" rx="6" fill="#fff" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="300" y="252" width="88" height="30" rx="6" fill="#fff" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="428" y="252" width="88" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="88" y="271">(0,0,0,00)</text>
    <text x="216" y="271">(1,1,0,01)</text>
    <text x="344" y="271">(2,1,1,11)</text>
    <text x="472" y="271">(3,1,3,11)</text>
  </g>
  <path d="M 132 267 L 168 267" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 267 L 296 267" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 388 267 L 424 267" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g font-size="9.5" text-anchor="middle" fill="#999" filter="url(#rough2)">
    <text x="88" y="296">（初始）</text>
    <text x="216" y="296">① 选 a←word1[0]</text>
    <text x="344" y="296">② 选 b←word2[0]</text>
    <text x="472" y="296">③ 选 c←word2[2]</text>
  </g>

  <!-- 底部规则面板 -->
  <rect x="36" y="310" width="448" height="92" rx="8" fill="#e8f0fe" fill-opacity="0.5"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">跳跃式转移：一步 = 一次真实选取 → 方案与路径一一对应（不重不漏）</text>
  <g font-size="11.5" fill="#333" filter="url(#rough2)">
    <text x="52" y="354">选 word1：任取 p ≥ j 且 word1[p] = c → 状态变为 (i+1, p+1, k, mask|01)</text>
    <text x="52" y="373">选 word2：任取 q ≥ k 且 word2[q] = c → 状态变为 (i+1, j, q+1, mask|10)</text>
    <text x="52" y="392">批量计数：word1[j′−1]=c 时 ndp[j′][k][mask|01] += Σ_{j&lt;j′} dp[j][k][mask] —— 前缀和！</text>
  </g>
</svg>
