<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="440" height="500" fill="#fafafa"/>

  <text x="220" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">和为奇数的子数组数目：算法流程</text>

  <!-- Init -->
  <rect x="70" y="40" width="300" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="62" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="220" y="82" text-anchor="middle" font-size="11" fill="#555">count = [1, 0],  ans = 0,  S = 0</text>

  <path d="M 220 100 L 220 118" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Loop entry -->
  <rect x="70" y="122" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="142" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for x in arr</text>
  <text x="220" y="158" text-anchor="middle" font-size="10.5" fill="#555">遍历每个元素</text>

  <path d="M 220 170 L 220 188" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- S += x -->
  <rect x="100" y="192" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="220" y="217" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">S += x</text>

  <path d="M 220 236 L 220 254" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Compute parity -->
  <rect x="90" y="258" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="220" y="278" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">r = S &amp; 1</text>
  <text x="220" y="294" text-anchor="middle" font-size="10" fill="#4a7a3a">当前前缀和奇偶性（0=偶, 1=奇）</text>

  <path d="M 220 306 L 220 322" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Query opposite parity count -->
  <rect x="70" y="326" width="300" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="348" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">ans += count[1 − r]</text>
  <text x="220" y="368" text-anchor="middle" font-size="10.5" fill="#4a7a3a">查异奇偶前缀和个数 → 奇数和子数组</text>

  <path d="M 220 386 L 220 402" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Write count[r] -->
  <rect x="100" y="406" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="431" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">count[r] += 1   （先查再写）</text>

  <!-- loop back -->
  <path d="M 340 426 L 410 426 L 410 144 L 370 144" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="416" y="290" font-size="9.5" fill="#aaa" transform="rotate(-90 416 290)">循环</text>

  <!-- final -->
  <text x="220" y="468" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">遍历结束 → return ans % (10⁹+7)</text>
  <text x="220" y="484" text-anchor="middle" font-size="10" fill="#aaa">O(n) 时间, O(1) 空间（只需两个计数器）</text>
</svg>
