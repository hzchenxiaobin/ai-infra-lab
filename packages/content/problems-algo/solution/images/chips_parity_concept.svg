<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：奇偶分组 —— ±2 免费，±1 花费 1</text>

  <!-- ===== Section A: number line with chips ===== -->
  <text x="40" y="52" font-size="11" fill="#888" font-weight="bold">筹码位置示意（位置 1~6）：</text>

  <!-- number line -->
  <line x1="80" y1="80" x2="500" y2="80" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- position ticks 1..6 -->
  <rect x="92" y="68" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="107" y="85" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <rect x="158" y="68" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="173" y="85" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <rect x="224" y="68" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="85" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <rect x="290" y="68" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="85" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <rect x="356" y="68" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="371" y="85" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">5</text>
  <rect x="422" y="68" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="437" y="85" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">6</text>

  <!-- chips: circles above odd positions (1,3,5) and even positions (2,4,6) -->
  <circle cx="107" cy="58" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="173" cy="58" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="239" cy="58" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="305" cy="58" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="371" cy="58" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="437" cy="58" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- ===== Section B: two cost rules ===== -->
  <text x="40" y="118" font-size="11" fill="#555" font-weight="bold">移动代价规则：</text>

  <!-- rule 1: ±2 free -->
  <rect x="60" y="128" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <path d="M 90 148 L 130 148" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="140" y="146" font-size="12" fill="#4a7a3a" font-weight="bold">±2 ：代价 0</text>
  <text x="140" y="160" font-size="10" fill="#888">同奇偶内部搬迁免费</text>

  <!-- rule 2: ±1 costs 1 -->
  <rect x="290" y="128" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <path d="M 320 148 L 360 148" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="370" y="146" font-size="12" fill="#b85450" font-weight="bold">±1 ：代价 1</text>
  <text x="370" y="160" font-size="10" fill="#888">跨奇偶才花钱</text>

  <!-- ===== Section C: two groups gather free ===== -->
  <text x="40" y="192" font-size="11" fill="#446688" font-weight="bold">同奇偶可免费聚拢：</text>

  <!-- even group box -->
  <rect x="40" y="202" width="230" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="222" font-size="11" fill="#446688" font-weight="bold">偶数位筹码</text>
  <circle cx="70" cy="244" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="90" cy="244" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="110" cy="244" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 124 244 L 160 244" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="4,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="168" y="240" font-size="10" fill="#4a7a3a">免费</text>
  <rect x="200" y="232" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="218" y="249" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="155" y="262" text-anchor="middle" font-size="9" fill="#888">个数为 even</text>

  <!-- odd group box -->
  <rect x="290" y="202" width="230" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="222" font-size="11" fill="#d6a040" font-weight="bold">奇数位筹码</text>
  <circle cx="320" cy="244" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="340" cy="244" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="360" cy="244" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 374 244 L 410 244" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="4,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="418" y="240" font-size="10" fill="#4a7a3a">免费</text>
  <rect x="450" y="232" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="468" y="249" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="405" y="262" text-anchor="middle" font-size="9" fill="#888">个数为 odd</text>

  <!-- arrow down to result -->
  <path d="M 270 270 L 270 288" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="286" y="282" font-size="10" fill="#888">跨奇偶合并</text>

  <!-- ===== Section D: result ===== -->
  <rect x="90" y="290" width="360" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="308" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">只剩"跨奇偶"的花费</text>
  <text x="270" y="322" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = min(even, odd) × 1</text>

  <!-- ===== Section E: contrast note ===== -->
  <rect x="60" y="348" width="420" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="366" text-anchor="middle" font-size="11" fill="#444">让少数派跨奇偶：若 even &lt; odd，把偶数位筹码移到奇数位</text>
  <text x="270" y="380" text-anchor="middle" font-size="11" fill="#444">每个花 1，共 even 个；反之同理，取较小者最优</text>
</svg>
