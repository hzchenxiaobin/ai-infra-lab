<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：算缺口 → 排序 → 预算够则扣减计数、不够则终止</text>
  <text x="270" y="44" text-anchor="middle" font-size="10.5" fill="#888">排序 O(n log n) 主导，贪心扫描 O(n)，空间 O(n)</text>

  <!-- step 1: compute deficit -->
  <rect x="120" y="60" width="300" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="82" text-anchor="middle" font-size="12" fill="#333">① deficit[i] = capacity[i] − rocks[i]</text>
  <path d="M 270 96 L 270 114" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- step 2: sort -->
  <rect x="120" y="116" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="138" text-anchor="middle" font-size="12" fill="#333">② 对 deficit 升序排序</text>
  <path d="M 270 152 L 270 170" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- decision: budget enough? -->
  <polygon points="270,172 392,214 270,256 148,214" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="208" text-anchor="middle" font-size="11" fill="#333">additionalRocks</text>
  <text x="270" y="224" text-anchor="middle" font-size="11" fill="#333">≥ deficit[i] ？</text>

  <!-- branch: yes -->
  <text x="148" y="206" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 148 214 L 96 214 L 96 262" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="20" y="264" width="180" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="110" y="284" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">扣减 + 计数</text>
  <text x="110" y="302" text-anchor="middle" font-size="10.5" fill="#333">additionalRocks −= deficit[i]</text>
  <text x="110" y="316" text-anchor="middle" font-size="10.5" fill="#333">ans += 1；i++</text>

  <!-- loop back to decision -->
  <path d="M 110 264 L 110 214 L 148 214" stroke="#666" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="240" font-size="9.5" fill="#888">继续下一个</text>

  <!-- branch: no -->
  <text x="392" y="206" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 392 214 L 444 214 L 444 262" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="360" y="264" width="180" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="450" y="284" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">提前终止</text>
  <text x="450" y="302" text-anchor="middle" font-size="10.5" fill="#333">后续缺口更大</text>
  <text x="450" y="316" text-anchor="middle" font-size="10.5" fill="#333">必也不够 → break</text>

  <!-- merge -->
  <path d="M 110 322 L 110 348 L 270 348" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 450 322 L 450 348 L 270 348" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 270 348 L 270 368" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="110" y="370" width="320" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="270" y="392" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">③ return ans（装满的背包数）</text>

  <!-- footer -->
  <rect x="40" y="416" width="460" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="429" text-anchor="middle" font-size="10.5" fill="#333">等价写法：前缀和 + 二分找最大 i 使 Σdeficit[0..i] ≤ additionalRocks</text>
</svg>
