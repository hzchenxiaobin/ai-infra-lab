<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">倒序 DP + 单调队列：一趟 O(n)</text>

  <!-- start -->
  <rect x="150" y="40" width="220" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">dp[n+1] = 0（哨兵），空队列，i = n</text>
  <path d="M 260 72 L 260 88" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- step 1 -->
  <rect x="84" y="92" width="352" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="112" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 新候选 i+1 从队首进队</text>
  <text x="260" y="131" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">弹出队首 dp ≥ dp[i+1] 者（下标更大、值不更优 ⇒ 被支配）</text>
  <path d="M 260 142 L 260 156" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="84" y="160" width="352" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② 从队尾弹出所有下标 &gt; 2i+1 的过期候选</text>
  <path d="M 260 192 L 260 206" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="84" y="210" width="352" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="230" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">③ dp[i] = prices[i−1] + dp[队尾]</text>
  <text x="260" y="249" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">队尾恰是窗口 [i+1, 2i+1] 内的最小 dp 值</text>
  <path d="M 260 260 L 260 276" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="260,278 340,312 260,346 180,312" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="317" text-anchor="middle" font-size="12" fill="#8a6420" font-weight="bold" filter="url(#rough2)">i &gt; 1 ?</text>

  <!-- loop back (no) -->
  <path d="M 346 312 L 452 312 L 452 117 L 442 117" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="396" y="304" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否，i−−</text>

  <!-- yes -->
  <path d="M 260 346 L 260 364" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="274" y="360" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- return -->
  <rect x="170" y="368" width="180" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="388" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 dp[1]</text>

  <!-- invariant note -->
  <rect x="56" y="416" width="408" height="46" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="436" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">不变式：队列内下标从队首到队尾递增、dp 值严格递减 ⇒ 队尾即窗口最小</text>
  <text x="260" y="454" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">每个下标至多进队一次、出队一次 ⇒ 均摊 O(1)，总计 O(n)</text>
</svg>
