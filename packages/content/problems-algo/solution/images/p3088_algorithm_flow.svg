<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 查中间 → 双指针修复</text>

  <!-- start -->
  <ellipse cx="260" cy="46" rx="44" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="51" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 260 62 L 260 76" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- sort -->
  <rect x="180" y="78" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="98" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">排序 s（m = n/2）</text>
  <path d="M 260 108 L 260 122" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="260,122 346,152 260,182 174,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="156" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">s[m−1] == s[m] ?</text>

  <path d="M 346 152 L 384 152" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="358" y="144" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="386" y="134" width="122" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="447" y="148" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">返回 s（排序串已是</text>
  <text x="447" y="162" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">字典序最小反回文）</text>

  <path d="M 260 182 L 260 200" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="196" font-size="11" fill="#446688" filter="url(#rough2)">是</text>

  <!-- locate i -->
  <rect x="132" y="202" width="256" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="222" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i ← m；跳过右半整段 c（s[i]==s[i−1] 则 i++）</text>
  <path d="M 260 232 L 260 246" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 2 -->
  <polygon points="260,246 350,276 260,306 170,276" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">j &lt; n 且 s[j] == s[n−j−1] ?</text>
  <text x="260" y="288" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">（第 j 对仍冲突？）</text>

  <path d="M 170 276 L 138 276" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="158" y="268" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="32" y="258" width="106" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="85" y="272" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">返回 s</text>
  <text x="85" y="286" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">（修复完成）</text>

  <path d="M 260 306 L 260 322" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="318" font-size="11" fill="#446688" filter="url(#rough2)">是</text>

  <!-- diamond 3 -->
  <polygon points="260,322 352,352 260,382 168,352" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="356" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">i ≥ n ?</text>

  <path d="M 168 352 L 134 352" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="152" y="344" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="30" y="334" width="104" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="82" y="348" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 "-1"</text>
  <text x="82" y="362" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">（频次 &gt; n/2）</text>

  <path d="M 352 352 L 388 352" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="372" y="344" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="390" y="334" width="118" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="449" y="348" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">swap(s[i], s[j])</text>
  <text x="449" y="362" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">i++；j++</text>

  <!-- loop back -->
  <path d="M 470 334 L 470 276 L 354 276" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
</svg>
