<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：统计词频 → 分类配对 → 加中心位</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">按 w[0]==w[1] 分两支；非回文按 w&lt;rev 去重，避免重复计数</text>

  <!-- ===== Start ===== -->
  <rect x="230" y="58" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="280" y="77" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始</text>
  <line x1="280" y1="88" x2="280" y2="104" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Init ===== -->
  <rect x="150" y="106" width="260" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="11" fill="#555">cnt = Counter(words)</text>
  <text x="280" y="140" text-anchor="middle" font-size="10" fill="#888">ans = 0, central = 0</text>
  <line x1="280" y1="148" x2="280" y2="164" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Loop header ===== -->
  <rect x="170" y="166" width="220" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="185" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">for (w, c) in cnt.items()</text>
  <line x1="280" y1="196" x2="280" y2="212" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision diamond: w[0]==w[1]? ===== -->
  <polygon points="280,214 400,254 280,294 160,254" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">w[0] == w[1]?</text>
  <text x="280" y="266" text-anchor="middle" font-size="9.5" fill="#888">(自回文?)</text>

  <!-- ===== Yes branch (left): self-palindrome ===== -->
  <line x1="160" y1="254" x2="120" y2="254" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="246" font-size="10" fill="#d6a040" font-weight="bold">是</text>

  <rect x="20" y="278" width="200" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="120" y="296" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">自回文支</text>
  <text x="120" y="314" text-anchor="middle" font-size="10" fill="#555">ans += (c // 2) × 4</text>
  <text x="120" y="330" text-anchor="middle" font-size="10" fill="#555">if c % 2 == 1:</text>
  <text x="120" y="346" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">  central = 1</text>

  <!-- ===== No branch (right): mirror pair ===== -->
  <line x1="400" y1="254" x2="440" y2="254" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="246" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <rect x="340" y="278" width="200" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="440" y="296" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">镜像支</text>
  <text x="440" y="314" text-anchor="middle" font-size="10" fill="#555">rev = w[::-1]</text>
  <text x="440" y="330" text-anchor="middle" font-size="10" fill="#555">if w &lt; rev and rev in cnt:</text>
  <text x="440" y="346" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">  ans += min(c, cnt[rev]) × 4</text>

  <!-- ===== merge: loop back (dashed) ===== -->
  <path d="M 120 358 L 120 392 L 440 392 L 440 358" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 280 392 L 280 181 L 390 181" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="406" font-size="9.5" fill="#888">继续下一词（w&lt;rev 去重）</text>

  <!-- ===== Return ===== -->
  <line x1="280" y1="410" x2="280" y2="416" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="418" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="16" filter="url(#rough2)"/>
  <text x="280" y="440" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return ans + central × 2</text>

  <text x="280" y="462" text-anchor="middle" font-size="10" fill="#aaa">遍历词频表 O(n) · 表大小 O(|Σ|²)=O(676) · 总 O(n) 时间 / O(1) 空间</text>
</svg>
