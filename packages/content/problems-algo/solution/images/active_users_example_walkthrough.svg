<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="540" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：id=1 不活跃，id=7 活跃（5 天连续）</text>

  <!-- ============ Panel: id = 1 (Winston) ============ -->
  <rect x="24" y="40" width="552" height="124" fill="#ffffff" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <rect x="24" y="40" width="552" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="40" y="56" font-size="11" fill="#b85450" font-weight="bold">id = 1 · Winston</text>
  <text x="560" y="56" text-anchor="end" font-size="9" fill="#b85450">原始 2 行（无重复）→ 去重后 2 天</text>

  <!-- header -->
  <rect x="40" y="72" width="140" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="86" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">去重后 login_date</text>
  <rect x="180" y="72" width="50" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="86" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">rn</text>
  <rect x="230" y="72" width="130" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="295" y="86" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">g</text>
  <rect x="360" y="72" width="180" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="450" y="86" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">分组结果</text>

  <!-- row 1 -->
  <rect x="40" y="92" width="140" height="20" fill="#ffffff" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="106" text-anchor="middle" font-size="9.5" fill="#333">2020-05-30</text>
  <rect x="180" y="92" width="50" height="20" fill="#ffffff" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="106" text-anchor="middle" font-size="9.5" fill="#333">1</text>
  <rect x="230" y="92" width="130" height="20" fill="#ffffff" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="295" y="106" text-anchor="middle" font-size="9.5" fill="#b85450">2020-05-29</text>
  <rect x="360" y="92" width="180" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="450" y="106" text-anchor="middle" font-size="9.5" fill="#b85450">组 A · count = 1</text>

  <!-- row 2 -->
  <rect x="40" y="112" width="140" height="20" fill="#ffffff" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="126" text-anchor="middle" font-size="9.5" fill="#333">2020-06-07</text>
  <rect x="180" y="112" width="50" height="20" fill="#ffffff" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="126" text-anchor="middle" font-size="9.5" fill="#333">2</text>
  <rect x="230" y="112" width="130" height="20" fill="#ffffff" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="295" y="126" text-anchor="middle" font-size="9.5" fill="#b85450">2020-06-05</text>
  <rect x="360" y="112" width="180" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="450" y="126" text-anchor="middle" font-size="9.5" fill="#b85450">组 B · count = 1</text>

  <text x="300" y="150" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">最大连续段 = 1 ＜ 5  →  Winston 不活跃 ✗</text>

  <!-- ============ Panel: id = 7 (Jonathan) ============ -->
  <rect x="24" y="176" width="552" height="232" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <rect x="24" y="176" width="552" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="40" y="192" font-size="11" fill="#4a7a3a" font-weight="bold">id = 7 · Jonathan</text>
  <text x="560" y="192" text-anchor="end" font-size="9" fill="#4a7a3a">原始 7 行（06-02 重复 2 次）→ 去重后 6 天</text>

  <!-- header -->
  <rect x="40" y="208" width="140" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="222" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">去重后 login_date</text>
  <rect x="180" y="208" width="50" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="222" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">rn</text>
  <rect x="230" y="208" width="130" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="295" y="222" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">g</text>
  <rect x="360" y="208" width="180" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="450" y="222" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">分组结果</text>

  <!-- 5 green rows: 05-30 .. 06-03 -->
  <rect x="40" y="228" width="140" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="241" text-anchor="middle" font-size="9" fill="#333">2020-05-30</text>
  <rect x="180" y="228" width="50" height="18" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="241" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="230" y="228" width="130" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="295" y="241" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2020-05-29</text>
  <rect x="360" y="228" width="180" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="450" y="241" text-anchor="middle" font-size="9" fill="#4a7a3a">组 A</text>

  <rect x="40" y="246" width="140" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="259" text-anchor="middle" font-size="9" fill="#333">2020-05-31</text>
  <rect x="180" y="246" width="50" height="18" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="259" text-anchor="middle" font-size="9" fill="#333">2</text>
  <rect x="230" y="246" width="130" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="295" y="259" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2020-05-29</text>
  <rect x="360" y="246" width="180" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="450" y="259" text-anchor="middle" font-size="9" fill="#4a7a3a">组 A</text>

  <rect x="40" y="264" width="140" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="277" text-anchor="middle" font-size="9" fill="#333">2020-06-01</text>
  <rect x="180" y="264" width="50" height="18" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="277" text-anchor="middle" font-size="9" fill="#333">3</text>
  <rect x="230" y="264" width="130" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="295" y="277" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2020-05-29</text>
  <rect x="360" y="264" width="180" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="450" y="277" text-anchor="middle" font-size="9" fill="#4a7a3a">组 A</text>

  <rect x="40" y="282" width="140" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="295" text-anchor="middle" font-size="9" fill="#333">2020-06-02</text>
  <rect x="180" y="282" width="50" height="18" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="295" text-anchor="middle" font-size="9" fill="#333">4</text>
  <rect x="230" y="282" width="130" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="295" y="295" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2020-05-29</text>
  <rect x="360" y="282" width="180" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="450" y="295" text-anchor="middle" font-size="9" fill="#4a7a3a">组 A</text>

  <rect x="40" y="300" width="140" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="313" text-anchor="middle" font-size="9" fill="#333">2020-06-03</text>
  <rect x="180" y="300" width="50" height="18" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="313" text-anchor="middle" font-size="9" fill="#333">5</text>
  <rect x="230" y="300" width="130" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="295" y="313" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2020-05-29</text>
  <rect x="360" y="300" width="180" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="450" y="313" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">组 A · count = 5 ✓</text>

  <!-- red row: 06-10 -->
  <rect x="40" y="318" width="140" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="331" text-anchor="middle" font-size="9" fill="#333">2020-06-10</text>
  <rect x="180" y="318" width="50" height="18" fill="#ffffff" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="331" text-anchor="middle" font-size="9" fill="#333">6</text>
  <rect x="230" y="318" width="130" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="295" y="331" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2020-06-04</text>
  <rect x="360" y="318" width="180" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="450" y="331" text-anchor="middle" font-size="9" fill="#b85450">组 B · count = 1</text>

  <text x="300" y="360" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">组 A(05-29) count = 5 ≥ 5  →  Jonathan 活跃 ✓</text>
  <text x="300" y="378" text-anchor="middle" font-size="9" fill="#888">注：6 行中有 5 天连续(05-30→06-03)，06-10 跳天另成一组</text>
  <text x="300" y="394" text-anchor="middle" font-size="9" fill="#888">原始 06-02 的重复行被 DISTINCT 去掉，不影响连续性判定</text>

  <!-- ============ output box ============ -->
  <rect x="170" y="420" width="260" height="86" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <rect x="170" y="420" width="260" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="437" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">最终输出（ORDER BY id）</text>

  <rect x="190" y="448" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="220" y="463" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">id</text>
  <rect x="250" y="448" width="160" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="330" y="463" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">name</text>

  <rect x="190" y="470" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="220" y="486" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">7</text>
  <rect x="250" y="470" width="160" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="330" y="486" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Jonathan</text>

  <text x="300" y="524" text-anchor="middle" font-size="9" fill="#888">守恒校验：判定「连续」只看去重后的不同日期，与登录次数无关。</text>
</svg>
