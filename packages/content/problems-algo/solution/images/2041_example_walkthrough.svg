<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="380" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：JOIN → WHERE 裁剪 → GROUP BY 求和 → HAVING 过滤</text>

  <!-- ===== Column 1: JOIN ===== -->
  <text x="30" y="50" font-size="10" fill="#446688" font-weight="bold">① JOIN 后（12 行）</text>
  <rect x="24" y="56" width="150" height="260" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="32" y="70" font-size="8" fill="#888">cand name    iv  s</text>
  <line x1="24" y1="74" x2="174" y2="74" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <!-- Atticus rows (pink) -->
  <text x="32" y="86" font-size="8" fill="#b85450">11 Atticus 101 8</text>
  <text x="32" y="98" font-size="8" fill="#b85450">11 Atticus 101 8</text>
  <!-- Ruben rows (green) -->
  <text x="32" y="110" font-size="8" fill="#4a7a3a">9  Ruben  104 6</text>
  <text x="32" y="122" font-size="8" fill="#4a7a3a">9  Ruben  104 7</text>
  <text x="32" y="134" font-size="8" fill="#4a7a3a">9  Ruben  104 2</text>
  <text x="32" y="146" font-size="8" fill="#4a7a3a">9  Ruben  104 7</text>
  <!-- Aliza rows (orange) -->
  <text x="32" y="158" font-size="8" fill="#d6a040">6  Aliza  109 4</text>
  <text x="32" y="170" font-size="8" fill="#d6a040">6  Aliza  109 1</text>
  <text x="32" y="182" font-size="8" fill="#d6a040">6  Aliza  109 4</text>
  <text x="32" y="194" font-size="8" fill="#d6a040">6  Aliza  109 1</text>
  <!-- Alfredo rows (pink) -->
  <text x="32" y="206" font-size="8" fill="#b85450">8  Alfredo107 3</text>
  <text x="32" y="218" font-size="8" fill="#b85450">8  Alfredo107 3</text>
  <text x="32" y="240" font-size="7" fill="#888">exp 标注：</text>
  <text x="32" y="252" font-size="7" fill="#b85450">Atticus exp=1</text>
  <text x="32" y="264" font-size="7" fill="#b85450">Alfredo exp=0</text>
  <text x="32" y="276" font-size="7" fill="#4a7a3a">Ruben exp=6</text>
  <text x="32" y="288" font-size="7" fill="#d6a040">Aliza exp=10</text>
  <text x="32" y="306" font-size="7" fill="#888">4 候选人 / 12 轮</text>

  <!-- arrow 1->2 -->
  <path d="M 178 150 L 206 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="192" y="144" text-anchor="middle" font-size="8" fill="#b85450">WHERE</text>
  <text x="192" y="160" text-anchor="middle" font-size="7" fill="#b85450">exp≥2</text>

  <!-- ===== Column 2: WHERE ===== -->
  <text x="212" y="50" font-size="10" fill="#b85450" font-weight="bold">② WHERE 后（8 行）</text>
  <rect x="206" y="56" width="150" height="180" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="214" y="70" font-size="8" fill="#888">cand name    iv  s</text>
  <line x1="206" y1="74" x2="356" y2="74" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="208" y="78" width="146" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="3" filter="url(#rough2)" opacity="0.4"/>
  <text x="214" y="90" font-size="8" fill="#4a7a3a">9  Ruben  104 6</text>
  <text x="214" y="102" font-size="8" fill="#4a7a3a">9  Ruben  104 7</text>
  <text x="214" y="114" font-size="8" fill="#4a7a3a">9  Ruben  104 2</text>
  <text x="214" y="126" font-size="8" fill="#4a7a3a">9  Ruben  104 7</text>
  <rect x="208" y="146" width="146" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="0.6" rx="3" filter="url(#rough2)" opacity="0.4"/>
  <text x="214" y="158" font-size="8" fill="#d6a040">6  Aliza  109 4</text>
  <text x="214" y="170" font-size="8" fill="#d6a040">6  Aliza  109 1</text>
  <text x="214" y="182" font-size="8" fill="#d6a040">6  Aliza  109 4</text>
  <text x="214" y="194" font-size="8" fill="#d6a040">6  Aliza  109 1</text>
  <text x="214" y="218" font-size="7" fill="#b85450">✗ Atticus(1) 整组丢</text>
  <text x="214" y="230" font-size="7" fill="#b85450">✗ Alfredo(0) 整组丢</text>

  <!-- arrow 2->3 -->
  <path d="M 360 150 L 388 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="374" y="144" text-anchor="middle" font-size="8" fill="#446688">GROUP</text>
  <text x="374" y="160" text-anchor="middle" font-size="7" fill="#446688">+SUM</text>

  <!-- ===== Column 3: GROUP BY + SUM ===== -->
  <text x="394" y="50" font-size="10" fill="#446688" font-weight="bold">③ 求和后（2 组）</text>
  <rect x="388" y="56" width="160" height="180" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="396" y="70" font-size="8" fill="#888">cand  求和        总分</text>
  <line x1="388" y1="74" x2="548" y2="74" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="390" y="80" width="156" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="396" y="94" font-size="8" fill="#4a7a3a">9     6+7+2+7      22</text>
  <text x="396" y="110" font-size="7" fill="#4a7a3a">Ruben</text>
  <rect x="390" y="130" width="156" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="396" y="144" font-size="8" fill="#d6a040">6     4+1+4+1      10</text>
  <text x="396" y="160" font-size="7" fill="#d6a040">Aliza</text>
  <text x="396" y="194" font-size="7" fill="#888">2 组候选</text>
  <text x="396" y="206" font-size="7" fill="#888">等待 HAVING 判定</text>
  <text x="396" y="224" font-size="7" fill="#d6a040">⚠ 10 是边界值</text>

  <!-- arrow 3->4 -->
  <path d="M 552 150 L 580 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="566" y="144" text-anchor="middle" font-size="8" fill="#d6a040">HAVING</text>
  <text x="566" y="160" text-anchor="middle" font-size="7" fill="#d6a040">SUM&gt;10</text>

  <!-- ===== Column 4: HAVING result ===== -->
  <text x="586" y="50" font-size="10" fill="#4a7a3a" font-weight="bold">④ 输出（1 行）</text>
  <rect x="580" y="56" width="150" height="180" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="588" y="70" font-size="8" fill="#888">candidate_id</text>
  <line x1="580" y1="74" x2="730" y2="74" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="582" y="80" width="146" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="610" y="100" font-size="13" fill="#4a7a3a" font-weight="bold">9</text>
  <text x="588" y="128" font-size="7" fill="#4a7a3a">✓ Ruben 22 &gt; 10</text>
  <text x="588" y="146" font-size="7" fill="#b85450">✗ Aliza 10 ≯ 10</text>
  <text x="588" y="164" font-size="7" fill="#b85450">（严格大于，</text>
  <text x="588" y="176" font-size="7" fill="#b85450">  等号不算）</text>
  <text x="588" y="200" font-size="7" fill="#888">最终结果：</text>
  <text x="588" y="212" font-size="7" fill="#4a7a3a" font-weight="bold">candidate_id = 9</text>

  <!-- ===== bottom note ===== -->
  <rect x="24" y="332" width="706" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="378" y="350" text-anchor="middle" font-size="10" fill="#d6a040">数据流：12 行 JOIN → 8 行 WHERE 裁剪 → 2 组 SUM → 1 行 HAVING 过滤</text>
  <text x="378" y="366" text-anchor="middle" font-size="9" fill="#d6a040">边界陷阱：Aliza 总分恰为 10，"严格大于 10" 不录取；若误写 ≥10 会多输出 candidate_id=6</text>

  <!-- ===== legend ===== -->
  <rect x="24" y="392" width="706" height="68" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="34" y="408" font-size="9" fill="#555" font-weight="bold">图例</text>
  <rect x="80" y="400" width="16" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="102" y="410" font-size="8" fill="#4a7a3a">Ruben（exp=6，总分=22，录取 ✓）</text>
  <rect x="80" y="416" width="16" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="102" y="426" font-size="8" fill="#d6a040">Aliza（exp=10，总分=10，边界丢弃 ✗）</text>
  <rect x="80" y="432" width="16" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="102" y="442" font-size="8" fill="#b85450">Atticus（exp=1）/ Alfredo（exp=0）：WHERE 阶段整组丢弃</text>
  <text x="380" y="410" font-size="8" fill="#888">iv = interview_id</text>
  <text x="380" y="424" font-size="8" fill="#888">s  = score</text>
  <text x="380" y="438" font-size="8" fill="#888">cand = candidate_id</text>
</svg>
