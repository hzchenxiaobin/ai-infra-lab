<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="16" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：按序扫查询 → bitset 转移 → 全员达标即停</text>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <rect x="192" y="26" width="136" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="260" y="43" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold">初始化 f[i] = {0}，k' = 0</text>
  </g>
  <line x1="260" y1="52" x2="260" y2="68" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判定 1：k=0 全零？ -->
  <g filter="url(#rough2)">
    <polygon points="182,94 260,72 338,94 260,116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="91" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold">k = 0 时全零？</text>
    <text x="260" y="105" text-anchor="middle" font-size="8.5" fill="#8a6d1f">（nums 全为 0）</text>
  </g>
  <line x1="338" y1="94" x2="394" y2="94" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="362" y="86" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="398" y="81" width="94" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="445" y="98" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">返回 0</text>
  </g>
  <line x1="260" y1="116" x2="260" y2="128" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="127" font-size="9.5" fill="#a03934" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 取下一条查询 -->
  <g filter="url(#rough2)">
    <rect x="168" y="132" width="184" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="260" y="146" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">取下一条查询 [l, r, v]</text>
    <text x="260" y="159" text-anchor="middle" font-size="9" fill="#55677d">k' ← k' + 1</text>
  </g>
  <line x1="260" y1="164" x2="260" y2="182" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 转移 -->
  <g filter="url(#rough2)">
    <rect x="108" y="186" width="304" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="260" y="200" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">对每个 i（l ≤ i ≤ r）：未达标才转移</text>
    <text x="260" y="214" text-anchor="middle" font-size="9" fill="#55677d">f[i] |= f[i] &lt;&lt; v，并裁掉 &gt; nums[i] 的高位</text>
  </g>
  <line x1="260" y1="222" x2="260" y2="228" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判定 3：全员达标？ -->
  <g filter="url(#rough2)">
    <polygon points="172,256 260,232 348,256 260,280" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="253" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold">所有下标达标？</text>
    <text x="260" y="267" text-anchor="middle" font-size="8.5" fill="#8a6d1f">（每个 nums[i] 可达）</text>
  </g>
  <line x1="348" y1="256" x2="394" y2="256" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="366" y="248" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="398" y="243" width="94" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="445" y="260" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">返回 k'</text>
  </g>
  <line x1="260" y1="280" x2="260" y2="296" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="292" font-size="9.5" fill="#a03934" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 判定 4：还有查询？ -->
  <g filter="url(#rough2)">
    <polygon points="192,322 260,300 328,322 260,344" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="326" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold">还有查询？</text>
  </g>
  <line x1="328" y1="322" x2="394" y2="322" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="350" y="314" text-anchor="middle" font-size="9.5" fill="#a03934" font-weight="bold" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="398" y="309" width="94" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="445" y="326" text-anchor="middle" font-size="10.5" fill="#a03934" font-weight="bold">返回 −1</text>
  </g>

  <!-- 循环回路 -->
  <path d="M 192 322 L 84 322 L 84 148 L 162 148" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="84" y="238" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" transform="rotate(-90 84 238)" filter="url(#rough2)">是：取下一条查询</text>
</svg>
