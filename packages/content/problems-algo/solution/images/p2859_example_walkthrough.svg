<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="340" fill="#fafafa"/>

  <text x="310" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1 演算：nums = [5,10,1,5,2]，k = 1</text>
  <text x="310" y="42" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">逐下标统计置位数，命中（= k）则累加对应元素</text>

  <!-- 表头背景 -->
  <rect x="80" y="56" width="460" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 数据行背景：命中行绿色 -->
  <rect x="80" y="82" width="460" height="28" fill="#ffffff" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="80" y="110" width="460" height="28" fill="#e6f4ea" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="80" y="138" width="460" height="28" fill="#e6f4ea" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="80" y="166" width="460" height="28" fill="#ffffff" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="80" y="194" width="460" height="28" fill="#e6f4ea" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>

  <!-- 表头文字 -->
  <text x="105" y="73" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="172" y="73" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">二进制</text>
  <text x="250" y="73" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">置位数</text>
  <text x="315" y="73" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">命中？</text>
  <text x="385" y="73" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">nums[i]</text>
  <text x="482" y="73" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">ans 累计</text>

  <!-- 行 0：i=0 -->
  <text x="105" y="101" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="172" y="101" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">000₂</text>
  <text x="250" y="101" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="315" y="101" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">✗</text>
  <text x="385" y="101" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>
  <text x="482" y="101" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <!-- 行 1：i=1 命中 -->
  <text x="105" y="129" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="172" y="129" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">001₂</text>
  <text x="250" y="129" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="315" y="129" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="385" y="129" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <text x="482" y="129" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">10</text>

  <!-- 行 2：i=2 命中 -->
  <text x="105" y="157" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="172" y="157" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">010₂</text>
  <text x="250" y="157" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="315" y="157" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="385" y="157" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="482" y="157" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">11</text>

  <!-- 行 3：i=3 -->
  <text x="105" y="185" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="172" y="185" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">011₂</text>
  <text x="250" y="185" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="315" y="185" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">✗</text>
  <text x="385" y="185" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>
  <text x="482" y="185" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11</text>

  <!-- 行 4：i=4 命中 -->
  <text x="105" y="213" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="172" y="213" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">100₂</text>
  <text x="250" y="213" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="315" y="213" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="385" y="213" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="482" y="213" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">13</text>

  <!-- 结果框 -->
  <rect x="80" y="240" width="460" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="265" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">答案 = nums[1] + nums[2] + nums[4] = 10 + 1 + 2 = 13 ✓</text>

  <text x="310" y="304" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">示例 2（k = 2）：仅下标 3（11₂）恰有 2 个置位 ⟹ 答案 = nums[3] = 1</text>
  <text x="310" y="326" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">k = 0：仅下标 0（000₂）命中 ⟹ 答案 = nums[0]；k = 10：无下标可命中 ⟹ 答案 = 0</text>
</svg>
