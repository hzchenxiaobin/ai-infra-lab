<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">算法流程：二分找最右 target</text>

  <!-- 初始化 -->
  <rect x="120" y="46" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="71" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">left=0, right=len−1, ans=−1</text>

  <path d="M260,88 L260,108" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环判定 -->
  <polygon points="260,112 400,158 260,204 120,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">left &lt;= right ?</text>
  <text x="260" y="176" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">还有搜索空间</text>

  <path d="M400,158 L446,158 L446,196" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408,152" font-size="11" fill="#b85450" filter="url(#rough2)"></text>
  <text x="412" y="152" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="404" y="196" width="88" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="448" y="219" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return ans</text>

  <!-- 是：进循环体 -->
  <path d="M260,204 L260,228" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="220" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="120" y="230" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">mid = (left + right) &gt;&gt; 1</text>

  <!-- 三分支 -->
  <polygon points="260,274 410,318 260,362 110,318" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">this[mid] 与 target ?</text>
  <text x="260" y="334" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">三分支决策</text>

  <!-- == 分支 -->
  <path d="M110,318 L70,318 L70,368" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="312" font-size="11" fill="#b85450" filter="url(#rough2)">==</text>
  <rect x="28" y="368" width="100" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="78" y="390" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">ans = mid</text>
  <text x="78" y="408" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">left = mid+1</text>

  <!-- < 分支 -->
  <path d="M260,362 L260,380" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="220" y="376" font-size="11" fill="#446688" filter="url(#rough2)">&lt;</text>
  <rect x="200" y="384" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="406" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">left = mid+1</text>

  <!-- > 分支 -->
  <path d="M410,318 L460,318 L460,368" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="424" y="312" font-size="11" fill="#446688" filter="url(#rough2)">&gt;</text>
  <rect x="402" y="368" width="100" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="452" y="390" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">right = mid−1</text>

  <!-- 回到循环顶 -->
  <path d="M78,418 L78,432 L260,432 L260,438" stroke="#888" stroke-width="1" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M260,418 L260,432" stroke="#888" stroke-width="1" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <path d="M452,402 L452,432 L260,432" stroke="#888" stroke-width="1" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <text x="320" y="430" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">回到循环判定</text>
</svg>
