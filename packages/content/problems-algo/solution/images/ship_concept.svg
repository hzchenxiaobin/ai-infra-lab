<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分答案：运力 cap 越大 → 所需天数 need(cap) 越小（单调递减）</text>

  <!-- ===== Weights array with day grouping (cap=15) ===== -->
  <text x="40" y="52" font-size="12" fill="#888">包裹数组 (cap=15 时的贪心装船):</text>

  <!-- Day brackets above boxes -->
  <!-- Day1: boxes 0-4 -->
  <path d="M 96 116 L 96 108 L 264 108 L 264 116" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="180" y="102" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Day1 = 15</text>
  <!-- Day2: boxes 5-6 -->
  <path d="M 266 116 L 266 108 L 332 108 L 332 116" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="299" y="102" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Day2 = 13</text>
  <!-- Day3: box 7 -->
  <path d="M 334 116 L 334 108 L 366 108 L 366 116" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="350" y="102" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">Day3 = 8</text>
  <!-- Day4: box 8 -->
  <path d="M 368 116 L 368 108 L 400 108 L 400 116" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="384" y="102" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">Day4 = 9</text>
  <!-- Day5: box 9 -->
  <path d="M 402 116 L 402 108 L 434 108 L 434 116" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="418" y="102" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Day5 = 10</text>

  <!-- baseline -->
  <line x1="90" y1="162" x2="440" y2="162" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 10 weight boxes, colored by day -->
  <!-- Day1 (green): 1,2,3,4,5 -->
  <rect x="96" y="132" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="130" y="132" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="164" y="132" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="198" y="132" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="232" y="132" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="248" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <!-- Day2 (blue): 6,7 -->
  <rect x="266" y="132" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <rect x="300" y="132" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="316" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <!-- Day3 (orange): 8 -->
  <rect x="334" y="132" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <!-- Day4 (red): 9 -->
  <rect x="368" y="132" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="384" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <!-- Day5 (green): 10 -->
  <rect x="402" y="132" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="418" y="150" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>

  <text x="112" y="178" text-anchor="middle" font-size="9" fill="#999">w[0]</text>
  <text x="418" y="178" text-anchor="middle" font-size="9" fill="#999">w[n-1]</text>

  <!-- arrow down -->
  <path d="M 280 188 L 280 206" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="200" font-size="11" fill="#888">need(cap) 单调递减</text>

  <!-- ===== Monotonic curve ===== -->
  <!-- axes -->
  <line x1="90" y1="220" x2="90" y2="370" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="90" y1="370" x2="380" y2="370" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="84" y="226" text-anchor="end" font-size="10" fill="#888">need</text>
  <text x="384" y="374" font-size="10" fill="#888">cap →</text>
  <text x="84" y="374" text-anchor="end" font-size="10" fill="#999">0</text>

  <!-- decreasing curve: cap=10,need=7 -> cap=55,need=1 -->
  <path d="M 90 265 C 150 290 220 335 380 355" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="160" y="252" font-size="11" fill="#446688" font-weight="bold">cap ↑ ⇒ need ↓</text>

  <!-- days threshold line -->
  <line x1="90" y1="295" x2="380" y2="295" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="384" y="299" font-size="11" fill="#b85450" font-weight="bold">days = 5</text>

  <!-- answer point at cap=15, need=5 -->
  <circle cx="122" cy="295" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="122" y1="295" x2="122" y2="370" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="122" y="386" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">cap = 15</text>

  <!-- feasible / infeasible labels -->
  <text x="98" y="288" font-size="10" fill="#b85450">运力不足 ✗</text>
  <text x="300" y="288" font-size="10" fill="#4a7a3a">可行 ✓</text>

  <!-- right summary note -->
  <rect x="396" y="232" width="150" height="128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="471" y="256" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">答案空间</text>
  <text x="471" y="278" text-anchor="middle" font-size="11" fill="#666">cap ∈ [max, sum]</text>
  <text x="471" y="300" text-anchor="middle" font-size="11" fill="#666">求最小的 cap</text>
  <text x="471" y="318" text-anchor="middle" font-size="11" fill="#666">使 need(cap) ≤ days</text>
  <text x="471" y="342" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">单调 ⇒ 可二分！</text>
</svg>
