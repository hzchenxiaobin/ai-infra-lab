<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.4"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.4"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="260" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    折叠视角：两端向中间配对，成对决策（n = 8）
  </text>

  <!-- ===== 4 列等距对 ===== -->
  <!-- 第 0 对 -->
  <rect x="58" y="50" width="84" height="138" fill="none" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="100" y="44" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">第 0 对</text>
  <!-- 第 1 对 -->
  <rect x="168" y="50" width="84" height="138" fill="none" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="210" y="44" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">第 1 对</text>
  <!-- 第 2 对 -->
  <rect x="278" y="50" width="84" height="138" fill="none" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="320" y="44" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">第 2 对</text>
  <!-- 第 3 对 -->
  <rect x="388" y="50" width="84" height="138" fill="none" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="430" y="44" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">第 3 对</text>

  <!-- 上排房子（前半，从左到右） -->
  <rect x="68" y="62" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="100" y="87" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">房子 0</text>
  <rect x="178" y="62" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="210" y="87" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">房子 1</text>
  <rect x="288" y="62" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="320" y="87" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">房子 2</text>
  <rect x="398" y="62" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="430" y="87" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">房子 3</text>

  <!-- 下排房子（后半，镜像排列） -->
  <rect x="68" y="138" width="64" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="100" y="163" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">房子 7</text>
  <rect x="178" y="138" width="64" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="210" y="163" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">房子 6</text>
  <rect x="288" y="138" width="64" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="320" y="163" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">房子 5</text>
  <rect x="398" y="138" width="64" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="430" y="163" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">房子 4</text>

  <!-- 上排相邻箭头（a_k != a_{k+1}） -->
  <path d="M136,82 L172,82" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M246,82 L282,82" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M356,82 L392,82" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 下排相邻箭头（b_k != b_{k+1}） -->
  <path d="M136,158 L172,158" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M246,158 L282,158" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M356,158 L392,158" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 列内等距约束：双向红箭头 a != b -->
  <path d="M100,106 L100,134" fill="none" stroke="#b85450" stroke-width="1.8" marker-start="url(#arrR)" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="110" y="124" font-size="10.5" fill="#b85450" filter="url(#rough2)">a≠b</text>
  <path d="M210,106 L210,134" fill="none" stroke="#b85450" stroke-width="1.8" marker-start="url(#arrR)" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="220" y="124" font-size="10.5" fill="#b85450" filter="url(#rough2)">a≠b</text>
  <path d="M320,106 L320,134" fill="none" stroke="#b85450" stroke-width="1.8" marker-start="url(#arrR)" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="330" y="124" font-size="10.5" fill="#b85450" filter="url(#rough2)">a≠b</text>
  <path d="M430,106 L430,134" fill="none" stroke="#b85450" stroke-width="1.8" marker-start="url(#arrR)" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="440" y="124" font-size="10.5" fill="#b85450" filter="url(#rough2)">a≠b</text>

  <!-- 最右列：中间一对在原序列中相邻 -->
  <path d="M464,82 Q500,120 464,158" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="487" y="116" font-size="9.5" fill="#b85450" filter="url(#rough2)">原序列</text>
  <text x="487" y="128" font-size="9.5" fill="#b85450" filter="url(#rough2)">相邻</text>

  <!-- 底部说明框 1：三重约束 -->
  <rect x="28" y="208" width="232" height="76" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="144" y="228" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">三重约束全部局部化</text>
  <text x="144" y="248" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">① 上排相邻 ⇒ aₖ ≠ aₖ₊₁</text>
  <text x="144" y="265" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">② 下排相邻 ⇒ bₖ ≠ bₖ₊₁</text>
  <text x="144" y="279" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">③ 对内等距 ⇒ aₖ ≠ bₖ</text>

  <!-- 底部说明框 2：状态定义 -->
  <rect x="272" y="208" width="222" height="76" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="383" y="228" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">成对状态只有 6 个</text>
  <text x="383" y="248" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">dp[a][b]：涂完第 0..k 对</text>
  <text x="383" y="265" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">（房子 k 涂 a，n−1−k 涂 b）</text>
  <text x="383" y="279" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">的最小总成本；k 逐对推进</text>

  <!-- 折叠前的一排房子 -->
  <text x="46" y="296" font-size="10.5" fill="#888" filter="url(#rough2)">折叠前的一排房子：</text>
  <rect x="96" y="310" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="140" y="310" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="184" y="310" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="228" y="310" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="272" y="310" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="316" y="310" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="360" y="310" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="404" y="310" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="112" y="347" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="156" y="347" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="200" y="347" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <text x="244" y="347" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>
  <text x="288" y="347" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">4</text>
  <text x="332" y="347" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">5</text>
  <text x="376" y="347" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">6</text>
  <text x="420" y="347" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">7</text>

  <!-- 等距配对弧线 -->
  <path d="M112,308 Q266,264 420,308" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M156,308 Q266,274 376,308" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M200,308 Q266,284 332,308" fill="none" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M244,308 Q266,292 288,308" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
</svg>
