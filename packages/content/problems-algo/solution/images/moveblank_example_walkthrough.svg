<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [4,2,0,3,1]，n = 5</text>

  <!-- divider -->
  <line x1="280" y1="44" x2="280" y2="350" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Left : Target A ===== -->
  <rect x="20" y="44" width="240" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">目标 A：[0,1,2,3,4]，k = 0</text>

  <text x="140" y="92" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">i → nums[i] 的非平凡环</text>

  <!-- cycle {0,4,1,2} center (140,150) r=28 node r=12 -->
  <g font-size="11">
    <circle cx="140" cy="122" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="140" y="126" text-anchor="middle" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
    <circle cx="168" cy="150" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="168" y="154" text-anchor="middle" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
    <circle cx="140" cy="178" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="140" y="182" text-anchor="middle" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
    <circle cx="112" cy="150" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="112" y="154" text-anchor="middle" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
    <path d="M 150 130 Q 168 130 165 140" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <path d="M 165 160 Q 168 178 150 178" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <path d="M 130 178 Q 112 178 115 160" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <path d="M 115 140 Q 112 130 130 130" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  </g>

  <text x="140" y="204" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">环 {0,4,1,2} 长 4，含空白归宿；位置 3 自环跳过</text>

  <!-- cnt arithmetic -->
  <rect x="30" y="214" width="220" height="58" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="140" y="232" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">cnt = (m+1) = 4+1 = 5</text>
  <text x="140" y="250" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">nums[0]=4 ≠ 0 → 空白错位 → −2</text>
  <text x="140" y="266" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">cnt_A = 3</text>

  <!-- operation trace -->
  <text x="140" y="290" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">空白沿环走：换2→换1→换4</text>
  <text x="140" y="304" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">[4,2,0,3,1]→[4,0,2,3,1]→[4,1,2,3,0]→[0,1,2,3,4]</text>

  <!-- ===== Right : Target B ===== -->
  <rect x="300" y="44" width="240" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">目标 B：[1,2,3,4,0]，k = 4</text>

  <text x="420" y="92" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">arr = (nums−1+5)%5 = [3,1,4,2,0]</text>

  <!-- cycle {0,3,2,4} center (420,150) r=28 -->
  <g font-size="11">
    <circle cx="420" cy="122" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="420" y="126" text-anchor="middle" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
    <circle cx="448" cy="150" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="448" y="154" text-anchor="middle" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
    <circle cx="420" cy="178" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="420" y="182" text-anchor="middle" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
    <circle cx="392" cy="150" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="392" y="154" text-anchor="middle" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
    <path d="M 430 130 Q 448 130 445 140" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <path d="M 445 160 Q 448 178 430 178" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <path d="M 410 178 Q 392 178 395 160" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <path d="M 395 140 Q 392 130 410 130" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  </g>

  <text x="420" y="204" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">环 {0,3,2,4} 长 4，含空白归宿；位置 1 自环跳过</text>

  <rect x="310" y="214" width="220" height="58" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="420" y="232" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">cnt = (m+1) = 4+1 = 5</text>
  <text x="420" y="250" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">arr[4]=0 ≠ 4 → 空白错位 → −2</text>
  <text x="420" y="266" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">cnt_B = 3</text>

  <text x="420" y="290" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">空白归宿在尾，结构同构于 A</text>
  <text x="420" y="304" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">仅需把值循环左移一位再套同一函数</text>

  <!-- ===== result bar ===== -->
  <rect x="80" y="328" width="400" height="60" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">答案 = min(cnt_A, cnt_B) = min(3, 3)</text>
  <text x="280" y="376" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 3 ✓</text>
</svg>
