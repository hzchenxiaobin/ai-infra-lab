<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#555" stroke-width="1.8" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：可重叠的双子序列 ⟶ 坍缩为「最大子集异或和」</text>

  <!-- 官方示例归属图 -->
  <text x="260" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#555" filter="url(#rough2)">官方示例的选法：A = [2]，B = [2, 3]（nums = [1, 2, 3]）</text>

  <rect x="70" y="78" width="52" height="40" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="96" y="104" text-anchor="middle" font-size="16" fill="#777" filter="url(#rough2)">1</text>
  <rect x="140" y="78" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="166" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#a07820" filter="url(#rough2)">2</text>
  <rect x="210" y="78" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="236" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e4d24" filter="url(#rough2)">3</text>

  <text x="96" y="136" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">都不进</text>
  <text x="166" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#a07820" filter="url(#rough2)">A∩B 都进</text>
  <text x="236" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e4d24" filter="url(#rough2)">仅 B</text>

  <text x="332" y="92" font-size="13" fill="#333" filter="url(#rough2)">X = 2</text>
  <text x="332" y="112" font-size="13" fill="#333" filter="url(#rough2)">Y = 2 ⊕ 3 = 1</text>
  <text x="332" y="134" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">X ⊕ Y = 2 ⊕ 1 = 3</text>

  <!-- 抵消演示 -->
  <text x="260" y="172" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">元素 2 同时进了两个子序列：2 ⊕ 2 = 0，贡献抵消 ⟹ X ⊕ Y = XOR(A Δ B) = XOR({3}) = 3</text>

  <!-- 一般化 -->
  <path d="M 260 184 L 260 206" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="212" width="440" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="236" text-anchor="middle" font-size="12.5" fill="#2c4257" filter="url(#rough2)">每个元素独立 4 选 1：仅 A / 仅 B / 都进（计 2 次，抵消）/ 都不进</text>
  <text x="260" y="260" text-anchor="middle" font-size="12.5" fill="#2c4257" filter="url(#rough2)">⟹ X ⊕ Y 的可达值集合 = 所有子集的 XOR 值（想取子集 S？令 A = S，B = ∅ 即可）</text>

  <!-- 结论 -->
  <path d="M 260 278 L 260 298" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="55" y="304" width="410" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5c10" filter="url(#rough2)">答案 = 最大子集异或和 = 线性基贪心最大值</text>
  <text x="260" y="346" text-anchor="middle" font-size="11.5" fill="#a07820" filter="url(#rough2)">「两个子序列 + 保持顺序」是烟雾弹：XOR 根本不在乎顺序</text>

  <!-- 图例 -->
  <rect x="52" y="376" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="392" font-size="11" fill="#555" filter="url(#rough2)">仅 A：计 1 次</text>
  <rect x="172" y="376" width="26" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="392" font-size="11" fill="#555" filter="url(#rough2)">仅 B：计 1 次</text>
  <rect x="292" y="376" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="326" y="392" font-size="11" fill="#555" filter="url(#rough2)">都进：计 2 次→0</text>
  <rect x="412" y="376" width="26" height="22" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="446" y="392" font-size="11" fill="#555" filter="url(#rough2)">不进</text>
</svg>
