<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：遍历 strs → 分类 → 求值 → 更新最大值 → 返回</text>

  <!-- ====== Input ====== -->
  <rect x="200" y="38" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="12" fill="#333">输入 strs</text>

  <!-- arrow down -->
  <path d="M 270 72 L 270 84" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== Loop box ====== -->
  <rect x="190" y="86" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="108" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">遍历每个 s ∈ strs</text>

  <!-- arrow down -->
  <path d="M 270 120 L 270 136" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== Decision diamond ====== -->
  <polygon points="270,138 340,168 270,198 200,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="165" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">s 全为</text>
  <text x="270" y="180" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">数字？</text>

  <!-- Yes branch (left) -->
  <path d="M 200 168 L 120 168 L 120 202" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="156" y="161" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- No branch (right) -->
  <path d="M 340 168 L 420 168 L 420 202" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="384" y="161" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">否</text>

  <!-- ====== Left: v = int(s) ====== -->
  <rect x="50" y="206" width="140" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="120" y="223" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">解析数值</text>
  <text x="120" y="240" text-anchor="middle" font-size="12" fill="#333">v = int(s)</text>

  <!-- ====== Right: v = len(s) ====== -->
  <rect x="350" y="206" width="140" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="223" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">取长度</text>
  <text x="420" y="240" text-anchor="middle" font-size="12" fill="#333">v = len(s)</text>

  <!-- converge arrows down -->
  <path d="M 120 246 L 120 268 L 250 268" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 420 246 L 420 268 L 290 268" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 270 268 L 270 282" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== Max update ====== -->
  <rect x="170" y="284" width="200" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="306" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">ans = max(ans, v)</text>

  <!-- loop-back dashed arrow (right side, back up to loop box) -->
  <path d="M 370 301 L 460 301 L 460 103 L 350 103" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="472" y="200" text-anchor="middle" font-size="10.5" fill="#888" transform="rotate(-90 472 200)">取下一个 s</text>

  <!-- ====== Return ====== -->
  <path d="M 270 318 L 270 332" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="205" y="334" width="130" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="349" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">return ans</text>
</svg>
