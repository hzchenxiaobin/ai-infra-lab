<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：prices = [3,3,5,0,0,3,1,4]</text>
  <text x="300" y="42" text-anchor="middle" font-size="11" fill="#888">高亮 = 当轮发生变化的值；答案 sell2 = 6</text>

  <!-- Header -->
  <g font-size="11" fill="#444" font-weight="bold">
    <text x="35" y="68">i</text>
    <text x="80" y="68">price</text>
    <text x="150" y="68">buy1</text>
    <text x="225" y="68">sell1</text>
    <text x="300" y="68">buy2</text>
    <text x="375" y="68">sell2</text>
    <text x="455" y="68">说明</text>
  </g>
  <line x1="20" y1="76" x2="580" y2="76" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Init row -->
  <g font-size="10" fill="#999">
    <text x="35" y="96">init</text>
    <text x="80" y="96">—</text>
    <text x="150" y="96">−∞</text>
    <text x="225" y="96">0</text>
    <text x="300" y="96">−∞</text>
    <text x="375" y="96">0</text>
    <text x="455" y="96" fill="#888">初始状态</text>
  </g>

  <!-- i=0, p=3 -->
  <g font-size="10">
    <text x="35" y="128" fill="#333">0</text>
    <text x="80" y="128" fill="#333">3</text>
    <rect x="138" y="116" width="42" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="159" y="128" text-anchor="middle" fill="#b85450" font-weight="bold">−3</text>
    <text x="225" y="128" fill="#999">0</text>
    <rect x="288" y="116" width="42" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="309" y="128" text-anchor="middle" fill="#b85450" font-weight="bold">−3</text>
    <text x="375" y="128" fill="#999">0</text>
    <text x="455" y="128" fill="#888">买①@3</text>
  </g>

  <!-- i=1, p=3 (no change) -->
  <g font-size="10" fill="#aaa">
    <text x="35" y="160">1</text>
    <text x="80" y="160">3</text>
    <text x="150" y="160">−3</text>
    <text x="225" y="160">0</text>
    <text x="300" y="160">−3</text>
    <text x="375" y="160">0</text>
    <text x="455" y="160">无变化</text>
  </g>

  <!-- i=2, p=5 -->
  <g font-size="10">
    <text x="35" y="192" fill="#333">2</text>
    <text x="80" y="192" fill="#333">5</text>
    <text x="150" y="192" fill="#999">−3</text>
    <rect x="213" y="180" width="42" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="234" y="192" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <text x="300" y="192" fill="#999">−3</text>
    <rect x="363" y="180" width="42" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="384" y="192" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="455" y="192" fill="#888">卖①@5：−3+5=2</text>
  </g>

  <!-- i=3, p=0 -->
  <g font-size="10">
    <text x="35" y="224" fill="#333">3</text>
    <text x="80" y="224" fill="#333">0</text>
    <rect x="138" y="212" width="42" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="159" y="224" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
    <text x="225" y="224" fill="#999">2</text>
    <rect x="288" y="212" width="42" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="309" y="224" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <text x="375" y="224" fill="#999">2</text>
    <text x="455" y="224" fill="#888">买①@0更优；买②@0：2−0=2</text>
  </g>

  <!-- i=4, p=0 (no change) -->
  <g font-size="10" fill="#aaa">
    <text x="35" y="256">4</text>
    <text x="80" y="256">0</text>
    <text x="150" y="256">0</text>
    <text x="225" y="256">2</text>
    <text x="300" y="256">2</text>
    <text x="375" y="256">2</text>
    <text x="455" y="256">无变化</text>
  </g>

  <!-- i=5, p=3 -->
  <g font-size="10">
    <text x="35" y="288" fill="#333">5</text>
    <text x="80" y="288" fill="#333">3</text>
    <text x="150" y="288" fill="#999">0</text>
    <rect x="213" y="276" width="42" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="234" y="288" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <text x="300" y="288" fill="#999">2</text>
    <rect x="363" y="276" width="42" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="384" y="288" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <text x="455" y="288" fill="#888">卖①@3：0+3=3；卖②：2+3=5</text>
  </g>

  <!-- i=6, p=1 (no change) -->
  <g font-size="10" fill="#aaa">
    <text x="35" y="320">6</text>
    <text x="80" y="320">1</text>
    <text x="150" y="320">0</text>
    <text x="225" y="320">3</text>
    <text x="300" y="320">2</text>
    <text x="375" y="320">5</text>
    <text x="455" y="320">无变化</text>
  </g>

  <!-- i=7, p=4 -->
  <g font-size="10">
    <text x="35" y="352" fill="#333">7</text>
    <text x="80" y="352" fill="#333">4</text>
    <text x="150" y="352" fill="#999">0</text>
    <rect x="213" y="340" width="42" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="234" y="352" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <text x="300" y="352" fill="#999">2</text>
    <rect x="363" y="340" width="42" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="384" y="352" text-anchor="middle" fill="#4a7a3a" font-weight="bold">6</text>
    <text x="455" y="352" fill="#888">卖①@4：0+4=4；卖②：2+4=6</text>
  </g>

  <!-- Answer -->
  <line x1="20" y1="372" x2="580" y2="372" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="100" y="388" width="400" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="410" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold">答案：sell2 = 6</text>
  <text x="300" y="427" text-anchor="middle" font-size="10" fill="#8a6a20">买@3→卖@5（赚2）+ 买@0→卖@4（赚4）= 6</text>
</svg>
