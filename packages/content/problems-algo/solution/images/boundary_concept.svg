<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 8 4.5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">边界 = 根 + 左边界 + 叶子 + 右边界(逆序) —— 逆时针顺序</text>

  <!-- ===== Edges ===== -->
  <g stroke="#bbb" stroke-width="1.5" fill="none" filter="url(#rough2)">
    <line x1="276" y1="64" x2="194" y2="106"/>  <!-- 1-2 -->
    <line x1="304" y1="64" x2="386" y2="106"/>  <!-- 1-3 -->
    <line x1="166" y1="134" x2="134" y2="177"/> <!-- 2-4 -->
    <line x1="194" y1="134" x2="226" y2="177"/> <!-- 2-5 -->
    <line x1="400" y1="134" x2="400" y2="177"/> <!-- 3-6 -->
    <line x1="226" y1="205" x2="200" y2="252"/> <!-- 5-7 -->
    <line x1="254" y1="205" x2="274" y2="252"/> <!-- 5-8 -->
    <line x1="386" y1="205" x2="362" y2="252"/> <!-- 6-9 -->
    <line x1="414" y1="205" x2="434" y2="252"/> <!-- 6-10 -->
  </g>

  <!-- ===== Nodes ===== -->
  <!-- root 1 (orange) -->
  <circle cx="290" cy="50" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="290" y="55" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="318" y="46" font-size="13" fill="#d6a040" font-weight="bold">①</text>

  <!-- left boundary 2 (blue) -->
  <circle cx="180" cy="120" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="180" y="125" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="206" y="116" font-size="13" fill="#446688" font-weight="bold">②</text>

  <!-- right boundary 3 (red) -->
  <circle cx="400" cy="120" r="19" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="400" y="125" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="426" y="332" font-size="13" fill="#b85450" font-weight="bold">⑨</text>

  <!-- leaf 4 (green) = left-most -->
  <circle cx="120" cy="195" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="200" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <text x="96" y="190" font-size="13" fill="#4a7a3a" font-weight="bold">③</text>

  <!-- internal 5 (gray) -->
  <circle cx="240" cy="195" r="17" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="200" text-anchor="middle" font-size="14" fill="#666">5</text>

  <!-- right boundary 6 (red) -->
  <circle cx="400" cy="195" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="400" y="200" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <text x="426" y="295" font-size="13" fill="#b85450" font-weight="bold">⑧</text>

  <!-- leaf 7 (green) -->
  <circle cx="192" cy="270" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="192" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <text x="168" y="263" font-size="13" fill="#4a7a3a" font-weight="bold">④</text>

  <!-- leaf 8 (green) -->
  <circle cx="282" cy="270" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="282" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <text x="302" y="263" font-size="13" fill="#4a7a3a" font-weight="bold">⑤</text>

  <!-- leaf 9 (green) -->
  <circle cx="354" cy="270" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="354" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <text x="334" y="263" font-size="13" fill="#4a7a3a" font-weight="bold">⑥</text>

  <!-- leaf 10 (green) = right-most -->
  <circle cx="444" cy="270" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="444" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>
  <text x="464" y="263" font-size="13" fill="#4a7a3a" font-weight="bold">⑦</text>

  <!-- anti-clockwise dashed arrow around the tree -->
  <path d="M 290 30 Q 96 30 70 120 Q 50 210 96 270 Q 200 312 340 312 Q 470 312 478 250 Q 486 130 470 70 Q 420 36 318 30"
        stroke="#888" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="200" font-size="10" fill="#888" font-style="italic">逆时针</text>

  <!-- ===== Legend ===== -->
  <g font-size="11" filter="url(#rough2)">
    <rect x="40" y="328" width="16" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="62" y="340" fill="#555">根</text>

    <rect x="110" y="328" width="16" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="132" y="340" fill="#555">左边界(非叶)</text>

    <rect x="232" y="328" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="254" y="340" fill="#555">叶子</text>

    <rect x="300" y="328" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <text x="322" y="340" fill="#555">右边界(非叶)</text>

    <rect x="412" y="328" width="16" height="16" fill="#f0f0f0" stroke="#aaa" stroke-width="1.3" rx="3"/>
    <text x="434" y="340" fill="#555">非边界</text>
  </g>

  <!-- footnote -->
  <text x="290" y="362" text-anchor="middle" font-size="10" fill="#888">①~⑨ = 输出顺序；4 是最左叶(左边界终点,交叶子段)；10 是最右叶(右边界终点,交叶子段)</text>
</svg>
