<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">奇偶不变量：偶数全消，奇数留最小</text>

  <!-- ===== Panel A: even ===== -->
  <rect x="20" y="42" width="480" height="150" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="40" y="64" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① 偶数个负号（2 个）：两两配对抵消</text>

  <!-- pairing arc above row -->
  <path d="M 188 118 Q 236 78 284 118" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="236" y="84" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">配对</text>

  <!-- row of 4 cells: -2, 3, -5, 1 -->
  <g font-size="13" filter="url(#rough2)">
    <rect x="166" y="118" width="44" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="188" y="146" text-anchor="middle" fill="#b85450" font-weight="bold">−2</text>
    <rect x="214" y="118" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="236" y="146" text-anchor="middle" fill="#333">3</text>
    <rect x="262" y="118" width="44" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="284" y="146" text-anchor="middle" fill="#b85450" font-weight="bold">−5</text>
    <rect x="310" y="118" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="332" y="146" text-anchor="middle" fill="#333">1</text>
  </g>
  <text x="40" y="178" font-size="11" fill="#444" filter="url(#rough2)">沿路径翻转配对的两格 → 双双变正，和 = 2+3+5+1 =</text>
  <text x="478" y="178" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">11 = Σ|v|</text>

  <!-- ===== Panel B: odd ===== -->
  <rect x="20" y="208" width="480" height="175" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="40" y="230" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">② 奇数个负号（3 个）：配对后必剩 1 个</text>

  <!-- pairing arc for -2 and -5 -->
  <path d="M 188 284 Q 236 244 284 284" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="236" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">配对</text>

  <!-- arrow pointing to unpaired -1 (min abs) -->
  <path d="M 372 268 L 348 300" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="378" y="266" font-size="10" fill="#b85450" filter="url(#rough2)">最小 |v|=1</text>
  <text x="378" y="280" font-size="10" fill="#b85450" filter="url(#rough2)">负号留此</text>

  <!-- row of 4 cells: -2, 3, -5, -1 -->
  <g font-size="13" filter="url(#rough2)">
    <rect x="166" y="284" width="44" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="188" y="312" text-anchor="middle" fill="#b85450" font-weight="bold">−2</text>
    <rect x="214" y="284" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="236" y="312" text-anchor="middle" fill="#333">3</text>
    <rect x="262" y="284" width="44" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="284" y="312" text-anchor="middle" fill="#b85450" font-weight="bold">−5</text>
    <rect x="310" y="284" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <text x="332" y="312" text-anchor="middle" fill="#b85450" font-weight="bold">−1</text>
  </g>
  <text x="40" y="346" font-size="11" fill="#444" filter="url(#rough2)">抵消 2 个，剩 1 个落在 |v| 最小处，和 = 2+3+5+(−1) =</text>
  <text x="478" y="346" text-anchor="end" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">9 = Σ|v| − 2·min</text>
  <text x="40" y="368" font-size="10" fill="#888" filter="url(#rough2)">（若有 0：0×(−1)=0，负号被 0 “吸收” → 奇变偶 → 和 = Σ|v|）</text>
</svg>
