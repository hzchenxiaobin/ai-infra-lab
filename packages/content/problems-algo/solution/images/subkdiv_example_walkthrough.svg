<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [4,5,0,−2,−3,1],  K = 5</text>

  <!-- Column headers -->
  <rect x="10" y="38" width="540" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="38" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">步骤</text>
  <text x="95" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">元素</text>
  <text x="160" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">S</text>
  <text x="230" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">r=S%5</text>
  <text x="310" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">命中</text>
  <text x="370" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">ans</text>
  <text x="475" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">count 更新</text>

  <!-- Row 0: 初始 -->
  <rect x="10" y="66" width="540" height="28" fill="#f6f6f6" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="38" y="84" text-anchor="middle" font-size="10.5" fill="#888">初始</text>
  <text x="95" y="84" text-anchor="middle" font-size="10.5" fill="#aaa">—</text>
  <text x="160" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="230" y="84" text-anchor="middle" font-size="10.5" fill="#aaa">—</text>
  <text x="310" y="84" text-anchor="middle" font-size="10.5" fill="#aaa">—</text>
  <text x="370" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="475" y="84" text-anchor="middle" font-size="10" fill="#333">{0:1}</text>

  <!-- Row 1: j=0, x=4 -->
  <rect x="10" y="96" width="540" height="28" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="38" y="114" text-anchor="middle" font-size="10.5" fill="#888">j=0</text>
  <rect x="82" y="100" width="26" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95" y="114" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">4</text>
  <text x="160" y="114" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="230" y="114" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="310" y="114" text-anchor="middle" font-size="10.5" fill="#b85450">0</text>
  <text x="370" y="114" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="475" y="114" text-anchor="middle" font-size="9.5" fill="#333">{0:1, 4:1}</text>

  <!-- Row 2: j=1, x=5  HIT -->
  <rect x="10" y="126" width="540" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="38" y="144" text-anchor="middle" font-size="10.5" fill="#888">j=1 ★</text>
  <rect x="82" y="130" width="26" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="95" y="144" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">5</text>
  <text x="160" y="144" text-anchor="middle" font-size="11" fill="#333">9</text>
  <text x="230" y="144" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="310" y="144" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">1 ←</text>
  <text x="370" y="144" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="475" y="144" text-anchor="middle" font-size="9.5" fill="#333">{0:1, 4:2}</text>

  <!-- Row 3: j=2, x=0  HIT -->
  <rect x="10" y="156" width="540" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="38" y="174" text-anchor="middle" font-size="10.5" fill="#888">j=2 ★</text>
  <rect x="82" y="160" width="26" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="95" y="174" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">0</text>
  <text x="160" y="174" text-anchor="middle" font-size="11" fill="#333">9</text>
  <text x="230" y="174" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="310" y="174" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">2 ←</text>
  <text x="370" y="174" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="475" y="174" text-anchor="middle" font-size="9.5" fill="#333">{0:1, 4:3}</text>

  <!-- Row 4: j=3, x=-2 -->
  <rect x="10" y="186" width="540" height="28" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="38" y="204" text-anchor="middle" font-size="10.5" fill="#888">j=3</text>
  <rect x="78" y="190" width="34" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95" y="204" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">−2</text>
  <text x="160" y="204" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="230" y="204" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="310" y="204" text-anchor="middle" font-size="10.5" fill="#b85450">0</text>
  <text x="370" y="204" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="475" y="204" text-anchor="middle" font-size="9.5" fill="#333">{0:1,4:3,2:1}</text>

  <!-- Row 5: j=4, x=-3  HIT -->
  <rect x="10" y="216" width="540" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="38" y="234" text-anchor="middle" font-size="10.5" fill="#888">j=4 ★</text>
  <rect x="78" y="220" width="34" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="95" y="234" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">−3</text>
  <text x="160" y="234" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="230" y="234" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="310" y="234" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">3 ←</text>
  <text x="370" y="234" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">6</text>
  <text x="475" y="234" text-anchor="middle" font-size="9" fill="#333">{0:1,4:4,2:1}</text>

  <!-- Row 6: j=5, x=1  HIT -->
  <rect x="10" y="246" width="540" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="38" y="264" text-anchor="middle" font-size="10.5" fill="#888">j=5 ★</text>
  <rect x="82" y="250" width="26" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="95" y="264" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">1</text>
  <text x="160" y="264" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="230" y="264" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0</text>
  <text x="310" y="264" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">1 ←</text>
  <text x="370" y="264" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">7</text>
  <text x="475" y="264" text-anchor="middle" font-size="9" fill="#333">{0:2,4:4,2:1}</text>

  <!-- Explanation box 1: negative modulo -->
  <rect x="10" y="288" width="260" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="308" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⚠ 负数取模</text>
  <text x="140" y="324" text-anchor="middle" font-size="10" fill="#555">S=7, 7%5=2 ✓</text>
  <text x="140" y="338" text-anchor="middle" font-size="10" fill="#555">S=4, (4%5+5)%5=4 ✓</text>

  <!-- Explanation box 2: hit counting -->
  <rect x="290" y="288" width="260" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="308" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">★ 命中 = count[r]</text>
  <text x="420" y="324" text-anchor="middle" font-size="10" fill="#555">之前同余前缀和的个数</text>
  <text x="420" y="338" text-anchor="middle" font-size="10" fill="#555">先查 count[r]，再写 count[r]++</text>

  <!-- Summary box -->
  <rect x="10" y="356" width="540" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="378" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">共 7 个子数组：[5]、[5,0]、[0]、[5,0,−2,−3]、[−2,−3]、[0,−2,−3]、[4,5,0,−2,−3,1]</text>
  <text x="280" y="398" text-anchor="middle" font-size="11" fill="#888">余数 0：C(2,2)=1 个 | 余数 4：C(4,2)=6 个 | 合计 1+6 = 7</text>
  <text x="280" y="414" text-anchor="middle" font-size="10.5" fill="#aaa">每步「先查 count[r]，再 count[r]++」，一次遍历 O(n)</text>
</svg>
