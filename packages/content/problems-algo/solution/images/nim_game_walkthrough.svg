<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：n=7（必胜） vs n=8（必败）</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">双方均最优——胜负在开局那一刻就由 n%4 决定</text>

  <!-- ===== Left: n = 7 (win) ===== -->
  <rect x="20" y="60" width="255" height="300" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)" opacity="0.35"/>
  <text x="148" y="80" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">n = 7  →  7 % 4 = 3 ≠ 0  ✓ 必胜</text>

  <g font-size="10">
    <!-- round 1: you take 3 -->
    <rect x="34" y="96" width="227" height="34" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="44" y="116" fill="#333">你拿 <tspan font-weight="bold" fill="#4a7a3a">3</tspan> 颗（= n%4）</text>
    <text x="200" y="116" fill="#888">剩 4</text>

    <!-- round 2: opponent takes a, you sweep -->
    <rect x="34" y="138" width="227" height="34" fill="#fff" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="44" y="158" fill="#333">对手拿 <tspan font-weight="bold" fill="#b85450">a</tspan>（1/2/3）</text>
    <text x="200" y="158" fill="#888">剩 4−a</text>

    <rect x="34" y="180" width="227" height="34" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="44" y="200" fill="#333">你拿 <tspan font-weight="bold" fill="#4a7a3a">4−a</tspan> 颗（全拿）</text>
    <text x="200" y="200" fill="#4a7a3a" font-weight="bold">剩 0 → 赢 ✓</text>

    <path d="M 148 214 L 148 224" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

    <!-- concrete: a=2 example -->
    <rect x="34" y="228" width="227" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
    <text x="44" y="246" fill="#333" font-weight="bold">举例 a=2：</text>
    <text x="44" y="262" fill="#555">你拿 3 → 剩 4 → 对手拿 2</text>
    <text x="44" y="276" fill="#555">→ 剩 2 → 你拿 2 收尾，赢</text>

    <rect x="34" y="296" width="227" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
    <text x="148" y="316" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">关键：开局把 4 的倍数甩给对手</text>
    <text x="148" y="330" text-anchor="middle" font-size="9" fill="#555">对手怎么挣扎都翻不了身</text>
  </g>

  <!-- ===== Right: n = 8 (lose) ===== -->
  <rect x="285" y="60" width="255" height="300" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)" opacity="0.35"/>
  <text x="412" y="80" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">n = 8  →  8 % 4 = 0  ✗ 必败</text>

  <g font-size="10">
    <rect x="299" y="96" width="227" height="34" fill="#fff" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="309" y="116" fill="#333">你拿 <tspan font-weight="bold" fill="#b85450">a</tspan>（只能 1/2/3）</text>
    <text x="470" y="116" fill="#888">剩 8−a</text>

    <rect x="299" y="138" width="227" height="34" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="309" y="158" fill="#333">对手补 <tspan font-weight="bold" fill="#4a7a3a">4−a</tspan> 颗</text>
    <text x="470" y="158" fill="#888">剩 4</text>

    <path d="M 412 214 L 412 196 L 412 196" stroke="none"/>

    <!-- now you face 4 -->
    <rect x="299" y="180" width="227" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="309" y="200" fill="#333">你拿 <tspan font-weight="bold" fill="#b85450">b</tspan>（1/2/3）</text>
    <text x="470" y="200" fill="#b85450">剩 4−b</text>

    <rect x="299" y="222" width="227" height="34" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="309" y="242" fill="#333">对手拿 <tspan font-weight="bold" fill="#4a7a3a">4−b</tspan>（全拿）</text>
    <text x="470" y="242" fill="#b85450" font-weight="bold">剩 0 → 你输 ✗</text>

    <path d="M 412 256 L 412 266" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

    <rect x="299" y="270" width="227" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
    <text x="309" y="288" fill="#333" font-weight="bold">举例 a=1：</text>
    <text x="309" y="304" fill="#555">你拿 1 → 剩 7 → 对手拿 3</text>
    <text x="309" y="318" fill="#555">→ 剩 4 → 你拿 b，对手全拿</text>

    <rect x="299" y="336" width="227" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
    <text x="412" y="350" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">关键：开局即 4 的倍数 → 无解</text>
  </g>
</svg>
