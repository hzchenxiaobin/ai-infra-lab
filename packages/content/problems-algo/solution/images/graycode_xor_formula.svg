<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">公式法：G(i) = i ⊕ (i &gt;&gt; 1) ——一行循环直接生成</text>

  <!-- Formula highlight box -->
  <rect x="120" y="38" width="300" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">G(i) = i ^ (i &gt;&gt; 1)</text>

  <!-- Table header -->
  <text x="70" y="96" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">i</text>
  <text x="155" y="96" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">i (二进制)</text>
  <text x="270" y="96" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">i &gt;&gt; 1 (二进制)</text>
  <text x="385" y="96" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">G(i) = i^(i&gt;&gt;1)</text>
  <text x="490" y="96" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">G(i) 十进制</text>

  <!-- header underline -->
  <line x1="30" y1="104" x2="520" y2="104" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 0: i=0 -->
  <rect x="40" y="110" width="420" height="26" fill="#e8f0fe" opacity="0.3" rx="3" filter="url(#rough2)"/>
  <text x="70" y="128" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="155" y="128" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">000</text>
  <text x="270" y="128" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">000</text>
  <text x="385" y="128" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">000</text>
  <text x="490" y="128" text-anchor="middle" font-size="12" fill="#333">0</text>

  <!-- Row 1: i=1 -->
  <text x="70" y="156" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="155" y="156" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">001</text>
  <text x="270" y="156" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">000</text>
  <text x="385" y="156" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" font-family="monospace">001</text>
  <text x="490" y="156" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- Row 2: i=2 -->
  <rect x="40" y="162" width="420" height="26" fill="#e8f0fe" opacity="0.3" rx="3" filter="url(#rough2)"/>
  <text x="70" y="184" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="155" y="184" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">010</text>
  <text x="270" y="184" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">001</text>
  <text x="385" y="184" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" font-family="monospace">011</text>
  <text x="490" y="184" text-anchor="middle" font-size="12" fill="#333">3</text>

  <!-- Row 3: i=3 -->
  <text x="70" y="212" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="155" y="212" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">011</text>
  <text x="270" y="212" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">001</text>
  <text x="385" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" font-family="monospace">010</text>
  <text x="490" y="212" text-anchor="middle" font-size="12" fill="#333">2</text>

  <!-- Row 4: i=4 -->
  <rect x="40" y="218" width="420" height="26" fill="#e8f0fe" opacity="0.3" rx="3" filter="url(#rough2)"/>
  <text x="70" y="240" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="155" y="240" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">100</text>
  <text x="270" y="240" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">010</text>
  <text x="385" y="240" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" font-family="monospace">110</text>
  <text x="490" y="240" text-anchor="middle" font-size="12" fill="#333">6</text>

  <!-- Row 5: i=5 -->
  <text x="70" y="268" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="155" y="268" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">101</text>
  <text x="270" y="268" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">010</text>
  <text x="385" y="268" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" font-family="monospace">111</text>
  <text x="490" y="268" text-anchor="middle" font-size="12" fill="#333">7</text>

  <!-- Row 6: i=6 -->
  <rect x="40" y="274" width="420" height="26" fill="#e8f0fe" opacity="0.3" rx="3" filter="url(#rough2)"/>
  <text x="70" y="296" text-anchor="middle" font-size="12" fill="#333">6</text>
  <text x="155" y="296" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">110</text>
  <text x="270" y="296" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">011</text>
  <text x="385" y="296" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" font-family="monospace">101</text>
  <text x="490" y="296" text-anchor="middle" font-size="12" fill="#333">5</text>

  <!-- Row 7: i=7 -->
  <text x="70" y="324" text-anchor="middle" font-size="12" fill="#333">7</text>
  <text x="155" y="324" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">111</text>
  <text x="270" y="324" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">011</text>
  <text x="385" y="324" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" font-family="monospace">100</text>
  <text x="490" y="324" text-anchor="middle" font-size="12" fill="#333">4</text>

  <!-- Insight box -->
  <rect x="30" y="340" width="490" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="360" text-anchor="middle" font-size="11" fill="#444">i 右移一位后与自身异或：相邻 i 只翻最低位，异或后 G(i) 恰好只改一位</text>
</svg>
