<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">算法流程：初始化 → 两次单向遍历 → 取 max 求和</text>

  <!-- Start -->
  <rect x="220" y="38" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">开始</text>

  <!-- arrow start -> init -->
  <path d="M 280 70 L 280 84" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="150" y="88" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="106" text-anchor="middle" font-size="12" fill="#333">初始化：left[i] = 1，right[i] = 1</text>
  <text x="280" y="122" text-anchor="middle" font-size="10.5" fill="#888">（每人至少 1 颗，满足规则 1）</text>

  <!-- branching arrows to two passes -->
  <path d="M 280 130 L 280 144 L 150 144 L 150 158" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 144 L 410 144 L 410 158" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Left pass -->
  <rect x="40" y="162" width="220" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="184" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 左→右遍历  i = 1 … n−1</text>
  <text x="150" y="206" text-anchor="middle" font-size="11.5" fill="#333">if ratings[i] &gt; ratings[i−1]</text>
  <text x="150" y="226" text-anchor="middle" font-size="11.5" fill="#333">    left[i] = left[i−1] + 1</text>
  <text x="150" y="246" text-anchor="middle" font-size="10" fill="#888">保证「比左邻居多」</text>

  <!-- Right pass -->
  <rect x="300" y="162" width="220" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="410" y="184" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">② 右→左遍历  i = n−2 … 0</text>
  <text x="410" y="206" text-anchor="middle" font-size="11.5" fill="#333">if ratings[i] &gt; ratings[i+1]</text>
  <text x="410" y="226" text-anchor="middle" font-size="11.5" fill="#333">    right[i] = right[i+1] + 1</text>
  <text x="410" y="246" text-anchor="middle" font-size="10" fill="#888">保证「比右邻居多」</text>

  <!-- arrows to merge -->
  <path d="M 150 256 L 150 272 L 280 272 L 280 286" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 256 L 410 272 L 280 272" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- Merge -->
  <rect x="120" y="290" width="320" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="12" fill="#333">③ 合并：candy[i] = max(left[i], right[i])</text>
  <text x="280" y="324" text-anchor="middle" font-size="10.5" fill="#888">取大者，同时满足两侧约束且糖果最少</text>

  <!-- arrow merge -> sum -->
  <path d="M 280 332 L 280 346" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Sum -->
  <rect x="170" y="350" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="373" text-anchor="middle" font-size="12" fill="#333">④ ans = Σ candy[i]</text>

  <!-- arrow sum -> return -->
  <path d="M 280 388 L 280 402" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return -->
  <rect x="210" y="406" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="280" y="426" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">返回 ans</text>
</svg>
