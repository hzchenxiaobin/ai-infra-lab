<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="392" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：按序抽取首字符拼接，再与 s 逐位比对</text>

  <!-- 成功例：words -->
  <text x="36" y="56" font-size="11" fill="#888" filter="url(#rough2)">words（示例 3）：</text>

  <rect x="36" y="64" width="78" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="84" text-anchor="middle" font-size="12" filter="url(#rough2)"><tspan fill="#b85450" font-weight="bold">n</tspan><tspan fill="#555">ever</tspan></text>

  <rect x="118" y="64" width="78" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="84" text-anchor="middle" font-size="12" filter="url(#rough2)"><tspan fill="#b85450" font-weight="bold">g</tspan><tspan fill="#555">onna</tspan></text>

  <rect x="200" y="64" width="78" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="84" text-anchor="middle" font-size="12" filter="url(#rough2)"><tspan fill="#b85450" font-weight="bold">g</tspan><tspan fill="#555">ive</tspan></text>

  <rect x="282" y="64" width="78" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="321" y="84" text-anchor="middle" font-size="12" filter="url(#rough2)"><tspan fill="#b85450" font-weight="bold">u</tspan><tspan fill="#555">p</tspan></text>

  <rect x="364" y="64" width="78" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="403" y="84" text-anchor="middle" font-size="12" filter="url(#rough2)"><tspan fill="#b85450" font-weight="bold">o</tspan><tspan fill="#555">n</tspan></text>

  <rect x="446" y="64" width="78" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="485" y="84" text-anchor="middle" font-size="12" filter="url(#rough2)"><tspan fill="#b85450" font-weight="bold">y</tspan><tspan fill="#555">ou</tspan></text>

  <!-- 抽取箭头 -->
  <path d="M 75 96 L 75 120" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 157 96 L 157 120" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 239 96 L 239 120" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 321 96 L 321 120" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 403 96 L 403 120" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 485 96 L 485 120" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 拼接结果字符格 -->
  <rect x="60" y="124" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">n</text>
  <rect x="142" y="124" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">g</text>
  <rect x="224" y="124" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">g</text>
  <rect x="306" y="124" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="321" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">u</text>
  <rect x="388" y="124" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="403" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">o</text>
  <rect x="470" y="124" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="485" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">y</text>

  <text x="280" y="176" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">拼接得 t = "ngguoy"</text>

  <!-- s 对比框 -->
  <rect x="190" y="190" width="180" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="210" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s = "ngguoy"</text>
  <text x="402" y="212" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 相等</text>

  <text x="280" y="240" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">长度相等 + 逐位相同 → true</text>

  <!-- 分隔线 -->
  <path d="M 30 256 L 530 256" stroke="#ccc" stroke-width="1" stroke-dasharray="5,5" fill="none" filter="url(#rough2)"/>

  <!-- 反例 -->
  <text x="280" y="282" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">反例：words = ["bear", "aardvark"]</text>

  <rect x="150" y="292" width="78" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="189" y="311" text-anchor="middle" font-size="12" filter="url(#rough2)"><tspan fill="#b85450" font-weight="bold">b</tspan><tspan fill="#555">ear</tspan></text>

  <rect x="250" y="292" width="78" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="289" y="311" text-anchor="middle" font-size="12" filter="url(#rough2)"><tspan fill="#b85450" font-weight="bold">a</tspan><tspan fill="#555">ardvark</tspan></text>

  <path d="M 189 322 L 189 342" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 289 322 L 289 342" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="174" y="346" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="189" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">b</text>
  <rect x="274" y="346" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="289" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">a</text>

  <text x="360" y="364" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">t = "ba" ≠ s = "ab" ✗ false</text>
</svg>
