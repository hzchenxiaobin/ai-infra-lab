<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心流程：筛选 → 按月分组 → 聚合计数</text>

  <!-- ===== Step 1: Orders table (raw) ===== -->
  <text x="60" y="50" font-size="10" fill="#888">① FROM Orders</text>
  <rect x="50" y="56" width="200" height="120" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="72" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Orders 表（原始）</text>
  <line x1="50" y1="78" x2="250" y2="78" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="62" y="92" font-size="9" fill="#888">id  date    cust inv</text>
  <text x="62" y="106" font-size="9" fill="#4a7a3a">#1  09-15  c1  30 ✓</text>
  <text x="62" y="120" font-size="9" fill="#b85450">#3  10-06  c3  20 ✗</text>
  <text x="62" y="134" font-size="9" fill="#4a7a3a">#7  12-01  c4  55 ✓</text>
  <text x="62" y="148" font-size="9" fill="#b85450">#5  11-10  c1  10 ✗</text>
  <text x="62" y="162" font-size="8" fill="#999">... 共 10 行</text>

  <!-- Arrow 1 -->
  <path d="M 150 178 L 150 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: Filter ===== -->
  <text x="60" y="208" font-size="10" fill="#888">② WHERE</text>
  <rect x="40" y="214" width="220" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="150" y="232" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">WHERE invoice &gt; 20</text>
  <text x="150" y="248" text-anchor="middle" font-size="9" fill="#888">丢弃 invoice ≤ 20 的行</text>

  <!-- Arrow 2 -->
  <path d="M 150 260 L 150 278" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: Group by month ===== -->
  <text x="60" y="290" font-size="10" fill="#888">③ GROUP BY</text>
  <rect x="40" y="296" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="150" y="314" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">GROUP BY month</text>
  <text x="150" y="330" text-anchor="middle" font-size="9" fill="#888">DATE_FORMAT(date,'%Y-%m')</text>

  <!-- Arrow 3 -->
  <path d="M 150 342 L 150 360" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: Aggregate ===== -->
  <rect x="40" y="366" width="220" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="150" y="384" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">④ SELECT 聚合</text>
  <text x="150" y="398" text-anchor="middle" font-size="9" fill="#555">COUNT(order_id)</text>
  <text x="150" y="412" text-anchor="middle" font-size="9" fill="#555">COUNT(DISTINCT customer_id)</text>

  <!-- ===== Right side: Output table ===== -->
  <text x="380" y="208" font-size="10" fill="#888">输出</text>
  <rect x="320" y="214" width="170" height="120" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="405" y="230" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">结果</text>
  <line x1="320" y1="236" x2="490" y2="236" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="330" y="250" font-size="9" fill="#888">month   ord  cust</text>
  <text x="330" y="266" font-size="9" fill="#446688">2020-09  2    2</text>
  <text x="330" y="280" font-size="9" fill="#446688">2020-10  1    1</text>
  <text x="330" y="294" font-size="9" fill="#999">2020-11  —    —</text>
  <text x="330" y="308" font-size="9" fill="#446688">2020-12  2    1</text>
  <text x="330" y="322" font-size="9" fill="#446688">2021-01  1    1</text>

  <!-- Arrow from aggregate to output -->
  <path d="M 260 396 Q 320 360 340 334" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Bottom note ===== -->
  <rect x="310" y="350" width="190" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="405" y="366" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">无满足条件的月份自动消失</text>
  <text x="405" y="378" text-anchor="middle" font-size="8" fill="#888">2020-11 两单均 ≤ 20 → 不出现</text>
</svg>
