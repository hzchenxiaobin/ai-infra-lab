<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：tires=[[2,3],[3,4]], changeTime=5, numLaps=4</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">min_fi=2, 阈值=7 → 输出 21</text>

  <!-- ===== minLap table ===== -->
  <text x="40" y="70" font-size="12" fill="#4a7a3a" font-weight="bold">① 预计算 minLap[x]（单胎连续 x 圈最少耗时）</text>

  <!-- header row -->
  <rect x="40" y="80" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="98" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">x</text>
  <rect x="100" y="80" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="98" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="180" y="80" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="98" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="260" y="80" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="98" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- value row -->
  <rect x="40" y="110" width="60" height="28" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">minLap</text>
  <rect x="100" y="110" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="128" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="180" y="110" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="128" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <rect x="260" y="110" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="128" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">26</text>

  <text x="360" y="100" font-size="10" fill="#888">胎[2,3]: 2→6→18(≥7停)</text>
  <text x="360" y="116" font-size="10" fill="#888">胎[3,4]: 3→12(≥7停)</text>
  <text x="360" y="132" font-size="10" fill="#b85450">x=3 的 26 不会被 DP 选用</text>

  <!-- ===== DP table ===== -->
  <text x="40" y="170" font-size="12" fill="#446688" font-weight="bold">② DP 演化：dp[0]=−5（抵消首段换胎），dp[i]=min(dp[i−x]+minLap[x]+5)</text>

  <!-- dp header -->
  <rect x="40" y="184" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="202" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <rect x="100" y="184" width="76" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="202" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="176" y="184" width="76" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="202" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="252" y="184" width="76" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="202" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="328" y="184" width="76" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="366" y="202" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="404" y="184" width="76" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="442" y="202" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4 ★</text>

  <!-- dp values -->
  <rect x="40" y="214" width="60" height="30" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="233" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">dp[i]</text>
  <rect x="100" y="214" width="76" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="233" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">−5</text>
  <rect x="176" y="214" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="233" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="252" y="214" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="233" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <rect x="328" y="214" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="366" y="233" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">15</text>
  <rect x="404" y="214" width="76" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="442" y="233" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">21</text>

  <!-- ===== dp[4] transition detail ===== -->
  <text x="40" y="272" font-size="12" fill="#446688" font-weight="bold">③ dp[4] 的三种转移（枚举最后一段 x）：</text>

  <!-- x=1 -->
  <rect x="40" y="284" width="160" height="50" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="120" y="302" text-anchor="middle" font-size="10" fill="#888">x=1</text>
  <text x="120" y="318" text-anchor="middle" font-size="11" fill="#444">dp[3]+minLap[1]+5</text>
  <text x="120" y="330" text-anchor="middle" font-size="11" fill="#444">= 15+2+5 = 22</text>

  <!-- x=2 winner -->
  <rect x="210" y="284" width="160" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="302" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">x=2 ✓ 最优</text>
  <text x="290" y="318" text-anchor="middle" font-size="11" fill="#444">dp[2]+minLap[2]+5</text>
  <text x="290" y="330" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">= 8+8+5 = 21</text>

  <!-- x=3 -->
  <rect x="380" y="284" width="140" height="50" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="302" text-anchor="middle" font-size="10" fill="#888">x=3</text>
  <text x="450" y="318" text-anchor="middle" font-size="11" fill="#444">dp[1]+minLap[3]+5</text>
  <text x="450" y="330" text-anchor="middle" font-size="11" fill="#444">= 2+26+5 = 33</text>

  <!-- min -->
  <text x="280" y="356" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">min{22, 21, 33} = 21 ✓</text>

  <!-- ===== Interpretation ===== -->
  <rect x="40" y="372" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="56" y="392" font-size="11" fill="#444" font-weight="bold">最优方案还原（dp[4]←x=2←dp[2]←x=2←dp[0]，两段各跑 2 圈）：</text>
  <text x="56" y="410" font-size="11" fill="#444">段1：胎0 连跑2圈 2+6=8 ；换胎 5 ；段2：新胎0 连跑2圈 2+6=8</text>
  <text x="56" y="424" font-size="11" fill="#d6a040" font-weight="bold">总时间 = 8 + 5 + 8 = 21 ✓（dp[0]=−5 抵消首段多余的换胎）</text>
</svg>
