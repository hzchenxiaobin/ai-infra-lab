<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：每辆车只需开到「该类垃圾最后出现的房子」</text>
  <text x="310" y="46" text-anchor="middle" font-size="12" fill="#888">示例 1：garbage = ["G","P","GP","GG"]，travel = [2,4,3]</text>

  <!-- ====== Houses row ====== -->
  <g filter="url(#rough2)">
    <!-- house 0 : "G" -->
    <rect x="90"  y="74" width="96" height="64" fill="#fff" stroke="#999" stroke-width="1.6" rx="6"/>
    <text x="138" y="92"  text-anchor="middle" font-size="10" fill="#aaa">房子 0</text>
    <text x="138" y="120" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">G</text>

    <!-- house 1 : "P" -->
    <rect x="210" y="74" width="96" height="64" fill="#fff" stroke="#999" stroke-width="1.6" rx="6"/>
    <text x="258" y="92"  text-anchor="middle" font-size="10" fill="#aaa">房子 1</text>
    <text x="258" y="120" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold">P</text>

    <!-- house 2 : "GP" -->
    <rect x="330" y="74" width="96" height="64" fill="#fff" stroke="#999" stroke-width="1.6" rx="6"/>
    <text x="378" y="92"  text-anchor="middle" font-size="10" fill="#aaa">房子 2</text>
    <text x="368" y="120" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">G</text>
    <text x="388" y="120" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold">P</text>

    <!-- house 3 : "GG" -->
    <rect x="450" y="74" width="96" height="64" fill="#fff" stroke="#999" stroke-width="1.6" rx="6"/>
    <text x="498" y="92"  text-anchor="middle" font-size="10" fill="#aaa">房子 3</text>
    <text x="488" y="120" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">G</text>
    <text x="508" y="120" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">G</text>
  </g>

  <!-- ====== Travel badges between houses ====== -->
  <g filter="url(#rough2)">
    <rect x="180" y="146" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6"/>
    <text x="198" y="162" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">2</text>
    <rect x="300" y="146" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6"/>
    <text x="318" y="162" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">4</text>
    <rect x="420" y="146" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6"/>
    <text x="438" y="162" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">3</text>
    <text x="310" y="140" text-anchor="middle" font-size="10" fill="#bbb">travel[i]：i → i+1 的行驶分钟</text>
  </g>

  <!-- divider -->
  <line x1="40" y1="186" x2="580" y2="186" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Truck travel ranges ====== -->
  <!-- G truck : 0 -> 3 (green) -->
  <text x="84" y="212" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold">玻璃车 G</text>
  <g filter="url(#rough2)">
    <rect x="90" y="206" width="456" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <path d="M 546 212 L 560 212" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)"/>
  </g>
  <text x="556" y="200" font-size="11" fill="#4a7a3a" font-weight="bold">0→3：2+4+3 = 9</text>

  <!-- P truck : 0 -> 2 (blue) -->
  <text x="84" y="240" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">纸车 P</text>
  <g filter="url(#rough2)">
    <rect x="90" y="234" width="336" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <path d="M 426 240 L 440 240" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>
  </g>
  <text x="436" y="228" font-size="11" fill="#446688" font-weight="bold">0→2：2+4 = 6</text>

  <!-- M truck : no M (orange, stays) -->
  <text x="84" y="268" text-anchor="end" font-size="12" fill="#a87020" font-weight="bold">金属车 M</text>
  <g filter="url(#rough2)">
    <circle cx="96" cy="266" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="96" y="270" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">·</text>
  </g>
  <text x="114" y="270" font-size="11" fill="#a87020" font-weight="bold">无 M 垃圾 → 不行驶 = 0</text>

  <!-- divider -->
  <line x1="40" y1="292" x2="580" y2="292" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Collection note ====== -->
  <g filter="url(#rough2)">
    <rect x="60" y="302" width="500" height="26" fill="#eef6ef" stroke="#bbb" stroke-width="1" rx="8"/>
  </g>
  <text x="310" y="320" text-anchor="middle" font-size="12" fill="#444">收集时间（串行，每单位 1 分钟）= Σ len(garbage[i]) = 1+1+2+2 = <tspan font-weight="bold" fill="#4a7a3a">6</tspan></text>

  <!-- ====== Formula box ====== -->
  <rect x="60" y="340" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="310" y="362" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">答案 = Σ单位 + Σ车辆行驶到终点</text>
  <text x="310" y="384" text-anchor="middle" font-size="12.5" fill="#666">= 6 + (9 + 6 + 0) = <tspan font-weight="bold" fill="#b85450">21</tspan></text>
</svg>
