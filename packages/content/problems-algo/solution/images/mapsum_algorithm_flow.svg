<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2e8b57"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="780" height="540" fill="#fdfcf7"/>

  <text x="390" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">insert / sum 算法流程：增量维护节点子树和</text>
  <path d="M 220 38 Q 390 46 560 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== LEFT: insert ===== -->
  <text x="200" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a6a20">insert(key, val)</text>

  <g filter="url(#sk)"><ellipse cx="200" cy="96" rx="70" ry="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="200" y="100" text-anchor="middle" font-size="11" fill="#9a6a20" font-weight="bold">开始 insert</text>
  <path d="M 200 114 L 200 130" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- delta computation -->
  <g filter="url(#sk)"><rect x="90" y="134" width="220" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="200" y="154" text-anchor="middle" font-size="10" fill="#9a6a20" font-weight="bold">delta = val - kv.get(key, 0)</text>
  <text x="200" y="170" text-anchor="middle" font-size="9" fill="#9a6a20">覆盖语义：算增量而非直接加 val</text>
  <text x="200" y="182" text-anchor="middle" font-size="9" fill="#9a6a20">kv[key] = val</text>
  <path d="M 200 188 L 200 206" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- node = root -->
  <g filter="url(#sk)"><rect x="120" y="210" width="160" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="200" y="232" text-anchor="middle" font-size="10" fill="#2b6e9e">node = root</text>
  <path d="M 200 244 L 200 262" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- loop diamond: key 还有字符? -->
  <g filter="url(#sk)"><polygon points="200,264 290,304 200,344 110,304" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="200" y="300" text-anchor="middle" font-size="10" fill="#9a6a20" font-weight="bold">key 还有字符?</text>
  <text x="200" y="316" text-anchor="middle" font-size="9" fill="#9a6a20">(对每个 ch)</text>

  <!-- yes: update node -->
  <path d="M 290 304 L 340 304" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="316" y="296" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="344" y="272" width="148" height="68" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="418" y="292" text-anchor="middle" font-size="9" fill="#9a6a20">node = child(ch)</text>
  <text x="418" y="306" text-anchor="middle" font-size="9" fill="#9a6a20">(缺失则新建)</text>
  <text x="418" y="324" text-anchor="middle" font-size="10" fill="#9a6a20" font-weight="bold">node.Σ += delta</text>
  <text x="418" y="336" text-anchor="middle" font-size="8" fill="#9a6a20">每途径节点都加</text>
  <!-- loop back to diamond -->
  <path d="M 418 272 Q 418 220 200 220 Q 200 230 200 262" stroke="#d6a040" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="300" y="214" text-anchor="middle" font-size="9" fill="#d6a040">回到判断</text>

  <!-- no: return -->
  <path d="M 200 344 L 200 372" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="216" y="362" font-size="10" fill="#888">否</text>
  <g filter="url(#sk)"><ellipse cx="200" cy="394" rx="58" ry="18" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.6"/></g>
  <text x="200" y="398" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">完成 O(L)</text>

  <!-- ===== RIGHT: sum ===== -->
  <text x="580" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">sum(prefix)</text>

  <g filter="url(#sk)"><ellipse cx="580" cy="96" rx="64" ry="18" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/></g>
  <text x="580" y="100" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">开始 sum</text>
  <path d="M 580 114 L 580 130" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="500" y="134" width="160" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="580" y="156" text-anchor="middle" font-size="10" fill="#2b6e9e">node = root</text>
  <path d="M 580 168 L 580 186" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- loop diamond: prefix 还有字符? -->
  <g filter="url(#sk)"><polygon points="580,188 670,228 580,268 490,228" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.6"/></g>
  <text x="580" y="224" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">prefix 还有字符?</text>
  <text x="580" y="240" text-anchor="middle" font-size="9" fill="#2e6e2e">(对每个 ch)</text>

  <!-- yes: check child exists -->
  <path d="M 580 268 L 580 288" stroke="#2e8b57" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="596" y="280" font-size="10" fill="#2e8b57" font-weight="bold">是</text>
  <g filter="url(#sk)"><polygon points="580,290 660,324 580,358 500,324" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="580" y="320" text-anchor="middle" font-size="10" fill="#9a6a20" font-weight="bold">ch ∈ children?</text>

  <!-- yes: walk down -->
  <path d="M 660 324 L 700 324" stroke="#2e8b57" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="680" y="316" text-anchor="middle" font-size="10" fill="#2e8b57" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="704" y="306" width="60" height="40" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/></g>
  <text x="734" y="324" text-anchor="middle" font-size="9" fill="#2e6e2e">node =</text>
  <text x="734" y="338" text-anchor="middle" font-size="9" fill="#2e6e2e">child[ch]</text>
  <!-- loop back to top diamond -->
  <path d="M 734 306 Q 734 200 580 200 Q 580 188 580 188" stroke="#2e8b57" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="660" y="194" text-anchor="middle" font-size="9" fill="#2e8b57">回到判断</text>

  <!-- no child: return 0 -->
  <path d="M 580 358 L 580 384" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="596" y="374" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#sk)"><rect x="520" y="388" width="120" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="580" y="410" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return 0</text>

  <!-- no more chars: return node.sum -->
  <path d="M 490 228 L 430 228 L 430 388" stroke="#2e8b57" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="452" y="220" text-anchor="middle" font-size="10" fill="#2e8b57" font-weight="bold">否</text>
  <g filter="url(#sk)"><rect x="370" y="392" width="140" height="44" rx="8" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2"/></g>
  <text x="440" y="412" text-anchor="middle" font-size="10" fill="#2e6e2e">走到前缀节点</text>
  <text x="440" y="428" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">return node.Σ</text>

  <!-- bottom legend -->
  <g filter="url(#sk)"><rect x="40" y="468" width="700" height="56" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="390" y="488" text-anchor="middle" font-size="10" fill="#2b6e9e">💡 不变量：任意节点 u 的 Σ 恒等于「以 u 对应串为前缀的所有键 kv 值之和」</text>
  <text x="390" y="504" text-anchor="middle" font-size="10" fill="#2b6e9e">insert 用 delta 增量维护此不变量；sum 直接读取前缀节点的 Σ，故两者都是 O(L)</text>
</svg>
