<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="380" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：从右扫描定位切点</text>

  <!-- ===== Example 1: 51230100 ===== -->
  <text x="30" y="56" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：num = "51230100"</text>

  <!-- index labels -->
  <text x="50" y="78" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="86" y="78" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="122" y="78" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="158" y="78" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">3</text>
  <text x="194" y="78" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">4</text>
  <text x="230" y="78" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">5</text>
  <text x="266" y="78" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">6</text>
  <text x="302" y="78" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">7</text>

  <!-- 8 digit boxes, 36px wide -->
  <rect x="32" y="86" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="50" y="110" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="68" y="86" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="86" y="110" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="104" y="86" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="122" y="110" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="140" y="86" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="158" y="110" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="176" y="86" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="194" y="110" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="212" y="86" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="110" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="248" y="86" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="266" y="110" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">0</text>
  <rect x="284" y="86" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="110" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">0</text>

  <!-- cursor steps -->
  <!-- i=7 -->
  <path d="M 302 40 L 302 80" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="312" y="50" font-size="10" fill="#b85450" filter="url(#rough2)">i=7: '0'→左移</text>

  <!-- i=6 -->
  <path d="M 266 54 L 266 80" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="276" y="64" font-size="10" fill="#b85450" filter="url(#rough2)">i=6: '0'→左移</text>

  <!-- i=5 stop -->
  <path d="M 230 40 L 230 80" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="190" y="50" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i=5: '1'非零→停</text>

  <!-- cut marker -->
  <path d="M 248 130 L 248 146" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="248" y="160" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">截断点</text>

  <!-- result -->
  <path d="M 167 168 L 167 184" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="32" y="188" width="216" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="207" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">num[0..5] = "512301" ✓</text>

  <!-- ===== Example 2: 123 ===== -->
  <text x="370" y="56" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 2：num = "123"</text>

  <!-- index labels -->
  <text x="408" y="78" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="444" y="78" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="480" y="78" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">2</text>

  <!-- 3 digit boxes -->
  <rect x="390" y="86" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="408" y="110" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="426" y="86" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="444" y="110" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="462" y="86" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="110" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- cursor at index 2 immediately stops -->
  <path d="M 480 40 L 480 80" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="510" y="50" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i=2: '3'非零</text>
  <text x="510" y="64" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→一步未动即停</text>

  <!-- cut marker -->
  <path d="M 498 130 L 498 146" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="498" y="160" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">无尾随零</text>

  <!-- result -->
  <path d="M 437 168 L 437 184" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="370" y="188" width="180" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="460" y="207" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">num[0..2] = "123" ✓</text>

  <!-- ===== step summary table ===== -->
  <text x="30" y="244" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">扫描对比：</text>

  <rect x="30" y="258" width="290" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="40" y="275" font-size="10" fill="#333" filter="url(#rough2)">示例1：游标走 i=7→6→5，3 步命中非零，O(k)</text>

  <rect x="30" y="288" width="290" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="40" y="305" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例2：末位即非零，游标 0 步停下，O(1)</text>

  <rect x="340" y="258" width="280" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="350" y="278" font-size="10" fill="#333" filter="url(#rough2)">关键性质：</text>
  <text x="350" y="293" font-size="10" fill="#333" filter="url(#rough2)">· 切点 = 从右起首个非零字符下标 i</text>
  <text x="350" y="308" font-size="10" fill="#333" filter="url(#rough2)">· 答案 = num[0..i]，必非空（首字符非零）</text>

  <text x="320" y="358" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">两例共用同一套从右扫描逻辑，区别仅在尾部零的个数</text>
</svg>
