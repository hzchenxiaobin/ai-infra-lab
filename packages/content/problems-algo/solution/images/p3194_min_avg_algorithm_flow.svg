<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 对撞双指针取最小整数和 → 最后统一 ÷2</text>

  <!-- start -->
  <rect x="118" y="38" width="124" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="12" filter="url(#rough2)"/>
  <text x="180" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始：nums</text>

  <path d="M 180 66 L 180 82" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- sort -->
  <rect x="104" y="86" width="152" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="180" y="105" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">sort(nums) 升序排序</text>

  <path d="M 180 116 L 180 132" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="88" y="136" width="184" height="30" fill="#ffffff" stroke="#999" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="180" y="155" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">i = 0，j = n−1，best = +∞</text>

  <path d="M 180 166 L 180 182" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond -->
  <polygon points="180,186 254,216 180,246 106,216" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="221" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i &lt; j ?</text>

  <!-- yes branch -->
  <path d="M 254 216 L 298 216" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="302" y="200" width="186" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="395" y="220" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">best = min(best, a[i]+a[j])</text>

  <path d="M 395 232 L 395 252" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="322" y="256" width="146" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="395" y="274" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">i++ ；j−−</text>

  <!-- loop back around left side -->
  <path d="M 322 270 L 62 270 L 62 216 L 100 216" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="62" y="292" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">回到判定</text>

  <!-- no branch -->
  <path d="M 180 246 L 180 298" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="190" y="276" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否（n/2 对配完）</text>

  <!-- return -->
  <rect x="104" y="302" width="152" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="12" filter="url(#rough2)"/>
  <text x="180" y="321" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 best / 2.0</text>

  <!-- side note -->
  <rect x="290" y="302" width="212" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="396" y="318" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">全程只比较整数和 a[i]+a[j]</text>
  <text x="396" y="334" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">最后才除一次 2，无浮点累加误差</text>
</svg>
