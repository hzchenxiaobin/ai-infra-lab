<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：一趟遍历 + 奇偶判定</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888">统计 sumL, sumR, qL, qR → 判奇偶 → 比较公式</text>

  <!-- Step 1: scan -->
  <rect x="160" y="66" width="280" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="90" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">遍历 num，统计</text>
  <text x="300" y="108" text-anchor="middle" font-size="11" fill="#444">sumL, sumR, qL, qR, diff = sumL − sumR</text>

  <!-- arrow -->
  <path d="M 300 126 L 300 148" stroke="#666" stroke-width="1.5" marker-end="url(#arr3)" fill="none" filter="url(#rough2)"/>

  <!-- Decision: (qL+qR) odd? -->
  <polygon points="300,152 420,196 300,240 180,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="192" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">(qL + qR)</text>
  <text x="300" y="208" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">是奇数？</text>

  <!-- Yes branch: Alice wins -->
  <path d="M 180 196 L 90 196 L 90 226" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr3)" fill="none" filter="url(#rough2)"/>
  <text x="120" y="188" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="20" y="230" width="140" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="254" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Alice 胜</text>
  <text x="90" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a">return true</text>

  <text x="90" y="304" text-anchor="middle" font-size="10" fill="#888">奇数 → Alice 走最后一步</text>
  <text x="90" y="318" text-anchor="middle" font-size="10" fill="#888">10 选 1 必能避开目标</text>

  <!-- No branch -->
  <path d="M 420 196 L 510 196 L 510 226" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr3)" fill="none" filter="url(#rough2)"/>
  <text x="465" y="188" font-size="11" fill="#b85450" font-weight="bold">否(偶数)</text>

  <!-- Decision 2: 2*diff == 9*(qR-qL)? -->
  <polygon points="510,230 600,276 510,322 420,276" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="510" y="270" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2·diff ==</text>
  <text x="510" y="286" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">9·(qR−qL)?</text>

  <!-- Yes: Bob wins -->
  <path d="M 420 276 L 360 276 L 360 346" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr3)" fill="none" filter="url(#rough2)"/>
  <text x="380" y="268" font-size="11" fill="#b85450" font-weight="bold">是</text>

  <rect x="270" y="350" width="180" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="374" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">Bob 胜</text>
  <text x="360" y="392" text-anchor="middle" font-size="11" fill="#b85450">return false</text>

  <text x="360" y="424" text-anchor="middle" font-size="10" fill="#888">T = 平衡值</text>
  <text x="360" y="438" text-anchor="middle" font-size="10" fill="#888">互补策略锁定 total</text>

  <!-- No: Alice wins -->
  <path d="M 510 322 L 510 346" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr3)" fill="none" filter="url(#rough2)"/>
  <text x="525" y="338" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <rect x="450" y="350" width="140" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520" y="374" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Alice 胜</text>
  <text x="520" y="392" text-anchor="middle" font-size="11" fill="#4a7a3a">return true</text>

  <text x="520" y="424" text-anchor="middle" font-size="10" fill="#888">T ≠ 平衡值</text>
  <text x="520" y="438" text-anchor="middle" font-size="10" fill="#888">Alice 填极端值偏离</text>
</svg>
