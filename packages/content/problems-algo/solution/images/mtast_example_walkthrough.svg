<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="30" y="30" font-size="13" fill="#333" filter="url(#rough2)">示例：price=[10,20,20], taste=[5,8,8], A=20, C=1（半价券）</text>

  <text x="30" y="62" font-size="12" fill="#446688" filter="url(#rough2)">处理水果 0（p=10, t=5, pc=5）后 dp：</text>

  <rect x="30" y="70" width="200" height="128" rx="6" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="92" font-size="11" fill="#888" filter="url(#rough2)">a \ c</text>
  <text x="140" y="92" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="195" y="92" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <line x1="30" y1="98" x2="230" y2="98" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="110" y1="70" x2="110" y2="198" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="165" y1="70" x2="165" y2="198" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <g font-size="11" fill="#333">
    <text x="60" y="116" filter="url(#rough2)">0</text><text x="140" y="116" text-anchor="middle" filter="url(#rough2)">0</text><text x="195" y="116" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="60" y="136" filter="url(#rough2)">5</text><text x="140" y="136" text-anchor="middle" filter="url(#rough2)">0</text><text x="195" y="136" text-anchor="middle" fill="#d6a040" filter="url(#rough2)">5</text>
    <text x="60" y="156" filter="url(#rough2)">10</text><text x="140" y="156" text-anchor="middle" fill="#4a7a3a" filter="url(#rough2)">5</text><text x="195" y="156" text-anchor="middle" filter="url(#rough2)">5</text>
    <text x="60" y="176" filter="url(#rough2)">20</text><text x="140" y="176" text-anchor="middle" filter="url(#rough2)">5</text><text x="195" y="176" text-anchor="middle" filter="url(#rough2)">5</text>
  </g>
  <text x="245" y="136" font-size="10" fill="#d6a040" filter="url(#rough2)">← 券买水果0</text>
  <text x="245" y="156" font-size="10" fill="#4a7a3a" filter="url(#rough2)">← 原价买水果0</text>

  <text x="30" y="222" font-size="12" fill="#446688" filter="url(#rough2)">再处理水果 1（p=20, t=8, pc=10）后 dp[20][1]：</text>

  <rect x="150" y="232" width="120" height="50" rx="8" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="210" y="255" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">13 ★</text>
  <text x="210" y="273" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">dp[20][1]</text>

  <path d="M210,282 L210,300" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arra)" filter="url(#rough2)"/>
  <text x="30" y="316" font-size="12" fill="#333" filter="url(#rough2)">最优组合：</text>
  <text x="30" y="336" font-size="12" fill="#4a7a3a" filter="url(#rough2)">水果0 原价(付10,+5) ⊕ 水果1 优惠券(付10,+8) = 付 20 ≤ 20、用 1 ≤ 1 券，口味 13</text>
  <text x="30" y="354" font-size="10" fill="#888" filter="url(#rough2)">水果2 与水果1 同价同口味，替换即得另一等价方案</text>
</svg>
