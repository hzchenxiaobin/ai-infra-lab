<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：prices = [1, 5, 3, 7, 8]（下标 1-based）</text>

  <!-- table header -->
  <rect x="70" y="44" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="63" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="140" y="44" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="63" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">prices[i]</text>
  <rect x="240" y="44" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="63" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">key = p−i</text>
  <rect x="350" y="44" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="63" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">sum[0]</text>
  <rect x="470" y="44" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="530" y="63" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">sum[3]</text>

  <!-- row i=1 -->
  <rect x="70" y="74" width="70" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="105" y="92" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="140" y="74" width="100" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="190" y="92" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="240" y="74" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="92" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="350" y="74" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="92" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1 ← 0+1</text>
  <rect x="470" y="74" width="120" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="530" y="92" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>

  <!-- row i=2 -->
  <rect x="70" y="102" width="70" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="105" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="140" y="102" width="100" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="190" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="240" y="102" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="350" y="102" width="120" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="410" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="470" y="102" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="530" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5 ← 0+5</text>

  <!-- row i=3 -->
  <rect x="70" y="130" width="70" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="105" y="148" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="140" y="130" width="100" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="190" y="148" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="240" y="130" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="148" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="350" y="130" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="148" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">4 ← 1+3</text>
  <rect x="470" y="130" width="120" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="530" y="148" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <!-- row i=4 -->
  <rect x="70" y="158" width="70" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="105" y="176" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="140" y="158" width="100" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="190" y="176" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <rect x="240" y="158" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="350" y="158" width="120" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="410" y="176" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="470" y="158" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="530" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">12 ← 5+7</text>

  <!-- row i=5 -->
  <rect x="70" y="186" width="70" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="105" y="204" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="140" y="186" width="100" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="190" y="204" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <rect x="240" y="186" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="204" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="350" y="186" width="120" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="410" y="204" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="470" y="186" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="530" y="204" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">20 ← 12+8</text>

  <!-- 分隔 -->
  <line x1="70" y1="226" x2="590" y2="226" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- 分组结果 -->
  <text x="70" y="250" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">分组求和：</text>

  <rect x="60" y="258" width="240" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="278" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">组 0：下标{1,3} → 1+3 = 4</text>

  <rect x="320" y="258" width="250" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="445" y="278" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">组 3：下标{2,4,5} → 5+7+8 = 20</text>

  <!-- answer -->
  <rect x="120" y="304" width="340" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="329" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">ans = max(4, 20) = 20</text>

  <text x="310" y="364" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">验证组 3 线性：7−5=2=4−2，8−7=1=5−4 ✓</text>
</svg>
