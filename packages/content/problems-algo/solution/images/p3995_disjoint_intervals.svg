<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：应用范围两两不相交，匹配的永远是原始字符</text>

  <!-- 位置下标 -->
  <text x="78" y="58" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="130" y="58" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="182" y="58" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="234" y="58" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="286" y="58" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>

  <!-- source 行 -->
  <text x="36" y="90" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">source</text>
  <rect x="52" y="64" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="104" y="64" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="156" y="64" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="208" y="64" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="260" y="64" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="89" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">h</text>
  <text x="130" y="89" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">e</text>
  <text x="182" y="89" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">l</text>
  <text x="234" y="89" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">l</text>
  <text x="286" y="89" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">o</text>

  <!-- source → 规则框 的箭头 -->
  <path d="M104,106 L104,116" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M234,106 L234,116" stroke="#d6a040" stroke-width="2" marker-end="url(#arro)" filter="url(#rough2)"/>

  <!-- 两条规则（覆盖不相交区间） -->
  <rect x="52" y="120" width="104" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="104" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">规则0（成本 3）</text>
  <text x="104" y="148" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">he → wo</text>

  <rect x="156" y="120" width="156" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="234" y="134" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">规则1（成本 4）</text>
  <text x="234" y="148" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">llo → rld</text>

  <!-- 规则框 → target 的箭头 -->
  <path d="M104,154 L104,172" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M234,154 L234,172" stroke="#d6a040" stroke-width="2" marker-end="url(#arro)" filter="url(#rough2)"/>

  <!-- target 行 -->
  <text x="36" y="200" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">target</text>
  <rect x="52" y="176" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="104" y="176" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="156" y="176" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="208" y="176" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="260" y="176" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="201" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">w</text>
  <text x="130" y="201" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">o</text>
  <text x="182" y="201" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">r</text>
  <text x="234" y="201" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">l</text>
  <text x="286" y="201" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>

  <text x="182" y="246" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">本例 5 个位置全被两条规则覆盖；</text>
  <text x="182" y="262" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">未覆盖的位置 j 免费保留，但须 source[j] = target[j]</text>

  <!-- 右侧：顺序无关的论证 -->
  <rect x="322" y="64" width="188" height="178" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="416" y="88" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">顺序为什么无关？</text>
  <text x="416" y="112" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">① 匹配范围必须全部未使用</text>
  <text x="416" y="134" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">② 未使用 ⇒ 仍是原始字符</text>
  <text x="416" y="156" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">③ 写入 replacement 即终值</text>
  <text x="416" y="186" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 每次匹配都针对原始 source</text>
  <text x="416" y="204" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">先后应用顺序无所谓！</text>

  <!-- 底部结论 -->
  <rect x="30" y="276" width="460" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">视角切换：不是「操作序列搜索」，而是「不相交区间划分」</text>
  <text x="260" y="328" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">在 0..n−1 上选一组互不相交的区间，每段绑定一条规则</text>
  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">（pattern 匹配原始 source 且 replacement 对齐 target）</text>
  <text x="260" y="370" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">→ 前缀 DP：dp[i] → dp[i+1]（免费）/ dp[i+L]（规则 k）</text>
</svg>
