<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    示例 2 演算：两种视角互验（答案 13）
  </text>

  <!-- left: view 1, R matrix -->
  <text x="134" y="58" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">视角①：逐格 R = total − s</text>

  <!-- R matrix 3x3, cell 46, x0=48 y0=76 -->
  <rect x="48" y="76" width="46" height="46" fill="#efefef" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="71" y="104" text-anchor="middle" font-size="15" fill="#999999" filter="url(#rough2)">0</text>
  <rect x="96" y="76" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="119" y="104" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="144" y="76" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="167" y="104" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">3</text>

  <rect x="48" y="124" width="46" height="46" fill="#efefef" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="71" y="152" text-anchor="middle" font-size="15" fill="#999999" filter="url(#rough2)">0</text>
  <rect x="96" y="124" width="46" height="46" fill="#efefef" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="119" y="152" text-anchor="middle" font-size="15" fill="#999999" filter="url(#rough2)">0</text>
  <rect x="144" y="124" width="46" height="46" fill="#efefef" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="167" y="152" text-anchor="middle" font-size="15" fill="#999999" filter="url(#rough2)">0</text>

  <rect x="48" y="172" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="71" y="200" text-anchor="middle" font-size="16" fill="#4a7a3a" filter="url(#rough2)">7</text>
  <rect x="96" y="172" width="46" height="46" fill="#efefef" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="119" y="200" text-anchor="middle" font-size="15" fill="#999999" filter="url(#rough2)">0</text>
  <rect x="144" y="172" width="46" height="46" fill="#efefef" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="167" y="200" text-anchor="middle" font-size="15" fill="#999999" filter="url(#rough2)">0</text>

  <text x="134" y="248" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">total=10，块 A s=7，块 B s=3</text>
  <text x="134" y="268" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">逐格求和：3 + 3 + 7 = 13 ✓</text>

  <!-- right: view 2, per-block contribution table -->
  <text x="384" y="58" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">视角②：按块贡献 (cnt−t)×s</text>

  <!-- header row -->
  <rect x="252" y="76" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="97" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">块</text>
  <rect x="300" y="76" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="326" y="97" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">s</text>
  <rect x="352" y="76" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="378" y="97" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">t</text>
  <rect x="404" y="76" width="108" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="458" y="97" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">贡献</text>

  <!-- row A -->
  <rect x="252" y="108" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="129" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">A</text>
  <rect x="300" y="108" width="52" height="32" fill="#fafafa" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="326" y="129" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">7</text>
  <rect x="352" y="108" width="52" height="32" fill="#fafafa" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="378" y="129" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="404" y="108" width="108" height="32" fill="#fafafa" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="458" y="129" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(3−2)×7=7</text>

  <!-- row B -->
  <rect x="252" y="140" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="161" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">B</text>
  <rect x="300" y="140" width="52" height="32" fill="#fafafa" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="326" y="161" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="352" y="140" width="52" height="32" fill="#fafafa" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="378" y="161" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="404" y="140" width="108" height="32" fill="#fafafa" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="458" y="161" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(3−1)×3=6</text>

  <!-- total row -->
  <rect x="252" y="172" width="48" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="276" y="193" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">合计</text>
  <rect x="300" y="172" width="52" height="32" fill="#fafafa" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="326" y="193" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">—</text>
  <rect x="352" y="172" width="52" height="32" fill="#fafafa" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="378" y="193" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">—</text>
  <rect x="404" y="172" width="108" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="458" y="193" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">13 ✓</text>

  <text x="384" y="232" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">cnt = 3（非阻塞格总数）</text>
  <text x="384" y="252" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">块和 s 被块外每个格子的 R 各计一次</text>

  <!-- bottom captions -->
  <text x="260" y="298" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">
    逐格视角 A 得 6、B 得 7；按块视角 A 得 7、B 得 6
  </text>
  <text x="260" y="318" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">
    拆法不同、总和一致 —— 两个贡献公式恒等的直观体现
  </text>
  <text x="260" y="338" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">
    阻塞格 R=0，不参与任何贡献
  </text>
</svg>
