<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2, 1, 8]，k = 10 = 1010₂</text>

  <!-- column headers -->
  <text x="44" y="52" font-size="10" fill="#999" filter="url(#rough2)">步骤</text>
  <text x="150" y="52" font-size="10" fill="#999" filter="url(#rough2)">窗口</text>
  <text x="320" y="52" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">二进制位</text>
  <text x="294" y="66" text-anchor="middle" font-size="9" fill="#bbb" filter="url(#rough2)">8</text>
  <text x="326" y="66" text-anchor="middle" font-size="9" fill="#bbb" filter="url(#rough2)">4</text>
  <text x="358" y="66" text-anchor="middle" font-size="9" fill="#bbb" filter="url(#rough2)">2</text>
  <text x="390" y="66" text-anchor="middle" font-size="9" fill="#bbb" filter="url(#rough2)">1</text>
  <text x="445" y="52" font-size="10" fill="#999" filter="url(#rough2)">OR 值</text>
  <text x="486" y="52" font-size="10" fill="#999" filter="url(#rough2)">判定</text>

  <!-- row 1 -->
  <rect x="36" y="76" width="570" height="64" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="44" y="112" font-size="10.5" fill="#333" filter="url(#rough2)">① r=0 入 2</text>
  <rect x="136" y="95" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="153" y="115" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="280" y="95" width="28" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="294" y="115" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="312" y="95" width="28" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="326" y="115" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="344" y="95" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="115" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="376" y="95" width="28" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="390" y="115" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="445" y="114" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="486" y="106" font-size="10" fill="#666" filter="url(#rough2)">2 &lt; 10</text>
  <text x="486" y="122" font-size="10" fill="#666" filter="url(#rough2)">不达标，扩窗 →</text>

  <!-- row 2 -->
  <rect x="36" y="148" width="570" height="64" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="44" y="184" font-size="10.5" fill="#333" filter="url(#rough2)">② r=1 入 1</text>
  <rect x="136" y="167" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="153" y="187" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="174" y="167" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="191" y="187" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="280" y="167" width="28" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="294" y="187" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="312" y="167" width="28" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="326" y="187" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="344" y="167" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="187" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="376" y="167" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="187" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="445" y="186" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="486" y="178" font-size="10" fill="#666" filter="url(#rough2)">3 &lt; 10</text>
  <text x="486" y="194" font-size="10" fill="#666" filter="url(#rough2)">不达标，扩窗 →</text>
  <text x="412" y="160" font-size="9" fill="#b85450" filter="url(#rough2)">← 新点亮</text>

  <!-- row 3 -->
  <rect x="36" y="220" width="570" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="44" y="256" font-size="10.5" fill="#333" filter="url(#rough2)">③ r=2 入 8</text>
  <rect x="136" y="239" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="153" y="259" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="174" y="239" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="191" y="259" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="212" y="239" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="259" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">8</text>
  <rect x="280" y="239" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="294" y="259" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="312" y="239" width="28" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="326" y="259" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="344" y="239" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="259" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="376" y="239" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="259" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="268" y="232" font-size="9" fill="#b85450" filter="url(#rough2)">← 新点亮</text>
  <text x="445" y="258" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">11</text>
  <text x="486" y="250" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">11 ≥ 10 ✓</text>
  <text x="486" y="266" font-size="10" fill="#4a7a3a" filter="url(#rough2)">记录 len=3，开始收缩</text>

  <!-- row 4 -->
  <rect x="36" y="292" width="570" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="44" y="328" font-size="10.5" fill="#333" filter="url(#rough2)">④ 出窗 2</text>
  <rect x="136" y="311" width="34" height="30" fill="#eeeeee" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="153" y="331" text-anchor="middle" font-size="12.5" fill="#bbb" filter="url(#rough2)">2</text>
  <rect x="174" y="311" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="191" y="331" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="212" y="311" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="331" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">8</text>
  <rect x="280" y="311" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="331" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="312" y="311" width="28" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="326" y="331" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="344" y="311" width="28" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="358" y="331" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="376" y="311" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="331" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="412" y="304" font-size="9" fill="#b85450" filter="url(#rough2)">← 归零熄灭</text>
  <text x="445" y="330" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="486" y="322" font-size="10" fill="#d6a040" filter="url(#rough2)">9 &lt; 10</text>
  <text x="486" y="338" font-size="10" fill="#d6a040" filter="url(#rough2)">停止收缩，r 已到头</text>

  <!-- answer -->
  <rect x="140" y="368" width="360" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="320" y="390" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = 3</text>
  <text x="320" y="409" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">最短特别子数组 [2, 1, 8]，OR = 1011₂ = 11 ≥ 10</text>
</svg>
