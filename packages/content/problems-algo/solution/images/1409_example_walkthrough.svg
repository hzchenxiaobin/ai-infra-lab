<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="480" fill="#fafafa"/>

  <text x="360" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：queries = [3,1,2,1], m = 5 → [2,1,2,1]</text>
  <text x="360" y="46" text-anchor="middle" font-size="11" fill="#888">n = 4，N = 9；红框 = 本次查询的旧位置，绿框 = 新落点 n−i</text>

  <!-- column headers: positions 1..9 -->
  <text x="60" y="82" text-anchor="end" font-size="11" fill="#666" font-weight="bold">步骤</text>
  <g font-size="10" fill="#999">
    <text x="100" y="82" text-anchor="middle">1</text>
    <text x="140" y="82" text-anchor="middle">2</text>
    <text x="180" y="82" text-anchor="middle">3</text>
    <text x="220" y="82" text-anchor="middle">4</text>
    <text x="260" y="82" text-anchor="middle">5</text>
    <text x="300" y="82" text-anchor="middle">6</text>
    <text x="340" y="82" text-anchor="middle">7</text>
    <text x="380" y="82" text-anchor="middle">8</text>
    <text x="420" y="82" text-anchor="middle">9</text>
  </g>
  <text x="540" y="82" font-size="10" fill="#666" font-weight="bold">查询 → ans ｜ 当前排列</text>

  <!-- separator -->
  <line x1="60" y1="90" x2="680" y2="90" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row: init -->
  <text x="60" y="118" text-anchor="end" font-size="11" fill="#666" font-weight="bold">init</text>
  <g font-size="12">
    <rect x="82"  y="98" width="36" height="28" rx="3" fill="#fafafa" stroke="#ddd" filter="url(#rough2)"/>
    <rect x="122" y="98" width="36" height="28" rx="3" fill="#fafafa" stroke="#ddd" filter="url(#rough2)"/>
    <rect x="162" y="98" width="36" height="28" rx="3" fill="#fafafa" stroke="#ddd" filter="url(#rough2)"/>
    <rect x="202" y="98" width="36" height="28" rx="3" fill="#fafafa" stroke="#ddd" filter="url(#rough2)"/>
    <rect x="242" y="98" width="36" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="260" y="118" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="282" y="98" width="36" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="300" y="118" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="322" y="98" width="36" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="340" y="118" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <rect x="362" y="98" width="36" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="380" y="118" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <rect x="402" y="98" width="36" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="420" y="118" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
  </g>
  <text x="460" y="118" font-size="11" fill="#888">占据位 5..9 ｜ [1,2,3,4,5]</text>

  <!-- Row i=0, v=3 -->
  <text x="60" y="158" text-anchor="end" font-size="11" fill="#666" font-weight="bold">i=0,v=3</text>
  <g font-size="12">
    <rect x="82"  y="138" width="36" height="28" rx="3" fill="#fafafa" stroke="#ddd" filter="url(#rough2)"/>
    <rect x="122" y="138" width="36" height="28" rx="3" fill="#fafafa" stroke="#ddd" filter="url(#rough2)"/>
    <rect x="162" y="138" width="36" height="28" rx="3" fill="#fafafa" stroke="#ddd" filter="url(#rough2)"/>
    <rect x="202" y="138" width="36" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="220" y="158" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="242" y="138" width="36" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="260" y="158" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="282" y="138" width="36" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="300" y="158" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="322" y="138" width="36" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="340" y="158" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <rect x="362" y="138" width="36" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="380" y="158" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <rect x="402" y="138" width="36" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="420" y="158" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
  </g>
  <text x="460" y="158" font-size="11" fill="#b85450" font-weight="bold">pos=7,q=3→ans=2</text>
  <text x="460" y="172" font-size="10" fill="#888">清7 置4 ｜ [3,1,2,4,5]</text>

  <!-- Row i=1, v=1 -->
  <text x="60" y="198" text-anchor="end" font-size="11" fill="#666" font-weight="bold">i=1,v=1</text>
  <g font-size="12">
    <rect x="82"  y="178" width="36" height="28" rx="3" fill="#fafafa" stroke="#ddd" filter="url(#rough2)"/>
    <rect x="122" y="178" width="36" height="28" rx="3" fill="#fafafa" stroke="#ddd" filter="url(#rough2)"/>
    <rect x="162" y="178" width="36" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="180" y="198" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="202" y="178" width="36" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="220" y="198" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <rect x="242" y="178" width="36" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="260" y="198" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="282" y="178" width="36" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="300" y="198" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="322" y="178" width="36" height="28" rx="3" fill="#fafafa" stroke="#ddd" filter="url(#rough2)"/>
    <rect x="362" y="178" width="36" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="380" y="198" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <rect x="402" y="178" width="36" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="420" y="198" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
  </g>
  <text x="460" y="198" font-size="11" fill="#b85450" font-weight="bold">pos=5,q=2→ans=1</text>
  <text x="460" y="212" font-size="10" fill="#888">清5 置3 ｜ [1,3,2,4,5]</text>

  <!-- Row i=2, v=2 -->
  <text x="60" y="238" text-anchor="end" font-size="11" fill="#666" font-weight="bold">i=2,v=2</text>
  <g font-size="12">
    <rect x="82"  y="218" width="36" height="28" rx="3" fill="#fafafa" stroke="#ddd" filter="url(#rough2)"/>
    <rect x="122" y="218" width="36" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="140" y="238" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="162" y="218" width="36" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="180" y="238" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="202" y="218" width="36" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="220" y="238" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <rect x="242" y="218" width="36" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="260" y="238" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="282" y="218" width="36" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="300" y="238" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="322" y="218" width="36" height="28" rx="3" fill="#fafafa" stroke="#ddd" filter="url(#rough2)"/>
    <rect x="362" y="218" width="36" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="380" y="238" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <rect x="402" y="218" width="36" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="420" y="238" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
  </g>
  <text x="460" y="238" font-size="11" fill="#b85450" font-weight="bold">pos=6,q=3→ans=2</text>
  <text x="460" y="252" font-size="10" fill="#888">清6 置2 ｜ [2,1,3,4,5]</text>

  <!-- Row i=3, v=1 -->
  <text x="60" y="278" text-anchor="end" font-size="11" fill="#666" font-weight="bold">i=3,v=1</text>
  <g font-size="12">
    <rect x="82"  y="258" width="36" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="100" y="278" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="122" y="258" width="36" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="140" y="278" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="162" y="258" width="36" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="180" y="278" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="202" y="258" width="36" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="220" y="278" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <rect x="242" y="258" width="36" height="28" rx="3" fill="#fafafa" stroke="#ddd" filter="url(#rough2)"/>
    <rect x="282" y="258" width="36" height="28" rx="3" fill="#fafafa" stroke="#ddd" filter="url(#rough2)"/>
    <rect x="322" y="258" width="36" height="28" rx="3" fill="#fafafa" stroke="#ddd" filter="url(#rough2)"/>
    <rect x="362" y="258" width="36" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="380" y="278" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <rect x="402" y="258" width="36" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="420" y="278" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
  </g>
  <text x="460" y="278" font-size="11" fill="#b85450" font-weight="bold">pos=3,q=2→ans=1</text>
  <text x="460" y="292" font-size="10" fill="#888">清3 置1 ｜ [1,2,3,4,5]</text>

  <!-- result box -->
  <rect x="60" y="312" width="600" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="336" font-size="12" fill="#4a7a3a" font-weight="bold">💡 关键观察</text>
  <text x="80" y="354" font-size="11" fill="#555">新落点序列 4,3,2,1（= n−i）单调递减 → 新队首始终在上一任队首左侧，无需平移任何元素</text>
  <text x="80" y="370" font-size="11" fill="#555">每次「清旧位 + 置新位」两步单点修改，位次 = 前缀和 − 1，全部 O(log N)</text>

  <!-- legend -->
  <rect x="60" y="392" width="600" height="64" rx="8" fill="#fafafa" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="412" font-size="11" fill="#666" font-weight="bold">图例</text>
  <rect x="80" y="424" width="22" height="18" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="438" font-size="11" fill="#666">本次查询的旧位置 pos[v]</text>
  <rect x="280" y="424" width="22" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="438" font-size="11" fill="#666">新落点 n−i（置 1）</text>
  <rect x="460" y="424" width="22" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="438" font-size="11" fill="#666">占据位（数值）</text>
  <text x="80" y="454" font-size="10" fill="#999">「q」= query(pos[v]) 前缀和；ans = q − 1</text>
</svg>
