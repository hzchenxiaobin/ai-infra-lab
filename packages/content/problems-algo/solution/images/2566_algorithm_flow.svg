<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 9 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="600" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：两段贪心扫描（求 mx / 求 mn）</text>

  <!-- step 1 -->
  <rect x="200" y="48" width="160" height="40" rx="6" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="73" text-anchor="middle" font-size="12" fill="#333">s = str(num)</text>
  <path d="M 280 90 L 280 108" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- MAX label -->
  <rect x="60" y="112" width="100" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="131" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">求最大值 mx</text>

  <!-- step 2 scan -->
  <rect x="200" y="116" width="300" height="40" rx="6" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="141" text-anchor="middle" font-size="11" fill="#333">从左→右扫 s，找第一个 c ≠ '9'</text>
  <path d="M 350 158 L 350 176" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision -->
  <path d="M 350 180 L 410 216 L 350 252 L 290 216 z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="213" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">找到 c？</text>
  <text x="350" y="228" text-anchor="middle" font-size="10" fill="#888">(非全 9)</text>

  <!-- yes branch -->
  <text x="416" y="212" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 410 216 L 468 216" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="262" width="300" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="281" text-anchor="middle" font-size="11" fill="#333">把 s 中所有 c 替换为 '9' → mx</text>
  <text x="350" y="295" text-anchor="middle" font-size="9" fill="#888">同一数字全部联动替换</text>
  <path d="M 350 252 L 350 260" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no branch -->
  <text x="276" y="248" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">否(全 9)</text>
  <path d="M 290 216 L 230 216 L 230 262" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="80" y="262" width="180" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="287" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">mx = num（不变）</text>

  <!-- merge down -->
  <path d="M 350 304 L 350 322" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- MIN label -->
  <rect x="60" y="326" width="100" height="28" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="345" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">求最小值 mn</text>

  <!-- step scan min -->
  <rect x="200" y="330" width="300" height="40" rx="6" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="350" text-anchor="middle" font-size="11" fill="#333">从左→右扫 s，找第一个 c ≠ '0'</text>
  <text x="350" y="364" text-anchor="middle" font-size="9" fill="#888">输入无前导零 ⇒ c 必为首位 s[0]</text>
  <path d="M 350 372 L 350 390" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- replace min -->
  <rect x="200" y="394" width="300" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="413" text-anchor="middle" font-size="11" fill="#333">把 s 中所有 c 替换为 '0' → mn</text>
  <text x="350" y="427" text-anchor="middle" font-size="9" fill="#888">首位变 0 ⇒ 前导零丢弃，数位缩短</text>
  <path d="M 350 436 L 350 454" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="180" y="458" width="340" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="488" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">返回 int(mx) − int(mn)</text>

  <!-- note -->
  <rect x="40" y="524" width="480" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="546" font-size="11" fill="#444" font-weight="bold">两段扫描对称：目标一个取 '9'、一个取 '0'。</text>
  <text x="60" y="564" font-size="11" fill="#555">max 找首个非 9（若首位已是 9 则跳过，如 90→找 '0'）；min 找首个非 0（必为首位的非零数字）。</text>
  <text x="60" y="578" font-size="10" fill="#888">允许前导零、允许替换成自身，故全 9 时 mx = num 仍合法。</text>
</svg>
