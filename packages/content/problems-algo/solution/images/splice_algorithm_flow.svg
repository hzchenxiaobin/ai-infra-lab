<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：一次遍历同时跑 Kadane 求最大/最小子数组和</text>
  <text x="270" y="42" text-anchor="middle" font-size="10.5" fill="#888">在 diff=nums2−nums1 上同趟维护 curMax/maxS 与 curMin/minS</text>

  <!-- ===== Start: init ===== -->
  <rect x="140" y="56" width="260" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="76" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">初始化</text>
  <text x="270" y="93" text-anchor="middle" font-size="10" fill="#446688">sum1=Σnums1, sum2=Σnums2</text>
  <text x="270" y="103" text-anchor="middle" font-size="10" fill="#446688">curMax=maxS=0, curMin=minS=0</text>
  <path d="M 270 106 L 270 124" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision: i < n ? ===== -->
  <polygon points="270,128 370,168 270,208 170,168" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="164" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">还有元素</text>
  <text x="270" y="180" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">i &lt; n ?</text>

  <!-- No branch -> compute answer -->
  <path d="M 370 168 L 430 168 L 430 348" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="162" font-size="10.5" fill="#b85450" font-weight="bold">否</text>

  <!-- Yes branch -> down -->
  <path d="M 270 208 L 270 226" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="222" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ===== Step 1: d = nums2[i] - nums1[i] ===== -->
  <rect x="140" y="230" width="260" height="42" fill="#f4f4f4" stroke="#888" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="250" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">d = nums2[i] − nums1[i]</text>
  <text x="270" y="265" text-anchor="middle" font-size="9.5" fill="#888">当前位交换带来的净变化量</text>
  <path d="M 270 272 L 270 288" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: Kadane max ===== -->
  <rect x="40" y="292" width="225" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="152" y="311" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">curMax = max(d, curMax + d)</text>
  <text x="152" y="328" text-anchor="middle" font-size="9.5" fill="#446688">maxS = max(maxS, curMax)</text>

  <!-- ===== Step 3: Kadane min ===== -->
  <rect x="275" y="292" width="225" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="387" y="311" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">curMin = min(d, curMin + d)</text>
  <text x="387" y="328" text-anchor="middle" font-size="9.5" fill="#4a7a3a">minS = min(minS, curMin)</text>

  <!-- join arrows from both to loop-back -->
  <path d="M 152 340 L 152 358 L 387 358 L 387 340" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 270 358 L 270 376" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop back box -->
  <rect x="200" y="378" width="140" height="28" fill="#fafafa" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="396" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">i++，回到判定</text>
  <path d="M 270 406 L 270 416 L 90 416 L 90 168 L 168 168" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Final answer box ===== -->
  <rect x="330" y="348" width="190" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="425" y="368" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">ans = max(sum1+maxS,</text>
  <text x="425" y="384" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">sum2−minS)</text>

  <!-- arrow from no-branch into answer -->
  <path d="M 430 168 L 430 348" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Side note: empty subarray ===== -->
  <rect x="330" y="406" width="190" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="425" y="424" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">💡 maxS≥0、minS≤0</text>
  <text x="425" y="438" text-anchor="middle" font-size="9.5" fill="#555">初值 0 即「不交换」选项</text>
  <text x="425" y="450" text-anchor="middle" font-size="9.5" fill="#555">自动覆盖 S=0</text>

  <!-- ===== Footer ===== -->
  <rect x="40" y="436" width="235" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="157" y="456" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">一趟 O(n)，常数空间 O(1)</text>
</svg>
