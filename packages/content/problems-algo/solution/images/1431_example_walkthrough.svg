<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：candies = [2,3,5,1,3]，extraCandies = 3</text>

  <!-- Step 1 -->
  <text x="40" y="56" font-size="12" fill="#333">① 求 maxVal = max([2,3,5,1,3]) = <tspan fill="#b85450" font-weight="bold">5</tspan></text>
  <!-- Step 2 -->
  <text x="40" y="78" font-size="12" fill="#333">② threshold = maxVal − extraCandies = 5 − 3 = <tspan fill="#d6a040" font-weight="bold">2</tspan></text>
  <!-- Step 3 -->
  <text x="40" y="100" font-size="12" fill="#333">③ 逐个比较：candies[i] ≥ threshold ⟹ res[i]</text>

  <!-- Table header row -->
  <rect x="90" y="112" width="400" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="110" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <text x="165" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">candies[i]</text>
  <text x="235" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">≥ 2 ?</text>
  <text x="310" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">candies[i]+3</text>
  <text x="385" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">≥ 5 ?</text>
  <text x="455" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">res[i]</text>

  <!-- vertical column separators -->
  <path d="M 130 112 L 130 280 M 200 112 L 200 280 M 270 112 L 270 280 M 350 112 L 350 280 M 420 112 L 420 280" stroke="#d8d8d8" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- row 0: i=0 -->
  <rect x="90" y="140" width="400" height="28" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="110" y="158" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="165" y="158" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="235" y="158" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="310" y="158" text-anchor="middle" font-size="11.5" fill="#333">5</text>
  <text x="385" y="158" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="455" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- row 1: i=1 -->
  <rect x="90" y="168" width="400" height="28" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="110" y="186" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="165" y="186" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="235" y="186" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="310" y="186" text-anchor="middle" font-size="11.5" fill="#333">6</text>
  <text x="385" y="186" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="455" y="186" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- row 2: i=2 -->
  <rect x="90" y="196" width="400" height="28" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="110" y="214" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="165" y="214" text-anchor="middle" font-size="11.5" fill="#333">5</text>
  <text x="235" y="214" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="310" y="214" text-anchor="middle" font-size="11.5" fill="#333">8</text>
  <text x="385" y="214" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="455" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- row 3: i=3 (highlight, fails) -->
  <rect x="90" y="224" width="400" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="110" y="242" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="165" y="242" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="235" y="242" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  <text x="310" y="242" text-anchor="middle" font-size="11.5" fill="#333">4</text>
  <text x="385" y="242" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  <text x="455" y="242" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">false</text>

  <!-- row 4: i=4 -->
  <rect x="90" y="252" width="400" height="28" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="110" y="270" text-anchor="middle" font-size="11.5" fill="#333">4</text>
  <text x="165" y="270" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="235" y="270" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="310" y="270" text-anchor="middle" font-size="11.5" fill="#333">6</text>
  <text x="385" y="270" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="455" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- Result -->
  <text x="290" y="304" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">结果 res = [true, true, true, false, true]</text>

  <!-- footer note -->
  <rect x="60" y="324" width="460" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="290" y="342" text-anchor="middle" font-size="10.5" fill="#555">两种判定等价：左列「candies[i] ≥ 阈值 2」与右列「candies[i]+3 ≥ max 5」结果一致</text>
  <text x="290" y="356" text-anchor="middle" font-size="10" fill="#888">i = 3 是唯一原糖果低于阈值的孩子，给它全部 extra 仍到不了 5</text>
</svg>
