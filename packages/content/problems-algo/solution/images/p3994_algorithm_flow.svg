<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描，两个计数器数出逆序对</text>

  <rect x="170" y="36" width="180" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">初始化 ans = c1 = c2 = 0</text>

  <path d="M 260 70 L 260 88" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="36" y="92" width="352" height="222" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="6 5" rx="12" filter="url(#rough2)"/>
  <text x="48" y="108" font-size="11" fill="#666" filter="url(#rough2)">遍历 x ∈ nums</text>

  <polygon points="260,100 334,136 260,172 186,136" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="141" text-anchor="middle" font-size="12" fill="#a0433f" filter="url(#rough2)">x &lt; a ?</text>

  <path d="M 186 136 L 152 136" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="168" y="128" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">是</text>

  <rect x="46" y="118" width="104" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="98" y="140" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">ans += c1 + c2</text>
  <text x="98" y="168" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">组 0：c0 不参与计算，无需维护</text>

  <path d="M 260 172 L 260 186" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="271" y="184" font-size="9.5" fill="#888" filter="url(#rough2)">否</text>

  <polygon points="260,188 330,214 260,240 190,214" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="219" text-anchor="middle" font-size="12" fill="#a0433f" filter="url(#rough2)">x ≤ b ?</text>

  <path d="M 190 214 L 156 214" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="172" y="206" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">是</text>

  <rect x="48" y="196" width="104" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="218" text-anchor="middle" font-size="11" fill="#3a6130" filter="url(#rough2)">ans += c2</text>
  <text x="100" y="246" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">组 1</text>

  <path d="M 260 240 L 260 254" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="271" y="252" font-size="9.5" fill="#888" filter="url(#rough2)">否</text>

  <rect x="208" y="256" width="104" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="277" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">c2++</text>
  <text x="322" y="276" font-size="9" fill="#888" filter="url(#rough2)">组 2</text>

  <path d="M 98 154 L 98 300" fill="none" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 100 232 L 100 300" fill="none" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 260 288 L 260 300" fill="none" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 98 300 L 260 300" fill="none" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>

  <circle cx="260" cy="300" r="3.2" fill="#446688" filter="url(#rough2)"/>

  <path d="M 260 300 L 430 300 L 430 136 L 340 136" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="386" y="290" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">取下一个 x ↺</text>

  <path d="M 260 300 L 260 330" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="273" y="320" font-size="9.5" fill="#446688" filter="url(#rough2)">遍历完</text>

  <rect x="150" y="330" width="220" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">返回 ans mod (10⁹ + 7)</text>
  <text x="260" y="364" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">逆序对最多 ~n²/2 ≈ 5×10⁹，C++ 记得 long long</text>

  <rect x="20" y="380" width="232" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="136" y="394" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">为什么能 O(n)？</text>
  <text x="136" y="409" text-anchor="middle" font-size="9" fill="#7a5c1a" filter="url(#rough2)">只有 0/1/2 三值：遇 0/1 只看前面 1、2 的个数</text>

  <rect x="268" y="380" width="232" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="384" y="394" text-anchor="middle" font-size="10" fill="#33507a" font-weight="bold" filter="url(#rough2)">口算验证</text>
  <text x="384" y="409" text-anchor="middle" font-size="9" fill="#3d5a80" filter="url(#rough2)">[2,1,1,0] ⇒ 1 + 1 + 3 = 5 ✓</text>
</svg>
