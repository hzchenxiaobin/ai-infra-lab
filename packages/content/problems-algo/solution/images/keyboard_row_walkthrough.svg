<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：words = ["Hello","Alaska","Dad","Peace"]</text>

  <!-- legend -->
  <rect x="350" y="40" width="14" height="14" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="370" y="52" font-size="10" fill="#446688">第1行</text>
  <rect x="410" y="40" width="14" height="14" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="430" y="52" font-size="10" fill="#4a7a3a">第2行</text>
  <rect x="470" y="40" width="14" height="14" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="490" y="52" font-size="10" fill="#d6a040">第3行</text>

  <!-- ===== Word 1: Hello → H(2) e(1) l(2) l(2) o(1) → reject ===== -->
  <text x="40" y="84" font-size="12" fill="#333" font-weight="bold">Hello</text>
  <rect x="110" y="68" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="127" y="90" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">H</text>
  <text x="127" y="116" text-anchor="middle" font-size="9" fill="#4a7a3a">行2</text>
  <rect x="147" y="68" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="164" y="90" text-anchor="middle" font-size="14" fill="#2a4a66" font-weight="bold">e</text>
  <text x="164" y="116" text-anchor="middle" font-size="9" fill="#446688">行1</text>
  <rect x="184" y="68" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="201" y="90" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">l</text>
  <text x="201" y="116" text-anchor="middle" font-size="9" fill="#4a7a3a">行2</text>
  <rect x="221" y="68" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="238" y="90" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">l</text>
  <text x="238" y="116" text-anchor="middle" font-size="9" fill="#4a7a3a">行2</text>
  <rect x="258" y="68" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="275" y="90" text-anchor="middle" font-size="14" fill="#2a4a66" font-weight="bold">o</text>
  <text x="275" y="116" text-anchor="middle" font-size="9" fill="#446688">行1</text>
  <text x="320" y="90" font-size="14" fill="#b85450" font-weight="bold">行2≠行1 ✗</text>

  <!-- ===== Word 2: Alaska → A(2) l(2) a(2) s(2) k(2) a(2) → accept ===== -->
  <text x="40" y="160" font-size="12" fill="#333" font-weight="bold">Alaska</text>
  <rect x="110" y="144" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="127" y="166" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">A</text>
  <text x="127" y="192" text-anchor="middle" font-size="9" fill="#4a7a3a">行2</text>
  <rect x="147" y="144" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="164" y="166" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">l</text>
  <text x="164" y="192" text-anchor="middle" font-size="9" fill="#4a7a3a">行2</text>
  <rect x="184" y="144" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="201" y="166" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">a</text>
  <text x="201" y="192" text-anchor="middle" font-size="9" fill="#4a7a3a">行2</text>
  <rect x="221" y="144" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="238" y="166" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">s</text>
  <text x="238" y="192" text-anchor="middle" font-size="9" fill="#4a7a3a">行2</text>
  <rect x="258" y="144" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="275" y="166" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">k</text>
  <text x="275" y="192" text-anchor="middle" font-size="9" fill="#4a7a3a">行2</text>
  <rect x="295" y="144" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="312" y="166" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">a</text>
  <text x="312" y="192" text-anchor="middle" font-size="9" fill="#4a7a3a">行2</text>
  <text x="355" y="166" font-size="14" fill="#4a7a3a" font-weight="bold">全行2 ✓</text>

  <!-- ===== Word 3: Dad → D(2) a(2) d(2) → accept ===== -->
  <text x="40" y="236" font-size="12" fill="#333" font-weight="bold">Dad</text>
  <rect x="110" y="220" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="127" y="242" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">D</text>
  <text x="127" y="268" text-anchor="middle" font-size="9" fill="#4a7a3a">行2</text>
  <rect x="147" y="220" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="164" y="242" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">a</text>
  <text x="164" y="268" text-anchor="middle" font-size="9" fill="#4a7a3a">行2</text>
  <rect x="184" y="220" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="201" y="242" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">d</text>
  <text x="201" y="268" text-anchor="middle" font-size="9" fill="#4a7a3a">行2</text>
  <text x="240" y="242" font-size="14" fill="#4a7a3a" font-weight="bold">全行2 ✓</text>

  <!-- ===== Word 4: Peace → P(1) e(1) a(2) c(3) e(1) → reject ===== -->
  <text x="40" y="312" font-size="12" fill="#333" font-weight="bold">Peace</text>
  <rect x="110" y="296" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="127" y="318" text-anchor="middle" font-size="14" fill="#2a4a66" font-weight="bold">P</text>
  <text x="127" y="344" text-anchor="middle" font-size="9" fill="#446688">行1</text>
  <rect x="147" y="296" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="164" y="318" text-anchor="middle" font-size="14" fill="#2a4a66" font-weight="bold">e</text>
  <text x="164" y="344" text-anchor="middle" font-size="9" fill="#446688">行1</text>
  <rect x="184" y="296" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="201" y="318" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">a</text>
  <text x="201" y="344" text-anchor="middle" font-size="9" fill="#4a7a3a">行2</text>
  <rect x="221" y="296" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="238" y="318" text-anchor="middle" font-size="14" fill="#a67830" font-weight="bold">c</text>
  <text x="238" y="344" text-anchor="middle" font-size="9" fill="#d6a040">行3</text>
  <rect x="258" y="296" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="275" y="318" text-anchor="middle" font-size="14" fill="#2a4a66" font-weight="bold">e</text>
  <text x="275" y="344" text-anchor="middle" font-size="9" fill="#446688">行1</text>
  <text x="320" y="318" font-size="13" fill="#b85450" font-weight="bold">行1≠行2≠行3 ✗</text>

  <!-- divider -->
  <line x1="40" y1="362" x2="520" y2="362" stroke="#ddd" stroke-width="1" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="40" y="376" width="480" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="396" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">结果：仅 Alaska、Dad 全部字母同属一行 → 收集输出</text>
  <text x="280" y="414" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">输出：["Alaska", "Dad"]</text>
</svg>
