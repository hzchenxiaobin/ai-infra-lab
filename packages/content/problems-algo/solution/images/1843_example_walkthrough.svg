<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：账户 3（可疑） vs 账户 4（不可疑）</text>

  <!-- ===== Account 3 section ===== -->
  <rect x="20" y="36" width="280" height="480" fill="#fff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.95"/>
  <text x="160" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">账户 3（max_income = 21000）</text>

  <!-- Monthly breakdown -->
  <text x="30" y="76" font-size="9" fill="#888">Creditor 交易 →</text>
  <text x="30" y="92" font-size="9" fill="#666">06月: 107100 + 102100 + 90900</text>
  <rect x="30" y="98" width="260" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="113" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">= 300100</text>

  <text x="30" y="138" font-size="9" fill="#666">07月: 64900</text>
  <rect x="30" y="144" width="260" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="159" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">= 64900</text>

  <!-- Threshold comparison -->
  <text x="30" y="186" font-size="9" fill="#888">阈值比较 →</text>
  <rect x="30" y="192" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="210" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">300100 &gt; 21000 ✓</text>
  <rect x="170" y="192" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="210" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">64900 &gt; 21000 ✓</text>

  <!-- Timeline -->
  <text x="30" y="240" font-size="9" fill="#888">时间线 →</text>
  <line x1="40" y1="262" x2="280" y2="262" stroke="#ccc" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- 06 marker -->
  <rect x="80" y="252" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="267" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2021-06</text>
  <text x="110" y="288" text-anchor="middle" font-size="8" fill="#b85450">✓ 超阈值</text>
  <!-- 07 marker -->
  <rect x="180" y="252" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="267" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2021-07</text>
  <text x="210" y="288" text-anchor="middle" font-size="8" fill="#b85450">✓ 超阈值</text>
  <!-- Consecutive arrow -->
  <path d="M 142 263 L 176 263" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="159" y="256" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">连续</text>

  <!-- Result -->
  <rect x="60" y="310" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="328" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">连续两月超阈值</text>
  <text x="160" y="342" text-anchor="middle" font-size="10" fill="#4a7a3a">→ 账户 3 可疑 ✓</text>

  <!-- ===== Account 4 section ===== -->
  <rect x="320" y="36" width="280" height="480" fill="#fff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.95"/>
  <text x="460" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">账户 4（max_income = 10400）</text>

  <!-- Monthly breakdown -->
  <text x="330" y="76" font-size="9" fill="#888">Creditor 交易 →</text>
  <text x="330" y="92" font-size="9" fill="#666">05月: 49300</text>
  <rect x="330" y="98" width="260" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="460" y="113" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">= 49300</text>

  <text x="330" y="138" font-size="9" fill="#666">06月: 10400</text>
  <rect x="330" y="144" width="260" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="460" y="159" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">= 10400</text>

  <text x="330" y="178" font-size="9" fill="#666">07月: 56300</text>
  <rect x="330" y="184" width="260" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="460" y="199" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">= 56300</text>

  <!-- Threshold comparison -->
  <text x="330" y="226" font-size="9" fill="#888">阈值比较 →</text>
  <rect x="330" y="232" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="250" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">49300&gt;10400 ✓</text>
  <rect x="420" y="232" width="80" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="460" y="250" text-anchor="middle" font-size="8" fill="#999">10400=10400 ✗</text>
  <rect x="510" y="232" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="550" y="250" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">56300&gt;10400 ✓</text>

  <!-- Timeline -->
  <text x="330" y="278" font-size="9" fill="#888">时间线 →</text>
  <line x1="340" y1="300" x2="580" y2="300" stroke="#ccc" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- 05 marker -->
  <rect x="350" y="290" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="375" y="305" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">2021-05</text>
  <text x="375" y="324" text-anchor="middle" font-size="8" fill="#b85450">✓</text>
  <!-- 06 marker -->
  <rect x="430" y="290" width="50" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="455" y="305" text-anchor="middle" font-size="8" fill="#999" font-weight="bold">2021-06</text>
  <text x="455" y="324" text-anchor="middle" font-size="8" fill="#999">✗ 未超</text>
  <!-- 07 marker -->
  <rect x="510" y="290" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="535" y="305" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">2021-07</text>
  <text x="535" y="324" text-anchor="middle" font-size="8" fill="#b85450">✓</text>
  <!-- Broken link 05-06 -->
  <path d="M 402 301 L 426 301" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <!-- Broken link 06-07 -->
  <path d="M 482 301 L 506 301" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <text x="455" y="284" text-anchor="middle" font-size="7" fill="#b85450">断链!</text>

  <!-- Result -->
  <rect x="360" y="346" width="200" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="364" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">06 月未超阈值</text>
  <text x="460" y="378" text-anchor="middle" font-size="10" fill="#b85450">→ 账户 4 不可疑 ✗</text>

  <!-- Bottom comparison note -->
  <rect x="60" y="400" width="500" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="418" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">关键：超过 = 严格 &gt;（等于不算）；连续 = 相邻月份均超阈值</text>
  <text x="310" y="434" text-anchor="middle" font-size="9" fill="#d6a040">账户 4 在 05 月和 07 月超阈值，但 06 月未超 → 非连续 → 不可疑</text>

  <!-- Output -->
  <rect x="200" y="460" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="478" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">输出：account_id = 3</text>
  <text x="310" y="492" text-anchor="middle" font-size="9" fill="#888">仅账户 3 满足连续两月超阈值</text>
</svg>
