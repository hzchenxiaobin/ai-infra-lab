<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">两趟双指针：位置的「类别」不变，各类各自反转</text>

  <!-- 下标标注 -->
  <text x="107.5" y="54" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="142.5" y="54" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="177.5" y="54" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="212.5" y="54" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="247.5" y="54" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="282.5" y="54" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>
  <text x="317.5" y="54" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">6</text>
  <text x="352.5" y="54" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">7</text>
  <text x="387.5" y="54" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">8</text>
  <text x="422.5" y="54" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">9</text>

  <!-- 行1：原始 s = )ebc#da@f( -->
  <text x="78" y="82" text-anchor="end" font-size="13" font-weight="bold" fill="#555" filter="url(#rough2)">s =</text>
  <rect x="90" y="60" width="35" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="125" y="60" width="35" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="160" y="60" width="35" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="195" y="60" width="35" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="230" y="60" width="35" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="265" y="60" width="35" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="300" y="60" width="35" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="335" y="60" width="35" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="370" y="60" width="35" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="405" y="60" width="35" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="107.5" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">)</text>
  <text x="142.5" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">e</text>
  <text x="177.5" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="212.5" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <text x="247.5" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">#</text>
  <text x="282.5" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>
  <text x="317.5" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="352.5" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">@</text>
  <text x="387.5" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">f</text>
  <text x="422.5" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(</text>

  <!-- 弧1：第一趟字母交换 e<->f, b<->a, c<->d -->
  <path d="M 142.5 96 C 142.5 118, 387.5 150, 387.5 167" stroke="#b85450" stroke-width="1.5" fill="none" marker-start="url(#arrR)" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 177.5 96 C 177.5 115, 317.5 147, 317.5 167" stroke="#b85450" stroke-width="1.5" fill="none" marker-start="url(#arrR)" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 212.5 96 C 212.5 113, 282.5 145, 282.5 167" stroke="#b85450" stroke-width="1.5" fill="none" marker-start="url(#arrR)" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="283" y="115" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">e↔f</text>
  <text x="262" y="127" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">b↔a</text>
  <text x="258" y="140" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">c↔d</text>

  <text x="458" y="120" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">第一趟</text>
  <text x="458" y="138" font-size="11" fill="#555" filter="url(#rough2)">双指针只交换字母</text>
  <text x="458" y="154" font-size="11" fill="#888" filter="url(#rough2)">特殊字符原地不动</text>

  <!-- 行2：)fad#cb@e( -->
  <text x="78" y="192" text-anchor="end" font-size="13" font-weight="bold" fill="#555" filter="url(#rough2)">①</text>
  <rect x="90" y="170" width="35" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="125" y="170" width="35" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="160" y="170" width="35" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="195" y="170" width="35" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="230" y="170" width="35" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="265" y="170" width="35" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="300" y="170" width="35" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="335" y="170" width="35" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="370" y="170" width="35" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="405" y="170" width="35" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="107.5" y="193" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">)</text>
  <text x="142.5" y="193" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">f</text>
  <text x="177.5" y="193" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">a</text>
  <text x="212.5" y="193" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">d</text>
  <text x="247.5" y="193" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">#</text>
  <text x="282.5" y="193" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">c</text>
  <text x="317.5" y="193" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">b</text>
  <text x="352.5" y="193" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">@</text>
  <text x="387.5" y="193" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">e</text>
  <text x="422.5" y="193" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(</text>

  <!-- 弧2：第二趟特殊字符交换 )<->(, #<->@ -->
  <path d="M 107.5 206 C 107.5 228, 422.5 260, 422.5 277" stroke="#b85450" stroke-width="1.5" fill="none" marker-start="url(#arrR)" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 247.5 206 C 247.5 225, 352.5 257, 352.5 277" stroke="#b85450" stroke-width="1.5" fill="none" marker-start="url(#arrR)" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="270" y="228" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">)↔(</text>
  <text x="304" y="243" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">#↔@</text>

  <text x="458" y="230" font-size="12.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">第二趟</text>
  <text x="458" y="248" font-size="11" fill="#555" filter="url(#rough2)">只交换特殊字符</text>
  <text x="458" y="264" font-size="11" fill="#888" filter="url(#rough2)">字母原地不动</text>

  <!-- 行3：(fad@cb#e) -->
  <text x="78" y="302" text-anchor="end" font-size="13" font-weight="bold" fill="#555" filter="url(#rough2)">②</text>
  <rect x="90" y="280" width="35" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="125" y="280" width="35" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="160" y="280" width="35" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="195" y="280" width="35" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="230" y="280" width="35" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="265" y="280" width="35" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="300" y="280" width="35" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="335" y="280" width="35" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="370" y="280" width="35" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="405" y="280" width="35" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="107.5" y="303" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">(</text>
  <text x="142.5" y="303" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">f</text>
  <text x="177.5" y="303" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="212.5" y="303" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>
  <text x="247.5" y="303" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">@</text>
  <text x="282.5" y="303" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <text x="317.5" y="303" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="352.5" y="303" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">#</text>
  <text x="387.5" y="303" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">e</text>
  <text x="422.5" y="303" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">)</text>

  <!-- 底部注释 -->
  <rect x="50" y="336" width="560" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="362" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">💡 关键不变量：每个位置的「类别」（字母格 / 特殊格）全程不变，</text>
  <text x="330" y="384" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">两趟操作互不干扰、先后顺序可交换——一趟 = 只反转某一类的「子序列」</text>
  <text x="330" y="404" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">蓝格 = 字母位　橙格 = 特殊字符位　红色字符 = 本趟刚被换入的</text>
</svg>
