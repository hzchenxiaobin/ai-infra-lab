<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    核心观察：最少插入 = len(target) − LCS = len(target) − LIS
  </text>

  <!-- ===== Row 1: target with indices ===== -->
  <text x="40" y="64" font-size="11" fill="#888" filter="url(#rough2)">target</text>
  <rect x="90" y="50" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="136" y="50" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="182" y="50" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <rect x="228" y="50" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="274" y="50" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="296" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="320" y="50" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <!-- index labels below target -->
  <text x="112" y="96" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">idx0</text>
  <text x="158" y="96" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">idx1</text>
  <text x="204" y="96" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">idx2</text>
  <text x="250" y="96" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">idx3</text>
  <text x="296" y="96" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">idx4</text>
  <text x="342" y="96" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">idx5</text>

  <!-- ===== Row 2: map value->idx ===== -->
  <text x="40" y="126" font-size="11" fill="#888" filter="url(#rough2)">建映射</text>
  <rect x="90" y="112" width="300" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="240" y="131" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">
    {6:0, 4:1, 8:2, 1:3, 3:4, 2:5}   target 元素互不相同 → 双射
  </text>

  <!-- arrow down -->
  <path d="M240,144 L240,156" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 3: arr filter + map ===== -->
  <text x="40" y="178" font-size="11" fill="#888" filter="url(#rough2)">arr</text>
  <!-- arr = [4,7,6,2,3,8,6,1] -->
  <rect x="90" y="164" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="183" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="132" y="164" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="183" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">7</text>
  <rect x="174" y="164" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="183" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="216" y="164" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="183" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="258" y="164" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="183" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="300" y="164" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="183" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <rect x="342" y="164" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="362" y="183" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="384" y="164" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="404" y="183" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <!-- arrow down: map -->
  <path d="M257,196 L257,210" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="208" font-size="9" fill="#888" filter="url(#rough2)">过滤不在 target 的元素 + 映射为 idx</text>

  <!-- ===== Row 4: nums (mapped) ===== -->
  <text x="40" y="234" font-size="11" fill="#888" filter="url(#rough2)">nums</text>
  <rect x="90" y="220" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="239" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="174" y="220" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="239" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="216" y="220" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="239" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="258" y="220" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="239" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="300" y="220" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="239" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="342" y="220" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="362" y="239" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="384" y="220" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="404" y="239" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <!-- gap markers for filtered-out 7 -->
  <text x="152" y="237" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">×</text>

  <!-- ===== Row 5: LIS highlight ===== -->
  <text x="40" y="276" font-size="11" fill="#888" filter="url(#rough2)">LIS</text>
  <!-- highlight nums[1]=0, nums[4]=2, nums[7]=3 → 0,2,3 -->
  <rect x="170" y="262" width="48" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="281" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">0</text>
  <rect x="296" y="262" width="48" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="281" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">2</text>
  <rect x="380" y="262" width="48" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="404" y="281" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">3</text>

  <!-- connecting arrows for LIS -->
  <path d="M218,276 L294,276" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="3 2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M344,276 L378,276" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="3 2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="306" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    LIS = [0, 2, 3] → target 下标 → 公共子序列 [6, 8, 1]（保留）
  </text>

  <!-- ===== Bottom: formula ===== -->
  <rect x="60" y="324" width="440" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="13" fill="#5a4a1a" filter="url(#rough2)">
    最少操作 = len(target) − LCS(target, arr)
  </text>
  <text x="280" y="366" text-anchor="middle" font-size="12" fill="#5a4a1a" filter="url(#rough2)">
    target 互异 → LCS = LIS(映射后数组) → O(n log n)
  </text>
  <text x="280" y="382" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    蓝=target/nums 格子；绿=在 target 中；红×=过滤掉；橙=LIS 选中
  </text>
</svg>
