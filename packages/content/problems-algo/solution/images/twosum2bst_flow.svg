<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="520" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两棵 BST 之和：哈希集合法流程（两阶段）</text>

  <!-- 阶段一标题 -->
  <rect x="40" y="44" width="520" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="300" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">阶段一：遍历 root1，构建 values 集合</text>

  <path d="M 300 72 L 300 90" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取节点1 -->
  <rect x="200" y="94" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="116" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">遍历 root1 的下一个节点 v</text>

  <path d="M 300 130 L 300 148" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="220" y="152" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="300" y="172" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">values.add(v)</text>

  <path d="M 300 184 L 300 200" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- root1 还有？ -->
  <polygon points="300,204 380,234 300,264 220,234" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="232" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">root1 还有</text>
  <text x="300" y="246" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">节点？</text>

  <path d="M 220 234 L 170 234 L 170 116 L 196 116" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="150" y="175" text-anchor="middle" font-size="11" fill="#666">是</text>

  <path d="M 380 234 L 430 234 L 430 282 L 300 282" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="225" text-anchor="middle" font-size="11" fill="#666">否</text>

  <!-- 阶段二标题 -->
  <rect x="40" y="292" width="520" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="300" y="310" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">阶段二：遍历 root2，查补数 target−v 是否在 values 中</text>

  <path d="M 300 320 L 300 338" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取节点2 -->
  <rect x="200" y="342" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="364" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">遍历 root2 的下一个节点 v</text>

  <path d="M 300 378 L 300 396" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 -->
  <polygon points="300,400 400,442 300,484 200,442" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="438" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">target − v</text>
  <text x="300" y="454" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">∈ values？</text>

  <!-- 是 -->
  <path d="M 200 442 L 110 442 L 110 470" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="432" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="50" y="474" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="110" y="496" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 true ⭐</text>

  <!-- 否 -->
  <path d="M 400 442 L 470 442" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="435" y="432" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- root2 还有？ -->
  <polygon points="520,418 560,442 520,466 480,442" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="520" y="440" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">root2</text>
  <text x="520" y="453" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">还有?</text>

  <path d="M 480 442 L 430 442 L 430 364 L 404 364" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="448" y="400" text-anchor="middle" font-size="10" fill="#666">是</text>

  <path d="M 560 442 L 580 442 L 580 500 L 170 500" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="550" y="492" text-anchor="middle" font-size="10" fill="#666">否</text>
</svg>
