<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">分数到小数：算法流程</text>

  <!-- Start -->
  <rect x="230" y="40" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="13" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#333">开始</text>
  <path d="M 280 66 L 280 82" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1: numerator == 0? -->
  <path d="M 280 84 L 358 110 L 280 136 L 202 110 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="114" text-anchor="middle" font-size="11" fill="#333">numerator == 0?</text>
  <path d="M 358 110 L 400 110" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="104" font-size="10" fill="#4a7a3a">是</text>
  <rect x="402" y="96" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="462" y="115" text-anchor="middle" font-size="11" fill="#b85450">return "0"</text>
  <path d="M 280 136 L 280 156" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="150" font-size="10" fill="#b85450">否</text>

  <!-- Box1: sign + abs + integer + remainder -->
  <rect x="130" y="158" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="176" text-anchor="middle" font-size="11" fill="#333">定符号；n, d 取绝对值（用 long 防溢出）</text>
  <text x="280" y="193" text-anchor="middle" font-size="11" fill="#333">整数 = n / d；余数 r = n % d</text>
  <path d="M 280 202 L 280 222" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D2: r == 0? -->
  <path d="M 280 224 L 358 250 L 280 276 L 202 250 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="11" fill="#333">r == 0?</text>
  <path d="M 358 250 L 400 250" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="244" font-size="10" fill="#4a7a3a">是</text>
  <rect x="402" y="236" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="467" y="255" text-anchor="middle" font-size="11" fill="#4a7a3a">return sign + 整数</text>
  <path d="M 280 276 L 280 296" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="290" font-size="10" fill="#b85450">否</text>

  <!-- while label -->
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#888" font-style="italic">while r != 0:</text>

  <!-- loop container -->
  <rect x="70" y="320" width="470" height="160" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="5,3" rx="10" filter="url(#rough2)"/>

  <!-- D3: r in pos? -->
  <path d="M 280 334 L 360 362 L 280 390 L 200 362 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="11" fill="#333">r 在 pos 中?</text>
  <path d="M 360 362 L 384 362" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="366" y="356" font-size="10" fill="#4a7a3a">是</text>
  <rect x="386" y="342" width="120" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="446" y="360" text-anchor="middle" font-size="10" fill="#b85450">pos[r] 处插 '('</text>
  <text x="446" y="375" text-anchor="middle" font-size="10" fill="#b85450">末尾 ')'；break</text>
  <path d="M 280 390 L 280 408" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="402" font-size="10" fill="#b85450">否</text>

  <!-- body box -->
  <rect x="160" y="410" width="240" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="428" text-anchor="middle" font-size="11" fill="#333">pos[r] = len(frac)</text>
  <text x="280" y="444" text-anchor="middle" font-size="11" fill="#333">r *= 10；frac += r // d；r %= d</text>

  <!-- back-edge: r != 0 continue -->
  <path d="M 160 431 L 110 431 L 110 362 L 200 362" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="396" font-size="10" fill="#4a7a3a">r != 0 继续循环</text>

  <!-- r == 0 exit -->
  <path d="M 280 452 L 280 486" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="472" font-size="10" fill="#4a7a3a">r == 0 退出</text>

  <!-- break box exit -->
  <path d="M 446 384 L 446 486" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="454" y="436" font-size="10" fill="#b85450">break</text>

  <!-- main return -->
  <rect x="110" y="488" width="340" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="513" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return sign + 整数 + "." + frac</text>
</svg>
