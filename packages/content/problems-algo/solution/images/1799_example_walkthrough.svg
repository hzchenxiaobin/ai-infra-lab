<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.5"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [3, 4, 6, 8]，m = 4</text>
  <text x="280" y="40" text-anchor="middle" font-size="11" fill="#888">节点 = mask（dp 值）；边 = op × gcd(i, j) 配对转移</text>

  <text x="30" y="86" font-size="11" fill="#888">取走 0 个</text>
  <text x="30" y="206" font-size="11" fill="#888">取走 2 个</text>
  <text x="30" y="346" font-size="11" fill="#888">取走 4 个</text>

  <rect x="240" y="64" width="90" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="285" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0000</text>
  <text x="285" y="100" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">dp = 11</text>

  <rect x="60" y="184" width="100" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0011</text>
  <text x="110" y="220" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">dp = 4</text>

  <rect x="235" y="184" width="100" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="285" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0101</text>
  <text x="285" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">dp = 8</text>

  <rect x="410" y="184" width="100" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="460" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1001</text>
  <text x="460" y="220" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">dp = 4</text>

  <path d="M 255 110 L 130 182" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="150" y="140" font-size="10" fill="#446688">配(0,1) 1×gcd(3,4)=1</text>

  <path d="M 285 110 L 285 182" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="295" y="150" font-size="10" fill="#4a7a3a" font-weight="bold">配(0,2) 1×gcd(3,6)=3</text>

  <path d="M 315 110 L 440 182" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="360" y="140" font-size="10" fill="#446688">配(0,3) 1×gcd(3,8)=1</text>

  <rect x="235" y="324" width="100" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="285" y="344" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1111</text>
  <text x="285" y="360" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">dp = 0</text>

  <path d="M 130 230 L 250 322" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="135" y="285" font-size="10" fill="#446688">配(2,3) 2×gcd(6,8)=4</text>

  <path d="M 285 230 L 285 322" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="295" y="280" font-size="10" fill="#4a7a3a" font-weight="bold">配(1,3) 2×gcd(4,8)=8</text>

  <path d="M 440 230 L 320 322" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="370" y="285" font-size="10" fill="#446688">配(1,2) 2×gcd(4,6)=4</text>

  <rect x="40" y="386" width="480" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="406" text-anchor="middle" font-size="11" fill="#555">dp[0000] = max(1+4, 3+8, 1+4) = 11</text>
  <text x="280" y="422" text-anchor="middle" font-size="10" fill="#888">最优方案：第 1 次配 (3,6) 得 3，第 2 次配 (4,8) 得 8，合计 11</text>
</svg>
