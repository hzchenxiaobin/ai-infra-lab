<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8a94a2"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描，见 0 就翻</text>

  <rect x="70" y="30" width="140" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="51" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">ans = 0，i = 0</text>

  <path d="M 140 62 V 74" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>

  <polygon points="140,76 208,106 140,136 72,106" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="110" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">i ≤ n−3 ?</text>

  <path d="M 140 136 V 148" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="150" y="148" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">是</text>

  <polygon points="140,150 208,180 140,210 72,180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="184" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">nums[i] == 0 ?</text>

  <path d="M 140 210 V 222" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="150" y="222" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">是</text>

  <rect x="45" y="224" width="190" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="244" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans++</text>
  <text x="140" y="261" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">翻转 i+1、i+2 两格</text>

  <path d="M 208 180 H 246 V 247 H 239" stroke="#8a94a2" stroke-width="1.5" fill="none" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="252" y="174" font-size="9.5" fill="#555" filter="url(#rough2)">否（跳过）</text>

  <path d="M 140 270 V 286" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>

  <rect x="90" y="288" width="100" height="32" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="308" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">i++</text>

  <path d="M 90 304 H 28 V 106 H 68" stroke="#8a94a2" stroke-width="1.5" fill="none" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="20" y="210" transform="rotate(-90 20 210)" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">循环</text>

  <path d="M 208 106 H 350 V 296" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="240" y="100" font-size="9.5" fill="#555" filter="url(#rough2)">否（扫描完）</text>

  <text x="140" y="344" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">nums[i] 翻后必为 1，之后不再回看，可不写回</text>

  <polygon points="350,300 424,330 350,360 276,330" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="334" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">末两位都是 1 ?</text>

  <path d="M 424 330 H 440" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="428" y="322" font-size="9" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="444" y="314" width="70" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="479" y="334" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">返回 ans</text>

  <path d="M 350 360 V 376" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="358" y="374" font-size="9" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="305" y="380" width="90" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="400" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">返回 −1</text>
</svg>
