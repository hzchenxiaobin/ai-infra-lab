<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：grid = [" /","/ "]  →  2 个区域</text>

  <!-- ===== Left: 2x2 grid with triangles colored by final region ===== -->
  <text x="120" y="58" text-anchor="middle" font-size="12" fill="#888">最终区域着色</text>

  <!-- Cell (0,0) = ' ' space : all blue (region A) -->
  <rect x="44" y="72" width="76" height="76" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <polygon points="44,72 120,72 82,110" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>
  <polygon points="120,72 120,148 82,110" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>
  <polygon points="120,148 44,148 82,110" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>
  <polygon points="44,148 44,72 82,110" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>

  <!-- Cell (0,1) = '/' : top+left = blue(A), right+bottom = green(B) -->
  <rect x="120" y="72" width="76" height="76" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="120" y1="148" x2="196" y2="72" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <polygon points="120,72 196,72 158,110" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>
  <polygon points="196,72 196,148 158,110" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <polygon points="196,148 120,148 158,110" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <polygon points="120,148 120,72 158,110" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>

  <!-- Cell (1,0) = '/' : top+left = blue(A), right+bottom = green(B) -->
  <rect x="44" y="148" width="76" height="76" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="44" y1="224" x2="120" y2="148" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <polygon points="44,148 120,148 82,186" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>
  <polygon points="120,148 120,224 82,186" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <polygon points="120,224 44,224 82,186" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <polygon points="44,224 44,148 82,186" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>

  <!-- Cell (1,1) = ' ' space : all green (region B) -->
  <rect x="120" y="148" width="76" height="76" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <polygon points="120,148 196,148 158,186" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <polygon points="196,148 196,224 158,186" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <polygon points="196,224 120,224 158,186" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <polygon points="120,224 120,148 158,186" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>

  <!-- region labels -->
  <rect x="40" y="240" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="80" y="254" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">区域 A</text>
  <rect x="130" y="240" width="80" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="170" y="254" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">区域 B</text>

  <!-- ===== Right: step table ===== -->
  <text x="380" y="58" text-anchor="middle" font-size="12" fill="#888">合并步骤</text>

  <!-- table header -->
  <rect x="260" y="72" width="270" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="278" y="87" font-size="9.5" fill="#888">步骤</text>
  <text x="330" y="87" font-size="9.5" fill="#888">操作</text>
  <text x="490" y="87" font-size="9.5" fill="#888">count</text>

  <!-- rows -->
  <rect x="260" y="94" width="270" height="18" fill="#fafafa" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="278" y="106" font-size="9.5" fill="#333">初始</text>
  <text x="330" y="106" font-size="9.5" fill="#666">4n² = 16 个三角</text>
  <text x="490" y="106" font-size="9.5" fill="#333" font-weight="bold">16</text>

  <rect x="260" y="112" width="270" height="18" fill="#f6f8fc" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="278" y="124" font-size="9.5" fill="#333">(0,0) ' '</text>
  <text x="330" y="124" font-size="9.5" fill="#666">合 4 块</text>
  <text x="490" y="124" font-size="9.5" fill="#333" font-weight="bold">13</text>

  <rect x="260" y="130" width="270" height="18" fill="#fafafa" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="278" y="142" font-size="9.5" fill="#333">(0,1) '/'</text>
  <text x="330" y="142" font-size="9.5" fill="#666">0∪3 ; 1∪2</text>
  <text x="490" y="142" font-size="9.5" fill="#333" font-weight="bold">11</text>

  <rect x="260" y="148" width="270" height="18" fill="#f6f8fc" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="278" y="160" font-size="9.5" fill="#333">(1,0) '/'</text>
  <text x="330" y="160" font-size="9.5" fill="#666">0∪3 ; 1∪2</text>
  <text x="490" y="160" font-size="9.5" fill="#333" font-weight="bold">9</text>

  <rect x="260" y="166" width="270" height="18" fill="#fafafa" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="278" y="178" font-size="9.5" fill="#333">(1,1) ' '</text>
  <text x="330" y="178" font-size="9.5" fill="#666">合 4 块</text>
  <text x="490" y="178" font-size="9.5" fill="#333" font-weight="bold">6</text>

  <rect x="260" y="184" width="270" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="278" y="196" font-size="9.5" fill="#b85450" font-weight="bold">相邻</text>
  <text x="330" y="196" font-size="9.5" fill="#666">右↔左 ; 下↔上 ×4</text>
  <text x="490" y="196" font-size="9.5" fill="#b85450" font-weight="bold">2</text>

  <!-- summary box -->
  <rect x="40" y="285" width="490" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="285" y="305" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最终 count = 2 → 区域 A（蓝）与区域 B（绿）</text>
  <text x="285" y="321" text-anchor="middle" font-size="10.5" fill="#555">两条斜杠不交叉，把左上↔右下切成两块独立区域</text>

  <rect x="40" y="338" width="490" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="285" y="357" text-anchor="middle" font-size="11" fill="#444">每个格子切 4 块三角是关键：斜杠只隔开「对角」三角，共边自然连通</text>
</svg>
