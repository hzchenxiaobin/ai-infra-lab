<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrc" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">核心转化：排序保计数 +「至多」相减</text>

  <!-- Sort row -->
  <text x="22" y="60" font-size="11" fill="#888">原始</text>
  <g font-size="11" fill="#333">
    <rect x="56" y="44" width="24" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="68" y="59" text-anchor="middle">0</text>
    <rect x="82" y="44" width="24" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="94" y="59" text-anchor="middle">1</text>
    <rect x="108" y="44" width="24" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="120" y="59" text-anchor="middle">7</text>
    <rect x="134" y="44" width="24" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="146" y="59" text-anchor="middle">4</text>
    <rect x="160" y="44" width="24" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="172" y="59" text-anchor="middle">4</text>
    <rect x="186" y="44" width="24" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="198" y="59" text-anchor="middle">5</text>
  </g>
  <path d="M218 55 Q244 49 270 55" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <text x="244" y="44" text-anchor="middle" font-size="10" fill="#446688" font-style="italic">排序</text>
  <g font-size="11" fill="#333">
    <rect x="276" y="44" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="288" y="59" text-anchor="middle">0</text>
    <rect x="302" y="44" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="314" y="59" text-anchor="middle">1</text>
    <rect x="328" y="44" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="340" y="59" text-anchor="middle">4</text>
    <rect x="354" y="44" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="366" y="59" text-anchor="middle">4</text>
    <rect x="380" y="44" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="392" y="59" text-anchor="middle">5</text>
    <rect x="406" y="44" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="418" y="59" text-anchor="middle">7</text>
  </g>
  <rect x="442" y="42" width="108" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="496" y="59" text-anchor="middle" font-size="10" fill="#8a6a20">数对无序·和对称</text>
  <text x="496" y="74" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">排序不改计数</text>

  <!-- Number line of pair-sums -->
  <text x="22" y="110" font-size="11" fill="#888">数对和分布</text>
  <!-- bands -->
  <rect x="50" y="128" width="88" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <rect x="138" y="128" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="278" y="128" width="232" height="30" fill="#eeeeee" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <!-- line -->
  <line x1="50" y1="160" x2="510" y2="160" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- ticks -->
  <g stroke="#888" stroke-width="1.3" filter="url(#rough2)">
    <line x1="120" y1="156" x2="120" y2="166"/>
    <line x1="155" y1="156" x2="155" y2="166"/>
    <line x1="260" y1="156" x2="260" y2="166"/>
    <line x1="295" y1="156" x2="295" y2="166"/>
  </g>
  <g font-size="10" fill="#555" text-anchor="middle">
    <text x="120" y="180">2</text>
    <text x="155" y="180">3</text>
    <text x="260" y="180">6</text>
    <text x="295" y="180">7</text>
  </g>
  <text x="94" y="146" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">≤ lower−1</text>
  <text x="94" y="200" text-anchor="middle" font-size="10" fill="#b85450">1 个</text>
  <text x="208" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[lower, upper] 公平数对</text>
  <text x="208" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">6 个</text>
  <text x="394" y="146" text-anchor="middle" font-size="10" fill="#999">&gt; upper 不计</text>

  <!-- Formula -->
  <rect x="40" y="226" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="140" y="251" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">countPairs(≤6) = 7</text>
  <text x="262" y="251" text-anchor="middle" font-size="20" fill="#b85450" font-weight="bold">−</text>
  <rect x="282" y="226" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="382" y="251" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">countPairs(≤2) = 1</text>
  <text x="504" y="251" text-anchor="middle" font-size="20" fill="#446688" font-weight="bold">=</text>
  <rect x="168" y="290" width="224" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="317" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">公平数对 = 7 − 1 = 6 ✓</text>
  <text x="280" y="350" text-anchor="middle" font-size="10.5" fill="#888">直接求「恰好在 [lower,upper]」难，求「≤ 上界」易 → 两次相减</text>
</svg>
