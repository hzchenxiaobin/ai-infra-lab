<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">迭代配对算法流程</text>

  <!-- Start node -->
  <ellipse cx="270" cy="60" rx="90" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="12" fill="#333">开始: team = [1, 2, ..., n]</text>

  <!-- arrow down -->
  <path d="M 270 80 L 270 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: n > 1? -->
  <polygon points="270,104 380,155 270,206 160,155" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="150" text-anchor="middle" font-size="12" fill="#333">n &gt; 1 ?</text>
  <text x="270" y="168" text-anchor="middle" font-size="11" fill="#666">(还有队伍没配对)</text>

  <!-- No branch -> end -->
  <path d="M 380 155 L 470 155" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="425" y="148" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="490" cy="155" rx="44" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="159" text-anchor="middle" font-size="11" fill="#333">返回 team[0]</text>

  <!-- Yes branch down -->
  <path d="M 270 206 L 270 228" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="222" font-size="11" fill="#82b366">是</text>

  <!-- Process box: pair -->
  <rect x="90" y="232" width="360" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="252" text-anchor="middle" font-size="11" fill="#333">for i in 0 .. n/2 − 1:</text>
  <text x="270" y="270" text-anchor="middle" font-size="11" fill="#333">team[i] = "(" + team[i] + "," + team[n−1−i] + ")"</text>

  <!-- arrow down -->
  <path d="M 270 280 L 270 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Process box: halve n -->
  <rect x="190" y="304" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="326" text-anchor="middle" font-size="12" fill="#333">n = n / 2</text>

  <!-- loop back arrow -->
  <path d="M 190 321 L 60 321 L 60 155 L 160 155" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="240" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 60 240)">回到判断</text>

  <!-- Key insight note -->
  <rect x="80" y="352" width="380" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="8" filter="url(#rough2)" opacity="0.7"/>
  <text x="270" y="368" text-anchor="middle" font-size="11" fill="#b85450">关键：原地覆盖 team[i]，第二半 team[n/2..n−1] 自动废弃</text>
  <text x="270" y="383" text-anchor="middle" font-size="11" fill="#b85450">共 log₂n 轮，每轮 O(n) 配对，总 O(n log n)</text>
</svg>
