<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：错位区间 [i, j] 决定一切</text>

  <!-- 左列例1：dog -->
  <g filter="url(#rough2)">
    <text x="20" y="54" font-size="12.5" fill="#333" font-weight="bold">例1 "dog" → 答案 1</text>

    <text x="36" y="82" font-size="12" fill="#666">s</text>
    <rect x="48" y="62" width="34" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="84" y="62" width="34" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="120" y="62" width="34" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="65" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>
    <text x="101" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">o</text>
    <text x="137" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">g</text>

    <text x="36" y="124" font-size="12" fill="#666">t</text>
    <rect x="48" y="104" width="34" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="84" y="104" width="34" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="120" y="104" width="34" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="65" y="124" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>
    <text x="101" y="124" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">g</text>
    <text x="137" y="124" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">o</text>

    <rect x="81" y="56" width="76" height="84" rx="6" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="163" y="86" font-size="10.5" fill="#8a6d1a">错位区间</text>
    <text x="163" y="100" font-size="10.5" fill="#8a6d1a">[1, 2]</text>
    <text x="20" y="156" font-size="10.5" fill="#2f5d24" font-weight="bold">区间 [1,2] 是真子串 → 排序 "og" 一步到位 ✓</text>
  </g>

  <!-- 左列例2：card -->
  <g filter="url(#rough2)">
    <text x="20" y="186" font-size="12.5" fill="#333" font-weight="bold">例2 "card" → 答案 2</text>

    <text x="36" y="214" font-size="12" fill="#666">s</text>
    <rect x="48" y="194" width="34" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="84" y="194" width="34" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="120" y="194" width="34" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="156" y="194" width="34" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="65" y="214" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
    <text x="101" y="214" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
    <text x="137" y="214" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">r</text>
    <text x="173" y="214" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>

    <text x="36" y="256" font-size="12" fill="#666">t</text>
    <rect x="48" y="236" width="34" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="84" y="236" width="34" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="120" y="236" width="34" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="156" y="236" width="34" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="65" y="256" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
    <text x="101" y="256" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
    <text x="137" y="256" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>
    <text x="173" y="256" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">r</text>

    <rect x="45" y="188" width="148" height="84" rx="6" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="199" y="216" font-size="10.5" fill="#8a3030">错位区间</text>
    <text x="199" y="230" font-size="10.5" fill="#8a3030">= 整串 ✗</text>
    <text x="101" y="284" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold">mn</text>
    <text x="137" y="284" text-anchor="middle" font-size="9.5" fill="#8a6d1a" font-weight="bold">mx</text>
    <text x="20" y="304" font-size="10.5" fill="#8a6d1a" font-weight="bold">一步被禁；但 mn='a' 在内部 → 先排 "car" 再排 "rd"</text>
  </g>

  <!-- 左列例3：gf -->
  <g filter="url(#rough2)">
    <rect x="20" y="320" width="258" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="149" y="342" text-anchor="middle" font-size="11.5" fill="#8a3030" font-weight="bold">例3 "gf" → 答案 -1</text>
    <text x="149" y="360" text-anchor="middle" font-size="10.5" fill="#8a3030">n=2：真子串只有单字符，操作全是空操作</text>
    <text x="149" y="375" text-anchor="middle" font-size="10.5" fill="#8a3030">字符串永久冻结，永远排不好</text>
  </g>

  <!-- 右列：五档答案卡片 -->
  <g filter="url(#rough2)">
    <rect x="300" y="52" width="240" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="318" y="76" text-anchor="middle" font-size="21" fill="#2f5d24" font-weight="bold">0</text>
    <text x="404" y="74" font-size="12" fill="#2f5d24" font-weight="bold">① s 已非降序</text>
    <text x="404" y="92" font-size="10" fill="#4a7a3a">什么都不用做</text>

    <rect x="300" y="116" width="240" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="318" y="140" text-anchor="middle" font-size="21" fill="#33506b" font-weight="bold">1</text>
    <text x="404" y="138" font-size="12" fill="#33506b" font-weight="bold">② s[0]=mn 或 s[n-1]=mx</text>
    <text x="404" y="156" font-size="10" fill="#446688">错位区间 [i,j] 是真子串，排序它即可</text>

    <rect x="300" y="180" width="240" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="318" y="204" text-anchor="middle" font-size="21" fill="#8a3030" font-weight="bold">-1</text>
    <text x="404" y="202" font-size="12" fill="#8a3030" font-weight="bold">③ n=2 且未排序</text>
    <text x="404" y="220" font-size="10" fill="#b85450">唯一不可解情形，字符串被冻结</text>

    <rect x="300" y="244" width="240" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="318" y="268" text-anchor="middle" font-size="21" fill="#8a6d1a" font-weight="bold">2</text>
    <text x="404" y="266" font-size="12" fill="#8a6d1a" font-weight="bold">④ mn 或 mx 出现在内部</text>
    <text x="404" y="284" font-size="10" fill="#d6a040">先排 s[0..n-2]（或 s[1..n-1]），再插回末字符</text>

    <rect x="300" y="308" width="240" height="56" rx="8" fill="#ffffff" stroke="#888888" stroke-width="1.6"/>
    <text x="318" y="332" text-anchor="middle" font-size="21" fill="#555" font-weight="bold">3</text>
    <text x="404" y="330" font-size="12" fill="#555" font-weight="bold">⑤ 其余情形</text>
    <text x="404" y="348" font-size="10" fill="#777">mx 只在开头、mn 只在结尾：三步构造兜底</text>
  </g>

  <text x="420" y="386" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（mn = min(s)，mx = max(s)，t = sorted(s)）</text>
</svg>
