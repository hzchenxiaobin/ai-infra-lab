<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：按数位和分桶 + 前缀和加速转移</text>

  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">例 1：digitSum = [25, 1] —— 每个位置的候选只有自己桶里的数</text>

  <text x="260" y="62" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">① 预处理：[0,5000] 按数位和分桶，桶内天然升序</text>

  <text x="88" y="92" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">sum=1</text>
  <rect x="96" y="74" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="142" y="74" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="188" y="74" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="234" y="74" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="117" y="92" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="163" y="92" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <text x="209" y="92" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">100</text>
  <text x="255" y="92" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1000</text>

  <text x="88" y="128" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">sum=25</text>
  <rect x="96" y="110" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="136" y="110" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="176" y="110" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="216" y="110" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="256" y="110" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="296" y="110" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="114" y="128" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">799</text>
  <text x="154" y="128" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">889</text>
  <text x="194" y="128" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">898</text>
  <text x="234" y="128" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">979</text>
  <text x="274" y="128" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">988</text>
  <text x="314" y="128" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">997</text>
  <text x="338" y="128" font-size="12" fill="#999" filter="url(#rough2)">…</text>

  <text x="88" y="164" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">sum=49</text>
  <rect x="96" y="146" width="140" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="166" y="164" text-anchor="middle" font-size="10" fill="#a0433f" filter="url(#rough2)">空桶 → 答案 0</text>

  <rect x="364" y="68" width="140" height="100" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="434" y="88" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">数位和范围</text>
  <text x="434" y="106" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">0 ~ 31（max 4999）</text>
  <text x="434" y="124" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">最大桶 365 个（s=16）</text>
  <text x="434" y="142" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">digitSum[i] &gt; 31</text>
  <text x="434" y="160" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">→ 空桶，返回 0</text>

  <path d="M 20 182 L 500 182" fill="none" stroke="#ccc" stroke-width="1.2" stroke-dasharray="5,5" filter="url(#rough2)"/>

  <text x="260" y="202" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">② 转移：dp_new(v) = Σ dp_prev(u)，u ≤ v —— 前缀和 + 双指针</text>

  <rect x="56" y="212" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="104" y="212" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="152" y="212" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="200" y="212" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="248" y="212" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="296" y="212" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="231" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">799</text>
  <text x="126" y="231" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">889</text>
  <text x="174" y="231" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">898</text>
  <text x="222" y="231" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">979</text>
  <text x="270" y="231" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">988</text>
  <text x="318" y="231" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">997</text>

  <rect x="344" y="212" width="80" height="30" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="384" y="231" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1699 …</text>

  <text x="78" y="256" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="126" y="256" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="174" y="256" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="222" y="256" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="270" y="256" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="318" y="256" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="384" y="256" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">均 &gt; 1000，不参与</text>

  <path d="M 56 262 L 56 270 L 340 270 L 340 262" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="286" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">pref[5] = 6</text>

  <rect x="56" y="296" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="104" y="296" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="152" y="296" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="200" y="296" width="44" height="30" rx="4" fill="#fff8e1" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="78" y="315" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="126" y="315" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <text x="174" y="315" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">100</text>
  <text x="222" y="315" text-anchor="middle" font-size="11" fill="#a0433f" font-weight="bold" filter="url(#rough2)">1000</text>

  <path d="M 222 292 L 228 274" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="78" y="342" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">k=0 → 0</text>
  <text x="126" y="342" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">k=0 → 0</text>
  <text x="174" y="342" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">k=0 → 0</text>
  <text x="222" y="342" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">dp = 6 ✓</text>

  <text x="290" y="356" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">有效数组 [799,1000] … [997,1000] 共 6 个 —— 例 1 ✓</text>
</svg>
