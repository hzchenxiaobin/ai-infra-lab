<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：回文 = 前半 + 镜像，找下个回文 = 找前半的下个排列</text>

  <!-- ===== Left: Even case "1221" ===== -->
  <text x="132" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">偶数长度 num = "1221"</text>

  <rect x="60" y="68" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="77" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="94" y="68" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="111" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="128" y="68" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="91" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="162" y="68" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="179" y="91" text-anchor="middle" font-size="14" fill="#333">1</text>

  <text x="94" y="118" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">前半（可排列）</text>
  <text x="162" y="118" text-anchor="middle" font-size="10" fill="#d6a040">镜像</text>

  <path d="M 111 126 L 111 142" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="155" y="139" font-size="9.5" fill="#888">next_permutation</text>

  <rect x="60" y="150" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="77" y="173" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="94" y="150" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="111" y="173" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="94" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">下个排列 "21"</text>

  <path d="M 111 208 L 111 224" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="150" y="221" font-size="9.5" fill="#888">+ 镜像</text>

  <rect x="60" y="232" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="77" y="255" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="94" y="232" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="111" y="255" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="128" y="232" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="255" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="162" y="232" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="179" y="255" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="128" y="282" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结果 "2112"</text>

  <!-- ===== Right: Odd case "12321" ===== -->
  <text x="398" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">奇数长度 num = "12321"</text>

  <rect x="322" y="68" width="32" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="338" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="354" y="68" width="32" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="386" y="68" width="32" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="402" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="418" y="68" width="32" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="434" y="91" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="450" y="68" width="32" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="466" y="91" text-anchor="middle" font-size="14" fill="#333">1</text>

  <text x="354" y="118" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">前半（可排列）</text>
  <text x="402" y="118" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">中间（固定）</text>
  <text x="450" y="118" text-anchor="middle" font-size="10" fill="#d6a040">镜像</text>

  <path d="M 370 126 L 370 142" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="415" y="139" font-size="9.5" fill="#888">next_permutation</text>

  <rect x="322" y="150" width="32" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="338" y="173" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="354" y="150" width="32" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="173" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="354" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">下个排列 "21"</text>

  <path d="M 370 208 L 370 224" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="418" y="221" font-size="9.5" fill="#888">+ 中间 + 镜像</text>

  <rect x="322" y="232" width="32" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="255" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="354" y="232" width="32" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="255" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="386" y="232" width="32" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="402" y="255" text-anchor="middle" font-size="14" fill="#333">3</text>
  <rect x="418" y="232" width="32" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="434" y="255" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="450" y="232" width="32" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="466" y="255" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="394" y="282" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结果 "21312"</text>

  <!-- Key insight box -->
  <rect x="30" y="300" width="480" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="320" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">回文由前半唯一决定 → 下个回文 = 前半下个排列 + 镜像</text>
  <text x="270" y="338" text-anchor="middle" font-size="10.5" fill="#555">奇数长度：中间位固定（奇频数字），只排列前 n/2 位</text>
</svg>
