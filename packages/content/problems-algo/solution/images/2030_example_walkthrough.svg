<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：s="leetcode", k=4, letter='e', rep=2 → "ecde"</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">suf[i] 为 s[i..] 中 'e' 的个数；cnt 为栈内 'e' 数</text>

  <!-- Header row -->
  <rect x="40" y="56" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="60" y="75" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <rect x="84" y="56" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="106" y="75" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">c</text>
  <rect x="132" y="56" width="208" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="236" y="75" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">动作（护栏判定）</text>
  <rect x="344" y="56" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="419" y="75" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">栈</text>
  <rect x="498" y="56" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="515" y="75" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cnt</text>

  <!-- helper to render a row: y is top -->
  <!-- row i=0 -->
  <g>
    <rect x="40" y="88" width="40" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="60" y="108" text-anchor="middle" font-size="11" fill="#555">0</text>
    <rect x="84" y="88" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="106" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">l</text>
    <rect x="132" y="88" width="208" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="236" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a">空栈，直接压 l</text>
    <rect x="344" y="88" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="419" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[l]</text>
    <rect x="498" y="88" width="34" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="515" y="108" text-anchor="middle" font-size="11" fill="#555">0</text>
  </g>

  <!-- row i=1 -->
  <g>
    <rect x="40" y="120" width="40" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="60" y="140" text-anchor="middle" font-size="11" fill="#555">1</text>
    <rect x="84" y="120" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="106" y="140" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e</text>
    <rect x="132" y="120" width="208" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="236" y="140" text-anchor="middle" font-size="9.5" fill="#b85450">l&gt;e，弹 l(非letter)；压 e</text>
    <rect x="344" y="120" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="419" y="140" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[e]</text>
    <rect x="498" y="120" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="515" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  </g>

  <!-- row i=2 -->
  <g>
    <rect x="40" y="152" width="40" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="60" y="172" text-anchor="middle" font-size="11" fill="#555">2</text>
    <rect x="84" y="152" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="106" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e</text>
    <rect x="132" y="152" width="208" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="236" y="172" text-anchor="middle" font-size="10" fill="#4a7a3a">e≯e，直接压 e</text>
    <rect x="344" y="152" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="419" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[e, e]</text>
    <rect x="498" y="152" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="515" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  </g>

  <!-- row i=3 -->
  <g>
    <rect x="40" y="184" width="40" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="60" y="204" text-anchor="middle" font-size="11" fill="#555">3</text>
    <rect x="84" y="184" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="106" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">t</text>
    <rect x="132" y="184" width="208" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="236" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a">e&lt;t，直接压 t</text>
    <rect x="344" y="184" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="419" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[e, e, t]</text>
    <rect x="498" y="184" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="515" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  </g>

  <!-- row i=4 (key) -->
  <g>
    <rect x="40" y="216" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="60" y="236" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">4</text>
    <rect x="84" y="216" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="106" y="236" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
    <rect x="132" y="216" width="208" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="236" y="234" text-anchor="middle" font-size="9" fill="#b85450">弹t; e&gt;c 护栏 1+1≥2✓弹e;</text>
    <text x="236" y="244" text-anchor="middle" font-size="9" fill="#b85450">再 e&gt;c 护栏 0+1≥2✗ 止; 压c</text>
    <rect x="344" y="216" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="419" y="236" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[e, c]</text>
    <rect x="498" y="216" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="515" y="236" text-anchor="middle" font-size="11" fill="#555">1</text>
  </g>

  <!-- row i=5 -->
  <g>
    <rect x="40" y="248" width="40" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="60" y="268" text-anchor="middle" font-size="11" fill="#555">5</text>
    <rect x="84" y="248" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="106" y="268" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">o</text>
    <rect x="132" y="248" width="208" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="236" y="268" text-anchor="middle" font-size="10" fill="#4a7a3a">c&lt;o，直接压 o</text>
    <rect x="344" y="248" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="419" y="268" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[e, c, o]</text>
    <rect x="498" y="248" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="515" y="268" text-anchor="middle" font-size="11" fill="#555">1</text>
  </g>

  <!-- row i=6 -->
  <g>
    <rect x="40" y="280" width="40" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="60" y="300" text-anchor="middle" font-size="11" fill="#555">6</text>
    <rect x="84" y="280" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="106" y="300" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d</text>
    <rect x="132" y="280" width="208" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="236" y="300" text-anchor="middle" font-size="9.5" fill="#b85450">o&gt;d 弹o(非letter); c≯d; 压d</text>
    <rect x="344" y="280" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="419" y="300" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[e, c, d]</text>
    <rect x="498" y="280" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="515" y="300" text-anchor="middle" font-size="11" fill="#555">1</text>
  </g>

  <!-- row i=7 -->
  <g>
    <rect x="40" y="312" width="40" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="60" y="332" text-anchor="middle" font-size="11" fill="#555">7</text>
    <rect x="84" y="312" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="106" y="332" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e</text>
    <rect x="132" y="312" width="208" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="236" y="332" text-anchor="middle" font-size="10" fill="#4a7a3a">d&lt;e，直接压 e（凑够 k=4）</text>
    <rect x="344" y="312" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="419" y="332" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[e, c, d, e]</text>
    <rect x="498" y="312" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="515" y="332" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  </g>

  <!-- result row -->
  <rect x="40" y="356" width="492" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="286" y="376" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">结果："ecde" —— 长度 4 ✓，'e' 出现 2 次 ≥ rep ✓，字典序最小 ✓</text>
  <text x="286" y="392" text-anchor="middle" font-size="10" fill="#555">关键 i=4：字母护栏允许弹掉第 2 个 e（后缀还有 1 个 e 可用），</text>
  <text x="286" y="406" text-anchor="middle" font-size="10" fill="#555">但禁止弹掉最后一个 e（后缀 0 个，凑不齐 rep=2），保住配额</text>

  <!-- footer note -->
  <rect x="40" y="424" width="492" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="286" y="442" text-anchor="middle" font-size="10.5" fill="#a87020" font-weight="bold">对比暴力 C(n,k) 枚举所有子序列</text>
  <text x="286" y="457" text-anchor="middle" font-size="10" fill="#555">单调栈把 O(C(n,k)) 降到 O(n)，双护栏保证 letter 配额不被破坏</text>
</svg>
