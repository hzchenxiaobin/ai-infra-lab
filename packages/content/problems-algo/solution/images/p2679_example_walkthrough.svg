<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [[7,2,1],[6,4,2],[6,5,3],[3,2,1]]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">排序后 [[1,2,7],[2,4,6],[3,5,6],[1,2,3]]，每轮删除 = 取一列，逐轮最大 = 逐列最大</text>

  <!-- Header row -->
  <rect x="30" y="56" width="70" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="65" y="76" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">轮次</text>

  <rect x="100" y="56" width="190" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="195" y="76" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">删除元素（各行取最大）</text>

  <rect x="290" y="56" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="330" y="76" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">本轮最大</text>

  <rect x="370" y="56" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="450" y="76" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">对应排序后第 j 列</text>

  <!-- Row: round 1 -->
  <rect x="30" y="90" width="70" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="65" y="111" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">第 1 轮</text>
  <rect x="100" y="90" width="190" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="195" y="111" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">7, 6, 6, 3</text>
  <rect x="290" y="90" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="330" y="111" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="370" y="90" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="450" y="111" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">j=2（末列）</text>

  <!-- Row: round 2 -->
  <rect x="30" y="124" width="70" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="65" y="145" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">第 2 轮</text>
  <rect x="100" y="124" width="190" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="195" y="145" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2, 4, 5, 2</text>
  <rect x="290" y="124" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="330" y="145" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="370" y="124" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="450" y="145" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">j=1（中列）</text>

  <!-- Row: round 3 -->
  <rect x="30" y="158" width="70" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="65" y="179" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">第 3 轮</text>
  <rect x="100" y="158" width="190" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="195" y="179" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1, 2, 3, 1</text>
  <rect x="290" y="158" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="330" y="179" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="370" y="158" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="450" y="179" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">j=0（首列）</text>

  <!-- Score box -->
  <rect x="30" y="206" width="500" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">score = 7 + 5 + 3 = 15 ⭐</text>

  <!-- Insight box -->
  <rect x="30" y="258" width="500" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="40" y="280" font-size="11" fill="#888" filter="url(#rough2)">每行排序后，第 k 轮删除的恰好是「各行的第 k 大」→ 它们对齐成同一列 → 本轮最大 = 该列最大。</text>

  <!-- Note -->
  <rect x="30" y="300" width="500" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="40" y="319" font-size="11" fill="#d6a040" filter="url(#rough2)">等价变换：逐轮 max(deleted) 的累加 = 排序后每列 max 的累加，省去真实删除/模拟。</text>

  <!-- arrow from col-max column to score -->
  <path d="M 330 192 L 330 206" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
