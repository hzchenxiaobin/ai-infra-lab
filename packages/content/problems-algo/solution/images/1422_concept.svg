<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：分割点右移一格，仅一个字符换边，计数器 O(1) 增量更新</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">score = leftZeros + rightOnes，无需对每个分割点从头数</text>

  <!-- ===== Snapshot A: split after index 1 ===== -->
  <text x="40" y="76" font-size="11" fill="#666" font-weight="bold">分割点 i = 1</text>
  <text x="40" y="92" font-size="10" fill="#888">左 = "01"</text>

  <!-- char boxes: 0 1 | 1 1 0 1   w=46 h=42 step=54 start x=110 -->
  <!-- left side blue -->
  <rect x="110" y="60" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="133" y="88" text-anchor="middle" font-size="15" fill="#333">0</text>
  <rect x="164" y="60" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="187" y="88" text-anchor="middle" font-size="15" fill="#333">1</text>
  <!-- divider -->
  <path d="M 214 54 L 214 108" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <!-- right side green -->
  <rect x="218" y="60" width="46" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="241" y="88" text-anchor="middle" font-size="15" fill="#333">1</text>
  <rect x="272" y="60" width="46" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="295" y="88" text-anchor="middle" font-size="15" fill="#333">1</text>
  <rect x="326" y="60" width="46" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="349" y="88" text-anchor="middle" font-size="15" fill="#333">0</text>
  <rect x="380" y="60" width="46" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="403" y="88" text-anchor="middle" font-size="15" fill="#333">1</text>

  <!-- counters A -->
  <rect x="110" y="114" width="316" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="268" y="132" text-anchor="middle" font-size="11" fill="#555">leftZeros = 1   rightOnes = 3   ⟹   score = 4</text>

  <!-- arrow down: slide -->
  <path d="M 268 142 L 268 166" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="280" y="160" font-size="10.5" fill="#4a7a3a" font-weight="bold">分割点右移，s[2]='1' 换边</text>

  <!-- ===== Snapshot B: split after index 2 ===== -->
  <text x="40" y="194" font-size="11" fill="#666" font-weight="bold">分割点 i = 2</text>
  <text x="40" y="210" font-size="10" fill="#888">左 = "011"</text>

  <!-- left side blue, index 2 highlighted orange (the one that just moved) -->
  <rect x="110" y="178" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="133" y="206" text-anchor="middle" font-size="15" fill="#333">0</text>
  <rect x="164" y="178" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="187" y="206" text-anchor="middle" font-size="15" fill="#333">1</text>
  <!-- the moved char -->
  <rect x="218" y="178" width="46" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="241" y="206" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <text x="241" y="172" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">★ 换边</text>
  <!-- divider -->
  <path d="M 268 172 L 268 226" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <!-- right side green -->
  <rect x="272" y="178" width="46" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="295" y="206" text-anchor="middle" font-size="15" fill="#333">1</text>
  <rect x="326" y="178" width="46" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="349" y="206" text-anchor="middle" font-size="15" fill="#333">0</text>
  <rect x="380" y="178" width="46" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="403" y="206" text-anchor="middle" font-size="15" fill="#333">1</text>

  <!-- counters B -->
  <rect x="110" y="232" width="316" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="268" y="250" text-anchor="middle" font-size="11" fill="#555">leftZeros = 1(不变)   rightOnes = 2 (<tspan fill="#b85450" font-weight="bold">−1</tspan>)   ⟹   score = 3</text>

  <!-- update rule box -->
  <rect x="60" y="276" width="440" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">换边字符 = '0' → leftZeros += 1 ；换边字符 = '1' → rightOnes -= 1</text>
  <text x="280" y="311" text-anchor="middle" font-size="10.5" fill="#555">每个分割点只做一次 O(1) 判断，整体从暴力 O(n²) 降到 O(n)</text>

  <!-- footer -->
  <rect x="60" y="330" width="440" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="10.5" fill="#4a7a3a">两个计数器随分割点同步滑动，复用上一状态，避免重复清点</text>
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#888">这就是「running counter / 增量更新」范式</text>
</svg>
