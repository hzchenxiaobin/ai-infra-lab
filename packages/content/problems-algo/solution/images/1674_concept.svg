<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    一对 (a, b) 的操作次数 c(S) — 山谷形阶梯
  </text>

  <!-- Pair boxes -->
  <rect x="210" y="42" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="62" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="256" y="62" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">+</text>
  <rect x="266" y="42" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="284" y="62" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <text x="316" y="61" text-anchor="start" font-size="11" fill="#888" filter="url(#rough2)">a ≤ b</text>

  <!-- y-axis -->
  <path d="M70,95 L70,278" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <!-- x-axis -->
  <path d="M70,278 L478,278" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- y labels -->
  <text x="62" y="282" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="62" y="228" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="62" y="174" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="38" y="188" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)" transform="rotate(-90 38 188)">操作次数</text>

  <!-- grid lines -->
  <path d="M72,224 L472,224" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <path d="M72,170 L472,170" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>

  <!-- Step function: cost 2 / 1 / 0 / 1 / 2 -->
  <!-- cost 2: x=90→145, y=170 -->
  <path d="M90,170 L145,170" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <!-- drop to 1 -->
  <path d="M145,170 L145,224" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <!-- cost 1: x=145→210, y=224 -->
  <path d="M145,224 L210,224" stroke="#d6a040" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <!-- drop to 0 -->
  <path d="M210,224 L210,278" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <!-- cost 0: x=210→250, y=278 -->
  <path d="M210,278 L250,278" stroke="#4a7a3a" stroke-width="3.5" fill="none" filter="url(#rough2)"/>
  <!-- rise to 1 -->
  <path d="M250,278 L250,224" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <!-- cost 1: x=250→400, y=224 -->
  <path d="M250,224 L400,224" stroke="#d6a040" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <!-- rise to 2 -->
  <path d="M400,224 L400,170" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <!-- cost 2: x=400→460, y=170 -->
  <path d="M400,170 L460,170" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>

  <!-- Breakpoint dots -->
  <circle cx="145" cy="224" r="3" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="210" cy="278" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="250" cy="224" r="3" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="400" cy="170" r="3" fill="#b85450" filter="url(#rough2)"/>

  <!-- x-axis labels -->
  <text x="90" y="294" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="145" y="294" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">a+1</text>
  <text x="210" y="294" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">a+b</text>
  <text x="250" y="294" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">a+b+1</text>
  <text x="400" y="294" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">limit+b+1</text>
  <text x="460" y="294" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2·limit</text>
  <text x="275" y="312" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">目标和 S</text>

  <!-- Region cost labels above steps -->
  <text x="117" y="163" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="177" y="217" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="230" y="272" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="325" y="217" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="430" y="163" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>

  <!-- Bottom insight -->
  <rect x="50" y="322" width="420" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="343" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    仅 4 个断点 → 差分数组 O(1) 标记，前缀和取最小
  </text>
</svg>
