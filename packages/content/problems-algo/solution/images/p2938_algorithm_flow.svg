<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">一趟扫描数逆序对：O(n) / O(1)</text>

  <!-- start -->
  <rect x="192" y="42" width="136" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">ones = 0，ans = 0</text>
  <path d="M 260 76 L 260 94" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: loop condition -->
  <path d="M 260 98 L 372 158 L 260 218 L 148 158 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="152" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">i &lt; n ?</text>
  <text x="260" y="172" text-anchor="middle" font-size="10" fill="#9a7a2a" filter="url(#rough2)">（还有字符没扫）</text>

  <!-- yes branch: process s[i] -->
  <text x="380" y="146" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 376 158 L 392 158" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="396" y="126" width="114" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="453" y="148" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">s[i]='1' → ones += 1</text>
  <text x="453" y="166" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">s[i]='0' → ans += ones</text>
  <text x="453" y="184" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">（0 左边有几个 1 就加几）</text>
  <path d="M 453 126 L 453 80 L 272 80" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="360" y="74" font-size="10" fill="#4a7a3a" filter="url(#rough2)">i++，回到判断</text>

  <!-- no branch: return -->
  <text x="270" y="236" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="286" y="236" font-size="10" fill="#888" filter="url(#rough2)">扫完了</text>
  <path d="M 260 218 L 260 246" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="185" y="250" width="150" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="273" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">return ans</text>
  <text x="260" y="302" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">s 全部扫完，ans 即最少步数</text>

  <!-- bottom notes -->
  <rect x="60" y="316" width="400" height="66" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">ans 上界 ≈ n²/4 ≈ 2.5×10⁹（n = 10⁵），超出 int32</text>
  <text x="260" y="354" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">C++ 用 long long 累加并返回；Python 天然大数</text>
  <text x="260" y="372" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">反向扫描同理：从右往左，遇 '1' 累加右边 '0' 的个数</text>
</svg>
