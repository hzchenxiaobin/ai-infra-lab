<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="520" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：双重循环枚举数对，强数对则更新 XOR 最大值</text>

  <!-- 开始 -->
  <rect x="100" y="30" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="140" y="47" text-anchor="middle" font-size="12" fill="#33507a" filter="url(#rough2)">开始</text>
  <path d="M 140 56 L 140 68" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ans = 0 -->
  <rect x="40" y="72" width="200" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="91" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#rough2)">ans = 0（自身对 XOR 恒为 0）</text>
  <path d="M 140 100 L 140 112" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i 循环 -->
  <rect x="40" y="116" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="136" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#rough2)">i = 0 … n−1（外层枚举）</text>
  <path d="M 140 146 L 140 158" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- j 循环 -->
  <rect x="40" y="162" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="182" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#rough2)">j = i … n−1（含 j = i 自身）</text>
  <path d="M 140 192 L 140 204" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- lo / hi -->
  <rect x="40" y="208" width="200" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="224" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#rough2)">lo = min(nums[i], nums[j])</text>
  <text x="140" y="240" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#rough2)">hi = max(nums[i], nums[j])</text>
  <path d="M 140 246 L 140 258" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 A：hi <= 2*lo ? -->
  <polygon points="140,262 216,292 140,322 64,292" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="297" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">hi ≤ 2×lo ?</text>

  <!-- 是 → 更新 ans -->
  <path d="M 216 292 L 278 292" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="244" y="284" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="282" y="270" width="182" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="373" y="288" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">ans = max(ans, lo ^ hi)</text>
  <text x="373" y="305" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">（记录更大的 XOR）</text>

  <!-- 绿框汇入主链 -->
  <path d="M 373 314 L 373 330 L 152 330" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 否 → 直落 -->
  <path d="M 140 322 L 140 330" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="318" font-size="10.5" fill="#888" filter="url(#rough2)">否</text>

  <!-- 菱形 B：j < n ? -->
  <polygon points="140,334 206,364 140,394 74,364" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="369" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">j &lt; n ?</text>

  <!-- 是：j++ 回环到 lo/hi 框 -->
  <path d="M 206 364 L 470 364 L 470 227 L 248 227" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="335" y="356" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">是：j++</text>

  <!-- 否 → 落到菱形 C -->
  <path d="M 140 394 L 140 406" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="404" font-size="10.5" fill="#888" filter="url(#rough2)">否</text>

  <!-- 菱形 C：i < n ? -->
  <polygon points="140,410 206,440 140,470 74,440" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="445" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>

  <!-- 是：i++, j=i 外回环（右侧） -->
  <path d="M 206 440 L 500 440 L 500 177 L 246 177" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="355" y="432" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">是：i++，j = i</text>

  <!-- 否 → 返回 -->
  <path d="M 140 470 L 140 482" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="478" font-size="10.5" fill="#888" filter="url(#rough2)">否</text>
  <rect x="100" y="486" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="140" y="503" text-anchor="middle" font-size="12" fill="#33507a" filter="url(#rough2)">返回 ans</text>

  <!-- 右上要点框 -->
  <rect x="300" y="72" width="190" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="395" y="92" text-anchor="middle" font-size="11.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">要点</text>
  <text x="395" y="110" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">j 从 i 起，自身对不漏</text>
  <text x="395" y="126" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">判定免 abs：hi ≤ 2×lo</text>
  <text x="395" y="142" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">XOR 与顺序无关，</text>
  <text x="395" y="158" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">i ≤ j 枚举一半即可</text>
</svg>
