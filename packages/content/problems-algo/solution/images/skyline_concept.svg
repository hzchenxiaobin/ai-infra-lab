<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa"/>
  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">建筑、天际线轮廓与活跃高度集合</text>
  <path d="M 250 44 Q 380 52 510 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 地面 x 轴 -->
  <line x1="50" y1="340" x2="660" y2="340" stroke="#3a3a3a" stroke-width="1.8" filter="url(#sk)"/>
  <!-- y 轴 -->
  <line x1="50" y1="100" x2="50" y2="340" stroke="#3a3a3a" stroke-width="1.8" filter="url(#sk)"/>

  <!-- 建筑 B1 [2,9,10] -->
  <g filter="url(#sk)">
    <rect x="104" y="190" width="154" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="181" y="332" text-anchor="middle" font-size="11" fill="#446688">B1 h=10</text>

  <!-- 建筑 B2 [3,7,15] -->
  <g filter="url(#sk)">
    <rect x="126" y="115" width="88" height="225" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="170" y="108" text-anchor="middle" font-size="11" fill="#4a7a3a">B2 h=15</text>

  <!-- 建筑 B3 [5,12,12] -->
  <g filter="url(#sk)">
    <rect x="170" y="160" width="154" height="180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="247" y="332" text-anchor="middle" font-size="11" fill="#d6a040">B3 h=12</text>

  <!-- 建筑 B4 [15,20,10] -->
  <g filter="url(#sk)">
    <rect x="390" y="190" width="110" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="445" y="332" text-anchor="middle" font-size="11" fill="#446688">B4 h=10</text>

  <!-- 建筑 B5 [19,24,8] -->
  <g filter="url(#sk)">
    <rect x="478" y="220" width="110" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="533" y="332" text-anchor="middle" font-size="11" fill="#b85450">B5 h=8</text>

  <!-- x 轴刻度 -->
  <g font-size="10" fill="#666">
    <text x="104" y="356" text-anchor="middle">2</text>
    <text x="126" y="356" text-anchor="middle">3</text>
    <text x="170" y="356" text-anchor="middle">5</text>
    <text x="214" y="356" text-anchor="middle">7</text>
    <text x="324" y="356" text-anchor="middle">12</text>
    <text x="390" y="356" text-anchor="middle">15</text>
    <text x="500" y="356" text-anchor="middle">20</text>
    <text x="588" y="356" text-anchor="middle">24</text>
  </g>

  <!-- 天际线轮廓（红色粗虚折线） -->
  <path d="M104,190 L126,190 L126,115 L214,115 L214,160 L324,160 L324,340 L390,340 L390,190 L500,190 L500,220 L588,220 L588,340"
        stroke="#b85450" stroke-width="2.6" fill="none" stroke-dasharray="7 4" filter="url(#sk)"/>
  <!-- 轮廓关键点 -->
  <g fill="#b85450" filter="url(#sk)">
    <circle cx="104" cy="190" r="3.5"/>
    <circle cx="126" cy="115" r="3.5"/>
    <circle cx="214" cy="160" r="3.5"/>
    <circle cx="324" cy="340" r="3.5"/>
    <circle cx="390" cy="190" r="3.5"/>
    <circle cx="500" cy="220" r="3.5"/>
    <circle cx="588" cy="340" r="3.5"/>
  </g>
  <text x="600" y="160" font-size="12" font-weight="bold" fill="#b85450">天际线轮廓</text>

  <!-- 扫描线 x=6 -->
  <line x1="192" y1="100" x2="192" y2="340" stroke="#446688" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="192" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">扫描线 x=6</text>

  <!-- 活跃集合标注 -->
  <g filter="url(#sk)">
    <rect x="600" y="180" width="150" height="92" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="675" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040">x=6 活跃集合</text>
  <text x="612" y="220" font-size="11" fill="#333">B1: 10  ✓</text>
  <text x="612" y="238" font-size="11" fill="#333">B2: 15  ✓</text>
  <text x="612" y="256" font-size="11" fill="#333">B3: 12  ✓</text>
  <text x="612" y="270" font-size="11" font-weight="bold" fill="#b85450">max = 15</text>

  <!-- 哨兵说明 -->
  <text x="50" y="392" font-size="11" fill="#888">堆中常驻哨兵 0：所有建筑离开后堆顶回到地面高度，避免空堆特判</text>
</svg>
