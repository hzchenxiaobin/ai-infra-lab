<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="560" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：中序遍历 + 双指针归并</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">先取两段有序，再线性合并，最后收尾追加</text>

  <!-- step 1: inorder root1 -->
  <rect x="150" y="58" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="80" text-anchor="middle" font-size="12" fill="#333">① 中序遍历 root1 → 有序数组 a</text>

  <path d="M 260 94 L 260 110" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- step 2: inorder root2 -->
  <rect x="150" y="112" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="134" text-anchor="middle" font-size="12" fill="#333">② 中序遍历 root2 → 有序数组 b</text>

  <path d="M 260 148 L 260 164" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- step 3: init -->
  <rect x="150" y="166" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="188" text-anchor="middle" font-size="12" fill="#333">③ i = j = 0, ans = []</text>

  <path d="M 260 202 L 260 220" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- decision: both not exhausted? -->
  <polygon points="260,222 380,272 260,322 140,272" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="266" text-anchor="middle" font-size="11" fill="#333">i&lt;len(a)</text>
  <text x="260" y="282" text-anchor="middle" font-size="11" fill="#333">且 j&lt;len(b) ?</text>

  <!-- yes branch -->
  <text x="395" y="270" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 380 272 L 420 272 L 420 318" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- inner decision: a[i] <= b[j]? -->
  <polygon points="420,320 490,355 420,390 350,355" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="352" text-anchor="middle" font-size="11" fill="#333">a[i] ≤ b[j] ?</text>

  <!-- left sub: take a[i] -->
  <text x="300" y="350" font-size="10" fill="#446688" font-weight="bold">是</text>
  <path d="M 350 355 L 250 355" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="70" y="338" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="160" y="360" text-anchor="middle" font-size="11" fill="#333">ans.append(a[i]); i++</text>

  <!-- right sub: take b[j] -->
  <text x="495" y="350" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <path d="M 490 355 L 490 400" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="400" y="402" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="490" y="424" text-anchor="middle" font-size="11" fill="#333">ans.append(b[j]); j++</text>

  <!-- loop back arrow from both subs to top decision -->
  <path d="M 160 338 L 160 240 L 140 272" stroke="#666" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 490 436 L 490 240" stroke="#666" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 490 240 L 380 272" stroke="#666" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="200" y="234" font-size="9" fill="#888">循环回顶部</text>

  <!-- no branch: append remainder -->
  <text x="80" y="300" font-size="11" fill="#b85450" font-weight="bold">否（至少一段耗尽）</text>
  <path d="M 140 272 L 70 272 L 70 470" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="70" y="472" width="380" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="494" text-anchor="middle" font-size="11" fill="#333">④ 收尾：ans.extend(a[i:]) + ans.extend(b[j:])</text>

  <path d="M 260 508 L 260 524" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="170" y="526" width="180" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="260" y="545" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⑤ return ans</text>
</svg>
