<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：第 k 行 = 第 k 列（沿主对角线对称）</text>

  <!-- 4x4 grid: words = ["abcd","bnrt","crmy","dtye"] -->
  <!-- cell size 44, origin (130, 70) -->
  <!-- Diagonal cells highlighted in orange, off-diagonal pairs share a color -->

  <!-- Row labels (left) -->
  <text x="118" y="96" text-anchor="end" font-size="11" fill="#888" font-weight="bold">行 0</text>
  <text x="118" y="140" text-anchor="end" font-size="11" fill="#888" font-weight="bold">行 1</text>
  <text x="118" y="184" text-anchor="end" font-size="11" fill="#888" font-weight="bold">行 2</text>
  <text x="118" y="228" text-anchor="end" font-size="11" fill="#888" font-weight="bold">行 3</text>

  <!-- Column labels (top) -->
  <text x="152" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">列 0</text>
  <text x="196" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">列 1</text>
  <text x="240" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">列 2</text>
  <text x="284" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">列 3</text>

  <!-- Grid cells. (i,j) color: diagonal orange; symmetric pairs share blue/green tints -->
  <!-- (0,0) diag -->
  <rect x="130" y="74" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="152" y="102" text-anchor="middle" font-size="16" fill="#7a5415" font-weight="bold">a</text>
  <!-- (0,1) and (1,0) blue pair -->
  <rect x="174" y="74" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="102" text-anchor="middle" font-size="16" fill="#2b6e9e" font-weight="bold">b</text>
  <rect x="130" y="118" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="146" text-anchor="middle" font-size="16" fill="#2b6e9e" font-weight="bold">b</text>
  <!-- (0,2) and (2,0) green pair -->
  <rect x="218" y="74" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="102" text-anchor="middle" font-size="16" fill="#2e6e2e" font-weight="bold">c</text>
  <rect x="130" y="162" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="190" text-anchor="middle" font-size="16" fill="#2e6e2e" font-weight="bold">c</text>
  <!-- (0,3) and (3,0) red pair -->
  <rect x="262" y="74" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="284" y="102" text-anchor="middle" font-size="16" fill="#a33a36" font-weight="bold">d</text>
  <rect x="130" y="206" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="234" text-anchor="middle" font-size="16" fill="#a33a36" font-weight="bold">d</text>

  <!-- (1,1) diag -->
  <rect x="174" y="118" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="146" text-anchor="middle" font-size="16" fill="#7a5415" font-weight="bold">n</text>
  <!-- (1,2) and (2,1) blue pair -->
  <rect x="218" y="118" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="146" text-anchor="middle" font-size="16" fill="#2b6e9e" font-weight="bold">r</text>
  <rect x="174" y="162" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="190" text-anchor="middle" font-size="16" fill="#2b6e9e" font-weight="bold">r</text>
  <!-- (1,3) and (3,1) green pair -->
  <rect x="262" y="118" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="284" y="146" text-anchor="middle" font-size="16" fill="#2e6e2e" font-weight="bold">t</text>
  <rect x="174" y="206" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="234" text-anchor="middle" font-size="16" fill="#2e6e2e" font-weight="bold">t</text>

  <!-- (2,2) diag -->
  <rect x="218" y="162" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="190" text-anchor="middle" font-size="16" fill="#7a5415" font-weight="bold">m</text>
  <!-- (2,3) and (3,2) red pair -->
  <rect x="262" y="162" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="284" y="190" text-anchor="middle" font-size="16" fill="#a33a36" font-weight="bold">y</text>
  <rect x="218" y="206" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="234" text-anchor="middle" font-size="16" fill="#a33a36" font-weight="bold">y</text>

  <!-- (3,3) diag -->
  <rect x="262" y="206" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="284" y="234" text-anchor="middle" font-size="16" fill="#7a5415" font-weight="bold">e</text>

  <!-- Diagonal line -->
  <path d="M 130 74 L 306 250" stroke="#d6a040" stroke-width="2.5" fill="none" stroke-dasharray="6,4" filter="url(#rough2)"/>

  <!-- Row 0 arrow (horizontal, reading words[0]) -->
  <path d="M 130 264 L 306 264" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="218" y="280" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">第 0 行读作 "abcd"</text>

  <!-- Column 0 arrow (vertical, reading down) -->
  <path d="M 108 74 L 108 250" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="96" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" transform="rotate(-90 96 166)">第 0 列读作 "abcd"</text>

  <!-- Legend / takeaway box -->
  <rect x="340" y="74" width="200" height="200" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="440" y="98" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">判定等价转化</text>
  <text x="352" y="122" font-size="11" fill="#555">每行 = 同序号列</text>
  <text x="352" y="140" font-size="11" fill="#555">⇕ 等价于</text>
  <text x="352" y="162" font-size="11" fill="#2b6e9e" font-weight="bold">words[i][j] == words[j][i]</text>
  <text x="352" y="180" font-size="10" fill="#888">对所有合法 (i,j) 成立</text>

  <text x="352" y="206" font-size="11" fill="#555" font-weight="bold">配色含义：</text>
  <rect x="352" y="214" width="16" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="376" y="225" font-size="10" fill="#555">对角元（自镜像）</text>
  <rect x="352" y="234" width="16" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="376" y="245" font-size="10" fill="#555">同色 = 一对镜像位</text>
  <rect x="352" y="254" width="16" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="376" y="265" font-size="10" fill="#555">须两两相等</text>

  <!-- Bottom note -->
  <rect x="40" y="300" width="480" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">行长度可不等 → 镜像位可能一侧越界</text>
  <text x="56" y="346" font-size="11" fill="#555">• 若 words[i][j] 存在但 words[j][i] 不存在（j≥n 或 i≥len(words[j])）→ 不对称 → false</text>
  <text x="56" y="366" font-size="11" fill="#555">• 反向不对称会在遍历镜像 (j,i) 时被同样规则捕获，一遍扫描即可</text>
  <text x="56" y="386" font-size="11" fill="#b85450" font-weight="bold">→ 只需遍历每个 words[i][j]，核对边界 + 字符相等</text>
</svg>
