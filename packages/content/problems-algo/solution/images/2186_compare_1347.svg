<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrDown" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0 0 L5 9 L10 0 z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">1347 vs 2186：操作语义决定公式</text>

  <!-- Divider line -->
  <line x1="278" y1="50" x2="278" y2="360" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== LEFT: 1347 ===== -->
  <text x="140" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1347. 制造字母异位词的最小步骤数</text>
  <text x="140" y="74" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">s、t 等长 | 操作：替换 t 中一个字符</text>

  <!-- t before: [a][b][a] -->
  <text x="140" y="100" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t =</text>
  <g filter="url(#rough2)">
    <rect x="50" y="106" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="65" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
    <rect x="82" y="106" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="97" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
    <rect x="114" y="106" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="129" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
    <rect x="146" y="106" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="161" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
    <rect x="178" y="106" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="193" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  </g>

  <!-- Replace arrow -->
  <path d="M65 136 L65 156" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="140" y="150" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">替换 a → b</text>

  <!-- t after: [b][b][a] with first cell highlighted -->
  <g filter="url(#rough2)">
    <rect x="50" y="162" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="65" y="180" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">b</text>
    <rect x="82" y="162" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="97" y="180" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
    <rect x="114" y="162" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="129" y="180" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
    <rect x="146" y="162" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="161" y="180" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
    <rect x="178" y="162" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="193" y="180" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  </g>

  <!-- Effect: two changes -->
  <g filter="url(#rough2)">
    <rect x="40" y="202" width="200" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <text x="140" y="220" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">效果：cntT[a]−1 且 cntT[b]+1</text>
    <text x="140" y="238" text-anchor="middle" font-size="11" fill="#555">1 步 = 消 1 正差 + 1 负差</text>
  </g>

  <!-- Formula -->
  <g filter="url(#rough2)">
    <rect x="40" y="262" width="200" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="140" y="282" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = Σ正差</text>
    <text x="140" y="300" text-anchor="middle" font-size="11" fill="#446688">= ½ Σ|diff|</text>
  </g>

  <!-- ===== RIGHT: 2186 ===== -->
  <text x="410" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2186. 制造字母异位词的最小步骤数 II</text>
  <text x="410" y="74" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">s、t 不等长 | 操作：追加字符到 s 或 t</text>

  <!-- s before: [a][b] -->
  <text x="410" y="100" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">s =</text>
  <g filter="url(#rough2)">
    <rect x="350" y="106" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="365" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
    <rect x="382" y="106" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="397" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  </g>

  <!-- Append arrow -->
  <path d="M397 136 L397 156" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="410" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">追加 c</text>

  <!-- s after: [a][b][c] with last cell highlighted -->
  <g filter="url(#rough2)">
    <rect x="350" y="162" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="365" y="180" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
    <rect x="382" y="162" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="397" y="180" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
    <rect x="414" y="162" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="429" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">c</text>
  </g>

  <!-- Effect: one change -->
  <g filter="url(#rough2)">
    <rect x="310" y="202" width="200" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="410" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">效果：cntS[c]+1（仅此一项）</text>
    <text x="410" y="238" text-anchor="middle" font-size="11" fill="#555">1 步 = 消 1 个 |差|</text>
  </g>

  <!-- Formula -->
  <g filter="url(#rough2)">
    <rect x="310" y="262" width="200" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="410" y="282" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = Σ|diff|</text>
    <text x="410" y="300" text-anchor="middle" font-size="11" fill="#4a7a3a">= 2 × 1347 的答案</text>
  </g>

  <!-- Bottom summary -->
  <g filter="url(#rough2)">
    <rect x="40" y="328" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="280" y="346" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">关键差异：替换（双向）一步消两差，追加（单向）一步消一差</text>
    <text x="280" y="362" text-anchor="middle" font-size="10.5" fill="#888">等长 → 正负差相等 → 取一半；不等长 → 正负差不等 → 取全部</text>
  </g>
</svg>
