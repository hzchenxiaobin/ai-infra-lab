<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="500" fill="#fafafa"/>

  <text x="20" y="24" font-size="13" fill="#333" filter="url(#rough2)">算法流程：枚举值 X —— 置 0 → 查根 → 恢复</text>

  <!-- main flow -->
  <rect x="85" y="38" width="190" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="60" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">建线段树（四元组，见右上）</text>

  <line x1="180" y1="72" x2="180" y2="84" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="85" y="86" width="190" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="107" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans ← 根.sub（不操作的答案）</text>

  <line x1="180" y1="118" x2="180" y2="128" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="180,130 255,159 180,188 105,159" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="163" text-anchor="middle" font-size="11.5" fill="#7a5c1e" filter="url(#rough2)">ans &lt; 0？</text>
  <text x="93" y="151" text-anchor="end" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>
  <line x1="105" y1="159" x2="88" y2="159" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="2" y="136" width="84" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="44" y="153" text-anchor="middle" font-size="10" fill="#8c3a34" filter="url(#rough2)">全负 ⇒</text>
  <text x="44" y="167" text-anchor="middle" font-size="10" fill="#8c3a34" filter="url(#rough2)">删除只会更差</text>
  <text x="44" y="181" text-anchor="middle" font-size="10" fill="#8c3a34" filter="url(#rough2)">直接返回 ans</text>

  <text x="188" y="203" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <line x1="180" y1="188" x2="180" y2="202" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="85" y="204" width="190" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="225" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">哈希表：值 → 出现下标列表</text>

  <line x1="180" y1="236" x2="180" y2="246" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="180,248 252,274 180,300 108,274" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="278" text-anchor="middle" font-size="11" fill="#7a5c1e" filter="url(#rough2)">X 出现次数 = n？</text>
  <text x="103" y="266" text-anchor="end" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>
  <line x1="108" y1="274" x2="102" y2="274" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="6" y="256" width="94" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="53" y="272" text-anchor="middle" font-size="10.5" fill="#7a5c1e" filter="url(#rough2)">跳过 X</text>
  <text x="53" y="287" text-anchor="middle" font-size="9.5" fill="#7a5c1e" filter="url(#rough2)">（会删空数组）</text>
  <path d="M 53,256 L 53,220 L 83,220" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="188" y="313" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <line x1="180" y1="300" x2="180" y2="314" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="85" y="316" width="190" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="337" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">把 X 的所有位置置 0（单点修改）</text>

  <line x1="180" y1="348" x2="180" y2="360" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="85" y="362" width="190" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="383" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans ← max(ans, 根.sub)</text>

  <line x1="180" y1="394" x2="180" y2="406" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="85" y="408" width="190" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="429" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">恢复 X 的所有位置（单点修改）</text>

  <path d="M 275,424 L 300,424 L 300,274 L 254,274" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="306" y="352" font-size="10.5" fill="#666" filter="url(#rough2)">取下一个值 X</text>

  <line x1="180" y1="440" x2="180" y2="450" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="454" width="440" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="476" text-anchor="middle" font-size="11.5" fill="#8c3a34" filter="url(#rough2)">返回 ans　·　总修改 2n 次 × O(log n) ⇒ 时间 O(n log n)，空间 O(n)</text>

  <!-- panel A: node fields -->
  <rect x="320" y="38" width="190" height="112" rx="8" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="328" y="58" font-size="11" fill="#446688" filter="url(#rough2)">节点四元组（非空语义）</text>
  <text x="328" y="80" font-size="10.5" fill="#333" filter="url(#rough2)">sum —— 区间和</text>
  <text x="328" y="98" font-size="10.5" fill="#333" filter="url(#rough2)">pre —— 最大非空前缀和</text>
  <text x="328" y="116" font-size="10.5" fill="#333" filter="url(#rough2)">suf —— 最大非空后缀和</text>
  <text x="328" y="134" font-size="10.5" fill="#333" filter="url(#rough2)">sub —— 最大非空子段和</text>

  <!-- panel B: merge formulas -->
  <rect x="320" y="170" width="190" height="128" rx="8" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="328" y="190" font-size="11" fill="#446688" filter="url(#rough2)">合并（L、R 为左右儿子）</text>
  <text x="328" y="212" font-size="10" fill="#333" filter="url(#rough2)">sum = sumL + sumR</text>
  <text x="328" y="230" font-size="10" fill="#333" filter="url(#rough2)">pre = max(preL, sumL + preR)</text>
  <text x="328" y="248" font-size="10" fill="#333" filter="url(#rough2)">suf = max(sufR, sumR + sufL)</text>
  <text x="328" y="266" font-size="10" fill="#333" filter="url(#rough2)">sub = max(subL, subR,</text>
  <text x="360" y="284" font-size="10" fill="#333" filter="url(#rough2)">sufL + preR)</text>
</svg>
