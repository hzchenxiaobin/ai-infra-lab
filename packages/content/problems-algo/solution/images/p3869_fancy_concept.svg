<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：稀疏性质枚举对象 · 稠密性质交给数位 DP</text>

  <!-- 左：好数稀疏，子集枚举 -->
  <g filter="url(#rough2)">
    <text x="146" y="58" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">好数极少：一个数位子集 = 一个好数</text>
    <rect x="20" y="66" width="252" height="158" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="146" y="88" text-anchor="middle" font-size="11" fill="#33506b">严格递增：{1,…,9} 的子集 → 511 个</text>
    <rect x="88" y="96" width="26" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="118" y="96" width="26" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="148" y="96" width="26" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <text x="101" y="113" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="131" y="113" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="161" y="113" text-anchor="middle" font-size="12" fill="#333">7</text>
    <text x="196" y="112" text-anchor="middle" font-size="10" fill="#33506b">↑ 升序拼</text>
    <text x="146" y="142" text-anchor="middle" font-size="11" fill="#33506b">严格递减：{0,…,9} 的子集 → 1022 个</text>
    <rect x="88" y="150" width="26" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="118" y="150" width="26" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="148" y="150" width="26" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <text x="101" y="167" text-anchor="middle" font-size="12" fill="#333">9</text>
    <text x="131" y="167" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="161" y="167" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="196" y="166" text-anchor="middle" font-size="10" fill="#33506b">↓ 降序拼</text>
    <text x="146" y="192" text-anchor="middle" font-size="11" fill="#33506b">一位数重复计一次，去重后共 1524 个</text>
    <rect x="52" y="198" width="188" height="20" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="146" y="212" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">最大 9876543210 &lt; 10¹⁵ ⟹ 全枚举 ✓</text>
  </g>

  <!-- 右：数位和封顶，good_sums 小集合 -->
  <g filter="url(#rough2)">
    <text x="414" y="58" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">数位和封顶：合法的和只有 103 个</text>
    <rect x="288" y="66" width="252" height="158" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="414" y="88" text-anchor="middle" font-size="11" fill="#2f5d24">x ≤ 10¹⁵ 至多 16 位 ⟹ 数位和 ≤ 144</text>
    <rect x="316" y="96" width="22" height="20" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="340" y="96" width="22" height="20" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="364" y="96" width="22" height="20" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="388" y="96" width="22" height="20" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="412" y="96" width="22" height="20" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="436" y="96" width="22" height="20" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="460" y="96" width="22" height="20" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="484" y="96" width="22" height="20" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="327" y="110" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="351" y="110" text-anchor="middle" font-size="11" fill="#333">…</text>
    <text x="375" y="110" text-anchor="middle" font-size="11" fill="#333">9</text>
    <text x="399" y="110" text-anchor="middle" font-size="11" fill="#333">10</text>
    <text x="423" y="110" text-anchor="middle" font-size="11" fill="#333">12</text>
    <text x="447" y="110" text-anchor="middle" font-size="11" fill="#333">21</text>
    <text x="471" y="110" text-anchor="middle" font-size="11" fill="#333">98</text>
    <text x="495" y="110" text-anchor="middle" font-size="11" fill="#333">…</text>
    <text x="414" y="134" text-anchor="middle" font-size="11" fill="#2f5d24">good_sums = goods ∩ [1,144] → 103 个值</text>
    <text x="414" y="154" text-anchor="middle" font-size="11" fill="#2f5d24">统计 [1,n] 中数位和 ∈ 集合 →</text>
    <text x="414" y="172" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">数位 DP：(pos, sum, tight)</text>
    <rect x="310" y="180" width="208" height="20" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="414" y="194" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">状态不足 5000，cnt(r) − cnt(l−1) 收工</text>
  </g>

  <!-- 底：容斥合并 -->
  <g filter="url(#rough2)">
    <rect x="30" y="238" width="500" height="130" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="280" y="260" text-anchor="middle" font-size="12.5" fill="#8a3030" font-weight="bold">容斥合并：奇妙数 = A ∪ B（本身好 或 数位和好）</text>
    <text x="280" y="286" text-anchor="middle" font-size="12" fill="#8a3030" font-weight="bold">ans = [cnt(r) − cnt(l−1)] + #[goods ∈ [l,r]] − #[goods ∈ [l,r] 且 Σg ∈ 好和]</text>
    <text x="280" y="304" text-anchor="middle" font-size="10.5" fill="#8a3030">|A|：数位和好 ｜ |B|：本身好 ｜ |A∩B|：两头都好，被加了两次要减回</text>
    <text x="280" y="326" text-anchor="middle" font-size="11" fill="#8a3030">例1：3 + 3 − 3 = 3 ✓　例2：1 + 0 − 0 = 1 ✓　例3：0 + 0 − 0 = 0 ✓</text>
    <text x="280" y="350" text-anchor="middle" font-size="10.5" fill="#8a3030">好数数位互不相同 ⟹ Σg ≤ 0+1+…+9 = 45，天然落在 [1,144] 内</text>
  </g>
</svg>
