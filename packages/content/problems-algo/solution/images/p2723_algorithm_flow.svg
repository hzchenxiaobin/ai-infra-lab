<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：async 函数体内串行 await，return 求和自动包 Promise</text>

  <!-- Step 1: call addTwoPromises -->
  <rect x="150" y="50" width="260" height="45" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">调用 addTwoPromises(promise1, promise2)</text>
  <text x="280" y="84" text-anchor="middle" font-size="10" fill="#888">立即返回一个 pending Promise，函数体异步执行</text>

  <!-- arrow down -->
  <path d="M 280 98 L 280 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: await promise1 -->
  <rect x="130" y="122" width="300" height="55" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="140" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">const a = await promise1</text>
  <text x="280" y="156" text-anchor="middle" font-size="10" fill="#666">函数挂起 ┄ promise1 resolve 后恢复，取值 a</text>
  <text x="280" y="170" text-anchor="middle" font-size="10" fill="#d6a040">期间主线程不阻塞，事件循环继续</text>

  <!-- arrow down -->
  <path d="M 280 180 L 280 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: await promise2 -->
  <rect x="130" y="204" width="300" height="55" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="222" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">const b = await promise2</text>
  <text x="280" y="238" text-anchor="middle" font-size="10" fill="#666">函数再次挂起 ┄ promise2 resolve 后恢复，取值 b</text>
  <text x="280" y="252" text-anchor="middle" font-size="10" fill="#d6a040">若 promise2 已 resolve 则立刻返回，无等待</text>

  <!-- arrow down -->
  <path d="M 280 262 L 280 282" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: return a + b -->
  <rect x="130" y="286" width="300" height="55" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return a + b</text>
  <text x="280" y="320" text-anchor="middle" font-size="10" fill="#666">async 自动把返回值装箱为 Promise.resolve(a + b)</text>
  <text x="280" y="334" text-anchor="middle" font-size="10" fill="#4a7a3a">调用方拿到 resolved Promise，值为 a + b</text>

  <!-- Side annotations -->
  <rect x="40" y="130" width="70" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="75" y="148" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">挂起点 1</text>
  <text x="75" y="162" text-anchor="middle" font-size="9" fill="#888">让出执行权</text>

  <rect x="40" y="212" width="70" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="75" y="230" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">挂起点 2</text>
  <text x="75" y="244" text-anchor="middle" font-size="9" fill="#888">让出执行权</text>

  <rect x="450" y="296" width="90" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="495" y="314" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">自动装箱</text>
  <text x="495" y="328" text-anchor="middle" font-size="9" fill="#888">值 → Promise</text>

  <!-- Bottom note -->
  <rect x="60" y="360" width="440" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#446688">总耗时 = max(t1, t2) —— 两个 Promise 入参时已并发创建</text>
</svg>
