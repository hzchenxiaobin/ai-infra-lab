<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "abacaba"  →  ans = 2</text>

  <!-- table outer frame x=30..530 (w=500), header y=46, row h=34 -->
  <!-- columns: i[30-100] s[i][100-150] s[i-1][150-210] 判定[210-360] cur[360-430] ans[430-530] -->
  <!-- vertical separators -->
  <line x1="100" y1="46" x2="100" y2="324" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="150" y1="46" x2="150" y2="324" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="210" y1="46" x2="210" y2="324" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="360" y1="46" x2="360" y2="324" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="430" y1="46" x2="430" y2="324" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <!-- horizontal separators -->
  <line x1="30" y1="46" x2="530" y2="46" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="30" y1="80" x2="530" y2="80" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="30" y1="324" x2="530" y2="324" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="30" y1="46" x2="30" y2="324" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="530" y1="46" x2="530" y2="324" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <!-- row separators between data rows -->
  <line x1="30" y1="114" x2="530" y2="114" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="148" x2="530" y2="148" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="182" x2="530" y2="182" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="216" x2="530" y2="216" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="250" x2="530" y2="250" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="284" x2="530" y2="284" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- highlight rows i=1 and i=5 (cur=2): rows y 80..114 and 250..284 -->
  <rect x="30" y="80" width="500" height="34" fill="#e6f4ea" opacity="0.55" filter="url(#rough2)"/>
  <rect x="30" y="250" width="500" height="34" fill="#e6f4ea" opacity="0.55" filter="url(#rough2)"/>

  <!-- header (centers: 65,125,180,285,395,480) y=68 -->
  <text x="65" y="68" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">i</text>
  <text x="125" y="68" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">s[i]</text>
  <text x="180" y="68" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">s[i−1]</text>
  <text x="285" y="68" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">s[i]==s[i−1]+1 ?</text>
  <text x="395" y="68" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">cur</text>
  <text x="480" y="68" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">ans</text>

  <!-- rows; y_text = y_top + 22 ; tops 80,114,148,182,216,250,284 -> texts 102,136,170,204,238,272,306 -->
  <!-- row0 -->
  <text x="65" y="102" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="125" y="102" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <text x="180" y="102" text-anchor="middle" font-size="12" fill="#999">—</text>
  <text x="285" y="102" text-anchor="middle" font-size="11" fill="#888">—（起点，cur=1）</text>
  <text x="395" y="102" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="480" y="102" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <!-- row1 i=1 -->
  <text x="65" y="136" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="125" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <text x="180" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <text x="285" y="136" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">+1 ✓ 续接</text>
  <text x="395" y="136" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="480" y="136" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <!-- row2 i=2 -->
  <text x="65" y="170" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="125" y="170" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <text x="180" y="170" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <text x="285" y="170" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−1 ✗ 段断</text>
  <text x="395" y="170" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="480" y="170" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <!-- row3 i=3 -->
  <text x="65" y="204" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="125" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
  <text x="180" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <text x="285" y="204" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">+2 ✗ 段断</text>
  <text x="395" y="204" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="480" y="204" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <!-- row4 i=4 -->
  <text x="65" y="238" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="125" y="238" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <text x="180" y="238" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
  <text x="285" y="238" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−2 ✗ 段断</text>
  <text x="395" y="238" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="480" y="238" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <!-- row5 i=5 -->
  <text x="65" y="272" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="125" y="272" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <text x="180" y="272" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <text x="285" y="272" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">+1 ✓ 续接</text>
  <text x="395" y="272" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="480" y="272" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <!-- row6 i=6 -->
  <text x="65" y="306" text-anchor="middle" font-size="12" fill="#333">6</text>
  <text x="125" y="306" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <text x="180" y="306" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <text x="285" y="306" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−1 ✗ 段断</text>
  <text x="395" y="306" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="480" y="306" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>

  <!-- summary -->
  <rect x="60" y="346" width="440" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="364" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">ans = 2：最长段 "ab"，出现在 i=0..1 与 i=4..5</text>
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#888">两次 cur 触顶到 2，ans 自始至终不再上升</text>
</svg>
