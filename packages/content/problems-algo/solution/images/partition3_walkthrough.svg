<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#333" filter="url(#rough2)">
    示例演算：arr = [0,2,1,−6,6,−7,9,1,2,0,1]，target = 3
  </text>

  <!-- 表格外框 -->
  <rect x="28" y="46" width="504" height="236" rx="6" fill="none"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 表头背景 -->
  <rect x="28" y="46" width="504" height="32" fill="#e8f0fe" filter="url(#rough2)"/>
  <!-- 表头竖线 -->
  <g stroke="#446688" stroke-width="1.2" filter="url(#rough2)">
    <line x1="84"  y1="46" x2="84"  y2="282"/>
    <line x1="150" y1="46" x2="150" y2="282"/>
    <line x1="216" y1="46" x2="216" y2="282"/>
    <line x1="372" y1="46" x2="372" y2="282"/>
    <line x1="470" y1="46" x2="470" y2="282"/>
  </g>
  <line x1="28" y1="78" x2="532" y2="78" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 表头文字 -->
  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="56"  y="67">i</text>
    <text x="117" y="67">arr[i]</text>
    <text x="183" y="67">cur</text>
    <text x="294" y="67">命中 target ?</text>
    <text x="421" y="67">count</text>
    <text x="501" y="67">cur 归零</text>
  </g>

  <!-- 行高 32。数据行 y 起点 78 -->
  <!-- 行1 i=0  arr[0]=0  cur=0 未命中 -->
  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="56"  y="99">0</text>
    <text x="117" y="99">0</text>
    <text x="183" y="99">0</text>
    <text x="294" y="99">否</text>
    <text x="421" y="99">0</text>
    <text x="501" y="99">—</text>
  </g>
  <line x1="28" y1="110" x2="532" y2="110" stroke="#cfd8e6" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行2 i=1 arr[1]=2 cur=2 -->
  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="56"  y="131">1</text>
    <text x="117" y="131">2</text>
    <text x="183" y="131">2</text>
    <text x="294" y="131">否</text>
    <text x="421" y="131">0</text>
    <text x="501" y="131">—</text>
  </g>
  <line x1="28" y1="142" x2="532" y2="142" stroke="#cfd8e6" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行3 i=2 arr[2]=1 cur=3 命中(count=1) 第1段 -->
  <rect x="28" y="142" width="504" height="32" fill="#e6f4ea" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="56"  y="163">2</text>
    <text x="117" y="163">1</text>
    <text x="183" y="163" fill="#4a7a3a">3</text>
    <text x="294" y="163" fill="#4a7a3a">是（第 1 段完成）</text>
    <text x="421" y="163" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="501" y="163">是</text>
  </g>
  <line x1="28" y1="174" x2="532" y2="174" stroke="#cfd8e6" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行4 i=3–6 arr=-6,6,-7,9  cur 徘徊到 2 未命中 -->
  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="56"  y="195">3–6</text>
    <text x="117" y="195">−6,6,−7,9</text>
    <text x="183" y="195">2</text>
    <text x="294" y="195">否（cur 徘徊）</text>
    <text x="421" y="195">1</text>
    <text x="501" y="195">—</text>
  </g>
  <line x1="28" y1="206" x2="532" y2="206" stroke="#cfd8e6" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行5 i=7 arr[7]=1 cur=3 命中(count=2) 第2段 -->
  <rect x="28" y="206" width="504" height="32" fill="#e6f4ea" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="56"  y="227">7</text>
    <text x="117" y="227">1</text>
    <text x="183" y="227" fill="#4a7a3a">3</text>
    <text x="294" y="227" fill="#4a7a3a">是（第 2 段完成）</text>
    <text x="421" y="227" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="501" y="227">是</text>
  </g>
  <line x1="28" y1="238" x2="532" y2="238" stroke="#cfd8e6" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行6 i=8–10 arr=2,0,1 cur=3 命中(count=3) 第3段 -->
  <rect x="28" y="238" width="504" height="32" fill="#e6f4ea" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="56"  y="259">8–10</text>
    <text x="117" y="259">2,0,1</text>
    <text x="183" y="259" fill="#4a7a3a">3</text>
    <text x="294" y="259" fill="#4a7a3a">是（第 3 段完成）</text>
    <text x="421" y="259" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="501" y="259">是</text>
  </g>

  <!-- 图例 / 结论 -->
  <text x="280" y="300" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    绿行 = cur 命中 target 切一段；count = 3 ≥ 3 → 返回 true
  </text>
  <text x="280" y="318" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">
    第 3 段必覆盖到末尾：三段和 = 3·target = total，自然吃满整个数组
  </text>
</svg>
