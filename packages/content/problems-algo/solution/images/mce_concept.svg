<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">
    总开销 f(t) = Σ cost[i]·|nums[i] − t| 是凸函数
  </text>

  <!-- 坐标轴 -->
  <line x1="60" y1="300" x2="480" y2="300" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="60" y1="300" x2="60" y2="60" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="64" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">f(t)</text>
  <text x="486" y="316" font-size="12" fill="#446688" filter="url(#rough2)">t</text>

  <!-- x 轴刻度 1,2,3,5 -->
  <g font-size="12" fill="#333">
    <line x1="102" y1="298" x2="102" y2="304" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="102" y="320" text-anchor="middle" filter="url(#rough2)">1</text>
    <line x1="186" y1="298" x2="186" y2="304" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="186" y="320" text-anchor="middle" filter="url(#rough2)">2</text>
    <line x1="270" y1="298" x2="270" y2="304" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="270" y="320" text-anchor="middle" filter="url(#rough2)">3</text>
    <line x1="438" y1="298" x2="438" y2="304" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="438" y="320" text-anchor="middle" filter="url(#rough2)">5</text>
  </g>

  <!-- 权重柱（cost）在 x 轴下方 -->
  <g font-size="11" fill="#4a7a3a">
    <rect x="92" y="330" width="20" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="102" y="352" text-anchor="middle" filter="url(#rough2)">w=2</text>
    <rect x="176" y="322" width="20" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="186" y="352" text-anchor="middle" fill="#b85450" filter="url(#rough2)">w=14</text>
    <rect x="260" y="327" width="20" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="270" y="352" text-anchor="middle" filter="url(#rough2)">w=3</text>
    <rect x="428" y="333" width="20" height="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="438" y="352" text-anchor="middle" filter="url(#rough2)">w=1</text>
  </g>

  <!-- 凸折线 f(t)：(60,155)(102,192)(186,251)(270,207)(438,75) -->
  <path d="M60,155 L102,192 L186,251 L270,207 L438,75"
        fill="none" stroke="#446688" stroke-width="2" stroke-linejoin="round" filter="url(#rough2)"/>
  <!-- 两端延伸箭头 -->
  <path d="M60,155 L40,140" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M438,75 L458,58" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 折点 -->
  <g filter="url(#rough2)">
    <circle cx="102" cy="192" r="3.5" fill="#446688"/>
    <circle cx="270" cy="207" r="3.5" fill="#446688"/>
    <circle cx="438" cy="75" r="3.5" fill="#446688"/>
    <circle cx="186" cy="251" r="5" fill="#b85450" stroke="#7a2a26" stroke-width="1.5"/>
  </g>

  <!-- 最低点标注 -->
  <line x1="186" y1="251" x2="186" y2="300" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <rect x="206" y="244" width="150" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="281" y="260" text-anchor="middle" font-size="12" fill="#7a2a26" filter="url(#rough2)">加权中位数 t=2</text>
  <text x="281" y="274" text-anchor="middle" font-size="11" fill="#7a2a26" filter="url(#rough2)">f(2)=8（最小）</text>

  <!-- 左右斜率说明 -->
  <text x="120" y="150" font-size="11" fill="#4a7a3a" filter="url(#rough2)">左侧斜率&lt;0 递减</text>
  <text x="350" y="110" font-size="11" fill="#4a7a3a" filter="url(#rough2)">右侧斜率&gt;0 递增</text>

  <text x="260" y="80" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    累计权重首次 ≥ ⌈总权重/2⌉ 处即最小值点
  </text>
</svg>
