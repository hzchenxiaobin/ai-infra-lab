<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：N = 7</text>

  <!-- 7 keysteps: step / key / screen -->
  <!-- headers -->
  <text x="40" y="64" font-size="11" fill="#666" filter="url(#rough2)">步</text>
  <text x="100" y="64" font-size="11" fill="#666" filter="url(#rough2)">按键</text>
  <text x="180" y="64" font-size="11" fill="#666" filter="url(#rough2)">屏幕</text>
  <text x="300" y="64" font-size="11" fill="#666" filter="url(#rough2)">缓冲</text>

  <!-- step rows -->
  <!-- row1 A -> 1 -->
  <rect x="30" y="74" width="46" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="53" y="92" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="84" y="74" width="60" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="114" y="92" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">A</text>
  <rect x="154" y="74" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="174" y="92" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="300" y="92" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <!-- row2 A -> 2 -->
  <rect x="30" y="108" width="46" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="53" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="84" y="108" width="60" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="114" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">A</text>
  <rect x="154" y="108" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="174" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="300" y="126" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <!-- row3 A -> 3 (baseline) -->
  <rect x="30" y="142" width="46" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="53" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="84" y="142" width="60" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="114" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">A</text>
  <rect x="154" y="142" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="174" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="300" y="160" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="210" y="160" font-size="10" fill="#4a7a3a" filter="url(#rough2)">← 爆发基线</text>

  <!-- row4 Ctrl-A -> 3 -->
  <rect x="30" y="176" width="46" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="53" y="194" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="84" y="176" width="60" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="114" y="194" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Ctrl-A</text>
  <rect x="154" y="176" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="174" y="194" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="300" y="194" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <!-- row5 Ctrl-C -> 3, buffer 3 -->
  <rect x="30" y="210" width="46" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="53" y="228" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="84" y="210" width="60" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="114" y="228" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Ctrl-C</text>
  <rect x="154" y="210" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="174" y="228" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="280" y="210" width="40" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="228" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <!-- row6 Ctrl-V -> 6 -->
  <rect x="30" y="244" width="46" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="53" y="262" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="84" y="244" width="60" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="114" y="262" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Ctrl-V</text>
  <rect x="154" y="244" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="174" y="262" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="280" y="244" width="40" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="262" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <!-- row7 Ctrl-V -> 9 (answer) -->
  <rect x="30" y="278" width="46" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="53" y="296" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <rect x="84" y="278" width="60" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="114" y="296" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Ctrl-V</text>
  <rect x="154" y="278" width="40" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="174" y="296" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">9</text>
  <rect x="280" y="278" width="40" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="296" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="210" y="296" font-size="10" fill="#b85450" filter="url(#rough2)">← 答案 = 9</text>

  <!-- dp table for N=1..10 -->
  <text x="380" y="64" font-size="12" fill="#333" filter="url(#rough2)">dp 表（N=1..10）</text>
  <g font-size="11" fill="#333">
    <!-- two columns: N | dp -->
    <rect x="360" y="74" width="36" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="378" y="89" text-anchor="middle" filter="url(#rough2)">N</text>
    <rect x="398" y="74" width="40" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="418" y="89" text-anchor="middle" filter="url(#rough2)">dp</text>

    <!-- rows -->
    <rect x="360" y="98" width="36" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="378" y="112" text-anchor="middle" filter="url(#rough2)">1</text>
    <rect x="398" y="98" width="40" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="418" y="112" text-anchor="middle" filter="url(#rough2)">1</text>

    <rect x="360" y="120" width="36" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="378" y="134" text-anchor="middle" filter="url(#rough2)">2</text>
    <rect x="398" y="120" width="40" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="418" y="134" text-anchor="middle" filter="url(#rough2)">2</text>

    <rect x="360" y="142" width="36" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="378" y="156" text-anchor="middle" filter="url(#rough2)">3</text>
    <rect x="398" y="142" width="40" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="418" y="156" text-anchor="middle" filter="url(#rough2)">3</text>

    <rect x="360" y="164" width="36" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="378" y="178" text-anchor="middle" filter="url(#rough2)">4</text>
    <rect x="398" y="164" width="40" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="418" y="178" text-anchor="middle" filter="url(#rough2)">4</text>

    <rect x="360" y="186" width="36" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="378" y="200" text-anchor="middle" filter="url(#rough2)">5</text>
    <rect x="398" y="186" width="40" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="418" y="200" text-anchor="middle" filter="url(#rough2)">5</text>

    <rect x="360" y="208" width="36" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="378" y="222" text-anchor="middle" filter="url(#rough2)">6</text>
    <rect x="398" y="208" width="40" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="418" y="222" text-anchor="middle" filter="url(#rough2)">6</text>

    <rect x="360" y="230" width="36" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <text x="378" y="244" text-anchor="middle" filter="url(#rough2)">7</text>
    <rect x="398" y="230" width="40" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="418" y="244" text-anchor="middle" filter="url(#rough2)">9</text>

    <rect x="360" y="252" width="36" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="378" y="266" text-anchor="middle" filter="url(#rough2)">8</text>
    <rect x="398" y="252" width="40" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="418" y="266" text-anchor="middle" filter="url(#rough2)">12</text>

    <rect x="360" y="274" width="36" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="378" y="288" text-anchor="middle" filter="url(#rough2)">9</text>
    <rect x="398" y="274" width="40" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="418" y="288" text-anchor="middle" filter="url(#rough2)">16</text>

    <rect x="360" y="296" width="36" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="378" y="310" text-anchor="middle" filter="url(#rough2)">10</text>
    <rect x="398" y="296" width="40" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="418" y="310" text-anchor="middle" filter="url(#rough2)">20</text>
  </g>

  <!-- bottom note -->
  <rect x="40" y="340" width="480" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">N=7 首次出现「爆发反超纯按 A」</text>
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3 个 A（基线）+ 一次 ×3 爆发（Ctrl-A,C,C-V,C-V）= 3 × 3 = 9 &gt; 7</text>
</svg>
