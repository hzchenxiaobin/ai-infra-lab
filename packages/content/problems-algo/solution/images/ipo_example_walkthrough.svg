<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">示例演算：k=2, w=0, profits=[1,2,3], capital=[0,1,1]</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#888">排序后 [(c=0,p=1),(c=1,p=2),(c=1,p=3)] · 橙色 = 本轮弹出</text>

  <!-- Round 1 -->
  <text x="60" y="78" font-size="12" fill="#446688" font-weight="bold">第 1 轮：w=0</text>

  <text x="60" y="100" font-size="10.5" fill="#666">入堆：</text>
  <rect x="100" y="84" width="72" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="136" y="101" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">c=0,p=1</text>
  <text x="180" y="100" font-size="10" fill="#4a7a3a">✓ w≥0</text>
  <rect x="240" y="84" width="72" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="276" y="101" text-anchor="middle" font-size="11" fill="#999">c=1,p=2</text>
  <text x="320" y="100" font-size="10" fill="#b85450">✗ w&lt;1</text>

  <text x="60" y="128" font-size="10.5" fill="#666">堆：</text>
  <rect x="100" y="112" width="72" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="136" y="129" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">p=1</text>
  <text x="184" y="128" font-size="10.5" fill="#d6a040" font-weight="bold">← 弹出最大</text>

  <text x="60" y="154" font-size="11" fill="#b85450" font-weight="bold">w = 0 + 1 = 1</text>

  <path d="M 200 148 L 200 170" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- Round 2 -->
  <text x="60" y="190" font-size="12" fill="#446688" font-weight="bold">第 2 轮：w=1</text>

  <text x="60" y="212" font-size="10.5" fill="#666">入堆：</text>
  <rect x="100" y="196" width="72" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="136" y="213" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">c=1,p=2</text>
  <text x="180" y="212" font-size="10" fill="#4a7a3a">✓ w≥1</text>
  <rect x="240" y="196" width="72" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="276" y="213" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">c=1,p=3</text>
  <text x="320" y="212" font-size="10" fill="#4a7a3a">✓ w≥1</text>

  <text x="60" y="240" font-size="10.5" fill="#666">堆：</text>
  <rect x="100" y="224" width="72" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="136" y="241" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">p=3</text>
  <rect x="178" y="228" width="64" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="210" y="241" text-anchor="middle" font-size="11" fill="#666">p=2</text>
  <text x="254" y="240" font-size="10.5" fill="#d6a040" font-weight="bold">← 弹出最大</text>

  <text x="60" y="266" font-size="11" fill="#b85450" font-weight="bold">w = 1 + 3 = 4</text>

  <!-- Result -->
  <path d="M 200 260 L 200 288" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <rect x="32" y="292" width="456" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="48" y="314" font-size="13" fill="#4a7a3a" font-weight="bold">最终结果：w = 4</text>
  <text x="48" y="330" font-size="11" fill="#4a7a3a">第 1 轮只能做项目 0（唯一资本 ≤ 0 的），拿利润 1；第 2 轮解锁项目 1、2，贪心选利润 3</text>

  <!-- summary table -->
  <rect x="32" y="348" width="456" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="48" y="368" font-size="11" fill="#446688" font-weight="bold">对比：若第 2 轮选利润 2 → w=3，少赚 1</text>
  <text x="48" y="384" font-size="11" fill="#446688">贪心选最大利润保证资本增长最快，从而解锁更多后续项目</text>
</svg>
