<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="680" height="460" fill="#fdfcf7"/>

  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例演算：head=3→4→1↺ ，insertVal = 2</text>
  <path d="M 190 36 Q 340 42 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Step 0: initial ===== -->
  <text x="30" y="66" font-size="11" font-weight="bold" fill="#2b6e9e">初始：prev=3, curr=4</text>
  <g font-size="12" fill="#444">
    <g filter="url(#sk)"><rect x="120" y="78" width="46" height="30" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/><text x="143" y="98" text-anchor="middle" font-weight="bold" fill="#2b6e9e">3</text></g>
    <g filter="url(#sk)"><rect x="220" y="78" width="46" height="30" rx="5" fill="#fff" stroke="#bbb"/><text x="243" y="98" text-anchor="middle">4</text></g>
    <g filter="url(#sk)"><rect x="320" y="78" width="46" height="30" rx="5" fill="#fff" stroke="#bbb"/><text x="343" y="98" text-anchor="middle">1</text></g>
  </g>
  <path d="M 166 93 L 216 93" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 266 93 L 316 93" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 343 108 Q 243 138 143 108" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="143" y="68" text-anchor="middle" font-size="9" fill="#4a8edb" font-weight="bold">prev</text>
  <text x="243" y="68" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">curr</text>
  <text x="420" y="98" font-size="11" fill="#b85450">3 ≤ 2? 否 · 3&gt;4? 否 → 前进</text>

  <!-- divider -->
  <path d="M 30 122 Q 340 126 650 122" stroke="#eee" stroke-width="1" fill="none" filter="url(#sk)"/>

  <!-- ===== Step 1 ===== -->
  <text x="30" y="150" font-size="11" font-weight="bold" fill="#d6a040">第1步：prev=4, curr=1（拐点）</text>
  <g font-size="12" fill="#444">
    <g filter="url(#sk)"><rect x="120" y="162" width="46" height="30" rx="5" fill="#fff" stroke="#bbb"/><text x="143" y="182" text-anchor="middle">3</text></g>
    <g filter="url(#sk)"><rect x="220" y="162" width="46" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/><text x="243" y="182" text-anchor="middle" font-weight="bold">4</text></g>
    <g filter="url(#sk)"><rect x="320" y="162" width="46" height="30" rx="5" fill="#fff" stroke="#bbb"/><text x="343" y="182" text-anchor="middle">1</text></g>
  </g>
  <path d="M 166 177 L 216 177" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 266 177 L 316 177" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 343 192 Q 243 222 143 192" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="243" y="152" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">prev</text>
  <text x="343" y="152" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">curr</text>
  <text x="420" y="182" font-size="11" fill="#b85450">4 ≤ 2? 否 · 4&gt;1? 是(拐点)</text>
  <text x="420" y="198" font-size="11" fill="#b85450">2≥4? 否 · 2≤1? 否 → 前进</text>

  <!-- divider -->
  <path d="M 30 206 Q 340 210 650 206" stroke="#eee" stroke-width="1" fill="none" filter="url(#sk)"/>

  <!-- ===== Step 2: hit! ===== -->
  <text x="30" y="234" font-size="11" font-weight="bold" fill="#4a7a3a">第2步：prev=1, curr=3 → 命中情况①</text>
  <g font-size="12" fill="#444">
    <g filter="url(#sk)"><rect x="120" y="246" width="46" height="30" rx="5" fill="#fff" stroke="#bbb"/><text x="143" y="266" text-anchor="middle">3</text></g>
    <g filter="url(#sk)"><rect x="220" y="246" width="46" height="30" rx="5" fill="#fff" stroke="#bbb"/><text x="243" y="266" text-anchor="middle">4</text></g>
    <g filter="url(#sk)"><rect x="320" y="246" width="46" height="30" rx="5" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8"/><text x="343" y="266" text-anchor="middle" font-weight="bold" fill="#2e6e2e">1</text></g>
    <!-- 插入节点 2 -->
    <g filter="url(#sk)"><rect x="400" y="246" width="46" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/><text x="423" y="266" text-anchor="middle" font-weight="bold" fill="#b85450">2</text></g>
  </g>
  <path d="M 166 261 L 216 261" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 266 261 L 316 261" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 366 261 L 396 261" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 423 276 Q 283 312 143 276" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="343" y="236" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">prev</text>
  <text x="143" y="236" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">curr</text>
  <text x="423" y="236" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">insert</text>
  <text x="480" y="266" font-size="11" fill="#4a7a3a" font-weight="bold">1 ≤ 2 ≤ 3 ✓ 插入!</text>

  <!-- divider -->
  <path d="M 30 290 Q 340 294 650 290" stroke="#eee" stroke-width="1" fill="none" filter="url(#sk)"/>

  <!-- ===== Result ===== -->
  <text x="30" y="324" font-size="12" font-weight="bold" fill="#2b2b2b">结果：3 → 4 → 1 → 2 ↺ （2 插在 1 与 3 之间）</text>
  <g font-size="13" fill="#444">
    <g filter="url(#sk)"><rect x="80" y="342" width="50" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/><text x="105" y="364" text-anchor="middle" font-weight="bold" fill="#2b6e9e">3</text></g>
    <g filter="url(#sk)"><rect x="180" y="342" width="50" height="34" rx="6" fill="#fff" stroke="#bbb"/><text x="205" y="364" text-anchor="middle">4</text></g>
    <g filter="url(#sk)"><rect x="280" y="342" width="50" height="34" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.5"/><text x="305" y="364" text-anchor="middle" font-weight="bold" fill="#2e6e2e">1</text></g>
    <g filter="url(#sk)"><rect x="380" y="342" width="50" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/><text x="405" y="364" text-anchor="middle" font-weight="bold" fill="#b85450">2</text></g>
  </g>
  <path d="M 130 359 L 176 359" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 230 359 L 276 359" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 330 359 L 376 359" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 405 376 Q 255 416 105 376" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="255" y="408" text-anchor="middle" font-size="10" fill="#888">2 → 3 闭环</text>

  <!-- 步骤汇总表 -->
  <text x="30" y="432" font-size="11" fill="#555" font-weight="bold">步骤表：</text>
  <g font-size="10" fill="#444">
    <g filter="url(#sk)"><rect x="90" y="422" width="140" height="20" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/><text x="160" y="436" text-anchor="middle">①3,4: 否·否→前进</text></g>
    <g filter="url(#sk)"><rect x="240" y="422" width="180" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/><text x="330" y="436" text-anchor="middle">②4,1: 拐点·不满足→前进</text></g>
    <g filter="url(#sk)"><rect x="430" y="422" width="140" height="20" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1"/><text x="500" y="436" text-anchor="middle">③1,3: 1≤2≤3→插入</text></g>
  </g>

</svg>
