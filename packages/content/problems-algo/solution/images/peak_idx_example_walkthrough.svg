<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [0,2,4,6,5,3,1]，n = 7（峰顶在下标 3）</text>

  <!-- index labels -->
  <text x="84" y="56" text-anchor="middle" font-size="10" fill="#888">下标</text>
  <text x="140" y="56" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="194" y="56" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="248" y="56" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="302" y="56" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="356" y="56" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="410" y="56" text-anchor="middle" font-size="10" fill="#888">5</text>
  <text x="464" y="56" text-anchor="middle" font-size="10" fill="#888">6</text>

  <!-- array cells: 0,2,4,6,5,3,1 -->
  <rect x="117" y="64" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="171" y="64" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="225" y="64" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="248" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="279" y="64" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="302" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <rect x="333" y="64" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="356" y="86" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">5</text>
  <rect x="387" y="64" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="410" y="86" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">3</text>
  <rect x="441" y="64" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="464" y="86" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>

  <text x="302" y="48" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">峰顶</text>

  <!-- step table header -->
  <rect x="30" y="118" width="500" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="135" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">轮次</text>
  <text x="115" y="135" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">lo</text>
  <text x="165" y="135" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">hi</text>
  <text x="218" y="135" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">mid</text>
  <text x="300" y="135" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">比较 arr[mid] vs arr[mid+1]</text>
  <text x="465" y="135" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">动作</text>

  <!-- row 1 -->
  <rect x="30" y="146" width="500" height="44" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="172" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="115" y="172" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">0</text>
  <text x="165" y="172" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">6</text>
  <text x="218" y="172" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">3</text>
  <text x="300" y="166" text-anchor="middle" font-size="11" fill="#333">arr[3]=6  vs  arr[4]=5</text>
  <text x="300" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6 &gt; 5 → 下降坡 ↓</text>
  <text x="465" y="172" text-anchor="middle" font-size="11" fill="#b85450">hi = mid = 3</text>

  <!-- row 2 -->
  <rect x="30" y="192" width="500" height="44" fill="#f6f6f6" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="218" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="115" y="218" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">0</text>
  <text x="165" y="218" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>
  <text x="218" y="218" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">1</text>
  <text x="300" y="212" text-anchor="middle" font-size="11" fill="#333">arr[1]=2  vs  arr[2]=4</text>
  <text x="300" y="226" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2 &lt; 4 → 上升坡 ↑</text>
  <text x="465" y="218" text-anchor="middle" font-size="11" fill="#446688">lo = mid+1 = 2</text>

  <!-- row 3 -->
  <rect x="30" y="238" width="500" height="44" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="264" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="115" y="264" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2</text>
  <text x="165" y="264" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>
  <text x="218" y="264" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">2</text>
  <text x="300" y="258" text-anchor="middle" font-size="11" fill="#333">arr[2]=4  vs  arr[3]=6</text>
  <text x="300" y="272" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4 &lt; 6 → 上升坡 ↑</text>
  <text x="465" y="264" text-anchor="middle" font-size="11" fill="#446688">lo = mid+1 = 3</text>

  <!-- row 4: end -->
  <rect x="30" y="284" width="500" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="60" y="310" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结束</text>
  <text x="115" y="310" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="165" y="310" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="218" y="310" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="300" y="304" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">lo == hi == 3</text>
  <text x="300" y="318" text-anchor="middle" font-size="10.5" fill="#4a7a3a">区间缩为一点，即为峰顶</text>
  <text x="465" y="310" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 3 ✓</text>

  <!-- summary box -->
  <rect x="30" y="344" width="500" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">每轮仅 1 次比较 arr[mid] vs arr[mid+1]，区间折半</text>
  <text x="280" y="384" text-anchor="middle" font-size="11" fill="#4a7a3a">上升坡 → 峰在右（lo=mid+1）；下降坡 → 峰在左含 mid（hi=mid）</text>

  <text x="280" y="420" text-anchor="middle" font-size="10.5" fill="#888">3 轮二分锁定峰顶 arr[3]=6，对比线性扫描需 6 次比较</text>
  <text x="280" y="438" text-anchor="middle" font-size="10.5" fill="#888">对比 162 多峰版：本题保证唯一峰且整体先增后减，二段性更天然</text>
</svg>
