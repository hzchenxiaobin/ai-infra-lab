<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：按位拆解，逐位贡献 = c × (n − c)</text>

  <!-- bit position header -->
  <text x="172" y="64" text-anchor="middle" font-size="11" fill="#888">bit3</text>
  <text x="232" y="64" text-anchor="middle" font-size="11" fill="#888">bit2</text>
  <text x="292" y="64" text-anchor="middle" font-size="11" fill="#888">bit1</text>
  <text x="352" y="64" text-anchor="middle" font-size="11" fill="#888">bit0</text>

  <!-- ===== Row 4 = 0100 ===== -->
  <text x="50" y="92" font-size="12.5" fill="#446688" font-weight="bold">nums[0]=4</text>
  <text x="50" y="108" font-size="10" fill="#888">0100</text>
  <rect x="150" y="72" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="172" y="94" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="210" y="72" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="232" y="94" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">1</text>
  <rect x="270" y="72" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="292" y="94" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="330" y="72" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="352" y="94" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>

  <!-- ===== Row 14 = 1110 ===== -->
  <text x="50" y="146" font-size="12.5" fill="#d6a040" font-weight="bold">nums[1]=14</text>
  <text x="50" y="162" font-size="10" fill="#888">1110</text>
  <rect x="150" y="126" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="172" y="148" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="210" y="126" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="232" y="148" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">1</text>
  <rect x="270" y="126" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="292" y="148" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="330" y="126" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="352" y="148" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>

  <!-- ===== Row 2 = 0010 ===== -->
  <text x="50" y="200" font-size="12.5" fill="#4a7a3a" font-weight="bold">nums[2]=2</text>
  <text x="50" y="216" font-size="10" fill="#888">0010</text>
  <rect x="150" y="180" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="172" y="202" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="210" y="180" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="232" y="202" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">0</text>
  <rect x="270" y="180" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="292" y="202" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="330" y="180" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="352" y="202" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>

  <!-- highlight bit2 column with a bracket -->
  <path d="M 210 224 Q 210 232 232 232 Q 254 232 254 224" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="232" y="248" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">↑ 看这一列</text>

  <!-- bit2 column analysis box -->
  <rect x="400" y="72" width="148" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="474" y="94" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">bit2 列分析</text>
  <text x="416" y="116" font-size="11.5" fill="#555">1 的个数 c = 2</text>
  <text x="416" y="136" font-size="11.5" fill="#555">0 的个数 n−c = 1</text>
  <text x="416" y="158" font-size="11.5" fill="#b85450" font-weight="bold">配对数 = 2 × 1</text>
  <text x="416" y="180" font-size="11.5" fill="#b85450" font-weight="bold">= 2</text>
  <text x="416" y="202" font-size="10" fill="#888">(每个 1 与每个 0</text>
  <text x="416" y="214" font-size="10" fill="#888"> 恰好在此位不同)</text>

  <!-- arrow from bit2 column to analysis -->
  <path d="M 254 148 Q 320 148 398 148" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- pairing illustration: 1s connect to 0s -->
  <text x="232" y="280" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">bit2 上的差异配对：</text>
  <rect x="120" y="292" width="64" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="152" y="310" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4 (1)</text>
  <rect x="200" y="292" width="64" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="232" y="310" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">14 (1)</text>
  <rect x="280" y="292" width="64" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="312" y="310" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2 (0)</text>

  <!-- pairing lines: 4~2 and 14~2 -->
  <path d="M 152 318 Q 200 338 308 318" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 232 318 Q 268 338 308 318" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="232" y="352" text-anchor="middle" font-size="10.5" fill="#b85450">2 个 1 × 1 个 0 = 2 对差异</text>

  <!-- formula box -->
  <rect x="60" y="366" width="440" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="388" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">总距离 = Σ c_k × (n − c_k) ，按位独立求和</text>
</svg>
