<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：array=[−1,0,3,5,9,12], target=9</text>

  <!-- Phase 1 table -->
  <rect x="30" y="48" width="220" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="65" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">阶段一：指数扩界</text>

  <!-- table header -->
  <rect x="30" y="82" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="99" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">轮次</text>
  <rect x="82" y="82" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="103" y="99" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">left</text>
  <rect x="126" y="82" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="149" y="99" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">right</text>
  <rect x="174" y="82" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="212" y="99" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">get(right)</text>
  <rect x="252" y="82" width="86" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="295" y="99" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">动作</text>

  <!-- row 1 -->
  <rect x="30" y="110" width="50" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="55" y="126" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="82" y="110" width="42" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="103" y="126" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <rect x="126" y="110" width="46" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="149" y="126" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="174" y="110" width="76" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="212" y="126" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <rect x="252" y="110" width="86" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="295" y="126" text-anchor="middle" font-size="9.5" fill="#446688">0&lt;9, left=1,r=2</text>

  <!-- row 2 -->
  <rect x="30" y="136" width="50" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="55" y="152" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="82" y="136" width="42" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="103" y="152" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="126" y="136" width="46" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="149" y="152" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="174" y="136" width="76" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="212" y="152" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <rect x="252" y="136" width="86" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="295" y="152" text-anchor="middle" font-size="9.5" fill="#446688">3&lt;9, left=2,r=4</text>

  <!-- row 3 (stop) -->
  <rect x="30" y="162" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="55" y="178" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">3</text>
  <rect x="82" y="162" width="42" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="103" y="178" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">2</text>
  <rect x="126" y="162" width="46" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="149" y="178" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">4</text>
  <rect x="174" y="162" width="76" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="212" y="178" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">9</text>
  <rect x="252" y="162" width="86" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="295" y="178" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">9≥9, 停 ⭐</text>

  <text x="160" y="206" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">区间确定 [2, 4]，进入二分</text>

  <!-- Phase 2 table -->
  <rect x="30" y="226" width="220" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="243" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">阶段二：二分查找 [2, 4]</text>

  <!-- table header -->
  <rect x="30" y="260" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="277" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">轮次</text>
  <rect x="82" y="260" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="103" y="277" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">left</text>
  <rect x="126" y="260" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="149" y="277" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">right</text>
  <rect x="174" y="260" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="277" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">mid</text>
  <rect x="218" y="260" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="248" y="277" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">get(mid)</text>
  <rect x="280" y="260" width="98" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="329" y="277" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">动作</text>

  <!-- row 1 -->
  <rect x="30" y="288" width="50" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="55" y="304" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="82" y="288" width="42" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="103" y="304" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="126" y="288" width="46" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="149" y="304" text-anchor="middle" font-size="10.5" fill="#333">4</text>
  <rect x="174" y="288" width="42" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="195" y="304" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <rect x="218" y="288" width="60" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="248" y="304" text-anchor="middle" font-size="10.5" fill="#333">5</text>
  <rect x="280" y="288" width="98" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="329" y="304" text-anchor="middle" font-size="9.5" fill="#446688">5&lt;9, left=4</text>

  <!-- row 2 (hit) -->
  <rect x="30" y="314" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="55" y="330" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">2</text>
  <rect x="82" y="314" width="42" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="103" y="330" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">4</text>
  <rect x="126" y="314" width="46" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="149" y="330" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">4</text>
  <rect x="174" y="314" width="42" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="195" y="330" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">4</text>
  <rect x="218" y="314" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="248" y="330" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">9</text>
  <rect x="280" y="314" width="98" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="329" y="330" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">9==9, return 4 ✅</text>

  <!-- summary box -->
  <rect x="30" y="356" width="500" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="378" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">两阶段合计 5 次 get 调用 → 返回下标 4</text>
  <text x="280" y="398" text-anchor="middle" font-size="11" fill="#555">扩界 3 次 + 二分 2 次，n=6 时与线性扫描相当</text>
  <text x="280" y="416" text-anchor="middle" font-size="11" fill="#555">n=10⁴ 时约 2×log₂(10⁴)≈28 次 vs 线性 10⁴ 次</text>
</svg>
