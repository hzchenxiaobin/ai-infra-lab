<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：单遍扫描 + 连胜计数</text>

  <!-- 1. 初始化 -->
  <rect x="170" y="44" width="200" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="12" fill="#333">① champion = arr[0], streak = 0</text>

  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. for i = 1..n-1 -->
  <rect x="160" y="100" width="220" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="124" text-anchor="middle" font-size="12" fill="#333">② for i = 1 … n−1</text>

  <path d="M 270 138 L 270 156" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. diamond: champion > arr[i]? -->
  <polygon points="270,156 380,196 270,236 160,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="192" text-anchor="middle" font-size="11.5" fill="#333">champion &gt; arr[i] ?</text>
  <text x="270" y="208" text-anchor="middle" font-size="10" fill="#888">冠军守擂?</text>

  <!-- 是 → streak++ (左下) -->
  <path d="M 160 196 L 90 196 L 90 250" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="96" y="188" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="50" y="250" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="90" y="272" text-anchor="middle" font-size="11" fill="#333">streak++</text>

  <!-- 否 → 换冠军 (右下) -->
  <path d="M 380 196 L 450 196 L 450 250" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="188" font-size="10.5" fill="#d6a040" font-weight="bold">否</text>
  <rect x="410" y="250" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="460" y="268" text-anchor="middle" font-size="10.5" fill="#333">champion=arr[i]</text>
  <text x="460" y="280" text-anchor="middle" font-size="10.5" fill="#333">streak = 1</text>

  <!-- 两支汇合到 streak==k 判定 -->
  <path d="M 90 284 L 90 312 L 200 312 L 200 330" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 460 284 L 460 312 L 340 312 L 340 330" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. diamond: streak == k? -->
  <polygon points="270,330 370,368 270,406 170,368" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="364" text-anchor="middle" font-size="11.5" fill="#333">streak == k ?</text>
  <text x="270" y="380" text-anchor="middle" font-size="10" fill="#888">连胜达标?</text>

  <!-- 是 → return champion -->
  <path d="M 270 406 L 270 424" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="420" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <rect x="200" y="424" width="140" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="443" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return champion</text>

  <!-- 否 → 回到② -->
  <path d="M 170 368 L 40 368 L 40 119 L 158 119" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="34" y="244" font-size="10.5" fill="#666" font-weight="bold">否</text>
  <text x="34" y="258" font-size="10" fill="#666">下一个 i</text>

  <!-- 右侧：循环结束兜底 -->
  <rect x="440" y="408" width="96" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="488" y="426" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">循环正常结束</text>
  <text x="488" y="440" text-anchor="middle" font-size="10" fill="#555">champion = max</text>
  <text x="488" y="452" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">→ return champion</text>

  <!-- 右下注释 -->
  <rect x="440" y="330" width="96" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="488" y="348" text-anchor="middle" font-size="10" fill="#a87020" font-weight="bold">k &gt; n−1 时</text>
  <text x="488" y="362" text-anchor="middle" font-size="9.5" fill="#555">途中无人达 k</text>
  <text x="488" y="372" font-size="9.5" fill="#555">走兜底分支</text>
</svg>
