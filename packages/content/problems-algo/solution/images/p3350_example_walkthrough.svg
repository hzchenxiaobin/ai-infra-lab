<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2,5,7,8,9,2,3,4,3,1]</text>
  <text x="320" y="42" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">每步用 ans = max(ans, cur÷2, min(prev,cur)) 刷新；橙色行 = 断裂步，绿色行 = 答案命中步</text>

  <!-- 表头 -->
  <rect x="70" y="54" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="104" y="54" width="86" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="190" y="54" width="66" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="256" y="54" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="298" y="54" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="340" y="54" width="52" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="392" y="54" width="88" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="480" y="54" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="87" y="70" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="147" y="70" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">相邻对</text>
  <text x="223" y="70" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">动作</text>
  <text x="277" y="70" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">cur</text>
  <text x="319" y="70" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">prev</text>
  <text x="366" y="70" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">cur÷2</text>
  <text x="436" y="70" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">min(prev,cur)</text>
  <text x="501" y="70" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- 行生成：y 从 78 起，行高 26 -->
  <!-- i=1 升 -->
  <rect x="70" y="78" width="452" height="26" fill="#ffffff" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="87" y="95" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="147" y="95" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">2→5 升</text>
  <text x="223" y="95" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">cur+1</text>
  <text x="277" y="95" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="319" y="95" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="366" y="95" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="436" y="95" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="501" y="95" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- i=2 升 -->
  <rect x="70" y="104" width="452" height="26" fill="#ffffff" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="87" y="121" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="147" y="121" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">5→7 升</text>
  <text x="223" y="121" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">cur+1</text>
  <text x="277" y="121" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="319" y="121" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="366" y="121" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="436" y="121" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="501" y="121" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- i=3 升 -->
  <rect x="70" y="130" width="452" height="26" fill="#ffffff" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="87" y="147" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="147" y="147" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">7→8 升</text>
  <text x="223" y="147" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">cur+1</text>
  <text x="277" y="147" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <text x="319" y="147" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="366" y="147" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="436" y="147" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="501" y="147" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- i=4 升 -->
  <rect x="70" y="156" width="452" height="26" fill="#ffffff" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="87" y="173" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <text x="147" y="173" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">8→9 升</text>
  <text x="223" y="173" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">cur+1</text>
  <text x="277" y="173" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>
  <text x="319" y="173" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="366" y="173" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="436" y="173" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="501" y="173" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- i=5 断 -->
  <rect x="70" y="182" width="452" height="26" fill="#fff8e1" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="87" y="199" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>
  <text x="147" y="199" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">9→2 断！</text>
  <text x="223" y="199" text-anchor="middle" font-size="10" fill="#8f3a36" filter="url(#rough2)">prev←5</text>
  <text x="277" y="199" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="319" y="199" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="366" y="199" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="436" y="199" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="501" y="199" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- i=6 升 -->
  <rect x="70" y="208" width="452" height="26" fill="#ffffff" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="87" y="225" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6</text>
  <text x="147" y="225" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">2→3 升</text>
  <text x="223" y="225" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">cur+1</text>
  <text x="277" y="225" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="319" y="225" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="366" y="225" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="436" y="225" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="501" y="225" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- i=7 升，命中！ -->
  <rect x="70" y="234" width="452" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="87" y="251" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">7</text>
  <text x="147" y="251" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">3→4 升</text>
  <text x="223" y="251" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">cur+1</text>
  <text x="277" y="251" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="319" y="251" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="366" y="251" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="436" y="251" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3 ✓</text>
  <text x="501" y="251" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- i=8 断 -->
  <rect x="70" y="260" width="452" height="26" fill="#fff8e1" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="87" y="277" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">8</text>
  <text x="147" y="277" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">4→3 断！</text>
  <text x="223" y="277" text-anchor="middle" font-size="10" fill="#8f3a36" filter="url(#rough2)">prev←3</text>
  <text x="277" y="277" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="319" y="277" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="366" y="277" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="436" y="277" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="501" y="277" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- i=9 断 -->
  <rect x="70" y="286" width="452" height="26" fill="#fff8e1" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="87" y="303" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">9</text>
  <text x="147" y="303" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">3→1 断！</text>
  <text x="223" y="303" text-anchor="middle" font-size="10" fill="#8f3a36" filter="url(#rough2)">prev←1</text>
  <text x="277" y="303" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="319" y="303" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="366" y="303" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="436" y="303" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="501" y="303" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- 命中标注 -->
  <path d="M 480 247 C 510 247, 530 270, 548 288" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="556" y="242" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">cur 长到 3</text>
  <text x="556" y="254" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">min(5,3)=3</text>
  <text x="556" y="266" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">两段跨缝相邻</text>
  <text x="556" y="278" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">[7,8,9]+[2,3,4]</text>

  <!-- 结论 -->
  <rect x="60" y="330" width="520" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="355" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">i=7 时 min(prev=5, cur=3)=3 命中，最终返回 ans = 3 ✓</text>

  <text x="320" y="392" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">对照：整段内摆法最高只有 ⌊5/2⌋=2（i=4 时 cur÷2），跨缝摆法 3 更优——两种贡献缺一不可</text>
</svg>
