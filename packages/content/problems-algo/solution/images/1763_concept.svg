<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：坏字符是「分割墙」—— 美好子串不能跨越</text>

  <!-- String label -->
  <text x="56" y="68" font-size="12" fill="#888" filter="url(#rough2)">s = "YazaAay"</text>

  <!-- 7 cells: Y a z a A a y -->
  <g font-size="14" fill="#333" text-anchor="middle">
    <rect x="104" y="56" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="128" y="80" filter="url(#rough2)">Y</text>
    <rect x="152" y="56" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="176" y="80" filter="url(#rough2)">a</text>
    <rect x="200" y="56" width="48" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="224" y="80" fill="#b85450" font-weight="bold" filter="url(#rough2)">z</text>
    <rect x="248" y="56" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="272" y="80" filter="url(#rough2)">a</text>
    <rect x="296" y="56" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="320" y="80" filter="url(#rough2)">A</text>
    <rect x="344" y="56" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="368" y="80" filter="url(#rough2)">a</text>
    <rect x="392" y="56" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="416" y="80" filter="url(#rough2)">y</text>
  </g>

  <!-- Wall at z position -->
  <path d="M 224 42 L 224 106" stroke="#b85450" stroke-width="2.5" stroke-dasharray="6,3" filter="url(#rough2)"/>
  <text x="224" y="36" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">z 坏</text>

  <!-- case check row -->
  <text x="56" y="128" font-size="11.5" fill="#555" filter="url(#rough2)">大小写检查：</text>
  <text x="148" y="128" font-size="11" fill="#4a7a3a" filter="url(#rough2)">Y↔y ✓</text>
  <text x="210" y="128" font-size="11" fill="#4a7a3a" filter="url(#rough2)">a↔A ✓</text>
  <text x="272" y="128" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">z↔Z ✗（Z 不在 s 中）</text>

  <!-- divider -->
  <path d="M 40 146 L 520 146" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Split label -->
  <text x="56" y="172" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">按 z 切分 →</text>

  <!-- Left segment "Ya" -->
  <rect x="104" y="160" width="96" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="152" y="184" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"Ya"</text>

  <!-- Right segment "aAay" -->
  <rect x="248" y="160" width="144" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="320" y="184" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"aAay"</text>

  <!-- Recurse arrows -->
  <path d="M 152 198 L 152 222" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 198 L 320 222" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Recurse labels -->
  <text x="152" y="238" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">递归求解</text>
  <text x="320" y="238" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">递归求解</text>

  <!-- Key insight box -->
  <rect x="56" y="256" width="448" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="68" y="278" font-size="11.5" fill="#555" filter="url(#rough2)">• <tspan fill="#b85450" font-weight="bold">坏字符</tspan> c：swapcase(c) 不在 s 中 → 含 c 的子串必非美好（缺一种大小写）</text>
  <text x="68" y="296" font-size="11.5" fill="#555" filter="url(#rough2)">• 坏字符是<tspan fill="#b85450" font-weight="bold">分割墙</tspan>：美好子串不能包含 c → 只能在切分后的某一段内</text>
  <text x="68" y="314" font-size="11.5" fill="#555" filter="url(#rough2)">• <tspan fill="#4a7a3a" font-weight="bold">分治</tspan>：按 c 切分 s，对每段递归，取最长（同长取最早）</text>
</svg>
