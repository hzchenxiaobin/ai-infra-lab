<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">有序数组：相等的 target 连续成段</text>

  <!-- nums row -->
  <text x="20" y="74" font-size="12" fill="#888">nums:</text>
  <rect x="60" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="78" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="115" y="58" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="78" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="170" y="58" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="78" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="225" y="58" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <rect x="280" y="58" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="305" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <rect x="335" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="78" text-anchor="middle" font-size="12" fill="#333">10</text>

  <!-- index labels -->
  <text x="85" y="104" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="140" y="104" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="195" y="104" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="250" y="104" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">3 ←first</text>
  <text x="305" y="104" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">4 last→</text>
  <text x="360" y="104" text-anchor="middle" font-size="9" fill="#aaa">5</text>

  <!-- bracket over target segment -->
  <path d="M 230 50 L 230 44 L 325 44 L 325 50" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="277" y="38" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">target = 8 连续段</text>

  <!-- left / right pointers -->
  <text x="20" y="146" font-size="12" fill="#888">收缩：</text>
  <text x="85" y="146" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">left</text>
  <path d="M 85 150 L 85 132" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="360" y="146" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">right</text>
  <path d="M 360 150 L 360 132" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- mid -->
  <text x="195" y="172" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">mid</text>
  <path d="M 195 176 L 195 162" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>

  <!-- key idea box -->
  <rect x="40" y="196" width="440" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="218" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">有序 → 用二分每次砍掉一半</text>
  <text x="260" y="238" text-anchor="middle" font-size="11" fill="#555">每轮比较 nums[mid] 与 target，区间 [left,right] 折半</text>

  <!-- complexity -->
  <rect x="40" y="272" width="440" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">每次区间减半 → log₂(n) 轮 → O(log n)</text>
  <text x="260" y="314" text-anchor="middle" font-size="11" fill="#555">n = 10⁵ 时约 17 轮，远优于线性扫描</text>
  <text x="260" y="330" text-anchor="middle" font-size="10.5" fill="#888">但要找「第一个/最后一个」，命中后需继续收缩</text>
</svg>
