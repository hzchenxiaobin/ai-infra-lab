<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    示例演算：candiesCount = [7,4,5,3,8]，s = [0,7,11,16,19,27]
  </text>

  <!-- number line axis labels -->
  <text x="310" y="48" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    序号轴（每格 = 糖果全局序号，仅示意相对位置）
  </text>

  <!-- ===== Query 1: [0,2,2] true ===== -->
  <rect x="30" y="58" width="560" height="110" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.55"/>
  <text x="48" y="78" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">
    查询1  [0, 2, 2]：类型0，第2天，cap=2
  </text>

  <!-- number line -->
  <line x1="60" y1="110" x2="560" y2="110" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- type 0 interval [1,7] mapped to x 70..210 -->
  <rect x="70" y="100" width="140" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="115" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">类型0 [1,7]</text>
  <!-- day interval [least+1=3, most=6] -> x 98..154 -->
  <rect x="98" y="126" width="56" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="126" y="138" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">第2天 [3,6]</text>

  <text x="48" y="154" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">
    least=2 &lt; s[1]=7 ✓ ;  most=6 &gt; s[0]=0 ✓  →
  </text>
  <text x="540" y="154" text-anchor="end" font-size="12" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">true</text>

  <!-- ===== Query 2: [4,2,4] false ===== -->
  <rect x="30" y="176" width="560" height="110" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.45"/>
  <text x="48" y="196" text-anchor="start" font-size="12" fill="#b85450" filter="url(#rough2)">
    查询2  [4, 2, 4]：类型4，第2天，cap=4
  </text>

  <!-- number line -->
  <line x1="60" y1="228" x2="560" y2="228" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- type 4 interval [20,27] mapped far right x 430..560 -->
  <rect x="430" y="218" width="130" height="20" fill="#f0f0f0" stroke="#666" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="495" y="233" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">类型4 [20,27]</text>
  <!-- day interval [3,12] -> x 90..216 (far from type4) -->
  <rect x="90" y="244" width="126" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="153" y="256" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">第2天 [3,12]</text>
  <!-- gap arrow -->
  <path d="M216,252 L424,252" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="248" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">够不到</text>

  <text x="48" y="272" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">
    least=2 &lt; s[5]=27 ✓ ;  most=12 &gt; s[4]=19 ✗  →
  </text>
  <text x="540" y="272" text-anchor="end" font-size="12" fill="#b85450" filter="url(#rough2)" font-weight="bold">false</text>

  <!-- ===== Query 3: [2,13,10^9] true ===== -->
  <rect x="30" y="294" width="560" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.55"/>
  <text x="48" y="314" text-anchor="start" font-size="12" fill="#5a4a1a" filter="url(#rough2)">
    查询3  [2, 13, 10⁹]：类型2，第13天，cap=10⁹
  </text>

  <!-- number line -->
  <line x1="60" y1="346" x2="560" y2="346" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- type 2 interval [12,16] -> x 240..330 -->
  <rect x="240" y="336" width="90" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="285" y="351" text-anchor="middle" font-size="10" fill="#5a4a1a" filter="url(#rough2)">类型2 [12,16]</text>
  <!-- day interval [14, 1.4e10] -> starts at 266, extends way right -->
  <rect x="266" y="362" width="290" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="300" y="374" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">第13天 [14, 1.4×10¹⁰]</text>
  <!-- overlap marker -->
  <text x="410" y="374" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">← 覆盖类型2</text>

  <text x="48" y="392" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">
    least=13 &lt; s[3]=16 ✓ ;  most=1.4×10¹⁰ &gt; s[2]=11 ✓  →
  </text>
  <text x="540" y="392" text-anchor="end" font-size="12" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">true</text>

  <!-- ===== Bottom summary ===== -->
  <rect x="30" y="416" width="560" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="436" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">
    结果 = [true, false, true]  ✓
  </text>

</svg>
