<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">n=4 演算：状态数逐层累加</text>

  <!-- Layer table -->
  <!-- header -->
  <rect x="40" y="50" width="440" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">长度 k</text>
  <text x="240" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">说明</text>
  <text x="430" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">合计</text>

  <!-- row k=1 -->
  <rect x="40" y="84" width="440" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="106" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="240" y="106" text-anchor="middle" font-size="11" fill="#555">任意单点，6 面全合法</text>
  <text x="430" y="106" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">6</text>

  <!-- row k=2 -->
  <rect x="40" y="122" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="144" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="240" y="144" text-anchor="middle" font-size="11" fill="#555">22 个有序对 (a≠b, gcd=1)</text>
  <text x="430" y="144" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">22</text>

  <!-- row k=3 -->
  <rect x="40" y="160" width="440" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="182" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="240" y="182" text-anchor="middle" font-size="11" fill="#555">每对滑窗枚举合法 x</text>
  <text x="430" y="182" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">66</text>

  <!-- row k=4 -->
  <rect x="40" y="198" width="440" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="220" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="240" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">再滑一层 → 答案</text>
  <text x="430" y="220" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">184 ✓</text>

  <!-- arrows between layers -->
  <path d="M430 116 L430 122" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M430 154 L430 160" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M430 192 L430 198" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- example illegal sequence note -->
  <rect x="40" y="250" width="220" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="150" y="272" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">为何需要 prev2 (a)？</text>
  <text x="150" y="292" text-anchor="middle" font-size="11" fill="#555">序列 (1, 2, 1)：</text>
  <text x="150" y="308" text-anchor="middle" font-size="11" fill="#b85450">位置1=1 与 位置3=1</text>
  <text x="150" y="322" text-anchor="middle" font-size="11" fill="#b85450">|1-3|=2 ≤ 2，禁同值 ✗</text>
  <text x="150" y="336" text-anchor="middle" font-size="10" fill="#888">靠 a=位置2前一位 挡掉</text>

  <!-- example legal transition -->
  <rect x="280" y="250" width="200" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="380" y="272" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">合法滑窗示例</text>
  <text x="380" y="294" text-anchor="middle" font-size="12" fill="#333">(2, 3) → 放 x=1：</text>
  <text x="380" y="312" text-anchor="middle" font-size="11" fill="#4a7a3a">gcd(1,3)=1 ✓ x≠3 ✓ x≠2 ✓</text>
  <text x="380" y="330" text-anchor="middle" font-size="11" fill="#4a7a3a">新状态 (3, 1) 计入</text>
</svg>
