<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">奇偶映射：k 和 m 的奇偶性决定接收器编号</text>

  <!-- 轴标签 -->
  <text x="180" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">k 偶（西墙）</text>
  <text x="340" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">k 奇（东墙）</text>
  <text x="42" y="130" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">m 偶</text>
  <text x="42" y="146" text-anchor="middle" font-size="9" fill="#888">（南墙）</text>
  <text x="42" y="230" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">m 奇</text>
  <text x="42" y="246" text-anchor="middle" font-size="9" fill="#888">（北墙）</text>

  <!-- ===== 2×2 网格 ===== -->

  <!-- 左上 (k偶, m偶) → 不可能 -->
  <rect x="100" y="80" width="160" height="80" fill="#f6f8fb" stroke="#bbb" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="180" y="112" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold">不可能</text>
  <text x="180" y="132" text-anchor="middle" font-size="10" fill="#999">gcd(k,m)=1</text>
  <text x="180" y="148" text-anchor="middle" font-size="10" fill="#999">不能同为偶</text>

  <!-- 右上 (k奇, m偶) → 接收器 0 (SE) -->
  <rect x="260" y="80" width="160" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="340" y="112" text-anchor="middle" font-size="20" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="340" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a">东 + 南 = SE</text>
  <text x="340" y="150" text-anchor="middle" font-size="9" fill="#888">q 偶 → return 0</text>

  <!-- 左下 (k偶, m奇) → 接收器 2 (NW) -->
  <rect x="100" y="180" width="160" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="180" y="212" text-anchor="middle" font-size="20" fill="#b85450" font-weight="bold">2</text>
  <text x="180" y="234" text-anchor="middle" font-size="10" fill="#b85450">西 + 北 = NW</text>
  <text x="180" y="250" text-anchor="middle" font-size="9" fill="#888">p 偶 → return 2</text>

  <!-- 右下 (k奇, m奇) → 接收器 1 (NE) -->
  <rect x="260" y="180" width="160" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="340" y="212" text-anchor="middle" font-size="20" fill="#d6a040" font-weight="bold">1</text>
  <text x="340" y="234" text-anchor="middle" font-size="10" fill="#d6a040">东 + 北 = NE</text>
  <text x="340" y="250" text-anchor="middle" font-size="9" fill="#888">皆奇 → return 1</text>

  <!-- 分隔线 -->
  <line x1="260" y1="75" x2="260" y2="270" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <line x1="95" y1="170" x2="430" y2="170" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <!-- 底部说明 -->
  <rect x="40" y="280" width="440" height="44" fill="#f6f8fb" stroke="#bbb" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="11" fill="#555">去公因子 2 后：p 偶⇒k 偶⇒return 2，q 偶⇒m 偶⇒return 0</text>
  <text x="260" y="316" text-anchor="middle" font-size="11" fill="#555">两者皆奇 ⇒ return 1（p、q 不可能同为偶，因已去尽公因子 2）</text>
</svg>
