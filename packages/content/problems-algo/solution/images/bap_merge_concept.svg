<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrO2" markerWidth="9" markerHeight="9" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">前后拼接：A 的末词 == B 的首词，共享词只留一次</text>

  <!-- 短语 A: writing | code -->
  <text x="96" y="100" text-anchor="end" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">短语 A</text>
  <rect x="110" y="80" width="92" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="156" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">writing</text>
  <rect x="210" y="80" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="100" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">code</text>
  <text x="204" y="72" text-anchor="end" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">末词 ↓</text>

  <!-- 短语 B: code | rocks -->
  <text x="96" y="176" text-anchor="end" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">短语 B</text>
  <rect x="210" y="156" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="176" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">code</text>
  <rect x="286" y="156" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="326" y="176" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">rocks</text>
  <text x="204" y="148" text-anchor="end" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">首词 ↑</text>

  <!-- == between the two code boxes -->
  <path d="M245 112 L245 154" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrO)" marker-start="url(#arrO2)" filter="url(#rough2)"/>
  <text x="262" y="136" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">相同</text>

  <!-- merge arrow down to result -->
  <path d="M255 196 C 255 220, 255 232, 255 256" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="270" y="226" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">合并</text>

  <!-- 拼接结果: writing | code | rocks -->
  <text x="108" y="280" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">结果</text>
  <rect x="120" y="260" width="92" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="166" y="280" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">writing</text>
  <rect x="220" y="260" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="255" y="280" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">code</text>
  <rect x="296" y="260" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="280" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">rocks</text>
  <text x="386" y="280" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">← 共享词只留一次</text>

  <!-- bottom note -->
  <rect x="30" y="316" width="500" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="335" font-size="10.5" fill="#333" filter="url(#rough2)">核心：拼接 = <tspan fill="#446688" font-weight="bold">保留 A 全部</tspan> + <tspan fill="#b85450" font-weight="bold">去掉 B 的首词</tspan>（它等于 A 的末词，已由 A 提供）</text>
</svg>
