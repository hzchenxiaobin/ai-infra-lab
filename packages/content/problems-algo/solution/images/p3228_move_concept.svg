<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="430" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：一次操作 = 一个 1 越过右侧整段 0，与该段长度无关</text>
  <text x="290" y="40" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每段「左侧有 1」的极大 0 段，恰好贡献「左侧 1 的总数」次操作</text>

  <!-- Panel A: 操作语义 -->
  <rect x="22" y="52" width="536" height="156" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 操作语义（选 i = 0）</text>

  <path d="M 79 84 C 95 60, 177 60, 193 84" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="136" y="80" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">跳过整段 00</text>

  <text x="52" y="110" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">s =</text>
  <rect x="62" y="90" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="79" y="110" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="100" y="90" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="117" y="110" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">0</text>
  <rect x="138" y="90" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="110" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">0</text>
  <rect x="176" y="90" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="193" y="110" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="214" y="90" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="231" y="110" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="252" y="90" width="34" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="269" y="110" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="290" y="90" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="110" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="340" y="102" font-size="10" fill="#555" filter="url(#rough2)">s[0] 的 1 一路右移，</text>
  <text x="340" y="118" font-size="10" fill="#555" filter="url(#rough2)">一次跳过整段 00，</text>
  <text x="340" y="134" font-size="10" fill="#555" filter="url(#rough2)">停在下一个 1 的左边</text>

  <text x="52" y="154" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">→</text>
  <rect x="62" y="134" width="34" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="79" y="154" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="100" y="134" width="34" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="117" y="154" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="138" y="134" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="154" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="176" y="134" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="193" y="154" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="214" y="134" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="231" y="154" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="252" y="134" width="34" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="269" y="154" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="290" y="134" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="154" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="290" y="192" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">落点只能是下一个 1 的紧左侧或串尾 → 一段 0 再长，跨过它也只花 1 次操作</text>

  <!-- Panel B: 计数公式 -->
  <rect x="22" y="220" width="536" height="200" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="242" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 计数公式：每段 0 贡献「左侧 1 的总数」</text>

  <rect x="90" y="260" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="283" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="138" y="260" width="84" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="283" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">00</text>
  <rect x="226" y="260" width="84" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="268" y="283" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">11</text>
  <rect x="314" y="260" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="336" y="283" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="362" y="260" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="384" y="283" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="490" y="282" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（绿 = 1 段，橙 = 0 段）</text>

  <path d="M 180 296 L 180 312" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 336 296 L 336 312" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <text x="180" y="330" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">+1：左边共 1 个 1</text>
  <text x="336" y="330" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">+3：左边共 3 个 1</text>

  <text x="290" y="360" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">答案 = 1 + 3 = 4</text>

  <text x="290" y="382" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">换个角度：每个 1 各贡献「它右侧的 0 段数」→ 2 + 1 + 1 + 0 = 4</text>
  <text x="290" y="400" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">串首 0 段左边没有 1 → 贡献 0；串尾 0 段照样贡献（1 能一路滑到末端）</text>
</svg>
