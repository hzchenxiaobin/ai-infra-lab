<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">132 模式：左小（1）、中大（3）、右中（2）</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">下标 i &lt; j &lt; k，但大小是 nums[i] &lt; nums[k] &lt; nums[j]</text>

  <!-- ===== index axis ===== -->
  <text x="40" y="86" font-size="11" fill="#888" font-weight="bold">下标</text>
  <g font-size="10" fill="#888">
    <text x="120" y="86" text-anchor="middle">0</text>
    <text x="200" y="86" text-anchor="middle">1</text>
    <text x="280" y="86" text-anchor="middle">2</text>
    <text x="360" y="86" text-anchor="middle">3</text>
  </g>

  <!-- ===== array cells ===== -->
  <!-- cell 0: 3 (neutral) -->
  <rect x="96" y="96" width="48" height="40" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="120" y="122" text-anchor="middle" font-size="14" fill="#999">3</text>

  <!-- cell 1: 1 → "1" (smallest), blue -->
  <rect x="176" y="96" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="122" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <text x="200" y="156" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">"1"</text>
  <text x="200" y="170" text-anchor="middle" font-size="9" fill="#446688">最小·最左</text>

  <!-- cell 2: 4 → "3" (largest), red -->
  <rect x="256" y="96" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="122" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">4</text>
  <text x="280" y="156" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">"3"</text>
  <text x="280" y="170" text-anchor="middle" font-size="9" fill="#b85450">最大·中间</text>

  <!-- cell 3: 2 → "2" (middle), green -->
  <rect x="336" y="96" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="122" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="360" y="156" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">"2"</text>
  <text x="360" y="170" text-anchor="middle" font-size="9" fill="#4a7a3a">居中·最右</text>

  <!-- index order arrow i < j < k -->
  <path d="M 200 88 Q 280 64 360 88" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="10" fill="#888">下标递增：i &lt; j &lt; k</text>

  <!-- ===== size relationship ===== -->
  <text x="40" y="212" font-size="11" fill="#888" font-weight="bold">大小关系</text>

  <!-- three bubbles: 1 (blue), 2 (green), 3 (red) arranged to show 1 < 2 < 3 -->
  <ellipse cx="120" cy="246" rx="32" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="252" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <text x="120" y="284" text-anchor="middle" font-size="9" fill="#446688">nums[i]</text>

  <ellipse cx="280" cy="246" rx="32" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="280" y="284" text-anchor="middle" font-size="9" fill="#4a7a3a">nums[k]</text>

  <ellipse cx="440" cy="246" rx="32" ry="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="252" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">3</text>
  <text x="440" y="284" text-anchor="middle" font-size="9" fill="#b85450">nums[j]</text>

  <!-- less-than arrows between bubbles -->
  <path d="M 156 246 L 244 246" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="240" text-anchor="middle" font-size="10" fill="#666">&lt;</text>
  <path d="M 316 246 L 404 246" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="240" text-anchor="middle" font-size="10" fill="#666">&lt;</text>

  <!-- ===== summary box ===== -->
  <rect x="30" y="306" width="500" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="328" font-size="11" fill="#d6a040" font-weight="bold">关键直觉：</text>
  <text x="50" y="346" font-size="10" fill="#555">• 下标顺序（i&lt;j&lt;k）与大小顺序（1&lt;2&lt;3）"错位"——大小是 1、3、2</text>
  <text x="50" y="362" font-size="10" fill="#555">• 例 [3,1,4,2]：取 i=1,j=2,k=3 → 1 &lt; 2 &lt; 4 ✓，即子序列 [1,4,2]</text>
  <text x="50" y="378" font-size="10" fill="#d6a040" font-weight="bold">策略：先把"3"和"2"配对，再去它们左边找比"2"小的"1"</text>
</svg>
