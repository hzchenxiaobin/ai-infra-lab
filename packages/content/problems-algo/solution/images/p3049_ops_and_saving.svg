<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：「一键清零」把 nums[v]+1 秒压到 2 秒</text>
  <text x="260" y="52" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">changeIndices = [1,3,2,2,2,2,3]，nums = [3,2,3]（示例 1），橙色 = 各下标最早出现秒</text>

  <!-- 时间轴格子：普通秒（蓝） -->
  <rect x="48" y="96" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="104" y="96" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="160" y="96" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="216" y="96" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="272" y="96" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="328" y="96" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="384" y="96" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="74" y="123" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="130" y="123" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="186" y="123" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="242" y="123" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="298" y="123" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="354" y="123" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="410" y="123" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>

  <text x="74" y="158" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">秒1</text>
  <text x="130" y="158" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">秒2</text>
  <text x="186" y="158" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">秒3</text>
  <text x="242" y="158" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">秒4</text>
  <text x="298" y="158" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">秒5</text>
  <text x="354" y="158" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">秒6</text>
  <text x="410" y="158" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">秒7</text>

  <text x="74" y="86" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">清零1</text>
  <text x="130" y="86" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">清零3</text>
  <text x="186" y="86" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">清零2</text>

  <!-- 行 A：硬磨 -->
  <text x="48" y="196" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">下标 1（值 3）硬磨：</text>
  <rect x="210" y="182" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="256" y="182" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="302" y="182" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="348" y="182" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="231" y="200" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">减1</text>
  <text x="277" y="200" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">减1</text>
  <text x="323" y="200" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">减1</text>
  <text x="369" y="200" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">标记✓</text>
  <text x="404" y="200" font-size="12.5" fill="#333" filter="url(#rough2)">共 4 秒</text>

  <!-- 行 B：清零 -->
  <text x="48" y="252" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">改用清零（秒 1）：</text>
  <rect x="210" y="238" width="76" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="292" y="238" width="98" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="248" y="256" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">清零→0</text>
  <text x="341" y="256" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">之后任意秒标记✓</text>
  <text x="404" y="256" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">2 秒，净省 2</text>

  <path d="M205,230 C205,232 205,234 205,236" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部守则框 -->
  <rect x="36" y="284" width="448" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="306" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">清零操作三条守则：</text>
  <text x="52" y="324" font-size="12" fill="#333" filter="url(#rough2)">① 只在该下标最早出现秒用（给更晚的标记留最大窗口）；② 必须设成 0；</text>
  <text x="52" y="340" font-size="12" fill="#333" filter="url(#rough2)">③ 值为 0 别用（倒赔 1 秒，净省 nums[v]−1 = −1）；值为 1 白忙（净省 0）</text>
</svg>
