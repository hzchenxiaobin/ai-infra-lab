<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐位查集合，三位全部命中 → true</text>

  <!-- header: built set -->
  <text x="40" y="52" font-size="11" fill="#888">预处理后集合 sim = {great#fine, fine#great, acting#drama, drama#acting, skills#talent, talent#skills}</text>

  <!-- column headers -->
  <text x="60" y="84" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">轮次</text>
  <text x="170" y="84" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">s1[i]</text>
  <text x="270" y="84" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">s2[i]</text>
  <text x="360" y="84" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">查集合</text>
  <text x="490" y="84" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">结果</text>

  <!-- separator -->
  <path d="M 30 92 L 560 92" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Row 1: i=0 ===== -->
  <text x="60" y="122" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">i=0</text>
  <rect x="130" y="104" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">great</text>
  <rect x="230" y="104" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">fine</text>
  <text x="360" y="124" text-anchor="middle" font-size="11" fill="#444">"great#fine" ∈ sim?</text>
  <text x="490" y="124" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">命中 ✓</text>

  <!-- ===== Row 2: i=1 ===== -->
  <text x="60" y="172" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">i=1</text>
  <rect x="130" y="154" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="174" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">acting</text>
  <rect x="230" y="154" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="174" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">drama</text>
  <text x="360" y="174" text-anchor="middle" font-size="11" fill="#444">"acting#drama" ∈ sim?</text>
  <text x="490" y="174" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">命中 ✓</text>

  <!-- ===== Row 3: i=2 ===== -->
  <text x="60" y="222" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">i=2</text>
  <rect x="130" y="204" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="224" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">skills</text>
  <rect x="230" y="204" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="224" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">talent</text>
  <text x="360" y="224" text-anchor="middle" font-size="11" fill="#444">"skills#talent" ∈ sim?</text>
  <text x="490" y="224" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">命中 ✓</text>

  <!-- highlight band for all rows -->
  <rect x="30" y="96" width="530" height="142" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>

  <!-- legend / notes -->
  <rect x="30" y="256" width="520" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="278" font-size="11" fill="#444" font-weight="bold">对照：</text>
  <text x="48" y="298" font-size="11" fill="#666">• 示例 2：i=0 时 great == great → 走「同一单词」分支，直接通过，无需查集合</text>
  <text x="48" y="316" font-size="11" fill="#666">• 示例 3：great != doubleplusgood 且 sim 为空 → 查不到 → 返回 false</text>
  <text x="48" y="334" font-size="11" fill="#b85450">• 双向存键使查询只查一个方向即可命中（great#fine 与 fine#great 都在集合中）</text>

  <!-- footer -->
  <text x="290" y="372" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">最终答案：true</text>
  <text x="290" y="392" text-anchor="middle" font-size="10" fill="#888">建集合 O(m) + 逐位 O(1) 查询共 O(n)，总复杂度 O(n + m)</text>
  <text x="290" y="410" text-anchor="middle" font-size="10" fill="#888">相似不传递：集合只存直接配对，不合并传递闭包</text>
</svg>
