<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1 演算：斜率变化 2 次 → 3 段</text>

  <!-- ===== Chart area ===== -->
  <!-- axes -->
  <line x1="60" y1="70" x2="60" y2="320" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="60" y1="320" x2="490" y2="320" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- y-axis price labels 1..7 -->
  <!-- price p -> y = 320 - (p-1)*40 ; p7=60,p6=100,...,p1=320 -->
  <text x="50" y="324" text-anchor="end" font-size="9.5" fill="#888">1</text>
  <text x="50" y="284" text-anchor="end" font-size="9.5" fill="#888">2</text>
  <text x="50" y="244" text-anchor="end" font-size="9.5" fill="#888">3</text>
  <text x="50" y="204" text-anchor="end" font-size="9.5" fill="#888">4</text>
  <text x="50" y="164" text-anchor="end" font-size="9.5" fill="#888">5</text>
  <text x="50" y="124" text-anchor="end" font-size="9.5" fill="#888">6</text>
  <text x="50" y="84" text-anchor="end" font-size="9.5" fill="#888">7</text>
  <text x="40" y="200" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 40 200)">价格</text>

  <!-- x-axis day labels 1..8 : day i -> x = 70 + (i-1)*57 -->
  <text x="70" y="336" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <text x="127" y="336" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <text x="184" y="336" text-anchor="middle" font-size="9.5" fill="#888">3</text>
  <text x="241" y="336" text-anchor="middle" font-size="9.5" fill="#888">4</text>
  <text x="298" y="336" text-anchor="middle" font-size="9.5" fill="#888">5</text>
  <text x="355" y="336" text-anchor="middle" font-size="9.5" fill="#888">6</text>
  <text x="412" y="336" text-anchor="middle" font-size="9.5" fill="#888">7</text>
  <text x="469" y="336" text-anchor="middle" font-size="9.5" fill="#888">8</text>
  <text x="270" y="354" text-anchor="middle" font-size="10" fill="#888">日期</text>

  <!-- points: (1,7)(2,6)(3,5)(4,4)(5,4)(6,3)(7,2)(8,1) -->
  <!-- (70,80)(127,120)(184,160)(241,200)(298,200)(355,240)(412,280)(469,320) -->

  <!-- Segment 1 (red): (70,80)-(127,120)-(184,160)-(241,200) -->
  <polyline points="70,80 127,120 184,160 241,200" fill="none" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
  <!-- Segment 2 (blue): (241,200)-(298,200) -->
  <line x1="241" y1="200" x2="298" y2="200" stroke="#446688" stroke-width="2.6" filter="url(#rough2)"/>
  <!-- Segment 3 (green): (298,200)-(355,240)-(412,280)-(469,320) -->
  <polyline points="298,200 355,240 412,280 469,320" fill="none" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>

  <!-- dots -->
  <circle cx="70" cy="80" r="4.5" fill="#fff" stroke="#333" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="127" cy="120" r="4.5" fill="#fff" stroke="#333" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="184" cy="160" r="4.5" fill="#fff" stroke="#333" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="241" cy="200" r="4.5" fill="#fff" stroke="#333" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="298" cy="200" r="4.5" fill="#fff" stroke="#333" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="355" cy="240" r="4.5" fill="#fff" stroke="#333" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="412" cy="280" r="4.5" fill="#fff" stroke="#333" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="469" cy="320" r="4.5" fill="#fff" stroke="#333" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- segment labels -->
  <text x="155" y="108" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">段1（斜率−1）</text>
  <text x="269" y="192" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">段2（斜率0）</text>
  <text x="383" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">段3（斜率−1）</text>

  <!-- slope-change markers at (4,4) and (5,4) -->
  <circle cx="241" cy="200" r="8.5" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="298" cy="200" r="8.5" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="241" y="178" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">变!</text>
  <text x="298" y="178" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">变!</text>

  <!-- ===== slope strip below ===== -->
  <text x="60" y="372" font-size="10.5" fill="#666" font-weight="bold">相邻斜率</text>
  <rect x="120" y="360" width="52" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="146" y="375" text-anchor="middle" font-size="10" fill="#333">−1</text>
  <rect x="174" y="360" width="52" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="200" y="375" text-anchor="middle" font-size="10" fill="#333">−1</text>
  <rect x="228" y="360" width="52" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="254" y="375" text-anchor="middle" font-size="10" fill="#333">−1</text>
  <rect x="282" y="360" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="308" y="375" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <rect x="336" y="360" width="52" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="362" y="375" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">−1</text>
  <rect x="390" y="360" width="52" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="416" y="375" text-anchor="middle" font-size="10" fill="#333">−1</text>
  <rect x="444" y="360" width="52" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="470" y="375" text-anchor="middle" font-size="10" fill="#333">−1</text>

  <!-- result -->
  <text x="270" y="394" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">变化 2 次 → 段数 = 2 + 1 = 3 ✓</text>
</svg>
