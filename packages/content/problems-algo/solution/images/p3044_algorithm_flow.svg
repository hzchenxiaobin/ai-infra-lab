<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 536" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrY" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="536" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：枚举（起点 × 方向）→ 沿射线步进构数 → 预筛 + 试除 → 双关键字取最大</text>

  <!-- 1 enumerate start -->
  <rect x="90" y="36" width="280" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="230" y="54" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">① 枚举起点 (i, j)</text>
  <text x="230" y="71" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">m×n ≤ 36 个格子</text>

  <path d="M 230 78 L 230 92" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 2 enumerate dir -->
  <rect x="90" y="96" width="280" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="230" y="114" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② 枚举 8 方向 (dx, dy)，初始化 num = 0</text>
  <text x="230" y="131" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">(x, y) = (i, j)，方向一经选定不再改变</text>

  <path d="M 230 138 L 230 152" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 3 in-bounds diamond -->
  <polygon points="230,156 322,186 230,216 138,186" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="190" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">③ (x, y) 在界内？</text>

  <text x="340" y="178" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 322 186 L 356 186" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="360" y="164" width="176" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="448" y="182" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">换下一方向 / 下一起点 ↺</text>
  <text x="448" y="198" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">全部取完 → 转 ⑦</text>
  <path d="M 448 164 L 448 117 L 374 117" stroke="#999" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrY)" filter="url(#rough2)"/>

  <text x="240" y="233" text-anchor="start" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 230 216 L 230 242" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 4 build number -->
  <rect x="90" y="246" width="280" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="263" text-anchor="middle" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">④ num ← num×10 + mat[x][y]；ds ← ds+d</text>
  <text x="230" y="279" text-anchor="middle" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">(x, y) ← (x+dx, y+dy) 步进</text>

  <path d="M 230 286 L 230 300" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 5 filter diamond -->
  <polygon points="230,304 340,334 230,364 120,334" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="330" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">⑤ num &gt; 10 且</text>
  <text x="230" y="345" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">预筛通过？</text>

  <path d="M 342 331 L 354 324" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="356" y="318" text-anchor="start" font-size="9" fill="#888" filter="url(#rough2)">预筛：末位 ∈ {1,3,7,9}</text>
  <text x="356" y="331" text-anchor="start" font-size="9" fill="#888" filter="url(#rough2)">且数位和不被 3 整除</text>

  <text x="108" y="326" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="62" y="352" text-anchor="start" font-size="9" fill="#888" filter="url(#rough2)">≤10 或预筛拦截，跳过</text>

  <!-- return trunk: count / skip both loop back to diamond 3 -->
  <path d="M 120 334 L 56 334" stroke="#999" stroke-width="1.4" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <path d="M 90 424 L 56 424 L 56 186 L 132 186" stroke="#999" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrY)" filter="url(#rough2)"/>
  <text x="62" y="400" text-anchor="start" font-size="9" fill="#888" filter="url(#rough2)">↺ 计数后继续步进</text>

  <text x="240" y="386" text-anchor="start" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 230 364 L 230 400" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 6 prime check -->
  <rect x="90" y="404" width="280" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="421" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">⑥ 试除到 √num 判素：素数 ⇒ cnt[num]++</text>
  <text x="230" y="437" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">（√999999 &lt; 1000，单次判素 ≤ 千次除法）</text>

  <!-- done route to 7 -->
  <path d="M 520 208 L 520 477 L 374 477" stroke="#999" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrY)" filter="url(#rough2)"/>
  <text x="470" y="300" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">枚举完 →</text>

  <!-- 7 final -->
  <rect x="90" y="456" width="280" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="474" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">⑦ 遍历 cnt：按（频次, 数值）双关键字取最大</text>
  <text x="230" y="491" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">cnt 为空返回 −1；频次并列取更大的素数</text>

  <!-- note -->
  <rect x="18" y="508" width="524" height="20" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="522" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">💡 总工作量上界 ≈ 1728 × 1000 ≈ 1.7×10⁶ 次除法；O(1) 预筛（末位 + 数位和）再拦下约七成候选</text>
</svg>
