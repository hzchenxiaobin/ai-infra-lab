<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：示例 1 通过 vs 示例 3 卡死</text>

  <!-- ===== panel 1: example 1 ===== -->
  <text x="260" y="50" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：nums = [8,4,2,30,15] → true</text>

  <rect x="76" y="54" width="184" height="72" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="7 5" rx="10" filter="url(#rough2)"/>
  <rect x="268" y="54" width="120" height="72" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="7 5" rx="10" filter="url(#rough2)"/>

  <rect x="84" y="62" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="109" y="85" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="140" y="62" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="165" y="85" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="196" y="62" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="221" y="85" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="276" y="62" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="301" y="85" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">30</text>
  <rect x="332" y="62" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="357" y="85" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">15</text>

  <circle cx="109" cy="116" r="10" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="109" y="120" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="165" cy="116" r="10" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="165" y="120" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="221" cy="116" r="10" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="221" y="120" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="301" cy="116" r="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="301" y="120" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <circle cx="357" cy="116" r="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="357" y="120" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="46" y="120" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">置位数</text>

  <path d="M 264 48 L 264 132" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>

  <text x="168" y="146" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">段①（置位数=1）</text>
  <text x="328" y="146" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">段②（置位数=4）</text>

  <text x="230" y="170" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">边界：max(段①)=8 ≤ min(段②)=15，全员迈过门槛 ✓</text>

  <!-- ===== panel 2: example 3 ===== -->
  <text x="260" y="200" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 3：nums = [3,16,8,4,2] → false</text>

  <rect x="76" y="204" width="66" height="72" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="7 5" rx="10" filter="url(#rough2)"/>
  <rect x="162" y="204" width="232" height="72" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="7 5" rx="10" filter="url(#rough2)"/>

  <rect x="84" y="212" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="109" y="235" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="170" y="212" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="195" y="235" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">16</text>
  <rect x="226" y="212" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="251" y="235" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="282" y="212" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="307" y="235" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="338" y="212" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="363" y="235" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <circle cx="109" cy="266" r="10" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="109" y="270" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="195" cy="266" r="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="195" y="270" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="251" cy="266" r="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="251" y="270" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="307" cy="266" r="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="307" y="270" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="363" cy="266" r="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="363" y="270" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <path d="M 152 198 L 152 282" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>

  <text x="109" y="296" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">段①（置位数=2）</text>
  <text x="278" y="296" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">段②（置位数=1）</text>

  <text x="200" y="318" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">门槛 prevMax = max(段①) = 3</text>
  <text x="200" y="336" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">16、8、4 都迈得过，唯独 2 &lt; 3 ✗</text>
  <path d="M 300 330 C 340 326 364 306 363 284" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="48" y="348" width="424" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="366" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">直观画面：2 想排到 3 前面，但 2（置位数 1）与 3（置位数 2）不同段，</text>
  <text x="260" y="384" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">这堵墙永远翻不过去 → return false</text>
</svg>
