<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    示例 dp 表：stones = [5,3,1,4,2]
  </text>

  <!-- 表头：列 j=0..4 -->
  <g filter="url(#rough2)" font-size="12" fill="#888">
    <text x="135" y="62" text-anchor="middle">j=0</text>
    <text x="195" y="62" text-anchor="middle">j=1</text>
    <text x="255" y="62" text-anchor="middle">j=2</text>
    <text x="315" y="62" text-anchor="middle">j=3</text>
    <text x="375" y="62" text-anchor="middle">j=4</text>
  </g>
  <!-- 行头：i=0..4 -->
  <g filter="url(#rough2)" font-size="12" fill="#888">
    <text x="92" y="96" text-anchor="end">i=0</text>
    <text x="92" y="136" text-anchor="end">i=1</text>
    <text x="92" y="176" text-anchor="end">i=2</text>
    <text x="92" y="216" text-anchor="end">i=3</text>
    <text x="92" y="256" text-anchor="end">i=4</text>
  </g>

  <!-- 上三角格子，格宽 56 高 36，起点 (107, 76) -->
  <g filter="url(#rough2)">
    <!-- 行 0 -->
    <rect x="107" y="76" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="163" y="76" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="219" y="76" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="275" y="76" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="331" y="76" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <!-- 行 1 -->
    <rect x="163" y="116" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="219" y="116" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="275" y="116" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="331" y="116" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <!-- 行 2 -->
    <rect x="219" y="156" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="275" y="156" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="331" y="156" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <!-- 行 3 -->
    <rect x="275" y="196" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="331" y="196" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <!-- 行 4 -->
    <rect x="331" y="236" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>

  <!-- 数值 -->
  <g filter="url(#rough2)" font-size="15" fill="#333">
    <!-- len 1 对角线 (蓝) -->
    <text x="135" y="100" text-anchor="middle">0</text>
    <text x="191" y="140" text-anchor="middle">0</text>
    <text x="247" y="180" text-anchor="middle">0</text>
    <text x="303" y="220" text-anchor="middle">0</text>
    <text x="359" y="260" text-anchor="middle">0</text>
    <!-- len 2 -->
    <text x="191" y="100" text-anchor="middle" fill="#4a7a3a">5</text>
    <text x="247" y="140" text-anchor="middle" fill="#4a7a3a">3</text>
    <text x="303" y="180" text-anchor="middle" fill="#4a7a3a">4</text>
    <text x="359" y="220" text-anchor="middle" fill="#4a7a3a">4</text>
    <!-- len 3 -->
    <text x="247" y="100" text-anchor="middle" fill="#4a7a3a">3</text>
    <text x="303" y="140" text-anchor="middle" fill="#4a7a3a">1</text>
    <text x="359" y="180" text-anchor="middle" fill="#4a7a3a">2</text>
    <!-- len 4 -->
    <text x="303" y="100" text-anchor="middle" fill="#4a7a3a">7</text>
    <text x="359" y="140" text-anchor="middle" fill="#4a7a3a">7</text>
    <!-- len 5 答案 -->
    <text x="359" y="100" text-anchor="middle" fill="#b85450" font-size="18">6</text>
  </g>

  <!-- 图例与说明 -->
  <rect x="40" y="300" width="480" height="104" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="324" font-size="13" fill="#333" filter="url(#rough2)">
    填充过程（按长度 len 递增）：
  </text>
  <text x="60" y="346" font-size="12" fill="#333" filter="url(#rough2)">
    len=1 对角线全 0（只剩一堆，移除后无剩余，得分 0）
  </text>
  <text x="60" y="364" font-size="12" fill="#333" filter="url(#rough2)">
    len=2：dp[0][1]=max(3−0, 5−0)=5；dp[3][4]=max(2−0, 4−0)=4
  </text>
  <text x="60" y="382" font-size="12" fill="#333" filter="url(#rough2)">
    len=5：dp[0][4]=max(10−dp[1][4], 13−dp[0][3])=max(10−7, 13−7)=6
  </text>
  <text x="60" y="398" font-size="12" fill="#b85450" filter="url(#rough2)">
    答案 dp[0][4]=6：爱丽丝移除右端 2 得 13 分，净赚 6。
  </text>
</svg>
