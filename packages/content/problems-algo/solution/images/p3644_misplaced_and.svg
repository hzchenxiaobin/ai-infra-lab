<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333"
        filter="url(#rough2)">核心观察：答案 = 所有「错位元素」的按位 AND</text>

  <!-- 数组格子 nums = [0,3,2,1] -->
  <rect x="40" y="76" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="96" y="76" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="152" y="76" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="208" y="76" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>

  <text x="68" y="104" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">0</text>
  <text x="124" y="104" text-anchor="middle" font-size="16" fill="#b3541e" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="180" y="104" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <text x="236" y="104" text-anchor="middle" font-size="16" fill="#b3541e" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 下标 -->
  <text x="68" y="138" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="124" y="138" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="180" y="138" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="236" y="138" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=3</text>

  <!-- 对位/错位标记 -->
  <text x="68" y="68" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="124" y="68" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="180" y="68" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="236" y="68" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 图例 -->
  <rect x="40" y="156" width="12" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="58" y="167" font-size="11" fill="#4a7a3a" filter="url(#rough2)">对位 nums[i]==i，不用动</text>
  <rect x="40" y="174" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="58" y="185" font-size="11" fill="#b3541e" filter="url(#rough2)">错位，必须至少参与一次交换</text>

  <!-- 右侧竖式 -->
  <text x="330" y="78" font-size="13" fill="#333" filter="url(#rough2)">错位元素：3 和 1</text>
  <text x="348" y="108" font-size="14" fill="#333" filter="url(#rough2)">3 = 0b<tspan font-weight="bold">1</tspan>1</text>
  <text x="348" y="132" font-size="14" fill="#333" filter="url(#rough2)">1 = 0b<tspan font-weight="bold">0</tspan>1</text>
  <path d="M 340 142 L 450 142" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="160" font-size="13" fill="#446688" filter="url(#rough2)">&amp;</text>
  <text x="348" y="164" font-size="14" fill="#b3541e" font-weight="bold" filter="url(#rough2)">m = 0b01 = 1</text>
  <path d="M 452 152 C 470 152 472 128 452 122" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="462" y="112" font-size="11" fill="#b85450" filter="url(#rough2)">答案!</text>

  <!-- 要点框 1：上界 -->
  <rect x="36" y="212" width="492" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="234" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 上界：若 x 与 y 交换且 x AND y = k，则 k 的每个 1 位都在 x 中；</text>
  <text x="50" y="254" font-size="12" fill="#446688" filter="url(#rough2)">每个错位元素都得动 ⇒ 都含 k 的全部 1 位 ⇒ k ⊆ m = AND(全体错位元素)</text>

  <!-- 要点框 2：可行 -->
  <rect x="36" y="286" width="492" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="308" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 可行：m ≤ min(错位元素) ≤ n−1，排列必含值 m；</text>
  <text x="50" y="328" font-size="12" fill="#4a7a3a" filter="url(#rough2)">且 m AND x = m 对一切错位 x 成立 ⇒ m 是「万能中转」⇒ k = m 必能排序</text>
</svg>
