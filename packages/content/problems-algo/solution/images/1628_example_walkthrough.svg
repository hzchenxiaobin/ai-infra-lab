<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="740" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="370" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：后缀 [3, 4, +, 2, *, 5, −] 的栈构造过程</text>

  <!-- Column centers: 70, 170, 270, 370, 470, 570, 670 -->

  <!-- Token headers (what is consumed this step) -->
  <g filter="url(#rough2)">
    <rect x="28"  y="44" width="84" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="128" y="44" width="84" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="228" y="44" width="84" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="328" y="44" width="84" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="428" y="44" width="84" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="528" y="44" width="84" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="628" y="44" width="84" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="70"  y="62" filter="url(#rough2)">3</text>
    <text x="170" y="62" filter="url(#rough2)">4</text>
    <text x="270" y="62" filter="url(#rough2)">+</text>
    <text x="370" y="62" filter="url(#rough2)">2</text>
    <text x="470" y="62" filter="url(#rough2)">*</text>
    <text x="570" y="62" filter="url(#rough2)">5</text>
    <text x="670" y="62" filter="url(#rough2)">−</text>
  </g>

  <!-- Inter-column arrows -->
  <g stroke="#aaa" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)">
    <path d="M 118 57 L 124 57"/>
    <path d="M 218 57 L 224 57"/>
    <path d="M 318 57 L 324 57"/>
    <path d="M 418 57 L 424 57"/>
    <path d="M 518 57 L 524 57"/>
    <path d="M 618 57 L 624 57"/>
  </g>

  <!-- Stack label -->
  <text x="20" y="200" font-size="11" fill="#888" filter="url(#rough2)">栈↓</text>
  <text x="14" y="340" font-size="10" fill="#888" filter="url(#rough2)">底</text>

  <!-- Column 1: [3] -->
  <g filter="url(#rough2)">
    <rect x="28" y="318" width="84" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
  </g>
  <text x="70" y="336" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- Column 2: [3, 4] -->
  <g filter="url(#rough2)">
    <rect x="128" y="318" width="84" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="128" y="288" width="84" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
  </g>
  <text x="170" y="336" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="170" y="306" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- Column 3: [+(3,4)] -->
  <g filter="url(#rough2)">
    <rect x="228" y="318" width="84" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
  </g>
  <text x="270" y="336" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">(3+4)</text>

  <!-- Column 4: [(3+4), 2] -->
  <g filter="url(#rough2)">
    <rect x="328" y="318" width="84" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="328" y="288" width="84" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
  </g>
  <text x="370" y="336" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">(3+4)</text>
  <text x="370" y="306" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- Column 5: [((3+4)*2)] -->
  <g filter="url(#rough2)">
    <rect x="428" y="318" width="84" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
  </g>
  <text x="470" y="336" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">((3+4)×2)</text>

  <!-- Column 6: [((3+4)*2), 5] -->
  <g filter="url(#rough2)">
    <rect x="528" y="318" width="84" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="528" y="288" width="84" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
  </g>
  <text x="570" y="336" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">((3+4)×2)</text>
  <text x="570" y="306" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- Column 7: [((3+4)*2 - 5)] -->
  <g filter="url(#rough2)">
    <rect x="628" y="318" width="84" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4"/>
  </g>
  <text x="670" y="336" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">((3+4)×2−5)</text>

  <!-- Step annotations under each column -->
  <g font-size="10" fill="#666" text-anchor="middle">
    <text x="70"  y="362" filter="url(#rough2)">压 NumberNode(3)</text>
    <text x="170" y="362" filter="url(#rough2)">压 NumberNode(4)</text>
    <text x="270" y="362" filter="url(#rough2)">弹 4,3 → 建 +(3,4)</text>
    <text x="370" y="362" filter="url(#rough2)">压 NumberNode(2)</text>
    <text x="470" y="362" filter="url(#rough2)">弹 2,(3+4) → 建 *</text>
    <text x="570" y="362" filter="url(#rough2)">压 NumberNode(5)</text>
    <text x="670" y="362" filter="url(#rough2)">弹 5,(*) → 建 −</text>
  </g>

  <!-- Final result -->
  <rect x="220" y="372" width="300" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="370" y="389" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">栈仅剩 1 元 = 根；root.evaluate() = (3+4)×2 − 5 = 9</text>
</svg>
