<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.8"/>
    </marker>
    <marker id="arrGr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#aaaaaa" stroke-width="1.3"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">power = [3,1,4] 的状压 DP（节点 = mask，边权 = ⌈power[i]/k⌉）</text>

  <!-- level labels -->
  <text x="14" y="94" font-size="11" fill="#888">k=0</text>
  <text x="14" y="174" font-size="11" fill="#888">k=1</text>
  <text x="14" y="274" font-size="11" fill="#888">k=2</text>
  <text x="14" y="374" font-size="11" fill="#888">k=3</text>

  <!-- ===== suboptimal edges (drawn first, behind nodes) ===== -->
  <!-- 0->1 subopt -->
  <path d="M 264 110 L 116 150" stroke="#aaaaaa" stroke-width="1" fill="none" stroke-dasharray="4,3" marker-end="url(#arrGr)" filter="url(#rough2)"/>
  <text x="150" y="124" font-size="10" fill="#999">杀怪0 +3</text>
  <path d="M 296 110 L 444 150" stroke="#aaaaaa" stroke-width="1" fill="none" stroke-dasharray="4,3" marker-end="url(#arrGr)" filter="url(#rough2)"/>
  <text x="380" y="124" font-size="10" fill="#999">杀怪2 +4</text>

  <!-- 1->2 subopt -->
  <path d="M 100 190 L 100 250" stroke="#aaaaaa" stroke-width="1" fill="none" stroke-dasharray="4,3" marker-end="url(#arrGr)" filter="url(#rough2)"/>
  <text x="108" y="224" font-size="10" fill="#999">杀怪1 +1</text>
  <path d="M 116 190 L 264 250" stroke="#aaaaaa" stroke-width="1" fill="none" stroke-dasharray="4,3" marker-end="url(#arrGr)" filter="url(#rough2)"/>
  <text x="140" y="208" font-size="10" fill="#999">杀怪2 +2</text>
  <path d="M 264 190 L 116 250" stroke="#aaaaaa" stroke-width="1" fill="none" stroke-dasharray="4,3" marker-end="url(#arrGr)" filter="url(#rough2)"/>
  <text x="195" y="232" font-size="10" fill="#999">杀怪0 +2</text>
  <path d="M 444 190 L 296 250" stroke="#aaaaaa" stroke-width="1" fill="none" stroke-dasharray="4,3" marker-end="url(#arrGr)" filter="url(#rough2)"/>
  <text x="380" y="208" font-size="10" fill="#999">杀怪0 +2</text>
  <path d="M 460 190 L 460 250" stroke="#aaaaaa" stroke-width="1" fill="none" stroke-dasharray="4,3" marker-end="url(#arrGr)" filter="url(#rough2)"/>
  <text x="468" y="224" font-size="10" fill="#999">杀怪1 +1</text>

  <!-- 2->3 subopt -->
  <path d="M 116 290 L 264 350" stroke="#aaaaaa" stroke-width="1" fill="none" stroke-dasharray="4,3" marker-end="url(#arrGr)" filter="url(#rough2)"/>
  <text x="150" y="326" font-size="10" fill="#999">杀怪2 +2</text>
  <path d="M 280 290 L 280 350" stroke="#aaaaaa" stroke-width="1" fill="none" stroke-dasharray="4,3" marker-end="url(#arrGr)" filter="url(#rough2)"/>
  <text x="288" y="324" font-size="10" fill="#999">杀怪1 +1</text>

  <!-- ===== optimal path edges (bold green) ===== -->
  <!-- 000 -> 010 -->
  <path d="M 280 110 L 280 150" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="288" y="134" font-size="11" fill="#4a7a3a" font-weight="bold">杀怪1 +1 ✓</text>
  <!-- 010 -> 110 -->
  <path d="M 296 190 L 444 250" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="360" y="232" font-size="11" fill="#4a7a3a" font-weight="bold">杀怪2 +2 ✓</text>
  <!-- 110 -> 111 -->
  <path d="M 444 290 L 296 350" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="360" y="326" font-size="11" fill="#4a7a3a" font-weight="bold">杀怪0 +1 ✓</text>

  <!-- ===== nodes ===== -->
  <!-- k=0: 000 -->
  <rect x="240" y="70" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="95" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">000 (f=0)</text>

  <!-- k=1 -->
  <rect x="60" y="150" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="175" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">001 (3)</text>
  <rect x="240" y="150" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="175" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">010 (1)</text>
  <rect x="420" y="150" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="460" y="175" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">100 (4)</text>

  <!-- k=2 -->
  <rect x="60" y="250" width="80" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="275" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">011 (3)</text>
  <rect x="240" y="250" width="80" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="275" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">101 (5)</text>
  <rect x="420" y="250" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="275" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">110 (3)</text>

  <!-- k=3: 111 -->
  <rect x="240" y="350" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="375" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">111 (4) ⭐</text>

  <!-- footnote -->
  <rect x="40" y="412" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="431" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">最优路径（绿线）000 → 010 → 110 → 111，共 1+2+1 = 4 天</text>
  <text x="280" y="448" text-anchor="middle" font-size="11" fill="#666">击杀顺序按力量 [1,4,3]，分别用 gain 1,2,3</text>
</svg>
