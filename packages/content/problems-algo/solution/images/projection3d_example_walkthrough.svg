<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">示例演算：三个投影逐步相加</text>

  <!-- ===== Example 1: [[1,2],[3,4]] ===== -->
  <rect x="30" y="48" width="560" height="180" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)" opacity="0.35"/>
  <text x="50" y="72" font-size="13" fill="#446688" font-weight="bold">示例 1：grid = [[1,2],[3,4]]</text>

  <!-- grid mini -->
  <rect x="60" y="86" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="77" y="105" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="94" y="86" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="111" y="105" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <rect x="60" y="114" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="77" y="133" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <rect x="94" y="114" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="111" y="133" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>

  <!-- three computations -->
  <text x="160" y="96" font-size="12" fill="#4a7a3a" font-weight="bold">俯视 xy</text>
  <text x="160" y="116" font-size="11" fill="#555">非空格子 = 4 个 → 4</text>

  <text x="160" y="142" font-size="12" fill="#446688" font-weight="bold">正视 zx</text>
  <text x="160" y="162" font-size="11" fill="#555">行最大值: max(1,2)=2, max(3,4)=4</text>
  <text x="160" y="178" font-size="11" fill="#555">2 + 4 = 6</text>

  <text x="380" y="96" font-size="12" fill="#b85450" font-weight="bold">侧视 yz</text>
  <text x="380" y="116" font-size="11" fill="#555">列最大值: max(1,3)=3, max(2,4)=4</text>
  <text x="380" y="132" font-size="11" fill="#555">3 + 4 = 7</text>

  <rect x="380" y="150" width="190" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="475" y="176" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">总面积 = 4+6+7 = 17</text>

  <!-- divider -->
  <line x1="40" y1="246" x2="600" y2="246" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Example 3: [[1,0],[0,2]] ===== -->
  <rect x="30" y="256" width="560" height="170" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)" opacity="0.3"/>
  <text x="50" y="280" font-size="13" fill="#b85450" font-weight="bold">示例 3：grid = [[1,0],[0,2]]</text>

  <!-- grid mini -->
  <rect x="60" y="294" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="77" y="313" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="94" y="294" width="34" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3 2" rx="3" filter="url(#rough2)"/>
  <text x="111" y="313" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <rect x="60" y="322" width="34" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3 2" rx="3" filter="url(#rough2)"/>
  <text x="77" y="341" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <rect x="94" y="322" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="111" y="341" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>

  <text x="160" y="304" font-size="12" fill="#4a7a3a" font-weight="bold">俯视 xy</text>
  <text x="160" y="324" font-size="11" fill="#555">非空格子 = 2 个 (1 和 2)</text>
  <text x="160" y="340" font-size="11" fill="#555">→ 2</text>

  <text x="160" y="366" font-size="12" fill="#446688" font-weight="bold">正视 zx</text>
  <text x="160" y="386" font-size="11" fill="#555">max(1,0)=1, max(0,2)=2 → 1+2 = 3</text>

  <text x="380" y="304" font-size="12" fill="#b85450" font-weight="bold">侧视 yz</text>
  <text x="380" y="324" font-size="11" fill="#555">max(1,0)=1, max(0,2)=2 → 1+2 = 3</text>

  <rect x="380" y="346" width="190" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="475" y="372" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">总面积 = 2+3+3 = 8</text>

  <text x="320" y="425" text-anchor="middle" font-size="11" fill="#888">⚠ 0 值格子对三个投影均无贡献：俯视不占格、行/列最大值由其它格子决定</text>
</svg>
