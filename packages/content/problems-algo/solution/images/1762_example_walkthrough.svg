<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：heights = [4,2,3,1]，从右向左追踪 maxH 与 res</text>

  <!-- scan direction hint -->
  <text x="40" y="58" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">扫描顺序 i = 3 → 2 → 1 → 0</text>

  <!-- table header -->
  <g font-size="12" fill="#555" font-weight="bold" text-anchor="middle">
    <rect x="58" y="66" width="44" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="80" y="84" filter="url(#rough2)">i</text>
    <rect x="105" y="66" width="50" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="130" y="84" filter="url(#rough2)">h[i]</text>
    <rect x="160" y="66" width="72" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="196" y="84" filter="url(#rough2)">maxH(前)</text>
    <rect x="235" y="66" width="82" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="276" y="84" filter="url(#rough2)">h[i]&gt;maxH?</text>
    <rect x="320" y="66" width="92" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="366" y="84" filter="url(#rough2)">动作</text>
    <rect x="415" y="66" width="118" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="474" y="84" filter="url(#rough2)">res（更新后）</text>
  </g>

  <!-- data rows -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <!-- i=3, h=1, maxH=0, 1>0 yes, 入选 maxH=1, res=[3] -->
    <rect x="58" y="98" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="80" y="119" filter="url(#rough2)">3</text>
    <rect x="105" y="98" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="130" y="119" filter="url(#rough2)">1</text>
    <rect x="160" y="98" width="72" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="196" y="119" filter="url(#rough2)">0</text>
    <rect x="235" y="98" width="82" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="276" y="119" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
    <rect x="320" y="98" width="92" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="366" y="119" filter="url(#rough2)">入选,maxH=1</text>
    <rect x="415" y="98" width="118" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="474" y="119" fill="#b85450" font-weight="bold" filter="url(#rough2)">[3]</text>

    <!-- i=2, h=3, maxH=1, 3>1 yes, 入选 maxH=3, res=[3,2] -->
    <rect x="58" y="130" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="80" y="151" filter="url(#rough2)">2</text>
    <rect x="105" y="130" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="130" y="151" filter="url(#rough2)">3</text>
    <rect x="160" y="130" width="72" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="196" y="151" filter="url(#rough2)">1</text>
    <rect x="235" y="130" width="82" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="276" y="151" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
    <rect x="320" y="130" width="92" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="366" y="151" filter="url(#rough2)">入选,maxH=3</text>
    <rect x="415" y="130" width="118" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="474" y="151" fill="#b85450" font-weight="bold" filter="url(#rough2)">[3, 2]</text>

    <!-- i=1, h=2, maxH=3, 2>3 no, 跳过, res=[3,2] -->
    <rect x="58" y="162" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="80" y="183" filter="url(#rough2)">1</text>
    <rect x="105" y="162" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="130" y="183" filter="url(#rough2)">2</text>
    <rect x="160" y="162" width="72" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="196" y="183" filter="url(#rough2)">3</text>
    <rect x="235" y="162" width="82" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="276" y="183" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
    <rect x="320" y="162" width="92" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="366" y="183" fill="#b85450" filter="url(#rough2)">跳过(maxH 不变)</text>
    <rect x="415" y="162" width="118" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="474" y="183" filter="url(#rough2)">[3, 2]</text>

    <!-- i=0, h=4, maxH=3, 4>3 yes, 入选 maxH=4, res=[3,2,0] -->
    <rect x="58" y="194" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="80" y="215" filter="url(#rough2)">0</text>
    <rect x="105" y="194" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="130" y="215" filter="url(#rough2)">4</text>
    <rect x="160" y="194" width="72" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="196" y="215" filter="url(#rough2)">3</text>
    <rect x="235" y="194" width="82" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="276" y="215" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
    <rect x="320" y="194" width="92" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="366" y="215" filter="url(#rough2)">入选,maxH=4</text>
    <rect x="415" y="194" width="118" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="474" y="215" fill="#b85450" font-weight="bold" filter="url(#rough2)">[3, 2, 0]</text>
  </g>

  <!-- final reverse arrow -->
  <path d="M 474 230 L 474 252" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="394" y="254" width="160" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="474" y="277" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">reverse → [0, 2, 3] ✓</text>

  <!-- divider -->
  <path d="M 40 308 L 530 308" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- maxH monotonic note -->
  <text x="40" y="332" font-size="11.5" fill="#555" filter="url(#rough2)">观察：maxH 随扫描单调递增（0 → 1 → 1 → 1 → 3 → 3 → 4），只在「入选」时更新。</text>
  <text x="40" y="352" font-size="11.5" fill="#555" filter="url(#rough2)">入选条件 h[i] &gt; maxH 等价于「i 右侧所有建筑都比它矮」，故入选者必能看海。</text>

  <!-- maxH growth strip -->
  <text x="40" y="384" font-size="11.5" fill="#888" filter="url(#rough2)">maxH 变化轨迹：</text>
  <g font-size="11" fill="#333" text-anchor="middle">
    <rect x="150" y="372" width="40" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="170" y="389" filter="url(#rough2)">0</text>
    <text x="198" y="389" font-size="10" fill="#888" filter="url(#rough2)">i=3</text>
    <rect x="225" y="372" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="245" y="389" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
    <text x="273" y="389" font-size="10" fill="#888" filter="url(#rough2)">i=2</text>
    <rect x="300" y="372" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="320" y="389" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
    <text x="348" y="389" font-size="10" fill="#888" filter="url(#rough2)">i=1</text>
    <rect x="375" y="372" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="395" y="389" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
    <text x="423" y="389" font-size="10" fill="#888" filter="url(#rough2)">i=0</text>
    <rect x="450" y="372" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="470" y="389" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>
  </g>

  <!-- footer -->
  <text x="40" y="418" font-size="11" fill="#555" filter="url(#rough2)">💡 最终 res 收集顺序自右向左递减，reverse 后即得题目要求的升序下标列表</text>
</svg>
