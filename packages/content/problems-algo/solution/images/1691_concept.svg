<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：每块维度内部排序 → 存在等价的最优堆叠</text>

  <!-- ===== Left: Rotation concept ===== -->
  <text x="140" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 每块内部排序 (w ≤ l ≤ h)</text>

  <!-- Original cuboid [50,45,20] -->
  <text x="60" y="92" font-size="10" fill="#888" filter="url(#rough2)">原始：</text>
  <g filter="url(#rough2)">
    <rect x="92" y="78" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <rect x="124" y="72" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <line x1="92" y1="78" x2="124" y2="72" stroke="#b85450" stroke-width="1"/>
    <line x1="126" y1="78" x2="158" y2="72" stroke="#b85450" stroke-width="1"/>
  </g>
  <g font-size="11" fill="#b85450" text-anchor="middle" font-weight="bold">
    <text x="109" y="100" filter="url(#rough2)">50</text>
    <text x="141" y="94" filter="url(#rough2)">45</text>
    <text x="170" y="100" font-size="10" filter="url(#rough2)">20</text>
  </g>
  <text x="186" y="100" font-size="10" fill="#999" filter="url(#rough2)">→ 顺序乱</text>

  <!-- Arrow down -->
  <path d="M 140 120 L 140 138" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="148" y="134" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">sort</text>

  <!-- Sorted cuboid [20,45,50] -->
  <text x="60" y="158" font-size="10" fill="#888" filter="url(#rough2)">排序：</text>
  <g filter="url(#rough2)">
    <rect x="92" y="144" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="114" y="138" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="148" y="132" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
  </g>
  <g font-size="11" fill="#4a7a3a" text-anchor="middle" font-weight="bold">
    <text x="103" y="160" filter="url(#rough2)">20</text>
    <text x="131" y="154" filter="url(#rough2)">45</text>
    <text x="168" y="148" filter="url(#rough2)">50</text>
  </g>
  <text x="196" y="156" font-size="10" fill="#4a7a3a" filter="url(#rough2)">w≤l≤h</text>

  <!-- Insight for rotation -->
  <rect x="40" y="178" width="240" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="52" y="196" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">为什么排序不丢最优解？</text>
  <text x="52" y="212" font-size="10" fill="#555" filter="url(#rough2)">若 a ≤ b 逐分量，则</text>
  <text x="52" y="226" font-size="10" fill="#555" filter="url(#rough2)">sort(a) ≤ sort(b) 逐分量</text>
  <text x="52" y="238" font-size="9" fill="#b85450" filter="url(#rough2)">→ 堆叠关系保持，高度只增不减</text>

  <!-- ===== Right: Stacking concept ===== -->
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 按字典序排序后堆叠</text>

  <!-- Stack of three cuboids (top to bottom: small to large) -->
  <!-- Top cuboid: (12,23,45) -->
  <g filter="url(#rough2)">
    <polygon points="370,118 410,118 430,108 390,108" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="370" y="118" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <polygon points="410,118 430,108 430,130 410,140" fill="#d0dcf0" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="390" y="134" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">45</text>

  <!-- Middle cuboid: (20,45,50) -->
  <g filter="url(#rough2)">
    <polygon points="360,150 410,150 435,138 385,138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="360" y="150" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <polygon points="410,150 435,138 435,162 410,174" fill="#f0e0b0" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="385" y="167" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">50</text>

  <!-- Bottom cuboid: (37,53,95) -->
  <g filter="url(#rough2)">
    <polygon points="345,184 410,184 445,170 380,170" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="345" y="184" width="65" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <polygon points="410,184 445,170 445,202 410,216" fill="#c8e6c8" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="377" y="205" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">95</text>

  <!-- Height annotation -->
  <line x1="465" y1="118" x2="465" y2="216" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 465 118 L 461 124 M 465 118 L 469 124" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 465 216 L 461 210 M 465 216 L 469 210" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="472" y="170" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">190</text>

  <!-- Stack order labels -->
  <text x="340" y="124" font-size="9" fill="#888" text-anchor="end" filter="url(#rough2)">顶</text>
  <text x="335" y="200" font-size="9" fill="#888" text-anchor="end" filter="url(#rough2)">底</text>

  <!-- Right insight -->
  <rect x="300" y="178" width="240" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="312" y="196" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">为什么字典序排序不漏解？</text>
  <text x="312" y="212" font-size="10" fill="#555" filter="url(#rough2)">堆叠从顶到底三维不减</text>
  <text x="312" y="226" font-size="10" fill="#555" filter="url(#rough2)">→ 字典序不减 → 是排序后子序列</text>
  <text x="312" y="238" font-size="9" fill="#b85450" filter="url(#rough2)">j&lt;i 时 w_j≤w_i 自动满足</text>

  <!-- ===== Bottom: reduction to LIS ===== -->
  <rect x="40" y="260" width="500" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="280" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">归约：三维偏序上的最大权和链 → LIS 求和变体</text>
  <text x="56" y="298" font-size="11" fill="#555" filter="url(#rough2)">① 每块排序固定朝向 (w≤l≤h)：旋转自由度消除，三维堆叠关系保持</text>
  <text x="56" y="314" font-size="11" fill="#555" filter="url(#rough2)">② 外层按 (w,l,h) 字典序排序：w 维条件自动满足，降为二维判定</text>
  <text x="56" y="330" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ dp[i] = h_i + max{ dp[j] : j&lt;i, l_j≤l_i, h_j≤h_i } = LIS 求和变体</text>

  <!-- Legend -->
  <rect x="40" y="352" width="500" height="44" fill="#fff" stroke="#eee" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <rect x="52" y="364" width="16" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="74" y="374" font-size="10" fill="#555" filter="url(#rough2)">排序后块</text>
  <rect x="146" y="364" width="16" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="168" y="374" font-size="10" fill="#555" filter="url(#rough2)">原始乱序</text>
  <rect x="240" y="364" width="16" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="262" y="374" font-size="10" fill="#555" filter="url(#rough2)">中间块</text>
  <line x1="330" y1="370" x2="360" y2="370" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="368" y="374" font-size="10" fill="#b85450" filter="url(#rough2)">总高度</text>
  <text x="52" y="390" font-size="9" fill="#aaa" filter="url(#rough2)">数据来自示例 1：堆叠从底到顶 [37,53,95]→[20,45,50]→[12,23,45]</text>

  <!-- Footer note -->
  <text x="280" y="418" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">与 1626 同构：二维(age,score)排序+一维判定 ↔ 三维排序(降维)+二维判定</text>
</svg>
