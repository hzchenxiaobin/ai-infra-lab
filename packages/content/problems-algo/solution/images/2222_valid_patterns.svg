<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：合法子序列只有 010 和 101</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">选 3 栋相邻不同 → a≠b, b≠c → a=c（鸽巢）→ 交错形态</text>

  <!-- ===== Constraint derivation ===== -->
  <text x="28" y="68" font-size="10.5" fill="#666">约束推导</text>
  <rect x="40" y="76" width="200" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="94" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">a ≠ b 且 b ≠ c</text>
  <text x="140" y="110" text-anchor="middle" font-size="10" fill="#555">字符集 {0,1} → a, c 都与 b 相反</text>

  <path d="M 250 98 L 276 98" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="284" y="76" width="196" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="382" y="94" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">a = c ≠ b（交错）</text>
  <text x="382" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a">仅 010 与 101 两种</text>

  <!-- ===== Two valid patterns ===== -->
  <text x="28" y="146" font-size="10.5" fill="#666">合法形态</text>

  <!-- Pattern 010: middle=1 highlighted -->
  <rect x="40" y="154" width="200" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="140" y="172" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">形态 010（中间是 1）</text>
  <rect x="64" y="180" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="81" y="199" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="108" y="178" width="38" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="127" y="199" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="156" y="180" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="173" y="199" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <text x="127" y="232" text-anchor="middle" font-size="9.5" fill="#d6a040">中间 j</text>

  <!-- Pattern 101: middle=0 highlighted -->
  <rect x="270" y="154" width="200" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="370" y="172" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">形态 101（中间是 0）</text>
  <rect x="294" y="180" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="311" y="199" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="338" y="178" width="38" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="357" y="199" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="386" y="180" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="403" y="199" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="357" y="232" text-anchor="middle" font-size="9.5" fill="#d6a040">中间 j</text>

  <!-- ===== Contribution model ===== -->
  <text x="28" y="260" font-size="11" fill="#444" font-weight="bold">贡献模型：固定中间 j，左右独立</text>

  <!-- left | middle | right -->
  <rect x="44" y="272" width="120" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="104" y="290" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">左侧 pre</text>
  <text x="104" y="306" text-anchor="middle" font-size="9.5" fill="#555">异类个数</text>

  <rect x="174" y="270" width="60" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="204" y="290" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">中间 j</text>
  <text x="204" y="306" text-anchor="middle" font-size="9.5" fill="#555">s[j]</text>

  <rect x="244" y="272" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="304" y="290" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">右侧 suf</text>
  <text x="304" y="306" text-anchor="middle" font-size="9.5" fill="#555">异类个数</text>

  <!-- multiply signs -->
  <text x="160" y="298" text-anchor="middle" font-size="16" fill="#888" font-weight="bold">×</text>
  <text x="230" y="298" text-anchor="middle" font-size="16" fill="#888" font-weight="bold">×</text>

  <!-- contribution formula -->
  <path d="M 204 320 L 204 338" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="84" y="342" width="240" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="204" y="362" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">contribution(j) = pre × suf</text>

  <!-- right note -->
  <rect x="340" y="272" width="160" height="100" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="292" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">为什么左右独立？</text>
  <text x="420" y="310" text-anchor="middle" font-size="9.5" fill="#555">左选只影响第 1 位</text>
  <text x="420" y="324" text-anchor="middle" font-size="9.5" fill="#555">右选只影响第 3 位</text>
  <text x="420" y="340" text-anchor="middle" font-size="9.5" fill="#555">两者都只要求 ≠ s[j]</text>
  <text x="420" y="356" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">→ 乘法原理</text>
</svg>
