<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    核心观察：XOR 自反性让编码可逆
  </text>

  <!-- Encoding row (known) -->
  <text x="40" y="62" font-size="11" fill="#888" filter="url(#rough2)">编码关系（已知）</text>

  <rect x="70" y="72" width="62" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="101" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">arr[i]</text>

  <text x="152" y="96" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">⊕</text>

  <rect x="172" y="72" width="68" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="206" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">arr[i+1]</text>

  <text x="258" y="96" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">=</text>

  <rect x="278" y="72" width="86" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="321" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">encoded[i]</text>

  <!-- derivation arrow -->
  <path d="M206,116 L206,150" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="222" y="138" font-size="10" fill="#b85450" filter="url(#rough2)">两边 ⊕ arr[i]</text>

  <!-- Decoding row (derived) -->
  <text x="40" y="174" font-size="11" fill="#888" filter="url(#rough2)">解码结果（推得）</text>

  <rect x="70" y="184" width="68" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="104" y="203" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">arr[i+1]</text>

  <text x="158" y="208" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">=</text>

  <rect x="178" y="184" width="62" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="209" y="203" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">arr[i]</text>

  <text x="260" y="208" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">⊕</text>

  <rect x="280" y="184" width="86" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="323" y="203" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">encoded[i]</text>

  <!-- Property box -->
  <rect x="50" y="246" width="420" height="94" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="270" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">
    XOR 自反性：a ⊕ a = 0，a ⊕ 0 = a
  </text>
  <text x="260" y="291" text-anchor="middle" font-size="11" fill="#5a3a3a" filter="url(#rough2)">
    故 (a ⊕ b) ⊕ a = b ⊕ (a ⊕ a) = b ⊕ 0 = b
  </text>
  <text x="260" y="311" text-anchor="middle" font-size="11" fill="#5a3a3a" filter="url(#rough2)">
    编码 encoded = arr[i] ⊕ arr[i+1] 可一步反解
  </text>
  <text x="260" y="329" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    无需枚举，O(1) 求出下一项
  </text>
</svg>
