<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：空格 ↔ 多余单位 的最小权完美匹配</text>

  <!-- 3x3 grid: example 2 -->
  <!-- row 0 -->
  <rect x="56" y="46" width="60" height="60" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="86" y="80" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">1</text>
  <rect x="116" y="46" width="60" height="60" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="146" y="80" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">3</text>
  <text x="146" y="98" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">送 2 块</text>
  <rect x="176" y="46" width="60" height="60" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="206" y="80" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">0</text>
  <text x="206" y="98" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">收 1 块</text>
  <!-- row 1 -->
  <rect x="56" y="106" width="60" height="60" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="86" y="140" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">1</text>
  <rect x="116" y="106" width="60" height="60" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="146" y="140" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">0</text>
  <text x="146" y="158" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">收 1 块</text>
  <rect x="176" y="106" width="60" height="60" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="206" y="140" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">0</text>
  <text x="206" y="158" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">收 1 块</text>
  <!-- row 2 -->
  <rect x="56" y="166" width="60" height="60" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="86" y="200" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">1</text>
  <rect x="116" y="166" width="60" height="60" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="146" y="200" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">0</text>
  <text x="146" y="218" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">收 1 块</text>
  <rect x="176" y="166" width="60" height="60" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="206" y="200" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">3</text>
  <text x="206" y="218" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">送 2 块</text>

  <!-- match arrows -->
  <path d="M160,68 L200,68" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <circle cx="178" cy="68" r="9" fill="#fff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="178" y="72" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1</text>

  <path d="M134,90 L134,122" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <circle cx="134" cy="106" r="9" fill="#fff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="134" y="110" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1</text>

  <path d="M216,180 L216,150" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <circle cx="216" cy="165" r="9" fill="#fff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="216" y="169" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1</text>

  <path d="M192,210 L158,210" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <circle cx="176" cy="210" r="9" fill="#fff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="176" y="214" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- legend -->
  <rect x="56" y="246" width="18" height="13" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="82" y="257" font-size="11" fill="#555" filter="url(#rough2)">空格（grid=0）：收 1 块</text>
  <rect x="56" y="268" width="18" height="13" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="82" y="279" font-size="11" fill="#555" filter="url(#rough2)">多余（grid&gt;1）：送 grid−1 块</text>
  <rect x="56" y="290" width="18" height="13" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="82" y="301" font-size="11" fill="#555" filter="url(#rough2)">恰好 1 块：不动</text>

  <!-- right explanation boxes -->
  <rect x="280" y="46" width="268" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="294" y="68" font-size="13" fill="#2e4d24" font-weight="bold" filter="url(#rough2)">① 供需平衡（总和恒为 9）</text>
  <text x="294" y="88" font-size="11" fill="#333" filter="url(#rough2)">空格数 b = 多余单位数 b（一对一）</text>

  <rect x="280" y="116" width="268" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="294" y="138" font-size="13" fill="#2b3f55" font-weight="bold" filter="url(#rough2)">② 完美匹配</text>
  <text x="294" y="158" font-size="11" fill="#333" filter="url(#rough2)">每个空格进 1 块 · 每个多余单位出 1 块</text>

  <rect x="280" y="186" width="268" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="294" y="208" font-size="13" fill="#8a6420" font-weight="bold" filter="url(#rough2)">③ 单块代价 = 曼哈顿距离</text>
  <text x="294" y="228" font-size="11" fill="#333" filter="url(#rough2)">dist = |Δr| + |Δc|（无障碍、可临时堆叠）</text>

  <rect x="280" y="256" width="268" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="294" y="280" font-size="14" fill="#8c3a35" font-weight="bold" filter="url(#rough2)">答案 = min Σ dist（完美匹配）</text>
  <text x="294" y="302" font-size="12" fill="#b85450" filter="url(#rough2)">示例 2：1 + 1 + 1 + 1 = 4</text>

  <!-- bottom note -->
  <rect x="56" y="332" width="492" height="42" rx="8" fill="#f4f4f4" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="302" y="348" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">可达：每块沿最短路径搬运即实现匹配代价 ｜ 下界：每块石头步数 ≥ 起终点曼哈顿距离</text>
  <text x="302" y="366" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（转运不省钱：三角不等式保证交换后代价不增）</text>

  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">移动过程无容量限制 → 匹配代价可以原样实现，答案就是最小权匹配的权值和</text>
</svg>
