<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="560" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：递增分组 + 按实际长度判奇偶</text>

  <!-- Step 1: init -->
  <rect x="250" y="50" width="260" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dummy.next = head;  prev = dummy;  expected = 1</text>

  <!-- arrow down -->
  <path d="M 380 92 L 380 112" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Decision: prev.next == null? -->
  <polygon points="380,116 480,160 380,204 280,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">prev.next</text>
  <text x="380" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">== null?</text>

  <!-- Yes -> return -->
  <path d="M 480 160 L 580 160" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="500" y="154" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="580" y="142" width="150" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="655" y="165" text-anchor="middle" font-size="12" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">return dummy.next</text>

  <!-- No -> walk -->
  <path d="M 380 204 L 380 224" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="390" y="218" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- walk expected steps -->
  <rect x="220" y="228" width="320" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="250" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">从 prev 走 expected 步，统计 actual</text>
  <text x="380" y="266" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">node = prev;  actual = 0;  走到 node.next == null 或走满 expected</text>

  <!-- arrow down -->
  <path d="M 380 278 L 380 298" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- nextGroup = node.next -->
  <rect x="240" y="302" width="280" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="380" y="323" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">nextGroup = node.next（下一组起点）</text>

  <!-- arrow down -->
  <path d="M 380 336 L 380 356" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Decision: actual % 2 == 0? -->
  <polygon points="380,360 490,404 380,448 270,404" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="400" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">actual % 2</text>
  <text x="380" y="416" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">== 0 ?</text>

  <!-- Yes (even) -> reverse -->
  <path d="M 270 404 L 160 404" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="200" y="398" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是(偶)</text>
  <rect x="40" y="380" width="120" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="400" text-anchor="middle" font-size="10" fill="#7a2828" filter="url(#rough2)">反转该组</text>
  <text x="100" y="414" text-anchor="middle" font-size="10" fill="#7a2828" filter="url(#rough2)">prev.next=新头</text>
  <text x="100" y="426" text-anchor="middle" font-size="10" fill="#7a2828" filter="url(#rough2)">prev=原头(新尾)</text>

  <!-- No (odd) -> skip -->
  <path d="M 490 404 L 600 404" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="540" y="398" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">否(奇)</text>
  <rect x="600" y="380" width="120" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="660" y="400" text-anchor="middle" font-size="10" fill="#2e5e2e" filter="url(#rough2)">保持原序</text>
  <text x="660" y="414" text-anchor="middle" font-size="10" fill="#2e5e2e" filter="url(#rough2)">prev = node</text>
  <text x="660" y="426" text-anchor="middle" font-size="10" fill="#2e5e2e" filter="url(#rough2)">（当前组尾）</text>

  <!-- both branches merge -> expected++ -->
  <path d="M 100 428 L 100 468 L 380 468" stroke="#555" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 660 428 L 660 468 L 380 468" stroke="#555" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- expected++ -->
  <rect x="300" y="462" width="160" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="483" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold" filter="url(#rough2)">expected++</text>

  <!-- loop back arrow -->
  <path d="M 560 478 L 700 478 L 700 160 L 480 160" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="710" y="320" font-size="10" fill="#b85450" filter="url(#rough2)" transform="rotate(90 710 320)">回到循环起点</text>

  <!-- bottom note -->
  <text x="380" y="540" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">每组：先走 expected 步探测实际长度，再按 actual 奇偶决定是否翻转</text>
</svg>
