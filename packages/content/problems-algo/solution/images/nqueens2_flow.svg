<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">N 皇后 II：位运算回溯流程</text>

  <!-- 入口 -->
  <rect x="170" y="48" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="70" text-anchor="middle" font-size="12" fill="#333">backtrack(row, cols, d1, d2)</text>

  <path d="M 290 82 L 290 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 终止判定 -->
  <polygon points="290,100 410,138 290,176 170,138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="290" y="134" text-anchor="middle" font-size="12" fill="#333">row == n ?</text>
  <text x="290" y="152" text-anchor="middle" font-size="10" fill="#888">放满 n 行</text>

  <!-- 是 -->
  <path d="M 290 176 L 290 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="190" font-size="10" fill="#82b366">是</text>
  <rect x="210" y="200" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="220" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return 1（计一个方案）</text>

  <!-- 否 -->
  <path d="M 410 138 L 470 138 L 470 240" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="130" font-size="10" fill="#b85450">否</text>

  <!-- 计算 avail -->
  <rect x="360" y="244" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="262" text-anchor="middle" font-size="10" fill="#555">mask = (1&lt;&lt;n)-1</text>
  <text x="470" y="280" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">avail = ~(c|d1|d2) &amp; mask</text>

  <path d="M 470 288 L 470 306" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- while avail -->
  <rect x="370" y="310" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="330" text-anchor="middle" font-size="11" fill="#333">while (avail)  还有可放列?</text>

  <path d="M 370 325 L 320 325" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="318" font-size="10" fill="#82b366">是</text>

  <!-- 取最低位 -->
  <rect x="130" y="310" width="190" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="225" y="330" text-anchor="middle" font-size="11" fill="#333">bit = avail &amp; -avail；avail^=bit</text>

  <path d="M 225 340 L 225 358" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 递归 -->
  <rect x="80" y="362" width="290" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="225" y="380" text-anchor="middle" font-size="10" fill="#333">递归下一行（掩码移位传递）：</text>
  <text x="225" y="398" text-anchor="middle" font-size="10" fill="#2d5a1f" font-weight="bold">row+1, cols|bit, (d1|bit)&lt;&lt;1, (d2|bit)&gt;&gt;1</text>

  <!-- 汇总回 -->
  <path d="M 225 408 L 225 418 L 470 418 L 470 340" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="412" font-size="10" fill="#4a7a3a">count += 返回值</text>

  <!-- 返回 -->
  <path d="M 470 310 L 470 292" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="302" font-size="10" fill="#b85450">否(空)</text>
  <text x="290" y="432" text-anchor="middle" font-size="11" fill="#888">每层：一次位运算取可用列 → 逐最低位枚举 → 掩码移位下传</text>
</svg>
