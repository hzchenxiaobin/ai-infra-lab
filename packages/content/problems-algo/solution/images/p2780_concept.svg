<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">支配元素 x 与合法分割</text>

  <text x="340" y="50" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">切分点 i</text>
  <path d="M340,56 L340,118" fill="none" stroke="#b85450" stroke-width="2.5" stroke-dasharray="6,3" filter="url(#rough2)"/>

  <rect x="160" y="62" width="60" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="93" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <rect x="220" y="62" width="60" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="93" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <rect x="280" y="62" width="60" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="93" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>

  <rect x="340" y="62" width="60" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="93" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>

  <text x="190" y="128" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="250" y="128" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="310" y="128" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="370" y="128" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>

  <text x="250" y="152" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">左半 [0..i]，长 i+1</text>
  <text x="370" y="152" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">右半，长 n−1−i</text>

  <rect x="30" y="172" width="270" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="165" y="198" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">左半支配元素 = x</text>
  <text x="165" y="222" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">频次 cnt = 2</text>
  <text x="165" y="248" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cnt × 2 &gt; i + 1  →  4 &gt; 3 ✓</text>

  <rect x="310" y="172" width="220" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="198" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">右半支配元素 = x</text>
  <text x="420" y="222" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">频次 f − cnt = 1</text>
  <text x="420" y="248" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(f−cnt)×2 &gt; n−1−i  →  2 &gt; 1 ✓</text>

  <rect x="60" y="280" width="440" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="12" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">两半支配元素必须相同 = 全局唯一支配元素 x</text>
</svg>
