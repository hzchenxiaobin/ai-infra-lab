<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="540" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：值域计数 + 倍数分桶（调和级数）</text>

  <!-- 1. 频数 + M -->
  <rect x="140" y="48" width="260" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="73" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① 统计频数 cnt[v]，记 M = max(nums)</text>
  <path d="M270,90 L270,106" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 2. prefix sum -->
  <rect x="120" y="110" width="300" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② 求前缀和 pre[v] = Σ_{x≤v} cnt[x]</text>
  <path d="M270,152 L270,168" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 3. for u -->
  <rect x="110" y="172" width="320" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="197" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ for u = 1..M（仅当 cnt[u] &gt; 0）：</text>
  <path d="M270,214 L270,230" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 4. for k -->
  <rect x="110" y="234" width="320" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="259" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">④ for k = 1; k·u ≤ M; k++：</text>
  <path d="M270,276 L270,294" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 5. compute bucket range + count -->
  <rect x="70" y="298" width="400" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="318" text-anchor="middle" font-size="10.5" fill="#2a4a1a" filter="url(#rough2)">lo = k·u，hi = min((k+1)·u − 1, M)</text>
  <text x="270" y="334" text-anchor="middle" font-size="10.5" fill="#2a4a1a" filter="url(#rough2)">count = pre[hi] − pre[lo−1]</text>

  <!-- decision: count > 0 ? -->
  <path d="M270,346 L270,360" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <polygon points="270,362 380,396 270,430 160,396" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="392" text-anchor="middle" font-size="10.5" fill="#7a3030" font-weight="bold" filter="url(#rough2)">count &gt; 0 ?</text>
  <text x="270" y="406" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">桶内无元素则跳过</text>

  <!-- yes: accumulate -->
  <path d="M380,396 L440,396 L440,360 L440,330" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="392" y="389" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="380" y="296" width="120" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440" y="318" text-anchor="middle" font-size="10" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">ans += cnt[u]·k·count</text>

  <!-- loop back k++ -->
  <path d="M440,296 L440,254 L430,254" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="455" y="278" font-size="9" fill="#888" filter="url(#rough2)">k++</text>

  <!-- no: next k -->
  <path d="M160,396 L100,396 L100,254 L110,254" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrR)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="112" y="389" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="80" y="278" font-size="9" fill="#888" filter="url(#rough2)">k++</text>

  <!-- after k loop: u++ -->
  <path d="M270,430 L270,452" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="180" y="456" width="180" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="477" text-anchor="middle" font-size="10.5" fill="#7a5a20" filter="url(#rough2)">u++（回到 ③）</text>

  <!-- end -->
  <path d="M270,488 L270,504" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="170" y="506" width="200" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="526" text-anchor="middle" font-size="11" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">return ans % (10⁹+7)</text>

  <!-- side note -->
  <rect x="20" y="296" width="42" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="316" text-anchor="middle" font-size="8.5" fill="#7a5a20" filter="url(#rough2)">跳空</text>
  <text x="40" y="330" text-anchor="middle" font-size="8.5" fill="#7a5a20" filter="url(#rough2)">桶可</text>
  <text x="40" y="344" text-anchor="middle" font-size="8.5" fill="#7a5a20" filter="url(#rough2)">省略</text>
</svg>
