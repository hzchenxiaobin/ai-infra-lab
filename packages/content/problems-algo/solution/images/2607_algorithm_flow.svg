<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="500" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：gcd 分组 → 排序 → 中位数 + 前缀和求代价</text>

  <!-- Step 1: gcd -->
  <rect x="60" y="50" width="420" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="72" font-size="12" fill="#a87020" font-weight="bold">① 求公约数</text>
  <text x="270" y="82" text-anchor="middle" font-size="12.5" fill="#333">g = gcd(n, k)，O(log n)</text>

  <path d="M 270 100 L 270 120" stroke="#888" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: loop residues -->
  <rect x="60" y="124" width="420" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="146" font-size="12" fill="#446688" font-weight="bold">② 遍历余数</text>
  <text x="270" y="156" text-anchor="middle" font-size="12.5" fill="#333">对每个 r ∈ [0, g)，收集同余类 {arr[r], arr[r+g], …}</text>

  <path d="M 270 174 L 270 194" stroke="#888" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: sort group -->
  <rect x="60" y="198" width="420" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="220" font-size="12" fill="#446688" font-weight="bold">③ 组内排序</text>
  <text x="270" y="230" text-anchor="middle" font-size="12.5" fill="#333">每组升序排序，暴露中位数位置</text>

  <path d="M 270 248 L 270 268" stroke="#888" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: prefix sum -->
  <rect x="60" y="272" width="420" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="294" font-size="12" fill="#4a7a3a" font-weight="bold">④ 前缀和</text>
  <text x="270" y="314" text-anchor="middle" font-size="12.5" fill="#333">prefix[j] = group[0]+…+group[j−1]</text>

  <path d="M 270 328 L 270 348" stroke="#888" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 5: median cost -->
  <rect x="60" y="352" width="420" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="80" y="374" font-size="12" fill="#b85450" font-weight="bold">⑤ 中位数求代价</text>
  <text x="270" y="394" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">median = group[m/2]，左右前缀和套公式 O(1)</text>

  <path d="M 270 408 L 270 428" stroke="#888" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 6: accumulate -->
  <rect x="60" y="432" width="420" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="454" font-size="12" fill="#446688" font-weight="bold">⑥ 累加答案</text>
  <text x="270" y="462" text-anchor="middle" font-size="12.5" fill="#333">ans += left + right，所有组代价求和</text>

  <path d="M 40 490 L 500 490" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
</svg>
