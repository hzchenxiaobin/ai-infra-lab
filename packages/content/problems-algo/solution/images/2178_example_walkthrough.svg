<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：finalSum = 28</text>

  <!-- table header -->
  <rect x="24" y="44" width="532" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步</text>
  <text x="120" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">k</text>
  <text x="190" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">finalSum</text>
  <text x="290" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">判定 fs−2k ≥ 2(k+1)?</text>
  <text x="410" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">操作</text>
  <text x="508" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">res</text>

  <!-- row 1: k=1 -->
  <rect x="24" y="72" width="532" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="92" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="120" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="190" y="92" text-anchor="middle" font-size="11" fill="#333">28</text>
  <text x="290" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">28−2=26 ≥ 4 ✓</text>
  <text x="410" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a">取 2</text>
  <text x="508" y="92" text-anchor="middle" font-size="11" fill="#333">[2]</text>

  <!-- row 2: k=2 -->
  <rect x="24" y="104" width="532" height="32" fill="#f6f8fb" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="124" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="120" y="124" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="190" y="124" text-anchor="middle" font-size="11" fill="#333">26</text>
  <text x="290" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">26−4=22 ≥ 6 ✓</text>
  <text x="410" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a">取 4</text>
  <text x="508" y="124" text-anchor="middle" font-size="11" fill="#333">[2,4]</text>

  <!-- row 3: k=3 -->
  <rect x="24" y="136" width="532" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="156" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="120" y="156" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="190" y="156" text-anchor="middle" font-size="11" fill="#333">22</text>
  <text x="290" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">22−6=16 ≥ 8 ✓</text>
  <text x="410" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a">取 6</text>
  <text x="508" y="156" text-anchor="middle" font-size="11" fill="#333">[2,4,6]</text>

  <!-- row 4: k=4 (stop) -->
  <rect x="24" y="168" width="532" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="188" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="120" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="190" y="188" text-anchor="middle" font-size="11" fill="#333">16</text>
  <text x="290" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">16−8=8 ≥ 10? ✗</text>
  <text x="410" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">吸收 16</text>
  <text x="508" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[2,4,6,16]</text>

  <!-- arrow down to verification -->
  <path d="M 290 200 L 290 220" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Verification block -->
  <rect x="24" y="222" width="532" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)" opacity="0.5"/>
  <text x="290" y="246" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">验证：2 + 4 + 6 + 16 = 28 ✓</text>
  <text x="290" y="266" text-anchor="middle" font-size="11" fill="#555">互异：16 &gt; 6 &gt; 4 &gt; 2 ✓　|　全为正偶数 ✓</text>
  <text x="290" y="284" text-anchor="middle" font-size="11" fill="#555">数目 4 = max k 使 k(k+1) ≤ 28　(4×5=20 ≤ 28 &lt; 5×6=30) ✓</text>

  <!-- bottom: visual bar -->
  <text x="290" y="318" text-anchor="middle" font-size="11" fill="#888">可视化拆分条：</text>

  <!-- bar segments -->
  <rect x="60" y="330" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="353" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <rect x="96" y="330" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="353" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <rect x="152" y="330" width="76" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="353" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>

  <rect x="228" y="330" width="156" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="306" y="353" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">16</text>

  <text x="400" y="353" font-size="13" fill="#4a7a3a" font-weight="bold">= 28</text>

  <!-- note -->
  <rect x="60" y="384" width="460" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.6"/>
  <text x="290" y="408" text-anchor="middle" font-size="11" fill="#555">尾项 16 = 28 − (2+4+6) = 28 − 12 = 16 &gt; 6，与前面互异</text>
</svg>
