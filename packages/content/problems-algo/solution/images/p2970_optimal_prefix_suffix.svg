<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 364" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="364" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">进阶 O(n)：断崖两侧夹逼 —— 最长递增前缀 x、最长递增后缀 y</text>

  <!-- cliff annotation -->
  <path d="M 140 52 Q 153 34 166 52" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="153" y="38" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">断崖：6 ≥ 5</text>

  <!-- array cells -->
  <rect x="120" y="58" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="140" y="81" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="166" y="58" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="186" y="81" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="212" y="58" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="232" y="81" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="258" y="58" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="278" y="81" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">8</text>

  <!-- indices -->
  <text x="140" y="112" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="186" y="112" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="232" y="112" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="278" y="112" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">3</text>

  <!-- brackets -->
  <path d="M 120 126 L 120 122 L 160 122 L 160 126" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="140" y="142" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">x = 0</text>
  <text x="140" y="157" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">递增前缀</text>
  <path d="M 166 126 L 166 122 L 298 122 L 298 126" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="232" y="142" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">y = 1</text>
  <text x="232" y="157" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">最长递增后缀</text>

  <!-- insight box -->
  <rect x="316" y="54" width="190" height="110" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="8" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="411" y="78" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">所有断崖必须被</text>
  <text x="411" y="96" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">删除段 [l,r] 连锅端走</text>
  <text x="411" y="120" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">⇒ l ≤ x+1 且 r ≥ y-1</text>
  <text x="411" y="144" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">再保证拼接处不断崖即可</text>

  <!-- accounting box -->
  <rect x="40" y="180" width="440" height="104" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="202" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">本例 [6,5,7,8] 的记账</text>
  <text x="260" y="224" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">l = 0：r ∈ [y-1, 3]，贡献 4 个</text>
  <text x="260" y="246" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">l = 1：k 从 1 推进到 2（5 ≤ 6 &lt; 7），r ∈ [1, 3]，贡献 3 个</text>
  <text x="260" y="272" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合计 4 + 3 = 7 ✓</text>

  <!-- bottom note -->
  <rect x="40" y="304" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">O(n) 解法与 2972 完全同构：整表递增特判、k=n 优雅退化等完整推导</text>
  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">见 2972 题解</text>
</svg>
