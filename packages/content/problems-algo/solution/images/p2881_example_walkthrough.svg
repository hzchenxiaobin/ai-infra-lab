<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：salary 逐行 ×2 落到 bonus</text>

  <!-- Left: employees table -->
  <rect x="30" y="52" width="205" height="232" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="132" y="74" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">employees</text>

  <rect x="46" y="88" width="88" height="24" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="105" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">name</text>
  <rect x="134" y="88" width="86" height="24" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="177" y="105" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">salary</text>

  <rect x="46" y="112" width="88" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="134" y="112" width="86" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="129" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Piper</text>
  <text x="177" y="129" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4548</text>

  <rect x="46" y="136" width="88" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="134" y="136" width="86" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Grace</text>
  <text x="177" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">28150</text>

  <rect x="46" y="160" width="88" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="134" y="160" width="86" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="177" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Georgia</text>
  <text x="177" y="177" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1103</text>

  <rect x="46" y="184" width="88" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="134" y="184" width="86" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="201" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Willow</text>
  <text x="177" y="201" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6593</text>

  <rect x="46" y="208" width="88" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="134" y="208" width="86" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="225" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Finn</text>
  <text x="177" y="225" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">74576</text>

  <rect x="46" y="232" width="88" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="134" y="232" width="86" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="249" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Thomas</text>
  <text x="177" y="249" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">24433</text>

  <!-- Middle: per-row arrows -->
  <text x="267" y="106" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">× 2</text>
  <path d="M 239 124 L 296 124" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 239 148 L 296 148" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 239 172 L 296 172" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 239 196 L 296 196" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 239 220 L 296 220" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 239 244 L 296 244" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="267" y="270" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">逐元素</text>

  <!-- Right: bonus column -->
  <rect x="300" y="52" width="118" height="232" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="359" y="74" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">新列 bonus</text>

  <rect x="316" y="88" width="86" height="24" fill="#d6a040" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="359" y="105" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">bonus</text>

  <rect x="316" y="112" width="86" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="359" y="129" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">9096</text>

  <rect x="316" y="136" width="86" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="359" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">56300</text>

  <rect x="316" y="160" width="86" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="359" y="177" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2206</text>

  <rect x="316" y="184" width="86" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="359" y="201" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">13186</text>

  <rect x="316" y="208" width="86" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="359" y="225" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">149152</text>

  <rect x="316" y="232" width="86" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="359" y="249" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">48866</text>

  <text x="359" y="272" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">追加在最右端</text>

  <!-- Bottom-left: official typo note -->
  <rect x="26" y="298" width="252" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="152" y="320" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">⚠️ 官方示例的小笔误</text>
  <text x="152" y="340" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">输出里 Willow 行「593」应为 6593</text>
  <text x="152" y="358" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">13186 = 2 × 6593 才自洽</text>

  <!-- Bottom-right: chained assignment pitfall -->
  <rect x="298" y="298" width="236" height="84" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="416" y="320" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⚠️ 坑：链式赋值</text>
  <text x="416" y="340" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">df[cond]['bonus']=… 写到临时切片</text>
  <text x="416" y="358" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">正解：df.loc[cond, 'bonus']=…</text>
</svg>
