<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="500" height="460" fill="#fafafa"/>

  <text x="250" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：掩码法求补数</text>

  <!-- Start oval -->
  <ellipse cx="250" cy="60" rx="48" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="65" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">开始</text>

  <line x1="250" y1="80" x2="250" y2="96" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: L = bit_length(num) -->
  <rect x="110" y="100" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="250" y="128" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">L = bit_length(num)</text>

  <line x1="250" y1="144" x2="250" y2="160" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: mask = (1 << L) - 1 -->
  <rect x="110" y="164" width="280" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="250" y="192" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">mask = (1 &lt;&lt; L) − 1</text>

  <line x1="250" y1="208" x2="250" y2="224" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: return num ^ mask -->
  <rect x="110" y="228" width="280" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="250" y="256" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">return num ⊕ mask</text>

  <line x1="250" y1="272" x2="250" y2="288" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End oval -->
  <ellipse cx="250" cy="308" rx="42" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="313" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结束</text>

  <!-- note box -->
  <rect x="40" y="340" width="420" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="250" y="360" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">关键：掩码只覆盖 [0, L) 位</text>
  <text x="250" y="376" text-anchor="middle" font-size="11" fill="#446688">异或只翻转有效位，前导 0 不动</text>

  <!-- complexity tag -->
  <rect x="40" y="396" width="420" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="418" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">时间 O(1)，空间 O(1)</text>

  <!-- side variant hint -->
  <rect x="40" y="438" width="420" height="0" fill="none"/>
</svg>
