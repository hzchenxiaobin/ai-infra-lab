<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：rating = [2, 5, 3, 4, 1]</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888">枚举中位 j，逐行统计四量并累加贡献</text>

  <!-- array display -->
  <text x="60" y="76" font-size="11" fill="#666" font-weight="bold">rating =</text>
  <g font-size="14">
    <rect x="108" y="58" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="128" y="80" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="150" y="58" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="170" y="80" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
    <rect x="192" y="58" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="212" y="80" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <rect x="234" y="58" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="254" y="80" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <rect x="276" y="58" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="296" y="80" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
  </g>
  <text x="108" y="104" font-size="10" fill="#888">idx 0</text>
  <text x="150" y="104" font-size="10" fill="#888">1</text>
  <text x="192" y="104" font-size="10" fill="#888">2</text>
  <text x="234" y="104" font-size="10" fill="#888">3</text>
  <text x="276" y="104" font-size="10" fill="#888">4</text>

  <!-- table header -->
  <rect x="40" y="118" width="560" height="28" rx="4" fill="#446688" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="68" y="137" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">j</text>
  <text x="108" y="137" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">rating[j]</text>
  <text x="196" y="137" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">leftSmaller</text>
  <text x="284" y="137" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">rightLarger</text>
  <text x="372" y="137" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">leftLarger</text>
  <text x="460" y="137" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">rightSmaller</text>
  <text x="556" y="137" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">贡献</text>

  <!-- row j=1 -->
  <rect x="40" y="146" width="560" height="36" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="68" y="170" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">1</text>
  <text x="108" y="170" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">5</text>
  <text x="196" y="170" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="284" y="170" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="372" y="170" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">0</text>
  <text x="460" y="170" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <text x="556" y="170" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <text x="600" y="170" font-size="10" fill="#999">1×0+0×3</text>

  <!-- row j=2 (highlighted) -->
  <rect x="40" y="184" width="560" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="68" y="208" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">2</text>
  <text x="108" y="208" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">3</text>
  <text x="196" y="208" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="284" y="208" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="372" y="208" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="460" y="208" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="556" y="208" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <text x="600" y="208" font-size="10" fill="#999">1×1+1×1</text>

  <!-- row j=3 -->
  <rect x="40" y="222" width="560" height="36" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="68" y="246" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">3</text>
  <text x="108" y="246" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">4</text>
  <text x="196" y="246" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="284" y="246" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="372" y="246" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="460" y="246" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="556" y="246" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="600" y="246" font-size="10" fill="#999">2×0+1×1</text>

  <!-- j=2 detail annotation -->
  <rect x="40" y="276" width="560" height="86" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="298" font-size="11" fill="#d6a040" font-weight="bold">j=2（rating=3）详解：</text>
  <text x="60" y="318" font-size="11" fill="#444">左侧 [2, 5]：2 &lt; 3 → leftSmaller=1；5 &gt; 3 → leftLarger=1</text>
  <text x="60" y="336" font-size="11" fill="#444">右侧 [4, 1]：4 &gt; 3 → rightLarger=1；1 &lt; 3 → rightSmaller=1</text>
  <text x="60" y="354" font-size="11" fill="#b85450" font-weight="bold">递增 1×1=1：(2,3,4) ｜ 递减 1×1=1：(5,3,1) → 贡献 2</text>

  <!-- total -->
  <rect x="40" y="376" width="560" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="398" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">总方案数 = 0 + 2 + 1 = 3</text>
  <text x="320" y="416" text-anchor="middle" font-size="10" fill="#888">三支队伍：(2,3,4) 递增 ｜ (5,4,1)、(5,3,1) 递减</text>
</svg>
