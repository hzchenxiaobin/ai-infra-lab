<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：遍历区间 + 逐位取余判定</text>

  <!-- Step 1: outer loop -->
  <rect x="40" y="44" width="480" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="64" font-size="12" fill="#446688" font-weight="bold">步骤 1：遍历区间 [left, right] 中的每个数 n</text>
  <text x="60" y="82" font-size="11" fill="#444" font-family="monospace">for (int n = left; n &lt;= right; ++n)</text>

  <path d="M 280 98 L 280 118" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: helper - extract digits -->
  <rect x="40" y="122" width="480" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="142" font-size="12" fill="#d6a040" font-weight="bold">步骤 2：对每个 n，调用 isSelfDividing(n) 逐位检验</text>
  <text x="60" y="162" font-size="11" fill="#444" font-family="monospace">tmp = n</text>
  <text x="60" y="180" font-size="11" fill="#444" font-family="monospace">while (tmp &gt; 0) {</text>
  <text x="80" y="198" font-size="11" fill="#444" font-family="monospace">d = tmp % 10;              // 取末位</text>
  <text x="80" y="216" font-size="11" fill="#b85450" font-family="monospace">if (d == 0 || n % d != 0) return false;   // 含 0 或不整除 → 否</text>
  <text x="80" y="234" font-size="11" fill="#444" font-family="monospace">tmp /= 10;                 // 截掉末位</text>
  <text x="60" y="238" font-size="11" fill="#444" font-family="monospace">}</text>

  <path d="M 280 246 L 280 266" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: decision -->
  <rect x="40" y="270" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="290" font-size="12" fill="#4a7a3a" font-weight="bold">步骤 3：判定结果</text>
  <text x="60" y="308" font-size="11" fill="#444">所有位都通过 → 是自除数，加入结果列表</text>
  <text x="60" y="322" font-size="11" fill="#444">任意一位失败 → 短路返回 false，跳过该数</text>

  <path d="M 280 330 L 280 350" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="80" y="354" width="400" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="377" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">返回所有自除数列表</text>

  <!-- loop back arrow -->
  <path d="M 500 69 Q 540 69 540 200 Q 540 360 500 372" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="548" y="210" font-size="10" fill="#888" text-anchor="middle" transform="rotate(90 548 210)">继续下一个 n</text>

  <!-- note -->
  <rect x="40" y="402" width="480" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="420" text-anchor="middle" font-size="10" fill="#888">⚠️ 先检查 d == 0 再取余，避免除零异常；用 tmp 副本遍历位数，保留原 n 做取余</text>
</svg>
