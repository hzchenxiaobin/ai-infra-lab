<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：非零元素塞进哈希集合 → 返回集合大小</text>

  <!-- Step 1: init set -->
  <rect x="130" y="46" width="260" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">① st = 空哈希集合</text>
  <text x="260" y="80" text-anchor="middle" font-size="10.5" fill="#888">集合天然去重，无需预排序</text>

  <path d="M 260 90 L 260 112" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: loop header -->
  <rect x="110" y="116" width="300" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="140" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">② 遍历 nums 中每个 x</text>

  <path d="M 260 158 L 260 180" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: decision -->
  <polygon points="260,184 360,224 260,264 160,224" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="220" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">x &gt; 0 ?</text>
  <text x="260" y="238" text-anchor="middle" font-size="10" fill="#b85450">跳过已归零的 0</text>

  <!-- yes branch -->
  <text x="378" y="220" font-size="11.5" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 360 224 L 392 224" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <rect x="392" y="204" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="452" y="222" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">st.insert(x)</text>
  <text x="452" y="236" text-anchor="middle" font-size="10" fill="#4a7a3a">重复值自动合并</text>

  <!-- no branch -->
  <text x="148" y="220" font-size="11.5" fill="#888" font-weight="bold">否</text>
  <path d="M 160 224 L 120 224 L 120 160 L 110 140" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="90" y="190" font-size="10.5" fill="#888" transform="rotate(-90 90 190)">跳过，下一个 x</text>

  <!-- loop back from insert to loop header -->
  <path d="M 452 204 L 452 136 L 410 136" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrL)" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="470" y="172" font-size="10.5" fill="#4a7a3a" transform="rotate(-90 470 172)">下一个 x</text>

  <!-- end of loop -> return -->
  <path d="M 260 264 L 260 300" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="276" y="290" font-size="11" fill="#888">遍历结束</text>

  <ellipse cx="260" cy="330" rx="120" ry="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="335" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">返回 st.size()</text>

  <text x="40" y="392" font-size="11.5" fill="#555" font-weight="bold">复杂度</text>
  <text x="40" y="412" font-size="11" fill="#555">• 时间 O(n)：n 次哈希插入，每次均摊 O(1)</text>
  <text x="40" y="430" font-size="11" fill="#555">• 空间 O(n)：最坏 n 个互异非零值</text>
  <text x="40" y="452" font-size="10.5" fill="#888">值域极小（≤100）时可用布尔数组把空间降到 O(1)</text>
</svg>
