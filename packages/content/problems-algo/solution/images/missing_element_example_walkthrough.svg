<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrU" markerWidth="8" markerHeight="8" refX="4" refY="1" orient="auto">
      <path d="M0,8 L4,1 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [4,7,9,10], k = 3</text>

  <!-- ============ Header: indices + nums + missing ============ -->
  <text x="40" y="54" font-size="11" fill="#888">下标：</text>
  <text x="130" y="54" text-anchor="middle" font-size="10" fill="#aaa">0</text>
  <text x="220" y="54" text-anchor="middle" font-size="10" fill="#aaa">1</text>
  <text x="310" y="54" text-anchor="middle" font-size="10" fill="#aaa">2</text>
  <text x="400" y="54" text-anchor="middle" font-size="10" fill="#aaa">3</text>

  <text x="40" y="78" font-size="11" fill="#888">nums：</text>
  <rect x="102" y="62" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="82" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="192" y="62" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="82" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="282" y="62" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="82" text-anchor="middle" font-size="12" fill="#333">9</text>
  <rect x="372" y="62" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="82" text-anchor="middle" font-size="12" fill="#333">10</text>

  <text x="40" y="108" font-size="11" fill="#888">missing：</text>
  <rect x="102" y="96" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="115" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <rect x="192" y="96" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="115" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <rect x="282" y="96" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="310" y="115" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <rect x="372" y="96" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="400" y="115" text-anchor="middle" font-size="11.5" fill="#333">3</text>

  <!-- pre-check -->
  <text x="40" y="142" font-size="11" fill="#555" font-weight="bold">预检查：missing(3)=3 ≥ k=3 → 第 k 个缺失在数组范围内，进入二分</text>

  <!-- ============ Step 1 ============ -->
  <rect x="10" y="152" width="540" height="62" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <rect x="10" y="152" width="540" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="168" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">Step 1：lo=0, hi=3, mid=1</text>

  <!-- pointers -->
  <text x="130" y="190" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">lo</text>
  <path d="M 130 192 L 130 180" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>
  <text x="220" y="190" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">mid</text>
  <path d="M 220 192 L 220 178" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>
  <text x="400" y="190" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">hi</text>
  <path d="M 400 192 L 400 180" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>

  <text x="455" y="188" font-size="10.5" fill="#446688" font-weight="bold">missing(1)=2</text>
  <text x="455" y="202" font-size="10.5" fill="#446688" font-weight="bold">&lt;3 → lo=2</text>

  <!-- ============ Step 2 ============ -->
  <rect x="10" y="222" width="540" height="62" fill="#ffffff" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <rect x="10" y="222" width="540" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">Step 2：lo=2, hi=3, mid=2</text>

  <!-- pointers -->
  <text x="310" y="260" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">lo/mid</text>
  <path d="M 310 262 L 310 248" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>
  <text x="400" y="260" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">hi</text>
  <path d="M 400 262 L 400 248" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>

  <text x="455" y="258" font-size="10.5" fill="#d6a040" font-weight="bold">missing(2)=3</text>
  <text x="455" y="272" font-size="10.5" fill="#d6a040" font-weight="bold">≥3 → hi=2</text>

  <!-- ============ Converge ============ -->
  <rect x="10" y="292" width="540" height="44" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">收敛：lo=hi=2 → 首个 missing(idx) ≥ k 的下标 = 2</text>
  <text x="280" y="328" text-anchor="middle" font-size="10.5" fill="#555">j = lo − 1 = 1（最大满足 missing &lt; k 的下标）</text>

  <!-- ============ Answer ============ -->
  <rect x="40" y="346" width="480" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">答案 = nums[j] + k − missing(j)</text>
  <text x="280" y="388" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">= nums[1] + 3 − 2 = 7 + 1 = 8  ✓</text>
  <text x="280" y="400" text-anchor="middle" font-size="10" fill="#888">第 3 个缺失数为 8（缺失序列 5,6,8,...）</text>
</svg>
