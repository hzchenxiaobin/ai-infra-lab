<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心概念：LEFT JOIN 保留左表全部行，无匹配时 NULL → 0</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">Queries 为驱动表（左表），NPV 为被连接表（右表），匹配键 = (id, year) 联合</text>

  <!-- Queries table (left) -->
  <rect x="40" y="64" width="200" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="82" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">Queries（左表）</text>

  <rect x="40" y="94" width="200" height="22" fill="#446688" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="109" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">id</text>
  <text x="160" y="109" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">year</text>

  <rect x="40" y="116" width="200" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="80" y="131" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="160" y="131" text-anchor="middle" font-size="11" fill="#555">2019</text>

  <rect x="40" y="138" width="200" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="80" y="153" text-anchor="middle" font-size="11" fill="#555">2</text>
  <text x="160" y="153" text-anchor="middle" font-size="11" fill="#555">2008</text>

  <rect x="40" y="160" width="200" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="175" text-anchor="middle" font-size="11" fill="#d6a040">2</text>
  <text x="160" y="175" text-anchor="middle" font-size="11" fill="#d6a040">2019</text>
  <text x="195" y="175" text-anchor="end" font-size="9" fill="#d6a040">⚠无匹配</text>

  <rect x="40" y="182" width="200" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="197" text-anchor="middle" font-size="11" fill="#d6a040">13</text>
  <text x="160" y="197" text-anchor="middle" font-size="11" fill="#d6a040">2018</text>
  <text x="195" y="197" text-anchor="end" font-size="9" fill="#d6a040">⚠无匹配</text>

  <text x="140" y="224" text-anchor="middle" font-size="10" fill="#888">全部行保留（驱动表）</text>

  <!-- JOIN arrow -->
  <path d="M 244 148 L 300 148" stroke="#666" stroke-width="2.2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="272" y="140" text-anchor="middle" font-size="9" fill="#666" font-weight="bold">LEFT JOIN</text>
  <text x="272" y="162" text-anchor="middle" font-size="8" fill="#888">ON id, year</text>

  <!-- NPV table (right) -->
  <rect x="306" y="64" width="260" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="436" y="82" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">NPV（右表）</text>

  <rect x="306" y="94" width="260" height="22" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="340" y="109" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">id</text>
  <text x="410" y="109" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">year</text>
  <text x="500" y="109" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">npv</text>

  <rect x="306" y="116" width="260" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="340" y="131" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="410" y="131" text-anchor="middle" font-size="11" fill="#555">2019</text>
  <text x="500" y="131" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">113</text>

  <rect x="306" y="138" width="260" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="340" y="153" text-anchor="middle" font-size="11" fill="#555">2</text>
  <text x="410" y="153" text-anchor="middle" font-size="11" fill="#555">2008</text>
  <text x="500" y="153" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">50</text>

  <rect x="306" y="160" width="260" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="340" y="175" text-anchor="middle" font-size="10" fill="#bbb">—</text>
  <text x="410" y="175" text-anchor="middle" font-size="10" fill="#bbb">—</text>
  <text x="500" y="175" text-anchor="middle" font-size="10" fill="#bbb">NULL</text>

  <rect x="306" y="182" width="260" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="340" y="197" text-anchor="middle" font-size="10" fill="#bbb">—</text>
  <text x="410" y="197" text-anchor="middle" font-size="10" fill="#bbb">—</text>
  <text x="500" y="197" text-anchor="middle" font-size="10" fill="#bbb">NULL</text>

  <text x="436" y="224" text-anchor="middle" font-size="10" fill="#888">无匹配行 → npv 列为 NULL</text>

  <!-- IFNULL arrow -->
  <path d="M 570 175 L 570 175" stroke="none"/>
  <path d="M 436 248 L 436 280" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="470" y="268" font-size="10" fill="#b85450" font-weight="bold">IFNULL / COALESCE</text>
  <text x="470" y="280" font-size="9" fill="#b85450">NULL → 0</text>

  <!-- Result table -->
  <rect x="80" y="290" width="460" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="308" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">结果表</text>

  <rect x="80" y="320" width="460" height="22" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="150" y="335" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">id</text>
  <text x="280" y="335" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">year</text>
  <text x="440" y="335" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">npv</text>

  <rect x="80" y="342" width="460" height="20" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="150" y="356" text-anchor="middle" font-size="10" fill="#555">1</text>
  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#555">2019</text>
  <text x="440" y="356" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">113</text>

  <rect x="80" y="362" width="460" height="20" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="150" y="376" text-anchor="middle" font-size="10" fill="#555">2</text>
  <text x="280" y="376" text-anchor="middle" font-size="10" fill="#555">2008</text>
  <text x="440" y="376" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">50</text>

  <rect x="80" y="382" width="460" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="150" y="396" text-anchor="middle" font-size="10" fill="#d6a040">2</text>
  <text x="280" y="396" text-anchor="middle" font-size="10" fill="#d6a040">2019</text>
  <text x="440" y="396" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0</text>

  <rect x="80" y="402" width="460" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="150" y="416" text-anchor="middle" font-size="10" fill="#d6a040">13</text>
  <text x="280" y="416" text-anchor="middle" font-size="10" fill="#d6a040">2018</text>
  <text x="440" y="416" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0</text>

  <!-- Key insight -->
  <rect x="40" y="430" width="540" height="22" rx="8" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="445" font-size="10" fill="#444" font-weight="bold">💡 LEFT JOIN 保证左表行全保留；NULL 经 IFNULL/COALESCE 填 0，即"查不到 = 净现值为 0"</text>
</svg>
