<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">位移加速除法流程（对绝对值 a, b 运算）</text>

  <!-- overflow pre-check -->
  <rect x="150" y="40" width="260" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="59" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">先特判：INT_MIN / −1 → 返回 INT_MAX</text>

  <path d="M 280 70 L 280 84" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="150" y="86" width="260" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="106" text-anchor="middle" font-size="11.5" fill="#333">neg = 异号判定；a = |dividend|, b = |divisor|, ans = 0</text>

  <path d="M 280 118 L 280 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- outer diamond: a >= b ? -->
  <polygon points="280,136 380,182 280,228 180,182" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="180" text-anchor="middle" font-size="12" fill="#444">a ≥ b ?</text>
  <text x="290" y="198" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="386" y="186" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- exit (否) -->
  <path d="M 380 182 L 432 182" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="434" y="166" width="116" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="492" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return</text>
  <text x="492" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">neg ? −ans : ans</text>

  <!-- 是 -> value=b,k=1 -->
  <path d="M 280 228 L 280 246" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="248" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="268" text-anchor="middle" font-size="11.5" fill="#333">value = b, k = 1</text>

  <path d="M 280 278 L 280 294" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- inner diamond: a >= value<<1 ? -->
  <polygon points="280,296 390,344 280,392 170,344" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="11.5" fill="#444">a ≥ value ≪ 1 ?</text>
  <text x="292" y="360" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="396" y="348" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- 是 -> value<<=1, k<<=1 (loop back to inner diamond) -->
  <rect x="370" y="328" width="150" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="445" y="348" text-anchor="middle" font-size="11" fill="#4a7a3a">value ≪= 1, k ≪= 1</text>
  <path d="M 390 344 L 368 344" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- loop back up to inner diamond right side -->
  <path d="M 445 328 L 445 300 L 390 318" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4 3"/>
  <text x="452" y="316" font-size="9.5" fill="#888">回判</text>

  <!-- 否 -> a-=value, ans+=k -->
  <path d="M 280 392 L 280 410" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="160" y="412" width="240" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="432" text-anchor="middle" font-size="11.5" fill="#333">a −= value；ans += k</text>

  <!-- loop back to outer diamond -->
  <path d="M 160 428 L 110 428 L 110 182 L 178 182" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4 3"/>
  <text x="60" y="300" font-size="10" fill="#888">外层回判</text>
  <text x="60" y="316" font-size="9.5" fill="#888">（剥离下一位）</text>

  <!-- bottom note -->
  <rect x="30" y="468" width="500" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="486" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">value 与 k 同步左移：value = 2^j · b 时 k = 2^j</text>
  <text x="280" y="502" text-anchor="middle" font-size="10.5" fill="#555">内层找「最大 2^j · b ≤ a」，外层每轮确定商的一个二进制位</text>
</svg>
