<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">删 A 只缩短 A 连续段，B 连续段纹丝不动</text>

  <!-- Original string AAABABB -->
  <text x="60" y="76" font-size="11" fill="#888">原串</text>
  <rect x="110" y="58" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="132" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">A</text>
  <rect x="156" y="58" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="178" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">A</text>
  <rect x="202" y="58" width="44" height="32" fill="#e8f0fe" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="224" y="80" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">A</text>
  <rect x="248" y="58" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">B</text>
  <rect x="294" y="58" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="316" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">A</text>
  <rect x="340" y="58" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="362" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">B</text>
  <rect x="386" y="58" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="408" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">B</text>

  <!-- Run brackets -->
  <path d="M 110 100 L 110 108 L 246 108 L 246 100" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="178" y="122" text-anchor="middle" font-size="10.5" fill="#446688">A 连续段 (L=3)</text>
  <path d="M 248 100 L 248 108 L 292 108 L 292 100" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="270" y="122" text-anchor="middle" font-size="10" fill="#4a7a3a">B (L=1)</text>
  <path d="M 294 100 L 294 108 L 338 108 L 338 100" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="316" y="122" text-anchor="middle" font-size="10" fill="#446688">A (L=1)</text>
  <path d="M 340 100 L 340 108 L 430 108 L 430 100" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="385" y="122" text-anchor="middle" font-size="10.5" fill="#4a7a3a">B 连续段 (L=2)</text>

  <!-- Arrow remove middle A -->
  <path d="M 224 132 L 224 162" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="240" y="138" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="153" text-anchor="middle" font-size="10.5" fill="#b85450">Alice 删掉中间的 A</text>

  <!-- Result string AABABB -->
  <text x="60" y="196" font-size="11" fill="#888">删后</text>
  <rect x="110" y="178" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="132" y="200" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">A</text>
  <rect x="156" y="178" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="178" y="200" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">A</text>
  <rect x="202" y="178" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="224" y="200" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">B</text>
  <rect x="248" y="178" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="200" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">A</text>
  <rect x="294" y="178" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="316" y="200" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">B</text>
  <rect x="340" y="178" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="362" y="200" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">B</text>

  <!-- Result run brackets -->
  <path d="M 110 220 L 110 228 L 200 228 L 200 220" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="155" y="242" text-anchor="middle" font-size="10.5" fill="#b85450">A 段缩成 L=2</text>
  <path d="M 202 220 L 202 228 L 246 228 L 246 220" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="224" y="242" text-anchor="middle" font-size="10" fill="#4a7a3a">B 不变</text>
  <path d="M 248 220 L 248 228 L 292 228 L 292 220" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="270" y="242" text-anchor="middle" font-size="10" fill="#446688">A 不变</text>
  <path d="M 340 220 L 340 228 L 430 228 L 430 220" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="385" y="242" text-anchor="middle" font-size="10.5" fill="#4a7a3a">B 不变</text>

  <!-- Conclusion boxes -->
  <rect x="40" y="268" width="250" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="165" y="290" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">Alice 的可删 A 数 −1（3→2 段）</text>

  <rect x="300" y="268" width="250" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="425" y="290" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">Bob 的可删 B 数：完全不变</text>

  <!-- Big formula box -->
  <rect x="40" y="320" width="500" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="346" text-anchor="middle" font-size="12" fill="#666">关键洞察</text>
  <text x="290" y="370" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">删 A 只在 A 连续段内部进行，永不触碰 B</text>
  <text x="290" y="392" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">⇒ 两个子游戏相互独立，各自数可删次数即可</text>
</svg>
