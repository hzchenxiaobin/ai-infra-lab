<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：按 0 切段，每段贡献 L(L+1)/2</text>

  <!-- String label -->
  <text x="40" y="62" font-size="12" fill="#888">s = "0110111"</text>

  <!-- Characters: 0 1 1 0 1 1 1 -->
  <rect x="112" y="70" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="160" y="70" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="208" y="70" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="256" y="70" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="304" y="70" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="328" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="352" y="70" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="400" y="70" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="424" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- Group 1 bracket -->
  <path d="M 160 112 L 160 120 L 256 120 L 256 112" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="208" y="138" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">段1: L = 2</text>

  <!-- Group 2 bracket -->
  <path d="M 304 112 L 304 120 L 448 120 L 448 112" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="376" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">段2: L = 3</text>

  <!-- 0 as separator note -->
  <text x="136" y="138" text-anchor="middle" font-size="10" fill="#b85450">屏障</text>
  <text x="280" y="138" text-anchor="middle" font-size="10" fill="#b85450">屏障</text>

  <!-- Group 1 contribution box -->
  <rect x="76" y="162" width="170" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="161" y="184" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">段1: L = 2</text>
  <text x="161" y="204" text-anchor="middle" font-size="11" fill="#555">1 + 2 = 2×3/2 = 3</text>

  <!-- Plus sign -->
  <text x="266" y="198" text-anchor="middle" font-size="18" fill="#888" font-weight="bold">+</text>

  <!-- Group 2 contribution box -->
  <rect x="286" y="162" width="190" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="381" y="184" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">段2: L = 3</text>
  <text x="381" y="204" text-anchor="middle" font-size="11" fill="#555">1 + 2 + 3 = 3×4/2 = 6</text>

  <!-- Sum -->
  <rect x="160" y="242" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="268" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">合计 = 3 + 6 = 9</text>

  <!-- Formula box -->
  <rect x="40" y="302" width="480" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键公式：长度为 L 的连续 1 段贡献 L(L+1)/2 个全 1 子串</text>
  <text x="280" y="344" text-anchor="middle" font-size="11" fill="#666">固定右端点 i：向左可延伸 1,2,…,i 共 i 个全 1 子串，累加得 1+2+…+L</text>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#888">'0' 是天然段间屏障，各段独立计数后求和</text>
</svg>
