<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：位枚举法 nums=[3,2,1,5]，maxOR=7</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">枚举 1..2⁴−1 共 15 个非空子集，逐个算 OR，命中 7 即计数</text>

  <g font-size="10" filter="url(#rough2)">
    <!-- ===== Row 1: mask 1..5 ===== -->
    <!-- mask=1 {3} OR=3 -->
    <rect x="28" y="64" width="92" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6"/>
    <text x="74" y="82" text-anchor="middle" fill="#888" font-size="9">mask=0001</text>
    <text x="74" y="102" text-anchor="middle" fill="#555" font-family="monospace" font-weight="bold">{3}</text>
    <text x="74" y="126" text-anchor="middle" fill="#d6a040" font-weight="bold">OR=3</text>
    <!-- mask=2 {2} OR=2 -->
    <rect x="128" y="64" width="92" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6"/>
    <text x="174" y="82" text-anchor="middle" fill="#888" font-size="9">mask=0010</text>
    <text x="174" y="102" text-anchor="middle" fill="#555" font-family="monospace" font-weight="bold">{2}</text>
    <text x="174" y="126" text-anchor="middle" fill="#d6a040" font-weight="bold">OR=2</text>
    <!-- mask=3 {3,2} OR=3 -->
    <rect x="228" y="64" width="92" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6"/>
    <text x="274" y="82" text-anchor="middle" fill="#888" font-size="9">mask=0011</text>
    <text x="274" y="102" text-anchor="middle" fill="#555" font-family="monospace" font-weight="bold">{3,2}</text>
    <text x="274" y="126" text-anchor="middle" fill="#d6a040" font-weight="bold">OR=3</text>
    <!-- mask=4 {1} OR=1 -->
    <rect x="328" y="64" width="92" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6"/>
    <text x="374" y="82" text-anchor="middle" fill="#888" font-size="9">mask=0100</text>
    <text x="374" y="102" text-anchor="middle" fill="#555" font-family="monospace" font-weight="bold">{1}</text>
    <text x="374" y="126" text-anchor="middle" fill="#d6a040" font-weight="bold">OR=1</text>
    <!-- mask=5 {3,1} OR=3 -->
    <rect x="428" y="64" width="92" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6"/>
    <text x="474" y="82" text-anchor="middle" fill="#888" font-size="9">mask=0101</text>
    <text x="474" y="102" text-anchor="middle" fill="#555" font-family="monospace" font-weight="bold">{3,1}</text>
    <text x="474" y="126" text-anchor="middle" fill="#d6a040" font-weight="bold">OR=3</text>

    <!-- ===== Row 2: mask 6..10 ===== -->
    <!-- mask=6 {2,1} OR=3 -->
    <rect x="28" y="150" width="92" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6"/>
    <text x="74" y="168" text-anchor="middle" fill="#888" font-size="9">mask=0110</text>
    <text x="74" y="188" text-anchor="middle" fill="#555" font-family="monospace" font-weight="bold">{2,1}</text>
    <text x="74" y="212" text-anchor="middle" fill="#d6a040" font-weight="bold">OR=3</text>
    <!-- mask=7 {3,2,1} OR=3 -->
    <rect x="128" y="150" width="92" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6"/>
    <text x="174" y="168" text-anchor="middle" fill="#888" font-size="9">mask=0111</text>
    <text x="174" y="188" text-anchor="middle" fill="#555" font-family="monospace" font-weight="bold">{3,2,1}</text>
    <text x="174" y="212" text-anchor="middle" fill="#d6a040" font-weight="bold">OR=3</text>
    <!-- mask=8 {5} OR=5 -->
    <rect x="228" y="150" width="92" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6"/>
    <text x="274" y="168" text-anchor="middle" fill="#888" font-size="9">mask=1000</text>
    <text x="274" y="188" text-anchor="middle" fill="#555" font-family="monospace" font-weight="bold">{5}</text>
    <text x="274" y="212" text-anchor="middle" fill="#d6a040" font-weight="bold">OR=5</text>
    <!-- mask=9 {3,5} OR=7 HIT -->
    <rect x="328" y="150" width="92" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="374" y="168" text-anchor="middle" fill="#888" font-size="9">mask=1001</text>
    <text x="374" y="188" text-anchor="middle" fill="#4a7a3a" font-family="monospace" font-weight="bold">{3,5}</text>
    <text x="374" y="212" text-anchor="middle" fill="#4a7a3a" font-weight="bold">OR=7 ✓</text>
    <!-- mask=10 {2,5} OR=7 HIT -->
    <rect x="428" y="150" width="92" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="474" y="168" text-anchor="middle" fill="#888" font-size="9">mask=1010</text>
    <text x="474" y="188" text-anchor="middle" fill="#4a7a3a" font-family="monospace" font-weight="bold">{2,5}</text>
    <text x="474" y="212" text-anchor="middle" fill="#4a7a3a" font-weight="bold">OR=7 ✓</text>

    <!-- ===== Row 3: mask 11..15 ===== -->
    <!-- mask=11 {3,2,5} OR=7 HIT -->
    <rect x="28" y="236" width="92" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="74" y="254" text-anchor="middle" fill="#888" font-size="9">mask=1011</text>
    <text x="74" y="274" text-anchor="middle" fill="#4a7a3a" font-family="monospace" font-weight="bold">{3,2,5}</text>
    <text x="74" y="298" text-anchor="middle" fill="#4a7a3a" font-weight="bold">OR=7 ✓</text>
    <!-- mask=12 {1,5} OR=5 -->
    <rect x="128" y="236" width="92" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6"/>
    <text x="174" y="254" text-anchor="middle" fill="#888" font-size="9">mask=1100</text>
    <text x="174" y="274" text-anchor="middle" fill="#555" font-family="monospace" font-weight="bold">{1,5}</text>
    <text x="174" y="298" text-anchor="middle" fill="#d6a040" font-weight="bold">OR=5</text>
    <!-- mask=13 {3,1,5} OR=7 HIT -->
    <rect x="228" y="236" width="92" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="274" y="254" text-anchor="middle" fill="#888" font-size="9">mask=1101</text>
    <text x="274" y="274" text-anchor="middle" fill="#4a7a3a" font-family="monospace" font-weight="bold">{3,1,5}</text>
    <text x="274" y="298" text-anchor="middle" fill="#4a7a3a" font-weight="bold">OR=7 ✓</text>
    <!-- mask=14 {2,1,5} OR=7 HIT -->
    <rect x="328" y="236" width="92" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="374" y="254" text-anchor="middle" fill="#888" font-size="9">mask=1110</text>
    <text x="374" y="274" text-anchor="middle" fill="#4a7a3a" font-family="monospace" font-weight="bold">{2,1,5}</text>
    <text x="374" y="298" text-anchor="middle" fill="#4a7a3a" font-weight="bold">OR=7 ✓</text>
    <!-- mask=15 {3,2,1,5} OR=7 HIT -->
    <rect x="428" y="236" width="92" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="474" y="254" text-anchor="middle" fill="#888" font-size="9">mask=1111</text>
    <text x="474" y="274" text-anchor="middle" fill="#4a7a3a" font-family="monospace" font-weight="bold">{3,2,1,5}</text>
    <text x="474" y="298" text-anchor="middle" fill="#4a7a3a" font-weight="bold">OR=7 ✓</text>
  </g>

  <!-- ===== Result box ===== -->
  <rect x="30" y="326" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="346" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">命中 OR==7 的非空子集共 6 个 → 答案 6</text>

  <!-- ===== Insight ===== -->
  <rect x="30" y="366" width="480" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="384" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">💡 mask 第 i 位为 1 表示选 nums[i]；2ⁿ 个 mask ↔ 2ⁿ 个子集（一一对应）</text>
  <text x="270" y="400" text-anchor="middle" font-size="9" fill="#555">只要含 5（第 3 位）的子集都把高位点亮 → OR=7；不含 5 的最高只能 OR=3</text>
</svg>
