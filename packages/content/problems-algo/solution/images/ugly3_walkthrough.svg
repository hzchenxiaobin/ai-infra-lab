<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：n=3, a=2, b=3, c=5</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">lcm(2,3)=6, lcm(2,5)=10, lcm(3,5)=15, lcm(2,3,5)=30 · 区间 [1, 6]</text>

  <!-- table header -->
  <rect x="40" y="56" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="80" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">轮次</text>
  <rect x="122" y="56" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="172" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">[lo, hi]</text>
  <rect x="224" y="56" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="249" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">mid</text>
  <rect x="276" y="56" width="180" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="366" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">cnt = f(mid)</text>
  <rect x="458" y="56" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="493" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">动作</text>

  <!-- Row 1 -->
  <rect x="40" y="86" width="80" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="108" text-anchor="middle" font-size="11" fill="#444">1</text>
  <rect x="122" y="86" width="100" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="172" y="108" text-anchor="middle" font-size="11" fill="#444">[1, 6]</text>
  <rect x="224" y="86" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="249" y="108" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <rect x="276" y="86" width="180" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="366" y="103" text-anchor="middle" font-size="10" fill="#666">1+1+0−0−0−0+0 = 2</text>
  <text x="366" y="116" text-anchor="middle" font-size="9" fill="#888">⌊3/2⌋+⌊3/3⌋+⌊3/5⌋</text>
  <rect x="458" y="86" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="493" y="103" text-anchor="middle" font-size="10" fill="#b85450">2 &lt; 3</text>
  <text x="493" y="116" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">lo=4</text>

  <!-- Row 2 -->
  <rect x="40" y="124" width="80" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="146" text-anchor="middle" font-size="11" fill="#444">2</text>
  <rect x="122" y="124" width="100" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="172" y="146" text-anchor="middle" font-size="11" fill="#444">[4, 6]</text>
  <rect x="224" y="124" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="249" y="146" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">5</text>
  <rect x="276" y="124" width="180" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="366" y="141" text-anchor="middle" font-size="10" fill="#666">2+1+1−0−0−0+0 = 4</text>
  <text x="366" y="154" text-anchor="middle" font-size="9" fill="#888">⌊5/2⌋+⌊5/3⌋+⌊5/5⌋</text>
  <rect x="458" y="124" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="493" y="141" text-anchor="middle" font-size="10" fill="#4a7a3a">4 ≥ 3</text>
  <text x="493" y="154" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">ans=5</text>

  <!-- Row 3 -->
  <rect x="40" y="162" width="80" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="184" text-anchor="middle" font-size="11" fill="#444">3</text>
  <rect x="122" y="162" width="100" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="172" y="184" text-anchor="middle" font-size="11" fill="#444">[4, 4]</text>
  <rect x="224" y="162" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="249" y="184" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4</text>
  <rect x="276" y="162" width="180" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="366" y="179" text-anchor="middle" font-size="10" fill="#666">2+1+0−0−0−0+0 = 3</text>
  <text x="366" y="192" text-anchor="middle" font-size="9" fill="#888">⌊4/2⌋+⌊4/3⌋+⌊4/5⌋</text>
  <rect x="458" y="162" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="493" y="179" text-anchor="middle" font-size="10" fill="#4a7a3a">3 ≥ 3</text>
  <text x="493" y="192" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">ans=4</text>

  <!-- Row 4: end -->
  <rect x="40" y="200" width="80" height="30" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="220" text-anchor="middle" font-size="10" fill="#888">lo=5&gt;hi=4</text>
  <rect x="122" y="200" width="408" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="326" y="220" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">循环结束，返回 ans = 4</text>

  <!-- ===== candidate number line ===== -->
  <text x="40" y="258" font-size="11" fill="#888" font-weight="bold">[1,6] 中能被 2/3/5 整除的数：</text>

  <line x1="60" y1="290" x2="500" y2="290" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <!-- ticks 1..6 -->
  <rect x="76" y="278" width="40" height="24" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="96" y="294" text-anchor="middle" font-size="11" fill="#999">1</text>
  <rect x="148" y="278" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="168" y="294" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <rect x="220" y="278" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="240" y="294" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="292" y="278" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="294" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <rect x="364" y="278" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="384" y="294" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">5</text>
  <rect x="436" y="278" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="456" y="294" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6</text>

  <!-- answer pointer -->
  <polygon points="312,304 306,314 318,314" fill="#b85450" filter="url(#rough2)"/>
  <text x="312" y="330" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">第 3 个 = 4</text>

  <!-- legend -->
  <text x="60" y="356" font-size="10" fill="#888">2=蓝(a) · 3=绿(b) · 5=橙(c) · 6=红(同时被 2 和 3 整除)</text>

  <!-- key insight -->
  <rect x="40" y="372" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键：cnt=3 时 mid=4 恰是答案，但 cnt 可跳变</text>
  <text x="280" y="410" text-anchor="middle" font-size="11" fill="#666">f(4)=3, f(5)=4 —— 「恰好等于 n」不连续出现，故二分找「≥ n 的最小 x」</text>
  <text x="280" y="424" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">而非逐个枚举找「f(x) == n」</text>
</svg>
