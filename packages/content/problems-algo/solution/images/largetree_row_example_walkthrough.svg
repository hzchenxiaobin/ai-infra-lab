<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：[1,3,2,5,3,null,9] 逐层取最大</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">3 轮 while，每轮维护 maxVal，最终 [1, 3, 9]</text>

  <!-- ===== Round 1 ===== -->
  <text x="30" y="74" font-size="11" fill="#b85450" font-weight="bold">轮次 1：队列=[1], size=1</text>
  <g font-size="10">
    <rect x="30" y="84" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="50" y="102" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <text x="82" y="98" font-size="9" fill="#888">→ 出队 1，入队子节点 3, 2</text>
    <path d="M 250 98 L 290 98" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
    <rect x="300" y="86" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="340" y="100" text-anchor="middle" font-size="9" fill="#b85450">maxVal=1</text>
    <text x="392" y="100" font-size="9" fill="#888">← 唯一节点，直接为 max</text>
    <text x="300" y="120" font-size="8" fill="#888">result: [1]</text>
  </g>

  <!-- ===== Round 2 ===== -->
  <text x="30" y="148" font-size="11" fill="#446688" font-weight="bold">轮次 2：队列=[3,2], size=2</text>
  <g font-size="10">
    <rect x="30" y="158" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="48" y="174" text-anchor="middle" fill="#b85450" font-size="9">3</text>
    <rect x="68" y="158" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="86" y="174" text-anchor="middle" fill="#446688" font-size="9">2</text>
    <text x="115" y="172" font-size="9" fill="#888">→ 出队 3、2（入队 5, 3）</text>
    <rect x="300" y="158" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="340" y="172" text-anchor="middle" font-size="9" fill="#b85450">maxVal=3</text>
    <text x="392" y="172" font-size="9" fill="#888">3&gt;2，max 不变</text>
    <text x="300" y="194" font-size="8" fill="#888">result: [1, 3]</text>
  </g>

  <!-- ===== Round 3 ===== -->
  <text x="30" y="222" font-size="11" fill="#d6a040" font-weight="bold">轮次 3：队列=[5,3,9], size=3</text>
  <g font-size="10">
    <rect x="30" y="232" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="48" y="248" text-anchor="middle" fill="#446688" font-size="9">5</text>
    <rect x="68" y="232" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="86" y="248" text-anchor="middle" fill="#446688" font-size="9">3</text>
    <rect x="106" y="232" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="124" y="248" text-anchor="middle" fill="#b85450" font-size="9">9</text>
    <text x="153" y="246" font-size="9" fill="#888">→ 出队 5、3、9（均无子）</text>
    <rect x="300" y="232" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="340" y="246" text-anchor="middle" font-size="9" fill="#888">5→5</text>
    <text x="392" y="246" font-size="9" fill="#888">初值 5</text>
    <rect x="300" y="258" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="340" y="272" text-anchor="middle" font-size="9" fill="#888">5→5</text>
    <text x="392" y="272" font-size="9" fill="#888">3&lt;5，不变</text>
    <rect x="300" y="284" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="340" y="298" text-anchor="middle" font-size="9" fill="#b85450">5→9</text>
    <text x="392" y="298" font-size="9" fill="#b85450">9&gt;5，更新</text>
    <text x="300" y="320" font-size="8" fill="#888">result: [1, 3, 9]</text>
  </g>

  <!-- ===== Round 4: end ===== -->
  <text x="30" y="346" font-size="11" fill="#888" font-weight="bold">轮次 4：队列=[]，while 结束</text>
  <rect x="30" y="354" width="40" height="22" fill="#eee" stroke="#ccc" stroke-width="0.8" stroke-dasharray="2,2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="368" text-anchor="middle" font-size="9" fill="#888">空</text>
  <text x="80" y="368" font-size="9" fill="#888">→ 队列为空，退出 while，返回 result</text>

  <!-- ===== Final result ===== -->
  <line x1="20" y1="392" x2="520" y2="392" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <rect x="30" y="408" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="434" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">最终结果：[1, 3, 9] —— 每层只留一个 max，结果是一维数组</text>
</svg>
