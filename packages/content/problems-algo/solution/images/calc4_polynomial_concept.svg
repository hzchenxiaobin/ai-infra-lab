<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">多项式 = 「项 → 系数」映射</text>

  <!-- expression box -->
  <rect x="30" y="46" width="240" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="68" font-size="12" fill="#446688" font-weight="bold">表达式</text>
  <text x="42" y="86" font-size="12" fill="#333" font-family="'Comic Sans MS', monospace">(e + 8) * (e - 8)</text>

  <!-- arrow -->
  <path d="M 270 71 L 318 71" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- polynomial map box -->
  <rect x="320" y="46" width="230" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="332" y="68" font-size="12" fill="#4a7a3a" font-weight="bold">多项式 map</text>
  <text x="332" y="86" font-size="12" fill="#333" font-family="'Comic Sans MS', monospace">{ "e*e": 1, "": -64 }</text>

  <!-- key explanation -->
  <rect x="30" y="112" width="520" height="56" fill="#f4f4f4" stroke="#888" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="42" y="132" font-size="12" fill="#444" font-weight="bold">键 = 变量按字典序排序后用 * 连接；常数项键为空串 ""</text>
  <text x="42" y="150" font-size="11" fill="#666" font-family="'Comic Sans MS', monospace">2*a*a*b - 3  →  { "a*a*b": 2, "": -3 }</text>
  <text x="42" y="164" font-size="11" fill="#888">变量可重复，用有序列表而非集合</text>

  <!-- three operations title -->
  <text x="290" y="196" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">三种运算都化为 map 操作</text>

  <!-- add -->
  <rect x="30" y="212" width="165" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="232" font-size="12" fill="#446688" font-weight="bold">a + b（加）</text>
  <text x="42" y="252" font-size="11" fill="#333">合并两 map</text>
  <text x="42" y="268" font-size="11" fill="#333">同键系数相加</text>
  <text x="42" y="284" font-size="11" fill="#b85450">和为 0 → 删键</text>

  <!-- sub -->
  <rect x="208" y="212" width="165" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="220" y="232" font-size="12" fill="#d6a040" font-weight="bold">a - b（减）</text>
  <text x="220" y="252" font-size="11" fill="#333">合并两 map</text>
  <text x="220" y="268" font-size="11" fill="#333">同键系数相减</text>
  <text x="220" y="284" font-size="11" fill="#b85450">差为 0 → 删键</text>

  <!-- mul -->
  <rect x="386" y="212" width="164" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="398" y="232" font-size="12" fill="#b85450" font-weight="bold">a * b（乘）</text>
  <text x="398" y="250" font-size="11" fill="#333">分配律：每对项</text>
  <text x="398" y="265" font-size="11" fill="#333">变量拼接后</text>
  <text x="398" y="280" font-size="11" fill="#b85450" font-weight="bold">重新 sort 再拼键</text>

  <!-- mul highlight note -->
  <rect x="30" y="312" width="520" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)" opacity="0.6"/>
  <text x="42" y="332" font-size="12" fill="#b85450" font-weight="bold">★ 乘法是核心：分配展开 + 重新排序变量，同类项自动合并</text>
  <text x="42" y="350" font-size="11" fill="#444" font-family="'Comic Sans MS', monospace">e*e → {e*e:1},  e*(-8) → {e:-8},  8*e → {e:8},  8*(-8) → {":-64"}</text>
  <text x="42" y="368" font-size="11" fill="#888">两个 e 项 -8+8=0 被删 → 平方差公式的算法体现</text>
</svg>
