<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">三例演算对比</text>

  <!-- ===== 示例 1: 二元环 ===== -->
  <rect x="20" y="40" width="520" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="34" y="58" font-size="11" fill="#d6a040" font-weight="bold">示例 1：favorite = [2,2,1,2,2] → 二元环 1⟷2</text>

  <!-- 节点 0->2, 3->2, 4->2 (挂链), 1<->2 -->
  <circle cx="60" cy="90" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="94" text-anchor="middle" font-size="10" fill="#333">0</text>
  <circle cx="100" cy="90" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="100" y="94" text-anchor="middle" font-size="10" fill="#333">3</text>
  <circle cx="140" cy="90" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="140" y="94" text-anchor="middle" font-size="10" fill="#333">4</text>

  <circle cx="100" cy="130" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="134" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <circle cx="160" cy="130" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="134" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <path d="M 60 103 Q 80 116 90 118" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 100 103 Q 100 112 100 116" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 140 103 Q 150 116 155 118" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 115 130 L 145 130" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 145 134 L 115 134" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <text x="60" y="115" text-anchor="middle" font-size="8" fill="#446688">depth=0</text>
  <text x="160" y="115" text-anchor="middle" font-size="8" fill="#4a7a3a">depth=1</text>

  <rect x="200" y="78" width="320" height="70" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="210" y="96" font-size="10" fill="#333">Kahn: 0,3,4 入队（indeg=0）→ depth[2]=1</text>
  <text x="210" y="110" font-size="10" fill="#333">剩余环 1⟷2（k=2）→ 二元环</text>
  <text x="210" y="124" font-size="10" fill="#d6a040" font-weight="bold">sum2 = 2 + depth[1] + depth[2] = 2+0+1 = 3</text>
  <text x="210" y="138" font-size="10" fill="#b85450" font-weight="bold">ans = max(0, 3) = 3 ✓</text>

  <!-- ===== 示例 2: 长环 3 ===== -->
  <rect x="20" y="170" width="520" height="110" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="34" y="188" font-size="11" fill="#b85450" font-weight="bold">示例 2：favorite = [1,2,0] → 长环 0→1→2→0（k=3）</text>

  <circle cx="80" cy="230" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="80" y="234" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <circle cx="140" cy="230" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="234" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <circle cx="110" cy="266" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="270" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <path d="M 95 228 L 125 228" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 140 246 Q 130 256 122 260" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 100 260 Q 90 250 76 242" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="200" y="196" width="320" height="76" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="210" y="214" font-size="10" fill="#333">indeg = [1,1,1]，无 indeg=0 节点</text>
  <text x="210" y="228" font-size="10" fill="#333">Kahn 队列为空，所有节点都在环上</text>
  <text x="210" y="242" font-size="10" fill="#333">环 [0,1,2] 长 3 ≥ 3 → 长环独占</text>
  <text x="210" y="256" font-size="10" fill="#b85450" font-weight="bold">maxCycle = 3, sum2 = 0, ans = max(3,0) = 3 ✓</text>

  <!-- ===== 示例 3: 长环 4 ===== -->
  <rect x="20" y="290" width="520" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="34" y="308" font-size="11" fill="#b85450" font-weight="bold">示例 3：favorite = [3,0,1,4,1] → 长环 0→3→4→1→0（k=4）</text>

  <!-- 节点 2->1 挂链 -->
  <circle cx="50" cy="350" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="50" y="354" text-anchor="middle" font-size="10" fill="#333">2</text>
  <path d="M 60 356 Q 70 366 76 370" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 环 0->3->4->1->0 -->
  <circle cx="90" cy="340" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="344" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <circle cx="150" cy="340" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="344" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <circle cx="150" cy="380" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="384" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <circle cx="90" cy="380" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="384" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <path d="M 105 338 L 135 338" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 150 355 L 150 365" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 135 380 L 105 380" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 90 365 L 90 355" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="50" y="338" text-anchor="middle" font-size="8" fill="#4a7a3a">depth=0</text>
  <text x="90" y="408" text-anchor="middle" font-size="8" fill="#4a7a3a">depth=1</text>

  <rect x="210" y="316" width="320" height="84" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="220" y="334" font-size="10" fill="#333">indeg = [1,2,0,1,1]，Kahn 从 2 入队</text>
  <text x="220" y="348" font-size="10" fill="#333">处理 2→1：depth[1]=1, indeg[1]=1</text>
  <text x="220" y="362" font-size="10" fill="#333">剩余环 [0,3,4,1] 长 4 ≥ 3 → 长环独占</text>
  <text x="220" y="376" font-size="10" fill="#888">（depth[1]=1 被忽略，长环不接挂链）</text>
  <text x="220" y="392" font-size="10" fill="#b85450" font-weight="bold">maxCycle=4, sum2=0, ans=max(4,0)=4 ✓</text>

  <!-- 底部小结 -->
  <text x="280" y="438" text-anchor="middle" font-size="10" fill="#444">二元环取 sum（可拼桌）· 长环取 max（独占）· 最终 max(maxCycle, sum2)</text>
</svg>
