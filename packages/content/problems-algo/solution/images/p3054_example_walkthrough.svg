<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：父亲集合一次算清，逐节点两问定型</text>

  <rect x="40" y="38" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">父亲集合 = DISTINCT P（去掉 null）= {2, 5, 8}</text>

  <rect x="30" y="96" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="66" y="96" width="64" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="130" y="96" width="64" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="194" y="96" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="111" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">N</text>
  <text x="98" y="111" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">P 为 null?</text>
  <text x="162" y="111" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">N 在父集?</text>
  <text x="220" y="111" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">type</text>

  <g font-size="10" fill="#333" filter="url(#rough2)">
    <rect x="30" y="118" width="36" height="21" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="48" y="132" text-anchor="middle">1</text>
    <rect x="66" y="118" width="64" height="21" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="98" y="132" text-anchor="middle">否</text>
    <rect x="130" y="118" width="64" height="21" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="162" y="132" text-anchor="middle">否</text>
    <rect x="194" y="118" width="52" height="21" fill="#e6f4ea" stroke="#4a7a3a" filter="url(#rough2)"/><text x="220" y="132" text-anchor="middle" fill="#4a7a3a">Leaf</text>

    <rect x="30" y="139" width="36" height="21" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="48" y="153" text-anchor="middle">2</text>
    <rect x="66" y="139" width="64" height="21" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="98" y="153" text-anchor="middle">否</text>
    <rect x="130" y="139" width="64" height="21" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="162" y="153" text-anchor="middle">是（1、3 的爹）</text>
    <rect x="194" y="139" width="52" height="21" fill="#e8f0fe" stroke="#446688" filter="url(#rough2)"/><text x="220" y="153" text-anchor="middle" fill="#446688">Inner</text>

    <rect x="30" y="160" width="36" height="21" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="48" y="174" text-anchor="middle">3</text>
    <rect x="66" y="160" width="64" height="21" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="98" y="174" text-anchor="middle">否</text>
    <rect x="130" y="160" width="64" height="21" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="162" y="174" text-anchor="middle">否</text>
    <rect x="194" y="160" width="52" height="21" fill="#e6f4ea" stroke="#4a7a3a" filter="url(#rough2)"/><text x="220" y="174" text-anchor="middle" fill="#4a7a3a">Leaf</text>

    <rect x="30" y="181" width="36" height="21" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="48" y="195" text-anchor="middle">5</text>
    <rect x="66" y="181" width="64" height="21" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="98" y="195" text-anchor="middle">是</text>
    <rect x="130" y="181" width="64" height="21" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="162" y="195" text-anchor="middle">—（用不着）</text>
    <rect x="194" y="181" width="52" height="21" fill="#fff8e1" stroke="#d6a040" filter="url(#rough2)"/><text x="220" y="195" text-anchor="middle" fill="#8a6d1a">Root</text>

    <rect x="30" y="202" width="36" height="21" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="48" y="216" text-anchor="middle">6</text>
    <rect x="66" y="202" width="64" height="21" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="98" y="216" text-anchor="middle">否</text>
    <rect x="130" y="202" width="64" height="21" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="162" y="216" text-anchor="middle">否</text>
    <rect x="194" y="202" width="52" height="21" fill="#e6f4ea" stroke="#4a7a3a" filter="url(#rough2)"/><text x="220" y="216" text-anchor="middle" fill="#4a7a3a">Leaf</text>

    <rect x="30" y="223" width="36" height="21" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="48" y="237" text-anchor="middle">8</text>
    <rect x="66" y="223" width="64" height="21" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="98" y="237" text-anchor="middle">否</text>
    <rect x="130" y="223" width="64" height="21" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="162" y="237" text-anchor="middle">是（6、9 的爹）</text>
    <rect x="194" y="223" width="52" height="21" fill="#e8f0fe" stroke="#446688" filter="url(#rough2)"/><text x="220" y="237" text-anchor="middle" fill="#446688">Inner</text>

    <rect x="30" y="244" width="36" height="21" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="48" y="258" text-anchor="middle">9</text>
    <rect x="66" y="244" width="64" height="21" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="98" y="258" text-anchor="middle">否</text>
    <rect x="130" y="244" width="64" height="21" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="162" y="258" text-anchor="middle">否</text>
    <rect x="194" y="244" width="52" height="21" fill="#e6f4ea" stroke="#4a7a3a" filter="url(#rough2)"/><text x="220" y="258" text-anchor="middle" fill="#4a7a3a">Leaf</text>
  </g>

  <path d="M 258 180 L 330 180" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="170" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">ORDER BY N</text>

  <rect x="336" y="96" width="44" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="380" y="96" width="66" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="358" y="111" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">N</text>
  <text x="413" y="111" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">type</text>

  <g font-size="10" fill="#333" filter="url(#rough2)">
    <rect x="336" y="118" width="44" height="21" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="358" y="132" text-anchor="middle">1</text>
    <rect x="380" y="118" width="66" height="21" fill="#e6f4ea" stroke="#4a7a3a" filter="url(#rough2)"/><text x="413" y="132" text-anchor="middle" fill="#4a7a3a">Leaf</text>

    <rect x="336" y="139" width="44" height="21" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="358" y="153" text-anchor="middle">2</text>
    <rect x="380" y="139" width="66" height="21" fill="#e8f0fe" stroke="#446688" filter="url(#rough2)"/><text x="413" y="153" text-anchor="middle" fill="#446688">Inner</text>

    <rect x="336" y="160" width="44" height="21" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="358" y="174" text-anchor="middle">3</text>
    <rect x="380" y="160" width="66" height="21" fill="#e6f4ea" stroke="#4a7a3a" filter="url(#rough2)"/><text x="413" y="174" text-anchor="middle" fill="#4a7a3a">Leaf</text>

    <rect x="336" y="181" width="44" height="21" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="358" y="195" text-anchor="middle">5</text>
    <rect x="380" y="181" width="66" height="21" fill="#fff8e1" stroke="#d6a040" filter="url(#rough2)"/><text x="413" y="195" text-anchor="middle" fill="#8a6d1a">Root</text>

    <rect x="336" y="202" width="44" height="21" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="358" y="216" text-anchor="middle">6</text>
    <rect x="380" y="202" width="66" height="21" fill="#e6f4ea" stroke="#4a7a3a" filter="url(#rough2)"/><text x="413" y="216" text-anchor="middle" fill="#4a7a3a">Leaf</text>

    <rect x="336" y="223" width="44" height="21" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="358" y="237" text-anchor="middle">8</text>
    <rect x="380" y="223" width="66" height="21" fill="#e8f0fe" stroke="#446688" filter="url(#rough2)"/><text x="413" y="237" text-anchor="middle" fill="#446688">Inner</text>

    <rect x="336" y="244" width="44" height="21" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="358" y="258" text-anchor="middle">9</text>
    <rect x="380" y="244" width="66" height="21" fill="#e6f4ea" stroke="#4a7a3a" filter="url(#rough2)"/><text x="413" y="258" text-anchor="middle" fill="#4a7a3a">Leaf</text>
  </g>

  <rect x="40" y="290" width="480" height="60" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="313" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">自检：7 = 1 个根 + 2 个内部 + 4 个叶子</text>
  <text x="280" y="335" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">每个 Inner 的 N 必然出现在父亲集合 {2, 5, 8} 里 —— 根 5 也在，但它先被 P IS NULL 截胡</text>

  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">输入行的顺序是 1,3,6,9,2,8,5 —— 输出务必 ORDER BY N 排成 1..9</text>
</svg>
