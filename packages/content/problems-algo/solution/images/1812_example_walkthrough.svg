<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="330" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：三个坐标的奇偶判定</text>

  <!-- Table outline -->
  <!-- Header row -->
  <rect x="40" y="50" width="460" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g font-size="12" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="75" y="70" filter="url(#rough2)">输入</text>
    <text x="137" y="70" filter="url(#rough2)">列号</text>
    <text x="192" y="70" filter="url(#rough2)">行号</text>
    <text x="252" y="70" filter="url(#rough2)">列+行</text>
    <text x="312" y="70" filter="url(#rough2)">奇偶</text>
    <text x="375" y="70" filter="url(#rough2)">颜色</text>
    <text x="455" y="70" filter="url(#rough2)">结果</text>
  </g>

  <!-- Column separators (dashed) -->
  <g stroke="#ccc" stroke-width="1" stroke-dasharray="3,2">
    <path d="M 110 50 L 110 178" filter="url(#rough2)"/>
    <path d="M 165 50 L 165 178" filter="url(#rough2)"/>
    <path d="M 220 50 L 220 178" filter="url(#rough2)"/>
    <path d="M 285 50 L 285 178" filter="url(#rough2)"/>
    <path d="M 340 50 L 340 178" filter="url(#rough2)"/>
    <path d="M 410 50 L 410 178" filter="url(#rough2)"/>
  </g>

  <!-- Row 1: a1 -> black -> false -->
  <rect x="40" y="82" width="460" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="75" y="102" font-weight="bold" filter="url(#rough2)">"a1"</text>
    <text x="137" y="102" filter="url(#rough2)">1</text>
    <text x="192" y="102" filter="url(#rough2)">1</text>
    <text x="252" y="102" filter="url(#rough2)">2</text>
    <text x="312" y="102" fill="#b85450" filter="url(#rough2)">偶</text>
  </g>
  <rect x="340" y="84" width="70" height="28" fill="#446688" stroke="#34557a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="375" y="102" text-anchor="middle" font-size="12" fill="#fff8e1" font-weight="bold" filter="url(#rough2)">黑</text>
  <rect x="410" y="84" width="90" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="455" y="102" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>

  <!-- Row 2: h3 -> white -> true -->
  <rect x="40" y="114" width="460" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="75" y="134" font-weight="bold" filter="url(#rough2)">"h3"</text>
    <text x="137" y="134" filter="url(#rough2)">8</text>
    <text x="192" y="134" filter="url(#rough2)">3</text>
    <text x="252" y="134" filter="url(#rough2)">11</text>
    <text x="312" y="134" fill="#4a7a3a" filter="url(#rough2)">奇</text>
  </g>
  <rect x="340" y="116" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="375" y="134" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">白</text>
  <rect x="410" y="116" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="455" y="134" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>

  <!-- Row 3: c7 -> black -> false -->
  <rect x="40" y="146" width="460" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="75" y="166" font-weight="bold" filter="url(#rough2)">"c7"</text>
    <text x="137" y="166" filter="url(#rough2)">3</text>
    <text x="192" y="166" filter="url(#rough2)">7</text>
    <text x="252" y="166" filter="url(#rough2)">10</text>
    <text x="312" y="166" fill="#b85450" filter="url(#rough2)">偶</text>
  </g>
  <rect x="340" y="148" width="70" height="28" fill="#446688" stroke="#34557a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="375" y="166" text-anchor="middle" font-size="12" fill="#fff8e1" font-weight="bold" filter="url(#rough2)">黑</text>
  <rect x="410" y="148" width="90" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="455" y="166" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>

  <!-- Divider -->
  <path d="M 40 196 L 500 196" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ASCII shortcut box -->
  <rect x="50" y="208" width="440" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="228" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">ASCII 直算（无需转数字）</text>
  <text x="270" y="248" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">"a1": 'a'(97) + '1'(49) = 146 → 偶 → false</text>
  <text x="270" y="266" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">"h3": 'h'(104) + '3'(51) = 155 → 奇 → true</text>

  <!-- Footer -->
  <text x="270" y="304" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">关键：字母 ASCII 与列号同奇偶，数字 ASCII 与行号同奇偶，故直接相加即可</text>
</svg>
