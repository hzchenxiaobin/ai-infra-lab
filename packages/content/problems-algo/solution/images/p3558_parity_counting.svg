<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：奇偶性只由「1 的个数」决定</text>

  <!-- 左侧：示例 2 的树 -->
  <g filter="url(#rough2)">
    <!-- 边：1-2（路径外，灰色虚线） -->
    <path d="M 108 102 C 92 122, 84 138, 80 152" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6 5"/>
    <!-- 边：3-5（路径外，灰色虚线） -->
    <path d="M 176 178 C 192 196, 200 208, 206 222" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6 5"/>
    <!-- 高亮路径 1-3-4（橙色粗线） -->
    <path d="M 130 108 C 142 126, 152 144, 162 160" fill="none" stroke="#d6a040" stroke-width="2.6"/>
    <path d="M 150 178 C 140 194, 134 206, 130 218" fill="none" stroke="#d6a040" stroke-width="2.6"/>

    <!-- 节点 -->
    <circle cx="120" cy="90" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="78"  cy="168" r="15" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
    <circle cx="170" cy="170" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="128" cy="234" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="212" cy="236" r="15" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
    <text x="120" y="95" text-anchor="middle" font-size="14" fill="#446688">1</text>
    <text x="78"  y="173" text-anchor="middle" font-size="13" fill="#777">2</text>
    <text x="170" y="175" text-anchor="middle" font-size="13" fill="#a07818">3</text>
    <text x="128" y="239" text-anchor="middle" font-size="13" fill="#a07818">4</text>
    <text x="212" y="241" text-anchor="middle" font-size="13" fill="#777">5</text>

    <!-- 路径边权标注 -->
    <text x="163" y="128" font-size="12" fill="#a07818">1 或 2</text>
    <text x="98"  y="205" font-size="12" fill="#a07818">1 或 2</text>
    <text x="120" y="60" text-anchor="middle" font-size="12" fill="#446688">根</text>
    <text x="128" y="268" text-anchor="middle" font-size="12" fill="#b85450">最深节点 x（深度 d=2）</text>
  </g>

  <!-- 右侧三个要点 -->
  <g filter="url(#rough2)">
    <rect x="272" y="66" width="234" height="74" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="284" y="88" font-size="13" fill="#a07818">① 边权 2 是偶数</text>
    <text x="284" y="106" font-size="12" fill="#333">填 2 的边不改变路径和的奇偶性，</text>
    <text x="284" y="124" font-size="12" fill="#333">奇偶性只由「填 1 的边数 k」决定</text>

    <rect x="272" y="156" width="234" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="284" y="178" font-size="13" fill="#446688">② 奇数和 ⇔ k 为奇数</text>
    <text x="284" y="196" font-size="12" fill="#333">从 d 条边里选出奇数个位置放 1</text>

    <rect x="272" y="228" width="234" height="88" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="284" y="250" font-size="13" fill="#4a7a3a">③ 方案数 = 2^(d−1)</text>
    <text x="284" y="268" font-size="12" fill="#333">C(d,1)+C(d,3)+… = 2^(d−1)；</text>
    <text x="284" y="286" font-size="12" fill="#333">直观版：前 d−1 条边随便填，</text>
    <text x="284" y="304" font-size="12" fill="#333">最后 1 条被奇偶性唯一确定</text>
  </g>

  <path d="M 226 170 C 246 168, 252 160, 268 152" fill="none" stroke="#446688" stroke-width="1.8"
        marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="260" y="356" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">答案 = 2^(d−1) mod (10⁹+7)，d 为树的最大深度（路径外的边全部忽略）</text>
</svg>
