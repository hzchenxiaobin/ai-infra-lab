<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：dp[i] 逐步推进</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">ans += dp[i]；dp[i] = dp[i−1]+1（恰好少 1）或 1（断链）</text>

  <!-- ===== Example 1: [3,2,1,4] ===== -->
  <text x="40" y="78" font-size="12" fill="#446688" font-weight="bold">示例 1：prices = [3, 2, 1, 4]  →  ans = 7</text>

  <!-- table header -->
  <g font-size="10" fill="#666">
    <rect x="40" y="86" width="50" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="65" y="101" text-anchor="middle" font-weight="bold">i</text>
    <rect x="90" y="86" width="70" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="125" y="101" text-anchor="middle" font-weight="bold">prices[i]</text>
    <rect x="160" y="86" width="80" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="200" y="101" text-anchor="middle" font-weight="bold">相邻差</text>
    <rect x="240" y="86" width="70" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="275" y="101" text-anchor="middle" font-weight="bold">dp[i]</text>
    <rect x="310" y="86" width="80" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="350" y="101" text-anchor="middle" font-weight="bold">ans 累加后</text>
  </g>

  <g font-size="11">
    <!-- row i=0 -->
    <rect x="40" y="110" width="50" height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="65" y="126" text-anchor="middle" fill="#446688">0</text>
    <rect x="90" y="110" width="70" height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="125" y="126" text-anchor="middle" fill="#446688">3</text>
    <rect x="160" y="110" width="80" height="24" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="200" y="126" text-anchor="middle" fill="#888">—</text>
    <rect x="240" y="110" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="275" y="126" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="310" y="110" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="350" y="126" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>

    <!-- row i=1 -->
    <rect x="40" y="136" width="50" height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="65" y="152" text-anchor="middle" fill="#446688">1</text>
    <rect x="90" y="136" width="70" height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="125" y="152" text-anchor="middle" fill="#446688">2</text>
    <rect x="160" y="136" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="200" y="152" text-anchor="middle" fill="#4a7a3a" font-weight="bold">−1 ✓</text>
    <rect x="240" y="136" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="275" y="152" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="310" y="136" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="350" y="152" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>

    <!-- row i=2 -->
    <rect x="40" y="162" width="50" height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="65" y="178" text-anchor="middle" fill="#446688">2</text>
    <rect x="90" y="162" width="70" height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="125" y="178" text-anchor="middle" fill="#446688">1</text>
    <rect x="160" y="162" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="200" y="178" text-anchor="middle" fill="#4a7a3a" font-weight="bold">−1 ✓</text>
    <rect x="240" y="162" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="275" y="178" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="310" y="162" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="350" y="178" text-anchor="middle" fill="#d6a040" font-weight="bold">6</text>

    <!-- row i=3 -->
    <rect x="40" y="188" width="50" height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="65" y="204" text-anchor="middle" fill="#446688">3</text>
    <rect x="90" y="188" width="70" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="125" y="204" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <rect x="160" y="188" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="200" y="204" text-anchor="middle" fill="#b85450" font-weight="bold">+3 ✗</text>
    <rect x="240" y="188" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="275" y="204" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="310" y="188" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="350" y="204" text-anchor="middle" fill="#d6a040" font-weight="bold">7</text>
  </g>

  <!-- note for example 1 -->
  <rect x="40" y="220" width="430" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="50" y="237" font-size="10" fill="#555">i=3 与前一项 1 差 +3 ≠ −1，断链 → dp 归 1，仅 [4] 自身一个子数组</text>

  <!-- ===== Example 2: [8,6,7,7] ===== -->
  <text x="40" y="278" font-size="12" fill="#446688" font-weight="bold">示例 2：prices = [8, 6, 7, 7]  →  ans = 4</text>

  <g font-size="10" fill="#666">
    <rect x="40" y="286" width="50" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="65" y="301" text-anchor="middle" font-weight="bold">i</text>
    <rect x="90" y="286" width="70" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="125" y="301" text-anchor="middle" font-weight="bold">prices[i]</text>
    <rect x="160" y="286" width="80" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="200" y="301" text-anchor="middle" font-weight="bold">相邻差</text>
    <rect x="240" y="286" width="70" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="275" y="301" text-anchor="middle" font-weight="bold">dp[i]</text>
    <rect x="310" y="286" width="80" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="350" y="301" text-anchor="middle" font-weight="bold">ans 累加后</text>
  </g>

  <g font-size="11">
    <!-- i=0 -->
    <rect x="40" y="310" width="50" height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="65" y="326" text-anchor="middle" fill="#446688">0</text>
    <rect x="90" y="310" width="70" height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="125" y="326" text-anchor="middle" fill="#446688">8</text>
    <rect x="160" y="310" width="80" height="24" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="200" y="326" text-anchor="middle" fill="#888">—</text>
    <rect x="240" y="310" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="275" y="326" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="310" y="310" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="350" y="326" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>

    <!-- i=1 -->
    <rect x="40" y="336" width="50" height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="65" y="352" text-anchor="middle" fill="#446688">1</text>
    <rect x="90" y="336" width="70" height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="125" y="352" text-anchor="middle" fill="#446688">6</text>
    <rect x="160" y="336" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="200" y="352" text-anchor="middle" fill="#b85450" font-weight="bold">−2 ✗</text>
    <rect x="240" y="336" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="275" y="352" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="310" y="336" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="350" y="352" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>

    <!-- i=2 -->
    <rect x="40" y="362" width="50" height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="65" y="378" text-anchor="middle" fill="#446688">2</text>
    <rect x="90" y="362" width="70" height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="125" y="378" text-anchor="middle" fill="#446688">7</text>
    <rect x="160" y="362" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="200" y="378" text-anchor="middle" fill="#b85450" font-weight="bold">+1 ✗</text>
    <rect x="240" y="362" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="275" y="378" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="310" y="362" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="350" y="378" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>

    <!-- i=3 -->
    <rect x="40" y="388" width="50" height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="65" y="404" text-anchor="middle" fill="#446688">3</text>
    <rect x="90" y="388" width="70" height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="125" y="404" text-anchor="middle" fill="#446688">7</text>
    <rect x="160" y="388" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="200" y="404" text-anchor="middle" fill="#b85450" font-weight="bold">0 ✗</text>
    <rect x="240" y="388" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="275" y="404" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="310" y="388" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="350" y="404" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
  </g>

  <rect x="40" y="420" width="430" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="50" y="437" font-size="10" fill="#555">三个相邻差 −2、+1、0 都 ≠ −1，全程断链 → 每项 dp=1，仅 4 个单日子数组</text>
</svg>
