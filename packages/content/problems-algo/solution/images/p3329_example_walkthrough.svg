<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="330" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：s = "abacb"，k = 2</text>
  <text x="260" y="44" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">窗口左闭右开 [left, right)；right 是下一个待入窗位置</text>

  <!-- 表头 -->
  <rect x="26" y="58" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="78" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">left</text>
  <rect x="78" y="58" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="153" y="78" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">扩张动作（直到恰好合法）</text>
  <rect x="228" y="58" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="78" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">收敛窗口</text>
  <rect x="328" y="58" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="78" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">over</text>
  <rect x="372" y="58" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="407" y="78" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">贡献</text>
  <rect x="442" y="58" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="468" y="78" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- 行 1: left=0 -->
  <rect x="26" y="92" width="52" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="52" y="114" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="78" y="92" width="150" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="153" y="107" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">入 a, b, a</text>
  <text x="153" y="121" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">→ a 频次达 2 ✓</text>
  <rect x="228" y="92" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="278" y="114" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">[0,2]「aba」</text>
  <rect x="328" y="92" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="114" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="372" y="92" width="70" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="407" y="114" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">5−2 = 3</text>
  <rect x="442" y="92" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="468" y="114" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- 行 2: left=1 -->
  <rect x="26" y="130" width="52" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="52" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="78" y="130" width="150" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="153" y="145" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">入 c, b（a 出窗后）</text>
  <text x="153" y="159" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">→ b 频次达 2 ✓</text>
  <rect x="228" y="130" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="278" y="152" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">[1,4]「bacb」</text>
  <rect x="328" y="130" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="372" y="130" width="70" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="407" y="152" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">5−4 = 1</text>
  <rect x="442" y="130" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="468" y="152" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- 行 3: left=2 break -->
  <rect x="26" y="168" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="52" y="190" text-anchor="middle" font-size="11" fill="#8a3833" filter="url(#rough2)">2</text>
  <rect x="78" y="168" width="150" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="153" y="183" text-anchor="middle" font-size="10" fill="#8a3833" filter="url(#rough2)">right = 5 = n</text>
  <text x="153" y="197" text-anchor="middle" font-size="10" fill="#8a3833" filter="url(#rough2)">仍无字符达标</text>
  <rect x="228" y="168" width="100" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="278" y="190" text-anchor="middle" font-size="10.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">— break</text>
  <rect x="328" y="168" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="350" y="190" text-anchor="middle" font-size="11" fill="#8a3833" filter="url(#rough2)">0</text>
  <rect x="372" y="168" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="407" y="190" text-anchor="middle" font-size="10.5" fill="#8a3833" filter="url(#rough2)">0</text>
  <rect x="442" y="168" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="468" y="190" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- 底部说明 -->
  <rect x="20" y="216" width="480" height="94" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="238" font-size="10.5" fill="#333" filter="url(#rough2)">对照清单：「aba」「abac」「abacb」= 起点 0、终点 ≥ 2 的全部子串（3 个）</text>
  <text x="34" y="256" font-size="10.5" fill="#333" filter="url(#rough2)">　　　　　「bacb」= 起点 1、终点 ≥ 4 的全部子串（1 个）→ 共 4 ✓</text>
  <text x="34" y="274" font-size="10.5" fill="#555" filter="url(#rough2)">另验证示例 2（k = 1）：单字符窗口即达标，逐轮贡献 5+4+3+2+1 = 15 ✓</text>
  <text x="34" y="296" font-size="10" fill="#a07830" filter="url(#rough2)">II 版规模感：n = 10⁶、k = 1 时答案 = 10⁶×(10⁶+1)/2 ≈ 5×10¹¹，</text>
  <text x="34" y="310" font-size="10" fill="#a07830" filter="url(#rough2)">必须 64 位；同一流程每步 O(1)，n = 10⁶ 也只需约 2×10⁶ 次窗口操作</text>
</svg>
