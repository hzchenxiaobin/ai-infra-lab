<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：删掉第 k 人后，问题归约为 n−1 规模（n=5, k=2）</text>

  <!-- ===== Left circle: n=5 ===== -->
  <text x="155" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">规模 n = 5</text>
  <!-- background ring -->
  <circle cx="155" cy="175" r="55" fill="none" stroke="#cfd8e8" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <!-- count arc 1->2 -->
  <path d="M 168 122 A 55 55 0 0 1 205 150" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="112" font-size="10" fill="#d6a040">数 1</text>
  <text x="212" y="146" font-size="10" fill="#b85450" font-weight="bold">数 2 → 出局</text>

  <!-- node 1 (start) -->
  <circle cx="155" cy="120" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="155" y="125" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="155" y="98" text-anchor="middle" font-size="9" fill="#446688">起点</text>

  <!-- node 2 (removed) -->
  <circle cx="207" cy="158" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="207" y="163" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <line x1="192" y1="144" x2="222" y2="172" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <!-- node 3 -->
  <circle cx="187" cy="220" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="187" y="225" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="187" y="252" text-anchor="middle" font-size="9" fill="#82b366">下轮起点</text>

  <!-- node 4 -->
  <circle cx="123" cy="220" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="123" y="225" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <!-- node 5 -->
  <circle cx="103" cy="158" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="103" y="163" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>

  <!-- ===== Middle arrow ===== -->
  <path d="M 250 175 L 350 175" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="168" text-anchor="middle" font-size="11" fill="#666">删 2</text>
  <text x="300" y="184" text-anchor="middle" font-size="11" fill="#666">从 3 重开</text>

  <!-- ===== Right circle: n-1=4 ===== -->
  <text x="485" y="60" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">规模 n−1 = 4（重新编号 0 起）</text>
  <!-- background ring -->
  <circle cx="485" cy="175" r="55" fill="none" stroke="#cfe6d6" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- node 3 -> idx 0 (top) -->
  <circle cx="485" cy="120" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="485" y="125" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="485" y="98" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">新 0</text>

  <!-- node 4 -> idx 1 (right) -->
  <circle cx="540" cy="175" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="540" y="180" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="566" y="180" font-size="10" fill="#4a7a3a" font-weight="bold">新 1</text>

  <!-- node 5 -> idx 2 (bottom) -->
  <circle cx="485" cy="230" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="485" y="235" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="485" y="258" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">新 2</text>

  <!-- node 1 -> idx 3 (left) -->
  <circle cx="430" cy="175" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="180" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="398" y="180" font-size="10" fill="#4a7a3a" font-weight="bold">新 3</text>

  <!-- mapping arrow: new 0 (485,120) -> old position of 3 (187,220) area, just label -->
  <text x="300" y="288" text-anchor="middle" font-size="11" fill="#666">子问题赢家在新圈的下标 p ⇒ 原圈下标 (p + k) mod n</text>

  <!-- ===== Recurrence box ===== -->
  <rect x="40" y="304" width="560" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="330" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">约瑟夫递推（0 下标）</text>
  <text x="320" y="356" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">f(1) = 0，  f(n) = ( f(n−1) + k ) mod n</text>
  <text x="320" y="378" text-anchor="middle" font-size="12" fill="#555">子问题赢家 + 偏移 k 回映到原圈；最终答案 = f(n) + 1（转回 1 下标）</text>
  <text x="320" y="396" text-anchor="middle" font-size="10" fill="#888">规模每步减一，迭代 n−1 次即得，时间 O(n)，空间 O(1)</text>
</svg>
