<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：73.0 / 87.0 是怎么变成 73 / 87 的</text>

  <!-- Input column -->
  <rect x="45" y="60" width="120" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="105" y="82" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">输入 grade 列</text>
  <rect x="70" y="96" width="70" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">73.0</text>
  <rect x="70" y="128" width="70" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="146" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">87.0</text>
  <text x="105" y="186" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">dtype: float64</text>

  <path d="M 168 128 L 216 128" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="192" y="112" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">astype(int)</text>

  <!-- Output column -->
  <rect x="220" y="60" width="120" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="82" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">输出 grade 列</text>
  <rect x="245" y="96" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">73</text>
  <rect x="245" y="128" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">87</text>
  <text x="280" y="186" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">dtype: int64</text>

  <!-- Per-row mapping note -->
  <rect x="365" y="60" width="170" height="150" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="450" y="82" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">逐行对照</text>
  <text x="450" y="108" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">73.0 → 73</text>
  <text x="450" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">87.0 → 87</text>
  <text x="450" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">值本就是整数，小数点</text>
  <text x="450" y="172" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">只是 dtype 的副产品</text>

  <!-- Bottom: truncation vs round -->
  <rect x="45" y="232" width="490" height="146" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="256" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⚠️ 面试高频追问：astype(int) 是截断，不是四舍五入！</text>

  <text x="160" y="284" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">原值</text>
  <text x="160" y="312" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">73.9</text>
  <text x="160" y="340" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">-73.9</text>

  <text x="290" y="284" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">astype(int)（向零截断）</text>
  <rect x="240" y="294" width="100" height="24" fill="#ffffff" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="311" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">73</text>
  <rect x="240" y="322" width="100" height="24" fill="#ffffff" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="339" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">-73</text>

  <text x="430" y="284" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">round().astype(int)（四舍五入）</text>
  <rect x="380" y="294" width="100" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="311" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">74</text>
  <rect x="380" y="322" width="100" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="339" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">-74</text>

  <text x="290" y="368" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">本题数据全是 73.0 这类整数值浮点，截断无损；真实业务里带小数就要想清楚用哪个</text>
</svg>
