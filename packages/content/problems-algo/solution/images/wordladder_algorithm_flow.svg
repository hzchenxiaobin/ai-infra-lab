<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 530" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="530" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">通配符 + BFS 算法流程</text>

  <!-- Step 1: Check endWord -->
  <ellipse cx="280" cy="56" rx="110" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#333">检查 endWord ∈ wordList</text>

  <path d="M 280 76 L 280 94" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: endWord in wordList? -->
  <polygon points="280,98 370,134 280,170 190,134" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="11" fill="#333">endWord 在</text>
  <text x="280" y="146" text-anchor="middle" font-size="11" fill="#333">wordList 中?</text>

  <!-- No → return 0 -->
  <path d="M 190 134 L 118 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="154" y="126" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="62" cy="134" rx="52" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="138" text-anchor="middle" font-size="11" fill="#333">返回 0</text>

  <!-- Yes ↓ -->
  <path d="M 280 170 L 280 190" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="186" font-size="11" fill="#82b366">是</text>

  <!-- Step 2: Build pattern map -->
  <rect x="130" y="194" width="300" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="11" fill="#333">构建通配符模式表: ∀ word, ∀ pos → patternMap[*w*]</text>

  <path d="M 280 230 L 280 250" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: Init BFS -->
  <rect x="130" y="254" width="300" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="275" text-anchor="middle" font-size="11" fill="#333">BFS 初始化: q=[beginWord], visited={beginWord}, level=1</text>

  <path d="M 280 288 L 280 308" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: queue empty? -->
  <polygon points="280,312 360,348 280,384 200,348" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="11" fill="#333">队列为空?</text>
  <text x="280" y="360" text-anchor="middle" font-size="10" fill="#888">(无可扩展)</text>

  <!-- Yes → return 0 -->
  <path d="M 360 348 L 432 348" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="340" text-anchor="middle" font-size="11" fill="#b85450">是</text>
  <ellipse cx="486" cy="348" rx="52" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="352" text-anchor="middle" font-size="11" fill="#333">返回 0</text>

  <!-- No ↓ -->
  <path d="M 280 384 L 280 404" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="400" font-size="11" fill="#82b366">否</text>

  <!-- Step 4: Process level -->
  <rect x="100" y="408" width="360" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="429" text-anchor="middle" font-size="11" fill="#333">取当前层 size 个 word, 生成 L 个模式, 查 patternMap 得邻居</text>

  <path d="M 280 442 L 280 458" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: neighbor == endWord? -->
  <polygon points="280,462 380,488 280,514 180,488" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="485" text-anchor="middle" font-size="10" fill="#333">邻居==</text>
  <text x="280" y="497" text-anchor="middle" font-size="10" fill="#333">endWord?</text>

  <!-- Yes → return level+1 (right) -->
  <path d="M 380 488 L 430 488" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="405" y="480" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <ellipse cx="490" cy="488" rx="60" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="490" y="492" text-anchor="middle" font-size="11" fill="#333">返回 level+1</text>

  <!-- No → add to queue, level++ (left) -->
  <path d="M 180 488 L 110 488" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="145" y="480" text-anchor="middle" font-size="11" fill="#888">否</text>
  <rect x="20" y="472" width="86" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="63" y="486" text-anchor="middle" font-size="10" fill="#333">未访问→入队</text>
  <text x="63" y="498" text-anchor="middle" font-size="10" fill="#333">level++</text>

  <!-- Loop back from left box to queue-empty decision -->
  <path d="M 20 488 L 10 488 L 10 348 L 200 348" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
