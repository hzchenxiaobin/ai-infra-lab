<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">下落阶段：每列用写指针从底往上压实</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">write 从 m−1 起，遇到 &gt;0 就写下并上移；≤0（空格/待粉碎）跳过</text>

  <!-- ============ LEFT: column before drop ============ -->
  <text x="110" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">下落前（某列）</text>
  <!-- 5 cells, 52x46, start x=84 y=86 ; rows y=86,132,178,224,270 ; cy=112,158,204,250,296 ; cx=110 -->
  <!-- values top->bottom: 0,4,0,4,5 -->
  <!-- row0 = 0 (empty) -->
  <rect x="84" y="86" width="52" height="46" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="110" y="114" text-anchor="middle" font-size="15" fill="#bbb">0</text>
  <!-- row1 = 4 (keep) -->
  <rect x="84" y="132" width="52" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="110" y="160" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">4</text>
  <!-- row2 = 0 (empty) -->
  <rect x="84" y="178" width="52" height="46" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="110" y="206" text-anchor="middle" font-size="15" fill="#bbb">0</text>
  <!-- row3 = 4 (keep) -->
  <rect x="84" y="224" width="52" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="110" y="252" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">4</text>
  <!-- row4 = 5 (keep) -->
  <rect x="84" y="270" width="52" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="110" y="298" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">5</text>

  <!-- row index labels (i) on left -->
  <text x="70" y="116" text-anchor="end" font-size="10" fill="#888">i=0</text>
  <text x="70" y="162" text-anchor="end" font-size="10" fill="#888">i=1</text>
  <text x="70" y="208" text-anchor="end" font-size="10" fill="#888">i=2</text>
  <text x="70" y="254" text-anchor="end" font-size="10" fill="#888">i=3</text>
  <text x="70" y="300" text-anchor="end" font-size="10" fill="#888">i=4</text>

  <!-- write pointer annotation on right of left column -->
  <text x="146" y="300" font-size="10.5" fill="#d6a040" font-weight="bold">write=4 起</text>
  <path d="M 144 296 L 138 296" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- ============ MIDDLE: arrows showing drop ============ -->
  <!-- 5 at row4 stays; 4 at row3 stays; 4 at row1 drops to row2 -->
  <path d="M 140 155 Q 220 175 332 204" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="232" y="172" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4 落下</text>
  <text x="232" y="240" text-anchor="middle" font-size="10" fill="#888">5、4 原地不动</text>
  <text x="232" y="256" text-anchor="middle" font-size="10" fill="#888">（已在底部）</text>

  <!-- ============ RIGHT: column after drop ============ -->
  <text x="430" y="74" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">下落后（压实）</text>
  <!-- start x=404 y=86 ; cx=430 ; values top->bottom: 0,0,4,4,5 -->
  <rect x="404" y="86" width="52" height="46" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="430" y="114" text-anchor="middle" font-size="15" fill="#bbb">0</text>
  <rect x="404" y="132" width="52" height="46" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="430" y="160" text-anchor="middle" font-size="15" fill="#bbb">0</text>
  <rect x="404" y="178" width="52" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="430" y="206" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">4</text>
  <rect x="404" y="224" width="52" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="430" y="252" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">4</text>
  <rect x="404" y="270" width="52" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="430" y="298" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">5</text>

  <!-- write pointer final on right -->
  <text x="466" y="184" font-size="10.5" fill="#d6a040" font-weight="bold">write=2</text>
  <text x="466" y="198" font-size="9.5" fill="#888">↑上方填0</text>
  <path d="M 464 188 L 458 188" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- ============ bottom: algorithm note ============ -->
  <rect x="40" y="326" width="460" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="345" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">每列 O(m)：i 从底往上扫，&gt;0 写到 write-- ；最后 write 以上全置 0</text>
</svg>
