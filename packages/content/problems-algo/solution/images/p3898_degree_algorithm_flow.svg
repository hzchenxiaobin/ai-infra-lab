<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：逐行求和，一遍扫完</text>

  <!-- 开始 -->
  <rect x="215" y="34" width="90" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="51" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">开始</text>
  <path d="M 260 60 L 260 72" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="170" y="76" width="180" height="30" rx="4" fill="#ffffff" stroke="#8899aa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="95" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans ← 长度 n 的数组</text>
  <path d="M 260 106 L 260 118" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 外层循环 -->
  <rect x="170" y="122" width="180" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="141" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">外层 i = 0 … n−1</text>
  <path d="M 260 152 L 260 164" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 行求和 -->
  <rect x="170" y="168" width="180" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="187" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">ans[i] = Σ matrix[i][j]</text>
  <path d="M 260 198 L 260 210" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：还有下一行？ -->
  <polygon points="260,214 326,246 260,278 194,246" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="250" text-anchor="middle" font-size="11.5" fill="#a07514" filter="url(#rough2)">还有下一行？</text>

  <!-- 是 → 返回 -->
  <path d="M 260 278 L 260 292" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="290" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="205" y="296" width="110" height="30" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="315" text-anchor="middle" font-size="12" fill="#2e5a24" filter="url(#rough2)">返回 ans</text>

  <!-- 否 → 回到外层 -->
  <path d="M 194 246 L 118 246 L 118 137 L 166 137" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="238" font-size="10.5" fill="#b85450" filter="url(#rough2)">否，i++</text>

  <!-- 右侧：两种等价写法 -->
  <rect x="368" y="110" width="132" height="102" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="434" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">两种等价写法</text>
  <text x="434" y="152" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">① 内层逐格累加</text>
  <text x="434" y="168" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">ans[i] += matrix[i][j]</text>
  <text x="434" y="190" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">② 整行一次求和</text>
  <text x="434" y="206" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">ans[i] = sum(row)</text>

  <!-- 左下：自检 -->
  <rect x="36" y="296" width="150" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="111" y="314" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">自检：ans 之和 = 矩阵</text>
  <text x="111" y="331" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">中 1 的个数（握手定理）</text>
</svg>
