<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="500" height="440" fill="#fafafa"/>

  <text x="250" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：Brian Kernighan 计数法</text>

  <!-- Start oval -->
  <ellipse cx="250" cy="60" rx="48" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="65" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">开始</text>

  <line x1="250" y1="80" x2="250" y2="96" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- count = 0 -->
  <rect x="170" y="100" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="250" y="122" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">count = 0  // 计数器</text>

  <line x1="250" y1="134" x2="250" y2="150" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: n != 0 ? -->
  <polygon points="250,154 332,196 250,238 168,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="192" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">n ≠ 0 ?</text>
  <text x="250" y="208" text-anchor="middle" font-size="10.5" fill="#888">还有 1 没抹</text>

  <!-- Yes branch: down -->
  <text x="262" y="252" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="250" y1="238" x2="250" y2="256" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- n &= n - 1; count++ -->
  <rect x="110" y="260" width="280" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="250" y="282" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">n &amp;= n − 1   // 抹掉最低设置位</text>
  <text x="250" y="300" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">count++        // 计一个 1</text>

  <!-- loop back to decision -->
  <line x1="390" y1="285" x2="430" y2="285" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="392" y="178" width="76" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="430" y="196" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">回判</text>
  <path d="M 430 178 Q 430 196 332 196" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No branch: left to return -->
  <text x="150" y="190" font-size="11" fill="#d6a040" font-weight="bold">否</text>
  <path d="M 168 196 Q 90 196 90 270" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return count -->
  <rect x="20" y="272" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="90" y="294" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">return count</text>

  <line x1="90" y1="306" x2="90" y2="332" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End oval -->
  <ellipse cx="90" cy="352" rx="42" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="357" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结束</text>

  <!-- bottom note -->
  <rect x="150" y="336" width="320" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="310" y="354" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">循环次数 = 1 的个数（最坏 32 次）</text>
  <text x="310" y="370" text-anchor="middle" font-size="11" fill="#446688">每次抹掉一个最低设置位，跳过所有 0 位</text>

  <!-- complexity tag -->
  <rect x="150" y="388" width="320" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="410" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">时间 O(popcount)，空间 O(1)</text>
</svg>
