<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：8 个按键 = 8 列槽位，越浅的层越便宜，先占满</text>
  <text x="452" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">实线格 = 已占 · 虚线格 = 空</text>

  <!-- key headers -->
  <text x="126" y="60" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">键2</text>
  <text x="173" y="60" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">键3</text>
  <text x="220" y="60" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">键4</text>
  <text x="267" y="60" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">键5</text>
  <text x="314" y="60" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">键6</text>
  <text x="361" y="60" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">键7</text>
  <text x="408" y="60" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">键8</text>
  <text x="455" y="60" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">键9</text>

  <!-- layer labels -->
  <text x="96" y="88" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第1层·1次</text>
  <text x="96" y="130" text-anchor="end" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">第2层·2次</text>
  <text x="96" y="172" text-anchor="end" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">第3层·3次</text>
  <text x="96" y="214" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">第4层·4次</text>

  <!-- layer 1: filled with a..h -->
  <rect x="104" y="70" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="126" y="92" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="151" y="70" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="173" y="92" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="198" y="70" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="92" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="245" y="70" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="267" y="92" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">d</text>
  <rect x="292" y="70" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="314" y="92" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">e</text>
  <rect x="339" y="70" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="361" y="92" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">f</text>
  <rect x="386" y="70" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="408" y="92" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">g</text>
  <rect x="433" y="70" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="455" y="92" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">h</text>

  <!-- layer 2: two orange + dashed empties -->
  <rect x="104" y="112" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="126" y="134" text-anchor="middle" font-size="14" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="151" y="112" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="173" y="134" text-anchor="middle" font-size="14" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">j</text>
  <rect x="198" y="112" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="245" y="112" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="292" y="112" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="339" y="112" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="386" y="112" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="433" y="112" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <!-- layer 3: all empty -->
  <rect x="104" y="154" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="151" y="154" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="198" y="154" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="245" y="154" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="292" y="154" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="339" y="154" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="386" y="154" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="433" y="154" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <!-- layer 4: only 2 slots ever needed -->
  <rect x="104" y="196" width="44" height="34" fill="#ffffff" stroke="#b85450" stroke-width="1.3" rx="4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="151" y="196" width="44" height="34" fill="#ffffff" stroke="#b85450" stroke-width="1.3" rx="4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="216" y="217" font-size="10.5" fill="#999" filter="url(#rough2)">← 仅 n = 25、26 时用到 2 格</text>

  <!-- greedy annotation -->
  <path d="M 302 170 C 300 232 250 236 216 240" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="312" y="236" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">有空便宜格却占贵格？</text>
  <text x="312" y="250" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">挪过去省 1 次 → 逐层填满</text>

  <!-- summary box -->
  <rect x="40" y="262" width="440" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="283" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">n = 10（示例 2）：第 1 层 8 格 ×1 次 + 第 2 层 2 格 ×2 次 → 8 + 4 = 12</text>
  <text x="260" y="303" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">同层 8 个格子完全等价，放哪些字母都一样</text>

  <!-- bottom note -->
  <rect x="40" y="326" width="440" height="64" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">字母互不相同 ⇒ 每个字母只输入 1 次 ⇒ 答案只看 n = len(word)</text>
  <text x="260" y="367" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">ans = Σ ( ⌊i/8⌋ + 1 )，i = 0 … n−1</text>
  <text x="260" y="384" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">闭式：q = ⌊n/8⌋，r = n mod 8 ⇒ ans = (q+1)(4q+r)</text>
</svg>
