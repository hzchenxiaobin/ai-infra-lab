<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：维护「候选父节点队列」，队首即下一个插入位置</text>

  <!-- ===== 左侧：完全二叉树 [1,2,3,4,5,6] ===== -->
  <text x="150" y="58" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">完全二叉树（待插入）</text>
  <g font-size="12">
    <!-- root 1 -->
    <circle cx="150" cy="92" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <text x="150" y="97" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <!-- L1: 2, 3 -->
    <circle cx="105" cy="146" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="105" y="151" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <circle cx="195" cy="146" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="195" y="151" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <line x1="139" y1="104" x2="115" y2="132" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="161" y1="104" x2="185" y2="132" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <!-- L2: 4,5,6 + 空位 -->
    <circle cx="80" cy="200" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="80" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
    <circle cx="124" cy="200" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="124" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>
    <circle cx="170" cy="200" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="170" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>
    <!-- 高亮：3 的右孩子空位 = 下一个插入位置 -->
    <rect x="200" y="188" width="30" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <text x="215" y="205" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">空</text>
    <line x1="96" y1="158" x2="84" y2="186" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <line x1="114" y1="158" x2="124" y2="186" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <line x1="184" y1="158" x2="170" y2="186" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <!-- 指向空位的虚线 -->
    <line x1="206" y1="158" x2="212" y2="186" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="234" y="200" font-size="10" fill="#d6a040" font-weight="bold">下一槽位</text>
  </g>

  <!-- ===== 右侧：候选父节点队列 ===== -->
  <text x="430" y="58" text-anchor="middle" font-size="13" fill="#7a5a20" font-weight="bold">候选父节点队列（层序）</text>
  <text x="430" y="76" text-anchor="middle" font-size="10" fill="#888">至少有一个空孩子的节点，按层序排列</text>

  <!-- 队列容器 -->
  <rect x="318" y="92" width="232" height="120" rx="8" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="334" y="108" font-size="10" fill="#888">队首 front</text>
  <text x="540" y="108" font-size="10" fill="#888" text-anchor="end">队尾 back</text>

  <g font-size="12">
    <!-- 队首 3（高亮） -->
    <rect x="334" y="120" width="44" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="356" y="142" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <text x="356" y="166" text-anchor="middle" font-size="9" fill="#d6a040">左满右空</text>
    <!-- 4 -->
    <rect x="384" y="120" width="40" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="404" y="142" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <text x="404" y="166" text-anchor="middle" font-size="9" fill="#888">双空</text>
    <!-- 5 -->
    <rect x="430" y="120" width="40" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="450" y="142" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
    <text x="450" y="166" text-anchor="middle" font-size="9" fill="#888">双空</text>
    <!-- 6 -->
    <rect x="476" y="120" width="40" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="496" y="142" text-anchor="middle" fill="#446688" font-weight="bold">6</text>
    <text x="496" y="166" text-anchor="middle" font-size="9" fill="#888">双空</text>
  </g>

  <!-- 队首 → 下一槽位 的箭头 -->
  <path d="M 334 137 Q 270 137 232 200" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arro)" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="300" y="128" font-size="10" fill="#d6a040" font-weight="bold">insert 挂到队首的空槽</text>

  <!-- 队列维护说明 -->
  <rect x="318" y="226" width="232" height="74" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="332" y="248" font-size="11" fill="#3a5a2a" font-weight="bold">队列不变式</text>
  <text x="332" y="266" font-size="10" fill="#3a5a2a">· 新节点必挂在队首节点的空槽</text>
  <text x="332" y="280" font-size="10" fill="#3a5a2a">· 挂左：队首留下（右槽仍空）</text>
  <text x="332" y="294" font-size="10" fill="#3a5a2a">· 挂右：队首满 → 出队；新节点入队</text>

  <!-- ===== 底部总结条 ===== -->
  <rect x="30" y="320" width="520" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="290" y="342" text-anchor="middle" font-size="12" fill="#7a5a20" font-weight="bold">构造时 BFS 一趟，把「至少一个空孩子」的节点按层序入队</text>
  <text x="290" y="362" text-anchor="middle" font-size="11" fill="#7a5a20">每次 insert：O(1) 挂到队首空槽 → 右槽填满则队首出队、新节点入队</text>
</svg>
