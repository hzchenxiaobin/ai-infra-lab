<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：GROUP BY class 分桶 + COUNT(DISTINCT student) 去重计数 + HAVING ≥5</text>

  <!-- Courses table (left) -->
  <text x="110" y="50" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">Courses（无主键，可有重复行）</text>
  <rect x="30" y="56" width="160" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="72" font-size="9.5" fill="#333">student</text>
  <text x="125" y="72" font-size="9.5" fill="#b85450">class</text>
  <line x1="90" y1="56" x2="90" y2="80" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="80" width="160" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="55" y="94" font-size="9.5" fill="#333">A</text>
  <text x="125" y="94" font-size="9.5" fill="#b85450" font-weight="bold">Math</text>
  <line x1="90" y1="80" x2="90" y2="100" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="100" width="160" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="114" font-size="9.5" fill="#333">B</text>
  <text x="125" y="114" font-size="9.5" fill="#446688">English</text>
  <line x1="90" y1="100" x2="90" y2="120" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="120" width="160" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="55" y="134" font-size="9.5" fill="#333">C</text>
  <text x="125" y="134" font-size="9.5" fill="#b85450" font-weight="bold">Math</text>
  <line x1="90" y1="120" x2="90" y2="140" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="140" width="160" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="154" font-size="9.5" fill="#333">D</text>
  <text x="125" y="154" font-size="9.5" fill="#446688">Biology</text>
  <line x1="90" y1="140" x2="90" y2="160" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="160" width="160" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="55" y="174" font-size="9.5" fill="#333">E</text>
  <text x="125" y="174" font-size="9.5" fill="#b85450" font-weight="bold">Math</text>
  <line x1="90" y1="160" x2="90" y2="180" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="180" width="160" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="194" font-size="9.5" fill="#333">F</text>
  <text x="125" y="194" font-size="9.5" fill="#446688">Computer</text>
  <line x1="90" y1="180" x2="90" y2="200" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="200" width="160" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="55" y="214" font-size="9.5" fill="#333">G</text>
  <text x="125" y="214" font-size="9.5" fill="#b85450" font-weight="bold">Math</text>
  <line x1="90" y1="200" x2="90" y2="220" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="220" width="160" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="55" y="234" font-size="9.5" fill="#333">H</text>
  <text x="125" y="234" font-size="9.5" fill="#b85450" font-weight="bold">Math</text>
  <line x1="90" y1="220" x2="90" y2="240" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="240" width="160" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="55" y="254" font-size="9.5" fill="#333">I</text>
  <text x="125" y="254" font-size="9.5" fill="#b85450" font-weight="bold">Math</text>
  <line x1="90" y1="240" x2="90" y2="260" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="260" width="160" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="55" y="274" font-size="9.5" fill="#b85450" font-weight="bold">A</text>
  <text x="125" y="274" font-size="9.5" fill="#b85450" font-weight="bold">Math</text>
  <line x1="90" y1="260" x2="90" y2="280" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="110" y="294" text-anchor="middle" font-size="8.5" fill="#b85450">↑ 末行是 (A, Math) 重复行</text>

  <!-- Arrow: GROUP BY -->
  <path d="M190 170 L300 170" stroke="#446688" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="245" y="163" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">GROUP BY</text>
  <text x="245" y="183" text-anchor="middle" font-size="9" fill="#446688">class</text>

  <!-- Aggregated buckets (right) -->
  <text x="440" y="68" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">分桶去重计数</text>
  <rect x="320" y="76" width="240" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="93" font-size="9" fill="#333">class</text>
  <text x="420" y="93" font-size="9" fill="#333">COUNT(DISTINCT)</text>
  <text x="530" y="93" font-size="9" fill="#333">≥5?</text>
  <line x1="380" y1="76" x2="380" y2="102" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="510" y1="76" x2="510" y2="102" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="320" y="102" width="240" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="340" y="119" font-size="9.5" fill="#4a7a3a" font-weight="bold">Math</text>
  <text x="445" y="119" font-size="9.5" fill="#b85450" font-weight="bold">6</text>
  <text x="530" y="119" font-size="9.5" fill="#b85450" font-weight="bold">✓</text>
  <line x1="380" y1="102" x2="380" y2="128" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="510" y1="102" x2="510" y2="128" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="320" y="128" width="240" height="22" fill="#fff" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="340" y="143" font-size="9" fill="#888">English</text>
  <text x="445" y="143" font-size="9" fill="#888">1</text>
  <text x="530" y="143" font-size="9" fill="#888">✗</text>
  <line x1="380" y1="128" x2="380" y2="150" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="510" y1="128" x2="510" y2="150" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="320" y="150" width="240" height="22" fill="#fff" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="340" y="165" font-size="9" fill="#888">Biology</text>
  <text x="445" y="165" font-size="9" fill="#888">1</text>
  <text x="530" y="165" font-size="9" fill="#888">✗</text>
  <line x1="380" y1="150" x2="380" y2="172" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="510" y1="150" x2="510" y2="172" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="320" y="172" width="240" height="22" fill="#fff" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="340" y="187" font-size="9" fill="#888">Computer</text>
  <text x="445" y="187" font-size="9" fill="#888">1</text>
  <text x="530" y="187" font-size="9" fill="#888">✗</text>
  <line x1="380" y1="172" x2="380" y2="194" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="510" y1="172" x2="510" y2="194" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="440" y="212" text-anchor="middle" font-size="9" fill="#4a7a3a">HAVING COUNT(DISTINCT student) ≥ 5 → 仅留 Math</text>

  <!-- COUNT(*) comparison note -->
  <rect x="300" y="226" width="260" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="430" y="244" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">⚠️ COUNT(*) 对照</text>
  <text x="430" y="258" text-anchor="middle" font-size="8.5" fill="#b85450">Math 桶 COUNT(*)=7（含重复行 A×2）</text>
  <text x="430" y="270" text-anchor="middle" font-size="8.5" fill="#b85450">COUNT(DISTINCT student)=6（去重后）</text>

  <!-- Down arrow to result -->
  <path d="M440 282 L440 308" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Result callout -->
  <rect x="150" y="312" width="260" height="76" fill="#fff8e1" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">SELECT class（直接输出分组键）</text>
  <rect x="240" y="340" width="80" height="28" fill="#fff" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">Math</text>
  <text x="280" y="380" text-anchor="middle" font-size="9" fill="#888">Math 有 6 名不同学生 ≥ 5，无需子查诔回表</text>

  <text x="280" y="408" text-anchor="middle" font-size="9" fill="#446688">与 570 对比：570 输出经理 name（非分组键）需子查询回表；596 直接输出 class（分组键）一步到位</text>
  <text x="280" y="424" text-anchor="middle" font-size="9" fill="#b85450">关键差异：无主键 + 可能有重复行 → 必须用 COUNT(DISTINCT student) 去重</text>
</svg>
