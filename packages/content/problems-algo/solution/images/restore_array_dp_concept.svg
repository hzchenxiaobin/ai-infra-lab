<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">划分型 DP：枚举最后一段 s[j..i-1]，累加 dp[j]</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">固定右端 i，左端 j 回看至多 m 位；每段须无前导 0 且值 ≤ k</text>

  <!-- ===== string cells "1 3 1 7" ===== -->
  <g>
    <rect x="140" y="62" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="168" y="89" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">1</text>
    <rect x="200" y="62" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="228" y="89" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">3</text>
    <rect x="260" y="62" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="288" y="89" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">1</text>
    <rect x="320" y="62" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="348" y="89" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">7</text>

    <!-- index ruler -->
    <text x="140" y="116" text-anchor="middle" font-size="10" fill="#888">0</text>
    <text x="200" y="116" text-anchor="middle" font-size="10" fill="#888">1</text>
    <text x="260" y="116" text-anchor="middle" font-size="10" fill="#888">2</text>
    <text x="320" y="116" text-anchor="middle" font-size="10" fill="#888">3</text>
    <text x="380" y="116" text-anchor="middle" font-size="10" fill="#888">i=4</text>
  </g>

  <!-- ===== brackets: last segment for i=4, increasing length ===== -->
  <!-- L=1: s[3..3]="7" -->
  <path d="M 320 130 L 320 124 L 376 124 L 376 130" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="392" y="129" font-size="10" fill="#333">L=1, j=3, 段="7", 值=7</text>
  <text x="478" y="129" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- L=2: s[2..3]="17" -->
  <path d="M 260 150 L 260 144 L 376 144 L 376 150" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="392" y="149" font-size="10" fill="#333">L=2, j=2, 段="17", 值=17</text>
  <text x="478" y="149" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- L=3: s[1..3]="317" -->
  <path d="M 200 170 L 200 164 L 376 164 L 376 170" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="392" y="169" font-size="10" fill="#333">L=3, j=1, 段="317", 值=317</text>
  <text x="478" y="169" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- L=4: s[0..3]="1317" (== m, compare with k) -->
  <path d="M 140 190 L 140 184 L 376 184 L 376 190" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="392" y="189" font-size="10" fill="#333">L=4=m, j=0, 段="1317"</text>
  <text x="478" y="189" font-size="10" fill="#b85450" font-weight="bold">1317≤2000 ✓</text>

  <!-- ===== recurrence box (bottom left) ===== -->
  <rect x="36" y="210" width="232" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="152" y="230" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">转移方程（反向累加）</text>
  <text x="52" y="252" font-family="monospace" font-size="11" fill="#333">dp[i] = Σ dp[j]</text>
  <text x="52" y="270" font-size="9" fill="#888">j ∈ [max(0,i−m), i−1]</text>
  <text x="52" y="286" font-size="9" fill="#888">最后一段 = s[j..i−1]</text>
  <text x="52" y="298" font-size="9" fill="#888">答案 = dp[n]</text>

  <!-- ===== validity checklist (bottom right) ===== -->
  <rect x="284" y="210" width="200" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="384" y="230" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">合法段三条件</text>
  <text x="298" y="250" font-size="10" fill="#333">① 无前导 0：s[j] ≠ '0'</text>
  <text x="298" y="268" font-size="10" fill="#333">② 长度 ≤ m（m=位数(k)）</text>
  <text x="298" y="286" font-size="10" fill="#333">③ 值 ≤ k（仅 L=m 时需比）</text>
  <text x="298" y="298" font-size="9" fill="#888">L&lt;m 时值必 &lt; k</text>

  <!-- ===== bottom highlight strip ===== -->
  <rect x="36" y="316" width="448" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">关键剪枝：回看窗口 ≤ m = 位数(k) ≤ 10</text>
  <text x="260" y="354" text-anchor="middle" font-size="10" fill="#555">每个 i 只回看至多 m 个 j → 内层 O(m) 为常数</text>
  <text x="260" y="370" text-anchor="middle" font-size="10" fill="#555">整体 O(n·m) = O(n)，把朴素 O(n²) 降为线性</text>
</svg>
