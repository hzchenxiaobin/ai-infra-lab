<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：dp 的第二维从「结尾下标」换成「结尾值」</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">转移只关心「前驱结尾的值是否等于当前值」——同值下标完全等价，可无损合并</text>

  <text x="112" y="56" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">暴力：状态 = (j, 结尾下标)</text>
  <rect x="48" y="62" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="60" y="79" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">5</text>
  <rect x="72" y="62" width="24" height="24" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="84" y="79" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <rect x="96" y="62" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="108" y="79" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">5</text>
  <rect x="120" y="62" width="24" height="24" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="132" y="79" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">8</text>
  <rect x="144" y="62" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="156" y="79" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">5</text>
  <rect x="168" y="62" width="24" height="24" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="180" y="79" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="38" y="79" text-anchor="end" font-size="8" fill="#999" filter="url(#rough2)">值</text>
  <text x="60" y="98" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">0</text>
  <text x="84" y="98" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">1</text>
  <text x="108" y="98" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">2</text>
  <text x="132" y="98" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">3</text>
  <text x="156" y="98" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">4</text>
  <text x="180" y="98" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">5</text>
  <text x="38" y="98" text-anchor="end" font-size="8" fill="#999" filter="url(#rough2)">下标</text>

  <path d="M 204 74 L 240 74" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="222" y="66" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">按值合并</text>

  <text x="330" y="56" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">优化：状态 = (j, 结尾值)</text>
  <rect x="256" y="62" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="270" y="79" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">5</text>
  <rect x="286" y="62" width="28" height="24" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="300" y="79" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <rect x="316" y="62" width="28" height="24" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="330" y="79" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">8</text>
  <text x="356" y="76" font-size="9" fill="#999" filter="url(#rough2)">只留 3 列，</text>
  <text x="356" y="90" font-size="9" fill="#999" filter="url(#rough2)">叠上 j 维 ↓</text>

  <text x="200" y="118" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">值 5</text>
  <text x="296" y="118" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">值 1</text>
  <text x="392" y="118" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">值 8</text>

  <rect x="152" y="124" width="96" height="24" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="200" y="140" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <rect x="248" y="124" width="96" height="24" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="296" y="140" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <rect x="344" y="124" width="96" height="24" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="392" y="140" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>

  <rect x="152" y="164" width="96" height="24" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="200" y="180" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <rect x="248" y="164" width="96" height="24" fill="#fff8e1" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="296" y="180" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="344" y="164" width="96" height="24" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="392" y="180" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>

  <rect x="152" y="204" width="96" height="24" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="200" y="220" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <rect x="248" y="204" width="96" height="24" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="296" y="220" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <rect x="344" y="204" width="96" height="24" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="392" y="220" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>

  <text x="452" y="140" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j = 0</text>
  <text x="452" y="180" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j = 1</text>
  <text x="452" y="220" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j = 2</text>

  <rect x="28" y="158" width="96" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="76" y="172" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">同值接龙</text>
  <text x="76" y="186" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">+1 不花名额</text>
  <path d="M 128 176 L 244 176" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <path d="M 200 150 C 208 162, 244 164, 264 163" stroke="#446688" stroke-width="1.9" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 392 150 C 384 162, 348 164, 328 163" stroke="#446688" stroke-width="1.9" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <path d="M 296 150 L 296 162" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="312" y="160" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <rect x="40" y="240" width="440" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="260" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">同值接龙（绿）：dp[j][v] ← dp[j][v] + 1 —— 前驱结尾也是 v，不花名额</text>

  <rect x="40" y="278" width="440" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">换值接龙（蓝）：dp[j][v] ← max{ dp[j−1][y] : y ≠ v } + 1 —— 花 1 个名额</text>

  <rect x="40" y="316" width="440" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="335" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">红叉：y = v 的列不参与换值接龙（同值情形已由绿色转移覆盖）</text>

  <rect x="40" y="352" width="440" height="46" fill="#f5f5f5" stroke="#999" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="370" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">值域 10⁹ → 哈希压缩成 0..m−1 列（m ≤ n ≤ 5000）</text>
  <text x="260" y="388" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">状态数 n·(k+1) → m·(k+1)，转移从「枚举下标」变成「查行最值」</text>
</svg>
