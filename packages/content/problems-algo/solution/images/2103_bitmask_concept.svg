<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：每根杆子用 3 位掩码记录三色是否存在</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">R→第0位(1) · G→第1位(2) · B→第2位(4)，mask==7 ⇔ 三色齐全</text>

  <!-- ===== Rod 0: all three colors (green highlight) ===== -->
  <rect x="40" y="64" width="140" height="130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="84" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">杆 0</text>
  <text x="110" y="100" text-anchor="middle" font-size="10" fill="#4a7a3a">三色齐全 ✓</text>

  <!-- bit cells for rod 0 -->
  <rect x="58" y="110" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="132" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">R</text>
  <rect x="96" y="110" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="132" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">G</text>
  <rect x="134" y="110" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="151" y="132" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">B</text>

  <text x="110" y="162" text-anchor="middle" font-size="11" fill="#555">mask = 0b111</text>
  <text x="110" y="180" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">= 7 ✓</text>

  <!-- ===== Rod 5: only R + G (orange partial) ===== -->
  <rect x="190" y="64" width="140" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="84" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">杆 5</text>
  <text x="260" y="100" text-anchor="middle" font-size="10" fill="#d6a040">缺 B ✗</text>

  <rect x="208" y="110" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="132" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">R</text>
  <rect x="246" y="110" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="263" y="132" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">G</text>
  <rect x="284" y="110" width="34" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="301" y="132" text-anchor="middle" font-size="12" fill="#bbb">B</text>

  <text x="260" y="162" text-anchor="middle" font-size="11" fill="#555">mask = 0b011</text>
  <text x="260" y="180" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">= 3 ✗</text>

  <!-- ===== Rod 9: only R (red minimal) ===== -->
  <rect x="340" y="64" width="140" height="130" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="84" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">杆 9</text>
  <text x="410" y="100" text-anchor="middle" font-size="10" fill="#b85450">仅 R ✗</text>

  <rect x="358" y="110" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="375" y="132" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">R</text>
  <rect x="396" y="110" width="34" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="413" y="132" text-anchor="middle" font-size="12" fill="#bbb">G</text>
  <rect x="434" y="110" width="34" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="451" y="132" text-anchor="middle" font-size="12" fill="#bbb">B</text>

  <text x="410" y="162" text-anchor="middle" font-size="11" fill="#555">mask = 0b001</text>
  <text x="410" y="180" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">= 1 ✗</text>

  <!-- ===== Bottom: color → bit mapping table ===== -->
  <rect x="40" y="208" width="440" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">颜色 → 比特位映射</text>
  <text x="260" y="246" text-anchor="middle" font-size="10.5" fill="#555">R → 1&lt;&lt;0 = 0b001 (1) · G → 1&lt;&lt;1 = 0b010 (2) · B → 1&lt;&lt;2 = 0b100 (4)</text>
  <text x="260" y="260" text-anchor="middle" font-size="10.5" fill="#555">三色齐全 ⇔ mask == 0b111 == 7（用 == 而非 &amp;）</text>

  <!-- ===== Bottom insight ===== -->
  <rect x="40" y="276" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">为何按位或天然去重？</text>
  <text x="260" y="312" text-anchor="middle" font-size="10.5" fill="#555">mask |= bit 幂等：同色再套一次，对应比特早已是 1，或运算不变</text>

  <!-- Footer -->
  <text x="260" y="338" text-anchor="middle" font-size="10" fill="#aaa">时间 O(n) · 空间 O(1)（10 个整数的定长数组）</text>
  <text x="260" y="352" text-anchor="middle" font-size="10" fill="#aaa">颜色仅 3 种 + 杆仅 10 根 → 位掩码完美匹配</text>
</svg>
