<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：记忆化 DFS</text>

  <!-- start box -->
  <rect x="170" y="46" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="71" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">dfs(n)</text>

  <path d="M 280 88 L 280 108" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- memo check diamond -->
  <path d="M 280 110 L 400 150 L 280 190 L 160 150 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="148" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">memo 中有 n？</text>
  <text x="280" y="164" text-anchor="middle" font-size="10" fill="#888">memo.count(n)</text>

  <!-- yes branch -->
  <path d="M 400 150 L 460 150" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="144" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="448" y="138" width="96" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="496" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return memo[n]</text>

  <!-- no branch -->
  <path d="M 280 192 L 280 212" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="206" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- base case diamond -->
  <path d="M 280 214 L 390 250 L 280 286 L 170 250 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">n ≤ 1？</text>
  <text x="280" y="264" text-anchor="middle" font-size="10" fill="#888">边界条件</text>

  <!-- yes -->
  <path d="M 390 250 L 460 250" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="244" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="448" y="238" width="96" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="496" y="256" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return n</text>

  <!-- no -->
  <path d="M 280 288 L 280 308" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="302" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- compute box -->
  <rect x="80" y="310" width="400" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">计算三选项取最小</text>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#444">ans = n</text>
  <text x="280" y="366" text-anchor="middle" font-size="11" fill="#4a7a3a">ans = min(ans, n%2 + 1 + dfs(⌊n/2⌋))</text>
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#b85450">ans = min(ans, n%3 + 1 + dfs(⌊n/3⌋))</text>

  <path d="M 280 388 L 280 408" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- store + return -->
  <rect x="120" y="410" width="320" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="430" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">memo[n] = ans; return ans</text>

  <path d="M 280 442 L 280 458" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="460" width="160" height="0" fill="none"/>
</svg>
