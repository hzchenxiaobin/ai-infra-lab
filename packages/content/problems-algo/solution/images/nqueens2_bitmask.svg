<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三个约束 → 三个整数 → avail 一次算出</text>

  <!-- 左：4x4 棋盘，第 0 行已放 Q 于 col=1，展示对第 1 行的攻击 -->
  <g filter="url(#rough2)">
    <rect x="50" y="60" width="160" height="160" fill="#fff" stroke="#888" stroke-width="1.4"/>
    <line x1="90" y1="60" x2="90" y2="220" stroke="#aaa" stroke-width="1"/>
    <line x1="130" y1="60" x2="130" y2="220" stroke="#aaa" stroke-width="1"/>
    <line x1="170" y1="60" x2="170" y2="220" stroke="#aaa" stroke-width="1"/>
    <line x1="50" y1="100" x2="210" y2="100" stroke="#aaa" stroke-width="1"/>
    <line x1="50" y1="140" x2="210" y2="140" stroke="#aaa" stroke-width="1"/>
    <line x1="50" y1="180" x2="210" y2="180" stroke="#aaa" stroke-width="1"/>
  </g>

  <!-- 列号 -->
  <text x="70" y="54" text-anchor="middle" font-size="10" fill="#888">c0</text>
  <text x="110" y="54" text-anchor="middle" font-size="10" fill="#888">c1</text>
  <text x="150" y="54" text-anchor="middle" font-size="10" fill="#888">c2</text>
  <text x="190" y="54" text-anchor="middle" font-size="10" fill="#888">c3</text>

  <!-- 第 0 行皇后在 col=1 (中心 110,80) -->
  <circle cx="110" cy="80" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="85" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Q</text>
  <text x="40" y="84" text-anchor="end" font-size="10" fill="#888">row0</text>

  <!-- 第 1 行（当前决策行）攻击高亮：列1、↘到c2、↙到c0 -->
  <rect x="90" y="100" width="40" height="40" fill="#b85450" opacity="0.18" filter="url(#rough2)"/>
  <rect x="130" y="100" width="40" height="40" fill="#d6a040" opacity="0.20" filter="url(#rough2)"/>
  <rect x="50" y="100" width="40" height="40" fill="#d6a040" opacity="0.20" filter="url(#rough2)"/>
  <text x="40" y="124" text-anchor="end" font-size="10" fill="#888">row1</text>
  <!-- 攻击来源连线 -->
  <line x1="110" y1="93" x2="110" y2="100" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="118" y1="93" x2="148" y2="100" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="102" y1="93" x2="72" y2="100" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="130" y="244" text-anchor="middle" font-size="11" fill="#888">col1 红=列攻；c2/c0 橙=↘/↙ 对角攻</text>
  <text x="130" y="260" text-anchor="middle" font-size="11" fill="#888">row1 可放只剩 c3</text>

  <!-- 右：三个掩码 + avail -->
  <text x="400" y="58" font-size="12" fill="#446688" font-weight="bold">三个整数（低4位，row1 视角）</text>

  <!-- cols -->
  <rect x="320" y="70" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="335" y="92" font-size="11" fill="#333" font-weight="bold">cols</text>
  <text x="430" y="92" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">0 0 1 0</text>
  <text x="528" y="92" font-size="10" fill="#888">←c1 占</text>

  <!-- diag1 -->
  <rect x="320" y="110" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="335" y="132" font-size="11" fill="#333" font-weight="bold">d1 ↘</text>
  <text x="430" y="132" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">0 1 0 0</text>
  <text x="528" y="132" font-size="10" fill="#888">←c2 攻</text>

  <!-- diag2 -->
  <rect x="320" y="150" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="335" y="172" font-size="11" fill="#333" font-weight="bold">d2 ↙</text>
  <text x="430" y="172" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">0 0 0 1</text>
  <text x="528" y="172" font-size="10" fill="#888">←c0 攻</text>

  <!-- OR -->
  <text x="430" y="204" text-anchor="middle" font-size="11" fill="#666">cols | d1 | d2 =</text>
  <rect x="360" y="210" width="140" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="430" y="229" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">0 1 1 1</text>

  <!-- avail -->
  <text x="430" y="258" text-anchor="middle" font-size="11" fill="#666">~(...) &amp; 1111 =</text>
  <rect x="360" y="264" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="430" y="285" text-anchor="middle" font-size="13" fill="#2d5a1f" font-weight="bold" font-family="monospace">1 0 0 0</text>
  <text x="528" y="285" font-size="10" fill="#4a7a3a" font-weight="bold">←c3 可放</text>

  <!-- 底部说明 -->
  <rect x="50" y="310" width="500" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="332" text-anchor="middle" font-size="11" fill="#444">关键：每个 1 位 = 一条占用/攻击线。一次按位或 + 取反</text>
  <text x="300" y="350" text-anchor="middle" font-size="11" fill="#444">就把「逐列三次查询」压成「一次取出全部可放列」。</text>
  <text x="300" y="368" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">递归下一行时 d1 左移、d2 右移（对角线整体平移）</text>
</svg>
