<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两条对角线：主对角线 nums[i][i] 与副对角线 nums[i][n-1-i]</text>

  <!-- 3x3 matrix, cell 64x64, start x=174 y=64 -->
  <!-- Row 0 -->
  <rect x="174" y="64" width="64" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="206" y="102" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">1</text>
  <rect x="238" y="64" width="64" height="64" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="102" text-anchor="middle" font-size="18" fill="#999">2</text>
  <rect x="302" y="64" width="64" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="334" y="102" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">3</text>

  <!-- Row 1 -->
  <rect x="174" y="128" width="64" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="206" y="166" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">5</text>
  <!-- center: shared by both diagonals -> orange -->
  <rect x="238" y="128" width="64" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="166" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">6</text>
  <rect x="302" y="128" width="64" height="64" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="334" y="166" text-anchor="middle" font-size="18" fill="#999">7</text>

  <!-- Row 2 -->
  <rect x="174" y="192" width="64" height="64" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="206" y="230" text-anchor="middle" font-size="18" fill="#999">9</text>
  <rect x="238" y="192" width="64" height="64" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="230" text-anchor="middle" font-size="18" fill="#999">10</text>
  <rect x="302" y="192" width="64" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="334" y="230" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">11</text>

  <!-- index labels i -->
  <text x="160" y="102" text-anchor="end" font-size="11" fill="#888">i=0</text>
  <text x="160" y="166" text-anchor="end" font-size="11" fill="#888">i=1</text>
  <text x="160" y="230" text-anchor="end" font-size="11" fill="#888">i=2</text>

  <!-- Legend / annotation boxes -->
  <rect x="40" y="284" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="50" y="306" font-size="12" fill="#333"><tspan font-weight="bold" fill="#446688">主对角线</tspan> nums[i][i] = [1, 6, 11]</text>

  <rect x="280" y="284" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="306" font-size="12" fill="#333"><tspan font-weight="bold" fill="#4a7a3a">副对角线</tspan> nums[i][n-1-i] = [3, 6, 9]</text>

  <rect x="40" y="326" width="460" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="50" y="348" font-size="12" fill="#333"><tspan font-weight="bold" fill="#d6a040">中心 6</tspan>：奇数阶矩阵的中心点 i = n/2 时两式相等，同时落在两条对角线上</text>

  <!-- Result -->
  <rect x="40" y="370" width="460" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="270" y="386" text-anchor="middle" font-size="12" fill="#555">合并去重得候选集 {1, 3, 6, 9, 11}，再逐个判质数取最大</text>
</svg>
