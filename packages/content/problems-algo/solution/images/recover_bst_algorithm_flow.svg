<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：中序遍历 + prev 指针找逆序对</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">first 仅赋值一次（首次逆序的前驱），second 每次逆序都更新（末次逆序的当前）</text>

  <!-- Step 1: init -->
  <rect x="200" y="60" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">初始化</text>
  <text x="280" y="93" text-anchor="middle" font-size="9" fill="#555">st=[]; cur=root; prev=first=second=null</text>
  <path d="M 280 100 L 280 114" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>

  <!-- Step 2: push left -->
  <rect x="180" y="116" width="200" height="44" fill="#fff" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">一路向左压栈</text>
  <text x="280" y="150" text-anchor="middle" font-size="9" fill="#555">while cur: st.push(cur); cur=cur.left</text>
  <path d="M 280 160 L 280 174" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>

  <!-- Step 3: pop & visit -->
  <rect x="180" y="176" width="200" height="40" fill="#fff" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="194" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">弹栈访问 cur = st.pop()</text>
  <text x="280" y="208" text-anchor="middle" font-size="9" fill="#555">得到中序当前节点</text>
  <path d="M 280 216 L 280 230" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>

  <!-- Decision: prev.val > cur.val ? -->
  <polygon points="280,232 380,272 280,312 180,272" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="268" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">prev != null</text>
  <text x="280" y="284" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">且 prev.val &gt; cur.val ?</text>
  <text x="280" y="300" text-anchor="middle" font-size="9" fill="#888">（发现逆序）</text>

  <!-- No branch -->
  <path d="M 180 272 L 120 272 L 120 360" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)"/>
  <text x="150" y="264" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Yes branch -->
  <path d="M 380 272 L 440 272" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)"/>
  <text x="410" y="264" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>

  <!-- Yes: inner decision first==null? -->
  <rect x="440" y="248" width="110" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="495" y="266" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">first == null ?</text>
  <text x="495" y="280" text-anchor="middle" font-size="9" fill="#555">是 → first = prev</text>
  <text x="495" y="292" text-anchor="middle" font-size="9" fill="#555">（仅首次赋值）</text>

  <!-- second always update -->
  <rect x="440" y="306" width="110" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="495" y="328" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">second = cur</text>

  <path d="M 495 340 L 495 360 L 120 360" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>

  <!-- merge: update prev, go right -->
  <rect x="60" y="346" width="240" height="36" fill="#fff" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="180" y="368" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">prev = cur; cur = cur.right</text>
  <path d="M 180 382 L 180 392 L 280 392 L 280 116" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrB)"/>
  <text x="230" y="404" text-anchor="middle" font-size="9" fill="#446688">回到「一路向左压栈」（循环）</text>

  <!-- End: swap -->
  <rect x="320" y="346" width="220" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="430" y="366" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">遍历结束：交换 first.val ↔ second.val</text>
  <text x="430" y="382" text-anchor="middle" font-size="9" fill="#555">仅交换值，树结构保持不变</text>
  <text x="430" y="396" text-anchor="middle" font-size="9" fill="#888">栈空且 cur=null 时触发</text>
</svg>
