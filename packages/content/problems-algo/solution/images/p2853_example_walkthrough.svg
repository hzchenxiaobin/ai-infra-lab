<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：分组找最大 → 作绝对差</text>

  <!-- ===== Engineering table ===== -->
  <rect x="36" y="40" width="250" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="56" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">emp_name</text>
  <text x="236" y="56" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">salary</text>

  <rect x="36" y="64" width="250" height="22" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="110" y="79" text-anchor="middle" font-size="9" fill="#333">Kathy</text>
  <text x="236" y="79" text-anchor="middle" font-size="9" fill="#333">50000</text>

  <rect x="36" y="86" width="250" height="22" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="110" y="101" text-anchor="middle" font-size="9" fill="#333">Charles</text>
  <text x="236" y="101" text-anchor="middle" font-size="9" fill="#333">45000</text>

  <rect x="36" y="108" width="250" height="22" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="110" y="123" text-anchor="middle" font-size="9" fill="#333">Jack</text>
  <text x="236" y="123" text-anchor="middle" font-size="9" fill="#333">85000</text>

  <rect x="36" y="130" width="250" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="145" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">Edward ★</text>
  <text x="236" y="145" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">102000</text>

  <rect x="36" y="152" width="250" height="22" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="110" y="167" text-anchor="middle" font-size="9" fill="#333">Terry</text>
  <text x="236" y="167" text-anchor="middle" font-size="9" fill="#333">44000</text>

  <rect x="36" y="174" width="250" height="22" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="110" y="189" text-anchor="middle" font-size="9" fill="#333">Arthur</text>
  <text x="236" y="189" text-anchor="middle" font-size="9" fill="#333">32000</text>

  <!-- ===== Marketing table ===== -->
  <rect x="304" y="40" width="250" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="378" y="56" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">emp_name</text>
  <text x="504" y="56" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">salary</text>

  <rect x="304" y="64" width="250" height="22" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="378" y="79" text-anchor="middle" font-size="9" fill="#333">Roy</text>
  <text x="504" y="79" text-anchor="middle" font-size="9" fill="#333">30000</text>

  <rect x="304" y="86" width="250" height="22" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="378" y="101" text-anchor="middle" font-size="9" fill="#333">Benjamin</text>
  <text x="504" y="101" text-anchor="middle" font-size="9" fill="#333">34000</text>

  <rect x="304" y="108" width="250" height="22" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="378" y="123" text-anchor="middle" font-size="9" fill="#333">Anthony</text>
  <text x="504" y="123" text-anchor="middle" font-size="9" fill="#333">42000</text>

  <rect x="304" y="130" width="250" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="378" y="145" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">Evelyn ★</text>
  <text x="504" y="145" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">53000</text>

  <!-- ===== Arrows to MAX chips ===== -->
  <path d="M 161 196 L 161 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 429 152 L 429 170" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- MAX chips -->
  <rect x="86" y="218" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="161" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">组内 MAX = 102,000</text>
  <rect x="354" y="174" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="429" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">组内 MAX = 53,000</text>

  <!-- ===== Converge arrows ===== -->
  <path d="M 161 248 C 161 280, 200 286, 236 286" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 429 204 C 429 268, 380 286, 344 286" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Subtract box ===== -->
  <rect x="185" y="266" width="210" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="294" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">|102,000 − 53,000| = 49,000</text>

  <path d="M 290 310 L 290 326" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Output table ===== -->
  <rect x="190" y="330" width="200" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="346" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">salary_difference</text>
  <rect x="190" y="354" width="200" height="24" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="290" y="370" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">49000</text>

  <!-- ===== Bottom explanation ===== -->
  <text x="290" y="404" text-anchor="middle" font-size="9" fill="#888">Engineering 最高：Edward 102,000；Marketing 最高：Evelyn 53,000</text>
</svg>
