<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：points = [[1,5],[2,3],[3,4],[4,2],[5,1]]，答案 5</text>
  <text x="260" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">排序（x 升序，同 x 则 y 降序）后顺序不变：(1,5)→(2,3)→(3,4)→(4,2)→(5,1)</text>

  <!-- left: coordinate sketch -->
  <path d="M 48 268 L 268 268" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 56 276 L 56 76" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="282" font-size="10" fill="#888" filter="url(#rough2)">x</text>
  <text x="44" y="72" font-size="10" fill="#888" filter="url(#rough2)">y</text>

  <!-- invalid rectangle (1,5)-(4,2) blocked by (3,4) -->
  <rect x="94" y="88" width="114" height="108" fill="#fce4ec" fill-opacity="0.22" stroke="#b85450" stroke-width="1.4" stroke-dasharray="7 5" rx="2" filter="url(#rough2)"/>
  <!-- valid rectangles -->
  <rect x="94" y="88" width="38" height="72" fill="none" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <rect x="94" y="88" width="76" height="36" fill="none" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <rect x="132" y="160" width="76" height="36" fill="none" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <rect x="170" y="124" width="38" height="72" fill="none" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <rect x="208" y="196" width="38" height="36" fill="none" stroke="#4a7a3a" stroke-width="1.6" rx="2" filter="url(#rough2)"/>

  <!-- points -->
  <circle cx="94" cy="88" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="76" y="82" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">(1,5)</text>
  <circle cx="132" cy="160" r="5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="118" y="178" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">(2,3)</text>
  <circle cx="170" cy="124" r="5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="180" y="118" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">(3,4)</text>
  <circle cx="208" cy="196" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="216" y="212" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(4,2)</text>
  <circle cx="246" cy="232" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="246" y="250" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(5,1)</text>
  <text x="151" y="102" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ (1,5)-(4,2)：(3,4) 在矩形内</text>

  <!-- right: round cards -->
  <rect x="278" y="70" width="234" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="395" y="86" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i=0 · A=(1,5)</text>
  <text x="395" y="101" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">(2,3)：3≤5 且 3&gt;−∞ → ✓ maxY=3</text>
  <text x="395" y="114" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">(3,4)：4&gt;3 → ✓ maxY=4；(4,2)(5,1) ✗ 被挡</text>

  <rect x="278" y="138" width="234" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="395" y="154" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i=1 · A=(2,3)</text>
  <text x="395" y="169" text-anchor="middle" font-size="9.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">(3,4)：4&gt;3 在 A 上方 → 跳过，不抬闸门！</text>
  <text x="395" y="182" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">(4,2)：2&gt;−∞ → ✓ maxY=2；(5,1)：1≤2 ✗</text>

  <rect x="278" y="206" width="234" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="395" y="222" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i=2 · A=(3,4)</text>
  <text x="395" y="237" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">(4,2)：✓ maxY=2；(5,1)：1≤2 → ✗ 被 (4,2) 挡</text>

  <rect x="278" y="260" width="234" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="395" y="280" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">i=3 · A=(4,2)：(5,1)：1&gt;−∞ → ✓ 计数</text>

  <!-- result -->
  <rect x="278" y="300" width="234" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="395" y="324" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">ans = 2 + 1 + 1 + 1 = 5 ✓</text>

  <!-- bottom note -->
  <rect x="48" y="352" width="424" height="54" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="373" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">三个官方示例（与 I 版 3025 完全相同）依次得 0、2、2，同法演算即得。</text>
  <text x="260" y="392" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">留意 i=1 轮：高于 A 的点跳过时连闸门都不碰，这是最易写错的一步</text>
</svg>
