<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心算法流程（排序 + 前缀最小值 + 双指针匹配）</text>

  <!-- Step 1: sort boxes -->
  <rect x="130" y="42" width="280" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#333">排序 boxes（升序）</text>

  <!-- arrow down -->
  <path d="M 270 72 L 270 88" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: prefix min -->
  <rect x="130" y="92" width="280" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="112" text-anchor="middle" font-size="12" fill="#333">计算前缀最小值 minH[i] = min(wh[0..i])</text>

  <!-- arrow down -->
  <path d="M 270 122 L 270 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Start node -->
  <ellipse cx="270" cy="162" rx="140" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="166" text-anchor="middle" font-size="12" fill="#333">初始化: boxIdx=0, j = m−1, count=0</text>

  <!-- arrow down -->
  <path d="M 270 182 L 270 198" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: j >= 0 && boxIdx < n? -->
  <polygon points="270,202 380,248 270,284 160,248" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="244" text-anchor="middle" font-size="12" fill="#333">j ≥ 0 且</text>
  <text x="270" y="260" text-anchor="middle" font-size="12" fill="#333">boxIdx &lt; n ?</text>

  <!-- No branch -> end -->
  <path d="M 380 248 L 452 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="240" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="486" cy="248" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="252" text-anchor="middle" font-size="12" fill="#333">返回 count</text>

  <!-- Yes branch down -->
  <path d="M 270 284 L 270 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="296" font-size="11" fill="#82b366">是</text>

  <!-- Decision: boxes[boxIdx] <= minH[j]? -->
  <polygon points="270,304 390,350 270,376 150,350" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="342" text-anchor="middle" font-size="11" fill="#333">boxes[boxIdx]</text>
  <text x="270" y="358" text-anchor="middle" font-size="11" fill="#333">≤ minH[j] ?</text>

  <!-- Yes (fits) -> place box -->
  <path d="M 150 350 L 90 350" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="342" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="14" y="330" width="76" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="348" text-anchor="middle" font-size="10" fill="#333">count++</text>
  <text x="52" y="362" text-anchor="middle" font-size="10" fill="#555">boxIdx++</text>
  <text x="52" y="376" text-anchor="middle" font-size="10" fill="#555">j−−</text>

  <!-- No (doesn't fit) -> skip position -->
  <path d="M 390 350 L 440 350" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="342" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="442" y="338" width="76" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="356" text-anchor="middle" font-size="10" fill="#333">j−−（跳过）</text>

  <!-- loop back arrows -->
  <path d="M 52 330 L 52 248 L 160 248" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 480 338 L 480 248 L 380 248" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="42" y="290" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 42 290)">放下了→下一个箱子</text>
  <text x="500" y="290" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 500 290)">放不下→跳位置</text>
</svg>
