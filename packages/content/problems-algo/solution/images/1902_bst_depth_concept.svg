<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：新节点的父节点 = 前驱与后继中较深者</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">已插入 {1, 2, 4}，现在插入 v = 3</text>

  <!-- ====== Left side: existing BST ====== -->
  <text x="140" y="72" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">当前 BST</text>

  <!-- Root: 2 (depth 1) -->
  <circle cx="140" cy="96" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="101" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="172" y="100" font-size="9" fill="#888">d=1</text>

  <!-- Left child: 1 (depth 2) -->
  <path d="M 128 112 L 92 140" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <circle cx="84" cy="152" r="18" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="157" text-anchor="middle" font-size="12" fill="#888">1</text>
  <text x="110" y="156" font-size="9" fill="#aaa">d=2</text>

  <!-- Right child: 4 (depth 2) -->
  <path d="M 152 112 L 188 140" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <circle cx="196" cy="152" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="196" y="157" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="228" y="156" font-size="9" fill="#446688">d=2</text>

  <!-- New node v=3 (depth 3) being inserted as left child of 4 -->
  <path d="M 184 168 L 150 196" stroke="#b85450" stroke-width="2.2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <circle cx="142" cy="208" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="142" y="213" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <text x="174" y="212" font-size="9.5" fill="#b85450" font-weight="bold">d=3 (新)</text>

  <!-- Annotations for p and s -->
  <!-- p = 2 (predecessor) -->
  <path d="M 140 116 Q 100 220 130 280" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <rect x="40" y="288" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="304" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">前驱 p=2, d=1</text>

  <!-- s = 4 (successor) -->
  <path d="M 196 172 Q 230 200 250 280" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <rect x="200" y="288" width="124" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="262" y="304" text-anchor="middle" font-size="10.5" fill="#a87020" font-weight="bold">后继 s=4, d=2</text>

  <!-- ====== Right side: formula and insight ====== -->
  <!-- Formula box -->
  <rect x="350" y="72" width="190" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="445" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">深度递推公式</text>
  <text x="445" y="112" text-anchor="middle" font-size="11" fill="#446688">depth[v] = 1 + max(d[p], d[s])</text>

  <!-- Arrow from formula to computation -->
  <path d="M 445 128 L 445 144" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Computation box -->
  <rect x="350" y="144" width="190" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="445" y="164" text-anchor="middle" font-size="10.5" fill="#333">depth[3] = 1 + max(1, 2)</text>
  <text x="445" y="182" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">= 3 ✓</text>

  <!-- Arrow to insight -->
  <path d="M 445 192 L 445 208" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Insight box: why deeper one is parent -->
  <rect x="340" y="208" width="210" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="445" y="228" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">为什么取较深者？</text>
  <text x="445" y="246" text-anchor="middle" font-size="9.5" fill="#555">p 与 s 在已排序序列中相邻</text>
  <text x="445" y="260" text-anchor="middle" font-size="9.5" fill="#555">→ BST 中一个是另一个的祖先</text>
  <text x="445" y="276" text-anchor="middle" font-size="9.5" fill="#555">较深者（后代）的 v 侧指针为空</text>
  <text x="445" y="292" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">→ v 挂在较深者下面</text>

  <!-- Footer note -->
  <rect x="30" y="330" width="500" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">用有序集合（set/TreeMap）O(log n) 查前驱后继 + 哈希表存深度</text>
  <text x="280" y="368" text-anchor="middle" font-size="10" fill="#555">每次插入只看前驱、后继两个邻居 → 总复杂度 O(n log n)</text>
  <text x="280" y="382" text-anchor="middle" font-size="9.5" fill="#888">对比朴素 BST 模拟 O(n·h)，最坏退化为链 O(n²) → TLE</text>
</svg>
