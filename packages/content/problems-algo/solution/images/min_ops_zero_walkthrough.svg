<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：n = 39，三步归零</text>

  <!-- bit positions header -->
  <text x="270" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">位序：5　4　3　2　1　0</text>

  <!-- Row 1: 39 = 100111 -->
  <text x="110" y="92" text-anchor="end" font-size="14" fill="#333" filter="url(#rough2)">39 =</text>
  <g filter="url(#rough2)">
    <rect x="150" y="72" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="167" y="95" text-anchor="middle" font-size="15" fill="#333">1</text>
    <rect x="188" y="72" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="205" y="95" text-anchor="middle" font-size="15" fill="#888">0</text>
    <rect x="226" y="72" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="243" y="95" text-anchor="middle" font-size="15" fill="#888">0</text>
    <rect x="264" y="72" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="281" y="95" text-anchor="middle" font-size="15" fill="#333">1</text>
    <rect x="302" y="72" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="319" y="95" text-anchor="middle" font-size="15" fill="#333">1</text>
    <rect x="340" y="72" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="357" y="95" text-anchor="middle" font-size="15" fill="#333">1</text>
  </g>
  <text x="392" y="92" font-size="12" fill="#d6a040" filter="url(#rough2)">连续 1 段（低位）</text>

  <!-- arrow op1 -->
  <line x1="270" y1="116" x2="270" y2="140" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="132" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+2⁰（进位合并低位段）</text>

  <!-- Row 2: 40 = 101000 -->
  <text x="110" y="172" text-anchor="end" font-size="14" fill="#333" filter="url(#rough2)">40 =</text>
  <g filter="url(#rough2)">
    <rect x="150" y="152" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="167" y="175" text-anchor="middle" font-size="15" fill="#333">1</text>
    <rect x="188" y="152" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="205" y="175" text-anchor="middle" font-size="15" fill="#888">0</text>
    <rect x="226" y="152" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="243" y="175" text-anchor="middle" font-size="15" fill="#333">1</text>
    <rect x="264" y="152" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="281" y="175" text-anchor="middle" font-size="15" fill="#888">0</text>
    <rect x="302" y="152" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="319" y="175" text-anchor="middle" font-size="15" fill="#888">0</text>
    <rect x="340" y="152" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="357" y="175" text-anchor="middle" font-size="15" fill="#888">0</text>
  </g>
  <text x="392" y="172" font-size="12" fill="#4a7a3a" filter="url(#rough2)">只剩两个孤立 1</text>

  <!-- arrow op2 -->
  <line x1="270" y1="196" x2="270" y2="220" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="212" font-size="12" fill="#b85450" filter="url(#rough2)">−2³</text>

  <!-- Row 3: 32 = 100000 -->
  <text x="110" y="252" text-anchor="end" font-size="14" fill="#333" filter="url(#rough2)">32 =</text>
  <g filter="url(#rough2)">
    <rect x="150" y="232" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="167" y="255" text-anchor="middle" font-size="15" fill="#333">1</text>
    <rect x="188" y="232" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="205" y="255" text-anchor="middle" font-size="15" fill="#888">0</text>
    <rect x="226" y="232" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="243" y="255" text-anchor="middle" font-size="15" fill="#888">0</text>
    <rect x="264" y="232" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="281" y="255" text-anchor="middle" font-size="15" fill="#888">0</text>
    <rect x="302" y="232" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="319" y="255" text-anchor="middle" font-size="15" fill="#888">0</text>
    <rect x="340" y="232" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="357" y="255" text-anchor="middle" font-size="15" fill="#888">0</text>
  </g>
  <text x="392" y="252" font-size="12" fill="#333" filter="url(#rough2)">单个 2⁵</text>

  <!-- arrow op3 -->
  <line x1="270" y1="276" x2="270" y2="300" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="292" font-size="12" fill="#b85450" filter="url(#rough2)">−2⁵</text>

  <!-- Row 4: 0 -->
  <text x="110" y="332" text-anchor="end" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="150" y="312" width="224" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="262" y="335" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">归零 ✓</text>

  <!-- bottom summary -->
  <rect x="120" y="354" width="300" height="22" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="270" y="370" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">共 3 次操作：+2⁰、−2³、−2⁵</text>
</svg>
