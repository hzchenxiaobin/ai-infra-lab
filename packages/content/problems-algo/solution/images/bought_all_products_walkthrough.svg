<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：GROUP BY + HAVING 逐步执行</text>

  <!-- Step 1: Product 总数 -->
  <text x="290" y="54" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">步骤① Product 表 → 总数 COUNT(*) = 2</text>
  <rect x="210" y="62" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="76" text-anchor="middle" font-size="9" fill="#333">product_key</text>
  <rect x="210" y="82" width="40" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="230" y="95" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <rect x="250" y="82" width="40" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="270" y="95" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">6</text>
  <text x="340" y="93" font-size="11" fill="#4a7a3a" font-weight="bold">→ 总数 = 2</text>

  <path d="M290 110 L290 128" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: GROUP BY -->
  <text x="290" y="146" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">步骤② Customer 按 customer_id 分组，COUNT(DISTINCT product_key)</text>

  <!-- Customer 原表 -->
  <text x="95" y="164" text-anchor="middle" font-size="9" fill="#446688">Customer 表</text>
  <rect x="50" y="170" width="90" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="72" y="184" font-size="9" fill="#333">cid</text>
  <text x="115" y="184" font-size="9" fill="#333">product</text>
  <line x1="90" y1="170" x2="90" y2="190" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="50" y="190" width="90" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="72" y="202" font-size="9" fill="#333">1</text><text x="115" y="202" font-size="9" fill="#333">5</text>
  <line x1="90" y1="190" x2="90" y2="206" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="50" y="206" width="90" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="72" y="218" font-size="9" fill="#333">2</text><text x="115" y="218" font-size="9" fill="#333">6</text>
  <line x1="90" y1="206" x2="90" y2="222" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="50" y="222" width="90" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="72" y="234" font-size="9" fill="#333">3</text><text x="115" y="234" font-size="9" fill="#333">5</text>
  <line x1="90" y1="222" x2="90" y2="238" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="50" y="238" width="90" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="72" y="250" font-size="9" fill="#333">3</text><text x="115" y="250" font-size="9" fill="#333">6</text>
  <line x1="90" y1="238" x2="90" y2="254" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="50" y="254" width="90" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="72" y="266" font-size="9" fill="#333">1</text><text x="115" y="266" font-size="9" fill="#333">6</text>
  <line x1="90" y1="254" x2="90" y2="270" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <path d="M150 210 L210 210" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="180" y="204" text-anchor="middle" font-size="9" fill="#446688">GROUP BY</text>

  <!-- 分组结果 -->
  <text x="320" y="164" text-anchor="middle" font-size="9" fill="#446688">分组去重计数结果</text>
  <rect x="230" y="170" width="180" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="184" font-size="9" fill="#333">customer_id</text>
  <text x="350" y="184" font-size="9" fill="#333">COUNT(DISTINCT)</text>
  <line x1="300" y1="170" x2="300" y2="190" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="230" y="190" width="180" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="265" y="203" font-size="9" fill="#333">1</text><text x="350" y="203" font-size="9" fill="#4a7a3a" font-weight="bold">2 ({5,6})</text>
  <line x1="300" y1="190" x2="300" y2="208" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="230" y="208" width="180" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="265" y="221" font-size="9" fill="#333">2</text><text x="350" y="221" font-size="9" fill="#b85450" font-weight="bold">1 ({6})</text>
  <line x1="300" y1="208" x2="300" y2="226" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="230" y="226" width="180" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="265" y="239" font-size="9" fill="#333">3</text><text x="350" y="239" font-size="9" fill="#4a7a3a" font-weight="bold">2 ({5,6})</text>
  <line x1="300" y1="226" x2="300" y2="244" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <path d="M320 262 L320 282" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="440" y="278" font-size="10" fill="#b85450" font-weight="bold">HAVING count = 2</text>

  <!-- Step 3: HAVING 筛选 -->
  <text x="290" y="300" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">步骤③ HAVING 筛选：count = 2 = Product 总数</text>
  <rect x="190" y="308" width="200" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="322" font-size="9" fill="#333">customer_id</text>
  <text x="330" y="322" font-size="9" fill="#333">count = 2 ?</text>
  <line x1="270" y1="308" x2="270" y2="328" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="190" y="328" width="200" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="230" y="341" font-size="9" fill="#333">1</text><text x="330" y="341" font-size="9" fill="#4a7a3a" font-weight="bold">2=2 ✓</text>
  <line x1="270" y1="328" x2="270" y2="346" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="190" y="346" width="200" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="230" y="359" font-size="9" fill="#333">2</text><text x="330" y="359" font-size="9" fill="#b85450" font-weight="bold">1≠2 ✗ 淘汰</text>
  <line x1="270" y1="346" x2="270" y2="364" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="190" y="364" width="200" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="230" y="377" font-size="9" fill="#333">3</text><text x="330" y="377" font-size="9" fill="#4a7a3a" font-weight="bold">2=2 ✓</text>
  <line x1="270" y1="364" x2="270" y2="382" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <path d="M290 392 L290 412" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="380" y="408" font-size="10" fill="#4a7a3a" font-weight="bold">SELECT customer_id</text>

  <!-- Step 4: 输出 -->
  <text x="290" y="430" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">步骤④ 最终输出</text>
  <rect x="220" y="438" width="140" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="452" text-anchor="middle" font-size="9" fill="#333">customer_id</text>
  <rect x="220" y="458" width="140" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="290" y="470" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1, 3</text>
</svg>
