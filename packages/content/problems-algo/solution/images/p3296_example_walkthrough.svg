<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 演算：H = 10，workerTimes = [3, 2, 2, 4]</text>
  <text x="260" y="38" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">可行性的分界：T = 11 差一米，T = 12 恰好够</text>

  <!-- 左表：T = 11 -->
  <rect x="28" y="50" width="220" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="138" y="67" text-anchor="middle" font-size="11" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">试探 T = 11 ✗</text>

  <rect x="28" y="82" width="220" height="20" fill="#ffffff" stroke="#d8a8a5" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="47" y="96" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">w</text>
  <text x="95" y="96" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">q=⌊2T/w⌋</text>
  <text x="150" y="96" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">x_max</text>
  <text x="212" y="96" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">w·x(x+1)/2</text>

  <rect x="28" y="102" width="220" height="22" fill="#fff5f5" stroke="#d8a8a5" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="47" y="117" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">3</text>
  <text x="95" y="117" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">7</text>
  <text x="150" y="117" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2</text>
  <text x="212" y="117" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">9 ≤ 11</text>

  <rect x="28" y="124" width="220" height="22" fill="#ffffff" stroke="#d8a8a5" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="47" y="139" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2</text>
  <text x="95" y="139" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">11</text>
  <text x="150" y="139" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="212" y="139" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">6 ≤ 11</text>

  <rect x="28" y="146" width="220" height="22" fill="#fff5f5" stroke="#d8a8a5" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="47" y="161" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2</text>
  <text x="95" y="161" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">11</text>
  <text x="150" y="161" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="212" y="161" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">6 ≤ 11</text>

  <rect x="28" y="168" width="220" height="22" fill="#ffffff" stroke="#d8a8a5" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="47" y="183" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">4</text>
  <text x="95" y="183" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">5</text>
  <text x="150" y="183" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1</text>
  <text x="212" y="183" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">4 ≤ 11</text>

  <rect x="28" y="192" width="220" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="138" y="208" text-anchor="middle" font-size="10" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">Σ = 2+2+2+1 = 7 &lt; 10 ✗</text>

  <text x="138" y="232" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">w=2 想挖第 3 米需 12s &gt; 11 → 卡在 2 米</text>

  <!-- 右表：T = 12 -->
  <rect x="272" y="50" width="220" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="382" y="67" text-anchor="middle" font-size="11" fill="#3a5f30" font-weight="bold" filter="url(#rough2)">试探 T = 12 ✓</text>

  <rect x="272" y="82" width="220" height="20" fill="#ffffff" stroke="#a8c8a0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="291" y="96" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">w</text>
  <text x="339" y="96" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">q=⌊2T/w⌋</text>
  <text x="394" y="96" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">x_max</text>
  <text x="456" y="96" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">w·x(x+1)/2</text>

  <rect x="272" y="102" width="220" height="22" fill="#f4faf2" stroke="#a8c8a0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="291" y="117" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">3</text>
  <text x="339" y="117" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">8</text>
  <text x="394" y="117" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2</text>
  <text x="456" y="117" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">9 ≤ 12</text>

  <rect x="272" y="124" width="220" height="22" fill="#ffffff" stroke="#a8c8a0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="291" y="139" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2</text>
  <text x="339" y="139" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">12</text>
  <text x="394" y="139" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="456" y="139" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">12 ≤ 12</text>

  <rect x="272" y="146" width="220" height="22" fill="#f4faf2" stroke="#a8c8a0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="291" y="161" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2</text>
  <text x="339" y="161" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">12</text>
  <text x="394" y="161" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="456" y="161" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">12 ≤ 12</text>

  <rect x="272" y="168" width="220" height="22" fill="#ffffff" stroke="#a8c8a0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="291" y="183" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">4</text>
  <text x="339" y="183" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">6</text>
  <text x="394" y="183" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2</text>
  <text x="456" y="183" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">12 ≤ 12</text>

  <rect x="272" y="192" width="220" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="382" y="208" text-anchor="middle" font-size="10" fill="#3a5f30" font-weight="bold" filter="url(#rough2)">Σ = 2+3+3+2 = 10 ≥ 10 ✓</text>

  <text x="382" y="232" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">12 ≤ 12 恰好压线：第 3 米刚好来得及</text>

  <!-- 底部结论 -->
  <rect x="40" y="244" width="440" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">答案 = 12 —— 二分收敛到 11 ✗ 与 12 ✓ 的分界</text>
  <text x="260" y="279" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">对应分工 x = [2, 3, 3, 2] 米，各工人总耗时 9 / 12 / 12 / 12</text>
  <text x="260" y="296" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">同时开工 ⇒ 总时间 = max(9, 12, 12, 12) = 12</text>

  <text x="260" y="326" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">示例 1 验证：T=3 → 容量 [1,2,2]，Σ=5 ≥ 4 ✓；T=2 → [1,1,1]，Σ=3 &lt; 4 ✗ ⇒ 答案 3</text>
  <text x="260" y="346" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">示例 3 验证：单工人 w=1，H=5 ⇒ 答案 = 1·5·6/2 = 15（求和公式的 sanity check）</text>
</svg>
