<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">移动 1 个会议 = 合并 2 个相邻空隙</text>
  <text x="260" y="52" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">示例 2：eventTime = 10, k = 1</text>

  <!-- ===== 移动前时间线 ===== -->
  <text x="42" y="72" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">移动前</text>

  <!-- 空隙 g1 = [1,2] -->
  <rect x="84" y="82" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,3" rx="4" filter="url(#rough2)"/>
  <text x="106" y="103" text-anchor="middle" font-size="11" fill="#7a5c1e" filter="url(#rough2)">g₁=1</text>
  <!-- 会议 m0 = [0,1] -->
  <rect x="40" y="82" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="62" y="103" text-anchor="middle" font-size="11" fill="#2a4a6a" filter="url(#rough2)">m₀</text>
  <!-- 会议 m1 = [2,4] -->
  <rect x="128" y="82" width="88" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="172" y="103" text-anchor="middle" font-size="11" fill="#2a4a6a" filter="url(#rough2)">m₁ [2,4]</text>
  <!-- 空隙 g2 = [4,9] -->
  <rect x="216" y="82" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,3" rx="4" filter="url(#rough2)"/>
  <text x="326" y="103" text-anchor="middle" font-size="11" fill="#7a5c1e" filter="url(#rough2)">g₂ = 5</text>
  <!-- 会议 m2 = [9,10] -->
  <rect x="436" y="82" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="458" y="103" text-anchor="middle" font-size="11" fill="#2a4a6a" filter="url(#rough2)">m₂</text>

  <!-- 刻度：移动前 -->
  <path d="M 40 118 L 40 126 M 84 118 L 84 126 M 128 118 L 128 126 M 216 118 L 216 126 M 436 118 L 436 126 M 480 118 L 480 126" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="138" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="84" y="138" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="128" y="138" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="216" y="138" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <text x="436" y="138" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">9</text>
  <text x="480" y="138" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">10</text>

  <!-- 移动箭头：m1 左移 -->
  <path d="M 172 116 Q 150 170 132 214" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="196" y="168" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">m₁ 左移</text>
  <text x="196" y="186" font-size="11" fill="#b85450" filter="url(#rough2)">贴住 m₀</text>

  <!-- ===== 移动后时间线 ===== -->
  <text x="42" y="212" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">移动后</text>

  <!-- 会议 m0 = [0,1] -->
  <rect x="40" y="222" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="62" y="243" text-anchor="middle" font-size="11" fill="#2a4a6a" filter="url(#rough2)">m₀</text>
  <!-- 会议 m1 = [1,3] -->
  <rect x="84" y="222" width="88" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="128" y="243" text-anchor="middle" font-size="11" fill="#2a4a6a" filter="url(#rough2)">m₁ [1,3]</text>
  <!-- 合并后大空隙 [3,9] -->
  <rect x="172" y="222" width="264" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="304" y="236" text-anchor="middle" font-size="13" fill="#2e5a22" font-weight="bold" filter="url(#rough2)">空闲 = g₁ + g₂ = 1 + 5 = 6</text>
  <text x="304" y="251" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">[3, 9] 连成一片 ★</text>
  <!-- 会议 m2 = [9,10] -->
  <rect x="436" y="222" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="458" y="243" text-anchor="middle" font-size="11" fill="#2a4a6a" filter="url(#rough2)">m₂</text>

  <!-- 刻度：移动后 -->
  <path d="M 40 258 L 40 266 M 84 258 L 84 266 M 172 258 L 172 266 M 436 258 L 436 266 M 480 258 L 480 266" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="278" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="84" y="278" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="172" y="278" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="436" y="278" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">9</text>
  <text x="480" y="278" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">10</text>

  <!-- 底部提示框 -->
  <rect x="35" y="300" width="450" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="13" fill="#2a4a6a" filter="url(#rough2)">💡 挪走连续 k 个会议：内部 k−1 个空隙 + 左右各 1 个</text>
  <text x="260" y="336" text-anchor="middle" font-size="13" fill="#2a4a6a" filter="url(#rough2)">共 k+1 个空隙连成一片 → 定长窗口求最大和</text>
</svg>
