<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：b = 9, e = 3 逐轮模拟</text>

  <!-- Column headers -->
  <rect x="30" y="48" width="500" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="65" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">轮次</text>
  <text x="130" y="65" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">喝掉</text>
  <text x="200" y="65" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">累计喝</text>
  <text x="280" y="65" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">喝后空瓶</text>
  <text x="380" y="65" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">兑换 ÷3</text>
  <text x="480" y="65" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">剩余 %3</text>

  <!-- Row 1 -->
  <rect x="30" y="78" width="500" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)" opacity="0.6"/>
  <text x="60"  y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="130" y="100" text-anchor="middle" font-size="12" fill="#333">9</text>
  <text x="200" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <text x="280" y="100" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">9</text>
  <text x="380" y="100" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="480" y="100" text-anchor="middle" font-size="12" fill="#777">0</text>

  <!-- Row 2 -->
  <rect x="30" y="114" width="500" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="130" y="136" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="200" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">12</text>
  <text x="280" y="136" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <text x="380" y="136" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="480" y="136" text-anchor="middle" font-size="12" fill="#777">0</text>

  <!-- Row 3 -->
  <rect x="30" y="150" width="500" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)" opacity="0.6"/>
  <text x="60"  y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="130" y="172" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="200" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">13</text>
  <text x="280" y="172" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="380" y="172" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <text x="480" y="172" text-anchor="middle" font-size="12" fill="#777">1</text>

  <!-- Stop marker -->
  <text x="380" y="200" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↓ 兑换为 0，停止</text>

  <!-- Result box -->
  <rect x="120" y="216" width="320" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="241" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">结果：累计喝 13 瓶</text>

  <!-- Formula verification -->
  <rect x="60" y="270" width="440" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">公式验证</text>
  <text x="280" y="312" text-anchor="middle" font-size="12" fill="#444">额外喝 k = ⌊(b−1)/(e−1)⌋ = ⌊8/2⌋ = 4</text>
  <text x="280" y="330" text-anchor="middle" font-size="12" fill="#444">ans = b + k = 9 + 4 = <tspan font-weight="bold" fill="#b85450">13</tspan> ✓</text>
</svg>
