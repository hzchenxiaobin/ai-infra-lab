<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：删最多 ⇔ 保留最少 ＋ 缺券时挑「伸得最远」的查询</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">每条查询 = 给 [l, r] 内每位一张「至多减 1、可不减」的独立券（3355 同款）</text>

  <!-- 转化链 -->
  <rect x="24" y="50" width="150" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="99" y="69" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">删除最多条查询？</text>
  <text x="99" y="86" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">子集枚举 2^q，爆炸 ✗</text>
  <path d="M 176 73 L 196 73" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="186" y="64" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">补集</text>
  <rect x="198" y="50" width="172" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="284" y="69" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">保留最少子集 S</text>
  <text x="284" y="86" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">条件：每位 覆盖数 ≥ nums[i]</text>
  <path d="M 372 73 L 390 73" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="381" y="64" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">相减</text>
  <rect x="392" y="50" width="104" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="444" y="69" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">答案</text>
  <text x="444" y="86" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">= q − |S|</text>

  <!-- 反例标题 -->
  <text x="260" y="122" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">反例：「随便挑」≠ 最省 —— nums = [1, 1]，查询 A=[0,0]、B=[0,1]</text>

  <!-- 左面板：随便挑 -->
  <rect x="24" y="134" width="230" height="160" fill="#ffffff" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="139" y="153" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ i=0 随手选了短的 A</text>
  <rect x="72" y="198" width="108" height="18" fill="#f2f2f2" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="126" y="211" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">B=[0,1] 未选</text>
  <rect x="72" y="224" width="52" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="98" y="237" text-anchor="middle" font-size="9" fill="#a07830" font-weight="bold" filter="url(#rough2)">A 已选</text>
  <rect x="72" y="252" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="98" y="267" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="128" y="252" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="267" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="139" y="287" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">i=1 仍缺 1 → 只得再选 B</text>
  <text x="139" y="287" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">共保留 2 条 ✗</text>

  <!-- 右面板：贪心 -->
  <rect x="266" y="134" width="230" height="160" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="381" y="153" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓ i=0 选 r 最大的 B</text>
  <rect x="314" y="198" width="108" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="368" y="211" text-anchor="middle" font-size="9" fill="#a07830" font-weight="bold" filter="url(#rough2)">B=[0,1] 已选</text>
  <rect x="314" y="224" width="52" height="18" fill="#f2f2f2" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="340" y="237" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">A 未选</text>
  <rect x="314" y="252" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="267" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="370" y="252" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="396" y="267" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="381" y="287" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">i=0、i=1 一次全覆盖完</text>
  <text x="381" y="287" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">共保留 1 条 ✓</text>

  <!-- 底部交换论证 -->
  <rect x="24" y="304" width="472" height="88" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="36" y="324" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">交换论证：设最优解此处选了 A（r_A ≤ r_B，B 是当时的堆顶）</text>
  <text x="36" y="343" font-size="10.5" fill="#333" filter="url(#rough2)">把 A 换成 B：覆盖范围从 [i, r_A] 扩成 [i, r_B]，每位覆盖只增不减</text>
  <text x="36" y="362" font-size="10.5" fill="#333" filter="url(#rough2)">A 留在池中备用，后续若需要照样可取 → 「选 r 最大」不劣</text>
  <text x="36" y="381" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">逐位归纳：贪心的保留数 ≤ 任何最优解 → 得到最小子集 S*</text>
</svg>
