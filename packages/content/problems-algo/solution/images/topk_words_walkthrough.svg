<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arL" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="920" height="500" fill="#fafafa"/>
  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：words = ["i","love","leetcode","i","love","coding"], k = 2</text>
  <path d="M 300 42 Q 460 50 620 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="460" y="66" text-anchor="middle" font-size="12" fill="#666">频率：i→2，love→2，leetcode→1，coding→1　|　堆顶 = 最差（频率低 / 同频字典序大）</text>

  <!-- 四个步骤面板 -->
  <!-- Step 1: push i(2) -->
  <g filter="url(#sk)">
    <rect x="30" y="84" width="200" height="300" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="130" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">步骤 1：push i(2)</text>
  <g filter="url(#sk2)">
    <ellipse cx="130" cy="150" rx="52" ry="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="130" y="155" text-anchor="middle" font-size="13" fill="#333">i (2)</text>
  <text x="130" y="200" text-anchor="middle" font-size="11" fill="#666">堆大小 = 1</text>
  <text x="130" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">≤ k，不弹出</text>
  <g filter="url(#sk2)">
    <rect x="50" y="240" width="160" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a"/>
  </g>
  <text x="130" y="262" text-anchor="middle" font-size="11" fill="#2e6e2e">堆：{ i(2) }</text>
  <text x="130" y="280" text-anchor="middle" font-size="10" fill="#2e6e2e">堆顶 = i(2)</text>

  <!-- Step 2: push love(2) -->
  <g filter="url(#sk)">
    <rect x="250" y="84" width="200" height="300" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="350" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">步骤 2：push love(2)</text>
  <!-- 堆树：top=love(2), child=i(2) -->
  <g filter="url(#sk2)">
    <ellipse cx="350" cy="142" rx="58" ry="26" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="350" y="147" text-anchor="middle" font-size="12" fill="#333">love (2)</text>
  <path d="M 326 164 Q 300 184 280 200" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk2)">
    <ellipse cx="270" cy="216" rx="50" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="270" y="221" text-anchor="middle" font-size="12" fill="#333">i (2)</text>
  <text x="350" y="262" text-anchor="middle" font-size="11" fill="#666">堆大小 = 2</text>
  <text x="350" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">= k，不弹出</text>
  <text x="350" y="306" text-anchor="middle" font-size="10" fill="#b85450">堆顶 love：同频更大</text>
  <text x="350" y="322" text-anchor="middle" font-size="10" fill="#b85450">＝ 最差，留作门槛</text>
  <g filter="url(#sk2)">
    <rect x="270" y="338" width="160" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a"/>
  </g>
  <text x="350" y="360" text-anchor="middle" font-size="11" fill="#2e6e2e">堆：{ love(2), i(2) }</text>

  <!-- Step 3: push leetcode(1) -> pop -->
  <g filter="url(#sk)">
    <rect x="470" y="84" width="200" height="300" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="570" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">步骤 3：push leetcode(1)</text>
  <g filter="url(#sk2)">
    <ellipse cx="570" cy="142" rx="62" ry="26" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="570" y="147" text-anchor="middle" font-size="11" fill="#333">leetcode (1)</text>
  <text x="570" y="182" text-anchor="middle" font-size="11" fill="#666">堆大小 = 3 &gt; k</text>
  <text x="570" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">弹出 leetcode(1)！</text>
  <path d="M 570 208 L 570 226" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <g filter="url(#sk2)">
    <rect x="510" y="232" width="120" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-dasharray="4 3"/>
  </g>
  <text x="570" y="252" text-anchor="middle" font-size="11" fill="#b85450">leetcode 移除</text>
  <text x="570" y="288" text-anchor="middle" font-size="11" fill="#666">堆大小 = 2</text>
  <g filter="url(#sk2)">
    <rect x="490" y="300" width="160" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a"/>
  </g>
  <text x="570" y="320" text-anchor="middle" font-size="11" fill="#2e6e2e">堆：{ love(2), i(2) }</text>
  <text x="570" y="336" text-anchor="middle" font-size="10" fill="#2e6e2e">堆顶 = love(2)</text>

  <!-- Step 4: push coding(1) -> pop -->
  <g filter="url(#sk)">
    <rect x="690" y="84" width="200" height="300" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="790" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">步骤 4：push coding(1)</text>
  <g filter="url(#sk2)">
    <ellipse cx="790" cy="142" rx="58" ry="26" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="790" y="147" text-anchor="middle" font-size="12" fill="#333">coding (1)</text>
  <text x="790" y="182" text-anchor="middle" font-size="11" fill="#666">堆大小 = 3 &gt; k</text>
  <text x="790" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">弹出 coding(1)！</text>
  <path d="M 790 208 L 790 226" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <g filter="url(#sk2)">
    <rect x="730" y="232" width="120" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-dasharray="4 3"/>
  </g>
  <text x="790" y="252" text-anchor="middle" font-size="11" fill="#b85450">coding 移除</text>
  <text x="790" y="288" text-anchor="middle" font-size="11" fill="#666">堆大小 = 2</text>
  <g filter="url(#sk2)">
    <rect x="710" y="300" width="160" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a"/>
  </g>
  <text x="790" y="320" text-anchor="middle" font-size="11" fill="#2e6e2e">堆：{ love(2), i(2) }</text>
  <text x="790" y="336" text-anchor="middle" font-size="10" fill="#2e6e2e">堆顶 = love(2)</text>

  <!-- 底部结论 -->
  <g filter="url(#sk)">
    <rect x="30" y="404" width="860" height="78" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="460" y="430" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">遍历结束，堆中剩余 { i(2), love(2) }</text>
  <text x="460" y="452" text-anchor="middle" font-size="13" fill="#444">按答案顺序排序（频率↓、同频字典序↑）→ ["i", "love"]</text>
  <text x="460" y="470" text-anchor="middle" font-size="11" fill="#888">两个频率为 1 的单词均被堆顶门槛 love(2) 挡下淘汰</text>
</svg>
