<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：LEFT JOIN + IS NULL 逐步执行</text>

  <!-- Step 1: Customers -->
  <text x="100" y="56" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">步骤① Customers 表</text>
  <rect x="50" y="62" width="100" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="72" y="76" font-size="9" fill="#333">id</text>
  <text x="112" y="76" font-size="9" fill="#333">name</text>
  <line x1="90" y1="62" x2="90" y2="82" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="50" y="82" width="100" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="72" y="94" font-size="9" fill="#333">1</text>
  <text x="112" y="94" font-size="9" fill="#333">Joe</text>
  <line x1="90" y1="82" x2="90" y2="98" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="50" y="98" width="100" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="72" y="110" font-size="9" fill="#333">2</text>
  <text x="112" y="110" font-size="9" fill="#b85450" font-weight="bold">Henry</text>
  <line x1="90" y1="98" x2="90" y2="114" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="50" y="114" width="100" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="72" y="126" font-size="9" fill="#333">3</text>
  <text x="112" y="126" font-size="9" fill="#333">Sam</text>
  <line x1="90" y1="114" x2="90" y2="130" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="50" y="130" width="100" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="72" y="142" font-size="9" fill="#333">4</text>
  <text x="112" y="142" font-size="9" fill="#b85450" font-weight="bold">Max</text>
  <line x1="90" y1="130" x2="90" y2="146" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Step 2: Orders -->
  <text x="465" y="56" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">步骤② Orders 表</text>
  <rect x="410" y="62" width="110" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="435" y="76" font-size="9" fill="#333">id</text>
  <text x="490" y="76" font-size="9" fill="#333">customerId</text>
  <line x1="455" y1="62" x2="455" y2="82" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="410" y="82" width="110" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="435" y="94" font-size="9" fill="#333">1</text>
  <text x="490" y="94" font-size="9" fill="#333">3</text>
  <line x1="455" y1="82" x2="455" y2="98" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="410" y="98" width="110" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="435" y="110" font-size="9" fill="#333">2</text>
  <text x="490" y="110" font-size="9" fill="#333">1</text>
  <line x1="455" y1="98" x2="455" y2="114" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Match lines -->
  <path d="M150 90 Q280 70 410 106" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <text x="270" y="82" text-anchor="middle" font-size="8" fill="#4a7a3a">Joe→o.id=2</text>
  <path d="M150 122 Q280 130 410 90" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <text x="270" y="140" text-anchor="middle" font-size="8" fill="#4a7a3a">Sam→o.id=1</text>

  <!-- No match markers -->
  <text x="175" y="112" font-size="9" fill="#b85450" font-weight="bold">✗ 无匹配</text>
  <text x="175" y="144" font-size="9" fill="#b85450" font-weight="bold">✗ 无匹配</text>

  <!-- Arrow down -->
  <path d="M290 160 L290 180" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="345" y="174" font-size="10" fill="#446688" font-weight="bold">LEFT JOIN ON c.id=o.customerId</text>

  <!-- Step 3: JOIN result -->
  <text x="290" y="200" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">步骤③ LEFT JOIN 中间结果（4 行）</text>
  <rect x="110" y="208" width="360" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="222" font-size="9" fill="#333">c.id</text>
  <text x="195" y="222" font-size="9" fill="#333">c.name</text>
  <text x="290" y="222" font-size="9" fill="#333">o.id</text>
  <text x="380" y="222" font-size="9" fill="#333">o.customerId</text>
  <line x1="165" y1="208" x2="165" y2="228" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="250" y1="208" x2="250" y2="228" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="330" y1="208" x2="330" y2="228" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="110" y="228" width="360" height="16" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="240" font-size="9" fill="#333">1</text>
  <text x="195" y="240" font-size="9" fill="#333">Joe</text>
  <text x="290" y="240" font-size="9" fill="#333">2</text>
  <text x="380" y="240" font-size="9" fill="#333">1</text>

  <rect x="110" y="244" width="360" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="256" font-size="9" fill="#333">2</text>
  <text x="195" y="256" font-size="9" fill="#b85450" font-weight="bold">Henry</text>
  <text x="290" y="256" font-size="9" fill="#b85450" font-weight="bold">NULL</text>
  <text x="380" y="256" font-size="9" fill="#b85450" font-weight="bold">NULL</text>

  <rect x="110" y="260" width="360" height="16" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="272" font-size="9" fill="#333">3</text>
  <text x="195" y="272" font-size="9" fill="#333">Sam</text>
  <text x="290" y="272" font-size="9" fill="#333">1</text>
  <text x="380" y="272" font-size="9" fill="#333">3</text>

  <rect x="110" y="276" width="360" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="288" font-size="9" fill="#333">4</text>
  <text x="195" y="288" font-size="9" fill="#b85450" font-weight="bold">Max</text>
  <text x="290" y="288" font-size="9" fill="#b85450" font-weight="bold">NULL</text>
  <text x="380" y="288" font-size="9" fill="#b85450" font-weight="bold">NULL</text>

  <line x1="165" y1="228" x2="165" y2="292" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="250" y1="228" x2="250" y2="292" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="330" y1="228" x2="330" y2="292" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Arrow down -->
  <path d="M290 300 L290 318" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="380" y="314" font-size="10" fill="#b85450" font-weight="bold">WHERE o.id IS NULL</text>

  <!-- Step 4: Filtered -->
  <text x="290" y="336" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">步骤④ 筛出 o.id 为 NULL 的行</text>
  <rect x="150" y="344" width="280" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="358" font-size="9" fill="#333">c.id</text>
  <text x="250" y="358" font-size="9" fill="#333">c.name</text>
  <text x="360" y="358" font-size="9" fill="#333">o.id</text>
  <line x1="210" y1="344" x2="210" y2="364" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="310" y1="344" x2="310" y2="364" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="150" y="364" width="280" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="376" font-size="9" fill="#333">2</text>
  <text x="250" y="376" font-size="9" fill="#b85450" font-weight="bold">Henry</text>
  <text x="360" y="376" font-size="9" fill="#b85450" font-weight="bold">NULL</text>
  <rect x="150" y="380" width="280" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="392" font-size="9" fill="#333">4</text>
  <text x="250" y="392" font-size="9" fill="#b85450" font-weight="bold">Max</text>
  <text x="360" y="392" font-size="9" fill="#b85450" font-weight="bold">NULL</text>
  <line x1="210" y1="364" x2="210" y2="396" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="310" y1="364" x2="310" y2="396" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Arrow down -->
  <path d="M290 402 L290 416" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="365" y="414" font-size="10" fill="#4a7a3a" font-weight="bold">SELECT name AS Customers</text>

  <!-- Final -->
  <rect x="220" y="424" width="140" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="435" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">Customers: Henry, Max</text>
</svg>
