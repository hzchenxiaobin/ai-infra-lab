<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">÷4 消耗分层：第 k 层的数恰需 k 次归零</text>
  <text x="260" y="44" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">x ∈ [4^(k−1), 4^k − 1] ⟺ depth(x) = k = ⌊log₄ x⌋ + 1</text>

  <!-- ===== 楼梯：楼层越高消耗越大 ===== -->
  <rect x="36" y="280" width="76" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="74" y="298" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">k=1</text>
  <text x="74" y="314" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[1, 3]</text>

  <rect x="120" y="228" width="76" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="158" y="246" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">k=2</text>
  <text x="158" y="262" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[4, 15]</text>

  <rect x="204" y="176" width="76" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="242" y="194" text-anchor="middle" font-size="12" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">k=3</text>
  <text x="242" y="210" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[16, 63]</text>

  <rect x="288" y="124" width="76" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="326" y="142" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">k=4</text>
  <text x="326" y="158" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[64, 255]</text>

  <rect x="372" y="72" width="76" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="90" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">k=5</text>
  <text x="410" y="106" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[256, 1023]</text>

  <text x="462" y="100" font-size="16" fill="#666" filter="url(#rough2)">…</text>

  <!-- 降层箭头：从 k=3 层降到 k=2 层 -->
  <path d="M 214 222 C 200 240, 186 240, 174 230" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="194" y="258" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">floor(x/4) 降一层</text>

  <!-- ===== 右下：一次操作的语义 ===== -->
  <rect x="300" y="196" width="205" height="104" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="402" y="216" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">一次操作：选两个数</text>

  <circle cx="352" cy="244" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="352" y="249" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>
  <circle cx="452" cy="244" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="452" y="249" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">3</text>

  <path d="M 352 261 L 352 278" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 452 261 L 452 278" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="293" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="452" y="293" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">0</text>

  <text x="402" y="316" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">两数各降一层；0÷4=0 可白凑搭档</text>

  <!-- ===== 底部结论：双下界 ===== -->
  <rect x="36" y="336" width="470" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="271" y="353" text-anchor="middle" font-size="11" fill="#7a3a36" filter="url(#rough2)">T ≥ ⌈S/2⌉（槽位下界）    T ≥ D（深度下界）</text>
  <text x="271" y="370" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">单查询答案 = max(⌈S/2⌉, D)</text>
</svg>
