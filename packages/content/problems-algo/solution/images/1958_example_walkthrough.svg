<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：放置 B 于 (4,3)，命中两个好线段 → return true</text>

  <!-- Column labels -->
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="154" y="54">0</text><text x="190" y="54">1</text><text x="226" y="54">2</text>
    <text x="262" y="54">3</text><text x="298" y="54">4</text><text x="334" y="54">5</text>
    <text x="370" y="54">6</text><text x="406" y="54">7</text>
  </g>
  <!-- Row labels -->
  <g font-size="10" fill="#888" text-anchor="end">
    <text x="130" y="86">0</text><text x="130" y="122">1</text><text x="130" y="158">2</text>
    <text x="130" y="194">3</text><text x="130" y="230">4</text><text x="130" y="266">5</text>
    <text x="130" y="302">6</text><text x="130" y="338">7</text>
  </g>

  <!-- Grid background (empty cells) -->
  <rect x="136" y="64" width="288" height="288" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <g stroke="#ccc" stroke-width="1" filter="url(#rough2)">
    <path d="M 172 64 L 172 352"/><path d="M 208 64 L 208 352"/><path d="M 244 64 L 244 352"/>
    <path d="M 280 64 L 280 352"/><path d="M 316 64 L 316 352"/><path d="M 352 64 L 352 352"/>
    <path d="M 388 64 L 388 352"/>
    <path d="M 136 100 L 424 100"/><path d="M 136 136 L 424 136"/><path d="M 136 172 L 424 172"/>
    <path d="M 136 208 L 424 208"/><path d="M 136 244 L 424 244"/><path d="M 136 280 L 424 280"/>
    <path d="M 136 316 L 424 316"/>
  </g>

  <!-- B cells (dark) -->
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <rect x="244" y="64" width="36" height="36" fill="#446688" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="262" y="88" fill="#fff">B</text>
    <rect x="172" y="208" width="36" height="36" fill="#446688" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="190" y="232" fill="#fff">B</text>
    <rect x="208" y="208" width="36" height="36" fill="#446688" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="226" y="232" fill="#fff">B</text>
    <rect x="388" y="208" width="36" height="36" fill="#446688" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="406" y="232" fill="#fff">B</text>
    <rect x="244" y="244" width="36" height="36" fill="#446688" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="262" y="268" fill="#fff">B</text>
    <rect x="244" y="280" width="36" height="36" fill="#446688" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="262" y="304" fill="#fff">B</text>
  </g>

  <!-- W cells (white) -->
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <rect x="244" y="100" width="36" height="36" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="262" y="124" fill="#333">W</text>
    <rect x="244" y="136" width="36" height="36" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="262" y="160" fill="#333">W</text>
    <rect x="244" y="172" width="36" height="36" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="262" y="196" fill="#333">W</text>
    <rect x="136" y="208" width="36" height="36" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="154" y="232" fill="#333">W</text>
    <rect x="280" y="208" width="36" height="36" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="298" y="232" fill="#333">W</text>
    <rect x="316" y="208" width="36" height="36" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="334" y="232" fill="#333">W</text>
    <rect x="352" y="208" width="36" height="36" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="370" y="232" fill="#333">W</text>
    <rect x="244" y="316" width="36" height="36" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="262" y="340" fill="#333">W</text>
  </g>

  <!-- Placed cell (4,3) — orange highlight -->
  <rect x="244" y="208" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6" rx="3" filter="url(#rough2)"/>
  <text x="262" y="232" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">B</text>
  <text x="262" y="200" text-anchor="middle" font-size="9.5" fill="#d6a040">放置</text>

  <!-- Good segment ① : vertical (col 3, rows 0-4) -->
  <rect x="239" y="59" width="46" height="190" fill="none" stroke="#b85450" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="232" y="64" text-anchor="end" font-size="10.5" fill="#b85450" font-weight="bold">①</text>

  <!-- Good segment ② : horizontal (row 4, cols 3-7) -->
  <rect x="239" y="203" width="190" height="46" fill="none" stroke="#b85450" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="432" y="218" font-size="10.5" fill="#b85450" font-weight="bold">②</text>

  <!-- direction arrows for the two segments -->
  <path d="M 262 86 L 262 206" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M 282 226 L 406 226" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- Legend -->
  <path d="M 40 362 L 520 362" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#555">
    <text x="48" y="384">① 竖直（向上）：B(0,3) · W · W · W · B(4,3)　长度 5 ✓</text>
    <text x="48" y="404">② 水平（向右）：B(4,3) · W · W · W · B(4,7)　长度 5 ✓</text>
    <text x="48" y="424" fill="#888">橙色 = 放置格；红框 = 好线段；其余 6 方向首格为空/同色 → 失败</text>
  </g>
</svg>
