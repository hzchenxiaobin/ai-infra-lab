<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：n=3, m=4, k=2（cntE = cntO = 2）</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">表内数值 = dp[i][j][末位]，即前 i 位、j 个偶偶对的方案数</text>

  <!-- 表头 -->
  <rect x="70" y="56" width="86" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="113" y="75" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">i（位数）</text>
  <rect x="156" y="56" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="201" y="75" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">j = 0</text>
  <rect x="246" y="56" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="291" y="75" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">j = 1</text>
  <rect x="336" y="56" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="381" y="75" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">j = 2（目标）</text>

  <!-- i=1 -->
  <rect x="70" y="86" width="86" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="113" y="105" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">i = 1</text>
  <text x="113" y="120" text-anchor="middle" font-size="8.5" fill="#a07830" filter="url(#rough2)">首位无相邻对</text>
  <rect x="156" y="86" width="90" height="44" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="201" y="104" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">偶：2</text>
  <text x="201" y="120" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">奇：2</text>
  <rect x="246" y="86" width="90" height="44" fill="#f4f4f4" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="291" y="112" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">—</text>
  <rect x="336" y="86" width="90" height="44" fill="#f4f4f4" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="381" y="112" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">—</text>

  <path d="M 113 130 L 113 138" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- i=2 -->
  <rect x="70" y="140" width="86" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="113" y="159" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">i = 2</text>
  <text x="113" y="174" text-anchor="middle" font-size="8.5" fill="#a07830" filter="url(#rough2)">新增 1 个相邻对</text>
  <rect x="156" y="140" width="90" height="44" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="201" y="158" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">偶：4</text>
  <text x="201" y="174" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">奇：8</text>
  <rect x="246" y="140" width="90" height="44" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="291" y="158" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">偶：4</text>
  <text x="291" y="174" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">奇：0</text>
  <rect x="336" y="140" width="90" height="44" fill="#f4f4f4" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="381" y="166" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">—</text>

  <path d="M 113 184 L 113 192" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- i=3 -->
  <rect x="70" y="194" width="86" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="113" y="213" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">i = 3</text>
  <text x="113" y="228" text-anchor="middle" font-size="8.5" fill="#a07830" filter="url(#rough2)">新增 2 个相邻对</text>
  <rect x="156" y="194" width="90" height="44" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="201" y="212" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">偶：16</text>
  <text x="201" y="228" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">奇：24</text>
  <rect x="246" y="194" width="90" height="44" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="291" y="212" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">偶：8</text>
  <text x="291" y="228" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">奇：8</text>
  <rect x="336" y="194" width="90" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="381" y="212" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">偶：8 ★</text>
  <text x="381" y="228" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">奇：0</text>

  <!-- 答案框 -->
  <path d="M 381 240 Q 381 254 340 260 L 288 264" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="120" y="252" width="170" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="205" y="269" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = dp[3][2][偶] + dp[3][2][奇]</text>
  <text x="205" y="285" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 8 + 0 = 8 ✓</text>

  <!-- 侧注：数值来源 -->
  <rect x="330" y="252" width="180" height="56" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="270" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">i=2 的「偶:4」＝ 2·cntE</text>
  <text x="420" y="285" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">（奇 2 × 偶 2，奇后接偶 j 不动）</text>
  <text x="420" y="300" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">「j=1 偶:4」＝ 偶 2 × 偶 2（偶接偶）</text>

  <!-- 底部解释 -->
  <rect x="26" y="308" width="468" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="325" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">k = 2 &gt; 相邻对总数 2 的一半 → 三位全偶：{2,4}³ = 8 个数组</text>
  <text x="260" y="342" text-anchor="middle" font-size="9.5" fill="#5c8a4e" filter="url(#rough2)">即 [2,2,2]、[2,2,4]、…、[4,4,4]，与官方枚举一一对应</text>
</svg>
