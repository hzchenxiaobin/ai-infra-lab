<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 13，逐步生成回文并判质数</text>

  <text x="30" y="60" font-size="11" fill="#888" font-weight="bold">root</text>
  <text x="100" y="60" font-size="11" fill="#888" font-weight="bold">回文 p</text>
  <text x="200" y="60" font-size="11" fill="#888" font-weight="bold">p ≥ 13?</text>
  <text x="300" y="60" font-size="11" fill="#888" font-weight="bold">质数?</text>
  <text x="400" y="60" font-size="11" fill="#888" font-weight="bold">结果</text>

  <line x1="20" y1="68" x2="560" y2="68" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <rect x="20" y="76" width="540" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="30" y="94" font-size="11" fill="#333">1</text>
  <text x="100" y="94" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="200" y="94" font-size="11" fill="#888">否 (1 &lt; 13)</text>
  <text x="300" y="94" font-size="11" fill="#888">—</text>
  <text x="400" y="94" font-size="11" fill="#888">跳过</text>

  <rect x="20" y="108" width="540" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="30" y="126" font-size="11" fill="#333">2</text>
  <text x="100" y="126" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="200" y="126" font-size="11" fill="#888">否 (2 &lt; 13)</text>
  <text x="300" y="126" font-size="11" fill="#888">—</text>
  <text x="400" y="126" font-size="11" fill="#888">跳过</text>

  <rect x="20" y="140" width="540" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="30" y="158" font-size="11" fill="#333">…</text>
  <text x="100" y="158" font-size="11" fill="#888">3..9</text>
  <text x="200" y="158" font-size="11" fill="#888">否 (均 &lt; 13)</text>
  <text x="300" y="158" font-size="11" fill="#888">—</text>
  <text x="400" y="158" font-size="11" fill="#888">跳过</text>

  <rect x="20" y="172" width="540" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="30" y="190" font-size="11" fill="#d6a040" font-weight="bold">10</text>
  <text x="100" y="190" font-size="11" fill="#333" font-weight="bold">101</text>
  <text x="200" y="190" font-size="11" fill="#4a7a3a" font-weight="bold">是 (101 ≥ 13)</text>
  <text x="300" y="190" font-size="11" fill="#4a7a3a" font-weight="bold">是 ✓</text>
  <text x="400" y="190" font-size="11" fill="#4a7a3a" font-weight="bold">返回 101 ⭐</text>

  <line x1="20" y1="210" x2="560" y2="210" stroke="#ddd" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <text x="30" y="238" font-size="12" fill="#555" font-weight="bold">为什么跳过了 22, 33, …, 99？</text>

  <rect x="20" y="248" width="560" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="40" y="270" font-size="11" fill="#b85450">22 = 11×2, 33 = 11×3, 44 = 11×4, …, 99 = 11×9</text>
  <text x="380" y="270" font-size="11" fill="#b85450" font-weight="bold">全是 11 的倍数，非质数！</text>

  <text x="30" y="306" font-size="12" fill="#555" font-weight="bold">偶数位回文全部被跳过的原因</text>

  <rect x="20" y="316" width="560" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="338" font-size="11" fill="#444">偶数位回文的交错和恒为 0（对称位两两抵消），故必被 11 整除</text>
  <text x="40" y="356" font-size="11" fill="#444">除 11 本身外，所有偶数位回文都是合数 → 只需生成奇数位回文</text>
  <text x="40" y="370" font-size="10" fill="#888">唯一例外：n ∈ [8,11] 时答案为 11（2 位回文），需特判</text>

  <rect x="20" y="384" width="560" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="404" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">最终答案：101 ⭐</text>
</svg>
