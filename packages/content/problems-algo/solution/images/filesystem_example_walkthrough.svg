<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 2 逐步演算</text>
  <text x="300" y="42" text-anchor="middle" font-size="10" fill="#888">createPath("/leet",1) → createPath("/leet/code",2) → get("/leet/code") → createPath("/c/d",1) → get("/c")</text>

  <!-- step rows -->
  <!-- step 1 -->
  <g filter="url(#rough2)">
    <rect x="24" y="58" width="552" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="40" y="78" font-size="10.5" fill="#2e6e2e" font-weight="bold">① createPath("/leet", 1)</text>
  <text x="40" y="94" font-size="9.5" fill="#555">split = ["", "leet"]；父路径 [1:-1] = []（空，root 即父）→ 末级 "leet" 不存在</text>
  <text x="40" y="108" font-size="9.5" fill="#555">→ 新建 root→leet(v=1)</text>
  <text x="540" y="94" text-anchor="end" font-size="12" fill="#2e8b57" font-weight="bold">true</text>

  <!-- step 2 -->
  <g filter="url(#rough2)">
    <rect x="24" y="124" width="552" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="40" y="144" font-size="10.5" fill="#2e6e2e" font-weight="bold">② createPath("/leet/code", 2)</text>
  <text x="40" y="160" font-size="9.5" fill="#555">split = ["", "leet", "code"]；父路径 [1:-1] = ["leet"] → 走到 leet ✓ → 末级 "code" 不存在</text>
  <text x="40" y="174" font-size="9.5" fill="#555">→ 新建 leet→code(v=2)</text>
  <text x="540" y="160" text-anchor="end" font-size="12" fill="#2e8b57" font-weight="bold">true</text>

  <!-- step 3 -->
  <g filter="url(#rough2)">
    <rect x="24" y="190" width="552" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="40" y="210" font-size="10.5" fill="#2b6e9e" font-weight="bold">③ get("/leet/code")</text>
  <text x="40" y="226" font-size="9.5" fill="#555">split = ["", "leet", "code"]；走 leet ✓ → code ✓，全部命中</text>
  <text x="40" y="240" font-size="9.5" fill="#555">→ 返回 code 节点的 v</text>
  <text x="540" y="226" text-anchor="end" font-size="12" fill="#2b6e9e" font-weight="bold">2</text>

  <!-- step 4 -->
  <g filter="url(#rough2)">
    <rect x="24" y="256" width="552" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="40" y="276" font-size="10.5" fill="#b85450" font-weight="bold">④ createPath("/c/d", 1)</text>
  <text x="40" y="292" font-size="9.5" fill="#555">split = ["", "c", "d"]；父路径 [1:-1] = ["c"] → 走 "c" 失败（root 下无 "c"）</text>
  <text x="40" y="306" font-size="9.5" fill="#555">→ 父路径不存在，拒绝创建</text>
  <text x="540" y="292" text-anchor="end" font-size="12" fill="#b85450" font-weight="bold">false</text>

  <!-- step 5 -->
  <g filter="url(#rough2)">
    <rect x="24" y="322" width="552" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="40" y="342" font-size="10.5" fill="#b85450" font-weight="bold">⑤ get("/c")</text>
  <text x="40" y="358" font-size="9.5" fill="#555">split = ["", "c"]；走 "c" 失败（root 下无 "c"）</text>
  <text x="40" y="372" font-size="9.5" fill="#555">→ 路径不存在</text>
  <text x="540" y="358" text-anchor="end" font-size="12" fill="#b85450" font-weight="bold">-1</text>

  <!-- summary -->
  <g filter="url(#rough2)">
    <rect x="24" y="392" width="552" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="300" y="410" text-anchor="middle" font-size="10" fill="#7a5a20" font-weight="bold">💡 父路径不存在即拒绝：保证路径只能逐级创建，不会凭空挂载</text>
  <text x="300" y="424" text-anchor="middle" font-size="9" fill="#888">createPath 的 [1:-1] 只走父级，末级单独判定存在性与新建</text>
</svg>
