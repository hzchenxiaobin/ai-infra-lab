<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：美丽 ⟺ 每个固定对 (s[2i], s[2i+1]) 等值</text>

  <!-- 下标 -->
  <text x="150" y="56" font-size="10" fill="#999">0</text>
  <text x="184" y="56" font-size="10" fill="#999">1</text>
  <text x="218" y="56" font-size="10" fill="#999">2</text>
  <text x="252" y="56" font-size="10" fill="#999">3</text>
  <text x="286" y="56" font-size="10" fill="#999">4</text>
  <text x="320" y="56" font-size="10" fill="#999">5</text>
  <text x="354" y="56" font-size="10" fill="#999">6</text>
  <text x="388" y="56" font-size="10" fill="#999">7</text>

  <!-- 行A：合法分割① 1111|0000 -->
  <text x="70" y="84" font-size="12" fill="#446688">分割①</text>
  <rect x="150" y="64" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="167" y="86" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="184" y="64" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="201" y="86" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="218" y="64" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="86" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="252" y="64" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="269" y="86" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="286" y="64" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="303" y="86" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="320" y="64" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="337" y="86" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="354" y="64" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="371" y="86" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="388" y="64" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="405" y="86" text-anchor="middle" font-size="13" fill="#333">0</text>

  <path d="M 150 104 L 150 112 L 284 112 L 284 104" fill="none" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="217" y="126" text-anchor="middle" font-size="11" fill="#888">块长 4 · 全 1 ✓</text>
  <path d="M 288 104 L 288 112 L 422 112 L 422 104" fill="none" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="355" y="126" text-anchor="middle" font-size="11" fill="#888">块长 4 · 全 0 ✓</text>

  <!-- 右侧注释 -->
  <text x="452" y="82" font-size="11" fill="#999">偶数长的块</text>
  <text x="452" y="98" font-size="11" fill="#999">可再劈成 2</text>

  <!-- 行B：合法分割② 11|11|00|00 -->
  <text x="70" y="168" font-size="12" fill="#446688">分割②</text>
  <rect x="150" y="148" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="167" y="170" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="184" y="148" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="201" y="170" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="218" y="148" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="170" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="252" y="148" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="269" y="170" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="286" y="148" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="303" y="170" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="320" y="148" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="337" y="170" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="354" y="148" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="371" y="170" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="388" y="148" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="405" y="170" text-anchor="middle" font-size="13" fill="#333">0</text>

  <path d="M 150 188 L 150 196 L 216 196 L 216 188" fill="none" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 220 188 L 220 196 L 284 196 L 284 188" fill="none" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 288 188 L 288 196 L 352 196 L 352 188" fill="none" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 356 188 L 356 196 L 422 196 L 422 188" fill="none" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="286" y="212" text-anchor="middle" font-size="11" fill="#d6a040">细分成长度 2 的小块，边界全落在偶数下标！</text>

  <!-- 行C：固定配对 -->
  <text x="70" y="246" font-size="12" fill="#4a7a3a">固定对</text>
  <path d="M 150 232 L 150 242 L 216 242 L 216 232" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="183" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a">(0,1)</text>
  <path d="M 220 232 L 220 242 L 284 242 L 284 232" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="252" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a">(2,3)</text>
  <path d="M 288 232 L 288 242 L 352 242 L 352 232" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a">(4,5)</text>
  <path d="M 356 232 L 356 242 L 422 242 L 422 232" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="389" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a">(6,7)</text>
  <text x="452" y="244" font-size="11" fill="#999">每对必落在</text>
  <text x="452" y="260" font-size="11" fill="#999">同一块内 ⇒ 等值</text>

  <!-- 行D：代价 -->
  <text x="70" y="316" font-size="12" fill="#b85450">代价</text>
  <rect x="130" y="292" width="76" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="168" y="308" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10 / 01</text>
  <text x="168" y="325" text-anchor="middle" font-size="11" fill="#b85450">≠ ⇒ 改 1 次</text>
  <rect x="226" y="292" width="76" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="264" y="308" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">00 / 11</text>
  <text x="264" y="325" text-anchor="middle" font-size="11" fill="#4a7a3a">= ⇒ 0 次</text>
  <text x="322" y="316" font-size="12" fill="#333">答案 = 不匹配对数</text>

  <path d="M 336 336 C 300 362 240 362 214 344" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="60" y="352" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="135" y="374" text-anchor="middle" font-size="11" fill="#333">块边界只会落在偶数下标</text>
</svg>
