<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">列独立判定：每列单独检查「上→下非降」</text>

  <!-- Column headers -->
  <text x="170" y="56" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">列 0</text>
  <text x="260" y="56" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">列 1</text>
  <text x="350" y="56" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">列 2</text>

  <!-- Row labels -->
  <text x="108" y="86" text-anchor="end" font-size="10" fill="#888">行 0</text>
  <text x="108" y="122" text-anchor="end" font-size="10" fill="#888">行 1</text>
  <text x="108" y="158" text-anchor="end" font-size="10" fill="#888">行 2</text>

  <!-- ===== Column 0: c, d, g (sorted, green) ===== -->
  <rect x="140" y="68" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="92" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">c</text>
  <rect x="140" y="104" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="128" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">d</text>
  <rect x="140" y="140" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="164" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">g</text>

  <!-- col 0 compare arrows (ok) -->
  <path d="M 170 104 L 170 100" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 170 140 L 170 136" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Column 1: b, a, h (violated, red) ===== -->
  <rect x="230" y="68" width="60" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="92" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">b</text>
  <rect x="230" y="104" width="60" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="128" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">a</text>
  <rect x="230" y="140" width="60" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="164" text-anchor="middle" font-size="16" fill="#999">h</text>

  <!-- col 1 violation arrow b > a -->
  <path d="M 260 104 L 260 108" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="298" y="120" font-size="11" fill="#b85450" font-weight="bold">b &gt; a ✗</text>

  <!-- ===== Column 2: a, f, i (sorted, green) ===== -->
  <rect x="320" y="68" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="92" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">a</text>
  <rect x="320" y="104" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="128" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">f</text>
  <rect x="320" y="140" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="164" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">i</text>

  <!-- col 2 compare arrows (ok) -->
  <path d="M 350 104 L 350 100" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 350 140 L 350 136" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Verdicts ===== -->
  <text x="170" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">非降 ✓ 保留</text>
  <text x="260" y="196" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">违反 ✗ 删除</text>
  <text x="350" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">非降 ✓ 保留</text>

  <!-- independence separators (dashed between columns) -->
  <path d="M 215 64 L 215 176" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 305 64 L 305 176" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">虚线 = 列间无交互，各自独立判定</text>

  <!-- ===== Independence illustration ===== -->
  <text x="40" y="244" font-size="12" fill="#888" font-weight="bold">判定每列只需看本列字符：</text>

  <rect x="60" y="252" width="440" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="11" fill="#333">列 j 非降 ⟺ 对所有 i：strs[i][j] ≤ strs[i+1][j]</text>

  <!-- Core idea box -->
  <rect x="40" y="298" width="480" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">答案 = 不满足「列内非降」的列数</text>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#666">逐列扫描，首个 strs[i][j] &gt; strs[i+1][j] 即删该列，break 跳下一列</text>
  <text x="280" y="354" text-anchor="middle" font-size="10" fill="#888">对比 955：要求「行字典序非降」，列间通过字典序短路产生交互</text>
</svg>
