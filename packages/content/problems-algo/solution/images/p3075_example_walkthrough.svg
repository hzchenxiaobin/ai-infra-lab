<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：净贡献 = max(a[i] − i, 0) 逐项拆解</text>

  <!-- panel A title -->
  <text x="30" y="52" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">例 1：happiness = [1,2,3], k = 2 → 降序 [3,2,1]</text>

  <!-- panel A header -->
  <rect x="40" y="60" width="52" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="96" y="60" width="64" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="164" y="60" width="104" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="60" width="86" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="66" y="77" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">i</text>
  <text x="128" y="77" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">a[i]</text>
  <text x="216" y="77" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">a[i] − i</text>
  <text x="315" y="77" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">计入贡献</text>

  <!-- panel A row 0 -->
  <rect x="40" y="90" width="52" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="96" y="90" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="164" y="90" width="104" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="90" width="86" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="66" y="107" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="128" y="107" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="216" y="107" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3 − 0 = 3</text>
  <text x="315" y="107" text-anchor="middle" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- panel A row 1 -->
  <rect x="40" y="120" width="52" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="96" y="120" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="164" y="120" width="104" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="120" width="86" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="66" y="137" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="128" y="137" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="216" y="137" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2 − 1 = 1</text>
  <text x="315" y="137" text-anchor="middle" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- panel A row 2: unselected -->
  <rect x="40" y="150" width="52" height="26" fill="#f2f2f2" stroke="#aaa" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="96" y="150" width="64" height="26" fill="#f2f2f2" stroke="#aaa" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="164" y="150" width="104" height="26" fill="#f2f2f2" stroke="#aaa" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="150" width="86" height="26" fill="#f2f2f2" stroke="#aaa" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="66" y="167" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="128" y="167" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="216" y="167" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">1 − 2 = −1 → 0</text>
  <text x="315" y="167" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">未选</text>

  <!-- panel A answer -->
  <rect x="380" y="104" width="150" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="455" y="129" text-anchor="middle" font-size="12.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">ans = 3 + 1 = 4</text>

  <path d="M 40 196 L 520 196" stroke="#ddd" stroke-width="1.4" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>

  <!-- panel B title -->
  <text x="30" y="226" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">例 2：happiness = [1,1,1,1], k = 2 → 降序 [1,1,1,1]</text>

  <!-- panel B header -->
  <rect x="40" y="234" width="52" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="96" y="234" width="64" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="164" y="234" width="104" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="234" width="86" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="66" y="251" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">i</text>
  <text x="128" y="251" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">a[i]</text>
  <text x="216" y="251" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">a[i] − i</text>
  <text x="315" y="251" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">计入贡献</text>

  <!-- panel B row 0 -->
  <rect x="40" y="264" width="52" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="96" y="264" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="164" y="264" width="104" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="264" width="86" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="66" y="281" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="128" y="281" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="216" y="281" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1 − 0 = 1</text>
  <text x="315" y="281" text-anchor="middle" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- panel B row 1 -->
  <rect x="40" y="294" width="52" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="96" y="294" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="164" y="294" width="104" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="294" width="86" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="66" y="311" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="128" y="311" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="216" y="311" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1 − 1 = 0</text>
  <text x="315" y="311" text-anchor="middle" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- panel B answer -->
  <rect x="380" y="278" width="150" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="455" y="303" text-anchor="middle" font-size="12.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">ans = 1 + 0 = 1</text>

  <!-- bottom warning -->
  <rect x="40" y="338" width="480" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">⚠ 若 k = 4：后两轮 1−2 = −1、1−3 = −2 全被截成 0 —— 逐项 max(·, 0) 不可省</text>
</svg>
