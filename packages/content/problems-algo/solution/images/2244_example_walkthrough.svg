<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：tasks = [2,2,3,3,2,4,4,4,4,4]</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">按难度分组 → 每组拆 2/3 → 累加最少轮数</text>

  <!-- ===== table header ===== -->
  <rect x="40" y="62" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="82" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">难度</text>

  <rect x="124" y="62" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="82" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">频次 c</text>

  <rect x="188" y="62" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="248" y="82" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">拆分方案</text>

  <rect x="312" y="62" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="347" y="82" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">⌈c/3⌉</text>

  <rect x="386" y="62" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="426" y="82" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">轮数</text>

  <rect x="470" y="62" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="505" y="82" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">说明</text>

  <!-- ===== row 1: difficulty 2, c=3 ===== -->
  <rect x="40" y="96" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="80" y="119" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="124" y="96" width="60" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="154" y="119" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="188" y="96" width="120" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="248" y="119" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="312" y="96" width="70" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="347" y="119" text-anchor="middle" font-size="11" fill="#333">(3+2)/3=1</text>
  <rect x="386" y="96" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="426" y="119" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="470" y="96" width="70" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="505" y="119" text-anchor="middle" font-size="9.5" fill="#555">一轮做 3 个</text>

  <!-- ===== row 2: difficulty 3, c=2 ===== -->
  <rect x="40" y="136" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="80" y="159" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="124" y="136" width="60" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="154" y="159" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="188" y="136" width="120" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="248" y="159" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="312" y="136" width="70" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="347" y="159" text-anchor="middle" font-size="11" fill="#333">(2+2)/3=1</text>
  <rect x="386" y="136" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="426" y="159" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="470" y="136" width="70" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="505" y="159" text-anchor="middle" font-size="9.5" fill="#555">一轮做 2 个</text>

  <!-- ===== row 3: difficulty 4, c=5 ===== -->
  <rect x="40" y="176" width="80" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="80" y="199" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="124" y="176" width="60" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="199" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="188" y="176" width="120" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="248" y="199" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3 + 2</text>
  <rect x="312" y="176" width="70" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="347" y="199" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(5+2)/3=2</text>
  <rect x="386" y="176" width="80" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="426" y="199" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <rect x="470" y="176" width="70" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="505" y="195" text-anchor="middle" font-size="9.5" fill="#555">3 整除</text>
  <text x="505" y="207" text-anchor="middle" font-size="9.5" fill="#555">余 2 → +1</text>

  <!-- ===== total row ===== -->
  <rect x="40" y="222" width="312" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="196" y="246" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">总轮数 = 1 + 1 + 2</text>
  <rect x="386" y="222" width="80" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="426" y="248" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">4 ✓</text>
  <rect x="470" y="222" width="70" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="505" y="248" text-anchor="middle" font-size="9.5" fill="#4a7a3a">与示例一致</text>

  <!-- ===== example 2: impossible ===== -->
  <text x="40" y="284" font-size="11" fill="#b85450" font-weight="bold">示例 2：tasks = [2, 3, 3]</text>

  <rect x="40" y="294" width="500" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="316" font-size="10.5" fill="#333">freq = {2:1, 3:2}</text>
  <text x="220" y="316" font-size="10.5" fill="#b85450" font-weight="bold">难度 2 仅 1 个 → c = 1 → 无法凑成 2 或 3</text>
  <text x="290" y="330" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 −1 ✓</text>

  <!-- footer -->
  <text x="40" y="352" font-size="10.5" fill="#444" font-weight="bold">要点：c = 1 是唯一无解情况；c ≥ 2 时 ⌈c/3⌉ = (c+2)/3 一行搞定</text>
  <text x="40" y="368" font-size="10" fill="#888">余 0 → 全用 3；余 1 → 拆出一个 4=2+2；余 2 → 拆出一个 2，公式统一为向上取整</text>
</svg>
