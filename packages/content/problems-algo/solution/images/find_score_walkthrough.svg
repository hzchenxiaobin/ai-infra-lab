<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：nums = [2,1,3,4,5,2]</text>

  <!-- 原始数组 + 下标 -->
  <text x="30" y="58" font-size="12" fill="#666" filter="url(#rough2)">nums：</text>
  <g filter="url(#rough2)">
    <rect x="78" y="44" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="98" y="62" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="120" y="44" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="140" y="62" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="162" y="44" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="182" y="62" text-anchor="middle" font-size="12" fill="#333">3</text>
    <rect x="204" y="44" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="224" y="62" text-anchor="middle" font-size="12" fill="#333">4</text>
    <rect x="246" y="44" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="266" y="62" text-anchor="middle" font-size="12" fill="#333">5</text>
    <rect x="288" y="44" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="308" y="62" text-anchor="middle" font-size="12" fill="#333">2</text>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#999">
    <text x="98" y="84" text-anchor="middle">0</text>
    <text x="140" y="84" text-anchor="middle">1</text>
    <text x="182" y="84" text-anchor="middle">2</text>
    <text x="224" y="84" text-anchor="middle">3</text>
    <text x="266" y="84" text-anchor="middle">4</text>
    <text x="308" y="84" text-anchor="middle">5</text>
  </g>
  <text x="345" y="62" font-size="11" fill="#4a7a3a" filter="url(#rough2)">候选序（按值↑,下标↑）：</text>
  <text x="345" y="78" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(1,1)→(2,0)→(2,5)→(3,2)→(4,3)→(5,4)</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="16" y="92" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="34" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">步</text>
    <rect x="52" y="92" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="102" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">候选(i,值)</text>
    <rect x="152" y="92" width="72" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="188" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">已标记?</text>
    <rect x="224" y="92" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="284" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">动作</text>
    <rect x="344" y="92" width="124" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="406" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">新增标记下标</text>
    <rect x="468" y="92" width="136" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="536" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">score</text>
  </g>

  <!-- 行模板：y0=124 起，行高 32 -->
  <!-- 步1 (1,1) 选 green -->
  <g filter="url(#rough2)">
    <rect x="16" y="124" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="34" y="144" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="52" y="124" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="102" y="144" text-anchor="middle" font-size="11" fill="#333">i=1, 值1</text>
    <rect x="152" y="124" width="72" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="188" y="144" text-anchor="middle" font-size="11" fill="#4a7a3a">否</text>
    <rect x="224" y="124" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="284" y="144" text-anchor="middle" font-size="11" fill="#333">选 → score+1</text>
    <rect x="344" y="124" width="124" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="406" y="144" text-anchor="middle" font-size="11" fill="#333">{0,1,2}</text>
    <rect x="468" y="124" width="136" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="536" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">1</text>
  </g>

  <!-- 步2 (2,0) 跳过 orange -->
  <g filter="url(#rough2)">
    <rect x="16" y="156" width="36" height="32" fill="#fff8e1" stroke="#d6a040"/>
    <text x="34" y="176" text-anchor="middle" font-size="11" fill="#333">2</text>
    <rect x="52" y="156" width="100" height="32" fill="#fff8e1" stroke="#d6a040"/>
    <text x="102" y="176" text-anchor="middle" font-size="11" fill="#999">i=0, 值2</text>
    <rect x="152" y="156" width="72" height="32" fill="#fff8e1" stroke="#d6a040"/>
    <text x="188" y="176" text-anchor="middle" font-size="11" fill="#b85450">是</text>
    <rect x="224" y="156" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-dasharray="4,3"/>
    <text x="284" y="176" text-anchor="middle" font-size="11" fill="#999">跳过</text>
    <rect x="344" y="156" width="124" height="32" fill="#fff8e1" stroke="#d6a040" stroke-dasharray="4,3"/>
    <text x="406" y="176" text-anchor="middle" font-size="11" fill="#bbb">—</text>
    <rect x="468" y="156" width="136" height="32" fill="#fafafa" stroke="#bbb"/>
    <text x="536" y="176" text-anchor="middle" font-size="11" fill="#999">1</text>
  </g>

  <!-- 步3 (2,5) 选 green -->
  <g filter="url(#rough2)">
    <rect x="16" y="188" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="34" y="208" text-anchor="middle" font-size="11" fill="#333">3</text>
    <rect x="52" y="188" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="102" y="208" text-anchor="middle" font-size="11" fill="#333">i=5, 值2</text>
    <rect x="152" y="188" width="72" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="188" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a">否</text>
    <rect x="224" y="188" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="284" y="208" text-anchor="middle" font-size="11" fill="#333">选 → score+2</text>
    <rect x="344" y="188" width="124" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="406" y="208" text-anchor="middle" font-size="11" fill="#333">{4,5}</text>
    <rect x="468" y="188" width="136" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="536" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">3</text>
  </g>

  <!-- 步4 (3,2) 跳过 orange -->
  <g filter="url(#rough2)">
    <rect x="16" y="220" width="36" height="32" fill="#fff8e1" stroke="#d6a040"/>
    <text x="34" y="240" text-anchor="middle" font-size="11" fill="#333">4</text>
    <rect x="52" y="220" width="100" height="32" fill="#fff8e1" stroke="#d6a040"/>
    <text x="102" y="240" text-anchor="middle" font-size="11" fill="#999">i=2, 值3</text>
    <rect x="152" y="220" width="72" height="32" fill="#fff8e1" stroke="#d6a040"/>
    <text x="188" y="240" text-anchor="middle" font-size="11" fill="#b85450">是</text>
    <rect x="224" y="220" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-dasharray="4,3"/>
    <text x="284" y="240" text-anchor="middle" font-size="11" fill="#999">跳过</text>
    <rect x="344" y="220" width="124" height="32" fill="#fff8e1" stroke="#d6a040" stroke-dasharray="4,3"/>
    <text x="406" y="240" text-anchor="middle" font-size="11" fill="#bbb">—</text>
    <rect x="468" y="220" width="136" height="32" fill="#fafafa" stroke="#bbb"/>
    <text x="536" y="240" text-anchor="middle" font-size="11" fill="#999">3</text>
  </g>

  <!-- 步5 (4,3) 选 green -->
  <g filter="url(#rough2)">
    <rect x="16" y="252" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="34" y="272" text-anchor="middle" font-size="11" fill="#333">5</text>
    <rect x="52" y="252" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="102" y="272" text-anchor="middle" font-size="11" fill="#333">i=3, 值4</text>
    <rect x="152" y="252" width="72" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="188" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a">否</text>
    <rect x="224" y="252" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="284" y="272" text-anchor="middle" font-size="11" fill="#333">选 → score+4</text>
    <rect x="344" y="252" width="124" height="32" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="406" y="272" text-anchor="middle" font-size="11" fill="#333">{2,3,4}</text>
    <rect x="468" y="252" width="136" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <text x="536" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">7</text>
  </g>

  <!-- 步6 (5,4) 跳过 orange -->
  <g filter="url(#rough2)">
    <rect x="16" y="284" width="36" height="32" fill="#fff8e1" stroke="#d6a040"/>
    <text x="34" y="304" text-anchor="middle" font-size="11" fill="#333">6</text>
    <rect x="52" y="284" width="100" height="32" fill="#fff8e1" stroke="#d6a040"/>
    <text x="102" y="304" text-anchor="middle" font-size="11" fill="#999">i=4, 值5</text>
    <rect x="152" y="284" width="72" height="32" fill="#fff8e1" stroke="#d6a040"/>
    <text x="188" y="304" text-anchor="middle" font-size="11" fill="#b85450">是</text>
    <rect x="224" y="284" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-dasharray="4,3"/>
    <text x="284" y="304" text-anchor="middle" font-size="11" fill="#999">跳过</text>
    <rect x="344" y="284" width="124" height="32" fill="#fff8e1" stroke="#d6a040" stroke-dasharray="4,3"/>
    <text x="406" y="304" text-anchor="middle" font-size="11" fill="#bbb">—</text>
    <rect x="468" y="284" width="136" height="32" fill="#fafafa" stroke="#bbb"/>
    <text x="536" y="304" text-anchor="middle" font-size="11" fill="#999">7</text>
  </g>

  <!-- 结果 -->
  <rect x="170" y="338" width="280" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="310" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">score = 1 + 2 + 4 = 7 ✓</text>

  <text x="310" y="400" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3 次选中累加（1+2+4），3 次跳过（已被先前选择连带标记）</text>
  <text x="310" y="418" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">同值按下标序：两个 2 先 i=0 再 i=5（i=0 被首步连带标记故跳过）</text>
</svg>
