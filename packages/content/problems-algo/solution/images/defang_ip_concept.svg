<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：逐字符扫描，遇到 "." 就替换为 "[.]"，其余字符原样保留</text>

  <!-- Input string: 1 . 1 . 1 . 1 -->
  <text x="70" y="82" font-size="12" fill="#888">输入:</text>
  <rect x="100" y="58" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="146" y="58" width="28" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="82" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">.</text>
  <rect x="180" y="58" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="226" y="58" width="28" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="82" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">.</text>
  <rect x="260" y="58" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="306" y="58" width="28" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="82" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">.</text>
  <rect x="340" y="58" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- arrows from dots down to replacement -->
  <path d="M 160 96 L 160 140" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 240 96 L 240 140" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 96 L 320 140" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Replacement boxes: [.] -->
  <rect x="138" y="144" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="166" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">[.]</text>
  <rect x="218" y="144" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="166" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">[.]</text>
  <rect x="298" y="144" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="166" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">[.]</text>

  <text x="280" y="196" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">每个 "." → "[.]"（3 个字符替换 1 个字符）</text>

  <!-- Output string: 1 [.] 1 [.] 1 [.] 1 -->
  <text x="70" y="240" font-size="12" fill="#888">输出:</text>
  <rect x="100" y="216" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="240" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="146" y="216" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="171" y="240" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">[.]</text>
  <rect x="202" y="216" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="222" y="240" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="248" y="216" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="273" y="240" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">[.]</text>
  <rect x="304" y="216" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="324" y="240" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="350" y="216" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="375" y="240" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">[.]</text>
  <rect x="406" y="216" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="426" y="240" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- Note box -->
  <rect x="60" y="278" width="440" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">一次遍历即可：字符为 '.' 追加 "[.]"，否则追加原字符</text>
  <text x="280" y="322" text-anchor="middle" font-size="11" fill="#666">非 '.' 字符不做任何变换，原样拼入结果串</text>
  <text x="280" y="338" text-anchor="middle" font-size="10" fill="#888">也可直接调用语言内置 replace / 字符串替换函数</text>
</svg>
