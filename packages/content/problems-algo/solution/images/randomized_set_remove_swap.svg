<svg xmlns="http://www.w3.org/2000/svg" width="880" height="580" viewBox="0 0 880 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="880" height="580" fill="#fdfcf7"/>
  <text x="440" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">删除三步法：末尾元素填补空洞</text>
  <path d="M 280 46 Q 440 54 600 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="440" y="62" text-anchor="middle" font-size="11.5" fill="#7a5415">演示 remove(3)：vals=[1,3,5,7]，idx[3]=1</text>

  <!-- ===== Step 0: 初始 ===== -->
  <text x="70" y="104" font-size="12.5" font-weight="bold" fill="#2b6e9e">① 初始</text>
  <text x="70" y="120" font-size="10.5" fill="#888">idx={1:0, 3:1, 5:2, 7:3}</text>
  <g font-size="13">
    <g filter="url(#sk)"><rect x="70" y="128" width="50" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="95" y="150" text-anchor="middle" fill="#2b6e9e">1</text>
    <g filter="url(#sk)"><rect x="120" y="128" width="50" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
    <text x="145" y="150" text-anchor="middle" fill="#b03a3a" font-weight="bold">3</text>
    <g filter="url(#sk)"><rect x="170" y="128" width="50" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="195" y="150" text-anchor="middle" fill="#2b6e9e">5</text>
    <g filter="url(#sk)"><rect x="220" y="128" width="50" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="245" y="150" text-anchor="middle" fill="#2b6e9e">7</text>
  </g>
  <g font-size="9" fill="#aaa">
    <text x="95" y="178" text-anchor="middle">0</text>
    <text x="145" y="178" text-anchor="middle" fill="#b03a3a">1 ←删这里</text>
    <text x="195" y="178" text-anchor="middle">2</text>
    <text x="245" y="178" text-anchor="middle">3 末尾</text>
  </g>

  <!-- arrow down -->
  <path d="M 145 192 L 145 214" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="300" y="208" font-size="10.5" fill="#542">i = idx[3] = 1   末尾 last = vals[3] = 7</text>

  <!-- ===== Step 1: 搬末尾 ===== -->
  <text x="70" y="234" font-size="12.5" font-weight="bold" fill="#7a5415">② 末尾 7 覆盖到位置 1</text>
  <text x="70" y="250" font-size="10.5" fill="#888">vals[1] = 7 ;  idx[7] = 1</text>
  <g font-size="13">
    <g filter="url(#sk)"><rect x="70" y="258" width="50" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="95" y="280" text-anchor="middle" fill="#2b6e9e">1</text>
    <g filter="url(#sk)"><rect x="120" y="258" width="50" height="34" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/></g>
    <text x="145" y="280" text-anchor="middle" fill="#7a5415" font-weight="bold">7</text>
    <g filter="url(#sk)"><rect x="170" y="258" width="50" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="195" y="280" text-anchor="middle" fill="#2b6e9e">5</text>
    <g filter="url(#sk)"><rect x="220" y="258" width="50" height="34" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2" stroke-dasharray="3 2"/></g>
    <text x="245" y="280" text-anchor="middle" fill="#7a5415">7</text>
  </g>
  <!-- arrow: last moves to pos 1 -->
  <path d="M 245 264 Q 200 240 150 264" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#ar)" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="300" y="278" font-size="10.5" fill="#7a5415">末尾被复制过来填补空洞</text>
  <text x="300" y="292" font-size="9.5" fill="#888">位置 3 的 7 暂时还在（多余拷贝）</text>

  <!-- arrow down -->
  <path d="M 145 304 L 145 326" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="300" y="320" font-size="10.5" fill="#542">vals.pop_back() 弹掉末尾 ;  idx.erase(3)</text>

  <!-- ===== Step 2: 结果 ===== -->
  <text x="70" y="346" font-size="12.5" font-weight="bold" fill="#2e6e2e">③ 完成</text>
  <text x="70" y="362" font-size="10.5" fill="#888">vals=[1,7,5], idx={1:0, 7:1, 5:2}</text>
  <g font-size="13">
    <g filter="url(#sk)"><rect x="70" y="370" width="50" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="95" y="392" text-anchor="middle" fill="#2e6e2e">1</text>
    <g filter="url(#sk)"><rect x="120" y="370" width="50" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="145" y="392" text-anchor="middle" fill="#2e6e2e">7</text>
    <g filter="url(#sk)"><rect x="170" y="370" width="50" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="195" y="392" text-anchor="middle" fill="#2e6e2e">5</text>
  </g>
  <text x="240" y="392" font-size="10.5" fill="#2e6e2e">无空洞、紧凑排列 → getRandom 不受影响</text>

  <!-- ===== Right: contrast with naive ===== -->
  <g filter="url(#sk)"><rect x="540" y="100" width="300" height="186" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3"/></g>
  <text x="690" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">朴素删除：整体左移 O(n)</text>
  <g font-size="12">
    <text x="560" y="150" fill="#888">删 3 前: [1, </text>
    <text x="612" y="150" fill="#b03a3a" font-weight="bold">3</text>
    <text x="621" y="150" fill="#888">, 5, 7]</text>
    <text x="560" y="172" fill="#888">5 左移: [1, 5, </text>
    <text x="640" y="172" fill="#888">, 7]</text>
    <text x="560" y="194" fill="#888">7 左移: [1, 5, 7, </text>
    <text x="660" y="194" fill="#888">]</text>
    <text x="560" y="216" fill="#888">pop末尾: [1, 5, 7]</text>
  </g>
  <text x="690" y="246" text-anchor="middle" font-size="10.5" fill="#b03a3a">n 个元素 → 最多搬 n-1 个 → O(n)</text>
  <text x="690" y="264" text-anchor="middle" font-size="10.5" fill="#888">保序但慢</text>

  <!-- ===== summary box ===== -->
  <g filter="url(#sk)"><rect x="540" y="300" width="300" height="104" rx="10" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="690" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">交换末尾删除：O(1)</text>
  <text x="690" y="348" text-anchor="middle" font-size="11" fill="#346">不保序，但只动末尾一位</text>
  <text x="690" y="368" text-anchor="middle" font-size="11" fill="#346">2 次数组写 + 2 次哈希写</text>
  <text x="690" y="388" text-anchor="middle" font-size="10.5" fill="#2e6e2e">不要求保序 → 正中下怀</text>

  <!-- boundary note -->
  <g filter="url(#sk)"><rect x="60" y="430" width="780" height="58" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="450" y="454" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold">边界：当 val 本身就是末尾（i == n-1）</text>
  <text x="450" y="473" text-anchor="middle" font-size="10.5" fill="#542">「覆盖」是自我覆盖、「更新 idx[last]」是写原值 → 最后 erase(val) 照常工作，无需特判</text>
  <text x="450" y="490" text-anchor="middle" font-size="10" fill="#b03a3a">只要保证 idx[last]=i 在 erase(val) 之前</text>

  <text x="450" y="540" text-anchor="middle" font-size="11" fill="#888">无序数组的 O(1) 删除通用技巧：末尾填空洞 → pop_back</text>
  <text x="450" y="558" text-anchor="middle" font-size="10" fill="#aaa">搬到任何「需要 O(1) 删任意元素」的设计题</text>
</svg>
