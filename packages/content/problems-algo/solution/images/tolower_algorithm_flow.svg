<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：逐字符判定 + 原地转换</text>

  <ellipse cx="260" cy="64" rx="50" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>

  <path d="M 260 86 L 260 108" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <rect x="180" y="110" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="133" text-anchor="middle" font-size="12" fill="#333">i = 0；遍历 s</text>

  <path d="M 260 146 L 260 170" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <polygon points="260,172 360,214 260,256 160,214" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="210" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">'A' ≤ s[i] ≤ 'Z'</text>
  <text x="260" y="226" text-anchor="middle" font-size="11" fill="#444">是大写字母?</text>

  <path d="M 360 214 L 410 214" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="380" y="208" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <rect x="410" y="196" width="92" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="456" y="213" text-anchor="middle" font-size="11" fill="#666">字符不变</text>
  <text x="456" y="228" text-anchor="middle" font-size="10" fill="#999">保留原样</text>

  <path d="M 260 256 L 260 280" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="232" y="272" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="170" y="282" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">s[i] |= 32</text>
  <text x="260" y="316" text-anchor="middle" font-size="10" fill="#4a7a3a">或 s[i] += 32</text>

  <path d="M 456 236 L 456 340 L 350 340 L 350 302" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <path d="M 170 302 L 110 302 L 110 128 L 180 128" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="100" y="212" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">i++</text>
  <text x="100" y="226" text-anchor="middle" font-size="9" fill="#888">下一字符</text>

  <path d="M 110 128 L 110 110 L 180 110" stroke="#888" stroke-width="1.2" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <text x="80" y="58" font-size="9" fill="#888">遍历完返回 s</text>

  <ellipse cx="260" cy="372" rx="58" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="376" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 s</text>

  <path d="M 180 128 L 150 128 L 150 372 L 202 372" stroke="#888" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="138" y="250" font-size="10" fill="#888">i ≥ n 退出</text>
</svg>
