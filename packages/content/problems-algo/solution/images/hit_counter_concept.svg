<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：队列存时间戳，300 秒窗口滚动清理</text>
  <text x="290" y="46" text-anchor="middle" font-size="11" fill="#888">hit 只 push；getHits 从队首弹出过期时间戳，剩多少返回多少</text>

  <!-- ===== Left: hit stream ===== -->
  <text x="35" y="78" font-size="12" fill="#444" font-weight="bold">敲击流</text>
  <text x="35" y="92" font-size="10" fill="#888">hit(timestamp)</text>

  <rect x="30" y="102" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="119" text-anchor="middle" font-size="11" fill="#333">hit(1)</text>

  <rect x="30" y="132" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="149" text-anchor="middle" font-size="11" fill="#333">hit(2)</text>

  <rect x="30" y="162" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="179" text-anchor="middle" font-size="11" fill="#333">hit(3)</text>

  <text x="80" y="200" text-anchor="middle" font-size="10" fill="#888">…</text>

  <rect x="30" y="208" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="225" text-anchor="middle" font-size="11" fill="#333">hit(300)</text>

  <!-- push arrow -->
  <line x1="132" y1="140" x2="186" y2="140" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="132" font-size="10" fill="#446688" font-weight="bold">push</text>

  <!-- ===== Center: Queue ===== -->
  <text x="330" y="78" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">时间戳队列（单调递增）</text>

  <rect x="200" y="120" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="223" y="143" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <rect x="248" y="120" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="271" y="143" text-anchor="middle" font-size="12" fill="#333">2</text>

  <rect x="296" y="120" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="319" y="143" text-anchor="middle" font-size="12" fill="#333">3</text>

  <rect x="344" y="120" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="367" y="143" text-anchor="middle" font-size="12" fill="#888">…</text>

  <rect x="392" y="120" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="415" y="143" text-anchor="middle" font-size="12" fill="#333">300</text>

  <text x="223" y="172" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">队首 front</text>
  <text x="415" y="172" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">队尾 back</text>

  <!-- eviction arrow -->
  <line x1="223" y1="178" x2="223" y2="202" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="233" y="194" font-size="10" fill="#b85450" font-weight="bold">pop</text>

  <!-- eviction logic box -->
  <rect x="150" y="206" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="224" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">getHits(t):</text>
  <text x="250" y="239" text-anchor="middle" font-size="10" fill="#555">while t−front ≥ 300: pop front</text>

  <!-- ===== Right: time axis + window ===== -->
  <text x="510" y="78" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">300 秒窗口</text>

  <line x1="445" y1="160" x2="555" y2="160" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <rect x="445" y="156" width="20" height="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <line x1="445" y1="152" x2="445" y2="168" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="438" y="148" text-anchor="middle" font-size="9" fill="#888">≤t−300</text>
  <text x="438" y="180" text-anchor="middle" font-size="9" fill="#b85450">过期</text>

  <rect x="465" y="156" width="80" height="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <line x1="545" y1="152" x2="545" y2="168" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="505" y="148" text-anchor="middle" font-size="9" fill="#4a7a3a">(t−300, t]</text>
  <text x="505" y="180" text-anchor="middle" font-size="9" fill="#4a7a3a">有效窗口</text>

  <rect x="450" y="206" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="510" y="224" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">return queue.size()</text>
  <text x="510" y="239" text-anchor="middle" font-size="9" fill="#555">= 窗口内敲击数</text>

  <line x1="352" y1="226" x2="448" y2="226" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <!-- ===== Bottom: key observations ===== -->
  <rect x="20" y="266" width="540" height="162" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="34" y="288" font-size="11" fill="#4a7a3a" font-weight="bold">关键观察：</text>
  <text x="34" y="308" font-size="10" fill="#555">① 时间戳单调递增 → 队列天然有序，过期时间戳必在队首，无需遍历</text>
  <text x="34" y="326" font-size="10" fill="#555">② hit 只 push，getHits 先清理队首再返回 size —— 两种操作分工清晰</text>
  <text x="34" y="344" font-size="10" fill="#555">③ 窗口语义：(t−300, t]，即 ts − front ≥ 300 时 front 过期（左开右闭）</text>
  <text x="34" y="362" font-size="10" fill="#555">④ 均摊 O(1)：每个时间戳最多入队 1 次、出队 1 次，总操作 ≤ 2N</text>
  <text x="34" y="380" font-size="10" fill="#555">⑤ 同一秒多次 hit → 队列存多个相同时间戳，size 即为总敲击数</text>
  <text x="34" y="400" font-size="10" fill="#b85450" font-weight="bold">⚠️ 对比 359：按消息限流用 HashMap 存 lastTs；362 按时间计数用队列存全部 ts</text>
  <text x="34" y="418" font-size="10" fill="#b85450">   359 窗口 10s，362 窗口 300s；359 拒绝时不更新，362 只增不删（hit 不清理）</text>
</svg>
