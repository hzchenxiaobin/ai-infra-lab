<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 580" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="580" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：建图 → 找端点 → 沿链遍历</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">prev 定方向，免 seen 集合</text>

  <!-- step 1: build adj -->
  <rect x="130" y="58" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="80" text-anchor="middle" font-size="12" fill="#333">① 建邻接表 adj（遍历 adjacentPairs）</text>

  <path d="M 260 94 L 260 110" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- step 2: find endpoint -->
  <rect x="130" y="112" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="134" text-anchor="middle" font-size="12" fill="#333">② 找端点 start：adj[x].size() == 1</text>

  <path d="M 260 148 L 260 166" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- step 3: init -->
  <rect x="130" y="168" width="260" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="190" text-anchor="middle" font-size="12" fill="#333">③ 初始化 prev=start, curr=adj[start][0]</text>

  <path d="M 260 204 L 260 222" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- loop decision: i < n ? -->
  <polygon points="260,224 380,270 260,316 140,270" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="11" fill="#333">已收集</text>
  <text x="260" y="278" text-anchor="middle" font-size="11" fill="#333">n 个元素？</text>

  <!-- no branch: loop body -->
  <text x="395" y="268" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 380 270 L 420 270 L 420 318" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- inner: ans.append(curr) -->
  <rect x="320" y="320" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="420" y="340" text-anchor="middle" font-size="11" fill="#333">ans.append(curr)</text>

  <path d="M 420 352 L 420 368" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- inner decision: pick next != prev -->
  <polygon points="420,370 500,405 420,440 340,405" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="402" text-anchor="middle" font-size="10" fill="#333">选 next</text>
  <text x="420" y="416" text-anchor="middle" font-size="10" fill="#333">≠ prev</text>

  <!-- left: adj[curr][1] -->
  <text x="300" y="400" font-size="10" fill="#446688" font-weight="bold">[0]==prev</text>
  <text x="300" y="414" font-size="9" fill="#446688">→取[1]</text>
  <path d="M 340 405 L 270 405" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="90" y="390" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="180" y="410" text-anchor="middle" font-size="10" fill="#333">next = adj[curr][1]</text>

  <!-- right: adj[curr][0] -->
  <text x="505" y="400" font-size="10" fill="#4a7a3a" font-weight="bold">[0]≠prev</text>
  <text x="505" y="414" font-size="9" fill="#4a7a3a">→取[0]</text>
  <path d="M 500 405 L 500 440" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="410" y="442" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="500" y="462" text-anchor="middle" font-size="10" fill="#333">next = adj[curr][0]</text>

  <!-- converge: prev=curr, curr=next -->
  <path d="M 180 420 L 180 486 L 300 486" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 500 472 L 500 486 L 300 486" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="130" y="472" width="200" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="230" y="492" text-anchor="middle" font-size="10" fill="#333">prev=curr; curr=next</text>

  <!-- loop back to top decision -->
  <path d="M 230 472 L 230 230 L 140 270" stroke="#666" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="170" y="250" font-size="9" fill="#888">回循环判定</text>

  <!-- yes branch: return -->
  <text x="80" y="268" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 140 270 L 70 270 L 70 524" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="170" y="526" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="260" y="546" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ return ans</text>

  <path d="M 70 556 L 170 541" stroke="#666" stroke-width="1.2" stroke-dasharray="3 2" fill="none" filter="url(#rough2)"/>
</svg>
