<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描，j 从 k 倒序到 0</text>

  <rect x="232" y="36" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="12" filter="url(#rough2)"/>
  <text x="260" y="53" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">开始</text>

  <path d="M 260 60 L 260 70" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="72" width="280" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="90" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">初始化：dp = k+1 层哈希表，best[] = 0，ans = 0</text>

  <path d="M 260 98 L 260 104" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="106" width="220" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">取下一个元素 x</text>

  <path d="M 260 132 L 260 140" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,142 345,168 260,194 175,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="172" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">元素用尽？</text>

  <text x="350" y="162" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 345 168 L 378 168" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="382" y="150" width="122" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="14" filter="url(#rough2)"/>
  <text x="443" y="172" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <path d="M 260 194 L 260 208" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="207" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">否（处理这个 x）</text>

  <rect x="130" y="210" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">cur = max(dp[j][x] + 1, best[j−1] + 1)</text>
  <text x="260" y="244" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">（j = 0 时只看前者）</text>

  <path d="M 260 250 L 260 260" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="262" width="260" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="281" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">dp[j][x] = cur；best[j] 与 ans 取 max</text>

  <path d="M 260 292 L 260 302" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,304 334,326 260,348 186,326" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">j &gt; 0 ?</text>

  <path d="M 334 326 L 360 326 L 360 230 L 386 230" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="366" y="288" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是（j−−）</text>

  <path d="M 186 326 L 56 326 L 56 117 L 146 117" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="62" y="242" font-size="10.5" fill="#446688" filter="url(#rough2)">否（j=0，</text>
  <text x="62" y="258" font-size="10.5" fill="#446688" filter="url(#rough2)">换下一个 x）</text>
</svg>
