<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心配对：最轻 + 最重 → 能共乘则同船，否则最重独自一船</text>

  <!-- Sorted array -->
  <text x="44" y="88" font-size="12" fill="#888">排序后:</text>
  <!-- cell 0: 1 (light) -->
  <rect x="118" y="66" width="56" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="146" y="88" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">1</text>
  <!-- cell 1: 2 -->
  <rect x="184" y="66" width="56" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="212" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <!-- cell 2: 2 -->
  <rect x="250" y="66" width="56" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="278" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <!-- cell 3: 3 (heavy) -->
  <rect x="316" y="66" width="56" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="344" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <!-- light pointer (below cell 0) -->
  <path d="M 146 118 L 146 104" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">轻 left</text>

  <!-- heavy pointer (above cell 3) -->
  <path d="M 344 50 L 344 62" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="344" y="44" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">重 right</text>

  <!-- limit label -->
  <text x="430" y="88" font-size="12" fill="#888">limit = 3</text>

  <!-- ===== Case 1: pair (left panel, green) ===== -->
  <rect x="30" y="150" width="250" height="150" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="174" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">情况①：轻 + 重 ≤ limit</text>
  <text x="155" y="192" text-anchor="middle" font-size="11" fill="#555">1 + 2 ≤ 3 ✓</text>
  <!-- boat with 2 people -->
  <path d="M 95 230 L 215 230 L 200 255 L 110 255 z" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="125" cy="218" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="222" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold">1</text>
  <circle cx="185" cy="218" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="222" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="155" y="284" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">两人同船 → left++, right−−</text>

  <!-- ===== Case 2: heavy alone (right panel, red) ===== -->
  <rect x="300" y="150" width="250" height="150" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="425" y="174" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">情况②：轻 + 重 &gt; limit</text>
  <text x="425" y="192" text-anchor="middle" font-size="11" fill="#555">1 + 3 &gt; 3 ✗</text>
  <!-- boat with 1 person (heavy) -->
  <path d="M 365 230 L 485 230 L 470 255 L 380 255 z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="425" cy="218" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="425" y="222" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="425" y="284" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">重者独船 → right−−</text>

  <!-- bottom note -->
  <rect x="30" y="320" width="520" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="48" y="340" font-size="11" fill="#555">关键：最重的人必须上某条船。若连最轻的都和他超重，他只能独占一船；</text>
  <text x="48" y="358" font-size="11" fill="#555">否则让他和最轻的同船——用掉最受限资源（最重）的同时"顺手带走"最无用资源（最轻）。</text>
</svg>
