  <!-- Answer box -->
  <rect x="180" y="262" width="200" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">答案 [0, 1, 4]</text>
