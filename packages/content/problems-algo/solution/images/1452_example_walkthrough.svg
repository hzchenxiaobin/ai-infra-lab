    <text x="63" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">用户</text>

    <rect x="88" y="44" width="220" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
