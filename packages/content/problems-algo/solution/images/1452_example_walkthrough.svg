    <text x="338" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">掩码</text>

    <rect x="368" y="44" width="96" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
