<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：每轮两步更新，顺序固定不能反</text>

  <!-- main flow -->
  <rect x="90" y="38" width="250" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="215" y="58" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">排序 nums</text>

  <path d="M 215 68 L 215 84" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="90" y="88" width="250" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="215" y="108" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">for x in nums（升序逐个）</text>

  <path d="M 215 118 L 215 134" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="80" y="138" width="270" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="215" y="156" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">第一步：f[x+1] = max(f[x+1], f[x]+1)</text>
  <text x="215" y="174" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">元素 +1，读的是「旧」 f[x]</text>

  <path d="M 215 182 L 215 198" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="80" y="202" width="270" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="215" y="220" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第二步：f[x] = max(f[x], f[x−1]+1)</text>
  <text x="215" y="238" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">元素保持，f[x−1] 本轮没被动过</text>

  <path d="M 215 246 L 215 262" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="90" y="266" width="250" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="215" y="286" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans = max(ans, f[x], f[x+1])</text>

  <!-- loop back arrow -->
  <path d="M 90 281 C 54 281, 54 103, 90 103" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="40" y="196" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">下一个 x</text>

  <!-- counterexample box -->
  <rect x="360" y="138" width="150" height="118" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="435" y="158" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">顺序反了会怎样？</text>
  <text x="435" y="177" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">以单个元素 [1] 为例：</text>
  <text x="435" y="195" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">先② f[1] = 1</text>
  <text x="435" y="213" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">再① f[2] = f[1]+1 = 2 ✗</text>
  <text x="435" y="232" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">一个元素被当成 1 和 2</text>
  <text x="435" y="248" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">各用一次，答案凭空多 1</text>
  <path d="M 435 262 L 435 276" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="435" y="292" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">先读后写，互不污染</text>

  <!-- bottom tip -->
  <rect x="40" y="326" width="440" height="60" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">💡 等价安全写法：先把 f[x−1]、f[x] 读进临时变量，再写回两格 —— 与顺序无关</text>
  <text x="260" y="369" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">C++ 值域 ≤ 1e6 用数组 f[v]；Python 用 dict，转移一字不改</text>
</svg>
