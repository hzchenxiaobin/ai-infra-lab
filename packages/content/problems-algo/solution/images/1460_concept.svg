<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrDown" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：子数组翻转 ⟹ 相邻交换 ⟹ 任意排列 ⟹ 多重集相等</text>

  <!-- Step 1: 任意子数组翻转 -->
  <rect x="40" y="56" width="560" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="78" font-size="12" fill="#446688" font-weight="bold">① 任意子数组翻转</text>
  <!-- array [a,b,c,d] -->
  <rect x="80" y="92" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="97" y="112" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="114" y="92" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="131" y="112" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <rect x="148" y="92" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="165" y="112" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
  <rect x="182" y="92" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="199" y="112" text-anchor="middle" font-size="12" fill="#333">d</text>
  <!-- arrow -->
  <path d="M 240 107 L 290 107" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="265" y="100" text-anchor="middle" font-size="10" fill="#888">翻转[b,c]</text>
  <!-- result [a,c,b,d] -->
  <rect x="310" y="92" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="327" y="112" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="344" y="92" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="361" y="112" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
  <rect x="378" y="92" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="395" y="112" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <rect x="412" y="92" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="429" y="112" text-anchor="middle" font-size="12" fill="#333">d</text>
  <text x="470" y="112" font-size="11" fill="#888">子数组 [b,c] 顺序互换</text>

  <!-- down arrow to step 2 -->
  <path d="M 320 138 L 320 168" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrDown)" filter="url(#rough2)"/>

  <!-- Step 2: 长度2翻转 = 相邻交换 -->
  <rect x="40" y="174" width="560" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="196" font-size="12" fill="#4a7a3a" font-weight="bold">② 长度 2 子数组翻转 = 相邻交换</text>
  <!-- [x,y] -->
  <rect x="120" y="210" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="137" y="230" text-anchor="middle" font-size="12" fill="#333">x</text>
  <rect x="154" y="210" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="171" y="230" text-anchor="middle" font-size="12" fill="#333">y</text>
  <path d="M 210 225 L 260 225" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="235" y="218" text-anchor="middle" font-size="10" fill="#888">翻转[x,y]</text>
  <rect x="280" y="210" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="297" y="230" text-anchor="middle" font-size="12" fill="#333">y</text>
  <rect x="314" y="210" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="331" y="230" text-anchor="middle" font-size="12" fill="#333">x</text>
  <text x="370" y="230" font-size="11" fill="#888">= 交换相邻两个元素</text>

  <!-- down arrow to step 3 -->
  <path d="M 320 248 L 320 278" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrDown)" filter="url(#rough2)"/>

  <!-- Step 3: 相邻交换可生成任意排列 -->
  <rect x="40" y="284" width="560" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="306" font-size="12" fill="#d6a040" font-weight="bold">③ 相邻交换可生成任意排列（冒泡排序原理）</text>
  <text x="60" y="328" font-size="11" fill="#555">冒泡排序仅用相邻交换即可将任意排列排成升序——</text>
  <text x="60" y="346" font-size="11" fill="#555">故从 arr 出发可经有限次相邻交换（即子数组翻转）到达 target 排列。</text>

  <!-- down arrow to conclusion -->
  <path d="M 320 358 L 320 388" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrDown)" filter="url(#rough2)"/>

  <!-- Conclusion -->
  <rect x="40" y="394" width="560" height="50" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="416" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">结论：arr 能变成 target ⟺ 两者元素多重集（频次）相等</text>
  <text x="320" y="434" text-anchor="middle" font-size="11" fill="#555">顺序无所谓，只看每个值出现次数是否一致</text>
</svg>
