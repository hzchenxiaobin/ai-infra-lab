<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">DFS + 回溯流程：从 0 出发枚举所有路径</text>

  <!-- ===== B1: init ===== -->
  <rect x="60" y="46" width="280" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="66" text-anchor="middle" font-size="12" fill="#333">① path = [0]，调用 dfs(0)</text>
  <path d="M 200 76 L 200 88" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== D1: u == n-1? ===== -->
  <polygon points="200,88 296,118 200,148 104,118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="122" text-anchor="middle" font-size="12" fill="#333">u == n−1 ?</text>
  <!-- D1 Yes: right to terminal (record) -->
  <path d="M 296 118 L 340 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="316" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a">是</text>
  <rect x="340" y="102" width="220" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="450" y="122" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">ans.append(path 拷贝) ✓ 返回</text>
  <!-- D1 No: down -->
  <path d="M 200 148 L 200 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="162" font-size="11" fill="#888">否</text>

  <!-- ===== B2: iterate neighbors ===== -->
  <rect x="60" y="168" width="280" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="188" text-anchor="middle" font-size="12" fill="#333">② 遍历 u 的每个邻居 v ∈ graph[u]</text>
  <path d="M 200 198 L 200 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== B3: push v ===== -->
  <rect x="60" y="212" width="280" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="232" text-anchor="middle" font-size="12" fill="#333">③ path.push_back(v)（选择）</text>
  <path d="M 200 242 L 200 256" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== B4: recurse ===== -->
  <rect x="60" y="256" width="280" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="276" text-anchor="middle" font-size="12" fill="#333">④ dfs(v)（递归深入）</text>
  <path d="M 200 286 L 200 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== B5: pop v (backtrack) ===== -->
  <rect x="60" y="300" width="280" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="320" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">⑤ path.pop_back()（撤销·回溯）</text>
  <!-- loop back to B2 (next neighbor) -->
  <path d="M 340 315 L 392 315 L 392 183 L 342 183" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="250" text-anchor="middle" font-size="10" fill="#888">继续下一 v</text>

  <!-- ===== D2: neighbors done? ===== -->
  <path d="M 200 330 L 200 346" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="200,346 290,372 200,398 110,372" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="376" text-anchor="middle" font-size="12" fill="#333">邻居遍历完?</text>
  <path d="M 290 372 L 340 372" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="364" text-anchor="middle" font-size="11" fill="#888">是</text>
  <rect x="340" y="356" width="220" height="32" rx="8" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="376" text-anchor="middle" font-size="11.5" fill="#666">返回上层（回溯到父节点）</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="420" width="520" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="441" text-anchor="middle" font-size="11" fill="#444">DAG 无环 → 无需 visited 数组；「push v → dfs(v) → pop v」是回溯三步走，</text>
  <text x="300" y="455" text-anchor="middle" font-size="11" fill="#444">撤销让兄弟分支能复用 path，每条到达 n−1 的路径被完整拷贝入 ans</text>
</svg>
