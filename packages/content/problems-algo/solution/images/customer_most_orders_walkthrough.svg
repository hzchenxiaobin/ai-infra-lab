<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：4 行按 customer_number 分 3 桶，客户 3 计数 2 最多</text>

  <!-- Orders table (left) -->
  <text x="125" y="52" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">Orders</text>
  <rect x="30" y="58" width="190" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="74" font-size="9" fill="#333">order_number</text>
  <text x="150" y="74" font-size="9" fill="#b85450">customer_number</text>
  <line x1="95" y1="58" x2="95" y2="82" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="82" width="190" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="97" font-size="9.5" fill="#d6a040" font-weight="bold">1</text>
  <text x="150" y="97" font-size="9.5" fill="#d6a040" font-weight="bold">1</text>
  <line x1="95" y1="82" x2="95" y2="104" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="104" width="190" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="119" font-size="9.5" fill="#446688" font-weight="bold">2</text>
  <text x="150" y="119" font-size="9.5" fill="#446688" font-weight="bold">2</text>
  <line x1="95" y1="104" x2="95" y2="126" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="126" width="190" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="141" font-size="9.5" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="150" y="141" font-size="9.5" fill="#b85450" font-weight="bold">3</text>
  <line x1="95" y1="126" x2="95" y2="148" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="148" width="190" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="163" font-size="9.5" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="150" y="163" font-size="9.5" fill="#b85450" font-weight="bold">3</text>
  <line x1="95" y1="148" x2="95" y2="170" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Arrows: rows to buckets -->
  <path d="M222 93 L298 93" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="260" y="86" text-anchor="middle" font-size="8.5" fill="#d6a040">桶1</text>
  <path d="M222 115 L298 115" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="260" y="108" text-anchor="middle" font-size="8.5" fill="#446688">桶2</text>
  <path d="M222 137 L298 137" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M222 159 L298 159" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="260" y="152" text-anchor="middle" font-size="8.5" fill="#4a7a3a">桶3</text>

  <!-- Bucket table (right) -->
  <text x="430" y="52" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">分桶 + COUNT(*) + ORDER BY DESC</text>
  <rect x="300" y="58" width="240" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="74" font-size="9" fill="#333">customer_number</text>
  <text x="400" y="74" font-size="9" fill="#333">桶内 order</text>
  <text x="510" y="74" font-size="9" fill="#d6a040">COUNT</text>
  <line x1="370" y1="58" x2="370" y2="82" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="475" y1="58" x2="475" y2="82" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="300" y="124" width="240" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="320" y="142" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <text x="400" y="142" font-size="9" fill="#b85450" font-weight="bold">3, 4</text>
  <text x="515" y="142" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <line x1="370" y1="124" x2="370" y2="152" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="475" y1="124" x2="475" y2="152" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="300" y="86" width="240" height="19" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="320" y="99" font-size="9.5" fill="#d6a040" font-weight="bold">1</text>
  <text x="400" y="99" font-size="9" fill="#d6a040" font-weight="bold">1</text>
  <text x="515" y="99" font-size="9.5" fill="#d6a040" font-weight="bold">1</text>
  <line x1="370" y1="86" x2="370" y2="105" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="475" y1="86" x2="475" y2="105" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="300" y="105" width="240" height="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="320" y="118" font-size="9.5" fill="#446688" font-weight="bold">2</text>
  <text x="400" y="118" font-size="9" fill="#446688" font-weight="bold">2</text>
  <text x="515" y="118" font-size="9.5" fill="#446688" font-weight="bold">1</text>
  <line x1="370" y1="105" x2="370" y2="124" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="475" y1="105" x2="475" y2="124" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Annotation -->
  <text x="430" y="170" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">客户 3：COUNT=2 &gt; 其余 1 → 最多</text>

  <!-- Down arrow to result -->
  <path d="M420 178 L420 206" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="442" y="198" font-size="9" fill="#b85450">LIMIT 1</text>

  <!-- Result box -->
  <rect x="150" y="230" width="260" height="60" fill="#fff8e1" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">最终结果</text>
  <rect x="225" y="258" width="110" height="24" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="275" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">customer_number</text>
  <text x="280" y="298" text-anchor="middle" font-size="9" fill="#888">= 3（2 单 &gt; 客户 1 的 1 单 &gt; 客户 2 的 1 单）</text>

  <!-- SQL recap -->
  <rect x="40" y="310" width="480" height="138" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="332" font-size="11" fill="#446688" font-weight="bold">一行 SQL 回顾</text>
  <rect x="60" y="340" width="440" height="96" fill="#fff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="76" y="360" font-size="11" fill="#333" font-family="'Comic Sans MS', monospace">SELECT customer_number</text>
  <text x="76" y="378" font-size="11" fill="#333" font-family="'Comic Sans MS', monospace">FROM Orders</text>
  <text x="76" y="396" font-size="11" fill="#4a7a3a" font-weight="bold" font-family="'Comic Sans MS', monospace">GROUP BY customer_number</text>
  <text x="76" y="414" font-size="11" fill="#d6a040" font-weight="bold" font-family="'Comic Sans MS', monospace">ORDER BY COUNT(*) DESC</text>
  <text x="76" y="432" font-size="11" fill="#b85450" font-weight="bold" font-family="'Comic Sans MS', monospace">LIMIT 1;</text>
</svg>
