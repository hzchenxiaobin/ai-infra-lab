<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：时刻挂上「距 00:00:00 的秒数」数轴，作差即答案</text>

  <!-- 混合进制展开：12:34:56 -->
  <text x="70" y="76" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">12:34:56</text>
  <path d="M 70 84 L 70 100" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="40" y="106" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="70" y="122" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">H = 12</text>
  <text x="70" y="135" text-anchor="middle" font-size="9" fill="#8a9ab0" filter="url(#rough2)">× 3600</text>

  <text x="116" y="128" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">＋</text>

  <rect x="132" y="106" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="162" y="122" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">M = 34</text>
  <text x="162" y="135" text-anchor="middle" font-size="9" fill="#7fa475" filter="url(#rough2)">× 60</text>

  <text x="208" y="128" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">＋</text>

  <rect x="224" y="106" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="254" y="122" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">S = 56</text>
  <text x="254" y="135" text-anchor="middle" font-size="9" fill="#c0a050" filter="url(#rough2)">× 1</text>

  <text x="300" y="128" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">＝</text>

  <rect x="316" y="106" width="110" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="371" y="128" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">45296 秒</text>

  <text x="470" y="120" font-size="10" fill="#888" filter="url(#rough2)">混合进制 24/60/60</text>
  <text x="470" y="135" font-size="10" fill="#888" filter="url(#rough2)">位权 3600/60/1</text>

  <!-- 数轴 -->
  <text x="280" y="178" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">「绝对秒数」数轴（示意，未按比例）</text>

  <path d="M 60 268 L 510 268" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 左端锚点 -->
  <circle cx="60" cy="268" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="60" y="292" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">00:00:00</text>
  <text x="60" y="306" text-anchor="middle" font-size="9.5" fill="#8a9ab0" filter="url(#rough2)">= 0 秒（锚点）</text>

  <!-- start 点 -->
  <path d="M 220 268 L 220 242" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <circle cx="220" cy="268" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="220" y="230" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">start 12:34:56</text>
  <text x="220" y="216" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">t₁ = 45296</text>

  <!-- end 点 -->
  <path d="M 400 268 L 400 242" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <circle cx="400" cy="268" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="400" y="230" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">end 13:00:00</text>
  <text x="400" y="216" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">t₂ = 46800</text>

  <!-- 差值标注 -->
  <path d="M 226 268 L 394 268" stroke="#b85450" stroke-width="2.4" fill="none" marker-start="url(#arrR)" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 310 264 L 310 286" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="246" y="286" width="128" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="306" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">t₂ − t₁ = 1504 ✓</text>

  <!-- 右端 -->
  <circle cx="506" cy="268" r="4" fill="#8a9ab0" filter="url(#rough2)"/>
  <text x="500" y="292" text-anchor="end" font-size="10.5" fill="#8a9ab0" font-weight="bold" filter="url(#rough2)">23:59:59</text>
  <text x="500" y="306" text-anchor="end" font-size="9.5" fill="#8a9ab0" filter="url(#rough2)">= 86399 秒</text>

  <!-- 底部注释 -->
  <rect x="70" y="336" width="420" height="62" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">时钟是 24/60/60 的混合进制，位权从高到低 3600 / 60 / 1；</text>
  <text x="280" y="376" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">把每个时刻按位权展开成「绝对秒数」，两个坐标一减，</text>
  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">进位、借位全部消失——作差即答案。</text>
</svg>
