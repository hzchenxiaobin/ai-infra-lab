<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="560" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：1→2→3→3→4→4→5 逐步全删重复</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">蓝=prev，红=curr，灰=已移除，绿=最终保留</text>

  <!-- ===== 初始 ===== -->
  <text x="20" y="72" font-size="11" fill="#444" font-weight="bold">初始：dummy→1→2→3→3→4→4→5</text>
  <g font-size="12">
    <rect x="20" y="80" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="42" y="99" text-anchor="middle" fill="#8a6a20" font-size="9" font-weight="bold">dummy</text>
    <rect x="72" y="80" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="92" y="99" text-anchor="middle" fill="#888">1</text>
    <rect x="120" y="80" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="140" y="99" text-anchor="middle" fill="#888">2</text>
    <rect x="168" y="80" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="188" y="99" text-anchor="middle" fill="#888">3</text>
    <rect x="216" y="80" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="236" y="99" text-anchor="middle" fill="#888">3</text>
    <rect x="264" y="80" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="284" y="99" text-anchor="middle" fill="#888">4</text>
    <rect x="312" y="80" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="332" y="99" text-anchor="middle" fill="#888">4</text>
    <rect x="360" y="80" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="380" y="99" text-anchor="middle" fill="#888">5</text>
  </g>
  <text x="42" y="68" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">prev</text>
  <text x="92" y="68" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">curr</text>

  <!-- ===== 步骤1: 1≠2 保留 ===== -->
  <text x="20" y="130" font-size="11" fill="#444" font-weight="bold">步骤1：1≠2 保留 → prev→1, curr→2</text>
  <g font-size="12">
    <rect x="20" y="138" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="42" y="157" text-anchor="middle" fill="#8a6a20" font-size="9" font-weight="bold">dummy</text>
    <rect x="72" y="138" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="92" y="157" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <rect x="120" y="138" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="140" y="157" text-anchor="middle" fill="#888">2</text>
    <rect x="168" y="138" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="188" y="157" text-anchor="middle" fill="#888">3</text>
    <rect x="216" y="138" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="236" y="157" text-anchor="middle" fill="#888">3</text>
    <rect x="264" y="138" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="284" y="157" text-anchor="middle" fill="#888">4</text>
    <rect x="312" y="138" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="332" y="157" text-anchor="middle" fill="#888">4</text>
    <rect x="360" y="138" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="380" y="157" text-anchor="middle" fill="#888">5</text>
  </g>
  <text x="92" y="126" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">prev</text>
  <text x="140" y="126" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">curr</text>

  <!-- ===== 步骤2: 2≠3 保留 ===== -->
  <text x="20" y="188" font-size="11" fill="#444" font-weight="bold">步骤2：2≠3 保留 → prev→2, curr→3</text>
  <g font-size="12">
    <rect x="20" y="196" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="42" y="215" text-anchor="middle" fill="#8a6a20" font-size="9" font-weight="bold">dummy</text>
    <rect x="72" y="196" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="92" y="215" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <rect x="120" y="196" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="140" y="215" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <rect x="168" y="196" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="188" y="215" text-anchor="middle" fill="#888">3</text>
    <rect x="216" y="196" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="236" y="215" text-anchor="middle" fill="#888">3</text>
    <rect x="264" y="196" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="284" y="215" text-anchor="middle" fill="#888">4</text>
    <rect x="312" y="196" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="332" y="215" text-anchor="middle" fill="#888">4</text>
    <rect x="360" y="196" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="380" y="215" text-anchor="middle" fill="#888">5</text>
  </g>
  <text x="140" y="184" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">prev</text>
  <text x="188" y="184" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">curr</text>

  <!-- ===== 步骤3: 3==3 重复！跳过整组 ===== -->
  <text x="20" y="246" font-size="11" fill="#b85450" font-weight="bold">步骤3：3==3 重复！跳过所有 3 → curr 到 4，prev.next=4</text>
  <g font-size="12">
    <rect x="20" y="254" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="42" y="273" text-anchor="middle" fill="#8a6a20" font-size="9" font-weight="bold">dummy</text>
    <rect x="72" y="254" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="92" y="273" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <rect x="120" y="254" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="140" y="273" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <rect x="168" y="254" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="188" y="273" text-anchor="middle" fill="#bbb" font-weight="bold" text-decoration="line-through">3</text>
    <rect x="216" y="254" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="236" y="273" text-anchor="middle" fill="#bbb" font-weight="bold" text-decoration="line-through">3</text>
    <rect x="264" y="254" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="284" y="273" text-anchor="middle" fill="#888">4</text>
    <rect x="312" y="254" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="332" y="273" text-anchor="middle" fill="#888">4</text>
    <rect x="360" y="254" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="380" y="273" text-anchor="middle" fill="#888">5</text>
  </g>
  <text x="140" y="242" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">prev</text>
  <text x="284" y="242" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">curr</text>
  <path d="M 160 268 Q 224 234 264 268" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="430" y="273" font-size="9" fill="#b85450">3→3 全删</text>

  <!-- ===== 步骤4: 4==4 重复！跳过整组 ===== -->
  <text x="20" y="304" font-size="11" fill="#b85450" font-weight="bold">步骤4：4==4 重复！跳过所有 4 → curr 到 5，prev.next=5</text>
  <g font-size="12">
    <rect x="20" y="312" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="42" y="331" text-anchor="middle" fill="#8a6a20" font-size="9" font-weight="bold">dummy</text>
    <rect x="72" y="312" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="92" y="331" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <rect x="120" y="312" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="140" y="331" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <rect x="168" y="312" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="188" y="331" text-anchor="middle" fill="#ddd" font-weight="bold" text-decoration="line-through">3</text>
    <rect x="216" y="312" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="236" y="331" text-anchor="middle" fill="#ddd" font-weight="bold" text-decoration="line-through">3</text>
    <rect x="264" y="312" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="284" y="331" text-anchor="middle" fill="#bbb" font-weight="bold" text-decoration="line-through">4</text>
    <rect x="312" y="312" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="332" y="331" text-anchor="middle" fill="#bbb" font-weight="bold" text-decoration="line-through">4</text>
    <rect x="360" y="312" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="380" y="331" text-anchor="middle" fill="#888">5</text>
  </g>
  <text x="140" y="300" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">prev</text>
  <text x="380" y="300" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">curr</text>
  <path d="M 160 326 Q 272 292 360 326" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="430" y="331" font-size="9" fill="#b85450">4→4 全删</text>

  <!-- ===== 步骤5: 5.next=null 保留 ===== -->
  <text x="20" y="362" font-size="11" fill="#444" font-weight="bold">步骤5：5.next=null 无重复 → prev→5, curr→null 退出</text>
  <g font-size="12">
    <rect x="20" y="370" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="42" y="389" text-anchor="middle" fill="#8a6a20" font-size="9" font-weight="bold">dummy</text>
    <rect x="72" y="370" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="92" y="389" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <rect x="120" y="370" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="140" y="389" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <rect x="168" y="370" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="188" y="389" text-anchor="middle" fill="#ddd" font-weight="bold" text-decoration="line-through">3</text>
    <rect x="216" y="370" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="236" y="389" text-anchor="middle" fill="#ddd" font-weight="bold" text-decoration="line-through">3</text>
    <rect x="264" y="370" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="284" y="389" text-anchor="middle" fill="#ddd" font-weight="bold" text-decoration="line-through">4</text>
    <rect x="312" y="370" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="332" y="389" text-anchor="middle" fill="#ddd" font-weight="bold" text-decoration="line-through">4</text>
    <rect x="360" y="370" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="380" y="389" text-anchor="middle" fill="#333" font-weight="bold">5</text>
  </g>
  <text x="380" y="358" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">prev</text>
  <text x="420" y="389" font-size="9" fill="#888">curr→null</text>

  <!-- ===== 最终结果 ===== -->
  <rect x="20" y="420" width="540" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="34" y="442" font-size="12" fill="#4a7a3a" font-weight="bold">最终结果：dummy.next → 1→2→5 ✓</text>
  <g font-size="13">
    <rect x="34" y="454" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="56" y="473" text-anchor="middle" fill="#8a6a20" font-size="9" font-weight="bold">dummy</text>
    <rect x="86" y="454" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="106" y="473" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="78" y1="468" x2="86" y2="468" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="134" y="454" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="154" y="473" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <line x1="126" y1="468" x2="134" y2="468" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="182" y="454" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="202" y="473" text-anchor="middle" fill="#333" font-weight="bold">5</text>
    <line x1="174" y1="468" x2="182" y2="468" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="240" y="473" font-size="11" fill="#888">→∅</text>
  </g>
  <text x="34" y="502" font-size="10" fill="#555">所有重复值（3、4）的节点被整组移除，只保留出现一次的值（1、2、5）</text>
  <text x="34" y="520" font-size="10" fill="#888">对比 83 题 [1,1,2,3,3]→[1,2,3]（留一），本题 [1,2,3,3,4,4,5]→[1,2,5]（全删）</text>
</svg>
