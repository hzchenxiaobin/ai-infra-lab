<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：前序 5,2,1,7,6,8 的值域重建过程</text>

  <!-- 序列 + 指针 -->
  <rect x="40" y="38" width="520" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="60" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">序列：[ 5 , 2 , 1 , 7 , 6 , 8 ]    全局指针 ptr 从 0 开始</text>

  <!-- 表头 -->
  <rect x="40" y="86" width="520" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="104" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">步骤</text>
  <text x="170" y="104" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">build(min, max)</text>
  <text x="290" y="104" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">peek</text>
  <text x="360" y="104" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">∈区间?</text>
  <text x="490" y="104" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">动作</text>

  <!-- 行 1: 消费 5 -->
  <rect x="40" y="114" width="520" height="22" fill="#e6f4ea" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="70" y="130" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="170" y="130" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">(−∞, +∞)</text>
  <text x="290" y="130" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="360" y="130" text-anchor="middle" font-size="10" fill="#4a7a3a">✓</text>
  <text x="490" y="130" text-anchor="middle" font-size="10" fill="#333">消费 → 根节点 5</text>

  <!-- 行 2: 消费 2 -->
  <rect x="40" y="138" width="520" height="22" fill="#e6f4ea" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="70" y="154" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="170" y="154" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">(−∞, 5)</text>
  <text x="290" y="154" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="360" y="154" text-anchor="middle" font-size="10" fill="#4a7a3a">✓</text>
  <text x="490" y="154" text-anchor="middle" font-size="10" fill="#333">消费 → 5 的左子</text>

  <!-- 行 3: 消费 1 -->
  <rect x="40" y="162" width="520" height="22" fill="#e6f4ea" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="70" y="178" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="170" y="178" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">(−∞, 2)</text>
  <text x="290" y="178" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="360" y="178" text-anchor="middle" font-size="10" fill="#4a7a3a">✓</text>
  <text x="490" y="178" text-anchor="middle" font-size="10" fill="#333">消费 → 2 的左子</text>

  <!-- 行 4-6: 连续拒绝 (合并显示) -->
  <rect x="40" y="186" width="520" height="22" fill="#fce4ec" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="70" y="202" text-anchor="middle" font-size="10" fill="#333">4-6</text>
  <text x="170" y="202" text-anchor="middle" font-size="9" fill="#b85450" font-family="monospace">(−∞,1)(1,2)(2,5)</text>
  <text x="290" y="202" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">7</text>
  <text x="360" y="202" text-anchor="middle" font-size="10" fill="#b85450">✗</text>
  <text x="490" y="202" text-anchor="middle" font-size="10" fill="#b85450">7 不在这些区间 → 返回 null</text>

  <!-- 行 7: 消费 7 -->
  <rect x="40" y="210" width="520" height="22" fill="#e6f4ea" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="70" y="226" text-anchor="middle" font-size="10" fill="#333">7</text>
  <text x="170" y="226" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">(5, +∞)</text>
  <text x="290" y="226" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="360" y="226" text-anchor="middle" font-size="10" fill="#4a7a3a">✓</text>
  <text x="490" y="226" text-anchor="middle" font-size="10" fill="#333">消费 → 5 的右子</text>

  <!-- 行 8: 消费 6 -->
  <rect x="40" y="234" width="520" height="22" fill="#e6f4ea" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="70" y="250" text-anchor="middle" font-size="10" fill="#333">8</text>
  <text x="170" y="250" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">(5, 7)</text>
  <text x="290" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="360" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a">✓</text>
  <text x="490" y="250" text-anchor="middle" font-size="10" fill="#333">消费 → 7 的左子</text>

  <!-- 行 9-10: 拒绝 -->
  <rect x="40" y="258" width="520" height="22" fill="#fce4ec" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="70" y="274" text-anchor="middle" font-size="10" fill="#333">9-10</text>
  <text x="170" y="274" text-anchor="middle" font-size="9" fill="#b85450" font-family="monospace">(5,6)(6,7)</text>
  <text x="290" y="274" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">8</text>
  <text x="360" y="274" text-anchor="middle" font-size="10" fill="#b85450">✗</text>
  <text x="490" y="274" text-anchor="middle" font-size="10" fill="#b85450">8 不在 → 返回 null</text>

  <!-- 行 11: 消费 8 -->
  <rect x="40" y="282" width="520" height="22" fill="#e6f4ea" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="70" y="298" text-anchor="middle" font-size="10" fill="#333">11</text>
  <text x="170" y="298" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">(7, +∞)</text>
  <text x="290" y="298" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">8</text>
  <text x="360" y="298" text-anchor="middle" font-size="10" fill="#4a7a3a">✓</text>
  <text x="490" y="298" text-anchor="middle" font-size="10" fill="#333">消费 → 7 的右子</text>

  <!-- 底部：重建结果树 -->
  <text x="300" y="332" text-anchor="middle" font-size="12" fill="#888">重建结果（与原 BST 完全相同）</text>
  <g filter="url(#rough2)">
    <circle cx="300" cy="362" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="300" y="368" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">5</text>
    <circle cx="240" cy="412" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="240" y="418" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
    <line x1="284" y1="376" x2="252" y2="398" stroke="#4a7a3a" stroke-width="1.3"/>
    <circle cx="360" cy="412" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="360" y="418" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">7</text>
    <line x1="316" y1="376" x2="348" y2="398" stroke="#4a7a3a" stroke-width="1.3"/>
    <circle cx="210" cy="448" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="210" y="453" text-anchor="middle" font-size="10" fill="#4a7a3a">1</text>
    <line x1="230" y1="424" x2="218" y2="436" stroke="#4a7a3a" stroke-width="1.1"/>
    <circle cx="335" cy="448" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="335" y="453" text-anchor="middle" font-size="10" fill="#4a7a3a">6</text>
    <line x1="350" y1="424" x2="338" y2="436" stroke="#4a7a3a" stroke-width="1.1"/>
    <circle cx="385" cy="448" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="385" y="453" text-anchor="middle" font-size="10" fill="#4a7a3a">8</text>
    <line x1="370" y1="424" x2="382" y2="436" stroke="#4a7a3a" stroke-width="1.1"/>
  </g>

  <!-- 右侧说明 -->
  <rect x="448" y="326" width="140" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="518" y="344" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">关键：peek 不消费</text>
  <text x="518" y="358" text-anchor="middle" font-size="9" fill="#555">值不在区间内时</text>
  <text x="518" y="370" text-anchor="middle" font-size="9" fill="#555">ptr 不前进，留给</text>
  <text x="518" y="382" text-anchor="middle" font-size="9" fill="#555">上层右子树消费</text>
</svg>
