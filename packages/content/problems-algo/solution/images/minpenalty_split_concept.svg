<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">代价分解：关门时刻 j 把时间切成开门段与关门段</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">customers = "YYNY"，取 j = 2：开门 [0,2) 蓝色，关门 [2,4) 橙色</text>

  <!-- region labels -->
  <text x="160" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开门 [0, j)</text>
  <text x="360" y="78" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">关门 [j, n)</text>

  <!-- open region background -->
  <rect x="80" y="90" width="160" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <!-- closed region background -->
  <rect x="240" y="90" width="160" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>

  <!-- cells: hours 0..3, 80 wide pitch, 72 wide -->
  <g font-size="22">
    <rect x="84" y="94" width="72" height="72" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="120" y="140" text-anchor="middle" fill="#333" font-weight="bold">Y</text>
    <text x="120" y="160" text-anchor="middle" font-size="9" fill="#888">0 时</text>

    <rect x="164" y="94" width="72" height="72" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="200" y="140" text-anchor="middle" fill="#333" font-weight="bold">Y</text>
    <text x="200" y="160" text-anchor="middle" font-size="9" fill="#888">1 时</text>

    <rect x="244" y="94" width="72" height="72" fill="#fafafa" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="280" y="140" text-anchor="middle" fill="#333" font-weight="bold">N</text>
    <text x="280" y="160" text-anchor="middle" font-size="9" fill="#888">2 时</text>

    <rect x="324" y="94" width="72" height="72" fill="#fafafa" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="360" y="140" text-anchor="middle" fill="#333" font-weight="bold">Y</text>
    <text x="360" y="160" text-anchor="middle" font-size="9" fill="#888">3 时</text>
  </g>

  <!-- split line at j=2 (x=240) -->
  <path d="M 240 84 L 240 250" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3" fill="none" filter="url(#rough2)"/>
  <text x="240" y="80" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">j = 2 关门</text>

  <!-- contribution row -->
  <text x="74" y="196" text-anchor="end" font-size="10" fill="#666">每小时代价</text>
  <text x="120" y="196" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="200" y="196" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="280" y="196" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="360" y="196" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">+1</text>

  <text x="120" y="212" text-anchor="middle" font-size="8.5" fill="#888">Y 开门 = 0</text>
  <text x="200" y="212" text-anchor="middle" font-size="8.5" fill="#888">Y 开门 = 0</text>
  <text x="280" y="212" text-anchor="middle" font-size="8.5" fill="#888">N 关门 = 0</text>
  <text x="360" y="212" text-anchor="middle" font-size="8.5" fill="#888">Y 关门 = 1</text>

  <!-- formula box -->
  <rect x="60" y="258" width="440" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">cost(j) = (开门段中 N 的个数) + (关门段中 Y 的个数)</text>
  <text x="280" y="302" text-anchor="middle" font-size="11" fill="#333">j=2：开门 [Y,Y] → N 计 0；关门 [N,Y] → Y 计 1；cost = 0 + 1 = 1</text>
  <text x="280" y="316" text-anchor="middle" font-size="10" fill="#888">目标：在 j ∈ [0, n] 中取 cost 最小者，并列取最早</text>
</svg>
