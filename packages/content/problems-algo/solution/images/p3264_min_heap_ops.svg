<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrgr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：小根堆维护 (值, 下标)，弹顶 → 乘 → 塞回</text>

  <!-- 左：原数组 -->
  <text x="112" y="52" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">原数组（值 × 下标绑定）</text>
  <rect x="34" y="60" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="79" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="66" y="60" width="28" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="80" y="79" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="98" y="60" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="112" y="79" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="130" y="60" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="144" y="79" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="162" y="60" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="176" y="79" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="48" y="102" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="80" y="102" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="112" y="102" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="144" y="102" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="176" y="102" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>

  <!-- 入堆箭头 -->
  <path d="M196,76 C 212,72 220,70 230,68" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <text x="218" y="92" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">n 个二元组入堆</text>

  <!-- 右：堆树 -->
  <text x="352" y="46" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">小根堆（堆顶 = 全局最小）</text>
  <path d="M352,84 L282,110" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M352,84 L422,110" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M282,138 L242,162" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M282,138 L322,162" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <rect x="324" y="58" width="56" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="352" y="75" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">(1,1)</text>
  <rect x="254" y="112" width="56" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="282" y="129" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(2,0)</text>
  <rect x="394" y="112" width="56" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="422" y="129" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(3,2)</text>
  <rect x="214" y="164" width="56" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="242" y="181" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(5,3)</text>
  <rect x="294" y="164" width="56" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322" y="181" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(6,4)</text>

  <!-- 弹顶 → 乘 → 塞回 -->
  <path d="M322,72 C 240,86 150,140 116,206" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="64" y="212" width="112" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="231" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">弹出堆顶 (x, i)</text>
  <path d="M176,227 L214,227" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="218" y="212" width="92" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="264" y="231" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">x × multiplier</text>
  <path d="M310,227 L348,227" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="352" y="212" width="106" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="405" y="231" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">塞回 (x·m, i)</text>
  <path d="M458,210 C 494,168 486,98 388,76" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <text x="470" y="146" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">循环 k 轮</text>

  <!-- 要点框 -->
  <rect x="40" y="258" width="440" height="78" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">字典序比较：值相等自动比下标 ——「并列取最前」无需特判</text>
  <text x="260" y="304" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">multiplier ≥ 1 ⇒ 乘后不减小：弹一个、塞一个，堆序自动维持</text>
  <text x="260" y="326" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">每轮顺手写回 nums[i] ← 新值：k 轮跑完，原数组本身就是答案</text>

  <text x="260" y="352" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">红 = 堆顶（全局最小）；绿虚线 = 数据流；灰线 = 堆的父子边</text>
</svg>
