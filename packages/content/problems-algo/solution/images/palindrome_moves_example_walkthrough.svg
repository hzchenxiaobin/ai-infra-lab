<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto">
      <path d="M10,0 L2,5 L10,10 Z" fill="#b85450"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "letelt"（示例 2）</text>

  <!-- ===== Round 1 ===== -->
  <text x="40" y="56" font-size="12" fill="#555" font-weight="bold">第 1 轮：left=0('l')，right=5，从右找 'l' → j=4</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="110" y="66" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="130" y="87" fill="#d6a040" font-weight="bold">l</text>
    <rect x="156" y="66" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="176" y="87">e</text>
    <rect x="202" y="66" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="222" y="87">t</text>
    <rect x="248" y="66" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="268" y="87">e</text>
    <rect x="294" y="66" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="314" y="87" fill="#d6a040" font-weight="bold">l</text>
    <rect x="340" y="66" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="360" y="87">t</text>
  </g>
  <g font-size="9.5" fill="#888" text-anchor="middle">
    <text x="130" y="108">0</text><text x="176" y="108">1</text><text x="222" y="108">2</text>
    <text x="268" y="108">3</text><text x="314" y="108">4</text><text x="360" y="108">5</text>
  </g>
  <text x="130" y="120" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">left</text>
  <text x="314" y="120" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">j</text>
  <text x="360" y="120" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">right</text>
  <!-- swap 4,5 -->
  <path d="M314,126 L360,126" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M360,132 L314,132" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="400" y="130" font-size="10.5" fill="#b85450">冒泡 j→right，1 次 → "letetl"</text>
  <text x="400" y="146" font-size="10.5" fill="#b85450" font-weight="bold">ans = 1</text>

  <!-- Divider -->
  <path d="M 40 158 L 520 158" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Round 2 ===== -->
  <text x="40" y="178" font-size="12" fill="#555" font-weight="bold">第 2 轮：left=1('e')，right=4，从右找 'e' → j=3</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="110" y="188" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="130" y="209">l</text>
    <rect x="156" y="188" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="176" y="209" fill="#d6a040" font-weight="bold">e</text>
    <rect x="202" y="188" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="222" y="209">t</text>
    <rect x="248" y="188" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="268" y="209" fill="#d6a040" font-weight="bold">e</text>
    <rect x="294" y="188" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="314" y="209">t</text>
    <rect x="340" y="188" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="360" y="209">l</text>
  </g>
  <g font-size="9.5" fill="#888" text-anchor="middle">
    <text x="130" y="230">0</text><text x="176" y="230">1</text><text x="222" y="230">2</text>
    <text x="268" y="230">3</text><text x="314" y="230">4</text><text x="360" y="230">5</text>
  </g>
  <text x="176" y="242" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">left</text>
  <text x="268" y="242" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">j</text>
  <text x="314" y="242" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">right</text>
  <path d="M268,248 L314,248" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M314,254 L268,254" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="400" y="252" font-size="10.5" fill="#b85450">冒泡 j→right，1 次 → "lettel"</text>
  <text x="400" y="268" font-size="10.5" fill="#b85450" font-weight="bold">ans = 2</text>

  <!-- Divider -->
  <path d="M 40 280 L 520 280" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Round 3 ===== -->
  <text x="40" y="300" font-size="12" fill="#555" font-weight="bold">第 3 轮：left=2('t')，right=3，j=3=right，无需交换</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="110" y="310" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="130" y="331" fill="#4a7a3a" font-weight="bold">l</text>
    <rect x="156" y="310" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="176" y="331" fill="#4a7a3a" font-weight="bold">e</text>
    <rect x="202" y="310" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="222" y="331" fill="#d6a040" font-weight="bold">t</text>
    <rect x="248" y="310" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="268" y="331" fill="#d6a040" font-weight="bold">t</text>
    <rect x="294" y="310" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="314" y="331" fill="#4a7a3a" font-weight="bold">e</text>
    <rect x="340" y="310" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="360" y="331" fill="#4a7a3a" font-weight="bold">l</text>
  </g>
  <g font-size="9.5" fill="#888" text-anchor="middle">
    <text x="130" y="352">0</text><text x="176" y="352">1</text><text x="222" y="352">2</text>
    <text x="268" y="352">3</text><text x="314" y="352">4</text><text x="360" y="352">5</text>
  </g>
  <text x="222" y="364" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">left</text>
  <text x="268" y="364" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">right</text>
  <text x="400" y="334" font-size="10.5" fill="#4a7a3a">j == right，0 次交换</text>
  <text x="400" y="350" font-size="10.5" fill="#4a7a3a" font-weight="bold">ans = 2</text>

  <!-- Divider -->
  <path d="M 40 384 L 520 384" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Result -->
  <text x="40" y="404" font-size="12" fill="#555" font-weight="bold">最终结果：</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="110" y="414" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="130" y="436" fill="#4a7a3a" font-weight="bold">l</text>
    <rect x="156" y="414" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="176" y="436" fill="#4a7a3a" font-weight="bold">e</text>
    <rect x="202" y="414" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="222" y="436">t</text>
    <rect x="248" y="414" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="268" y="436">t</text>
    <rect x="294" y="414" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="314" y="436" fill="#4a7a3a" font-weight="bold">e</text>
    <rect x="340" y="414" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="360" y="436" fill="#4a7a3a" font-weight="bold">l</text>
  </g>
  <text x="400" y="436" font-size="11.5" fill="#555">"lettel" 是回文串</text>

  <!-- Answer box -->
  <rect x="60" y="468" width="440" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="488" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">答案 = 1 + 1 + 0 = 2</text>
  <text x="280" y="503" text-anchor="middle" font-size="10.5" fill="#888">两轮各冒泡 1 次，内层已对称无需交换</text>
</svg>
