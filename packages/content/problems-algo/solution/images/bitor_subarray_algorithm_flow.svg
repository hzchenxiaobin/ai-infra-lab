<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">滚动集合算法流程</text>

  <!-- Start node -->
  <ellipse cx="270" cy="62" rx="130" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">开始: ans = ∅, cur = ∅</text>

  <!-- arrow down -->
  <path d="M 270 84 L 270 102" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: more elements? -->
  <polygon points="270,106 390,156 270,206 150,156" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="150" text-anchor="middle" font-size="12" fill="#333">arr 中还有</text>
  <text x="270" y="168" text-anchor="middle" font-size="12" fill="#333">元素 x ?</text>

  <!-- No branch -> end -->
  <path d="M 390 156 L 452 156" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="148" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="486" cy="156" rx="44" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="152" text-anchor="middle" font-size="11" fill="#333">返回</text>
  <text x="486" y="168" text-anchor="middle" font-size="11" fill="#333">|ans|</text>

  <!-- Yes branch down -->
  <path d="M 270 206 L 270 224" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="220" font-size="11" fill="#82b366">是</text>

  <!-- cur update -->
  <rect x="110" y="228" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="248" text-anchor="middle" font-size="12" fill="#333">cur = { x } ∪ { x | y  :  y ∈ cur }</text>
  <text x="270" y="264" text-anchor="middle" font-size="10" fill="#888">（单元素子数组 ∪ 上一轮所有 OR 再或上 x）</text>

  <!-- arrow down -->
  <path d="M 270 272 L 270 290" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ans update -->
  <rect x="150" y="294" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="316" text-anchor="middle" font-size="12" fill="#333">ans = ans ∪ cur</text>

  <!-- loop back arrow -->
  <path d="M 270 328 L 270 342 L 60 342 L 60 156 L 150 156" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="62" y="248" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 62 248)">处理下一个 x</text>

  <!-- note -->
  <rect x="60" y="372" width="420" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="392" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">关键：cur 用集合去重 → |cur| ≤ 31</text>
  <text x="270" y="410" text-anchor="middle" font-size="10" fill="#666">每轮 O(31)，n 轮共 O(31n)；ans 收集所有不同 OR 值</text>
</svg>
