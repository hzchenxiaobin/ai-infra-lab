<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "adefaddaccc" 的闭包区间与贪心选择</text>

  <!-- ===== String grid ===== -->
  <text x="40" y="52" font-size="11" fill="#888" font-weight="bold">字符串（下标 0-10）：</text>

  <!-- index row -->
  <text x="90" y="72" text-anchor="middle" font-size="8" fill="#aaa">0</text>
  <text x="120" y="72" text-anchor="middle" font-size="8" fill="#aaa">1</text>
  <text x="150" y="72" text-anchor="middle" font-size="8" fill="#aaa">2</text>
  <text x="180" y="72" text-anchor="middle" font-size="8" fill="#aaa">3</text>
  <text x="210" y="72" text-anchor="middle" font-size="8" fill="#aaa">4</text>
  <text x="240" y="72" text-anchor="middle" font-size="8" fill="#aaa">5</text>
  <text x="270" y="72" text-anchor="middle" font-size="8" fill="#aaa">6</text>
  <text x="300" y="72" text-anchor="middle" font-size="8" fill="#aaa">7</text>
  <text x="330" y="72" text-anchor="middle" font-size="8" fill="#aaa">8</text>
  <text x="360" y="72" text-anchor="middle" font-size="8" fill="#aaa">9</text>
  <text x="390" y="72" text-anchor="middle" font-size="8" fill="#aaa">10</text>

  <!-- chars -->
  <rect x="76" y="78" width="28" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="97" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="106" y="78" width="28" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="97" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d</text>
  <rect x="136" y="78" width="28" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="150" y="97" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e</text>
  <rect x="166" y="78" width="28" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="97" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">f</text>
  <rect x="196" y="78" width="28" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="210" y="97" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="226" y="78" width="28" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="240" y="97" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d</text>
  <rect x="256" y="78" width="28" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="270" y="97" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d</text>
  <rect x="286" y="78" width="28" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="97" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="316" y="78" width="28" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="330" y="97" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
  <rect x="346" y="78" width="28" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="97" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
  <rect x="376" y="78" width="28" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="390" y="97" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>

  <!-- ===== Closure intervals as bars ===== -->
  <text x="40" y="128" font-size="11" fill="#888" font-weight="bold">各字符闭包区间：</text>

  <!-- a → [0,7] -->
  <text x="50" y="148" font-size="10" fill="#446688" font-weight="bold">a</text>
  <rect x="76" y="138" width="238" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="320" y="148" font-size="9" fill="#555">[0,7] "adefadda"</text>

  <!-- d → [0,7] (same as a) -->
  <text x="50" y="168" font-size="10" fill="#446688" font-weight="bold">d</text>
  <rect x="76" y="158" width="238" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="320" y="168" font-size="9" fill="#555">[0,7] (同 a)</text>

  <!-- e → [2,2] -->
  <text x="50" y="188" font-size="10" fill="#4a7a3a" font-weight="bold">e</text>
  <rect x="136" y="178" width="28" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="320" y="188" font-size="9" fill="#555">[2,2] "e"</text>

  <!-- f → [3,3] -->
  <text x="50" y="208" font-size="10" fill="#4a7a3a" font-weight="bold">f</text>
  <rect x="166" y="198" width="28" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="320" y="208" font-size="9" fill="#555">[3,3] "f"</text>

  <!-- c → [8,10] -->
  <text x="50" y="228" font-size="10" fill="#4a7a3a" font-weight="bold">c</text>
  <rect x="316" y="218" width="88" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="320" y="228" font-size="9" fill="#555" opacity="0">[8,10] "ccc"</text>
  <text x="412" y="228" font-size="9" fill="#555">[8,10] "ccc"</text>

  <!-- separator -->
  <line x1="40" y1="244" x2="520" y2="244" stroke="#ddd" stroke-width="1" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- ===== Sorted and greedy ===== -->
  <text x="40" y="264" font-size="11" fill="#888" font-weight="bold">排序后贪心选择（按 end↑, start↓）：</text>

  <!-- Sorted intervals table -->
  <!-- Header -->
  <rect x="60" y="274" width="50" height="20" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="288" text-anchor="middle" font-size="9" fill="#666" font-weight="bold">序</text>
  <rect x="112" y="274" width="80" height="20" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="152" y="288" text-anchor="middle" font-size="9" fill="#666" font-weight="bold">区间</text>
  <rect x="194" y="274" width="100" height="20" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="244" y="288" text-anchor="middle" font-size="9" fill="#666" font-weight="bold">子字符串</text>
  <rect x="296" y="274" width="60" height="20" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="326" y="288" text-anchor="middle" font-size="9" fill="#666" font-weight="bold">l&gt;lastEnd?</text>
  <rect x="358" y="274" width="60" height="20" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="388" y="288" text-anchor="middle" font-size="9" fill="#666" font-weight="bold">动作</text>
  <rect x="420" y="274" width="50" height="20" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="445" y="288" text-anchor="middle" font-size="9" fill="#666" font-weight="bold">lastEnd</text>

  <!-- Row 1: [2,2] e -->
  <rect x="60" y="296" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="311" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="112" y="296" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="152" y="311" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[2,2]</text>
  <rect x="194" y="296" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="244" y="311" text-anchor="middle" font-size="10" fill="#333">"e"</text>
  <rect x="296" y="296" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="326" y="311" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2&gt;-1 ✓</text>
  <rect x="358" y="296" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="388" y="311" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">选中</text>
  <rect x="420" y="296" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="445" y="311" text-anchor="middle" font-size="10" fill="#333">2</text>

  <!-- Row 2: [3,3] f -->
  <rect x="60" y="320" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="335" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="112" y="320" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="152" y="335" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[3,3]</text>
  <rect x="194" y="320" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="244" y="335" text-anchor="middle" font-size="10" fill="#333">"f"</text>
  <rect x="296" y="320" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="326" y="335" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3&gt;2 ✓</text>
  <rect x="358" y="320" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="388" y="335" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">选中</text>
  <rect x="420" y="320" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="445" y="335" text-anchor="middle" font-size="10" fill="#333">3</text>

  <!-- Row 3: [0,7] adefadda -->
  <rect x="60" y="344" width="50" height="22" fill="#eee" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="359" text-anchor="middle" font-size="10" fill="#999">3</text>
  <rect x="112" y="344" width="80" height="22" fill="#eee" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="152" y="359" text-anchor="middle" font-size="10" fill="#999" font-weight="bold">[0,7]</text>
  <rect x="194" y="344" width="100" height="22" fill="#eee" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="244" y="359" text-anchor="middle" font-size="10" fill="#999">"adefadda"</text>
  <rect x="296" y="344" width="60" height="22" fill="#eee" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="326" y="359" text-anchor="middle" font-size="10" fill="#b85450">0≤3 ✗</text>
  <rect x="358" y="344" width="60" height="22" fill="#eee" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="388" y="359" text-anchor="middle" font-size="10" fill="#999">跳过</text>
  <rect x="420" y="344" width="50" height="22" fill="#eee" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="445" y="359" text-anchor="middle" font-size="10" fill="#999">3</text>

  <!-- Row 4: [8,10] ccc -->
  <rect x="60" y="368" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="383" text-anchor="middle" font-size="10" fill="#333">4</text>
  <rect x="112" y="368" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="152" y="383" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[8,10]</text>
  <rect x="194" y="368" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="244" y="383" text-anchor="middle" font-size="10" fill="#333">"ccc"</text>
  <rect x="296" y="368" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="326" y="383" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">8&gt;3 ✓</text>
  <rect x="358" y="368" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="388" y="383" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">选中</text>
  <rect x="420" y="368" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="445" y="383" text-anchor="middle" font-size="10" fill="#333">10</text>

  <!-- ===== Final result ===== -->
  <rect x="40" y="396" width="480" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="408" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">结果：["e", "f", "ccc"] — 数量 3（最大），总长度 5（最小）</text>
</svg>
