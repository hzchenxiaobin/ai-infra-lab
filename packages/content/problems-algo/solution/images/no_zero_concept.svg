<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：无零整数 —— 十进制各位均非 0</text>

  <text x="40" y="60" font-size="12" fill="#4a7a3a" font-weight="bold">无零整数示例：</text>
  <rect x="150" y="44" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="163" y="62" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="180" y="44" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="193" y="62" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="210" y="44" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="223" y="62" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="240" y="44" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="253" y="62" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="270" y="44" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="283" y="62" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="312" y="62" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 合法</text>

  <text x="40" y="104" font-size="12" fill="#b85450" font-weight="bold">含零示例：</text>
  <rect x="150" y="88" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="163" y="106" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="180" y="88" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="193" y="106" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
  <rect x="210" y="88" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="223" y="106" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
  <rect x="240" y="88" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="253" y="106" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <text x="282" y="106" font-size="12" fill="#b85450" font-weight="bold">✗ 含 0 非法</text>

  <text x="40" y="148" font-size="12" fill="#446688" font-weight="bold">拆分 n = a + b，要求 a、b 均为无零整数</text>

  <rect x="200" y="158" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="178" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">n = 1010</text>

  <text x="40" y="216" font-size="12" fill="#888" font-weight="bold">尝试 1：a = 1</text>
  <rect x="120" y="202" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="220" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="160" y="220" font-size="14" fill="#555" font-weight="bold">+</text>
  <text x="180" y="216" font-size="12" fill="#888" font-weight="bold">b = 1009</text>
  <rect x="180" y="202" width="22" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="191" y="220" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="204" y="202" width="22" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="215" y="220" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <rect x="228" y="202" width="22" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="239" y="220" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <rect x="252" y="202" width="22" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="263" y="220" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <text x="290" y="220" font-size="13" fill="#b85450" font-weight="bold">✗ b 含 0</text>

  <text x="40" y="276" font-size="12" fill="#446688" font-weight="bold">尝试 2：a = 11</text>
  <rect x="120" y="262" width="22" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="131" y="280" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="144" y="262" width="22" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="280" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="174" y="280" font-size="14" fill="#555" font-weight="bold">+</text>
  <text x="190" y="276" font-size="12" fill="#446688" font-weight="bold">b = 999</text>
  <rect x="190" y="262" width="22" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="201" y="280" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <rect x="214" y="262" width="22" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="280" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <rect x="238" y="262" width="22" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="249" y="280" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <text x="276" y="280" font-size="13" fill="#4a7a3a" font-weight="bold">✓ 均无零</text>

  <rect x="40" y="312" width="460" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="334" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">判定方法：逐位取模 — x % 10 == 0 即含零</text>
  <text x="60" y="356" font-size="12" fill="#333">• 遍历 a = 1 → n−1，令 b = n − a</text>
  <text x="60" y="374" font-size="12" fill="#333">• 只要 a、b 都「不含 0」即返回 [a, b]，答案不唯一任取一组即可</text>
</svg>
