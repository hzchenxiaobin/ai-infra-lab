<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    算法流程：余数化 → 配对 → 记忆化 DFS
  </text>

  <!-- Start -->
  <ellipse cx="270" cy="54" rx="44" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="58" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M270,70 L270,84" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: remainder + count -->
  <rect x="110" y="88" width="320" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="106" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">余数化：cnt[g % batchSize]++</text>
  <text x="270" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">10⁹ 级人数 → [0, 8]</text>
  <path d="M270,122 L270,136" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: cnt[0] -->
  <rect x="130" y="140" width="280" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="160" text-anchor="middle" font-size="11" fill="#2a4a1a" filter="url(#rough2)">ans = cnt[0]（余数 0 组全开心）</text>
  <path d="M270,170 L270,184" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: complementary pairing -->
  <rect x="80" y="188" width="380" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="206" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">互补配对：r 与 batchSize−r</text>
  <text x="270" y="222" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">ans += min(cnt[r], cnt[B−r])；两侧各减对数</text>
  <path d="M270,232 L270,246" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: 还有剩余组? -->
  <polygon points="270,250 360,278 270,306 180,278" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="282" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">还有剩余组?</text>

  <!-- no branch -> return -->
  <path d="M360,278 L418,278" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="386" y="271" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="422" y="262" width="100" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="472" y="284" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">return ans</text>

  <!-- yes branch -->
  <path d="M270,306 L270,320" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="316" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- DFS box -->
  <rect x="60" y="324" width="420" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="342" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">记忆化 DFS(state, rem)</text>
  <line x1="70" y1="348" x2="470" y2="348" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="70" y="364" font-size="10" fill="#888" filter="url(#rough2)">state = (cnt[1], cnt[2], …, cnt[B−1])</text>
  <text x="70" y="378" font-size="10" fill="#4a7a3a" filter="url(#rough2)">若 rem == 0：选下一组 → +1 开心</text>
  <text x="70" y="392" font-size="10" fill="#d6a040" filter="url(#rough2)">转移：new_rem = (rem − r) % B</text>
  <text x="70" y="406" font-size="10" fill="#888" filter="url(#rough2)">枚举所有可选 r，取 max(gain + dfs(新状态))</text>

  <!-- loop back from DFS to diamond -->
  <path d="M60,369 L36,369 L36,278 L180,278" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="42" y="324" font-size="9" fill="#888" filter="url(#rough2)">memo 缓存</text>

  <!-- complexity footnote -->
  <text x="270" y="436" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    配对后状态数 ≤ C(34,4) × 9 ≈ 4.2 × 10⁵
  </text>
  <text x="270" y="454" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    每次 DFS 转移枚举 ≤ 8 种余数
  </text>
  <text x="270" y="470" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    蓝=主流程；绿=直接计入；橙=配对；红=返回
  </text>
</svg>
