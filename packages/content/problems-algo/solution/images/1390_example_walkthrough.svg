<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums = [21, 4, 7]</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">对每个数枚举 i = 1..⌊√num⌋，成对收集因数，超 4 即停</text>

  <!-- ===== Row 1: num = 21 ===== -->
  <rect x="24" y="58" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="52" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">21</text>
  <text x="92" y="80" font-size="10.5" fill="#888">√21 ≈ 4.58 → i=1..4</text>

  <!-- i table for 21 -->
  <rect x="24" y="98" width="40" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="44" y="113" text-anchor="middle" font-size="9.5" fill="#888">i=1</text>
  <rect x="70" y="98" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="90" y="113" text-anchor="middle" font-size="9.5" fill="#333">1,21</text>
  <rect x="116" y="98" width="40" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="136" y="113" text-anchor="middle" font-size="9.5" fill="#888">i=2</text>
  <rect x="162" y="98" width="40" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="182" y="113" text-anchor="middle" font-size="9.5" fill="#888">—</text>
  <rect x="208" y="98" width="40" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="228" y="113" text-anchor="middle" font-size="9.5" fill="#888">i=3</text>
  <rect x="254" y="98" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="274" y="113" text-anchor="middle" font-size="9.5" fill="#333">3,7</text>
  <rect x="300" y="98" width="40" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="113" text-anchor="middle" font-size="9.5" fill="#888">i=4</text>
  <rect x="346" y="98" width="40" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="366" y="113" text-anchor="middle" font-size="9.5" fill="#888">—</text>

  <!-- result for 21 -->
  <rect x="400" y="96" width="136" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="468" y="113" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">count=4 → +32</text>

  <!-- ===== Row 2: num = 4 ===== -->
  <rect x="24" y="138" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="52" y="160" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="92" y="160" font-size="10.5" fill="#888">√4 = 2 → i=1..2</text>

  <rect x="24" y="178" width="40" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="44" y="193" text-anchor="middle" font-size="9.5" fill="#888">i=1</text>
  <rect x="70" y="178" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="90" y="193" text-anchor="middle" font-size="9.5" fill="#333">1,4</text>
  <rect x="116" y="178" width="40" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="136" y="193" text-anchor="middle" font-size="9.5" fill="#888">i=2</text>
  <rect x="162" y="178" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="182" y="193" text-anchor="middle" font-size="9.5" fill="#b85450">2</text>

  <text x="216" y="193" font-size="9.5" fill="#888">2 = 4/2，完全平方只加一个</text>

  <rect x="400" y="176" width="136" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="468" y="193" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">count=3 → 跳过</text>

  <!-- ===== Row 3: num = 7 ===== -->
  <rect x="24" y="218" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="52" y="240" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <text x="92" y="240" font-size="10.5" fill="#888">√7 ≈ 2.64 → i=1..2</text>

  <rect x="24" y="258" width="40" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="44" y="273" text-anchor="middle" font-size="9.5" fill="#888">i=1</text>
  <rect x="70" y="258" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="90" y="273" text-anchor="middle" font-size="9.5" fill="#333">1,7</text>
  <rect x="116" y="258" width="40" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="136" y="273" text-anchor="middle" font-size="9.5" fill="#888">i=2</text>
  <rect x="162" y="258" width="40" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="182" y="273" text-anchor="middle" font-size="9.5" fill="#888">—</text>

  <text x="216" y="273" font-size="9.5" fill="#888">7 为质数，只有 1 和自身</text>

  <rect x="400" y="256" width="136" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="468" y="273" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">count=2 → 跳过</text>

  <!-- divider -->
  <path d="M 24 300 L 536 300" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Final result -->
  <rect x="120" y="316" width="320" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">total = 32 + 0 + 0 = 32</text>

  <!-- divisor detail for 21 -->
  <text x="36" y="376" font-size="10.5" fill="#666">21 的四个因数：</text>
  <rect x="120" y="362" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="140" y="382" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="166" y="362" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="186" y="382" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="212" y="362" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="232" y="382" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="258" y="362" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="278" y="382" text-anchor="middle" font-size="12" fill="#333">21</text>
  <text x="320" y="382" font-size="11" fill="#b85450" font-weight="bold">和 = 32</text>

  <!-- bottom note -->
  <rect x="60" y="404" width="440" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="280" y="422" text-anchor="middle" font-size="10.5" fill="#555">21 = 3×7（p·q 型）；4 = 2²（3 因数）；7 = 质数（2 因数）</text>
</svg>
