<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="470" height="350" fill="#fafafa"/>

  <text x="235" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：5×6 网格，起点 (1,4)</text>
  <text x="235" y="40" text-anchor="middle" font-size="10" fill="#888">步长 1,1,2,2,3,3,4,4,… 越界格子跳过但不改变路径，共访问 30 格</text>

  <!-- ===== Grid: 5 rows × 6 cols, cell=42, origin (95,70) ===== -->
  <!-- col labels -->
  <text x="116" y="64" text-anchor="middle" font-size="9" fill="#888">c0</text>
  <text x="158" y="64" text-anchor="middle" font-size="9" fill="#888">c1</text>
  <text x="200" y="64" text-anchor="middle" font-size="9" fill="#888">c2</text>
  <text x="242" y="64" text-anchor="middle" font-size="9" fill="#888">c3</text>
  <text x="284" y="64" text-anchor="middle" font-size="9" fill="#888">c4</text>
  <text x="326" y="64" text-anchor="middle" font-size="9" fill="#888">c5</text>
  <!-- row labels -->
  <text x="88" y="95" text-anchor="end" font-size="9" fill="#888">r0</text>
  <text x="88" y="137" text-anchor="end" font-size="9" fill="#888">r1</text>
  <text x="88" y="179" text-anchor="end" font-size="9" fill="#888">r2</text>
  <text x="88" y="221" text-anchor="end" font-size="9" fill="#888">r3</text>
  <text x="88" y="263" text-anchor="end" font-size="9" fill="#888">r4</text>

  <!-- ===== Cells with visit numbers ===== -->
  <!-- Cell 1: (1,4) start — red -->
  <rect x="263" y="112" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="284" y="139" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>

  <!-- Cells 2-9: orange (steps 1-3) -->
  <rect x="305" y="112" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="326" y="139" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="305" y="154" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="326" y="181" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="263" y="154" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="284" y="181" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="221" y="154" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="181" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="221" y="112" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="139" text-anchor="middle" font-size="13" fill="#333">6</text>
  <rect x="221" y="70" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="97" text-anchor="middle" font-size="13" fill="#333">7</text>
  <rect x="263" y="70" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="284" y="97" text-anchor="middle" font-size="13" fill="#333">8</text>
  <rect x="305" y="70" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="326" y="97" text-anchor="middle" font-size="13" fill="#333">9</text>

  <!-- Cells 10-21: green (steps 4-6) -->
  <rect x="305" y="196" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="326" y="223" text-anchor="middle" font-size="13" fill="#333">10</text>
  <rect x="263" y="196" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="284" y="223" text-anchor="middle" font-size="13" fill="#333">11</text>
  <rect x="221" y="196" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="223" text-anchor="middle" font-size="13" fill="#333">12</text>
  <rect x="179" y="196" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="223" text-anchor="middle" font-size="13" fill="#333">13</text>
  <rect x="179" y="154" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="181" text-anchor="middle" font-size="13" fill="#333">14</text>
  <rect x="179" y="112" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="139" text-anchor="middle" font-size="13" fill="#333">15</text>
  <rect x="179" y="70" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="97" text-anchor="middle" font-size="13" fill="#333">16</text>
  <rect x="305" y="238" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="326" y="265" text-anchor="middle" font-size="13" fill="#333">17</text>
  <rect x="263" y="238" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="284" y="265" text-anchor="middle" font-size="13" fill="#333">18</text>
  <rect x="221" y="238" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="265" text-anchor="middle" font-size="13" fill="#333">19</text>
  <rect x="179" y="238" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="265" text-anchor="middle" font-size="13" fill="#333">20</text>
  <rect x="137" y="238" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="265" text-anchor="middle" font-size="13" fill="#333">21</text>

  <!-- Cells 22-30: blue (steps 6-8) -->
  <rect x="137" y="196" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="223" text-anchor="middle" font-size="13" fill="#333">22</text>
  <rect x="137" y="154" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="181" text-anchor="middle" font-size="13" fill="#333">23</text>
  <rect x="137" y="112" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="139" text-anchor="middle" font-size="13" fill="#333">24</text>
  <rect x="137" y="70" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="97" text-anchor="middle" font-size="13" fill="#333">25</text>
  <rect x="95" y="238" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="116" y="265" text-anchor="middle" font-size="13" fill="#333">26</text>
  <rect x="95" y="196" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="116" y="223" text-anchor="middle" font-size="13" fill="#333">27</text>
  <rect x="95" y="154" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="116" y="181" text-anchor="middle" font-size="13" fill="#333">28</text>
  <rect x="95" y="112" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="116" y="139" text-anchor="middle" font-size="13" fill="#333">29</text>
  <rect x="95" y="70" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="116" y="97" text-anchor="middle" font-size="13" fill="#333">30</text>

  <!-- ===== Direction arrows (key segments) ===== -->
  <!-- East 1: above cells 1→2 -->
  <path d="M 270 108 L 322 108" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="104" text-anchor="middle" font-size="9" fill="#b85450">东1</text>

  <!-- South 1: right of cells 2→3 -->
  <path d="M 353 120 L 353 172" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="150" font-size="9" fill="#b85450">南1</text>

  <!-- West 2: below cells 3→5 -->
  <path d="M 322 204 L 240 204" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="200" text-anchor="middle" font-size="9" fill="#b85450">西2</text>

  <!-- North 2: left of cells 5→7 -->
  <path d="M 213 172 L 213 88" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="206" y="134" text-anchor="end" font-size="9" fill="#b85450">北2</text>

  <!-- East 3: above cells 7→9 -->
  <path d="M 240 66 L 322 66" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="62" text-anchor="middle" font-size="9" fill="#b85450">东3</text>

  <!-- West 4: below cells 10→13 -->
  <path d="M 322 246 L 198 246" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="242" text-anchor="middle" font-size="9" fill="#b85450">西4</text>

  <!-- North 4: left of cells 13→16 -->
  <path d="M 171 224 L 171 88" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="160" text-anchor="end" font-size="9" fill="#b85450">北4</text>

  <!-- West 6: below cells 17→21 -->
  <path d="M 322 288 L 156 288" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="242" y="284" text-anchor="middle" font-size="9" fill="#b85450">西6</text>

  <!-- North 6: left of cells 22→25 -->
  <path d="M 129 266 L 129 88" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="122" y="180" text-anchor="end" font-size="9" fill="#b85450">北6</text>

  <!-- North 8: left of cells 26→30 -->
  <path d="M 87 266 L 87 88" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="80" y="180" text-anchor="end" font-size="9" fill="#b85450">北8</text>

  <!-- ===== Legend ===== -->
  <line x1="20" y1="316" x2="450" y2="316" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <rect x="30" y="324" width="14" height="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="50" y="334" font-size="9" fill="#555">起点</text>
  <rect x="95" y="324" width="14" height="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="115" y="334" font-size="9" fill="#555">前段(2~9步)</text>
  <rect x="205" y="324" width="14" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="225" y="334" font-size="9" fill="#555">中段(10~21步)</text>
  <rect x="320" y="324" width="14" height="11" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="340" y="334" font-size="9" fill="#555">末段(22~30步)</text>
</svg>
