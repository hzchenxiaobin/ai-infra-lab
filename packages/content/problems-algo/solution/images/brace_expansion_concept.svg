<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">花括号展开：分组解析 + 有序笛卡尔积</text>

  <!-- Panel A: input string parsing -->
  <rect x="24" y="44" width="512" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="40" y="66" font-size="12" fill="#446688" font-weight="bold">① 解析：花括号组与单字母 → 统一为「选项组」</text>

  <!-- input string with colored braces -->
  <text x="80" y="98" font-size="13" fill="#b85450" font-weight="bold">{</text>
  <text x="92" y="98" font-size="13" fill="#333" font-weight="bold">a,b</text>
  <text x="118" y="98" font-size="13" fill="#b85450" font-weight="bold">}</text>
  <text x="134" y="98" font-size="13" fill="#446688" font-weight="bold">c</text>
  <text x="148" y="98" font-size="13" fill="#b85450" font-weight="bold">{</text>
  <text x="160" y="98" font-size="13" fill="#333" font-weight="bold">d,e</text>
  <text x="186" y="98" font-size="13" fill="#b85450" font-weight="bold">}</text>

  <!-- arrows down to groups -->
  <line x1="100" y1="104" x2="100" y2="116" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="138" y1="104" x2="138" y2="116" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="174" y1="104" x2="174" y2="116" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- group boxes -->
  <rect x="68" y="116" width="64" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="131" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[a, b]</text>
  <rect x="112" y="116" width="52" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="138" y="131" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[c]</text>
  <rect x="142" y="116" width="64" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="174" y="131" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[d, e]</text>

  <!-- sort annotation -->
  <text x="260" y="100" font-size="11" fill="#d6a040" font-weight="bold">sort →</text>
  <text x="260" y="118" font-size="10" fill="#888">各组内部排序</text>
  <text x="260" y="132" font-size="10" fill="#888">保证字典序前提</text>

  <!-- Panel B: cartesian product formula -->
  <rect x="24" y="142" width="512" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="40" y="164" font-size="12" fill="#4a7a3a" font-weight="bold">② 笛卡尔积：每组各选一个字母 → 一个单词</text>

  <text x="60" y="194" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="74" y="194" font-size="13" fill="#888">×</text>
  <text x="90" y="194" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="104" y="194" font-size="13" fill="#888">×</text>
  <text x="120" y="194" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="140" y="194" font-size="13" fill="#888">=</text>
  <text x="160" y="194" font-size="14" fill="#b85450" font-weight="bold">4</text>
  <text x="178" y="194" font-size="11" fill="#555">个单词</text>

  <text x="250" y="186" font-size="11" fill="#4a7a3a">acd · ace · bcd · bce</text>
  <text x="250" y="202" font-size="10" fill="#888">每组选一个，所有组合</text>

  <!-- Panel C: ordered DFS insight -->
  <rect x="24" y="224" width="512" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="40" y="246" font-size="12" fill="#d6a040" font-weight="bold">③ 有序 DFS：组从左到右 + 组内从小到大</text>

  <text x="40" y="272" font-size="11" fill="#555">各组已排序</text>
  <text x="124" y="272" font-size="11" fill="#4a7a3a" font-weight="bold">→</text>
  <text x="140" y="272" font-size="11" fill="#555">DFS 按序选取</text>
  <text x="226" y="272" font-size="11" fill="#4a7a3a" font-weight="bold">→</text>
  <text x="242" y="272" font-size="11" fill="#b85450" font-weight="bold">输出天然字典序</text>
  <text x="380" y="272" font-size="10" fill="#888">无需末尾 sorted()</text>

  <text x="40" y="288" font-size="10" fill="#888">类似多重循环字典序：外层控制高位、内层控制低位，每层有序则乘积有序</text>

  <!-- complexity compare -->
  <rect x="24" y="306" width="512" height="56" rx="8" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="40" y="326" font-size="11" fill="#555" font-weight="bold">复杂度对照：</text>
  <text x="40" y="346" font-size="11" fill="#b85450">暴力 product + sort</text>
  <text x="186" y="346" font-size="11" fill="#888">O(m·N log N)</text>
  <text x="290" y="346" font-size="11" fill="#4a7a3a" font-weight="bold">有序 DFS</text>
  <text x="372" y="346" font-size="11" fill="#888">O(m·N)</text>
  <text x="430" y="346" font-size="10" fill="#4a7a3a">省掉 log N</text>
</svg>
