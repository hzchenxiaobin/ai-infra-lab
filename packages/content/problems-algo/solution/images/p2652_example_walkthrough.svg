<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 10 → 40（容斥 + 等差数列）</text>

  <!-- Header row -->
  <rect x="80" y="48" width="396" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="98" y="66" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">项</text>
  <text x="140" y="66" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">k</text>
  <text x="196" y="66" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">m=⌊10/k⌋</text>
  <text x="320" y="66" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">求和</text>
  <text x="444" y="66" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">值</text>

  <!-- Data rows -->
  <!-- Row 1: + S(3) -->
  <rect x="80" y="78" width="396" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="98" y="96" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+</text>
  <text x="140" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="196" y="96" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="320" y="96" text-anchor="middle" font-size="11" fill="#333">3+6+9 = 3·3·4/2</text>
  <text x="444" y="96" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">18</text>

  <!-- Row 2: + S(5) -->
  <rect x="80" y="104" width="396" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="98" y="122" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+</text>
  <text x="140" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="196" y="122" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="320" y="122" text-anchor="middle" font-size="11" fill="#333">5+10 = 5·2·3/2</text>
  <text x="444" y="122" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">15</text>

  <!-- Row 3: + S(7) -->
  <rect x="80" y="130" width="396" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="98" y="148" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+</text>
  <text x="140" y="148" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <text x="196" y="148" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="320" y="148" text-anchor="middle" font-size="11" fill="#333">7 = 7·1·2/2</text>
  <text x="444" y="148" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">7</text>

  <!-- Row 4: - S(15) -->
  <rect x="80" y="156" width="396" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="98" y="174" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−</text>
  <text x="140" y="174" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">15</text>
  <text x="196" y="174" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="320" y="174" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="444" y="174" text-anchor="middle" font-size="12" fill="#999">0</text>

  <!-- Row 5: - S(21) -->
  <rect x="80" y="182" width="396" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="98" y="200" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−</text>
  <text x="140" y="200" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">21</text>
  <text x="196" y="200" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="320" y="200" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="444" y="200" text-anchor="middle" font-size="12" fill="#999">0</text>

  <!-- Row 6: - S(35) -->
  <rect x="80" y="208" width="396" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="98" y="226" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−</text>
  <text x="140" y="226" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">35</text>
  <text x="196" y="226" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="320" y="226" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="444" y="226" text-anchor="middle" font-size="12" fill="#999">0</text>

  <!-- Row 7: + S(105) -->
  <rect x="80" y="234" width="396" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="98" y="252" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">+</text>
  <text x="140" y="252" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">105</text>
  <text x="196" y="252" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="320" y="252" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="444" y="252" text-anchor="middle" font-size="12" fill="#999">0</text>

  <!-- Summary box -->
  <rect x="80" y="272" width="396" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="278" y="290" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">容斥求和 = 18 + 15 + 7 − 0 − 0 − 0 + 0 = 40 ✓</text>
  <text x="278" y="305" text-anchor="middle" font-size="10" fill="#888">m=0 的交集项无贡献（10 内无 15/21/35/105 的倍数）</text>
</svg>
