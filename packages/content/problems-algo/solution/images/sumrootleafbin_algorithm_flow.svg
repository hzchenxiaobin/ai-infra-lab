<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：DFS 前缀累积（cur = cur × 2 + val）</text>

  <!-- start -->
  <rect x="150" y="44" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dfs(node, cur)  // 初始 cur = 0</text>
  <path d="M 260 76 L 260 92" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- diamond: node == null? -->
  <path d="M 260 96 L 350 134 L 260 172 L 170 134 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="138" text-anchor="middle" font-size="11" fill="#333">node == null ?</text>
  <path d="M 350 134 L 406 134" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="360" y="128" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="406" y="118" width="92" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="452" y="139" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return 0</text>
  <path d="M 260 172 L 260 190" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="268" y="186" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- accumulate: cur = cur*2 + val -->
  <rect x="110" y="192" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="213" text-anchor="middle" font-size="12" fill="#333">cur = (cur &lt;&lt; 1) | node.val</text>
  <path d="M 260 226 L 260 244" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- diamond: leaf? -->
  <path d="M 260 248 L 380 290 L 260 332 L 140 290 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="286" text-anchor="middle" font-size="11" fill="#333">叶子节点 ?</text>
  <text x="260" y="302" text-anchor="middle" font-size="10" fill="#888">(left==null &amp;&amp; right==null)</text>
  <path d="M 380 290 L 416 290" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="386" y="284" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="416" y="268" width="92" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="462" y="287" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return</text>
  <text x="462" y="304" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">cur</text>
  <path d="M 260 332 L 260 350" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="268" y="346" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- recurse: sum of two branches -->
  <rect x="110" y="352" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="373" text-anchor="middle" font-size="11" fill="#333">return dfs(left, cur)</text>
  <text x="412" y="373" font-size="13" fill="#b85450" font-weight="bold">+</text>

  <rect x="110" y="392" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="413" text-anchor="middle" font-size="11" fill="#333">dfs(right, cur)</text>

  <text x="260" y="430" text-anchor="middle" font-size="10" fill="#888">左右子树结果相加（求和问题需遍历全部叶子，不能短路）</text>
</svg>
