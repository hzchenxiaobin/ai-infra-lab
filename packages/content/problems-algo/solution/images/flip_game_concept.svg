<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">翻转游戏：一次合法移动 = 把相邻两个「++」翻成「--」</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">枚举每一对相邻 ++ 的位置，各自翻一次，收集所有可能结果</text>

  <!-- ===== Source string ++++++ ===== -->
  <text x="30" y="86" font-size="11" fill="#446688" font-weight="bold">原始串 currentState = &quot;++++&quot;</text>

  <g font-size="14">
    <rect x="40"  y="96" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="62"  y="124" text-anchor="middle" fill="#446688" font-weight="bold">+</text>
    <rect x="84"  y="96" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="106" y="124" text-anchor="middle" fill="#446688" font-weight="bold">+</text>
    <rect x="128" y="96" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="150" y="124" text-anchor="middle" fill="#446688" font-weight="bold">+</text>
    <rect x="172" y="96" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="194" y="124" text-anchor="middle" fill="#446688" font-weight="bold">+</text>
  </g>

  <!-- three candidate flip pairs highlighted -->
  <rect x="40"  y="92" width="88" height="52" fill="none" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="84"  y="166" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">位置 [0,1]</text>

  <rect x="84"  y="92" width="88" height="52" fill="none" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)" opacity="0.7"/>
  <text x="128" y="166" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">位置 [1,2]</text>

  <rect x="128" y="92" width="88" height="52" fill="none" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)" opacity="0.7"/>
  <text x="172" y="166" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">位置 [2,3]</text>

  <!-- ===== Three results ===== -->
  <text x="30" y="196" font-size="11" fill="#444" font-weight="bold">翻转每对各自得到一个新串：</text>

  <!-- result 1: --++ -->
  <g font-size="14">
    <rect x="40"  y="208" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="62"  y="234" text-anchor="middle" fill="#b85450" font-weight="bold">−</text>
    <rect x="84"  y="208" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="106" y="234" text-anchor="middle" fill="#b85450" font-weight="bold">−</text>
    <rect x="128" y="208" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="150" y="234" text-anchor="middle" fill="#446688" font-weight="bold">+</text>
    <rect x="172" y="208" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="194" y="234" text-anchor="middle" fill="#446688" font-weight="bold">+</text>
  </g>
  <text x="230" y="232" font-size="11" fill="#333">&quot;--++&quot; ← 翻 [0,1]</text>

  <!-- result 2: +--+ -->
  <g font-size="14">
    <rect x="40"  y="258" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="62"  y="284" text-anchor="middle" fill="#446688" font-weight="bold">+</text>
    <rect x="84"  y="258" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="106" y="284" text-anchor="middle" fill="#b85450" font-weight="bold">−</text>
    <rect x="128" y="258" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="150" y="284" text-anchor="middle" fill="#b85450" font-weight="bold">−</text>
    <rect x="172" y="258" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="194" y="284" text-anchor="middle" fill="#446688" font-weight="bold">+</text>
  </g>
  <text x="230" y="282" font-size="11" fill="#333">&quot;+--+&quot; ← 翻 [1,2]</text>

  <!-- result 3: ++-- -->
  <g font-size="14">
    <rect x="40"  y="308" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="62"  y="334" text-anchor="middle" fill="#446688" font-weight="bold">+</text>
    <rect x="84"  y="308" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="106" y="334" text-anchor="middle" fill="#446688" font-weight="bold">+</text>
    <rect x="128" y="308" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="150" y="334" text-anchor="middle" fill="#b85450" font-weight="bold">−</text>
    <rect x="172" y="308" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="194" y="334" text-anchor="middle" fill="#b85450" font-weight="bold">−</text>
  </g>
  <text x="230" y="332" font-size="11" fill="#333">&quot;++--&quot; ← 翻 [2,3]</text>

  <!-- summary box -->
  <rect x="320" y="200" width="220" height="146" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="430" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">输出列表（3 个结果）</text>
  <text x="430" y="244" text-anchor="middle" font-size="10" fill="#555">[&quot;--++&quot;, &quot;+--+&quot;, &quot;++--&quot;]</text>
  <text x="334" y="270" font-size="10" fill="#555">⚠ 位置可以重叠：</text>
  <text x="334" y="286" font-size="10" fill="#555">&quot;+++&quot; 在 [0,1] 和 [1,2]</text>
  <text x="334" y="300" font-size="10" fill="#555">都能翻，是两步不同移动。</text>
  <text x="334" y="324" font-size="10" fill="#888">每个 i 独立尝试，不跳过 i+1。</text>
</svg>
