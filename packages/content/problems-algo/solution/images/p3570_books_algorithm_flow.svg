<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">算法流程：JOIN（只连未归还）→ GROUP BY → HAVING → SELECT → ORDER BY</text>

  <!-- Step 1 -->
  <rect x="130" y="38" width="300" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="57" text-anchor="middle" font-size="10.5" fill="#333">① FROM library_books b</text>
  <text x="440" y="57" font-size="8.5" fill="#888">书籍清单（含 total_copies）</text>

  <path d="M280 68 L280 84" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="130" y="88" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="105" text-anchor="middle" font-size="10" fill="#333">② JOIN borrowing_records r</text>
  <text x="280" y="121" text-anchor="middle" font-size="8.5" fill="#446688">ON b.book_id = r.book_id AND r.return_date IS NULL</text>
  <text x="440" y="112" font-size="8.5" fill="#b85450">只连「未归还」的行</text>

  <path d="M280 132 L280 148" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="130" y="152" width="300" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="167" text-anchor="middle" font-size="9" fill="#333">③ GROUP BY b.book_id, b.title, b.author,</text>
  <text x="280" y="182" text-anchor="middle" font-size="9" fill="#333">b.genre, b.publication_year, b.total_copies</text>
  <text x="440" y="171" font-size="8.5" fill="#888">按书分组</text>

  <path d="M280 190 L280 204" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 4: diamond -->
  <polygon points="280,204 445,238 280,272 115,238" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="233" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">④ COUNT(r.record_id) ≥ b.total_copies ?</text>
  <text x="280" y="249" text-anchor="middle" font-size="8.5" fill="#888">（可用副本 = 0 吗？）</text>

  <path d="M445 238 L500 238" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="462" y="231" font-size="9" fill="#b85450" font-weight="bold">否</text>
  <text x="505" y="255" text-anchor="middle" font-size="8.5" fill="#b85450">仍有可用副本 → 淘汰</text>

  <path d="M280 272 L280 290" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="292" y="286" font-size="9" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Step 5 -->
  <rect x="130" y="294" width="300" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="309" text-anchor="middle" font-size="9" fill="#333">⑤ SELECT book_id, title, author, genre,</text>
  <text x="280" y="324" text-anchor="middle" font-size="9" fill="#333">publication_year, COUNT(...) AS current_borrowers</text>

  <path d="M280 332 L280 346" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step 6 -->
  <rect x="130" y="350" width="300" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="369" text-anchor="middle" font-size="10" fill="#333">⑥ ORDER BY current_borrowers DESC, b.title ASC</text>

  <!-- Bottom annotations -->
  <text x="280" y="400" text-anchor="middle" font-size="9.5" fill="#555">例：book 1（3/3）、book 3（1/1）通过；book 2（2/3）在 ④ 被淘汰</text>
  <text x="280" y="420" text-anchor="middle" font-size="8.5" fill="#888">无未归还记录的书在 ② 连不上 → 天然满足「当前被借出」</text>
</svg>
