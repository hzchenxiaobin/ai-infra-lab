<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">示例演算：shortest(makes, coding)</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">words = [practice, makes, perfect, coding, makes]</text>

  <!-- position table -->
  <text x="40" y="70" font-size="11.5" fill="#555" font-weight="bold">构造阶段位置表：</text>

  <rect x="40" y="80" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="98" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">makes</text>
  <text x="128" y="98" font-size="12" fill="#888">→</text>
  <rect x="148" y="80" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="166" y="98" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">1</text>
  <rect x="186" y="80" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="204" y="98" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">4</text>
  <text x="232" y="98" font-size="10" fill="#446688">pos1</text>

  <rect x="300" y="80" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="98" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">coding</text>
  <text x="388" y="98" font-size="12" fill="#888">→</text>
  <rect x="408" y="80" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="426" y="98" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="452" y="98" font-size="10" fill="#4a7a3a">pos2</text>

  <!-- separator -->
  <line x1="40" y1="120" x2="520" y2="120" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- merge step header -->
  <text x="40" y="140" font-size="11.5" fill="#555" font-weight="bold">查询阶段双指针归并：</text>

  <!-- step table header -->
  <rect x="40" y="152" width="480" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="68" y="171" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">步</text>
  <text x="116" y="171" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">i</text>
  <text x="168" y="171" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">pos1[i]</text>
  <text x="228" y="171" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">j</text>
  <text x="280" y="171" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">pos2[j]</text>
  <text x="340" y="171" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">|差|</text>
  <text x="400" y="171" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">ans</text>
  <text x="478" y="171" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">移动</text>

  <!-- column dividers -->
  <line x1="88" y1="152" x2="88" y2="280" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="144" y1="152" x2="144" y2="280" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="196" y1="152" x2="196" y2="280" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="256" y1="152" x2="256" y2="280" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="308" y1="152" x2="308" y2="280" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="372" y1="152" x2="372" y2="280" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <line x1="428" y1="152" x2="428" y2="280" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 1: i=0,j=0, |1-3|=2, move i -->
  <rect x="40" y="180" width="480" height="32" fill="#e8f0fe" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="68" y="201" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="116" y="201" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="168" y="201" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="228" y="201" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="280" y="201" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="340" y="201" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="400" y="201" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="478" y="201" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">i++</text>

  <!-- row 2: i=1,j=0, |4-3|=1, move j -->
  <rect x="40" y="212" width="480" height="32" fill="#e6f4ea" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="68" y="233" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="116" y="233" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="168" y="233" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <text x="228" y="233" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="280" y="233" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="340" y="233" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="400" y="233" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="478" y="233" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">j++</text>

  <!-- row 3: j=1, loop ends -->
  <rect x="40" y="244" width="480" height="32" fill="#f6f6f6" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="68" y="265" text-anchor="middle" font-size="11" fill="#aaa">3</text>
  <text x="116" y="265" text-anchor="middle" font-size="11" fill="#aaa">1</text>
  <text x="168" y="265" text-anchor="middle" font-size="11" fill="#aaa">4</text>
  <text x="228" y="265" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="280" y="265" text-anchor="middle" font-size="11" fill="#ccc">越界</text>
  <text x="340" y="265" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="400" y="265" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="478" y="265" text-anchor="middle" font-size="10.5" fill="#888">结束</text>

  <!-- result -->
  <rect x="40" y="292" width="480" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="313" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">步 1：1&lt;3 移 i → 步 2：|4−3|=1 更新 ans → 步 3：j 越界终止</text>

  <!-- two pointer visual -->
  <text x="40" y="346" font-size="11" fill="#555" font-weight="bold">步 2 指针位置：</text>

  <!-- pos1 visual -->
  <text x="40" y="372" font-size="10.5" fill="#446688" font-weight="bold">pos1：</text>
  <rect x="90" y="358" width="50" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="115" y="377" text-anchor="middle" font-size="12" fill="#aaa">1</text>
  <rect x="144" y="358" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="169" y="377" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>
  <text x="169" y="402" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">↑i=1</text>

  <!-- pos2 visual -->
  <text x="260" y="372" font-size="10.5" fill="#4a7a3a" font-weight="bold">pos2：</text>
  <rect x="310" y="358" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="335" y="377" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="335" y="402" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">↑j=0</text>

  <!-- diff arrow -->
  <path d="M 335 348 L 335 342 L 169 342 L 169 348" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="252" y="338" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">|4 − 3| = 1 ✓ 最小</text>

  <!-- note -->
  <rect x="40" y="412" width="480" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="428" text-anchor="middle" font-size="10.5" fill="#555">4 &gt; 3 → 移动 j（若移 i 则差值更大，唯有移 j 才可能更优）</text>
</svg>
