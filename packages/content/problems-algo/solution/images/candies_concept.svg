<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">每堆切出 ⌊candies[i]/m⌋ 个大小为 m 的子堆，f(m) 关于 m 单调递减</text>

  <!-- ===== Piles row ===== -->
  <text x="40" y="52" font-size="12" fill="#888">糖果堆:</text>
  <line x1="80" y1="150" x2="300" y2="150" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- pile 5 -->
  <rect x="96" y="110" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="135" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <!-- pile 8 -->
  <rect x="160" y="78" width="44" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="182" y="118" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <!-- pile 6 -->
  <rect x="224" y="102" width="44" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="130" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>

  <text x="118" y="166" text-anchor="middle" font-size="10" fill="#999">c[0]</text>
  <text x="246" y="166" text-anchor="middle" font-size="10" fill="#999">c[2]</text>

  <!-- m=5 split annotation -->
  <text x="40" y="192" font-size="11" fill="#b85450" font-weight="bold">取 m = 5:</text>

  <!-- split pile 5 -> [5] -->
  <rect x="96" y="204" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="118" y="222" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <text x="118" y="244" text-anchor="middle" font-size="10" fill="#888">⌊5/5⌋=1</text>

  <!-- split pile 8 -> [5, 3] -->
  <rect x="160" y="204" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="182" y="222" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <rect x="160" y="232" width="44" height="16" fill="#f5f5f5" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="182" y="244" text-anchor="middle" font-size="9" fill="#999">余 3</text>
  <text x="182" y="262" text-anchor="middle" font-size="10" fill="#888">⌊8/5⌋=1</text>

  <!-- split pile 6 -> [5, 1] -->
  <rect x="224" y="204" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="246" y="222" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <rect x="224" y="232" width="44" height="16" fill="#f5f5f5" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="246" y="244" text-anchor="middle" font-size="9" fill="#999">余 1</text>
  <text x="246" y="262" text-anchor="middle" font-size="10" fill="#888">⌊6/5⌋=1</text>

  <!-- ===== Formula box ===== -->
  <rect x="332" y="92" width="208" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="436" y="116" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">给定每份数 m</text>
  <text x="436" y="138" text-anchor="middle" font-size="11" fill="#444">可分给的小孩数</text>
  <text x="436" y="162" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">f(m) = Σ ⌊ c[i] / m ⌋</text>

  <!-- arrow down -->
  <path d="M 280 280 L 280 298" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="292" font-size="11" fill="#888">m ↑ ⇒ f(m) ↓</text>

  <!-- ===== Monotonic curve ===== -->
  <line x1="80" y1="306" x2="80" y2="384" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="80" y1="384" x2="380" y2="384" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="312" text-anchor="end" font-size="10" fill="#888">f(m)</text>
  <text x="384" y="388" font-size="10" fill="#888">m →</text>

  <!-- decreasing curve -->
  <path d="M 92 318 C 150 330 220 356 370 376" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- k threshold line -->
  <line x1="80" y1="356" x2="380" y2="356" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="384" y="360" font-size="11" fill="#b85450" font-weight="bold">k = 3</text>

  <!-- answer point at m=5 -->
  <circle cx="232" cy="356" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="232" y1="356" x2="232" y2="384" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="232" y="398" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">m = 5</text>

  <text x="120" y="350" font-size="10" fill="#4a7a3a">可行 ✓ (f ≥ k)</text>
  <text x="298" y="372" font-size="10" fill="#b85450">太大 ✗</text>

  <!-- right summary note -->
  <rect x="392" y="318" width="150" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="467" y="340" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">求最大的 m</text>
  <text x="467" y="358" text-anchor="middle" font-size="11" fill="#666">使 f(m) ≥ k</text>
  <text x="467" y="376" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">单调 ⇒ 可二分！</text>
</svg>
