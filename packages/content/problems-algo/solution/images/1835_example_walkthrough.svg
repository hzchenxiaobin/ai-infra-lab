<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    示例演算：arr1 = [1,2,3], arr2 = [6,5]
  </text>

  <!-- ===== Input with binary ===== -->
  <rect x="40" y="40" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">
    arr1 = [1, 2, 3] = [001, 010, 011]   arr2 = [6, 5] = [110, 101]
  </text>

  <!-- separator -->
  <line x1="280" y1="84" x2="280" y2="400" stroke="#dddddd" stroke-width="1" stroke-dasharray="3 4" filter="url(#rough2)"/>

  <!-- ===== LEFT: brute force ===== -->
  <text x="140" y="100" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">暴力：枚举 6 个数对 AND</text>

  <!-- pair grid -->
  <rect x="50" y="110" width="180" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="127" text-anchor="middle" font-size="10" fill="#5a1a1a" filter="url(#rough2)">1&amp;6=0  1&amp;5=1  2&amp;6=2</text>

  <rect x="50" y="138" width="180" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="155" text-anchor="middle" font-size="10" fill="#5a1a1a" filter="url(#rough2)">2&amp;5=0  3&amp;6=2  3&amp;5=1</text>

  <text x="140" y="180" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">列表 = [0, 1, 2, 0, 2, 1]</text>

  <!-- XOR computation -->
  <rect x="50" y="192" width="180" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="210" text-anchor="middle" font-size="10" fill="#5a4a1a" filter="url(#rough2)">XOR 和 =</text>
  <text x="140" y="228" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">0^1^2^0^2^1 = 0</text>

  <!-- result -->
  <rect x="60" y="248" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="140" y="270" text-anchor="middle" font-size="12" fill="#2a4a1a" filter="url(#rough2)">结果 = 0 ✓</text>

  <!-- brute force cost -->
  <text x="140" y="300" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">O(n × m) = 3 × 2 = 6 次</text>
  <text x="140" y="314" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">每个数对都要算 AND</text>

  <!-- ===== RIGHT: optimal ===== -->
  <text x="420" y="100" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">最优：两次异或 + 一次与</text>

  <!-- XOR arr1 -->
  <rect x="330" y="110" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="420" y="128" text-anchor="middle" font-size="10" fill="#2a4a1a" filter="url(#rough2)">⊕ arr1 = 1 ^ 2 ^ 3</text>
  <text x="420" y="144" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">001^010^011 = 000 = 0</text>

  <!-- XOR arr2 -->
  <rect x="330" y="158" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="420" y="176" text-anchor="middle" font-size="10" fill="#2a4a1a" filter="url(#rough2)">⊕ arr2 = 6 ^ 5</text>
  <text x="420" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">110 ^ 101 = 011 = 3</text>

  <!-- AND -->
  <rect x="330" y="208" width="180" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="420" y="226" text-anchor="middle" font-size="10" fill="#5a4a1a" filter="url(#rough2)">x1 &amp; x2 = 0 &amp; 3</text>
  <text x="420" y="242" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">000 &amp; 011 = 000 = 0</text>

  <!-- result -->
  <rect x="340" y="258" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="420" y="280" text-anchor="middle" font-size="12" fill="#2a4a1a" filter="url(#rough2)">结果 = 0 ✓</text>

  <!-- optimal cost -->
  <text x="420" y="300" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">O(n + m) = 3 + 2 = 5 次</text>
  <text x="420" y="314" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">只算异或和，不枚举数对</text>

  <!-- ===== Bottom: why they match ===== -->
  <rect x="40" y="334" width="480" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="354" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    为什么两种方法结果一致？
  </text>
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#5a4a1a" filter="url(#rough2)">
    逐位看：bit k 的 XOR = (c1_k × c2_k) mod 2
  </text>
  <text x="280" y="388" text-anchor="middle" font-size="10" fill="#5a4a1a" filter="url(#rough2)">
    = (c1_k mod 2) &amp; (c2_k mod 2) = XOR(arr1)_k &amp; XOR(arr2)_k
  </text>
  <text x="280" y="400" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">
    每一位都相等 → 整体结果相等
  </text>
</svg>
