<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [-1,10,6,7,-7,1]，遍历维护 ans 全过程</text>

  <!-- nums array -->
  <text x="40" y="56" font-size="11" fill="#888">nums</text>
  <rect x="80" y="40" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="99" y="63" text-anchor="middle" font-size="14" fill="#333">-1</text>
  <rect x="118" y="40" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="137" y="63" text-anchor="middle" font-size="14" fill="#333">10</text>
  <rect x="156" y="40" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="175" y="63" text-anchor="middle" font-size="14" fill="#333">6</text>
  <rect x="194" y="40" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="213" y="63" text-anchor="middle" font-size="14" fill="#333">7</text>
  <rect x="232" y="40" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="251" y="63" text-anchor="middle" font-size="14" fill="#333">-7</text>
  <rect x="270" y="40" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="289" y="63" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="324" y="56" font-size="10" fill="#888">→ seen = {-7,-1,1,6,7,10}</text>

  <!-- Arrow -->
  <path d="M 270 82 L 270 100" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="280" y="95" font-size="11" fill="#446688">初值 ans = -1；按下表只扫描正数（非正数直接跳过）</text>

  <!-- Scan table header -->
  <rect x="40" y="106" width="460" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="90" y="125" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">遍历 x</text>
  <text x="230" y="125" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">-x ∈ seen?</text>
  <text x="360" y="125" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">命中?</text>
  <text x="450" y="125" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">更新后 ans</text>
  <path d="M 150 106 L 150 262" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M 320 106 L 320 262" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M 400 106 L 400 262" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- Row 1: 10 miss -->
  <rect x="40" y="134" width="460" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="155" text-anchor="middle" font-size="12" fill="#333">10</text>
  <text x="230" y="155" text-anchor="middle" font-size="11.5" fill="#888">-10 ∈ seen? 否</text>
  <text x="360" y="155" text-anchor="middle" font-size="12" fill="#b85450">✗</text>
  <text x="450" y="155" text-anchor="middle" font-size="12" fill="#888">-1</text>

  <!-- Row 2: 6 miss -->
  <rect x="40" y="166" width="460" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="187" text-anchor="middle" font-size="12" fill="#333">6</text>
  <text x="230" y="187" text-anchor="middle" font-size="11.5" fill="#888">-6 ∈ seen? 否</text>
  <text x="360" y="187" text-anchor="middle" font-size="12" fill="#b85450">✗</text>
  <text x="450" y="187" text-anchor="middle" font-size="12" fill="#888">-1</text>

  <!-- Row 3: 7 hit + update -->
  <rect x="40" y="198" width="460" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="219" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="230" y="219" text-anchor="middle" font-size="11.5" fill="#4a7a3a">-7 ∈ seen? 是 ✓</text>
  <text x="360" y="219" text-anchor="middle" font-size="12" fill="#4a7a3a">✓</text>
  <text x="450" y="219" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">7</text>

  <!-- Row 4: 1 hit no change -->
  <rect x="40" y="230" width="460" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="251" text-anchor="middle" font-size="12" fill="#d6a040">1</text>
  <text x="230" y="251" text-anchor="middle" font-size="11.5" fill="#d6a040">-1 ∈ seen? 是 ✓</text>
  <text x="360" y="251" text-anchor="middle" font-size="12" fill="#d6a040">✓</text>
  <text x="450" y="251" text-anchor="middle" font-size="10.5" fill="#d6a040">max(7,1)=7</text>

  <!-- Arrow to result -->
  <path d="M 270 262 L 270 282" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="280" y="277" font-size="11" fill="#4a7a3a">扫描完毕，命中正数 {7, 1}，取最大 → 7</text>

  <!-- Result -->
  <rect x="150" y="286" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="314" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">ans = 7 ✓</text>

  <!-- Notes -->
  <text x="40" y="346" font-size="10.5" fill="#888">• 仅扫描正数：非正数（-1, -7）不可能是答案 k &gt; 0，直接跳过</text>
  <text x="40" y="364" font-size="10.5" fill="#888">• 命中即 max 维护：遍历顺序无关，最终总得「有相反数的最大正数」</text>
  <text x="40" y="382" font-size="10.5" fill="#888">• 无任何命中时 ans 保持 -1 兜底返回（见示例 3）</text>
</svg>
