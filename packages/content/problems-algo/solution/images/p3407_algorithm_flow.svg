<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="290" y="20" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">流程：切分 → 两次带失败短路的 find</text>

  <!-- 左列三张边界卡 -->
  <rect x="16" y="56" width="130" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="81" y="74" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">边界①：pre 为空</text>
  <text x="81" y="90" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">p 形如 "*x"：find("") = 0</text>
  <text x="81" y="104" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">等价于 suf in s</text>

  <rect x="16" y="122" width="130" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="81" y="140" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">边界②：suf 为空</text>
  <text x="81" y="156" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">p 形如 "x*"：find("") 恒命中</text>
  <text x="81" y="170" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">退化为 pre in s</text>

  <rect x="16" y="188" width="130" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="81" y="206" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">'*' 可匹配空串</text>
  <text x="81" y="222" text-anchor="middle" font-size="8.5" fill="#a07830" filter="url(#rough2)">suf 可紧贴 pre 之后</text>
  <text x="81" y="236" text-anchor="middle" font-size="8.5" fill="#a07830" filter="url(#rough2)">起点 = i + L1（不加 1）</text>

  <rect x="16" y="254" width="130" height="58" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="81" y="272" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">find 是黑盒</text>
  <text x="81" y="288" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">n, m ≤ 50 随便跑</text>
  <text x="81" y="302" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">数据放大换 KMP / Z 仍线性</text>

  <!-- 主干 -->
  <ellipse cx="310" cy="40" rx="58" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="45" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">输入 s, p</text>

  <path d="M 310 56 L 310 66" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="220" y="70" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="310" y="89" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">在 '*' 处切分：pre、suf</text>

  <path d="M 310 100 L 310 112" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 310 114 L 402 152 L 310 190 L 218 152 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="149" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">i = s.find(pre)</text>
  <text x="310" y="164" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">≠ −1 ？</text>

  <path d="M 310 190 L 310 202" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="318" y="200" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="220" y="206" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="310" y="225" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">j = s.find(suf, i + L1)</text>

  <path d="M 310 236 L 310 246" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 310 248 L 402 286 L 310 322 L 218 286 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="283" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">j = s.find(suf, …)</text>
  <text x="310" y="298" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">≠ −1 ？</text>

  <path d="M 310 322 L 310 330" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="318" y="330" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>

  <ellipse cx="310" cy="344" rx="58" ry="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="349" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">return true</text>

  <!-- 两个否分支汇入同一个 false -->
  <rect x="438" y="206" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="473" y="225" text-anchor="middle" font-size="10" fill="#8a3833" font-weight="bold" filter="url(#rough2)">false</text>

  <path d="M 402 152 C 442 152, 473 172, 473 204" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="432" y="146" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <path d="M 402 286 C 442 286, 473 264, 473 240" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="432" y="298" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <text x="290" y="358" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">两次 find 一早一晚、顺序不可换：先定位 pre 首现，再从其右侧找 suf</text>
</svg>
