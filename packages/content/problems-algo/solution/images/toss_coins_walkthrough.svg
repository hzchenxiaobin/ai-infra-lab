<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：prob=[0.4,0.6,0.5,0.3], target=2</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">每枚硬币后逆序更新 dp，最终 dp[2] = 0.38</text>

  <!-- ===== Table header ===== -->
  <g font-size="10" fill="#888" font-weight="bold">
    <text x="115" y="72" text-anchor="middle">硬币</text>
    <text x="160" y="72" text-anchor="middle">p</text>
    <text x="225" y="72" text-anchor="middle">dp[0]</text>
    <text x="305" y="72" text-anchor="middle">dp[1]</text>
    <text x="385" y="72" text-anchor="middle">dp[2]</text>
  </g>

  <!-- ===== Row: init ===== -->
  <g>
    <rect x="95" y="78" width="40" height="32" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="115" y="99" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">init</text>
    <rect x="135" y="78" width="50" height="32" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="160" y="99" text-anchor="middle" font-size="11" fill="#888">—</text>
    <rect x="185" y="78" width="80" height="32" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="225" y="99" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">1.0</text>
    <rect x="265" y="78" width="80" height="32" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="305" y="99" text-anchor="middle" font-size="11" fill="#888">0</text>
    <rect x="345" y="78" width="80" height="32" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="385" y="99" text-anchor="middle" font-size="11" fill="#888">0</text>
  </g>

  <!-- ===== Row: coin 0 (p=0.4) ===== -->
  <g>
    <rect x="95" y="110" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="115" y="131" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
    <rect x="135" y="110" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="160" y="131" text-anchor="middle" font-size="11" fill="#446688">0.4</text>
    <rect x="185" y="110" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="225" y="131" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0.6</text>
    <rect x="265" y="110" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="305" y="131" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0.4</text>
    <rect x="345" y="110" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="385" y="131" text-anchor="middle" font-size="11" fill="#446688">0</text>
  </g>

  <!-- ===== Row: coin 1 (p=0.6) ===== -->
  <g>
    <rect x="95" y="142" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="115" y="163" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="135" y="142" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="160" y="163" text-anchor="middle" font-size="11" fill="#4a7a3a">0.6</text>
    <rect x="185" y="142" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="225" y="163" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0.24</text>
    <rect x="265" y="142" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="305" y="163" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0.52</text>
    <rect x="345" y="142" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="385" y="163" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0.24</text>
  </g>

  <!-- ===== Row: coin 2 (p=0.5) ===== -->
  <g>
    <rect x="95" y="174" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="115" y="195" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
    <rect x="135" y="174" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="160" y="195" text-anchor="middle" font-size="11" fill="#d6a040">0.5</text>
    <rect x="185" y="174" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="225" y="195" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0.12</text>
    <rect x="265" y="174" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="305" y="195" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0.38</text>
    <rect x="345" y="174" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="385" y="195" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0.38</text>
  </g>

  <!-- ===== Row: coin 3 (p=0.3) — answer ===== -->
  <g>
    <rect x="95" y="206" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="115" y="227" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
    <rect x="135" y="206" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="160" y="227" text-anchor="middle" font-size="11" fill="#b85450">0.3</text>
    <rect x="185" y="206" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="225" y="227" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0.084</text>
    <rect x="265" y="206" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="305" y="227" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0.302</text>
    <rect x="345" y="206" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
    <text x="385" y="227" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0.38</text>
  </g>

  <!-- ===== Legend ===== -->
  <rect x="95" y="250" width="330" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="9" fill="#555">dp[j] = dp[j−1]·p + dp[j]·(1−p)，逆序 j 保证读到旧值</text>

  <!-- ===== Result note ===== -->
  <rect x="95" y="288" width="330" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">答案 dp[2] = 0.38</text>
  <text x="260" y="326" text-anchor="middle" font-size="9" fill="#888">6 种「恰好 2 个正面」的组合概率之和 = 0.38</text>
</svg>
