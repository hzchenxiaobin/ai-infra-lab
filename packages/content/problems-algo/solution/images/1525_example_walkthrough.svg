<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：s = "aacaba"</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">枚举 5 个分割点，比较左右不同字符数</text>

  <!-- ===== 表头 ===== -->
  <g font-size="11">
    <rect x="30" y="58" width="50" height="26" fill="#f5f5f5" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="55" y="75" text-anchor="middle" fill="#666" font-weight="bold">i</text>

    <rect x="84" y="58" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="129" y="75" text-anchor="middle" fill="#446688" font-weight="bold">左 p</text>

    <rect x="178" y="58" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="223" y="75" text-anchor="middle" fill="#4a7a3a" font-weight="bold">右 q</text>

    <rect x="272" y="58" width="70" height="26" fill="#f5f5f5" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="307" y="75" text-anchor="middle" fill="#666" font-weight="bold">左不同数</text>

    <rect x="346" y="58" width="70" height="26" fill="#f5f5f5" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="381" y="75" text-anchor="middle" fill="#666" font-weight="bold">右不同数</text>

    <rect x="420" y="58" width="70" height="26" fill="#f5f5f5" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="455" y="75" text-anchor="middle" fill="#666" font-weight="bold">好分割?</text>
  </g>

  <!-- ===== 数据行 ===== -->
  <!-- Row 1: i=1 -->
  <g font-size="11">
    <rect x="30" y="88" width="50" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="55" y="108" text-anchor="middle" fill="#333">1</text>
    <rect x="84" y="88" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="129" y="108" text-anchor="middle" fill="#333">a</text>
    <rect x="178" y="88" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="223" y="108" text-anchor="middle" fill="#333">acaba</text>
    <rect x="272" y="88" width="70" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="307" y="108" text-anchor="middle" fill="#333">1</text>
    <rect x="346" y="88" width="70" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="381" y="108" text-anchor="middle" fill="#333">3</text>
    <rect x="420" y="88" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="455" y="108" text-anchor="middle" fill="#b85450" font-weight="bold">✗</text>
  </g>

  <!-- Row 2: i=2 -->
  <g font-size="11">
    <rect x="30" y="120" width="50" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="55" y="140" text-anchor="middle" fill="#333">2</text>
    <rect x="84" y="120" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="129" y="140" text-anchor="middle" fill="#333">aa</text>
    <rect x="178" y="120" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="223" y="140" text-anchor="middle" fill="#333">caba</text>
    <rect x="272" y="120" width="70" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="307" y="140" text-anchor="middle" fill="#333">1</text>
    <rect x="346" y="120" width="70" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="381" y="140" text-anchor="middle" fill="#333">3</text>
    <rect x="420" y="120" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="455" y="140" text-anchor="middle" fill="#b85450" font-weight="bold">✗</text>
  </g>

  <!-- Row 3: i=3 GOOD -->
  <g font-size="11">
    <rect x="30" y="152" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="55" y="172" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="84" y="152" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="129" y="172" text-anchor="middle" fill="#333">aac</text>
    <rect x="178" y="152" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="223" y="172" text-anchor="middle" fill="#333">aba</text>
    <rect x="272" y="152" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="307" y="172" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="346" y="152" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="381" y="172" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="420" y="152" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="455" y="172" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
  </g>

  <!-- Row 4: i=4 GOOD -->
  <g font-size="11">
    <rect x="30" y="184" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="55" y="204" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <rect x="84" y="184" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="129" y="204" text-anchor="middle" fill="#333">aaca</text>
    <rect x="178" y="184" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="223" y="204" text-anchor="middle" fill="#333">ba</text>
    <rect x="272" y="184" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="307" y="204" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="346" y="184" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="381" y="204" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="420" y="184" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="455" y="204" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
  </g>

  <!-- Row 5: i=5 -->
  <g font-size="11">
    <rect x="30" y="216" width="50" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="55" y="236" text-anchor="middle" fill="#333">5</text>
    <rect x="84" y="216" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="129" y="236" text-anchor="middle" fill="#333">aacab</text>
    <rect x="178" y="216" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="223" y="236" text-anchor="middle" fill="#333">a</text>
    <rect x="272" y="216" width="70" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="307" y="236" text-anchor="middle" fill="#333">3</text>
    <rect x="346" y="216" width="70" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="381" y="236" text-anchor="middle" fill="#333">1</text>
    <rect x="420" y="216" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="455" y="236" text-anchor="middle" fill="#b85450" font-weight="bold">✗</text>
  </g>

  <!-- ===== 位掩码演示 ===== -->
  <text x="30" y="276" font-size="11" fill="#666" font-weight="bold">位掩码视角（26 bit，a=bit0 … z=bit25）：</text>

  <g font-size="11">
    <rect x="30" y="288" width="460" height="30" fill="#f5f5f5" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="40" y="308" fill="#446688" font-weight="bold">i=3:</text>
    <text x="80" y="308" fill="#333">leftMask = {a,c} = 0b101 → popcount = 2</text>
    <text x="300" y="308" fill="#4a7a3a">rightMask = {a,b} = 0b011 → popcount = 2</text>
  </g>

  <!-- ===== 结论框 ===== -->
  <rect x="30" y="332" width="460" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="355" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">好分割数 = 2（i=3 与 i=4）</text>
</svg>
