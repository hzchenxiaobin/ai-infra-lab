<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 → 定界 → 求和 → 取均值</text>

  <!-- Step 1: sort -->
  <rect x="160" y="44" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 升序排序 arr</text>
  <text x="260" y="76" text-anchor="middle" font-size="10" fill="#888">sort(arr.begin(), arr.end())</text>

  <path d="M 260 88 L 260 104" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: compute m -->
  <rect x="160" y="110" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="128" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">② 计算去除量 m</text>
  <text x="260" y="142" text-anchor="middle" font-size="10" fill="#888">m = n / 20 （n 是 20 的倍数）</text>

  <path d="M 260 154 L 260 170" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: sum middle -->
  <rect x="120" y="176" width="280" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">③ 累加中间段 arr[m .. n−m−1]</text>
  <text x="260" y="212" text-anchor="middle" font-size="10" fill="#888">for i in [m, n−m): sum += arr[i]</text>

  <path d="M 260 226 L 260 242" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: mean -->
  <rect x="120" y="248" width="280" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">④ 均值 = sum / (n − 2m)</text>
  <text x="260" y="284" text-anchor="middle" font-size="10" fill="#888">返回 double，避免整数除法</text>

  <!-- Side note: pitfalls -->
  <rect x="40" y="310" width="440" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">⚠️ 两个易错点</text>
  <line x1="60" y1="338" x2="460" y2="338" stroke="#d6a040" stroke-width="0.6" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="60" y="354" text-anchor="start" font-size="10" fill="#555">1. 去除两端各 m 个 → 累加区间是 [m, n−m)，长度 n−2m</text>
  <text x="60" y="372" text-anchor="start" font-size="10" fill="#555">2. C++ 用 double 累加或先 sum 后除，避免 int / int 截断</text>
</svg>
