<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 690"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#555" stroke-width="1.8" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="560" height="690" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：可行性判定 + 每日贪心构造</text>

  <rect x="190" y="36" width="180" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e4d24" filter="url(#rough2)">输入 n 支队伍</text>

  <path d="M 280 68 L 280 84" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,88 360,128 280,168 200,128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="133" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5c10" filter="url(#rough2)">n &lt; 5 ?</text>
  <text x="368" y="118" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 360 128 L 396 128" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="400" y="110" width="142" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="471" y="133" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回空数组 []</text>
  <text x="290" y="184" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">否</text>
  <path d="M 280 168 L 280 186" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="190" width="360" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="209" text-anchor="middle" font-size="12" fill="#2c4257" filter="url(#rough2)">初始化 remaining[t] = 2(n−1)（每队）</text>
  <text x="280" y="227" text-anchor="middle" font-size="12" fill="#2c4257" filter="url(#rough2)">rem[a][b] = 1 (a ≠ b)，last = ∅</text>

  <path d="M 280 236 L 280 252" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="250" font-size="11" fill="#888" filter="url(#rough2)">循环 n(n−1) 天</text>

  <rect x="100" y="256" width="360" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="12" fill="#2c4257" filter="url(#rough2)">收集候选对阵</text>
  <text x="280" y="291" text-anchor="middle" font-size="11.5" fill="#2c4257" filter="url(#rough2)">C = { (a,b) : a, b ∉ last 且 rem[a][b] = 1 }</text>

  <path d="M 280 300 L 280 312" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,316 360,356 280,396 200,356" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="361" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5c10" filter="url(#rough2)">C = ∅ ?</text>
  <text x="368" y="346" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 360 356 L 396 356" fill="none" stroke="#555" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="400" y="332" width="148" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="474" y="351" text-anchor="middle" font-size="11" fill="#7a5c10" filter="url(#rough2)">死路 → 重启贪心</text>
  <text x="474" y="368" text-anchor="middle" font-size="11" fill="#7a5c10" filter="url(#rough2)">换并列打破（n≥5 不触发）</text>
  <text x="290" y="412" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">否</text>
  <path d="M 280 396 L 280 412" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="416" width="360" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="440" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5c10" filter="url(#rough2)">取 remaining[a]+remaining[b] 最大的 (a,b) ∈ C</text>

  <path d="M 280 454 L 280 468" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="88" y="472" width="384" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="492" text-anchor="middle" font-size="12" fill="#2c4257" filter="url(#rough2)">schedule.push({a,b})</text>
  <text x="280" y="511" text-anchor="middle" font-size="11.5" fill="#2c4257" filter="url(#rough2)">rem[a][b]=0；remaining[a]−−、remaining[b]−−；last = {a,b}</text>

  <path d="M 280 526 L 280 540" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,544 370,582 280,620 190,582" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="587" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5c10" filter="url(#rough2)">全部天数排完 ?</text>
  <text x="124" y="572" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">否，下一天</text>
  <path d="M 190 582 L 52 582 L 52 278 L 96 278" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="636" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">是</text>
  <path d="M 280 620 L 280 638" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="195" y="642" width="170" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="664" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e4d24" filter="url(#rough2)">返回 schedule</text>
</svg>
