<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：intervals = [[0,30],[5,10],[15,20]]</text>

  <!-- step 0: sort -->
  <text x="36" y="58" font-size="12" fill="#7a5415" font-weight="bold">① 排序后</text>
  <g filter="url(#rough2)">
    <rect x="36" y="66" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="96" y="84" text-anchor="middle" font-size="11" fill="#333">[0, 30]</text>
    <rect x="160" y="66" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="220" y="84" text-anchor="middle" font-size="11" fill="#333">[5, 10]</text>
    <rect x="284" y="66" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="344" y="84" text-anchor="middle" font-size="11" fill="#333">[15, 20]</text>
  </g>

  <!-- step 1: i=1, compare [0,30] vs [5,10] -->
  <text x="36" y="120" font-size="12" fill="#7a5415" font-weight="bold">② i=1：B.start(5) vs A.end(30)</text>
  <g filter="url(#rough2)">
    <rect x="36" y="128" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="96" y="146" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">prev_end=30</text>
    <rect x="160" y="128" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="220" y="146" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">start=5</text>
  </g>
  <text x="300" y="146" font-size="12" fill="#b85450" font-weight="bold">5 &lt; 30 → 冲突!</text>
  <rect x="430" y="128" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="490" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return false</text>

  <path d="M 490 154 L 490 178" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr3)" filter="url(#rough2)"/>

  <!-- step 2: i=2, compare [5,10] vs [15,20] (would run if no early return) -->
  <text x="36" y="200" font-size="12" fill="#4a7a3a" font-weight="bold">③ i=2：C.start(15) vs B.end(10)（若继续）</text>
  <g filter="url(#rough2)">
    <rect x="36" y="208" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="96" y="226" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">prev_end=10</text>
    <rect x="160" y="208" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="220" y="226" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">start=15</text>
  </g>
  <text x="300" y="226" font-size="12" fill="#4a7a3a" font-weight="bold">15 ≥ 10 → OK</text>
  <rect x="430" y="208" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="490" y="226" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">prev_end=20</text>

  <!-- second example: true -->
  <text x="36" y="276" font-size="12" fill="#7a5415" font-weight="bold">对照：intervals = [[7,10],[2,4]] → 排序 [[2,4],[7,10]]</text>
  <g filter="url(#rough2)">
    <rect x="36" y="284" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="96" y="302" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[2, 4]</text>
    <rect x="160" y="284" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="220" y="302" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[7, 10]</text>
  </g>
  <text x="300" y="302" font-size="12" fill="#4a7a3a" font-weight="bold">7 ≥ 4 → 无冲突</text>
  <rect x="430" y="284" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="490" y="302" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return true</text>

  <!-- summary box -->
  <rect x="32" y="332" width="496" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="48" y="354" font-size="12" fill="#7a5415" font-weight="bold">规律：发现任意一对相邻会议 start &lt; prev_end 即可立即返回 false（提前终止）。</text>
  <text x="48" y="372" font-size="11" fill="#444">全遍历完无冲突才返回 true。半开区间用 ≥ 而非 &gt;：[5,10] 与 [10,15] 不算冲突。</text>
</svg>
