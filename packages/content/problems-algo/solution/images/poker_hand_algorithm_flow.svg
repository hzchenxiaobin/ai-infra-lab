<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建两张频次表 → 优先级级联判定</text>

  <!-- Input -->
  <rect x="150" y="42" width="260" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输入：ranks[5], suits[5]</text>
  <text x="280" y="76" text-anchor="middle" font-size="10.5" fill="#888">如 ranks=[4,4,2,4,4], suits=[d,a,a,b,c]</text>

  <path d="M 280 86 L 280 104" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 1: build freq tables -->
  <rect x="80" y="108" width="400" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">① 一遍循环建两张频次表</text>
  <text x="280" y="150" text-anchor="middle" font-size="11" fill="#333">s[suit]++ 滚动维护 m_s； r[rank]++ 滚动维护 m_r</text>
  <text x="280" y="166" text-anchor="middle" font-size="10.5" fill="#888">两维度正交，同趟并行处理：m_s=1, m_r=4</text>

  <path d="M 280 176 L 280 194" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision 1: Flush diamond -->
  <path d="M 280 198 L 380 232 L 280 266 L 180 232 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="228" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">m_s == 5 ?</text>
  <text x="280" y="244" text-anchor="middle" font-size="10" fill="#888">同花？</text>

  <!-- Yes branch -->
  <path d="M 380 232 L 430 232" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="398" y="226" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="430" y="216" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="485" y="237" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">"Flush"</text>

  <!-- No branch down -->
  <path d="M 280 266 L 280 284" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="296" y="280" font-size="10.5" fill="#b85450" font-weight="bold">否</text>

  <!-- Decision 2: Three of a Kind diamond -->
  <path d="M 280 288 L 380 322 L 280 356 L 180 322 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">m_r ≥ 3 ?</text>
  <text x="280" y="334" text-anchor="middle" font-size="10" fill="#888">三条？</text>

  <!-- Yes branch -->
  <path d="M 380 322 L 430 322" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="398" y="316" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="430" y="306" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="485" y="327" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">"Three of a Kind"</text>

  <!-- No branch down -->
  <path d="M 280 356 L 280 374" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="296" y="370" font-size="10.5" fill="#b85450" font-weight="bold">否</text>

  <!-- Decision 3: Pair diamond -->
  <path d="M 280 378 L 360 406 L 280 434 L 200 406 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="404" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">m_r ≥ 2 ?</text>

  <path d="M 360 406 L 408 406" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="382" y="400" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="408" y="392" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="458" y="411" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"Pair"</text>

  <path d="M 200 406 L 150 406" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="176" y="400" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="30" y="392" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="90" y="411" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">"High Card"</text>

  <!-- Notes -->
  <text x="40" y="452" font-size="10.5" fill="#888">注：阈值用 ≥（非 =），四条 m_r=4、葫芦 3+2 均被 m_r≥3 吸收进「三条」</text>
</svg>
