<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 10，isPrime 数组的演变</text>

  <!-- helper macro not available; inline each row -->

  <!-- Row 1: initial. y=58 -->
  <text x="30" y="82" font-size="12" fill="#888" font-weight="bold">初始</text>
  <!-- 0,1 grey -->
  <rect x="60" y="64" width="44" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="86" text-anchor="middle" font-size="13" fill="#888">0</text>
  <rect x="110" y="64" width="44" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="132" y="86" text-anchor="middle" font-size="13" fill="#888">1</text>
  <!-- 2..9 green -->
  <rect x="160" y="64" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="210" y="64" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="260" y="64" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="310" y="64" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="360" y="64" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="382" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="410" y="64" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="460" y="64" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="482" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <rect x="510" y="64" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="532" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>

  <text x="566" y="86" font-size="11" fill="#888">下标 0,1 先置 false</text>

  <!-- arrow down + annotation -->
  <text x="160" y="118" font-size="11.5" fill="#d6a040" font-weight="bold">↓ i=2 是质数 → 划掉 2×2=4、6、8</text>

  <!-- Row 2: after i=2. y=128 -->
  <text x="30" y="152" font-size="12" fill="#888" font-weight="bold">i=2 后</text>
  <rect x="60" y="134" width="44" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="156" text-anchor="middle" font-size="13" fill="#888">0</text>
  <rect x="110" y="134" width="44" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="132" y="156" text-anchor="middle" font-size="13" fill="#888">1</text>
  <rect x="160" y="134" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="156" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="210" y="134" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="156" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <!-- 4 red -->
  <rect x="260" y="134" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="262" y1="166" x2="302" y2="136" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="282" y="156" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>
  <rect x="310" y="134" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="156" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <!-- 6 red -->
  <rect x="360" y="134" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="362" y1="166" x2="402" y2="136" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="382" y="156" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">6</text>
  <rect x="410" y="134" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="156" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <!-- 8 red -->
  <rect x="460" y="134" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="462" y1="166" x2="502" y2="136" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="482" y="156" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">8</text>
  <rect x="510" y="134" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="532" y="156" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>

  <text x="160" y="188" font-size="11.5" fill="#d6a040" font-weight="bold">↓ i=3 是质数 → 划掉 3×3=9（6 已划过）</text>

  <!-- Row 3: after i=3. y=198 -->
  <text x="30" y="222" font-size="12" fill="#888" font-weight="bold">i=3 后</text>
  <rect x="60" y="204" width="44" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="226" text-anchor="middle" font-size="13" fill="#888">0</text>
  <rect x="110" y="204" width="44" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="132" y="226" text-anchor="middle" font-size="13" fill="#888">1</text>
  <rect x="160" y="204" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="226" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="210" y="204" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="226" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="260" y="204" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="262" y1="236" x2="302" y2="206" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="282" y="226" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>
  <rect x="310" y="204" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="226" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="360" y="204" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="362" y1="236" x2="402" y2="206" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="382" y="226" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">6</text>
  <rect x="410" y="204" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="226" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="460" y="204" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="462" y1="236" x2="502" y2="206" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="482" y="226" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">8</text>
  <!-- 9 red now -->
  <rect x="510" y="204" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="512" y1="236" x2="552" y2="206" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="532" y="226" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">9</text>

  <text x="160" y="258" font-size="11.5" fill="#888">i=4：4×4=16 ≥ 10，外层结束。</text>

  <!-- legend -->
  <rect x="60" y="276" width="20" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="88" y="289" font-size="11" fill="#333">true（质数候选）</text>
  <rect x="210" y="276" width="20" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="238" y="289" font-size="11" fill="#333">false（合数 / 已划掉）</text>
  <rect x="380" y="276" width="20" height="16" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="408" y="289" font-size="11" fill="#333">0、1（非质数，预设 false）</text>

  <!-- result -->
  <rect x="60" y="320" width="500" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="342" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">剩余 true 的下标：2, 3, 5, 7 → 即小于 10 的全部质数</text>
  <text x="310" y="360" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">返回 4 ⭐</text>
</svg>
