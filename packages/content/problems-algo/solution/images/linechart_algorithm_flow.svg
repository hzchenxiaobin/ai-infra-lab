<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：排序 → 一趟扫描统计“斜率变化次数”</text>

  <!-- 1. sort -->
  <rect x="180" y="44" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="65" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 按 day 升序排序</text>
  <path d="M 270 80 L 270 98" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. decision n<=1 -->
  <polygon points="270,100 380,140 270,180 160,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="136" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">n ≤ 1 ?</text>
  <text x="270" y="152" text-anchor="middle" font-size="10" fill="#888">点数 ≤ 1</text>
  <!-- yes branch -> return 0 -->
  <path d="M 160 140 L 100 140 L 100 176" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="120" y="132" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="56" y="178" width="88" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="100" y="197" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">返回 0</text>
  <!-- no branch down -->
  <path d="M 270 180 L 270 200" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="194" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- 3. init -->
  <rect x="160" y="204" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="221" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">② ans = 1</text>
  <text x="270" y="237" text-anchor="middle" font-size="10.5" fill="#446688">记录前一对方向 (px,py)=P[1]−P[0]</text>
  <path d="M 270 246 L 270 264" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. loop header -->
  <rect x="160" y="268" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="289" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">③ 循环 i = 2 … n−1</text>
  <path d="M 270 304 L 270 322" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. compute direction -->
  <rect x="150" y="326" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="347" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④ (dx,dy) = P[i] − P[i−1]</text>
  <path d="M 270 362 L 270 378" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 6. decision: cross product equal? -->
  <polygon points="270,380 400,420 270,460 140,420" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="416" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dy·px == py·dx ?</text>
  <text x="270" y="432" text-anchor="middle" font-size="9.5" fill="#888">叉积判共线</text>

  <!-- no branch -> ans++ then loop back right side -->
  <path d="M 400 420 L 470 420 L 470 285 L 384 285" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="416" y="412" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="410" y="352" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="470" y="368" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans++</text>
  <text x="470" y="380" text-anchor="middle" font-size="9.5" fill="#b85450">px,py ← dx,dy</text>

  <!-- yes branch -> loop back left side -->
  <path d="M 140 420 L 70 420 L 70 285 L 156 285" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="108" y="412" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- loop exits when i &gt; n-1 -> return ans -->
  <rect x="210" y="470" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="491" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">⑤ 返回 ans</text>
  <text x="392" y="488" font-size="9.5" fill="#888">i 超 n−1 时跳出</text>
</svg>
