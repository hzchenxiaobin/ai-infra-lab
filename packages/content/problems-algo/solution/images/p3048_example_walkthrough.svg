<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1：x = 8 的 check 全过程</text>
  <text x="260" y="50" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">last：下标1→秒8，下标2→秒7，下标3→秒5（按 t 升序处理）</text>

  <!-- 表头 -->
  <rect x="20" y="64" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="66" y="64" width="76" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="142" y="64" width="72" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="214" y="64" width="76" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="290" y="64" width="66" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="356" y="64" width="76" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="432" y="64" width="66" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="43" y="85" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">j</text>
  <text x="104" y="85" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">标记下标</text>
  <text x="178" y="85" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">tⱼ</text>
  <text x="252" y="85" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">nums[i]</text>
  <text x="323" y="85" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">Sⱼ</text>
  <text x="394" y="85" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">tⱼ − j</text>
  <text x="465" y="85" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">判定</text>

  <!-- 行 1 -->
  <rect x="20" y="96" width="46" height="36" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="66" y="96" width="76" height="36" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="142" y="96" width="72" height="36" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="214" y="96" width="76" height="36" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="290" y="96" width="66" height="36" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="356" y="96" width="76" height="36" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="432" y="96" width="66" height="36" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="43" y="119" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="104" y="119" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="178" y="119" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="252" y="119" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="323" y="119" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="394" y="119" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="465" y="119" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- 行 2 -->
  <rect x="20" y="132" width="46" height="36" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="66" y="132" width="76" height="36" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="142" y="132" width="72" height="36" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="214" y="132" width="76" height="36" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="290" y="132" width="66" height="36" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="356" y="132" width="76" height="36" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="432" y="132" width="66" height="36" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="43" y="155" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="104" y="155" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="178" y="155" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="252" y="155" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="323" y="155" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="394" y="155" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="465" y="155" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- 行 3 -->
  <rect x="20" y="168" width="46" height="36" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="66" y="168" width="76" height="36" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="142" y="168" width="72" height="36" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="214" y="168" width="76" height="36" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="290" y="168" width="66" height="36" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="356" y="168" width="76" height="36" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="432" y="168" width="66" height="36" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="43" y="191" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="104" y="191" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="178" y="191" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <text x="252" y="191" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="323" y="191" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="394" y="191" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="465" y="191" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="36" y="226" width="448" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="248" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">二分向左收缩：check(7) 呢？</text>
  <text x="52" y="268" font-size="12" fill="#333" filter="url(#rough2)">下标 1 在前 7 秒从未出现 → last = −1 → false，故 7 秒不够</text>

  <rect x="36" y="294" width="448" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="315" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最小可行 x = 8</text>
  <text x="52" y="333" font-size="12" fill="#333" filter="url(#rough2)">即最早第 8 秒标记全部下标，与官方答案一致</text>
</svg>
