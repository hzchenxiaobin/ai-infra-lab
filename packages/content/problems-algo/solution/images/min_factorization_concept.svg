<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：贪心从大因子拆解 → 升序排列得最小数</text>

  <!-- ===== Top: greedy factorization 9→2 ===== -->
  <text x="40" y="54" font-size="12" fill="#446688" font-weight="bold">第一步：从 9 到 2 贪心提取因子（大因子优先 = 位数最少）</text>

  <!-- a = 48 -->
  <rect x="44" y="64" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="72" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">48</text>

  <text x="110" y="84" font-size="11" fill="#888">÷</text>

  <!-- try 9 (fail) -->
  <rect x="124" y="64" width="28" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="138" y="84" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">9</text>
  <text x="138" y="106" text-anchor="middle" font-size="9" fill="#b85450">✗</text>

  <!-- try 8 (success) -->
  <rect x="164" y="64" width="28" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="84" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">8</text>
  <text x="178" y="106" text-anchor="middle" font-size="9" fill="#4a7a3a">✓</text>

  <text x="200" y="84" font-size="11" fill="#888">=</text>

  <rect x="214" y="64" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="234" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>

  <text x="264" y="84" font-size="11" fill="#888">÷</text>

  <!-- try 6 (success) -->
  <rect x="278" y="64" width="28" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="292" y="84" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="292" y="106" text-anchor="middle" font-size="9" fill="#4a7a3a">✓</text>

  <text x="314" y="84" font-size="11" fill="#888">=</text>

  <rect x="328" y="64" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="348" y="84" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>

  <text x="378" y="84" font-size="10.5" fill="#4a7a3a" font-weight="bold">a=1，分解完成</text>

  <!-- collected digits: [8, 6] -->
  <rect x="44" y="120" width="280" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="138" font-size="11" fill="#d6a040" font-weight="bold">收集到的数字（降序）：</text>
  <rect x="220" y="124" width="24" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="232" y="138" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">8</text>
  <rect x="250" y="124" width="24" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="262" y="138" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">6</text>

  <!-- ===== Middle: reverse to ascending ===== -->
  <line x1="40" y1="162" x2="520" y2="162" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <text x="40" y="182" font-size="12" fill="#4a7a3a" font-weight="bold">第二步：反转数字 → 升序排列 = 同位数下最小</text>

  <!-- descending [8, 6] -->
  <text x="60" y="208" font-size="11" fill="#888">降序：</text>
  <rect x="100" y="194" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="116" y="213" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">8</text>
  <rect x="138" y="194" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="154" y="213" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">6</text>

  <!-- reverse arrow -->
  <path d="M 180 208 Q 220 208 240 208" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="210" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">reverse</text>

  <!-- ascending [6, 8] -->
  <rect x="250" y="194" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="266" y="213" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">6</text>
  <rect x="288" y="194" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="304" y="213" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">8</text>

  <text x="332" y="208" font-size="11" fill="#888">→ 拼成数</text>

  <rect x="392" y="194" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="420" y="213" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">68</text>

  <text x="460" y="208" font-size="10.5" fill="#4a7a3a" font-weight="bold">← 最小解 ✓</text>

  <!-- ===== Bottom: why greedy works ===== -->
  <line x1="40" y1="236" x2="520" y2="236" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <text x="40" y="256" font-size="12" fill="#b85450" font-weight="bold">为什么贪心正确？（交换论证）</text>

  <!-- left: fewer digits = smaller -->
  <rect x="44" y="268" width="230" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="56" y="288" font-size="11" fill="#446688" font-weight="bold">① 大因子 → 位数少 → 数更小</text>
  <text x="56" y="306" font-size="10.5" fill="#555">48 = 8×6 → 2 位 → 68</text>
  <text x="56" y="320" font-size="10.5" fill="#555">48 = 2×2×2×2×3 → 5 位 → 22223</text>
  <text x="200" y="314" font-size="10" fill="#b85450" font-weight="bold">68 ≪ 22223</text>

  <!-- right: ascending = smallest same-length -->
  <rect x="290" y="268" width="230" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="302" y="288" font-size="11" fill="#d6a040" font-weight="bold">② 升序排列 → 同位数下最小</text>
  <text x="302" y="306" font-size="10.5" fill="#555">{8,6} → 降序 86 vs 升序 68</text>
  <text x="302" y="320" font-size="10.5" fill="#555">升序 68 &lt; 降序 86</text>

  <!-- bottom note -->
  <rect x="80" y="340" width="400" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">贪心从 9→2 提因子保证位数最少</text>
  <text x="280" y="372" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">反转成升序保证同位数下值最小</text>
</svg>
