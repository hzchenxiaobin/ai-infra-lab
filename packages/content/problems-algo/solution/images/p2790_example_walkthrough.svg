<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：累计跨过 T(ans+1) 即解锁一组</text>
  <text x="280" y="40" text-anchor="middle" font-size="11" fill="#888">T(k)=k(k+1)/2 = 1, 3, 6, 10, …（前 k 个三角数）</text>

  <!-- ============ Table 1 ============ -->
  <text x="24" y="64" font-size="11" fill="#666" font-weight="bold">示例1：usageLimits=[1,2,5]（升序不变）→ ans=3</text>
  <rect x="24" y="76" width="410" height="96" fill="#fff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="24" y1="100" x2="434" y2="100" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="24" y1="124" x2="434" y2="124" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="24" y1="148" x2="434" y2="148" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="80" y1="76" x2="80" y2="172" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="126" y1="76" x2="126" y2="172" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="190" y1="76" x2="190" y2="172" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="316" y1="76" x2="316" y2="172" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="378" y1="76" x2="378" y2="172" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <!-- header -->
  <text x="52" y="92" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">步骤</text>
  <text x="103" y="92" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">v</text>
  <text x="158" y="92" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">total</text>
  <text x="253" y="92" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">阈值 T(ans+1)</text>
  <text x="347" y="92" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">解锁?</text>
  <text x="406" y="92" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">ans</text>
  <!-- rows -->
  <text x="52" y="116" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="103" y="116" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="158" y="116" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="253" y="116" text-anchor="middle" font-size="11" fill="#333">T(1)=1</text>
  <text x="347" y="116" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="406" y="116" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <text x="52" y="140" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="103" y="140" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="158" y="140" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="253" y="140" text-anchor="middle" font-size="11" fill="#333">T(2)=3</text>
  <text x="347" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="406" y="140" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <text x="52" y="164" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="103" y="164" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="158" y="164" text-anchor="middle" font-size="11" fill="#333">8</text>
  <text x="253" y="164" text-anchor="middle" font-size="11" fill="#333">T(3)=6</text>
  <text x="347" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="406" y="164" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- ============ Table 2 ============ -->
  <text x="24" y="198" font-size="11" fill="#666" font-weight="bold">示例2：usageLimits=[2,1,2] → 升序 [1,2,2] → ans=2</text>
  <rect x="24" y="206" width="410" height="96" fill="#fff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="24" y1="230" x2="434" y2="230" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="24" y1="254" x2="434" y2="254" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="24" y1="278" x2="434" y2="278" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="80" y1="206" x2="80" y2="302" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="126" y1="206" x2="126" y2="302" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="190" y1="206" x2="190" y2="302" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="316" y1="206" x2="316" y2="302" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="378" y1="206" x2="378" y2="302" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <!-- header -->
  <text x="52" y="222" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">步骤</text>
  <text x="103" y="222" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">v</text>
  <text x="158" y="222" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">total</text>
  <text x="253" y="222" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">阈值 T(ans+1)</text>
  <text x="347" y="222" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">解锁?</text>
  <text x="406" y="222" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">ans</text>
  <!-- rows -->
  <text x="52" y="246" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="103" y="246" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="158" y="246" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="253" y="246" text-anchor="middle" font-size="11" fill="#333">T(1)=1</text>
  <text x="347" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="406" y="246" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <text x="52" y="270" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="103" y="270" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="158" y="270" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="253" y="270" text-anchor="middle" font-size="11" fill="#333">T(2)=3</text>
  <text x="347" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="406" y="270" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <text x="52" y="294" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="103" y="294" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="158" y="294" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="253" y="294" text-anchor="middle" font-size="11" fill="#333">T(3)=6</text>
  <text x="347" y="294" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="406" y="294" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <!-- note -->
  <rect x="24" y="316" width="510" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="40" y="336" font-size="10" fill="#666">示例1：数字2跨3组、数字1跨2组、数字0跨1组 → [2], [1,2], [0,1,2]</text>
  <text x="40" y="356" font-size="10" fill="#b85450" font-weight="bold">示例2：第3步累计 5 &lt; T(3)=6 → 凑不出第3组所需的3个不同数字，停在 ans=2</text>
</svg>
