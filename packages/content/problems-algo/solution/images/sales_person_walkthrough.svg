<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：子查询归约 → SalesPerson 取差，逐步执行</text>

  <!-- Step 1: Company filter -->
  <text x="100" y="52" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">步骤① Company 过滤 name='RED'</text>
  <rect x="40" y="58" width="130" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="70" font-size="8.5" fill="#333">com_id</text>
  <text x="115" y="70" font-size="8.5" fill="#333">name</text>
  <line x1="85" y1="58" x2="85" y2="76" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="40" y="76" width="130" height="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="87" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="115" y="87" font-size="9" fill="#b85450" font-weight="bold">RED ★</text>
  <line x1="85" y1="76" x2="85" y2="91" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="40" y="91" width="130" height="13" fill="#fff" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="60" y="101" font-size="8" fill="#bbb">2</text>
  <text x="115" y="101" font-size="8" fill="#bbb">ORANGE</text>
  <line x1="85" y1="91" x2="85" y2="104" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <rect x="40" y="104" width="130" height="13" fill="#fff" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="60" y="114" font-size="8" fill="#bbb">3</text>
  <text x="115" y="114" font-size="8" fill="#bbb">YELLOW</text>
  <line x1="85" y1="104" x2="85" y2="117" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <rect x="40" y="117" width="130" height="13" fill="#fff" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="60" y="127" font-size="8" fill="#bbb">4</text>
  <text x="115" y="127" font-size="8" fill="#bbb">GREEN</text>
  <line x1="85" y1="117" x2="85" y2="130" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- arrow step1 -> step2 -->
  <path d="M180 92 L235 92" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="207" y="87" text-anchor="middle" font-size="8" fill="#b85450">com_id=1</text>

  <!-- Step 2: Orders filter -->
  <text x="355" y="52" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">步骤② Orders 过滤 com_id=1</text>
  <rect x="235" y="58" width="180" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="70" font-size="8.5" fill="#333">order_id</text>
  <text x="315" y="70" font-size="8.5" fill="#333">com_id</text>
  <text x="375" y="70" font-size="8.5" fill="#333">sales_id</text>
  <line x1="280" y1="58" x2="280" y2="76" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="345" y1="58" x2="345" y2="76" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="235" y="76" width="180" height="13" fill="#fff" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="255" y="86" font-size="8" fill="#bbb">1</text>
  <text x="315" y="86" font-size="8" fill="#bbb">3</text>
  <text x="375" y="86" font-size="8" fill="#bbb">4</text>
  <line x1="280" y1="76" x2="280" y2="89" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="345" y1="76" x2="345" y2="89" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <rect x="235" y="89" width="180" height="13" fill="#fff" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="255" y="99" font-size="8" fill="#bbb">2</text>
  <text x="315" y="99" font-size="8" fill="#bbb">4</text>
  <text x="375" y="99" font-size="8" fill="#bbb">5</text>
  <line x1="280" y1="89" x2="280" y2="102" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="345" y1="89" x2="345" y2="102" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <rect x="235" y="102" width="180" height="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="255" y="113" font-size="9" fill="#b85450" font-weight="bold">3</text>
  <text x="315" y="113" font-size="9" fill="#b85450" font-weight="bold">1 ★</text>
  <text x="375" y="113" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <line x1="280" y1="102" x2="280" y2="117" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="345" y1="102" x2="345" y2="117" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="235" y="117" width="180" height="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="255" y="128" font-size="9" fill="#b85450" font-weight="bold">4</text>
  <text x="315" y="128" font-size="9" fill="#b85450" font-weight="bold">1 ★</text>
  <text x="375" y="128" font-size="9" fill="#b85450" font-weight="bold">4</text>
  <line x1="280" y1="117" x2="280" y2="132" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="345" y1="117" x2="345" y2="132" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- arrow step2 -> step3 (sales_id set) -->
  <path d="M425 117 L470 117" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="447" y="112" text-anchor="middle" font-size="8" fill="#b85450">取 sales_id</text>

  <!-- sales_id set box -->
  <rect x="470" y="96" width="90" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="515" y="112" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">步骤③ 集合</text>
  <text x="515" y="130" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">{1, 4}</text>

  <!-- arrow down to step 4 -->
  <path d="M290 142 L290 168" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="370" y="160" font-size="10" fill="#4a7a3a" font-weight="bold">步骤④ SalesPerson NOT IN {1, 4}</text>

  <!-- Step 4: SalesPerson table with NOT IN filter -->
  <text x="150" y="186" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">SalesPerson（逐行判定 sales_id ∈ {1,4}?）</text>
  <rect x="50" y="192" width="200" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="204" font-size="8.5" fill="#333">sales_id</text>
  <text x="130" y="204" font-size="8.5" fill="#333">name</text>
  <text x="210" y="204" font-size="8.5" fill="#333">∈ {1,4}?</text>
  <line x1="100" y1="192" x2="100" y2="210" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="175" y1="192" x2="175" y2="210" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="50" y="210" width="200" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="75" y="222" font-size="9" fill="#b85450">1</text>
  <text x="130" y="222" font-size="9" fill="#b85450">John</text>
  <text x="210" y="222" font-size="9" fill="#b85450" font-weight="bold">✗ 排除</text>
  <line x1="100" y1="210" x2="100" y2="226" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="175" y1="210" x2="175" y2="226" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="50" y="226" width="200" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="75" y="238" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="130" y="238" font-size="9" fill="#4a7a3a" font-weight="bold">Amy</text>
  <text x="210" y="238" font-size="9" fill="#4a7a3a" font-weight="bold">✓ 保留</text>
  <line x1="100" y1="226" x2="100" y2="242" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="175" y1="226" x2="175" y2="242" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="50" y="242" width="200" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="75" y="254" font-size="9" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="130" y="254" font-size="9" fill="#4a7a3a" font-weight="bold">Mark</text>
  <text x="210" y="254" font-size="9" fill="#4a7a3a" font-weight="bold">✓ 保留</text>
  <line x1="100" y1="242" x2="100" y2="258" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="175" y1="242" x2="175" y2="258" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="50" y="258" width="200" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="75" y="270" font-size="9" fill="#b85450">4</text>
  <text x="130" y="270" font-size="9" fill="#b85450">Pam</text>
  <text x="210" y="270" font-size="9" fill="#b85450" font-weight="bold">✗ 排除</text>
  <line x1="100" y1="258" x2="100" y2="274" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="175" y1="258" x2="175" y2="274" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="50" y="274" width="200" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="75" y="286" font-size="9" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="130" y="286" font-size="9" fill="#4a7a3a" font-weight="bold">Alex</text>
  <text x="210" y="286" font-size="9" fill="#4a7a3a" font-weight="bold">✓ 保留</text>
  <line x1="100" y1="274" x2="100" y2="290" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="175" y1="274" x2="175" y2="290" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- arrow to result -->
  <path d="M255 248 L320 248" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="287" y="243" text-anchor="middle" font-size="8" fill="#4a7a3a">SELECT name</text>

  <!-- result box -->
  <rect x="320" y="218" width="180" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="238" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">最终输出 name 列</text>
  <text x="410" y="256" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Amy, Mark, Alex</text>
  <text x="410" y="272" text-anchor="middle" font-size="8.5" fill="#555">SalesPerson − {1, 4}</text>

  <!-- bottom note -->
  <rect x="30" y="310" width="520" height="158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="330" font-size="10" fill="#333" font-weight="bold">演算要点回顾</text>
  <text x="50" y="348" font-size="9.5" fill="#555">① Company 按 name='RED' 过滤 → 只剩 com_id=1 一行（RED 公司的 id）</text>
  <text x="50" y="364" font-size="9.5" fill="#555">② Orders 按 com_id=1 过滤 → 订单 3、4 命中（订单 1、2 的 com_id 是 3、4，非 RED，丢弃）</text>
  <text x="50" y="380" font-size="9.5" fill="#555">③ 取命中行的 sales_id → 集合 {1, 4} = {John, Pam}（向 RED 销售过的销售员）</text>
  <text x="50" y="396" font-size="9.5" fill="#555">④ SalesPerson 逐行判定 sales_id ∈ {1,4}：John(1)✗、Amy(2)✓、Mark(3)✓、Pam(4)✗、Alex(5)✓</text>
  <text x="50" y="412" font-size="9.5" fill="#4a7a3a" font-weight="bold">⑤ 保留 ✓ 行 → 输出 Amy、Mark、Alex</text>
  <text x="50" y="436" font-size="9.5" fill="#b85450" font-weight="bold">关键：子查询把"与 RED 关联"这个跨表条件物化为单列 sales_id 集合，</text>
  <text x="50" y="452" font-size="9.5" fill="#b85450" font-weight="bold">　　三表反连接随即退化为 183 的两表反连接（SalesPerson − 集合）</text>
</svg>
