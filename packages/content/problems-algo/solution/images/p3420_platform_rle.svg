<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="19" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：前缀最大值「平台」队列，两端 O(1) 增量</text>
  <text x="260" y="36" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">窗口 [3,1,2,4,4]（示例 1 的后缀）→ 抬升后 P = [3,3,3,4,4]</text>

  <!-- 原始窗口 -->
  <text x="66" y="56" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">原始窗口</text>
  <rect x="135" y="60" width="46" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="186" y="60" width="46" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="237" y="60" width="46" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="288" y="60" width="46" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="339" y="60" width="46" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="158" y="80" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="209" y="80" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="260" y="80" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="311" y="80" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="362" y="80" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>

  <path d="M 260 92 L 260 106" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="104" text-anchor="start" font-size="8.5" fill="#555" filter="url(#rough2)">抬升后 P_i = max(nums[l..i])（非降）</text>

  <!-- P 平台 -->
  <text x="75" y="131" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">队首</text>
  <path d="M 90 127 L 130 127" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="448" y="131" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">队尾</text>
  <path d="M 433 127 L 398 127" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="135" y="112" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="186" y="112" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="237" y="112" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="158" y="134" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="209" y="134" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="260" y="134" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="296" y="112" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="347" y="112" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="319" y="134" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="370" y="134" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>

  <path d="M 135 152 L 135 158 L 283 158 L 283 152" fill="none" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="209" y="171" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">平台 (3,3)</text>
  <path d="M 296 152 L 296 158 L 393 158 L 393 152" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="344" y="171" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">平台 (4,2)</text>
  <text x="462" y="166" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">队尾 = 窗口最大值</text>

  <text x="260" y="187" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">cost = Σ(P_i − nums[i]) = 0+2+1+0+0 = 3</text>

  <!-- 左端加入 6 -->
  <text x="74" y="208" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">左端加入 6（l−−）</text>
  <rect x="48" y="216" width="42" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="69" y="240" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>
  <path d="M 96 234 L 130 234" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="113" y="227" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">压平</text>

  <rect x="138" y="216" width="34" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="176" y="216" width="34" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="214" y="216" width="34" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="252" y="216" width="34" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="290" y="216" width="34" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="328" y="216" width="34" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="155" y="239" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="193" y="239" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="231" y="239" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="269" y="239" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="307" y="239" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="345" y="239" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">6</text>

  <path d="M 138 258 L 138 264 L 362 264 L 362 258" fill="none" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="250" y="277" text-anchor="middle" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">弹出所有 v ≤ 6 的平台，合并成新队首 (6,6)</text>

  <text x="438" y="228" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">cost +=</text>
  <text x="438" y="242" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">(6−3)×3 + (6−4)×2</text>
  <text x="438" y="256" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">= 13</text>

  <!-- 底部两张卡 -->
  <rect x="16" y="292" width="238" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="135" y="310" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">右端收缩：O(1)</text>
  <text x="135" y="324" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">队尾平台长度 −1（归零出队）</text>
  <text x="135" y="337" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">cost −= 队尾值 − nums[r]</text>

  <rect x="266" y="292" width="238" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="385" y="310" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">左端收缩：平台会分裂！</text>
  <text x="385" y="324" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">[5,1,2] 的 P=[5,5,5]，删 5 后变 [1,2]</text>
  <text x="385" y="337" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">无法 O(1) 维护 → 必须反向枚举</text>

  <text x="260" y="358" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">反向双指针：左端只负责「加入压平」，右端只负责「收缩」</text>
</svg>
