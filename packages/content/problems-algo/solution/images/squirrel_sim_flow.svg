<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="280" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一趟扫描，累计公共往返 + 维护最大节省</text>

  <!-- Step 1: helper -->
  <rect x="24" y="58" width="116" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="82" y="82" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">预处理</text>
  <text x="82" y="100" text-anchor="middle" font-size="10" fill="#666">dist(a,b)=|Δr|+|Δc|</text>

  <!-- arrow 1 -->
  <path d="M 142 87 L 174 87" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop accumulate S -->
  <rect x="178" y="58" width="130" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="243" y="78" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">遍历每颗 nut</text>
  <text x="243" y="96" text-anchor="middle" font-size="10" fill="#666">total += 2·d(tree,nut)</text>
  <text x="243" y="109" text-anchor="middle" font-size="10" fill="#666">maxSave = max(…)</text>

  <!-- arrow 2 -->
  <path d="M 310 87 L 342 87" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: pick max save -->
  <rect x="346" y="58" width="118" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="405" y="82" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">取 maxSave</text>
  <text x="405" y="100" text-anchor="middle" font-size="10" fill="#666">= max(d_tree − d_sq)</text>

  <!-- arrow 3 -->
  <path d="M 466 87 L 498 87" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: return -->
  <rect x="502" y="58" width="44" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="524" y="82" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">返回</text>
  <text x="524" y="100" text-anchor="middle" font-size="10" fill="#666">S−maxSave</text>

  <!-- loop detail -->
  <rect x="100" y="140" width="360" height="62" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="280" y="162" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">单趟循环体（O(1)，对每颗 nut 执行一次）</text>
  <text x="280" y="180" text-anchor="middle" font-size="10.5" fill="#666" font-family="monospace">d_tree = dist(tree, nut);  d_sq = dist(sq, nut);</text>
  <text x="280" y="195" text-anchor="middle" font-size="10.5" fill="#666" font-family="monospace">total += 2*d_tree;  maxSave = max(maxSave, d_tree - d_sq);</text>

  <!-- complexity note -->
  <rect x="100" y="218" width="360" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">复杂度：时间 O(n) ｜ 空间 O(1)</text>
  <text x="280" y="254" text-anchor="middle" font-size="10" fill="#555">n = 坚果数；仅 total / maxSave 两个变量随遍历更新</text>
</svg>
