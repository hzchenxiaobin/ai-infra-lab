<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：s = "abaccb"，distance = [1,3,0,5,0,…]</text>

  <!-- ===== Table ===== -->
  <!-- column x edges: 40 | 80 | 120 | 160 | 210 | 370 | 520 -->

  <g filter="url(#rough2)">
    <!-- header row -->
    <rect x="40" y="46" width="480" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="60" y="65" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">步</text>
    <text x="100" y="65" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">i</text>
    <text x="140" y="65" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">c</text>
    <text x="185" y="65" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">idx</text>
    <text x="290" y="65" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">first 变化</text>
    <text x="445" y="65" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">动作 / 判定</text>

    <!-- column separators -->
    <line x1="80" y1="46" x2="80" y2="298" stroke="#ddd" stroke-width="1"/>
    <line x1="120" y1="46" x2="120" y2="298" stroke="#ddd" stroke-width="1"/>
    <line x1="160" y1="46" x2="160" y2="298" stroke="#ddd" stroke-width="1"/>
    <line x1="210" y1="46" x2="210" y2="298" stroke="#ddd" stroke-width="1"/>
    <line x1="370" y1="46" x2="370" y2="298" stroke="#ddd" stroke-width="1"/>
    <line x1="40" y1="298" x2="520" y2="298" stroke="#d6a040" stroke-width="1.5"/>

    <!-- row 1 -->
    <rect x="40" y="76" width="480" height="36" fill="#fafafa"/>
    <text x="60" y="99" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="100" y="99" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="140" y="99" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
    <text x="185" y="99" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="290" y="99" text-anchor="middle" font-size="11" fill="#446688">first[0]：−1 → 0</text>
    <text x="445" y="99" text-anchor="middle" font-size="11" fill="#4a7a3a">记首次</text>

    <!-- row 2 -->
    <rect x="40" y="112" width="480" height="36" fill="#f4f6f9"/>
    <text x="60" y="135" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="100" y="135" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="140" y="135" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
    <text x="185" y="135" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="290" y="135" text-anchor="middle" font-size="11" fill="#446688">first[1]：−1 → 1</text>
    <text x="445" y="135" text-anchor="middle" font-size="11" fill="#4a7a3a">记首次</text>

    <!-- row 3 (✓) -->
    <rect x="40" y="148" width="480" height="36" fill="#e6f4ea"/>
    <text x="60" y="171" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="100" y="171" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="140" y="171" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">a</text>
    <text x="185" y="171" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="290" y="171" text-anchor="middle" font-size="11" fill="#888">—（已记）</text>
    <text x="445" y="171" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">gap=2−0−1=1=dist[0] ✓</text>

    <!-- row 4 -->
    <rect x="40" y="184" width="480" height="36" fill="#fafafa"/>
    <text x="60" y="207" text-anchor="middle" font-size="12" fill="#333">4</text>
    <text x="100" y="207" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="140" y="207" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
    <text x="185" y="207" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="290" y="207" text-anchor="middle" font-size="11" fill="#446688">first[2]：−1 → 3</text>
    <text x="445" y="207" text-anchor="middle" font-size="11" fill="#4a7a3a">记首次</text>

    <!-- row 5 (✓) -->
    <rect x="40" y="220" width="480" height="36" fill="#e6f4ea"/>
    <text x="60" y="243" text-anchor="middle" font-size="12" fill="#333">5</text>
    <text x="100" y="243" text-anchor="middle" font-size="12" fill="#333">4</text>
    <text x="140" y="243" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">c</text>
    <text x="185" y="243" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="290" y="243" text-anchor="middle" font-size="11" fill="#888">—（已记）</text>
    <text x="445" y="243" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">gap=4−3−1=0=dist[2] ✓</text>

    <!-- row 6 (✓) -->
    <rect x="40" y="256" width="480" height="36" fill="#e6f4ea"/>
    <text x="60" y="279" text-anchor="middle" font-size="12" fill="#333">6</text>
    <text x="100" y="279" text-anchor="middle" font-size="12" fill="#333">5</text>
    <text x="140" y="279" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">b</text>
    <text x="185" y="279" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="290" y="279" text-anchor="middle" font-size="11" fill="#888">—（已记）</text>
    <text x="445" y="279" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">gap=5−1−1=3=dist[1] ✓</text>
  </g>

  <!-- ===== Conclusion ===== -->
  <rect x="40" y="312" width="480" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">第 3、5、6 步分别定判 a、c、b，三次间隔全部命中</text>
  <text x="280" y="354" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">遍历结束无失败 → return true ✓</text>
</svg>
