<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察③：净位移计数 —— 只有两个状态，转移是线性递推</text>
  <text x="310" y="46" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">a_k(r) = 恰好 k 步、净位移 ≡ r (mod n) 的方案数；由对称性 r ≠ 0 时取值相同</text>

  <!-- state x -->
  <rect x="90" y="80" width="180" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="180" y="110" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">x_k</text>
  <text x="180" y="130" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">净位移 ≡ 0（1 个偏移）</text>
  <text x="180" y="147" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">初值 x₁ = 0</text>

  <!-- state y -->
  <rect x="350" y="80" width="180" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="440" y="110" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">y_k</text>
  <text x="440" y="130" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">净位移 ≡ r ≠ 0（n−1 个偏移）</text>
  <text x="440" y="147" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">初值 y₁ = 1</text>

  <!-- transitions -->
  <!-- y -> x : *(n-1) -->
  <path d="M 350 105 C 300 105 300 92 274 92" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="310" y="76" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">×(n−1)</text>
  <text x="310" y="112" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">上一步落在任一非零偏移，</text>
  <text x="310" y="126" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">最后一步恰好转回 0</text>

  <!-- x -> y : *1 -->
  <path d="M 274 148 C 300 148 300 160 346 160" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="296" y="178" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">×1</text>

  <!-- y -> y self loop : *(n-2) -->
  <path d="M 470 156 C 480 186 540 186 546 152" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="512" y="204" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">×(n−2)</text>

  <!-- recurrence box -->
  <rect x="90" y="212" width="440" height="46" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="231" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x_{k+1} = (n−1)·y_k</text>
  <text x="310" y="249" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">y_{k+1} = x_k + (n−2)·y_k　　矩阵 M 特征值：n−1 与 −1</text>

  <!-- closed form box -->
  <rect x="70" y="272" width="480" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="294" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">x_k = [ (n−1)^k + (n−1)·(−1)^k ] / n</text>
  <text x="310" y="314" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">y_k = [ (n−1)^k − (−1)^k ] / n</text>
  <text x="310" y="334" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">验证：k=1 时 x₁=0、y₁=1 ✓　模域内除 n 用逆元 n^(MOD−2)</text>

  <text x="310" y="366" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">答案 = m₀·x_k + m₁·y_k，其中 m₀ = [s==t]，m₁ = 好偏移个数 − m₀</text>
</svg>
