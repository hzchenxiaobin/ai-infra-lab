<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n=3, requests=[[0,1],[1,0],[0,2]]，答案=2</text>

  <!-- Table header -->
  <rect x="30" y="40" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="55" y="56" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">步</text>
  <rect x="80" y="40" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="115" y="56" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">动作</text>
  <rect x="150" y="40" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="168" y="56" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">d[0]</text>
  <rect x="186" y="40" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="204" y="56" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">d[1]</text>
  <rect x="222" y="40" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="240" y="56" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">d[2]</text>
  <rect x="258" y="40" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="283" y="56" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">全零?</text>
  <rect x="308" y="40" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="328" y="56" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">cnt</text>
  <rect x="348" y="40" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="368" y="56" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">ans</text>
  <rect x="388" y="40" width="140" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="458" y="56" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">说明</text>

  <!-- Row 0: root -->
  <rect x="30" y="68" width="50" height="22" fill="#fafafa" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="83" text-anchor="middle" font-size="9" fill="#333">0</text>
  <rect x="80" y="68" width="70" height="22" fill="#fafafa" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="115" y="83" text-anchor="middle" font-size="9" fill="#333">起始</text>
  <rect x="150" y="68" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="168" y="83" text-anchor="middle" font-size="9" fill="#4a7a3a">0</text>
  <rect x="186" y="68" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="204" y="83" text-anchor="middle" font-size="9" fill="#4a7a3a">0</text>
  <rect x="222" y="68" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="240" y="83" text-anchor="middle" font-size="9" fill="#4a7a3a">0</text>
  <rect x="258" y="68" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="283" y="83" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="308" y="68" width="40" height="22" fill="#fafafa" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="328" y="83" text-anchor="middle" font-size="9" fill="#333">0</text>
  <rect x="348" y="68" width="40" height="22" fill="#fafafa" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="368" y="83" text-anchor="middle" font-size="9" fill="#333">0</text>
  <rect x="388" y="68" width="140" height="22" fill="#fafafa" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="460" y="83" font-size="8.5" fill="#888">idx=0, delta全零, ans=0</text>

  <!-- Row 1: skip [0,1] -->
  <rect x="30" y="92" width="50" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="107" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="80" y="92" width="70" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="115" y="107" text-anchor="middle" font-size="9" fill="#888">跳[0,1]</text>
  <rect x="150" y="92" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="168" y="107" text-anchor="middle" font-size="9" fill="#4a7a3a">0</text>
  <rect x="186" y="92" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="204" y="107" text-anchor="middle" font-size="9" fill="#4a7a3a">0</text>
  <rect x="222" y="92" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="240" y="107" text-anchor="middle" font-size="9" fill="#4a7a3a">0</text>
  <rect x="258" y="92" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="283" y="107" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="308" y="92" width="40" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="328" y="107" text-anchor="middle" font-size="9" fill="#333">0</text>
  <rect x="348" y="92" width="40" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="368" y="107" text-anchor="middle" font-size="9" fill="#333">0</text>
  <rect x="388" y="92" width="140" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="460" y="107" font-size="8.5" fill="#888">idx=1, 仍全零, ans=0</text>

  <!-- Row 2: take [0,1] -->
  <rect x="30" y="116" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="131" text-anchor="middle" font-size="9" fill="#333">2</text>
  <rect x="80" y="116" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="115" y="131" text-anchor="middle" font-size="9" fill="#4a7a3a">取[0,1]</text>
  <rect x="150" y="116" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="168" y="131" text-anchor="middle" font-size="9" fill="#b85450">−1</text>
  <rect x="186" y="116" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="204" y="131" text-anchor="middle" font-size="9" fill="#d6a040">+1</text>
  <rect x="222" y="116" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="240" y="131" text-anchor="middle" font-size="9" fill="#4a7a3a">0</text>
  <rect x="258" y="116" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="283" y="131" text-anchor="middle" font-size="9" fill="#b85450">✗</text>
  <rect x="308" y="116" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="328" y="131" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="348" y="116" width="40" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="368" y="131" text-anchor="middle" font-size="9" fill="#333">0</text>
  <rect x="388" y="116" width="140" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="460" y="131" font-size="8.5" fill="#888">d[0]−− d[1]++</text>

  <!-- Row 3: take [1,0] after [0,1] -->
  <rect x="30" y="140" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="155" text-anchor="middle" font-size="9" fill="#333">3</text>
  <rect x="80" y="140" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="115" y="155" text-anchor="middle" font-size="9" fill="#4a7a3a">取[1,0]</text>
  <rect x="150" y="140" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="168" y="155" text-anchor="middle" font-size="9" fill="#4a7a3a">0</text>
  <rect x="186" y="140" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="204" y="155" text-anchor="middle" font-size="9" fill="#4a7a3a">0</text>
  <rect x="222" y="140" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="240" y="155" text-anchor="middle" font-size="9" fill="#4a7a3a">0</text>
  <rect x="258" y="140" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="283" y="155" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="308" y="140" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="328" y="155" text-anchor="middle" font-size="9" fill="#333">2</text>
  <rect x="348" y="140" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="368" y="155" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="388" y="140" width="140" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="460" y="155" font-size="8.5" fill="#4a7a3a" font-weight="bold">★ 全零! ans=max(0,2)=2</text>

  <!-- Row 4: take [0,2] after [0,1],[1,0] -->
  <rect x="30" y="164" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="179" text-anchor="middle" font-size="9" fill="#333">4</text>
  <rect x="80" y="164" width="70" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="115" y="179" text-anchor="middle" font-size="9" fill="#b85450">取[0,2]</text>
  <rect x="150" y="164" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="168" y="179" text-anchor="middle" font-size="9" fill="#b85450">−1</text>
  <rect x="186" y="164" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="204" y="179" text-anchor="middle" font-size="9" fill="#4a7a3a">0</text>
  <rect x="222" y="164" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="240" y="179" text-anchor="middle" font-size="9" fill="#d6a040">+1</text>
  <rect x="258" y="164" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="283" y="179" text-anchor="middle" font-size="9" fill="#b85450">✗</text>
  <rect x="308" y="164" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="328" y="179" text-anchor="middle" font-size="9" fill="#333">3</text>
  <rect x="348" y="164" width="40" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="368" y="179" text-anchor="middle" font-size="9" fill="#333">2</text>
  <rect x="388" y="164" width="140" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="460" y="179" font-size="8.5" fill="#888">d[0]−− d[2]++ 非零</text>

  <!-- Row 5: skip [0,2] after [0,1],[1,0] - leaf -->
  <rect x="30" y="188" width="50" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="203" text-anchor="middle" font-size="9" fill="#333">5</text>
  <rect x="80" y="188" width="70" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="115" y="203" text-anchor="middle" font-size="9" fill="#888">跳[0,2]</text>
  <rect x="150" y="188" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="168" y="203" text-anchor="middle" font-size="9" fill="#4a7a3a">0</text>
  <rect x="186" y="188" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="204" y="203" text-anchor="middle" font-size="9" fill="#4a7a3a">0</text>
  <rect x="222" y="188" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="240" y="203" text-anchor="middle" font-size="9" fill="#4a7a3a">0</text>
  <rect x="258" y="188" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="283" y="203" text-anchor="middle" font-size="9" fill="#4a7a3a">✓</text>
  <rect x="308" y="188" width="40" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="328" y="203" text-anchor="middle" font-size="9" fill="#333">2</text>
  <rect x="348" y="188" width="40" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="368" y="203" text-anchor="middle" font-size="9" fill="#333">2</text>
  <rect x="388" y="188" width="140" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="460" y="203" font-size="8.5" fill="#888">叶子, 已是最佳</text>

  <!-- Row 6: pruning example -->
  <rect x="30" y="212" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="227" text-anchor="middle" font-size="9" fill="#333">6</text>
  <rect x="80" y="212" width="70" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="115" y="227" text-anchor="middle" font-size="9" fill="#b85450">剪枝</text>
  <rect x="150" y="212" width="186" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="243" y="227" text-anchor="middle" font-size="9" fill="#b85450">cnt=0 + 剩余1 ≤ ans=2</text>
  <rect x="258" y="212" width="50" height="22" fill="fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <rect x="308" y="212" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="328" y="227" text-anchor="middle" font-size="9" fill="#b85450">—</text>
  <rect x="348" y="212" width="40" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="368" y="227" text-anchor="middle" font-size="9" fill="#333">2</text>
  <rect x="388" y="212" width="140" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="460" y="227" font-size="8.5" fill="#b85450">跳过剩余分支!</text>

  <!-- Summary box -->
  <rect x="30" y="252" width="500" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">最优解：选 {[0,1], [1,0]}，delta 全零，cnt=2</text>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#444">[0,1] 让 d[0]=−1, d[1]=+1；[1,0] 让 d[1]−−, d[0]++ 互相抵消</text>
  <text x="280" y="314" text-anchor="middle" font-size="11" fill="#4a7a3a">剪枝使大量子树提前终止 → 远少于 2^3=8 个节点</text>

  <!-- Legend -->
  <rect x="30" y="338" width="500" height="86" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="50" y="358" font-size="10" fill="#888" font-weight="bold">图例：</text>
  <rect x="100" y="348" width="20" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="130" y="360" font-size="9.5" fill="#333">delta=0（合法）</text>
  <rect x="240" y="348" width="20" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="270" y="360" font-size="9.5" fill="#333">delta≠0（不合法）</text>
  <rect x="400" y="348" width="20" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="430" y="360" font-size="9.5" fill="#333">delta=±1（过渡）</text>
  <text x="50" y="384" font-size="9.5" fill="#4a7a3a" font-weight="bold">★</text>
  <text x="70" y="384" font-size="9.5" fill="#333">找到全零状态，更新 ans</text>
  <text x="240" y="384" font-size="9.5" fill="#b85450" font-weight="bold">剪</text>
  <text x="260" y="384" font-size="9.5" fill="#333">cnt + 剩余 ≤ ans，提前终止</text>
  <text x="50" y="406" font-size="9.5" fill="#888">每个请求有两种选择：跳过（灰色）/ 取（彩色），取则修改 delta 并在回溯时恢复</text>
  <text x="50" y="420" font-size="9.5" fill="#888">每个节点都检查 delta 全零性（不只在叶子），找到即可更新 ans</text>
</svg>
