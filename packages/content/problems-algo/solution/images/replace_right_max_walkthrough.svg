<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [17, 18, 5, 4, 6, 1]</text>

  <!-- Table header -->
  <rect x="40" y="46" width="540" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步</text>
  <text x="150" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <text x="220" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">arr[i]</text>
  <text x="330" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">maxRight(填前)</text>
  <text x="440" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans[i]</text>
  <text x="535" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">maxRight(更后)</text>

  <!-- Row 1: i=5 -->
  <rect x="40" y="78" width="540" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="96" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="150" y="96" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="220" y="96" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="330" y="96" text-anchor="middle" font-size="11" fill="#888">-1 (初始)</text>
  <text x="440" y="96" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">-1</text>
  <text x="535" y="96" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>

  <!-- Row 2: i=4 -->
  <rect x="40" y="108" width="540" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="126" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="150" y="126" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="220" y="126" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="330" y="126" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="440" y="126" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="535" y="126" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">6</text>

  <!-- Row 3: i=3 -->
  <rect x="40" y="138" width="540" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="156" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="150" y="156" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="220" y="156" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="330" y="156" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">6</text>
  <text x="440" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="535" y="156" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">6</text>

  <!-- Row 4: i=2 -->
  <rect x="40" y="168" width="540" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="186" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="150" y="186" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="220" y="186" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="330" y="186" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">6</text>
  <text x="440" y="186" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="535" y="186" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">6</text>

  <!-- Row 5: i=1 -->
  <rect x="40" y="198" width="540" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="216" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="150" y="216" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="220" y="216" text-anchor="middle" font-size="11" fill="#333">18</text>
  <text x="330" y="216" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">6</text>
  <text x="440" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="535" y="216" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">18</text>

  <!-- Row 6: i=0 -->
  <rect x="40" y="228" width="540" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="246" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="150" y="246" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="220" y="246" text-anchor="middle" font-size="11" fill="#333">17</text>
  <text x="330" y="246" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">18</text>
  <text x="440" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">18</text>
  <text x="535" y="246" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">18</text>

  <!-- Result row -->
  <line x1="40" y1="272" x2="580" y2="272" stroke="#ccc" stroke-width="1" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="40" y="298" font-size="12" fill="#888">结果 ans:</text>
  <rect x="110" y="282" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="138" y="302" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">18</text>
  <rect x="170" y="282" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="198" y="302" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="230" y="282" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="258" y="302" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="290" y="282" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="318" y="302" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="350" y="282" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="378" y="302" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="410" y="282" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="438" y="302" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">-1</text>

  <!-- Observation box -->
  <rect x="50" y="328" width="540" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="64" y="350" font-size="12" fill="#333" font-weight="bold">💡 观察：maxRight「填前」值即放入 ans[i]，「更后」值向左传递。</text>
  <text x="64" y="368" font-size="11" fill="#555">从右向左，maxRight 单调不减（只取 max），每个位置的答案都是「右侧已见过的最大值」，</text>
  <text x="64" y="382" font-size="11" fill="#555">恰好满足「右侧最大元素」的语义——最后一格用初始值 -1 兜底。</text>
</svg>
