<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一遍扫描，首个胜点即答案</text>

  <!-- step 1 -->
  <rect x="168" y="34" width="184" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="55" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">扫一遍求总分 T（0 记 −1）</text>

  <path d="M 260 66 L 260 82" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="168" y="86" width="184" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="107" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i = 0，运行前缀和 pre = 0</text>

  <path d="M 260 118 L 260 134" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="168" y="138" width="184" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="159" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">pre += a[i]，i++</text>

  <path d="M 260 170 L 260 186" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision 1 -->
  <path d="M 260 190 L 352 228 L 260 266 L 168 228 Z" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="225" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">2·pre &gt; T ?</text>
  <text x="260" y="243" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">（严格更高？平局不算）</text>

  <!-- yes -> return i -->
  <path d="M 352 228 L 400 228" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="374" y="220" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="404" y="204" width="104" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="456" y="226" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return i</text>
  <text x="456" y="244" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">（最少关卡数）</text>

  <!-- no -->
  <path d="M 260 266 L 260 284" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="280" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- decision 2 -->
  <path d="M 260 288 L 350 322 L 260 356 L 170 322 Z" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="319" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i &lt; n − 1 ?</text>
  <text x="260" y="337" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">（Bob 还有关可打？）</text>

  <!-- loop back -->
  <path d="M 170 322 L 126 322 L 126 154 L 164 154" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="146" y="314" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- no -> return -1 -->
  <path d="M 350 322 L 360 322" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="353" y="312" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="364" y="304" width="104" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="416" y="327" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">return −1</text>

  <!-- side note -->
  <rect x="22" y="140" width="136" height="126" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="90" y="162" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">易错点：</text>
  <text x="90" y="182" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">① 每人至少 1 关，</text>
  <text x="90" y="198" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">i 只扫到 n−1；</text>
  <text x="90" y="218" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">② 严格大于，</text>
  <text x="90" y="234" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2·pre &gt; T 无等号，</text>
  <text x="90" y="250" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">平局不算赢。</text>
</svg>
