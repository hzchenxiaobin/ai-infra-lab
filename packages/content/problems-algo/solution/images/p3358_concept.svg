<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：rating = NULL 恒为 UNKNOWN，rating IS NULL 才命中</text>

  <!-- 左侧：books 表（只画关键两列） -->
  <text x="82" y="46" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">books 表（6 行）</text>

  <rect x="30" y="52" width="40" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="66" text-anchor="middle" font-size="9" fill="#333" font-weight="bold" filter="url(#rough2)">id</text>
  <rect x="70" y="52" width="66" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="103" y="66" text-anchor="middle" font-size="9" fill="#333" font-weight="bold" filter="url(#rough2)">rating</text>

  <rect x="30" y="76" width="40" height="20" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="90" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1</text>
  <rect x="70" y="76" width="66" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="103" y="90" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">4.5</text>

  <rect x="30" y="100" width="40" height="20" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="114" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">2</text>
  <rect x="70" y="100" width="66" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="103" y="114" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">NULL</text>

  <rect x="30" y="124" width="40" height="20" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="138" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">3</text>
  <rect x="70" y="124" width="66" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="103" y="138" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">4.8</text>

  <rect x="30" y="148" width="40" height="20" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="162" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">4</text>
  <rect x="70" y="148" width="66" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="103" y="162" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">NULL</text>

  <rect x="30" y="172" width="40" height="20" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="186" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">5</text>
  <rect x="70" y="172" width="66" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="103" y="186" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">4.2</text>

  <rect x="30" y="196" width="40" height="20" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="210" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">6</text>
  <rect x="70" y="196" width="66" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="103" y="210" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">NULL</text>

  <!-- 管道一：= NULL（错误） -->
  <path d="M 140 110 C 170 110 172 82 196 82" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="168" y="74" font-size="8.5" fill="#b85450" filter="url(#rough2)">✗ 翻车现场</text>

  <rect x="200" y="44" width="330" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="365" y="62" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">WHERE rating = NULL　✗</text>
  <text x="216" y="82" font-size="9.5" fill="#333" filter="url(#rough2)">4.5 = NULL　→ UNKNOWN（不是 TRUE！）</text>
  <text x="216" y="98" font-size="9.5" fill="#333" filter="url(#rough2)">NULL = NULL → UNKNOWN（未知 ≠ 已知相等）</text>
  <text x="216" y="114" font-size="9.5" fill="#333" filter="url(#rough2)">4.8 = NULL　→ UNKNOWN</text>
  <text x="216" y="131" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">WHERE 只放行 TRUE → 6 行全滤 → 空集</text>

  <!-- 管道二：IS NULL（正确） -->
  <path d="M 140 122 C 170 122 172 200 196 200" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="196" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">✓ 命中</text>

  <rect x="200" y="158" width="330" height="106" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="365" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">WHERE rating IS NULL　✓</text>
  <text x="216" y="196" font-size="9.5" fill="#333" filter="url(#rough2)">4.5 IS NULL → FALSE　（有值，滤掉）</text>
  <text x="216" y="212" font-size="9.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">NULL IS NULL → TRUE　（放行！）</text>
  <text x="216" y="228" font-size="9.5" fill="#333" filter="url(#rough2)">4.8 IS NULL → FALSE　（滤掉）</text>
  <text x="216" y="252" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">TRUE 的 3 行幸存：book_id = 2 / 4 / 6</text>

  <!-- 底部注释 -->
  <rect x="30" y="286" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">三值逻辑：比较运算遇 NULL 一律得 UNKNOWN，判不了空</text>
  <text x="280" y="328" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">判空只有专用谓词 IS [NOT] NULL（或 MySQL 的 NULL 安全等号 &lt;=&gt;）</text>

  <text x="103" y="236" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">↕ 共 6 行</text>
</svg>
