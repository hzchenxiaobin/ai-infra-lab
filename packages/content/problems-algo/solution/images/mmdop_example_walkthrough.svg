<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,1,2,3,7,10], p = 2，在 [0, 9] 上二分</text>

  <!-- header row for table -->
  <text x="20" y="58" font-size="11" fill="#888" font-weight="bold">轮次</text>
  <text x="80" y="58" font-size="11" fill="#888" font-weight="bold">区间 [lo,hi]</text>
  <text x="170" y="58" font-size="11" fill="#888" font-weight="bold">mid</text>
  <text x="210" y="58" font-size="11" fill="#888" font-weight="bold">贪心配对（差值 ≤ mid）</text>
  <text x="470" y="58" font-size="11" fill="#888" font-weight="bold">count</text>
  <text x="530" y="58" font-size="11" fill="#888" font-weight="bold">判定/动作</text>
  <line x1="14" y1="64" x2="586" y2="64" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Round 1 ===== -->
  <text x="20" y="86" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="80" y="86" font-size="12" fill="#333">[0, 9]</text>
  <text x="170" y="86" font-size="12" fill="#d6a040" font-weight="bold">4</text>
  <!-- pairing chips: (1,1)(2,3)(7,10) -->
  <g font-size="10" fill="#333">
    <rect x="210" y="74" width="46" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="233" y="88" text-anchor="middle">(1,1)差0</text>
    <rect x="260" y="74" width="46" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="283" y="88" text-anchor="middle">(2,3)差1</text>
    <rect x="310" y="74" width="52" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="336" y="88" text-anchor="middle">(7,10)差3</text>
  </g>
  <text x="470" y="88" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="530" y="88" font-size="11" fill="#4a7a3a" font-weight="bold">≥2 ✓ ans=4</text>
  <text x="530" y="102" font-size="9" fill="#888">hi=3</text>

  <!-- ===== Round 2 ===== -->
  <text x="20" y="130" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="80" y="130" font-size="12" fill="#333">[0, 3]</text>
  <text x="170" y="130" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <g font-size="10" fill="#333">
    <rect x="210" y="118" width="46" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="233" y="132" text-anchor="middle">(1,1)差0</text>
    <rect x="260" y="118" width="46" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="283" y="132" text-anchor="middle">(2,3)差1</text>
    <rect x="310" y="118" width="60" height="20" fill="#fff" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="340" y="132" text-anchor="middle" fill="#999">(7,10)差3&gt;1</text>
  </g>
  <text x="470" y="132" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="530" y="132" font-size="11" fill="#4a7a3a" font-weight="bold">≥2 ✓ ans=1</text>
  <text x="530" y="146" font-size="9" fill="#888">hi=0</text>

  <!-- ===== Round 3 ===== -->
  <text x="20" y="174" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="80" y="174" font-size="12" fill="#333">[0, 0]</text>
  <text x="170" y="174" font-size="12" fill="#d6a040" font-weight="bold">0</text>
  <g font-size="10" fill="#333">
    <rect x="210" y="162" width="46" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="233" y="176" text-anchor="middle">(1,1)差0</text>
    <rect x="260" y="162" width="60" height="20" fill="#fff" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="290" y="176" text-anchor="middle" fill="#999">(2,3)差1&gt;0</text>
    <rect x="324" y="162" width="60" height="20" fill="#fff" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="354" y="176" text-anchor="middle" fill="#999">其余均&gt;0</text>
  </g>
  <text x="470" y="176" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="530" y="176" font-size="11" fill="#b85450" font-weight="bold">&lt;2 ✗</text>
  <text x="530" y="190" font-size="9" fill="#888">lo=1</text>

  <!-- end line -->
  <line x1="14" y1="206" x2="586" y2="206" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="20" y="228" font-size="12" fill="#4a7a3a" font-weight="bold">结束</text>
  <text x="80" y="228" font-size="12" fill="#333">lo=1 &gt; hi=0，循环退出</text>
  <text x="300" y="228" font-size="12" fill="#b85450" font-weight="bold">返回 ans = 1 ⭐</text>

  <!-- ===== pairing visualization ===== -->
  <text x="20" y="266" font-size="12" fill="#888" font-weight="bold">最终方案（ans = 1）：从 nums=[1,1,2,3,7,10] 选 2 个不相交对</text>

  <g font-size="12" font-weight="bold" fill="#333">
    <rect x="40" y="280" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="70" y="300" text-anchor="middle">1</text>
    <rect x="104" y="280" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="134" y="300" text-anchor="middle">1</text>
    <rect x="168" y="280" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="198" y="300" text-anchor="middle">2</text>
    <rect x="232" y="280" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="262" y="300" text-anchor="middle">3</text>
    <rect x="296" y="280" width="60" height="30" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="326" y="300" text-anchor="middle" fill="#999">7</text>
    <rect x="360" y="280" width="60" height="30" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="390" y="300" text-anchor="middle" fill="#999">10</text>
  </g>

  <!-- brackets -->
  <path d="M 70 312 Q 70 326 102 326 Q 134 326 134 312" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="102" y="342" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">对1 差0</text>
  <path d="M 198 312 Q 198 326 230 326 Q 262 326 262 312" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="230" y="342" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">对2 差1</text>

  <text x="440" y="300" font-size="12" fill="#444" font-weight="bold">max差 = max(0,1) = 1</text>
  <text x="440" y="318" font-size="11" fill="#888">已是最小可能</text>

  <!-- insight box -->
  <rect x="40" y="366" width="520" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="56" y="388" font-size="11" fill="#444" font-weight="bold">观察：答案 1 正是「相邻差值排序后第 p 小的无关性」的体现</text>
  <text x="56" y="406" font-size="11" fill="#666">每轮贪心 O(n) 计数 → 总复杂度 O(n log n + n log W)，W = max−min ≤ 10^9</text>
  <text x="56" y="422" font-size="11" fill="#d6a040" font-weight="bold">与 719 同骨架，差异仅在 count()：本题要求「不相交」，故贪心配相邻对后跳 2 格</text>
</svg>
