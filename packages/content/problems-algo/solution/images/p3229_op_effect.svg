<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="430" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">一次操作的两种视角：d 上动一整段，差分 e 上只动两个格子</text>
  <text x="290" y="40" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">示例 1：d = [−1, −1, −1, −2]，差分 e = [−1, 0, 0, −1, 2]</text>

  <!-- Panel A: d 上的操作 -->
  <rect x="22" y="52" width="536" height="130" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 在 d 上：一次操作可以覆盖任意长的一段</text>

  <text x="110" y="100" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">d =</text>
  <rect x="120" y="82" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="101" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="164" y="82" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="101" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="208" y="82" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="101" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="252" y="82" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="101" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">−2</text>
  <text x="330" y="100" font-size="10.5" fill="#555" filter="url(#rough2)">操作 1：下标 0..3 整体 +1</text>
  <text x="330" y="116" font-size="10.5" fill="#555" filter="url(#rough2)">（一次搞定 4 个位置）</text>

  <path d="M 140 114 L 140 122" fill="none" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 184 114 L 184 122" fill="none" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 228 114 L 228 122" fill="none" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 272 114 L 272 122" fill="none" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="124" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="143" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="164" y="124" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="143" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="208" y="124" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="143" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="252" y="124" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="143" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="330" y="143" font-size="10.5" fill="#555" filter="url(#rough2)">操作 2：下标 3..3 再 +1 → 全零 ✓</text>

  <text x="290" y="172" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">逐位单点修正要 5 次；打包成 2 次区间操作——这就是「子数组」三个字的价值</text>

  <!-- Panel B: e 上的效果 -->
  <rect x="22" y="194" width="536" height="200" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 在差分 e 上：无论区间多长，一次操作只碰两个格子（各 ±1）</text>

  <text x="100" y="244" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">操作前 e =</text>
  <rect x="110" y="226" width="38" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="129" y="245" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="154" y="226" width="38" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="173" y="245" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="198" y="226" width="38" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="217" y="245" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="242" y="226" width="38" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="261" y="245" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="286" y="226" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="305" y="245" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <path d="M 129 256 L 129 268" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="117" y="278" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1</text>
  <path d="M 305 256 L 305 268" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="313" y="278" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>

  <text x="290" y="286" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">操作 1（[0..3] +1）：e₀ +1、e₄ −1 —— 相当于把一个「1」从 e₄ 搬到 e₀</text>

  <text x="100" y="316" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">操作后 e =</text>
  <rect x="110" y="298" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="129" y="317" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="154" y="298" width="38" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="173" y="317" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="198" y="298" width="38" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="217" y="317" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="242" y="298" width="38" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="261" y="317" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="286" y="298" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="317" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="290" y="346" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">操作 2（[3..3] +1）：e₃ +1、e₄ −1 → e = [0, 0, 0, 0, 0] ✓</text>

  <text x="290" y="376" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">每次操作 Σ|e| 至多减 2 → 操作数 ≥ 初始 Σ|e| / 2，下界由此而来</text>
</svg>
