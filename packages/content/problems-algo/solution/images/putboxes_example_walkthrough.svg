<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：boxes = [4,3,4,1], warehouse = [5,3,3,4,1]</text>
  <text x="280" y="40" text-anchor="middle" font-size="11" fill="#888">排序后 boxes = [1,3,4,4]，前缀最小 minH = [5,3,3,3,1]</text>

  <!-- ===== Table header ===== -->
  <rect x="20" y="52" width="520" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="70" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">步</text>
  <text x="120" y="70" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">j (room)</text>
  <text x="185" y="70" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">minH[j]</text>
  <text x="260" y="70" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">当前箱子</text>
  <text x="345" y="70" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">能放?</text>
  <text x="460" y="70" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">动作</text>

  <!-- Row 1: j=4, box=1 -->
  <rect x="20" y="80" width="520" height="28" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="50" y="98" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="120" y="98" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="185" y="98" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="260" y="98" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="345" y="98" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 1≤1</text>
  <text x="460" y="98" text-anchor="middle" font-size="10" fill="#555">放！boxIdx=1, j=3</text>

  <!-- Row 2: j=3, box=3 -->
  <rect x="20" y="110" width="520" height="28" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="50" y="128" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="120" y="128" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="185" y="128" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="260" y="128" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="345" y="128" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 3≤3</text>
  <text x="460" y="128" text-anchor="middle" font-size="10" fill="#555">放！boxIdx=2, j=2</text>

  <!-- Row 3: j=2, box=4 (skip) -->
  <rect x="20" y="140" width="520" height="28" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="50" y="158" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="120" y="158" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="185" y="158" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="260" y="158" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="345" y="158" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ 4&gt;3</text>
  <text x="460" y="158" text-anchor="middle" font-size="10" fill="#b85450">跳过 room 2</text>

  <!-- Row 4: j=1, box=4 (skip) -->
  <rect x="20" y="170" width="520" height="28" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="50" y="188" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="120" y="188" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="185" y="188" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="260" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="345" y="188" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ 4&gt;3</text>
  <text x="460" y="188" text-anchor="middle" font-size="10" fill="#b85450">跳过 room 1</text>

  <!-- Row 5: j=0, box=4 (place) -->
  <rect x="20" y="200" width="520" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="218" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="120" y="218" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="185" y="218" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="260" y="218" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="345" y="218" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 4≤5</text>
  <text x="460" y="218" text-anchor="middle" font-size="10" fill="#555">放！boxIdx=3, j=−1</text>

  <!-- Row 6: loop ends -->
  <rect x="20" y="230" width="520" height="28" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="50" y="248" text-anchor="middle" font-size="11" fill="#888">6</text>
  <text x="120" y="248" text-anchor="middle" font-size="11" fill="#888">−1</text>
  <text x="185" y="248" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="260" y="248" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="345" y="248" text-anchor="middle" font-size="11" fill="#888">j &lt; 0，结束</text>
  <text x="460" y="248" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">返回 3</text>

  <!-- ===== Bottom: final placement visual ===== -->
  <text x="40" y="284" font-size="12" fill="#888">最终放置结果：</text>

  <!-- Rooms with boxes placed -->
  <!-- Room 0: box 4 -->
  <rect x="60" y="300" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="65" y="308" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="85" y="326" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <!-- Room 1: empty (skipped) -->
  <rect x="120" y="320" width="50" height="20" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="145" y="334" text-anchor="middle" font-size="10" fill="#ccc">空</text>

  <!-- Room 2: empty (skipped) -->
  <rect x="180" y="320" width="50" height="20" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="205" y="334" text-anchor="middle" font-size="10" fill="#ccc">空</text>

  <!-- Room 3: box 3 -->
  <rect x="240" y="320" width="50" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="245" y="304" width="40" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="265" y="318" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <!-- Room 4: box 1 -->
  <rect x="300" y="336" width="50" height="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="305" y="324" width="40" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="325" y="335" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>

  <!-- Ground line -->
  <line x1="50" y1="340" x2="360" y2="340" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- Room labels -->
  <text x="85" y="356" text-anchor="middle" font-size="10" fill="#999">room 0</text>
  <text x="145" y="356" text-anchor="middle" font-size="10" fill="#999">room 1</text>
  <text x="205" y="356" text-anchor="middle" font-size="10" fill="#999">room 2</text>
  <text x="265" y="356" text-anchor="middle" font-size="10" fill="#999">room 3</text>
  <text x="325" y="356" text-anchor="middle" font-size="10" fill="#999">room 4</text>

  <!-- Result -->
  <rect x="390" y="310" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="465" y="330" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">答案: 3 / 4 个箱子</text>
</svg>
