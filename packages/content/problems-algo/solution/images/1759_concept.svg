<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：同质子串只存在于「同字符连续段」内，长 k 段贡献 k(k+1)/2</text>

  <!-- string label -->
  <text x="40" y="66" font-size="12" fill="#888" filter="url(#rough2)">s = "abbcccaa"</text>

  <!-- 8 cells decomposed into runs: a(orange) b,b(green) c,c,c(blue) a,a(orange) -->
  <g font-size="14" fill="#333" text-anchor="middle">
    <rect x="100" y="56" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="120" y="79" filter="url(#rough2)">a</text>
    <rect x="140" y="56" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="160" y="79" filter="url(#rough2)">b</text>
    <rect x="180" y="56" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="200" y="79" filter="url(#rough2)">b</text>
    <rect x="220" y="56" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="240" y="79" filter="url(#rough2)">c</text>
    <rect x="260" y="56" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="280" y="79" filter="url(#rough2)">c</text>
    <rect x="300" y="56" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="320" y="79" filter="url(#rough2)">c</text>
    <rect x="340" y="56" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="360" y="79" filter="url(#rough2)">a</text>
    <rect x="380" y="56" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="400" y="79" filter="url(#rough2)">a</text>
  </g>

  <!-- run brackets + labels -->
  <path d="M 100 96 L 100 100 L 140 100 L 140 96" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="120" y="114" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">k=1</text>
  <path d="M 140 96 L 140 100 L 220 100 L 220 96" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="180" y="114" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">k=2</text>
  <path d="M 220 96 L 220 100 L 340 100 L 340 96" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="280" y="114" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">k=3</text>
  <path d="M 340 96 L 340 100 L 420 100 L 420 96" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="380" y="114" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">k=2</text>

  <!-- contribution row -->
  <text x="40" y="138" font-size="12" fill="#888" filter="url(#rough2)">各段贡献：</text>
  <text x="120" y="138" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="180" y="138" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="280" y="138" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="380" y="138" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="470" y="138" font-size="12" fill="#888" filter="url(#rough2)">→ 合计 13</text>

  <!-- divider -->
  <path d="M 40 158 L 520 158" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- zoom into the ccc run: enumerate homogenous substrings as a triangle -->
  <text x="40" y="184" font-size="12" fill="#888" filter="url(#rough2)">以 "ccc"（k=3）为例，枚举同质子串：</text>

  <!-- triangle of substrings: length1 x3, length2 x2, length3 x1 -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <!-- length 1: three single c -->
    <rect x="180" y="200" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="200" y="219" filter="url(#rough2)">c</text>
    <rect x="222" y="200" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="242" y="219" filter="url(#rough2)">c</text>
    <rect x="264" y="200" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="284" y="219" filter="url(#rough2)">c</text>
    <text x="330" y="219" font-size="11" fill="#888" filter="url(#rough2)">← 长度 1：3 个</text>

    <!-- length 2: two cc -->
    <rect x="200" y="236" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="230" y="255" filter="url(#rough2)">cc</text>
    <rect x="264" y="236" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="294" y="255" filter="url(#rough2)">cc</text>
    <text x="354" y="255" font-size="11" fill="#888" filter="url(#rough2)">← 长度 2：2 个</text>

    <!-- length 3: one ccc -->
    <rect x="222" y="272" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="262" y="291" filter="url(#rough2)">ccc</text>
    <text x="354" y="291" font-size="11" fill="#888" filter="url(#rough2)">← 长度 3：1 个</text>
  </g>

  <!-- sum brace -->
  <path d="M 165 214 L 159 214 L 159 286 L 165 286" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="150" y="254" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">求和</text>

  <!-- formula box -->
  <rect x="150" y="312" width="300" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="334" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3 + 2 + 1 = 6 = <tspan fill="#b85450" font-weight="bold">k(k+1)/2</tspan></text>

  <!-- bottom notes -->
  <text x="40" y="372" font-size="11.5" fill="#555" filter="url(#rough2)">• 跨段拼接必含异字符 → 非同质，故各段独立计数后求和</text>
  <text x="40" y="390" font-size="11.5" fill="#555" filter="url(#rough2)">• 长 k 段：长度 1 有 k 个、长度 2 有 k−1 个 … 长度 k 有 1 个 → 等差数列和 <tspan fill="#b85450" font-weight="bold">k(k+1)/2</tspan></text>
</svg>
