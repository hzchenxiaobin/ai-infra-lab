<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2806f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">+5 技巧：把「四舍六入五取大」变成整除下取整</text>

  <!-- key formula box -->
  <rect x="90" y="44" width="380" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="76" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">roundedAmount = ⌊(x + 5) / 10⌋ × 10</text>

  <!-- table: x range -> +5 -> floor /10 -> *10 -->
  <text x="280" y="122" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">逐段验证（x = purchaseAmount）</text>

  <!-- table header -->
  <rect x="50" y="134" width="120" height="26" fill="#446688" rx="3" filter="url(#rough2)"/>
  <text x="110" y="151" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">x 范围</text>
  <rect x="170" y="134" width="120" height="26" fill="#446688" rx="3" filter="url(#rough2)"/>
  <text x="230" y="151" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">(x+5)/10 区间</text>
  <rect x="290" y="134" width="100" height="26" fill="#446688" rx="3" filter="url(#rough2)"/>
  <text x="340" y="151" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">⌊⌋ 下取整</text>
  <rect x="390" y="134" width="120" height="26" fill="#446688" rx="3" filter="url(#rough2)"/>
  <text x="450" y="151" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">× 10 = 取整值</text>

  <!-- row 1: [0,4] -->
  <rect x="50" y="160" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[0, 4]</text>
  <rect x="170" y="160" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="230" y="176" text-anchor="middle" font-size="11" fill="#333">[0.5, 0.9]</text>
  <rect x="290" y="160" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="340" y="176" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="390" y="160" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="450" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- row 2: [5,14] -->
  <rect x="50" y="184" width="120" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="200" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">[5, 14]</text>
  <rect x="170" y="184" width="120" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="230" y="200" text-anchor="middle" font-size="11" fill="#333">[1.0, 1.9]</text>
  <rect x="290" y="184" width="100" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="340" y="200" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="390" y="184" width="120" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="450" y="200" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">10</text>

  <!-- row 3: [15,24] -->
  <rect x="50" y="208" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[15, 24]</text>
  <rect x="170" y="208" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="230" y="224" text-anchor="middle" font-size="11" fill="#333">[2.0, 2.9]</text>
  <rect x="290" y="208" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="340" y="224" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="390" y="208" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="450" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">20</text>

  <!-- row 4: [25,34] -->
  <rect x="50" y="232" width="120" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="248" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">[25, 34]</text>
  <rect x="170" y="232" width="120" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="230" y="248" text-anchor="middle" font-size="11" fill="#333">[3.0, 3.9]</text>
  <rect x="290" y="232" width="100" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="340" y="248" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="390" y="232" width="120" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="450" y="248" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">30</text>

  <!-- row 5: ... -->
  <rect x="50" y="256" width="120" height="24" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="272" text-anchor="middle" font-size="11" fill="#999">…以此类推</text>
  <rect x="170" y="256" width="120" height="24" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="290" y="256" width="100" height="24" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="390" y="256" width="120" height="24" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="450" y="272" text-anchor="middle" font-size="11" fill="#999">…</text>

  <!-- key insight box -->
  <rect x="50" y="300" width="460" height="82" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">为什么 +5 恰好实现「平手取较大」？</text>
  <text x="280" y="342" text-anchor="middle" font-size="11" fill="#555">平手点在 ×5 处（如 15 距 10 和 20 等距）</text>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#555">+5 后恰好越过整除边界 → 下取整偏向较大商</text>
  <text x="280" y="376" text-anchor="middle" font-size="10" fill="#888">例：15+5=20, ⌊20/10⌋=2, ×10=20 ✓</text>
</svg>
