<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：每州 RANK 与 CUME_DIST 双视角，幸存者一致</text>
  <text x="290" y="38" text-anchor="middle" font-size="9" fill="#888">cd = 同州不高于该分的行数 ÷ N；只有最大值 cd = 1.0 ≥ 0.95</text>

  <!-- ===== California panel ===== -->
  <rect x="25" y="50" width="255" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="152" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">California（N=3）</text>
  <text x="152" y="82" text-anchor="middle" font-size="8" fill="#888">fraud_score · rk · cd</text>
  <rect x="37" y="88" width="231" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="102" font-size="9" fill="#4a7a3a" font-weight="bold">0.92</text>
  <text x="140" y="102" font-size="9" fill="#4a7a3a" font-weight="bold">rk 1</text>
  <text x="200" y="102" font-size="9" fill="#4a7a3a" font-weight="bold">cd 1.0 ✓</text>
  <rect x="37" y="112" width="231" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="126" font-size="9" fill="#333">0.68</text>
  <text x="140" y="126" font-size="9" fill="#333">rk 2</text>
  <text x="200" y="126" font-size="9" fill="#333">cd 0.67</text>
  <rect x="37" y="136" width="231" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="150" font-size="9" fill="#333">0.17</text>
  <text x="140" y="150" font-size="9" fill="#333">rk 3</text>
  <text x="200" y="150" font-size="9" fill="#333">cd 0.33</text>

  <!-- ===== New York panel ===== -->
  <rect x="300" y="50" width="255" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="427" y="68" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">New York（N=3）</text>
  <text x="427" y="82" text-anchor="middle" font-size="8" fill="#888">fraud_score · rk · cd</text>
  <rect x="312" y="88" width="231" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="102" font-size="9" fill="#4a7a3a" font-weight="bold">0.94</text>
  <text x="415" y="102" font-size="9" fill="#4a7a3a" font-weight="bold">rk 1</text>
  <text x="475" y="102" font-size="9" fill="#4a7a3a" font-weight="bold">cd 1.0 ✓</text>
  <rect x="312" y="112" width="231" height="20" fill="#fff" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="335" y="126" font-size="9" fill="#333">0.81</text>
  <text x="415" y="126" font-size="9" fill="#333">rk 2</text>
  <text x="475" y="126" font-size="9" fill="#333">cd 0.67</text>
  <rect x="312" y="136" width="231" height="20" fill="#fff" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="335" y="150" font-size="9" fill="#333">0.77</text>
  <text x="415" y="150" font-size="9" fill="#333">rk 3</text>
  <text x="475" y="150" font-size="9" fill="#333">cd 0.33</text>

  <!-- ===== Texas panel ===== -->
  <rect x="25" y="184" width="255" height="118" fill="#f5f5f5" stroke="#888888" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="152" y="202" text-anchor="middle" font-size="11" fill="#777" font-weight="bold">Texas（N=3）</text>
  <text x="152" y="216" text-anchor="middle" font-size="8" fill="#888">fraud_score · rk · cd</text>
  <rect x="37" y="222" width="231" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="236" font-size="9" fill="#4a7a3a" font-weight="bold">0.98</text>
  <text x="140" y="236" font-size="9" fill="#4a7a3a" font-weight="bold">rk 1</text>
  <text x="200" y="236" font-size="9" fill="#4a7a3a" font-weight="bold">cd 1.0 ✓</text>
  <rect x="37" y="246" width="231" height="20" fill="#fff" stroke="#888888" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="260" font-size="9" fill="#333">0.97</text>
  <text x="140" y="260" font-size="9" fill="#333">rk 2</text>
  <text x="200" y="260" font-size="9" fill="#333">cd 0.67</text>
  <rect x="37" y="270" width="231" height="20" fill="#fff" stroke="#888888" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="284" font-size="9" fill="#333">0.96</text>
  <text x="140" y="284" font-size="9" fill="#333">rk 3</text>
  <text x="200" y="284" font-size="9" fill="#333">cd 0.33</text>

  <!-- ===== Florida panel ===== -->
  <rect x="300" y="184" width="255" height="166" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="427" y="202" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Florida（N=5）</text>
  <text x="427" y="216" text-anchor="middle" font-size="8" fill="#888">fraud_score · rk · cd</text>
  <rect x="312" y="222" width="231" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="236" font-size="9" fill="#4a7a3a" font-weight="bold">0.98</text>
  <text x="415" y="236" font-size="9" fill="#4a7a3a" font-weight="bold">rk 1</text>
  <text x="475" y="236" font-size="9" fill="#4a7a3a" font-weight="bold">cd 1.0 ✓</text>
  <rect x="312" y="246" width="231" height="20" fill="#fff" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="335" y="260" font-size="9" fill="#333">0.97</text>
  <text x="415" y="260" font-size="9" fill="#333">rk 2</text>
  <text x="475" y="260" font-size="9" fill="#333">cd 0.8</text>
  <rect x="312" y="270" width="231" height="20" fill="#fff" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="335" y="284" font-size="9" fill="#333">0.88</text>
  <text x="415" y="284" font-size="9" fill="#333">rk 3</text>
  <text x="475" y="284" font-size="9" fill="#333">cd 0.6</text>
  <rect x="312" y="294" width="231" height="20" fill="#fff" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="335" y="308" font-size="9" fill="#333">0.78</text>
  <text x="415" y="308" font-size="9" fill="#333">rk 4</text>
  <text x="475" y="308" font-size="9" fill="#333">cd 0.4</text>
  <rect x="312" y="318" width="231" height="20" fill="#fff" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="335" y="332" font-size="9" fill="#333">0.66</text>
  <text x="415" y="332" font-size="9" fill="#333">rk 5</text>
  <text x="475" y="332" font-size="9" fill="#333">cd 0.2</text>

  <!-- Arrows from each panel to output -->
  <path d="M 152 302 C 152 330, 200 350, 250 364" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 427 350 L 427 362" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Output box ===== -->
  <rect x="25" y="368" width="530" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="388" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">输出（state 升序）：</text>
  <text x="290" y="408" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">(1, California, 0.92) → (11, Florida, 0.98) → (4, New York, 0.94) → (7, Texas, 0.98)</text>
  <text x="290" y="430" text-anchor="middle" font-size="9" fill="#666">每州最大值 cd = 1.0 过线；其余最高仅 0.8（Florida 的 0.97），均 &lt; 0.95</text>
</svg>
