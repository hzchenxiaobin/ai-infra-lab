<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：裂项相消——总得分 = 终点值 − 起点值</text>

  <text x="16" y="44" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 一条合法路径：从 (0,1) 出发，经 (2,1)，终点 (2,2)</text>

  <!-- grid 4x4 -->
  <rect x="32" y="46" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="53" y="70" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">9</text>

  <rect x="74" y="46" width="42" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="67" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="95" y="79" text-anchor="middle" font-size="8" fill="#4a7a3a" filter="url(#rough2)">起点</text>

  <rect x="116" y="46" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="70" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">7</text>

  <rect x="158" y="46" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="179" y="70" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">3</text>

  <rect x="32" y="84" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="53" y="108" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">8</text>

  <rect x="74" y="84" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="108" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">9</text>

  <rect x="116" y="84" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="108" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">6</text>

  <rect x="158" y="84" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="179" y="108" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">1</text>

  <rect x="32" y="122" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="53" y="146" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">6</text>

  <rect x="74" y="122" width="42" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="143" text-anchor="middle" font-size="14" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="95" y="155" text-anchor="middle" font-size="8" fill="#8a6a1f" filter="url(#rough2)">中间</text>

  <rect x="116" y="122" width="42" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="137" y="143" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">14</text>
  <text x="137" y="155" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">终点</text>

  <rect x="158" y="122" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="179" y="146" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">3</text>

  <rect x="32" y="160" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="53" y="184" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">2</text>

  <rect x="74" y="160" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="184" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">5</text>

  <rect x="116" y="160" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="184" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">3</text>

  <rect x="158" y="160" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="179" y="184" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">1</text>

  <!-- path arrows -->
  <path d="M 84 88 L 84 115" stroke="#4a7a3a" stroke-width="1.8" stroke-linecap="round" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="104" y="103" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">+2</text>
  <path d="M 103 141 L 127 141" stroke="#4a7a3a" stroke-width="1.8" stroke-linecap="round" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="110" y="133" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">+7</text>

  <!-- formula -->
  <text x="228" y="70" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">② 逐段累加：</text>
  <text x="233" y="94" font-size="12" fill="#555" filter="url(#rough2)">得分 = (7 − 5) + (14 − 7)</text>
  <text x="233" y="116" font-size="12" fill="#555" filter="url(#rough2)">= <tspan fill="#b85450" text-decoration="line-through">7</tspan><tspan fill="#446688" font-weight="bold"> − 5</tspan><tspan fill="#b85450" font-weight="bold"> + 14</tspan><tspan fill="#999" text-decoration="line-through"> − 7</tspan></text>
  <text x="233" y="138" font-size="12" fill="#555" filter="url(#rough2)">= <tspan fill="#b85450" font-weight="bold">14 − 5 = 9</tspan></text>

  <!-- conclusion box -->
  <rect x="225" y="150" width="286" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="368" y="169" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">中间格的 +7 与 −7 成对抵消（望远镜求和）</text>
  <text x="368" y="186" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">⇒ 怎么绕、走几步都不影响：总分 = 终点 − 起点</text>
  <text x="368" y="197" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">「搜路径」坍缩为「选首尾」</text>

  <!-- reduction box -->
  <rect x="16" y="212" width="488" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="232" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">③ ans = max 终点 (i,j) [ grid[i][j] − 左上区域 [0..i]×[0..j] 去掉自身后的最小值 ]</text>
  <text x="260" y="250" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">可达 ⟺ 起点行 ≤ i 且列 ≤ j 且 ≠ 自身（先右后下，两段必达）</text>
  <text x="260" y="266" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">premin[i][j] = min( grid[i][j], premin[i−1][j], premin[i][j−1] )，二维前缀最小值</text>

  <!-- bottom note -->
  <rect x="16" y="286" width="488" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">换个视角：121 买卖股票的二维版——「先买后卖」→「左上买、右下卖」</text>
  <text x="260" y="323" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">前缀最小值从一维数组升格为二维矩形（递推骨架同 304 二维区域和）</text>
  <text x="260" y="339" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">去掉自身恰好 = min( 上方块 premin[i−1][j]，左块 premin[i][j−1] )</text>
</svg>
