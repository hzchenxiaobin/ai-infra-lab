<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：序列须逐值匹配 且 恰好终止于叶子</text>
  <text x="150" y="46" text-anchor="middle" font-size="11" fill="#888">arr = [0,1,0,1] 与 [0,1,1] 的对照</text>

  <!-- edges (drawn before nodes so nodes overlap edge ends) -->
  <!-- root -> L1 left (1): green, valid path -->
  <path d="M 278 78 L 232 120" stroke="#4a7a3a" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <!-- root -> L1 right (0): blue, off path -->
  <path d="M 302 78 L 368 120" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <!-- 1 -> L2 left (0): green, valid path -->
  <path d="M 210 148 L 192 188" stroke="#4a7a3a" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <!-- 1 -> L2 right (1): orange, invalid (ends at internal) -->
  <path d="M 230 148 L 250 188" stroke="#d6a040" stroke-width="2.4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <!-- 0(idx2) -> 0: blue -->
  <path d="M 380 148 L 412 188" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <!-- 0(180) -> 1(200): green leaf -->
  <path d="M 184 220 L 196 258" stroke="#4a7a3a" stroke-width="2.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- 1(260) -> 0(240): blue (children of internal node, prove it's not leaf) -->
  <path d="M 252 220 L 244 258" stroke="#446688" stroke-width="1.5" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <!-- 1(260) -> 0(280): blue -->
  <path d="M 268 220 L 276 258" stroke="#446688" stroke-width="1.5" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>

  <!-- nodes -->
  <!-- root 0 (on both paths) -->
  <circle cx="290" cy="64" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="290" y="69" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>

  <!-- L1: 1 (on path) -->
  <circle cx="220" cy="134" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="220" y="139" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <!-- L1: 0 (off path) -->
  <circle cx="380" cy="134" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="139" text-anchor="middle" font-size="13" fill="#333">0</text>

  <!-- L2: 0 (on valid path) -->
  <circle cx="180" cy="204" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="180" y="209" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <!-- L2: 1 (invalid end - internal node) -->
  <circle cx="260" cy="204" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="260" y="209" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <!-- L2: 0 (off path) -->
  <circle cx="420" cy="204" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="209" text-anchor="middle" font-size="13" fill="#333">0</text>

  <!-- L3: 1 (valid leaf) -->
  <circle cx="200" cy="274" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.8" filter="url(#rough2)"/>
  <text x="200" y="279" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <!-- L3: 0 (child of internal, dashed to show internal has kids) -->
  <circle cx="240" cy="274" r="14" fill="#f4f4f4" stroke="#999" stroke-width="1.2" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <text x="240" y="278" text-anchor="middle" font-size="11" fill="#777">0</text>
  <circle cx="280" cy="274" r="14" fill="#f4f4f4" stroke="#999" stroke-width="1.2" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="11" fill="#777">0</text>

  <!-- index chips along valid path: arr[0..3] = 0,1,0,1 -->
  <text x="60" y="70" font-size="10" fill="#4a7a3a" font-weight="bold">arr[i] →</text>
  <rect x="100" y="58" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="112" y="72" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="100" y="128" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="112" y="142" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="100" y="198" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="112" y="212" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="100" y="268" width="24" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="112" y="282" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <!-- separator -->
  <path d="M 330 50 L 330 320" stroke="#dddddd" stroke-width="1.2" stroke-dasharray="3,4" filter="url(#rough2)"/>

  <!-- right side explanation -->
  <text x="445" y="64" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">判定要点</text>

  <rect x="362" y="78" width="170" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="447" y="98" text-anchor="middle" font-size="10" fill="#333">arr=[0,1,0,1]</text>
  <text x="447" y="114" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">0→1→0→1 到叶子</text>
  <text x="447" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ true</text>

  <rect x="362" y="144" width="170" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="447" y="164" text-anchor="middle" font-size="10" fill="#333">arr=[0,1,1]</text>
  <text x="447" y="180" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">0→1→1 止于内部节点</text>
  <text x="447" y="194" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ false</text>

  <rect x="362" y="210" width="170" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="447" y="228" text-anchor="middle" font-size="10" fill="#333">两个充要条件缺一不可</text>
  <text x="447" y="244" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">① 逐值全匹配 arr</text>
  <text x="447" y="260" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">② 末位恰是叶子</text>
  <text x="447" y="274" text-anchor="middle" font-size="9" fill="#888">(虚线节点=内部节点的孩子)</text>

  <text x="447" y="300" text-anchor="middle" font-size="10" fill="#888">叶子 = 无左右孩子</text>
  <text x="447" y="314" text-anchor="middle" font-size="10" fill="#888">序列用尽而未到叶 → false</text>
</svg>
