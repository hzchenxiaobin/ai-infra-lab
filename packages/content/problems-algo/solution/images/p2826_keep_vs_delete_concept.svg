<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：删得最少 ⇔ 留得最多</text>

  <!-- 原数组格子行 -->
  <text x="40" y="82" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">nums =</text>

  <rect x="118" y="58" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="143" y="82" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="174" y="58" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="199" y="82" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="230" y="58" width="50" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="82" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="286" y="58" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="311" y="82" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="342" y="58" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="367" y="82" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 下标 -->
  <text x="143" y="108" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="199" y="108" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="255" y="108" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="311" y="108" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="367" y="108" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>

  <!-- 删/留标记 -->
  <text x="143" y="130" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="199" y="130" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="255" y="130" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="311" y="130" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="367" y="130" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- 图例 -->
  <text x="430" y="70" font-size="10" fill="#b85450" filter="url(#rough2)">✗ = 删除</text>
  <text x="430" y="88" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓ = 保留</text>

  <!-- 虚线连到保留子序列 -->
  <path d="M199,136 L199,168" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M367,136 L367,168" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>

  <!-- 保留子序列 -->
  <rect x="174" y="170" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="199" y="192" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="342" y="170" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="367" y="192" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="60" y="192" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">保留子序列</text>
  <text x="283" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1 ≤ 1，非递减 ✓</text>

  <!-- 公式框 -->
  <rect x="50" y="226" width="420" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="247" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">最少删除数 = n − 最长非递减子序列长度</text>
  <text x="260" y="266" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">= 5 − 2 = 3 ✓</text>

  <!-- 提示框 -->
  <rect x="30" y="296" width="460" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">值域只有 {1, 2, 3} ⇒ 保留序列必形如 1…1 | 2…2 | 3…3（三段块，段可为空）</text>
  <text x="260" y="338" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">按「结尾值」设 f1 / f2 / f3 三个桶：f[x] = max(f[1..x]) + 1</text>
  <text x="260" y="358" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">max(f[1..x]) 只有 3 项 ⇒ 每步 O(1)，整体 O(n) 达成进阶</text>
</svg>
