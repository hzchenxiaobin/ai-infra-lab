<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：买下所有产品 ⇔ 客户购买集合 ⊇ 产品全集</text>

  <!-- Product 全集 -->
  <text x="290" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Product 表（产品全集，总数 = 2）</text>
  <rect x="200" y="66" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="240" y="80" font-size="9" fill="#446688">product_key</text>
  <rect x="210" y="84" width="70" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="245" y="97" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="300" y="84" width="70" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="335" y="97" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>

  <!-- 三个客户购买集合 -->
  <text x="290" y="130" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">各客户购买的产品集合（去重后）</text>

  <!-- Customer 1: {5,6} -> ✓ -->
  <rect x="40" y="144" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="160" text-anchor="middle" font-size="9" fill="#4a7a3a">customer_id</text>
  <text x="80" y="176" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>

  <rect x="150" y="146" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="168" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="220" y="146" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="168" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>

  <text x="310" y="160" font-size="10" fill="#446688">|集合|=2</text>
  <text x="310" y="176" font-size="10" fill="#4a7a3a" font-weight="bold">= 2 ✓</text>
  <rect x="420" y="150" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="480" y="170" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">⊇ 全集 ✓ 买下</text>

  <!-- Customer 2: {6} -> ✗ -->
  <rect x="40" y="204" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="220" text-anchor="middle" font-size="9" fill="#b85450">customer_id</text>
  <text x="80" y="236" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>

  <rect x="150" y="206" width="60" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="228" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>
  <line x1="160" y1="212" x2="200" y2="236" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="220" y="206" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="228" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>

  <text x="310" y="220" font-size="10" fill="#446688">|集合|=1</text>
  <text x="310" y="236" font-size="10" fill="#b85450" font-weight="bold">≠ 2 ✗</text>
  <rect x="420" y="210" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="480" y="230" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⊉ 全集 ✗ 缺 5</text>

  <!-- Customer 3: {5,6} -> ✓ -->
  <rect x="40" y="264" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="280" text-anchor="middle" font-size="9" fill="#4a7a3a">customer_id</text>
  <text x="80" y="296" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>

  <rect x="150" y="266" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="288" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="220" y="266" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="288" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>

  <text x="310" y="280" font-size="10" fill="#446688">|集合|=2</text>
  <text x="310" y="296" font-size="10" fill="#4a7a3a" font-weight="bold">= 2 ✓</text>
  <rect x="420" y="270" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="480" y="290" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">⊇ 全集 ✓ 买下</text>

  <!-- 总结框 -->
  <path d="M290 320 L290 340" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="90" y="346" width="400" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="366" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">关系除法（Relational Division）</text>
  <text x="290" y="384" text-anchor="middle" font-size="10" fill="#555">"买下所有产品" = 客户购买集合 ⊇ Product 全集</text>
  <text x="290" y="398" text-anchor="middle" font-size="10" fill="#555">等价判定：COUNT(DISTINCT 产品) = Product 总数</text>
</svg>
