<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：两个数组各自排序后，按下标顺序一一配对</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">第 i 小的座位 ↔ 第 i 小的学生 → 总移动距离最小</text>

  <!-- Row label: seats -->
  <text x="28" y="86" font-size="11" fill="#446688" font-weight="bold">座位(排序)</text>
  <text x="28" y="100" font-size="9.5" fill="#888">[3,1,5]→</text>
  <text x="28" y="112" font-size="9.5" fill="#888">[1,3,5]</text>

  <!-- Seats row: 1, 3, 5 (blue) at x centers 110, 200, 290 -->
  <rect x="86" y="68" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="95" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold">1</text>
  <rect x="176" y="68" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="200" y="95" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold">3</text>
  <rect x="266" y="68" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="95" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold">5</text>

  <!-- Position number axis -->
  <text x="110" y="124" text-anchor="middle" font-size="9" fill="#aaa">i=0</text>
  <text x="200" y="124" text-anchor="middle" font-size="9" fill="#aaa">i=1</text>
  <text x="290" y="124" text-anchor="middle" font-size="9" fill="#aaa">i=2</text>

  <!-- Connecting arrows: seat i -> student i (downward) -->
  <path d="M 110 116 L 110 168" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 200 116 L 200 168" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 290 116 L 290 168" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Diff labels on arrows -->
  <text x="146" y="146" font-size="11" fill="#b85450" font-weight="bold">|1−2|=1</text>
  <text x="236" y="146" font-size="11" fill="#b85450" font-weight="bold">|3−4|=1</text>
  <text x="326" y="146" font-size="11" fill="#b85450" font-weight="bold">|5−7|=2</text>

  <!-- Row label: students -->
  <text x="28" y="186" font-size="11" fill="#d6a040" font-weight="bold">学生(排序)</text>
  <text x="28" y="200" font-size="9.5" fill="#888">[2,7,4]→</text>
  <text x="28" y="212" font-size="9.5" fill="#888">[2,4,7]</text>

  <!-- Students row: 2, 4, 7 (orange) -->
  <rect x="86" y="174" width="48" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="201" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">2</text>
  <rect x="176" y="174" width="48" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="200" y="201" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">4</text>
  <rect x="266" y="174" width="48" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="201" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">7</text>

  <!-- Total box -->
  <rect x="380" y="78" width="120" height="116" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="440" y="102" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">总移动次数</text>
  <text x="440" y="130" text-anchor="middle" font-size="12" fill="#555">1 + 1 + 2</text>
  <text x="440" y="166" text-anchor="middle" font-size="26" fill="#4a7a3a" font-weight="bold">= 4</text>

  <!-- Insight box -->
  <rect x="40" y="240" width="440" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">为什么排序后顺序配对最优？</text>
  <text x="260" y="282" text-anchor="middle" font-size="10.5" fill="#555">座位与学生都是数轴上的点。最小化「配对距离之和」的最优匹配中，</text>
  <text x="260" y="298" text-anchor="middle" font-size="10.5" fill="#555">任意两对连线不应交叉 —— 否则交换两端可消除交叉且总和不增。</text>
  <text x="260" y="318" text-anchor="middle" font-size="10.5" fill="#555">无交叉的匹配 ⇔ 两个序列同序排列后按下标配对 → 排序即得最优解。</text>
  <text x="260" y="336" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">（交换论证见下图）</text>
</svg>
