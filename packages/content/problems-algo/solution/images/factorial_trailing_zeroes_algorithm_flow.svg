<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：累加 ⌊n/5ⁱ⌋，迭代除 5 实现</text>

  <!-- Start -->
  <rect x="210" y="44" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="270" y="63" text-anchor="middle" font-size="12" fill="#333">开始：输入 n</text>
  <path d="M 270 72 L 270 92" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="180" y="94" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="116" text-anchor="middle" font-size="12" fill="#333">ans = 0</text>
  <path d="M 270 128 L 270 152" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- while loop container -->
  <text x="270" y="170" text-anchor="middle" font-size="11" fill="#888" font-style="italic">while n &gt; 0:</text>
  <rect x="60" y="178" width="420" height="186" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="5,3" rx="10" filter="url(#rough2)"/>

  <!-- D1: n > 0? -->
  <path d="M 270 182 L 350 212 L 270 242 L 190 212 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="216" text-anchor="middle" font-size="11" fill="#333">n &gt; 0 ?</text>

  <!-- 否 → exit -->
  <path d="M 190 212 L 120 212 L 120 392" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="132" y="206" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <text x="128" y="300" font-size="10" fill="#b85450">n=0 退出</text>

  <!-- 是 → body -->
  <path d="M 270 242 L 270 262" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="278" y="256" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- body box 1: n //= 5 -->
  <rect x="150" y="264" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="286" text-anchor="middle" font-size="12" fill="#333">n = n // 5</text>
  <path d="M 270 298 L 270 312" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- body box 2: ans += n -->
  <rect x="150" y="314" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="336" text-anchor="middle" font-size="12" fill="#333">ans += n   ← 对应 ⌊n原/5ⁱ⌋</text>

  <!-- back edge to D1 -->
  <path d="M 390 331 L 440 331 L 440 212 L 350 212" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="446" y="276" font-size="10" fill="#4a7a3a">下一轮</text>

  <!-- return -->
  <rect x="180" y="394" width="180" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="419" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">return ans</text>

  <!-- footer note -->
  <rect x="60" y="446" width="420" height="18" fill="none" stroke="none"/>
  <text x="270" y="459" text-anchor="middle" font-size="10" fill="#888">循环次数 = ⌊log₅ n⌋ + 1，n=10⁹ 时仅约 13 轮 → O(log n)</text>
</svg>
