<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：一行闭式，无循环无分支</text>
  <text x="280" y="46" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">ans = n(n+1)/2 − m·k(k+1)，其中 k = ⌊n/m⌋</text>

  <!-- start -->
  <ellipse cx="195" cy="76" rx="44" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="195" y="81" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">输入 n, m</text>

  <!-- step 1 -->
  <rect x="70" y="110" width="250" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="195" y="134" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">① total = n(n+1)/2（先乘后除）</text>

  <!-- step 2 -->
  <rect x="70" y="164" width="250" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="195" y="188" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">② k = ⌊n/m⌋（倍数个数）</text>

  <!-- step 3 -->
  <rect x="70" y="218" width="250" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="195" y="242" text-anchor="middle" font-size="12" fill="#b07818" filter="url(#rough2)">③ num2 = m·k(k+1)/2（等差闭式）</text>

  <!-- step 4 -->
  <rect x="70" y="272" width="250" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="195" y="296" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ 返回 total − 2·num2</text>

  <!-- end -->
  <ellipse cx="195" cy="338" rx="40" ry="16" fill="#f5f5f5" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="343" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">结束</text>

  <!-- arrows -->
  <g filter="url(#rough2)" stroke="#446688" stroke-width="2" fill="none">
    <path d="M 195 94 L 195 106" marker-end="url(#arrb)"/>
    <path d="M 195 148 L 195 160" marker-end="url(#arrb)"/>
    <path d="M 195 202 L 195 214" marker-end="url(#arrb)"/>
    <path d="M 195 256 L 195 268" marker-end="url(#arrb)"/>
    <path d="M 195 310 L 195 320" marker-end="url(#arrb)"/>
  </g>

  <!-- side note 1: complement -->
  <rect x="352" y="110" width="180" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="442" y="132" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">互补性</text>
  <text x="442" y="150" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">num1 = total − num2</text>
  <text x="442" y="168" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">⇒ 只需算 num2 一个量</text>

  <!-- side note 2: arithmetic series -->
  <rect x="352" y="198" width="180" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="442" y="220" text-anchor="middle" font-size="12" fill="#b07818" font-weight="bold" filter="url(#rough2)">等差数列</text>
  <text x="442" y="238" text-anchor="middle" font-size="11" fill="#b07818" filter="url(#rough2)">m, 2m, …, km</text>
  <text x="442" y="256" text-anchor="middle" font-size="11" fill="#b07818" filter="url(#rough2)">= m·(1+2+…+k)</text>

  <!-- side note 3: boundary -->
  <rect x="352" y="286" width="180" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="442" y="306" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">边界自检（免特判）</text>
  <text x="442" y="324" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">m &gt; n：k=0，ans=total</text>
  <text x="442" y="340" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">m = 1：ans = −total</text>
</svg>
