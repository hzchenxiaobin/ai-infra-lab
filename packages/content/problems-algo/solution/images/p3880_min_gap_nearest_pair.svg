<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：最优的 1–2 对中间只能隔着 0 ⇒ 只记「最近的 1」和「最近的 2」</text>

  <!-- Band 1: example 1 -->
  <text x="260" y="42" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">① 示例 1：nums = [1,0,0,2,0,1]——有效对 (0,3) 与 (5,3)，比的是下标距离</text>

  <rect x="92" y="54" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="115" y="76" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="138" y="54" width="46" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="161" y="76" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="184" y="54" width="46" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="207" y="76" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="230" y="54" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="253" y="76" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="276" y="54" width="46" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="299" y="76" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="322" y="54" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="345" y="76" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="115" y="102" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="161" y="102" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="207" y="102" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <text x="253" y="102" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>
  <text x="299" y="102" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">4</text>
  <text x="345" y="102" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">5</text>

  <path d="M 115 112 L 115 118 L 253 118 L 253 112" fill="none" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="184" y="132" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">较远的一对：|0−3| = 3</text>

  <path d="M 253 140 L 253 146 L 345 146 L 345 140" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="299" y="160" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">最近的一对：|5−3| = 2 ✓（答案）</text>

  <!-- Band 2: exchange argument -->
  <text x="260" y="184" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">② 交换论证：最优对中间若还藏着 1 或 2，它们反而配得更近</text>

  <rect x="118" y="192" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="141" y="214" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="164" y="192" width="46" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="187" y="214" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="210" y="192" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="233" y="214" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="256" y="192" width="46" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="279" y="214" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="302" y="192" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="325" y="214" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="141" y="240" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="187" y="240" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="233" y="240" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <text x="279" y="240" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>
  <text x="325" y="240" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">4</text>

  <path d="M 141 258 L 322 258" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="233" y="253" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">远配对 |0−4| = 4，轮不到它 ✗</text>

  <path d="M 233 274 L 322 274" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">中间那个 1 抢走配对：|2−4| = 2 ✓</text>

  <!-- Band 3: conclusion -->
  <rect x="52" y="304" width="416" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">一趟扫描：遇 1 就与 last2（左侧最近的 2）求差，遇 2 就与 last1（左侧最近的 1）求差</text>
  <text x="260" y="340" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">两个整型变量足够——最优对中间只剩 0，谁也抢不走「最近」的名头</text>
</svg>
