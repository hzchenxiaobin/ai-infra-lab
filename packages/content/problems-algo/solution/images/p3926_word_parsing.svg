  <text x="501" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">o</text>
  <text x="523" y="77" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">-</text>

  <!-- separator cross marks -->
  <text x="215" y="102" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="325" y="102" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="347" y="102" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="457" y="102" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="523" y="102" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- token boxes -->
  <path d="M 127 91 L 127 100" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 270 91 L 270 100" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 402 91 L 402 100" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 490 91 L 490 100" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="60" y="106" width="134" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="127" y="127" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">cat-dog</text>
  <rect x="232" y="106" width="76" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="127" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">fish</text>
  <rect x="364" y="106" width="76" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="402" y="127" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">tail</text>
  <rect x="468" y="106" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="490" y="127" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">go</text>

  <!-- legend -->
  <rect x="100" y="149" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="120" y="161" font-size="11" fill="#555" filter="url(#rough2)">字母</text>
  <rect x="170" y="149" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="190" y="161" font-size="11" fill="#555" filter="url(#rough2)">合法连字符（入词）</text>
  <rect x="320" y="149" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="340" y="161" font-size="11" fill="#555" filter="url(#rough2)">分隔符（空格 / 非法连字符）</text>

  <!-- rule panel -->
  <text x="310" y="196" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">连字符判定：只看左右邻居（左邻由扫描保证是字母）</text>

  <rect x="18" y="210" width="132" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <rect x="39" y="226" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="69" y="226" width="30" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="99" y="226" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="54" y="244" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">a</text>
  <text x="84" y="244" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">-</text>
  <text x="114" y="244" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">b</text>
  <text x="84" y="272" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">左右皆字母</text>
  <text x="84" y="288" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">→ 入词 ✓</text>

  <rect x="172" y="210" width="132" height="90" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <rect x="193" y="226" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="223" y="226" width="30" height="26" fill="#fff" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="253" y="226" width="30" height="26" fill="#fff" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="208" y="244" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">a</text>
  <text x="238" y="244" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">-</text>
  <text x="238" y="272" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">右侧非字母</text>
  <text x="238" y="288" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">→ 分隔 ✗</text>

  <rect x="326" y="210" width="132" height="90" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <rect x="347" y="226" width="30" height="26" fill="#fff" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <rect x="377" y="226" width="30" height="26" fill="#fff" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="407" y="226" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="392" y="244" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">-</text>
  <text x="422" y="244" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">a</text>
  <text x="392" y="272" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">左侧非字母</text>
  <text x="392" y="288" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">→ 分隔 ✗</text>

  <rect x="480" y="210" width="132" height="90" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <rect x="498" y="226" width="24" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="522" y="226" width="24" height="26" fill="#fff" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="546" y="226" width="24" height="26" fill="#fff" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="570" y="226" width="24" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="510" y="244" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">a</text>
  <text x="534" y="244" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">-</text>
  <text x="558" y="244" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">-</text>
  <text x="582" y="244" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">b</text>
  <text x="546" y="272" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">连续两个 '-'</text>
  <text x="546" y="288" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">→ 双双分隔 ✗</text>

  <text x="310" y="330" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">单词形状：[a-z]+(-[a-z]+)* —— 首尾必是字母，连字符单个出现且夹在中间</text>
  <text x="310" y="350" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">红色 ✗ 都是词界；切出的单词直接进哈希表计数，query 查表即答</text>
</svg>
