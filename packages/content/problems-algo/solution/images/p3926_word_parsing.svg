  <rect x="468" y="54" width="22" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="490" y="54" width="22" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="512" y="54" width="22" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <text x="61" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <text x="83" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="105" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">t</text>
  <text x="127" y="77" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">-</text>
  <text x="149" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>
  <text x="171" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">o</text>
  <text x="193" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">g</text>
  <text x="215" y="77" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">␣</text>
  <text x="237" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">f</text>
  <text x="259" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i</text>
  <text x="281" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">s</text>
  <text x="303" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">h</text>
  <text x="325" y="77" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">-</text>
  <text x="347" y="77" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">-</text>
  <text x="369" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">t</text>
  <text x="391" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
