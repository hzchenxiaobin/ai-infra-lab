<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：vals = [2,7,4,3,5]</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">单调递减栈逐步推进，answer 存「下一个更大节点的值」</text>

  <!-- Header row -->
  <g font-size="10" fill="#444" font-weight="bold">
    <rect x="20" y="60" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="45" y="76" text-anchor="middle">步骤</text>
    <rect x="70" y="60" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="88" y="76" text-anchor="middle">i</text>
    <rect x="106" y="60" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="128" y="76" text-anchor="middle">值</text>
    <rect x="150" y="60" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="210" y="76" text-anchor="middle">栈（下标）</text>
    <rect x="270" y="60" width="180" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="360" y="76" text-anchor="middle">动作</text>
    <rect x="450" y="60" width="130" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="515" y="76" text-anchor="middle">answer 变化</text>
  </g>

  <!-- Row 1: i=0, v=2 -->
  <g font-size="10" fill="#333">
    <rect x="20" y="84" width="50" height="26" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="45" y="101" text-anchor="middle">1</text>
    <rect x="70" y="84" width="36" height="26" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="88" y="101" text-anchor="middle">0</text>
    <rect x="106" y="84" width="44" height="26" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="128" y="101" text-anchor="middle">2</text>
    <rect x="150" y="84" width="120" height="26" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="210" y="101" text-anchor="middle">[]</text>
    <rect x="270" y="84" width="180" height="26" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="360" y="101" text-anchor="middle">栈空，入栈</text>
    <rect x="450" y="84" width="130" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="515" y="101" text-anchor="middle" fill="#888">[0,0,0,0,0]</text>
  </g>

  <!-- Row 2: i=1, v=7 (highlight) -->
  <g font-size="10" fill="#333">
    <rect x="20" y="110" width="50" height="26" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="45" y="127" text-anchor="middle">2</text>
    <rect x="70" y="110" width="36" height="26" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="88" y="127" text-anchor="middle">1</text>
    <rect x="106" y="110" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="128" y="127" text-anchor="middle" fill="#4a7a3a" font-weight="bold">7</text>
    <rect x="150" y="110" width="120" height="26" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="210" y="127" text-anchor="middle">[0]</text>
    <rect x="270" y="110" width="180" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="360" y="127" text-anchor="middle" fill="#b85450">7&gt;2 弹0→ans[0]=7；入栈1</text>
    <rect x="450" y="110" width="130" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="515" y="127" text-anchor="middle" fill="#4a7a3a">[7,0,0,0,0]</text>
  </g>

  <!-- Row 3: i=2, v=4 -->
  <g font-size="10" fill="#333">
    <rect x="20" y="136" width="50" height="26" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="45" y="153" text-anchor="middle">3</text>
    <rect x="70" y="136" width="36" height="26" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="88" y="153" text-anchor="middle">2</text>
    <rect x="106" y="136" width="44" height="26" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="128" y="153" text-anchor="middle">4</text>
    <rect x="150" y="136" width="120" height="26" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="210" y="153" text-anchor="middle">[1]</text>
    <rect x="270" y="136" width="180" height="26" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="360" y="153" text-anchor="middle">4&lt;7 不弹，入栈 2</text>
    <rect x="450" y="136" width="130" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="515" y="153" text-anchor="middle" fill="#888">[7,0,0,0,0]</text>
  </g>

  <!-- Row 4: i=3, v=3 -->
  <g font-size="10" fill="#333">
    <rect x="20" y="162" width="50" height="26" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="45" y="179" text-anchor="middle">4</text>
    <rect x="70" y="162" width="36" height="26" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="88" y="179" text-anchor="middle">3</text>
    <rect x="106" y="162" width="44" height="26" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="128" y="179" text-anchor="middle">3</text>
    <rect x="150" y="162" width="120" height="26" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="210" y="179" text-anchor="middle">[1,2]</text>
    <rect x="270" y="162" width="180" height="26" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="360" y="179" text-anchor="middle">3&lt;4 不弹，入栈 3</text>
    <rect x="450" y="162" width="130" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="515" y="179" text-anchor="middle" fill="#888">[7,0,0,0,0]</text>
  </g>

  <!-- Row 5: i=4, v=5 (key highlight) -->
  <g font-size="10" fill="#333">
    <rect x="20" y="188" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="45" y="205" text-anchor="middle" font-weight="bold">5</text>
    <rect x="70" y="188" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="88" y="205" text-anchor="middle" font-weight="bold">4</text>
    <rect x="106" y="188" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="128" y="205" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="150" y="188" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="210" y="205" text-anchor="middle">[1,2,3]</text>
    <rect x="270" y="188" width="180" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="360" y="205" text-anchor="middle" fill="#b85450">5&gt;3弹3,5&gt;4弹2；入栈4</text>
    <rect x="450" y="188" width="130" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="515" y="205" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[7,0,5,5,0]</text>
  </g>

  <!-- Row end: stack leftover -->
  <g font-size="10" fill="#333">
    <rect x="20" y="214" width="50" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="45" y="231" text-anchor="middle" fill="#888">结束</text>
    <rect x="70" y="214" width="36" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="88" y="231" text-anchor="middle" fill="#888">—</text>
    <rect x="106" y="214" width="44" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="128" y="231" text-anchor="middle" fill="#888">—</text>
    <rect x="150" y="214" width="120" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="210" y="231" text-anchor="middle" fill="#888">[1,4]</text>
    <rect x="270" y="214" width="180" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="360" y="231" text-anchor="middle" fill="#888">剩余 answer 保持 0</text>
    <rect x="450" y="214" width="130" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="515" y="231" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[7,0,5,5,0]</text>
  </g>

  <!-- Summary box -->
  <rect x="30" y="262" width="540" height="160" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="284" font-size="11" fill="#4a7a3a" font-weight="bold">关键观察：</text>
  <text x="50" y="304" font-size="10" fill="#555">① 步骤 2：值 7 一次弹掉下标 0（值 2），answer[0] 直接写「值」7（不是距离 1-0=1）</text>
  <text x="50" y="322" font-size="10" fill="#555">② 步骤 5：值 5 一次连续弹掉下标 3（值 3）和下标 2（值 4），answer[3]=answer[2]=5</text>
  <text x="50" y="340" font-size="10" fill="#555">③ 步骤 5 后栈剩 [1,4]（值 7、5），右侧无更大值，answer[1]=answer[4]=0 保持默认</text>
  <text x="50" y="360" font-size="10" fill="#555">④ 栈从底到顶值序列：[7] → [7,4] → [7,4,3] → 5 进来后 [7,5]，始终递减</text>
  <text x="50" y="384" font-size="10" fill="#b85450" font-weight="bold">与 739 对照：结算写 answer[top]=vals[i]（值），而非 answer[top]=i-top（距离）</text>
  <text x="50" y="402" font-size="10" fill="#4a7a3a" font-weight="bold">每个元素入栈 1 次 + 出栈 1 次 → 总操作 O(n)，输出 [7,0,5,5,0] 与示例一致</text>
</svg>
