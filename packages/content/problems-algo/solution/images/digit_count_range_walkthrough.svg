<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：d=3, low=100, high=250 → 35</text>

  <!-- Table 1: count(3, 250) -->
  <text x="60" y="48" font-size="12" fill="#446688" font-weight="bold">count(3, 250)：[1, 250] 中数字 3 的总数</text>
  <rect x="60" y="56" width="432" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="94" y="71" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">位</text>
  <text x="157" y="71" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">factor</text>
  <text x="208" y="71" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">high</text>
  <text x="252" y="71" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">cur</text>
  <text x="296" y="71" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">low</text>
  <text x="370" y="71" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">情况</text>
  <text x="457" y="71" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">贡献</text>

  <rect x="60" y="78" width="432" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="94" y="93" text-anchor="middle" font-size="10" fill="#333">个位</text>
  <text x="157" y="93" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="208" y="93" text-anchor="middle" font-size="10" fill="#333">25</text>
  <text x="252" y="93" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="296" y="93" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="370" y="93" text-anchor="middle" font-size="10" fill="#446688">cur &lt; d</text>
  <text x="457" y="93" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">25</text>

  <rect x="60" y="100" width="432" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="94" y="115" text-anchor="middle" font-size="10" fill="#333">十位</text>
  <text x="157" y="115" text-anchor="middle" font-size="10" fill="#333">10</text>
  <text x="208" y="115" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="252" y="115" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="296" y="115" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="370" y="115" text-anchor="middle" font-size="10" fill="#b85450">cur &gt; d</text>
  <text x="457" y="115" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">30</text>

  <rect x="60" y="122" width="432" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="94" y="137" text-anchor="middle" font-size="10" fill="#333">百位</text>
  <text x="157" y="137" text-anchor="middle" font-size="10" fill="#333">100</text>
  <text x="208" y="137" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="252" y="137" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="296" y="137" text-anchor="middle" font-size="10" fill="#333">50</text>
  <text x="370" y="137" text-anchor="middle" font-size="10" fill="#446688">cur &lt; d</text>
  <text x="457" y="137" text-anchor="middle" font-size="10" fill="#888">0</text>

  <rect x="60" y="144" width="432" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="276" y="159" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">合计 = 25 + 30 + 0 = 55</text>

  <!-- Table 2: count(3, 99) -->
  <text x="60" y="190" font-size="12" fill="#446688" font-weight="bold">count(3, 99)：[1, 99] 中数字 3 的总数</text>
  <rect x="60" y="198" width="432" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="94" y="213" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">位</text>
  <text x="157" y="213" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">factor</text>
  <text x="208" y="213" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">high</text>
  <text x="252" y="213" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">cur</text>
  <text x="296" y="213" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">low</text>
  <text x="370" y="213" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">情况</text>
  <text x="457" y="213" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">贡献</text>

  <rect x="60" y="220" width="432" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="94" y="235" text-anchor="middle" font-size="10" fill="#333">个位</text>
  <text x="157" y="235" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="208" y="235" text-anchor="middle" font-size="10" fill="#333">9</text>
  <text x="252" y="235" text-anchor="middle" font-size="10" fill="#333">9</text>
  <text x="296" y="235" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="370" y="235" text-anchor="middle" font-size="10" fill="#b85450">cur &gt; d</text>
  <text x="457" y="235" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">10</text>

  <rect x="60" y="242" width="432" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="94" y="257" text-anchor="middle" font-size="10" fill="#333">十位</text>
  <text x="157" y="257" text-anchor="middle" font-size="10" fill="#333">10</text>
  <text x="208" y="257" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="252" y="257" text-anchor="middle" font-size="10" fill="#333">9</text>
  <text x="296" y="257" text-anchor="middle" font-size="10" fill="#333">9</text>
  <text x="370" y="257" text-anchor="middle" font-size="10" fill="#b85450">cur &gt; d</text>
  <text x="457" y="257" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">10</text>

  <rect x="60" y="264" width="432" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="276" y="279" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">合计 = 10 + 10 = 20</text>

  <!-- Final result -->
  <rect x="60" y="304" width="432" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="276" y="328" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">answer = count(3, 250) − count(3, 99) = 55 − 20 = 35 ✓</text>

  <!-- Verification -->
  <text x="60" y="362" font-size="11" fill="#555" font-weight="bold">按位验证 [100, 250] 中数字 3：</text>
  <text x="60" y="382" font-size="10" fill="#333">个位 3 共 15 次（103, 113, …, 243）　十位 3 共 20 次（130-139, 230-239）</text>
  <text x="60" y="400" font-size="10" fill="#333">百位 3 共 0 次（无 3xx）　→　15 + 20 + 0 = 35 ✓</text>
</svg>
