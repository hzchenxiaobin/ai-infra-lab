<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="560" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 5 的操作序列</text>

  <!-- 表头 -->
  <rect x="36" y="42" width="140" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="106" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">操作</text>
  <rect x="176" y="42" width="210" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="281" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">堆状态（操作前 → 后）</text>
  <rect x="386" y="42" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="431" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">返回</text>
  <rect x="476" y="42" width="90" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="521" y="60" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">说明</text>

  <!-- 第 0 行：初始化 -->
  <rect x="36" y="72" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="106" y="92" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">SeatManager(5)</text>
  <rect x="176" y="72" width="210" height="30" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="92" text-anchor="middle" font-size="10" fill="#555">— → [1,2,3,4,5]</text>
  <rect x="386" y="72" width="90" height="30" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="431" y="92" text-anchor="middle" font-size="10" fill="#888">null</text>
  <rect x="476" y="72" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="521" y="92" text-anchor="middle" font-size="9.5" fill="#555">建堆</text>

  <!-- 第 1 行：reserve -> 1 -->
  <rect x="36" y="106" width="140" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="106" y="126" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">reserve()</text>
  <rect x="176" y="106" width="210" height="30" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="126" text-anchor="middle" font-size="10" fill="#555">[1,2,3,4,5] → [2,3,4,5]</text>
  <rect x="386" y="106" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="431" y="126" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="476" y="106" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="521" y="126" text-anchor="middle" font-size="9.5" fill="#555">弹出堆顶</text>

  <!-- 第 2 行：reserve -> 2 -->
  <rect x="36" y="140" width="140" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="106" y="160" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">reserve()</text>
  <rect x="176" y="140" width="210" height="30" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="160" text-anchor="middle" font-size="10" fill="#555">[2,3,4,5] → [3,4,5]</text>
  <rect x="386" y="140" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="431" y="160" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <rect x="476" y="140" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="521" y="160" text-anchor="middle" font-size="9.5" fill="#555">弹出堆顶</text>

  <!-- 第 3 行：unreserve(2) -->
  <rect x="36" y="174" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="106" y="194" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">unreserve(2)</text>
  <rect x="176" y="174" width="210" height="30" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="194" text-anchor="middle" font-size="10" fill="#555">[3,4,5] → [2,3,4,5]</text>
  <rect x="386" y="174" width="90" height="30" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="431" y="194" text-anchor="middle" font-size="10" fill="#888">null</text>
  <rect x="476" y="174" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="521" y="194" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">2 重新可用</text>

  <!-- 第 4 行：reserve -> 2 (归还后再取) -->
  <rect x="36" y="208" width="140" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="106" y="228" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">reserve()</text>
  <rect x="176" y="208" width="210" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="281" y="228" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">[2,3,4,5] → [3,4,5]</text>
  <rect x="386" y="208" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="431" y="228" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <rect x="476" y="208" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="521" y="228" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">归还的 2 再次最小</text>

  <!-- 第 5 行：reserve -> 3 -->
  <rect x="36" y="242" width="140" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="106" y="262" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">reserve()</text>
  <rect x="176" y="242" width="210" height="30" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="262" text-anchor="middle" font-size="10" fill="#555">[3,4,5] → [4,5]</text>
  <rect x="386" y="242" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="431" y="262" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <rect x="476" y="242" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="521" y="262" text-anchor="middle" font-size="9.5" fill="#555">弹出堆顶</text>

  <!-- 第 6 行：reserve -> 4 -->
  <rect x="36" y="276" width="140" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="106" y="296" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">reserve()</text>
  <rect x="176" y="276" width="210" height="30" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="296" text-anchor="middle" font-size="10" fill="#555">[4,5] → [5]</text>
  <rect x="386" y="276" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="431" y="296" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>
  <rect x="476" y="276" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="521" y="296" text-anchor="middle" font-size="9.5" fill="#555">弹出堆顶</text>

  <!-- 第 7 行：reserve -> 5 -->
  <rect x="36" y="310" width="140" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="106" y="330" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">reserve()</text>
  <rect x="176" y="310" width="210" height="30" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="330" text-anchor="middle" font-size="10" fill="#555">[5] → []</text>
  <rect x="386" y="310" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="431" y="330" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>
  <rect x="476" y="310" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="521" y="330" text-anchor="middle" font-size="9.5" fill="#555">最后一个</text>

  <!-- 第 8 行：unreserve(5) -->
  <rect x="36" y="344" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="106" y="364" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">unreserve(5)</text>
  <rect x="176" y="344" width="210" height="30" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="364" text-anchor="middle" font-size="10" fill="#555">[] → [5]</text>
  <rect x="386" y="344" width="90" height="30" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="431" y="364" text-anchor="middle" font-size="10" fill="#888">null</text>
  <rect x="476" y="344" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="521" y="364" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">5 重新可用</text>

  <!-- 关键观察框：第 4 行高亮 -->
  <rect x="170" y="204" width="222" height="38" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,3" rx="6" filter="url(#rough2)"/>
  <text x="396" y="200" font-size="9.5" fill="#d6a040" font-weight="bold">★ 关键</text>

  <!-- 底部小结 -->
  <rect x="36" y="392" width="530" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="414" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">关键观察：unreserve 归还的座位可能比「尚未分配的座位」更小</text>
  <text x="300" y="432" text-anchor="middle" font-size="10" fill="#555">第 3 步归还 2 后，第 4 步 reserve 立刻取到 2（而非 3）</text>
  <text x="300" y="448" text-anchor="middle" font-size="10" fill="#555">→ 必须用「能动态插入并取最小」的结构，不能只靠顺序指针</text>
  <text x="300" y="462" text-anchor="middle" font-size="10" fill="#555">最小堆恰好满足：insert O(log n) + extract-min O(log n)</text>

  <!-- 颜色图例 -->
  <rect x="36" y="480" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="56" y="492" font-size="9.5" fill="#555">reserve（取出）</text>
  <rect x="170" y="480" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="190" y="492" font-size="9.5" fill="#555">unreserve（归还）</text>
  <rect x="310" y="480" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="330" y="492" font-size="9.5" fill="#555">关键步骤</text>
  <rect x="420" y="480" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="440" y="492" font-size="9.5" fill="#555">初始化</text>

  <text x="300" y="530" text-anchor="middle" font-size="9.5" fill="#aaa">堆中方括号按逻辑有序列出（实际为堆序，堆顶恒为最小）</text>
</svg>
