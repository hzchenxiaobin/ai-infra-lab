<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心概念：最大值切分数组为左右子问题</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">区间最大值 → 根；左侧前缀 → 左子树；右侧后缀 → 右子树</text>

  <!-- 数组标签 -->
  <text x="50" y="80" font-size="12" fill="#888">nums:</text>

  <!-- 数组格子 [3,2,1,6,0,5] -->
  <rect x="90" y="66" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="112" y="89" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <rect x="138" y="66" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="160" y="89" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <rect x="186" y="66" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="208" y="89" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <rect x="234" y="66" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="256" y="89" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">6</text>

  <rect x="282" y="66" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="304" y="89" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>

  <rect x="330" y="66" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="352" y="89" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>

  <!-- max 标注 -->
  <text x="256" y="58" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑ max</text>

  <!-- 左右分组大括号 -->
  <path d="M 90 108 Q 90 118 112 118 L 208 118 Q 232 118 232 108" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="160" y="134" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">左前缀 [3,2,1]</text>

  <path d="M 282 108 Q 282 118 304 118 L 352 118 Q 376 118 376 108" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="328" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">右后缀 [0,5]</text>

  <!-- 从 max 向下箭头到根 -->
  <path d="M 256 102 L 256 168" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="196" y="138" width="120" height="22" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="256" y="153" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">根 = 最大值 6</text>

  <!-- 结果树 -->
  <text x="50" y="196" font-size="12" fill="#888">构造结果：</text>

  <!-- 根 6 -->
  <circle cx="256" cy="210" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="256" y="215" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">6</text>

  <!-- 连线到左右子 -->
  <line x1="244" y1="224" x2="180" y2="262" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="268" y1="224" x2="332" y2="262" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- 3 (左子) -->
  <circle cx="180" cy="270" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="275" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>

  <!-- 5 (右子) -->
  <circle cx="332" cy="270" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="332" y="275" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">5</text>

  <!-- 3 的右子 2 -->
  <line x1="192" y1="284" x2="216" y2="318" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="220" cy="326" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="331" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>

  <!-- 2 的右子 1 -->
  <line x1="232" y1="340" x2="252" y2="370" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <circle cx="256" cy="378" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="256" y="382" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>

  <!-- 5 的左子 0 -->
  <line x1="320" y1="284" x2="296" y2="318" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="292" cy="326" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292" y="331" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- 区域标注 -->
  <text x="80" y="275" font-size="10" fill="#446688" font-weight="bold">左子树</text>
  <text x="80" y="288" font-size="9" fill="#888">= build(l, mid-1)</text>

  <text x="378" y="275" font-size="10" fill="#4a7a3a" font-weight="bold">右子树</text>
  <text x="378" y="288" font-size="9" fill="#888">= build(mid+1, r)</text>

  <!-- 底部说明框 -->
  <rect x="40" y="408" width="480" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="280" y="426" text-anchor="middle" font-size="11" fill="#7a5a20">不变式：最大值的位置 mid 将 [l,r] 一分为二</text>
  <text x="280" y="442" text-anchor="middle" font-size="11" fill="#7a5a20">左 [l, mid-1] 与右 [mid+1, r] 互不交叉，可独立递归 → 分治</text>
</svg>
