<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：维护「最远可达」maxReach</text>

  <!-- array nums = [2,3,1,1,4] -->
  <text x="20" y="74" font-size="12" fill="#888">下标：</text>
  <rect x="70" y="58" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="125" y="58" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="180" y="58" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="78" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="235" y="58" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="78" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="290" y="58" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="315" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <text x="95" y="106" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="150" y="106" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="205" y="106" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="260" y="106" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="315" y="106" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">4 ← 终点</text>

  <!-- coverage brackets: from each reachable i, coverage [i, i+nums[i]] -->
  <path d="M 72 50 L 72 44 L 226 44 L 226 50" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="149" y="38" text-anchor="middle" font-size="9.5" fill="#446688">i=0 覆盖到 2</text>

  <path d="M 127 122 L 127 128 L 332 128 L 332 122" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="229" y="142" text-anchor="middle" font-size="9.5" fill="#4a7a3a">i=1 覆盖到 4 ★</text>

  <path d="M 182 156 L 182 162 L 282 162 L 282 156" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="232" y="174" text-anchor="middle" font-size="9" fill="#888">i=2 覆盖到 3</text>

  <!-- maxReach marker -->
  <text x="70" y="196" font-size="12" fill="#888">maxReach：</text>
  <rect x="150" y="184" width="180" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="240" y="203" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">从 0 推进到 4 ✓</text>

  <!-- key idea -->
  <rect x="30" y="226" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="248" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">每个可达 i 贡献区间 [i, i+nums[i]]</text>
  <text x="270" y="268" text-anchor="middle" font-size="11" fill="#555">maxReach = 所有贡献区间的右端最大值</text>

  <!-- footer -->
  <rect x="30" y="294" width="480" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="316" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">只要 maxReach ≥ n−1 → 能到终点</text>
  <text x="270" y="334" text-anchor="middle" font-size="11" fill="#888">区间覆盖贪心：合并多个区间为一个右端标量</text>
</svg>
