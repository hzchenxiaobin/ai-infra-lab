<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">换根 DP：down / up 与 top-2</text>

  <line x1="260" y1="94" x2="260" y2="154" stroke="#bbb" stroke-width="2" filter="url(#rough2)"/>
  <line x1="244" y1="186" x2="164" y2="250" stroke="#bbb" stroke-width="2" filter="url(#rough2)"/>
  <line x1="257" y1="190" x2="251" y2="264" stroke="#bbb" stroke-width="2" filter="url(#rough2)"/>
  <line x1="276" y1="186" x2="336" y2="250" stroke="#bbb" stroke-width="2" filter="url(#rough2)"/>

  <path d="M 260 152 L 260 32" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="276" y="48" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">up[u]：u 向上的最长链</text>

  <circle cx="260" cy="78" r="16" fill="#f0f0f0" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="83" text-anchor="middle" font-size="12.5" fill="#666" font-weight="bold" filter="url(#rough2)">p</text>
  <text x="282" y="72" font-size="10.5" fill="#999" filter="url(#rough2)">（父亲方向）</text>

  <circle cx="260" cy="172" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="177" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">u</text>

  <rect x="20" y="146" width="148" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="94" y="168" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">down[u] = top1</text>
  <text x="94" y="188" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">子树内最远点的距离</text>

  <rect x="356" y="132" width="150" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="431" y="154" text-anchor="middle" font-size="12" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">up[u]：子树外最远</text>
  <text x="431" y="174" text-anchor="middle" font-size="10.5" fill="#a05a54" filter="url(#rough2)">沿父亲方向出去</text>

  <circle cx="150" cy="264" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="269" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">c₁</text>
  <text x="150" y="294" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">top1（最大）</text>

  <circle cx="250" cy="282" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="287" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c₂</text>
  <text x="250" y="310" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">top2（次大）</text>

  <circle cx="350" cy="264" r="16" fill="#f5f5f5" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="269" text-anchor="middle" font-size="12.5" fill="#777" font-weight="bold" filter="url(#rough2)">c₃</text>
  <text x="350" y="294" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">其余…</text>

  <rect x="36" y="316" width="448" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="334" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">换根到 c₁：up[c₁] = w(u) + max( up[u] , top2 )</text>
  <text x="260" y="350" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">c₁ 恰是 top1 的来源 ⇒ 排除自己这条分支，top2 顶上</text>
</svg>
