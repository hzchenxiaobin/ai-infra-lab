<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：在 board 中找 "oath"</text>
  <text x="280" y="44" text-anchor="middle" font-size="10" fill="#888">board 4×4，沿 Trie 路径 root→o→a→t→h 逐步匹配</text>

  <!-- ===== Board 4x4 ===== -->
  <text x="60" y="84" font-size="11" fill="#888">board:</text>

  <!-- row 0: o a a n -->
  <rect x="60" y="92" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="120" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">o</text>
  <rect x="104" y="92" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="126" y="120" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">a</text>
  <rect x="148" y="92" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="170" y="120" text-anchor="middle" font-size="16" fill="#333">a</text>
  <rect x="192" y="92" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="214" y="120" text-anchor="middle" font-size="16" fill="#333">n</text>

  <!-- row 1: e t a e -->
  <rect x="60" y="136" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="82" y="164" text-anchor="middle" font-size="16" fill="#333">e</text>
  <rect x="104" y="136" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="126" y="164" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">t</text>
  <rect x="148" y="136" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="170" y="164" text-anchor="middle" font-size="16" fill="#333">a</text>
  <rect x="192" y="136" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="214" y="164" text-anchor="middle" font-size="16" fill="#333">e</text>

  <!-- row 2: i h k r -->
  <rect x="60" y="180" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="82" y="208" text-anchor="middle" font-size="16" fill="#333">i</text>
  <rect x="104" y="180" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="126" y="208" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">h</text>
  <rect x="148" y="180" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="170" y="208" text-anchor="middle" font-size="16" fill="#333">k</text>
  <rect x="192" y="180" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="214" y="208" text-anchor="middle" font-size="16" fill="#333">r</text>

  <!-- row 3: i f l v -->
  <rect x="60" y="224" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="82" y="252" text-anchor="middle" font-size="16" fill="#333">i</text>
  <rect x="104" y="224" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="126" y="252" text-anchor="middle" font-size="16" fill="#333">f</text>
  <rect x="148" y="224" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="170" y="252" text-anchor="middle" font-size="16" fill="#333">l</text>
  <rect x="192" y="224" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="214" y="252" text-anchor="middle" font-size="16" fill="#333">v</text>

  <!-- path arrows -->
  <path d="M 104 136 L 104 116" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 126 136 L 126 180" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step labels on path -->
  <text x="46" y="120" text-anchor="end" font-size="9" fill="#4a7a3a" font-weight="bold">① o</text>
  <text x="46" y="160" text-anchor="end" font-size="9" fill="#4a7a3a" font-weight="bold">② a</text>
  <text x="46" y="204" text-anchor="end" font-size="9" fill="#4a7a3a" font-weight="bold">③ t</text>
  <text x="158" y="204" font-size="9" fill="#4a7a3a" font-weight="bold">④ h ✓</text>

  <!-- ===== Step table on right ===== -->
  <rect x="290" y="84" width="250" height="200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="415" y="104" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">逐步匹配（DFS 走 Trie）</text>

  <text x="300" y="128" font-size="10" fill="#888">步</text>
  <text x="334" y="128" font-size="10" fill="#888">坐标</text>
  <text x="392" y="128" font-size="10" fill="#888">字符</text>
  <text x="442" y="128" font-size="10" fill="#888">Trie 节点</text>
  <line x1="300" y1="134" x2="530" y2="134" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="300" y="152" font-size="10" fill="#333">①</text>
  <text x="334" y="152" font-size="10" fill="#333">(0,0)</text>
  <text x="392" y="152" font-size="10" fill="#333">o</text>
  <text x="442" y="152" font-size="10" fill="#446688">root→o</text>

  <text x="300" y="174" font-size="10" fill="#333">②</text>
  <text x="334" y="174" font-size="10" fill="#333">(0,1)</text>
  <text x="392" y="174" font-size="10" fill="#333">a</text>
  <text x="442" y="174" font-size="10" fill="#446688">o→a</text>

  <text x="300" y="196" font-size="10" fill="#333">③</text>
  <text x="334" y="196" font-size="10" fill="#333">(1,1)</text>
  <text x="392" y="196" font-size="10" fill="#333">t</text>
  <text x="442" y="196" font-size="10" fill="#446688">a→t</text>

  <text x="300" y="218" font-size="10" fill="#333">④</text>
  <text x="334" y="218" font-size="10" fill="#333">(2,1)</text>
  <text x="392" y="218" font-size="10" fill="#333">h</text>
  <text x="442" y="218" font-size="10" fill="#4a7a3a" font-weight="bold">t→h★</text>

  <line x1="300" y1="228" x2="530" y2="228" stroke="#d6a040" stroke-width="0.8" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="300" y="248" font-size="10" fill="#b85450" font-weight="bold">isEnd★ → 收集 "oath"</text>
  <text x="300" y="266" font-size="9" fill="#888">清 isEnd 避免重复收集</text>

  <!-- bottom note -->
  <rect x="40" y="300" width="500" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="322" text-anchor="middle" font-size="11" fill="#333">回溯后：若 h 节点已无子节点 → 从父节点 t 删除 h</text>
  <text x="290" y="342" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">剪枝：已找完的分支不再被其它路径重复探索</text>
  <text x="290" y="358" text-anchor="middle" font-size="9" fill="#888">同理 "eat" 找到后也会从 Trie 摘除，剩余路径更快终止</text>
</svg>
