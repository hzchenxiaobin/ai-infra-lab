<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：7 次 getBill 调用（n=3, discount=50%）</text>

  <rect x="40" y="140" width="475" height="30" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="40" y="230" width="475" height="30" fill="#fff8e1" filter="url(#rough2)"/>

  <rect x="40" y="50" width="475" height="240" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <line x1="40" y1="80" x2="515" y2="80" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="110" x2="515" y2="110" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="140" x2="515" y2="140" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="170" x2="515" y2="170" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="200" x2="515" y2="200" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="230" x2="515" y2="230" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="260" x2="515" y2="260" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <line x1="75" y1="50" x2="75" y2="290" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="270" y1="50" x2="270" y2="290" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="335" y1="50" x2="335" y2="290" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="380" y1="50" x2="380" y2="290" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="435" y1="50" x2="435" y2="290" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="57" y="70" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">#</text>
  <text x="172" y="70" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">计算式（价×量）</text>
  <text x="302" y="70" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">原始金额</text>
  <text x="357" y="70" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">count</text>
  <text x="407" y="70" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">打折?</text>
  <text x="475" y="70" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">实付</text>

  <text x="57" y="100" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="80" y="100" font-size="9" fill="#333" filter="url(#rough2)">100×1+200×2</text>
  <text x="302" y="100" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">500</text>
  <text x="357" y="100" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="407" y="100" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">×</text>
  <text x="475" y="100" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">500</text>

  <text x="57" y="130" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="80" y="130" font-size="9" fill="#333" filter="url(#rough2)">300×10+100×10</text>
  <text x="302" y="130" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4000</text>
  <text x="357" y="130" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="407" y="130" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">×</text>
  <text x="475" y="130" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4000</text>

  <text x="57" y="160" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="80" y="160" font-size="9" fill="#333" filter="url(#rough2)">7种各1件</text>
  <text x="302" y="160" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1600</text>
  <text x="357" y="160" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="407" y="160" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✓</text>
  <text x="475" y="160" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">800</text>

  <text x="57" y="190" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <text x="80" y="190" font-size="9" fill="#333" filter="url(#rough2)">400×10</text>
  <text x="302" y="190" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4000</text>
  <text x="357" y="190" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <text x="407" y="190" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">×</text>
  <text x="475" y="190" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4000</text>

  <text x="57" y="220" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>
  <text x="80" y="220" font-size="9" fill="#333" filter="url(#rough2)">100×10+300×10</text>
  <text x="302" y="220" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4000</text>
  <text x="357" y="220" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>
  <text x="407" y="220" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">×</text>
  <text x="475" y="220" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4000</text>

  <text x="57" y="250" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">6</text>
  <text x="80" y="250" font-size="9" fill="#333" filter="url(#rough2)">7种商品</text>
  <text x="302" y="250" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">14700</text>
  <text x="357" y="250" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">6</text>
  <text x="407" y="250" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✓</text>
  <text x="475" y="250" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">7350</text>

  <text x="57" y="280" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">7</text>
  <text x="80" y="280" font-size="9" fill="#333" filter="url(#rough2)">200×5+300×3+300×2</text>
  <text x="302" y="280" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2500</text>
  <text x="357" y="280" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">7</text>
  <text x="407" y="280" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">×</text>
  <text x="475" y="280" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2500</text>

  <text x="50" y="312" font-size="10" fill="#d6a040" filter="url(#rough2)">第 3、6 位顾客：count % 3 == 0 → 打折 50%，实付 = 原始 × (100−50)/100</text>
  <text x="50" y="328" font-size="9" fill="#888" filter="url(#rough2)">价×量示例：100×1+200×2 = 商品1价格100×数量1 + 商品2价格200×数量2</text>

</svg>
