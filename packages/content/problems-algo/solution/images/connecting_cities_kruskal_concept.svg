<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：按边权升序贪心选边，并查集判环</text>

  <!-- left: original graph -->
  <text x="120" y="58" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">原图（4 城 5 边）</text>

  <!-- edges (drawn before nodes so nodes overlap edge ends) -->
  <!-- 1-2 cost 1 -->
  <line x1="90" y1="100" x2="190" y2="100" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="93" text-anchor="middle" font-size="10.5" fill="#888">1</text>
  <!-- 2-3 cost 2 -->
  <line x1="190" y1="100" x2="190" y2="200" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="198" y="155" font-size="10.5" fill="#888">2</text>
  <!-- 1-3 cost 3 (diagonal) -->
  <line x1="90" y1="100" x2="190" y2="200" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="128" y="160" font-size="10.5" fill="#888">3</text>
  <!-- 3-4 cost 4 -->
  <line x1="190" y1="200" x2="90" y2="200" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="217" text-anchor="middle" font-size="10.5" fill="#888">4</text>
  <!-- 2-4 cost 5 (diagonal) -->
  <line x1="190" y1="100" x2="90" y2="200" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="152" y="140" font-size="10.5" fill="#888">5</text>

  <!-- nodes -->
  <circle cx="90" cy="100" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="104" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <circle cx="190" cy="100" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="104" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <circle cx="190" cy="200" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="204" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <circle cx="90" cy="200" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="204" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>

  <!-- arrow to right -->
  <path d="M232,150 L298,150" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="265" y="142" text-anchor="middle" font-size="10" fill="#888">Kruskal</text>

  <!-- right: MST result -->
  <text x="430" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">MST（选 3 条边 = n−1）</text>

  <!-- selected edges: 1-2(1), 2-3(2), 3-4(4) -->
  <line x1="400" y1="100" x2="500" y2="100" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="450" y="93" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">1</text>
  <line x1="500" y1="100" x2="500" y2="200" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="508" y="155" font-size="10.5" fill="#4a7a3a" font-weight="bold">2</text>
  <line x1="500" y1="200" x2="400" y2="200" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="450" y="217" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- skipped edges: 1-3(3), 2-4(5) dashed grey -->
  <line x1="400" y1="100" x2="500" y2="200" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="438" y="160" font-size="10" fill="#d6a040">3 ✗</text>
  <line x1="500" y1="100" x2="400" y2="200" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="462" y="140" font-size="10" fill="#d6a040">5 ✗</text>

  <!-- nodes -->
  <circle cx="400" cy="100" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <circle cx="500" cy="100" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="500" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <circle cx="500" cy="200" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="500" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <circle cx="400" cy="200" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- bottom annotation -->
  <rect x="60" y="256" width="440" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="80" y="278" font-size="11.5" fill="#8a6a20" font-weight="bold">贪心策略</text>
  <text x="80" y="296" font-size="11" fill="#555">① 所有边按 cost 升序排序 → ② 依次取边，并查集查两端是否已连通</text>
  <text x="80" y="312" font-size="11" fill="#555">③ 未连通则选入 MST（union + 累加 cost）；已连通则跳过（避免成环）</text>
  <text x="80" y="328" font-size="11" fill="#b85450">④ 选满 n−1 条边即得最小总费用；若遍历完仍不足 n−1 条 → 图不连通，返回 −1</text>
</svg>
