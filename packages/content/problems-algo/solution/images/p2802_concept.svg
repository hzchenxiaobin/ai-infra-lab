<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">幸运数 = 只含 4 和 7 的数 ↔ 二进制同构</text>

  <!-- Mapping rule box -->
  <rect x="200" y="46" width="160" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="232" y="70" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">0 → 4</text>
  <text x="328" y="70" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1 → 7</text>

  <!-- Column headers -->
  <text x="150" y="108" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">幸运数</text>
  <text x="300" y="108" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">二进制</text>
  <text x="470" y="108" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">本层个数</text>

  <!-- Row 1: 1 digit -->
  <text x="40" y="138" font-size="12" fill="#888" filter="url(#rough2)">1 位</text>
  <rect x="100" y="120" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="123" y="140" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="158" y="120" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="181" y="140" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <text x="230" y="140" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">↔</text>
  <rect x="250" y="120" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="273" y="140" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="308" y="120" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="331" y="140" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="470" y="140" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">2¹ = 2</text>

  <!-- divider -->
  <line x1="80" y1="166" x2="500" y2="166" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 2: 2 digits -->
  <text x="40" y="196" font-size="12" fill="#888" filter="url(#rough2)">2 位</text>
  <rect x="92" y="180" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="118" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">44</text>
  <rect x="150" y="180" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="176" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">47</text>
  <rect x="208" y="180" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="234" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">74</text>
  <rect x="266" y="180" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">77</text>
  <text x="345" y="200" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">↔</text>
  <rect x="362" y="180" width="52" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="388" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">00</text>
  <rect x="420" y="180" width="52" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="446" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">11</text>
  <text x="510" y="200" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">2²=4</text>

  <!-- divider -->
  <line x1="80" y1="226" x2="500" y2="226" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 3: 3 digits -->
  <text x="40" y="256" font-size="12" fill="#888" filter="url(#rough2)">3 位</text>
  <rect x="92" y="240" width="50" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="117" y="259" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">444</text>
  <rect x="146" y="240" width="50" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="171" y="259" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">447</text>
  <text x="210" y="259" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">…</text>
  <rect x="224" y="240" width="50" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="249" y="259" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">774</text>
  <rect x="278" y="240" width="50" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="303" y="259" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">777</text>
  <text x="345" y="259" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">↔</text>
  <rect x="362" y="240" width="50" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="387" y="259" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">000</text>
  <rect x="420" y="240" width="50" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="445" y="259" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">111</text>
  <text x="510" y="259" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">2³=8</text>

  <!-- cumulative arrow + formula -->
  <rect x="80" y="290" width="400" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="312" font-size="12" fill="#333" filter="url(#rough2)">累计（≤ c 位）= 2 + 4 + … + 2ᶜ = 2ᶜ⁺¹ − 2</text>
  <path d="M100,322 L470,322" stroke="#b85450" stroke-width="0.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="100" y="338" font-size="12" fill="#b85450" filter="url(#rough2)">→ 找最小 c 使 2ᶜ⁺¹ − 2 ≥ k，即 c 位组内有解</text>

  <!-- bottom note -->
  <text x="280" y="376" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">每位独立选 4 或 7 ⟺ 每位独立选 0 或 1 → c 位幸运数与 c 位二进制一一对应</text>
  <text x="280" y="396" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">序号在层内 0-indexed，再按二进制逐位映射即可</text>
</svg>
