<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 392"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="392" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：排序 → 两端并行求和 → 作差</text>
  <text x="280" y="44" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">以 nums = [5,2,2,4]，k = 2 为例</text>

  <!-- 开始 -->
  <rect x="190" y="64" width="180" height="34" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="85" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">开始：读入 nums, k</text>

  <path d="M 280 98 L 280 120" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 排序 -->
  <rect x="175" y="124" width="210" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="141" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">升序排序 sort(nums)</text>
  <text x="280" y="157" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">O(n log n)，全流程瓶颈</text>

  <!-- 分叉 -->
  <path d="M 280 164 C 280 184, 165 172, 165 194" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 280 164 C 280 184, 395 172, 395 194" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 左：前 k 个 -->
  <rect x="70" y="198" width="190" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="165" y="220" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">minSum = 前 k 个之和</text>
  <text x="165" y="240" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">a[0..k−1]：2 + 2 = 4</text>

  <!-- 右：后 k 个 -->
  <rect x="300" y="198" width="190" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="395" y="220" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">maxSum = 后 k 个之和</text>
  <text x="395" y="240" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">a[n−k..n−1]：4 + 5 = 9</text>

  <!-- 汇合 -->
  <path d="M 165 254 C 165 276, 280 268, 280 294" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 395 254 C 395 276, 280 268, 280 294" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="150" y="298" width="260" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="319" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 maxSum − minSum</text>
  <text x="280" y="336" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">逐项比较保证恒 ≥ 0，无需 abs</text>

  <!-- 底部备注 -->
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">k &gt; n/2 时两端重叠 → 重叠元素两边都计入，无需特判；k = n 时答案恰为 0</text>
</svg>
