<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：双指针逼近 + 首处失配二分支</text>

  <!-- Start -->
  <rect x="210" y="48" width="140" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="18" filter="url(#rough2)"/>
  <text x="280" y="71" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">left=0, right=n−1</text>
  <path d="M 280 84 L 280 98" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision: left < right? -->
  <polygon points="280,100 380,140 280,180 180,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="138" text-anchor="middle" font-size="11" fill="#a07820" font-weight="bold">left &lt; right ?</text>
  <text x="280" y="154" text-anchor="middle" font-size="10" fill="#888">循环条件</text>

  <!-- No branch -> return true -->
  <path d="M 380 140 L 440 140" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="396" y="134" font-size="10" fill="#888" font-weight="bold">否</text>
  <rect x="440" y="122" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="490" y="145" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return true</text>
  <text x="490" y="170" text-anchor="middle" font-size="9.5" fill="#888">原串即回文</text>

  <!-- Yes branch -->
  <path d="M 280 180 L 280 194" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="190" font-size="10" fill="#888" font-weight="bold">是</text>

  <!-- Decision: s[left] == s[right]? -->
  <polygon points="280,196 400,240 280,284 160,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="11" fill="#a07820" font-weight="bold">s[left] == s[right] ?</text>
  <text x="280" y="254" text-anchor="middle" font-size="10" fill="#888">逐对比较</text>

  <!-- Yes branch: advance -->
  <path d="M 160 240 L 110 240 L 110 300" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="120" y="232" font-size="10" fill="#888" font-weight="bold">相等</text>
  <rect x="50" y="300" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="110" y="318" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">left++, right−−</text>
  <text x="110" y="332" text-anchor="middle" font-size="9.5" fill="#888">内推，回循环头</text>
  <path d="M 110 300 L 110 264 L 160 240" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- No branch: mismatch -->
  <path d="M 400 240 L 450 240" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="416" y="232" font-size="10" fill="#b85450" font-weight="bold">失配 ★</text>

  <!-- Branch box: two deletes -->
  <rect x="430" y="270" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="490" y="288" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">动用删除预算</text>
  <text x="490" y="302" text-anchor="middle" font-size="9.5" fill="#888">二选一都试</text>
  <path d="M 490 240 L 490 270" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Two sub-branches -->
  <path d="M 490 310 L 490 330" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- delete left -->
  <rect x="300" y="330" width="170" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="385" y="350" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">删左：isPalindrome(l+1, r)</text>
  <text x="385" y="364" text-anchor="middle" font-size="9.5" fill="#888">零容错线性扫描</text>

  <!-- OR symbol -->
  <circle cx="490" cy="352" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="356" text-anchor="middle" font-size="10" fill="#a07820" font-weight="bold">||</text>

  <!-- delete right -->
  <rect x="510" y="330" width="0" height="44" fill="none"/>

  <rect x="300" y="384" width="170" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="385" y="404" text-anchor="middle" font-size="10.5" fill="#a07820" font-weight="bold">删右：isPalindrome(l, r−1)</text>
  <text x="385" y="418" text-anchor="middle" font-size="9.5" fill="#888">零容错线性扫描</text>

  <!-- connect -->
  <path d="M 430 290 L 385 290 L 385 330" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 550 290 L 385 290 L 385 384" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- final return -->
  <path d="M 385 428 L 385 446" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="270" y="446" width="230" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="385" y="465" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return 删左结果 OR 删右结果</text>
</svg>
