<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：JOIN → GROUP BY → SUM → HAVING</text>

  <!-- ===== FROM + JOIN ===== -->
  <rect x="110" y="40" width="300" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">FROM Users u</text>
  <text x="260" y="74" text-anchor="middle" font-size="10" fill="#446688">JOIN Transactions t ON u.account = t.account</text>

  <!-- Arrow down -->
  <path d="M 260 90 L 260 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== GROUP BY ===== -->
  <rect x="130" y="108" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="126" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">GROUP BY u.account, u.name</text>
  <text x="260" y="142" text-anchor="middle" font-size="9" fill="#888">按账户折叠交易</text>

  <!-- Arrow down -->
  <path d="M 260 154 L 260 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== SUM aggregate ===== -->
  <rect x="100" y="172" width="320" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="190" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">SUM(t.amount) AS balance</text>
  <text x="260" y="206" text-anchor="middle" font-size="9" fill="#888">每组交易额求和 = 账户余额</text>

  <!-- Arrow down -->
  <path d="M 260 218 L 260 232" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== HAVING decision ===== -->
  <polygon points="260,236 390,278 260,320 130,278" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">HAVING</text>
  <text x="260" y="290" text-anchor="middle" font-size="10" fill="#d6a040">balance &gt; 10000?</text>

  <!-- No branch (left) -->
  <path d="M 130 278 L 80 278" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="105" y="272" text-anchor="middle" font-size="9" fill="#b85450">否</text>
  <rect x="20" y="264" width="58" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="49" y="284" text-anchor="middle" font-size="9" fill="#b85450">丢弃</text>

  <!-- Yes branch (right) -->
  <path d="M 390 278 L 440 278" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="415" y="272" text-anchor="middle" font-size="9" fill="#4a7a3a">是</text>
  <rect x="442" y="262" width="68" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="476" y="284" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">保留</text>

  <!-- Arrow down from yes -->
  <path d="M 476 296 L 476 312 L 260 312 L 260 326" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== SELECT output ===== -->
  <rect x="120" y="330" width="280" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">SELECT name, balance</text>
  <text x="260" y="364" text-anchor="middle" font-size="9" fill="#555">输出余额 &gt; 10000 的用户</text>

  <!-- Arrow down -->
  <path d="M 260 376 L 260 390" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="260" y="406" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">name, balance</text>

  <!-- ===== Side note: execution order ===== -->
  <rect x="20" y="40" width="82" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="61" y="56" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">执行顺序</text>
  <text x="28" y="72" font-size="8" fill="#666">FROM</text>
  <text x="28" y="86" font-size="8" fill="#666">→ JOIN</text>
  <text x="28" y="100" font-size="8" fill="#666">→ GROUP BY</text>
  <text x="28" y="114" font-size="8" fill="#666">→ HAVING</text>
  <text x="28" y="128" font-size="8" fill="#666">→ SELECT</text>

  <!-- ===== Side note: HAVING vs WHERE ===== -->
  <rect x="410" y="108" width="100" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="460" y="124" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">HAVING vs WHERE</text>
  <text x="416" y="140" font-size="8" fill="#666">WHERE 筛行</text>
  <text x="416" y="154" font-size="8" fill="#666">（聚合前）</text>
  <text x="416" y="168" font-size="8" fill="#666">HAVING 筛组</text>
  <text x="416" y="178" font-size="8" fill="#666">（聚合后）</text>
</svg>
