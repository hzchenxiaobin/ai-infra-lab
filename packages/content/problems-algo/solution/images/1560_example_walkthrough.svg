<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三种情况验证</text>

  <!-- Table header -->
  <rect x="30" y="40" width="500" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="55" y="59" text-anchor="start" font-size="10" fill="#555" font-weight="bold">示例</text>
  <text x="110" y="59" text-anchor="start" font-size="10" fill="#555" font-weight="bold">n</text>
  <text x="150" y="59" text-anchor="start" font-size="10" fill="#555" font-weight="bold">rounds</text>
  <text x="280" y="59" text-anchor="start" font-size="10" fill="#555" font-weight="bold">start→end</text>
  <text x="370" y="59" text-anchor="start" font-size="10" fill="#555" font-weight="bold">路径序列</text>
  <text x="490" y="59" text-anchor="start" font-size="10" fill="#555" font-weight="bold">结果</text>

  <!-- Column separators -->
  <line x1="100" y1="40" x2="100" y2="250" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="130" y1="40" x2="130" y2="250" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="270" y1="40" x2="270" y2="250" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="360" y1="40" x2="360" y2="250" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="480" y1="40" x2="480" y2="250" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Example 1: start < end -->
  <rect x="30" y="68" width="500" height="56" fill="#fce4ec" stroke="#e0c0c0" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="88" text-anchor="start" font-size="10" fill="#333" font-weight="bold">示例1</text>
  <text x="110" y="88" text-anchor="start" font-size="10" fill="#333">4</text>
  <text x="150" y="88" text-anchor="start" font-size="10" fill="#333">[1,3,1,2]</text>
  <text x="280" y="88" text-anchor="start" font-size="10" fill="#b85450" font-weight="bold">1 → 2 (start&lt;end)</text>
  <text x="370" y="88" text-anchor="start" font-size="10" fill="#666">1→2→3→4→1→2</text>
  <text x="490" y="88" text-anchor="start" font-size="10" fill="#b85450" font-weight="bold">[1,2]</text>
  <text x="55" y="108" text-anchor="start" font-size="9" fill="#888">访问计数：</text>
  <text x="120" y="108" text-anchor="start" font-size="9" fill="#666">1×2, 2×2, 3×1, 4×1</text>
  <text x="280" y="108" text-anchor="start" font-size="9" fill="#b85450">扇区1,2 各多一次</text>
  <text x="370" y="108" text-anchor="start" font-size="9" fill="#888">半圈：1→2</text>
  <text x="490" y="108" text-anchor="start" font-size="9" fill="#888">start≤end</text>

  <!-- Example 2: start == end -->
  <rect x="30" y="124" width="500" height="56" fill="#e6f4ea" stroke="#a0c890" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="144" text-anchor="start" font-size="10" fill="#333" font-weight="bold">示例2</text>
  <text x="110" y="144" text-anchor="start" font-size="10" fill="#333">2</text>
  <text x="150" y="144" text-anchor="start" font-size="9" fill="#333">[2,1,2,1,2,1,2,1,2]</text>
  <text x="280" y="144" text-anchor="start" font-size="10" fill="#4a7a3a" font-weight="bold">2 → 2 (start==end)</text>
  <text x="370" y="144" text-anchor="start" font-size="9" fill="#666">2→1→2→1→2→1→2→1→2</text>
  <text x="490" y="144" text-anchor="start" font-size="10" fill="#4a7a3a" font-weight="bold">[2]</text>
  <text x="55" y="164" text-anchor="start" font-size="9" fill="#888">访问计数：</text>
  <text x="120" y="164" text-anchor="start" font-size="9" fill="#666">1×4, 2×5</text>
  <text x="280" y="164" text-anchor="start" font-size="9" fill="#4a7a3a">扇区2 多一次（起点）</text>
  <text x="370" y="164" text-anchor="start" font-size="9" fill="#888">完整圈×4 + 起点</text>
  <text x="490" y="164" text-anchor="start" font-size="9" fill="#888">start==end</text>

  <!-- Example 3: start < end, all sectors -->
  <rect x="30" y="180" width="500" height="56" fill="#fff8e1" stroke="#e0d090" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="200" text-anchor="start" font-size="10" fill="#333" font-weight="bold">示例3</text>
  <text x="110" y="200" text-anchor="start" font-size="10" fill="#333">7</text>
  <text x="150" y="200" text-anchor="start" font-size="10" fill="#333">[1,3,5,7]</text>
  <text x="280" y="200" text-anchor="start" font-size="10" fill="#d6a040" font-weight="bold">1 → 7 (start&lt;end)</text>
  <text x="370" y="200" text-anchor="start" font-size="9" fill="#666">1→2→3→4→5→6→7</text>
  <text x="490" y="200" text-anchor="start" font-size="10" fill="#d6a040" font-weight="bold">[1..7]</text>
  <text x="55" y="220" text-anchor="start" font-size="9" fill="#888">访问计数：</text>
  <text x="120" y="220" text-anchor="start" font-size="9" fill="#666">每个扇区各1次</text>
  <text x="280" y="220" text-anchor="start" font-size="9" fill="#d6a040">半圈覆盖全扇区</text>
  <text x="370" y="220" text-anchor="start" font-size="9" fill="#888">半圈：1→7（全）</text>
  <text x="490" y="220" text-anchor="start" font-size="9" fill="#888">全部并列</text>

  <!-- Summary box 1 -->
  <rect x="30" y="250" width="500" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="50" y="272" text-anchor="start" font-size="11" fill="#b85450" font-weight="bold">规则：mostVisited = 从 start 到 end 沿赛道前进方向经过的扇区（含两端）</text>

  <!-- Summary box 2: formula -->
  <rect x="30" y="296" width="500" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="318" font-size="11" fill="#444" font-weight="bold">统一公式：</text>
  <text x="50" y="338" font-size="11" fill="#666">if start &lt;= end: [start, start+1, ..., end]     ← start==end 时退化为 [start]</text>
  <text x="50" y="354" font-size="11" fill="#666">if start &gt; end:  [start, ..., n, 1, ..., end]   ← 跨越边界拼接两段</text>
</svg>
