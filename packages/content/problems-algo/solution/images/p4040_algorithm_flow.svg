<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    总体流程：预处理选项表 → 分组背包
  </text>

  <!-- 开始 -->
  <ellipse cx="260" cy="62" rx="72" ry="20" fill="#e6f4ea" stroke="#4a7a3a"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="67" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">取下一个元素 x</text>

  <!-- 步骤1 -->
  <rect x="105" y="98" width="310" height="46" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    ① 求选项表：翻倍链 x, 2x, 4x…（≤ sum）
  </text>
  <text x="260" y="136" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    ∪ 减半链 ⌊x/2⌋, ⌊x/4⌋…（≥ 1），同值取最小代价
  </text>

  <!-- 步骤2 -->
  <rect x="105" y="164" width="310" height="46" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="184" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    ② 分组背包转移（每组 = 一个元素，至多选 1 个选项）：
  </text>
  <text x="260" y="202" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    ndp[s] = min( dp[s]（不选）, dp[s−v] + c（选 (v,c)） )
  </text>

  <!-- 判断 -->
  <polygon points="260,226 340,260 260,294 180,260" fill="#fce4ec" stroke="#b85450"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="265" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">还有元素?</text>

  <!-- 输出 -->
  <rect x="345" y="316" width="160" height="38" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="425" y="340" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    dp[sum] = ∞ ? −1 : dp[sum]
  </text>

  <!-- 箭头 -->
  <path d="M 260 82 L 260 92" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 144 L 260 158" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 210 L 260 222" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340 260 L 425 260 L 425 310" stroke="#b85450" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="252" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 回环 -->
  <path d="M 180 260 L 60 260 L 60 62 L 182 62" stroke="#4a7a3a" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="250" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <text x="60" y="340" font-size="11.5" fill="#666" filter="url(#rough2)">
    初始 dp[0] = 0，其余 +∞；dp[s] 恰好装到 s 的最小操作数
  </text>
</svg>
