<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：特判 n=1 后 O(1) 公式直出</text>

  <!-- 左列：主流程 -->
  <g filter="url(#rough2)">
    <!-- 开始 -->
    <rect x="60" y="44" width="150" height="32" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="135" y="64" text-anchor="middle" font-size="11" fill="#33506b">读入 n, s, m</text>
    <path d="M 135 76 L 135 94" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

    <!-- 判断 n==1 -->
    <polygon points="135,98 205,130 135,162 65,130" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="135" y="127" text-anchor="middle" font-size="11" fill="#8a6d1a">n == 1 ?</text>
    <text x="135" y="142" text-anchor="middle" font-size="9" fill="#8a6d1a">（单元素即交替）</text>

    <!-- 是 → 返回 s -->
    <path d="M 205 130 L 262 130" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="228" y="122" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
    <rect x="266" y="114" width="110" height="32" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="321" y="134" text-anchor="middle" font-size="11" fill="#2f5d24">return s</text>

    <!-- 否 ↓ -->
    <path d="M 135 162 L 135 182" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="150" y="176" font-size="10" fill="#b85450" font-weight="bold">否</text>

    <!-- 峰个数 -->
    <rect x="60" y="186" width="150" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="135" y="206" text-anchor="middle" font-size="11" fill="#33506b">k ← ⌊n/2⌋（峰的个数）</text>
    <path d="M 135 218 L 135 236" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

    <!-- 公式 -->
    <rect x="42" y="240" width="186" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="135" y="257" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold">ans ← s + 1 + k·(m−1)</text>
    <text x="135" y="272" text-anchor="middle" font-size="9" fill="#b85450">C++：long long 防溢出</text>
    <path d="M 135 280 L 135 298" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

    <!-- 返回 -->
    <rect x="60" y="302" width="150" height="32" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="135" y="322" text-anchor="middle" font-size="11" fill="#2f5d24">return ans</text>
  </g>

  <!-- 右侧：公式从哪来 -->
  <g filter="url(#rough2)">
    <rect x="300" y="44" width="244" height="150" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="422" y="64" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">公式从哪来（模式 B 递推）</text>
    <text x="312" y="86" font-size="9.5" fill="#33506b">① 峰₁ = s + m（首步升满）</text>
    <text x="312" y="106" font-size="9.5" fill="#33506b">② 峰(ₖ₊₁) = 峰ₖ − 1 + m（谷降 1 再升满）</text>
    <text x="312" y="126" font-size="9.5" fill="#33506b">③ 归纳 ⇒ 峰ₖ = s + 1 + k·(m−1)</text>
    <text x="312" y="146" font-size="9.5" fill="#33506b">④ 峰逐个抬高 m−1 ≥ 0 ⇒ 最后的峰最大</text>
    <text x="312" y="166" font-size="9.5" fill="#33506b">⑤ 峰位于奇数位，共 ⌊n/2⌋ 个</text>
    <text x="312" y="186" font-size="9.5" fill="#33506b" font-weight="bold">　 ⇒ ans = s + 1 + ⌊n/2⌋·(m−1)</text>
  </g>

  <!-- 右下：构造反验 -->
  <g filter="url(#rough2)">
    <rect x="300" y="210" width="244" height="176" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="422" y="230" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">构造合法序列反验（把上界取到）</text>
    <text x="312" y="252" font-size="9.5" fill="#2f5d24">按贪心逐位写出：</text>
    <text x="312" y="272" font-size="9.5" fill="#2f5d24">　 [s, s+m, s+m−1, s+2m−1, …]</text>
    <text x="312" y="292" font-size="9.5" fill="#2f5d24">相邻差只在 {+m, −1} 里 ⇒ |Δ| ≤ m ✓</text>
    <text x="312" y="312" font-size="9.5" fill="#2f5d24">升降严格交替 ✓</text>
    <text x="312" y="334" font-size="9.5" fill="#2f5d24">例 n=4, s=3, m=5：</text>
    <text x="312" y="354" font-size="9.5" fill="#2f5d24">　 [3, 8, 7, 12] → 12 = 3+1+2×4 ✓</text>
    <text x="312" y="376" font-size="9" fill="#4a6b8a">峰值即公式 ⇒ 上界可达，公式即答案</text>
  </g>
</svg>
