<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 2 演算：4×4 距离矩阵上挑最优分配</text>

  <!-- corner -->
  <rect x="70" y="46" width="110" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="125" y="70" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">dist</text>

  <!-- column headers -->
  <rect x="180" y="46" width="85" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="222" y="70" text-anchor="middle" font-size="11" fill="#8a6420" filter="url(#rough2)">e₁ (0,1)</text>
  <rect x="265" y="46" width="85" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="307" y="70" text-anchor="middle" font-size="11" fill="#8a6420" filter="url(#rough2)">e₂ (0,1)</text>
  <rect x="350" y="46" width="85" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="392" y="70" text-anchor="middle" font-size="11" fill="#8a6420" filter="url(#rough2)">e₃ (2,2)</text>
  <rect x="435" y="46" width="85" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="477" y="70" text-anchor="middle" font-size="11" fill="#8a6420" filter="url(#rough2)">e₄ (2,2)</text>

  <!-- row headers -->
  <rect x="70" y="84" width="110" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="125" y="111" text-anchor="middle" font-size="12" fill="#8c3a35" filter="url(#rough2)">空格 (0,2)</text>
  <rect x="70" y="128" width="110" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="125" y="155" text-anchor="middle" font-size="12" fill="#8c3a35" filter="url(#rough2)">(1,1)</text>
  <rect x="70" y="172" width="110" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="125" y="199" text-anchor="middle" font-size="12" fill="#8c3a35" filter="url(#rough2)">(1,2)</text>
  <rect x="70" y="216" width="110" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="125" y="243" text-anchor="middle" font-size="12" fill="#8c3a35" filter="url(#rough2)">(2,1)</text>

  <!-- row 1: (0,2) values 1*,1,2,2 -->
  <rect x="180" y="84" width="85" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="222" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e4d24" filter="url(#rough2)">1</text>
  <ellipse cx="222" cy="106" rx="14" ry="13" fill="none" stroke="#b85450" stroke-width="1.6" transform="rotate(-6 222 106)" filter="url(#rough2)"/>
  <rect x="265" y="84" width="85" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="307" y="112" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">1</text>
  <rect x="350" y="84" width="85" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="392" y="112" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">2</text>
  <rect x="435" y="84" width="85" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="477" y="112" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">2</text>

  <!-- row 2: (1,1) values 1,1*,2,2 -->
  <rect x="180" y="128" width="85" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="222" y="156" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">1</text>
  <rect x="265" y="128" width="85" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="307" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e4d24" filter="url(#rough2)">1</text>
  <ellipse cx="307" cy="150" rx="14" ry="13" fill="none" stroke="#b85450" stroke-width="1.6" transform="rotate(-6 307 150)" filter="url(#rough2)"/>
  <rect x="350" y="128" width="85" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="392" y="156" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">2</text>
  <rect x="435" y="128" width="85" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="477" y="156" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">2</text>

  <!-- row 3: (1,2) values 2,2,1*,1 -->
  <rect x="180" y="172" width="85" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="222" y="200" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">2</text>
  <rect x="265" y="172" width="85" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="307" y="200" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">2</text>
  <rect x="350" y="172" width="85" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="392" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e4d24" filter="url(#rough2)">1</text>
  <ellipse cx="392" cy="194" rx="14" ry="13" fill="none" stroke="#b85450" stroke-width="1.6" transform="rotate(-6 392 194)" filter="url(#rough2)"/>
  <rect x="435" y="172" width="85" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="477" y="200" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">1</text>

  <!-- row 4: (2,1) values 2,2,1,1* -->
  <rect x="180" y="216" width="85" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="222" y="244" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">2</text>
  <rect x="265" y="216" width="85" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="307" y="244" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">2</text>
  <rect x="350" y="216" width="85" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="392" y="244" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">1</text>
  <rect x="435" y="216" width="85" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="477" y="244" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e4d24" filter="url(#rough2)">1</text>
  <ellipse cx="477" cy="238" rx="14" ry="13" fill="none" stroke="#b85450" stroke-width="1.6" transform="rotate(-6 477 238)" filter="url(#rough2)"/>

  <!-- conclusions -->
  <text x="280" y="288" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">最优分配（每行、每列各用一次）：</text>
  <text x="280" y="310" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(0,2)←e₁，(1,1)←e₂，(1,2)←e₃，(2,1)←e₄  →  1 + 1 + 1 + 1 = 4</text>
  <text x="280" y="334" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">次优分支：(0,2)←e₃、(1,1)←e₁、(1,2)←e₄、(2,1)←e₂ → 2+1+1+2 = 6，DFS 剪枝淘汰</text>
</svg>
