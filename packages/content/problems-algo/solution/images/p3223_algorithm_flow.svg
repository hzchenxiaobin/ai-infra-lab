<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：计数 → 奇偶归约 → 求和，一趟 O(n)</text>

  <!-- ① 计数 -->
  <rect x="160" y="46" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">① 遍历 s，统计 cnt[c]</text>
  <path d="M 260 82 L 260 104" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ② 取非零频次 -->
  <rect x="160" y="108" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">② 取每个出现过的频次 f</text>
  <path d="M 260 144 L 260 164" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="260,168 332,200 260,232 188,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="205" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">f 为奇数？</text>

  <path d="M 188 200 C 150 200, 130 222, 126 246" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="150" y="224" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 332 200 C 370 200, 390 222, 394 246" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="372" y="224" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 分支：奇/偶 -->
  <rect x="52" y="250" width="150" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="127" y="267" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">贡献 +1</text>
  <text x="127" y="283" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">奇数次只能削到 1</text>

  <rect x="318" y="250" width="150" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="393" y="267" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">贡献 +2</text>
  <text x="393" y="283" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">偶数次只能削到 2</text>

  <!-- 汇聚 -->
  <path d="M 127 290 C 127 306, 170 306, 210 312" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 393 290 C 393 306, 350 306, 310 312" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ③ 求和返回 -->
  <rect x="160" y="312" width="200" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="12" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 累加求和，返回 ans</text>

  <!-- 左侧备注 -->
  <rect x="20" y="108" width="128" height="72" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="84" y="128" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">f = 1 → +1</text>
  <text x="84" y="144" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">f = 2 → +2</text>
  <text x="84" y="164" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">频次 &lt; 3 自动兼容</text>

  <!-- 右侧备注 -->
  <rect x="372" y="108" width="128" height="72" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="436" y="128" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">时间 O(n + 26)</text>
  <text x="436" y="144" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">空间 O(26) = O(1)</text>
  <text x="436" y="164" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">无需任何特判</text>
</svg>
