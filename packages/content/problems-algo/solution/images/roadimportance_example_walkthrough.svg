<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1 演算：n=5 → 度数升序配 1..5 → 总和 43</text>

  <!-- ===== Row 1: degree per city ===== -->
  <text x="40" y="62" font-size="11.5" fill="#446688" font-weight="bold">① 统计度数</text>
  <!-- cities 0..4 with degrees 2,3,4,2,1 -->
  <g font-size="11" fill="#333">
    <rect x="110" y="46" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="142" y="62" text-anchor="middle" font-size="9.5" fill="#888">城0</text>
    <text x="142" y="78" text-anchor="middle" font-weight="bold">度=2</text>

    <rect x="180" y="46" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="212" y="62" text-anchor="middle" font-size="9.5" fill="#888">城1</text>
    <text x="212" y="78" text-anchor="middle" font-weight="bold">度=3</text>

    <rect x="250" y="44" width="64" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
    <text x="282" y="60" text-anchor="middle" font-size="9.5" fill="#888">城2</text>
    <text x="282" y="78" text-anchor="middle" font-weight="bold" fill="#b85450">度=4</text>

    <rect x="320" y="46" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="352" y="62" text-anchor="middle" font-size="9.5" fill="#888">城3</text>
    <text x="352" y="78" text-anchor="middle" font-weight="bold">度=2</text>

    <rect x="390" y="46" width="64" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="422" y="62" text-anchor="middle" font-size="9.5" fill="#888">城4</text>
    <text x="422" y="78" text-anchor="middle" font-weight="bold">度=1</text>
  </g>
  <path d="M 480 66 L 502 66" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="510" y="70" font-size="10" fill="#666" font-weight="bold">排序</text>

  <!-- ===== Row 2: sorted degree + assigned value ===== -->
  <text x="40" y="124" font-size="11.5" fill="#4a7a3a" font-weight="bold">② 升序配值</text>
  <!-- sorted degrees 1,2,2,3,4 -> values 1,2,3,4,5 -->
  <g font-size="11" fill="#333">
    <!-- col1 deg1 val1 -->
    <rect x="110" y="108" width="64" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="142" y="124" text-anchor="middle" font-size="9.5" fill="#888">度1</text>
    <text x="142" y="142" text-anchor="middle" font-weight="bold">值=1</text>
    <text x="142" y="158" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1×1=1</text>

    <rect x="180" y="108" width="64" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="212" y="124" text-anchor="middle" font-size="9.5" fill="#888">度2</text>
    <text x="212" y="142" text-anchor="middle" font-weight="bold">值=2</text>
    <text x="212" y="158" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2×2=4</text>

    <rect x="250" y="108" width="64" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="282" y="124" text-anchor="middle" font-size="9.5" fill="#888">度2</text>
    <text x="282" y="142" text-anchor="middle" font-weight="bold">值=3</text>
    <text x="282" y="158" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2×3=6</text>

    <rect x="320" y="108" width="64" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="352" y="124" text-anchor="middle" font-size="9.5" fill="#888">度3</text>
    <text x="352" y="142" text-anchor="middle" font-weight="bold">值=4</text>
    <text x="352" y="158" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3×4=12</text>

    <rect x="390" y="106" width="64" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
    <text x="422" y="122" text-anchor="middle" font-size="9.5" fill="#888">度4</text>
    <text x="422" y="140" text-anchor="middle" font-weight="bold" fill="#b85450">值=5</text>
    <text x="422" y="158" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4×5=20</text>
  </g>

  <!-- sum arrow -->
  <path d="M 458 138 L 488 138" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="496" y="120" font-size="10" fill="#666" font-weight="bold">求和</text>
  <text x="496" y="134" font-size="9.5" fill="#888">1+4+6</text>
  <text x="496" y="146" font-size="9.5" fill="#888">+12+20</text>

  <!-- ===== Row 3: result ===== -->
  <rect x="60" y="200" width="440" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="224" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">总重要性 = 1·1 + 2·2 + 2·3 + 3·4 + 4·5</text>
  <text x="280" y="246" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">= 1 + 4 + 6 + 12 + 20 = 43 ✓</text>

  <!-- ===== verification mapping ===== -->
  <text x="40" y="296" font-size="11" fill="#888" font-weight="bold">对应赋值（度数大配大值）：</text>
  <rect x="40" y="304" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">城0=2 ， 城1=4 ， 城2=5 ， 城3=3 ， 城4=1</text>

  <!-- footer -->
  <text x="280" y="372" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">度数相同者互换赋值不影响总和（重排不等式：同序相乘取最大）</text>
  <text x="280" y="390" text-anchor="middle" font-size="9.5" fill="#888">示例给出的 [2,4,5,3,1] 即为本方案的一组合法实现</text>
</svg>
