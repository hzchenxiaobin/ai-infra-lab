<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">邻项交换：比值 d/t 大的先杀</text>

  <!-- Row A -->
  <text x="36" y="52" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">方案 A：先杀 i 再杀 j</text>
  <rect x="70" y="58" width="80" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="75" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">T</text>
  <rect x="150" y="58" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="210" y="75" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">连击 i（t_i 秒）</text>
  <rect x="270" y="58" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="330" y="75" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">连击 j（t_j 秒）</text>
  <path d="M 270 88 L 270 98" fill="none" stroke="#a07830" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="112" text-anchor="middle" font-size="10.5" fill="#8a3833" filter="url(#rough2)">i 死于 T+t_i</text>
  <path d="M 390 88 L 390 98" fill="none" stroke="#a07830" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="112" text-anchor="middle" font-size="10.5" fill="#8a3833" filter="url(#rough2)">j 死于 T+t_i+t_j</text>
  <text x="36" y="132" font-size="11.5" fill="#33506b" filter="url(#rough2)">A 的伤害 = d_i·(T+t_i) + d_j·(T+t_i+t_j)</text>

  <!-- Row B -->
  <text x="36" y="162" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">方案 B：先杀 j 再杀 i</text>
  <rect x="70" y="168" width="80" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="185" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">T</text>
  <rect x="150" y="168" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="210" y="185" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">连击 j（t_j 秒）</text>
  <rect x="270" y="168" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="330" y="185" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">连击 i（t_i 秒）</text>
  <path d="M 270 198 L 270 208" fill="none" stroke="#a07830" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="222" text-anchor="middle" font-size="10.5" fill="#8a3833" filter="url(#rough2)">j 死于 T+t_j</text>
  <path d="M 390 198 L 390 208" fill="none" stroke="#a07830" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="222" text-anchor="middle" font-size="10.5" fill="#8a3833" filter="url(#rough2)">i 死于 T+t_j+t_i</text>
  <text x="36" y="242" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">B 的伤害 = d_j·(T+t_j) + d_i·(T+t_j+t_i)</text>

  <!-- diff -->
  <rect x="85" y="256" width="350" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">作差：A − B = d_j·t_i − d_i·t_j（T 全消掉）</text>

  <!-- conclusion -->
  <rect x="52" y="302" width="416" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="12" fill="#8a3833" font-weight="bold" filter="url(#rough2)">A 更省，即 d_i·t_j &gt; d_j·t_i，即 d_i/t_i &gt; d_j/t_j</text>
  <text x="260" y="338" text-anchor="middle" font-size="11.5" fill="#8a3833" filter="url(#rough2)">→ 按「每秒伤害 ÷ 击杀用时」d/t 从大到小击杀</text>
</svg>
