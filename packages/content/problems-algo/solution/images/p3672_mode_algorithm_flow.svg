<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">流程：定长滑窗，每步 O(log n) 维护 + O(1) 查询</text>

  <!-- 开始 -->
  <ellipse cx="300" cy="46" rx="38" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="50" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M 300,61 L 300,72" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="160" y="74" width="280" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="91" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">初始化：前 k 个元素逐个 add 入窗</text>
  <text x="300" y="106" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">（维护 freq 表 / buckets 桶 / maxFreq）</text>

  <path d="M 300,112 L 300,124" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 首次查询 -->
  <rect x="160" y="126" width="280" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="146" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ans += max(bucket[maxFreq]) × maxFreq</text>

  <path d="M 300,158 L 300,170" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 i < n -->
  <polygon points="300,172 380,202 300,232 220,202" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="206" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>

  <text x="398" y="195" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 380,202 L 526,202" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <ellipse cx="478" cy="202" rx="50" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="478" y="206" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">返回 ans</text>

  <text x="312" y="246" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 300,232 L 300,248" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- remove -->
  <rect x="130" y="250" width="340" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="266" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">remove(nums[i−k])：频次 −1，值迁往下桶</text>
  <text x="300" y="282" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">顶桶清空 ⇒ maxFreq−−（被移值落在相邻桶，至多降一层）</text>

  <path d="M 300,290 L 300,302" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- add -->
  <rect x="130" y="304" width="340" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="320" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">add(nums[i])：频次 +1，值迁往上桶</text>
  <text x="300" y="336" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">f &gt; maxFreq ⇒ maxFreq = f（升频直达，查询前桶必非空）</text>

  <path d="M 300,344 L 300,356" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 查询 -->
  <rect x="160" y="358" width="280" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="378" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ans += max(bucket[maxFreq]) × maxFreq</text>

  <path d="M 300,390 L 300,402" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i++ -->
  <rect x="252" y="404" width="96" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="424" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i++</text>

  <!-- 回环 -->
  <path d="M 252,419 L 160,419 L 160,202 L 216,202" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="330" font-size="9.5" fill="#888" filter="url(#rough2)">回到「i &lt; n ?」</text>

  <!-- 底部备注 -->
  <rect x="20" y="444" width="520" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="462" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">每个元素进出窗口各一次：O(n) 次有序集合操作 × O(log n) ⇒ 总时间 O(n log n)</text>
</svg>
