<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心配对：排序后 Bob 取最小 n 堆，顶部 2n 堆两两配对</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">3n = 6, n = 2, 排序后 piles = [1, 2, 2, 4, 7, 8]</text>

  <!-- ===== Sorted piles row ===== -->
  <text x="40" y="76" font-size="12" fill="#888">排序后（升序）：</text>

  <!-- Bob's piles (smallest n=2): indices 0,1 -> values 1,2 -->
  <rect x="100" y="86" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="110" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
  <rect x="152" y="86" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="177" y="110" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>

  <!-- Your piles (green): indices 2,4 -> values 2,7 -->
  <rect x="204" y="86" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="229" y="110" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="412" y="86" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="437" y="110" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">7</text>

  <!-- Alice's piles (blue): indices 3,5 -> values 4,8 -->
  <rect x="308" y="86" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="333" y="110" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">4</text>
  <rect x="464" y="86" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="489" y="110" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">8</text>

  <!-- Index labels below -->
  <text x="125" y="138" text-anchor="middle" font-size="10" fill="#999">i=0</text>
  <text x="177" y="138" text-anchor="middle" font-size="10" fill="#999">i=1</text>
  <text x="229" y="138" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">i=2</text>
  <text x="333" y="138" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i=3</text>
  <text x="437" y="138" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">i=4</text>
  <text x="489" y="138" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i=5</text>

  <!-- Bob bracket (smallest n) -->
  <path d="M 100 146 L 100 156 L 202 156 L 202 146" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="151" y="172" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Bob 取最小 n 堆</text>

  <!-- Pairing brackets: (8,7) and (4,2) -->
  <path d="M 412 56 L 412 48 L 514 48 L 514 56" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="463" y="42" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">第1轮配对</text>
  <text x="463" y="64" text-anchor="middle" font-size="9" fill="#888">Alice 取 8，你取 7</text>

  <path d="M 204 56 L 204 48 L 358 48 L 358 56" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="281" y="42" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">第2轮配对</text>
  <text x="281" y="64" text-anchor="middle" font-size="9" fill="#888">Alice 取 4，你取 2</text>

  <!-- arrow down -->
  <path d="M 280 184 L 280 204" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="198" font-size="11" fill="#888">你取索引 n, n+2, …, 3n−2</text>

  <!-- ===== Pattern summary ===== -->
  <rect x="60" y="212" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="236" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">取数规律（0 下标，排序后）</text>
  <text x="280" y="256" text-anchor="middle" font-size="12" fill="#666">你取 piles[n], piles[n+2], …, piles[3n−2]，共 n 堆</text>

  <!-- ===== Legend ===== -->
  <text x="40" y="296" font-size="12" fill="#888">图例：</text>
  <rect x="86" y="284" width="22" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="116" y="298" font-size="11" fill="#b85450">Bob（每轮取最小）</text>
  <rect x="240" y="284" width="22" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="270" y="298" font-size="11" fill="#4a7a3a">你（每轮取第二大）</text>
  <rect x="394" y="284" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="424" y="298" font-size="11" fill="#446688">Alice（每轮取最大）</text>

  <!-- ===== Result box ===== -->
  <rect x="120" y="324" width="320" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">你的硬币 = piles[2] + piles[4] = 2 + 7 = 9</text>

  <!-- key insight note -->
  <text x="280" y="388" text-anchor="middle" font-size="11" fill="#888">💡 把最大堆「喂」给 Alice，把最小堆「丢」给 Bob，你稳拿第二大</text>
</svg>
