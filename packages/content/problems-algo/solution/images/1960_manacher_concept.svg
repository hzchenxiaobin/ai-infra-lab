<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：Manacher 求半径 + 前后缀最大值拆分</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">对每个分割点 i，左半最大回文 × 右半最大回文 → 取 max</text>

  <!-- string s = "ababbb" with indices -->
  <g font-size="14">
    <rect x="100" y="90" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="130" y="116" text-anchor="middle" fill="#333" filter="url(#rough2)">a</text>
    <rect x="170" y="90" width="60" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="200" y="116" text-anchor="middle" fill="#333" filter="url(#rough2)">b</text>
    <rect x="240" y="90" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="270" y="116" text-anchor="middle" fill="#333" filter="url(#rough2)">a</text>
    <rect x="310" y="90" width="60" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="340" y="116" text-anchor="middle" fill="#333" filter="url(#rough2)">b</text>
    <rect x="380" y="90" width="60" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="410" y="116" text-anchor="middle" fill="#333" filter="url(#rough2)">b</text>
    <rect x="450" y="90" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="480" y="116" text-anchor="middle" fill="#333" filter="url(#rough2)">b</text>
  </g>

  <!-- index labels -->
  <g font-size="10" fill="#888">
    <text x="130" y="146" text-anchor="middle" filter="url(#rough2)">i=0</text>
    <text x="200" y="146" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="270" y="146" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="340" y="146" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="410" y="146" text-anchor="middle" filter="url(#rough2)">4</text>
    <text x="480" y="146" text-anchor="middle" filter="url(#rough2)">5</text>
  </g>

  <!-- Manacher radii arcs -->
  <!-- d[1]=1: palindrome "aba" covering idx 0-2 -->
  <path d="M 100 85 Q 200 50 270 85" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <text x="185" y="60" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">d[1]=1 → "aba" len=3</text>

  <!-- d[2]=1: palindrome "bab" covering idx 1-3 -->
  <path d="M 170 75 Q 270 40 340 75" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="255" y="38" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">d[2]=1 → "bab"</text>

  <!-- d[4]=1: palindrome "bbb" covering idx 3-5 -->
  <path d="M 310 85 Q 410 50 480 85" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <text x="395" y="60" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">d[4]=1 → "bbb" len=3</text>

  <!-- split point at i=2 -->
  <line x1="275" y1="165" x2="275" y2="400" stroke="#d6a040" stroke-width="2" stroke-dasharray="6,3" filter="url(#rough2)"/>
  <text x="275" y="162" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">分割点 i=2</text>

  <!-- left part bracket -->
  <path d="M 100 180 L 95 185 L 95 200 L 100 205" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 270 180 L 275 185 L 275 200 L 270 205" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="185" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">左半：prefixMax[2] = 3</text>

  <!-- right part bracket -->
  <path d="M 280 180 L 275 185 L 275 200 L 280 205" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 510 180 L 515 185 L 515 200 L 510 205" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="395" y="198" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">右半：suffixMax[3] = 3</text>

  <!-- product formula -->
  <rect x="140" y="230" width="360" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="256" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">ans = prefixMax[i] × suffixMax[i+1]</text>
  <text x="320" y="280" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">= 3 × 3 = 9</text>

  <!-- key insight box -->
  <rect x="50" y="320" width="540" height="125" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="344" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">关键技巧：惰性传播避免 O(n²)</text>
  <text x="70" y="366" font-size="12" fill="#555" filter="url(#rough2)">① Manacher 一次扫描求出每个中心的最长奇回文半径 d[i]，O(n)</text>
  <text x="70" y="386" font-size="12" fill="#555" filter="url(#rough2)">② 长度 L 的回文向内缩 2 仍是回文 → maxEnd[i] = max(maxEnd[i], maxEnd[i+1]-2)</text>
  <text x="70" y="406" font-size="12" fill="#555" filter="url(#rough2)">③ 前缀 max / 后缀 max 各一次扫描 → 任意分割点 O(1) 查询左右最大回文长度</text>
  <text x="70" y="428" font-size="11" fill="#888" filter="url(#rough2)">总体 O(n)，适用于 n ≤ 10⁵ 的约束</text>
</svg>
