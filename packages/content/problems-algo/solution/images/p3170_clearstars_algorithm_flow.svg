<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="500" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描 + 26 桶</text>

  <!-- start -->
  <rect x="218" y="36" width="84" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="54" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 260 64 L 260 78" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="208" y="78" width="104" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="260" y="97" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i = 0</text>
  <path d="M 260 108 L 260 122" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="260,122 332,148 260,174 188,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="152" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>

  <path d="M 260 174 L 260 200" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="268" y="192" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M 332 148 L 358 148" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="340" y="140" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- filter box -->
  <rect x="358" y="126" width="150" height="44" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="433" y="144" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">过滤：跳过 '*' 与</text>
  <text x="433" y="160" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">已删下标 → 拼接 ans</text>
  <path d="M 433 170 L 433 206" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- end -->
  <rect x="383" y="206" width="100" height="28" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="433" y="224" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- diamond 2 -->
  <polygon points="260,200 334,226 260,252 186,226" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="230" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">s[i] == '*' ?</text>

  <!-- yes -> A -->
  <path d="M 186 226 L 117 226 L 117 262" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="160" y="218" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- no -> C -->
  <path d="M 334 226 L 417 226 L 417 262" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="356" y="218" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- A -->
  <rect x="25" y="262" width="185" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="117" y="280" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">从 'a' 到 'z' 依次找</text>
  <text x="117" y="296" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">第一个非空桶 c</text>
  <path d="M 117 306 L 117 330" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- B -->
  <rect x="25" y="330" width="185" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="117" y="348" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">弹出栈顶下标 j</text>
  <text x="117" y="364" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">removed[j] = true</text>

  <!-- C -->
  <rect x="330" y="262" width="175" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="417" y="280" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">stk[s[i] − 'a'].push(i)</text>
  <text x="417" y="296" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">（下标 i 入对应字母桶）</text>

  <!-- B -> i++ , C -> i++ -->
  <path d="M 210 352 L 222 352" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 417 306 L 417 352 L 308 352" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- i++ -->
  <rect x="222" y="336" width="86" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="265" y="356" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i = i + 1</text>

  <!-- loop back -->
  <path d="M 265 368 L 265 394 L 14 394 L 14 148 L 188 148" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- notes -->
  <rect x="25" y="412" width="470" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="432" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">桶 = 每个字母一个下标栈；弹栈顶 = 删最靠右的最小字母</text>
  <text x="260" y="450" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">每个 '*' 从 'a' 起最多扫 26 个桶 → 整体 O(26n)</text>
  <text x="260" y="468" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">题目保证每个 '*' 左侧必有字符可删（桶不会全空）</text>
</svg>
