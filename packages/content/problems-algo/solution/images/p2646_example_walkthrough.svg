<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：price=[2,2,10,6]，trips 经 0-1-3 / 2-1 / 2-1-3</text>

  <!-- Left: tree with freq/cost/save -->
  <text x="120" y="50" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">树（标注 cost=price·freq, save=cost/2）</text>
  <!-- node 0 -->
  <rect x="86" y="60" width="68" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="120" y="76" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0  cost=2</text>
  <text x="120" y="92" text-anchor="middle" font-size="9" fill="#4a7a3a">save=1</text>
  <!-- node 1 -->
  <rect x="86" y="120" width="68" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="120" y="136" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1  cost=6</text>
  <text x="120" y="152" text-anchor="middle" font-size="9" fill="#4a7a3a">save=3</text>
  <!-- node 2 -->
  <rect x="40" y="186" width="68" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="74" y="202" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2  cost=20</text>
  <text x="74" y="218" text-anchor="middle" font-size="9" fill="#4a7a3a">save=10</text>
  <!-- node 3 -->
  <rect x="132" y="186" width="68" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="166" y="202" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3  cost=12</text>
  <text x="166" y="218" text-anchor="middle" font-size="9" fill="#4a7a3a">save=6</text>
  <!-- edges -->
  <line x1="120" y1="102" x2="120" y2="120" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="108" y1="162" x2="86" y2="186" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="132" y1="162" x2="150" y2="186" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Right: DP table -->
  <text x="420" y="50" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">树形 DP（自底向上）</text>
  <!-- table frame -->
  <rect x="300" y="58" width="240" height="170" fill="none" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <!-- header -->
  <rect x="300" y="58" width="240" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="340" y="75" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">节点</text>
  <text x="410" y="75" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">dp[0]</text>
  <text x="480" y="75" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">dp[1]</text>
  <!-- rows -->
  <text x="340" y="98" text-anchor="middle" font-size="10" fill="#333">2 (叶)</text>
  <text x="410" y="98" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="480" y="98" text-anchor="middle" font-size="10" fill="#333">10</text>
  <text x="340" y="120" text-anchor="middle" font-size="10" fill="#333">3 (叶)</text>
  <text x="410" y="120" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="480" y="120" text-anchor="middle" font-size="10" fill="#333">6</text>
  <line x1="308" y1="128" x2="532" y2="128" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="340" y="146" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <text x="410" y="146" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">16</text>
  <text x="480" y="146" text-anchor="middle" font-size="10" fill="#333">3</text>
  <line x1="308" y1="154" x2="532" y2="154" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="340" y="172" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0 (根)</text>
  <text x="410" y="172" text-anchor="middle" font-size="10" fill="#333">16</text>
  <text x="480" y="172" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">17</text>
  <text x="420" y="196" text-anchor="middle" font-size="9" fill="#888">dp1[1]=save1+dp0[2]+dp0[3]=3</text>
  <text x="420" y="210" text-anchor="middle" font-size="9" fill="#888">dp0[1]=10+6=16; dp1[0]=1+16=17</text>

  <!-- answer -->
  <rect x="100" y="250" width="360" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="11" fill="#333">total = 2+6+20+12 = 40，max 节省 = max(16,17) = 17</text>
  <text x="280" y="290" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">答案 = 40 − 17 = 23 ✓</text>
</svg>
