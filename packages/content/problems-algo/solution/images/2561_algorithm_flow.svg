<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：频率统计 → 奇偶检查 → 盈余 → 反向配对求和</text>

  <!-- Step 1 -->
  <rect x="40" y="54" width="560" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="79" font-size="12" fill="#333" font-weight="bold">① 统计总频率 cnt = Counter(b1)+Counter(b2)；任一值奇频 → 返回 -1</text>
  <path d="M 320 96 L 320 106" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="40" y="108" width="560" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="133" font-size="12" fill="#333" font-weight="bold">② target=cnt[v]//2；b1 中超出 target 的入 diff1，不足则入 diff2</text>
  <path d="M 320 150 L 320 160" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="40" y="162" width="560" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="187" font-size="12" fill="#333" font-weight="bold">③ mn = min(两数组最小值)；diff1、diff2 升序排序（长度均为 m）</text>
  <path d="M 320 204 L 320 214" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="40" y="216" width="560" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="241" font-size="12" fill="#333" font-weight="bold">④ 反向配对 i↔m−1−i：ans += min( min(diff1[i], diff2[m-1-i]), 2×mn )</text>
  <path d="M 320 258 L 320 268" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 5 result -->
  <rect x="40" y="270" width="560" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="295" font-size="12" fill="#b85450" font-weight="bold">⑤ 返回 ans（m=0 时两篮已相等，返回 0）</text>

  <!-- edge notes -->
  <rect x="40" y="330" width="560" height="74" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="352" font-size="11" fill="#555">实现要点：① 值域 ≤ 10⁹、cost 可达 2×10⁹×10⁵，C++ 用 long long；Python 无溢出。</text>
  <text x="60" y="372" font-size="11" fill="#555">② 反向配对等价于"取 2m 个盈余中最小的 m 个、各封顶 2×mn 求和"。</text>
  <text x="60" y="392" font-size="11" fill="#555">③ 全局最小做中介：a↔mn 再 b↔mn，mn 回原位，花费 2×mn 封顶每对成本。</text>
</svg>
