<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：计数 → 判奇偶 → 分类计算</text>

  <!-- Step 1: Count -->
  <rect x="170" y="44" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 遍历统计失配类型</text>
  <text x="280" y="76" text-anchor="middle" font-size="10" fill="#888">xy_count = Σ(s1[i]=='x' &amp;&amp; s2[i]=='y')</text>

  <path d="M 280 86 L 280 100" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: Parity check (diamond) -->
  <polygon points="280,104 380,140 280,176 180,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">② (xy + yx) % 2 ?</text>
  <text x="280" y="152" text-anchor="middle" font-size="10" fill="#888">总失配数是否为奇数</text>

  <!-- Left branch: odd -> -1 -->
  <path d="M 180 140 L 80 140" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="100" y="132" font-size="10" fill="#b85450" font-weight="bold">奇数</text>
  <rect x="20" y="128" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="48" y="147" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return -1</text>

  <!-- Right branch: even -> compute -->
  <path d="M 380 140 L 460 140" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="400" y="132" font-size="10" fill="#4a7a3a" font-weight="bold">偶数</text>

  <path d="M 460 140 L 460 170 L 280 170 L 280 192" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: Compute formula -->
  <rect x="100" y="196" width="360" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="214" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 分类计算最小交换次数</text>
  <text x="280" y="232" text-anchor="middle" font-size="11" fill="#444">ans = xy // 2 + yx // 2</text>
  <text x="280" y="246" text-anchor="middle" font-size="11" fill="#444">+ 2 * (xy % 2)</text>

  <path d="M 280 254 L 280 268" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Breakdown box -->
  <rect x="60" y="272" width="440" height="96" fill="#fafafa" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">公式拆解说明</text>

  <rect x="80" y="298" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="316" text-anchor="middle" font-size="10" fill="#333">xy // 2：成对 xy 各1次</text>

  <rect x="220" y="298" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="10" fill="#444">yx // 2：成对 yx 各1次</text>

  <rect x="360" y="298" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="316" text-anchor="middle" font-size="10" fill="#b85450">余下 xy+yx → 2次</text>

  <text x="280" y="348" text-anchor="middle" font-size="10" fill="#888">xy % 2 == 1 时，必剩 1个xy + 1个yx，需 2 次交换</text>
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#888">xy % 2 == 0 时，无剩余，此项为 0</text>

  <!-- Return -->
  <rect x="200" y="382" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="402" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return ans</text>
</svg>
