<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：KMP × 2 → 双指针归并判定</text>

  <!-- main flow -->
  <ellipse cx="170" cy="58" rx="44" ry="18" fill="#ffffff" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="63" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">开始</text>
  <path d="M 170 76 L 170 90" stroke="#999" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="76" y="94" width="188" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="115" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">KMP(s, a) → A（升序表）</text>
  <path d="M 170 128 L 170 142" stroke="#999" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="76" y="146" width="188" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="167" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">KMP(s, b) → B（升序表）</text>
  <path d="M 170 180 L 170 194" stroke="#999" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="128" y="198" width="84" height="30" fill="#ffffff" stroke="#999" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="170" y="217" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">j = 0</text>
  <path d="M 170 228 L 170 242" stroke="#999" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="92" y="246" width="156" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="267" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">取下一个 i ∈ A（循环）</text>
  <path d="M 170 280 L 170 294" stroke="#999" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="170,300 250,330 170,360 90,330" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="327" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">j &lt; |B| 且</text>
  <text x="170" y="343" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">B[j] &lt; i − k ?</text>

  <path d="M 250 330 L 292 330" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="262" y="322" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">是</text>
  <rect x="296" y="314" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="324" y="334" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">j++</text>
  <path d="M 324 314 C 324 296 200 296 176 298" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <path d="M 170 360 L 170 374" stroke="#999" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="180" y="372" font-size="10" fill="#888" filter="url(#rough2)">否</text>

  <polygon points="170,380 246,406 170,432 94,406" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)" transform="translate(0,-14)"/>
  <text x="170" y="386" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)" transform="translate(0,-14)">j &lt; |B| 且</text>
  <text x="170" y="402" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)" transform="translate(0,-14)">B[j] ≤ i + k ?</text>

  <path d="M 94 392 L 44 392 L 44 263 L 88 263" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="60" y="384" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是：ans 收 i</text>
  <path d="M 170 418 L 170 424" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 170 418 C 170 424 60 424 60 263" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)" transform="translate(14,0)"/>
  <text x="196" y="424" font-size="10" fill="#b85450" filter="url(#rough2)">否：跳过 i</text>
  <text x="70" y="248" font-size="10" fill="#888" filter="url(#rough2)">回到循环取下一个 i</text>

  <!-- right annotations -->
  <rect x="330" y="94" width="168" height="120" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="414" y="116" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">为什么要 KMP？</text>
  <text x="340" y="136" font-size="10" fill="#888" filter="url(#rough2)">· |s| 高达 5×10⁵</text>
  <text x="340" y="154" font-size="10" fill="#888" filter="url(#rough2)">· 暴力逐位比对 O(n·m) 会超时</text>
  <text x="340" y="172" font-size="10" fill="#888" filter="url(#rough2)">· KMP 找全部起点 O(n+m)</text>
  <text x="340" y="190" font-size="10" fill="#888" filter="url(#rough2)">· 命中后回跳 π，重叠也不漏</text>

  <rect x="330" y="228" width="168" height="76" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="414" y="250" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">为什么能双指针？</text>
  <text x="340" y="270" font-size="10" fill="#888" filter="url(#rough2)">· A、B 都升序，i 递增</text>
  <text x="340" y="288" font-size="10" fill="#888" filter="url(#rough2)">· i−k 递增 → j 只进不退</text>
  <text x="340" y="306" font-size="10" fill="#888" filter="url(#rough2)">· 总步数 ≤ |A|+|B|，O(n)</text>

  <rect x="330" y="316" width="168" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="414" y="338" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">对拍小技巧</text>
  <text x="340" y="356" font-size="10" fill="#8a6d3b" filter="url(#rough2)">· B 空 / a 比 s 长 → A 或 B</text>
  <text x="340" y="372" font-size="10" fill="#8a6d3b" filter="url(#rough2)">  为空，直接返回 []</text>
</svg>
