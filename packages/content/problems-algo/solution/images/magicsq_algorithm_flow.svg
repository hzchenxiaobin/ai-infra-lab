<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：枚举 + 校验</text>

  <!-- 1. 起始：遍历左上角 -->
  <rect x="150" y="50" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="75" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">遍历所有 3×3 子网格左上角 (i,j)</text>
  <path d="M260,90 L260,110" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 2. 菱形：中心==5? -->
  <polygon points="260,110 360,155 260,200 160,155" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">中心格</text>
  <text x="260" y="166" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">grid[i+1][j+1] == 5 ?</text>

  <!-- No 分支 → 右侧跳过 -->
  <path d="M360,155 L420,155" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="385" y="148" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="420" y="140" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="460" y="160" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">跳过</text>

  <!-- Yes 分支 ↓ -->
  <path d="M260,200 L260,220" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="275" y="215" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 3. 校验 1~9 distinct -->
  <rect x="135" y="220" width="250" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="245" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">校验 9 个数 ∈ [1,9] 且互不相同</text>
  <path d="M260,260 L260,280" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 4. 菱形：8条线之和=15? -->
  <polygon points="260,280 370,325 260,370 150,325" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3 行 + 3 列 + 2 对角</text>
  <text x="260" y="335" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">和均 = 15 ?</text>

  <!-- No 分支 → 右侧跳过(共用) -->
  <path d="M370,325 L420,325 L420,156 L460,156" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr)" fill="none" filter="url(#rough2)" opacity="0.7"/>
  <text x="395" y="318" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- Yes 分支 ↓ -->
  <path d="M260,370 L260,390" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="275" y="385" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 5. count++ -->
  <rect x="200" y="390" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="412" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">count++</text>

  <!-- 循环回箭头：从 count++ 和 跳过 都回到顶部遍历 -->
  <path d="M320,407 L490,407 L490,70 L370,70" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)" fill="none" filter="url(#rough2)" opacity="0.6"/>
  <text x="495" y="240" font-size="11" fill="#888" filter="url(#rough2)" transform="rotate(90 495 240)">下一个 (i,j)</text>

  <!-- 返回 -->
  <text x="100" y="412" font-size="13" fill="#333" filter="url(#rough2)">→ 返回 count</text>
</svg>
