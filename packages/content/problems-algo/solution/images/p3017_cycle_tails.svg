<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">一条弦把链掰成「环 + 左尾巴 + 右尾巴」</text>
  <text x="260" y="50" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">例：n = 8, x = 3, y = 6 → 环长 L = 4，左尾 m1 = 2，右尾 m2 = 2</text>

  <!-- 环的背景 -->
  <rect x="126" y="174" width="216" height="60" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- 链上的街道 -->
  <g stroke="#446688" stroke-width="1.5" filter="url(#rough2)">
    <line x1="56" y1="204" x2="76" y2="204"/>
    <line x1="112" y1="204" x2="132" y2="204"/>
    <line x1="168" y1="204" x2="188" y2="204"/>
    <line x1="224" y1="204" x2="244" y2="204"/>
    <line x1="280" y1="204" x2="300" y2="204"/>
    <line x1="336" y1="204" x2="356" y2="204"/>
    <line x1="392" y1="204" x2="412" y2="204"/>
  </g>

  <!-- 8 个房屋 -->
  <rect x="20" y="186" width="36" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="76" y="186" width="36" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="132" y="186" width="36" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="188" y="186" width="36" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="244" y="186" width="36" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="300" y="186" width="36" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="356" y="186" width="36" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="412" y="186" width="36" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <g text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    <text x="38" y="209">1</text>
    <text x="94" y="209">2</text>
    <text x="150" y="209">3</text>
    <text x="206" y="209">4</text>
    <text x="262" y="209">5</text>
    <text x="318" y="209">6</text>
    <text x="374" y="209">7</text>
    <text x="430" y="209">8</text>
  </g>

  <g text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">
    <text x="150" y="240">x</text>
    <text x="318" y="240">y</text>
  </g>

  <!-- 额外的弦 -->
  <path d="M 150 182 Q 234 66 316 180" fill="none" stroke="#4a7a3a" stroke-width="3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="234" y="92" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">弦 x–y（1 步）</text>

  <!-- 三个区域的括线 -->
  <g stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)">
    <path d="M 20 256 L 20 262 L 112 262 L 112 256"/>
    <path d="M 126 256 L 126 262 L 342 262 L 342 256"/>
    <path d="M 356 256 L 356 262 L 448 262 L 448 256"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    <text x="66" y="280">左尾巴</text>
    <text x="66" y="296">1..x−1（m1 = 2）</text>
    <text x="234" y="280">环 [x..y]</text>
    <text x="234" y="296">L = y−x+1 = 4 个节点</text>
    <text x="402" y="280">右尾巴</text>
    <text x="402" y="296">y+1..n（m2 = 2）</text>
  </g>

  <!-- 底部说明 -->
  <rect x="26" y="310" width="468" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="327" text-anchor="middle" font-size="11.5" fill="#2d5a1f" filter="url(#rough2)">x 与 y 是咽喉（割点）：左尾巴只经 x、右尾巴只经 y 与其余部分相连，</text>
  <text x="260" y="344" text-anchor="middle" font-size="11.5" fill="#2d5a1f" filter="url(#rough2)">一切跨区路径必经它们——类③④的距离公式全部由此推出</text>
</svg>
