<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：最长特殊序列一定是某个完整字符串</text>

  <!-- ===== Panel A: proof by contradiction ===== -->
  <text x="40" y="52" font-size="12" fill="#446688" font-weight="bold">反证：若 S 是 A 的特殊子序列 → A 本身也特殊</text>

  <!-- String A box -->
  <rect x="44" y="66" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="104" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A = "aba"</text>

  <!-- arrow A -> S (S is subsequence of A) -->
  <text x="180" y="80" font-size="10" fill="#888">子序列</text>
  <path d="M 175 88 Q 195 78 215 88" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- S box (subsequence of A) -->
  <rect x="220" y="66" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="88" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">S = "aa"</text>

  <!-- If A is subseq of B, then S is also subseq of B -->
  <text x="320" y="80" font-size="10" fill="#b85450" font-weight="bold">若 A ⊂ B</text>
  <path d="M 375 88 Q 395 78 415 88" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- B box -->
  <rect x="420" y="66" width="100" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="470" y="88" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">B = "abba"</text>

  <!-- conclusion line -->
  <text x="270" y="118" text-anchor="middle" font-size="11" fill="#b85450">A ⊂ B  →  S ⊂ A ⊂ B  →  S 也在 B 中 → S 不特殊！矛盾</text>

  <!-- divider -->
  <line x1="40" y1="134" x2="500" y2="134" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Panel B: conclusion ===== -->
  <text x="40" y="156" font-size="12" fill="#4a7a3a" font-weight="bold">结论：最长特殊序列 = 最长的「不被其他串包含」的完整串</text>

  <!-- string array -->
  <text x="44" y="182" font-size="11" fill="#555">字符串数组：</text>

  <rect x="120" y="168" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="155" y="188" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"aba"</text>

  <rect x="200" y="168" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="235" y="188" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"cdc"</text>

  <rect x="280" y="168" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="315" y="188" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"eae"</text>

  <!-- check marks -->
  <text x="155" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">不包含于他者 ✓</text>
  <text x="235" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">不包含于他者 ✓</text>
  <text x="315" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">不包含于他者 ✓</text>

  <!-- arrow down to answer -->
  <path d="M 270 228 Q 270 238 270 248" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- answer box -->
  <rect x="160" y="256" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="282" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">最长特殊序列长度 = 3</text>

  <!-- key insight box -->
  <rect x="44" y="312" width="452" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="270" y="334" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">关键转化</text>
  <text x="270" y="354" text-anchor="middle" font-size="11.5" fill="#555">不需要枚举所有子序列，只需逐个检查完整字符串</text>
  <text x="270" y="372" text-anchor="middle" font-size="11.5" fill="#555">「strs[i] 是否为某个 strs[j] 的子序列？」→ 否则即为答案</text>
</svg>
