<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">模拟法流程：喝光 → 兑换 → 循环</text>

  <!-- Start: 初始化 -->
  <rect x="170" y="50" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="20" filter="url(#rough2)"/>
  <text x="260" y="75" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始：full=b, empty=0, ans=0</text>

  <!-- Arrow down to diamond -->
  <path d="M 260 90 L 260 118" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Diamond: full > 0 ? -->
  <polygon points="260,122 340,172 260,222 180,172" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="168" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">full &gt; 0 ?</text>
  <text x="260" y="186" text-anchor="middle" font-size="10" fill="#888">还有满水可喝？</text>

  <!-- No branch: right to return -->
  <path d="M 340 172 L 410 172" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="375" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Return box -->
  <rect x="410" y="152" width="90" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="455" y="170" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 ans</text>
  <text x="455" y="184" text-anchor="middle" font-size="10" fill="#888">结束</text>

  <!-- Yes branch: down to step1 -->
  <path d="M 260 222 L 260 250" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="276" y="240" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Step 1: 喝掉 -->
  <rect x="130" y="252" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="277" text-anchor="middle" font-size="12" fill="#333">① 喝掉全部满水：ans += full；empty += full</text>

  <!-- Arrow down -->
  <path d="M 260 292 L 260 318" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 2: 兑换 -->
  <rect x="100" y="320" width="320" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="346" text-anchor="middle" font-size="12" fill="#333">② 兑换新满水：full = empty / e</text>
  <text x="260" y="360" text-anchor="middle" font-size="11" fill="#777">empty = empty % e</text>

  <!-- Loop back arrow to diamond -->
  <path d="M 260 364 L 260 388 L 80 388 L 80 172 L 180 172" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="100" y="406" font-size="11" fill="#b85450" font-weight="bold">回到判定，进入下一轮</text>

  <!-- Note box -->
  <rect x="130" y="424" width="260" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="442" text-anchor="middle" font-size="11" fill="#4a7a3a">公式等价：ans = b + (b−1)/(e−1)</text>
</svg>
