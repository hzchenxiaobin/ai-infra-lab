<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="340" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [5,4,8,7,10,2]</text>

  <text x="105" y="50" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第一步 · 右→左建 suf_min</text>

  <rect x="22" y="58" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="40" y="76" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">i</text>
  <rect x="58" y="58" width="62" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="89" y="76" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">nums[i]</text>
  <rect x="120" y="58" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="155" y="76" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">suf_min[i]</text>

  <rect x="22" y="84" width="36" height="24" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="101" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="58" y="84" width="62" height="24" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="89" y="101" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="120" y="84" width="70" height="24" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="155" y="101" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>

  <rect x="22" y="108" width="36" height="24" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="125" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="58" y="108" width="62" height="24" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="89" y="125" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">10</text>
  <rect x="120" y="108" width="70" height="24" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="155" y="125" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>

  <rect x="22" y="132" width="36" height="24" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="149" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="58" y="132" width="62" height="24" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="89" y="149" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">7</text>
  <rect x="120" y="132" width="70" height="24" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="155" y="149" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>

  <rect x="22" y="156" width="36" height="24" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="173" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="58" y="156" width="62" height="24" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="89" y="173" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">8</text>
  <rect x="120" y="156" width="70" height="24" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="155" y="173" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>

  <rect x="22" y="180" width="36" height="24" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="197" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="58" y="180" width="62" height="24" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="89" y="197" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="120" y="180" width="70" height="24" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="155" y="197" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>

  <rect x="22" y="204" width="36" height="24" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="221" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="58" y="204" width="62" height="24" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="89" y="221" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="120" y="204" width="70" height="24" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="155" y="221" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>

  <text x="400" y="50" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">第二步 · 左→右枚举山峰（pre_min 滚动）</text>

  <rect x="212" y="58" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="229" y="76" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">j</text>
  <rect x="246" y="58" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="274" y="76" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">nums[j]</text>
  <rect x="302" y="58" width="58" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="331" y="76" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">pre_min</text>
  <rect x="360" y="58" width="72" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="396" y="76" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">suf_min[j+1]</text>
  <rect x="432" y="58" width="104" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="484" y="76" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">候选和</text>
  <rect x="536" y="58" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="559" y="76" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">ans</text>

  <rect x="212" y="88" width="34" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="229" y="106" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="246" y="88" width="56" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="274" y="106" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="302" y="88" width="58" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="331" y="106" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="360" y="88" width="72" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="396" y="106" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="432" y="88" width="104" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="484" y="106" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">5&lt;4 ✗</text>
  <rect x="536" y="88" width="46" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="559" y="106" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">∞</text>

  <rect x="212" y="114" width="34" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="229" y="132" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="246" y="114" width="56" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="274" y="132" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">8</text>
  <rect x="302" y="114" width="58" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="331" y="132" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="360" y="114" width="72" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="396" y="132" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="432" y="114" width="104" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="484" y="132" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4+8+2=14</text>
  <rect x="536" y="114" width="46" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="559" y="132" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">14</text>

  <rect x="212" y="140" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="229" y="158" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="246" y="140" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="274" y="158" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="302" y="140" width="58" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="331" y="158" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="360" y="140" width="72" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="396" y="158" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="432" y="140" width="104" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="484" y="158" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">4+7+2=13</text>
  <rect x="536" y="140" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="559" y="158" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">13</text>

  <rect x="212" y="166" width="34" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="229" y="184" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="246" y="166" width="56" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="274" y="184" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">10</text>
  <rect x="302" y="166" width="58" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="331" y="184" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="360" y="166" width="72" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="396" y="184" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="432" y="166" width="104" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="484" y="184" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4+10+2=16</text>
  <rect x="536" y="166" width="46" height="26" fill="#ffffff" stroke="#9ab" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="559" y="184" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">13</text>

  <rect x="40" y="244" width="540" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="266" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 13：山峰 7（下标 3）+ 左腿 4 + 右腿 2</text>
  <text x="310" y="286" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">尾部的 2 把整个 suf_min 锁死成 2；山峰 10 虽然最高，左腿却被 4 拖到 16 而落选</text>
  <text x="310" y="305" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">—— 最小和往往藏在「矮胖山」里，所以每个 j 都得枚举，不能只看最高峰</text>
</svg>
