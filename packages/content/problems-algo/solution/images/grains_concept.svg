<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 448" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="448" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">单只母鸡覆盖区间 [L, R] 的最短时间（三种位置关系）</text>

  <!-- ===== Panel 1: x >= R, all to the left ===== -->
  <rect x="20" y="40" width="580" height="116" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="34" y="62" font-size="12" fill="#446688" font-weight="bold">① x ≥ R：谷子全在左侧</text>

  <line x1="60" y1="98" x2="560" y2="98" stroke="#bbb" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- grains -->
  <circle cx="130" cy="98" r="7" fill="#d6a040" stroke="#9a6a20" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="190" cy="98" r="6" fill="#d6a040" stroke="#9a6a20" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="260" cy="98" r="7" fill="#d6a040" stroke="#9a6a20" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="86" text-anchor="middle" font-size="11" fill="#9a6a20" font-weight="bold">L</text>
  <text x="260" y="86" text-anchor="middle" font-size="11" fill="#9a6a20" font-weight="bold">R</text>
  <!-- hen -->
  <circle cx="440" cy="98" r="12" fill="#446688" stroke="#2a3a55" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440" y="102" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">鸡</text>
  <text x="440" y="86" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">x</text>
  <!-- path: hen -> L -->
  <path d="M 430 88 L 140 88" stroke="#b85450" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="285" y="80" text-anchor="middle" font-size="10.5" fill="#b85450">向左走到 L，途中经过 R</text>
  <rect x="430" y="116" width="170" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="515" y="135" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">时间 = x − L</text>

  <!-- ===== Panel 2: x <= L, all to the right ===== -->
  <rect x="20" y="168" width="580" height="116" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="34" y="190" font-size="12" fill="#4a7a3a" font-weight="bold">② x ≤ L：谷子全在右侧</text>

  <line x1="60" y1="226" x2="560" y2="226" stroke="#bbb" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- hen -->
  <circle cx="130" cy="226" r="12" fill="#4a7a3a" stroke="#2c4a22" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="230" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">鸡</text>
  <text x="130" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">x</text>
  <!-- grains -->
  <circle cx="300" cy="226" r="7" fill="#d6a040" stroke="#9a6a20" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="420" cy="226" r="6" fill="#d6a040" stroke="#9a6a20" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="490" cy="226" r="7" fill="#d6a040" stroke="#9a6a20" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="300" y="214" text-anchor="middle" font-size="11" fill="#9a6a20" font-weight="bold">L</text>
  <text x="490" y="214" text-anchor="middle" font-size="11" fill="#9a6a20" font-weight="bold">R</text>
  <!-- path: hen -> R -->
  <path d="M 142 216 L 480 216" stroke="#b85450" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="208" text-anchor="middle" font-size="10.5" fill="#b85450">向右走到 R，途中经过 L</text>
  <rect x="410" y="244" width="170" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="495" y="263" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">时间 = R − x</text>

  <!-- ===== Panel 3: straddle ===== -->
  <rect x="20" y="296" width="580" height="140" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="34" y="318" font-size="12" fill="#b85450" font-weight="bold">③ L &lt; x &lt; R：谷子跨越两侧（需往返）</text>

  <line x1="60" y1="362" x2="560" y2="362" stroke="#bbb" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="120" cy="362" r="7" fill="#d6a040" stroke="#9a6a20" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="240" cy="362" r="6" fill="#d6a040" stroke="#9a6a20" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="410" cy="362" r="6" fill="#d6a040" stroke="#9a6a20" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="500" cy="362" r="7" fill="#d6a040" stroke="#9a6a20" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="120" y="350" text-anchor="middle" font-size="11" fill="#9a6a20" font-weight="bold">L</text>
  <text x="500" y="350" text-anchor="middle" font-size="11" fill="#9a6a20" font-weight="bold">R</text>
  <circle cx="320" cy="362" r="12" fill="#b85450" stroke="#7a3030" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="366" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">鸡</text>
  <text x="320" y="350" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">x</text>

  <!-- two path arcs above the line -->
  <path d="M 312 352 Q 216 322 124 352" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <path d="M 124 348 Q 312 300 496 348" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="316" font-size="10" fill="#446688">先去 L</text>
  <text x="380" y="298" font-size="10" fill="#4a7a3a">再去 R</text>

  <text x="34" y="396" font-size="11" fill="#444">先左后右 = (x−L) + (R−L)　　先右后左 = (R−x) + (R−L)</text>
  <rect x="300" y="406" width="286" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="443" y="424" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">时间 = (R−L) + min(x−L, R−x)</text>
</svg>
