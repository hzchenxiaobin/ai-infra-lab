<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">算法流程：排序 → 同序配对累计 → 一次除法</text>

  <!-- 开始 -->
  <ellipse cx="200" cy="50" rx="88" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="55" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">读入 prices, discounts</text>

  <path d="M 200 69 L 200 84" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 排序 -->
  <rect x="118" y="88" width="164" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="109" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">两数组各自降序排序</text>

  <path d="M 200 120 L 200 135" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="95" y="139" width="210" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="160" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">total = Σprices；k = min(n, m)</text>

  <path d="M 200 171 L 200 186" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环框 -->
  <rect x="48" y="190" width="304" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <path d="M 60 197 L 60 275" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 340 197 L 340 275" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5330" filter="url(#rough2)">循环 i = 0 … k−1</text>
  <text x="200" y="238" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">saved += prices[i] × discounts[i]</text>
  <text x="200" y="262" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">（saved、total 均走整数账本）</text>

  <path d="M 200 282 L 200 297" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <ellipse cx="200" cy="324" rx="118" ry="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="329" text-anchor="middle" font-size="13.5" fill="#7a5518" filter="url(#rough2)">返回 (100·total − saved) / 100</text>

  <!-- 精度说明框 -->
  <path d="M 352 236 L 368 236" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <rect x="372" y="188" width="136" height="118" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="210" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">为什么整数账本？</text>
  <text x="440" y="231" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">100·total ≤ 10¹²</text>
  <text x="440" y="249" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">Σp·d ≤ 10¹²</text>
  <text x="440" y="267" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">long long 全程精确</text>
  <text x="440" y="285" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">最后只除一次 100</text>
  <text x="440" y="300" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">逐项浮点累加可差 10⁻⁴</text>
</svg>
