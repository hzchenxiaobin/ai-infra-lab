<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="500" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：两遍扫描——先逐列求最大，再回填 −1</text>

  <!-- start -->
  <ellipse cx="230" cy="48" rx="40" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="53" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 230 63 L 230 72" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- pass 1 -->
  <rect x="100" y="74" width="260" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="230" y="94" text-anchor="middle" font-size="10.8" fill="#446688" filter="url(#rough2)">第一遍扫描每个格子 (i,j)：</text>
  <text x="230" y="112" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">colMax[j] = max(colMax[j], matrix[i][j])</text>
  <path d="M 230 124 L 230 134" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- pass 2 setup -->
  <rect x="100" y="136" width="260" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="230" y="155" text-anchor="middle" font-size="10.8" fill="#446688" filter="url(#rough2)">answer = matrix 的副本</text>
  <text x="230" y="173" text-anchor="middle" font-size="10.8" fill="#446688" filter="url(#rough2)">第二遍从 (0,0) 重新扫起</text>
  <path d="M 230 182 L 230 192" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1: loop condition -->
  <polygon points="230,194 296,222 230,250 164,222" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="230" y="226" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">还有格子未扫？</text>

  <!-- no -> return -->
  <path d="M 164 222 L 122 222" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="143" y="214" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">否</text>
  <ellipse cx="64" cy="222" rx="48" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="64" y="227" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">返回 answer</text>

  <!-- yes -->
  <path d="M 230 250 L 230 262" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="240" y="260" font-size="10.5" fill="#446688" filter="url(#rough2)">是</text>

  <!-- diamond 2: is -1? -->
  <polygon points="230,264 300,300 230,336 160,300" fill="#ffffff" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="230" y="296" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">answer[i][j]</text>
  <text x="230" y="312" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">== −1 ?</text>

  <!-- yes -> fill -->
  <path d="M 300 300 L 332 300" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="315" y="290" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="334" y="284" width="154" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="411" y="304" text-anchor="middle" font-size="10.3" fill="#b85450" filter="url(#rough2)">answer[i][j] = colMax[j]</text>

  <!-- no -> keep -->
  <path d="M 230 336 L 230 348" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="242" y="346" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否·保留原值</text>

  <!-- merge to advance -->
  <path d="M 411 316 L 411 366 L 318 366" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="150" y="350" width="162" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="231" y="370" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">推进到下一格 (i,j)</text>

  <!-- loop back -->
  <path d="M 230 382 L 230 400 L 496 400 L 496 222 L 302 222" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="430" y="392" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">下一格 ↺</text>

  <!-- bottom notes -->
  <rect x="40" y="428" width="440" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="450" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">两遍都是 O(mn)：第一遍求每列最大值，第二遍回填所有 −1</text>
  <text x="260" y="470" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">第一遍行优先遍历对缓存更友好；colMax 仅占 O(n) 额外空间</text>
</svg>
