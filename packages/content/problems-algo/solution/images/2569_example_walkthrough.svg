<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="470" fill="#fafafa"/>
  <text x="330" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums1=[1,0,1] nums2=[0,0,0] queries=[[1,1,1],[2,1,0],[3,0,0]]</text>

  <!-- Initial state -->
  <text x="36" y="66" font-size="12" fill="#446688" font-weight="bold">初始</text>
  <text x="36" y="84" font-size="11" fill="#555">nums1:</text>
  <rect x="96" y="70" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="118" y="89" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="146" y="70" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="89" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="196" y="70" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="218" y="89" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="256" y="89" font-size="11" fill="#d6a040" font-weight="bold">cnt1=2</text>
  <text x="360" y="84" font-size="11" fill="#555">sum2 = 0+0+0 = 0</text>

  <!-- Query 1 -->
  <rect x="36" y="108" width="588" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="132" font-size="12" fill="#446688" font-weight="bold">查询1 [1,1,1]：翻转 nums1[1..1]</text>
  <text x="56" y="150" font-size="11" fill="#555">nums1[1]: 0 → 1</text>
  <rect x="96" y="156" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="118" y="175" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="146" y="156" width="44" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="168" y="175" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="196" y="156" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="218" y="175" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="256" y="175" font-size="11" fill="#d6a040" font-weight="bold">cnt1=3</text>
  <text x="360" y="175" font-size="11" fill="#555">sum2 不变 = 0</text>

  <!-- Query 2 -->
  <rect x="36" y="214" width="588" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="238" font-size="12" fill="#d6a040" font-weight="bold">查询2 [2,1,0]：sum2 += cnt1 × p = 3 × 1</text>
  <text x="56" y="258" font-size="11" fill="#555">逐位本应：nums2[i] += nums1[i]×1 → [1,1,1]</text>
  <text x="56" y="276" font-size="11" fill="#555">但只维护标量：sum2 = 0 + 3×1 = 3</text>
  <rect x="380" y="248" width="220" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="490" y="270" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">sum2 = 3</text>

  <!-- Query 3 -->
  <rect x="36" y="320" width="588" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="56" y="344" font-size="12" fill="#b85450" font-weight="bold">查询3 [3,0,0]：返回 sum2</text>
  <text x="56" y="362" font-size="11" fill="#555">ans.append(3)</text>

  <!-- result -->
  <rect x="36" y="392" width="588" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="420" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">输出 ans = [3]</text>
</svg>
