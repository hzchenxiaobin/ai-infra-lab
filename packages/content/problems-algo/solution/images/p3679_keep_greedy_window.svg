<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：能留则留 · 丢弃物不占窗口名额</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">示例 2：arrivals = [1,2,3,3,3,4]，w = 3，m = 2</text>

  <!-- 窗口框：第 3~5 天 -->
  <rect x="170" y="56" width="216" height="64" fill="none" stroke="#d6a040" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="392" y="66" font-size="11" fill="#a07818" filter="url(#rough2)">⟵ 窗口 w=3</text>
  <text x="392" y="80" font-size="11" fill="#a07818" filter="url(#rough2)">（最近 3 天）</text>

  <!-- 6 天格子 -->
  <text x="42" y="72" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">第1天</text>
  <rect x="14" y="76" width="56" height="36" fill="#eeeeee" stroke="#aaaaaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="42" y="99" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">1</text>

  <text x="110" y="72" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">第2天</text>
  <rect x="82" y="76" width="56" height="36" fill="#eeeeee" stroke="#aaaaaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="99" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">2</text>

  <text x="178" y="72" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">第3天</text>
  <rect x="150" y="76" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="178" y="99" text-anchor="middle" font-size="14" fill="#2d5a24" filter="url(#rough2)">3 ✓</text>

  <text x="246" y="72" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">第4天</text>
  <rect x="218" y="76" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="246" y="99" text-anchor="middle" font-size="14" fill="#2d5a24" filter="url(#rough2)">3 ✓</text>

  <text x="314" y="72" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">第5天</text>
  <rect x="286" y="76" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" rx="4" filter="url(#rough2)"/>
  <text x="314" y="99" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">3 ✗</text>

  <text x="382" y="72" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">第6天</text>
  <rect x="354" y="76" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="382" y="99" text-anchor="middle" font-size="14" fill="#2b4a6e" filter="url(#rough2)">4 ✓</text>

  <!-- 第 5 天丢弃说明 -->
  <path d="M314,112 L300,128" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="297" y="142" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">第 5 天：窗口内保留的类型 3 已有 2 个（=m 满）→ 只能丢弃</text>

  <!-- cnt 计数框 -->
  <rect x="36" y="152" width="448" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="170" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#rough2)">窗口内「保留物」计数：cnt[3] = 2 / 2（满）·  cnt[1] = cnt[2] = 0（随出窗清零）</text>
  <text x="260" y="189" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#rough2)">第 5 天再保留一个 3 → cnt[3] = 3 &gt; m = 2 ⇒ 被迫丢弃，且它从此不进 cnt</text>

  <!-- 要点框 1：贪心 -->
  <rect x="26" y="212" width="232" height="130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="142" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a24" filter="url(#rough2)">① 贪心：能留则留</text>
  <text x="142" y="260" text-anchor="middle" font-size="11" fill="#3a5f30" filter="url(#rough2)">早保留的物品更早滑出窗口，</text>
  <text x="142" y="278" text-anchor="middle" font-size="11" fill="#3a5f30" filter="url(#rough2)">类型名额更早释放 ⇒ 留早不劣</text>
  <text x="142" y="296" text-anchor="middle" font-size="11" fill="#3a5f30" filter="url(#rough2)">（交换论证：被迫丢时丢后者）</text>
  <text x="142" y="322" text-anchor="middle" font-size="11" fill="#3a5f30" filter="url(#rough2)">绝不主动丢，被逼到墙角才丢</text>

  <!-- 要点框 2：幽灵 -->
  <rect x="272" y="212" width="228" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="386" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07818" filter="url(#rough2)">② 丢弃物是「幽灵」</text>
  <text x="386" y="260" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">不进 cnt、不占类型名额；</text>
  <text x="386" y="278" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">它滑出窗口时也别去减 cnt！</text>
  <text x="386" y="296" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">误减 = 给后面凭空多放名额</text>
  <text x="386" y="322" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">⚠️ 官方 hint 朴素版恰翻车于此</text>
</svg>
