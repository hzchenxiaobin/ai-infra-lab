<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：状态按“末字符”建 26 槽表，转移取邻域最大</text>

  <!-- letters row label -->
  <text x="40" y="62" font-size="12" fill="#888" font-weight="bold">字母</text>
  <text x="40" y="94" font-size="12" fill="#888" font-weight="bold">dp[c]</text>

  <!-- 26 letter cells + dp value cells; non-zero values highlighted -->
  <!-- indices 0..25 : a b c d e f g h i j k l m n o p q r s t u v w x y z -->
  <!-- state BEFORE processing 'd' : dp[a]=1 dp[b]=3 dp[c]=2 dp[d]=0 dp[e]=0 dp[f]=1 dp[g]=2 rest 0 -->
  <!-- Letter row -->
  <g filter="url(#rough2)">
    <!-- letters a..g -->
    <rect x="80"  y="50" width="18" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="89"  y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
    <rect x="98"  y="50" width="18" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <text x="107" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b</text>
    <rect x="116" y="50" width="18" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <text x="125" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">c</text>
    <!-- d : current char being updated -->
    <rect x="134" y="50" width="18" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3"/>
    <text x="143" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d</text>
    <rect x="152" y="50" width="18" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="161" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">e</text>
    <rect x="170" y="50" width="18" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <text x="179" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">f</text>
    <rect x="188" y="50" width="18" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <text x="197" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">g</text>
    <!-- h..z gray -->
    <rect x="206" y="50" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="215" y="66" text-anchor="middle" font-size="11" fill="#999">h</text>
    <rect x="224" y="50" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="233" y="66" text-anchor="middle" font-size="11" fill="#999">i</text>
    <rect x="242" y="50" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="251" y="66" text-anchor="middle" font-size="11" fill="#999">j</text>
    <rect x="260" y="50" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="269" y="66" text-anchor="middle" font-size="11" fill="#999">k</text>
    <rect x="278" y="50" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="287" y="66" text-anchor="middle" font-size="11" fill="#999">l</text>
    <rect x="296" y="50" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="305" y="66" text-anchor="middle" font-size="11" fill="#999">m</text>
    <rect x="314" y="50" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="323" y="66" text-anchor="middle" font-size="11" fill="#999">n</text>
    <rect x="332" y="50" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="341" y="66" text-anchor="middle" font-size="11" fill="#999">o</text>
    <rect x="350" y="50" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="359" y="66" text-anchor="middle" font-size="11" fill="#999">p</text>
    <rect x="368" y="50" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="377" y="66" text-anchor="middle" font-size="11" fill="#999">q</text>
    <rect x="386" y="50" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="395" y="66" text-anchor="middle" font-size="11" fill="#999">r</text>
    <rect x="404" y="50" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="413" y="66" text-anchor="middle" font-size="11" fill="#999">s</text>
    <rect x="422" y="50" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="431" y="66" text-anchor="middle" font-size="11" fill="#999">t</text>
    <rect x="440" y="50" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="449" y="66" text-anchor="middle" font-size="11" fill="#999">u</text>
    <rect x="458" y="50" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="467" y="66" text-anchor="middle" font-size="11" fill="#999">v</text>
    <rect x="476" y="50" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="485" y="66" text-anchor="middle" font-size="11" fill="#999">w</text>
    <rect x="494" y="50" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="503" y="66" text-anchor="middle" font-size="11" fill="#999">x</text>
    <rect x="512" y="50" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="521" y="66" text-anchor="middle" font-size="11" fill="#999">y</text>
    <rect x="530" y="50" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="539" y="66" text-anchor="middle" font-size="11" fill="#999">z</text>
  </g>

  <!-- dp value row -->
  <g filter="url(#rough2)">
    <rect x="80"  y="80" width="18" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="89"  y="96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
    <!-- b=3 : the argmax -->
    <rect x="98"  y="80" width="18" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3"/>
    <text x="107" y="96" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
    <rect x="116" y="80" width="18" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="125" y="96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
    <!-- d=0 (old, to be overwritten) -->
    <rect x="134" y="80" width="18" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="2,2" rx="3"/>
    <text x="143" y="96" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
    <rect x="152" y="80" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="161" y="96" text-anchor="middle" font-size="11" fill="#999">0</text>
    <rect x="170" y="80" width="18" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="179" y="96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
    <rect x="188" y="80" width="18" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="197" y="96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
    <!-- h..z all 0 -->
    <rect x="206" y="80" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="215" y="96" text-anchor="middle" font-size="11" fill="#bbb">0</text>
    <rect x="224" y="80" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="233" y="96" text-anchor="middle" font-size="11" fill="#bbb">0</text>
    <rect x="242" y="80" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="251" y="96" text-anchor="middle" font-size="11" fill="#bbb">0</text>
    <rect x="260" y="80" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="269" y="96" text-anchor="middle" font-size="11" fill="#bbb">0</text>
    <rect x="278" y="80" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="287" y="96" text-anchor="middle" font-size="11" fill="#bbb">0</text>
    <rect x="296" y="80" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="305" y="96" text-anchor="middle" font-size="11" fill="#bbb">0</text>
    <rect x="314" y="80" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="323" y="96" text-anchor="middle" font-size="11" fill="#bbb">0</text>
    <rect x="332" y="80" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="341" y="96" text-anchor="middle" font-size="11" fill="#bbb">0</text>
    <rect x="350" y="80" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="359" y="96" text-anchor="middle" font-size="11" fill="#bbb">0</text>
    <rect x="368" y="80" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="377" y="96" text-anchor="middle" font-size="11" fill="#bbb">0</text>
    <rect x="386" y="80" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="395" y="96" text-anchor="middle" font-size="11" fill="#bbb">0</text>
    <rect x="404" y="80" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="413" y="96" text-anchor="middle" font-size="11" fill="#bbb">0</text>
    <rect x="422" y="80" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="431" y="96" text-anchor="middle" font-size="11" fill="#bbb">0</text>
    <rect x="440" y="80" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="449" y="96" text-anchor="middle" font-size="11" fill="#bbb">0</text>
    <rect x="458" y="80" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="467" y="96" text-anchor="middle" font-size="11" fill="#bbb">0</text>
    <rect x="476" y="80" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="485" y="96" text-anchor="middle" font-size="11" fill="#bbb">0</text>
    <rect x="494" y="80" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="503" y="96" text-anchor="middle" font-size="11" fill="#bbb">0</text>
    <rect x="512" y="80" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="521" y="96" text-anchor="middle" font-size="11" fill="#bbb">0</text>
    <rect x="530" y="80" width="18" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="539" y="96" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  </g>

  <!-- Window bracket around [b..f] = indices 1..5, x 98..188 -->
  <path d="M 98 116 L 98 124 L 188 124 L 188 116" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="143" y="140" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">邻域 [ci−k, ci+k] = b…f（k=2，夹断后）</text>

  <!-- arrow from dp[b]=3 (argmax) down to formula : from x=107,y=102 to formula -->
  <path d="M 107 102 L 107 168 L 200 168" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="160" font-size="11" fill="#b85450" font-weight="bold">best = max = 3（来自 dp[b]）</text>

  <!-- arrow from current 'd' letter (x=143,y=72) to formula -->
  <path d="M 143 72 L 143 168 L 200 168" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>

  <!-- formula box -->
  <rect x="50" y="178" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="290" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">dp[ci] = 1 + max{ dp[c] : |c − ci| ≤ k }</text>
  <text x="290" y="220" text-anchor="middle" font-size="12" fill="#444">dp[d] = 1 + max(dp[b,c,d,e,f]) = 1 + 3 = <tspan fill="#b85450" font-weight="bold">4</tspan></text>

  <!-- new value arrow: formula result back up to dp[d] cell (will be 4) -->
  <path d="M 290 234 L 290 252 L 143 252 L 143 112" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="270" font-size="11" fill="#4a7a3a" font-weight="bold">写回 dp[d] := 4（旧值 0 被覆盖）</text>

  <!-- insight box -->
  <rect x="50" y="290" width="480" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="312" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">无后效性：能否再接字符只看“末字符”，与更早历史无关</text>
  <text x="290" y="332" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">“末字符相同”的子序列中，更长的一定不劣 ⇒ 只留最长，取 max 无损</text>
  <text x="290" y="350" text-anchor="middle" font-size="11" fill="#888">读旧值 → 取邻域最大 → +1 → 写回，s_i 只被计入一次</text>
</svg>
