<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：trips = [[2,1,5],[3,3,7]], capacity = 4</text>

  <!-- header: location labels 0..7 -->
  <text x="40" y="56" font-size="11" fill="#888">位置 →</text>
  <rect x="115" y="42" width="50" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="140" y="59" text-anchor="middle" font-size="11" fill="#888">0</text>
  <rect x="165" y="42" width="50" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="190" y="59" text-anchor="middle" font-size="11" fill="#888">1</text>
  <rect x="215" y="42" width="50" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="240" y="59" text-anchor="middle" font-size="11" fill="#888">2</text>
  <rect x="265" y="42" width="50" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="290" y="59" text-anchor="middle" font-size="11" fill="#888">3</text>
  <rect x="315" y="42" width="50" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="340" y="59" text-anchor="middle" font-size="11" fill="#888">4</text>
  <rect x="365" y="42" width="50" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="390" y="59" text-anchor="middle" font-size="11" fill="#888">5</text>
  <rect x="415" y="42" width="50" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="440" y="59" text-anchor="middle" font-size="11" fill="#888">6</text>
  <rect x="465" y="42" width="50" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="490" y="59" text-anchor="middle" font-size="11" fill="#888">7</text>

  <!-- row 0: initial diff -->
  <text x="40" y="92" font-size="11" fill="#888">初始 diff</text>
  <rect x="115" y="78" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="140" y="95" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="165" y="78" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="190" y="95" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="215" y="78" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="240" y="95" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="265" y="78" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="290" y="95" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="315" y="78" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="340" y="95" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="365" y="78" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="390" y="95" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="415" y="78" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="440" y="95" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="465" y="78" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="490" y="95" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- row 1: +trip [2,1,5] -->
  <text x="40" y="126" font-size="11" fill="#888">+[2,1,5]</text>
  <rect x="115" y="112" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="140" y="129" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="165" y="112" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="129" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="215" y="112" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="240" y="129" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="265" y="112" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="290" y="129" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="315" y="112" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="340" y="129" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="365" y="112" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="129" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−2</text>
  <rect x="415" y="112" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="440" y="129" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="465" y="112" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="490" y="129" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- row 2: +trip [3,3,7] (final diff) -->
  <text x="40" y="160" font-size="11" fill="#888" font-weight="bold">+[3,3,7]</text>
  <rect x="115" y="146" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="140" y="163" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="165" y="146" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="190" y="163" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="215" y="146" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="240" y="163" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="265" y="146" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="163" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <rect x="315" y="146" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="340" y="163" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="365" y="146" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="390" y="163" text-anchor="middle" font-size="11" fill="#333">−2</text>
  <rect x="415" y="146" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="440" y="163" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="465" y="146" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="490" y="163" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−3</text>

  <!-- separator -->
  <path d="M 110 184 L 525 184" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6,4" fill="none" filter="url(#rough2)"/>
  <text x="535" y="188" font-size="10" fill="#d6a040" font-weight="bold">前缀和</text>

  <!-- answer row: prefix sums cur with capacity check -->
  <text x="40" y="214" font-size="11" fill="#4a7a3a" font-weight="bold">车上人数</text>
  <rect x="115" y="200" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="219" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="165" y="200" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="219" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="215" y="200" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="219" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="265" y="200" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="290" y="219" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>
  <rect x="315" y="200" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="340" y="219" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>
  <rect x="365" y="200" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="219" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="415" y="200" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="219" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="465" y="200" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="490" y="219" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>

  <!-- capacity marker -->
  <text x="40" y="248" font-size="11" fill="#b85450" font-weight="bold">容量上限</text>
  <line x1="110" y1="244" x2="525" y2="244" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="535" y="248" font-size="11" fill="#b85450" font-weight="bold">= 4</text>

  <!-- exceed annotation -->
  <path d="M 290 232 L 290 250" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="268" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">位置 3：5 &gt; 4，超载！</text>

  <!-- verification box -->
  <rect x="60" y="288" width="440" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="12" fill="#444">前缀和：cur += diff[i]，逐位置检查 cur &gt; capacity 即超载</text>
  <text x="280" y="330" text-anchor="middle" font-size="12" fill="#333">0 → 2 → 2 → 5 ✗（位置 3 上车 3 人，累计 5 &gt; 4）</text>
  <text x="280" y="353" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">返回 false  ✓（capacity = 4 时不可拼车）</text>
</svg>
