<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 396" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="396" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：重记账后的后缀 DP —— 从右往左推，dp[0] 即答案</text>
  <text x="260" y="38" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">dp[i]：把后缀 nums[i..n−1] 切分完的最小总代价（重记账口径）</text>

  <!-- start -->
  <rect x="110" y="52" width="120" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="69" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">开始</text>
  <line x1="170" y1="78" x2="170" y2="88" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 1 -->
  <rect x="60" y="90" width="220" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="109" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">① 预处理前缀和 SN[0..n]、SC[0..n]</text>
  <line x1="170" y1="120" x2="170" y2="130" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="60" y="132" width="220" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="151" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">② dp[n] ← 0（空后缀代价为 0）</text>
  <line x1="170" y1="162" x2="170" y2="172" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3: loop -->
  <rect x="60" y="174" width="220" height="32" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="194" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">③ i 从 n−1 倒序循环到 0</text>
  <line x1="170" y1="206" x2="170" y2="216" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4: transition -->
  <rect x="30" y="218" width="280" height="58" rx="8" fill="#fafafa" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="234" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">④ 枚举本段右端点 r = i … n−1</text>
  <text x="170" y="248" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">cur = (SN[r+1] − SN[i] + k)·(SC[n] − SC[i]) + dp[r+1]</text>
  <text x="170" y="262" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">dp[i] ← 所有候选 cur 的最小值</text>
  <line x1="170" y1="276" x2="170" y2="286" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision -->
  <path d="M 170 288 L 238 316 L 170 344 L 102 316 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="320" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">i = 0 ？</text>

  <!-- yes -->
  <line x1="170" y1="344" x2="170" y2="356" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="354" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="95" y="358" width="150" height="28" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="376" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">⑤ 返回 dp[0]</text>

  <!-- no: loop back -->
  <path d="M 238 316 L 320 316 L 320 190 L 284 190" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="246" y="310" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="331" y="253" transform="rotate(-90 331 253)" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">i ← i−1，继续向左</text>

  <!-- side note 1 -->
  <rect x="344" y="90" width="164" height="96" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="426" y="108" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">为什么倒序？</text>
  <text x="356" y="124" font-size="9" fill="#8a6d1f" filter="url(#rough2)">dp[i] 只依赖更靠右的</text>
  <text x="356" y="137" font-size="9" fill="#8a6d1f" filter="url(#rough2)">dp[r+1]（r ≥ i）：</text>
  <text x="356" y="150" font-size="9" fill="#8a6d1f" filter="url(#rough2)">右边的后缀是更小的</text>
  <text x="356" y="163" font-size="9" fill="#8a6d1f" filter="url(#rough2)">子问题，轮到 dp[i] 时</text>
  <text x="356" y="176" font-size="9" fill="#8a6d1f" filter="url(#rough2)">依赖值全部就绪</text>

  <!-- side note 2 -->
  <rect x="344" y="218" width="164" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="426" y="236" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">转移共 n(n+1)/2 次</text>
  <text x="426" y="250" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">n ≤ 1000 ⇒ 约 50 万次</text>
  <text x="426" y="263" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">时间 O(n²) / 空间 O(n)</text>
</svg>
