<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b85450" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="260" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">两种表示，两个世界：系数 vs 点值</text>
  <text x="260" y="46" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">卷积定理：c = IFFT( FFT(a) ⊙ FFT(b) )</text>

  <!-- 红色旁路：系数域硬乘 -->
  <path d="M 260 66 C 45 55, 25 235, 96 272" stroke="#b85450" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="95" y="170" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">系数域硬乘：卷积</text>
  <text x="95" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">O(n·m) ≈ 10¹⁰ 超时 ✗</text>

  <!-- 行 1：系数表示 -->
  <rect x="62" y="70" width="185" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="92" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">A = [a0, a1, ⋯, an−1]</text>
  <rect x="273" y="70" width="185" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="92" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">B = [b0, b1, ⋯, bm−1]</text>

  <!-- FFT 箭头 -->
  <path d="M 154 106 L 154 128" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="167" y="122" font-size="11" fill="#4a7a3a" filter="url(#rough2)">FFT</text>
  <path d="M 365 106 L 365 128" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="378" y="122" font-size="11" fill="#4a7a3a" filter="url(#rough2)">FFT</text>

  <!-- 行 2：点值表示 -->
  <rect x="62" y="132" width="185" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="154" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">A(ω0) A(ω1) ⋯ A(ωsz−1)</text>
  <rect x="273" y="132" width="185" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="154" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">B(ω0) B(ω1) ⋯ B(ωsz−1)</text>

  <!-- 汇聚箭头 -->
  <path d="M 154 166 L 232 196" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 365 166 L 288 196" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 逐点相乘 -->
  <rect x="100" y="200" width="320" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="223" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">C(ωk) = A(ωk) × B(ωk)　逐点乘 O(n) ✓</text>

  <!-- IFFT 箭头 -->
  <path d="M 260 236 L 260 260" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="272" y="252" font-size="11" fill="#4a7a3a" filter="url(#rough2)">IFFT</text>

  <!-- 结果 -->
  <rect x="100" y="264" width="320" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="286" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">C = [c0, c1, ⋯, cn+m−2]</text>

  <!-- 底部要点 -->
  <rect x="55" y="306" width="410" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">乘积是 n+m−2 次 ⇒ 取 sz ≥ n+m−1 个单位根点即可唯一确定</text>
  <text x="260" y="344" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">总复杂度 O((n+m)·log(n+m))</text>
</svg>
