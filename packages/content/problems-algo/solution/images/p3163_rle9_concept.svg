<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：游程封顶 9 切段，每段输出「数字 + 字符」</text>

  <text x="36" y="54" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">word = "aaaaaaaaaaaaaabb"</text>

  <!-- 14 a boxes + 2 b boxes, pitch 28, width 26 -->
  <rect x="36" y="64" width="26" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="49" y="87" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="64" y="64" width="26" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="77" y="87" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="92" y="64" width="26" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="105" y="87" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="120" y="64" width="26" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="133" y="87" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="148" y="64" width="26" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="161" y="87" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="176" y="64" width="26" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="189" y="87" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="204" y="64" width="26" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="217" y="87" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="232" y="64" width="26" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="245" y="87" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="260" y="64" width="26" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="273" y="87" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="288" y="64" width="26" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="301" y="87" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="316" y="64" width="26" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="329" y="87" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="344" y="64" width="26" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="357" y="87" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="372" y="64" width="26" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="385" y="87" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="400" y="64" width="26" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="413" y="87" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="428" y="64" width="26" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="441" y="87" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="456" y="64" width="26" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="469" y="87" text-anchor="middle" font-size="15" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="484" y="64" width="26" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="497" y="87" text-anchor="middle" font-size="15" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">b</text>

  <!-- run group frames -->
  <rect x="32" y="112" width="258" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="161" y="134" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">游程①：9 个 a（吃满封顶）</text>

  <rect x="292" y="112" width="138" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="361" y="134" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">游程②：5 个 a</text>

  <rect x="432" y="112" width="54" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="459" y="134" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 2b</text>

  <!-- arrows to output chips -->
  <path d="M 161 148 L 161 182" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 361 148 L 361 182" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 458 148 L 458 182" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- output chips -->
  <rect x="121" y="186" width="80" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="161" y="215" text-anchor="middle" font-size="20" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9a</text>

  <rect x="321" y="186" width="80" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="361" y="215" text-anchor="middle" font-size="20" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5a</text>

  <rect x="418" y="186" width="80" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="458" y="215" text-anchor="middle" font-size="20" fill="#b85450" font-weight="bold" filter="url(#rough2)">2b</text>

  <!-- arrows into comp -->
  <path d="M 161 230 L 161 250" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 361 230 L 361 250" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 458 230 C 458 258, 430 270, 394 270" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="130" y="252" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="275" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">comp = "9a5a2b"</text>

  <rect x="40" y="306" width="440" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">计数到达 9 必须立即切段清零——长度是一位数字，10 装不下</text>

  <rect x="40" y="354" width="440" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="378" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">长度 L 的游程 → 恰好 ⌈L/9⌉ 段，每段固定输出 2 个字符</text>
</svg>
