<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 4 演算：两车 (1,1) 与 (8,8)</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">每车 15 种移动 → 15×15 = 225 组合，2 组冲突 → 答案 223</text>

  <!-- ===== 8x8 board ===== -->
  <g filter="url(#rough2)" font-size="9">
    <!-- board background -->
    <rect x="60" y="62" width="280" height="280" fill="#fff" stroke="#888" stroke-width="1.4"/>

    <!-- grid lines -->
    <g stroke="#ccc" stroke-width="1">
      <line x1="95" y1="62" x2="95" y2="342"/>
      <line x1="130" y1="62" x2="130" y2="342"/>
      <line x1="165" y1="62" x2="165" y2="342"/>
      <line x1="200" y1="62" x2="200" y2="342"/>
      <line x1="235" y1="62" x2="235" y2="342"/>
      <line x1="270" y1="62" x2="270" y2="342"/>
      <line x1="305" y1="62" x2="305" y2="342"/>
      <line x1="60" y1="97" x2="340" y2="97"/>
      <line x1="60" y1="132" x2="340" y2="132"/>
      <line x1="60" y1="167" x2="340" y2="167"/>
      <line x1="60" y1="202" x2="340" y2="202"/>
      <line x1="60" y1="237" x2="340" y2="237"/>
      <line x1="60" y1="272" x2="340" y2="272"/>
      <line x1="60" y1="307" x2="340" y2="307"/>
    </g>

    <!-- row/col labels -->
    <text x="52" y="84" text-anchor="end" font-size="8" fill="#aaa">1</text>
    <text x="52" y="329" text-anchor="end" font-size="8" fill="#aaa">8</text>
    <text x="77" y="356" text-anchor="middle" font-size="8" fill="#aaa">1</text>
    <text x="322" y="356" text-anchor="middle" font-size="8" fill="#aaa">8</text>

    <!-- Rook A at (1,1) = top-left cell center (77,80) -->
    <rect x="68" y="70" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="79" y="86" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">A</text>
    <text x="79" y="64" text-anchor="middle" font-size="8" fill="#446688">(1,1)</text>

    <!-- Rook B at (8,8) = bottom-right cell center (322,329) -->
    <rect x="313" y="319" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="324" y="335" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">B</text>
    <text x="324" y="353" text-anchor="middle" font-size="8" fill="#446688">(8,8)</text>

    <!-- A's reachable cells: down column 1 and right row 1 -->
    <!-- down: (2,1)..(8,1) -->
    <circle cx="77" cy="115" r="4" fill="#446688" opacity="0.4"/>
    <circle cx="77" cy="150" r="4" fill="#446688" opacity="0.4"/>
    <circle cx="77" cy="185" r="4" fill="#446688" opacity="0.4"/>
    <circle cx="77" cy="220" r="4" fill="#446688" opacity="0.4"/>
    <circle cx="77" cy="255" r="4" fill="#446688" opacity="0.4"/>
    <circle cx="77" cy="290" r="4" fill="#446688" opacity="0.4"/>
    <!-- (8,1) highlighted as conflict target -->
    <rect x="66" y="318" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="77" y="334" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">8,1</text>

    <!-- right: (1,2)..(1,8) -->
    <circle cx="112" cy="80" r="4" fill="#446688" opacity="0.4"/>
    <circle cx="147" cy="80" r="4" fill="#446688" opacity="0.4"/>
    <circle cx="182" cy="80" r="4" fill="#446688" opacity="0.4"/>
    <circle cx="217" cy="80" r="4" fill="#446688" opacity="0.4"/>
    <circle cx="252" cy="80" r="4" fill="#446688" opacity="0.4"/>
    <circle cx="287" cy="80" r="4" fill="#446688" opacity="0.4"/>
    <!-- (1,8) highlighted as conflict target -->
    <rect x="302" y="70" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="313" y="86" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">1,8</text>

    <!-- B's reachable cells: up column 8 and left row 8 -->
    <!-- up: (7,8)..(1,8) -->
    <circle cx="322" cy="294" r="4" fill="#446688" opacity="0.4"/>
    <circle cx="322" cy="259" r="4" fill="#446688" opacity="0.4"/>
    <circle cx="322" cy="224" r="4" fill="#446688" opacity="0.4"/>
    <circle cx="322" cy="189" r="4" fill="#446688" opacity="0.4"/>
    <circle cx="322" cy="154" r="4" fill="#446688" opacity="0.4"/>
    <circle cx="322" cy="119" r="4" fill="#446688" opacity="0.4"/>

    <!-- left: (8,7)..(8,1) -->
    <circle cx="287" cy="329" r="4" fill="#446688" opacity="0.4"/>
    <circle cx="252" cy="329" r="4" fill="#446688" opacity="0.4"/>
    <circle cx="217" cy="329" r="4" fill="#446688" opacity="0.4"/>
    <circle cx="182" cy="329" r="4" fill="#446688" opacity="0.4"/>
    <circle cx="147" cy="329" r="4" fill="#446688" opacity="0.4"/>
    <circle cx="112" cy="329" r="4" fill="#446688" opacity="0.4"/>

    <!-- conflict arrows: A->(8,1) and B->(8,1) -->
    <path d="M 79 92 L 77 316" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" opacity="0.6"/>
    <path d="M 313 329 L 90 329" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" opacity="0.6"/>

    <!-- conflict arrows: A->(1,8) and B->(1,8) -->
    <path d="M 90 80 L 300 80" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" opacity="0.6"/>
    <path d="M 322 317 L 322 92" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" opacity="0.6"/>
  </g>

  <!-- ===== Right side: calculation ===== -->
  <g filter="url(#rough2)" font-size="10">
    <!-- Move count for each rook -->
    <rect x="370" y="62" width="180" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8"/>
    <text x="460" y="80" text-anchor="middle" fill="#446688" font-weight="bold">每枚车的移动数</text>
    <text x="380" y="98" font-size="9" fill="#555">原地不动：1</text>
    <text x="380" y="112" font-size="9" fill="#555">向下 7 步：7</text>
    <text x="380" y="126" font-size="9" fill="#555">向右 7 步：7</text>
    <text x="510" y="126" font-size="9" fill="#446688" font-weight="bold">= 15</text>

    <!-- Total -->
    <rect x="370" y="140" width="180" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8"/>
    <text x="460" y="158" text-anchor="middle" fill="#d6a040" font-weight="bold">总组合数</text>
    <text x="460" y="174" text-anchor="middle" fill="#555" font-size="11">15 × 15 = 225</text>

    <!-- Invalid cases -->
    <rect x="370" y="192" width="180" height="100" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8"/>
    <text x="460" y="210" text-anchor="middle" fill="#b85450" font-weight="bold">2 组无效</text>
    <text x="380" y="228" font-size="9" fill="#555">① A→(8,1), B→(8,1)</text>
    <text x="380" y="240" font-size="9" fill="#888">  t=7 两车同格 (8,1)</text>
    <text x="380" y="256" font-size="9" fill="#555">② A→(1,8), B→(1,8)</text>
    <text x="380" y="268" font-size="9" fill="#888">  t=7 两车同格 (1,8)</text>
    <text x="380" y="284" font-size="8" fill="#888">路径无交叉，仅终点撞</text>

    <!-- Answer -->
    <rect x="370" y="302" width="180" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="460" y="320" text-anchor="middle" fill="#4a7a3a" font-weight="bold">答案</text>
    <text x="460" y="342" text-anchor="middle" fill="#4a7a3a" font-size="14" font-weight="bold">225 − 2 = 223</text>

    <!-- Note about swap -->
    <rect x="370" y="360" width="180" height="56" fill="#f5f5f5" stroke="#888" stroke-width="1" rx="6"/>
    <text x="380" y="378" font-size="9" fill="#555" font-weight="bold">注意</text>
    <text x="380" y="392" font-size="8" fill="#888">A→(1,8), B→(8,1) 有效</text>
    <text x="380" y="404" font-size="8" fill="#888">A→(8,1), B→(1,8) 有效</text>
    <text x="380" y="414" font-size="8" fill="#888">（路径不同，视为不同组合）</text>
  </g>

  <!-- ===== Bottom legend ===== -->
  <g filter="url(#rough2)" font-size="9" fill="#666">
    <circle cx="80" cy="362" r="4" fill="#446688" opacity="0.4"/>
    <text x="92" y="366">可达终点</text>
    <rect x="160" y="356" width="12" height="12" fill="#fce4ec" stroke="#b85450" rx="2"/>
    <text x="178" y="366">冲突终点</text>
    <text x="250" y="366" fill="#b85450">红色虚线 = 冲突路径</text>
  </g>
</svg>
