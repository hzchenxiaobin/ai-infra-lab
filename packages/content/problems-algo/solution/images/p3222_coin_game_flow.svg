<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一次整除 + 一次 min + 一次奇偶判定</text>

  <rect x="155" y="42" width="210" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入：x 枚 75 币、y 枚 10 币</text>

  <path d="M 260 74 L 260 92" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="155" y="96" width="210" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">每步固定消耗 1 枚 75 币 + 4 枚 10 币</text>

  <path d="M 260 128 L 260 146" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="155" y="150" width="210" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">总步数 k = min(x, ⌊y / 4⌋)</text>

  <path d="M 260 182 L 260 202" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,208 342,240 260,272 178,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="245" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">k 是奇数？</text>

  <path d="M 178 240 L 152 240" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="165" y="231" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="14" y="216" width="138" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="83" y="236" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Alice 赢</text>
  <text x="83" y="254" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">第 k+1 步轮到 Bob</text>

  <path d="M 342 240 L 368 240" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="355" y="231" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="370" y="216" width="138" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="439" y="236" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">Bob 赢</text>
  <text x="439" y="254" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">第 k+1 步轮到 Alice</text>

  <rect x="70" y="300" width="380" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="321" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">k = 0：开局 10 币不足 4 枚，Alice 即刻判负；</text>
  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">0 为偶数 → Bob，边界无需特判</text>

  <rect x="70" y="372" width="380" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="393" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">整个算法 O(1)：无循环、无递归、无状态</text>
</svg>
