<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：逐字符扫描，栈顶 + 当前成对即弹出</text>

  <!-- 1. init -->
  <rect x="180" y="40" width="160" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#333">① 栈 stk = []</text>

  <path d="M 260 76 L 260 94" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. for each char -->
  <rect x="150" y="94" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="116" text-anchor="middle" font-size="12" fill="#333">② for c in s：逐字符处理</text>

  <path d="M 260 130 L 260 150" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. decision: stack empty? -->
  <polygon points="260,150 370,190 260,230 150,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="186" text-anchor="middle" font-size="11.5" fill="#333">栈空 或</text>
  <text x="260" y="202" text-anchor="middle" font-size="11.5" fill="#333">stk[-1]+c ∉ {AB,CD} ?</text>

  <!-- yes -> push (left) -->
  <path d="M 150 190 L 80 190 L 80 150" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="86" y="150" font-size="10.5" fill="#4a7a3a" font-weight="bold">是 ↓</text>
  <rect x="40" y="116" width="86" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="83" y="134" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">stk.push(c)</text>
  <text x="83" y="148" text-anchor="middle" font-size="10" fill="#555">压入栈</text>
  <!-- loop back to for -->
  <path d="M 83 116 L 83 100 L 150 100" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no -> pop (right) -->
  <path d="M 370 190 L 440 190 L 440 150" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="150" font-size="10.5" fill="#b85450" font-weight="bold">否 ↓</text>
  <rect x="394" y="116" width="86" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="437" y="134" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">stk.pop()</text>
  <text x="437" y="148" text-anchor="middle" font-size="10" fill="#555">弹出栈顶</text>
  <!-- loop back to for -->
  <path d="M 437 116 L 437 100 L 370 100" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. end for -->
  <path d="M 260 230 L 260 252" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="160" y="252" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="273" text-anchor="middle" font-size="12" fill="#333">③ 字符扫描结束</text>

  <path d="M 260 286 L 260 306" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. return -->
  <rect x="150" y="306" width="220" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">return len(stk)</text>
  <text x="260" y="343" text-anchor="middle" font-size="10" fill="#888">栈中残留字符数即最小长度</text>

  <!-- footer note -->
  <rect x="40" y="364" width="440" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="384" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">不变式：扫描任意时刻，栈中不存在相邻的 AB / CD</text>
  <text x="260" y="400" text-anchor="middle" font-size="10.5" fill="#555">每压入一个新字符 c，它只可能与栈顶成对；成对则双双消除</text>
  <text x="260" y="416" text-anchor="middle" font-size="10.5" fill="#555">栈终态无 AB/CD 子串 ⇔ 已是最小（终态唯一）</text>
  <text x="260" y="432" text-anchor="middle" font-size="10" fill="#aaa">每字符最多入栈/出栈一次 ⇒ O(n)</text>
</svg>
