<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n=4, 边排序后逐条处理</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">connections=[[1,2,1],[2,3,2],[1,3,3],[3,4,4],[2,4,5]]</text>

  <!-- table header -->
  <rect x="30" y="58" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="75" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">边 (u,v,c)</text>
  <rect x="120" y="58" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="175" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">find(u) vs find(v)</text>
  <rect x="230" y="58" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">动作</text>
  <rect x="330" y="58" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">count</text>
  <rect x="390" y="58" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="420" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">ans</text>
  <rect x="450" y="58" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="500" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">连通分量</text>

  <!-- row 1: 1-2(1) union -->
  <rect x="30" y="86" width="90" height="30" fill="#e6f4ea" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="106" text-anchor="middle" font-size="11" fill="#333">1-2, c=1</text>
  <rect x="120" y="86" width="110" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="175" y="106" text-anchor="middle" font-size="11" fill="#333">1 ≠ 2</text>
  <rect x="230" y="86" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">union ✓</text>
  <rect x="330" y="86" width="60" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="360" y="106" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="390" y="86" width="60" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="420" y="106" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="450" y="86" width="100" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="500" y="106" text-anchor="middle" font-size="10.5" fill="#555">{1,2},{3},{4}</text>

  <!-- row 2: 2-3(2) union -->
  <rect x="30" y="116" width="90" height="30" fill="#e6f4ea" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="136" text-anchor="middle" font-size="11" fill="#333">2-3, c=2</text>
  <rect x="120" y="116" width="110" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="175" y="136" text-anchor="middle" font-size="11" fill="#333">{1,2} ≠ 3</text>
  <rect x="230" y="116" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">union ✓</text>
  <rect x="330" y="116" width="60" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="360" y="136" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="390" y="116" width="60" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="420" y="136" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="450" y="116" width="100" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="500" y="136" text-anchor="middle" font-size="10.5" fill="#555">{1,2,3},{4}</text>

  <!-- row 3: 1-3(3) skip -->
  <rect x="30" y="146" width="90" height="30" fill="#fce4ec" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="166" text-anchor="middle" font-size="11" fill="#333">1-3, c=3</text>
  <rect x="120" y="146" width="110" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="175" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">{1,2,3}==同根</text>
  <rect x="230" y="146" width="100" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">跳过 ✗ 成环</text>
  <rect x="330" y="146" width="60" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="360" y="166" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="390" y="146" width="60" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="420" y="166" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="450" y="146" width="100" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="500" y="166" text-anchor="middle" font-size="10.5" fill="#555">{1,2,3},{4}</text>

  <!-- row 4: 3-4(4) union, done -->
  <rect x="30" y="176" width="90" height="30" fill="#e6f4ea" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="196" text-anchor="middle" font-size="11" fill="#333">3-4, c=4</text>
  <rect x="120" y="176" width="110" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="175" y="196" text-anchor="middle" font-size="11" fill="#333">{1,2,3} ≠ 4</text>
  <rect x="230" y="176" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">union ✓ 完成</text>
  <rect x="330" y="176" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="196" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">3=n−1</text>
  <rect x="390" y="176" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="420" y="196" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">7</text>
  <rect x="450" y="176" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="500" y="196" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">{1,2,3,4}</text>

  <!-- row 5: 2-4(5) not processed -->
  <rect x="30" y="206" width="90" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="75" y="226" text-anchor="middle" font-size="11" fill="#aaa">2-4, c=5</text>
  <rect x="120" y="206" width="110" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="175" y="226" text-anchor="middle" font-size="10.5" fill="#aaa">（已提前返回）</text>
  <rect x="230" y="206" width="100" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <rect x="330" y="206" width="60" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="360" y="226" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <rect x="390" y="206" width="60" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="420" y="226" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <rect x="450" y="206" width="100" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="500" y="226" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <!-- conclusion box -->
  <rect x="60" y="262" width="440" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="80" y="284" font-size="12" fill="#4a7a3a" font-weight="bold">演算结论</text>
  <text x="80" y="304" font-size="11" fill="#555">第 3 步：边 1-3 两端已在同一连通分量 → 加入会成环，跳过（关键剪枝）</text>
  <text x="80" y="322" font-size="11" fill="#555">第 4 步：边 3-4 合并最后两个分量，count 达到 n−1=3 → 提前返回 ans=7</text>
  <text x="80" y="340" font-size="11" fill="#b85450" font-weight="bold">若遍历完所有边 count 仍 &lt; n−1，说明图不连通，返回 −1</text>
</svg>
