<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心：dp[i][j] = 三选一取最大</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">i×j 木块要么整块卖，要么切一刀分成两个子问题</text>

  <text x="40" y="86" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① 整块卖</text>
  <rect x="40" y="94" width="120" height="80" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="120" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i × j</text>
  <text x="100" y="140" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">查 price[i][j]</text>
  <text x="100" y="158" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">（无则 0）</text>

  <text x="200" y="86" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">② 横切（分裂高度 i）</text>
  <rect x="200" y="94" width="150" height="80" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="206" y="100" width="138" height="32" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="275" y="120" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">k × j</text>
  <path d="M 206 138 L 344 138" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <rect x="206" y="142" width="138" height="28" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="275" y="160" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">(i−k) × j</text>
  <text x="275" y="188" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">dp[k][j] + dp[i−k][j]</text>

  <text x="390" y="86" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ 竖切（分裂宽度 j）</text>
  <rect x="390" y="94" width="140" height="80" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="398" y="100" width="58" height="68" rx="3" fill="#fafafa" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="427" y="138" text-anchor="middle" font-size="10.5" fill="#7a5a20" filter="url(#rough2)">i × k</text>
  <path d="M 460 100 L 460 168" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <rect x="466" y="100" width="58" height="68" rx="3" fill="#fafafa" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="495" y="138" text-anchor="middle" font-size="10.5" fill="#7a5a20" filter="url(#rough2)">i × (j−k)</text>
  <text x="460" y="188" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">dp[i][k] + dp[i][j−k]</text>

  <path d="M 100 180 Q 100 200 100 216" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 275 198 Q 275 210 275 216" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 460 198 Q 460 210 460 216" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="222" width="320" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">dp[i][j] = max( 整块卖, max 横切, max 竖切 )</text>
  <text x="280" y="268" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">枚举切点 k，三个候选取最大值</text>

  <rect x="40" y="300" width="480" height="124" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">为什么无后效性？</text>

  <text x="56" y="350" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">• 切完两块各自独立定价 → 子问题不相干</text>
  <text x="56" y="370" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">• 「横切 k」与「竖切 k」互斥，可分别取 max 合并</text>
  <text x="56" y="390" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">• 切点 k∈[1,i) 或 [1,j)，子块尺寸严格更小 → 天然拓扑序</text>
  <text x="56" y="410" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">• 不可旋转：price[h][w] 只认原始朝向，dp 维度方向固定</text>
</svg>
