<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：方法一（还原+哈希）vs 方法二（路径法）</text>

  <!-- ===== Left column: Method 1 ===== -->
  <text x="140" y="52" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">方法一：DFS 还原 + HashSet</text>

  <!-- constructor -->
  <rect x="56" y="62" width="168" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">构造函数</text>
  <text x="140" y="95" text-anchor="middle" font-size="10" fill="#555">DFS 遍历，还原值入 set</text>

  <line x1="140" y1="102" x2="140" y2="118" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- DFS box -->
  <rect x="56" y="122" width="168" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="140" y="142" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">dfs(node, x)</text>
  <text x="140" y="158" text-anchor="middle" font-size="9.5" fill="#555">node.val = x</text>
  <text x="140" y="172" text-anchor="middle" font-size="9.5" fill="#555">set.add(x); dfs(left,2x+1); dfs(right,2x+2)</text>

  <line x1="140" y1="178" x2="140" y2="194" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- set box -->
  <rect x="56" y="198" width="168" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="140" y="218" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">vals = {0,1,2,3,...}</text>

  <line x1="140" y1="230" x2="140" y2="246" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- find -->
  <rect x="56" y="250" width="168" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="140" y="268" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">find(target)</text>
  <text x="140" y="283" text-anchor="middle" font-size="10" fill="#555">return vals.count(target)</text>

  <!-- complexity -->
  <rect x="56" y="312" width="168" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="140" y="330" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">预处理 O(n)，find O(1)</text>
  <text x="140" y="348" text-anchor="middle" font-size="10" fill="#888">空间 O(n) 存哈希集合</text>

  <!-- ===== Right column: Method 2 ===== -->
  <text x="420" y="52" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">方法二：路径法（无需还原）</text>

  <!-- constructor -->
  <rect x="336" y="62" width="168" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="80" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">构造函数</text>
  <text x="420" y="95" text-anchor="middle" font-size="10" fill="#555">仅保存 root 指针</text>

  <line x1="420" y1="102" x2="420" y2="118" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- find: step 1 -->
  <rect x="336" y="122" width="168" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="420" y="140" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">① target+1 转二进制</text>
  <text x="420" y="155" text-anchor="middle" font-size="9.5" fill="#555">去掉最高位的 1 → 路径串</text>

  <line x1="420" y1="162" x2="420" y2="178" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- find: step 2 -->
  <rect x="336" y="182" width="168" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="420" y="202" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">② 沿路径走</text>
  <text x="420" y="218" text-anchor="middle" font-size="9.5" fill="#555">bit=0 → node = node.left</text>
  <text x="420" y="232" text-anchor="middle" font-size="9.5" fill="#555">bit=1 → node = node.right</text>

  <line x1="420" y1="238" x2="420" y2="254" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision -->
  <polygon points="420,258 500,288 420,318 340,288" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="286" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">node == null ?</text>
  <text x="420" y="300" text-anchor="middle" font-size="9" fill="#888">途中断路？</text>

  <!-- yes: false -->
  <text x="332" y="285" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <path d="M 340 288 Q 300 288 300 330" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="252" y="334" width="96" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="352" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return false</text>

  <!-- no: true -->
  <text x="508" y="285" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <path d="M 500 288 Q 540 288 540 330" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="492" y="334" width="96" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="540" y="352" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- complexity -->
  <rect x="336" y="380" width="168" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="420" y="398" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">预处理 O(1)，find O(log target)</text>
  <text x="420" y="416" text-anchor="middle" font-size="10" fill="#888">空间 O(1)，仅存 root</text>

  <!-- divider -->
  <line x1="280" y1="48" x2="280" y2="395" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="56" y="380" width="168" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="140" y="398" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">find O(1) 但需 O(n) 预处理</text>
  <text x="140" y="416" text-anchor="middle" font-size="10" fill="#888">适合 find 调用频繁场景</text>
</svg>
