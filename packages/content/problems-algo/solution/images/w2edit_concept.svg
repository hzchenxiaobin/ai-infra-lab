<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：所有单词等长 → 编辑=替换字符 → 编辑距离即汉明距离</text>

  <!-- ====== transformation chain ====== -->
  <rect x="30" y="46" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="105" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">编辑距离（增/删/替换）</text>

  <line x1="182" y1="63" x2="214" y2="63" stroke="#666" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="198" y="56" text-anchor="middle" font-size="9" fill="#888">等长约束</text>

  <rect x="216" y="46" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="291" y="68" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">增/删改变长度 → 排除</text>

  <line x1="368" y1="63" x2="400" y2="63" stroke="#666" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="402" y="46" width="148" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="476" y="68" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">汉明距离（仅替换）</text>

  <!-- ====== Example A: word vs wood (pass) ====== -->
  <text x="30" y="104" font-size="12" fill="#4a7a3a" font-weight="bold">A. word vs wood：逐位比较，仅 1 处不同 → ≤2 ✓</text>

  <!-- query row: w o r d -->
  <text x="34" y="138" font-size="11" fill="#888">query</text>
  <rect x="86" y="116" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="108" y="144" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">w</text>
  <rect x="134" y="116" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="156" y="144" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">o</text>
  <rect x="182" y="116" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="204" y="144" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">r</text>
  <rect x="230" y="116" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="252" y="144" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">d</text>

  <!-- dict row: w o o d -->
  <text x="34" y="186" font-size="11" fill="#888">dict</text>
  <rect x="86" y="164" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="108" y="192" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">w</text>
  <rect x="134" y="164" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="156" y="192" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">o</text>
  <rect x="182" y="164" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="204" y="192" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">o</text>
  <rect x="230" y="164" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="252" y="192" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">d</text>

  <!-- match/mismatch ticks -->
  <text x="108" y="222" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="156" y="222" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="204" y="222" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>
  <text x="252" y="222" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- distance badge A -->
  <rect x="300" y="166" width="150" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="375" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">不同字符数</text>
  <text x="375" y="200" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">= 1 ≤ 2 → 收录 ✓</text>

  <!-- ====== Example B: ants vs wood (fail) ====== -->
  <text x="30" y="254" font-size="12" fill="#b85450" font-weight="bold">B. ants vs wood：逐位比较，4 处全不同 → &gt;2 ✗</text>

  <text x="34" y="288" font-size="11" fill="#888">query</text>
  <rect x="86" y="266" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="108" y="294" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">a</text>
  <rect x="134" y="266" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="156" y="294" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">n</text>
  <rect x="182" y="266" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="204" y="294" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">t</text>
  <rect x="230" y="266" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="252" y="294" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">s</text>

  <text x="34" y="336" font-size="11" fill="#888">dict</text>
  <rect x="86" y="314" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="108" y="342" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">w</text>
  <rect x="134" y="314" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="156" y="342" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">o</text>
  <rect x="182" y="314" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="204" y="342" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">o</text>
  <rect x="230" y="314" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="252" y="342" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">d</text>

  <text x="108" y="372" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>
  <text x="156" y="372" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>
  <text x="204" y="372" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>
  <text x="252" y="372" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>

  <!-- distance badge B -->
  <rect x="300" y="316" width="150" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="375" y="334" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">不同字符数</text>
  <text x="375" y="350" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">= 4 &gt; 2 → 排除 ✗</text>

  <!-- side insight -->
  <rect x="466" y="116" width="104" height="238" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="518" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">汉明距离</text>
  <text x="518" y="160" text-anchor="middle" font-size="10" fill="#555">逐位比较</text>
  <text x="518" y="176" text-anchor="middle" font-size="10" fill="#555">统计不同</text>
  <text x="518" y="192" text-anchor="middle" font-size="10" fill="#555">字符个数</text>
  <line x1="480" y1="206" x2="556" y2="206" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <text x="518" y="226" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">剪枝</text>
  <text x="518" y="242" text-anchor="middle" font-size="9.5" fill="#555">计数 &gt; 2</text>
  <text x="518" y="256" text-anchor="middle" font-size="9.5" fill="#555">立即 break</text>
  <text x="518" y="276" text-anchor="middle" font-size="9.5" fill="#555">无需比完</text>
  <line x1="480" y1="290" x2="556" y2="290" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <text x="518" y="310" text-anchor="middle" font-size="9.5" fill="#888">题意「编辑」</text>
  <text x="518" y="324" text-anchor="middle" font-size="9.5" fill="#888">= 改一个字母</text>
  <text x="518" y="340" text-anchor="middle" font-size="9.5" fill="#888">= 一次替换</text>
</svg>
