<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="860" height="520" fill="#fdfcf7"/>
  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">贪吃蛇穿迷宫：状态编码 (r, c, 朝向) 与四种移动</text>
  <path d="M 210 40 Q 430 48 650 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== LEFT: 状态编码 ===== -->
  <g filter="url(#sk)">
    <rect x="24" y="60" width="396" height="440" rx="10" fill="#eef3fb" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="222" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#34506e">① 状态 = (行 r, 列 c, 朝向)</text>

  <!-- Horizontal snake -->
  <text x="48" y="118" font-size="12.5" font-weight="bold" fill="#34506e">朝向 0 · 水平</text>
  <g filter="url(#sk2)">
    <rect x="120" y="132" width="34" height="34" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="154" y="132" width="34" height="34" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <g filter="url(#sk2)">
    <path d="M 110 132 L 120 132 M 110 132 L 110 142 M 110 132 L 118 140" stroke="#b85450" stroke-width="1.6" fill="none"/>
  </g>
  <text x="137" y="184" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">锚点</text>
  <text x="137" y="198" text-anchor="middle" font-size="11" fill="#34506e">(r, c)</text>
  <text x="171" y="198" text-anchor="middle" font-size="11" fill="#34506e">(r, c+1)</text>
  <text x="248" y="150" font-size="11" fill="#444">占 (r,c) 与 (r,c+1)</text>
  <text x="248" y="166" font-size="11" fill="#444">锚点 = 左格</text>

  <!-- Vertical snake -->
  <text x="48" y="234" font-size="12.5" font-weight="bold" fill="#34506e">朝向 1 · 竖直</text>
  <g filter="url(#sk2)">
    <rect x="120" y="248" width="34" height="34" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="120" y="282" width="34" height="34" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <g filter="url(#sk2)">
    <path d="M 120 238 L 120 248 M 120 238 L 130 238 M 120 238 L 128 246" stroke="#b85450" stroke-width="1.6" fill="none"/>
  </g>
  <text x="92" y="268" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">锚点</text>
  <text x="92" y="282" text-anchor="end" font-size="11" fill="#34506e">(r, c)</text>
  <text x="92" y="304" text-anchor="end" font-size="11" fill="#34506e">(r+1, c)</text>
  <text x="196" y="268" font-size="11" fill="#444">占 (r,c) 与 (r+1,c)</text>
  <text x="196" y="284" font-size="11" fill="#444">锚点 = 上格</text>

  <!-- State tuple box -->
  <g filter="url(#sk2)">
    <rect x="44" y="346" width="356" height="138" rx="6" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="222" y="370" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">状态空间规模</text>
  <text x="60" y="392" font-size="11.5" fill="#444">· 起点 (0, 0, 0)：左上角水平放置</text>
  <text x="60" y="412" font-size="11.5" fill="#444">· 终点 (n−1, n−2, 0)：右下角水平放置</text>
  <text x="60" y="432" font-size="11.5" fill="#444">· 朝向 2 种 × 位置 n² 个 = 2n² 个状态</text>
  <text x="60" y="458" font-size="11.5" font-weight="bold" fill="#b85450">→ BFS 状态空间仅 O(n²)，</text>
  <text x="60" y="474" font-size="11.5" font-weight="bold" fill="#b85450">　 n≤100 时至多 2×10⁴ 个，极宽松</text>

  <!-- ===== RIGHT: 四种移动 ===== -->
  <g filter="url(#sk)">
    <rect x="444" y="60" width="392" height="440" rx="10" fill="#eef6ef" stroke="#4a7e4a" stroke-width="1.6"/>
  </g>
  <text x="640" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">② 四种移动（■ 蛇身 · □ 须为空）</text>

  <!-- legend -->
  <g filter="url(#sk2)">
    <rect x="688" y="98" width="16" height="16" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="712" y="98" width="16" height="16" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2"/>
  </g>
  <text x="706" y="110" text-anchor="middle" font-size="9.5" fill="#444">身</text>
  <text x="730" y="110" text-anchor="middle" font-size="9.5" fill="#b85450">须空</text>

  <!-- ===== Move 1: 右移 (top-left) ===== -->
  <g filter="url(#sk2)">
    <rect x="456" y="124" width="180" height="148" rx="6" fill="#ffffff" stroke="#9ec9a0" stroke-width="1.2"/>
  </g>
  <text x="546" y="142" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">① 右移（水平）</text>
  <!-- before: 3 cells -->
  <g filter="url(#sk2)">
    <rect x="472" y="156" width="22" height="22" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="494" y="156" width="22" height="22" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="516" y="156" width="22" height="22" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2"/>
  </g>
  <text x="483" y="148" text-anchor="middle" font-size="9" fill="#34506e">c</text>
  <text x="527" y="148" text-anchor="middle" font-size="9" fill="#b85450">c+2</text>
  <!-- arrow -->
  <path d="M 544 167 L 568 167" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk2)"/>
  <!-- after: 3 cells -->
  <g filter="url(#sk2)">
    <rect x="574" y="156" width="22" height="22" rx="2" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
    <rect x="596" y="156" width="22" height="22" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="618" y="156" width="22" height="22" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="546" y="200" text-anchor="middle" font-size="10" fill="#444">需 grid[r][c+2] = 0</text>
  <text x="546" y="216" text-anchor="middle" font-size="10" fill="#888">朝向不变，整体右移一格</text>
  <text x="546" y="236" text-anchor="middle" font-size="9.5" fill="#888">（竖直右移：右列两格均须空）</text>
  <text x="546" y="254" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">(r,c,0)→(r,c+1,0)</text>

  <!-- ===== Move 2: 下移 (top-right) ===== -->
  <g filter="url(#sk2)">
    <rect x="650" y="124" width="180" height="148" rx="6" fill="#ffffff" stroke="#9ec9a0" stroke-width="1.2"/>
  </g>
  <text x="740" y="142" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">② 下移（竖直）</text>
  <!-- before: 3 cells stacked -->
  <g filter="url(#sk2)">
    <rect x="676" y="156" width="22" height="22" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="676" y="178" width="22" height="22" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="676" y="200" width="22" height="22" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2"/>
  </g>
  <text x="668" y="172" text-anchor="end" font-size="9" fill="#34506e">r</text>
  <text x="668" y="214" text-anchor="end" font-size="9" fill="#b85450">r+2</text>
  <!-- arrow -->
  <path d="M 704 178 L 728 178" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk2)"/>
  <!-- after: 3 cells stacked -->
  <g filter="url(#sk2)">
    <rect x="734" y="156" width="22" height="22" rx="2" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
    <rect x="734" y="178" width="22" height="22" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="734" y="200" width="22" height="22" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="740" y="240" text-anchor="middle" font-size="10" fill="#444">需 grid[r+2][c] = 0</text>
  <text x="740" y="256" text-anchor="middle" font-size="9.5" fill="#888">（水平下移：下行两格须空）</text>
  <text x="740" y="272" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">(r,c,1)→(r+1,c,1)</text>

  <!-- ===== Move 3: 顺时针 H→V (bottom-left) ===== -->
  <g filter="url(#sk2)">
    <rect x="456" y="284" width="180" height="168" rx="6" fill="#ffffff" stroke="#9ec9a0" stroke-width="1.2"/>
  </g>
  <text x="546" y="302" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">③ 顺时针旋转 H→V</text>
  <!-- before: 2x2 -->
  <g filter="url(#sk2)">
    <rect x="476" y="316" width="24" height="24" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="500" y="316" width="24" height="24" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="476" y="340" width="24" height="24" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2"/>
    <rect x="500" y="340" width="24" height="24" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2"/>
  </g>
  <text x="488" y="372" text-anchor="middle" font-size="9" fill="#b85450">r+1,c</text>
  <text x="512" y="372" text-anchor="middle" font-size="9" fill="#b85450">r+1,c+1</text>
  <!-- arrow -->
  <path d="M 532 328 L 556 328" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk2)"/>
  <!-- after: 2x2 -->
  <g filter="url(#sk2)">
    <rect x="562" y="316" width="24" height="24" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="586" y="316" width="24" height="24" rx="2" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
    <rect x="562" y="340" width="24" height="24" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="586" y="340" width="24" height="24" rx="2" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
  </g>
  <text x="546" y="392" text-anchor="middle" font-size="10" fill="#444">需 (r+1,c) 与 (r+1,c+1) 均空</text>
  <text x="546" y="408" text-anchor="middle" font-size="9.5" fill="#888">蛇尾 (r,c+1)→(r+1,c)</text>
  <text x="546" y="422" text-anchor="middle" font-size="9.5" fill="#888">锚点 (r,c) 不动</text>
  <text x="546" y="442" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">(r,c,0)→(r,c,1)</text>

  <!-- ===== Move 4: 逆时针 V→H (bottom-right) ===== -->
  <g filter="url(#sk2)">
    <rect x="650" y="284" width="180" height="168" rx="6" fill="#ffffff" stroke="#9ec9a0" stroke-width="1.2"/>
  </g>
  <text x="740" y="302" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">④ 逆时针旋转 V→H</text>
  <!-- before: 2x2 -->
  <g filter="url(#sk2)">
    <rect x="670" y="316" width="24" height="24" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="694" y="316" width="24" height="24" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2"/>
    <rect x="670" y="340" width="24" height="24" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="694" y="340" width="24" height="24" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2"/>
  </g>
  <text x="706" y="372" text-anchor="middle" font-size="9" fill="#b85450">r,c+1</text>
  <text x="730" y="372" text-anchor="middle" font-size="9" fill="#b85450">r+1,c+1</text>
  <!-- arrow -->
  <path d="M 726 328 L 750 328" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk2)"/>
  <!-- after: 2x2 -->
  <g filter="url(#sk2)">
    <rect x="756" y="316" width="24" height="24" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="780" y="316" width="24" height="24" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="756" y="340" width="24" height="24" rx="2" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
    <rect x="780" y="340" width="24" height="24" rx="2" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
  </g>
  <text x="740" y="392" text-anchor="middle" font-size="10" fill="#444">需 (r,c+1) 与 (r+1,c+1) 均空</text>
  <text x="740" y="408" text-anchor="middle" font-size="9.5" fill="#888">蛇尾 (r+1,c)→(r,c+1)</text>
  <text x="740" y="422" text-anchor="middle" font-size="9.5" fill="#888">锚点 (r,c) 不动</text>
  <text x="740" y="442" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">(r,c,1)→(r,c,0)</text>

  <!-- bottom insight -->
  <text x="640" y="478" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">两种旋转都要求 2×2 方块的「另一对角」为空</text>
  <text x="640" y="494" text-anchor="middle" font-size="10.5" fill="#7a5415">→ 判定只需检查 2 个格子，O(1) 转移</text>
</svg>
