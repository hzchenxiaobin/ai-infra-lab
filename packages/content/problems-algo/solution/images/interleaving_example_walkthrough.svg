  <path d="M 516 224 L 534 224" stroke="#446688" stroke-width="2" fill="none" stroke-dasharray="6,3" filter="url(#sk)"/>
  <text x="544" y="228" font-size="11" fill="#444">一种交错路径</text>
  <text x="514" y="252" font-size="10" fill="#888">向下=取 s1，向右=取 s2</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="130" y="384" width="570" height="68" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5,3"/>
  </g>
  <text x="150" y="408" font-size="12" fill="#2b2b2b" font-weight="bold">读表：</text>
  <text x="150" y="428" font-size="11" fill="#444">首列 dp[i][0] 只能"取 s1"向下走；首行 dp[0][j] 只能"取 s2"向右走。</text>
  <text x="150" y="444" font-size="11" fill="#444">内部格看「上方✓且 s1[i-1] 匹配」或「左方✓且 s2[j-1] 匹配」，OR 即可。</text>
