  <g filter="url(#sk)"><rect x="514" y="146" width="22" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="544" y="158" font-size="11" fill="#444">边界（只用一个串）</text>
  <g filter="url(#sk)"><rect x="514" y="170" width="22" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
