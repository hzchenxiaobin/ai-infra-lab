<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：从右向左扫描解码</text>

  <!-- Start -->
  <rect x="200" y="34" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="15" filter="url(#rough2)"/>
  <text x="270" y="54" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i = n−1，res = []</text>
  <path d="M 270 64 L 270 80" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop condition diamond -->
  <path d="M 270 80 L 350 98 L 270 116 L 190 98 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="102" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">i ≥ 0 ?</text>

  <!-- No branch: reverse + return -->
  <text x="368" y="92" font-size="11" fill="#888" font-weight="bold">否</text>
  <path d="M 350 98 L 388 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="388" y="84" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="448" y="103" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">反转 res</text>
  <path d="M 448 112 L 448 128" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="388" y="128" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="15" filter="url(#rough2)"/>
  <text x="448" y="148" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">返回 res</text>

  <!-- Yes branch down -->
  <text x="280" y="130" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 270 116 L 270 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Second diamond: s[i]=='#' ? -->
  <path d="M 270 138 L 360 156 L 270 174 L 180 156 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">s[i] == '#' ?</text>

  <!-- Yes: two digits -->
  <text x="372" y="150" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <path d="M 360 156 L 388 156" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="388" y="142" width="124" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="161" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">num = 两位; i −= 3</text>

  <!-- No: one digit -->
  <text x="160" y="150" font-size="11" fill="#446688" font-weight="bold">否</text>
  <path d="M 180 156 L 152 156" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="28" y="142" width="124" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="161" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">num = 一位; i −= 1</text>

  <!-- merge arrows to bottom box -->
  <path d="M 450 172 L 450 196 L 270 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 90 172 L 90 196 L 270 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- merge box -->
  <rect x="200" y="198" width="140" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="217" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">res 追加 c = a + num − 1</text>

  <!-- loop back to top diamond -->
  <path d="M 270 228 L 20 228 L 20 98 L 190 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="160" font-size="11" fill="#888" font-weight="bold">循环</text>

  <!-- bottom note -->
  <rect x="40" y="250" width="440" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">逆向扫描一句话</text>
  <text x="60" y="292" font-size="11" fill="#333">• 遇 '#'：取左边两位数字（10~26 → j~z），指针左移 3</text>
  <text x="60" y="310" font-size="11" fill="#333">• 否则：取当前一位数字（1~9 → a~i），指针左移 1</text>
  <text x="60" y="328" font-size="11" fill="#b85450" font-weight="bold">逆向追加 → 末尾反转；时间 O(n)，额外空间 O(1)</text>
</svg>
