<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：s = "100100010100110"</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">m = 6，k = 2；1 的下标 p = [0, 3, 7, 9, 12, 13]</text>

  <!-- ===== 字符串格子（15 个字符，宽 32）===== -->
  <g font-size="12">
    <!-- 第1组：p[0]=0, p[1]=3 蓝色 -->
    <rect x="40" y="60" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="56" y="81" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="72" y="60" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="88" y="81" text-anchor="middle" fill="#333">0</text>
    <rect x="104" y="60" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="120" y="81" text-anchor="middle" fill="#333">0</text>
    <rect x="136" y="60" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="152" y="81" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>

    <!-- 第一刀可切割区 橙色 位置4-7 -->
    <rect x="168" y="60" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="184" y="81" text-anchor="middle" fill="#333">0</text>
    <rect x="200" y="60" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="216" y="81" text-anchor="middle" fill="#333">0</text>
    <rect x="232" y="60" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="248" y="81" text-anchor="middle" fill="#333">0</text>
    <rect x="264" y="60" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="280" y="81" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>

    <!-- 第2组后半个1 p[3]=9 绿色 -->
    <rect x="296" y="60" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="312" y="81" text-anchor="middle" fill="#333">0</text>

    <!-- 第二刀可切割区 橙色 位置10-12 -->
    <rect x="328" y="60" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="344" y="81" text-anchor="middle" fill="#333">1</text>
    <rect x="360" y="60" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="376" y="81" text-anchor="middle" fill="#333">0</text>
    <rect x="392" y="60" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="408" y="81" text-anchor="middle" fill="#333">0</text>

    <!-- 第3组 p[4]=12, p[5]=13 蓝色 -->
    <rect x="424" y="60" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="440" y="81" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="456" y="60" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="472" y="81" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="488" y="60" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="504" y="81" text-anchor="middle" fill="#333">0</text>
  </g>

  <!-- 位置标号 -->
  <g font-size="9" fill="#888">
    <text x="56" y="106" text-anchor="middle">0</text>
    <text x="152" y="106" text-anchor="middle">3</text>
    <text x="280" y="106" text-anchor="middle">7</text>
    <text x="312" y="106" text-anchor="middle">8</text>
    <text x="344" y="106" text-anchor="middle">9</text>
    <text x="440" y="106" text-anchor="middle">12</text>
    <text x="472" y="106" text-anchor="middle">13</text>
  </g>

  <!-- ===== 三组标注 ===== -->
  <g font-size="11">
    <rect x="40" y="120" width="128" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="104" y="136" text-anchor="middle" fill="#446688" font-weight="bold">第 1 组：p[0..1]</text>

    <rect x="168" y="120" width="160" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="248" y="136" text-anchor="middle" fill="#4a7a3a" font-weight="bold">第 2 组：p[2..3]</text>

    <rect x="424" y="120" width="96" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="472" y="136" text-anchor="middle" fill="#446688" font-weight="bold">第 3 组：p[4..5]</text>
  </g>

  <!-- ===== 第一刀计算 ===== -->
  <rect x="40" y="160" width="280" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="182" font-size="12" fill="#d6a040" font-weight="bold">第一刀 i：在第 k 个 1 与第 k+1 个 1 之间</text>
  <text x="60" y="200" font-size="12" fill="#333">x = p[k] − p[k−1] = p[2] − p[1] = 7 − 3 = 4</text>
  <text x="60" y="214" font-size="10" fill="#888">可切位置：4, 5, 6, 7 → 4 种</text>

  <!-- ===== 第二刀计算 ===== -->
  <rect x="320" y="160" width="260" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="340" y="182" font-size="12" fill="#d6a040" font-weight="bold">第二刀 j：在第 2k 个 1 与第 2k+1 个 1 之间</text>
  <text x="340" y="200" font-size="12" fill="#333">y = p[2k] − p[2k−1] = p[4] − p[3] = 12 − 9 = 3</text>
  <text x="340" y="214" font-size="10" fill="#888">可切位置：10, 11, 12 → 3 种</text>

  <!-- ===== 乘法原理 ===== -->
  <rect x="120" y="240" width="360" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="262" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">两刀独立 → 乘法原理</text>
  <text x="300" y="278" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">答案 = x × y = 4 × 3 = 12</text>

  <!-- ===== 全 0 特例对比 ===== -->
  <text x="40" y="312" font-size="11" fill="#666" font-weight="bold">对比全 0 串特例（m = 0）：</text>

  <rect x="40" y="322" width="540" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="60" y="342" font-size="11" fill="#b85450">s = "0000"（n=4）：每个部分都含 0 个 1，任意 3-段切割均合法</text>
  <text x="60" y="358" font-size="12" fill="#b85450" font-weight="bold">方案数 = C(n−1, 2) = C(3, 2) = 3 ✓</text>

  <!-- ===== 总结 ===== -->
  <rect x="40" y="384" width="540" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="404" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">核心：1 的总数均分三组 → 每组 k 个 1</text>
  <text x="300" y="422" text-anchor="middle" font-size="11" fill="#333">切割点只能在相邻组的边界 1 之间滑动 → 间隙长度即选择数</text>
</svg>
