<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
    <marker id="arrU" markerWidth="8" markerHeight="8" refX="4" refY="1" orient="auto">
      <path d="M8,8 L4,1 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：把整数拆成数字数组，套"下一个排列"</text>

  <!-- n = 127431 -->
  <text x="80" y="68" font-size="12" fill="#888">n = </text>
  <text x="270" y="86" text-anchor="middle" font-size="10.5" fill="#888">从右往左找首个 digits[i] &lt; digits[i+1]</text>
  <path d="M 360 96 L 184 96" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>

  <!-- descending suffix bracket over cells 2..5 -->
  <path d="M 174 108 L 174 102 L 358 102 L 358 108" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="266" y="94" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">右侧降序段 [7,4,3,1]</text>

  <!-- array cells -->
  <rect x="80" y="120" width="46" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="103" y="148" text-anchor="middle" font-size="14" fill="#333">1</text>

  <rect x="126" y="120" width="46" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="149" y="148" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <rect x="172" y="120" width="46" height="42" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="195" y="148" text-anchor="middle" font-size="14" fill="#333">7</text>

  <rect x="218" y="120" width="46" height="42" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="241" y="148" text-anchor="middle" font-size="14" fill="#333">4</text>

  <rect x="264" y="120" width="46" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="287" y="148" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <rect x="310" y="120" width="46" height="42" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="333" y="148" text-anchor="middle" font-size="14" fill="#333">1</text>

  <!-- index labels -->
  <text x="103" y="180" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="149" y="180" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">1 ← i</text>
  <text x="195" y="180" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="241" y="180" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="287" y="180" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">4 ← j</text>
  <text x="333" y="180" text-anchor="middle" font-size="9" fill="#aaa">5</text>

  <!-- pivot arrow -->
  <path d="M 149 206 L 149 188" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>
  <text x="149" y="222" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">待增大位 i</text>
  <text x="149" y="236" text-anchor="middle" font-size="10" fill="#666">digits[i]=2</text>

  <!-- j arrow -->
  <path d="M 287 206 L 287 188" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>
  <text x="287" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">后继 j</text>
  <text x="287" y="236" text-anchor="middle" font-size="10" fill="#666">&gt;2 的最小值 = 3</text>

  <!-- key idea boxes -->
  <rect x="30" y="256" width="480" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="274" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">交换 i,j + 反转右侧降序段 → 升序</text>
  <text x="270" y="290" text-anchor="middle" font-size="10.5" fill="#555">得 131247：比 127431 大且尽可能小</text>

  <!-- differences vs 31 -->
  <rect x="30" y="306" width="235" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="147" y="324" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">差异①：不回绕</text>
  <text x="147" y="340" text-anchor="middle" font-size="10" fill="#666">已是最大排列 → 返回 -1</text>
  <text x="147" y="354" text-anchor="middle" font-size="10" fill="#666">（31 是反转回绕到最小）</text>

  <rect x="275" y="306" width="235" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="392" y="324" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">差异②：越界检查</text>
  <text x="392" y="340" text-anchor="middle" font-size="10" fill="#666">拼回整数 &gt; 2^31−1 → 返回 -1</text>
  <text x="392" y="354" text-anchor="middle" font-size="10" fill="#666">（如 1999999999 → 9199999999）</text>
</svg>
