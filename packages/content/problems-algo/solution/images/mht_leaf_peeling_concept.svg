<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    逐层剥叶子 → 剩下的就是树的重心
  </text>

  <!-- 左侧：原始树 -->
  <g filter="url(#rough2)">
    <!-- 边 -->
    <line x1="110" y1="80" x2="210" y2="170" stroke="#888" stroke-width="1.5"/>
    <line x1="210" y1="80" x2="210" y2="170" stroke="#888" stroke-width="1.5"/>
    <line x1="310" y1="80" x2="210" y2="170" stroke="#888" stroke-width="1.5"/>
    <line x1="210" y1="170" x2="210" y2="260" stroke="#888" stroke-width="1.5"/>
    <line x1="210" y1="260" x2="210" y2="340" stroke="#888" stroke-width="1.5"/>

    <!-- 叶子节点 0,1,2,5：红/橙 -->
    <circle cx="110" cy="80" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="110" y="85" text-anchor="middle" font-size="14" fill="#b85450">0</text>
    <circle cx="210" cy="80" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="210" y="85" text-anchor="middle" font-size="14" fill="#b85450">1</text>
    <circle cx="310" cy="80" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="310" y="85" text-anchor="middle" font-size="14" fill="#b85450">2</text>
    <circle cx="210" cy="340" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="210" y="345" text-anchor="middle" font-size="14" fill="#b85450">5</text>

    <!-- 重心 3,4：绿 -->
    <circle cx="210" cy="170" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <text x="210" y="175" text-anchor="middle" font-size="14" fill="#4a7a3a">3</text>
    <circle cx="210" cy="260" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <text x="210" y="265" text-anchor="middle" font-size="14" fill="#4a7a3a">4</text>
  </g>

  <!-- 左侧图例 -->
  <g filter="url(#rough2)">
    <rect x="30" y="120" width="14" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="50" y="132" font-size="11" fill="#555">第 0 层叶子</text>
    <rect x="30" y="142" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="50" y="154" font-size="11" fill="#555">重心(答案)</text>
  </g>

  <!-- 中间剥离箭头 -->
  <path d="M 360 210 Q 410 190 450 210" fill="none" stroke="#4a7a3a"
        stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="405" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">
    剥掉叶子
  </text>

  <!-- 右侧：剥离后 -->
  <g filter="url(#rough2)">
    <line x1="480" y1="175" x2="480" y2="255" stroke="#888" stroke-width="1.8"/>
    <circle cx="480" cy="170" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <text x="480" y="175" text-anchor="middle" font-size="14" fill="#4a7a3a">3</text>
    <circle cx="480" cy="260" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <text x="480" y="265" text-anchor="middle" font-size="14" fill="#4a7a3a">4</text>
  </g>
  <text x="480" y="310" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">
    剩 2 个 = 答案
  </text>

  <!-- 底部说明 -->
  <rect x="40" y="345" width="480" height="28" rx="6" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="363" text-anchor="middle" font-size="11.5" fill="#7a5a20" filter="url(#rough2)">
    直径 0-3-4-5 长度 3 (奇) → 中点落 3 与 4 之间 → 两个等价重心
  </text>
</svg>
