<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：批量贪心填谷</text>

  <rect x="120" y="48" width="320" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 统计 cnt[f]，枚举倍数求 D[f]</text>
  <text x="280" y="89" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">gain[i] = D[factor_i] − 1（调和级数）</text>
  <path d="M280,104 L280,118" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="118" width="320" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② items 按 price 升序；p_min = 最低价</text>
  <path d="M280,158 L280,172" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="172" width="320" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 取下一个双倍批次（价 p，共 gain 份）</text>
  <path d="M280,212 L280,228" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="270,228 392,270 270,312 148,270" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="275" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">p &lt; 2·p_min ？</text>

  <text x="400" y="262" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M392,270 L414,270" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="416" y="240" width="134" height="82" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="424" y="258" font-size="10.5" fill="#333" filter="url(#rough2)">④ take = min(gain,</text>
  <text x="424" y="272" font-size="10.5" fill="#333" filter="url(#rough2)">    余钱 ÷ p)</text>
  <text x="424" y="290" font-size="10.5" fill="#333" filter="url(#rough2)">C += take·p</text>
  <text x="424" y="308" font-size="10.5" fill="#333" filter="url(#rough2)">g = C − 2a·p_min</text>

  <path d="M483,240 L483,194 L444,194" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="490" y="220" font-size="10" fill="#4a7a3a" filter="url(#rough2)">下一批</text>

  <path d="M483,322 L483,370 L444,370" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="490" y="348" font-size="10" fill="#b85450" filter="url(#rough2)">预算用尽</text>
  <text x="490" y="362" font-size="9" fill="#b85450" filter="url(#rough2)">(take&lt;gain)</text>

  <text x="282" y="328" font-size="10.5" fill="#b85450" filter="url(#rough2)">否（谷底已过）</text>
  <path d="M270,312 L270,334" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="334" width="320" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">⑤ 答案 = (budget − g) ÷ p_min</text>
  <text x="280" y="375" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">（整数除法 = 向下取整）</text>

  <text x="280" y="410" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">时间 O(n log n) · 空间 O(n)</text>
</svg>
