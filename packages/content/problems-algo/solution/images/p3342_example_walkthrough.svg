<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：moveTime = [[0,4],[4,4]]，答案 7</text>

  <!-- 左：2x2 网格 -->
  <rect x="52" y="58" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="82" text-anchor="middle" font-size="15" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="80" y="100" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">(0,0) 起点 t=0</text>

  <rect x="116" y="58" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="144" y="82" text-anchor="middle" font-size="15" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="144" y="100" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">(0,1) t=5</text>

  <rect x="52" y="122" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="80" y="146" text-anchor="middle" font-size="15" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="80" y="164" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">(1,0) t=5</text>

  <rect x="116" y="122" width="56" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="144" y="146" text-anchor="middle" font-size="15" fill="#a07830" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="144" y="164" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">(1,1) 终点 t=7</text>

  <path d="M 80 84 C 66 96, 66 108, 78 120" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="46" y="106" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">+1s</text>
  <path d="M 92 150 L 112 150" stroke="#a07830" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="142" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">+2s</text>

  <rect x="40" y="196" width="150" height="58" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="115" y="214" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">门禁是 max 约束：</text>
  <text x="115" y="230" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">t=0 想去 (1,0)，门 4 才开</text>
  <text x="115" y="246" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">→ max(0,4)+1 = 5 到达</text>

  <!-- 右：堆弹出顺序表 -->
  <text x="350" y="56" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">Dijkstra 弹出顺序（时间小者先出）：</text>

  <rect x="216" y="64" width="86" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="259" y="80" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">弹出状态</text>
  <rect x="302" y="64" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="323" y="80" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">d</text>
  <rect x="344" y="64" width="152" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="420" y="80" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">动作</text>

  <rect x="216" y="88" width="86" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="259" y="107" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(0,0) p=0</text>
  <rect x="302" y="88" width="42" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="323" y="107" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="344" y="88" width="152" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="100" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">松弛 (0,1)与(1,0)：</text>
  <text x="420" y="112" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">max(0,4)+1 = 5 各入堆</text>

  <rect x="216" y="118" width="86" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="259" y="137" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(0,1) p=1</text>
  <rect x="302" y="118" width="42" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="323" y="137" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>
  <rect x="344" y="118" width="152" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="130" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">去 (1,1)：max(5,4)+2 = 7</text>
  <text x="420" y="142" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">dist[1][1][0] = 7 入堆</text>

  <rect x="216" y="148" width="86" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="259" y="167" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(1,0) p=1</text>
  <rect x="302" y="148" width="42" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="323" y="167" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>
  <rect x="344" y="148" width="152" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="160" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">也去 (1,1)：仍是 7，</text>
  <text x="420" y="172" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">不小于现有值，跳过</text>

  <rect x="216" y="178" width="86" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="259" y="197" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">(1,1) p=0</text>
  <rect x="302" y="178" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="323" y="197" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="344" y="178" width="152" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="190" text-anchor="middle" font-size="8.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">弹出到终点状态，</text>
  <text x="420" y="202" text-anchor="middle" font-size="8.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">7 即最短 → 返回 7 ✓</text>

  <!-- 底部：示例 2 时间线 -->
  <text x="260" y="290" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">示例 2 复核：moveTime 全 0（2×4），代价序列 1,2,1,2：</text>

  <circle cx="76" cy="330" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="76" y="335" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="76" y="360" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">(0,0)</text>

  <path d="M 94 330 L 158 330" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="126" y="322" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1s</text>
  <circle cx="176" cy="330" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="176" y="335" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="176" y="360" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">(1,0)</text>

  <path d="M 194 330 L 258 330" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="226" y="322" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">2s</text>
  <circle cx="276" cy="330" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="276" y="335" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="276" y="360" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">(1,1)</text>

  <path d="M 294 330 L 358 330" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="326" y="322" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1s</text>
  <circle cx="376" cy="330" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="376" y="335" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="376" y="360" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">(1,2)</text>

  <path d="M 394 330 L 458 330" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="426" y="322" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">2s</text>
  <circle cx="476" cy="330" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="476" y="335" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="476" y="360" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">(1,3) ✓</text>

  <rect x="60" y="382" width="400" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="402" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">无门禁时最优走法 = 直奔终点，0+1+2+1+2 = 6 ✓</text>
</svg>
