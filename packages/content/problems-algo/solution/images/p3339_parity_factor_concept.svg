<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：ab − a − b = (a−1)(b−1) − 1，唯有「偶·偶」得偶</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">判定条件与数值大小无关，只看奇偶性！</text>

  <!-- 左列：推导链 -->
  <rect x="34" y="58" width="216" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="142" y="76" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">判定式：a·b − a − b 是偶数？</text>
  <text x="142" y="91" text-anchor="middle" font-size="9.5" fill="#6a86a3" filter="url(#rough2)">乘积、和、差……看似三个量</text>

  <path d="M 142 100 L 142 116" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="152" y="112" font-size="9.5" fill="#888" filter="url(#rough2)">+1 再分解</text>

  <rect x="34" y="118" width="216" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="142" y="143" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">ab − a − b = (a−1)(b−1) − 1</text>

  <path d="M 142 160 L 142 176" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="152" y="172" font-size="9.5" fill="#888" filter="url(#rough2)">奇偶分析</text>

  <rect x="34" y="178" width="216" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="142" y="196" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">(a−1)(b−1) − 1 为偶</text>
  <text x="142" y="211" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">⟺ (a−1)(b−1) 为奇 ⟺ 两个因子皆奇</text>

  <path d="M 142 220 L 142 236" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="152" y="232" font-size="9.5" fill="#888" filter="url(#rough2)">a−1 奇 ⟺ a 偶</text>

  <rect x="34" y="238" width="216" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="142" y="262" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">⟺ a、b 都是偶数</text>

  <!-- 右列：奇偶四格表 -->
  <text x="385" y="66" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">奇偶四格表：ab − a − b 的奇偶</text>

  <rect x="310" y="76" width="60" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="95" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">a \ b</text>
  <rect x="370" y="76" width="58" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="399" y="95" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">偶</text>
  <rect x="428" y="76" width="58" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="457" y="95" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">奇</text>

  <rect x="310" y="106" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="127" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">偶</text>
  <rect x="370" y="106" width="58" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="399" y="122" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">偶 ✓</text>
  <text x="399" y="135" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">偶−偶=偶</text>
  <rect x="428" y="106" width="58" height="34" fill="#f4f4f4" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="457" y="122" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">奇 ✗</text>
  <text x="457" y="135" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">偶−奇=奇</text>

  <rect x="310" y="140" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="161" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">奇</text>
  <rect x="370" y="140" width="58" height="34" fill="#f4f4f4" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="399" y="156" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">奇 ✗</text>
  <text x="399" y="169" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">偶−奇=奇</text>
  <rect x="428" y="140" width="58" height="34" fill="#f4f4f4" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="457" y="156" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">奇 ✗</text>
  <text x="457" y="169" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">奇−偶=奇</text>

  <!-- 右列：示例1回验 -->
  <rect x="296" y="192" width="202" height="42" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="397" y="209" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">示例 1 回验：n=3, m=4, k=2</text>
  <text x="397" y="225" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">两对都得「偶偶」→ 全偶 2³ = 8 ✓</text>

  <!-- 中部连接箭头 -->
  <path d="M 252 130 Q 275 130 292 160" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <path d="M 252 258 Q 278 250 294 232" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- 底部总结 -->
  <rect x="26" y="298" width="468" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">K 偶数数组 = 恰好有 k 个相邻位置对都是偶数的数组</text>
  <text x="260" y="337" text-anchor="middle" font-size="10" fill="#7a5a20" filter="url(#rough2)">原题折叠成带权 01 串计数：每个「偶」位有 ⌊m/2⌋ 种取值，「奇」位有 ⌈m/2⌉ 种</text>
</svg>
