<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 230"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="230" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：nums = [3, 4, 5, 5, 3, 1]</text>

  <!-- cells y=92, n=6, min=1@idx5(i=5), max=5@idx2/idx3 -> 右 idx3(j=3) -->
  <rect x="95" y="92" width="50" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="122" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>
  <rect x="151" y="92" width="50" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="176" y="122" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">4</text>
  <rect x="207" y="92" width="50" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="232" y="122" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">5</text>
  <rect x="263" y="92" width="50" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="288" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a5a00" filter="url(#rough2)">5</text>
  <rect x="319" y="92" width="50" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="344" y="122" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>
  <rect x="375" y="92" width="50" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="400" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#2d5a22" filter="url(#rough2)">1</text>

  <!-- index labels -->
  <text x="120" y="156" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">0</text>
  <text x="176" y="156" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">1</text>
  <text x="232" y="156" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">2</text>
  <text x="288" y="156" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">3</text>
  <text x="344" y="156" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">4</text>
  <text x="400" y="156" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">5</text>

  <!-- min arrow idx5 -> idx0 (long, leftward) -->
  <path d="M400,76 L120,76" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">i = 5 步</text>
  <!-- max arrow idx3 -> idx5 (short, rightward) -->
  <path d="M288,64 L400,64" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="380" y="56" text-anchor="middle" font-size="12" fill="#8a5a00" filter="url(#rough2)">n−1−j = 2 步</text>

  <!-- crossing badge in overlap [288,400] -->
  <circle cx="344" cy="70" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="344" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">省1</text>

  <text x="260" y="180" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">5 出现于 idx2、idx3 → 取最右 idx3 作 j；1 唯一，i = 5</text>
  <text x="260" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">i &gt; j 交叉 → 5 + (6−1−3) − 1 = 5 + 2 − 1 = 6</text>

</svg>
