<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [4,6,1,2], k = 2</text>

  <!-- Sorted array header -->
  <text x="40" y="52" font-size="11" fill="#888">排序后:</text>
  <text x="110" y="52" font-size="11" fill="#888">下标:</text>
  <text x="170" y="52" font-size="11" fill="#888" font-weight="bold">0</text>
  <text x="230" y="52" font-size="11" fill="#888" font-weight="bold">1</text>
  <text x="290" y="52" font-size="11" fill="#888" font-weight="bold">2</text>
  <text x="350" y="52" font-size="11" fill="#888" font-weight="bold">3</text>

  <rect x="150" y="58" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="79" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="210" y="58" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="79" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="270" y="58" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="292" y="79" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="330" y="58" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="352" y="79" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>

  <text x="420" y="74" font-size="11" fill="#888">阈值 2k = 4</text>

  <!-- Table header -->
  <text x="40" y="116" font-size="11" fill="#444" font-weight="bold">步</text>
  <text x="70" y="116" font-size="11" fill="#444" font-weight="bold">right</text>
  <text x="115" y="116" font-size="11" fill="#444" font-weight="bold">值</text>
  <text x="150" y="116" font-size="11" fill="#444" font-weight="bold">left</text>
  <text x="190" y="116" font-size="11" fill="#444" font-weight="bold">差值</text>
  <text x="260" y="116" font-size="11" fill="#444" font-weight="bold">判断</text>
  <text x="350" y="116" font-size="11" fill="#444" font-weight="bold">窗口</text>
  <text x="490" y="116" font-size="11" fill="#444" font-weight="bold">ans</text>
  <line x1="30" y1="122" x2="560" y2="122" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 1: right=0, 1, left=0, 1-1=0, ok, [1], ans=1 -->
  <text x="40" y="142" font-size="11" fill="#333">1</text>
  <text x="70" y="142" font-size="11" fill="#333">0</text>
  <text x="115" y="142" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="150" y="142" font-size="11" fill="#333">0</text>
  <text x="190" y="142" font-size="11" fill="#4a7a3a">1−1=0</text>
  <text x="260" y="142" font-size="11" fill="#4a7a3a">0 ≤ 4 ✓</text>
  <text x="350" y="142" font-size="11" fill="#4a7a3a" font-weight="bold">[1]</text>
  <text x="490" y="142" font-size="11" fill="#333">1</text>

  <!-- Step 2: right=1, 2, left=0, 2-1=1, ok, [1,2], ans=2 -->
  <text x="40" y="162" font-size="11" fill="#333">2</text>
  <text x="70" y="162" font-size="11" fill="#333">1</text>
  <text x="115" y="162" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="150" y="162" font-size="11" fill="#333">0</text>
  <text x="190" y="162" font-size="11" fill="#4a7a3a">2−1=1</text>
  <text x="260" y="162" font-size="11" fill="#4a7a3a">1 ≤ 4 ✓</text>
  <text x="350" y="162" font-size="11" fill="#4a7a3a" font-weight="bold">[1, 2]</text>
  <text x="490" y="162" font-size="11" fill="#333">2</text>

  <!-- Step 3: right=2, 4, left=0, 4-1=3, ok, [1,2,4], ans=3 -->
  <text x="40" y="182" font-size="11" fill="#333">3</text>
  <text x="70" y="182" font-size="11" fill="#333">2</text>
  <text x="115" y="182" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="150" y="182" font-size="11" fill="#333">0</text>
  <text x="190" y="182" font-size="11" fill="#4a7a3a">4−1=3</text>
  <text x="260" y="182" font-size="11" fill="#4a7a3a">3 ≤ 4 ✓</text>
  <text x="350" y="182" font-size="11" fill="#4a7a3a" font-weight="bold">[1, 2, 4]</text>
  <text x="490" y="182" font-size="11" fill="#333" font-weight="bold">3 ⭐</text>

  <!-- Step 4a: right=3, 6, left=0, 6-1=5, >4, shrink -->
  <text x="40" y="202" font-size="11" fill="#333">4</text>
  <text x="70" y="202" font-size="11" fill="#333">3</text>
  <text x="115" y="202" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="150" y="202" font-size="11" fill="#333">0</text>
  <text x="190" y="202" font-size="11" fill="#b85450">6−1=5</text>
  <text x="260" y="202" font-size="11" fill="#b85450">5 &gt; 4 ✗</text>
  <text x="350" y="202" font-size="11" fill="#b85450">收缩 left++</text>
  <text x="490" y="202" font-size="11" fill="#888">—</text>

  <!-- Step 4b: right=3, 6, left=1, 6-2=4, ok, [2,4,6], ans=3 -->
  <text x="40" y="222" font-size="11" fill="#888">4'</text>
  <text x="70" y="222" font-size="11" fill="#333">3</text>
  <text x="115" y="222" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="150" y="222" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="190" y="222" font-size="11" fill="#4a7a3a">6−2=4</text>
  <text x="260" y="222" font-size="11" fill="#4a7a3a">4 ≤ 4 ✓</text>
  <text x="350" y="222" font-size="11" fill="#4a7a3a" font-weight="bold">[2, 4, 6]</text>
  <text x="490" y="222" font-size="11" fill="#333">3</text>

  <!-- Result box -->
  <rect x="60" y="250" width="460" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="274" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">答案 = 3，最长窗口 [1, 2, 4] 或 [2, 4, 6]</text>
  <text x="290" y="294" text-anchor="middle" font-size="11" fill="#888">[1,2,4] 三区间交集 = [2,3]，可全变为 2 或 3</text>

  <!-- Original mapping note -->
  <rect x="60" y="324" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="346" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">对应原数组 [4,6,1,2]：选下标 0(4)、2(1)、3(2) → 全变 4</text>
  <text x="290" y="364" text-anchor="middle" font-size="10" fill="#888">4∈[4±2], 1∈[−1,3]→3∈[2,3]… 或按 [1,2,4] 对应原下标 2,3,0</text>

  <!-- Legend -->
  <rect x="60" y="384" width="14" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="80" y="393" font-size="10" fill="#555">满足约束</text>
  <rect x="150" y="384" width="14" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="170" y="393" font-size="10" fill="#555">违反收缩</text>
  <text x="250" y="393" font-size="10" fill="#888">⭐ = 全局最大</text>
</svg>
