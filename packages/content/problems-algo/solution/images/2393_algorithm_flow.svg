<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 530" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="530" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一遍扫描，续接或归 1，累加 len</text>

  <!-- Start oval -->
  <ellipse cx="280" cy="60" rx="86" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">输入 nums</text>

  <!-- arrow down -->
  <path d="M 280 82 L 280 102" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: init -->
  <rect x="160" y="106" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 初始化：len = 0, ans = 0</text>

  <!-- arrow down -->
  <path d="M 280 140 L 280 160" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop -->
  <rect x="140" y="164" width="280" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="186" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 遍历 i = 0 .. n−1</text>

  <!-- arrow down -->
  <path d="M 280 198 L 280 222" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="280,226 410,278 280,330 150,278" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i &gt; 0 且</text>
  <text x="280" y="288" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">nums[i] &gt; nums[i−1] ?</text>

  <!-- No branch (left, red reset) -->
  <path d="M 150 278 L 96 278" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="124" y="272" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="18" y="260" width="78" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="57" y="282" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">len = 1</text>
  <text x="57" y="294" text-anchor="middle" font-size="9" fill="#888">断裂/起点</text>

  <!-- Yes branch (right, green extend) -->
  <path d="M 410 278 L 464 278" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="436" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="464" y="260" width="78" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="503" y="282" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">len += 1</text>
  <text x="503" y="294" text-anchor="middle" font-size="9" fill="#888">续接</text>

  <!-- merge: both branches converge below diamond -->
  <path d="M 57 298 L 57 350 L 280 350" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 503 298 L 503 350 L 280 350" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <!-- single down arrow into step 3 -->
  <path d="M 280 350 L 280 368" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: ans += len -->
  <rect x="160" y="372" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="394" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ ans += len</text>

  <!-- arrow down to loop check -->
  <path d="M 280 406 L 280 426" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop check box -->
  <rect x="180" y="430" width="200" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="450" text-anchor="middle" font-size="11" fill="#666">i++；i &lt; n 则回 ②</text>

  <!-- dashed back arrow to loop -->
  <path d="M 180 445 L 90 445 L 90 181 L 140 181" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="74" y="316" text-anchor="middle" font-size="10" fill="#888">下一</text>
  <text x="74" y="330" text-anchor="middle" font-size="10" fill="#888">元素</text>

  <!-- arrow to end -->
  <path d="M 280 460 L 280 480" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End oval -->
  <ellipse cx="280" cy="504" rx="104" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="509" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">返回 ans（64 位整数）</text>
</svg>
