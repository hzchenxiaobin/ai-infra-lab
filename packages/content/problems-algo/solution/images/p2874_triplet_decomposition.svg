<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：固定 j，左取前缀最大、右取后缀最大</text>
  <text x="310" y="48" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">nums = [12, 6, 1, 2, 7]，以 j = 2 为例</text>

  <!-- i / j / k role labels -->
  <text x="155" y="76" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">i 只在左半选</text>
  <text x="310" y="76" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">固定 j</text>
  <text x="465" y="76" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">k 只在右半选</text>

  <!-- array cells -->
  <rect x="128" y="88" width="54" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="155" y="115" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">12</text>
  <rect x="190" y="88" width="54" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="217" y="115" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <rect x="252" y="88" width="54" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="279" y="115" text-anchor="middle" font-size="15" fill="#8a3a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="314" y="88" width="54" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="341" y="115" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="376" y="88" width="54" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="403" y="115" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>

  <!-- indices -->
  <text x="155" y="150" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="217" y="150" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="279" y="150" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">2 = j</text>
  <text x="341" y="150" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">3</text>
  <text x="403" y="150" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">4</text>

  <!-- brace-ish group labels -->
  <path d="M 133 162 Q 155 172 177 162" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)" marker-end="url(#arr)"/>
  <path d="M 195 162 Q 217 172 239 162" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="186" y="192" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">prefix_max[1] = 12</text>

  <path d="M 319 162 Q 341 172 363 162" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)" marker-end="url(#arr)"/>
  <path d="M 381 162 Q 403 172 425 162" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="372" y="192" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">suffix_max[3] = 7</text>

  <!-- formula box -->
  <rect x="60" y="212" width="500" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="236" text-anchor="middle" font-size="14" fill="#8a6420" font-weight="bold" filter="url(#rough2)">ans = max over j：( prefix_max[j−1] − nums[j] ) × suffix_max[j+1]</text>
  <text x="310" y="256" text-anchor="middle" font-size="11" fill="#8a6420" filter="url(#rough2)">本例：(12 − 1) × 7 = 77 ✓</text>

  <!-- why independent box -->
  <rect x="60" y="286" width="500" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="310" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">为什么两侧能独立取最值？</text>
  <text x="310" y="330" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">i、k 分属不重叠的两半；nums[k] ≥ 1 恒正 ⇒ 乘积最大 ⟺ 差值最大</text>

  <text x="310" y="374" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">⚠️ 若数组含负数则该论证失效；全负返回 0 由 ans 初值 0 兜底</text>
</svg>
