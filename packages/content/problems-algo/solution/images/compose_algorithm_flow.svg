<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：reduceRight 右折叠，从最右端函数起逐步 acc = f(acc)</text>

  <!-- array of functions, right-to-left scan -->
  <text x="60" y="60" font-size="12" fill="#888" font-weight="bold">函数数组（书写顺序）：</text>
  <rect x="180" y="48" width="70" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="215" y="71" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">f1</text>
  <rect x="256" y="48" width="70" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="291" y="71" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">f2</text>
  <rect x="332" y="48" width="70" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="367" y="71" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">f3</text>
  <text x="412" y="71" font-size="12" fill="#888">…  fn</text>

  <!-- scan pointer starting at rightmost -->
  <path d="M 408 96 L 408 110 M 408 110 L 367 110" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="430" y="100" font-size="11" fill="#b85450" font-weight="bold">指针从最右起，向左移</text>

  <!-- start: acc = x -->
  <rect x="40" y="130" width="200" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="140" y="152" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">acc = x</text>
  <text x="140" y="170" text-anchor="middle" font-size="11" fill="#888">reduceRight 的初始值</text>

  <path d="M 240 155 L 270 155" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: still has function? -->
  <polygon points="330,120 430,155 330,190 230,155" fill="#fff" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">还有函数？</text>
  <text x="330" y="166" text-anchor="middle" font-size="11" fill="#888">（指针未越过左端）</text>

  <!-- yes branch: take rightmost f -->
  <text x="452" y="150" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 430 155 L 480 155" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="480" y="130" width="120" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="540" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">取当前 f</text>
  <text x="540" y="170" text-anchor="middle" font-size="12" fill="#333">acc = f(acc)</text>

  <!-- loop back: move pointer left, back to decision -->
  <path d="M 540 130 L 540 100 L 330 100" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="435" y="94" text-anchor="middle" font-size="11" fill="#888">指针左移一位，回到判定</text>

  <!-- no branch: return acc -->
  <text x="338" y="216" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 330 190 L 330 224" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <rect x="210" y="228" width="240" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="330" y="252" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">return acc</text>
  <text x="330" y="270" text-anchor="middle" font-size="11" fill="#888">已遍历完，acc 即复合结果</text>

  <!-- empty case shortcut -->
  <rect x="40" y="226" width="150" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5,3" rx="8" filter="url(#rough2)"/>
  <text x="115" y="248" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">若 functions = []</text>
  <text x="115" y="266" text-anchor="middle" font-size="11" fill="#333">初始 acc = x 直接返回</text>
  <path d="M 190 253 L 210 253" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- summary -->
  <rect x="40" y="300" width="540" height="44" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="310" y="320" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">一次遍历即可：每个函数恰好调用一次，O(n) 时间 / O(1) 额外空间</text>
  <text x="310" y="338" text-anchor="middle" font-size="11" fill="#888">右折叠天然处理空数组——无函数可取，初值 x 原样返回，即恒等函数</text>

  <text x="310" y="372" text-anchor="middle" font-size="11" fill="#888">⚠️ 顺序不可用 reduce（左折叠）：reduce 会变成 f1 先执行、方向反了</text>
  <text x="310" y="390" text-anchor="middle" font-size="11" fill="#888">（除非先 reverse 再 reduce，但那多一次 O(n) 反转）</text>
</svg>
