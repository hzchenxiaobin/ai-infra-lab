<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">花括号展开II：文法结构与运算优先级</text>

  <!-- Panel A: two operations -->
  <rect x="24" y="44" width="512" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="40" y="66" font-size="12" fill="#446688" font-weight="bold">① 两种运算（类比乘加表达式）</text>

  <!-- concat operation -->
  <rect x="40" y="78" width="230" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="52" y="96" font-size="11" fill="#4a7a3a" font-weight="bold">连接 e₁e₂ （相邻拼接）</text>
  <text x="52" y="112" font-size="10" fill="#555">= 笛卡尔积 × （优先级高）</text>
  <text x="52" y="124" font-size="10" fill="#888">{a,b}{c,d} = {ac,ad,bc,bd}</text>

  <!-- comma operation -->
  <rect x="290" y="78" width="230" height="50" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="302" y="96" font-size="11" fill="#d6a040" font-weight="bold">逗号 e₁,e₂ （逗号分隔）</text>
  <text x="302" y="112" font-size="10" fill="#555">= 并集 ∪ （优先级低）</text>
  <text x="302" y="124" font-size="10" fill="#888">{a,b},{b,c} = {a,b,c}</text>

  <!-- Panel B: grammar -->
  <rect x="24" y="150" width="512" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="40" y="172" font-size="12" fill="#d6a040" font-weight="bold">② 上下文无关文法（每条产生式 → 一个解析函数）</text>

  <text x="44" y="196" font-size="12" fill="#b85450" font-weight="bold">expr</text>
  <text x="84" y="196" font-size="11" fill="#555">→ term ( ',' term )*</text>
  <text x="300" y="196" font-size="10" fill="#888">并集 ∪ → parseExpr</text>

  <text x="44" y="218" font-size="12" fill="#4a7a3a" font-weight="bold">term</text>
  <text x="84" y="218" font-size="11" fill="#555">→ factor+</text>
  <text x="300" y="218" font-size="10" fill="#888">笛卡尔积 × → parseTerm</text>

  <text x="44" y="240" font-size="12" fill="#446688" font-weight="bold">factor</text>
  <text x="84" y="240" font-size="11" fill="#555">→ letter | '{' expr '}'</text>
  <text x="300" y="240" font-size="10" fill="#888">字母 / 递归 → parseFactor</text>

  <!-- Panel C: precedence analogy -->
  <rect x="24" y="260" width="512" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="40" y="282" font-size="12" fill="#4a7a3a" font-weight="bold">③ 优先级：连接(乘) &gt; 逗号(加)，花括号 = 括号</text>
  <text x="40" y="302" font-size="11" fill="#555">{ab,z}</text>
  <text x="92" y="302" font-size="11" fill="#888">先连接 ab 再并集 z</text>
  <text x="250" y="302" font-size="11" fill="#b85450" font-weight="bold">= {ab, z}</text>
  <text x="330" y="302" font-size="10" fill="#888">（不是 {a, bz}）</text>

  <!-- Panel D: parse tree mini example -->
  <rect x="24" y="330" width="512" height="68" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="350" font-size="11" fill="#b85450" font-weight="bold">④ 示例 {a,b}{c,d} 的解析树：</text>

  <rect x="200" y="356" width="60" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="230" y="371" text-anchor="middle" font-size="10" fill="#333">term</text>

  <rect x="120" y="372" width="60" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="150" y="386" text-anchor="middle" font-size="9" fill="#333">{a,b}</text>

  <rect x="280" y="372" width="60" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="386" text-anchor="middle" font-size="9" fill="#333">{c,d}</text>

  <line x1="230" y1="376" x2="180" y2="372" stroke="#666" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="230" y1="376" x2="280" y2="372" stroke="#666" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="380" y="376" font-size="10" fill="#888">连接 → 笛卡尔积</text>
  <text x="380" y="390" font-size="10" fill="#b85450" font-weight="bold">= {ac,ad,bc,bd}</text>
</svg>
