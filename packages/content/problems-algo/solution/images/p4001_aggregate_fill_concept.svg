<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="20" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：缺失时间戳的值 = 下一个更晚时间戳的值</text>

  <g filter="url(#rough2)">
    <text x="185" y="46" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">t = 1</text>
    <text x="295" y="46" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">t = 2</text>
    <text x="405" y="46" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">t = 4</text>
    <text x="515" y="46" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">t = 5</text>

    <text x="112" y="80" text-anchor="end" font-size="11" fill="#33506b" font-weight="bold">series1</text>
    <text x="112" y="124" text-anchor="end" font-size="14" fill="#888">＋</text>
    <text x="112" y="148" text-anchor="end" font-size="11" fill="#2f5d24" font-weight="bold">series2</text>
    <text x="112" y="190" text-anchor="end" font-size="14" fill="#888">＝</text>
    <text x="112" y="222" text-anchor="end" font-size="11" fill="#444" font-weight="bold">聚合</text>

    <rect x="140" y="58" width="90" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="185" y="74" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold">3</text>
    <text x="185" y="88" text-anchor="middle" font-size="8" fill="#666">命中</text>

    <rect x="250" y="58" width="90" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="295" y="74" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold">1</text>
    <text x="295" y="88" text-anchor="middle" font-size="8" fill="#8a6d1a">缺失·借更晚</text>

    <rect x="360" y="58" width="90" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="405" y="74" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold">1</text>
    <text x="405" y="88" text-anchor="middle" font-size="8" fill="#666">命中</text>

    <rect x="470" y="58" width="90" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="515" y="74" text-anchor="middle" font-size="13" fill="#8a3030" font-weight="bold">0</text>
    <text x="515" y="88" text-anchor="middle" font-size="8" fill="#8a3030">无更晚 ⇒ 0</text>

    <path d="M 400 98 C 378 116, 322 116, 302 99" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arrO)"/>
    <text x="351" y="119" text-anchor="middle" font-size="8" fill="#8a6d1a">借 [4,1] 的值</text>

    <rect x="140" y="126" width="90" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="185" y="142" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold">2</text>
    <text x="185" y="156" text-anchor="middle" font-size="8" fill="#8a6d1a">缺失·借更晚</text>

    <rect x="250" y="126" width="90" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="295" y="142" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold">2</text>
    <text x="295" y="156" text-anchor="middle" font-size="8" fill="#666">命中</text>

    <rect x="360" y="126" width="90" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="405" y="142" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold">2</text>
    <text x="405" y="156" text-anchor="middle" font-size="8" fill="#8a6d1a">缺失·借更晚</text>

    <rect x="470" y="126" width="90" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="515" y="142" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold">2</text>
    <text x="515" y="156" text-anchor="middle" font-size="8" fill="#666">命中</text>

    <path d="M 290 166 C 268 184, 212 184, 192 167" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arrO)"/>
    <text x="241" y="187" text-anchor="middle" font-size="8" fill="#8a6d1a">借 [2,2] 的值</text>
    <path d="M 510 166 C 488 184, 432 184, 412 167" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arrO)"/>
    <text x="461" y="187" text-anchor="middle" font-size="8" fill="#8a6d1a">借 [5,2] 的值</text>

    <rect x="140" y="196" width="90" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="185" y="223" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold">[1, 5]</text>
    <rect x="250" y="196" width="90" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="295" y="223" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold">[2, 3]</text>
    <rect x="360" y="196" width="90" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="405" y="223" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold">[4, 3]</text>
    <rect x="470" y="196" width="90" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="515" y="223" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold">[5, 2]</text>

    <rect x="30" y="266" width="18" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="54" y="277" font-size="9.5" fill="#555">命中（时间戳存在）</text>
    <rect x="168" y="266" width="18" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 2"/>
    <text x="192" y="277" font-size="9.5" fill="#555">缺失 → 取下一个更晚</text>
    <rect x="330" y="266" width="18" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="354" y="277" font-size="9.5" fill="#555">无更晚 ⇒ 0</text>

    <text x="280" y="312" text-anchor="middle" font-size="10" fill="#555">并集时间戳 {1, 2, 4, 5}，每点输出 = 两序列取值相加</text>
  </g>
</svg>
