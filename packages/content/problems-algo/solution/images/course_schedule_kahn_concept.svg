<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">拓扑排序判环：不断"剥掉"入度为 0 的节点</text>

  <!-- Edges (drawn before nodes so arrows tuck under badges) -->
  <path d="M 132 196 L 238 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 132 224 L 238 296" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 282 124 L 406 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 282 296 L 406 224" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Nodes -->
  <circle cx="110" cy="210" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="215" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <circle cx="260" cy="110" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="115" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <circle cx="260" cy="310" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="315" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <circle cx="430" cy="210" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="215" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <!-- Indegree badges (upper-right of each node) -->
  <circle cx="130" cy="192" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="130" y="196" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">0</text>

  <circle cx="280" cy="92" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="280" y="96" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">1</text>

  <circle cx="280" cy="292" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">1</text>

  <circle cx="450" cy="192" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="450" y="196" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">2</text>

  <!-- callouts -->
  <text x="110" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">入度=0 先剥</text>
  <text x="395" y="170" text-anchor="middle" font-size="10" fill="#888">入度=2 最后学</text>

  <!-- legend for badges -->
  <rect x="470" y="300" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="490" y="312" font-size="11" fill="#555">角标=入度</text>

  <!-- Bottom note box -->
  <rect x="40" y="330" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#444">删除入度 0 的节点及其出边 → 邻点入度 −1 → 新的入度 0 节点继续删</text>
  <text x="280" y="365" text-anchor="middle" font-size="11" fill="#666">全部删完 = 无环(可完成)；删不动且仍有节点 = 有环(无法完成)</text>
</svg>
