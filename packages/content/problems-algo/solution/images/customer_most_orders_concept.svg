<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：GROUP BY customer_number + COUNT(*) + ORDER BY DESC + LIMIT 1</text>

  <!-- Orders table (left) -->
  <text x="125" y="52" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">Orders（原始表）</text>
  <rect x="30" y="58" width="190" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="75" font-size="9.5" fill="#333">order_number</text>
  <text x="155" y="75" font-size="9.5" fill="#b85450">customer_number</text>
  <line x1="105" y1="58" x2="105" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="84" width="190" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="65" y="99" font-size="9.5" fill="#d6a040" font-weight="bold">1</text>
  <text x="155" y="99" font-size="9.5" fill="#b85450" font-weight="bold">1</text>
  <line x1="105" y1="84" x2="105" y2="106" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="106" width="190" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="65" y="121" font-size="9.5" fill="#446688" font-weight="bold">2</text>
  <text x="155" y="121" font-size="9.5" fill="#b85450" font-weight="bold">2</text>
  <line x1="105" y1="106" x2="105" y2="128" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="128" width="190" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="65" y="143" font-size="9.5" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="155" y="143" font-size="9.5" fill="#b85450" font-weight="bold">3</text>
  <line x1="105" y1="128" x2="105" y2="150" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="150" width="190" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="65" y="165" font-size="9.5" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="155" y="165" font-size="9.5" fill="#b85450" font-weight="bold">3</text>
  <line x1="105" y1="150" x2="105" y2="172" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="125" y="188" text-anchor="middle" font-size="9" fill="#888">↑ 按 customer_number 同色分组</text>

  <!-- Arrow: GROUP BY -->
  <path d="M222 130 L300 130" stroke="#446688" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="261" y="122" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">GROUP BY</text>
  <text x="261" y="148" text-anchor="middle" font-size="9" fill="#446688">customer_number</text>

  <!-- Aggregated buckets (right) -->
  <text x="455" y="52" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">分桶计数结果</text>
  <rect x="305" y="58" width="230" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="75" font-size="9.5" fill="#333">customer_number</text>
  <text x="455" y="75" font-size="9.5" fill="#d6a040">COUNT(*)</text>
  <line x1="405" y1="58" x2="405" y2="84" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="305" y="84" width="230" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="335" y="100" font-size="10" fill="#d6a040" font-weight="bold">1</text>
  <text x="455" y="100" font-size="10" fill="#d6a040" font-weight="bold">1</text>
  <line x1="405" y1="84" x2="405" y2="108" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="305" y="108" width="230" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="335" y="124" font-size="10" fill="#446688" font-weight="bold">2</text>
  <text x="455" y="124" font-size="10" fill="#446688" font-weight="bold">1</text>
  <line x1="405" y1="108" x2="405" y2="132" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="305" y="132" width="230" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="335" y="148" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <text x="455" y="148" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <line x1="405" y1="132" x2="405" y2="156" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="420" y="178" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">ORDER BY COUNT(*) DESC → 3 排首</text>

  <!-- Down arrow to result -->
  <path d="M420 186 L420 214" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="442" y="206" font-size="9" fill="#b85450">LIMIT 1</text>

  <!-- Formula callout -->
  <rect x="60" y="248" width="460" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="270" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">「订单最多」= 「COUNT 最大」</text>
  <text x="290" y="294" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">cnt(c) = COUNT(*) WHERE customer_number = c</text>
  <text x="290" y="312" text-anchor="middle" font-size="9.5" fill="#666">GROUP BY 把同客户的行压成一行，COUNT(*) 数桶内行数即订单数</text>

  <!-- LIMIT 1 note -->
  <rect x="60" y="332" width="460" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="354" font-size="10.5" fill="#b85450" font-weight="bold">⚠ 题目保证「恰好一位客户」订单数严格最多</text>
  <text x="80" y="372" font-size="9.5" fill="#666">所以 ORDER BY COUNT(*) DESC + LIMIT 1 取首行即为唯一答案；</text>
  <text x="80" y="386" font-size="9.5" fill="#666">无需担心并列——进阶版「并列取全部」见第 5 节扩展。</text>
  <text x="80" y="406" font-size="9.5" fill="#888">COUNT(*) 与 COUNT(order_number) 等价（order_number 是主键，恒非 NULL）。</text>
</svg>
