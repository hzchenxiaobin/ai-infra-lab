<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：切词 → 双向夹逼匹配 → 判覆盖</text>

  <!-- Step 1: split -->
  <rect x="140" y="46" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">切分为单词数组</text>
  <text x="260" y="80" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">w1 = split(s1), w2 = split(s2)</text>

  <path d="M 260 92 L 260 110" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: ensure w1 longer -->
  <rect x="120" y="114" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="132" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">保证 w1 为较长者</text>
  <text x="260" y="148" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">if len(w1) &lt; len(w2): swap(w1, w2)</text>

  <path d="M 260 160 L 260 178" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="174" font-size="10" fill="#888" filter="url(#rough2)">n1 ≥ n2</text>

  <!-- Step 3: prefix match -->
  <rect x="100" y="182" width="320" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">前缀匹配（从左向右）</text>
  <text x="260" y="216" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">l = 0</text>
  <text x="260" y="230" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">while l &lt; n2 and w1[l] == w2[l]: l += 1</text>

  <path d="M 260 240 L 260 258" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: suffix match -->
  <rect x="100" y="262" width="320" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">后缀匹配（从右向左）</text>
  <text x="260" y="296" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">r = 0</text>
  <text x="260" y="310" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">while r &lt; n2 and w1[n1−1−r] == w2[n2−1−r]: r += 1</text>

  <path d="M 260 320 L 260 338" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: l + r >= n2 ? -->
  <polygon points="260,342 350,382 260,422 170,382" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="378" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">l + r ≥ n2 ?</text>
  <text x="260" y="394" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">前后缀是否覆盖短句</text>

  <!-- Yes branch: true -->
  <path d="M 260 422 L 260 440" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="436" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="180" y="444" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="470" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 true</text>

  <!-- No branch: false -->
  <path d="M 350 382 L 430 382" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="376" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="430" y="362" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="470" y="388" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 false</text>

  <!-- Footer notes -->
  <path d="M 40 500 L 480 500" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="260" y="518" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">两侧各扫一遍，O(n) 时间 / O(n) 切词空间</text>
  <text x="260" y="532" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">前缀 + 后缀允许重叠（短句被完全吃下时 l + r &gt; n2）</text>
</svg>
