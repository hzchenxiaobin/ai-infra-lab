<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：i mod 10 = i 的最后一位，左到右首个命中即答案</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">nums[i] ∈ [0,9]，逐位比较 i%10 与 nums[i]，命中立即返回</text>

  <!-- Scan arrow above cards -->
  <path d="M 84 58 L 300 58" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="54" text-anchor="middle" font-size="10" fill="#666">从左到右扫描</text>

  <!-- Example label -->
  <text x="28" y="80" font-size="10.5" fill="#666">nums = [4,3,2,1]</text>

  <!-- Card 0: i=0, mismatch -->
  <rect x="70" y="66" width="80" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="110" y="84" text-anchor="middle" font-size="10.5" fill="#888">下标 i</text>
  <text x="110" y="102" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <line x1="80" y1="110" x2="140" y2="110" stroke="#e0c0c0" stroke-width="1" filter="url(#rough2)"/>
  <text x="110" y="124" text-anchor="middle" font-size="10" fill="#888">i%10 / nums[i]</text>
  <text x="110" y="140" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0 ≠ 4</text>

  <!-- Card 1: i=1, mismatch -->
  <rect x="170" y="66" width="80" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="210" y="84" text-anchor="middle" font-size="10.5" fill="#888">下标 i</text>
  <text x="210" y="102" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <line x1="180" y1="110" x2="240" y2="110" stroke="#e0c0c0" stroke-width="1" filter="url(#rough2)"/>
  <text x="210" y="124" text-anchor="middle" font-size="10" fill="#888">i%10 / nums[i]</text>
  <text x="210" y="140" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1 ≠ 3</text>

  <!-- Card 2: i=2, MATCH -->
  <rect x="270" y="66" width="80" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="84" text-anchor="middle" font-size="10.5" fill="#888">下标 i</text>
  <text x="310" y="102" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <line x1="280" y1="110" x2="340" y2="110" stroke="#bcd8b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="310" y="124" text-anchor="middle" font-size="10" fill="#888">i%10 / nums[i]</text>
  <text x="310" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2 == 2 ✓</text>

  <!-- Card 3: i=3, not reached -->
  <rect x="370" y="66" width="80" height="80" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="410" y="84" text-anchor="middle" font-size="10.5" fill="#aaa">下标 i</text>
  <text x="410" y="102" text-anchor="middle" font-size="15" fill="#aaa" font-weight="bold">3</text>
  <line x1="380" y1="110" x2="440" y2="110" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="410" y="124" text-anchor="middle" font-size="10" fill="#aaa">未检查</text>
  <text x="410" y="140" text-anchor="middle" font-size="10.5" fill="#aaa">(提前返回)</text>

  <!-- Arrow from match card down -->
  <path d="M 310 148 L 310 172" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="324" y="166" font-size="11" fill="#4a7a3a" font-weight="bold">命中！返回 2</text>

  <!-- Periodicity note box -->
  <rect x="40" y="190" width="440" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="210" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">i mod 10 的周期性</text>
  <text x="260" y="228" text-anchor="middle" font-size="10.5" fill="#555">i=0..9 时 i%10 = i；i=10..19 时 i%10 = 0..9（每 10 个一循环）</text>
  <text x="260" y="242" text-anchor="middle" font-size="10.5" fill="#555">但 nums[i] 逐位不同，无法跳过 → 仍需逐个检查</text>

  <!-- Bottom insight -->
  <rect x="40" y="260" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">为何无需"找全部再取最小"？</text>
  <text x="260" y="296" text-anchor="middle" font-size="10.5" fill="#555">下标天然升序 → 首个命中的 i 即全局最小，立即返回即最优</text>

  <!-- Footer -->
  <text x="260" y="326" text-anchor="middle" font-size="10" fill="#aaa">时间 O(n)（最坏全扫一遍）· 空间 O(1) · 命中即停</text>
  <text x="260" y="342" text-anchor="middle" font-size="10" fill="#aaa">nums[i] ∈ [0,9] 保证与 i%10 ∈ [0,9] 始终可比</text>
</svg>
