<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：threshold = 4，二分边长 k ∈ [1, 3]</text>

  <!-- ====== mat grid 3x7 ====== -->
  <text x="40" y="58" font-size="11" fill="#888" font-weight="bold">mat（3×7）：</text>

  <!-- 3x3 attempt outline (rows 0-2, cols 0-2) -->
  <rect x="140" y="66" width="120" height="102" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" rx="3" filter="url(#rough2)"/>
  <text x="200" y="60" text-anchor="middle" font-size="10" fill="#b85450">3×3 试探：和=15 &gt; 4 ✗</text>

  <!-- 2x2 winning square (rows 0-1, cols 0-1) -->
  <rect x="140" y="66" width="80" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="3" filter="url(#rough2)"/>
  <text x="180" y="180" text-anchor="middle" font-size="10" fill="#a87020" font-weight="bold">2×2 和=4 ≤ 4 ✓</text>

  <!-- cells: origin x=140 y=66, cell 40x34 -->
  <!-- row 0 -->
  <g filter="url(#rough2)">
    <rect x="140" y="66" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <rect x="180" y="66" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <rect x="220" y="66" width="40" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="260" y="66" width="40" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="300" y="66" width="40" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="340" y="66" width="40" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="380" y="66" width="40" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
  </g>
  <text x="160" y="88" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">1</text>
  <text x="200" y="88" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">1</text>
  <text x="240" y="88" text-anchor="middle" font-size="12" fill="#555">3</text>
  <text x="280" y="88" text-anchor="middle" font-size="12" fill="#555">2</text>
  <text x="320" y="88" text-anchor="middle" font-size="12" fill="#555">4</text>
  <text x="360" y="88" text-anchor="middle" font-size="12" fill="#555">3</text>
  <text x="400" y="88" text-anchor="middle" font-size="12" fill="#555">2</text>

  <!-- row 1 -->
  <g filter="url(#rough2)">
    <rect x="140" y="100" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <rect x="180" y="100" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <rect x="220" y="100" width="40" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="260" y="100" width="40" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="300" y="100" width="40" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="340" y="100" width="40" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="380" y="100" width="40" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
  </g>
  <text x="160" y="122" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">1</text>
  <text x="200" y="122" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">1</text>
  <text x="240" y="122" text-anchor="middle" font-size="12" fill="#555">3</text>
  <text x="280" y="122" text-anchor="middle" font-size="12" fill="#555">2</text>
  <text x="320" y="122" text-anchor="middle" font-size="12" fill="#555">4</text>
  <text x="360" y="122" text-anchor="middle" font-size="12" fill="#555">3</text>
  <text x="400" y="122" text-anchor="middle" font-size="12" fill="#555">2</text>

  <!-- row 2 -->
  <g filter="url(#rough2)">
    <rect x="140" y="134" width="40" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="180" y="134" width="40" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="220" y="134" width="40" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="260" y="134" width="40" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="300" y="134" width="40" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="340" y="134" width="40" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="380" y="134" width="40" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
  </g>
  <text x="160" y="156" text-anchor="middle" font-size="12" fill="#555">1</text>
  <text x="200" y="156" text-anchor="middle" font-size="12" fill="#555">1</text>
  <text x="240" y="156" text-anchor="middle" font-size="12" fill="#555">3</text>
  <text x="280" y="156" text-anchor="middle" font-size="12" fill="#555">2</text>
  <text x="320" y="156" text-anchor="middle" font-size="12" fill="#555">4</text>
  <text x="360" y="156" text-anchor="middle" font-size="12" fill="#555">3</text>
  <text x="400" y="156" text-anchor="middle" font-size="12" fill="#555">2</text>

  <!-- divider -->
  <path d="M 40 200 L 520 200" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Binary search steps ====== -->
  <text x="40" y="224" font-size="11" fill="#888" font-weight="bold">二分过程（min(m,n)=3）：</text>

  <!-- Step 1: [1,3] k=2 -->
  <rect x="40" y="238" width="150" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="115" y="258" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">第 1 轮 [1, 3]</text>
  <text x="115" y="276" text-anchor="middle" font-size="11" fill="#444">k = 2</text>
  <text x="115" y="292" text-anchor="middle" font-size="10.5" fill="#4a7a3a">2×2 和=4 ≤ 4 ✓</text>
  <text x="115" y="308" text-anchor="middle" font-size="10.5" fill="#555">ans=2, lo=3</text>

  <path d="M 190 277 L 218 277" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Step 2: [3,3] k=3 -->
  <rect x="220" y="238" width="150" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="295" y="258" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">第 2 轮 [3, 3]</text>
  <text x="295" y="276" text-anchor="middle" font-size="11" fill="#444">k = 3</text>
  <text x="295" y="292" text-anchor="middle" font-size="10.5" fill="#b85450">3×3 最小和=15 &gt; 4 ✗</text>
  <text x="295" y="308" text-anchor="middle" font-size="10.5" fill="#555">hi=2</text>

  <path d="M 370 277 L 398 277" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Step 3: end -->
  <rect x="400" y="238" width="130" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="465" y="258" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">lo=3 &gt; hi=2</text>
  <text x="465" y="276" text-anchor="middle" font-size="11" fill="#444">循环结束</text>
  <text x="465" y="298" text-anchor="middle" font-size="13" fill="#a87020" font-weight="bold">返回 2</text>

  <!-- note about 3x3 min sum -->
  <rect x="40" y="330" width="480" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#335">注：元素 ≥ 0 ⇒ k 越大正方形和越大（单调），故 3×3 的最小和出现在值最小的左上角 = 15</text>

  <!-- result -->
  <rect x="120" y="384" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="412" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">答案 = 2</text>
</svg>
