<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：应用区间两两不交，匹配的永远是原始 source</text>

  <!-- rule chips -->
  <rect x="88" y="44" width="124" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="59" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">规则0 he→wo 花费3</text>
  <rect x="222" y="44" width="128" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="286" y="59" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">规则1 llo→rld 花费4</text>
  <path d="M 150 66 Q 150 74 158 80" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M 286 66 Q 286 74 280 80" fill="none" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- source row -->
  <text x="104" y="112" text-anchor="end" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">source</text>
  <rect x="116" y="88" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="162" y="88" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="208" y="88" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="254" y="88" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="300" y="88" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="112" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">h</text>
  <text x="183" y="112" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">e</text>
  <text x="229" y="112" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">l</text>
  <text x="275" y="112" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">l</text>
  <text x="321" y="112" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">o</text>
  <!-- dashed group overlays -->
  <rect x="112" y="84" width="96" height="44" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="5,4" rx="6" filter="url(#rough2)"/>
  <rect x="204" y="84" width="150" height="44" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5,4" rx="6" filter="url(#rough2)"/>

  <!-- replace arrows -->
  <path d="M 160 130 L 160 166" fill="none" stroke="#446688" stroke-width="2.2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 279 130 L 279 166" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="219" y="153" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">等长整段替换</text>

  <!-- target row -->
  <text x="104" y="194" text-anchor="end" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">target</text>
  <rect x="116" y="170" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="162" y="170" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="208" y="170" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="254" y="170" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="300" y="170" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="194" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">w</text>
  <text x="183" y="194" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">o</text>
  <text x="229" y="194" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">r</text>
  <text x="275" y="194" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">l</text>
  <text x="321" y="194" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">d</text>

  <text x="229" y="232" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">总成本 = 3 + 4 = 7（对应示例 1）</text>

  <!-- wildcard inset -->
  <rect x="372" y="84" width="136" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="440" y="104" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">通配符：'*' 任意匹配</text>
  <text x="408" y="109" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="436" y="109" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">*</text>
  <text x="464" y="109" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">t</text>
  <rect x="396" y="112" width="24" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="424" y="112" width="24" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="452" y="112" width="24" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="408" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c</text>
  <text x="436" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <text x="464" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">t</text>
  <text x="440" y="150" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">'*' 每出现一次成本 +1</text>
  <text x="440" y="165" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">如 c*t→dog：花费 2+1=3</text>

  <!-- bottom observations -->
  <rect x="36" y="252" width="448" height="158" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">三个关键推论</text>
  <text x="52" y="300" font-size="11" fill="#333" filter="url(#rough2)">① 位置用过即锁死 ⇒ 所有应用的区间两两不交（图中蓝、绿两段）</text>
  <text x="52" y="324" font-size="11" fill="#333" filter="url(#rough2)">② 每次应用只改自己区间内的字符 ⇒ 任何一次应用匹配的都是</text>
  <text x="64" y="342" font-size="11" fill="#333" filter="url(#rough2)">原始 source 的字符 ⇒ 应用顺序无关，先贴谁后贴谁都一样</text>
  <text x="52" y="366" font-size="11" fill="#333" filter="url(#rough2)">③ 未被覆盖的位置保持不动 ⇒ 必须 source[i] == target[i]；</text>
  <text x="64" y="384" font-size="11" fill="#333" filter="url(#rough2)">被覆盖区间的终态恰为 replacement ⇒ 必须逐位等于 target 对应段</text>
</svg>
