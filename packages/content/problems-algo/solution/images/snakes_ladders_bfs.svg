<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="720" height="460" fill="#fafafa"/>

  <!-- Title -->
  <g filter="url(#rough2)">
    <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">蛇梯棋：BFS 逐层扩展（每层 = 一次掷骰）</text>
    <path d="M 150 36 Q 360 42 570 36" stroke="#aaa" stroke-width="1" fill="none"/>
  </g>

  <!-- ===== Layer 0 ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="56" width="640" height="44" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  </g>
  <g filter="url(#rough2)" font-size="11">
    <text x="56" y="82" fill="#888" font-weight="bold">Layer 0</text>
    <text x="56" y="96" font-size="9" fill="#aaa">0 次掷骰</text>
    <!-- node 1 (highlighted) -->
    <rect x="340" y="64" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="360" y="83" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">1</text>
  </g>

  <!-- Arrow layer0→layer1 -->
  <g filter="url(#rough2)">
    <path d="M 360 100 L 360 124" stroke="#4a8edb" stroke-width="1.5" fill="none" marker-end="url(#arrD)"/>
    <text x="374" y="116" font-size="9" fill="#4a8edb">掷骰 1-6</text>
    <text x="374" y="128" font-size="8" fill="#4a7a3a">2 →梯子→ 15</text>
  </g>

  <!-- ===== Layer 1 ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="132" width="640" height="44" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  </g>
  <g filter="url(#rough2)" font-size="11">
    <text x="56" y="158" fill="#888" font-weight="bold">Layer 1</text>
    <text x="56" y="172" font-size="9" fill="#aaa">1 次掷骰</text>
    <!-- nodes: 15(highlighted) 3 4 5 6 7 -->
    <rect x="180" y="140" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="200" y="159" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">15</text>
    <rect x="236" y="140" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="256" y="159" text-anchor="middle" font-size="12" fill="#333">3</text>
    <rect x="292" y="140" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="312" y="159" text-anchor="middle" font-size="12" fill="#333">4</text>
    <rect x="348" y="140" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="368" y="159" text-anchor="middle" font-size="12" fill="#333">5</text>
    <rect x="404" y="140" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="424" y="159" text-anchor="middle" font-size="12" fill="#333">6</text>
    <rect x="460" y="140" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="480" y="159" text-anchor="middle" font-size="12" fill="#333">7</text>
  </g>

  <!-- Arrow layer1→layer2 -->
  <g filter="url(#rough2)">
    <path d="M 200 176 L 200 200" stroke="#4a8edb" stroke-width="1.5" fill="none" marker-end="url(#arrD)"/>
    <text x="214" y="192" font-size="9" fill="#4a8edb">掷骰 1-6</text>
    <text x="214" y="204" font-size="8" fill="#b85450">17 →蛇→ 13</text>
  </g>

  <!-- ===== Layer 2 ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="208" width="640" height="44" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  </g>
  <g filter="url(#rough2)" font-size="11">
    <text x="56" y="234" fill="#888" font-weight="bold">Layer 2</text>
    <text x="56" y="248" font-size="9" fill="#aaa">2 次掷骰</text>
    <!-- nodes: 13(highlighted) 16 18 19 20 21 ... -->
    <rect x="180" y="216" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="200" y="235" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">13</text>
    <rect x="236" y="216" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="256" y="235" text-anchor="middle" font-size="12" fill="#333">16</text>
    <rect x="292" y="216" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="312" y="235" text-anchor="middle" font-size="12" fill="#333">18</text>
    <rect x="348" y="216" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="368" y="235" text-anchor="middle" font-size="12" fill="#333">19</text>
    <rect x="404" y="216" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="424" y="235" text-anchor="middle" font-size="12" fill="#333">20</text>
    <text x="470" y="235" font-size="12" fill="#aaa">…</text>
  </g>

  <!-- Arrow layer2→layer3 -->
  <g filter="url(#rough2)">
    <path d="M 200 252 L 200 276" stroke="#4a8edb" stroke-width="1.5" fill="none" marker-end="url(#arrD)"/>
    <text x="214" y="268" font-size="9" fill="#4a8edb">掷骰 1-6</text>
    <text x="214" y="280" font-size="8" fill="#4a7a3a">14 →梯子→ 35</text>
  </g>

  <!-- ===== Layer 3 ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="284" width="640" height="44" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  </g>
  <g filter="url(#rough2)" font-size="11">
    <text x="56" y="310" fill="#888" font-weight="bold">Layer 3</text>
    <text x="56" y="324" font-size="9" fill="#aaa">3 次掷骰</text>
    <rect x="180" y="292" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="200" y="311" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">35</text>
    <text x="236" y="311" font-size="12" fill="#aaa">…</text>
  </g>

  <!-- Arrow layer3→layer4 -->
  <g filter="url(#rough2)">
    <path d="M 200 328 L 200 352" stroke="#4a8edb" stroke-width="1.5" fill="none" marker-end="url(#arrD)"/>
    <text x="214" y="344" font-size="9" fill="#4a8edb">掷骰 1</text>
    <text x="214" y="356" font-size="8" fill="#888">直达 36</text>
  </g>

  <!-- ===== Layer 4 ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="360" width="640" height="44" rx="8" fill="#f0f7e8" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)" font-size="11">
    <text x="56" y="386" fill="#4a7a3a" font-weight="bold">Layer 4</text>
    <text x="56" y="400" font-size="9" fill="#6a9a5a">4 次掷骰 ✓</text>
    <rect x="180" y="368" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="200" y="387" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">36</text>
    <text x="240" y="387" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 到达终点！</text>
  </g>

  <!-- Bottom note -->
  <g filter="url(#rough2)">
    <rect x="40" y="418" width="640" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <text x="360" y="438" text-anchor="middle" font-size="10" fill="#446688">每层 = 一次掷骰 → BFS 层数 = 最少掷骰次数 = 4</text>
  </g>
</svg>
