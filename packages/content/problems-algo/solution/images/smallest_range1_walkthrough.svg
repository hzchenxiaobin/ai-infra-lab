<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：两种情形对比</text>

  <!-- ===== Example 1: nums=[0,10], k=2 ===== -->
  <text x="40" y="52" font-size="12" fill="#888" font-weight="bold">示例 1：nums = [0, 10], k = 2</text>

  <!-- cells -->
  <rect x="120" y="62" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="84" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="176" y="62" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="84" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">10</text>

  <!-- compute -->
  <text x="250" y="84" font-size="12" fill="#555">→ mx=10, mn=0, 2k=4</text>

  <!-- number line -->
  <line x1="80" y1="120" x2="480" y2="120" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 480 120 L 472 116 L 472 124 z" fill="#999" filter="url(#rough2)"/>

  <!-- original range -->
  <rect x="120" y="114" width="240" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="120" y="108" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0</text>
  <text x="360" y="108" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">10</text>

  <!-- adjusted range -->
  <rect x="168" y="140" width="144" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="168" y="166" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">0+2=2</text>
  <text x="312" y="166" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">10−2=8</text>

  <!-- gap bracket -->
  <path d="M 168 178 L 168 174 L 312 174 L 312 178" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="240" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">差值 = 8 − 2 = 6 ✓</text>

  <!-- answer box -->
  <rect x="120" y="198" width="280" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="216" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">max(0, 10 − 0 − 4) = 6</text>

  <!-- ===== Example 2: nums=[1,3,6], k=3 ===== -->
  <text x="40" y="248" font-size="12" fill="#888" font-weight="bold">示例 2：nums = [1, 3, 6], k = 3</text>

  <!-- cells -->
  <rect x="100" y="258" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="280" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="150" y="258" width="50" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="280" text-anchor="middle" font-size="15" fill="#999" font-weight="bold">3</text>
  <rect x="200" y="258" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="280" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">6</text>

  <text x="265" y="280" font-size="12" fill="#555">→ mx=6, mn=1, 2k=6</text>

  <!-- number line -->
  <line x1="80" y1="316" x2="480" y2="316" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 480 316 L 472 312 L 472 320 z" fill="#999" filter="url(#rough2)"/>

  <!-- original range -->
  <rect x="140" y="310" width="180" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="140" y="304" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="320" y="304" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">6</text>

  <!-- adjusted range: overlap -->
  <rect x="180" y="336" width="200" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="180" y="362" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1+3=4</text>
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">6−3=3</text>

  <!-- overlap shaded -->
  <rect x="260" y="336" width="40" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">重叠</text>

  <text x="380" y="345" font-size="11" fill="#4a7a3a" font-weight="bold">4 ≥ 3 → 差值为 0</text>

  <!-- answer box -->
  <rect x="120" y="384" width="280" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="402" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">max(0, 6 − 1 − 6) = max(0, −1) = 0 ✓</text>

  <!-- summary -->
  <text x="280" y="428" text-anchor="middle" font-size="11" fill="#888">两例验证公式：max(0, max − min − 2k)</text>
</svg>
