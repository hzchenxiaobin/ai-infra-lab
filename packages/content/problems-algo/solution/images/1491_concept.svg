<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    核心：去掉 min 与 max，对中间 n−2 项求均值
  </text>
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    salary = [4000, 3000, 1000, 2000]
  </text>

  <!-- 基线 -->
  <path d="M 80 290 L 470 290" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- idx0: 4000 = MAX（排除）  height 200 -> top y=90 -->
  <rect x="110" y="90" width="60" height="200" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="140" y="84" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">max ✗ 排除</text>
  <text x="140" y="110" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4000</text>

  <!-- idx1: 3000  保留  height 150 -> top y=140 -->
  <rect x="200" y="140" width="60" height="150" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="134" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">保留 ✓</text>
  <text x="230" y="160" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3000</text>

  <!-- idx2: 1000 = MIN（排除）  height 50 -> top y=240 -->
  <rect x="290" y="240" width="60" height="50" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="320" y="234" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">min ✗ 排除</text>
  <text x="320" y="260" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1000</text>

  <!-- idx3: 2000  保留  height 100 -> top y=190 -->
  <rect x="380" y="190" width="60" height="100" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="184" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">保留 ✓</text>
  <text x="410" y="210" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2000</text>

  <!-- 索引 -->
  <text x="140" y="308" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>
  <text x="230" y="308" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="320" y="308" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2</text>
  <text x="410" y="308" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3</text>

  <!-- 求均值的括号：圈住中间两项 -->
  <path d="M 200 330 L 200 322 L 410 322 L 410 330" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="305" y="346" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">中间 n−2 = 2 项求均值</text>

  <!-- 公式说明框 -->
  <rect x="70" y="356" width="420" height="20" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="280" y="371" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    avg = (total − min − max) / (n − 2) = (10000 − 4000 − 1000) / 2 = 2500
  </text>
</svg>
