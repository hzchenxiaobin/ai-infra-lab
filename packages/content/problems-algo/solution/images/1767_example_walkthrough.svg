<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：3 个任务展开 9 个子任务对</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">逐对判定是否在 Executed 中：✓ 已执行 / ✗ 未执行</text>

  <!-- Row label -->
  <text x="92" y="86" text-anchor="end" font-size="11" fill="#555" font-weight="bold">task 1</text>
  <!-- (1,1) not executed red -->
  <rect x="104" y="68" width="72" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="140" y="86" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1, 1</text>
  <text x="140" y="98" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <!-- (1,2) executed green -->
  <rect x="184" y="68" width="72" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="220" y="86" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1, 2</text>
  <text x="220" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <!-- (1,3) not executed red -->
  <rect x="264" y="68" width="72" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="300" y="86" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1, 3</text>
  <text x="300" y="98" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>

  <!-- Row task 2 -->
  <text x="92" y="146" text-anchor="end" font-size="11" fill="#555" font-weight="bold">task 2</text>
  <rect x="104" y="128" width="72" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="140" y="146" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2, 1</text>
  <text x="140" y="158" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <rect x="184" y="128" width="72" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="220" y="146" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2, 2</text>
  <text x="220" y="158" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>

  <!-- Row task 3 -->
  <text x="92" y="206" text-anchor="end" font-size="11" fill="#555" font-weight="bold">task 3</text>
  <rect x="104" y="188" width="72" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="140" y="206" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3, 1</text>
  <text x="140" y="218" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="184" y="188" width="72" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="220" y="206" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3, 2</text>
  <text x="220" y="218" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="264" y="188" width="72" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="206" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3, 3</text>
  <text x="300" y="218" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="344" y="188" width="72" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="380" y="206" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3, 4</text>
  <text x="380" y="218" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- arrow down -->
  <path d="M 240 234 L 240 256" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result label -->
  <text x="240" y="276" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">WHERE Executed.subtask_id IS NULL → 保留 ✗</text>

  <!-- Result chips -->
  <rect x="60" y="292" width="80" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="100" y="316" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1, 1</text>
  <rect x="150" y="292" width="80" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="190" y="316" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1, 3</text>
  <rect x="240" y="292" width="80" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2, 1</text>
  <rect x="330" y="292" width="80" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="370" y="316" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2, 2</text>

  <!-- Note -->
  <rect x="60" y="340" width="440" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">9 个子任务对 − 5 个已执行 = 4 个未执行</text>
</svg>
