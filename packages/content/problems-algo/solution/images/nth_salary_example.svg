<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">同一表 [100,200,300]，不同 N 的取值演算</text>

  <!-- Shared distinct sorted list (top center) -->
  <text x="290" y="52" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">去重降序后：[300, 200, 100]（共 3 个不同值）</text>

  <!-- Case A: N=1 -->
  <rect x="20" y="68" width="175" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="107" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">N = 1：取第 1 高</text>

  <rect x="35" y="100" width="145" height="20" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="114" font-size="9" fill="#333">300</text>
  <text x="90" y="114" font-size="9" fill="#888">200</text>
  <text x="130" y="114" font-size="9" fill="#888">100</text>

  <rect x="35" y="120" width="48" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="59" y="134" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">300</text>
  <text x="100" y="134" font-size="9" fill="#d6a040">↑ OFFSET 0</text>

  <rect x="30" y="148" width="155" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="107" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">第 1 高 = 300 ✓</text>

  <text x="107" y="188" text-anchor="middle" font-size="9" fill="#888">SET N=0; OFFSET 0 取首个</text>

  <!-- Case B: N=2 -->
  <rect x="205" y="68" width="175" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="292" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">N = 2：取第 2 高（即 176）</text>

  <rect x="220" y="100" width="145" height="20" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="114" font-size="9" fill="#888">300</text>
  <text x="275" y="114" font-size="9" fill="#333">200</text>
  <text x="315" y="114" font-size="9" fill="#888">100</text>

  <rect x="265" y="120" width="48" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="289" y="134" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">200</text>
  <text x="330" y="134" font-size="9" fill="#d6a040">↑ OFFSET 1</text>

  <rect x="215" y="148" width="155" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="292" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">第 2 高 = 200 ✓</text>

  <text x="292" y="188" text-anchor="middle" font-size="9" fill="#888">SET N=1; OFFSET 1 跳过最高</text>

  <!-- Case C: N=4 (out of range) -->
  <rect x="390" y="68" width="175" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="477" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">N = 4：超出不同值个数</text>

  <rect x="405" y="100" width="145" height="20" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="114" font-size="9" fill="#888">300</text>
  <text x="460" y="114" font-size="9" fill="#888">200</text>
  <text x="500" y="114" font-size="9" fill="#888">100</text>

  <rect x="445" y="120" width="65" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="477" y="134" text-anchor="middle" font-size="10" fill="#b85450">（无）</text>
  <text x="510" y="134" font-size="9" fill="#b85450">OFFSET 3</text>

  <rect x="400" y="148" width="155" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="477" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">第 4 高 = NULL ✓</text>

  <text x="477" y="188" text-anchor="middle" font-size="9" fill="#b85450">空集 → 外包装塌缩为 NULL 行</text>

  <!-- Bottom summary -->
  <rect x="40" y="208" width="500" height="158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="228" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">💡 OFFSET = N − 1 是本题的核心映射</text>
  <text x="60" y="248" font-size="10" fill="#333">• 第 N 高 ⟺ 跳过前 N−1 个不同值，取下一个 → LIMIT 1 OFFSET N−1</text>
  <text x="60" y="266" font-size="10" fill="#333">• N 是函数参数，MySQL 中 OFFSET 须为常量 → 用 SET N = N − 1 把参数转为局部变量</text>
  <text x="60" y="284" font-size="10" fill="#4a7a3a">  N=1 → OFFSET 0 取最高（即 MAX）</text>
  <text x="60" y="300" font-size="10" fill="#4a7a3a">  N=2 → OFFSET 1 取次高（退化到 176 题）</text>
  <text x="60" y="316" font-size="10" fill="#b85450">  N &gt; 不同值个数 → 子查询返回空集，须外层 SELECT (…) 包装成 NULL 行</text>
  <text x="60" y="334" font-size="10" fill="#333">• DENSE_RANK 写法把 OFFSET 换成 WHERE rk = N，并列同号语义更直观</text>
  <text x="60" y="352" font-size="10" fill="#333">• 两种写法都需「空集→NULL」包装：解法 A/B 均套一层 SELECT ( 子查询 )</text>
</svg>
