<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：一轮前缀和 = 一次「帕斯卡规则」</text>

  <text x="30" y="52" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">① 递推表：a 的演化（下标 i →，秒数 t ↓）</text>

  <text x="90" y="74" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="134" y="74" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="178" y="74" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="222" y="74" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">i=3</text>

  <text x="62" y="104" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">t=0</text>
  <text x="62" y="140" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">t=1</text>
  <text x="62" y="176" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">t=2</text>
  <text x="62" y="212" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">t=3</text>

  <rect x="70" y="84" width="40" height="32" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="105" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <rect x="114" y="84" width="40" height="32" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="134" y="105" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <rect x="158" y="84" width="40" height="32" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="105" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <rect x="202" y="84" width="40" height="32" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="222" y="105" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>

  <rect x="70" y="120" width="40" height="32" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="141" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <rect x="114" y="120" width="40" height="32" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="134" y="141" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <rect x="158" y="120" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="141" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="202" y="120" width="40" height="32" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="222" y="141" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">4</text>

  <rect x="70" y="156" width="40" height="32" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="177" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <rect x="114" y="156" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="134" y="177" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="158" y="156" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="177" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="202" y="156" width="40" height="32" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="222" y="177" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">10</text>

  <rect x="70" y="192" width="40" height="32" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="213" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <rect x="114" y="192" width="40" height="32" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="134" y="213" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">4</text>
  <rect x="158" y="192" width="40" height="32" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="213" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">10</text>
  <rect x="202" y="192" width="40" height="32" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="222" y="213" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">20</text>

  <path d="M 152 172 L 172 172" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 178 150 L 178 168" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="30" y="244" width="18" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="56" y="258" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">左邻的新值 f(i−1, t)（绿箭头）</text>
  <rect x="30" y="272" width="18" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="56" y="286" font-size="10.5" fill="#446688" filter="url(#rough2)">自己的旧值 f(i, t−1)（蓝箭头）</text>
  <rect x="30" y="300" width="18" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="56" y="314" font-size="10.5" fill="#b85450" filter="url(#rough2)">新值 f(i, t) = 两者之和（红格）</text>

  <text x="285" y="52" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">② 把求和拆开</text>

  <rect x="270" y="62" width="232" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="386" y="84" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">新 a[i] = a[0]+⋯+a[i]（旧值求和）</text>
  <text x="386" y="103" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">= (a[0]+⋯+a[i−1]) + a[i]</text>
  <text x="386" y="122" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">= 新 a[i−1] + 旧 a[i]</text>

  <rect x="270" y="148" width="232" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="386" y="171" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">恰好是杨辉三角的「帕斯卡规则」</text>
  <text x="386" y="192" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">边界：f(i, 0) = 1，f(0, t) = 1</text>

  <rect x="270" y="218" width="232" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="386" y="241" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">归纳得 f(i, t) = C(i+t, t)</text>
  <text x="386" y="262" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">（相当于把杨辉三角斜着铺进表格）</text>

  <rect x="30" y="330" width="472" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="266" y="356" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = a[n−1] 第 k 秒的值 = f(n−1, k) = C(n+k−1, k)</text>
  <text x="266" y="382" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">验证：n=4, k=5 ⇒ C(8,5) = 56 ✓；n=5, k=3 ⇒ C(7,3) = 35 ✓</text>
</svg>
