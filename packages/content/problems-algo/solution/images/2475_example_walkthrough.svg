<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold">示例演算：nums=[4,4,2,4,3]，n=5 → 不等三元组 = 3</text>

  <!-- nums array -->
  <text x="92" y="64" font-size="12" fill="#888">nums =</text>
  <rect x="170" y="44" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="192" y="66" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">4</text>
  <rect x="214" y="44" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="236" y="66" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">4</text>
  <rect x="258" y="44" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="16" fill="#333">2</text>
  <rect x="302" y="44" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="324" y="66" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">4</text>
  <rect x="346" y="44" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="368" y="66" text-anchor="middle" font-size="16" fill="#333">3</text>

  <text x="192" y="92" text-anchor="middle" font-size="9.5" fill="#888">i=0</text>
  <text x="236" y="92" text-anchor="middle" font-size="9.5" fill="#888">i=1</text>
  <text x="280" y="92" text-anchor="middle" font-size="9.5" fill="#888">i=2</text>
  <text x="324" y="92" text-anchor="middle" font-size="9.5" fill="#888">i=3</text>
  <text x="368" y="92" text-anchor="middle" font-size="9.5" fill="#888">i=4</text>

  <!-- arrow -->
  <path d="M 280 100 L 280 116" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="112" font-size="11" fill="#446688">① 统计频次：4→3，2→1，3→1</text>

  <!-- total -->
  <rect x="150" y="122" width="260" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="142" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">② 全部三元组 C(5,3) = 10</text>

  <path d="M 280 154 L 280 170" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="166" font-size="11" fill="#b85450">③ 逐值减去「等值三元组」</text>

  <!-- freq table: columns x boundaries: 60,150,210,300,440,510 -->
  <!-- header -->
  <rect x="60" y="176" width="450" height="26" fill="#f4f7fb" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="150" y1="176" x2="150" y2="202" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="210" y1="176" x2="210" y2="202" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="300" y1="176" x2="300" y2="202" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="440" y1="176" x2="440" y2="202" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="193" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">值 v</text>
  <text x="180" y="193" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">cnt c</text>
  <text x="255" y="193" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">C(c,3)</text>
  <text x="370" y="193" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">C(c,2)·(n−c)</text>
  <text x="475" y="193" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">小计</text>

  <!-- row 4 -->
  <rect x="60" y="202" width="450" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="150" y1="202" x2="150" y2="228" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="210" y1="202" x2="210" y2="228" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="300" y1="202" x2="300" y2="228" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="440" y1="202" x2="440" y2="228" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="219" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">4</text>
  <text x="180" y="219" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>
  <text x="255" y="219" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="370" y="219" text-anchor="middle" font-size="11" fill="#333">3·2 = 6</text>
  <text x="475" y="219" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">7</text>

  <!-- row 2 -->
  <rect x="60" y="228" width="450" height="26" fill="#fafafa" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="150" y1="228" x2="150" y2="254" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="210" y1="228" x2="210" y2="254" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="300" y1="228" x2="300" y2="254" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="440" y1="228" x2="440" y2="254" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="245" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">2</text>
  <text x="180" y="245" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="255" y="245" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="370" y="245" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="475" y="245" text-anchor="middle" font-size="11" fill="#888">0</text>

  <!-- row 3 -->
  <rect x="60" y="254" width="450" height="26" fill="#fafafa" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="150" y1="254" x2="150" y2="280" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="210" y1="254" x2="210" y2="280" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="300" y1="254" x2="300" y2="280" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="440" y1="254" x2="440" y2="280" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="271" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">3</text>
  <text x="180" y="271" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="255" y="271" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="370" y="271" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="475" y="271" text-anchor="middle" font-size="11" fill="#888">0</text>

  <!-- sum row -->
  <rect x="60" y="280" width="450" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="255" y="297" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">等值三元组合计（要减去的）</text>
  <text x="475" y="297" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">7</text>

  <!-- arrow down -->
  <path d="M 280 308 L 280 324" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="110" y="328" width="340" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">④ ans = 10 − 7 = 3 ✓</text>

  <!-- note -->
  <rect x="40" y="386" width="480" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="406" text-anchor="middle" font-size="10.5" fill="#333">值 4 出现 3 次：C(3,3)=1 个全等三元组 + C(3,2)·(5−3)=6 个「两 4 一异」三元组。</text>
  <text x="280" y="422" text-anchor="middle" font-size="10.5" fill="#333">值 2、3 各 1 次：组合数天然为 0，不贡献等值三元组。10 − 7 = 3。</text>
  <text x="280" y="438" text-anchor="middle" font-size="10" fill="#888">三个合法三元组：(0,2,4)·(1,2,4)·(2,3,4)，值均为 4≠2≠3。</text>
</svg>
