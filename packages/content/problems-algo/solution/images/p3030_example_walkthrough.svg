<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 2 演算：threshold = 12</text>

  <!-- left: image grid 3 cols x 4 rows, cell 46 -->
  <text x="105" y="52" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">image（4×3）</text>

  <g filter="url(#rough2)">
    <rect x="36" y="64" width="46" height="46" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="82" y="64" width="46" height="46" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="128" y="64" width="46" height="46" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="36" y="110" width="46" height="46" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="82" y="110" width="46" height="46" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="128" y="110" width="46" height="46" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="36" y="156" width="46" height="46" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="82" y="156" width="46" height="46" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="128" y="156" width="46" height="46" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="36" y="202" width="46" height="46" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="82" y="202" width="46" height="46" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="128" y="202" width="46" height="46" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
  </g>

  <!-- region 1 overlay rows0-2 -->
  <rect x="36" y="64" width="138" height="138" fill="#446688" fill-opacity="0.10" stroke="#446688" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="42" y="60" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">区域①</text>

  <!-- region 2 overlay rows1-3 -->
  <rect x="36" y="110" width="138" height="138" fill="#4a7a3a" fill-opacity="0.10" stroke="#4a7a3a" stroke-width="2.2" stroke-dasharray="7 5" rx="3" filter="url(#rough2)"/>
  <text x="88" y="266" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">区域②</text>

  <g font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="59" y="92">10</text><text x="105" y="92">20</text><text x="151" y="92">30</text>
    <text x="59" y="138">15</text><text x="105" y="138">25</text><text x="151" y="138">35</text>
    <text x="59" y="184">20</text><text x="105" y="184">30</text><text x="151" y="184">40</text>
    <text x="59" y="230">25</text><text x="105" y="230">35</text><text x="151" y="230">45</text>
  </g>

  <!-- middle cards -->
  <rect x="196" y="84" width="122" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="257" y="104" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">区域①（行 0-2）</text>
  <text x="257" y="121" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">sum=225，avg=25</text>
  <text x="257" y="136" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">⌊225/9⌋ = 25</text>

  <rect x="196" y="164" width="122" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="257" y="184" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">区域②（行 1-3）</text>
  <text x="257" y="201" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">sum=270，avg=30</text>
  <text x="257" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">⌊270/9⌋ = 30</text>

  <rect x="196" y="240" width="122" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="257" y="258" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">横差=10，竖差=5</text>
  <text x="257" y="274" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">全 ≤ 12 ✓ 两个都达标</text>

  <!-- right: result grid -->
  <text x="421" y="52" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">result</text>

  <g filter="url(#rough2)">
    <rect x="352" y="64" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2"/>
    <rect x="398" y="64" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2"/>
    <rect x="444" y="64" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2"/>
    <rect x="352" y="110" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2"/>
    <rect x="398" y="110" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2"/>
    <rect x="444" y="110" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2"/>
    <rect x="352" y="156" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2"/>
    <rect x="398" y="156" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2"/>
    <rect x="444" y="156" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2"/>
    <rect x="352" y="202" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2"/>
    <rect x="398" y="202" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2"/>
    <rect x="444" y="202" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2"/>
  </g>

  <g font-size="14" fill="#333" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="375" y="92">25</text><text x="421" y="92">25</text><text x="467" y="92">25</text>
    <text x="375" y="138">27</text><text x="421" y="138">27</text><text x="467" y="138">27</text>
    <text x="375" y="184">27</text><text x="421" y="184">27</text><text x="467" y="184">27</text>
    <text x="375" y="230">30</text><text x="421" y="230">30</text><text x="467" y="230">30</text>
  </g>

  <!-- derivation strip -->
  <rect x="36" y="300" width="454" height="66" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="263" y="322" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">行 0 仅属①：⌊25/1⌋ = 25　　行 3 仅属②：⌊30/1⌋ = 30</text>
  <text x="263" y="342" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">行 1·2 属①+②：⌊(25+30)/2⌋ = ⌊27.5⌋ = 27</text>
  <text x="263" y="358" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">（蓝=只用区域①，黄=两区域聚合，绿=只用区域②）</text>
</svg>
