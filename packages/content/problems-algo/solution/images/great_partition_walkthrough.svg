<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums=[1,2,3,4], k=4 → dp 演化</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">dp[j] = 和恰为 j 的子集个数；橙底 = 本轮被更新的格子</text>

  <!-- Table grid -->
  <!-- column x boundaries: 45,115,170,225,280,335,465,515 -->
  <!-- header row y=60..92 -->

  <!-- Header background -->
  <rect x="45" y="60" width="470" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <line x1="115" y1="60" x2="115" y2="92" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="170" y1="60" x2="170" y2="92" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="225" y1="60" x2="225" y2="92" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="280" y1="60" x2="280" y2="92" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="335" y1="60" x2="335" y2="92" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="465" y1="60" x2="465" y2="92" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="80" y="80" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">处理x</text>
  <text x="142" y="80" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">dp[0]</text>
  <text x="197" y="80" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">dp[1]</text>
  <text x="252" y="80" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">dp[2]</text>
  <text x="307" y="80" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">dp[3]</text>
  <text x="400" y="80" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">新增子集(和&lt;4)</text>
  <text x="490" y="80" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">bad</text>

  <!-- Data rows: each 30 high, start y=92 -->
  <!-- Row 1: 初始 -->
  <rect x="45" y="92" width="470" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="111" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">初始</text>
  <text x="142" y="111" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="197" y="111" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="252" y="111" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="307" y="111" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="400" y="111" text-anchor="middle" font-size="10.5" fill="#666">{ }(0)</text>
  <text x="490" y="111" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">1</text>

  <!-- Row 2: x=1 -->
  <rect x="45" y="122" width="470" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="141" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">1</text>
  <text x="142" y="141" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="170" y="124" width="55" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="197" y="141" text-anchor="middle" font-size="11.5" fill="#7a5a20" font-weight="bold">1</text>
  <text x="252" y="141" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="307" y="141" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="400" y="141" text-anchor="middle" font-size="10.5" fill="#666">{1}(1)</text>
  <text x="490" y="141" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">2</text>

  <!-- Row 3: x=2 -->
  <rect x="45" y="152" width="470" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="171" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">2</text>
  <text x="142" y="171" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="197" y="171" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="225" y="154" width="55" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="252" y="171" text-anchor="middle" font-size="11.5" fill="#7a5a20" font-weight="bold">1</text>
  <rect x="280" y="154" width="55" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="307" y="171" text-anchor="middle" font-size="11.5" fill="#7a5a20" font-weight="bold">1</text>
  <text x="400" y="171" text-anchor="middle" font-size="10.5" fill="#666">{2}(2),{1,2}(3)</text>
  <text x="490" y="171" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">4</text>

  <!-- Row 4: x=3 -->
  <rect x="45" y="182" width="470" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="201" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">3</text>
  <text x="142" y="201" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="197" y="201" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="252" y="201" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="280" y="184" width="55" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="201" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="400" y="201" text-anchor="middle" font-size="10.5" fill="#666">{3}(3)</text>
  <text x="490" y="201" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">5</text>

  <!-- Row 5: x=4 skip -->
  <rect x="45" y="212" width="470" height="30" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="231" text-anchor="middle" font-size="11" fill="#999" font-weight="bold">4</text>
  <text x="142" y="231" text-anchor="middle" font-size="11" fill="#999">1</text>
  <text x="197" y="231" text-anchor="middle" font-size="11" fill="#999">1</text>
  <text x="252" y="231" text-anchor="middle" font-size="11" fill="#999">1</text>
  <text x="307" y="231" text-anchor="middle" font-size="11" fill="#999">2</text>
  <text x="400" y="231" text-anchor="middle" font-size="10.5" fill="#999">— (x≥k 跳过)</text>
  <text x="490" y="231" text-anchor="middle" font-size="11" fill="#999" font-weight="bold">5</text>

  <!-- Note for dp[3]=2 -->
  <text x="307" y="255" text-anchor="middle" font-size="9.5" fill="#b85450">↑ {1,2} 与 {3} 都凑出和 3</text>

  <!-- Final computation -->
  <rect x="80" y="272" width="400" height="108" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="12.5" fill="#3a5a2a" font-weight="bold">最终计算</text>
  <text x="100" y="318" font-size="12" fill="#333">S = 10 ≥ 2k = 8 ✓　　total = 2ⁿ = 2⁴ = 16</text>
  <text x="100" y="338" font-size="12" fill="#333">bad = 1+1+1+2 = 5　（组1 和 &lt; 4 的划分数）</text>
  <text x="100" y="360" font-size="13" fill="#b85450" font-weight="bold">答案 = total − 2·bad = 16 − 2×5 = 6 ✓</text>
</svg>
