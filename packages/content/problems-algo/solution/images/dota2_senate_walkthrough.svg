<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：senate = "RDD"，n = 3</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">R 队 [0]，D 队 [1,2]，逐步比较队首</text>

  <!-- ===== Step 1 ===== -->
  <text x="30" y="72" font-size="12" fill="#d6a040" font-weight="bold">第 1 步</text>
  <g font-size="11">
    <text x="90" y="72" fill="#555">qr=[0], qd=[1,2] → r=0 &lt; d=1：R 先投票，禁掉 D(1)</text>
  </g>
  <g font-size="12">
    <!-- R queue -->
    <rect x="90" y="82" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="107" y="100" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
    <path d="M 124 96 L 150 96" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="170" y="92" font-size="10" fill="#446688">pop 0</text>
    <text x="170" y="106" font-size="10" fill="#446688">push 0+3=3</text>
    <!-- D queue -->
    <rect x="320" y="82" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="337" y="100" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="354" y="82" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="371" y="100" text-anchor="middle" fill="#b85450">2</text>
    <path d="M 354 96 L 380 96" stroke="#b85450" stroke-width="1.2" stroke-dasharray="2,2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="398" y="92" font-size="10" fill="#b85450">pop 1</text>
    <text x="398" y="106" font-size="10" fill="#b85450">（被禁）</text>
  </g>
  <text x="90" y="126" font-size="10" fill="#4a7a3a" font-weight="bold">结果：qr=[3], qd=[2]</text>

  <line x1="20" y1="138" x2="540" y2="138" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Step 2 ===== -->
  <text x="30" y="162" font-size="12" fill="#d6a040" font-weight="bold">第 2 步</text>
  <g font-size="11">
    <text x="90" y="162" fill="#555">qr=[3], qd=[2] → r=3, d=2：d &lt; r，D 先投票，禁掉 R(3)</text>
  </g>
  <g font-size="12">
    <rect x="90" y="172" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="107" y="190" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <path d="M 124 186 L 150 186" stroke="#446688" stroke-width="1.2" stroke-dasharray="2,2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="170" y="182" font-size="10" fill="#446688">pop 3</text>
    <text x="170" y="196" font-size="10" fill="#446688">（被禁）</text>

    <rect x="320" y="172" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="337" y="190" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <path d="M 354 186 L 380 186" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="398" y="182" font-size="10" fill="#b85450">pop 2</text>
    <text x="398" y="196" font-size="10" fill="#b85450">push 2+3=5</text>
  </g>
  <text x="90" y="216" font-size="10" fill="#b85450" font-weight="bold">结果：qr=[], qd=[5] → R 队空，D 胜！</text>

  <line x1="20" y1="228" x2="540" y2="228" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== +n meaning ===== -->
  <rect x="30" y="240" width="510" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="260" font-size="11" fill="#4a7a3a" font-weight="bold">为什么 +n 能模拟"下一轮"？</text>
  <text x="50" y="278" font-size="10" fill="#555">第 1 步 R(0) 禁 D(1) 后重入队得 0+3=3。此时 D 队首=2 &lt; 3，</text>
  <text x="50" y="294" font-size="10" fill="#555">说明 D(2) 在"本轮"还没投票 → 它先于"下一轮的 R"行动，正确反映轮内顺序。</text>
  <text x="50" y="312" font-size="10" fill="#4a7a3a" font-weight="bold">+n = 把参议员平移到下一轮的同一相对位置，FIFO 自然保序。</text>

  <!-- ===== Greedy intuition ===== -->
  <rect x="30" y="338" width="510" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="358" font-size="11" fill="#d6a040" font-weight="bold">贪心直觉：为什么禁"下一个"对手而非后面的？</text>
  <text x="50" y="376" font-size="10" fill="#555">禁掉队首 D = 禁掉投票序最早的对手。这个对手最可能抢在你盟友之前动手。</text>
  <text x="50" y="392" font-size="10" fill="#555">越早的对手威胁越大（它能动的次数多）。交换论证：把"禁更早"换成"禁更晚"，</text>
  <text x="50" y="408" font-size="10" fill="#555">被放过的更早对手至少能多禁一个己方议员 → 不更优。</text>
  <text x="50" y="424" font-size="10" fill="#d6a040" font-weight="bold">故"贪心禁队首对手"是最优策略，双队列直接对应这一选择。</text>
</svg>
