<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="320" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：「槽」= 两端被 # 或边界夹住的连续非 # 段</text>
  <text x="300" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">单词长度须等于槽长，且每个字母与格子相容（空格=通配）</text>

  <!-- Row strip: # _ a _ # _ _ # _ #   (10 cells, 44x44, start x=60) -->
  <g filter="url(#rough2)" font-size="15" text-anchor="middle">
    <rect x="60"  y="64" width="44" height="44" fill="#666"     stroke="#333"   stroke-width="1.5" rx="4"/>
    <text x="82"  y="92" fill="#fff" font-weight="bold">#</text>
    <rect x="104" y="64" width="44" height="44" fill="#e8f0fe"  stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="126" y="92" fill="#446688" font-size="11">空</text>
    <rect x="148" y="64" width="44" height="44" fill="#fff8e1"  stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="170" y="92" fill="#d6a040" font-weight="bold">a</text>
    <rect x="192" y="64" width="44" height="44" fill="#e8f0fe"  stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="214" y="92" fill="#446688" font-size="11">空</text>
    <rect x="236" y="64" width="44" height="44" fill="#666"     stroke="#333"   stroke-width="1.5" rx="4"/>
    <text x="258" y="92" fill="#fff" font-weight="bold">#</text>
    <rect x="280" y="64" width="44" height="44" fill="#e8f0fe"  stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="302" y="92" fill="#446688" font-size="11">空</text>
    <rect x="324" y="64" width="44" height="44" fill="#e8f0fe"  stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="346" y="92" fill="#446688" font-size="11">空</text>
    <rect x="368" y="64" width="44" height="44" fill="#666"     stroke="#333"   stroke-width="1.5" rx="4"/>
    <text x="390" y="92" fill="#fff" font-weight="bold">#</text>
    <rect x="412" y="64" width="44" height="44" fill="#e8f0fe"  stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="434" y="92" fill="#446688" font-size="11">空</text>
    <rect x="456" y="64" width="44" height="44" fill="#666"     stroke="#333"   stroke-width="1.5" rx="4"/>
    <text x="478" y="92" fill="#fff" font-weight="bold">#</text>
  </g>

  <!-- Slot brackets -->
  <rect x="100" y="60" width="140" height="52" fill="none" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="170" y="132" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">槽1 · 长度 3 ✓</text>

  <rect x="276" y="60" width="96"  height="52" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="324" y="132" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">槽2 · 长度 2 ✗</text>

  <rect x="408" y="60" width="52"  height="52" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="434" y="132" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">槽3 · 长度 1 ✗</text>

  <!-- Word "cat" aligned to slot1 -->
  <text x="60" y="172" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">word = "cat"（长度 3）→ 只能放槽1</text>
  <g filter="url(#rough2)" font-size="15" text-anchor="middle">
    <rect x="104" y="182" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="126" y="210" fill="#4a7a3a" font-weight="bold">c</text>
    <rect x="148" y="182" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="170" y="210" fill="#4a7a3a" font-weight="bold">a</text>
    <rect x="192" y="182" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="214" y="210" fill="#4a7a3a" font-weight="bold">t</text>
  </g>

  <!-- match annotations -->
  <g filter="url(#rough2)">
    <text x="126" y="246" text-anchor="middle" font-size="9.5" fill="#4a7a3a">空→c ✓</text>
    <text x="170" y="246" text-anchor="middle" font-size="9.5" fill="#4a7a3a">a=a ✓</text>
    <text x="214" y="246" text-anchor="middle" font-size="9.5" fill="#4a7a3a">空→t ✓</text>
  </g>

  <!-- Bottom note -->
  <rect x="40" y="272" width="520" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="290" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">边界条件（左右/上下相邻格非空非字母）</text>
  <text x="300" y="304" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">⇒ 单词必须恰好填满一个槽，正读 word 或反读 reversed(word) 均可</text>
</svg>
