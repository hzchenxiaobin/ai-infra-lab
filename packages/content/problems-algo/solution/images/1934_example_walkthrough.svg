<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：四个用户的确认率逐行推演</text>

  <!-- Header row -->
  <rect x="30" y="50" width="560" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="68" font-size="11" fill="#446688" font-weight="bold">user_id</text>
  <text x="130" y="68" font-size="11" fill="#446688" font-weight="bold">确认记录（action 序列）</text>
  <text x="430" y="68" font-size="11" fill="#446688" font-weight="bold">confirmed/total</text>
  <text x="545" y="68" font-size="11" fill="#446688" font-weight="bold">rate</text>

  <!-- User 6 -->
  <rect x="30" y="78" width="560" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="106" font-size="13" fill="#b85450" font-weight="bold">6</text>
  <text x="140" y="100" font-size="11" fill="#888">（无确认请求）</text>
  <text x="140" y="116" font-size="9.5" fill="#888">LEFT JOIN 产出一行 NULL</text>
  <text x="445" y="106" font-size="11" fill="#b85450" font-weight="bold">0 / 0</text>
  <text x="550" y="106" font-size="13" fill="#b85450" font-weight="bold">0.00</text>

  <!-- User 3 -->
  <rect x="30" y="128" width="560" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="156" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="140" y="142" width="56" height="20" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="168" y="156" text-anchor="middle" font-size="9.5" fill="#d6a040">timeout</text>
  <rect x="200" y="142" width="56" height="20" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="228" y="156" text-anchor="middle" font-size="9.5" fill="#d6a040">timeout</text>
  <text x="445" y="156" font-size="11" fill="#d6a040" font-weight="bold">0 / 2</text>
  <text x="550" y="156" font-size="13" fill="#d6a040" font-weight="bold">0.00</text>

  <!-- User 7 -->
  <rect x="30" y="178" width="560" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="206" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="140" y="192" width="60" height="20" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="170" y="206" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">confirmed</text>
  <rect x="204" y="192" width="60" height="20" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="234" y="206" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">confirmed</text>
  <rect x="268" y="192" width="60" height="20" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="298" y="206" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">confirmed</text>
  <text x="445" y="206" font-size="11" fill="#4a7a3a" font-weight="bold">3 / 3</text>
  <text x="550" y="206" font-size="13" fill="#4a7a3a" font-weight="bold">1.00</text>

  <!-- User 2 -->
  <rect x="30" y="228" width="560" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="256" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="140" y="242" width="60" height="20" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="170" y="256" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">confirmed</text>
  <rect x="204" y="242" width="56" height="20" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="232" y="256" text-anchor="middle" font-size="9.5" fill="#d6a040">timeout</text>
  <text x="445" y="256" font-size="11" fill="#446688" font-weight="bold">1 / 2</text>
  <text x="550" y="256" font-size="13" fill="#446688" font-weight="bold">0.50</text>

  <!-- Note -->
  <path d="M 310 282 L 310 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="304" width="540" height="120" fill="#fafafa" stroke="#888" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="60" y="326" font-size="11.5" fill="#555" font-weight="bold">推演要点</text>
  <text x="60" y="346" font-size="10.5" fill="#555">• 用户 6：无确认请求 → LEFT JOIN 单行 NULL → AVG(IF(NULL=... ,1,0))=AVG(0)=0 → 0.00</text>
  <text x="60" y="364" font-size="10.5" fill="#555">• 用户 3：两条 timeout → IF 各取 0 → AVG(0,0)=0 → 0.00（有请求但全未确认）</text>
  <text x="60" y="382" font-size="10.5" fill="#555">• 用户 7：三条 confirmed → IF 各取 1 → AVG(1,1,1)=1 → 1.00（全部确认）</text>
  <text x="60" y="400" font-size="10.5" fill="#555">• 用户 2：一确认一超时 → AVG(1,0)=0.5 → 0.50（部分确认）</text>
  <text x="60" y="418" font-size="9.5" fill="#888">关键：AVG 对 0/1 序列求均值天然得到「confirmed 占比」，无需手算 SUM/COUNT</text>
</svg>
