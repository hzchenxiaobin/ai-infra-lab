<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">tree2str 递归流程：按「左/右有无」分四象限</text>

  <!-- 起点 -->
  <rect x="230" y="44" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">dfs(node)</text>

  <!-- 箭头向下 -->
  <path d="M 290 78 L 290 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判空 -->
  <polygon points="290,96 360,130 290,164 220,130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="127" text-anchor="middle" font-size="10" fill="#333">node == null?</text>
  <text x="290" y="140" text-anchor="middle" font-size="9" fill="#888">(理论上不会调)</text>

  <!-- 是 → 返回空串 -->
  <path d="M 220 130 L 160 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="122" text-anchor="middle" font-size="9" fill="#888">是</text>
  <rect x="70" y="114" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="115" y="135" text-anchor="middle" font-size="10" fill="#b85450">return ""</text>

  <!-- 否 → 写 val -->
  <path d="M 290 164 L 290 182" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="305" y="176" font-size="9" fill="#888">否</text>
  <rect x="230" y="182" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="202" text-anchor="middle" font-size="10" fill="#333">res = str(node.val)</text>

  <!-- 判断：有左或有右？ -->
  <path d="M 290 212 L 290 230" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="290,230 370,265 290,300 210,265" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="262" text-anchor="middle" font-size="10" fill="#333">有左 || 有右?</text>

  <!-- 否 → 直接返回 res（叶子节点） -->
  <path d="M 370 265 L 440 265" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="405" y="257" text-anchor="middle" font-size="9" fill="#888">否(叶子)</text>
  <rect x="440" y="249" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="495" y="270" text-anchor="middle" font-size="10" fill="#b85450">return res</text>

  <!-- 是 → 进入括号构造 -->
  <path d="M 290 300 L 290 318" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="305" y="312" font-size="9" fill="#888">是</text>

  <!-- 左子处理 -->
  <rect x="60" y="318" width="210" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="165" y="338" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">左子部分：</text>
  <text x="165" y="354" text-anchor="middle" font-size="9" fill="#555">左非空 → ( + dfs(left) + )</text>

  <!-- 右子处理 -->
  <rect x="310" y="318" width="210" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="415" y="338" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">右子部分：</text>
  <text x="415" y="354" text-anchor="middle" font-size="9" fill="#555">右非空 → ( + dfs(right) + )</text>

  <!-- 箭头汇合 -->
  <path d="M 165 364 L 165 382 L 290 382" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 415 364 L 415 382 L 290 382" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 290 382 L 290 398" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="210" y="398" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="418" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return res</text>
</svg>
