<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 510" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="510" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：构造法逐位定位</text>

  <!-- Start -->
  <g filter="url(#rough2)">
    <rect x="220" y="42" width="100" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="270" y="61" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始</text>
  </g>
  <path d="M 270 70 L 270 86" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- total -->
  <g filter="url(#rough2)">
    <rect x="170" y="90" width="200" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="270" y="112" text-anchor="middle" font-size="12" fill="#444">total = 3 · 2^(n−1)</text>
  </g>
  <path d="M 270 124 L 270 140" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Decision diamond: k > total? -->
  <g filter="url(#rough2)">
    <polygon points="270,144 340,178 270,212 200,178" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="270" y="174" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">k &gt; total ?</text>
    <text x="270" y="190" text-anchor="middle" font-size="10" fill="#b85450">越界判定</text>
  </g>
  <!-- Yes branch -->
  <path d="M 340 178 L 380 178" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="356" y="172" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <g filter="url(#rough2)">
    <rect x="384" y="164" width="110" height="30" rx="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="439" y="184" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 ""</text>
  </g>
  <!-- No branch -->
  <path d="M 270 212 L 270 228" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="278" y="226" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- k-- -->
  <g filter="url(#rough2)">
    <rect x="150" y="232" width="240" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="270" y="254" text-anchor="middle" font-size="12" fill="#444">k −−  （1-indexed → 0-indexed）</text>
  </g>
  <path d="M 270 266 L 270 282" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- First char -->
  <g filter="url(#rough2)">
    <rect x="120" y="286" width="300" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="270" y="304" text-anchor="middle" font-size="12" fill="#444">首位：idx = k // 2^(n−1)，取 [a,b,c][idx]</text>
    <text x="270" y="322" text-anchor="middle" font-size="11" fill="#666">k %= 2^(n−1)；prev = 该字符</text>
  </g>
  <path d="M 270 332 L 270 348" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Loop header -->
  <g filter="url(#rough2)">
    <rect x="170" y="352" width="200" height="30" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="270" y="372" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">for i = n−2  down to 0</text>
  </g>
  <path d="M 270 382 L 270 398" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Loop body -->
  <g filter="url(#rough2)">
    <rect x="100" y="402" width="340" height="58" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="270" y="422" text-anchor="middle" font-size="12" fill="#444">候选 = [ch ∈ abc : ch ≠ prev]</text>
    <text x="270" y="440" text-anchor="middle" font-size="12" fill="#444">idx = k // 2^i，取候选[idx]，k %= 2^i</text>
    <text x="270" y="456" text-anchor="middle" font-size="11" fill="#666">prev = 该字符</text>
  </g>
  <!-- Loop back arrow: from body right side up to loop header right side -->
  <path d="M 440 431 L 470 431 L 470 367 L 370 367" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)" stroke-dasharray="4 3"/>
  <text x="478" y="400" font-size="10" fill="#4a7a3a">循环</text>

  <!-- After loop -> return -->
  <path d="M 270 460 L 270 476" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="200" y="478" width="140" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="270" y="497" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">返回结果</text>
  </g>
</svg>
