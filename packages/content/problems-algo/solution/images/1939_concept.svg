<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：自连接配对 + 时间差 ≤ 24h</text>

  <!-- ===== Confirmations c1 (left) ===== -->
  <text x="30" y="52" font-size="10" fill="#888">Confirmations c1（左表）</text>
  <rect x="20" y="58" width="220" height="160" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="30" y="74" font-size="9" fill="#446688" font-weight="bold">user  time_stamp         action</text>
  <line x1="20" y1="80" x2="240" y2="80" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="30" y="96" font-size="9" fill="#333">3  01-06 03:30:46  timeout</text>
  <text x="30" y="114" font-size="9" fill="#333">3  01-06 03:37:45  timeout</text>
  <text x="30" y="132" font-size="9" fill="#333">7  06-12 11:57:29  confirmed</text>
  <text x="30" y="150" font-size="9" fill="#333">7  06-13 11:57:30  confirmed</text>
  <text x="30" y="168" font-size="9" fill="#333">2  01-22 00:00:00  confirmed</text>
  <text x="30" y="186" font-size="9" fill="#333">2  01-23 00:00:00  timeout</text>
  <text x="30" y="204" font-size="9" fill="#333">...（6, 6 两行省略）</text>

  <!-- ===== Confirmations c2 (right, same table) ===== -->
  <text x="340" y="52" font-size="10" fill="#888">Confirmations c2（同表，别名 c2）</text>
  <rect x="330" y="58" width="220" height="160" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="340" y="74" font-size="9" fill="#446688" font-weight="bold">user  time_stamp         action</text>
  <line x1="330" y1="80" x2="550" y2="80" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="340" y="96" font-size="9" fill="#333">3  01-06 03:30:46  timeout</text>
  <text x="340" y="114" font-size="9" fill="#333">3  01-06 03:37:45  timeout</text>
  <text x="340" y="132" font-size="9" fill="#333">7  06-12 11:57:29  confirmed</text>
  <text x="340" y="150" font-size="9" fill="#333">7  06-13 11:57:30  confirmed</text>
  <text x="340" y="168" font-size="9" fill="#333">2  01-22 00:00:00  confirmed</text>
  <text x="340" y="186" font-size="9" fill="#333">2  01-23 00:00:00  timeout</text>
  <text x="340" y="204" font-size="9" fill="#333">...（同上）</text>

  <!-- ===== Join condition label ===== -->
  <text x="290" y="120" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">JOIN ON</text>
  <text x="290" y="134" text-anchor="middle" font-size="9" fill="#446688">c1.user_id</text>
  <text x="290" y="146" text-anchor="middle" font-size="9" fill="#446688">= c2.user_id</text>

  <!-- Pair arrows: user 3 -->
  <path d="M 240 92 C 285 92, 285 92, 330 92" stroke="#4a7a3a" stroke-width="1" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" opacity="0.6"/>
  <path d="M 240 92 C 285 92, 285 110, 330 110" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 240 110 C 285 110, 285 92, 330 92" stroke="#b85450" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)" opacity="0.5"/>
  <text x="262" y="86" font-size="7" fill="#4a7a3a">c1&lt;c2 ✓</text>
  <text x="262" y="116" font-size="7" fill="#b85450">c1&gt;c2 ✗</text>

  <!-- Pair arrows: user 7 -->
  <path d="M 240 128 C 285 128, 285 146, 330 146" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Pair arrows: user 2 -->
  <path d="M 240 164 C 285 164, 285 182, 330 182" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Bottom: two filters ===== -->
  <path d="M 105 224 L 105 244" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Filter 1: c1.time_stamp < c2.time_stamp -->
  <rect x="20" y="248" width="250" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="145" y="266" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">WHERE c1.time_stamp &lt; c2.time_stamp</text>
  <text x="145" y="280" text-anchor="middle" font-size="9" fill="#888">避免自匹配 + 去重复对（每对只留一次）</text>

  <!-- Filter 2: TIMESTAMPDIFF <= 86400 -->
  <rect x="290" y="248" width="260" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="420" y="266" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">AND TIMESTAMPDIFF(SECOND,...)</text>
  <text x="420" y="280" text-anchor="middle" font-size="9" fill="#888">≤ 86400（24h = 24×60×60 秒）</text>

  <!-- Arrow down -->
  <path d="M 280 296 L 280 310" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- SELECT DISTINCT -->
  <rect x="140" y="314" width="280" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">SELECT DISTINCT c1.user_id</text>
  <text x="280" y="346" text-anchor="middle" font-size="9" fill="#555">同一用户可能有多对满足条件 → 去重</text>

  <!-- Arrow down -->
  <path d="M 280 358 L 280 372" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="210" y="376" width="140" height="60" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">user_id</text>
  <line x1="210" y1="398" x2="350" y2="398" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="280" y="412" text-anchor="middle" font-size="10" fill="#446688">2</text>
  <text x="280" y="426" text-anchor="middle" font-size="10" fill="#446688">3</text>
  <text x="280" y="440" text-anchor="middle" font-size="10" fill="#446688">6</text>

  <!-- ===== Side note ===== -->
  <rect x="390" y="314" width="170" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="475" y="332" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">为何 c1 &lt; c2？</text>
  <text x="400" y="348" font-size="8" fill="#666">① 排除自匹配（同行 c1=c2）</text>
  <text x="400" y="362" font-size="8" fill="#666">② 每对只保留一次</text>
  <text x="400" y="376" font-size="8" fill="#666">  （A-B 与 B-A 取其一）</text>
  <text x="400" y="392" font-size="8" fill="#666">③ 不影响 24h 判定</text>
  <text x="400" y="406" font-size="8" fill="#666">  （差绝对值 = c2-c1）</text>

  <!-- ===== Legend ===== -->
  <rect x="20" y="376" width="170" height="72" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="30" y="392" font-size="9" fill="#4a7a3a" font-weight="bold">c1 &lt; c2 ✓ 保留</text>
  <text x="30" y="406" font-size="8" fill="#888">前→后，时间差 = c2 - c1</text>
  <text x="30" y="422" font-size="9" fill="#b85450">c1 &gt; c2 ✗ 丢弃</text>
  <text x="30" y="436" font-size="8" fill="#888">后→前，与前者对称重复</text>
</svg>
