<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">== 合并等价类，!= 验证两端是否同类</text>

  <!-- ===== Left: == builds equivalence classes ===== -->
  <text x="150" y="56" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">第一遍：处理 ==</text>

  <rect x="36" y="68" width="86" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="79" y="86" text-anchor="middle" font-size="11" fill="#333">a == b</text>
  <rect x="36" y="98" width="86" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="79" y="116" text-anchor="middle" font-size="11" fill="#333">b == c</text>
  <rect x="36" y="128" width="86" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="79" y="146" text-anchor="middle" font-size="11" fill="#333">e == f</text>

  <line x1="122" y1="110" x2="156" y2="110" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="139" y="104" text-anchor="middle" font-size="9.5" fill="#888">union</text>

  <!-- equivalence classes -->
  <text x="240" y="56" text-anchor="middle" font-size="11" fill="#666">等价类（连通分量）</text>

  <!-- class {a,b,c} -->
  <rect x="166" y="70" width="150" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <circle cx="190" cy="90" r="14" fill="#fff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="94" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <circle cx="240" cy="90" r="14" fill="#fff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="94" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b</text>
  <circle cx="290" cy="90" r="14" fill="#fff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="94" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">c</text>
  <line x1="204" y1="90" x2="226" y2="90" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="254" y1="90" x2="276" y2="90" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- class {e,f} -->
  <rect x="166" y="120" width="106" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <circle cx="190" cy="138" r="13" fill="#fff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="142" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">e</text>
  <circle cx="248" cy="138" r="13" fill="#fff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="248" y="142" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">f</text>
  <line x1="203" y1="138" x2="235" y2="138" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- singletons -->
  <rect x="166" y="166" width="48" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <circle cx="190" cy="182" r="13" fill="#fff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="186" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d</text>

  <!-- ===== Right: != conflict check ===== -->
  <text x="430" y="56" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">第二遍：查 !=</text>

  <!-- conflict case -->
  <rect x="330" y="70" width="206" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="433" y="88" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a != c ?</text>
  <text x="433" y="105" text-anchor="middle" font-size="10.5" fill="#b85450">find(a)==find(c) → 冲突 ⛔</text>

  <!-- ok case -->
  <rect x="330" y="124" width="206" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="433" y="142" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a != d ?</text>
  <text x="433" y="159" text-anchor="middle" font-size="10.5" fill="#4a7a3a">find(a)!=find(d) → 可满足 ✓</text>

  <!-- arrows linking -->
  <path d="M 316 90 Q 326 84 330 90" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 214 182 Q 280 168 330 146" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== key insight ===== -->
  <rect x="30" y="226" width="500" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键观察</text>
  <text x="280" y="266" text-anchor="middle" font-size="11" fill="#555">== 是等价关系（自反/对称/传递）→ union 划分等价类</text>
  <text x="280" y="282" text-anchor="middle" font-size="11" fill="#555">!= 仅在两端同属一类时冲突 → find(a)==find(b) 即返回 false</text>

  <!-- ===== two-pass reminder ===== -->
  <rect x="30" y="300" width="500" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">两遍扫描不可省</text>
  <text x="280" y="340" text-anchor="middle" font-size="10.5" fill="#555">先 union 全部 == 建出完整等价类（传递闭包）</text>
  <text x="280" y="354" text-anchor="middle" font-size="10.5" fill="#555">再逐条查 != 是否同根，规避方程顺序的影响</text>
</svg>
