<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,3,1,4,1,3,2]（n = 7）</text>

  <!-- 环形数组：中心 (155,185) -->
  <!-- 节点 0：值 1 -->
  <circle cx="155" cy="95" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="155" y="97" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="155" y="109" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>

  <!-- 节点 1：值 3 -->
  <circle cx="229" cy="129" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="229" y="131" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="229" y="143" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>

  <!-- 节点 2：值 1 -->
  <circle cx="248" cy="205" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="248" y="207" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="248" y="219" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>

  <!-- 节点 3：值 4 -->
  <circle cx="196" cy="266" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="196" y="268" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="196" y="280" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>

  <!-- 节点 4：值 1 -->
  <circle cx="114" cy="266" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="114" y="268" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="114" y="280" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">4</text>

  <!-- 节点 5：值 3（查询高亮） -->
  <circle cx="62" cy="205" r="19" fill="#e6f4ea" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="62" y="207" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="62" y="219" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="42" y="238" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">q=5</text>

  <!-- 节点 6：值 2 -->
  <circle cx="81" cy="129" r="19" fill="#f0f0f0" stroke="#999999" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="81" y="131" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="81" y="143" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">6</text>

  <!-- 红色绕行弧：5 → 6 → 0 → 1（顺时针，3 步） -->
  <path d="M 45 209 A 113 108 0 0 1 67 118 A 113 108 0 0 1 155 77 A 113 108 0 0 1 243 118"
        fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="72" y="56" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">绕行 5→6→0→1</text>
  <text x="72" y="71" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">仅 3 步 ✓</text>

  <!-- 环心说明 -->
  <text x="155" y="180" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">直线 |5−1| = 4</text>
  <text x="155" y="198" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">环距取短 = 3</text>

  <!-- 右侧三张查询卡 -->
  <rect x="320" y="48" width="180" height="92" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">查询 0：q=0，值 1</text>
  <text x="410" y="92" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">pos[1] = [0, 2, 4]</text>
  <text x="410" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">邻居 4 / 2 → min(3, 2)</text>
  <text x="410" y="130" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">answer = 2</text>

  <rect x="320" y="150" width="180" height="92" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="172" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">查询 1：q=3，值 4</text>
  <text x="410" y="194" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">pos[4] = [3]，唯一</text>
  <text x="410" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">无其他同值下标</text>
  <text x="410" y="232" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">answer = −1</text>

  <rect x="320" y="252" width="180" height="92" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="274" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">查询 2：q=5，值 3</text>
  <text x="410" y="296" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">pos[3] = [1, 5]</text>
  <text x="410" y="314" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">绕行 5→6→0→1（左图）</text>
  <text x="410" y="334" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">answer = 3</text>

  <!-- 底部结论 -->
  <rect x="110" y="348" width="300" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="368" text-anchor="middle" font-size="13" fill="#2a4a2a" font-weight="bold" filter="url(#rough2)">answer = [2, −1, 3] ✓</text>
</svg>
