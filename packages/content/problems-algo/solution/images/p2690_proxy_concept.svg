<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">Proxy 的 get 拦截器：任意方法名进入，原样返回</text>

  <!-- Three input bubbles (left) -->
  <rect x="28" y="86" width="124" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="90" y="111" text-anchor="middle" font-size="11" fill="#446688">obj.abc123()</text>

  <rect x="28" y="176" width="124" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="90" y="201" text-anchor="middle" font-size="11" fill="#446688">obj.hello()</text>

  <rect x="20" y="266" width="140" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="90" y="291" text-anchor="middle" font-size="9.5" fill="#446688">obj[".-qw73n|^2It"]()</text>

  <!-- Arrows in -->
  <path d="M 156 106 L 214 106" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 156 196 L 214 196" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 164 286 L 214 286" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Proxy box (center, tall) -->
  <rect x="218" y="68" width="164" height="260" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="98" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">Proxy</text>
  <line x1="238" y1="110" x2="362" y2="110" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="300" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">get(target, prop)</text>
  <text x="300" y="158" text-anchor="middle" font-size="10.5" fill="#888">拦截任意属性访问</text>
  <text x="300" y="200" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return () =&gt; prop</text>
  <text x="300" y="220" text-anchor="middle" font-size="10" fill="#888">返回一个闭包</text>
  <text x="300" y="244" text-anchor="middle" font-size="10" fill="#888">捕获 prop 名</text>
  <text x="300" y="296" text-anchor="middle" font-size="10" fill="#bbb">(target 为空对象)</text>

  <!-- Arrows out -->
  <path d="M 386 106 L 434 106" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 386 196 L 434 196" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 386 286 L 434 286" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Output bubbles (right) -->
  <rect x="438" y="86" width="132" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="504" y="111" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">"abc123"</text>

  <rect x="438" y="176" width="132" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="504" y="201" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">"hello"</text>

  <rect x="438" y="266" width="132" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="504" y="291" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">".-qw73n|^2It"</text>

  <!-- Bottom note -->
  <rect x="60" y="348" width="480" height="38" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="372" text-anchor="middle" font-size="11" fill="#888">同一个 Proxy 实例拦截所有 prop——无需预先定义任何方法，故称「无穷」</text>
</svg>
