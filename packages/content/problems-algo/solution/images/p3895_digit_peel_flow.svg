<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrY" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：外层遍历元素，内层剥离数位</text>
  <text x="260" y="36" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">内层循环三步走——剥一位、比一位、丢一位</text>

  <!-- return ans box -->
  <rect x="30" y="50" width="110" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="85" y="70" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">return ans</text>

  <!-- outer loop box -->
  <rect x="160" y="50" width="200" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">外层：遍历 nums 取下一个 x</text>
  <path d="M 158 66 L 146 66" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="152" y="58" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">遍历完</text>

  <path d="M 260 82 L 260 96" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1: x > 0 ? -->
  <polygon points="260,100 340,132 260,164 180,132" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="130" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold" filter="url(#rough2)">x &gt; 0 ?</text>
  <text x="260" y="146" text-anchor="middle" font-size="8.5" fill="#668" filter="url(#rough2)">（还能剥？）</text>

  <!-- no: back to outer loop -->
  <path d="M 340 132 L 448 132 L 448 70 L 364 70" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="6,4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="386" y="124" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">否：换下一个数</text>

  <!-- yes: down to digit compare -->
  <text x="268" y="180" text-anchor="start" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 260 164 L 260 184" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 2: x % 10 == digit ? -->
  <polygon points="260,188 352,222 260,256 168,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="220" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">x % 10 == digit ?</text>
  <text x="260" y="236" text-anchor="middle" font-size="8.5" fill="#998" filter="url(#rough2)">（剥下的位命中？）</text>

  <!-- yes: count -->
  <text x="268" y="272" text-anchor="start" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 260 256 L 260 270" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="185" y="272" width="150" height="27" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="289" text-anchor="middle" font-size="10.5" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">ans++（命中计数）</text>

  <path d="M 260 299 L 260 305" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- drop lowest digit -->
  <rect x="195" y="305" width="150" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="322" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">x //= 10（丢最低位）</text>

  <!-- no: skip count, go to x //= 10 -->
  <path d="M 352 222 L 415 222 L 415 319 L 349 319" stroke="#999" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrY)" filter="url(#rough2)"/>
  <text x="364" y="214" text-anchor="start" font-size="9.5" fill="#999" filter="url(#rough2)">否</text>

  <!-- loop back to diamond 1 -->
  <path d="M 195 319 L 105 319 L 105 132 L 176 132" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="6,4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="150" y="312" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">回到 x &gt; 0 ?</text>

  <!-- complexity note -->
  <rect x="330" y="346" width="170" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="366" text-anchor="middle" font-size="9.5" fill="#2a5a1e" filter="url(#rough2)">时间 O(n·D)，D ≤ 7</text>
  <text x="415" y="382" text-anchor="middle" font-size="9.5" fill="#2a5a1e" filter="url(#rough2)">总操作数 ≤ 7000</text>
</svg>
