<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="500" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：2020 年逐月统计活跃司机数与接单数</text>

  <!-- 表头 -->
  <rect x="30" y="40" width="580" height="28" fill="#446688" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="60" y="58" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">month</text>
  <text x="160" y="58" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">新加入司机</text>
  <text x="300" y="58" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">active_drivers</text>
  <text x="440" y="58" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">accepted_rides</text>
  <text x="560" y="58" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">ride_ids</text>

  <!-- 月份列分割线 -->
  <line x1="100" y1="40" x2="100" y2="464" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="230" y1="40" x2="230" y2="464" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="380" y1="40" x2="380" y2="464" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="510" y1="40" x2="510" y2="464" stroke="#bbb" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Row 1: Jan -->
  <rect x="30" y="70" width="580" height="30" fill="#e8f0fe" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="60" y="89" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="160" y="89" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">+8 (1/13)</text>
  <text x="300" y="89" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="440" y="89" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="560" y="89" text-anchor="middle" font-size="10" fill="#888">—</text>

  <!-- Row 2: Feb -->
  <rect x="30" y="100" width="580" height="30" fill="#e8f0fe" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="60" y="119" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="160" y="119" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">+5 (2/16)</text>
  <text x="300" y="119" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="440" y="119" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="560" y="119" text-anchor="middle" font-size="10" fill="#888">—</text>

  <!-- Row 3: Mar (has ride) -->
  <rect x="30" y="130" width="580" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60" y="149" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="160" y="149" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">+7 (3/8)</text>
  <text x="300" y="149" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="440" y="149" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="560" y="149" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">10</text>

  <!-- Row 4: Apr -->
  <rect x="30" y="160" width="580" height="30" fill="#e8f0fe" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="60" y="179" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="160" y="179" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="300" y="179" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="440" y="179" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="560" y="179" text-anchor="middle" font-size="10" fill="#888">—</text>

  <!-- Row 5: May -->
  <rect x="30" y="190" width="580" height="30" fill="#e8f0fe" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="60" y="209" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="160" y="209" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">+4 (5/17)</text>
  <text x="300" y="209" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="440" y="209" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="560" y="209" text-anchor="middle" font-size="10" fill="#888">—</text>

  <!-- Row 6: Jun (has ride) -->
  <rect x="30" y="220" width="580" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60" y="239" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="160" y="239" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="300" y="239" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="440" y="239" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="560" y="239" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">13</text>

  <!-- Row 7: Jul (has ride) -->
  <rect x="30" y="250" width="580" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60" y="269" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="160" y="269" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="300" y="269" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="440" y="269" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="560" y="269" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">7</text>

  <!-- Row 8: Aug (has ride) -->
  <rect x="30" y="280" width="580" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60" y="299" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <text x="160" y="299" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="300" y="299" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="440" y="299" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="560" y="299" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">17</text>

  <!-- Row 9: Sep -->
  <rect x="30" y="310" width="580" height="30" fill="#e8f0fe" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="60" y="329" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">9</text>
  <text x="160" y="329" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="300" y="329" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="440" y="329" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="560" y="329" text-anchor="middle" font-size="10" fill="#888">—</text>

  <!-- Row 10: Oct -->
  <rect x="30" y="340" width="580" height="30" fill="#e8f0fe" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="60" y="359" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>
  <text x="160" y="359" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">+1 (10/24)</text>
  <text x="300" y="359" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="440" y="359" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="560" y="359" text-anchor="middle" font-size="10" fill="#888">—</text>

  <!-- Row 11: Nov (2 rides) -->
  <rect x="30" y="370" width="580" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="60" y="389" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">11</text>
  <text x="160" y="389" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="300" y="389" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="440" y="389" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="560" y="389" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">20, 5</text>

  <!-- Row 12: Dec (1 ride) -->
  <rect x="30" y="400" width="580" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60" y="419" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">12</text>
  <text x="160" y="419" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="300" y="419" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="440" y="419" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="560" y="419" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>

  <!-- 底部说明 -->
  <rect x="30" y="440" width="580" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="458" font-size="10" fill="#333">蓝色行 = 无接单月 | 红色行 = 有接单月（3/6/7/8/11/12 月）</text>
  <text x="60" y="474" font-size="10" fill="#333">新加入：1月+8, 2月+5, 3月+7, 5月+4, 10月+1（driver 6 于 2021/1/5 加入，不计入 2020）</text>
</svg>
