<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：环形传球，第 2 次接球即终止</text>

  <!-- circle hint -->
  <text x="40" y="60" font-size="11" fill="#888" filter="url(#rough2)">↻ n 个朋友围坐成圈，顺时针编号 1→2→…→n→1</text>

  <!-- ===== Pass chain (top) ===== -->
  <text x="40" y="92" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">传球链（n=5, k=2）</text>

  <!-- node 1 (green winner) -->
  <circle cx="80" cy="130" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="80" y="135" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="80" y="172" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓接球</text>

  <!-- arrow 1 -> 3 -->
  <path d="M 106 130 L 184 130" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="145" y="120" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1·k=2步</text>

  <!-- node 3 (first time, green) -->
  <circle cx="210" cy="130" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="135" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="210" y="172" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓第1次</text>

  <!-- arrow 3 -> 2 -->
  <path d="M 236 130 L 314 130" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="275" y="120" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">2·k=4步</text>

  <!-- node 2 (green winner) -->
  <circle cx="340" cy="130" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="340" y="135" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="340" y="172" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓接球</text>

  <!-- arrow 2 -> 3 (repeat, red dashed) -->
  <path d="M 366 130 L 444 130" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="405" y="120" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3·k=6步 绕回</text>

  <!-- node 3 (second time, red) -->
  <circle cx="470" cy="130" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="470" y="135" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="470" y="172" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗第2次→结束</text>

  <!-- ===== Roster (bottom) ===== -->
  <text x="40" y="216" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">全员 1~5：谁接过球？</text>

  <!-- friend 1 -->
  <circle cx="80" cy="250" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="255" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="80" y="286" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <!-- friend 2 -->
  <circle cx="150" cy="250" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="255" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="150" y="286" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <!-- friend 3 -->
  <circle cx="220" cy="250" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="255" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="220" y="286" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <!-- friend 4 (loser) -->
  <circle cx="290" cy="250" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="255" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="290" y="286" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">输家</text>
  <!-- friend 5 (loser) -->
  <circle cx="360" cy="250" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="255" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="360" y="286" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">输家</text>

  <!-- bracket + result -->
  <path d="M 270 234 L 270 228 L 380 228 L 380 234" stroke="#d6a040" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 325 228 L 325 214" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="410" y="234" width="130" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="475" y="255" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">answer=[4,5]</text>

  <!-- note -->
  <text x="40" y="328" font-size="11" fill="#888" filter="url(#rough2)">第 i 轮传 i·k 步；任一朋友第 2 次接球即终止，未接球者即输家。</text>
</svg>
