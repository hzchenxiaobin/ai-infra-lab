<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：一趟扫描 + 辅音处重置</text>

  <!-- Start oval -->
  <ellipse cx="200" cy="50" rx="40" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="54" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <!-- Arrow down to init -->
  <path d="M 200 65 L 200 78" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init rect -->
  <rect x="130" y="78" width="140" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">last[c]=−1, seg_start=0</text>

  <!-- Arrow down to loop -->
  <path d="M 200 106 L 200 120" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: i < n ? -->
  <path d="M 144,142 L 200,120 L 256,142 L 200,164 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="146" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">i &lt; n ?</text>

  <!-- Arrow No (right) to return -->
  <path d="M 256 142 L 316 142" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否</text>

  <rect x="316" y="128" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="371" y="146" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 ans</text>

  <!-- Arrow Yes (down) -->
  <path d="M 200 164 L 200 180" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="174" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Diamond: word[i] 是元音? -->
  <path d="M 120,210 L 200,180 L 280,210 L 200,240 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="212" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">word[i] ∈</text>
  <text x="200" y="228" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">{a,e,i,o,u} ?</text>

  <!-- Yes (left): vowel branch -->
  <path d="M 120 210 L 80 210" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="100" y="204" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Vowel action box -->
  <rect x="22" y="196" width="58" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="51" y="214" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">更新 last</text>

  <!-- Arrow down from vowel box to min compute -->
  <path d="M 51 224 L 51 250" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- min compute rect -->
  <rect x="10" y="250" width="82" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="51" y="268" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">mn=min(last)</text>
  <text x="51" y="284" text-anchor="middle" font-size="9.5" fill="#555">mn≥seg_start?</text>

  <!-- Arrow from min to ans accumulate (right) -->
  <path d="M 92 272 L 130 272" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="111" y="266" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ans accumulate rect -->
  <rect x="130" y="258" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">ans += mn−seg_start+1</text>

  <!-- No (right): consonant branch -->
  <path d="M 280 210 L 330 210" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="305" y="204" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否（辅音）</text>

  <!-- Consonant reset box -->
  <rect x="330" y="196" width="170" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="415" y="214" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">重置 last[c]=−1</text>
  <text x="415" y="230" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">seg_start = i+1</text>

  <!-- Loop back: i++ and back to diamond i<n -->
  <rect x="172" y="300" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i++</text>

  <!-- arrows from both branches down to i++ -->
  <path d="M 190 286 L 190 300" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 415 240 L 415 296 L 228 296 L 228 300" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Arrow from i++ back up to i<n diamond -->
  <path d="M 200 300 L 200 300 M 172 312 L 140 312 L 140 142 L 144 142" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="226" font-size="9.5" fill="#888">回循环</text>

  <!-- Footer -->
  <text x="260" y="346" text-anchor="middle" font-size="10" fill="#aaa">单趟遍历 · 元音更新贡献 · 辅音重置段起点 · O(n)/O(1)</text>
</svg>
