<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：连接 → 过滤 → 分组去重 → 并列全取 → 排序</text>

  <!-- 步骤 ① -->
  <rect x="36" y="50" width="282" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="177" y="76" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">① Orders ⨝ Users ⨝ Items 三表等值连接</text>

  <!-- 步骤 ② -->
  <rect x="36" y="112" width="282" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="177" y="138" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">② WHERE item_brand ≠ favorite_brand</text>

  <!-- 步骤 ③ -->
  <rect x="36" y="174" width="282" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="177" y="200" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">③ GROUP BY seller_id ＋ COUNT(DISTINCT item_id)</text>

  <!-- 步骤 ④ -->
  <rect x="36" y="236" width="282" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="177" y="262" text-anchor="middle" font-size="11.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">④ num_items = (SELECT MAX(num_items) FROM T)</text>

  <!-- 步骤 ⑤ -->
  <rect x="36" y="298" width="282" height="44" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="177" y="324" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">⑤ ORDER BY seller_id 升序输出</text>

  <!-- 步骤间箭头 -->
  <path d="M 177 94 L 177 106" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 177 156 L 177 168" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 177 218 L 177 230" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 177 280 L 177 292" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右侧注解 -->
  <rect x="334" y="50" width="154" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="411" y="68" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">每行订单同时携带</text>
  <text x="411" y="84" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">商品品牌 ＋ 卖家偏好</text>

  <rect x="334" y="112" width="154" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="411" y="130" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">偏爱订单提前丢弃</text>
  <text x="411" y="146" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">示例：5 行 → 3 行</text>

  <rect x="334" y="174" width="154" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="411" y="192" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">同一商品只算一件</text>
  <text x="411" y="208" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">T = {(2,1), (3,1)}</text>

  <rect x="334" y="236" width="154" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="411" y="254" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">MAX = 1，并列全保留</text>
  <text x="411" y="270" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">注意：不是 LIMIT 1</text>

  <rect x="334" y="298" width="154" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="411" y="316" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">输出 (2,1)、(3,1)</text>
  <text x="411" y="332" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">卖家 1 不参评</text>
</svg>
