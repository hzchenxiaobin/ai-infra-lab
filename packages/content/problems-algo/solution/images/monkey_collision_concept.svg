<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-path">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-path">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">核心观察：不碰撞 ⟺ 全员同向</text>

  <!-- 左：全员顺时针，循环移位，不碰撞 -->
  <g filter="url(#rough2)">
    <line x1="145" y1="123" x2="199" y2="154" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="199" y1="154" x2="199" y2="216" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="199" y1="216" x2="145" y2="247" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="145" y1="247" x2="91"  y2="216" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="91"  y1="216" x2="91"  y2="154" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="91"  y1="154" x2="145" y2="123" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
  </g>
  <g fill="#d6a040" stroke="#9c6b1f" stroke-width="1.2">
    <circle cx="145" cy="123" r="5" filter="url(#rough2)"/>
    <circle cx="199" cy="154" r="5" filter="url(#rough2)"/>
    <circle cx="199" cy="216" r="5" filter="url(#rough2)"/>
    <circle cx="145" cy="247" r="5" filter="url(#rough2)"/>
    <circle cx="91"  cy="216" r="5" filter="url(#rough2)"/>
    <circle cx="91"  cy="154" r="5" filter="url(#rough2)"/>
  </g>
  <text x="145" y="185" text-anchor="middle" font-size="20" fill="#4a7a3a" filter="url(#rough2)">↻</text>
  <text x="145" y="300" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">全员同向（顺时针）</text>
  <text x="145" y="319" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">循环移位 → 不碰撞 ✓</text>
  <text x="145" y="338" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">（全逆时针同理，共 2 种）</text>

  <!-- 右：混向，存在相向边 → 碰撞 -->
  <g filter="url(#rough2)">
    <line x1="415" y1="123" x2="469" y2="154" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="469" y1="154" x2="469" y2="216" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="415" y1="247" x2="361" y2="216" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="361" y1="216" x2="361" y2="154" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="361" y1="154" x2="415" y2="123" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <!-- 碰撞边 w2-w3：两只相向而行 -->
    <line x1="469" y1="216" x2="442" y2="231.5" stroke="#b85450" stroke-width="2.4" marker-end="url(#arrR)"/>
    <line x1="415" y1="247" x2="442" y2="231.5" stroke="#b85450" stroke-width="2.4" marker-end="url(#arrR)"/>
  </g>
  <g fill="#d6a040" stroke="#9c6b1f" stroke-width="1.2">
    <circle cx="415" cy="123" r="5" filter="url(#rough2)"/>
    <circle cx="469" cy="154" r="5" filter="url(#rough2)"/>
    <circle cx="469" cy="216" r="5" filter="url(#rough2)"/>
    <circle cx="415" cy="247" r="5" filter="url(#rough2)"/>
    <circle cx="361" cy="216" r="5" filter="url(#rough2)"/>
    <circle cx="361" cy="154" r="5" filter="url(#rough2)"/>
  </g>
  <text x="452" y="228" text-anchor="middle" font-size="18" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="415" y="300" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">混向：环形必有相向边</text>
  <text x="415" y="319" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">边上相向 → 碰撞 ✗</text>
  <text x="415" y="338" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">（非全员同向即必撞）</text>

  <!-- 底部公式 -->
  <rect x="70" y="360" width="420" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">总方案 2ⁿ　／　不碰撞 2　／　答案 = 2ⁿ − 2 (mod 10⁹+7)</text>
</svg>
