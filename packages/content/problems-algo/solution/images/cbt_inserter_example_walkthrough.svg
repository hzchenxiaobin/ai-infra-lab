<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：root = [1,2] → insert(3) → insert(4)</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">每步高亮：队首节点（橙）与新增节点（绿）</text>

  <!-- ===== 面板 1：初始 [1,2] ===== -->
  <rect x="10" y="56" width="190" height="262" rx="8" fill="none" stroke="#ddd" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="105" y="76" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">初始：构造</text>
  <g font-size="12">
    <!-- root 1（橙，队首） -->
    <circle cx="105" cy="108" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="105" y="113" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <!-- 2 -->
    <circle cx="80" cy="158" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="80" y="162" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
    <line x1="94" y1="120" x2="84" y2="144" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <!-- 1 的右空槽 -->
    <rect x="118" y="146" width="26" height="22" rx="4" fill="none" stroke="#bbb" stroke-width="1.1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="131" y="161" text-anchor="middle" font-size="10" fill="#aaa">空</text>
    <line x1="116" y1="120" x2="126" y2="144" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
  </g>
  <!-- 队列 -->
  <text x="105" y="206" text-anchor="middle" font-size="10" fill="#888">候选队列</text>
  <g font-size="11">
    <rect x="68" y="216" width="34" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="85" y="234" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="106" y="216" width="34" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="123" y="234" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
  </g>
  <text x="105" y="262" text-anchor="middle" font-size="10" fill="#888">BFS：1 右空→入队，2 双空→入队</text>

  <!-- 面板间箭头 1→2 -->
  <line x1="200" y1="180" x2="212" y2="180" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="206" y="172" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">insert(3)</text>

  <!-- ===== 面板 2：insert(3) 返回 1 ===== -->
  <rect x="205" y="56" width="190" height="262" rx="8" fill="none" stroke="#ddd" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="300" y="76" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">insert(3) → 返回 1</text>
  <g font-size="12">
    <!-- root 1 -->
    <circle cx="300" cy="108" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="300" y="113" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <!-- 2（橙，新队首） -->
    <circle cx="270" cy="158" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="270" y="162" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
    <line x1="288" y1="120" x2="274" y2="144" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <!-- 3 新增（绿） -->
    <circle cx="330" cy="158" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="330" y="162" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
    <line x1="312" y1="120" x2="326" y2="144" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  </g>
  <text x="300" y="206" text-anchor="middle" font-size="10" fill="#888">候选队列</text>
  <g font-size="11">
    <rect x="250" y="216" width="34" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="267" y="234" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="288" y="216" width="34" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="305" y="234" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
  </g>
  <text x="300" y="262" text-anchor="middle" font-size="10" fill="#888">1 左满→挂右；1 出队，3 入队</text>

  <!-- 面板间箭头 2→3 -->
  <line x1="395" y1="180" x2="407" y2="180" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="401" y="172" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">insert(4)</text>

  <!-- ===== 面板 3：insert(4) 返回 2 ===== -->
  <rect x="400" y="56" width="190" height="262" rx="8" fill="none" stroke="#ddd" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="495" y="76" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">insert(4) → 返回 2</text>
  <g font-size="12">
    <!-- root 1 -->
    <circle cx="495" cy="108" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
    <text x="495" y="113" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <!-- 2（橙，队首，左刚填） -->
    <circle cx="465" cy="158" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="465" y="162" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
    <!-- 3 -->
    <circle cx="525" cy="158" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="525" y="162" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
    <line x1="483" y1="120" x2="469" y2="144" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="507" y1="120" x2="521" y2="144" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <!-- 4 新增（绿） -->
    <circle cx="445" cy="208" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="445" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
    <line x1="453" y1="170" x2="447" y2="196" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <!-- 2 的右空槽 -->
    <rect x="478" y="196" width="24" height="20" rx="4" fill="none" stroke="#bbb" stroke-width="1.1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="490" y="210" text-anchor="middle" font-size="9" fill="#aaa">空</text>
    <line x1="473" y1="170" x2="484" y2="196" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
  </g>
  <text x="495" y="250" text-anchor="middle" font-size="10" fill="#888">候选队列</text>
  <g font-size="11">
    <rect x="418" y="260" width="30" height="24" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="433" y="276" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>
    <rect x="452" y="260" width="30" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="467" y="276" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3</text>
    <rect x="486" y="260" width="30" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="501" y="276" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">4</text>
  </g>
  <text x="495" y="300" text-anchor="middle" font-size="10" fill="#888">2 左空→挂左；2 留下，4 入队</text>

  <!-- 底部总结 -->
  <rect x="20" y="332" width="560" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="300" y="354" text-anchor="middle" font-size="12" fill="#7a5a20" font-weight="bold">关键：队首永远是下一个待填的父节点</text>
  <text x="40" y="374" font-size="11" fill="#7a5a20">· insert(3)：队首 1 左槽已满 → 填右槽 → 1 两槽满出队，新节点 3 入队 → 返回 1</text>
  <text x="40" y="392" font-size="11" fill="#7a5a20">· insert(4)：队首 2 左槽空 → 填左槽 → 2 仍留队（右槽待填），新节点 4 入队 → 返回 2</text>
</svg>
