<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：plants = [2,2,3,3], capacity = 5</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">初始：cur = 5, ans = 0</text>

  <!-- Table header -->
  <text x="48" y="72" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">i</text>
  <text x="100" y="72" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">plants[i]</text>
  <text x="168" y="72" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">cur(前)</text>
  <text x="228" y="72" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">够水?</text>
  <text x="296" y="72" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">步数</text>
  <text x="360" y="72" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">ans</text>
  <text x="432" y="72" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">cur(后)</text>

  <!-- header underline -->
  <path d="M 28 80 L 530 80" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: i=0, plants[0]=2, cur=5, yes, 1, ans=1, cur=3 -->
  <rect x="28" y="86" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="48" y="106" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="100" y="106" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="168" y="106" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="228" y="106" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="270" y="90" width="52" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="296" y="106" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="360" y="106" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="432" y="106" text-anchor="middle" font-size="11" fill="#333">3</text>

  <!-- Row 2: i=1, plants[1]=2, cur=3, yes, 1, ans=2, cur=1 -->
  <rect x="28" y="120" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="48" y="140" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="100" y="140" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="168" y="140" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="228" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="270" y="124" width="52" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="296" y="140" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="360" y="140" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="432" y="140" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- Row 3: i=2, plants[2]=3, cur=1, no, 5, ans=7, cur=2 -->
  <rect x="28" y="154" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="48" y="174" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="100" y="174" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="168" y="174" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="228" y="174" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <rect x="262" y="158" width="68" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="296" y="174" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">2×2+1=5</text>
  <text x="360" y="174" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="432" y="174" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- Row 4: i=3, plants[3]=3, cur=2, no, 7, ans=14, cur=2 -->
  <rect x="28" y="188" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="48" y="208" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="100" y="208" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="168" y="208" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="228" y="208" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <rect x="262" y="192" width="68" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="296" y="208" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">2×3+1=7</text>
  <text x="360" y="208" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">14</text>
  <text x="432" y="208" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- divider -->
  <path d="M 28 230 L 530 230" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Final result -->
  <rect x="80" y="244" width="400" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最终答案：ans = 1 + 1 + 5 + 7 = 14</text>

  <!-- Step breakdown -->
  <text x="36" y="302" font-size="10.5" fill="#666">步数拆解：</text>

  <!-- direct steps (green) -->
  <rect x="100" y="288" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="120" y="307" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="146" y="307" font-size="11" fill="#888">+</text>
  <rect x="156" y="288" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="176" y="307" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="202" y="307" font-size="11" fill="#888">+</text>

  <!-- refill steps (orange) -->
  <rect x="212" y="288" width="48" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="236" y="307" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">5</text>
  <text x="266" y="307" font-size="11" fill="#888">+</text>
  <rect x="276" y="288" width="48" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="300" y="307" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">7</text>
  <text x="332" y="307" font-size="11" fill="#888">=</text>

  <!-- result -->
  <rect x="344" y="288" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="368" y="307" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">14</text>

  <!-- bottom note -->
  <rect x="60" y="330" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i=2: cur=1&lt;3 → 折返 2×2+1=5 步；i=3: cur=2&lt;3 → 折返 2×3+1=7 步</text>
  <text x="280" y="365" text-anchor="middle" font-size="10" fill="#888">折返时从位置 i−1 回河边(i 步) 再走到植物 i(i+1 步)</text>
</svg>
