<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：找最左 6，改 9 即停</text>

  <rect x="200" y="48" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M260,82 L260,100" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" fill="none" filter="url(#rough2)"/>

  <rect x="170" y="102" width="180" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">从左向右扫描各位数字</text>
  <path d="M260,136 L260,154" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" fill="none" filter="url(#rough2)"/>

  <polygon points="260,156 360,196 260,236 160,196" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="194" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">当前位 = 6 ?</text>

  <path d="M160,196 L100,196 L100,250" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="108" y="188" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="40" y="252" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="274" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">改为 9，停止</text>
  <path d="M100,286 L100,316" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" fill="none" filter="url(#rough2)"/>

  <path d="M360,196 L420,196 L420,250" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" fill="none" filter="url(#rough2)"/>
  <text x="392" y="188" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="370" y="252" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="274" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">看下一位</text>
  <path d="M430,236 L430,252" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <path d="M430,286 L430,310 L260,310 L260,330" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" fill="none" filter="url(#rough2)"/>
  <path d="M260,236 L260,250 L430,250" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="330" y="304" font-size="11" fill="#888" filter="url(#rough2)">无更多位</text>

  <rect x="180" y="332" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="354" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回结果</text>
  <path d="M100,316 L100,349 L180,349" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" fill="none" filter="url(#rough2)"/>
</svg>
