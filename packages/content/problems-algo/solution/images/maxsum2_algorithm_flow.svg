<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：前缀和 + 滚动最大值</text>

  <!-- Step 1: prefix sum -->
  <rect x="60" y="44" width="400" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">① 计算前缀和 prefix[0..n]</text>
  <text x="260" y="80" text-anchor="middle" font-size="11" fill="#888">prefix[i+1] = prefix[i] + nums[i]，子数组和 O(1)</text>

  <path d="M 260 90 L 260 104" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: define helper -->
  <rect x="60" y="108" width="400" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="128" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">② 定义 maxSum(L, M)：L 在左、M 在右</text>
  <text x="260" y="144" text-anchor="middle" font-size="11" fill="#888">maxL = 0, ans = 0</text>

  <path d="M 260 154 L 260 168" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: loop diamond -->
  <polygon points="260,172 380,214 260,256 140,214" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="206" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">i ∈ [L−1, n−M−1] ?</text>
  <text x="260" y="222" text-anchor="middle" font-size="10.5" fill="#888">遍历每个分割点</text>

  <!-- yes branch -->
  <text x="395" y="218" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 380 214 L 400 214" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop body -->
  <rect x="400" y="190" width="100" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="208" text-anchor="middle" font-size="10.5" fill="#333">更新 maxL</text>
  <text x="450" y="222" text-anchor="middle" font-size="10.5" fill="#333">算 sumM</text>
  <text x="450" y="234" text-anchor="middle" font-size="10.5" fill="#333">更新 ans</text>

  <!-- loop back arrow -->
  <path d="M 450 190 L 450 182 L 260 182 L 260 172" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no branch -->
  <text x="268" y="272" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 260 256 L 260 270" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: return helper -->
  <rect x="60" y="276" width="400" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">③ 返回 maxSum(L, M)（此顺序的最优解）</text>

  <path d="M 260 318 L 260 332" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: swap and call again -->
  <rect x="60" y="336" width="400" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="356" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">④ 换序再调一次：maxSum(M, L)</text>
  <text x="260" y="372" text-anchor="middle" font-size="11" fill="#888">M 在左、L 在右，覆盖另一种排列</text>

  <path d="M 260 382 L 260 396" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6: final answer -->
  <rect x="60" y="400" width="400" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="420" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">⑤ ans = max( maxSum(L,M), maxSum(M,L) )</text>
  <text x="260" y="436" text-anchor="middle" font-size="11" fill="#888">两种排列取较大 → 全局最优</text>
</svg>
