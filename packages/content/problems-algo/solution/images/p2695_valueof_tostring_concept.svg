<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心直觉：JS 对象靠 valueOf / toString 两个「钩子」响应类型转换</text>

  <!-- The ArrayWrapper object -->
  <rect x="200" y="52" width="200" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="76" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">ArrayWrapper 实例 obj</text>
  <text x="300" y="94" text-anchor="middle" font-size="11" fill="#888">构造时把 nums 存进 this.nums</text>

  <!-- valueOf hook -->
  <rect x="216" y="104" width="168" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="123" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">valueOf() → 数组元素之和</text>

  <!-- toString hook -->
  <rect x="216" y="138" width="168" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="157" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">toString() → "[1,2,3]"</text>

  <!-- left: + operator triggers valueOf (numeric coercion) -->
  <rect x="20" y="210" width="240" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="140" y="232" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">obj1 + obj2  （加号运算）</text>
  <text x="140" y="250" text-anchor="middle" font-size="11" fill="#888">JS 要把对象转数字 → 调 valueOf</text>

  <path d="M 240 230 L 286 160" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- right: String() triggers toString (string coercion) -->
  <rect x="340" y="210" width="240" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="232" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">String(obj)  / 模板串</text>
  <text x="460" y="250" text-anchor="middle" font-size="11" fill="#888">JS 要把对象转字符串 → 调 toString</text>

  <path d="M 360 230 L 314 160" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- bottom: results -->
  <rect x="40" y="286" width="240" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="316" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">sum(obj1.nums) + sum(obj2.nums)</text>

  <rect x="320" y="286" width="240" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="440" y="316" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">"[" + nums.join(",") + "]"</text>

  <!-- key insight -->
  <rect x="40" y="348" width="520" height="40" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="372" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">关键：不用自己拦截 +，只要实现 valueOf / toString，JS 引擎自动在合适场景调用</text>
</svg>
