<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2763w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [2, 3, 1, 4]</text>

  <!-- array row -->
  <text x="50" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">下标</text>
  <text x="120" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">0</text>
  <text x="170" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">1</text>
  <text x="220" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">2</text>
  <text x="270" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">3</text>

  <rect x="95" y="64" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="120" y="90" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">2</text>
  <rect x="145" y="64" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="170" y="90" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">3</text>
  <rect x="195" y="64" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="220" y="90" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">1</text>
  <rect x="245" y="64" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="270" y="90" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">4</text>

  <!-- Term A table -->
  <rect x="30" y="120" width="500" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="50" y="140" font-size="12" fill="#446688" font-weight="bold">项 A = Σ|D|（前驱 prev[i] = −1）</text>
  <text x="50" y="160" font-size="11" fill="#446688">i=0: (0−(−1))·(4−0)=1·4=4</text>
  <text x="50" y="176" font-size="11" fill="#446688">i=1: (1−(−1))·(4−1)=2·3=6</text>
  <text x="50" y="192" font-size="11" fill="#446688">i=2: (2−(−1))·(4−2)=3·2=6</text>
  <text x="300" y="160" font-size="11" fill="#446688">i=3: (3−(−1))·(4−3)=4·1=4</text>
  <text x="300" y="192" font-size="12" fill="#446688" font-weight="bold">A = 4+6+6+4 = 20</text>

  <!-- Term N -->
  <rect x="30" y="220" width="500" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="50" y="242" font-size="12" fill="#4a7a3a" font-weight="bold">项 B = N = 4·5/2 = 10（共 10 个子数组，各 −1）</text>

  <!-- Term C table -->
  <rect x="30" y="262" width="500" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="50" y="282" font-size="12" fill="#b85450" font-weight="bold">项 C = Σ_v 含 v 且含 v+1 的子数组数</text>
  <text x="50" y="302" font-size="11" fill="#b85450">v=1: 含{1,2} → [2,3,1]·[2,3,1,4] = 2</text>
  <text x="50" y="318" font-size="11" fill="#b85450">v=2: 含{2,3} → 3 个</text>
  <text x="50" y="334" font-size="11" fill="#b85450">v=3: 含{3,4} → 2 个</text>
  <text x="300" y="334" font-size="12" fill="#b85450" font-weight="bold">C = 2+3+2 = 7</text>

  <!-- final -->
  <path d="M280,358 L280,378" stroke="#446688" stroke-width="2" marker-end="url(#arr2763w)" filter="url(#rough2)"/>
  <rect x="110" y="382" width="340" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="402" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">ans = A − B − C = 20 − 10 − 7</text>
  <text x="280" y="420" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">= 3 ✓</text>
</svg>
