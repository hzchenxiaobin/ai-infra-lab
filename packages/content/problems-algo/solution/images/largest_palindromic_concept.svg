<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：频次配对 → 大数字放外层 → 最大落单当中心</text>

  <!-- Step1: count digits -->
  <text x="40" y="64" font-size="12.5" fill="#446688" font-weight="bold">① 数频次</text>
  <g font-size="13" text-anchor="middle">
    <rect x="40" y="74" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="60" y="96" fill="#333">9</text>
    <rect x="84" y="74" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="104" y="96" fill="#333">8</text>
    <rect x="128" y="74" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="148" y="96" fill="#333">7</text>
    <rect x="172" y="74" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="192" y="96" fill="#b8860b" font-weight="bold">4</text>
    <rect x="216" y="74" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="236" y="96" fill="#888">…</text>
    <rect x="260" y="74" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="280" y="96" fill="#b85450" font-weight="bold">0</text>
  </g>
  <text x="320" y="96" font-size="11" fill="#888">cnt[d]</text>

  <!-- arrow down -->
  <path d="M 150 112 L 150 138" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step2: take pairs, build left descending -->
  <text x="40" y="160" font-size="12.5" fill="#4a7a3a" font-weight="bold">② 取对 ⌊cnt/2⌋，按 9→0 拼左半</text>
  <g font-size="14" text-anchor="middle">
    <rect x="40" y="170" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="55" y="191" fill="#333">7</text>
    <rect x="72" y="170" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="87" y="191" fill="#333">4</text>
    <rect x="104" y="170" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="119" y="191" fill="#333">4</text>
    <text x="150" y="191" font-size="11.5" fill="#4a7a3a">大数字放外层（左首=最高位）</text>
  </g>

  <!-- center -->
  <path d="M 150 206 L 150 232" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="40" y="252" font-size="12.5" fill="#d6a040" font-weight="bold">③ 中心 = 最大奇计数数字</text>
  <rect x="40" y="262" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="60" y="284" text-anchor="middle" font-size="14" fill="#b8860b" font-weight="bold">9</text>
  <text x="96" y="284" font-size="11.5" fill="#888">cnt[9] 奇 → 落单当中心</text>

  <!-- Step4: assemble -->
  <path d="M 150 298 L 150 322" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="40" y="342" font-size="12.5" fill="#446688" font-weight="bold">④ 拼接 left + center + left^R</text>
  <g font-size="15" text-anchor="middle" font-weight="bold">
    <rect x="40" y="352" width="32" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="56" y="375" fill="#333">7</text>
    <rect x="74" y="352" width="32" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="90" y="375" fill="#333">4</text>
    <rect x="108" y="352" width="32" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="124" y="375" fill="#333">4</text>
    <rect x="142" y="352" width="32" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="158" y="375" fill="#b8860b">9</text>
    <rect x="176" y="352" width="32" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="192" y="375" fill="#333">4</text>
    <rect x="210" y="352" width="32" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="226" y="375" fill="#333">4</text>
    <rect x="244" y="352" width="32" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="260" y="375" fill="#333">7</text>
    <text x="200" y="404" font-size="12" fill="#4a7a3a" font-weight="bold">= "7449447"</text>
  </g>

  <!-- leading zero warning box on right -->
  <rect x="370" y="140" width="250" height="150" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="495" y="166" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">⚠ 前导零的坑</text>
  <text x="384" y="192" font-size="11.5" fill="#555">若 left 非空且首字符 = '0'</text>
  <text x="384" y="210" font-size="11.5" fill="#555">⇒ 1~9 全无配对，只有 0 成对</text>
  <text x="384" y="228" font-size="11.5" fill="#555">⇒ left 全是 0，拼出形如 "00…0…0"</text>
  <text x="384" y="248" font-size="11.5" fill="#b85450" font-weight="bold">处理：丢弃全部配对，只留 center</text>
  <text x="384" y="266" font-size="11" fill="#888">例 "00009" → left "00"→丢 → "9"</text>

  <text x="320" y="442" text-anchor="middle" font-size="10.5" fill="#888">注：每对贡献左右各一位；中心至多一个落单数字</text>
</svg>
