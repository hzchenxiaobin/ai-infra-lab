<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：相同值两两配对，每个值独立贡献 ⌊c/2⌋ 对 + c mod 2 余</text>

  <!-- Card 1: value 1, count 2 -->
  <rect x="30" y="46" width="150" height="186" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="105" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">值 1：出现 2 次</text>
  <path d="M 80 92 Q 105 78 130 92" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="105" y="84" text-anchor="middle" font-size="10" fill="#b85450">配对</text>
  <rect x="62" y="96" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="121" text-anchor="middle" font-size="15" fill="#333">1</text>
  <rect x="108" y="96" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="121" text-anchor="middle" font-size="15" fill="#333">1</text>
  <path d="M 105 138 L 105 156" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="48" y="160" width="114" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="105" y="180" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">1 对 + 0 余</text>
  <text x="105" y="212" text-anchor="middle" font-size="10.5" fill="#888">⌊2/2⌋=1, 2 mod 2=0</text>

  <!-- Card 2: value 2, count 3 -->
  <rect x="200" y="46" width="150" height="186" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="275" y="68" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">值 2：出现 3 次</text>
  <path d="M 227 92 Q 251 78 275 92" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="251" y="84" text-anchor="middle" font-size="10" fill="#b85450">配对</text>
  <rect x="207" y="96" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="227" y="121" text-anchor="middle" font-size="15" fill="#333">2</text>
  <rect x="255" y="96" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="121" text-anchor="middle" font-size="15" fill="#333">2</text>
  <!-- leftover cell highlighted red -->
  <rect x="303" y="96" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="323" y="121" text-anchor="middle" font-size="15" fill="#b85450">2</text>
  <text x="323" y="148" text-anchor="middle" font-size="10" fill="#b85450">余 1</text>
  <path d="M 275 152 L 275 160" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="218" y="164" width="114" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="275" y="184" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">1 对 + 1 余</text>
  <text x="275" y="216" text-anchor="middle" font-size="10.5" fill="#888">⌊3/2⌋=1, 3 mod 2=1</text>

  <!-- Card 3: value 3, count 2 -->
  <rect x="370" y="46" width="150" height="186" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="445" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">值 3：出现 2 次</text>
  <path d="M 420 92 Q 445 78 470 92" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="445" y="84" text-anchor="middle" font-size="10" fill="#b85450">配对</text>
  <rect x="402" y="96" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="422" y="121" text-anchor="middle" font-size="15" fill="#333">3</text>
  <rect x="448" y="96" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="468" y="121" text-anchor="middle" font-size="15" fill="#333">3</text>
  <path d="M 445 138 L 445 156" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="388" y="160" width="114" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="445" y="180" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">1 对 + 0 余</text>
  <text x="445" y="212" text-anchor="middle" font-size="10.5" fill="#888">⌊2/2⌋=1, 2 mod 2=0</text>

  <!-- Divider -->
  <path d="M 40 250 L 520 250" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Formula bar -->
  <rect x="60" y="262" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">答案 = ( Σ⌊c/2⌋ , Σ(c mod 2) )</text>
  <text x="280" y="299" text-anchor="middle" font-size="10.5" fill="#888">= (1+1+1, 0+1+0) = (3, 1)</text>

  <!-- Notes -->
  <text x="60" y="328" font-size="11" fill="#555">• 不同值之间不能配对（必须相等），故每个值独立计数</text>
  <text x="60" y="346" font-size="11" fill="#555">• 配对先后无关：c 个相同值至多凑 ⌊c/2⌋ 对，剩 c mod 2 个</text>
</svg>
