<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：一次握手将圆环切成两个独立子问题</text>

  <!-- Circle outline -->
  <ellipse cx="260" cy="200" rx="130" ry="130" fill="none" stroke="#ccc" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- Left group arc fill (people 1,2) -->
  <path d="M 345 95 A 130 130 0 0 1 380 180 A 130 130 0 0 1 345 265 L 260 60 A 130 130 0 0 0 345 95 Z" fill="#e6f4ea" fill-opacity="0.35" stroke="none" filter="url(#rough2)"/>

  <!-- Right group arc fill (people 4,5,6,7) -->
  <path d="M 345 265 A 130 130 0 0 1 140 180 A 130 130 0 0 1 260 60 L 345 265 Z" fill="#e8f0fe" fill-opacity="0.3" stroke="none" filter="url(#rough2)"/>

  <!-- Handshake chord 0-3 (orange) -->
  <path d="M 260 60 L 345 265" stroke="#d6a040" stroke-width="2.5" fill="none" filter="url(#rough2)"/>

  <!-- People dots -->
  <!-- Person 0 (orange - the one making handshake) -->
  <circle cx="260" cy="60" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">0</text>

  <!-- Person 3 (orange - partner) -->
  <circle cx="345" cy="265" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="345" y="270" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>

  <!-- Person 1 (green - left group) -->
  <circle cx="345" cy="95" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="345" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- Person 2 (green - left group) -->
  <circle cx="380" cy="180" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="185" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- Person 4 (blue - right group) -->
  <circle cx="260" cy="330" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="335" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>

  <!-- Person 5 (blue) -->
  <circle cx="175" cy="265" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="175" y="270" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5</text>

  <!-- Person 6 (blue) -->
  <circle cx="130" cy="180" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="185" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">6</text>

  <!-- Person 7 (blue) -->
  <circle cx="175" cy="95" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="175" y="100" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">7</text>

  <!-- Left group label -->
  <rect x="385" y="120" width="110" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="440" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">左侧子问题</text>
  <text x="440" y="153" text-anchor="middle" font-size="10.5" fill="#4a7a3a">2 人 → dp[2]</text>

  <!-- Right group label -->
  <rect x="20" y="120" width="110" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="75" y="138" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">右侧子问题</text>
  <text x="75" y="153" text-anchor="middle" font-size="10.5" fill="#446688">4 人 → dp[4]</text>

  <!-- Crossing example (invalid) -->
  <path d="M 345 95 L 260 330" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="225" y="250" font-size="10" fill="#b85450">✗ 交叉！</text>

  <!-- Bottom formula -->
  <rect x="80" y="365" width="360" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="384" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">dp[8] += dp[2] × dp[4]（0 与 3 握手时）</text>
</svg>
