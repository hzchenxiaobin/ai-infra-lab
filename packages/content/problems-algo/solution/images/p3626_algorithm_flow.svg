<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：双向排名 → 条件聚合 → 双条件过滤 → 比值排序</text>

  <rect x="120" y="42" width="280" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① inventory 双向 ROW_NUMBER</text>
  <text x="260" y="80" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">rn_hi: price↓ qty↓｜rn_lo: price↑ qty↓</text>
  <text x="260" y="92" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">PARTITION BY store_id</text>

  <path d="M 260 98 L 260 116" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="120" y="118" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="136" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">② JOIN stores</text>
  <text x="260" y="154" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">补 store_name、location</text>

  <path d="M 260 162 L 260 180" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="98" y="182" width="324" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="202" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">③ GROUP BY store_id + 条件聚合</text>
  <text x="260" y="220" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">MAX(CASE WHEN rn = 1 THEN … END)</text>
  <text x="260" y="236" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">抽出两个极值行 + COUNT(DISTINCT 商品)</text>

  <path d="M 260 244 L 260 262" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <polygon points="260,264 366,308 260,352 154,308" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">④ 不同商品 ≥ 3</text>
  <text x="260" y="316" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">且 贵的数量 &lt; 便宜的数量？</text>

  <path d="M 366 308 Q 396 308 420 308" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>
  <text x="394" y="296" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="424" y="290" width="80" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="464" y="312" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">剔除 ✗</text>

  <path d="M 260 352 L 260 370" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <text x="276" y="366" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="110" y="372" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="390" text-anchor="middle" font-size="11" fill="#3a6a2a" font-weight="bold" filter="url(#rough2)">⑤ ROUND(便宜数量 / 贵数量, 2)</text>
  <text x="260" y="408" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">→ imbalance_ratio</text>

  <path d="M 260 416 L 260 432" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="70" y="434" width="380" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="454" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">⑥ ORDER BY ratio DESC, store_name ASC → 输出 6 列</text>
</svg>
