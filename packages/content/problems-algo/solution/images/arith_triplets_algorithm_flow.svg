<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建哈希集合 → 遍历每个 x 作中项 → 两端都在则计数</text>

  <!-- Input -->
  <rect x="160" y="40" width="240" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输入：nums, diff</text>
  <text x="280" y="74" text-anchor="middle" font-size="10.5" fill="#888">如 nums=[0,1,4,6,7,10], diff=3</text>

  <path d="M 280 82 L 280 94" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 1: build set -->
  <rect x="70" y="98" width="420" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">① 建哈希集合 S = set(nums)</text>
  <text x="280" y="138" text-anchor="middle" font-size="10.5" fill="#888">O(n) 一次入集合，后续查询 O(1)</text>

  <path d="M 280 148 L 280 162" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Loop header -->
  <rect x="160" y="164" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="186" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">② 对每个 x ∈ nums（作中项）</text>

  <path d="M 260 198 L 260 214" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <path d="M 260 216 L 352 256 L 260 296 L 168 256 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">x−diff∈S</text>
  <text x="260" y="268" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">且 x+diff∈S ?</text>

  <!-- Yes branch -->
  <path d="M 352 256 L 398 256" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="378" y="250" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="400" y="238" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="460" y="261" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans++</text>

  <!-- No branch -->
  <path d="M 260 296 L 260 318" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="276" y="312" font-size="10.5" fill="#b85450" font-weight="bold">否</text>

  <!-- loop back path: from ans++ down, merge with no, go left and up to loop header -->
  <path d="M 460 274 L 460 342 L 48 342 L 48 181 L 158 181" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 260 318 L 260 342" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="120" y="336" text-anchor="middle" font-size="10.5" fill="#888">取下一 x，回到循环</text>

  <!-- return branch from loop header -->
  <path d="M 360 181 L 398 181" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="376" y="175" text-anchor="middle" font-size="10" fill="#888">遍历完</text>
  <rect x="400" y="164" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="465" y="186" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">③ return ans</text>

  <!-- footer -->
  <text x="40" y="404" font-size="10.5" fill="#888">注：仅当中项 x 同时查到左邻 x−diff 与右邻 x+diff 才计数；</text>
  <text x="40" y="422" font-size="10.5" fill="#888">    严格递增保证三值下标天然有序，故「查到即合法」，无需二分定位下标。</text>
  <text x="40" y="440" font-size="10.5" fill="#888">复杂度：建集合 O(n) + 遍历查询 O(n) = 总 O(n) 时间，O(n) 空间。</text>
</svg>
