<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：n=3，分治生成 5 棵 BST</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">每个根 i：左列表 × 右列表（笛卡尔积），空区间返回 [None]</text>

  <!-- ===== Top: build(1,3) entry ===== -->
  <rect x="200" y="52" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">build(1, 3)</text>
  <text x="280" y="92" text-anchor="middle" font-size="9" fill="#888">枚举根 i = 1 / 2 / 3</text>

  <!-- three fan-out arrows -->
  <path d="M 240 96 Q 130 110 100 130" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 96 L 280 130" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 96 Q 430 110 460 130" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Group backgrounds ===== -->
  <rect x="20" y="132" width="180" height="140" fill="#f4f8fe" stroke="#bcd" stroke-width="0.8" stroke-dasharray="3,3" rx="6" filter="url(#rough2)"/>
  <rect x="210" y="132" width="140" height="140" fill="#f3f9f3" stroke="#ccd" stroke-width="0.8" stroke-dasharray="3,3" rx="6" filter="url(#rough2)"/>
  <rect x="360" y="132" width="180" height="140" fill="#fef8ee" stroke="#dc6" stroke-width="0.8" stroke-dasharray="3,3" rx="6" filter="url(#rough2)"/>

  <!-- group titles -->
  <text x="110" y="148" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">根 i = 1</text>
  <text x="280" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">根 i = 2</text>
  <text x="450" y="148" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">根 i = 3</text>

  <!-- ===== Group 1: root=1, left=[None], right=[2->3, 3->2] ===== -->
  <text x="110" y="166" text-anchor="middle" font-size="9" fill="#555">左 build(1,0) = [None]</text>
  <text x="50" y="184" font-size="9" fill="#888">∅</text>
  <text x="110" y="184" text-anchor="middle" font-size="9" fill="#555">右 build(2,3) = 2 棵：</text>
  <!-- mini right options -->
  <g stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)">
    <line x1="60" y1="200" x2="72" y2="214"/>
    <line x1="72" y1="222" x2="84" y2="236"/>
  </g>
  <circle cx="60" cy="196" r="7" fill="#446688" filter="url(#rough2)"/>
  <text x="60" y="199" text-anchor="middle" font-size="7" fill="#fff">2</text>
  <circle cx="72" cy="218" r="7" fill="#446688" filter="url(#rough2)"/>
  <text x="72" y="221" text-anchor="middle" font-size="7" fill="#fff">3</text>
  <text x="40" y="252" font-size="8" fill="#888">2→3</text>

  <g stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)">
    <line x1="140" y1="200" x2="152" y2="214"/>
    <line x1="152" y1="222" x2="140" y2="236"/>
  </g>
  <circle cx="140" cy="196" r="7" fill="#446688" filter="url(#rough2)"/>
  <text x="140" y="199" text-anchor="middle" font-size="7" fill="#fff">3</text>
  <circle cx="152" cy="218" r="7" fill="#446688" filter="url(#rough2)"/>
  <text x="152" y="221" text-anchor="middle" font-size="7" fill="#fff">2</text>
  <text x="120" y="252" font-size="8" fill="#888">3←2</text>

  <text x="110" y="268" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">笛卡尔积 → 2 棵</text>

  <!-- ===== Group 2: root=2, left=[1], right=[3] ===== -->
  <text x="280" y="166" text-anchor="middle" font-size="9" fill="#555">左 build(1,1) = [1]</text>
  <circle cx="250" cy="196" r="7" fill="#446688" filter="url(#rough2)"/>
  <text x="250" y="199" text-anchor="middle" font-size="7" fill="#fff">1</text>
  <text x="280" y="184" text-anchor="middle" font-size="9" fill="#555">右 build(3,3) = [3]</text>
  <circle cx="310" cy="196" r="7" fill="#446688" filter="url(#rough2)"/>
  <text x="310" y="199" text-anchor="middle" font-size="7" fill="#fff">3</text>
  <text x="280" y="222" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1 × 1 → 1 棵</text>
  <text x="280" y="240" text-anchor="middle" font-size="9" fill="#888">根 2 + 左 1 + 右 3</text>
  <text x="280" y="258" text-anchor="middle" font-size="8" fill="#888">即下方第 3 棵</text>

  <!-- ===== Group 3: root=3, left=[1->2, 2->1], right=[None] ===== -->
  <text x="450" y="166" text-anchor="middle" font-size="9" fill="#555">左 build(1,2) = 2 棵：</text>
  <g stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)">
    <line x1="400" y1="200" x2="412" y2="214"/>
    <line x1="412" y1="222" x2="424" y2="236"/>
  </g>
  <circle cx="400" cy="196" r="7" fill="#446688" filter="url(#rough2)"/>
  <text x="400" y="199" text-anchor="middle" font-size="7" fill="#fff">1</text>
  <circle cx="412" cy="218" r="7" fill="#446688" filter="url(#rough2)"/>
  <text x="412" y="221" text-anchor="middle" font-size="7" fill="#fff">2</text>
  <text x="380" y="252" font-size="8" fill="#888">1→2</text>

  <g stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)">
    <line x1="480" y1="200" x2="492" y2="214"/>
    <line x1="492" y1="222" x2="480" y2="236"/>
  </g>
  <circle cx="480" cy="196" r="7" fill="#446688" filter="url(#rough2)"/>
  <text x="480" y="199" text-anchor="middle" font-size="7" fill="#fff">2</text>
  <circle cx="492" cy="218" r="7" fill="#446688" filter="url(#rough2)"/>
  <text x="492" y="221" text-anchor="middle" font-size="7" fill="#fff">1</text>
  <text x="460" y="252" font-size="8" fill="#888">2←1</text>

  <text x="450" y="268" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">右 build(4,3) = [None]</text>

  <!-- ===== Result: 5 final BSTs ===== -->
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">最终结果：5 棵 BST（红圈 = 根）</text>

  <!-- edges for 5 trees -->
  <g stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)">
    <line x1="80" y1="316" x2="98" y2="346"/>
    <line x1="98" y1="358" x2="116" y2="386"/>
    <line x1="180" y1="316" x2="198" y2="346"/>
    <line x1="198" y1="358" x2="180" y2="386"/>
    <line x1="280" y1="321" x2="262" y2="344"/>
    <line x1="280" y1="321" x2="298" y2="344"/>
    <line x1="380" y1="316" x2="362" y2="346"/>
    <line x1="362" y1="358" x2="344" y2="386"/>
    <line x1="480" y1="316" x2="462" y2="346"/>
    <line x1="462" y1="358" x2="480" y2="386"/>
  </g>
  <g font-size="11" fill="#fff" font-weight="bold">
    <circle cx="80" cy="310" r="11" fill="#b85450" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
    <text x="80" y="314" text-anchor="middle">1</text>
    <circle cx="98" cy="352" r="10" fill="#446688" filter="url(#rough2)"/>
    <text x="98" y="356" text-anchor="middle" font-size="10">2</text>
    <circle cx="116" cy="392" r="10" fill="#446688" filter="url(#rough2)"/>
    <text x="116" y="396" text-anchor="middle" font-size="10">3</text>

    <circle cx="180" cy="310" r="11" fill="#b85450" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
    <text x="180" y="314" text-anchor="middle">1</text>
    <circle cx="198" cy="352" r="10" fill="#446688" filter="url(#rough2)"/>
    <text x="198" y="356" text-anchor="middle" font-size="10">3</text>
    <circle cx="180" cy="392" r="10" fill="#446688" filter="url(#rough2)"/>
    <text x="180" y="396" text-anchor="middle" font-size="10">2</text>

    <circle cx="280" cy="316" r="11" fill="#b85450" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
    <text x="280" y="320" text-anchor="middle">2</text>
    <circle cx="262" cy="352" r="10" fill="#446688" filter="url(#rough2)"/>
    <text x="262" y="356" text-anchor="middle" font-size="10">1</text>
    <circle cx="298" cy="352" r="10" fill="#446688" filter="url(#rough2)"/>
    <text x="298" y="356" text-anchor="middle" font-size="10">3</text>

    <circle cx="380" cy="310" r="11" fill="#b85450" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
    <text x="380" y="314" text-anchor="middle">3</text>
    <circle cx="362" cy="352" r="10" fill="#446688" filter="url(#rough2)"/>
    <text x="362" y="356" text-anchor="middle" font-size="10">2</text>
    <circle cx="344" cy="392" r="10" fill="#446688" filter="url(#rough2)"/>
    <text x="344" y="396" text-anchor="middle" font-size="10">1</text>

    <circle cx="480" cy="310" r="11" fill="#b85450" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
    <text x="480" y="314" text-anchor="middle">3</text>
    <circle cx="462" cy="352" r="10" fill="#446688" filter="url(#rough2)"/>
    <text x="462" y="356" text-anchor="middle" font-size="10">1</text>
    <circle cx="480" cy="392" r="10" fill="#446688" filter="url(#rough2)"/>
    <text x="480" y="396" text-anchor="middle" font-size="10">2</text>
  </g>

  <text x="280" y="424" text-anchor="middle" font-size="10" fill="#888">2 + 1 + 2 = 5 棵，答案数即卡塔兰数 G(3)=C₃=5</text>
</svg>
