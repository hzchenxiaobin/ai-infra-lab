<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：releaseTimes = [9,29,49,50]，keysPressed = "cbcd"</text>

  <!-- Table outer frame -->
  <rect x="30" y="52" width="470" height="140" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- Column header background -->
  <rect x="30" y="52" width="470" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <!-- Header text -->
  <g font-size="11" fill="#446688" text-anchor="middle" font-weight="bold">
    <text x="50" y="69">序号</text>
    <text x="85" y="69">i</text>
    <text x="120" y="69">key</text>
    <text x="185" y="69">releaseTimes[i]</text>
    <text x="275" y="69">duration d</text>
    <text x="365" y="69">ansDur</text>
    <text x="455" y="69">ansKey</text>
  </g>

  <!-- Column separators -->
  <g stroke="#dde" stroke-width="1" filter="url(#rough2)">
    <line x1="70" y1="52" x2="70" y2="192"/>
    <line x1="100" y1="52" x2="100" y2="192"/>
    <line x1="140" y1="52" x2="140" y2="192"/>
    <line x1="230" y1="52" x2="230" y2="192"/>
    <line x1="320" y1="52" x2="320" y2="192"/>
    <line x1="410" y1="52" x2="410" y2="192"/>
  </g>
  <!-- Row separators -->
  <g stroke="#dde" stroke-width="1" filter="url(#rough2)">
    <line x1="30" y1="78" x2="500" y2="78"/>
    <line x1="30" y1="104" x2="500" y2="104"/>
    <line x1="30" y1="130" x2="500" y2="130"/>
    <line x1="30" y1="156" x2="500" y2="156"/>
  </g>

  <!-- Row backgrounds (highlight) -->
  <rect x="30" y="78" width="470" height="26" fill="#f0f7ff" filter="url(#rough2)"/>
  <rect x="30" y="104" width="470" height="26" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="30" y="130" width="470" height="26" fill="#fce4ec" filter="url(#rough2)"/>
  <rect x="30" y="156" width="470" height="26" fill="#f5f5f5" filter="url(#rough2)"/>

  <!-- Row data -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <!-- Row 1: i=0 init -->
    <text x="50" y="95">1</text>
    <text x="85" y="95">0</text>
    <text x="120" y="95" font-weight="bold">c</text>
    <text x="185" y="95">9</text>
    <text x="275" y="95">9（初值）</text>
    <text x="365" y="95" fill="#446688" font-weight="bold">9</text>
    <text x="455" y="95" fill="#446688" font-weight="bold">c</text>

    <!-- Row 2: i=1 d=20 > 9 update -->
    <text x="50" y="121">2</text>
    <text x="85" y="121">1</text>
    <text x="120" y="121" font-weight="bold">b</text>
    <text x="185" y="121">29</text>
    <text x="275" y="121">29−9 = 20</text>
    <text x="365" y="121" fill="#d6a040" font-weight="bold">20</text>
    <text x="455" y="121" fill="#d6a040" font-weight="bold">b</text>

    <!-- Row 3: i=2 d=20 == 20, c > b tie-break -->
    <text x="50" y="147">3</text>
    <text x="85" y="147">2</text>
    <text x="120" y="147" font-weight="bold" fill="#b85450">c</text>
    <text x="185" y="147">49</text>
    <text x="275" y="147">49−29 = 20</text>
    <text x="365" y="147" fill="#b85450" font-weight="bold">20</text>
    <text x="455" y="147" fill="#b85450" font-weight="bold">c</text>

    <!-- Row 4: i=3 d=1 no update -->
    <text x="50" y="173">4</text>
    <text x="85" y="173">3</text>
    <text x="120" y="173" font-weight="bold">d</text>
    <text x="185" y="173">50</text>
    <text x="275" y="173">50−49 = 1</text>
    <text x="365" y="173" fill="#888">20</text>
    <text x="455" y="173" fill="#888">c</text>
  </g>

  <!-- Step annotations -->
  <g font-size="11" fill="#555">
    <text x="510" y="95" fill="#446688">第 0 键作初值</text>
    <text x="510" y="121" fill="#d6a040">d&gt;ansDur → 更新</text>
    <text x="510" y="147" fill="#b85450" font-weight="bold">d==ansDur,</text>
    <text x="510" y="161" fill="#b85450" font-weight="bold">c&gt;b → 换键</text>
    <text x="510" y="173" fill="#888">d&lt;ansDur → 跳过</text>
  </g>

  <!-- Bottom conclusion box -->
  <rect x="60" y="216" width="440" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="78" y="238" font-size="12" fill="#4a7a3a" font-weight="bold">关键步骤解读</text>
  <text x="78" y="258" font-size="11" fill="#555">• 步骤 2：d = 20 &gt; ansDur(9)，时长更大，直接覆盖 ansDur 与 ansKey → b</text>
  <text x="78" y="278" font-size="11" fill="#555">• 步骤 3：d = 20 == ansDur(20)，时长并列，按键 c 字母序大于 b → 仅换 ansKey → c</text>
  <text x="78" y="298" font-size="11" fill="#555">• 步骤 4：d = 1 &lt; ansDur(20)，既不变大也不并列 → 一律跳过</text>
  <text x="78" y="320" font-size="12" fill="#b85450" font-weight="bold">最终返回 ansKey = 'c' ✓</text>
</svg>
