<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="410" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">Self JOIN：同表配对，p1.id &gt; p2.id 标出"待删行"</text>

  <!-- p1 table (待删候选视角) -->
  <text x="90" y="58" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Person p1（待删视角）</text>
  <rect x="40" y="64" width="100" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="79" font-size="10" fill="#333">id</text>
  <text x="105" y="79" font-size="10" fill="#333">email</text>
  <line x1="78" y1="64" x2="78" y2="86" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="86" width="100" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="100" font-size="10" fill="#999">1</text>
  <text x="105" y="100" font-size="10" fill="#999">a@b.com</text>
  <line x1="78" y1="86" x2="78" y2="106" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="106" width="100" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="120" font-size="10" fill="#999">2</text>
  <text x="105" y="120" font-size="10" fill="#999">c@d.com</text>
  <line x1="78" y1="106" x2="78" y2="126" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="126" width="100" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="140" font-size="10" fill="#333">3</text>
  <text x="105" y="140" font-size="10" fill="#333">a@b.com</text>
  <line x1="78" y1="126" x2="78" y2="146" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- JOIN condition box -->
  <rect x="170" y="96" width="150" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="245" y="116" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">JOIN ON</text>
  <text x="245" y="132" text-anchor="middle" font-size="9" fill="#333">p1.email = p2.email</text>
  <text x="245" y="146" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">AND p1.id &gt; p2.id</text>

  <!-- p2 table (存活视角) -->
  <text x="490" y="58" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Person p2（存活视角）</text>
  <rect x="440" y="64" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="79" font-size="10" fill="#333">id</text>
  <text x="505" y="79" font-size="10" fill="#333">email</text>
  <line x1="478" y1="64" x2="478" y2="86" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="440" y="86" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="460" y="100" font-size="10" fill="#333">1</text>
  <text x="505" y="100" font-size="10" fill="#333">a@b.com</text>
  <line x1="478" y1="86" x2="478" y2="106" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="440" y="106" width="100" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="460" y="120" font-size="10" fill="#999">2</text>
  <text x="505" y="120" font-size="10" fill="#999">c@d.com</text>
  <line x1="478" y1="106" x2="478" y2="126" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="440" y="126" width="100" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="460" y="140" font-size="10" fill="#999">3</text>
  <text x="505" y="140" font-size="10" fill="#999">a@b.com</text>
  <line x1="478" y1="126" x2="478" y2="146" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- pairing arrows: p1.id=3 → p2.id=1 (same email, 3>1) -->
  <path d="M140 136 Q 180 156 220 130" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M320 130 Q 360 156 440 96" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- p1.id=1, p1.id=2 no match (dim) -->
  <text x="90" y="172" text-anchor="middle" font-size="9" fill="#999">id=1: 无 p2 满足 1&gt;p2.id → 保留</text>
  <text x="490" y="172" text-anchor="middle" font-size="9" fill="#999">id=3 在 p2 视角也无 3&gt;p2.id 配对 → 不重复触发</text>

  <!-- DELETE arrow -->
  <path d="M90 190 L90 224" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="125" y="212" font-size="11" fill="#b85450" font-weight="bold">DELETE p1</text>

  <!-- Result table -->
  <text x="290" y="248" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">删除后 Person（保留每组最小 id）</text>
  <rect x="220" y="256" width="140" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="271" font-size="10" fill="#333">id</text>
  <text x="300" y="271" font-size="10" fill="#333">email</text>
  <line x1="265" y1="256" x2="265" y2="278" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="220" y="278" width="140" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="245" y="292" font-size="10" fill="#333">1</text>
  <text x="300" y="292" font-size="10" fill="#333">a@b.com</text>
  <line x1="265" y1="278" x2="265" y2="298" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="220" y="298" width="140" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="245" y="312" font-size="10" fill="#333">2</text>
  <text x="300" y="312" font-size="10" fill="#333">c@d.com</text>
  <line x1="265" y1="298" x2="265" y2="318" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- insight box -->
  <rect x="40" y="338" width="500" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="358" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">核心：DELETE 需要"行级定位"，不只是"组级查重"</text>
  <text x="60" y="376" font-size="10" fill="#333">① 182（SELECT 重复 email）只需组级答案：GROUP BY + HAVING COUNT&gt;1</text>
  <text x="60" y="392" font-size="10" fill="#333">② 196（DELETE 重复行）需指明删哪一行：用 p1.id &gt; p2.id 选出"较大 id"那行删掉，留"较小 id"存活</text>
</svg>
