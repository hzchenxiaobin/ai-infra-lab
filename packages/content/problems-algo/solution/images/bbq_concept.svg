<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L8,0 L4,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="25" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">有限阻塞队列：生产者—消费者模型</text>

  <text x="80" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">生产者线程</text>
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">有界队列 capacity=3</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">消费者线程</text>

  <rect x="35" y="72" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="80" y="94" text-anchor="middle" font-size="11" fill="#333">Producer A</text>

  <rect x="35" y="118" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="80" y="140" text-anchor="middle" font-size="11" fill="#333">Producer B</text>

  <rect x="35" y="164" width="90" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="80" y="180" text-anchor="middle" font-size="10" fill="#b85450">enqueue 阻塞</text>
  <text x="80" y="192" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">队列满!</text>

  <path d="M 125 89 L 195 89" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 125 135 L 195 135" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="200" y="72" width="160" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <rect x="205" y="80" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="99" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="256" y="80" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="99" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="307" y="80" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="331" y="99" text-anchor="middle" font-size="12" fill="#333">3</text>

  <text x="280" y="134" text-anchor="middle" font-size="10" fill="#d6a040">size = 3 / capacity = 3</text>

  <rect x="200" y="148" width="160" height="24" fill="#fce4ec" fill-opacity="0.4" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="164" text-anchor="middle" font-size="10" fill="#b85450">队满 → not_full 不满足</text>

  <path d="M 435 89 L 365 89" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <path d="M 435 135 L 365 135" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>

  <rect x="435" y="72" width="90" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="480" y="94" text-anchor="middle" font-size="11" fill="#333">Consumer X</text>

  <rect x="435" y="118" width="90" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="480" y="140" text-anchor="middle" font-size="11" fill="#333">Consumer Y</text>

  <rect x="200" y="195" width="160" height="24" fill="#e8f0fe" fill-opacity="0.4" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="211" text-anchor="middle" font-size="10" fill="#446688">消费者 dequeue 后唤醒阻塞的生产者</text>

  <rect x="30" y="240" width="500" height="145" fill="#e8f0fe" fill-opacity="0.3" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="263" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">同步原语：mutex + 两个条件变量</text>

  <rect x="55" y="275" width="210" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="294" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">cv_not_full</text>
  <text x="160" y="312" text-anchor="middle" font-size="10" fill="#555">enqueue 时 size==capacity 则等待</text>
  <text x="160" y="324" text-anchor="middle" font-size="10" fill="#555">dequeue 后 notify 唤醒生产者</text>

  <rect x="295" y="275" width="210" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="294" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">cv_not_empty</text>
  <text x="400" y="312" text-anchor="middle" font-size="10" fill="#555">dequeue 时 size==0 则等待</text>
  <text x="400" y="324" text-anchor="middle" font-size="10" fill="#555">enqueue 后 notify 唤醒消费者</text>

  <rect x="55" y="338" width="450" height="36" fill="#e6f4ea" fill-opacity="0.4" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="361" text-anchor="middle" font-size="11" fill="#4a7a3a">一把 mutex 保护 size 与队列，两个 cv 分别管「不满」和「不空」</text>
</svg>
