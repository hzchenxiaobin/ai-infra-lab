<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="42" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：只有「相邻保留列」需要检查</text>

  <!-- 网格：grid = [[1,-1,1],[2,2,2]], limit = 1 -->
  <text x="100" y="92" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">col 0</text>
  <text x="155" y="92" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">col 1 ✗</text>
  <text x="210" y="92" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">col 2</text>

  <text x="60" y="130" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">行 0</text>
  <text x="60" y="175" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">行 1</text>

  <!-- col 0 -->
  <rect x="72" y="100" width="55" height="45" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="72" y="145" width="55" height="45" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <!-- col 1（被删除） -->
  <rect x="127" y="100" width="55" height="45" fill="#f5f5f5" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <rect x="127" y="145" width="55" height="45" fill="#f5f5f5" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <!-- col 2 -->
  <rect x="182" y="100" width="55" height="45" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="182" y="145" width="55" height="45" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>

  <text x="100" y="130" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="155" y="130" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">−1</text>
  <text x="210" y="130" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="100" y="175" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="155" y="175" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">2</text>
  <text x="210" y="175" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>

  <!-- col 1 上的红叉 -->
  <path d="M132,106 L177,184" stroke="#b85450" stroke-width="2.5" stroke-linecap="round" filter="url(#rough2)"/>
  <path d="M177,106 L132,184" stroke="#b85450" stroke-width="2.5" stroke-linecap="round" filter="url(#rough2)"/>

  <!-- 保留列之间的绿弧箭头 -->
  <path d="M99,196 Q154,238 206,196" fill="none" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="154" y="248" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">相邻保留列（跳过被删列）</text>

  <!-- 右侧：相容检查框 -->
  <rect x="300" y="96" width="195" height="112" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="397" y="120" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">相容检查：col 0 ↔ col 2</text>
  <text x="397" y="144" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">行 0： |1−1| = 0 ≤ 1  ✓</text>
  <text x="397" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">行 1： |2−2| = 0 ≤ 1  ✓</text>
  <text x="397" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">所有行通过 → 两列相容</text>

  <!-- 底部结论框 -->
  <rect x="35" y="270" width="450" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">网格一致 ⟺ 保留列序列中每一对<tspan font-weight="bold" fill="#b85450">相邻</tspan>列都相容</text>
  <text x="260" y="326" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">把「列」看成元素、「相容」看成连接条件</text>
  <text x="260" y="346" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">→ 在序列上选最长子序列 → LIS 型 DP</text>
</svg>
