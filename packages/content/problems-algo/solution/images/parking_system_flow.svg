<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD2" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：addCar(carType) 决策路径</text>

  <!-- Start: addCar call -->
  <rect x="195" y="48" width="150" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="74" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">调用 addCar(carType)</text>
  <path d="M 270 90 L 270 114" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>

  <!-- Decision diamond: slots[carType] > 0 ? -->
  <polygon points="270,118 380,176 270,234 160,176" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="170" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">slots[carType]</text>
  <text x="270" y="188" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">&gt; 0 ?</text>

  <!-- Yes branch (left) -->
  <path d="M 160 176 L 110 176 L 110 260" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>
  <text x="118" y="168" text-anchor="start" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Yes: decrement -->
  <rect x="40" y="264" width="140" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="110" y="282" text-anchor="middle" font-size="11.5" fill="#333">slots[carType] -= 1</text>
  <text x="110" y="298" text-anchor="middle" font-size="10" fill="#888">占用一个车位</text>
  <path d="M 110 306 L 110 330" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>

  <!-- Yes: return true -->
  <rect x="50" y="334" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="110" y="360" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- No branch (right) -->
  <path d="M 380 176 L 430 176 L 430 260" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>
  <text x="392" y="168" text-anchor="start" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- No: return false -->
  <rect x="370" y="264" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="430" y="290" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">return false</text>
  <text x="430" y="328" text-anchor="middle" font-size="10.5" fill="#888">无空位，计数不变</text>
</svg>
