<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：频率表合并同值，因数配对代数计数</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">A=[7,7,8,3], B=[1,2,9,7] —— 看 v=3, target=9 这一组</text>

  <!-- ===== A 数组与频率表 ===== -->
  <text x="40" y="78" font-size="12" fill="#446688" font-weight="bold">数组 A</text>
  <g font-size="13">
    <rect x="80" y="62" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="98" y="82" text-anchor="middle" fill="#333">7</text>
    <rect x="118" y="62" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="136" y="82" text-anchor="middle" fill="#333">7</text>
    <rect x="156" y="62" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="174" y="82" text-anchor="middle" fill="#333">8</text>
    <rect x="194" y="62" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="212" y="82" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
  </g>
  <text x="240" y="82" font-size="11" fill="#d6a040">↑ 取 v=3, f_v=1</text>

  <!-- 频率表 cntA -->
  <text x="350" y="78" font-size="12" fill="#446688" font-weight="bold">cntA</text>
  <g font-size="11">
    <rect x="392" y="62" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="422" y="82" text-anchor="middle" fill="#333">{7:2, 8:1, 3:1}</text>
  </g>

  <!-- target 计算 -->
  <rect x="80" y="108" width="280" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="220" y="131" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">target = v² = 3² = 9</text>

  <path d="M 220 146 L 220 160" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== B 频率表 cntB ===== -->
  <text x="40" y="184" font-size="12" fill="#4a7a3a" font-weight="bold">cntB</text>
  <g font-size="11">
    <rect x="80" y="168" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="105" y="188" text-anchor="middle" fill="#333">1:1</text>
    <rect x="134" y="168" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="159" y="188" text-anchor="middle" fill="#333">2:1</text>
    <rect x="188" y="168" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="213" y="188" text-anchor="middle" fill="#333">9:1</text>
    <rect x="242" y="168" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="267" y="188" text-anchor="middle" fill="#333">7:1</text>
  </g>
  <text x="300" y="188" font-size="11" fill="#888">枚举 a，找 b = target / a</text>

  <!-- ===== 因数配对两情形 ===== -->
  <!-- 情形1: a < b -->
  <rect x="40" y="216" width="260" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="170" y="238" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">情形 a &lt; b</text>
  <text x="170" y="258" text-anchor="middle" font-size="11" fill="#333">a=1, b=9, 都在 cntB</text>
  <text x="170" y="278" text-anchor="middle" font-size="11" fill="#333">配对 = cntB[a] × cntB[b]</text>
  <text x="170" y="298" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">= 1 × 1 = 1</text>

  <!-- 情形2: a == b -->
  <rect x="320" y="216" width="260" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="450" y="238" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">情形 a = b</text>
  <text x="450" y="258" text-anchor="middle" font-size="11" fill="#333">（本例 target=9 无此情形）</text>
  <text x="450" y="278" text-anchor="middle" font-size="11" fill="#333">配对 = C(cntB[a], 2)</text>
  <text x="450" y="298" text-anchor="middle" font-size="12" fill="#888">= c(c−1)/2</text>

  <!-- ===== 贡献合并 ===== -->
  <path d="M 170 308 L 170 326" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="330" width="500" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="310" y="354" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">v=3 的贡献 = f_v × pairs = 1 × 1 = 1</text>
  <text x="310" y="372" text-anchor="middle" font-size="11" fill="#333">每个 i（A 中值为 3 的下标）都对应 1 个 (j,k) 对</text>

  <!-- ===== 去重提示 ===== -->
  <rect x="60" y="396" width="500" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="310" y="416" text-anchor="middle" font-size="11" fill="#b85450">⚠ 去重：只处理 a ≤ b（即 a ≤ √target）</text>
  <text x="310" y="434" text-anchor="middle" font-size="11" fill="#b85450">a &gt; b 跳过（已在较小一侧计过），避免重复计数</text>
</svg>
