<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <pattern id="wallHatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#5a5a5a"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#3a3a3a" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="460" height="360" fill="#fafafa"/>

  <text x="200" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：最短路径总距离 = 12</text>

  <!-- 5x5 grid, cell=48, origin (90, 70) -->
  <g filter="url(#rough2)" font-size="13">
    <!-- Row 0 -->
    <rect x="90" y="70" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="138" y="70" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="186" y="70" width="48" height="48" fill="url(#wallHatch)" stroke="#3a3a3a" stroke-width="1.4" rx="3"/>
    <rect x="234" y="70" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <text x="258" y="100" text-anchor="middle" fill="#4a7a3a" font-weight="bold" font-size="14">1</text>
    <rect x="282" y="70" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3"/>
    <!-- Row 1 -->
    <rect x="90" y="118" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <text x="114" y="148" text-anchor="middle" fill="#4a7a3a" font-weight="bold" font-size="14">5</text>
    <rect x="138" y="118" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="186" y="118" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="234" y="118" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <text x="258" y="148" text-anchor="middle" fill="#4a7a3a" font-weight="bold" font-size="14">2</text>
    <rect x="282" y="118" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <!-- Row 2 -->
    <rect x="90" y="166" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <text x="114" y="196" text-anchor="middle" fill="#4a7a3a" font-weight="bold" font-size="14">6</text>
    <rect x="138" y="166" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="186" y="166" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <text x="210" y="196" text-anchor="middle" fill="#4a7a3a" font-weight="bold" font-size="14">8</text>
    <rect x="234" y="166" width="48" height="48" fill="url(#wallHatch)" stroke="#3a3a3a" stroke-width="1.4" rx="3"/>
    <rect x="282" y="166" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <!-- Row 3 -->
    <rect x="90" y="214" width="48" height="48" fill="url(#wallHatch)" stroke="#3a3a3a" stroke-width="1.4" rx="3"/>
    <rect x="138" y="214" width="48" height="48" fill="url(#wallHatch)" stroke="#3a3a3a" stroke-width="1.4" rx="3"/>
    <rect x="186" y="214" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="234" y="214" width="48" height="48" fill="url(#wallHatch)" stroke="#3a3a3a" stroke-width="1.4" rx="3"/>
    <rect x="282" y="214" width="48" height="48" fill="url(#wallHatch)" stroke="#3a3a3a" stroke-width="1.4" rx="3"/>
    <!-- Row 4 -->
    <rect x="90" y="262" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="138" y="262" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="186" y="262" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <text x="210" y="292" text-anchor="middle" fill="#4a7a3a" font-weight="bold" font-size="13">10</text>
    <rect x="234" y="262" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="282" y="262" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3"/>
    <text x="306" y="292" text-anchor="middle" fill="#d6a040" font-weight="bold" font-size="13">12</text>
  </g>

  <!-- Start ball at (0,4) center (306, 94) -->
  <g filter="url(#rough2)">
    <circle cx="306" cy="94" r="11" fill="#446688" stroke="#224466" stroke-width="1.5"/>
    <text x="306" y="98" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">S</text>
    <text x="306" y="62" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">d=0</text>
  </g>

  <!-- Column labels -->
  <g filter="url(#rough2)" font-size="9" fill="#666">
    <text x="114" y="62" text-anchor="middle">0</text>
    <text x="162" y="62" text-anchor="middle">1</text>
    <text x="210" y="62" text-anchor="middle">2</text>
    <text x="258" y="62" text-anchor="middle">3</text>
  </g>
  <!-- Row labels -->
  <g filter="url(#rough2)" font-size="9" fill="#666">
    <text x="80" y="98" text-anchor="middle">0</text>
    <text x="80" y="146" text-anchor="middle">1</text>
    <text x="80" y="194" text-anchor="middle">2</text>
    <text x="80" y="242" text-anchor="middle">3</text>
    <text x="80" y="290" text-anchor="middle">4</text>
  </g>

  <!-- Path arrows -->
  <g filter="url(#rough2)" stroke="#b85450" stroke-width="2.5" fill="none">
    <path d="M 295 94 L 283 94" marker-end="url(#arrR)"/>
    <path d="M 258 106 L 258 130" marker-end="url(#arrR)"/>
    <path d="M 246 142 L 128 142" marker-end="url(#arrR)"/>
    <path d="M 114 154 L 114 178" marker-end="url(#arrR)"/>
    <path d="M 126 190 L 198 190" marker-end="url(#arrR)"/>
    <path d="M 210 202 L 210 274" marker-end="url(#arrR)"/>
    <path d="M 222 286 L 294 286" marker-end="url(#arrR)"/>
  </g>

  <!-- Step labels on arrows -->
  <g filter="url(#rough2)" font-size="11" fill="#b85450" font-weight="bold">
    <text x="285" y="88">1</text>
    <text x="265" y="122">1</text>
    <text x="183" y="136">3</text>
    <text x="122" y="172">1</text>
    <text x="157" y="184">2</text>
    <text x="218" y="240">2</text>
    <text x="255" y="280">2</text>
  </g>

  <!-- Total distance annotation -->
  <g filter="url(#rough2)">
    <rect x="352" y="120" width="98" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="401" y="140" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">总距离</text>
    <text x="401" y="160" text-anchor="middle" font-size="11" fill="#333">1+1+3+1</text>
    <text x="401" y="176" text-anchor="middle" font-size="11" fill="#333">+2+2+2</text>
    <text x="401" y="192" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">= 12</text>
  </g>

  <!-- Legend -->
  <g filter="url(#rough2)" font-size="10">
    <rect x="92" y="326" width="14" height="12" fill="url(#wallHatch)" stroke="#3a3a3a" stroke-width="1.2" rx="2"/>
    <text x="112" y="336" fill="#555">墙</text>
    <rect x="142" y="326" width="14" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2"/>
    <text x="162" y="336" fill="#555">停止位(dist)</text>
    <circle cx="240" cy="332" r="6" fill="#446688" stroke="#224466" stroke-width="1.2"/>
    <text x="252" y="336" fill="#555">起点</text>
    <rect x="290" y="326" width="14" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2"/>
    <text x="310" y="336" fill="#555">终点</text>
  </g>
</svg>
