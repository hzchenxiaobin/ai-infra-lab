<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：升序数组只需首尾，一次遍历维护全局最值</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">max|a−b| 必取某数组最大值与另一数组最小值</text>

  <!-- arrays[0] -->
  <text x="30" y="90" font-size="11" fill="#888" filter="url(#rough2)">arrays[0]</text>
  <rect x="110" y="72" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="155" y="72" width="40" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="175" y="92" text-anchor="middle" font-size="13" fill="#999">2</text>
  <rect x="200" y="72" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="130" y="118" text-anchor="middle" font-size="9.5" fill="#446688">min</text>
  <text x="220" y="118" text-anchor="middle" font-size="9.5" fill="#b85450">max</text>

  <!-- arrays[1] -->
  <text x="30" y="150" font-size="11" fill="#888" filter="url(#rough2)">arrays[1]</text>
  <rect x="110" y="132" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="152" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="155" y="132" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="152" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="130" y="178" text-anchor="middle" font-size="9.5" fill="#446688">min</text>
  <text x="175" y="178" text-anchor="middle" font-size="9.5" fill="#b85450">max</text>

  <!-- arrays[2] -->
  <text x="30" y="210" font-size="11" fill="#888" filter="url(#rough2)">arrays[2]</text>
  <rect x="110" y="192" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="212" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="155" y="192" width="40" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="175" y="212" text-anchor="middle" font-size="13" fill="#999">2</text>
  <rect x="200" y="192" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="212" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="130" y="238" text-anchor="middle" font-size="9.5" fill="#446688">min</text>
  <text x="220" y="238" text-anchor="middle" font-size="9.5" fill="#b85450">max</text>

  <!-- insight box (right) -->
  <rect x="280" y="72" width="250" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="405" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">升序 → 首元素 = 最小值</text>
  <text x="405" y="116" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">末元素 = 最大值</text>
  <text x="405" y="138" text-anchor="middle" font-size="10.5" fill="#666">中间元素不影响最大距离</text>

  <!-- legend -->
  <rect x="280" y="168" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="302" y="180" font-size="10.5" fill="#555" filter="url(#rough2)">最小值</text>
  <rect x="360" y="168" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="382" y="180" font-size="10.5" fill="#555" filter="url(#rough2)">最大值</text>
  <rect x="440" y="168" width="14" height="14" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="462" y="180" font-size="10.5" fill="#555" filter="url(#rough2)">中间元素</text>

  <!-- two candidates box -->
  <rect x="30" y="200" width="500" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="224" text-anchor="middle" font-size="12" fill="#a07820" font-weight="bold">对当前数组 i（先算后更新，保证来自不同数组）：</text>
  <text x="280" y="246" text-anchor="middle" font-size="12.5" fill="#444">① cur_max − prev_min     ② prev_max − cur_min</text>
  <text x="280" y="262" text-anchor="middle" font-size="10" fill="#888">两个方向都算取 max，不漏过任何组合</text>

  <!-- formula box -->
  <rect x="30" y="282" width="500" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">result = max(result, ①, ②)</text>
  <text x="280" y="328" text-anchor="middle" font-size="11" fill="#555">再更新：prev_min = min(prev_min, cur_min)</text>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#555">prev_max = max(prev_max, cur_max)</text>

  <!-- bottom note -->
  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">先算后更新：prev_min/prev_max 始终来自之前的数组，与当前数组不同</text>
</svg>
