<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：判型 → 遍历 → 构造 → 贴值求和</text>

  <rect x="160" y="38" width="200" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">建邻接表，统计度数</text>

  <path d="M 260 72 L 260 84" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,88 350,124 260,160 170,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="129" text-anchor="middle" font-size="12.5" fill="#7a5514" filter="url(#rough2)">m == n ?</text>

  <path d="M 170 124 L 108 124 L 108 168" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="116" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="24" y="172" width="168" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="108" y="194" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">路径（m = n−1）</text>
  <text x="108" y="214" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">找度 = 1 的端点作起点</text>

  <path d="M 350 124 L 412 124 L 412 168" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="382" y="116" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="328" y="172" width="168" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="412" y="194" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">环（m = n）</text>
  <text x="412" y="214" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">任取一个节点作起点</text>

  <path d="M 108 226 L 108 252 L 152 252" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 412 226 L 412 252 L 368 252" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="156" y="234" width="208" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="251" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">沿链遍历（不走回头路）</text>
  <text x="260" y="268" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">得到节点序列 order</text>

  <path d="M 260 274 L 260 288" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="292" width="400" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="311" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">构造值序列：与 n 异奇偶升序 + n + 与 n 同奇偶降序</text>
  <text x="260" y="330" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">按遍历序把值贴到各节点上</text>

  <path d="M 260 340 L 260 354" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="135" y="358" width="250" height="36" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="381" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5514" filter="url(#rough2)">答案 = Σ val(a)·val(b)</text>
</svg>
