<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">路径异或和：每走一格，当前异或值 x ⊕= 格子值</text>

  <!-- 左侧：示例 1 的网格与一条合法路径 -->
  <g filter="url(#rough2)">
    <rect x="28" y="48" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="82" y="48" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="136" y="48" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="28" y="102" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="82" y="102" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="136" y="102" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="28" y="156" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="82" y="156" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="136" y="156" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <text x="55" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d4d22">2</text>
    <text x="109" y="80" text-anchor="middle" font-size="15" fill="#333">1</text>
    <text x="163" y="80" text-anchor="middle" font-size="15" fill="#333">5</text>
    <text x="55" y="134" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d4d22">7</text>
    <text x="109" y="134" text-anchor="middle" font-size="15" fill="#333">10</text>
    <text x="163" y="134" text-anchor="middle" font-size="15" fill="#333">0</text>
    <text x="55" y="188" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d4d22">12</text>
    <text x="109" y="188" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d4d22">6</text>
    <text x="163" y="188" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d4d22">4</text>
    <path d="M55,84 L55,104" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M55,138 L55,158" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M72,183 L98,183" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M126,183 L152,183" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <text x="55" y="42" text-anchor="middle" font-size="12" fill="#4a7a3a">起点 (0,0)</text>
    <text x="163" y="228" text-anchor="middle" font-size="12" fill="#4a7a3a">终点 (m−1, n−1)</text>
  </g>

  <!-- 右侧：异或值 x 沿路径的演化链 -->
  <g filter="url(#rough2)">
    <text x="290" y="42" text-anchor="middle" font-size="12" fill="#555">异或值 x 的演化</text>
    <rect x="268" y="48" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="290" y="68" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">2</text>
    <rect x="268" y="92" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="290" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">5</text>
    <rect x="268" y="136" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="290" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">9</text>
    <rect x="268" y="180" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="290" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">15</text>
    <rect x="268" y="224" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6"/>
    <text x="290" y="244" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d4d22">11</text>
    <path d="M290,80 L290,90" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrg)"/>
    <path d="M290,124 L290,134" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrg)"/>
    <path d="M290,168 L290,178" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrg)"/>
    <path d="M290,212 L290,222" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrg)"/>
    <text x="304" y="88" font-size="12" fill="#b85450">⊕7</text>
    <text x="304" y="132" font-size="12" fill="#b85450">⊕12</text>
    <text x="304" y="176" font-size="12" fill="#b85450">⊕6</text>
    <text x="304" y="220" font-size="12" fill="#b85450">⊕4</text>
    <text x="336" y="66" font-size="12" fill="#555">起点：x = grid[0][0]</text>
    <text x="336" y="240" font-size="12" fill="#4a7a3a">终点：x = 11 = k ✓</text>
    <text x="336" y="256" font-size="12" fill="#4a7a3a">这条路径计入答案</text>
  </g>

  <!-- 底部：关键观察 -->
  <g filter="url(#rough2)">
    <rect x="28" y="268" width="464" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="260" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5c1e">关键观察：格子值 &lt; 16 ⇒ 异或值域只有 16 个</text>
    <text x="260" y="320" text-anchor="middle" font-size="12.5" fill="#555">任何路径的异或值都落在 {0, 1, …, 15} —— 把它收进 DP 状态</text>
    <text x="260" y="346" text-anchor="middle" font-size="12.5" fill="#446688">dp[i][j][x] = 走到 (i,j) 且异或值为 x 的路径数，共 m·n·16 个状态</text>
  </g>
</svg>
