<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="480" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="240" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">DP 算法流程</text>

  <!-- Step 1: init -->
  <rect x="120" y="40" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="240" y="65" text-anchor="middle" font-size="12" fill="#333">① 初始化 dp = [0, −∞, −∞]</text>

  <!-- arrow -->
  <path d="M 240 82 L 240 96" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: loop decision (diamond) -->
  <polygon points="240,100 330,140 240,180 150,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="136" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">还有 num 未处理？</text>
  <text x="240" y="154" text-anchor="middle" font-size="10" fill="#888">遍历 nums</text>

  <!-- No branch -> end -->
  <path d="M 330 140 L 400 140 L 400 410" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="362" y="132" font-size="11" fill="#82b366" font-weight="bold">否</text>

  <!-- Yes branch down -->
  <path d="M 240 180 L 240 194" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="250" y="190" font-size="11" fill="#b85450" font-weight="bold">是</text>

  <!-- Step 3: compute r + copy -->
  <rect x="100" y="198" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="240" y="223" text-anchor="middle" font-size="12" fill="#333">② r = num % 3；new_dp = dp（拷贝）</text>

  <!-- arrow -->
  <path d="M 240 240 L 240 254" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: inner loop update -->
  <rect x="70" y="258" width="340" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="240" y="280" text-anchor="middle" font-size="11.5" fill="#333">③ 对 i ∈ {0,1,2}：</text>
  <text x="240" y="300" text-anchor="middle" font-size="11" fill="#b85450">new_dp[(i+r)%3] = max(new_dp[(i+r)%3], dp[i]+num)</text>

  <!-- arrow -->
  <path d="M 240 316 L 240 330" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 5: assign dp = new_dp -->
  <rect x="140" y="334" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="240" y="357" text-anchor="middle" font-size="12" fill="#333">④ dp = new_dp</text>

  <!-- loop back arrow to decision -->
  <path d="M 140 352 L 60 352 L 60 140 L 150 140" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="48" y="248" font-size="10" fill="#888" transform="rotate(-90 48 248)">回到判断</text>

  <!-- End: return dp[0] -->
  <rect x="300" y="394" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="390" y="419" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">⑤ return dp[0]</text>

  <!-- Note -->
  <text x="240" y="448" text-anchor="middle" font-size="10" fill="#888">用 new_dp 拷贝避免「自我污染」——本轮读取旧 dp，写入新表</text>
</svg>
