<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">计数法：值域小 + 严格递增 → 计数即答案</text>

  <!-- Row labels -->
  <text x="135" y="70" text-anchor="end" font-size="10" fill="#888">Row 0</text>
  <text x="135" y="102" text-anchor="end" font-size="10" fill="#888">Row 1</text>
  <text x="135" y="134" text-anchor="end" font-size="10" fill="#888">Row 2</text>
  <text x="135" y="166" text-anchor="end" font-size="10" fill="#888">Row 3</text>

  <!-- Row 0: 1, 2, 3, 4, 5 -->
  <rect x="145" y="52" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="73" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="191" y="52" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="214" y="73" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="237" y="52" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="73" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="283" y="52" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="306" y="73" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="329" y="52" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="73" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">5</text>

  <!-- Row 1: 2, 4, 5, 8, 10 -->
  <rect x="145" y="84" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="105" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="191" y="84" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="214" y="105" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="237" y="84" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="105" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">5</text>
  <rect x="283" y="84" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="306" y="105" text-anchor="middle" font-size="12" fill="#333">8</text>
  <rect x="329" y="84" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="105" text-anchor="middle" font-size="11" fill="#333">10</text>

  <!-- Row 2: 3, 5, 7, 9, 11 -->
  <rect x="145" y="116" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="137" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="191" y="116" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="214" y="137" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">5</text>
  <rect x="237" y="116" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="137" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="283" y="116" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="306" y="137" text-anchor="middle" font-size="12" fill="#333">9</text>
  <rect x="329" y="116" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="137" text-anchor="middle" font-size="11" fill="#333">11</text>

  <!-- Row 3: 1, 3, 5, 7, 9 -->
  <rect x="145" y="148" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="169" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="191" y="148" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="214" y="169" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="237" y="148" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="169" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">5</text>
  <rect x="283" y="148" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="306" y="169" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="329" y="148" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="169" text-anchor="middle" font-size="12" fill="#333">9</text>

  <!-- Down arrow -->
  <path d="M 260 184 L 260 208" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="290" y="200" text-anchor="start" font-size="10" fill="#888">逐元素 count[x]++</text>

  <!-- Counting table label -->
  <text x="105" y="240" text-anchor="end" font-size="10" fill="#888">count[]</text>

  <!-- Counting table cells -->
  <rect x="120" y="220" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="240" text-anchor="middle" font-size="11" fill="#333">1:2</text>

  <rect x="176" y="220" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="204" y="240" text-anchor="middle" font-size="11" fill="#333">2:2</text>

  <rect x="232" y="220" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="11" fill="#333">3:3</text>

  <rect x="288" y="220" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="316" y="240" text-anchor="middle" font-size="11" fill="#333">4:2</text>

  <rect x="344" y="220" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="372" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5:4</text>

  <text x="402" y="240" text-anchor="start" font-size="12" fill="#999">…</text>

  <!-- Bottom annotation -->
  <rect x="60" y="270" width="400" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="289" text-anchor="middle" font-size="11" fill="#444">count[5] = 4 = m → 最小公共元素 = 5 ✓</text>

  <!-- Key insight box -->
  <rect x="40" y="312" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="10" fill="#444">💡 值域 1–10^4 → 计数数组可行；严格递增 → 每元素每行至多计一次</text>
  <text x="260" y="346" text-anchor="middle" font-size="10" fill="#444">count[x] == m ⟺ x 出现在所有 m 行中</text>
</svg>