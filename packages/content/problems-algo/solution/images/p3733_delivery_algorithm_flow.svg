<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#999999"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：二分答案 T，O(1) 三行计数判定</text>

  <rect x="210" y="30" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="12" filter="url(#rough2)"/>
  <text x="260" y="46" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M 260 54 L 260 62" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="64" width="300" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① L = lcm(r1, r2)</text>

  <path d="M 260 90 L 260 94" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="96" width="300" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="113" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② lo = 1，hi = 2×(d1+d2)（上界必可行）</text>

  <path d="M 260 122 L 260 126" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="128" width="380" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="146" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">③ mid = (lo + hi) / 2，对 T = mid 三行计数：</text>
  <text x="260" y="163" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">c1 = T−⌊T/r1⌋，c2 = T−⌊T/r2⌋，s = c1+c2+⌊T/L⌋−T</text>
  <text x="260" y="179" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">e1 = c1−s，e2 = c2−s（各自专属容量）</text>

  <path d="M 260 186 L 260 200" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <path d="M 260 200 L 355 232 L 260 264 L 165 232 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">溢出 ≤ 共享 s ?</text>
  <text x="260" y="246" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">max(0,d1−e1)+max(0,d2−e2) ≤ s</text>

  <!-- 否：左分支 lo = mid+1 -->
  <path d="M 163 232 L 130 232" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="224" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="8" y="218" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="68" y="231" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">lo = mid + 1</text>
  <text x="68" y="244" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">不可行，试更大</text>

  <!-- 是：右分支 hi = mid -->
  <path d="M 357 232 L 390 232" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="372" y="224" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="392" y="218" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="452" y="231" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">hi = mid</text>
  <text x="452" y="244" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">可行，试更小</text>

  <!-- 两分支汇入循环判定 -->
  <path d="M 68 248 L 68 258 L 210 258 L 210 268" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <path d="M 452 248 L 452 258 L 310 258 L 310 268" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrGray)" filter="url(#rough2)"/>

  <rect x="185" y="270" width="150" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="285" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">lo &lt; hi ?</text>

  <!-- 是：回到 ③ -->
  <path d="M 185 281 L 44 281 L 44 157 L 66 157" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="108" y="276" font-size="9.5" fill="#999" filter="url(#rough2)">是：继续二分</text>

  <!-- 否：返回 -->
  <path d="M 260 292 L 260 300" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="299" font-size="10" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="160" y="302" width="200" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="12" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">return lo ← 最小可行 T</text>

  <text x="16" y="344" font-size="10" fill="#666" filter="url(#rough2)">💡 单调性：T 变大只会追加可用小时 ⇒ check 单调不减，二分合法；hi = 2×(d1+d2) 必可行</text>
  <text x="16" y="357" font-size="10" fill="#b85450" filter="url(#rough2)">⚠️ d_i ≤ 10⁹，r1=r2=2 时答案 = 2×(d1+d2)−1 ≈ 4×10⁹ → C++ 全程 long long</text>
</svg>
