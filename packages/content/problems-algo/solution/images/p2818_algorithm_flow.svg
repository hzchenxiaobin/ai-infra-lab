<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    算法流程图
  </text>

  <!-- Step 1: Sieve for prime scores -->
  <rect x="40" y="48" width="160" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="120" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① 埃氏筛预处理</text>
  <text x="120" y="84" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">score[0..M]，O(M log log M)</text>

  <!-- Step 2: Monotonic stack left -->
  <rect x="280" y="48" width="180" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="370" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">② 单调栈求边界</text>
  <text x="370" y="84" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">left(≥) / right(>)，O(n)</text>

  <!-- arrow 1→2 -->
  <path d="M200,69 L278,69" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: Contribution counting -->
  <rect x="280" y="120" width="180" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="370" y="140" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">③ 贡献法计数</text>
  <text x="370" y="156" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">ranges=(i−L)×(R−i)</text>

  <!-- arrow 2→3 (down) -->
  <path d="M370,90 L370,118" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: Sort by value desc -->
  <rect x="40" y="120" width="160" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="120" y="140" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">④ 按值降序排序</text>
  <text x="120" y="156" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">nums[i] 大的优先</text>

  <!-- arrow 3→4 (left) -->
  <path d="M278,141 L202,141" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: Greedy + fast exp -->
  <rect x="40" y="192" width="160" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="120" y="212" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">⑤ 贪心 + 快速幂</text>
  <text x="120" y="228" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">cnt=min(ranges,rem_k)</text>

  <!-- arrow 4→5 (down) -->
  <path d="M120,162 L120,190" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6: Return answer -->
  <rect x="280" y="192" width="180" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="370" y="212" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">⑥ 累乘取余返回</text>
  <text x="370" y="228" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">ans = ans × pow(x,cnt) % MOD</text>

  <!-- arrow 5→6 (right) -->
  <path d="M202,213 L278,213" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: rem_k > 0? -->
  <polygon points="120,280 180,310 120,340 60,310" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="308" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">rem_k&gt;0?</text>
  <text x="120" y="322" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">&amp; 有剩余元素</text>

  <!-- arrow 6→decision (down-left) -->
  <path d="M280,234 Q200,260 180,310" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Yes: loop back to step 5 -->
  <path d="M60,310 Q20,250 40,213" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="18" y="270" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="18" y="285" font-size="10" fill="#666" filter="url(#rough2)">循环</text>

  <!-- No: return -->
  <rect x="200" y="290" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">返回 ans</text>
  <path d="M180,310 L198,310" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="188" y="302" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- Bottom notes -->
  <rect x="40" y="355" width="440" height="35" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="260" y="372" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    总时间 O(M log log M + n log n) | 空间 O(M + n)
  </text>
  <text x="260" y="386" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    M = max(nums) ≤ 10⁵，n ≤ 10⁵
  </text>
</svg>
