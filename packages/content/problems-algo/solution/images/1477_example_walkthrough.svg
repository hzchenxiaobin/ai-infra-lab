<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [7, 3, 4, 7], target = 7</text>

  <!-- ===== Step 0: right=0 ===== -->
  <text x="30" y="58" font-size="11" fill="#888" font-weight="bold">right=0</text>
  <!-- array boxes -->
  <rect x="80" y="44" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="65" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="120" y="44" width="40" height="32" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="140" y="65" text-anchor="middle" font-size="13" fill="#ccc">3</text>
  <rect x="160" y="44" width="40" height="32" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="180" y="65" text-anchor="middle" font-size="13" fill="#ccc">4</text>
  <rect x="200" y="44" width="40" height="32" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="220" y="65" text-anchor="middle" font-size="13" fill="#ccc">7</text>
  <!-- action -->
  <rect x="270" y="48" width="110" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="325" y="64" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">命中! len=1</text>
  <!-- dp/ans -->
  <text x="420" y="64" font-size="10" fill="#446688">dp[0]=1</text>
  <text x="490" y="64" font-size="10" fill="#999">ans=∞</text>

  <line x1="30" y1="84" x2="530" y2="84" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Step 1: right=1 ===== -->
  <text x="30" y="108" font-size="11" fill="#888" font-weight="bold">right=1</text>
  <rect x="80" y="94" width="40" height="32" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="115" text-anchor="middle" font-size="13" fill="#ccc">7</text>
  <rect x="120" y="94" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="115" text-anchor="middle" font-size="13" fill="#a87020">3</text>
  <rect x="160" y="94" width="40" height="32" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="180" y="115" text-anchor="middle" font-size="13" fill="#ccc">4</text>
  <rect x="200" y="94" width="40" height="32" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="220" y="115" text-anchor="middle" font-size="13" fill="#ccc">7</text>
  <rect x="270" y="98" width="110" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="325" y="114" text-anchor="middle" font-size="10" fill="#b85450">sum=10&gt;7, 缩窗</text>
  <text x="420" y="114" font-size="10" fill="#446688">dp[1]=1</text>
  <text x="490" y="114" font-size="10" fill="#999">ans=∞</text>

  <line x1="30" y1="134" x2="530" y2="134" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Step 2: right=2 ===== -->
  <text x="30" y="158" font-size="11" fill="#888" font-weight="bold">right=2</text>
  <rect x="80" y="144" width="40" height="32" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="165" text-anchor="middle" font-size="13" fill="#ccc">7</text>
  <rect x="120" y="144" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="165" text-anchor="middle" font-size="13" fill="#a87020">3</text>
  <rect x="160" y="144" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="165" text-anchor="middle" font-size="13" fill="#a87020">4</text>
  <rect x="200" y="144" width="40" height="32" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="220" y="165" text-anchor="middle" font-size="13" fill="#ccc">7</text>
  <rect x="270" y="148" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="340" y="164" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">命中! len=2</text>
  <text x="445" y="158" font-size="10" fill="#446688">dp[0]+2=3</text>
  <text x="445" y="172" font-size="10" fill="#446688">dp[2]=1</text>
  <text x="510" y="164" font-size="10" fill="#b85450" font-weight="bold">ans=3</text>

  <line x1="30" y1="184" x2="530" y2="184" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Step 3: right=3 ===== -->
  <text x="30" y="208" font-size="11" fill="#888" font-weight="bold">right=3</text>
  <rect x="80" y="194" width="40" height="32" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="215" text-anchor="middle" font-size="13" fill="#ccc">7</text>
  <rect x="120" y="194" width="40" height="32" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="140" y="215" text-anchor="middle" font-size="13" fill="#ccc">3</text>
  <rect x="160" y="194" width="40" height="32" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="180" y="215" text-anchor="middle" font-size="13" fill="#ccc">4</text>
  <rect x="200" y="194" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="215" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="270" y="198" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="340" y="214" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">命中! len=1</text>
  <text x="445" y="208" font-size="10" fill="#4a7a3a" font-weight="bold">dp[2]+1=2</text>
  <text x="445" y="222" font-size="10" fill="#446688">dp[3]=1</text>
  <text x="510" y="214" font-size="10" fill="#b85450" font-weight="bold">ans=2</text>

  <!-- divider -->
  <path d="M 30 250 L 530 250" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Summary ===== -->
  <rect x="80" y="266" width="400" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">最终结果</text>
  <text x="100" y="312" font-size="11" fill="#444">• 子数组 A = [7]（idx 0），len = 1</text>
  <text x="100" y="330" font-size="11" fill="#444">• 子数组 B = [7]（idx 3），len = 1</text>
  <text x="100" y="348" font-size="11" fill="#444">• 两者不重叠，长度和 = 1 + 1 = </text>
  <text x="290" y="348" font-size="14" fill="#b85450" font-weight="bold">2</text>

  <!-- legend -->
  <rect x="100" y="380" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="120" y="392" font-size="9" fill="#888">子数组A</text>
  <rect x="175" y="380" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="195" y="392" font-size="9" fill="#888">子数组B/命中</text>
  <rect x="270" y="380" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="290" y="392" font-size="9" fill="#888">窗口内</text>
  <rect x="345" y="380" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="365" y="392" font-size="9" fill="#888">缩窗</text>
</svg>
