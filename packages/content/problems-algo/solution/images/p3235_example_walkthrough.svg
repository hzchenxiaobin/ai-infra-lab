<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：贴的是哪两条边，决定生死</text>

  <!-- 左面板：示例 1 -->
  <rect x="16" y="40" width="252" height="304" fill="#ffffff" stroke="#b0b8c4" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="142" y="60" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">示例 1：X=3, Y=4, [[2,1,1]] → true</text>

  <rect x="66" y="96" width="105" height="140" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="122" y="90" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">X=3</text>
  <text x="56" y="170" font-size="9" fill="#446688" filter="url(#rough2)">Y=4</text>

  <circle cx="136" cy="201" r="35" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="136" y="205" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">r=1</text>

  <circle cx="136" cy="236" r="3.5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="92" y="256" font-size="8.5" fill="#8a6d3b" filter="url(#rough2)">切下边 (2,0)</text>
  <circle cx="171" cy="201" r="3.5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="176" y="194" font-size="8.5" fill="#8a6d3b" filter="url(#rough2)">切右边</text>
  <text x="176" y="206" font-size="8.5" fill="#8a6d3b" filter="url(#rough2)">(3,1)</text>

  <circle cx="66" cy="236" r="4.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="254" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">起点(0,0)</text>
  <circle cx="171" cy="96" r="4.5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="126" y="86" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">终点(3,4)</text>

  <path d="M 70 232 C 88 196, 98 152, 136 126 C 150 116, 160 106, 168 98" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="90" y="160" font-size="9" fill="#2f5d24" filter="url(#rough2)">路径 ✓</text>

  <text x="142" y="288" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">圆同时切下边 + 右边 →「下 ↔ 右」连通</text>
  <text x="142" y="304" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">但围住的是右下角（无人角）</text>
  <text x="142" y="324" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">不在四种阻断组合中 → true</text>

  <!-- 右面板：示例 3 -->
  <rect x="288" y="40" width="252" height="304" fill="#ffffff" stroke="#b0b8c4" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="414" y="60" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 3：X=3, Y=3, [[2,1,1],[1,2,1]] → false</text>

  <rect x="340" y="106" width="120" height="120" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="402" y="100" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">X=3</text>
  <text x="330" y="170" font-size="9" fill="#446688" filter="url(#rough2)">Y=3</text>

  <polygon points="340,226 340,150 382,190 420,226" fill="#fce4ec" opacity="0.45" filter="url(#rough2)"/>

  <circle cx="420" cy="186" r="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="428" y="192" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">A</text>
  <circle cx="380" cy="146" r="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="372" y="142" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">B</text>

  <circle cx="420" cy="146" r="3" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="380" cy="186" r="3" fill="#d6a040" filter="url(#rough2)"/>
  <text x="402" y="170" text-anchor="middle" font-size="8.5" fill="#8a6d3b" filter="url(#rough2)">A∩B</text>

  <circle cx="420" cy="226" r="3.5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="380" y="246" font-size="8.5" fill="#8a6d3b" filter="url(#rough2)">A 切下边 (2,0)</text>
  <circle cx="340" cy="146" r="3.5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="348" y="136" font-size="8.5" fill="#8a6d3b" filter="url(#rough2)">B 切左边 (0,2)</text>

  <circle cx="340" cy="226" r="4.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="346" y="244" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">起点(0,0)</text>
  <circle cx="460" cy="106" r="4.5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="412" y="96" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">终点(3,3)</text>

  <path d="M 344 218 Q 350 200 358 190" stroke="#888" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="362" y="188" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <text x="414" y="288" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">左边 ↔ B ↔ A ↔ 下边 连成一堵墙</text>
  <text x="414" y="304" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">（B 切左、A 切下、A 与 B 相交）</text>
  <text x="414" y="324" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">围死起点 → false</text>

  <!-- 底部总结 -->
  <rect x="16" y="356" width="528" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">示例 2：单圆 (1,1,2) 同时贴左、贴下 → 左↔下 连通 → false</text>
  <text x="280" y="388" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">示例 4：圆 (5,5,1) 在矩形外、不贴任何边 → 无墙 → true</text>
</svg>
