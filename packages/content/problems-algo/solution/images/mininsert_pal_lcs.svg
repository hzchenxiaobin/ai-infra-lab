<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">等价转化：最少插入 = n − LPS(s)</text>

  <!-- s string -->
  <text x="40" y="62" font-size="11" fill="#888">s =</text>
  <rect x="80" y="48" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="67" text-anchor="middle" font-size="12" fill="#333">m</text>
  <rect x="124" y="48" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="67" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="168" y="48" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="67" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="212" y="48" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="67" text-anchor="middle" font-size="12" fill="#333">d</text>
  <rect x="256" y="48" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="67" text-anchor="middle" font-size="12" fill="#333">m</text>
  <text x="320" y="64" font-size="10" fill="#888">n = 5</text>

  <!-- LPS highlight box -->
  <rect x="78" y="46" width="44" height="32" fill="none" stroke="#4a7a3a" stroke-width="2.2" stroke-dasharray="4,2" rx="6" filter="url(#rough2)"/>
  <rect x="166" y="46" width="44" height="32" fill="none" stroke="#4a7a3a" stroke-width="2.2" stroke-dasharray="4,2" rx="6" filter="url(#rough2)"/>
  <rect x="254" y="46" width="44" height="32" fill="none" stroke="#4a7a3a" stroke-width="2.2" stroke-dasharray="4,2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="96" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">最长回文子序列 LPS = "mam"（长度 3）</text>

  <!-- arrow down -->
  <path d="M 280 104 L 280 122" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Key insight box -->
  <rect x="40" y="126" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="148" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">核心等式：最少插入次数 = n − LPS(s)</text>
  <text x="280" y="168" text-anchor="middle" font-size="10" fill="#555">LPS 已是回文，其余 n − LPS 个字符各需镜像插入 1 次</text>

  <!-- arrow down -->
  <path d="M 280 182 L 280 200" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- LPS = LCS(s, rev(s)) -->
  <rect x="40" y="204" width="480" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">而 LPS(s) = LCS(s, reverse(s))</text>

  <!-- s and rev(s) -->
  <text x="70" y="252" font-size="10" fill="#888">s:</text>
  <rect x="95" y="238" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="109" y="253" text-anchor="middle" font-size="11" fill="#333">m</text>
  <rect x="127" y="238" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="141" y="253" text-anchor="middle" font-size="11" fill="#333">b</text>
  <rect x="159" y="238" width="28" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="173" y="253" text-anchor="middle" font-size="11" fill="#333">a</text>
  <rect x="191" y="238" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="205" y="253" text-anchor="middle" font-size="11" fill="#333">d</text>
  <rect x="223" y="238" width="28" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="237" y="253" text-anchor="middle" font-size="11" fill="#333">m</text>

  <text x="70" y="284" font-size="10" fill="#888">rev:</text>
  <rect x="95" y="270" width="28" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="109" y="285" text-anchor="middle" font-size="11" fill="#333">m</text>
  <rect x="127" y="270" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="141" y="285" text-anchor="middle" font-size="11" fill="#333">d</text>
  <rect x="159" y="270" width="28" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="173" y="285" text-anchor="middle" font-size="11" fill="#333">a</text>
  <rect x="191" y="270" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="205" y="285" text-anchor="middle" font-size="11" fill="#333">b</text>
  <rect x="223" y="270" width="28" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="237" y="285" text-anchor="middle" font-size="11" fill="#333">m</text>

  <!-- matching lines -->
  <path d="M 109 260 L 109 270" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 173 260 L 173 270" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 237 260 L 109 270" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <text x="290" y="252" font-size="10" fill="#555">LCS = "mam"</text>
  <text x="290" y="268" font-size="10" fill="#4a7a3a" font-weight="bold">长度 = 3</text>
  <text x="290" y="288" font-size="9" fill="#888">套 1143 LCS 模板</text>

  <!-- Result -->
  <rect x="100" y="340" width="360" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">答案 = 5 − 3 = 2 ⭐</text>

  <!-- note -->
  <text x="280" y="406" text-anchor="middle" font-size="10" fill="#888">每次插入最多让 LPS 增 1，故 n − LPS 是下界，且可达成 → 即最优</text>
</svg>
