<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心区间覆盖：从已覆盖区域出发，选终点最远的片段</text>

  <!-- ===== Clips as intervals (sorted) ===== -->
  <text x="40" y="52" font-size="11" fill="#888">片段（排序后，起点升序 / 同起点终点降序）:</text>

  <!-- Timeline base line -->
  <line x1="80" y1="340" x2="480" y2="340" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Tick marks 0..10, spacing 40px, start x=80 -->
  <!-- 0=80, 1=120, 2=160, 3=200, 4=240, 5=280, 6=320, 7=360, 8=400, 9=440, 10=480 -->
  <g filter="url(#rough2)">
    <line x1="80" y1="336" x2="80" y2="344" stroke="#888" stroke-width="1.2"/>
    <line x1="120" y1="336" x2="120" y2="344" stroke="#888" stroke-width="1.2"/>
    <line x1="160" y1="336" x2="160" y2="344" stroke="#888" stroke-width="1.2"/>
    <line x1="200" y1="336" x2="200" y2="344" stroke="#888" stroke-width="1.2"/>
    <line x1="240" y1="336" x2="240" y2="344" stroke="#888" stroke-width="1.2"/>
    <line x1="280" y1="336" x2="280" y2="344" stroke="#888" stroke-width="1.2"/>
    <line x1="320" y1="336" x2="320" y2="344" stroke="#888" stroke-width="1.2"/>
    <line x1="360" y1="336" x2="360" y2="344" stroke="#888" stroke-width="1.2"/>
    <line x1="400" y1="336" x2="400" y2="344" stroke="#888" stroke-width="1.2"/>
    <line x1="440" y1="336" x2="440" y2="344" stroke="#888" stroke-width="1.2"/>
    <line x1="480" y1="336" x2="480" y2="344" stroke="#888" stroke-width="1.2"/>
  </g>
  <text x="80" y="358" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="160" y="358" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="240" y="358" text-anchor="middle" font-size="10" fill="#999">4</text>
  <text x="280" y="358" text-anchor="middle" font-size="10" fill="#999">5</text>
  <text x="320" y="358" text-anchor="middle" font-size="10" fill="#999">6</text>
  <text x="400" y="358" text-anchor="middle" font-size="10" fill="#999">8</text>
  <text x="440" y="358" text-anchor="middle" font-size="10" fill="#999">9</text>
  <text x="480" y="358" text-anchor="middle" font-size="10" fill="#999">10</text>
  <text x="490" y="358" font-size="10" fill="#999">time</text>

  <!-- Coverage zone shading -->
  <rect x="80" y="330" width="400" height="10" fill="#e6f4ea" stroke="none" filter="url(#rough2)" opacity="0.6"/>
  <text x="280" y="328" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">覆盖目标 [0, time]</text>

  <!-- Clip bars (sorted order), each at a different y -->
  <!-- [0,2] SELECTED green -->
  <rect x="80" y="70" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="86" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[0,2] ✓</text>

  <!-- [1,9] SELECTED blue -->
  <rect x="120" y="100" width="320" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="116" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[1,9] ✓</text>

  <!-- [1,5] not selected, dimmed -->
  <rect x="120" y="130" width="160" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="144" text-anchor="middle" font-size="10" fill="#999">[1,5]</text>

  <!-- [4,6] not selected, dimmed -->
  <rect x="240" y="155" width="80" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="169" text-anchor="middle" font-size="10" fill="#999">[4,6]</text>

  <!-- [5,9] not selected, dimmed -->
  <rect x="280" y="180" width="160" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="194" text-anchor="middle" font-size="10" fill="#999">[5,9]</text>

  <!-- [8,10] SELECTED orange -->
  <rect x="400" y="210" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="226" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[8,10] ✓</text>

  <!-- Greedy step arrows from timeline -->
  <!-- Step 1: curEnd=0 -> select [0,2], nextEnd=2 -->
  <line x1="80" y1="330" x2="80" y2="92" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="68" y="66" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold">第1轮</text>
  <text x="68" y="78" text-anchor="end" font-size="9" fill="#4a7a3a">curEnd=0</text>

  <!-- Step 2: curEnd=2 -> select [1,9], nextEnd=9 -->
  <line x1="160" y1="330" x2="160" y2="112" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="172" y="250" font-size="10" fill="#446688" font-weight="bold">第2轮</text>
  <text x="172" y="262" font-size="9" fill="#446688">curEnd=2</text>
  <path d="M 160 330 L 160 268 L 155 263 M 160 268 L 165 263" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- Step 3: curEnd=9 -> select [8,10], nextEnd=10 -->
  <line x1="440" y1="330" x2="440" y2="232" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="452" y="250" font-size="10" fill="#d6a040" font-weight="bold">第3轮</text>
  <text x="452" y="262" font-size="9" fill="#d6a040">curEnd=9</text>

  <!-- curEnd markers on timeline -->
  <circle cx="80" cy="340" r="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="160" cy="340" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="440" cy="340" r="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="480" cy="340" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <!-- Summary note -->
  <rect x="100" y="280" width="360" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">贪心：每轮从起点 ≤ curEnd 的片段中选终点最远的</text>
  <text x="280" y="314" text-anchor="middle" font-size="10" fill="#666">3 个片段覆盖 [0, 10] → [0,2] + [2,9] + [9,10]</text>
</svg>
