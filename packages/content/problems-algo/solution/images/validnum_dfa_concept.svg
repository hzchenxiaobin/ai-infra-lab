<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="440" fill="#fafafa"/>

  <text x="340" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">有效数字的 DFA（9 状态，绿框为合法终止态）</text>

  <!-- ===== 状态节点 ===== -->
  <!-- 0 start -->
  <ellipse cx="60" cy="100" rx="46" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="104" text-anchor="middle" font-size="12" fill="#333">0 起始</text>

  <!-- 1 sign -->
  <ellipse cx="190" cy="100" rx="46" ry="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="104" text-anchor="middle" font-size="12" fill="#333">1 符号</text>

  <!-- 2 integer (valid) -->
  <ellipse cx="320" cy="100" rx="46" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="320" y="104" text-anchor="middle" font-size="12" fill="#333">2 整数位</text>

  <!-- 4 dotAfter (valid) -->
  <ellipse cx="450" cy="100" rx="46" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="450" y="104" text-anchor="middle" font-size="12" fill="#333">4 点后整数</text>

  <!-- 3 dotNoInt -->
  <ellipse cx="190" cy="230" rx="46" ry="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="234" text-anchor="middle" font-size="12" fill="#333">3 无整数点</text>

  <!-- 5 fraction (valid) -->
  <ellipse cx="450" cy="230" rx="46" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="450" y="234" text-anchor="middle" font-size="12" fill="#333">5 小数位</text>

  <!-- 6 exp marker -->
  <ellipse cx="320" cy="360" rx="46" ry="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="364" text-anchor="middle" font-size="12" fill="#333">6 指数 e/E</text>

  <!-- 7 exp sign -->
  <ellipse cx="450" cy="360" rx="46" ry="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="364" text-anchor="middle" font-size="12" fill="#333">7 指数符号</text>

  <!-- 8 exp digit (valid) -->
  <ellipse cx="590" cy="360" rx="46" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="590" y="364" text-anchor="middle" font-size="12" fill="#333">8 指数位</text>

  <!-- ===== 转移边 ===== -->
  <!-- 0 -> 1 sign -->
  <path d="M 106 100 L 142 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="124" y="92" text-anchor="middle" font-size="10" fill="#d6a040">+/−</text>

  <!-- 0 -> 2 digit -->
  <path d="M 102 112 C 170 150, 250 150, 276 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a">数字</text>

  <!-- 0 -> 3 dot -->
  <path d="M 76 122 C 110 170, 150 190, 170 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="180" font-size="10" fill="#b85450">.</text>

  <!-- 1 -> 2 digit -->
  <path d="M 236 100 L 272 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="254" y="92" text-anchor="middle" font-size="10" fill="#4a7a3a">数字</text>

  <!-- 1 -> 3 dot -->
  <path d="M 190 122 L 190 208" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="168" font-size="10" fill="#b85450">.</text>

  <!-- 2 -> 2 self loop digit -->
  <path d="M 296 82 C 300 56, 340 56, 344 82" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="58" text-anchor="middle" font-size="10" fill="#4a7a3a">数字</text>

  <!-- 2 -> 4 dot -->
  <path d="M 366 100 L 402 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="92" text-anchor="middle" font-size="10" fill="#b85450">.</text>

  <!-- 2 -> 6 exp -->
  <path d="M 320 122 L 320 338" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="232" font-size="10" fill="#d6a040">e/E</text>

  <!-- 3 -> 5 digit -->
  <path d="M 236 230 C 300 230, 360 230, 402 230" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a">数字</text>

  <!-- 4 -> 5 digit -->
  <path d="M 450 122 L 450 208" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="460" y="168" font-size="10" fill="#4a7a3a">数字</text>

  <!-- 4 -> 6 exp -->
  <path d="M 432 118 C 396 200, 360 280, 342 340" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="200" font-size="10" fill="#888">e/E</text>

  <!-- 5 -> 5 self loop digit -->
  <path d="M 426 212 C 430 186, 470 186, 474 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="450" y="188" text-anchor="middle" font-size="10" fill="#4a7a3a">数字</text>

  <!-- 5 -> 6 exp -->
  <path d="M 432 248 C 396 280, 360 320, 342 342" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="406" y="288" font-size="10" fill="#d6a040">e/E</text>

  <!-- 6 -> 7 sign -->
  <path d="M 366 360 L 402 360" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="352" text-anchor="middle" font-size="10" fill="#d6a040">+/−</text>

  <!-- 6 -> 8 digit (arc over 7) -->
  <path d="M 348 342 C 440 300, 540 300, 588 342" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="304" text-anchor="middle" font-size="10" fill="#4a7a3a">数字</text>

  <!-- 7 -> 8 digit -->
  <path d="M 496 360 L 542 360" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="518" y="352" text-anchor="middle" font-size="10" fill="#4a7a3a">数字</text>

  <!-- 8 -> 8 self loop digit -->
  <path d="M 566 342 C 570 316, 610 316, 614 342" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="590" y="318" text-anchor="middle" font-size="10" fill="#4a7a3a">数字</text>

  <!-- 起始箭头 -->
  <path d="M 20 100 L 12 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 图例 -->
  <rect x="20" y="396" width="640" height="32" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="36" y="416" font-size="11" fill="#446688">■ 起始</text>
  <text x="100" y="416" font-size="11" fill="#d6a040">■ 中间态（符号/点/e）</text>
  <text x="250" y="416" font-size="11" fill="#4a7a3a">■ 合法终止态：2 整数 / 4 整数. / 5 .数 / 8 含指数</text>
  <text x="490" y="416" font-size="11" fill="#888">扫完字符串后落在绿色态即合法</text>
</svg>
