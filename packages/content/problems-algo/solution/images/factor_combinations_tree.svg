<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">因子的组合：回溯决策树（n=12）</text>

  <!-- ============ LEFT: decision tree ============ -->
  <text x="30" y="52" font-size="12" fill="#888">决策树（节点 = 待分解数 remain, 边 = 选因子 i）:</text>

  <!-- root: remain=12, start=2 -->
  <ellipse cx="170" cy="78" rx="44" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="82" text-anchor="middle" font-size="11" fill="#333">remain=12</text>
  <text x="170" y="100" text-anchor="middle" font-size="9" fill="#888">start=2, √12≈3.5</text>

  <!-- i=2 branch (two sub-branches: record + recurse) -->
  <text x="92" y="118" font-size="10" fill="#4a7a3a" font-weight="bold">i=2 ✓</text>
  <line x1="150" y1="92" x2="90" y2="128" stroke="#4a7a3a" stroke-width="1.3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 收尾 [2,6] -->
  <rect x="36" y="130" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="66" y="146" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[2,6] ✓</text>
  <text x="66" y="166" text-anchor="middle" font-size="8" fill="#4a7a3a">收尾分支</text>

  <!-- 续拆 dfs(6,2) -->
  <line x1="120" y1="154" x2="120" y2="172" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="148" y="156" font-size="8" fill="#888">续拆</text>
  <ellipse cx="120" cy="188" rx="40" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="120" y="192" text-anchor="middle" font-size="10" fill="#333">remain=6</text>
  <text x="120" y="208" text-anchor="middle" font-size="8" fill="#888">start=2</text>

  <!-- from remain=6: i=2 -->
  <line x1="120" y1="204" x2="120" y2="222" stroke="#4a7a3a" stroke-width="1.3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="146" y="216" font-size="9" fill="#4a7a3a">i=2 ✓</text>

  <!-- 收尾 [2,2,3] -->
  <rect x="82" y="226" width="76" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="242" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[2,2,3] ✓</text>

  <!-- 续拆 dfs(3,2) -> empty -->
  <line x1="120" y1="250" x2="120" y2="268" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="86" y="270" width="68" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="120" y="285" text-anchor="middle" font-size="9" fill="#b85450">dfs(3,2) ✗</text>
  <text x="120" y="302" text-anchor="middle" font-size="8" fill="#b85450">2×2 &gt; 3</text>

  <!-- i=3 branch -->
  <text x="222" y="118" font-size="10" fill="#d6a040" font-weight="bold">i=3 ✓</text>
  <line x1="195" y1="92" x2="240" y2="128" stroke="#d6a040" stroke-width="1.3" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 收尾 [3,4] -->
  <rect x="208" y="130" width="64" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="146" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[3,4] ✓</text>
  <text x="240" y="166" text-anchor="middle" font-size="8" fill="#d6a040">收尾分支</text>

  <!-- 续拆 dfs(4,3) -> empty -->
  <line x1="240" y1="154" x2="240" y2="172" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="204" y="176" width="72" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="240" y="191" text-anchor="middle" font-size="9" fill="#b85450">dfs(4,3) ✗</text>
  <text x="240" y="208" text-anchor="middle" font-size="8" fill="#b85450">3×3 &gt; 4</text>

  <!-- i=4 stop -->
  <text x="280" y="92" font-size="9" fill="#888">i=4: 4×4&gt;12 停</text>

  <!-- legend -->
  <text x="160" y="332" text-anchor="middle" font-size="10" fill="#888">✓ 收尾记录　✗ 续拆无解（i*i &gt; remain）　共得 3 组：[2,6] [2,2,3] [3,4]</text>

  <!-- ============ RIGHT: insight ============ -->
  <text x="380" y="52" font-size="12" fill="#444" font-weight="bold">核心：与 39 组合总和同构</text>

  <!-- comparison box -->
  <rect x="380" y="66" width="240" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="500" y="84" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">39 加法分解</text>
  <text x="500" y="102" text-anchor="middle" font-size="10" fill="#555">target = 候选数之和</text>
  <text x="500" y="118" text-anchor="middle" font-size="10" fill="#555">候选集 = 给定数组</text>

  <!-- arrow down -->
  <path d="M 500 136 L 500 152" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="540" y="148" font-size="9" fill="#888">和 → 积</text>

  <rect x="380" y="156" width="240" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="500" y="174" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">254 乘法分解</text>
  <text x="500" y="192" text-anchor="middle" font-size="10" fill="#555">n = 因子之积</text>
  <text x="500" y="208" text-anchor="middle" font-size="10" fill="#555">候选集 = remain 的因子</text>

  <!-- shared rule -->
  <path d="M 500 226 L 500 240" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="380" y="244" width="240" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="500" y="262" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">共享套路</text>
  <text x="500" y="278" text-anchor="middle" font-size="10" fill="#555">dfs(remain, start)</text>
  <text x="500" y="294" text-anchor="middle" font-size="10" fill="#555">start 管去重（非递减）</text>
  <text x="500" y="310" text-anchor="middle" font-size="10" fill="#555">传 i 管可重复选</text>

  <!-- two branches note -->
  <rect x="380" y="332" width="240" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="500" y="350" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">254 独有：两分支</text>
  <text x="500" y="368" text-anchor="middle" font-size="10" fill="#555">① 收尾：[i, remain/i]</text>
  <text x="500" y="384" text-anchor="middle" font-size="10" fill="#555">② 续拆：dfs(remain/i, i)</text>

  <text x="320" y="430" text-anchor="middle" font-size="11" fill="#888">关键直觉：把「相加」换成「相乘」，候选集从数组变成因子，骨架完全一致</text>
  <text x="320" y="448" text-anchor="middle" font-size="11" fill="#888">只枚举到 √remain：因子成对，取较小一半即覆盖所有非递减配对</text>
</svg>
