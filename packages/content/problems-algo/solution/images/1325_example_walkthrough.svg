<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1 级联演算（target = 2）</text>
  <text x="300" y="42" text-anchor="middle" font-size="11" fill="#888">红=本轮删除的 target 叶；橙=上一轮删除后新暴露的 target 叶</text>

  <!-- Stage labels -->
  <text x="110" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 初始</text>
  <text x="300" y="62" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">② 删两片红叶后</text>
  <text x="480" y="62" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">③ 节点 2 成新叶 → 再删</text>

  <!-- ===== Stage A ===== -->
  <g font-size="12">
    <line x1="110" y1="88" x2="80" y2="138" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <line x1="110" y1="88" x2="150" y2="138" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <line x1="80" y1="148" x2="60" y2="198" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <line x1="150" y1="148" x2="130" y2="198" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <line x1="150" y1="148" x2="175" y2="198" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <circle cx="110" cy="80" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="110" y="85" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <circle cx="80" cy="146" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="80" y="151" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <circle cx="150" cy="146" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="150" y="151" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <circle cx="60" cy="206" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="60" y="211" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <circle cx="130" cy="206" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="130" y="211" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <circle cx="175" cy="206" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="175" y="211" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
  </g>
  <text x="110" y="238" text-anchor="middle" font-size="9" fill="#b85450">两片叶子值=2 → 删</text>

  <!-- arrow A -> B -->
  <path d="M 196 170 L 224 170" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== Stage B ===== -->
  <g font-size="12">
    <line x1="300" y1="88" x2="270" y2="138" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <line x1="300" y1="88" x2="330" y2="138" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <line x1="330" y1="148" x2="355" y2="198" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <circle cx="300" cy="80" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="300" y="85" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <circle cx="270" cy="146" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="270" y="151" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <circle cx="330" cy="146" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="330" y="151" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <circle cx="355" cy="206" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="355" y="211" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
  </g>
  <text x="270" y="238" text-anchor="middle" font-size="9" fill="#d6a040">节点 2 子树被删空</text>
  <text x="270" y="250" text-anchor="middle" font-size="9" fill="#d6a040">→ 自身变叶 + val=2 → 删</text>

  <!-- arrow B -> C -->
  <path d="M 386 170 L 414 170" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== Stage C ===== -->
  <g font-size="12">
    <line x1="480" y1="88" x2="510" y2="138" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <line x1="510" y1="148" x2="535" y2="198" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <circle cx="480" cy="80" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="480" y="85" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <circle cx="510" cy="146" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="510" y="151" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <circle cx="535" cy="206" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="535" y="211" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
  </g>
  <text x="480" y="238" text-anchor="middle" font-size="9" fill="#4a7a3a">结果 [1,null,3,null,4]</text>

  <!-- bottom note -->
  <rect x="40" y="276" width="520" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="298" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">后序 DFS 一次遍历即完成全部级联</text>
  <text x="300" y="316" text-anchor="middle" font-size="10" fill="#666">dfs(节点 2) 先删其子叶 → 返回时节点 2 已成叶且 val=target → 返回 null</text>
  <text x="300" y="332" text-anchor="middle" font-size="10" fill="#666">根 1 收到 node.left=null，自身非 target → 保留。无需多轮外层循环</text>
</svg>
