<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 580" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="580" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：枚举两端 L、R + 中间余数哈希，O(n²)</text>

  <ellipse cx="280" cy="52" rx="48" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="57" text-anchor="middle" font-size="13" fill="#333">开始</text>

  <path d="M 280 69 L 280 82" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="170" y="86" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="106" text-anchor="middle" font-size="12" fill="#333">ans = 0；L = 0</text>

  <path d="M 280 116 L 280 128" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="115" y="132" width="330" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="152" text-anchor="middle" font-size="12" fill="#333">清空 cnt（余数 → (L, R) 内元素个数）</text>

  <path d="M 280 162 L 280 174" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="190" y="178" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="198" text-anchor="middle" font-size="12" fill="#333">R = L + 1</text>

  <path d="M 280 208 L 280 220" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="95" y="224" width="370" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="245" text-anchor="middle" font-size="12" fill="#333">need = (d − (r[L] + r[R]) mod d) mod d</text>

  <path d="M 280 256 L 280 268" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="110" y="272" width="340" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="12" fill="#333">ans += cnt[need]（先查：表内只有 L &lt; m &lt; R）</text>

  <path d="M 280 306 L 280 318" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="110" y="322" width="340" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="12" fill="#333">cnt[r[R]] += 1（后插：R 当后续的中间候选）</text>

  <path d="M 280 356 L 280 368" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <polygon points="280,372 376,404 280,436 184,404" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="409" text-anchor="middle" font-size="12" fill="#333">R &lt; n？</text>

  <path d="M 184 404 L 112 404 L 112 240 L 91 240" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="168" y="394" text-anchor="middle" font-size="11" fill="#446688">是</text>
  <text x="104" y="328" text-anchor="end" font-size="11" fill="#446688">R++（右移）</text>

  <path d="M 280 436 L 280 448" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="290" y="446" font-size="11" fill="#b85450">否</text>

  <polygon points="280,452 372,484 280,516 188,484" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="489" text-anchor="middle" font-size="12" fill="#333">L + 2 &lt; n？</text>

  <path d="M 372 484 L 508 484 L 508 147 L 449 147" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arro)"/>
  <text x="386" y="474" text-anchor="middle" font-size="11" fill="#d6a040">是</text>
  <text x="500" y="330" text-anchor="end" font-size="11" fill="#d6a040">L++（换最左端，重置表）</text>

  <path d="M 280 516 L 280 528" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="290" y="526" font-size="11" fill="#b85450">否</text>

  <ellipse cx="280" cy="548" rx="58" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="553" text-anchor="middle" font-size="13" fill="#333">返回 ans</text>
</svg>
