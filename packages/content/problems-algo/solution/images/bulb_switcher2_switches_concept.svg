<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">4 个开关的作用范围 + 灯泡状态周期为 6</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">实心圆 = 该开关会翻转此灯；开关 1（全部）= 开关 2（偶）+ 开关 3（奇）效果之和</text>

  <!-- ===== header: bulb numbers 1..6 ===== -->
  <g filter="url(#rough2)" font-size="12" fill="#555" font-weight="bold" text-anchor="middle">
    <text x="90" y="74">灯 1</text>
    <text x="160" y="74">灯 2</text>
    <text x="230" y="74">灯 3</text>
    <text x="300" y="74">灯 4</text>
    <text x="370" y="74">灯 5</text>
    <text x="440" y="74">灯 6</text>
  </g>

  <!-- column highlight for bulbs 1,2,3 (the determining ones) -->
  <rect x="73" y="82" width="34" height="200" fill="#fff8e1" stroke="none" opacity="0.6" filter="url(#rough2)"/>
  <rect x="143" y="82" width="34" height="200" fill="#fff8e1" stroke="none" opacity="0.6" filter="url(#rough2)"/>
  <rect x="213" y="82" width="34" height="200" fill="#fff8e1" stroke="none" opacity="0.6" filter="url(#rough2)"/>

  <!-- ===== Switch 1: flip ALL (blue) ===== -->
  <g filter="url(#rough2)">
    <rect x="14" y="100" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="42" y="118" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">开关 1</text>
    <text x="42" y="138" text-anchor="middle" font-size="9" fill="#446688">全部</text>
    <circle cx="90" cy="113" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <circle cx="160" cy="113" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <circle cx="230" cy="113" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <circle cx="300" cy="113" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <circle cx="370" cy="113" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <circle cx="440" cy="113" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>

  <!-- ===== Switch 2: flip even 2,4,6 (green) ===== -->
  <g filter="url(#rough2)">
    <rect x="14" y="148" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="42" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">开关 2</text>
    <text x="42" y="186" text-anchor="middle" font-size="9" fill="#4a7a3a">偶数</text>
    <circle cx="90" cy="161" r="9" fill="#fff" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="160" cy="161" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <circle cx="230" cy="161" r="9" fill="#fff" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="300" cy="161" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <circle cx="370" cy="161" r="9" fill="#fff" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="440" cy="161" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>

  <!-- ===== Switch 3: flip odd 1,3,5 (orange) ===== -->
  <g filter="url(#rough2)">
    <rect x="14" y="196" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="42" y="214" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">开关 3</text>
    <text x="42" y="234" text-anchor="middle" font-size="9" fill="#d6a040">奇数</text>
    <circle cx="90" cy="209" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <circle cx="160" cy="209" r="9" fill="#fff" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="230" cy="209" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <circle cx="300" cy="209" r="9" fill="#fff" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="370" cy="209" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <circle cx="440" cy="209" r="9" fill="#fff" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

  <!-- ===== Switch 4: flip 3k+1 = 1,4,7,... (red) ===== -->
  <g filter="url(#rough2)">
    <rect x="14" y="244" width="56" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <text x="42" y="262" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">开关 4</text>
    <text x="42" y="282" text-anchor="middle" font-size="9" fill="#b85450">3k+1</text>
    <circle cx="90" cy="257" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <circle cx="160" cy="257" r="9" fill="#fff" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="230" cy="257" r="9" fill="#fff" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="300" cy="257" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <circle cx="370" cy="257" r="9" fill="#fff" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="440" cy="257" r="9" fill="#fff" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

  <!-- ===== separator ===== -->
  <line x1="14" y1="300" x2="546" y2="300" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Bottom: period-6 + XOR reduction ===== -->
  <text x="280" y="322" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">关键归约：前 3 盏灯决定整串状态（周期 6）</text>

  <!-- period-6 strip: 1 2 3 4 5 6 | 7 8 9 ... -->
  <g filter="url(#rough2)" font-size="10" fill="#555" text-anchor="middle">
    <text x="50" y="350" font-weight="bold" fill="#446688">灯:</text>
    <text x="90" y="350">1</text>
    <text x="160" y="350">2</text>
    <text x="230" y="350">3</text>
    <text x="300" y="350">4</text>
    <text x="370" y="350">5</text>
    <text x="440" y="350">6</text>
    <text x="500" y="350" fill="#888">7 …</text>
  </g>

  <!-- equality arrows: b5=b3, b6=b2, b7=b1, b4=b1^b2^b3 -->
  <g filter="url(#rough2)">
    <!-- b4 = b1 ⊕ b2 ⊕ b3 : arrow from (90,375)(160,375)(230,375) merging to (300,375) -->
    <path d="M 90 372 Q 200 392 296 374" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)"/>
    <path d="M 160 372 Q 230 390 298 374" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)"/>
    <path d="M 230 372 Q 270 384 299 374" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)"/>
    <text x="300" y="378" font-size="10" fill="#b85450" font-weight="bold" text-anchor="middle">4</text>

    <!-- b5 = b3 : arrow 230 -> 370 -->
    <path d="M 234 372 Q 300 400 366 372" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
    <text x="300" y="402" font-size="9" fill="#4a7a3a" text-anchor="middle">灯5 = 灯3</text>
    <!-- b6 = b2 : arrow 160 -> 440 -->
    <path d="M 164 372 Q 300 414 436 372" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
    <text x="300" y="424" font-size="9" fill="#4a7a3a" text-anchor="middle">灯6 = 灯2，灯7 = 灯1，…（周期 6）</text>
  </g>

  <rect x="120" y="406" width="320" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="419" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">→ n ≥ 3 时，整串状态由前 3 盏唯一决定</text>
</svg>
