<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：模拟计数直到归零</text>

  <rect x="200" y="44" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">steps = 0</text>
  <path d="M260,76 L260,96" stroke="#446688" stroke-width="1.5" marker-end="url(#arrC)" fill="none" filter="url(#rough2)"/>

  <polygon points="260,98 360,142 260,186 160,142" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">num == 0 ?</text>
  <text x="260" y="156" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">已归零?</text>

  <path d="M360,142 L440,142" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="380" y="134" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="370" y="126" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="435" y="148" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 steps</text>

  <path d="M260,186 L260,210" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="270" y="202" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <polygon points="260,212 360,250 260,288 160,250" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">num 奇偶?</text>
  <text x="260" y="264" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">num &amp; 1</text>

  <path d="M160,250 L100,250 L100,310" stroke="#446688" stroke-width="1.5" marker-end="url(#arrC)" fill="none" filter="url(#rough2)"/>
  <text x="120" y="242" font-size="11" fill="#446688" filter="url(#rough2)">偶</text>

  <path d="M360,250 L420,250 L420,310" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="380" y="242" font-size="11" fill="#b85450" filter="url(#rough2)">奇</text>

  <rect x="40" y="312" width="120" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="332" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">num /= 2</text>
  <text x="100" y="348" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">右移一位</text>

  <rect x="360" y="312" width="120" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="332" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">num -= 1</text>
  <text x="420" y="348" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">清最低 1 位</text>

  <rect x="170" y="376" width="180" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="397" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">steps++ → 回到「num==0?」</text>

  <path d="M100,356 L100,392 L170,392" stroke="#446688" stroke-width="1.5" marker-end="url(#arrC)" fill="none" filter="url(#rough2)"/>
  <path d="M420,356 L420,392 L350,392" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>

  <path d="M260,408 L260,428" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M260,428 L470,428 L470,142 L500,142" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <text x="380" y="422" font-size="10" fill="#888" filter="url(#rough2)">循环回边</text>
</svg>
