<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    Kruskal 重构树：把「最小瓶颈」装进一棵树
  </text>

  <!-- ===== 左：原图 ===== -->
  <text x="140" y="56" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">原图（无向加权）</text>

  <!-- 原图边 -->
  <line x1="70" y1="110" x2="70" y2="200" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="58" y="158" font-size="12" fill="#b85450" filter="url(#rough2)">2</text>

  <line x1="160" y1="200" x2="160" y2="300" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="148" y="258" font-size="12" fill="#b85450" filter="url(#rough2)">3</text>

  <line x1="250" y1="200" x2="250" y2="300" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="238" y="258" font-size="12" fill="#b85450" filter="url(#rough2)">4</text>

  <line x1="70" y1="200" x2="160" y2="200" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="108" y="194" font-size="12" fill="#b85450" filter="url(#rough2)">5</text>

  <line x1="160" y1="300" x2="250" y2="300" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="198" y="294" font-size="12" fill="#b85450" filter="url(#rough2)">6</text>

  <!-- 被淘汰的重边（虚线） -->
  <line x1="70" y1="110" x2="250" y2="200" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="150" y="148" font-size="11" fill="#999" filter="url(#rough2)">9（成环·舍弃）</text>

  <!-- 原图节点 -->
  <circle cx="70" cy="110" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="115" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <circle cx="70" cy="200" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="205" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="160" cy="200" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="205" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="160" cy="300" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="305" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="250" cy="200" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="205" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <circle cx="250" cy="300" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="305" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <!-- ===== 中间箭头 ===== -->
  <path d="M285,205 Q330,205 370,205" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="178" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">边升序 Kruskal</text>
  <text x="330" y="230" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">每次合并建虚点</text>

  <!-- ===== 右：KRT ===== -->
  <text x="510" y="56" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">Kruskal 重构树</text>

  <!-- KRT 树边 -->
  <line x1="510" y1="90" x2="440" y2="160" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="510" y1="90" x2="580" y2="160" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="440" y1="160" x2="400" y2="240" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="440" y1="160" x2="480" y2="240" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="580" y1="160" x2="540" y2="240" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="580" y1="160" x2="620" y2="240" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="400" y1="240" x2="380" y2="330" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="400" y1="240" x2="420" y2="330" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="480" y1="240" x2="460" y2="330" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="480" y1="240" x2="500" y2="330" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- 虚点（橙色方块） -->
  <rect x="492" y="76" width="36" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="510" y="95" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v10·6</text>

  <rect x="422" y="146" width="36" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="165" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">v9·5</text>

  <rect x="562" y="146" width="36" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="580" y="165" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v8·4</text>

  <rect x="382" y="226" width="36" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="245" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v6·2</text>

  <rect x="462" y="226" width="36" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="480" y="245" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v7·3</text>

  <!-- 叶子（原节点，蓝色圆） -->
  <circle cx="380" cy="338" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="342" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0</text>
  <circle cx="420" cy="338" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="342" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="460" cy="338" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="342" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="500" cy="338" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="342" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3</text>
  <circle cx="540" cy="248" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="540" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <circle cx="620" cy="248" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="620" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>

  <!-- LCA 高亮 -->
  <circle cx="440" cy="160" r="24" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- 底部说明 -->
  <rect x="40" y="362" width="600" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="330" y="382" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    性质：LCA(0, 3) = v9，权值 5 = 0↔3 路径上「瓶颈边的最大值」→ query(0,3,6): 5 &lt; 6 = true
  </text>
</svg>
