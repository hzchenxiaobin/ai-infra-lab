<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：两个方向的「顺手聚合」（nums = [5,0,1,4]，k = 3）</text>

  <!-- 正向扫描箭头：prefMax -->
  <path d="M 70 46 L 288 46" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="180" y="38" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">正序扫：prefMax[i] = max(nums[0..i])</text>

  <!-- nums 行 -->
  <text x="56" y="78" text-anchor="end" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">nums</text>
  <rect x="70" y="60" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="96" y="80" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="126" y="60" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="152" y="80" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="182" y="60" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="208" y="80" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="238" y="60" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="264" y="80" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- 下标 -->
  <text x="96" y="104" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="152" y="104" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="208" y="104" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="264" y="104" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=3</text>

  <!-- 逆向扫描箭头：suffMin -->
  <path d="M 288 116 L 70 116" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="180" y="130" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">倒序扫：suffMin[i] = min(nums[i..n−1])</text>

  <!-- prefMax 行 -->
  <text x="56" y="164" text-anchor="end" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">prefMax</text>
  <rect x="70" y="146" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="96" y="165" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">5</text>
  <rect x="126" y="146" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="152" y="165" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">5</text>
  <rect x="182" y="146" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="208" y="165" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">5</text>
  <rect x="238" y="146" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="264" y="165" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">5</text>

  <!-- suffMin 行 -->
  <text x="56" y="198" text-anchor="end" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">suffMin</text>
  <rect x="70" y="180" width="52" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="96" y="199" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">0</text>
  <rect x="126" y="180" width="52" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="152" y="199" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">0</text>
  <rect x="182" y="180" width="52" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="208" y="199" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <rect x="238" y="180" width="52" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="264" y="199" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">4</text>

  <!-- 不稳定值行 -->
  <text x="56" y="232" text-anchor="end" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">不稳定值</text>
  <rect x="70" y="214" width="52" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="96" y="233" text-anchor="middle" font-size="11.5" fill="#a0433f" filter="url(#rough2)">5</text>
  <rect x="126" y="214" width="52" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="152" y="233" text-anchor="middle" font-size="11.5" fill="#a0433f" filter="url(#rough2)">5</text>
  <rect x="182" y="214" width="52" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="208" y="233" text-anchor="middle" font-size="11.5" fill="#a0433f" filter="url(#rough2)">4</text>
  <rect x="238" y="214" width="52" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="264" y="233" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 判定标记 -->
  <text x="96" y="256" text-anchor="middle" font-size="10" fill="#a0433f" filter="url(#rough2)">✗ 5&gt;3</text>
  <text x="152" y="256" text-anchor="middle" font-size="10" fill="#a0433f" filter="url(#rough2)">✗ 5&gt;3</text>
  <text x="208" y="256" text-anchor="middle" font-size="10" fill="#a0433f" filter="url(#rough2)">✗ 4&gt;3</text>
  <text x="264" y="256" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓ 1≤3</text>

  <!-- 右侧面板 -->
  <rect x="308" y="146" width="200" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="408" y="163" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">不稳定值(i) = prefMax[i] − suffMin[i]</text>
  <text x="408" y="177" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">每个 i 都是 O(1) 查表得到</text>

  <rect x="308" y="194" width="200" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="408" y="211" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">i=3：5 − 4 = 1 ≤ k = 3</text>
  <text x="408" y="226" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">首个 ⇒ 返回 3</text>

  <rect x="308" y="242" width="200" height="94" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="408" y="260" text-anchor="middle" font-size="10.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">⚠️ 不能二分</text>
  <text x="408" y="278" text-anchor="middle" font-size="9.5" fill="#a0433f" filter="url(#rough2)">prefMax ↗ 与 suffMin ↗ 都单调不减</text>
  <text x="408" y="294" text-anchor="middle" font-size="9.5" fill="#a0433f" filter="url(#rough2)">差值两头都动 ⇒ 不单调</text>
  <text x="408" y="313" text-anchor="middle" font-size="9.5" fill="#a0433f" filter="url(#rough2)">[5,0,1,4]→5,5,4,1 递减</text>
  <text x="408" y="329" text-anchor="middle" font-size="9.5" fill="#a0433f" filter="url(#rough2)">[1,5,2]→0,3,3 递增</text>

  <text x="160" y="300" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">正序扫描时逐列比较，</text>
  <text x="160" y="316" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">取第一个满足 ≤ k 的下标即返回</text>
  <text x="160" y="340" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">（suffMin 须先倒序建好；prefMax 边扫边维护）</text>
</svg>
