<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">陷阱：会话可能重叠——LEAD 只量到「下一个事件」</text>

  <rect x="90" y="44" width="373" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="102" y="61" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">会话 A：11-04 16:29 → 次日 01:49（9h20m）</text>

  <rect x="361" y="78" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="353" y="95" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">会话 B：1h59m（23:16 → 次日 01:15）整个嵌在 A 里</text>

  <path d="M 70 130 L 490 130" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 70 124 L 70 136" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 150 124 L 150 136" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 230 124 L 230 136" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 310 124 L 310 136" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 390 124 L 390 136" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 470 124 L 470 136" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="150" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">16:00</text>
  <text x="150" y="150" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">18:00</text>
  <text x="230" y="150" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">20:00</text>
  <text x="310" y="150" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">22:00</text>
  <text x="390" y="150" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">00:00</text>
  <text x="470" y="150" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">02:00</text>

  <path d="M 90 158 L 90 166 L 361 166 L 361 158" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="180" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">A.start → 下一事件（B.start）＝ 6h47m</text>

  <path d="M 361 158 L 361 166 L 441 166 L 441 158" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="470" y="180" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">1h59m</text>

  <text x="70" y="206" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">LEAD 视角合计：6h47m ＋ 1h59m ＝ 8h46m（重叠只算了一遍）</text>

  <text x="70" y="232" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">会话求和视角（题面解释）：9h20m ＋ 1h59m ＝ 11h19m（重叠算两遍）</text>

  <rect x="55" y="250" width="430" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="272" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">两个视角只差 2h33m —— 远小于 1 天</text>
  <text x="270" y="292" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">按天向下取整把这点差异整个吞掉：</text>
  <text x="270" y="308" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">示例都得 1 天；判题用例重叠共 17.6h，也都得 11 天</text>

  <rect x="55" y="330" width="430" height="62" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="352" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">表里没有 session_id，重叠的 start/stop 本就配不成对；</text>
  <text x="270" y="370" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">官方参考解即 LEAD 版——日级粒度让配对模糊无伤大雅。</text>
  <text x="270" y="386" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">严格还原「会话求和」语义的零配对写法见题解第 5 节</text>
</svg>
