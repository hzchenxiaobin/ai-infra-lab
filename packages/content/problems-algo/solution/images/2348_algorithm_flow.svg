<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">单次遍历增量计数流程</text>

  <!-- Start ellipse -->
  <ellipse cx="260" cy="50" rx="46" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="55" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>

  <!-- arrow to loop box -->
  <path d="M 260 66 L 260 84" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop box: 取下一个 x ∈ nums -->
  <rect x="160" y="86" width="200" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="107" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">取下一个 x ∈ nums</text>

  <!-- arrow to diamond -->
  <path d="M 260 118 L 260 138" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond: x == 0 ? -->
  <path d="M 260 138 L 320 178 L 260 218 L 200 178 z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="183" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">x == 0 ?</text>

  <!-- 是 branch (left) to yes box -->
  <path d="M 200 178 L 150 178 L 150 188" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="172" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- 否 branch (right) to no box -->
  <path d="M 320 178 L 370 178 L 370 188" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="338" y="172" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- yes box: cur += 1; ans += cur -->
  <rect x="64" y="190" width="172" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="150" y="207" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cur += 1</text>
  <text x="150" y="223" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans += cur</text>

  <!-- no box: cur = 0 -->
  <rect x="304" y="190" width="132" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="370" y="215" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cur = 0</text>

  <!-- merge arrows to 还有元素? diamond -->
  <path d="M 150 230 L 150 256 L 260 256 L 260 268" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 370 230 L 370 256 L 260 256" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- merge diamond: 还有元素? -->
  <path d="M 260 268 L 318 300 L 260 332 L 202 300 z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">还有元素?</text>

  <!-- 否 (no more) branch down to return -->
  <path d="M 260 332 L 260 348" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="345" font-size="11" fill="#666" font-weight="bold">否</text>

  <!-- return box -->
  <rect x="184" y="350" width="152" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="374" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">返回 ans</text>

  <!-- 是 (yes, loop back) branch: right -> up -> into loop box right edge -->
  <path d="M 318 300 L 466 300 L 466 102 L 360 102" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="328" y="293" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="440" y="200" font-size="10" fill="#888" transform="rotate(-90 440 200)">循环</text>

  <!-- bottom callout -->
  <rect x="20" y="396" width="480" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="409" text-anchor="middle" font-size="10" fill="#666">cur = 以当前位置结尾的连续 0 长度；ans 须用 64 位（最坏 n(n+1)/2 ≈ 5×10⁹）</text>
</svg>
