<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="560" fill="#fafafa"/>

  <text x="230" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">一次遍历：掩码 + 首次出现位置</text>

  <!-- Init -->
  <rect x="80" y="44" width="300" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="66" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="230" y="84" text-anchor="middle" font-size="11" fill="#555">pos[32] 全填 −2（未出现）</text>
  <text x="230" y="98" text-anchor="middle" font-size="11" fill="#555">pos[0] = −1, mask = 0, ans = 0</text>

  <path d="M 230 108 L 230 124" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Loop entry -->
  <rect x="70" y="128" width="320" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough)"/>
  <text x="230" y="148" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for i in 0..n−1</text>
  <text x="230" y="164" text-anchor="middle" font-size="10.5" fill="#555">逐字符扫描 s</text>

  <path d="M 230 176 L 230 192" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- update mask -->
  <rect x="100" y="196" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="216" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">if s[i] 是元音</text>
  <text x="230" y="232" text-anchor="middle" font-size="11" fill="#555">mask ^= (1 &lt;&lt; bit[s[i]])</text>

  <path d="M 230 244 L 230 260" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Diamond: pos[mask] seen? -->
  <polygon points="230,264 380,316 230,368 80,316" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="312" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">pos[mask] ≠ −2 ?</text>
  <text x="230" y="330" text-anchor="middle" font-size="10.5" fill="#777">该状态曾出现过？</text>

  <!-- Yes branch: update ans -->
  <path d="M 380 316 L 430 316 L 430 372" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="388" y="308" font-size="11" fill="#82b366" font-weight="bold">Yes</text>
  <rect x="346" y="376" width="108" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="400" y="398" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">更新答案</text>
  <text x="400" y="416" text-anchor="middle" font-size="10" fill="#555">ans = max(ans,</text>
  <text x="400" y="430" text-anchor="middle" font-size="10" fill="#555">  i − pos[mask])</text>

  <!-- No branch: record first -->
  <path d="M 80 316 L 30 316 L 30 372" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="38" y="308" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="6" y="376" width="108" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="60" y="398" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">记录首次</text>
  <text x="60" y="416" text-anchor="middle" font-size="10" fill="#555">pos[mask] = i</text>
  <text x="60" y="430" text-anchor="middle" font-size="9.5" fill="#aaa">只记最早位置</text>

  <!-- merge & loop back -->
  <path d="M 60 448 L 60 468 L 150 468" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <path d="M 400 448 L 400 468 L 310 468" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <path d="M 230 468 L 230 150 L 390 150" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="244" y="462" font-size="9.5" fill="#aaa">下一字符</text>

  <!-- final -->
  <rect x="80" y="500" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough)"/>
  <text x="230" y="520" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历结束 → return ans</text>
  <text x="230" y="536" text-anchor="middle" font-size="10.5" fill="#888">O(n) 时间 · O(1) 空间（仅 32 种状态）</text>
</svg>
