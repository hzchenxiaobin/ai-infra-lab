<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：删 2 个元素 → nums2[0] 只可能配排序后 nums1 的前 3 个</text>

  <!-- sorted nums1 row -->
  <text x="108" y="72" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">排序后 nums1</text>
  <rect x="120" y="50" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="140" y="74" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="166" y="50" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="186" y="74" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="212" y="50" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="232" y="74" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">12</text>
  <rect x="258" y="50" width="40" height="36" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="278" y="74" text-anchor="middle" font-size="15" fill="#999999" font-weight="bold" filter="url(#rough2)">16</text>
  <rect x="304" y="50" width="40" height="36" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="324" y="74" text-anchor="middle" font-size="15" fill="#999999" font-weight="bold" filter="url(#rough2)">20</text>

  <!-- index labels -->
  <text x="140" y="104" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i=0</text>
  <text x="186" y="104" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i=1</text>
  <text x="232" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i=2（x 最小）</text>
  <text x="301" y="104" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">保留最小不可能落在灰色区</text>

  <!-- argument chain -->
  <rect x="60" y="124" width="400" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="144" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">nums2[0] 是最小值 → 它配对的是「保留下来的元素中的最小」</text>
  <path d="M 260 156 L 260 168" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="60" y="172" width="400" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="192" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">若保留最小在排序后下标 j，则前面 j 个必须全删 → j ≤ 2</text>

  <!-- candidates -->
  <rect x="60" y="214" width="400" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="236" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">候选只有 3 个：x_i = nums2[0] − nums1[i]，i ∈ {0, 1, 2}</text>

  <!-- minimize strategy -->
  <rect x="60" y="260" width="400" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i 越大 → nums1[i] 越大 → x 越小：求最小 x，从 i = 2 开始试</text>

  <!-- verify hint -->
  <rect x="60" y="300" width="400" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">每个候选用双指针 O(n) 验证：相等即配对，不匹配视为删除</text>

  <!-- complexity note -->
  <path d="M 100 348 L 148 348" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">排序 O(n log n) + 3 次验证 O(n)：从 C(n,2) 种删法降到 3 个候选</text>
  <rect x="60" y="364" width="400" height="28" fill="#fafafa" stroke="#888888" stroke-width="1.2" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="382" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">对照 3131：无删除时 x 唯一（min 对 min）；删 2 个后 x 有多个候选，取最小</text>
</svg>
