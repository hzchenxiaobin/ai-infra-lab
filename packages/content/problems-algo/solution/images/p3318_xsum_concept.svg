<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：(频次, 数值) 二元组排序 + 滑窗增量维护</text>
  <text x="260" y="37" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">平局数值大者优先 ⇔ 二元组字典序降序，一句 sort 吃干净规则</text>

  <!-- ================= 左列：滑窗与频次表 ================= -->
  <text x="150" y="62" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">左：窗口滑动，频次 O(1) 增量</text>

  <!-- 窗口底色（前 6 个） -->
  <rect x="24" y="70" width="186" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <!-- 8 个格子 -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="28" y="73" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <rect x="58" y="73" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <rect x="88" y="73" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <rect x="118" y="73" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <rect x="148" y="73" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <rect x="178" y="73" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <rect x="216" y="73" width="26" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <rect x="246" y="73" width="26" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="41" y="91" filter="url(#rough2)">1</text>
    <text x="71" y="91" filter="url(#rough2)">1</text>
    <text x="101" y="91" filter="url(#rough2)">2</text>
    <text x="131" y="91" filter="url(#rough2)">2</text>
    <text x="161" y="91" filter="url(#rough2)">3</text>
    <text x="191" y="91" filter="url(#rough2)">4</text>
    <text x="229" y="91" fill="#888" filter="url(#rough2)">2</text>
    <text x="259" y="91" fill="#888" filter="url(#rough2)">3</text>
  </g>
  <text x="117" y="116" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">窗口 [1,1,2,2,3,4]，k = 6</text>

  <!-- 出 / 入 箭头 -->
  <path d="M 41 122 C 20 132, 14 146, 20 158" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="16" y="146" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">移出 1</text>
  <path d="M 259 122 C 280 132, 286 146, 280 158" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="248" y="146" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">移入 2</text>

  <!-- 频次表 -->
  <text x="150" y="172" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">频次表 cnt[]（值域 1..50 的计数数组）</text>
  <g font-size="11" text-anchor="middle">
    <rect x="30" y="180" width="52" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="56" y="197" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">1 → 2</text>
    <rect x="90" y="180" width="52" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="116" y="197" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">2 → 2</text>
    <rect x="150" y="180" width="52" height="26" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="176" y="197" fill="#888" filter="url(#rough2)">3 → 1</text>
    <rect x="210" y="180" width="52" height="26" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="236" y="197" fill="#888" filter="url(#rough2)">4 → 1</text>
  </g>
  <text x="150" y="226" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">相邻窗口只差「出 1 进 1」，各改一格，免每窗从头数</text>

  <!-- ================= 右列：排序选择 ================= -->
  <text x="404" y="62" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">右：候选排序，取前 x 名</text>

  <!-- top-x 分组框 -->
  <rect x="306" y="72" width="118" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="365" y="86" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">top-x（x = 2）</text>
  <g font-size="12" text-anchor="middle" font-weight="bold">
    <text x="365" y="108" fill="#2f5d24" filter="url(#rough2)">(2, 2)</text>
    <text x="365" y="130" fill="#2f5d24" filter="url(#rough2)">(2, 1)</text>
  </g>
  <text x="365" y="152" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">频次 2 的两组直接当选</text>

  <!-- 落选分组框 -->
  <rect x="432" y="72" width="72" height="92" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="468" y="86" text-anchor="middle" font-size="9.5" fill="#888" font-weight="bold" filter="url(#rough2)">落选</text>
  <g font-size="12" text-anchor="middle" fill="#aaa">
    <text x="468" y="108" filter="url(#rough2)">(1, 4)</text>
    <text x="468" y="130" filter="url(#rough2)">(1, 3)</text>
  </g>
  <text x="468" y="152" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">频次 1 不够看</text>

  <!-- 排序方向箭头 -->
  <path d="M 300 164 L 300 78" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="292" y="128" text-anchor="end" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)" transform="rotate(-90 292 128)">字典序降序</text>

  <!-- 求和框 -->
  <rect x="306" y="176" width="198" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="405" y="192" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">x-sum = 2×2 + 2×1 = 6</text>
  <text x="405" y="208" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">sum += freq × v</text>

  <!-- 候选不足 x 个的退化说明 -->
  <rect x="306" y="224" width="198" height="24" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="405" y="240" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">种类数 &lt; x 时自然取全部，无需特判</text>

  <!-- ================= 底部：规则总结 ================= -->
  <rect x="26" y="256" width="466" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="259" y="276" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">两条规则，一处易错</text>
  <text x="259" y="296" text-anchor="middle" font-size="10" fill="#7a5a20" filter="url(#rough2)">规则① (freq, v) 按字典序降序：先比频次、平局比数值 —— 与题意逐字对应</text>
  <text x="259" y="314" text-anchor="middle" font-size="10" fill="#7a5a20" filter="url(#rough2)">规则② 值域 ≤ 50 用计数数组；窗口滑动只动两个下标，频次更新 O(1)</text>
  <text x="259" y="336" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">易错：元素移出后 cnt[v] 归零，收集候选时必须跳过频次为 0 的幽灵项！</text>
</svg>
