<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：DISTINCT 司机集合 LEFT JOIN 乘客列，COUNT(列) 计 0</text>

  <!-- ===== Left: Rides table (6 rows) ===== -->
  <text x="120" y="50" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Rides 表（6 行）</text>

  <!-- header -->
  <rect x="30" y="56" width="200" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="55" y="71" font-size="8" fill="#446688" font-weight="bold">ride_id</text>
  <text x="115" y="71" font-size="8" fill="#446688" font-weight="bold">driver_id</text>
  <text x="180" y="71" font-size="8" fill="#446688" font-weight="bold">passenger_id</text>

  <!-- Row 1: 1,7,1 -->
  <rect x="30" y="80" width="200" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="94" font-size="9" fill="#4a7a3a">1</text>
  <text x="115" y="94" font-size="9" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="180" y="94" font-size="9" fill="#555">1</text>

  <!-- Row 2: 2,7,2 -->
  <rect x="30" y="102" width="200" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="116" font-size="9" fill="#4a7a3a">2</text>
  <text x="115" y="116" font-size="9" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="180" y="116" font-size="9" fill="#555">2</text>

  <!-- Row 3: 3,11,1 -->
  <rect x="30" y="124" width="200" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="138" font-size="9" fill="#d6a040">3</text>
  <text x="115" y="138" font-size="9" fill="#d6a040" font-weight="bold">11</text>
  <text x="180" y="138" font-size="9" fill="#555">1</text>

  <!-- Row 4: 4,11,7  (passenger=7 matches driver 7) -->
  <rect x="30" y="146" width="200" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="160" font-size="9" fill="#d6a040">4</text>
  <text x="115" y="160" font-size="9" fill="#d6a040" font-weight="bold">11</text>
  <text x="180" y="160" font-size="9" fill="#b85450" font-weight="bold">7</text>

  <!-- Row 5: 5,11,7  (passenger=7 matches driver 7) -->
  <rect x="30" y="168" width="200" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="182" font-size="9" fill="#d6a040">5</text>
  <text x="115" y="182" font-size="9" fill="#d6a040" font-weight="bold">11</text>
  <text x="180" y="182" font-size="9" fill="#b85450" font-weight="bold">7</text>

  <!-- Row 6: 6,11,3 -->
  <rect x="30" y="190" width="200" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="204" font-size="9" fill="#d6a040">6</text>
  <text x="115" y="204" font-size="9" fill="#d6a040" font-weight="bold">11</text>
  <text x="180" y="204" font-size="9" fill="#555">3</text>

  <!-- column highlight legend -->
  <rect x="30" y="220" width="200" height="40" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="40" y="230" width="12" height="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="237" font-size="8" fill="#4a7a3a">driver=7 的行</text>
  <rect x="40" y="244" width="12" height="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="251" font-size="8" fill="#d6a040">driver=11 的行</text>
  <rect x="150" y="237" width="10" height="8" fill="#b85450" filter="url(#rough2)"/>
  <text x="166" y="244" font-size="8" fill="#b85450">乘客=7</text>

  <!-- ===== Middle: DISTINCT driver set + LEFT JOIN ===== -->
  <path d="M 232 140 L 268 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="272" y="56" width="180" height="76" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="362" y="74" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">DISTINCT driver_id</text>
  <text x="362" y="88" text-anchor="middle" font-size="8" fill="#666">从 driver_id 列去重</text>
  <line x1="282" y1="94" x2="442" y2="94" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <rect x="300" y="100" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="115" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">7</text>
  <rect x="358" y="100" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="378" y="115" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">11</text>
  <text x="362" y="128" text-anchor="middle" font-size="7" fill="#888">司机集合 = {7, 11}</text>

  <!-- LEFT JOIN box -->
  <rect x="272" y="146" width="180" height="114" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="362" y="164" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">LEFT JOIN Rides r</text>
  <text x="362" y="178" text-anchor="middle" font-size="8" fill="#b85450">ON d.driver_id = r.passenger_id</text>
  <line x1="282" y1="184" x2="442" y2="184" stroke="#f0d0d0" stroke-width="1" filter="url(#rough2)"/>

  <text x="282" y="198" font-size="8" fill="#4a7a3a" font-weight="bold">driver 7 →</text>
  <text x="282" y="210" font-size="8" fill="#666">匹配 ride 4, 5（乘客=7）</text>
  <text x="282" y="222" font-size="8" fill="#4a7a3a" font-weight="bold">2 行非空</text>

  <text x="282" y="238" font-size="8" fill="#d6a040" font-weight="bold">driver 11 →</text>
  <text x="282" y="250" font-size="8" fill="#999">无匹配 → NULL 补行</text>
  <text x="282" y="258" font-size="8" fill="#b85450" font-weight="bold">1 行全 NULL</text>

  <!-- ===== Right: GROUP BY + COUNT ===== -->
  <path d="M 454 203 L 486 203" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="490" y="56" width="130" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="555" y="74" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">GROUP BY driver_id</text>
  <text x="555" y="90" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">COUNT(r.ride_id)</text>
  <text x="555" y="106" text-anchor="middle" font-size="7" fill="#888">数非空 ride_id</text>
  <text x="555" y="120" text-anchor="middle" font-size="7" fill="#b85450">⚠ 不能用 COUNT(*)</text>

  <path d="M 555 130 L 555 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result table -->
  <rect x="490" y="156" width="130" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="525" y="171" font-size="8" fill="#446688" font-weight="bold">driver_id</text>
  <text x="585" y="171" font-size="8" fill="#446688" font-weight="bold">cnt</text>

  <rect x="490" y="180" width="130" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="525" y="195" font-size="10" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="585" y="195" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>

  <rect x="490" y="204" width="130" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="525" y="219" font-size="10" fill="#d6a040" font-weight="bold">11</text>
  <text x="585" y="219" font-size="10" fill="#d6a040" font-weight="bold">0</text>

  <text x="555" y="240" text-anchor="middle" font-size="8" fill="#888">任意顺序返回</text>

  <!-- ===== Bottom note ===== -->
  <rect x="30" y="278" width="590" height="178" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="325" y="298" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">同一张表的自引用：司机列 ↔ 乘客列，LEFT JOIN 保 0 计数</text>

  <text x="48" y="322" font-size="9" fill="#446688" font-weight="bold">① 司机集合</text>
  <text x="48" y="336" font-size="8" fill="#666">DISTINCT driver_id —— 谁开过车，谁就要被统计</text>
  <text x="48" y="348" font-size="7" fill="#888">司机与乘客都来自同一张 Rides 表，driver_id 列是统计主体</text>

  <text x="48" y="372" font-size="9" fill="#b85450" font-weight="bold">② LEFT JOIN 配对</text>
  <text x="48" y="386" font-size="8" fill="#666">ON d.driver_id = r.passenger_id —— 把司机当乘客去乘客列里找</text>
  <text x="48" y="398" font-size="7" fill="#888">LEFT JOIN 保留未当过乘客的司机（补一行全 NULL），这是 cnt=0 的来源</text>

  <text x="48" y="422" font-size="9" fill="#4a7a3a" font-weight="bold">③ COUNT(列) 非 COUNT(*)</text>
  <text x="330" y="422" font-size="8" fill="#666">COUNT(r.ride_id) 数非空行 → 未匹配司机计 0</text>
  <text x="48" y="436" font-size="7" fill="#b85450">COUNT(*) 会把 NULL 补行也算 1，driver 11 误得 1 而非 0 —— 经典陷阱</text>
</svg>
