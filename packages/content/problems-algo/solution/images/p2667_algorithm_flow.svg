<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：工厂造一次函数，每次调用恒返回同一字符串</text>

  <!-- Step 1: createHelloWorld -->
  <rect x="40" y="50" width="250" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="165" y="74" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">createHelloWorld()</text>
  <text x="165" y="94" text-anchor="middle" font-size="11" fill="#333">构造并返回一个常量函数 f</text>

  <path d="M 165 112 L 165 140" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: call f with args -->
  <rect x="40" y="144" width="250" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="165" y="168" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">调用 f(...args)</text>
  <text x="165" y="186" text-anchor="middle" font-size="11" fill="#888">可传 0~10 个任意类型参数</text>

  <path d="M 165 206 L 165 230" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: ignore args -->
  <rect x="40" y="234" width="250" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="165" y="258" text-anchor="middle" font-size="12" fill="#333">丢弃所有参数</text>
  <text x="165" y="276" text-anchor="middle" font-size="11" fill="#888">不读取、不判断、直接忽略</text>

  <path d="M 165 292 L 165 316" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: return constant -->
  <rect x="40" y="320" width="250" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="165" y="350" text-anchor="middle" font-size="12" fill="#333">返回字面量 "Hello World"</text>

  <!-- return to caller -->
  <path d="M 290 345 L 350 345" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <rect x="350" y="320" width="210" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="455" y="350" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">"Hello World"</text>

  <!-- loop back arrow: call again -->
  <path d="M 455 320 L 455 174 L 292 174" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="166" text-anchor="middle" font-size="11" fill="#888">下一次调用，输出永远相同</text>

  <text x="300" y="388" text-anchor="middle" font-size="11" fill="#888">💡 「常量函数」= 忽略输入、恒返回定值的函数，函数式编程里叫 K 组合子</text>
</svg>
