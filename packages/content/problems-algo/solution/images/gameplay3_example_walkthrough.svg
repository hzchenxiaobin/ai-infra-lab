<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：玩家 1 的累计局数逐行累加</text>

  <!-- Player 1 partition focus -->
  <text x="80" y="60" font-size="11" fill="#b85450" font-weight="bold">玩家 1 的窗口（按 event_date 升序）</text>

  <!-- timeline row 1 -->
  <rect x="40" y="74" width="520" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="60" y="94" font-size="10" fill="#333" font-weight="bold">第 1 行</text>
  <text x="60" y="111" font-size="9.5" fill="#666">2016-03-01</text>
  <text x="180" y="100" font-size="11" fill="#333">games_played =</text>
  <text x="290" y="100" font-size="13" fill="#b85450" font-weight="bold">5</text>
  <text x="320" y="100" font-size="9.5" fill="#888">帧：[5]</text>
  <text x="430" y="100" font-size="10" fill="#333">so_far =</text>
  <text x="510" y="100" font-size="13" fill="#b85450" font-weight="bold">5</text>

  <!-- plus arrow -->
  <path d="M300 130 L300 150" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="312" y="143" font-size="9" fill="#b85450">+ 下一行 6</text>

  <!-- timeline row 2 -->
  <rect x="40" y="152" width="520" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="60" y="172" font-size="10" fill="#333" font-weight="bold">第 2 行</text>
  <text x="60" y="189" font-size="9.5" fill="#666">2016-05-02</text>
  <text x="180" y="178" font-size="11" fill="#333">games_played =</text>
  <text x="290" y="178" font-size="13" fill="#b85450" font-weight="bold">6</text>
  <text x="320" y="178" font-size="9.5" fill="#888">帧：[5, 6]</text>
  <text x="430" y="178" font-size="10" fill="#333">so_far =</text>
  <text x="510" y="178" font-size="13" fill="#b85450" font-weight="bold">11</text>

  <!-- plus arrow -->
  <path d="M300 208 L300 228" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="312" y="221" font-size="9" fill="#b85450">+ 下一行 1</text>

  <!-- timeline row 3 -->
  <rect x="40" y="230" width="520" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="60" y="250" font-size="10" fill="#333" font-weight="bold">第 3 行</text>
  <text x="60" y="267" font-size="9.5" fill="#666">2017-06-25</text>
  <text x="180" y="256" font-size="11" fill="#333">games_played =</text>
  <text x="290" y="256" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <text x="320" y="256" font-size="9.5" fill="#888">帧：[5, 6, 1]</text>
  <text x="430" y="256" font-size="10" fill="#333">so_far =</text>
  <text x="510" y="256" font-size="13" fill="#b85450" font-weight="bold">12</text>

  <text x="300" y="306" text-anchor="middle" font-size="9.5" fill="#888">↑ 窗口右边界随当前行推进，左边界固定在分区内首行</text>

  <!-- player 3 compact -->
  <line x1="40" y1="320" x2="560" y2="320" stroke="#d6a040" stroke-width="0.8" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="80" y="342" font-size="11" fill="#d6a040" font-weight="bold">玩家 3 的窗口（独立分区，与玩家 1 互不影响）</text>

  <rect x="40" y="352" width="250" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="55" y="372" font-size="9.5" fill="#666">2016-03-02</text>
  <text x="55" y="388" font-size="10" fill="#333">games=</text>
  <text x="110" y="388" font-size="11" fill="#d6a040" font-weight="bold">0</text>
  <text x="145" y="388" font-size="9" fill="#888">帧[0]</text>
  <text x="200" y="388" font-size="10" fill="#333">→</text>
  <text x="225" y="388" font-size="11" fill="#d6a040" font-weight="bold">0</text>

  <path d="M290 376 L320 376" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="320" y="352" width="250" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="335" y="372" font-size="9.5" fill="#666">2018-07-03</text>
  <text x="335" y="388" font-size="10" fill="#333">games=</text>
  <text x="390" y="388" font-size="11" fill="#d6a040" font-weight="bold">5</text>
  <text x="420" y="388" font-size="9" fill="#888">帧[0,5]</text>
  <text x="475" y="388" font-size="10" fill="#333">→</text>
  <text x="500" y="388" font-size="11" fill="#d6a040" font-weight="bold">5</text>

  <text x="300" y="416" text-anchor="middle" font-size="9.5" fill="#666">玩家 3 首行 games_played=0，累计仍为 0；第二行 0+5=5</text>
</svg>
