<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：directions = "RLRSLL"</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">l = 0（首字符 R 非 L）, r = 5（末字符 L 非 R）→ 中间段 = 整串</text>

  <!-- ===== Car row ===== -->
  <!-- index 0: R -->
  <rect x="60" y="62" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="82" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">R</text>
  <!-- index 1: L -->
  <rect x="120" y="62" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="142" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">L</text>
  <!-- index 2: R -->
  <rect x="180" y="62" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="202" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">R</text>
  <!-- index 3: S -->
  <rect x="240" y="62" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="262" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">S</text>
  <!-- index 4: L -->
  <rect x="300" y="62" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="322" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">L</text>
  <!-- index 5: L -->
  <rect x="360" y="62" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="382" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">L</text>

  <!-- index numbers -->
  <text x="82" y="118" text-anchor="middle" font-size="9.5" fill="#888">0</text>
  <text x="142" y="118" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <text x="202" y="118" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <text x="262" y="118" text-anchor="middle" font-size="9.5" fill="#888">3</text>
  <text x="322" y="118" text-anchor="middle" font-size="9.5" fill="#888">4</text>
  <text x="382" y="118" text-anchor="middle" font-size="9.5" fill="#888">5</text>

  <!-- count marks -->
  <text x="82" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="142" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="202" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="262" y="136" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">—</text>
  <text x="322" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="382" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <text x="280" y="156" text-anchor="middle" font-size="10.5" fill="#446688">移动车 5 辆（S 不计）→ ans = 5</text>

  <!-- divider -->
  <line x1="40" y1="172" x2="520" y2="172" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Collision events ===== -->
  <text x="40" y="192" font-size="11.5" fill="#444" font-weight="bold">碰撞链验证（不变量：计数 = 停下的移动车数）</text>

  <!-- Event 1 -->
  <rect x="40" y="202" width="300" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="222" font-size="10.5" fill="#333">车0(R) ↔ 车1(L) 反向相撞</text>
  <rect x="350" y="206" width="46" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="12" filter="url(#rough2)"/>
  <text x="373" y="222" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+2</text>
  <text x="410" y="222" font-size="10.5" fill="#555">累计 = 2</text>

  <!-- Event 2 -->
  <rect x="40" y="240" width="300" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="260" font-size="10.5" fill="#333">车2(R) → 车3(S) 移动撞静止</text>
  <rect x="350" y="244" width="46" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="12" filter="url(#rough2)"/>
  <text x="373" y="260" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+1</text>
  <text x="410" y="260" font-size="10.5" fill="#555">累计 = 3</text>

  <!-- Event 3 -->
  <rect x="40" y="278" width="300" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="298" font-size="10.5" fill="#333">车4(L) → 车3(S) 移动撞静止</text>
  <rect x="350" y="282" width="46" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="12" filter="url(#rough2)"/>
  <text x="373" y="298" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+1</text>
  <text x="410" y="298" font-size="10.5" fill="#555">累计 = 4</text>

  <!-- Event 4 -->
  <rect x="40" y="316" width="300" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="336" font-size="10.5" fill="#333">车5(L) → 已停的车4 移动撞静止</text>
  <rect x="350" y="320" width="46" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="12" filter="url(#rough2)"/>
  <text x="373" y="336" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+1</text>
  <text x="410" y="336" font-size="10.5" fill="#555">累计 = 5</text>

  <!-- Total -->
  <rect x="40" y="358" width="460" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="378" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">5 辆移动车全部停下，碰撞累计 5 = 移动车数 ✓ 不变量成立</text>
</svg>
