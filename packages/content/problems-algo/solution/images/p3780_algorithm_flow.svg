<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="28" y="22" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟遍历维护每组前三大，再枚举四种组合</text>

  <!-- 开始 -->
  <rect x="110" y="38" width="160" height="32" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="58" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">开始：一趟遍历 nums</text>
  <path d="M 190 70 L 190 84" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 取元素算余数 -->
  <rect x="90" y="86" width="200" height="36" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="108" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">取元素 x，r = x mod 3</text>
  <path d="M 190 122 L 190 136" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 维护前三 -->
  <rect x="80" y="138" width="220" height="50" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="158" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">x 插入 top[r] 前三大（组内降序）</text>
  <text x="190" y="176" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">旧的第 3 大被淘汰</text>
  <path d="M 190 188 L 190 200" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 遍历完？ -->
  <polygon points="190,202 262,232 190,262 118,232" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="236" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">遍历完？</text>
  <path d="M 262 232 L 312 232 L 312 104 L 292 104" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="276" y="224" font-size="11" fill="#33506b" filter="url(#rough2)">否</text>
  <path d="M 190 262 L 190 280" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="200" y="277" font-size="11" fill="#33506b" filter="url(#rough2)">是</text>

  <!-- 枚举四种组合 -->
  <rect x="70" y="282" width="240" height="58" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="300" text-anchor="middle" font-size="11" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">枚举四种组合计分：</text>
  <text x="190" y="318" text-anchor="middle" font-size="10.5" fill="#2d5a24" filter="url(#rough2)">000/111/222：组内前三之和（凑齐才计）</text>
  <text x="190" y="336" text-anchor="middle" font-size="10.5" fill="#2d5a24" filter="url(#rough2)">012：三组各自最大之和（三组各非空）</text>
  <path d="M 190 340 L 190 354" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 有合法组合？ -->
  <polygon points="190,356 270,388 190,420 110,388" fill="#ffffff" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="392" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">有合法组合？</text>

  <path d="M 190 420 L 190 436" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="200" y="433" font-size="11" fill="#2d5a24" filter="url(#rough2)">是</text>
  <rect x="100" y="438" width="180" height="34" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="459" text-anchor="middle" font-size="12" fill="#2d5a24" filter="url(#rough2)">返回最大和（≤ 3×10⁵）</text>

  <path d="M 270 388 L 320 388" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="284" y="381" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="320" y="372" width="96" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="368" y="392" text-anchor="middle" font-size="12" fill="#8a3030" filter="url(#rough2)">返回 0</text>

  <!-- 侧注 -->
  <rect x="340" y="146" width="196" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="438" y="166" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">全程只有 9 个槽位</text>
  <text x="438" y="184" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">（3 组 × 前三大），空间 O(1)</text>
</svg>
