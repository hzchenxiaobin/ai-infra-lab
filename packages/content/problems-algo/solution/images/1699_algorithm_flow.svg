<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：FROM Calls → LEAST/GREATEST 归一化 → GROUP BY 配对 → COUNT + SUM</text>

  <!-- 步骤 1 FROM -->
  <rect x="20" y="54" width="170" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="105" y="78" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">① FROM Calls</text>
  <text x="105" y="96" text-anchor="middle" font-size="9.5" fill="#333">读取全部通话记录</text>
  <text x="105" y="112" text-anchor="middle" font-size="9" fill="#888">含重复行 &amp; 双向记录</text>

  <path d="M192 88 L228 88" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 2 SELECT 归一化表达式 -->
  <rect x="230" y="54" width="180" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="76" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">② SELECT（投影表达式）</text>
  <text x="320" y="94" text-anchor="middle" font-size="9.5" fill="#333">LEAST(from_id, to_id) → p1</text>
  <text x="320" y="110" text-anchor="middle" font-size="9.5" fill="#333">GREATEST(from_id, to_id) → p2</text>

  <path d="M412 88 L448 88" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 3 GROUP BY -->
  <rect x="450" y="54" width="170" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="535" y="78" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">③ GROUP BY 1, 2</text>
  <text x="535" y="96" text-anchor="middle" font-size="9.5" fill="#333">按归一化配对分组</text>
  <text x="535" y="112" text-anchor="middle" font-size="9" fill="#888">(1,2) 与 (2,1) 合并</text>

  <!-- 步骤 4 SELECT 聚合 -->
  <rect x="180" y="150" width="420" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="390" y="172" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">④ SELECT 聚合输出</text>
  <text x="390" y="192" text-anchor="middle" font-size="10" fill="#333">person1, person2,</text>
  <text x="390" y="210" text-anchor="middle" font-size="10" fill="#333">COUNT(1) AS call_count, SUM(duration) AS total_duration</text>

  <path d="M535 124 L535 148" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 结果表 -->
  <rect x="150" y="244" width="340" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="264" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">结果（person1 | person2 | call_count | total_duration）</text>
  <rect x="170" y="272" width="60" height="22" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="288" text-anchor="middle" font-size="8.5" fill="#888">person1</text>
  <rect x="230" y="272" width="60" height="22" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="8.5" fill="#888">person2</text>
  <rect x="290" y="272" width="80" height="22" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="330" y="288" text-anchor="middle" font-size="8.5" fill="#888">call_count</text>
  <rect x="370" y="272" width="90" height="22" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="415" y="288" text-anchor="middle" font-size="8.5" fill="#888">total_duration</text>

  <text x="200" y="312" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="260" y="312" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="330" y="312" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="415" y="312" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">70</text>

  <text x="200" y="332" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="260" y="332" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="330" y="332" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>
  <text x="415" y="332" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">999</text>

  <path d="M390 224 L320 242" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 子句执行顺序说明 -->
  <rect x="20" y="150" width="140" height="100" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="90" y="172" text-anchor="middle" font-size="9.5" fill="#666" font-weight="bold">SQL 执行顺序</text>
  <text x="30" y="190" font-size="9" fill="#555">FROM</text>
  <text x="30" y="204" font-size="9" fill="#555">→ GROUP BY</text>
  <text x="30" y="218" font-size="9" fill="#555">→ SELECT（含聚合）</text>
  <text x="30" y="232" font-size="9" fill="#555">→ ORDER BY</text>

  <!-- 底部说明 -->
  <rect x="20" y="360" width="600" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="40" y="382" font-size="10.5" fill="#333">FROM 读取含方向的通话记录 → SELECT 用 LEAST/GREATEST 把 (from,to) 归一化为 (p1&lt;p2)</text>
  <text x="40" y="400" font-size="10.5" fill="#333">GROUP BY 按归一化配对折叠 → COUNT(1) 数次数、SUM(duration) 累加时长</text>
</svg>
