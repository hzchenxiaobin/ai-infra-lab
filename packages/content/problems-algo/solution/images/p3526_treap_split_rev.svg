<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">区间操作全景：split 切三段 → 动中段 → merge 拼回</text>

  <!-- 原数组 -->
  <text x="260" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">查询 [3, 1, 3]：翻转 nums[1..3]（橙色段）</text>
  <rect x="167" y="54" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="184" y="73" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="205" y="54" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="222" y="73" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="243" y="54" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="73" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="281" y="54" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="298" y="73" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="319" y="54" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="336" y="73" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <text x="184" y="97" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="222" y="97" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="260" y="97" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="298" y="97" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">3</text>
  <text x="336" y="97" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">4</text>

  <!-- split 箭头 -->
  <path d="M 260 102 L 260 124" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="117" font-size="10" fill="#446688" filter="url(#rough2)">split 两刀 → 三段</text>

  <!-- 三段块 -->
  <rect x="55" y="130" width="80" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="147" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">A = [1]</text>
  <text x="95" y="163" text-anchor="middle" font-size="9.5" fill="#667" filter="url(#rough2)">sz = 1</text>

  <rect x="160" y="130" width="200" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="147" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">B = [2, 3, 4]</text>
  <text x="260" y="163" text-anchor="middle" font-size="9.5" fill="#8a6d3a" filter="url(#rough2)">sz = 3　xr = 2⊕3⊕4 = 5</text>

  <rect x="390" y="130" width="80" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="147" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">C = [5]</text>
  <text x="430" y="163" text-anchor="middle" font-size="9.5" fill="#667" filter="url(#rough2)">sz = 1</text>

  <!-- rev 标记 -->
  <path d="M 260 172 L 260 178" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="222" y="180" width="76" height="22" rx="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">rev ^= 1</text>

  <!-- push_down 演示 -->
  <text x="260" y="222" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">懒标记生效（下次 split / merge 路过时 push_down）：只交换左右子树</text>

  <line x1="150" y1="252" x2="119" y2="278" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="150" y1="252" x2="181" y2="278" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="150" cy="248" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="118" cy="282" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="118" y="286" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="182" cy="282" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="182" y="286" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="150" y="311" text-anchor="middle" font-size="9.5" fill="#667" filter="url(#rough2)">中序 = 2, 3, 4</text>

  <path d="M 214 262 L 258 262" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="236" y="254" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">push_down</text>
  <text x="236" y="276" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">标记传给子孙</text>

  <line x1="350" y1="252" x2="319" y2="278" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="350" y1="252" x2="381" y2="278" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="350" cy="248" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="318" cy="282" r="13" fill="#fff8e1" stroke="#b85450" stroke-width="2" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="318" y="286" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="318" y="306" text-anchor="middle" font-size="8" font-weight="bold" fill="#b85450" filter="url(#rough2)">rev</text>
  <circle cx="382" cy="282" r="13" fill="#fff8e1" stroke="#b85450" stroke-width="2" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="382" y="286" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="382" y="306" text-anchor="middle" font-size="8" font-weight="bold" fill="#b85450" filter="url(#rough2)">rev</text>
  <text x="350" y="311" text-anchor="middle" font-size="9.5" fill="#8a6d3a" filter="url(#rough2)">中序 = 4, 3, 2</text>

  <!-- 关键洞察 -->
  <rect x="40" y="318" width="440" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">⊕ 满足交换律 ⇒ 子树异或和 xr 翻转前后不变（仍是 5）</text>
  <text x="260" y="354" text-anchor="middle" font-size="10.5" fill="#2a5a2a" filter="url(#rough2)">rev 只改结构（交换左右子树）；merge 拼回 → [1, 4, 3, 2, 5]</text>
</svg>
