<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2e6e2e"/>
    </marker>
  </defs>
  <rect width="920" height="680" fill="#fdfcf7"/>

  <text x="460" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：零节点逐个被改写为段和</text>
  <path d="M 260 40 Q 460 48 660 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ 示例 1 ============ -->
  <text x="40" y="72" font-size="14" font-weight="bold" fill="#2b6e9e">示例 1：head = [0,3,1,0,4,5,2,0]</text>

  <!-- 初始状态 -->
  <text x="40" y="98" font-size="11" fill="#666">初始：tail = 第1个0（head），cur = 3，sum = 0</text>

  <g filter="url(#sk)"><rect x="40" y="110" width="50" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="65" y="132" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
  <g filter="url(#sk)"><rect x="110" y="110" width="50" height="34" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="135" y="132" text-anchor="middle" font-size="13" fill="#444">3</text>
  <g filter="url(#sk)"><rect x="180" y="110" width="50" height="34" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="205" y="132" text-anchor="middle" font-size="13" fill="#444">1</text>
  <g filter="url(#sk)"><rect x="250" y="110" width="50" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="275" y="132" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
  <g filter="url(#sk)"><rect x="320" y="110" width="50" height="34" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="345" y="132" text-anchor="middle" font-size="13" fill="#444">4</text>
  <g filter="url(#sk)"><rect x="390" y="110" width="50" height="34" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="415" y="132" text-anchor="middle" font-size="13" fill="#444">5</text>
  <g filter="url(#sk)"><rect x="460" y="110" width="50" height="34" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="485" y="132" text-anchor="middle" font-size="13" fill="#444">2</text>
  <g filter="url(#sk)"><rect x="530" y="110" width="50" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="555" y="132" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
  <text x="600" y="132" font-size="11" fill="#888">→ null</text>

  <path d="M 90 127 L 106 127" stroke="#5a5a5a" stroke-width="1.1" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 160 127 L 176 127" stroke="#5a5a5a" stroke-width="1.1" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 230 127 L 246 127" stroke="#5a5a5a" stroke-width="1.1" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 300 127 L 316 127" stroke="#5a5a5a" stroke-width="1.1" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 370 127 L 386 127" stroke="#5a5a5a" stroke-width="1.1" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 440 127 L 456 127" stroke="#5a5a5a" stroke-width="1.1" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 510 127 L 526 127" stroke="#5a5a5a" stroke-width="1.1" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="65" y="158" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">tail</text>
  <text x="135" y="158" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">cur</text>

  <!-- 第一段结算 -->
  <text x="40" y="186" font-size="11" fill="#666">扫 3,1 → sum=4；撞第2个0 → tail.val=4，tail 跳到第2个0</text>

  <g filter="url(#sk)"><rect x="40" y="198" width="50" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="65" y="220" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">4</text>
  <g filter="url(#sk)"><rect x="110" y="198" width="50" height="34" rx="4" fill="#eee" stroke="#ccc" stroke-width="1" stroke-dasharray="3 2"/></g>
  <text x="135" y="220" text-anchor="middle" font-size="12" fill="#aaa">3</text>
  <g filter="url(#sk)"><rect x="180" y="198" width="50" height="34" rx="4" fill="#eee" stroke="#ccc" stroke-width="1" stroke-dasharray="3 2"/></g>
  <text x="205" y="220" text-anchor="middle" font-size="12" fill="#aaa">1</text>
  <g filter="url(#sk)"><rect x="250" y="198" width="50" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="275" y="220" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
  <g filter="url(#sk)"><rect x="320" y="198" width="50" height="34" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="345" y="220" text-anchor="middle" font-size="13" fill="#444">4</text>
  <g filter="url(#sk)"><rect x="390" y="198" width="50" height="34" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="415" y="220" text-anchor="middle" font-size="13" fill="#444">5</text>
  <g filter="url(#sk)"><rect x="460" y="198" width="50" height="34" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="485" y="220" text-anchor="middle" font-size="13" fill="#444">2</text>
  <g filter="url(#sk)"><rect x="530" y="198" width="50" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="555" y="220" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>

  <path d="M 90 215 L 106 215" stroke="#5a5a5a" stroke-width="1.1" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 160 215 L 176 215" stroke="#ccc" stroke-width="1" fill="none" stroke-dasharray="3 2" filter="url(#sk)"/>
  <path d="M 230 215 L 246 215" stroke="#ccc" stroke-width="1" fill="none" stroke-dasharray="3 2" filter="url(#sk)"/>
  <path d="M 90 215 Q 170 200 246 215" stroke="#4a8e4a" stroke-width="1.6" fill="none" stroke-dasharray="4 2" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="170" y="196" text-anchor="middle" font-size="9" fill="#2e6e2e">串联</text>

  <text x="65" y="246" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">已填=4</text>
  <text x="275" y="246" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">tail</text>
  <text x="345" y="246" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">cur</text>

  <!-- 第二段结算 -->
  <text x="40" y="274" font-size="11" fill="#666">扫 4,5,2 → sum=11；撞末尾0 → tail.val=11，cur.next=null → tail.next=null 切断</text>

  <g filter="url(#sk)"><rect x="40" y="286" width="50" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="65" y="308" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">4</text>
  <g filter="url(#sk)"><rect x="110" y="286" width="50" height="34" rx="4" fill="#eee" stroke="#ccc" stroke-width="1" stroke-dasharray="3 2"/></g>
  <text x="135" y="308" text-anchor="middle" font-size="12" fill="#aaa">3</text>
  <g filter="url(#sk)"><rect x="180" y="286" width="50" height="34" rx="4" fill="#eee" stroke="#ccc" stroke-width="1" stroke-dasharray="3 2"/></g>
  <text x="205" y="308" text-anchor="middle" font-size="12" fill="#aaa">1</text>
  <g filter="url(#sk)"><rect x="250" y="286" width="50" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="275" y="308" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">11</text>
  <g filter="url(#sk)"><rect x="320" y="286" width="50" height="34" rx="4" fill="#eee" stroke="#ccc" stroke-width="1" stroke-dasharray="3 2"/></g>
  <text x="345" y="308" text-anchor="middle" font-size="12" fill="#aaa">4</text>
  <g filter="url(#sk)"><rect x="390" y="286" width="50" height="34" rx="4" fill="#eee" stroke="#ccc" stroke-width="1" stroke-dasharray="3 2"/></g>
  <text x="415" y="308" text-anchor="middle" font-size="12" fill="#aaa">5</text>
  <g filter="url(#sk)"><rect x="460" y="286" width="50" height="34" rx="4" fill="#eee" stroke="#ccc" stroke-width="1" stroke-dasharray="3 2"/></g>
  <text x="485" y="308" text-anchor="middle" font-size="12" fill="#aaa">2</text>
  <g filter="url(#sk)"><rect x="530" y="286" width="50" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.55"/></g>
  <text x="555" y="308" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>

  <path d="M 90 303 L 106 303" stroke="#5a5a5a" stroke-width="1.1" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 300 303 L 316 303" stroke="#5a5a5a" stroke-width="1.1" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="595" y="308" font-size="10" fill="#b85450" font-weight="bold">丢弃</text>

  <text x="65" y="334" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">结果节点</text>
  <text x="275" y="334" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">结果节点</text>

  <g filter="url(#sk)"><rect x="40" y="350" width="280" height="32" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="180" y="370" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">结果 = [4, 11] ✓</text>

  <!-- 分隔线 -->
  <path d="M 60 396 Q 460 404 860 396" stroke="#ddd" stroke-width="1" fill="none" filter="url(#sk)"/>

  <!-- ============ 示例 2 ============ -->
  <text x="40" y="424" font-size="14" font-weight="bold" fill="#2b6e9e">示例 2：head = [0,1,0,3,0,2,2,0]</text>
  <text x="40" y="446" font-size="11" fill="#666">三段：①1 ②3 ③2+2=4，三个零节点分别改写为 1、3、4，末尾零丢弃</text>

  <!-- 原链表 -->
  <g filter="url(#sk)"><rect x="40" y="460" width="50" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="65" y="482" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
  <g filter="url(#sk)"><rect x="110" y="460" width="50" height="34" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="135" y="482" text-anchor="middle" font-size="13" fill="#444">1</text>
  <g filter="url(#sk)"><rect x="180" y="460" width="50" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="205" y="482" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
  <g filter="url(#sk)"><rect x="250" y="460" width="50" height="34" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="275" y="482" text-anchor="middle" font-size="13" fill="#444">3</text>
  <g filter="url(#sk)"><rect x="320" y="460" width="50" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="345" y="482" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
  <g filter="url(#sk)"><rect x="390" y="460" width="50" height="34" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="415" y="482" text-anchor="middle" font-size="13" fill="#444">2</text>
  <g filter="url(#sk)"><rect x="460" y="460" width="50" height="34" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="485" y="482" text-anchor="middle" font-size="13" fill="#444">2</text>
  <g filter="url(#sk)"><rect x="530" y="460" width="50" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="555" y="482" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>

  <path d="M 90 477 L 106 477" stroke="#5a5a5a" stroke-width="1.1" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 160 477 L 176 477" stroke="#5a5a5a" stroke-width="1.1" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 230 477 L 246 477" stroke="#5a5a5a" stroke-width="1.1" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 300 477 L 316 477" stroke="#5a5a5a" stroke-width="1.1" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 370 477 L 386 477" stroke="#5a5a5a" stroke-width="1.1" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 440 477 L 456 477" stroke="#5a5a5a" stroke-width="1.1" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 510 477 L 526 477" stroke="#5a5a5a" stroke-width="1.1" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 段标注 -->
  <text x="135" y="510" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">段①=1</text>
  <text x="275" y="510" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">段②=3</text>
  <text x="425" y="510" text-anchor="middle" font-size="10" fill="#2b6e9e" font-weight="bold">段③=4</text>

  <!-- 复用箭头：三个零节点 → 结果 -->
  <path d="M 65 494 Q 50 540 100 565" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4 2" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 205 494 Q 220 540 240 565" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4 2" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 345 494 Q 360 540 380 565" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4 2" marker-end="url(#arR)" filter="url(#sk)"/>

  <text x="30" y="538" font-size="10" fill="#b85450" font-weight="bold">填 1</text>
  <text x="208" y="538" font-size="10" fill="#b85450" font-weight="bold">填 3</text>
  <text x="348" y="538" font-size="10" fill="#b85450" font-weight="bold">填 4</text>

  <!-- 结果链表 -->
  <g filter="url(#sk)"><rect x="90" y="568" width="50" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="115" y="590" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">1</text>
  <g filter="url(#sk)"><rect x="230" y="568" width="50" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="255" y="590" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">3</text>
  <g filter="url(#sk)"><rect x="370" y="568" width="50" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="395" y="590" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">4</text>
  <text x="440" y="590" font-size="11" fill="#888">→ null</text>

  <path d="M 140 585 L 226 585" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 280 585 L 366 585" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="115" y="616" text-anchor="middle" font-size="10" fill="#888">原第1个0</text>
  <text x="255" y="616" text-anchor="middle" font-size="10" fill="#888">原第2个0</text>
  <text x="395" y="616" text-anchor="middle" font-size="10" fill="#888">原第3个0</text>

  <g filter="url(#sk)"><rect x="490" y="568" width="50" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.55"/></g>
  <text x="515" y="590" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
  <text x="555" y="590" font-size="10" fill="#b85450" font-weight="bold">末尾零丢弃</text>

  <g filter="url(#sk)"><rect x="40" y="636" width="840" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="460" y="656" text-anchor="middle" font-size="11" fill="#7a5415">关键：结果链表的节点全部来自原链表的零节点（首段用 head，末尾零被切断丢弃），零额外分配</text>
</svg>
