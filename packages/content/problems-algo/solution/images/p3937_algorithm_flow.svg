<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：奇偶分组 → 环形距离累加代价表 → 枚举 x≠y</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">两遍预处理是主体，枚举配对只是临门一脚</text>

  <rect x="96" y="52" width="308" height="50" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="73" text-anchor="middle" font-size="12" fill="#33507a" font-weight="bold" filter="url(#rough2)">① 按下标奇偶分组</text>
  <text x="250" y="92" text-anchor="middle" font-size="10" fill="#556" filter="url(#rough2)">偶数位归 evenCost，奇数位归 oddCost（同组共享一个目标余数）</text>

  <rect x="330" y="58" width="24" height="18" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="358" y="58" width="24" height="18" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>

  <path d="M 244 103 C 242 110, 252 110, 250 117" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="96" y="120" width="308" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="140" text-anchor="middle" font-size="12" fill="#33507a" font-weight="bold" filter="url(#rough2)">② 预处理两张代价表（长度 k）</text>
  <text x="250" y="158" text-anchor="middle" font-size="10" fill="#556" filter="url(#rough2)">每个元素：r = v mod k，再对每个目标 t 累加</text>
  <text x="250" y="173" text-anchor="middle" font-size="10.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">cost[t] += min( |r − t| , k − |r − t| )</text>

  <text x="424" y="153" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">O(n·k)</text>
  <path d="M 406 148 L 412 149" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>

  <path d="M 258 179 C 260 186, 248 186, 250 193" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="96" y="196" width="308" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="216" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">③ 枚举所有 x ≠ y 的组合</text>
  <text x="250" y="234" text-anchor="middle" font-size="10.5" fill="#556" filter="url(#rough2)">ans = min( ans, evenCost[x] + oddCost[y] )</text>
  <text x="250" y="250" text-anchor="middle" font-size="10" fill="#556" filter="url(#rough2)">共 k(k−1) 对，k ≤ 100 ⟹ 至多 9900 对</text>

  <text x="424" y="229" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">O(k²)</text>
  <path d="M 406 224 L 412 225" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>

  <path d="M 244 255 C 242 262, 252 262, 250 269" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="96" y="272" width="308" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="292" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">④ 返回 ans</text>
  <text x="250" y="310" text-anchor="middle" font-size="10" fill="#7a5c1a" filter="url(#rough2)">k ≥ 2 ⟹ 合法对 (x, y) 必存在，ans 必被更新，无需哨兵</text>

  <rect x="30" y="330" width="460" height="22" rx="8" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="260" y="345" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">时间 O(n·k + k²)，n = k = 100 时约 2×10⁴ 次运算 ｜ 空间 O(k)（两张代价表）</text>
</svg>
