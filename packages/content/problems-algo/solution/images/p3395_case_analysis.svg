<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 452"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="452" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">固定中间元素 v（第 3 格）后，按 v 在 5 个数中的总出现次数 c 分类</text>

  <!-- Row 1: c=5 -->
  <g filter="url(#rough2)">
    <text x="40" y="66" text-anchor="middle" font-size="13" fill="#446688">c = 5</text>
    <rect x="76" y="46" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="120" y="46" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="164" y="46" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="208" y="46" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="252" y="46" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="95" y="68" text-anchor="middle" font-size="14" fill="#333">v</text>
    <text x="139" y="68" text-anchor="middle" font-size="14" fill="#333">v</text>
    <text x="183" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1a">v</text>
    <text x="227" y="68" text-anchor="middle" font-size="14" fill="#333">v</text>
    <text x="271" y="68" text-anchor="middle" font-size="14" fill="#333">v</text>
    <text x="306" y="68" font-size="13" fill="#4a7a3a">全是 v ✓</text>
  </g>

  <!-- Row 2: c=4 -->
  <g filter="url(#rough2)">
    <text x="40" y="124" text-anchor="middle" font-size="13" fill="#446688">c = 4</text>
    <rect x="76" y="104" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="120" y="104" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="164" y="104" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="208" y="104" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="252" y="104" width="38" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <text x="95" y="126" text-anchor="middle" font-size="14" fill="#333">v</text>
    <text x="139" y="126" text-anchor="middle" font-size="14" fill="#333">v</text>
    <text x="183" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1a">v</text>
    <text x="227" y="126" text-anchor="middle" font-size="14" fill="#333">v</text>
    <text x="271" y="126" text-anchor="middle" font-size="14" fill="#888">x</text>
    <text x="306" y="126" font-size="13" fill="#4a7a3a">异类仅 1 次 &lt; 4 ✓</text>
  </g>

  <!-- Row 3: c=3 -->
  <g filter="url(#rough2)">
    <text x="40" y="182" text-anchor="middle" font-size="13" fill="#446688">c = 3</text>
    <rect x="76" y="162" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="120" y="162" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="164" y="162" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="208" y="162" width="38" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="252" y="162" width="38" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <text x="95" y="184" text-anchor="middle" font-size="14" fill="#333">v</text>
    <text x="139" y="184" text-anchor="middle" font-size="14" fill="#333">v</text>
    <text x="183" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1a">v</text>
    <text x="227" y="184" text-anchor="middle" font-size="14" fill="#888">x</text>
    <text x="271" y="184" text-anchor="middle" font-size="14" fill="#888">x</text>
    <text x="306" y="184" font-size="13" fill="#4a7a3a">异类至多 2 次 &lt; 3 ✓</text>
  </g>

  <!-- Row 4: c=2 good -->
  <g filter="url(#rough2)">
    <text x="40" y="240" text-anchor="middle" font-size="13" fill="#446688">c = 2</text>
    <rect x="76" y="220" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="120" y="220" width="38" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="164" y="220" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="208" y="220" width="38" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="252" y="220" width="38" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <text x="95" y="242" text-anchor="middle" font-size="14" fill="#333">v</text>
    <text x="139" y="242" text-anchor="middle" font-size="14" fill="#888">x</text>
    <text x="183" y="242" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1a">v</text>
    <text x="227" y="242" text-anchor="middle" font-size="14" fill="#888">y</text>
    <text x="271" y="242" text-anchor="middle" font-size="14" fill="#888">z</text>
    <text x="306" y="242" font-size="13" fill="#4a7a3a">x、y、z 两两不同 ✓</text>
  </g>

  <!-- Row 5: c=2 bad -->
  <g filter="url(#rough2)">
    <text x="40" y="298" text-anchor="middle" font-size="13" fill="#b85450">c = 2</text>
    <rect x="76" y="278" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="120" y="278" width="38" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="164" y="278" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="208" y="278" width="38" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="252" y="278" width="38" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <text x="95" y="300" text-anchor="middle" font-size="14" fill="#333">v</text>
    <text x="139" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">x</text>
    <text x="183" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1a">v</text>
    <text x="227" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">x</text>
    <text x="271" y="300" text-anchor="middle" font-size="14" fill="#888">y</text>
    <text x="306" y="300" font-size="13" fill="#b85450">x 也 2 次，与 v 平票 ✗</text>
  </g>

  <!-- Row 6: c=1 -->
  <g filter="url(#rough2)">
    <text x="40" y="356" text-anchor="middle" font-size="13" fill="#b85450">c = 1</text>
    <rect x="76" y="336" width="38" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="120" y="336" width="38" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="164" y="336" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="208" y="336" width="38" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="252" y="336" width="38" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <text x="95" y="358" text-anchor="middle" font-size="14" fill="#888">x</text>
    <text x="139" y="358" text-anchor="middle" font-size="14" fill="#888">y</text>
    <text x="183" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1a">v</text>
    <text x="227" y="358" text-anchor="middle" font-size="14" fill="#888">z</text>
    <text x="271" y="358" text-anchor="middle" font-size="14" fill="#888">w</text>
    <text x="306" y="358" font-size="13" fill="#b85450">异类各 ≥ 1 次 ≥ v ✗</text>
  </g>

  <!-- conclusion box -->
  <g filter="url(#rough2)">
    <rect x="42" y="386" width="476" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="280" y="408" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d4d22">c ≥ 3 恒合法、c = 1 恒非法，只有 c = 2 需要细算</text>
    <text x="280" y="428" text-anchor="middle" font-size="12" fill="#4a7a3a">计数 = 全部 − 两侧都不选 v −「坏的 c = 2」方案</text>
  </g>
</svg>
