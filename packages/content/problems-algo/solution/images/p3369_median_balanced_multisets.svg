<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">中位数：对半多重集合 low / high</text>

  <!-- 不变式框 -->
  <rect x="60" y="38" width="400" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="56" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">不变式：|low| = |high| 或 |high| + 1，且 max(low) ≤ min(high)</text>
  <text x="260" y="73" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">n 奇 → max(low)；n 偶 → ( max(low) + min(high) ) / 2</text>

  <!-- 表头 -->
  <text x="70" y="108" font-size="11" fill="#666" filter="url(#rough2)">操作</text>
  <text x="150" y="108" font-size="11" fill="#666" filter="url(#rough2)">low（较小一半）</text>
  <text x="330" y="108" font-size="11" fill="#666" filter="url(#rough2)">high（较大一半）</text>

  <!-- 行 1: add 4 -->
  <text x="70" y="136" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">add 4</text>
  <rect x="140" y="120" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="137" text-anchor="middle" font-size="11.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="330" y="120" width="70" height="24" fill="#f4f4f4" stroke="#999" stroke-width="1" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="365" y="137" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">空</text>

  <!-- 行 2: add 4 -->
  <text x="70" y="172" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">add 4</text>
  <rect x="140" y="156" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="173" text-anchor="middle" font-size="11.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="330" y="156" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="347" y="173" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <path d="M 178 168 C 250 168, 270 168, 326 168" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="252" y="160" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">|low| 超了 → 挪最大</text>

  <!-- 行 3: add 2 -->
  <text x="70" y="208" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">add 2</text>
  <rect x="140" y="192" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="209" text-anchor="middle" font-size="11.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="178" y="192" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="209" text-anchor="middle" font-size="11.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="330" y="192" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="347" y="209" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- 行 4: add 3 -->
  <text x="70" y="244" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">add 3</text>
  <rect x="140" y="228" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="245" text-anchor="middle" font-size="11.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="178" y="228" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="245" text-anchor="middle" font-size="11.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="330" y="228" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="347" y="245" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="370" y="228" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="387" y="245" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <path d="M 216 236 C 260 236, 290 236, 326 236" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="272" y="228" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">再挪一个 4</text>

  <!-- getMedian 高亮 -->
  <rect x="60" y="262" width="400" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="284" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">getMedian：n = 4 偶 → (3 + 4) / 2 = 3</text>

  <!-- 行 5: remove 4 -->
  <text x="70" y="322" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">remove 4</text>
  <text x="70" y="336" font-size="9" fill="#999" filter="url(#rough2)">（弹队头）</text>
  <rect x="140" y="306" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="323" text-anchor="middle" font-size="11.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="178" y="306" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="323" text-anchor="middle" font-size="11.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="330" y="306" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="347" y="323" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <path d="M 330 298 C 310 290, 290 292, 276 298" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="284" y="288" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">v 在 high → 删 high</text>

  <!-- 底部要点 -->
  <rect x="40" y="348" width="440" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="370" text-anchor="middle" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">rebalance：low 多过 high+1 → 挪 max(low) 去右；high 多过 low → 挪 min(high) 回左</text>
  <text x="260" y="392" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">每次 add / remove 至多挪 1 个元素，两边始终「对半」——查询 O(1) 读两端</text>
</svg>
