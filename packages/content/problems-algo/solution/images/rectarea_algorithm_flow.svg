<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：O(1) 容斥求两矩形覆盖面积</text>

  <!-- Step 1: compute A area -->
  <rect x="180" y="46" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333">① 算 A 面积</text>
  <text x="280" y="82" text-anchor="middle" font-size="11" fill="#446688">areaA = (ax2−ax1) × (ay2−ay1)</text>

  <line x1="280" y1="90" x2="280" y2="108" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: compute B area -->
  <rect x="180" y="110" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="12" fill="#333">② 算 B 面积</text>
  <text x="280" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a">areaB = (bx2−bx1) × (by2−by1)</text>

  <line x1="280" y1="154" x2="280" y2="172" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: overlap width -->
  <rect x="130" y="174" width="300" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="194" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 重叠宽 w（x 方向区间交集）</text>
  <text x="280" y="214" text-anchor="middle" font-size="11" fill="#d6a040">w = max(0, min(ax2,bx2) − max(ax1,bx1))</text>

  <line x1="280" y1="224" x2="280" y2="242" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: overlap height -->
  <rect x="130" y="244" width="300" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ 重叠高 h（y 方向区间交集）</text>
  <text x="280" y="284" text-anchor="middle" font-size="11" fill="#d6a040">h = max(0, min(ay2,by2) − max(ay1,by1))</text>

  <line x1="280" y1="294" x2="280" y2="312" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: overlap area -->
  <rect x="180" y="314" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="339" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⑤ overlap = w × h</text>

  <line x1="280" y1="354" x2="280" y2="372" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6: return -->
  <rect x="160" y="374" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="394" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⑥ 返回 areaA + areaB − overlap</text>
  <text x="280" y="410" text-anchor="middle" font-size="10" fill="#888">用 long long 防溢出（坐标可达 ±10^5）</text>

  <!-- Side note on max(0, ...) -->
  <rect x="440" y="180" width="110" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="495" y="200" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">为何 max(0,·)?</text>
  <text x="448" y="218" font-size="9" fill="#555">不相交时</text>
  <text x="448" y="232" font-size="9" fill="#555">min(右)−max(左)</text>
  <text x="448" y="246" font-size="9" fill="#555">为负数。</text>
  <text x="448" y="262" font-size="9" fill="#b85450" font-weight="bold">取 0 → 面积 0</text>
  <text x="448" y="274" font-size="9" fill="#888">统一相交/相离</text>
</svg>
