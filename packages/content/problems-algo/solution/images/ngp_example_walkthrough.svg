<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,2,3,1,1,3]</text>

  <!-- ===== Header row ===== -->
  <rect x="40" y="44" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="61" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>

  <rect x="80" y="44" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105" y="61" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums[i]</text>

  <rect x="130" y="44" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="58" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">新增对数</text>
  <text x="180" y="68" text-anchor="middle" font-size="8" fill="#888">=count[值]遍历前</text>

  <rect x="230" y="44" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans</text>

  <rect x="290" y="44" width="240" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="410" y="61" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">count 状态（值→次数）</text>

  <!-- ===== Row i=0 ===== -->
  <rect x="40" y="72" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="90" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="80" y="72" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="105" y="90" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="130" y="72" width="100" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="90" text-anchor="middle" font-size="11" fill="#888">0</text>
  <rect x="230" y="72" width="60" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="260" y="90" text-anchor="middle" font-size="11" fill="#888">0</text>
  <rect x="290" y="72" width="240" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="410" y="90" text-anchor="middle" font-size="11" fill="#333">{1:1}</text>

  <!-- ===== Row i=1 ===== -->
  <rect x="40" y="102" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="120" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="80" y="102" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="105" y="120" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="130" y="102" width="100" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="120" text-anchor="middle" font-size="11" fill="#888">0</text>
  <rect x="230" y="102" width="60" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="260" y="120" text-anchor="middle" font-size="11" fill="#888">0</text>
  <rect x="290" y="102" width="240" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="410" y="120" text-anchor="middle" font-size="11" fill="#333">{1:1, 2:1}</text>

  <!-- ===== Row i=2 ===== -->
  <rect x="40" y="132" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="150" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="80" y="132" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="105" y="150" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="130" y="132" width="100" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="150" text-anchor="middle" font-size="11" fill="#888">0</text>
  <rect x="230" y="132" width="60" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="260" y="150" text-anchor="middle" font-size="11" fill="#888">0</text>
  <rect x="290" y="132" width="240" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="410" y="150" text-anchor="middle" font-size="11" fill="#333">{1:1, 2:1, 3:1}</text>

  <!-- ===== Row i=3 (first hit) ===== -->
  <rect x="40" y="162" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="180" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="80" y="162" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="105" y="180" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="130" y="162" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="180" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="230" y="162" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="260" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="290" y="162" width="240" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="410" y="180" text-anchor="middle" font-size="11" fill="#333">{1:2, 2:1, 3:1}</text>

  <!-- ===== Row i=4 ===== -->
  <rect x="40" y="192" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="80" y="192" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="105" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="130" y="192" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="180" y="210" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="230" y="192" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="260" y="210" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="290" y="192" width="240" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="410" y="210" text-anchor="middle" font-size="11" fill="#333">{1:3, 2:1, 3:1}</text>

  <!-- ===== Row i=5 ===== -->
  <rect x="40" y="222" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="240" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="80" y="222" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="105" y="240" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="130" y="222" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="180" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="230" y="222" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="290" y="222" width="240" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="410" y="240" text-anchor="middle" font-size="11" fill="#333">{1:3, 2:1, 3:2}</text>

  <!-- ===== Result ===== -->
  <rect x="120" y="270" width="320" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">新增对数 0+0+0+1+2+1 = 4</text>
  <text x="280" y="308" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">→ ans = 4 ⭐</text>
</svg>
