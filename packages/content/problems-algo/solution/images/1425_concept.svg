<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：dp[i] 依赖窗口 [i−k, i−1] 内 dp 最大值 → 单调队列 O(1)</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">dp[i] = nums[i] + max(0, max{dp[j] : i−k ≤ j ≤ i−1})，max(0,·) 处理"另起一段"</text>

  <!-- ===== DP recurrence formula box ===== -->
  <rect x="40" y="58" width="540" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="79" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">dp[i] = nums[i] + max(0, 窗口 [i−k, i−1] 内 dp 的最大值)</text>

  <!-- ===== Example: computing dp[4], k=2 ===== -->
  <text x="40" y="110" font-size="11" fill="#446688" font-weight="bold">示例：nums = [10, 2, −10, 5, 20], k = 2，计算 dp[4]</text>

  <!-- index labels -->
  <g font-size="9" fill="#888">
    <text x="94" y="130" text-anchor="middle">i=0</text>
    <text x="146" y="130" text-anchor="middle">1</text>
    <text x="198" y="130" text-anchor="middle">2</text>
    <text x="250" y="130" text-anchor="middle">3</text>
    <text x="302" y="130" text-anchor="middle">4</text>
  </g>

  <!-- nums row -->
  <text x="50" y="153" font-size="10" fill="#555">nums:</text>
  <g font-size="12" fill="#333">
    <rect x="70" y="134" width="48" height="28" rx="4" fill="#f6f6f6" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="94" y="153" text-anchor="middle">10</text>
    <rect x="122" y="134" width="48" height="28" rx="4" fill="#f6f6f6" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="146" y="153" text-anchor="middle">2</text>
    <rect x="174" y="134" width="48" height="28" rx="4" fill="#f6f6f6" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="198" y="153" text-anchor="middle">−10</text>
    <rect x="226" y="134" width="48" height="28" rx="4" fill="#f6f6f6" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="250" y="153" text-anchor="middle">5</text>
    <rect x="278" y="134" width="48" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="302" y="153" text-anchor="middle" fill="#446688" font-weight="bold">20</text>
  </g>

  <!-- dp row -->
  <text x="50" y="197" font-size="10" fill="#555">dp:</text>
  <g font-size="12">
    <rect x="70" y="178" width="48" height="28" rx="4" fill="#fff" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
    <text x="94" y="197" text-anchor="middle" fill="#888">10</text>
    <rect x="122" y="178" width="48" height="28" rx="4" fill="#fff" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
    <text x="146" y="197" text-anchor="middle" fill="#888">12</text>
    <!-- window cells highlighted -->
    <rect x="174" y="178" width="48" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="198" y="197" text-anchor="middle" fill="#d6a040">2</text>
    <rect x="226" y="178" width="48" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="250" y="197" text-anchor="middle" fill="#b85450" font-weight="bold">17</text>
    <!-- dp[4] being computed -->
    <rect x="278" y="178" width="48" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="302" y="197" text-anchor="middle" fill="#4a7a3a" font-weight="bold">37</text>
  </g>

  <!-- window bracket for [2,3] -->
  <path d="M 172 212 L 172 218 L 276 218 L 276 212" stroke="#d6a040" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="224" y="230" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">窗口 [i−k, i−1] = [2, 3]</text>

  <!-- computation arrow -->
  <text x="348" y="186" font-size="11" fill="#555">dp[4] = nums[4] + max(0, dp[2], dp[3])</text>
  <text x="348" y="202" font-size="11" fill="#555">      = 20 + max(0, 2, 17)</text>
  <text x="348" y="218" font-size="11" fill="#b85450" font-weight="bold">      = 20 + 17 = 37 ✓</text>

  <!-- ===== Monotonic deque ===== -->
  <text x="40" y="262" font-size="11" fill="#d6a040" font-weight="bold">单调队列（存下标，dp 值单调递减）维护窗口内 dp 最大值</text>

  <!-- deque cells: [3] dp=17 (when computing dp[4], after expire) -->
  <rect x="70" y="276" width="84" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="112" y="298" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">[3]=17</text>
  <text x="70" y="272" font-size="8" fill="#b85450" font-weight="bold">队头 ← 窗口最大</text>

  <text x="166" y="290" font-size="10" fill="#555">计算 dp[4] 时，队头</text>
  <text x="166" y="304" font-size="10" fill="#555">dp[3]=17 即窗口最大</text>

  <!-- operations -->
  <rect x="40" y="324" width="270" height="50" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="54" y="342" font-size="10" fill="#d6a040" font-weight="bold">两个操作（均摊 O(1)）</text>
  <text x="54" y="358" font-size="10" fill="#555">① <tspan fill="#b85450" font-weight="bold">左端过期出队</tspan>：队头下标 &lt; i−k 则弹出</text>
  <text x="54" y="370" font-size="10" fill="#555">② <tspan fill="#4a7a3a" font-weight="bold">右端弹尾保单调</tspan>：dp[队尾] ≤ dp[i] 则弹出</text>

  <!-- max(0,...) note -->
  <rect x="320" y="324" width="260" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="334" y="342" font-size="10" fill="#4a7a3a" font-weight="bold">max(0, ·) 的含义</text>
  <text x="334" y="358" font-size="10" fill="#555">前驱 dp 全为负 → 不接，从 nums[i] 另起一段</text>
  <text x="334" y="370" font-size="10" fill="#555">保证子序列非空，答案 = max(dp[i])</text>

  <!-- ===== Key insight box ===== -->
  <rect x="40" y="386" width="540" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="406" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">关键：dp 转移 = "窗口内 dp 最大值" + nums[i] → 单调队列把 O(nk) 降为 O(n)</text>
  <text x="310" y="422" text-anchor="middle" font-size="10" fill="#555">与 239 滑动窗口最大值同构——那里维护 nums 的窗口 max，这里维护 dp 的窗口 max</text>
</svg>
