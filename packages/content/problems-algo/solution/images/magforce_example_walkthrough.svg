<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：position = [1,2,3,4,7], m = 3</text>
  <text x="280" y="40" text-anchor="middle" font-size="11" fill="#888">排序后 span = 7−1 = 6，hi = 6/(3−1) = 3，答案区间 [1, 3]</text>

  <!-- ===== Table ===== -->
  <!-- Header row -->
  <rect x="20" y="52" width="520" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="70" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">轮次</text>
  <text x="110" y="70" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">lo~hi</text>
  <text x="165" y="70" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">mid</text>
  <text x="290" y="70" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">check(mid): 贪心放置</text>
  <text x="400" y="70" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">count</text>
  <text x="445" y="70" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">≥m?</text>
  <text x="505" y="70" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">动作</text>

  <!-- Row 1: mid=2 -->
  <rect x="20" y="80" width="520" height="30" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="50" y="100" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="110" y="100" text-anchor="middle" font-size="11" fill="#333">1~3</text>
  <text x="165" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="290" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a">1 → 3 → 7</text>
  <text x="400" y="100" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="445" y="100" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="505" y="100" text-anchor="middle" font-size="10" fill="#555">ans=2,lo=3</text>

  <!-- Row 2: mid=3 (highlighted) -->
  <rect x="20" y="112" width="520" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="132" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="110" y="132" text-anchor="middle" font-size="11" fill="#333">3~3</text>
  <text x="165" y="132" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="290" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1 → 4 → 7</text>
  <text x="400" y="132" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="445" y="132" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="505" y="132" text-anchor="middle" font-size="10" fill="#555">ans=3,lo=4</text>

  <!-- Row 3: loop ends -->
  <rect x="20" y="144" width="520" height="30" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="50" y="164" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="110" y="164" text-anchor="middle" font-size="11" fill="#888">4&gt;3</text>
  <text x="165" y="164" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="290" y="164" text-anchor="middle" font-size="11" fill="#888">lo &gt; hi，循环结束</text>
  <text x="400" y="164" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="445" y="164" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="505" y="164" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">返回 3</text>

  <!-- ===== Bottom: visual of check(3) ===== -->
  <text x="40" y="200" font-size="12" fill="#888">check(3) 贪心放置过程（d = 3）：</text>

  <!-- Number line -->
  <line x1="80" y1="240" x2="420" y2="240" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- Position ticks -->
  <line x1="100" y1="236" x2="100" y2="244" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="258" text-anchor="middle" font-size="11" fill="#999">1</text>
  <line x1="160" y1="236" x2="160" y2="244" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="160" y="258" text-anchor="middle" font-size="11" fill="#999">2</text>
  <line x1="220" y1="236" x2="220" y2="244" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220" y="258" text-anchor="middle" font-size="11" fill="#999">3</text>
  <line x1="280" y1="236" x2="280" y2="244" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="11" fill="#999">4</text>
  <line x1="400" y1="236" x2="400" y2="244" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="400" y="258" text-anchor="middle" font-size="11" fill="#999">7</text>

  <!-- Balls at 1, 4, 7 -->
  <circle cx="100" cy="222" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="226" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">●</text>
  <text x="100" y="210" text-anchor="middle" font-size="9" fill="#4a7a3a">球1</text>

  <circle cx="280" cy="222" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">●</text>
  <text x="280" y="210" text-anchor="middle" font-size="9" fill="#4a7a3a">球2</text>

  <circle cx="400" cy="222" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="226" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">●</text>
  <text x="400" y="210" text-anchor="middle" font-size="9" fill="#4a7a3a">球3</text>

  <!-- Gap annotations -->
  <path d="M 100 272 L 100 280 L 280 280 L 280 272" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="190" y="294" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">gap = 3 ≥ 3 ✓</text>

  <path d="M 280 272 L 280 280 L 400 280 L 400 272" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="340" y="294" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">gap = 3 ≥ 3 ✓</text>

  <!-- Skip annotations for positions 2,3 -->
  <text x="160" y="230" text-anchor="middle" font-size="9" fill="#b85450">跳过</text>
  <text x="220" y="230" text-anchor="middle" font-size="9" fill="#b85450">跳过</text>

  <!-- Result box -->
  <rect x="150" y="306" width="260" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">答案: 3  (球放在 1, 4, 7)</text>
</svg>
