<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2728a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">概念：环形街道 n 间房围成圈，门状态未知</text>

  <!-- 5 houses on a circle, example2 doors=[1,0,1,1,0]: 开 闭 开 开 闭 -->
  <!-- house0 top: 开 -->
  <rect x="257" y="78" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="280" y="104" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">开</text>
  <text x="280" y="70" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">0</text>

  <!-- house1 right: 闭 -->
  <rect x="371" y="161" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="394" y="187" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">闭</text>
  <text x="430" y="156" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">1</text>

  <!-- house2 bottom-right: 开 -->
  <rect x="327" y="295" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="350" y="321" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">开</text>
  <text x="372" y="346" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">2</text>

  <!-- house3 bottom-left: 开 -->
  <rect x="187" y="295" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="210" y="321" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">开</text>
  <text x="188" y="346" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">3</text>

  <!-- house4 left: 闭 -->
  <rect x="143" y="161" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="166" y="187" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">闭</text>
  <text x="130" y="156" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">4</text>

  <!-- center label -->
  <ellipse cx="280" cy="210" rx="58" ry="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="204" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">环形街道</text>
  <text x="280" y="222" text-anchor="middle" font-size="11" fill="#d6a040">n 间房 · 圆圈</text>

  <!-- clockwise moveRight arrow (outer arc) -->
  <path d="M 300,52 A 240,240 0 0 1 470,150" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr2728a)" filter="url(#rough2)"/>
  <text x="430" y="78" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">moveRight →</text>

  <!-- bottom note -->
  <rect x="60" y="350" width="440" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="365" text-anchor="middle" font-size="11" fill="#4a7a3a">门初始开/关混杂，未知 n ⇒ 需「清场 + 标记」才能唯一计数</text>
</svg>
