<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="560" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 → 逐会议释放/分配/顺延</text>

  <!-- Step 1 -->
  <rect x="150" y="44" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="69" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① meetings 按 start 升序排序</text>
  <path d="M 270 86 L 270 108" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 2 init -->
  <rect x="120" y="110" width="300" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="135" text-anchor="middle" font-size="12" fill="#555">② idle ← {0..n−1}；used ← 空；cnt ← [0]*n</text>
  <path d="M 270 152 L 270 174" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 3 loop header -->
  <rect x="120" y="176" width="300" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="198" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③ 对每个会议 (s, e) 依次处理</text>

  <!-- 3a release -->
  <path d="M 270 212 L 270 230" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <rect x="90" y="232" width="360" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="251" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">3a 释放：while used 非空 且 used.top.end ≤ s</text>
  <text x="270" y="268" text-anchor="middle" font-size="11" fill="#4a7a3a">→ 把该房间从 used 弹回 idle</text>
  <path d="M 270 278 L 270 296" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="270,298 360,346 270,394 180,346" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="342" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">idle 是否</text>
  <text x="270" y="358" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">非空？</text>

  <!-- Yes branch -->
  <path d="M 180 346 L 90 346 L 90 392" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="120" y="340" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="24" y="394" width="132" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="90" y="414" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3b 取号</text>
  <text x="34" y="432" font-size="10.5" fill="#4a7a3a">r = idle.pop()</text>
  <text x="34" y="448" font-size="10.5" fill="#4a7a3a">used.push((e, r))</text>
  <text x="34" y="462" font-size="10.5" fill="#4a7a3a">cnt[r]++</text>

  <!-- No branch -->
  <path d="M 360 346 L 450 346 L 450 392" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="412" y="340" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="384" y="394" width="132" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="450" y="414" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3c 顺延</text>
  <text x="394" y="432" font-size="10.5" fill="#b85450">(end,r)=used.pop()</text>
  <text x="394" y="448" font-size="10.5" fill="#b85450">used.push(end+(e−s), r)</text>
  <text x="394" y="462" font-size="10.5" fill="#b85450">cnt[r]++</text>

  <!-- loop back arrow -->
  <path d="M 90 470 L 90 510 L 450 510 L 450 470" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="270" y="528" text-anchor="middle" font-size="11" fill="#888">处理完所有会议 → 返回 cnt 最大且编号最小的房间</text>

  <!-- overflow tip -->
  <rect x="24" y="536" width="492" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="40" y="549" font-size="10.5" fill="#b85450" font-weight="bold">⚠️ 顺延后 end 可能累加超过 int 范围，需用 long long（最坏 n=1 串行 10^5 次可达 5×10^10）</text>
</svg>
