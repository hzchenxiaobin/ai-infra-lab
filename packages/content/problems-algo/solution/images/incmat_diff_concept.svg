<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">二维差分：子矩阵 +1 ⇒ 差分数组 4 个单点修改</text>

  <!-- diff grid 6x6, origin (40,72), cell 34 -->
  <g filter="url(#rough2)">
    <!-- all cells light -->
    <g fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1">
      <rect x="40" y="72" width="34" height="34" rx="2"/>
      <rect x="74" y="72" width="34" height="34" rx="2"/>
      <rect x="108" y="72" width="34" height="34" rx="2"/>
      <rect x="142" y="72" width="34" height="34" rx="2"/>
      <rect x="176" y="72" width="34" height="34" rx="2"/>
      <rect x="210" y="72" width="34" height="34" rx="2"/>
      <rect x="40" y="106" width="34" height="34" rx="2"/>
      <rect x="74" y="106" width="34" height="34" rx="2"/>
      <rect x="108" y="106" width="34" height="34" rx="2"/>
      <rect x="142" y="106" width="34" height="34" rx="2"/>
      <rect x="176" y="106" width="34" height="34" rx="2"/>
      <rect x="210" y="106" width="34" height="34" rx="2"/>
      <rect x="40" y="140" width="34" height="34" rx="2"/>
      <rect x="74" y="140" width="34" height="34" rx="2"/>
      <rect x="108" y="140" width="34" height="34" rx="2"/>
      <rect x="142" y="140" width="34" height="34" rx="2"/>
      <rect x="176" y="140" width="34" height="34" rx="2"/>
      <rect x="210" y="140" width="34" height="34" rx="2"/>
      <rect x="40" y="174" width="34" height="34" rx="2"/>
      <rect x="74" y="174" width="34" height="34" rx="2"/>
      <rect x="108" y="174" width="34" height="34" rx="2"/>
      <rect x="142" y="174" width="34" height="34" rx="2"/>
      <rect x="176" y="174" width="34" height="34" rx="2"/>
      <rect x="210" y="174" width="34" height="34" rx="2"/>
      <rect x="40" y="208" width="34" height="34" rx="2"/>
      <rect x="74" y="208" width="34" height="34" rx="2"/>
      <rect x="108" y="208" width="34" height="34" rx="2"/>
      <rect x="142" y="208" width="34" height="34" rx="2"/>
      <rect x="176" y="208" width="34" height="34" rx="2"/>
      <rect x="210" y="208" width="34" height="34" rx="2"/>
      <rect x="40" y="242" width="34" height="34" rx="2"/>
      <rect x="74" y="242" width="34" height="34" rx="2"/>
      <rect x="108" y="242" width="34" height="34" rx="2"/>
      <rect x="142" y="242" width="34" height="34" rx="2"/>
      <rect x="176" y="242" width="34" height="34" rx="2"/>
      <rect x="210" y="242" width="34" height="34" rx="2"/>
    </g>
    <!-- submatrix [r1..r2]x[c1..c2] rows1-3 cols1-3 light blue -->
    <g fill="#e8f0fe" stroke="#446688" stroke-width="1.2">
      <rect x="74" y="106" width="34" height="34" rx="2"/>
      <rect x="108" y="106" width="34" height="34" rx="2"/>
      <rect x="142" y="106" width="34" height="34" rx="2"/>
      <rect x="74" y="140" width="34" height="34" rx="2"/>
      <rect x="108" y="140" width="34" height="34" rx="2"/>
      <rect x="142" y="140" width="34" height="34" rx="2"/>
      <rect x="74" y="174" width="34" height="34" rx="2"/>
      <rect x="108" y="174" width="34" height="34" rx="2"/>
      <rect x="142" y="174" width="34" height="34" rx="2"/>
    </g>
    <!-- region outline -->
    <rect x="72" y="104" width="106" height="106" fill="none" stroke="#446688" stroke-width="2" stroke-dasharray="6 4" rx="4"/>
    <!-- 4 marks -->
    <!-- d[r1][c1] +1 green at (74,106) -->
    <rect x="74" y="106" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="2"/>
    <text x="91" y="128" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">+1</text>
    <!-- d[r2+1][c1] -1 red at (74,208) -->
    <rect x="74" y="208" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="2"/>
    <text x="91" y="230" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">−1</text>
    <!-- d[r1][c2+1] -1 red at (176,106) -->
    <rect x="176" y="106" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="2"/>
    <text x="193" y="128" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">−1</text>
    <!-- d[r2+1][c2+1] +1 green at (176,208) -->
    <rect x="176" y="208" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="2"/>
    <text x="193" y="230" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">+1</text>
  </g>

  <!-- axis labels -->
  <g filter="url(#rough2)" font-size="12" fill="#446688">
    <text x="125" y="98" text-anchor="middle">子矩阵 [r1..r2]×[c1..c2]</text>
    <text x="91" y="258" text-anchor="middle" fill="#b85450">r2+1</text>
    <text x="193" y="98" text-anchor="middle" fill="#b85450">c2+1</text>
    <text x="28" y="128" text-anchor="end" fill="#4a7a3a">r1</text>
    <text x="28" y="230" text-anchor="end" fill="#b85450">r2+1</text>
    <text x="91" y="62" text-anchor="middle" fill="#4a7a3a">c1</text>
    <text x="193" y="62" text-anchor="middle" fill="#b85450">c2+1</text>
  </g>

  <!-- arrow: 子矩阵 +1 -> 4 marks -->
  <g filter="url(#rough2)">
    <path d="M300,140 Q250,150 230,170" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrG)"/>
    <text x="305" y="132" font-size="11" fill="#4a7a3a">子矩阵整体 +1</text>
  </g>

  <!-- Right side: formula -->
  <g filter="url(#rough2)">
    <rect x="300" y="74" width="244" height="124" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="312" y="98" font-size="13" fill="#2b2b2b">一次子矩阵 +1（覆盖到 r2,c2）：</text>
    <text x="312" y="122" font-size="13" fill="#4a7a3a">d[r1][c1]      += 1</text>
    <text x="312" y="144" font-size="13" fill="#b85450">d[r2+1][c1]   -= 1</text>
    <text x="312" y="166" font-size="13" fill="#b85450">d[r1][c2+1]   -= 1</text>
    <text x="312" y="188" font-size="13" fill="#4a7a3a">d[r2+1][c2+1] += 1</text>

    <rect x="300" y="214" width="244" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="312" y="238" font-size="13" fill="#2b2b2b">所有 query 标记完后：</text>
    <text x="312" y="262" font-size="13" fill="#2b2b2b">对 d 做一次二维前缀和</text>
    <text x="312" y="284" font-size="13" fill="#2b2b2b">mat[i][j] = d[i][j]</text>
    <text x="320" y="300" font-size="13" fill="#2b2b2b">+ mat[i-1][j] + mat[i][j-1]</text>
    <text x="320" y="316" font-size="12" fill="#d6a040">− mat[i-1][j-1]</text>
  </g>
</svg>
