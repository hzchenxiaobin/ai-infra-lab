<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：一次扫描读出四个极值</text>

  <!-- Example 1: 2x3 grid, cell 52, origin (76, 84) -->
  <text x="182" y="76" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1：grid = [[0,1,0],[1,0,1]]</text>

  <rect x="76" y="84" width="52" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="102" y="116" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="128" y="84" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="154" y="116" text-anchor="middle" font-size="14" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="180" y="84" width="52" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="206" y="116" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">0</text>

  <rect x="76" y="136" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="102" y="168" text-anchor="middle" font-size="14" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="128" y="136" width="52" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="154" y="168" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="180" y="136" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="206" y="168" text-anchor="middle" font-size="14" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- bounding box around whole grid -->
  <rect x="74" y="82" width="160" height="108" fill="none" stroke="#b85450" stroke-width="2.6" stroke-dasharray="8 5" rx="3" filter="url(#rough2)"/>

  <!-- annotations of extremes -->
  <text x="154" y="205" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">↑ minR=0（最上的 1）</text>
  <text x="154" y="221" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">↓ maxR=1（最下的 1）</text>
  <text x="60" y="117" text-anchor="end" font-size="10.5" fill="#b85450" filter="url(#rough2)">←minC=0</text>
  <text x="248" y="117" font-size="10.5" fill="#b85450" filter="url(#rough2)">maxC=2→</text>

  <!-- example 1 result -->
  <rect x="296" y="84" width="234" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="413" y="106" text-anchor="middle" font-size="12" fill="#2c4a6b" filter="url(#rough2)">高 = maxR−minR+1 = 1−0+1 = 2</text>
  <rect x="296" y="126" width="234" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="413" y="148" text-anchor="middle" font-size="12" fill="#2d5a24" filter="url(#rough2)">宽 = maxC−minC+1 = 2−0+1 = 3</text>
  <rect x="296" y="168" width="234" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="413" y="194" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">面积 = 2 × 3 = 6 ✓</text>

  <!-- Example 2: 2x2 grid, cell 46, origin (100, 262) -->
  <text x="182" y="252" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2：grid = [[0,0],[1,0]]</text>

  <rect x="100" y="262" width="46" height="46" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="123" y="290" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="146" y="262" width="46" height="46" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="169" y="290" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="100" y="308" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="123" y="336" text-anchor="middle" font-size="14" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="146" y="308" width="46" height="46" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="169" y="336" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">0</text>

  <rect x="98" y="306" width="50" height="50" fill="none" stroke="#b85450" stroke-width="2.6" stroke-dasharray="7 5" rx="3" filter="url(#rough2)"/>
  <text x="182" y="334" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">唯一的 1：minR=maxR=1, minC=maxC=0</text>

  <!-- example 2 result -->
  <rect x="296" y="262" width="234" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="413" y="286" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">包围盒收缩到单个格子</text>
  <text x="413" y="308" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">面积 = 1 × 1 = 1 ✓</text>
</svg>
