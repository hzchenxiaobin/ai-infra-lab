<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：异或把差异位编码为 1</text>

  <!-- ===== Row x = 1 = 0001 ===== -->
  <text x="44" y="86" font-size="12.5" fill="#446688" font-weight="bold">x = 1</text>
  <text x="44" y="102" font-size="10" fill="#888">二进制</text>
  <rect x="130" y="66" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="151" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="180" y="66" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="201" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="230" y="66" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="251" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="280" y="66" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="301" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>

  <!-- ===== Row y = 4 = 0100 ===== -->
  <text x="44" y="146" font-size="12.5" fill="#d6a040" font-weight="bold">y = 4</text>
  <text x="44" y="162" font-size="10" fill="#888">二进制</text>
  <rect x="130" y="126" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="151" y="148" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="180" y="126" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="201" y="148" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="230" y="126" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="251" y="148" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="280" y="126" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="301" y="148" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>

  <!-- differ markers above bit2 and bit0 -->
  <text x="201" y="58" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">↓ 异</text>
  <text x="301" y="58" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">↓ 异</text>

  <!-- XOR symbol + line -->
  <text x="108" y="186" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">^</text>
  <line x1="130" y1="178" x2="322" y2="178" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- ===== Row z = x ^ y = 5 = 0101 ===== -->
  <text x="44" y="216" font-size="12.5" fill="#4a7a3a" font-weight="bold">z = x^y</text>
  <text x="44" y="232" font-size="10" fill="#888">= 5</text>
  <rect x="130" y="196" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="151" y="218" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="180" y="196" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="201" y="218" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <rect x="230" y="196" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="251" y="218" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="280" y="196" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="301" y="218" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <text x="334" y="218" font-size="11" fill="#b85450" font-weight="bold">← 差异位 = 1</text>

  <!-- arrow down to formula -->
  <path d="M 226 230 Q 226 244 226 252" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- truth table box -->
  <rect x="60" y="256" width="200" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="160" y="276" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">异或真值表</text>
  <text x="78" y="294" font-size="10.5" fill="#555">x 的位</text>
  <text x="148" y="294" font-size="10.5" fill="#555">y 的位</text>
  <text x="218" y="294" font-size="10.5" fill="#555">x^y</text>
  <text x="78" y="312" font-size="11" fill="#333">0</text>
  <text x="148" y="312" font-size="11" fill="#333">0</text>
  <text x="218" y="312" font-size="11" fill="#333">0</text>
  <text x="78" y="328" font-size="11" fill="#333">0</text>
  <text x="148" y="328" font-size="11" fill="#333">1</text>
  <text x="218" y="328" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <!-- formula box -->
  <rect x="280" y="256" width="220" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="390" y="280" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">关键转化</text>
  <text x="390" y="302" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">汉明距离</text>
  <text x="390" y="322" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">= popcount(x ⊕ y)</text>

  <!-- bottom note -->
  <rect x="60" y="356" width="440" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">异或后数 1：归约到 191 的 popcount 问题</text>
</svg>
