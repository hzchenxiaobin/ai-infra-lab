<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14.5" fill="#333" font-weight="bold" filter="url(#rough2)">固定右端 i：合法起点连成一段 [lo, i−1]，前缀和一把求和</text>

  <!-- 数组行 -->
  <text x="146" y="40" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">#0</text>
  <text x="202" y="40" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">#1</text>
  <text x="258" y="40" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">#2</text>
  <text x="314" y="40" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">#3</text>
  <text x="370" y="40" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">#4</text>

  <rect x="120" y="44" width="52" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="146" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">9</text>
  <rect x="176" y="44" width="52" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="202" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">4</text>
  <rect x="232" y="44" width="52" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="258" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">1</text>
  <rect x="288" y="44" width="52" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="314" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">3</text>
  <rect x="344" y="44" width="52" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="370" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">7</text>
  <text x="370" y="102" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">右端 i−1 = 4（i = 5，k = 4）</text>

  <!-- 起点枚举表 -->
  <text x="46" y="124" font-size="11.5" font-weight="bold" fill="#555" filter="url(#rough2)">枚举最后一段 nums[j..4]：</text>
  <text x="300" y="124" font-size="11.5" font-weight="bold" fill="#555" filter="url(#rough2)">极差 ≤ 4 ？</text>

  <text x="52" y="148" font-size="11.5" fill="#555" filter="url(#rough2)">j=4</text>
  <text x="88" y="148" font-size="11.5" fill="#555" filter="url(#rough2)">[7]</text>
  <text x="300" y="148" font-size="11.5" fill="#555" filter="url(#rough2)">极差 0</text>
  <text x="368" y="148" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="52" y="170" font-size="11.5" fill="#555" filter="url(#rough2)">j=3</text>
  <text x="88" y="170" font-size="11.5" fill="#555" filter="url(#rough2)">[3,7]</text>
  <text x="300" y="170" font-size="11.5" fill="#555" filter="url(#rough2)">极差 4</text>
  <text x="368" y="170" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="52" y="192" font-size="11.5" fill="#555" filter="url(#rough2)">j=2</text>
  <text x="88" y="192" font-size="11.5" fill="#555" filter="url(#rough2)">[1,3,7]</text>
  <text x="300" y="192" font-size="11.5" fill="#555" filter="url(#rough2)">极差 6</text>
  <text x="368" y="192" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="52" y="214" font-size="11.5" fill="#555" filter="url(#rough2)">j=1</text>
  <text x="88" y="214" font-size="11.5" fill="#555" filter="url(#rough2)">[4,1,3,7]</text>
  <text x="300" y="214" font-size="11.5" fill="#555" filter="url(#rough2)">极差 6</text>
  <text x="368" y="214" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="52" y="236" font-size="11.5" fill="#555" filter="url(#rough2)">j=0</text>
  <text x="88" y="236" font-size="11.5" fill="#555" filter="url(#rough2)">[9,4,1,3,7]</text>
  <text x="300" y="236" font-size="11.5" fill="#555" filter="url(#rough2)">极差 8</text>
  <text x="368" y="236" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 侧边洞察框 -->
  <rect x="352" y="136" width="156" height="112" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="158" text-anchor="middle" font-size="10.5" fill="#8a6d3a" filter="url(#rough2)">j 越往左段越长，</text>
  <text x="430" y="175" text-anchor="middle" font-size="10.5" fill="#8a6d3a" filter="url(#rough2)">max 不减、min 不增</text>
  <text x="430" y="192" text-anchor="middle" font-size="10.5" fill="#8a6d3a" filter="url(#rough2)">⇒ 极差单调不减</text>
  <text x="430" y="209" text-anchor="middle" font-size="10.5" fill="#8a6d3a" filter="url(#rough2)">合法起点连成一段：</text>
  <text x="430" y="231" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">[lo, i−1] = [3, 4]</text>

  <!-- dp 行 -->
  <path d="M 228 260 L 228 252 L 336 252 L 336 260" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="282" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">Σ dp[j] = 2 + 4 = 6</text>
  <path d="M 334 251 C 350 244, 362 248, 368 260" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="60" y="264" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="86" y="277" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">dp[0]</text>
  <text x="86" y="293" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="116" y="264" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="142" y="277" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">dp[1]</text>
  <text x="142" y="293" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="172" y="264" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="198" y="277" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">dp[2]</text>
  <text x="198" y="293" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="228" y="264" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="254" y="277" text-anchor="middle" font-size="8.5" fill="#2a5a2a" filter="url(#rough2)">dp[3]</text>
  <text x="254" y="293" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">2</text>
  <rect x="284" y="264" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="277" text-anchor="middle" font-size="8.5" fill="#2a5a2a" filter="url(#rough2)">dp[4]</text>
  <text x="310" y="293" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">4</text>
  <rect x="340" y="264" width="52" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="366" y="277" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">dp[5]</text>
  <text x="366" y="293" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">6</text>
  <text x="430" y="285" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（前 5 个数</text>
  <text x="430" y="300" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">的答案）</text>

  <text x="260" y="318" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">绿格 = 窗口内可作转移来源的 dp；窗口随 i 右移只进不退</text>

  <!-- 结论公式 -->
  <rect x="66" y="330" width="388" height="50" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="351" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">dp[i] = S[i] − S[lo]　（S[x] = dp[0] + … + dp[x−1]）</text>
  <text x="260" y="370" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">lo 随 i 单调右移 → 滑动窗口 + 单调队列，整体 O(n)</text>
</svg>
