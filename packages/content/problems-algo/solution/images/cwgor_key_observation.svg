<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：合并重叠区间为连通块，每块独立二选一</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888">「重叠必同组」是等价关系（自反·对称·传递）→ 划分为 k 个连通块</text>

  <!-- ① sorted ranges -->
  <text x="40" y="78" font-size="11" fill="#888" font-weight="bold">① 排序后的区间（重叠 ⟹ 同组，传递闭合）</text>

  <!-- bar A [1,3] -->
  <g filter="url(#rough2)"><rect x="60" y="88" width="70" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="95" y="100" text-anchor="middle" font-size="10" fill="#224466">[1,3]</text>
  <!-- bar B [2,5] -->
  <g filter="url(#rough2)"><rect x="100" y="108" width="80" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="140" y="120" text-anchor="middle" font-size="10" fill="#3a5a2a">[2,5]</text>
  <!-- bar C [4,8] -->
  <g filter="url(#rough2)"><rect x="150" y="128" width="90" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="195" y="140" text-anchor="middle" font-size="10" fill="#7a5a20">[4,8]</text>
  <!-- bar D [10,20] -->
  <g filter="url(#rough2)"><rect x="330" y="108" width="120" height="16" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="390" y="120" text-anchor="middle" font-size="10" fill="#b03a3a">[10,20]</text>

  <!-- brackets -->
  <path d="M 58 156 L 58 162 L 244 162 L 244 156" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="151" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">连通块 1（[1,3]∩[2,5]∩[4,8] 传递相连）</text>
  <path d="M 328 132 L 328 138 L 452 138 L 452 132" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="390" y="152" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">连通块 2</text>

  <!-- arrow down -->
  <line x1="280" y1="184" x2="280" y2="206" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="200" font-size="10" fill="#666">② 块间无交集，互相独立</text>

  <!-- ③ each block chooses group -->
  <text x="40" y="226" font-size="11" fill="#888" font-weight="bold">③ 每个连通块独立放入 组1 或 组2</text>

  <!-- component 1 -->
  <g filter="url(#rough2)"><rect x="80" y="236" width="120" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="140" y="258" text-anchor="middle" font-size="11.5" fill="#3a5a2a" font-weight="bold">连通块1</text>
  <line x1="120" y1="270" x2="103" y2="292" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="160" y1="270" x2="177" y2="292" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="72" y="294" width="52" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="98" y="310" text-anchor="middle" font-size="10.5" fill="#224466" font-weight="bold">组1</text>
  <g filter="url(#rough2)"><rect x="156" y="294" width="52" height="24" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="182" y="310" text-anchor="middle" font-size="10.5" fill="#7a5a20" font-weight="bold">组2</text>

  <!-- component 2 -->
  <g filter="url(#rough2)"><rect x="360" y="236" width="120" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="420" y="258" text-anchor="middle" font-size="11.5" fill="#b03a3a" font-weight="bold">连通块2</text>
  <line x1="400" y1="270" x2="383" y2="292" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="440" y1="270" x2="457" y2="292" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="352" y="294" width="52" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="378" y="310" text-anchor="middle" font-size="10.5" fill="#224466" font-weight="bold">组1</text>
  <g filter="url(#rough2)"><rect x="436" y="294" width="52" height="24" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="462" y="310" text-anchor="middle" font-size="10.5" fill="#7a5a20" font-weight="bold">组2</text>

  <!-- multiply result -->
  <text x="280" y="340" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">乘法原理：2 × 2 = 2² = 4 ⟹ 一般地 答案 = 2^k mod (10⁹+7)</text>
</svg>
