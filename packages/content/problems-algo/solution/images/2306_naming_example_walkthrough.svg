<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="260" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：ideas = [coffee, donuts, time, toffee]</text>
  <text x="260" y="38" text-anchor="middle" font-size="11" fill="#888">分组：c={offee}　d={onuts}　t={ime, offee}</text>

  <!-- table outer border -->
  <rect x="30" y="48" width="460" height="110" fill="none" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>

  <!-- vertical separators -->
  <path d="M88 48 L88 158" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M198 48 L198 158" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M308 48 L308 158" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M358 48 L358 158" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M428 48 L428 158" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- header row separator -->
  <path d="M30 72 L490 72" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <!-- row separators -->
  <path d="M30 104 L490 104" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M30 132 L490 132" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- header text -->
  <text x="59" y="64" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">(a,b)</text>
  <text x="143" y="64" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">A</text>
  <text x="253" y="64" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">B</text>
  <text x="333" y="64" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">|A∩B|</text>
  <text x="393" y="64" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">(|A|−c)(|B|−c)</text>
  <text x="459" y="64" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">×2</text>

  <!-- row 1: (c,d) -->
  <text x="59" y="92" text-anchor="middle" font-size="11" fill="#333">(c, d)</text>
  <text x="143" y="92" text-anchor="middle" font-size="11" fill="#333">{offee}</text>
  <text x="253" y="92" text-anchor="middle" font-size="11" fill="#333">{onuts}</text>
  <text x="333" y="92" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="393" y="92" text-anchor="middle" font-size="11" fill="#333">1 · 1 = 1</text>
  <text x="459" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- row 2: (c,t) -->
  <text x="59" y="120" text-anchor="middle" font-size="11" fill="#333">(c, t)</text>
  <text x="143" y="120" text-anchor="middle" font-size="11" fill="#333">{offee}</text>
  <text x="253" y="120" text-anchor="middle" font-size="11" fill="#333">{ime, offee}</text>
  <text x="333" y="120" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="393" y="120" text-anchor="middle" font-size="11" fill="#b85450">0 · 1 = 0</text>
  <text x="459" y="120" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>

  <!-- row 3: (d,t) -->
  <text x="59" y="148" text-anchor="middle" font-size="11" fill="#333">(d, t)</text>
  <text x="143" y="148" text-anchor="middle" font-size="11" fill="#333">{onuts}</text>
  <text x="253" y="148" text-anchor="middle" font-size="11" fill="#333">{ime, offee}</text>
  <text x="333" y="148" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="393" y="148" text-anchor="middle" font-size="11" fill="#333">1 · 2 = 2</text>
  <text x="459" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- total -->
  <rect x="30" y="178" width="460" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="201" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">合计：2 + 0 + 4 = 6  ✓</text>

  <!-- caption -->
  <text x="260" y="234" text-anchor="middle" font-size="11" fill="#b85450">后缀 "offee" 被 c、t 共享 → (c, t) 交换无效 → 贡献为 0</text>
</svg>
