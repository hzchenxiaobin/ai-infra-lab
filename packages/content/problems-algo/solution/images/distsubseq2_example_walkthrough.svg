<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "aba"</text>
  <text x="280" y="40" text-anchor="middle" font-size="10" fill="#888">f[i] = 前缀 s[0..i−1] 的不同子序列数（含空串）</text>

  <!-- ===== Table Header ===== -->
  <rect x="30" y="52" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="70" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">i</text>

  <rect x="74" y="52" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="94" y="70" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">c</text>

  <rect x="114" y="52" width="66" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="70" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">last[c]</text>

  <rect x="180" y="52" width="190" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="70" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">计算</text>

  <rect x="370" y="52" width="54" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="397" y="70" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">f[i]</text>

  <rect x="424" y="52" width="126" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="487" y="70" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">说明</text>

  <!-- ===== Row 0: Base ===== -->
  <rect x="30" y="78" width="44" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="52" y="96" text-anchor="middle" font-size="11" fill="#333">0</text>

  <rect x="74" y="78" width="40" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="94" y="96" text-anchor="middle" font-size="11" fill="#ccc">—</text>

  <rect x="114" y="78" width="66" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="147" y="96" text-anchor="middle" font-size="11" fill="#ccc">—</text>

  <rect x="180" y="78" width="190" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="275" y="96" text-anchor="middle" font-size="10" fill="#888">基准（空串）</text>

  <rect x="370" y="78" width="54" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="397" y="96" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <rect x="424" y="78" width="126" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="487" y="96" text-anchor="middle" font-size="9" fill="#888">空串算 1 种</text>

  <!-- ===== Row 1: a (first) ===== -->
  <rect x="30" y="104" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="52" y="122" text-anchor="middle" font-size="11" fill="#333">1</text>

  <rect x="74" y="104" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="94" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>

  <rect x="114" y="104" width="66" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="147" y="122" text-anchor="middle" font-size="10" fill="#ccc">无</text>

  <rect x="180" y="104" width="190" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="275" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a">2 × 1 = 2</text>

  <rect x="370" y="104" width="54" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="397" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <rect x="424" y="104" width="126" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="487" y="122" text-anchor="middle" font-size="9" fill="#888">首次出现 a</text>

  <!-- ===== Row 2: b (first) ===== -->
  <rect x="30" y="130" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="52" y="148" text-anchor="middle" font-size="11" fill="#333">2</text>

  <rect x="74" y="130" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="94" y="148" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>

  <rect x="114" y="130" width="66" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="147" y="148" text-anchor="middle" font-size="10" fill="#ccc">无</text>

  <rect x="180" y="130" width="190" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="275" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a">2 × 2 = 4</text>

  <rect x="370" y="130" width="54" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="397" y="148" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <rect x="424" y="130" width="126" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="487" y="148" text-anchor="middle" font-size="9" fill="#888">首次出现 b</text>

  <!-- ===== Row 3: a (repeat!) ===== -->
  <rect x="30" y="156" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="52" y="174" text-anchor="middle" font-size="11" fill="#333">3</text>

  <rect x="74" y="156" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="94" y="174" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">a</text>

  <rect x="114" y="156" width="66" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="174" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">j = 1</text>

  <rect x="180" y="156" width="190" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="174" text-anchor="middle" font-size="11" fill="#333">2×4 − f[0] = 8−1 = <tspan fill="#b85450" font-weight="bold">7</tspan></text>

  <rect x="370" y="156" width="54" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="397" y="174" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">7</text>

  <rect x="424" y="156" width="126" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="487" y="174" text-anchor="middle" font-size="9" fill="#b85450">a 重复，扣 f[0]=1</text>

  <!-- ===== Answer ===== -->
  <rect x="120" y="196" width="320" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="218" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">答案 = f[3] − 1 = 7 − 1 = <tspan fill="#b85450">6</tspan></text>

  <!-- ===== 6 distinct subsequences ===== -->
  <text x="280" y="250" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">6 个不同子序列</text>

  <!-- Step 1-2 subsequences (green) -->
  <rect x="120" y="260" width="45" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="142" y="278" text-anchor="middle" font-size="11" fill="#333">a</text>

  <rect x="173" y="260" width="45" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="278" text-anchor="middle" font-size="11" fill="#333">b</text>

  <rect x="226" y="260" width="45" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="248" y="278" text-anchor="middle" font-size="11" fill="#333">ab</text>

  <!-- Step 3 new subsequences (orange) -->
  <rect x="279" y="260" width="45" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="301" y="278" text-anchor="middle" font-size="11" fill="#333">aa</text>

  <rect x="332" y="260" width="45" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="354" y="278" text-anchor="middle" font-size="11" fill="#333">ba</text>

  <rect x="385" y="260" width="55" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="412" y="278" text-anchor="middle" font-size="11" fill="#333">aba</text>

  <!-- Legend -->
  <rect x="120" y="304" width="14" height="14" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="316" font-size="10" fill="#555">步骤 1-2 产生</text>

  <rect x="250" y="304" width="14" height="14" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="316" font-size="10" fill="#555">步骤 3 追加 a 产生（新）</text>

  <!-- Dedup note -->
  <rect x="60" y="332" width="440" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="10" fill="#b85450">步骤 3 追加 a 到空串得到 "a" → 与步骤 1 已有的 "a" 重复</text>
  <text x="280" y="366" text-anchor="middle" font-size="10" fill="#b85450">扣除 f[0] = 1 消除重复，8 − 1 = 7（含空串），非空 = 6</text>
</svg>
