<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">流程：遍历 arr，遇数组则 yield* 委托递归，遇整数则 yield 产出</text>

  <!-- Start: loop over items -->
  <rect x="180" y="48" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="16" filter="url(#rough2)"/>
  <text x="280" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for (const item of arr)</text>

  <!-- arrow down to decision -->
  <path d="M 280 82 L 280 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="280,106 388,150 280,194 172,150" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">Array.isArray(item)</text>
  <text x="280" y="162" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">?</text>

  <!-- Yes label -->
  <text x="398" y="146" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <!-- No label -->
  <text x="148" y="146" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- Yes branch: right -->
  <path d="M 388 150 L 430 150 L 430 218" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="340" y="220" width="180" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="430" y="240" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">yield* inorderTraversal(item)</text>
  <text x="430" y="256" text-anchor="middle" font-size="10" fill="#888">委托子生成器，逐个透传</text>

  <!-- No branch: left -->
  <path d="M 172 150 L 130 150 L 130 218" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="220" width="180" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="130" y="240" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">yield item</text>
  <text x="130" y="256" text-anchor="middle" font-size="10" fill="#888">吐出一个整数，next() 即返回</text>

  <!-- both branches loop back up to for -->
  <path d="M 430 266 L 430 300 L 510 300 L 510 65 L 384 65" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 130 266 L 130 300 L 50 300 L 50 65 L 176 65" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="10" fill="#888">虚线：处理完一项后回到 for，取下一个 item</text>

  <!-- End: generator done -->
  <path d="M 280 194 L 280 196" stroke="#666" stroke-width="1.5" fill="none"/>
  <rect x="160" y="330" width="240" height="0" fill="none"/>

  <!-- generator done box at bottom center -->
  <rect x="150" y="324" width="260" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="15" filter="url(#rough2)"/>
  <text x="280" y="343" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">arr 遍历完 → 生成器返回 { done: true }</text>
  <path d="M 280 194 L 280 324" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="2,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="210" font-size="10" fill="#b85450">for 结束</text>
</svg>
