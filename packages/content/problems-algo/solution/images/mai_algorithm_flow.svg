<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="760" height="470" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：遍历 + DFS 求面积</text>
  <path d="M 240 40 Q 380 48 520 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- main flow column (x center ~210) -->
  <!-- start -->
  <g filter="url(#rough2)"><rect x="130" y="62" width="160" height="40" rx="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="210" y="87" text-anchor="middle" font-size="13" fill="#2b4a66" font-weight="bold">max_area = 0</text>

  <!-- iterate -->
  <g filter="url(#rough2)"><rect x="130" y="124" width="160" height="40" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/></g>
  <text x="210" y="149" text-anchor="middle" font-size="13" fill="#333">遍历每个格子 (i, j)</text>

  <!-- diamond -->
  <g filter="url(#rough2)"><path d="M 210 184 L 300 232 L 210 280 L 120 232 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="210" y="228" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">grid[i][j]</text>
  <text x="210" y="246" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">== 1 ?</text>

  <!-- dfs call -->
  <g filter="url(#rough2)"><rect x="130" y="308" width="160" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="210" y="333" text-anchor="middle" font-size="13" fill="#2e5a26" font-weight="bold">area = dfs(i, j)</text>

  <!-- update max -->
  <g filter="url(#rough2)"><rect x="130" y="370" width="160" height="40" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/></g>
  <text x="210" y="395" text-anchor="middle" font-size="13" fill="#333">max_area = max(·, area)</text>

  <!-- end -->
  <g filter="url(#rough2)"><rect x="130" y="430" width="160" height="0" rx="0" fill="none" stroke="none"/></g>
  <text x="210" y="448" text-anchor="middle" font-size="12" fill="#888">遍历结束 → return max_area</text>

  <!-- arrows main column -->
  <path d="M 210 102 L 210 122" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 210 164 L 210 182" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 210 280 L 210 306" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 210 348 L 210 368" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No branch: from diamond right back up to iterate -->
  <text x="310" y="226" font-size="12" fill="#b85450" font-weight="bold">否</text>
  <path d="M 300 232 L 400 232 L 400 144 L 292 144" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4 3"/>
  <text x="408" y="138" font-size="11" fill="#b85450">跳过，继续遍历</text>

  <!-- Yes label -->
  <text x="196" y="300" font-size="12" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- loop back from update max to iterate (continue next cell) -->
  <path d="M 130 390 L 60 390 L 60 144 L 128 144" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4 3"/>
  <text x="40" y="270" font-size="11" fill="#888" transform="rotate(-90 40 270)">下一个格子</text>

  <!-- DFS subroutine box on right -->
  <g filter="url(#rough2)">
    <rect x="450" y="120" width="280" height="240" rx="10" fill="#f0fbf3" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 3"/>
  </g>
  <text x="590" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5a26">dfs(i, j) 子过程</text>
  <line x1="470" y1="156" x2="710" y2="156" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>

  <text x="470" y="180" font-size="12" fill="#333">① 越界 或 grid[i][j] != 1 ？</text>
  <text x="486" y="200" font-size="12" fill="#b85450">→ 是：return 0</text>

  <text x="470" y="228" font-size="12" fill="#333">② grid[i][j] = 0  （沉岛，兼 visited）</text>

  <text x="470" y="256" font-size="12" fill="#333">③ 向 4 方向递归累加：</text>
  <text x="486" y="276" font-size="12" fill="#2e5a26" font-family="'Comic Sans MS',monospace">return 1 + dfs(up)+dfs(down)</text>
  <text x="540" y="294" font-size="12" fill="#2e5a26" font-family="'Comic Sans MS',monospace">+dfs(left)+dfs(right)</text>

  <g filter="url(#rough2)"><rect x="470" y="312" width="240" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="590" y="334" text-anchor="middle" font-size="12" fill="#2e5a26" font-weight="bold">每个连通块各访问一次 → 面积</text>

  <!-- arrow from dfs call to subroutine -->
  <path d="M 290 328 L 446 240" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="3 3"/>
</svg>
