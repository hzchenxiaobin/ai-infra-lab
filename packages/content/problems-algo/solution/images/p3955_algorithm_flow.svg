<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：dfs(i, prevOne, cost) —— 先 '0' 后 '1'，双门把守</text>

  <!-- 左侧：主流程 -->
  <g filter="url(#rough2)">
    <rect x="45" y="40" width="160" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="125" y="60" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">dfs(i, prevOne, cost)</text>

    <path d="M125,72 L125,88" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <polygon points="125,88 193,120 125,152 57,120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="125" y="116" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold">i == n ?</text>
    <text x="125" y="134" text-anchor="middle" font-size="9" fill="#8a6d1a">串拼满了？</text>

    <path d="M125,152 L125,172" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="133" y="167" font-size="10" fill="#b85450" font-weight="bold">否</text>

    <rect x="45" y="172" width="160" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="125" y="190" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">path[i] ← '0'</text>
    <text x="125" y="206" text-anchor="middle" font-size="9" fill="#33506b">dfs(i+1, '0', cost) —— '0' 分支</text>

    <path d="M125,212 L125,228" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <polygon points="125,228 200,260 125,292 50,260" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="125" y="256" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold">能放 '1' ?</text>
    <text x="125" y="273" text-anchor="middle" font-size="8.5" fill="#8a6d1a">prevOne=0 且 cost+i ≤ k</text>

    <path d="M125,292 L125,308" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="133" y="304" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

    <rect x="45" y="308" width="160" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="125" y="326" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">path[i] ← '1'</text>
    <text x="125" y="342" text-anchor="middle" font-size="9" fill="#33506b">dfs(i+1, '1', cost+i)</text>

    <!-- 递归回边 -->
    <path d="M45,192 L24,192" stroke="#4a7a3a" stroke-width="1.8" fill="none"/>
    <path d="M125,348 L125,360 L24,360" stroke="#4a7a3a" stroke-width="1.8" fill="none"/>
    <path d="M24,360 L24,56 L43,56" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)"/>
    <text x="15" y="208" text-anchor="middle" font-size="9" fill="#2f5d24" transform="rotate(-90 15 208)">递归调用回边</text>

    <text x="125" y="388" text-anchor="middle" font-size="9.5" fill="#33506b">两分支试完 → 自动 return（天然回溯）</text>
  </g>

  <!-- 中间：两个出口 -->
  <g filter="url(#rough2)">
    <path d="M193,120 L221,120" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)"/>
    <text x="207" y="112" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
    <rect x="221" y="104" width="128" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="285" y="124" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">收获：ans ← path</text>
    <text x="285" y="152" text-anchor="middle" font-size="9" fill="#4a6b5a">return（回溯上一层）</text>

    <path d="M200,260 L226,260" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)"/>
    <text x="213" y="252" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
    <rect x="226" y="244" width="126" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="289" y="264" text-anchor="middle" font-size="10.5" fill="#8a3030" font-weight="bold">剪枝：跳过 '1' 分支</text>
    <text x="289" y="292" text-anchor="middle" font-size="9" fill="#8a3030">预算超 ⇒ 之后全 '0'</text>
  </g>

  <!-- 右侧：输出顺序 -->
  <g filter="url(#rough2)">
    <rect x="400" y="40" width="200" height="252" rx="8" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="500" y="62" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">输出顺序（n=3, k=1）</text>

    <rect x="430" y="78" width="70" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="465" y="98" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold">000</text>
    <text x="545" y="98" text-anchor="middle" font-size="9.5" fill="#4a6b5a">cost 0</text>

    <path d="M465,108 L465,120" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="430" y="122" width="70" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="465" y="142" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold">010</text>
    <text x="545" y="142" text-anchor="middle" font-size="9.5" fill="#4a6b5a">cost 1</text>

    <path d="M465,152 L465,164" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="430" y="166" width="70" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="465" y="186" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold">100</text>
    <text x="545" y="186" text-anchor="middle" font-size="9.5" fill="#4a6b5a">cost 0</text>

    <text x="500" y="216" text-anchor="middle" font-size="9.5" fill="#8a3030">剪掉：001、101（超预算 2 &gt; 1）</text>
    <text x="500" y="234" text-anchor="middle" font-size="9.5" fill="#8a3030">以及 011、11（连续 '1'）</text>

    <text x="500" y="264" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold">先 '0' 后 '1' ⇒ 字典序</text>
  </g>

  <!-- 右下：要点 -->
  <g filter="url(#rough2)">
    <rect x="390" y="306" width="210" height="104" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="495" y="328" text-anchor="middle" font-size="9.5" fill="#8a6d1a">要点：'0' 分支永远可行；</text>
    <text x="495" y="346" text-anchor="middle" font-size="9.5" fill="#8a6d1a">'1' 要过两道门：前位 ≠ '1'，</text>
    <text x="495" y="364" text-anchor="middle" font-size="9.5" fill="#8a6d1a">且 cost + i ≤ k</text>
    <text x="495" y="390" text-anchor="middle" font-size="9" fill="#8a6d1a">合法串 ≤ F(n+2) 个 —— 输出敏感最优</text>
  </g>
</svg>
