<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 465"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="520" height="465" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">回溯流程：枚举起点 → DFS → 剪枝 → 回溯</text>

  <g filter="url(#rough2)">
    <!-- 枚举起点 -->
    <rect x="60" y="40" width="240" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="180" y="57" text-anchor="middle" font-size="11.5" fill="#333">枚举起点 (i, j)：grid[i][j] ∈ {0, 1}</text>
    <path d="M 180 66 L 180 76" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>

    <!-- DFS 入栈 -->
    <rect x="60" y="80" width="240" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="180" y="97" text-anchor="middle" font-size="11.5" fill="#333">DFS(x, y, v)：(x,y) 入 path，标记 vis</text>
    <path d="M 180 106 L 180 116" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>

    <!-- 判定1：长度 -->
    <polygon points="180,116 258,141 180,166 102,141" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="180" y="145" text-anchor="middle" font-size="10.5" fill="#a07818">path 长度 = m·n ？</text>

    <path d="M 258 141 L 312 141" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)"/>
    <text x="282" y="133" text-anchor="middle" font-size="11" fill="#4a7a3a">是</text>
    <rect x="316" y="128" width="190" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="411" y="145" text-anchor="middle" font-size="11.5" fill="#4a7a3a">成功：返回 path</text>

    <path d="M 180 166 L 180 176" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>
    <text x="190" y="176" font-size="11" fill="#b85450">否</text>

    <!-- 枚举邻居 -->
    <rect x="60" y="180" width="240" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="180" y="197" text-anchor="middle" font-size="11.5" fill="#333">枚举 4 个相邻格 (nx, ny)</text>
    <path d="M 180 206 L 180 216" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>

    <!-- 判定2：合法性 -->
    <polygon points="180,216 258,241 180,266 102,241" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="180" y="234" text-anchor="middle" font-size="10.5" fill="#a07818">越界 / 已访问，</text>
    <text x="180" y="248" text-anchor="middle" font-size="10.5" fill="#a07818">或值 ∉ {0, v} ？</text>

    <path d="M 258 241 L 312 241" fill="none" stroke="#888888" stroke-width="1.8" marker-end="url(#arrK)"/>
    <text x="282" y="233" text-anchor="middle" font-size="11" fill="#888888">是</text>
    <rect x="316" y="228" width="190" height="26" rx="6" fill="#f0f0f0" stroke="#999999" stroke-width="1.5"/>
    <text x="411" y="245" text-anchor="middle" font-size="11.5" fill="#666">剪枝：换下一个方向</text>

    <path d="M 180 266 L 180 276" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>
    <text x="190" y="276" font-size="11" fill="#b85450">否</text>

    <!-- 递归 -->
    <rect x="60" y="280" width="240" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="180" y="297" text-anchor="middle" font-size="11" fill="#333">踩中 v ？ v+1 : v，递归 DFS(nx, ny, v')</text>
    <path d="M 180 306 L 180 316" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>

    <!-- 判定3：递归成功？ -->
    <polygon points="180,316 258,341 180,366 102,341" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="180" y="345" text-anchor="middle" font-size="10.5" fill="#a07818">递归返回 true ？</text>

    <path d="M 258 341 L 312 341" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)"/>
    <text x="282" y="333" text-anchor="middle" font-size="11" fill="#4a7a3a">是</text>
    <rect x="316" y="328" width="190" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="411" y="345" text-anchor="middle" font-size="11.5" fill="#4a7a3a">层层上报 true，返回 path</text>

    <path d="M 180 366 L 180 376" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>
    <text x="190" y="376" font-size="11" fill="#b85450">否</text>

    <!-- 回溯 -->
    <rect x="60" y="380" width="240" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="180" y="397" text-anchor="middle" font-size="11.5" fill="#b85450">回溯：撤销 vis，path 弹栈，换方向</text>
    <path d="M 180 406 L 180 416" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>

    <!-- 兜底 -->
    <rect x="60" y="420" width="240" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="180" y="437" text-anchor="middle" font-size="11.5" fill="#333">所有起点都失败 ⇒ 返回空数组 []</text>
  </g>

  <text x="260" y="458" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">回溯 = 失败分支「全身而退」：撤销标记，把路让给下一个方向</text>
</svg>
