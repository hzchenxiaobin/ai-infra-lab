  <text x="362" y="217" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">1</text>

  <text x="110" y="239" text-anchor="start" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">峰值 2 ｜ 对：6h = 360 min</text>

  <text x="52" y="286" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">员工 3</text>

  <rect x="110" y="260" width="224" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="222" y="270" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">s1 09–17</text>

  <rect x="110" y="280" width="224" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="222" y="293" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">1</text>

  <text x="110" y="315" text-anchor="start" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">峰值 1（单班次也算 1 条在岗） ｜ 无重叠对 → 0 min</text>

  <rect x="130" y="332" width="300" height="82" fill="none" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="130" y="332" width="300" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="347" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold" filter="url(#rough2)">employee_id</text>
  <text x="262" y="347" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold" filter="url(#rough2)">max_overlapping_shifts</text>
  <text x="372" y="347" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold" filter="url(#rough2)">total_overlap_duration</text>
