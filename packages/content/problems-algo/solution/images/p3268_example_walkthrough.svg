  <text x="110" y="153" text-anchor="start" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">峰值 3（16–17 段） ｜ 对：2h + 1h + 7h = 600 min</text>

  <text x="52" y="192" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">员工 2</text>

  <rect x="110" y="166" width="224" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="222" y="176" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">s1 09–17</text>
  <rect x="166" y="184" width="224" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
