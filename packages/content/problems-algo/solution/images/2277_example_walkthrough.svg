<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：n=7, edges=[[0,1],[0,2],[0,3],[1,4],[2,5],[2,6]], query=[[5,3,4],[5,3,6]]</text>

  <!-- ===== Panel 1: query [5,3,4] ===== -->
  <rect x="24" y="46" width="532" height="134" fill="none" stroke="#cdd5df" stroke-width="1" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="36" y="66" font-size="11.5" fill="#446688" font-weight="bold">查询 1：[start=5, end=3, node=4]</text>

  <!-- node box -->
  <rect x="40" y="84" width="76" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="78" y="106" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">node=4</text>
  <line x1="116" y1="101" x2="172" y2="101" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="144" y="95" text-anchor="middle" font-size="9" fill="#b85450">BFS 算 d</text>

  <!-- path boxes 5 2 0 3 -->
  <rect x="178" y="84" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="201" y="106" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">5</text>
  <line x1="224" y1="101" x2="236" y2="101" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="238" y="84" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="261" y="106" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>
  <line x1="284" y1="101" x2="296" y2="101" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- node 0 = min (green highlight) -->
  <rect x="298" y="82" width="48" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" rx="5" filter="url(#rough2)"/>
  <text x="322" y="106" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <line x1="346" y1="101" x2="358" y2="101" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="360" y="84" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="383" y="106" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">3</text>

  <!-- distance labels -->
  <text x="201" y="136" text-anchor="middle" font-size="10" fill="#888">d=4</text>
  <text x="261" y="136" text-anchor="middle" font-size="10" fill="#888">d=3</text>
  <text x="322" y="136" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">d=2 ★</text>
  <text x="383" y="136" text-anchor="middle" font-size="10" fill="#888">d=3</text>
  <text x="290" y="156" text-anchor="middle" font-size="10" fill="#888">dist(4,·)：路径点 {5,2,0,3} → {4,3,2,3}，最小为 2</text>

  <!-- arrow to answer -->
  <line x1="412" y1="101" x2="446" y2="101" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="450" y="84" width="96" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="498" y="106" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">answer=0</text>

  <!-- ===== Panel 2: query [5,3,6] ===== -->
  <rect x="24" y="196" width="532" height="134" fill="none" stroke="#cdd5df" stroke-width="1" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="36" y="216" font-size="11.5" fill="#446688" font-weight="bold">查询 2：[start=5, end=3, node=6]</text>

  <rect x="40" y="234" width="76" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="78" y="256" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">node=6</text>
  <line x1="116" y1="251" x2="172" y2="251" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="144" y="245" text-anchor="middle" font-size="9" fill="#b85450">BFS 算 d</text>

  <rect x="178" y="234" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="201" y="256" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">5</text>
  <line x1="224" y1="251" x2="236" y2="251" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- node 2 = min (green highlight) -->
  <rect x="236" y="232" width="48" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" rx="5" filter="url(#rough2)"/>
  <text x="260" y="256" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <line x1="284" y1="251" x2="296" y2="251" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="298" y="234" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="321" y="256" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">0</text>
  <line x1="344" y1="251" x2="356" y2="251" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="358" y="234" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="381" y="256" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">3</text>

  <text x="201" y="286" text-anchor="middle" font-size="10" fill="#888">d=2</text>
  <text x="260" y="286" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">d=1 ★</text>
  <text x="321" y="286" text-anchor="middle" font-size="10" fill="#888">d=2</text>
  <text x="381" y="286" text-anchor="middle" font-size="10" fill="#888">d=3</text>
  <text x="290" y="306" text-anchor="middle" font-size="10" fill="#888">dist(6,·)：路径点 {5,2,0,3} → {2,1,2,3}，最小为 1</text>

  <line x1="410" y1="251" x2="446" y2="251" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="450" y="234" width="96" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="498" y="256" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">answer=2</text>

  <!-- ===== final answer ===== -->
  <rect x="160" y="350" width="260" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="375" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">answer = [0, 2] ✓</text>

  <text x="290" y="410" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">两查询同走路径 5—2—0—3，仅 node 不同；BFS 算距 → 路径上取最小</text>
  <text x="290" y="426" text-anchor="middle" font-size="9.5" fill="#888">树中查询点向路径的“汇合点”唯一，故最小距离唯一，无需并列特判</text>
</svg>
