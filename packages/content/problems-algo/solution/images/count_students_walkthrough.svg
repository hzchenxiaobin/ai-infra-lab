<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：JOIN 结果按部门分组 → COUNT(student_id) vs COUNT(*)</text>

  <!-- JOIN result table -->
  <text x="300" y="52" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">LEFT JOIN 后的中间表（4 行）</text>
  <rect x="60" y="58" width="480" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="74" font-size="9.5" fill="#333">dept_id</text>
  <text x="195" y="74" font-size="9.5" fill="#333">dept_name</text>
  <text x="335" y="74" font-size="9.5" fill="#333">student_id</text>
  <text x="470" y="74" font-size="9.5" fill="#333">student_name</text>
  <line x1="150" y1="58" x2="150" y2="82" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="290" y1="58" x2="290" y2="82" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="410" y1="58" x2="410" y2="82" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="60" y="82" width="480" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="97" font-size="9.5" fill="#333">1</text>
  <text x="195" y="97" font-size="9.5" fill="#333">Engineering</text>
  <text x="335" y="97" font-size="9.5" fill="#333">1</text>
  <text x="470" y="97" font-size="9.5" fill="#333">Jack</text>
  <line x1="150" y1="82" x2="150" y2="104" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="290" y1="82" x2="290" y2="104" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="410" y1="82" x2="410" y2="104" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="60" y="104" width="480" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="119" font-size="9.5" fill="#333">1</text>
  <text x="195" y="119" font-size="9.5" fill="#333">Engineering</text>
  <text x="335" y="119" font-size="9.5" fill="#333">2</text>
  <text x="470" y="119" font-size="9.5" fill="#333">Jane</text>
  <line x1="150" y1="104" x2="150" y2="126" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="290" y1="104" x2="290" y2="126" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="410" y1="104" x2="410" y2="126" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="60" y="126" width="480" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="141" font-size="9.5" fill="#333">2</text>
  <text x="195" y="141" font-size="9.5" fill="#333">Science</text>
  <text x="335" y="141" font-size="9.5" fill="#333">3</text>
  <text x="470" y="141" font-size="9.5" fill="#333">Mark</text>
  <line x1="150" y1="126" x2="150" y2="148" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="290" y1="126" x2="290" y2="148" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="410" y1="126" x2="410" y2="148" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="60" y="148" width="480" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="100" y="164" font-size="9.5" fill="#b85450" font-weight="bold">3</text>
  <text x="195" y="164" font-size="9.5" fill="#b85450" font-weight="bold">Law</text>
  <text x="335" y="164" font-size="9.5" fill="#b85450" font-weight="bold">NULL</text>
  <text x="470" y="164" font-size="9.5" fill="#b85450" font-weight="bold">NULL</text>
  <line x1="150" y1="148" x2="150" y2="172" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="290" y1="148" x2="290" y2="172" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="410" y1="148" x2="410" y2="172" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="300" y="188" text-anchor="middle" font-size="9" fill="#b85450">↑ Law 行：右表列全 NULL，但行存在</text>

  <!-- Arrow down -->
  <path d="M300 194 L300 214" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="318" y="208" font-size="10" fill="#4a7a3a" font-weight="bold">GROUP BY dept_id</text>

  <!-- Comparison table -->
  <text x="300" y="232" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">分组计数对比</text>
  <rect x="60" y="238" width="480" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="254" font-size="9.5" fill="#333">dept_name</text>
  <text x="265" y="254" font-size="9.5" fill="#4a7a3a">COUNT(student_id)</text>
  <text x="425" y="254" font-size="9.5" fill="#b85450">COUNT(*) [错误对照]</text>
  <line x1="200" y1="238" x2="200" y2="262" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="370" y1="238" x2="370" y2="262" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="60" y="262" width="480" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="277" font-size="9.5" fill="#333">Engineering</text>
  <text x="265" y="277" font-size="9.5" fill="#4a7a3a" font-weight="bold">2 ✓</text>
  <text x="425" y="277" font-size="9.5" fill="#888">2</text>
  <line x1="200" y1="262" x2="200" y2="284" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="370" y1="262" x2="370" y2="284" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="60" y="284" width="480" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="299" font-size="9.5" fill="#333">Science</text>
  <text x="265" y="299" font-size="9.5" fill="#4a7a3a" font-weight="bold">1 ✓</text>
  <text x="425" y="299" font-size="9.5" fill="#888">1</text>
  <line x1="200" y1="284" x2="200" y2="306" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="370" y1="284" x2="370" y2="306" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="60" y="306" width="480" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="110" y="322" font-size="9.5" fill="#d6a040" font-weight="bold">Law</text>
  <text x="265" y="322" font-size="9.5" fill="#4a7a3a" font-weight="bold">0 ✓（正确）</text>
  <text x="425" y="322" font-size="9.5" fill="#b85450" font-weight="bold">1 ✗（误算）</text>
  <line x1="200" y1="306" x2="200" y2="330" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="370" y1="306" x2="370" y2="330" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Final output -->
  <path d="M300 332 L300 354" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="120" y="358" width="360" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="378" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">最终输出（用 COUNT(student_id)）</text>
  <text x="300" y="396" text-anchor="middle" font-size="10" fill="#333">Engineering 2 ｜ Science 1 ｜ Law 0</text>
  <text x="300" y="412" text-anchor="middle" font-size="9" fill="#4a7a3a">Law 保留且计 0，满足「所有部门都需展示」</text>

  <text x="300" y="442" text-anchor="middle" font-size="9.5" fill="#b85450">结论：LEFT JOIN + COUNT(右表主键) = 保全 + 空组计 0 的标准范式</text>
</svg>
