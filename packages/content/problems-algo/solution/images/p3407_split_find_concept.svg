<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">一次切分、两次 find：pre 首现之后找得到 suf 即命中</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">s = "leetcode"，p = "ee*e"：'*' 替换为 "tcod" 得子串 "eetcode"</text>

  <!-- p 行 -->
  <path d="M 176 62 L 176 56 L 264 56 L 264 62" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="50" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">pre = "ee"</text>
  <path d="M 308 62 L 308 56 L 352 56 L 352 62" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="50" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">suf = "e"</text>
  <text x="164" y="85" text-anchor="end" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">p</text>
  <rect x="176" y="64" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="220" y="64" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="264" y="64" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="308" y="64" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="198" y="85" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">e</text>
  <text x="242" y="85" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">e</text>
  <text x="286" y="87" text-anchor="middle" font-size="15" fill="#a07830" font-weight="bold" filter="url(#rough2)">*</text>
  <text x="330" y="85" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">e</text>
  <text x="286" y="112" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">吸收任意串（可为空）</text>

  <path d="M 260 118 L 260 134" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="130" font-size="9" fill="#a07830" filter="url(#rough2)">对齐窗口</text>

  <!-- s 行上方括号 -->
  <path d="M 128 148 L 128 142 L 216 142 L 216 148" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="172" y="137" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">pre 首现 i = 1</text>
  <path d="M 392 148 L 392 142 L 436 142 L 436 148" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="414" y="137" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">suf 命中 j = 7</text>

  <!-- s 行 -->
  <text x="72" y="171" text-anchor="end" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">s</text>
  <rect x="84" y="150" width="44" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="128" y="150" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="172" y="150" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="216" y="150" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="260" y="150" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="304" y="150" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="348" y="150" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="392" y="150" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="106" y="171" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">l</text>
  <text x="150" y="171" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">e</text>
  <text x="194" y="171" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">e</text>
  <text x="238" y="171" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">t</text>
  <text x="282" y="171" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="326" y="171" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">o</text>
  <text x="370" y="171" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="414" y="171" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">e</text>

  <text x="106" y="196" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="150" y="196" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="194" y="196" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="238" y="196" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="282" y="196" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="326" y="196" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="370" y="196" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="414" y="196" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">7</text>

  <!-- 命中子串括号 -->
  <path d="M 128 204 L 128 210 L 436 210 L 436 204" fill="none" stroke="#a07830" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="282" y="224" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">命中子串 s[1..7] = "eetcode"：'*' 吃掉中间 "tcod"，l 未参与</text>

  <!-- 三张说明卡 -->
  <rect x="36" y="240" width="146" height="82" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="109" y="258" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">① 切分</text>
  <text x="109" y="275" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">p.split('*') 得 pre、suf</text>
  <text x="109" y="290" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">恰好一个 '*' ⇒ 恰好两段</text>
  <text x="109" y="305" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">（首尾均可为空串）</text>

  <rect x="192" y="240" width="146" height="82" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="265" y="258" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">② 首现 find</text>
  <text x="265" y="275" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">i = s.find(pre)</text>
  <text x="265" y="290" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">i = −1 ⇒ 直接 false</text>
  <text x="265" y="305" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">首现最早、给 suf 余地最大</text>

  <rect x="348" y="240" width="136" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="416" y="258" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">③ 随后 find</text>
  <text x="416" y="275" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">j = s.find(suf, i+L1)</text>
  <text x="416" y="290" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">j = −1 ⇒ false</text>
  <text x="416" y="305" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">命中 ⇒ true</text>

  <text x="260" y="345" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">正确性（交换论证）：首现最早 ⇒ 留给 suf 的搜索范围最大——首现配不上，别的出现更配不上</text>
</svg>
