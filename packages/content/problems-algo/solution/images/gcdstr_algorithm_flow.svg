<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">字符串最大公因子：算法流程</text>

  <!-- Start -->
  <rect x="210" y="44" width="140" height="34" rx="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333">输入 str1, str2</text>

  <line x1="280" y1="78" x2="280" y2="96" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="280,96 384,138 280,180 176,138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="11" fill="#444">str1 + str2</text>
  <text x="280" y="148" text-anchor="middle" font-size="11" fill="#444">== str2 + str1 ?</text>

  <!-- No branch -->
  <line x1="384" y1="138" x2="420" y2="138" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="394" y="132" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="420" y="122" width="116" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="478" y="144" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 ""</text>
  <text x="478" y="172" text-anchor="middle" font-size="10" fill="#888">无公共因子</text>

  <!-- Yes branch -->
  <line x1="280" y1="180" x2="280" y2="206" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="196" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- gcd box -->
  <rect x="190" y="206" width="180" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="228" text-anchor="middle" font-size="12" fill="#333">g = gcd(len1, len2)</text>

  <line x1="280" y1="240" x2="280" y2="266" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return box -->
  <rect x="190" y="266" width="180" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="12" fill="#333">return str1[0 : g]</text>

  <line x1="280" y1="300" x2="280" y2="320" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <rect x="232" y="320" width="96" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="12" fill="#333">结束</text>

  <!-- side note -->
  <rect x="420" y="206" width="120" height="74" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="226" font-size="10" fill="#555">两步合一：</text>
  <text x="430" y="244" font-size="10" fill="#b85450">① 判拼接等价</text>
  <text x="430" y="262" font-size="10" fill="#4a7a3a">② 长度取 gcd</text>
  <text x="430" y="276" font-size="10" fill="#888">O(n+m) / O(n+m)</text>
</svg>
