<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：K=3, quality=[3,1,10,10,1], wage=[4,8,2,2,7]</text>
  <text x="270" y="42" text-anchor="middle" font-size="11" fill="#888">按比率升序：w2(0.2,q10) · w3(0.2,q10) · w0(1.33,q3) · w4(7,q1) · w1(8,q1)</text>

  <!-- Step w2 -->
  <text x="40" y="74" font-size="12" fill="#446688" font-weight="bold">i = w2  ratio=0.2</text>
  <rect x="170" y="58" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="210" y="75" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">push q=10</text>
  <text x="264" y="74" font-size="11" fill="#666">堆={10} sum=10 size=2&lt;3</text>
  <path d="M 210 86 L 210 104" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- Step w3 -->
  <text x="40" y="122" font-size="12" fill="#446688" font-weight="bold">i = w3  ratio=0.2</text>
  <rect x="170" y="106" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="210" y="123" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">push q=10</text>
  <text x="264" y="122" font-size="11" fill="#666">堆={10,10} sum=20 size=3</text>
  <text x="264" y="136" font-size="10.5" fill="#999">ratio 相同但不是队长候选？</text>
  <path d="M 210 134 L 210 152" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- Step w0 -> candidate 1 -->
  <text x="40" y="172" font-size="12" fill="#d6a040" font-weight="bold">i = w0  ratio=1.33</text>
  <rect x="170" y="156" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="173" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">push q=3</text>
  <text x="264" y="170" font-size="11" fill="#666">堆={10,10,3} sum=23 size=3</text>
  <rect x="264" y="178" width="240" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="384" y="194" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">cost = 1.333 × 23 = 30.667 ← ans</text>
  <path d="M 210 184 L 210 212" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- Step w4 -->
  <text x="40" y="234" font-size="12" fill="#446688" font-weight="bold">i = w4  ratio=7</text>
  <rect x="170" y="218" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="210" y="235" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">push q=1</text>
  <text x="264" y="232" font-size="11" fill="#666">size=4&gt;3 → 弹出 q=10</text>
  <text x="264" y="248" font-size="11" fill="#666">堆={10,3,1} sum=14</text>
  <rect x="264" y="240" width="240" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="384" y="256" text-anchor="middle" font-size="11" fill="#999">cost = 7 × 14 = 98（更大，丢弃）</text>
  <path d="M 210 246 L 210 274" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- Step w1 -->
  <text x="40" y="296" font-size="12" fill="#446688" font-weight="bold">i = w1  ratio=8</text>
  <rect x="170" y="280" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="210" y="297" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">push q=1</text>
  <text x="264" y="294" font-size="11" fill="#666">size=4&gt;3 → 弹出 q=10</text>
  <text x="264" y="310" font-size="11" fill="#666">堆={3,1,1} sum=5</text>
  <rect x="264" y="302" width="240" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="384" y="318" text-anchor="middle" font-size="11" fill="#999">cost = 8 × 5 = 40（更大，丢弃）</text>

  <!-- Result -->
  <path d="M 210 308 L 210 358" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <rect x="32" y="362" width="476" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="48" y="384" font-size="13.5" fill="#4a7a3a" font-weight="bold">最终结果：ans = 30.66667</text>
  <text x="48" y="402" font-size="11" fill="#4a7a3a">最优组 = {w2, w3, w0}，队长 w0 比率 1.333，Σquality=23，工资按 1.333 计</text>

  <!-- summary -->
  <rect x="32" y="420" width="476" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="48" y="440" font-size="11" fill="#446688" font-weight="bold">关键：比率最大的工人定单价；质量大的工人优先被堆踢出</text>
  <text x="48" y="456" font-size="11" fill="#446688">遍历中 ratio 只增，sumq 由大顶堆动态维护 K 个最小质量，ans 取所有候选的最小值</text>
</svg>
