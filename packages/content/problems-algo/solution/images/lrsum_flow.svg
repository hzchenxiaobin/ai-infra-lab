<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：求总和 T → 滚动 leftSum 一遍扫描</text>

  <!-- Step 1: total = sum(nums) -->
  <rect x="160" y="44" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="61" text-anchor="middle" font-size="11.5" fill="#888">第 1 步</text>
  <text x="270" y="78" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">total = Σ nums （一趟求和）</text>

  <path d="M 270 86 L 270 100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: leftSum = 0 -->
  <rect x="160" y="104" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="121" text-anchor="middle" font-size="11.5" fill="#888">第 2 步（初始化）</text>
  <text x="270" y="138" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">leftSum = 0</text>

  <path d="M 270 146 L 270 160" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop diamond -->
  <polygon points="270,162 380,210 270,258 160,210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="206" text-anchor="middle" font-size="11.5" fill="#888">遍历</text>
  <text x="270" y="222" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">i = 0 … n−1</text>
  <text x="270" y="238" text-anchor="middle" font-size="10.5" fill="#888">每个 x = nums[i]</text>

  <path d="M 270 258 L 270 272" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- three ops inside loop -->
  <rect x="60" y="276" width="420" height="92" fill="#fafafa" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="293" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">循环体（注意：先用后加）</text>

  <rect x="78" y="300" width="384" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="319" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">① rightSum = total − leftSum − x</text>

  <rect x="78" y="332" width="384" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="351" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">② answer[i] = | leftSum − rightSum | ；</text>
  <text x="462" y="351" font-size="11.5" fill="#4a7a3a" font-weight="bold">③ leftSum += x</text>

  <!-- loop back arrow to diamond right side -->
  <path d="M 480 316 Q 510 316 510 210 Q 510 182 380 210" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5,4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="520" y="266" text-anchor="middle" font-size="10.5" fill="#4a7a3a">回到</text>
  <text x="520" y="280" text-anchor="middle" font-size="10.5" fill="#4a7a3a">下一个 i</text>

  <!-- exit arrow to return -->
  <path d="M 270 380 L 270 396" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: return answer -->
  <rect x="160" y="400" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="417" text-anchor="middle" font-size="11.5" fill="#888">第 4 步</text>
  <text x="270" y="434" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">返回 answer</text>

  <!-- side note -->
  <rect x="60" y="412" width="86" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="103" y="425" text-anchor="middle" font-size="9.5" fill="#888">末步 leftSum</text>
  <text x="103" y="438" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">= total</text>
</svg>
