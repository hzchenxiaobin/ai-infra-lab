<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心递推：枚举根 i，左右子树独立计数</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">选定根 i 后，左子树 i-1 个节点、右子树 n-i 个节点，各自独立计数后相乘</text>

  <!-- ===== Root ===== -->
  <ellipse cx="260" cy="92" rx="46" ry="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="88" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">根 = i</text>
  <text x="260" y="102" text-anchor="middle" font-size="9" fill="#b85450">值 {1..n} 中任选</text>

  <!-- arrows root -> left / right -->
  <path d="M 226 108 Q 180 140 150 168" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 294 108 Q 340 140 370 168" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Left subtree box ===== -->
  <rect x="60" y="160" width="180" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="182" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">左子树</text>
  <text x="150" y="200" text-anchor="middle" font-size="10" fill="#333">值 {1, …, i-1}</text>
  <text x="150" y="216" text-anchor="middle" font-size="10" fill="#333">共 i-1 个节点</text>
  <text x="150" y="232" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">→ G(i-1) 种</text>

  <!-- ===== Right subtree box ===== -->
  <rect x="280" y="160" width="180" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="370" y="182" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">右子树</text>
  <text x="370" y="200" text-anchor="middle" font-size="10" fill="#333">值 {i+1, …, n}</text>
  <text x="370" y="216" text-anchor="middle" font-size="10" fill="#333">共 n-i 个节点</text>
  <text x="370" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">→ G(n-i) 种</text>

  <!-- multiply sign between boxes -->
  <circle cx="260" cy="199" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="205" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">×</text>

  <!-- ===== Formula ===== -->
  <rect x="40" y="268" width="440" height="64" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">G(n) = Σ G(i-1) · G(n-i)</text>
  <text x="260" y="310" text-anchor="middle" font-size="9" fill="#888">乘法原理：左右独立 → 相乘；加法原理：根互斥 → 求和</text>
  <text x="260" y="324" text-anchor="middle" font-size="9" fill="#888">BST 结构只依赖节点个数，与具体数值无关</text>
</svg>
