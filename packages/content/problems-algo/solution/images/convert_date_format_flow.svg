<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：FROM Days → DATE_FORMAT 逐行格式化 → SELECT 投影</text>

  <!-- Step 1: Input -->
  <rect x="120" y="42" width="320" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">输入：Days 表（n 行 date 类型日期）</text>

  <path d="M280 76 L280 92" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: DATE_FORMAT -->
  <rect x="40" y="94" width="480" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="60" y="114" font-size="10" fill="#d6a040" font-weight="bold">① DATE_FORMAT(day, '%W, %M %e, %Y')：逐行把 date 转成字符串</text>
  <text x="60" y="130" font-size="9" fill="#d6a040">每个日期按格式串渲染：%W→星期名、%M→月份名、%e→日、%Y→年，字面量原样保留</text>
  <text x="60" y="144" font-size="8.5" fill="#888">⚠ 这是 SELECT 列表内的标量函数，对每行求值一次，不改变行数；类型由 date 变为 string</text>

  <path d="M280 158 L280 174" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 3: SELECT projection -->
  <rect x="80" y="176" width="400" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="196" font-size="10" fill="#4a7a3a" font-weight="bold">② SELECT ... AS day：投影输出，列名仍叫 day</text>
  <text x="100" y="212" font-size="9" fill="#4a7a3a">无 WHERE / GROUP BY / 聚合——纯投影查询，行数与输入一致</text>
  <text x="100" y="224" font-size="8.5" fill="#888">列名保留 day：题目要求输出列也叫 day（类型已从 date 变为字符串）</text>

  <path d="M280 228 L280 244" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Output -->
  <rect x="100" y="246" width="360" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="267" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">输出：n 行字符串（"星期, 月份 日, 年"）</text>

  <!-- ===== Right side: SQL clause execution order ===== -->
  <rect x="430" y="94" width="120" height="184" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="490" y="112" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">SQL 执行顺序</text>
  <line x1="440" y1="118" x2="540" y2="118" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="445" y="132" font-size="8" fill="#446688" font-weight="bold">1. FROM ✓</text>
  <text x="455" y="144" font-size="7" fill="#446688">读 Days</text>
  <text x="445" y="160" font-size="8" fill="#888">2. WHERE（无）</text>
  <text x="445" y="176" font-size="8" fill="#888">3. GROUP BY（无）</text>
  <text x="445" y="192" font-size="8" fill="#888">4. HAVING（无）</text>
  <text x="445" y="208" font-size="8" fill="#4a7a3a" font-weight="bold">5. SELECT ✓</text>
  <text x="455" y="220" font-size="7" fill="#4a7a3a">DATE_FORMAT</text>
  <text x="455" y="232" font-size="7" fill="#4a7a3a">+ AS day</text>
  <text x="445" y="248" font-size="8" fill="#888">6. ORDER BY（无）</text>
  <text x="445" y="264" font-size="8" fill="#888">7. LIMIT（无）</text>
  <text x="445" y="276" font-size="7" fill="#b85450">⚠ 纯投影查询</text>

  <!-- ===== Bottom: row flow ===== -->
  <rect x="20" y="296" width="520" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">行数流（示例：3 行输入）</text>

  <!-- input rows -->
  <rect x="30" y="326" width="120" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="340" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">Days（3 行 date）</text>
  <text x="90" y="354" text-anchor="middle" font-size="8" fill="#333" font-family="monospace">2022-04-12</text>
  <text x="90" y="365" text-anchor="middle" font-size="8" fill="#333" font-family="monospace">2021-08-09</text>
  <text x="90" y="376" text-anchor="middle" font-size="8" fill="#333" font-family="monospace">2020-06-26</text>

  <path d="M150 350 L185 350" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="167" y="344" text-anchor="middle" font-size="7" fill="#d6a040">FORMAT</text>

  <!-- formatted -->
  <rect x="190" y="326" width="160" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="270" y="340" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">格式化（仍 3 行）</text>
  <text x="270" y="354" text-anchor="middle" font-size="7.5" fill="#333" font-family="monospace">Tuesday, April 12, 2022</text>
  <text x="270" y="365" text-anchor="middle" font-size="7.5" fill="#333" font-family="monospace">Monday, August 9, 2021</text>
  <text x="270" y="376" text-anchor="middle" font-size="7.5" fill="#333" font-family="monospace">Friday, June 26, 2020</text>

  <path d="M360 350 L395 350" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="377" y="344" text-anchor="middle" font-size="7" fill="#b85450">SELECT</text>

  <!-- output -->
  <rect x="400" y="326" width="130" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="465" y="340" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">输出 day（3 行）</text>
  <text x="465" y="356" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">3 行字符串</text>
  <text x="465" y="370" text-anchor="middle" font-size="7.5" fill="#888">行数不变</text>

  <!-- bottom note -->
  <rect x="20" y="404" width="520" height="40" fill="#f5f5f5" stroke="#888" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="422" text-anchor="middle" font-size="9.5" fill="#446688" font-family="monospace">SELECT DATE_FORMAT(day, '%W, %M %e, %Y') AS day FROM Days;</text>
  <text x="280" y="436" text-anchor="middle" font-size="8.5" fill="#888">FROM 读全表 → SELECT 内 DATE_FORMAT 逐行格式化 → 投影输出，行数始终 = n</text>
</svg>
