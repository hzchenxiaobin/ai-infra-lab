<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：乘法 ×2 全体共享，加法 +1 逐元素独立</text>

  <!-- operations box -->
  <rect x="30" y="44" width="520" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="290" y="66" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">两种操作（从全 0 数组构造 nums）</text>
  <text x="60" y="88" font-size="11.5" fill="#444">add：任选一个元素 +1（作用在单个元素，调用 1 次）</text>
  <text x="60" y="104" font-size="11.5" fill="#444">mul：所有元素 ×2（作用在全体元素，调用 1 次）</text>

  <!-- key insight -->
  <rect x="30" y="118" width="520" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="140" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">逆向思考 + 二进制分解</text>
  <text x="290" y="158" text-anchor="middle" font-size="11" fill="#555">每个 1 位 → 一次 add（按元素计）；位宽列数 − 1 → mul 次数（全体共享取最大）</text>

  <!-- binary table for [1, 5] -->
  <text x="180" y="194" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">nums = [1, 5]，按 3 位对齐</text>

  <!-- column headers -->
  <text x="162" y="212" text-anchor="middle" font-size="10.5" fill="#888">位2(×4)</text>
  <text x="210" y="212" text-anchor="middle" font-size="10.5" fill="#888">位1(×2)</text>
  <text x="258" y="212" text-anchor="middle" font-size="10.5" fill="#888">位0(×1)</text>

  <!-- element 1 row -->
  <rect x="118" y="218" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="140" y="240" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="140" y="218" width="44" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="162" y="240" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <rect x="188" y="218" width="44" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="210" y="240" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <rect x="236" y="218" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="258" y="240" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="296" y="240" font-size="10.5" fill="#4a7a3a">← 1 个 add</text>

  <!-- element 5 row -->
  <rect x="118" y="256" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="140" y="278" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="140" y="256" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="162" y="278" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="188" y="256" width="44" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="210" y="278" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <rect x="236" y="256" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="258" y="278" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="296" y="278" font-size="10.5" fill="#4a7a3a">← 2 个 add</text>

  <!-- brace + annotation for mul -->
  <path d="M 140 300 Q 199 312 258 300" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="199" y="330" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3 个位列 → 3 − 1 = 2 次 mul（全体共享）</text>

  <!-- formula box -->
  <rect x="30" y="346" width="520" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="368" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">闭式公式</text>
  <text x="290" y="390" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">ans = Σ popcount(nums[i])  +  max(0, max bit_length(nums[i]) − 1)</text>
  <text x="290" y="408" text-anchor="middle" font-size="11" fill="#555">加法 = 所有元素 1 的个数之和；乘法 = 最大位宽 − 1（全 0 时为 0）</text>

  <!-- verification -->
  <rect x="40" y="426" width="500" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="443" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">[1,5]：add = 1+2 = 3，mul = 3−1 = 2 → 3+2 = 5 ✓</text>
</svg>
