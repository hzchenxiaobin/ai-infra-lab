<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：拆分 → 最小表示 → 指纹去重</text>

  <!-- 左侧主流程 -->
  <rect x="30" y="40" width="230" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="145" y="61" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">① 取下一个词 w</text>

  <path d="M 145 74 L 145 90" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="30" y="94" width="230" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="145" y="115" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">② 拆分：E = w[0::2]，O = w[1::2]</text>

  <path d="M 145 128 L 145 144" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="30" y="148" width="230" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="145" y="169" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">③ rE = minrot(E)，rO = minrot(O)</text>

  <path d="M 145 182 L 145 198" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="30" y="202" width="230" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="145" y="223" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">④ 指纹 (rE, rO) 加入哈希集合</text>

  <path d="M 145 236 L 145 250" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="145,252 215,282 145,312 75,282" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="145" y="286" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">还有词？</text>

  <path d="M 75 282 C 22 282, 22 57, 26 57" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="58" y="272" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="24" y="170" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">下一词</text>

  <path d="M 145 312 L 145 324" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="155" y="322" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="75" y="328" width="140" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="145" y="346" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回不同指纹数</text>

  <!-- 右侧：最小表示法速览 -->
  <rect x="285" y="40" width="220" height="254" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="62" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">最小表示法速览（O(n)）</text>
  <text x="297" y="86" text-anchor="start" font-size="9.5" fill="#33506b" filter="url(#rough2)">s2 = s + s；i = 0，j = 1，k = 0</text>
  <text x="297" y="108" text-anchor="start" font-size="9.5" fill="#33506b" filter="url(#rough2)">s2[i+k] == s2[j+k] → k++</text>
  <text x="297" y="130" text-anchor="start" font-size="9.5" fill="#33506b" filter="url(#rough2)">失配：大的一侧 += k+1</text>
  <text x="297" y="146" text-anchor="start" font-size="9" fill="#666" filter="url(#rough2)">（i..i+k 整段出局，被另一侧压制）</text>
  <text x="297" y="168" text-anchor="start" font-size="9.5" fill="#33506b" filter="url(#rough2)">i == j → j++；k 归零</text>
  <text x="297" y="190" text-anchor="start" font-size="9.5" fill="#33506b" filter="url(#rough2)">i、j、k 任一抵达 n → 结束</text>
  <text x="297" y="212" text-anchor="start" font-size="9.5" fill="#33506b" filter="url(#rough2)">最小旋转起点 = min(i, j)</text>
  <text x="297" y="240" text-anchor="start" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">例：minrot("ngz") = "gzn"</text>
  <text x="297" y="256" text-anchor="start" font-size="9" fill="#666" filter="url(#rough2)">（ngz / gzn / zng 三个旋转取最小）</text>
  <text x="297" y="278" text-anchor="start" font-size="9" fill="#8a6d1f" filter="url(#rough2)">均摊：比较数 = 前进量 ≤ 2n</text>
  <text x="297" y="290" text-anchor="start" font-size="9" fill="#8a6d1f" filter="url(#rough2)">加收尾 ≤ 3n 次比较，严格线性</text>

  <!-- 右下：复杂度卡 -->
  <rect x="285" y="304" width="220" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="322" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">总时间 O(Σ|w|)，空间 O(Σ|w|)</text>
  <text x="395" y="339" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">Σ|w| ≤ 5×10⁵ ⇒ 仅百万级比较</text>
</svg>
