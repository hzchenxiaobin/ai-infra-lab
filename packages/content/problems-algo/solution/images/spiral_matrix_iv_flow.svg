<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：四边界收缩 top / bottom / left / right</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">每填完一条边，对应边界收缩 1；第 ③④ 步需 if 守卫防反向覆盖</text>

  <!-- ===== 5x5 grid, cell=36, origin (30,80) ===== -->
  <!-- outer ring (blue) -->
  <rect x="30" y="80" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="66" y="80" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="102" y="80" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="138" y="80" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="174" y="80" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="30" y="116" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="174" y="116" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="30" y="152" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="174" y="152" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="30" y="188" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="174" y="188" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="30" y="224" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="66" y="224" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="102" y="224" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="138" y="224" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="174" y="224" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <!-- middle ring (orange) -->
  <rect x="66" y="116" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="102" y="116" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="138" y="116" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="66" y="152" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="138" y="152" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="66" y="188" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="102" y="188" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="138" y="188" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <!-- center (green) -->
  <rect x="102" y="152" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>

  <!-- dashed inner shrink rect (3x3) -->
  <rect x="64" y="114" width="112" height="112" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" rx="4" filter="url(#rough2)"/>
  <text x="120" y="108" text-anchor="middle" font-size="9" fill="#b85450">收缩后边界</text>

  <!-- boundary movement arrows -->
  <path d="M 120 58 L 120 74" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="54" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">top++ ↓</text>

  <path d="M 120 282 L 120 266" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="296" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑ bottom−−</text>

  <path d="M 16 170 L 28 170" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="14" y="162" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">left++ →</text>

  <path d="M 224 170 L 212 170" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="226" y="162" font-size="10" fill="#b85450" font-weight="bold">← right−−</text>

  <text x="120" y="330" text-anchor="middle" font-size="10" fill="#555">蓝=外圈  橙=中圈  绿=中心  填完一圈，边界各收缩 1</text>

  <!-- ===== right side: step boxes ===== -->
  <rect x="252" y="68" width="290" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="266" y="93" font-size="11" fill="#333" font-weight="bold">① 上行 (top, left→right)：写 head 值；top++</text>

  <rect x="252" y="118" width="290" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="266" y="143" font-size="11" fill="#333" font-weight="bold">② 右列 (top→bottom, right)：写 head 值；right−−</text>

  <rect x="252" y="168" width="290" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="266" y="193" font-size="11" fill="#333" font-weight="bold">③ 下行 (bottom, right→left)；bottom−−</text>
  <text x="266" y="205" font-size="9.5" fill="#b85450">⚠ 执行前需 if (top ≤ bottom)</text>

  <rect x="252" y="218" width="290" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="266" y="243" font-size="11" fill="#333" font-weight="bold">④ 左列 (bottom→top, left)；left++</text>
  <text x="266" y="255" font-size="9.5" fill="#b85450">⚠ 执行前需 if (left ≤ right)</text>

  <!-- arrows between steps -->
  <path d="M 397 108 L 397 118" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 397 158 L 397 168" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 397 208 L 397 218" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- note box -->
  <rect x="252" y="272" width="290" height="40" fill="#fafafa" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="266" y="290" font-size="10.5" fill="#5a4a1a">head == null → 写 −1；写满 m×n 格即止</text>
  <text x="266" y="304" font-size="10.5" fill="#5a4a1a">完整矩形边缘向内 → 无需 visited，O(1) 额外空间</text>

  <!-- loop-back arrow -->
  <path d="M 544 238 C 558 170 558 100 544 88" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrg)" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="552" y="164" font-size="9" fill="#888">while</text>
  <text x="552" y="176" font-size="9" fill="#888">count&lt;m×n</text>
</svg>
