<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：k &gt; 0 只查 x+k，k = 0 数重复元素</text>

  <!-- ===== Case 1: k > 0 ===== -->
  <rect x="20" y="40" width="540" height="170" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <rect x="20" y="40" width="540" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">情形一：k = 2 &gt; 0  →  对每个唯一值 x，查 x + k 是否存在</text>

  <text x="40" y="92" font-size="11" fill="#888">去重后唯一值：</text>
  <!-- unique values as boxes -->
  <rect x="50" y="100" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="121" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <rect x="130" y="100" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="121" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <rect x="210" y="100" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="121" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <rect x="290" y="100" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="315" y="121" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>

  <!-- arrows: 1 -> 3 (1+2=3 exists) -->
  <path d="M 100 116 L 128 116" stroke="#82b366" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="114" y="152" text-anchor="middle" font-size="9.5" fill="#4a7a3a">1+2=3 ✓</text>

  <!-- arrows: 3 -> 5 (3+2=5 exists) -->
  <path d="M 180 116 L 288 116" stroke="#82b366" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="234" y="152" text-anchor="middle" font-size="9.5" fill="#4a7a3a">3+2=5 ✓</text>

  <!-- 4 -> 6 (not exists) -->
  <path d="M 260 116 L 360 116" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="310" y="152" text-anchor="middle" font-size="9.5" fill="#b85450">4+2=6 ✗</text>

  <!-- 5 -> 7 (not exists) -->
  <path d="M 340 116 L 440 116" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="390" y="152" text-anchor="middle" font-size="9.5" fill="#b85450">5+2=7 ✗</text>

  <rect x="400" y="100" width="140" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="121" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">命中 2 对</text>

  <text x="40" y="178" font-size="10.5" fill="#888" font-style="italic">只需单向查 x+k，不会重复计数：(x, x+k) 只在遍历到 x 时计入</text>
  <text x="40" y="194" font-size="10.5" fill="#888" font-style="italic">若也查 x−k 则 (x, x+k) 会在遍历到 x 和 x+k 时各算一次 → 重复</text>

  <!-- ===== Case 2: k == 0 ===== -->
  <rect x="20" y="220" width="540" height="180" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <rect x="20" y="220" width="540" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="240" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">情形二：k = 0  →  |x − x| = 0，需同一值出现至少 2 次</text>

  <text x="40" y="272" font-size="11" fill="#888">原始数组：</text>
  <rect x="120" y="258" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="277" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="162" y="258" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="277" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="204" y="258" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="224" y="277" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="246" y="258" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="266" y="277" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="288" y="258" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="277" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <text x="40" y="312" font-size="11" fill="#888">频次统计：</text>
  <rect x="120" y="298" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1 → 2</text>
  <text x="190" y="316" text-anchor="middle" font-size="10" fill="#82b366">≥2 ✓</text>

  <rect x="226" y="298" width="100" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="251" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3 → 1</text>
  <text x="296" y="316" text-anchor="middle" font-size="10" fill="#b85450">&lt;2 ✗</text>

  <rect x="332" y="298" width="100" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="357" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5 → 1</text>
  <text x="402" y="316" text-anchor="middle" font-size="10" fill="#b85450">&lt;2 ✗</text>

  <rect x="438" y="298" width="100" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="463" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4 → 1</text>
  <text x="508" y="316" text-anchor="middle" font-size="10" fill="#b85450">&lt;2 ✗</text>

  <rect x="120" y="340" width="418" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="329" y="360" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">只有 1 出现了 2 次 → (1, 1) 是唯一的 0-diff 数对</text>
  <text x="329" y="376" text-anchor="middle" font-size="10.5" fill="#888">k = 0 时每个值最多贡献 1 对，不管出现 3 次还是 10 次</text>
</svg>
