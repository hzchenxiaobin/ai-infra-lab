<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：对每个查询截取、排序、逐对验证</text>

  <!-- Start -->
  <ellipse cx="270" cy="52" rx="96" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">开始（对每个查询 i）</text>

  <path d="M 270 70 L 270 86" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Extract subarray -->
  <rect x="130" y="88" width="280" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="108" text-anchor="middle" font-size="11" fill="#333">截取 sub = nums[l[i]..r[i]]</text>

  <path d="M 270 120 L 270 136" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Sort -->
  <rect x="180" y="138" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="158" text-anchor="middle" font-size="11" fill="#333">排序 sub</text>

  <path d="M 270 170 L 270 186" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Compute d, init j -->
  <rect x="150" y="188" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="208" text-anchor="middle" font-size="11" fill="#333">d = sub[1] − sub[0];   j = 2</text>

  <path d="M 270 220 L 270 236" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: j < len(sub)? -->
  <polygon points="270,238 380,278 270,318 160,278" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="275" text-anchor="middle" font-size="11" fill="#333">j &lt; len(sub)?</text>
  <text x="270" y="290" text-anchor="middle" font-size="10" fill="#888">还有未验证的相邻对</text>

  <!-- No branch -> answer = true -->
  <path d="M 380 278 L 430 278" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="394" y="270" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="430" y="262" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="282" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">answer = true ✓</text>

  <!-- Yes branch -> diff check -->
  <path d="M 270 318 L 270 338" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="334" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Decision: sub[j]-sub[j-1] == d? -->
  <polygon points="270,340 390,378 270,416 150,378" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="375" text-anchor="middle" font-size="11" fill="#333">sub[j] − sub[j−1] == d?</text>
  <text x="270" y="390" text-anchor="middle" font-size="10" fill="#888">相邻差等于公差</text>

  <!-- No branch -> answer = false -->
  <path d="M 390 378 L 430 378" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="370" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="430" y="362" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="382" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">answer = false ✗</text>

  <!-- Yes branch -> j++ -->
  <path d="M 270 416 L 270 432" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="428" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="230" y="434" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="453" text-anchor="middle" font-size="11" fill="#333">j++</text>

  <!-- j++ loop back to j<len? diamond -->
  <path d="M 230 449 L 110 449 L 110 278 L 160 278" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="362" font-size="9" fill="#4a7a3a">内循环</text>

  <!-- Converge: both answers -> next query -->
  <path d="M 480 294 L 480 362" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <!-- Next query loop back: from false box right side up to start -->
  <path d="M 530 378 L 530 52 L 366 52" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="510" y="220" font-size="9" fill="#d6a040" font-weight="bold">下一查询</text>

  <!-- Legend -->
  <rect x="20" y="468" width="280" height="24" fill="#fff" stroke="#eee" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="30" y="483" font-size="9" fill="#888" font-weight="bold">图例：</text>
  <rect x="68" y="476" width="14" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="86" y="484" font-size="9" fill="#555">处理</text>
  <polygon points="120,476 134,476 127,484" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="140" y="484" font-size="9" fill="#555">判定</text>
  <line x1="170" y1="480" x2="186" y2="480" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="192" y="484" font-size="9" fill="#555">循环回边</text>
  <line x1="246" y1="480" x2="262" y2="480" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="268" y="484" font-size="9" fill="#555">下一查询</text>
</svg>
