<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：逐字符扫描，start 指针维护当前段</text>

  <!-- ===== A: per word ===== -->
  <rect x="210" y="44" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">对每个 word w</text>
  <path d="M 290 74 L 290 88" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== B: init ===== -->
  <rect x="210" y="88" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="290" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">start = 0;  i = 0</text>
  <path d="M 290 116 L 290 132" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== C0: i < n ? ===== -->
  <path d="M 290 132 L 378 156 L 290 180 L 202 156 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="160" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i &lt; n ?</text>
  <!-- 是 -> down -->
  <path d="M 290 180 L 290 196" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="194" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>
  <!-- 否 -> right to tail F -->
  <path d="M 378 156 L 446 156" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="408" y="150" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- ===== C: w[i] == sep ? ===== -->
  <path d="M 290 196 L 382 220 L 290 244 L 198 220 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="217" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">w[i] == sep ?</text>
  <text x="290" y="233" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">(切点)</text>
  <!-- 是 -> down -->
  <path d="M 290 244 L 290 260" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="256" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>
  <!-- 否 -> left, i++, loop back to C0 -->
  <path d="M 198 220 L 150 220" stroke="#888" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="214" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="172" y="234" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i++</text>

  <!-- ===== D: i > start ? (段长>0) ===== -->
  <path d="M 290 260 L 378 284 L 290 308 L 202 284 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="281" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i &gt; start ?</text>
  <text x="290" y="297" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">(段长&gt;0)</text>
  <!-- 是 -> left to push rect -->
  <path d="M 202 284 L 140 284" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="175" y="278" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <!-- 否 -> down (skip) -->
  <path d="M 290 308 L 290 324" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="300" y="320" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="318" y="320" font-size="9" fill="#b85450" filter="url(#rough2)">(空段跳过)</text>

  <!-- push rect (是 branch) -->
  <rect x="30" y="271" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="85" y="288" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出 w[start..i)</text>
  <!-- push -> down x=85 -> right y=420 -> up x=290 into E bottom -->
  <path d="M 85 297 L 85 420" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 85 420 L 290 420" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 290 420 L 290 404" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- ===== E: start = i+1; i++ ===== -->
  <rect x="210" y="372" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="392" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">start = i+1;  i++</text>
  <!-- E -> left to x=150 channel -> up to C0 left -->
  <path d="M 210 388 L 150 388" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 150 388 L 150 156" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 150 156 L 202 156" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="272" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">回到 i&lt;n?</text>

  <!-- ===== F: tail handling ===== -->
  <path d="M 446 156 L 446 156" stroke="none"/>
  <path d="M 430 224 L 505 250 L 430 276 L 355 250 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="247" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">start &lt; n ?</text>
  <text x="430" y="263" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">(尾段)</text>
  <!-- 是 -> down pushN -->
  <path d="M 430 276 L 430 296" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="440" y="290" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <!-- 否 -> right then down -->
  <path d="M 505 250 L 540 250 L 540 388" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="520" y="244" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- pushN (tail) -->
  <rect x="365" y="296" width="130" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="430" y="313" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出 w[start..n)</text>
  <!-- pushN -> down to next word -->
  <path d="M 430 322 L 430 372" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- next word box -->
  <rect x="365" y="372" width="130" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="430" y="392" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">下一个 word</text>
  <!-- 否 branch arrow into next word -->
  <path d="M 540 388 L 495 388" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- outer loop back to A -->
  <path d="M 540 388 L 540 388" stroke="none"/>
  <path d="M 540 372 L 540 59" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 540 59 L 370 59" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="548" y="220" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)" transform="rotate(90 548 220)">外层循环</text>

  <!-- legend / note -->
  <text x="290" y="440" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">虚线 = 循环回流；一次遍历 O(L)，L 为所有字符总数</text>
</svg>
