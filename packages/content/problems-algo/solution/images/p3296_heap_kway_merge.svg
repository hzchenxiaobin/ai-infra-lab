<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">堆解法 = 完成时刻的 k 路归并，取全局第 H 小</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">示例 2：每行是一个工人「挖完第 k 米的累计耗时」序列（天然递增）</text>

  <text x="122" y="50" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">k=1</text>
  <text x="180" y="50" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">k=2</text>
  <text x="238" y="50" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">k=3</text>
  <text x="296" y="50" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">k=4</text>

  <!-- 行 1：w=3 -->
  <rect x="22" y="54" width="62" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="53" y="74" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">工人 w=3</text>
  <rect x="96" y="54" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="122" y="70" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="122" y="82" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">③</text>
  <rect x="154" y="54" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="180" y="70" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="180" y="82" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">⑦</text>
  <rect x="212" y="54" width="52" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="238" y="74" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">18</text>
  <rect x="270" y="54" width="52" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="296" y="74" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">30</text>

  <!-- 行 2：w=2 -->
  <rect x="22" y="94" width="62" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="53" y="114" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">工人 w=2</text>
  <rect x="96" y="94" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="122" y="110" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="122" y="122" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">①</text>
  <rect x="154" y="94" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="180" y="110" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="180" y="122" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">⑤</text>
  <rect x="212" y="94" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="238" y="110" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">12</text>
  <text x="238" y="122" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">⑧</text>
  <rect x="270" y="94" width="52" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="296" y="114" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">20</text>

  <!-- 行 3：w=2 -->
  <rect x="22" y="134" width="62" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="53" y="154" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">工人 w=2</text>
  <rect x="96" y="134" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="122" y="150" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="122" y="162" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">②</text>
  <rect x="154" y="134" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="180" y="150" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="180" y="162" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">⑥</text>
  <rect x="212" y="134" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="238" y="150" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">12</text>
  <text x="238" y="162" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">⑨</text>
  <rect x="270" y="134" width="52" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="296" y="154" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">20</text>

  <!-- 行 4：w=4 -->
  <rect x="22" y="174" width="62" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="53" y="194" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">工人 w=4</text>
  <rect x="96" y="174" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="122" y="190" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="122" y="202" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">④</text>
  <rect x="154" y="174" width="52" height="32" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="180" y="190" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">12</text>
  <text x="180" y="202" text-anchor="middle" font-size="8.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">⑩</text>
  <rect x="212" y="174" width="52" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="238" y="194" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">24</text>
  <rect x="270" y="174" width="52" height="32" fill="none" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>

  <!-- 图例 -->
  <rect x="336" y="54" width="164" height="50" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5,3" rx="8" filter="url(#rough2)"/>
  <rect x="346" y="62" width="22" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="376" y="73" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">取走 = 全局前 10 小</text>
  <rect x="346" y="82" width="22" height="14" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="376" y="93" font-size="9.5" fill="#999" filter="url(#rough2)">不取</text>

  <path d="M 208 190 L 300 190" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="306" y="194" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">第 H=10 小 = 12 = 答案</text>

  <!-- 中部说明 -->
  <rect x="40" y="216" width="440" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="231" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">小顶堆：键 = 「该工人再挖一米后的总耗时」w·k(k+1)/2</text>
  <text x="260" y="245" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">每弹出一个完成时刻，压入同工人的下一个 → 连弹 H 次 = 前 H 小</text>

  <!-- 底部警告 -->
  <rect x="40" y="258" width="440" height="90" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="10.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">⚠️ 键不能换成「下一米的边际成本 w·k」—— 那是最小化 sum 的贪心</text>
  <text x="260" y="293" text-anchor="middle" font-size="10" fill="#8a3a34" filter="url(#rough2)">反例：w = [1, 4]，H = 3</text>
  <text x="260" y="309" text-anchor="middle" font-size="10" fill="#8a3a34" filter="url(#rough2)">边际贪心：挑最便宜的边际 1、2、3 全给 w=1 → 耗时 [6, 0] → max = 6 ✗</text>
  <text x="260" y="325" text-anchor="middle" font-size="10" fill="#8a3a34" filter="url(#rough2)">最优分工 [2, 1] → 耗时 [3, 4] → max = 4 ✓</text>
  <text x="260" y="341" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">目标是 max 不是 sum：拿「总耗时」当键，弹出的第 H 个恰好压着答案</text>
</svg>
