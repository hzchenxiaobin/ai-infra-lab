<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：N = 332</text>

  <!-- table header -->
  <rect x="20" y="46" width="60" height="28" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="65" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">i</text>
  <rect x="80" y="46" width="160" height="28" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="65" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">比较</text>
  <rect x="240" y="46" width="160" height="28" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="320" y="65" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">动作</text>
  <rect x="400" y="46" width="120" height="28" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="460" y="65" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">digits / mark</text>

  <!-- row 1: i=2 -->
  <rect x="20" y="78" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="100" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <rect x="80" y="78" width="160" height="34" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="160" y="100" text-anchor="middle" font-size="11" fill="#b85450">digits[1]=3 &gt; digits[2]=2</text>
  <rect x="240" y="78" width="160" height="34" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="100" text-anchor="middle" font-size="11" fill="#333">digits[1]−1→2, mark=2</text>
  <rect x="400" y="78" width="120" height="34" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="460" y="100" text-anchor="middle" font-size="11" fill="#333">[3,2,2] m=2</text>

  <!-- row 2: i=1 -->
  <rect x="20" y="116" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="138" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="80" y="116" width="160" height="34" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="160" y="138" text-anchor="middle" font-size="11" fill="#b85450">digits[0]=3 &gt; digits[1]=2</text>
  <rect x="240" y="116" width="160" height="34" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="138" text-anchor="middle" font-size="11" fill="#333">digits[0]−1→2, mark=1</text>
  <rect x="400" y="116" width="120" height="34" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="460" y="138" text-anchor="middle" font-size="11" fill="#333">[2,2,2] m=1</text>

  <!-- row 3: exit -->
  <rect x="20" y="154" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="176" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">出循环</text>
  <rect x="80" y="154" width="160" height="34" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="160" y="176" text-anchor="middle" font-size="10" fill="#888">i &lt; 1, 扫描结束</text>
  <rect x="240" y="154" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="320" y="176" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">digits[1..2] = 9</text>
  <rect x="400" y="154" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="460" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">[2,9,9]</text>

  <!-- digit boxes walkthrough -->
  <text x="40" y="220" font-size="12" fill="#666" font-weight="bold">逐步数值变化：</text>

  <!-- 332 -->
  <rect x="40" y="232" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="59" y="256" text-anchor="middle" font-size="15" fill="#333">3</text>
  <rect x="80" y="232" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="99" y="256" text-anchor="middle" font-size="15" fill="#333">3</text>
  <rect x="120" y="232" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="139" y="256" text-anchor="middle" font-size="15" fill="#333">2</text>

  <path d="M 168 250 L 196 250" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="182" y="244" text-anchor="middle" font-size="9" fill="#888">i=2</text>

  <!-- 322 -->
  <rect x="206" y="232" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="225" y="256" text-anchor="middle" font-size="15" fill="#333">3</text>
  <rect x="246" y="232" width="38" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="265" y="256" text-anchor="middle" font-size="15" fill="#d6a040">2</text>
  <rect x="286" y="232" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="305" y="256" text-anchor="middle" font-size="15" fill="#333">2</text>

  <path d="M 334 250 L 362 250" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="348" y="244" text-anchor="middle" font-size="9" fill="#888">i=1</text>

  <!-- 222 -->
  <rect x="372" y="232" width="38" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="391" y="256" text-anchor="middle" font-size="15" fill="#d6a040">2</text>
  <rect x="412" y="232" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="431" y="256" text-anchor="middle" font-size="15" fill="#333">2</text>
  <rect x="452" y="232" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="471" y="256" text-anchor="middle" font-size="15" fill="#333">2</text>

  <path d="M 490 250 L 510 250" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- final 299 -->
  <rect x="372" y="300" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="391" y="324" text-anchor="middle" font-size="15" fill="#4a7a3a">2</text>
  <rect x="412" y="300" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="431" y="324" text-anchor="middle" font-size="15" fill="#4a7a3a">9</text>
  <rect x="452" y="300" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="471" y="324" text-anchor="middle" font-size="15" fill="#4a7a3a">9</text>

  <path d="M 410 274 Q 410 286 410 296" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="288" font-size="10" fill="#4a7a3a" font-weight="bold">mark 起置9</text>

  <text x="40" y="324" font-size="13" fill="#4a7a3a" font-weight="bold">结果 = 299</text>
</svg>
