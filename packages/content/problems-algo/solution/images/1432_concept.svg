<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：两次操作独立，各自贪心</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888">max(a − b) = max(a) − min(b)，分别求 a 最大与 b 最小</text>

  <!-- ===== Maximize a section ===== -->
  <rect x="30" y="60" width="580" height="180" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="50" y="82" font-size="12" fill="#446688" font-weight="bold">最大化 a：第一个非 9 的数位 → 全替换为 9</text>

  <text x="50" y="104" font-size="10" fill="#555">例 num = 9288：从左扫描，9 跳过，2 命中 → 所有 2 替换为 9</text>

  <!-- original digits -->
  <g font-size="13">
    <rect x="50" y="112" width="44" height="34" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="72" y="134" text-anchor="middle" fill="#999">9</text>
    <rect x="98" y="112" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="120" y="134" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="146" y="112" width="44" height="34" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="168" y="134" text-anchor="middle" fill="#999">8</text>
    <rect x="194" y="112" width="44" height="34" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="216" y="134" text-anchor="middle" fill="#999">8</text>
  </g>
  <text x="72" y="156" text-anchor="middle" font-size="9" fill="#999">跳过</text>
  <text x="120" y="156" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">命中!</text>

  <!-- arrow -->
  <path d="M 248 129 L 286 129" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="267" y="122" text-anchor="middle" font-size="9" fill="#4a7a3a">2→9</text>

  <!-- result digits -->
  <g font-size="13">
    <rect x="294" y="112" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="316" y="134" text-anchor="middle" fill="#4a7a3a" font-weight="bold">9</text>
    <rect x="342" y="112" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="364" y="134" text-anchor="middle" fill="#4a7a3a" font-weight="bold">9</text>
    <rect x="390" y="112" width="44" height="34" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="412" y="134" text-anchor="middle" fill="#999">8</text>
    <rect x="438" y="112" width="44" height="34" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="460" y="134" text-anchor="middle" fill="#999">8</text>
  </g>
  <text x="510" y="134" font-size="13" fill="#4a7a3a" font-weight="bold">a = 9988</text>

  <!-- rule box -->
  <rect x="50" y="158" width="540" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="178" font-size="11" fill="#555">规则：从左到右找第一个 ≠ 9 的数位 d，把所有 d 替换为 9（高位权重最大）</text>
  <text x="50" y="206" font-size="10" fill="#888">全为 9 时 a = num（已最大，无需改动）</text>

  <!-- ===== Minimize b section ===== -->
  <rect x="30" y="250" width="580" height="230" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="50" y="272" font-size="12" fill="#b85450" font-weight="bold">最小化 b：首位不能为 0，分两种情况</text>

  <!-- Case 1: first digit != 1 -->
  <text x="50" y="294" font-size="11" fill="#555" font-weight="bold">情况①  首位 ≠ 1：替换首位数字为 1</text>
  <text x="50" y="312" font-size="10" fill="#888">例 num = 9288：首位 9 ≠ 1 → 所有 9 替换为 1</text>
  <g font-size="12">
    <rect x="50" y="320" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="70" y="339" text-anchor="middle" fill="#d6a040" font-weight="bold">9</text>
    <rect x="92" y="320" width="40" height="28" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="112" y="339" text-anchor="middle" fill="#999">2</text>
    <rect x="134" y="320" width="40" height="28" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="154" y="339" text-anchor="middle" fill="#999">8</text>
    <rect x="176" y="320" width="40" height="28" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="196" y="339" text-anchor="middle" fill="#999">8</text>
  </g>
  <path d="M 224 334 L 258 334" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="241" y="327" text-anchor="middle" font-size="9" fill="#b85450">9→1</text>
  <g font-size="12">
    <rect x="266" y="320" width="40" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="286" y="339" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="308" y="320" width="40" height="28" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="328" y="339" text-anchor="middle" fill="#999">2</text>
    <rect x="350" y="320" width="40" height="28" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="370" y="339" text-anchor="middle" fill="#999">8</text>
    <rect x="392" y="320" width="40" height="28" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="412" y="339" text-anchor="middle" fill="#999">8</text>
  </g>
  <text x="452" y="339" font-size="12" fill="#b85450" font-weight="bold">b = 1288</text>

  <!-- Case 2: first digit == 1 -->
  <text x="50" y="372" font-size="11" fill="#555" font-weight="bold">情况②  首位 = 1：从第 2 位起找第一个 &gt;1 的数位 → 替换为 0</text>
  <text x="50" y="390" font-size="10" fill="#888">例 num = 123456：首位 1 不动，第 2 位 2 &gt;1 → 所有 2 替换为 0</text>
  <g font-size="12">
    <rect x="50" y="398" width="36" height="28" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="68" y="417" text-anchor="middle" fill="#999">1</text>
    <rect x="88" y="398" width="36" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="106" y="417" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="126" y="398" width="36" height="28" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="144" y="417" text-anchor="middle" fill="#999">3</text>
    <rect x="164" y="398" width="36" height="28" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="182" y="417" text-anchor="middle" fill="#999">4</text>
    <rect x="202" y="398" width="36" height="28" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="220" y="417" text-anchor="middle" fill="#999">5</text>
    <rect x="240" y="398" width="36" height="28" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="258" y="417" text-anchor="middle" fill="#999">6</text>
  </g>
  <path d="M 284 412 L 318 412" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="301" y="405" text-anchor="middle" font-size="9" fill="#b85450">2→0</text>
  <g font-size="12">
    <rect x="326" y="398" width="36" height="28" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="344" y="417" text-anchor="middle" fill="#999">1</text>
    <rect x="364" y="398" width="36" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="382" y="417" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
    <rect x="402" y="398" width="36" height="28" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="420" y="417" text-anchor="middle" fill="#999">3</text>
    <rect x="440" y="398" width="36" height="28" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="458" y="417" text-anchor="middle" fill="#999">4</text>
    <rect x="478" y="398" width="36" height="28" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="496" y="417" text-anchor="middle" fill="#999">5</text>
    <rect x="516" y="398" width="36" height="28" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="534" y="417" text-anchor="middle" fill="#999">6</text>
  </g>
  <text x="326" y="442" font-size="12" fill="#b85450" font-weight="bold">b = 103456</text>

  <!-- no-match note -->
  <text x="50" y="462" font-size="10" fill="#888">首位=1 且无非 0/1 数位时（如 10000）b = num，无法再降</text>

  <!-- ===== Final answer ===== -->
  <rect x="30" y="478" width="580" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="498" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">num=9288：a=9988, b=1288 ⇒ 差值 = 8700</text>
</svg>
