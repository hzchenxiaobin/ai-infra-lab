<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：奇偶交错填充全过程</text>

  <!-- Example 1 -->
  <text x="40" y="52" font-size="12" fill="#444" font-weight="bold">示例 1：barcodes = [1,1,1,2,2,3]，n = 6</text>

  <!-- freq -->
  <text x="40" y="74" font-size="11" fill="#888">频率: 1→3, 2→2, 3→1   ⌈n/2⌉ = 3，max_count = 3 ≤ 3 ✓</text>

  <!-- chars -->
  <text x="40" y="96" font-size="11" fill="#888">chars (按频率降序展开):</text>
  <rect x="200" y="82" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="215" y="99" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="230" y="82" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="245" y="99" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="260" y="82" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="275" y="99" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="290" y="82" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="305" y="99" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="320" y="82" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="335" y="99" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="350" y="82" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="365" y="99" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <!-- Step A: fill even -->
  <text x="40" y="128" font-size="11" fill="#446688" font-weight="bold">步骤 A：填偶数下标 0,2,4</text>
  <!-- index row -->
  <text x="100" y="128" font-size="10" fill="#446688">res[0]</text>
  <text x="155" y="128" font-size="10" fill="#4a7a3a">res[1]</text>
  <text x="210" y="128" font-size="10" fill="#446688">res[2]</text>
  <text x="265" y="128" font-size="10" fill="#4a7a3a">res[3]</text>
  <text x="320" y="128" font-size="10" fill="#446688">res[4]</text>
  <text x="375" y="128" font-size="10" fill="#4a7a3a">res[5]</text>

  <rect x="95" y="134" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="113" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="133" y="134" width="36" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="151" y="153" text-anchor="middle" font-size="12" fill="#ccc">?</text>
  <rect x="171" y="134" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="189" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="209" y="134" width="36" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="227" y="153" text-anchor="middle" font-size="12" fill="#ccc">?</text>
  <rect x="247" y="134" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="265" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="285" y="134" width="36" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="303" y="153" text-anchor="middle" font-size="12" fill="#ccc">?</text>

  <text x="340" y="150" font-size="10" fill="#446688">← 三个 1 恰填满 3 个偶数位</text>

  <!-- Step B: fill odd -->
  <text x="40" y="184" font-size="11" fill="#4a7a3a" font-weight="bold">步骤 B：填奇数下标 1,3,5</text>

  <rect x="95" y="190" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="113" y="209" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="133" y="190" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="151" y="209" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="171" y="190" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="189" y="209" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="209" y="190" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="227" y="209" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="247" y="190" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="265" y="209" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="285" y="190" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="303" y="209" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <text x="340" y="206" font-size="10" fill="#4a7a3a">结果 [1,2,1,2,1,3] ✓</text>

  <!-- divider -->
  <path d="M 40 240 L 520 240" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- Example 2 -->
  <text x="40" y="262" font-size="12" fill="#444" font-weight="bold">示例 2：barcodes = [1,1,1,1,2,2,3,3]，n = 8</text>

  <text x="40" y="284" font-size="11" fill="#888">频率: 1→4, 2→2, 3→2   ⌈n/2⌉ = 4，max_count = 4 ≤ 4 ✓</text>

  <!-- chars -->
  <text x="40" y="306" font-size="11" fill="#888">chars:</text>
  <rect x="100" y="292" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="114" y="309" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="128" y="292" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="142" y="309" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="156" y="292" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="170" y="309" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="184" y="292" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="198" y="309" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="212" y="292" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="226" y="309" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="240" y="292" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="254" y="309" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="268" y="292" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="282" y="309" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="296" y="292" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="310" y="309" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- result row -->
  <text x="40" y="338" font-size="11" fill="#888">结果:</text>
  <text x="95" y="338" font-size="10" fill="#446688">0</text>
  <text x="133" y="338" font-size="10" fill="#4a7a3a">1</text>
  <text x="171" y="338" font-size="10" fill="#446688">2</text>
  <text x="209" y="338" font-size="10" fill="#4a7a3a">3</text>
  <text x="247" y="338" font-size="10" fill="#446688">4</text>
  <text x="285" y="338" font-size="10" fill="#4a7a3a">5</text>
  <text x="323" y="338" font-size="10" fill="#446688">6</text>
  <text x="361" y="338" font-size="10" fill="#4a7a3a">7</text>

  <rect x="95" y="344" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="113" y="363" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="133" y="344" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="151" y="363" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="171" y="344" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="189" y="363" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="209" y="344" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="227" y="363" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="247" y="344" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="265" y="363" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="285" y="344" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="303" y="363" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="323" y="344" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="341" y="363" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="361" y="344" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="379" y="363" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <text x="410" y="360" font-size="11" fill="#4a7a3a" font-weight="bold">[1,3,1,3,1,2,1,2] ✓</text>

  <!-- Insight box -->
  <rect x="40" y="392" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="414" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">观察：最高频的 1 恰好填满全部偶数位（n=6 时 3 个，n=8 时 4 个）</text>
  <text x="280" y="432" text-anchor="middle" font-size="11" fill="#666">偶数位间隔 2 互不相邻 → 1 永远不会和 1 相邻；其余值落入奇数位同理</text>
</svg>
