<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#666" stroke-width="1.8"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    一遍扫描：记录已见相邻对，遇镜像立即返回
  </text>

  <!-- start -->
  <rect x="160" y="46" width="200" height="34" rx="10" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">seen[26][26] ← 全 false</text>
  <line x1="260" y1="80" x2="260" y2="96" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i = 1 -->
  <rect x="205" y="98" width="110" height="30" rx="6" fill="#fff" stroke="#999"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i = 1</text>
  <line x1="260" y1="128" x2="260" y2="144" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: i < n ? -->
  <polygon points="260,146 335,180 260,214 185,180" fill="#fff8e1" stroke="#d6a040"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="185" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i &lt; n ?</text>
  <!-- no -> return false (left) -->
  <line x1="185" y1="180" x2="130" y2="180" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="158" y="172" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="24" y="164" width="104" height="32" rx="8" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="76" y="185" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">return false</text>
  <!-- yes -->
  <line x1="260" y1="214" x2="260" y2="230" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="226" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- a,b -->
  <rect x="165" y="232" width="190" height="34" rx="6" fill="#fff" stroke="#999"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="254" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a = s[i−1],  b = s[i]</text>
  <line x1="260" y1="266" x2="260" y2="282" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: a==b or seen[b][a] ? -->
  <polygon points="260,284 365,322 260,360 155,322" fill="#e6f4ea" stroke="#4a7a3a"
           stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="317" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a == b</text>
  <text x="260" y="336" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">或 seen[b][a] ?</text>
  <!-- yes -> return true (right) -->
  <line x1="365" y1="322" x2="424" y2="322" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="314" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="426" y="306" width="86" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="2" filter="url(#rough2)"/>
  <text x="469" y="327" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">return true</text>
  <!-- no -->
  <line x1="260" y1="360" x2="260" y2="378" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="374" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- record -->
  <rect x="165" y="380" width="190" height="34" rx="6" fill="#fff" stroke="#999"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="402" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">seen[a][b] ← true</text>

  <!-- loop back -->
  <path d="M 355 397 L 470 397 L 470 180 L 340 180" fill="none" stroke="#666"
        stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="292" font-size="12" fill="#666" filter="url(#rough2)" transform="rotate(90 478 292)">i++，继续扫描</text>

  <text x="260" y="448" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">
    先判 a==b（回文对自镜像），再查 seen[b][a]，最后才记录 seen[a][b]
  </text>
</svg>
