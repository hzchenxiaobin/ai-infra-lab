<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟计数 + 一趟原序判定</text>

  <!-- 开始 -->
  <rect x="186" y="32" width="148" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="49" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">开始：输入 nums</text>

  <path d="M 260 58 L 260 68" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第一趟计数 -->
  <rect x="176" y="70" width="168" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="87" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">① 扫 nums：freq[x] += 1</text>

  <path d="M 260 96 L 260 106" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第二趟取元素 -->
  <rect x="176" y="108" width="168" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="125" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">② 取下一个 x（按原序）</text>

  <path d="M 260 134 L 260 144" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 1：偶数？ -->
  <polygon points="260,146 322,168 260,190 198,168" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="172" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">x 是偶数？</text>

  <path d="M 260 190 L 260 200" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="199" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 菱形 2：唯一？ -->
  <polygon points="260,202 322,224 260,246 198,224" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">freq[x] == 1 ?</text>

  <!-- 偶数？否：回到取下一个 -->
  <path d="M 198 168 L 110 168 L 110 121 L 174 121" fill="none" stroke="#888" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="161" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 唯一？否：回到取下一个 -->
  <path d="M 198 224 L 60 224 L 60 121 L 174 121" fill="none" stroke="#888" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="217" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 唯一？是：返回 x -->
  <path d="M 322 224 L 378 224" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="348" y="216" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="382" y="211" width="100" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="432" y="228" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 x ✓</text>

  <!-- 扫完无命中：返回 -1 -->
  <path d="M 344 121 L 495 121 L 495 303 L 328 303" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="114" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">扫完仍无命中</text>

  <rect x="196" y="290" width="128" height="26" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="307" text-anchor="middle" font-size="11.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">返回 -1</text>
  <text x="260" y="330" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">（无偶数，或偶数都有重复）</text>

  <!-- 左下角小技巧 -->
  <rect x="30" y="258" width="150" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="105" y="275" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">判定顺序小技巧</text>
  <text x="105" y="290" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">先判 x % 2 == 0（不查表）</text>
  <text x="105" y="303" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">再查 freq[x] == 1（查表）</text>
</svg>
