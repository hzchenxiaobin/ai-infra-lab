<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：拆贡献——「对每个 T 数 S」换成「对每个 S 数 T」</text>
  <text x="260" y="50" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">示例：nums = [1,2,3]，k = 3</text>

  <!-- 左：视角一 -->
  <text x="142" y="78" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">视角一（按定义）</text>
  <!-- T 大框 -->
  <rect x="52" y="90" width="184" height="112" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="66" y="110" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">T（外层子序列）</text>
  <!-- S 内框 -->
  <rect x="66" y="122" width="96" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="114" y="141" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">S = {1,2}</text>
  <text x="114" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">sum = 3 = k ✓</text>
  <!-- T 中不属于 S 的元素 -->
  <rect x="180" y="122" width="40" height="46" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="150" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="142" y="226" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">能量(T) = T 内和为 k 的 S 个数</text>
  <text x="142" y="244" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">外层有 2ⁿ 个 T —— 逐个数不动</text>

  <!-- 中间换元箭头 -->
  <path d="M246,152 C266,152 274,152 290,152" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="268" y="140" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">换元</text>

  <!-- 右：视角二 -->
  <text x="400" y="78" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">视角二（拆贡献）</text>
  <!-- S 固定 -->
  <rect x="316" y="96" width="96" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="364" y="125" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">S = {1,2}</text>
  <!-- S 之外的元素 -->
  <rect x="438" y="96" width="40" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="458" y="124" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <!-- 两个分支 -->
  <path d="M458,142 C458,158 428,166 408,170" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M458,142 C458,158 486,166 500,170" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="386" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">选进 T</text>
  <text x="494" y="184" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">不进 T</text>
  <text x="400" y="210" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">S 之外的 n−|S| 个元素彼此独立</text>
  <text x="400" y="228" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">每个 2 种选择 ⇒ 共 2^(n−|S|) 个 T</text>
  <text x="400" y="246" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">S 越短，罩住它的 T 越多</text>

  <!-- 底部结论框 1 -->
  <rect x="36" y="262" width="448" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="281" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">答案 = Σ cnt[j] · 2^(n−j)</text>
  <text x="260" y="298" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">cnt[j]：长度为 j、和为 k 的子序列个数（长度 1 贡献 4，长度 2 贡献 2）</text>

  <!-- 底部结论框 2 -->
  <rect x="36" y="312" width="448" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">剩下的事：dp[j][s] = 长度 j、和 s 的子序列数</text>
  <text x="260" y="346" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">标准的 0-1 背包计数，倒序转移</text>
</svg>
