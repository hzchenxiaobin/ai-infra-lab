<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="920" height="480" fill="#fdfcf7"/>

  <text x="460" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：nums = [6, 4, 3, 2, 7, 6, 2] → [12, 7, 6]</text>
  <path d="M 260 34 Q 460 42 660 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Column headers -->
  <text x="42" y="56" font-size="11" fill="#888" font-weight="bold">步骤</text>
  <text x="92" y="56" font-size="11" fill="#888" font-weight="bold">x</text>
  <text x="160" y="56" font-size="11" fill="#888" font-weight="bold">操作（GCD 检查 → 合并/压入）</text>
  <text x="460" y="56" font-size="11" fill="#888" font-weight="bold">栈状态（底 → 顶）</text>
  <path d="M 30 64 L 890 64" stroke="#ddd" stroke-width="1" fill="none" filter="url(#sk)"/>

  <!-- ===== Step 1: x=6, push ===== -->
  <circle cx="42" cy="90" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="42" y="94" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">1</text>
  <g filter="url(#sk)"><rect x="70" y="76" width="44" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="92" y="95" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">6</text>
  <text x="160" y="94" font-size="11" fill="#444">栈空 → 直接压入</text>
  <g filter="url(#sk)"><rect x="430" y="76" width="44" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="452" y="95" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">6</text>
  <text x="452" y="118" text-anchor="middle" font-size="9" fill="#888">新压入</text>

  <!-- ===== Step 2: x=4, merge ===== -->
  <circle cx="42" cy="138" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="42" y="142" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">2</text>
  <g filter="url(#sk)"><rect x="70" y="124" width="44" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="92" y="143" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>
  <text x="160" y="142" font-size="11" fill="#444">GCD(6,4)=2&gt;1 → pop 6, x=LCM(6,4)=12 → 压入</text>
  <g filter="url(#sk)"><rect x="430" y="124" width="44" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="452" y="143" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">12</text>
  <text x="452" y="166" text-anchor="middle" font-size="9" fill="#888">合并</text>

  <!-- ===== Step 3: x=3, merge ===== -->
  <circle cx="42" cy="186" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="42" y="190" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">3</text>
  <g filter="url(#sk)"><rect x="70" y="172" width="44" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="92" y="191" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <text x="160" y="190" font-size="11" fill="#444">GCD(12,3)=3&gt;1 → pop 12, x=LCM(12,3)=12 → 压入</text>
  <g filter="url(#sk)"><rect x="430" y="172" width="44" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="452" y="191" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">12</text>
  <text x="452" y="214" text-anchor="middle" font-size="9" fill="#888">合并</text>

  <!-- ===== Step 4: x=2, merge ===== -->
  <circle cx="42" cy="234" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="42" y="238" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">4</text>
  <g filter="url(#sk)"><rect x="70" y="220" width="44" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="92" y="239" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <text x="160" y="238" font-size="11" fill="#444">GCD(12,2)=2&gt;1 → pop 12, x=LCM(12,2)=12 → 压入</text>
  <g filter="url(#sk)"><rect x="430" y="220" width="44" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="452" y="239" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">12</text>
  <text x="452" y="262" text-anchor="middle" font-size="9" fill="#888">合并</text>

  <!-- ===== Step 5: x=7, no merge ===== -->
  <circle cx="42" cy="282" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="42" y="286" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">5</text>
  <g filter="url(#sk)"><rect x="70" y="268" width="44" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="92" y="287" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">7</text>
  <text x="160" y="286" font-size="11" fill="#444">GCD(12,7)=1 → 互质，直接压入</text>
  <g filter="url(#sk)"><rect x="430" y="268" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="452" y="287" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">12</text>
  <g filter="url(#sk)"><rect x="484" y="268" width="44" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="506" y="287" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">7</text>
  <text x="506" y="310" text-anchor="middle" font-size="9" fill="#888">新压入</text>

  <!-- ===== Step 6: x=6, no merge ===== -->
  <circle cx="42" cy="330" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="42" y="334" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">6</text>
  <g filter="url(#sk)"><rect x="70" y="316" width="44" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="92" y="335" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">6</text>
  <text x="160" y="334" font-size="11" fill="#444">GCD(7,6)=1 → 互质，直接压入</text>
  <g filter="url(#sk)"><rect x="430" y="316" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="452" y="335" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">12</text>
  <g filter="url(#sk)"><rect x="484" y="316" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="506" y="335" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">7</text>
  <g filter="url(#sk)"><rect x="538" y="316" width="44" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="560" y="335" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">6</text>
  <text x="560" y="358" text-anchor="middle" font-size="9" fill="#888">新压入</text>

  <!-- ===== Step 7: x=2, cascade merge ===== -->
  <circle cx="42" cy="390" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="42" y="394" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">7</text>
  <g filter="url(#sk)"><rect x="70" y="376" width="44" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="92" y="395" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <text x="160" y="388" font-size="11" fill="#b85450" font-weight="bold">GCD(6,2)=2&gt;1 → pop 6, x=LCM(6,2)=6</text>
  <text x="160" y="404" font-size="11" fill="#2e6e2e" font-weight="bold">GCD(7,6)=1 → 互质停止，压入 6（级联合并）</text>
  <g filter="url(#sk)"><rect x="430" y="376" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="452" y="395" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">12</text>
  <g filter="url(#sk)"><rect x="484" y="376" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="506" y="395" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">7</text>
  <g filter="url(#sk)"><rect x="538" y="376" width="44" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="560" y="395" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">6</text>
  <text x="560" y="418" text-anchor="middle" font-size="9" fill="#888">合并后压入</text>

  <!-- ===== Result ===== -->
  <path d="M 30 430 L 890 430" stroke="#ddd" stroke-width="1" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="280" y="440" width="360" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="460" y="460" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">最终结果 = [12, 7, 6]  ✓  相邻元素两两互质</text>
</svg>
