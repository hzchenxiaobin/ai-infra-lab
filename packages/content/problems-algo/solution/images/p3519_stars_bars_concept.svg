<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：非递减序列 = 值的多重集 → 隔板法一步数完</text>

  <!-- ① 逐位扫描 -->
  <text x="24" y="58" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 逐位扫描上界：28 的 8 进制数位 d =</text>
  <rect x="270" y="42" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="287" y="62" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="308" y="42" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="62" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="287" y="88" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="325" y="88" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=1</text>

  <path d="M287 76 L287 96" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="270" y="100" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="287" y="120" text-anchor="middle" font-size="14" fill="#2d4d24" filter="url(#rough2)">1</text>
  <rect x="308" y="100" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="120" text-anchor="middle" font-size="10.5" fill="#2d4d24" filter="url(#rough2)">1..7</text>
  <text x="325" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">自由位 t=1</text>

  <text x="24" y="108" font-size="11.5" fill="#555" filter="url(#rough2)">i=0, lo=1：枚举自由数字 x（x &lt; d[0]），如 x=1：</text>
  <text x="24" y="128" font-size="11.5" fill="#555" filter="url(#rough2)">前缀 1□ 已严格小于上界 34，剩余位全部自由，</text>
  <text x="24" y="146" font-size="11.5" fill="#555" filter="url(#rough2)">只需满足「非递减且 ≥ x」。</text>

  <!-- ② 隔板法 -->
  <text x="24" y="178" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">② 剩余 t 位有几个填法？非递减序列由「值的多重集」唯一决定</text>
  <text x="24" y="200" font-size="11.5" fill="#555" filter="url(#rough2)">把 t 个 ☆ 放进 b−x 个数字格（每格可放任意多个）。例：t=3, x=1, b=8：</text>

  <rect x="110" y="210" width="40" height="36" fill="#fff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="154" y="210" width="40" height="36" fill="#fff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="198" y="210" width="40" height="36" fill="#fff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="242" y="210" width="40" height="36" fill="#fff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="286" y="210" width="40" height="36" fill="#fff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="330" y="210" width="40" height="36" fill="#fff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="374" y="210" width="40" height="36" fill="#fff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>

  <circle cx="122" cy="228" r="5.5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="138" cy="228" r="5.5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="174" cy="228" r="5.5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="130" y="262" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="174" y="262" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="218" y="262" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>
  <text x="262" y="262" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4</text>
  <text x="306" y="262" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">5</text>
  <text x="350" y="262" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">6</text>
  <text x="394" y="262" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">7</text>

  <text x="432" y="226" font-size="11.5" fill="#555" filter="url(#rough2)">→ 序列</text>
  <text x="432" y="244" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">(1,1,2)</text>

  <text x="24" y="294" font-size="11.5" fill="#555" filter="url(#rough2)">数多重集 = 数「t 个 ☆ 与 b−x−1 块隔板」的全排列（隔板法）：</text>

  <rect x="170" y="304" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">C(t + b − 1 − x, t)</text>
  <text x="404" y="326" font-size="10.5" fill="#888" filter="url(#rough2)">（多重组合数）</text>

  <!-- ③ 小结 -->
  <text x="24" y="364" font-size="11.5" fill="#555" filter="url(#rough2)">本例 t=1, x=1：C(7,1) = 7 → 8 进制的 11,12,…,17 共 7 个数</text>
  <text x="24" y="384" font-size="11.5" fill="#555" filter="url(#rough2)">短位数同理：k 位、首位 ≥ 1 的非递减正数共 C(k+b−2, k) 个</text>

  <rect x="24" y="396" width="512" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="418" text-anchor="middle" font-size="11" fill="#2d4d24" font-weight="bold" filter="url(#rough2)">f(x) = 1（数字 0）+ Σ C(k+b−2, k) + 同位数逐位扫描；答案 = f(r) − f(l−1)</text>
</svg>
