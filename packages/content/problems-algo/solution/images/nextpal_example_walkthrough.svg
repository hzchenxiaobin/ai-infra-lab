<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：num = "45544554"</text>

  <!-- Row 0: original palindrome -->
  <text x="50" y="54" font-size="10.5" fill="#888">原回文串</text>
  <rect x="130" y="40" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="146" y="62" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="162" y="40" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="62" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="194" y="40" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="62" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="226" y="40" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="242" y="62" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="258" y="40" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="274" y="62" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="290" y="40" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="306" y="62" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="322" y="40" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="62" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="354" y="40" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="62" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="148" y="76" width="112" height="16" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="204" y="88" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">前半 half = "4554"</text>

  <path d="M 206 96 L 206 110" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="260" y="106" font-size="9.5" fill="#888">提取前半</text>

  <!-- Row 1: half = [4,5,5,4], step 1 find i -->
  <text x="50" y="130" font-size="10.5" fill="#888">① 找 i</text>
  <rect x="130" y="116" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="146" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="162" y="116" width="32" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="178" y="138" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="194" y="116" width="32" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="210" y="138" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="226" y="116" width="32" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="242" y="138" text-anchor="middle" font-size="13" fill="#333">4</text>
  <path d="M 246 126 L 140 126" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="193" y="120" text-anchor="middle" font-size="9" fill="#888">从右扫描</text>
  <text x="146" y="162" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i=0</text>
  <text x="280" y="136" font-size="10" fill="#555">4 &lt; 5 ✓（右侧降序）</text>

  <path d="M 206 168 L 206 182" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Row 2: step 2 find j -->
  <text x="50" y="202" font-size="10.5" fill="#888">② 找 j</text>
  <rect x="130" y="188" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="146" y="210" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="162" y="188" width="32" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="178" y="210" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="194" y="188" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="210" y="210" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="226" y="188" width="32" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="242" y="210" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="210" y="234" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">j=2</text>
  <text x="280" y="208" font-size="10" fill="#555">5 &gt; 4 ✓（大于 i 的最小值）</text>

  <path d="M 206 240 L 206 254" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Row 3: step 3 swap -->
  <text x="50" y="274" font-size="10.5" fill="#888">③ 交换</text>
  <rect x="130" y="260" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="146" y="282" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="162" y="260" width="32" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="178" y="282" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="194" y="260" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="282" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="226" y="260" width="32" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="242" y="282" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="280" y="280" font-size="10" fill="#555">swap(0, 2) → [5,5,4,4]</text>

  <path d="M 206 296 L 206 310" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Row 4: step 4 reverse suffix -->
  <text x="50" y="344" font-size="10.5" fill="#888">④ 反转</text>
  <rect x="130" y="330" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="146" y="352" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="162" y="330" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="352" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="194" y="330" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="352" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="226" y="330" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="352" text-anchor="middle" font-size="13" fill="#333">5</text>
  <text x="280" y="350" font-size="10" fill="#555">reverse [1..3] → "5445"</text>

  <path d="M 206 366 L 206 378" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="260" y="376" font-size="9.5" fill="#888">+ 镜像</text>

  <!-- Row 5: result -->
  <text x="50" y="406" font-size="10.5" fill="#888">结果</text>
  <rect x="130" y="392" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="414" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="162" y="392" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="414" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="194" y="392" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="414" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="226" y="392" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="414" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="258" y="392" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="274" y="414" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="290" y="392" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="306" y="414" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="322" y="392" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="414" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="354" y="392" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="414" text-anchor="middle" font-size="13" fill="#333">5</text>
  <text x="260" y="436" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"54455445"</text>
</svg>
