<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一遍扫描，前缀和 O(1) 判定</text>

  <!-- 预处理 -->
  <rect x="140" y="40" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="250" y="60" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">total = Σnums；left = 0；ans = 0</text>

  <path d="M 250 70 L 250 84" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 扫描 -->
  <rect x="140" y="84" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="250" y="104" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">扫描下标 i = 0 … n−1（x = nums[i]）</text>

  <path d="M 250 114 L 250 130" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 判断1 -->
  <polygon points="250,130 340,165 250,200 160,165" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="170" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">x == 0 ?</text>

  <!-- 否：非零格绕行 -->
  <path d="M 340 165 C 420 165, 470 185, 470 225 L 470 424 L 366 424" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="352" y="153" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否（非零格，不判定）</text>

  <!-- 是 -->
  <path d="M 250 200 L 250 216" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="258" y="212" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- 现算两侧和 -->
  <rect x="110" y="216" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="250" y="232" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">right = total − left</text>
  <text x="250" y="248" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">diff = |left − right|</text>

  <path d="M 250 256 L 250 270" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 判断2 -->
  <polygon points="250,270 345,305 250,340 155,305" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="310" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">diff ≤ 1 ?</text>

  <!-- 否：贡献 0 -->
  <path d="M 345 305 L 386 305" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="362" y="297" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="390" y="287" width="72" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="426" y="310" text-anchor="middle" font-size="12" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">贡献 0</text>
  <path d="M 426 323 L 426 412 L 366 412" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- 是 -->
  <path d="M 250 340 L 250 354" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="258" y="350" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- 累加答案 -->
  <rect x="110" y="354" width="280" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="370" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans += 2 − diff</text>
  <text x="250" y="385" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">diff=0 ⇒ +2（双向）；diff=1 ⇒ +1（朝大侧）</text>

  <path d="M 250 390 L 250 404" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 结算前缀和 -->
  <rect x="140" y="404" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="250" y="424" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">left += x；i ← i + 1</text>

  <!-- 回环 -->
  <path d="M 140 419 C 88 419, 74 280, 74 104 C 74 92, 95 92, 130 99" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="60" y="260" text-anchor="middle" font-size="10" fill="#446688" transform="rotate(-90 60 260)" filter="url(#rough2)">下一个 i</text>

  <text x="250" y="458" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">扫描结束 → 返回 ans</text>
</svg>
