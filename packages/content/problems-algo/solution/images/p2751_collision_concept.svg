<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa" filter="url(#rough2)"/>

  <!-- title -->
  <text x="270" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">按位置排序 → 栈模拟碰撞</text>

  <!-- number line -->
  <line x1="40" y1="78" x2="500" y2="78" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="44" y="96" font-size="11" fill="#888" filter="url(#rough2)">位置 →</text>

  <!-- robot A: R at pos 2 -->
  <circle cx="120" cy="78" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="82" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">R</text>
  <text x="120" y="64" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">3号(15)</text>
  <line x1="131" y1="78" x2="150" y2="78" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- robot B: R at pos 3 -->
  <circle cx="185" cy="78" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="185" y="82" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">R</text>
  <text x="185" y="64" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">1号(10)</text>
  <line x1="196" y1="78" x2="215" y2="78" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- robot C: L at pos 5 -->
  <circle cx="295" cy="78" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="295" y="82" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">L</text>
  <text x="295" y="64" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">2号(10)</text>
  <line x1="284" y1="78" x2="265" y2="78" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- collision spark between B and C -->
  <text x="240" y="74" text-anchor="middle" font-size="16" fill="#d6a040" filter="url(#rough2)">💥</text>

  <!-- robot D: L at pos 6 -->
  <circle cx="360" cy="78" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="82" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">L</text>
  <text x="360" y="64" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">4号(12)</text>
  <line x1="349" y1="78" x2="330" y2="78" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- arrow down to stack -->
  <path d="M185,95 Q185,120 200,135" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="148" y="120" font-size="10" fill="#4a7a3a" filter="url(#rough2)">R 入栈</text>

  <!-- stack box -->
  <rect x="150" y="140" width="120" height="150" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">栈（暂存 R）</text>

  <!-- stack top: 1号 -->
  <rect x="166" y="150" width="88" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="210" y="167" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1号 R 健10 ← 栈顶</text>

  <!-- stack bottom: 3号 -->
  <rect x="166" y="180" width="88" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="210" y="197" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">3号 R 健15</text>

  <text x="210" y="222" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（更深的 R 被栈顶挡住）</text>
  <text x="210" y="240" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">栈顶销毁后才暴露</text>

  <!-- L approaches stack top -->
  <path d="M295,95 Q260,120 260,148" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="300" y="128" font-size="10" fill="#b85450" filter="url(#rough2)">L 只碰栈顶</text>

  <!-- rules box on right -->
  <rect x="300" y="140" width="200" height="150" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="400" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">碰撞规则（扣 1 血）</text>
  <text x="312" y="182" font-size="11" fill="#333" filter="url(#rough2)">• 低血者移除</text>
  <text x="332" y="200" font-size="11" fill="#333" filter="url(#rough2)">胜者健康度 −1</text>
  <text x="312" y="222" font-size="11" fill="#333" filter="url(#rough2)">• 同血：双双移除</text>
  <text x="312" y="244" font-size="11" fill="#333" filter="url(#rough2)">• 胜者继续同向前进</text>
  <text x="312" y="266" font-size="11" fill="#b85450" filter="url(#rough2)">≠ 735：大者全胜不变</text>

  <!-- bottom note -->
  <rect x="40" y="312" width="460" height="50" rx="8" fill="#f5f5f5" stroke="#aaa" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="270" y="334" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">L 击毁栈顶后，带着新血量 h 继续与下一栈顶循环碰撞</text>
  <text x="270" y="352" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">→ 强 L 可连胜多 R，弱后可能被反杀</text>
</svg>
