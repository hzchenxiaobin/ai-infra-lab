<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto">
      <path d="M 8 0 L 0 4 L 8 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">对撞双指针：两端交换，向中间收拢</text>

  <!-- Curved double-arrow above cells showing swap -->
  <path d="M 128 70 Q 248 30 368 70" stroke="#b85450" stroke-width="2" fill="none"
        marker-end="url(#arrR)" marker-start="url(#arrL)" filter="url(#rough2)"/>
  <text x="248" y="36" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">swap s[left] ↔ s[right]</text>

  <!-- Array row: h e l l o -->
  <rect x="100" y="70" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="128" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">h</text>
  <rect x="160" y="70" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">e</text>
  <rect x="220" y="70" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="248" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">l</text>
  <rect x="280" y="70" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">l</text>
  <rect x="340" y="70" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="368" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">o</text>

  <!-- Index labels -->
  <text x="128" y="120" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="188" y="120" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="248" y="120" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="308" y="120" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="368" y="120" text-anchor="middle" font-size="10" fill="#888">4</text>

  <!-- left / right pointer labels -->
  <text x="128" y="138" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">↑ left</text>
  <text x="368" y="138" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">right ↑</text>

  <!-- Convergence arrows: left moves right, right moves left -->
  <path d="M 150 162 L 220 162" stroke="#b85450" stroke-width="1.8" fill="none"
        stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="185" y="156" text-anchor="middle" font-size="10" fill="#b85450">left++</text>
  <path d="M 346 178 L 276 178" stroke="#b85450" stroke-width="1.8" fill="none"
        stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="311" y="184" text-anchor="middle" font-size="10" fill="#b85450">right−−</text>

  <!-- Invariant box -->
  <rect x="60" y="208" width="420" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="226" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">循环不变量：左右两端已交换的元素已就位</text>
  <text x="270" y="244" text-anchor="middle" font-size="11" fill="#666">中间未处理区随每轮 swap 不断缩小，直到 left ≥ right</text>

  <!-- Insight box -->
  <rect x="60" y="270" width="420" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="292" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">每轮一次 swap + 两端各走一步</text>
  <text x="270" y="310" text-anchor="middle" font-size="11" fill="#555">共 ⌊n/2⌋ 次交换 · 时间 O(n) · 额外空间 O(1)</text>
</svg>
