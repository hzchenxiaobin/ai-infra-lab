<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#999999"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：建表分组 → 逐组 → 滑窗看相邻三元组</text>

  <rect x="215" y="28" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="12" filter="url(#rough2)"/>
  <text x="260" y="44" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M 260 52 L 260 64" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="66" width="300" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="83" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 一趟扫描建表：pos[nums[i]] 追加下标 i（天然升序）</text>

  <path d="M 260 92 L 260 104" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="106" width="300" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="123" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 取 pos 中下一组下标列表 idx</text>

  <path d="M 260 132 L 260 144" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <path d="M 260 144 L 344 178 L 260 212 L 176 178 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ len(idx) ≥ 3 ?</text>
  <text x="260" y="190" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">组内够三个出现？</text>

  <!-- 否：跳过该组 -->
  <path d="M 344 178 L 386 178" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="364" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="388" y="164" width="116" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="446" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">跳过该组</text>

  <!-- 跳过分支回 ② -->
  <path d="M 446 192 L 446 119 L 414 119" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="452" y="214" font-size="10" fill="#999" filter="url(#rough2)">回 ②</text>

  <!-- 是：进入滑窗 -->
  <path d="M 260 212 L 260 244" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="232" font-size="11" fill="#446688" filter="url(#rough2)">是（够三个）</text>

  <rect x="95" y="246" width="330" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">④ 滑窗 t = 0..len−3：cand = 2 × (idx[t+2] − idx[t])</text>

  <path d="M 260 274 L 260 286" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="95" y="288" width="330" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="305" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⑤ ans = min(ans, cand)（每组、每个窗口都看）</text>

  <!-- 窗口右移回 ④ -->
  <path d="M 425 301 L 474 301 L 474 260 L 429 260" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="478" y="252" font-size="10" fill="#999" filter="url(#rough2)">t+1</text>
  <text x="478" y="266" font-size="10" fill="#999" filter="url(#rough2)">回 ④</text>

  <path d="M 260 314 L 260 324" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="95" y="326" width="330" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="12" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⑥ return ans == INT_MAX ? −1 : ans</text>

  <text x="16" y="357" font-size="10" fill="#999" filter="url(#rough2)">💡 距离上界 2(n−1) &lt; 2×10⁵，int 足够；窗口总数 ≤ n，每个下标至多属于 3 个窗口</text>
</svg>
