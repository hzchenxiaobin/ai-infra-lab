<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">cancellable 算法流程</text>

  <!-- 步骤1：调用 -->
  <rect x="30" y="55" width="180" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="120" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">调用 cancellable(fn, args, t)</text>
  <text x="120" y="94" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">返回一个 cancelFn</text>
  <text x="120" y="108" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">fn 须按 0,t,2t,... 触发</text>

  <!-- 箭头 -->
  <path d="M 210 85 L 260 85" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤2：手动立即调用 -->
  <rect x="260" y="55" width="270" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="395" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">fn(...args)</text>
  <text x="395" y="94" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">在 0ms 手动触发一次</text>
  <text x="395" y="108" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">setInterval 不会补这一下，必须手写</text>

  <!-- 向下箭头 -->
  <path d="M 395 115 L 395 150" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 步骤3：setInterval -->
  <rect x="260" y="150" width="270" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="395" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">const timer = setInterval(fn, t, ...args)</text>
  <text x="395" y="189" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">事件循环在 t, 2t, 3t ... 入队 fn</text>
  <text x="395" y="203" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">timer = 定时器句柄</text>

  <!-- 返回闭包箭头 -->
  <path d="M 395 210 L 395 245" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="232" font-size="10" fill="#446688" filter="url(#rough2)">return () =&gt; clearInterval(timer)</text>

  <!-- 步骤4：cancelFn 被调用 -->
  <rect x="160" y="245" width="240" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">cancelFn 在 cancelTimeMs 被调用</text>
  <text x="280" y="283" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">外部安排 setTimeout(cancelFn, cancelTimeMs)</text>

  <!-- 向下到结果 -->
  <path d="M 280 295 L 280 325" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 结果 -->
  <rect x="30" y="325" width="500" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">clearInterval(timer) 一次性取消全部后续 tick</text>
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">已触发的 tick（0,t,2t...&lt;cancelT）照常计入结果；cancelT 之后的 tick 永不触发</text>
  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">结果条数 = floor(cancelTimeMs / t) + 1</text>
</svg>
