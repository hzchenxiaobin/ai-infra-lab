<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程图：双重循环填 dp 表</text>

  <!-- Start -->
  <ellipse cx="280" cy="62" rx="50" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <line x1="280" y1="82" x2="280" y2="102" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="190" y="104" width="180" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dp[0..N]=0，i = 1</text>
  <line x1="280" y1="144" x2="280" y2="164" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Outer decision -->
  <polygon points="280,166 360,210 280,254 200,210" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i ≤ N ?</text>
  <text x="372" y="206" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="268" y="270" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- No branch -> return -->
  <line x1="360" y1="210" x2="470" y2="210" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="430" y="232" width="120" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="490" y="256" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 dp[N]</text>

  <!-- Yes branch down -->
  <line x1="280" y1="254" x2="280" y2="278" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- dp[i] = i -->
  <rect x="190" y="280" width="180" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dp[i] = i  （纯按 A 基线）</text>
  <line x1="280" y1="316" x2="280" y2="336" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Inner decision -->
  <polygon points="280,338 360,372 280,406 200,372" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">j ≤ i−3 ?</text>
  <text x="372" y="372" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- inner yes -> update box on left -->
  <line x1="200" y1="372" x2="130" y2="372" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="352" width="90" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="85" y="370" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">dp[i] = max(</text>
  <text x="85" y="384" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">dp[i], dp[j]·(i−j−1))</text>
  <!-- loop back from update to inner decision -->
  <line x1="85" y1="352" x2="85" y2="330" stroke="#446688" stroke-width="1.6" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <line x1="85" y1="330" x2="200" y2="330" stroke="#446688" stroke-width="1.6" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <line x1="200" y1="330" x2="200" y2="360" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="100" y="324" font-size="10" fill="#666" filter="url(#rough2)">j++</text>

  <!-- inner no -> back to outer (i++) -->
  <path d="M360,372 L420,372 L420,210 L360,210" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="426" y="300" font-size="11" fill="#b85450" filter="url(#rough2)">i++，回外层</text>
</svg>
