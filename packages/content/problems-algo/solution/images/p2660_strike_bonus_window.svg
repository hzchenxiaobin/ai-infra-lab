<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：一次 strike 让接下来两轮价值翻倍</text>

  <!-- round headers -->
  <text x="130" y="72" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">轮 0</text>
  <text x="210" y="72" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">轮 1</text>
  <text x="290" y="72" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">轮 2</text>
  <text x="370" y="72" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">轮 3</text>

  <!-- round 1 is the strike (red/orange) -->
  <rect x="180" y="86" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="106" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10</text>
  <text x="210" y="122" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">strike!</text>

  <!-- round 0 normal -->
  <rect x="100" y="86" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="112" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>

  <!-- round 2 doubled (green) -->
  <rect x="260" y="86" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="106" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="290" y="122" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">×2 = 6</text>

  <!-- round 3 doubled (green) -->
  <rect x="340" y="86" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="106" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="370" y="122" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">×2 = 4</text>

  <!-- bonus window bracket from strike covering rounds 2 and 3 -->
  <path d="M 210 140 Q 210 158 290 158 Q 370 158 370 140" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 290 158 L 290 172" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="180" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">奖励窗口 = 接下来 2 轮</text>

  <!-- look-back window explanation for round 3 -->
  <text x="130" y="206" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">轮 3 的回看窗口 [轮2, 轮1]：</text>
  <rect x="180" y="92" width="220" height="34" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" rx="6" filter="url(#rough2)"/>

  <!-- legend -->
  <rect x="70" y="232" width="18" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="96" y="244" font-size="11" fill="#555" filter="url(#rough2)">strike（10 分）</text>

  <rect x="190" y="232" width="18" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="216" y="244" font-size="11" fill="#555" filter="url(#rough2)">被翻倍轮</text>

  <rect x="300" y="232" width="18" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="326" y="244" font-size="11" fill="#555" filter="url(#rough2)">原值轮</text>

  <text x="280" y="278" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">规则：前两轮任意一轮击中 10 → 本轮价值 ×2（只翻一次，不叠加）</text>
  <text x="280" y="296" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">对应 player1 = [5,10,3,2]：第 2、3 轮因第 1 轮 strike 翻倍</text>
</svg>
