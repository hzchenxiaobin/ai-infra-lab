<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：拍扁成一维，p[k] = 左侧全体之积 × 右侧全体之积</text>
  <text x="310" y="48" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">以 grid = [[1,2],[3,4]]、k 指向元素 3 为例（MOD = 12345）</text>

  <!-- 2D grid -->
  <text x="95" y="96" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">grid:</text>
  <rect x="120" y="74" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="96" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="168" y="74" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="96" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="120" y="112" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="134" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="168" y="112" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="134" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="270" y="112" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">n×m 二维</text>

  <!-- flatten arrow -->
  <path d="M 176 156 L 176 192" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="176" font-size="11" fill="#777" filter="url(#rough2)">拍扁成 a[k]，k = i×m + j</text>

  <!-- 1D row -->
  <text x="48" y="222" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">a[k]:</text>
  <rect x="80" y="196" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="221" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="148" y="196" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="221" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="216" y="196" width="64" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="248" y="221" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="284" y="196" width="64" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="316" y="221" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <!-- k index labels -->
  <text x="112" y="250" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">k=0</text>
  <text x="180" y="250" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">k=1</text>
  <text x="248" y="250" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">k=2</text>
  <text x="316" y="250" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">k=3</text>

  <!-- brackets -->
  <path d="M 80 258 L 80 268 L 212 268 L 212 258" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="146" y="286" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">前缀积 pre = 1×2 = 2</text>
  <path d="M 216 258 L 216 268 L 280 268 L 280 258" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="248" y="286" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">自身跳过</text>
  <path d="M 284 258 L 284 268 L 348 268 L 348 258" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="316" y="286" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">后缀积 suf = 4</text>

  <!-- right result -->
  <text x="482" y="208" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">p[2] = pre × suf</text>
  <text x="482" y="232" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 2 × 4 = 8 ✓</text>
  <text x="482" y="254" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">（对应 p[1][0] = 8）</text>

  <!-- formula box -->
  <rect x="70" y="302" width="480" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="323" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">p[i][j] ≡ pre(i,j) · suf(i,j) (mod 12345)</text>
  <text x="310" y="343" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">pre / suf = 不含自身的 左 / 右 全体元素之积</text>

  <text x="310" y="372" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">⚠️ 12345 = 3×5×823 非质数：除法无逆元、总积取模丢信息 → 只能前后缀拼积</text>
</svg>
