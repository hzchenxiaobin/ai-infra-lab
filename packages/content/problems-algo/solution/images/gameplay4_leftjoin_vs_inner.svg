<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">LEFT JOIN 保留全集 vs INNER JOIN 丢行</text>

  <!-- LEFT JOIN panel (top) -->
  <rect x="30" y="44" width="560" height="180" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="68" font-size="12" fill="#4a7a3a" font-weight="bold">LEFT JOIN（正确 ✓）</text>
  <text x="300" y="68" font-size="9.5" fill="#555">保留左表全集，未匹配行 b 列填 NULL</text>

  <rect x="60" y="80" width="500" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="110" y="95" text-anchor="middle" font-size="9.5" fill="#333">a.player_id</text>
  <text x="230" y="95" text-anchor="middle" font-size="9.5" fill="#333">a.first_login</text>
  <text x="360" y="95" text-anchor="middle" font-size="9.5" fill="#333">b.player_id</text>
  <text x="490" y="95" text-anchor="middle" font-size="9.5" fill="#333">判定</text>
  <line x1="170" y1="80" x2="170" y2="104" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="300" y1="80" x2="300" y2="104" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="430" y1="80" x2="430" y2="104" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="60" y="104" width="500" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="119" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="230" y="119" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">2016-03-01</text>
  <text x="360" y="119" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="490" y="119" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 留存</text>
  <line x1="170" y1="104" x2="170" y2="128" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="300" y1="104" x2="300" y2="128" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="430" y1="104" x2="430" y2="128" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="60" y="128" width="500" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="143" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="230" y="143" text-anchor="middle" font-size="9.5" fill="#333">2017-06-25</text>
  <text x="360" y="143" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">NULL</text>
  <text x="490" y="143" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗ 未留存</text>
  <line x1="170" y1="128" x2="170" y2="152" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="300" y1="128" x2="300" y2="152" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="430" y1="128" x2="430" y2="152" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="60" y="152" width="500" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="167" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="230" y="167" text-anchor="middle" font-size="9.5" fill="#333">2016-03-02</text>
  <text x="360" y="167" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">NULL</text>
  <text x="490" y="167" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗ 未留存</text>
  <line x1="170" y1="152" x2="170" y2="176" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="300" y1="152" x2="300" y2="176" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="430" y1="152" x2="430" y2="176" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>

  <text x="310" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">COUNT(b)=1 ÷ COUNT(a)=3 = 0.33 ✓ 正确</text>
  <text x="310" y="212" text-anchor="middle" font-size="9" fill="#555">分母=左表全部 3 行（含 NULL 行），分子=非 NULL 1 行</text>

  <!-- INNER JOIN panel (bottom) -->
  <rect x="30" y="240" width="560" height="180" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="264" font-size="12" fill="#b85450" font-weight="bold">INNER JOIN（错误 ✗）</text>
  <text x="300" y="264" font-size="9.5" fill="#555">只保留 JOIN 上的行，未留存玩家被整行丢弃</text>

  <rect x="60" y="276" width="500" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="110" y="291" text-anchor="middle" font-size="9.5" fill="#333">a.player_id</text>
  <text x="230" y="291" text-anchor="middle" font-size="9.5" fill="#333">a.first_login</text>
  <text x="360" y="291" text-anchor="middle" font-size="9.5" fill="#333">b.player_id</text>
  <text x="490" y="291" text-anchor="middle" font-size="9.5" fill="#333">判定</text>
  <line x1="170" y1="276" x2="170" y2="300" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="300" y1="276" x2="300" y2="300" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="430" y1="276" x2="430" y2="300" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="60" y="300" width="500" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="315" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="230" y="315" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">2016-03-01</text>
  <text x="360" y="315" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="490" y="315" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 留存</text>
  <line x1="170" y1="300" x2="170" y2="324" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="300" y1="300" x2="300" y2="324" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="430" y1="300" x2="430" y2="324" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- dropped rows indicator -->
  <rect x="60" y="324" width="500" height="24" fill="#fcfcf6" stroke="#888" stroke-width="1" stroke-dasharray="4,3" rx="3" filter="url(#rough2)"/>
  <text x="310" y="339" text-anchor="middle" font-size="9.5" fill="#888">玩家 2、玩家 3 被丢弃（无次日匹配行）</text>
  <line x1="170" y1="324" x2="170" y2="348" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="300" y1="324" x2="300" y2="348" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="430" y1="324" x2="430" y2="348" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="60" y="348" width="500" height="24" fill="#fcfcf6" stroke="#888" stroke-width="1" stroke-dasharray="4,3" rx="3" filter="url(#rough2)"/>
  <text x="310" y="363" text-anchor="middle" font-size="9.5" fill="#888">（行已不存在）</text>

  <text x="310" y="392" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">COUNT(b)=1 ÷ COUNT(a)=1 = 1.00 ✗ 错误</text>
  <text x="310" y="408" text-anchor="middle" font-size="9" fill="#555">分母塌缩成留存人数（玩家 2/3 被丢），比率恒为 1</text>
</svg>
