<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">贪心构造 = 选最小可行字母 + 传播同字母</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">等价于按「首次出现」给等价类赋 a, b, c, …</text>

  <!-- Left: flow steps -->
  <text x="28" y="64" font-size="11" fill="#666" font-weight="bold">流程</text>

  <rect x="20" y="70" width="250" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="89" text-anchor="middle" font-size="11" fill="#333">① 遍历 i = 0 .. n−1</text>

  <path d="M145 100 L145 112" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="20" y="112" width="250" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="131" text-anchor="middle" font-size="11" fill="#333">② s[i] 已赋值？是 → 跳过 (continue)</text>

  <path d="M145 142 L145 154" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="20" y="154" width="250" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="145" y="172" text-anchor="middle" font-size="10.5" fill="#333">③ 选最小 ch：∀j&lt;i 满足</text>
  <text x="145" y="186" text-anchor="middle" font-size="10" fill="#555">(lcp[i][j]&gt;0 ⇒ s[j]=ch) ∧ (lcp[i][j]==0 ⇒ s[j]≠ch)</text>
  <text x="145" y="196" text-anchor="middle" font-size="9.5" fill="#b85450">找不到 → return ""</text>

  <path d="M145 200 L145 210" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="20" y="210" width="250" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="145" y="227" text-anchor="middle" font-size="11" fill="#333">④ s[i]=ch</text>
  <text x="145" y="241" text-anchor="middle" font-size="10" fill="#555">把 ch 传给 j&gt;i 且 lcp[i][j]&gt;0 的位置</text>

  <!-- loop arrow back -->
  <path d="M20 229 Q6 229 6 85 L18 85" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="3 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="10" y="160" font-size="9" fill="#888" transform="rotate(-90 10 160)">下一 i</text>

  <!-- Right: example trace -->
  <text x="298" y="64" font-size="11" fill="#666" font-weight="bold">示例 trace（→ abab）</text>

  <rect x="288" y="70" width="214" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="295" y="86" font-size="10" fill="#d6a040" font-weight="bold">i=0</text>
  <text x="316" y="86" font-size="10" fill="#555">选 'a'，传给 pos2 (lcp[0][2]=2&gt;0)</text>

  <rect x="370" y="100" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="382" y="117" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="396" y="100" width="24" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.5" stroke-dasharray="2 2" rx="3" filter="url(#rough2)"/>
  <text x="408" y="117" text-anchor="middle" font-size="12" fill="#bbb">_</text>
  <rect x="422" y="100" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="434" y="117" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="448" y="100" width="24" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.5" stroke-dasharray="2 2" rx="3" filter="url(#rough2)"/>
  <text x="460" y="117" text-anchor="middle" font-size="12" fill="#bbb">_</text>

  <path d="M382 100 L382 124" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M434 100 L434 124" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="288" y="134" width="214" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="295" y="150" font-size="10" fill="#d6a040" font-weight="bold">i=1</text>
  <text x="316" y="150" font-size="10" fill="#555">选 'b'，传给 pos3 (lcp[1][3]=1&gt;0)</text>

  <rect x="370" y="164" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="382" y="181" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="396" y="164" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="408" y="181" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <rect x="422" y="164" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="434" y="181" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="448" y="164" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="460" y="181" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>

  <path d="M408 164 L408 188" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M460 164 L460 188" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <text x="495" y="205" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">→ "abab"</text>

  <!-- Bottom note -->
  <rect x="20" y="266" width="480" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="284" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">为什么这是字典序最小且唯一合法解？</text>
  <text x="260" y="300" text-anchor="middle" font-size="10.5" fill="#555">LCP 只依赖字符相等/不等 → 字母双射重命名不变 → 按首次出现赋 a,b,c, … 即唯一字典序最小</text>

  <text x="260" y="332" text-anchor="middle" font-size="10" fill="#aaa">注：传播只用了 lcp&gt;0 vs ==0 的二值信息，精确数值留待反向 DP 验证</text>
  <text x="260" y="348" text-anchor="middle" font-size="10" fill="#aaa">阶段 1（构造） → 阶段 2（验证）两段缺一不可</text>
</svg>
