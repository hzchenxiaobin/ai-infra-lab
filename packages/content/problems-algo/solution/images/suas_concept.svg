<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M0,0 L9,0 L4.5,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">未知长度 → 指数扩界定位区间 → 二分精确定位</text>

  <!-- Phase 1 label -->
  <rect x="30" y="48" width="200" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="130" y="66" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">阶段一：指数扩界（倍增）</text>

  <!-- array row with unknown length -->
  <text x="30" y="100" font-size="12" fill="#888">get:</text>
  <rect x="70" y="86" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="91" y="105" text-anchor="middle" font-size="11" fill="#333">−1</text>
  <rect x="116" y="86" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="105" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="162" y="86" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="183" y="105" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="208" y="86" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="105" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="254" y="86" width="42" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="105" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">9</text>
  <rect x="300" y="86" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="321" y="105" text-anchor="middle" font-size="11" fill="#333">12</text>
  <rect x="346" y="86" width="42" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="367" y="105" text-anchor="middle" font-size="11" fill="#b85450">∞</text>
  <text x="402" y="105" font-size="11" fill="#b85450">越界=2³¹−1</text>

  <!-- index labels -->
  <text x="91" y="128" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="137" y="128" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="183" y="128" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="229" y="128" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="275" y="128" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">4</text>
  <text x="321" y="128" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <text x="367" y="128" text-anchor="middle" font-size="9" fill="#b85450">≥6</text>

  <text x="470" y="100" font-size="11" fill="#d6a040" font-weight="bold">target=9</text>

  <!-- doubling steps: right = 1,2,4,8 -->
  <text x="30" y="158" font-size="11" fill="#555">right 翻倍：</text>

  <rect x="120" y="146" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="162" text-anchor="middle" font-size="11" fill="#333">right=1</text>
  <text x="150" y="180" text-anchor="middle" font-size="9.5" fill="#888">get(1)=0 &lt; 9</text>
  <path d="M 180 158 L 210 158" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="216" y="146" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="162" text-anchor="middle" font-size="11" fill="#333">right=2</text>
  <text x="246" y="180" text-anchor="middle" font-size="9.5" fill="#888">get(2)=3 &lt; 9</text>
  <path d="M 276 158 L 306 158" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="312" y="146" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="162" text-anchor="middle" font-size="11" fill="#333">right=4</text>
  <text x="342" y="180" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">get(4)=9 ≥ 9 ⭐</text>

  <text x="385" y="162" font-size="11" fill="#4a7a3a" font-weight="bold">停！</text>

  <!-- bracket showing range found -->
  <path d="M 162 138 L 162 132 L 296 132 L 296 138" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="229" y="126" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">区间 [left=2, right=4]</text>

  <!-- arrow down to phase 2 -->
  <path d="M 270 200 L 270 218" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Phase 2 label -->
  <rect x="30" y="226" width="200" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="130" y="244" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">阶段二：二分查找 [2, 4]</text>

  <!-- binary search mid pointer on index 3 -->
  <rect x="70" y="262" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="91" y="281" text-anchor="middle" font-size="11" fill="#aaa">−1</text>
  <rect x="116" y="262" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="281" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="162" y="262" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="183" y="281" text-anchor="middle" font-size="11" fill="#aaa">3</text>
  <rect x="208" y="262" width="42" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="229" y="281" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="254" y="262" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="281" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">9</text>
  <rect x="300" y="262" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="321" y="281" text-anchor="middle" font-size="11" fill="#aaa">12</text>

  <text x="229" y="304" text-anchor="middle" font-size="10" fill="#888">mid=3, get=5&lt;9 → left=4</text>
  <text x="275" y="304" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">mid=4, get=9 ✅</text>

  <!-- key insight box -->
  <rect x="30" y="324" width="480" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="346" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">倍增 O(log n) 定位区间 + 二分 O(log n) 定位下标</text>
  <text x="270" y="366" text-anchor="middle" font-size="11" fill="#555">哨兵 2³¹−1 让越界与界内逻辑统一，无需判空</text>
  <text x="270" y="380" text-anchor="middle" font-size="10.5" fill="#888">两阶段合计 ≤ 2log₂n 次 get 调用，仍是 O(log n)</text>
</svg>
