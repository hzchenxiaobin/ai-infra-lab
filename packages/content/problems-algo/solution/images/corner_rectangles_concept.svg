<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：两行 + 两列的四个角都为 1 → 一个角矩形</text>

  <!-- Column labels -->
  <text x="160" y="52" text-anchor="middle" font-size="10" fill="#aaa">c0</text>
  <text x="200" y="52" text-anchor="middle" font-size="10" fill="#aaa">c1</text>
  <text x="240" y="52" text-anchor="middle" font-size="10" fill="#aaa">c2</text>
  <text x="280" y="52" text-anchor="middle" font-size="10" fill="#aaa">c3</text>
  <text x="320" y="52" text-anchor="middle" font-size="10" fill="#aaa">c4</text>

  <!-- Row labels -->
  <text x="132" y="88" text-anchor="end" font-size="10" fill="#aaa">r0</text>
  <text x="132" y="128" text-anchor="end" font-size="10" fill="#aaa">r1</text>
  <text x="132" y="168" text-anchor="end" font-size="10" fill="#aaa">r2</text>
  <text x="132" y="208" text-anchor="end" font-size="10" fill="#aaa">r3</text>

  <!-- Row 0: 1 0 0 1 0 -->
  <rect x="140" y="64" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="88" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="180" y="64" width="40" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="200" y="88" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <rect x="220" y="64" width="40" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="240" y="88" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <rect x="260" y="64" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="88" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="300" y="64" width="40" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="320" y="88" text-anchor="middle" font-size="12" fill="#aaa">0</text>

  <!-- Row 1: 0 0 1 0 1 -->
  <rect x="140" y="104" width="40" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="160" y="128" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <rect x="180" y="104" width="40" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="200" y="128" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <rect x="220" y="104" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="128" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="260" y="104" width="40" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <rect x="300" y="104" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="128" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- Row 2: 0 0 0 1 0 -->
  <rect x="140" y="144" width="40" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="160" y="168" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <rect x="180" y="144" width="40" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="200" y="168" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <rect x="220" y="144" width="40" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="240" y="168" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <rect x="260" y="144" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="168" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="300" y="144" width="40" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="320" y="168" text-anchor="middle" font-size="12" fill="#aaa">0</text>

  <!-- Row 3: 1 0 1 0 1 -->
  <rect x="140" y="184" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="208" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="180" y="184" width="40" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="200" y="208" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <rect x="220" y="184" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="208" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="260" y="184" width="40" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="208" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <rect x="300" y="184" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="208" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- Dashed rectangle around the 4 corner cells -->
  <rect x="216" y="100" width="128" height="128" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3" rx="6" filter="url(#rough2)"/>

  <!-- Legend -->
  <rect x="380" y="100" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="400" y="112" font-size="10" fill="#555">角顶点（1）</text>
  <rect x="380" y="120" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="400" y="132" font-size="10" fill="#555">普通 1</text>
  <rect x="380" y="140" width="14" height="14" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <text x="400" y="152" font-size="10" fill="#555">0</text>

  <!-- shared columns annotation -->
  <rect x="60" y="244" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="12" fill="#333">行对 (r₁=1, r₂=3)：两行都为 1 的列 → {c2, c4}</text>
  <text x="280" y="280" text-anchor="middle" font-size="11" fill="#555">cnt = 2，从中任选 2 列 → C(2, 2) = 1 个角矩形</text>

  <!-- formula box -->
  <rect x="60" y="300" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">答案 = Σ C(cnt, 2)，遍历所有行对累加</text>
  <text x="280" y="336" text-anchor="middle" font-size="11" fill="#555">cnt = 该行对中两行同时为 1 的列数</text>
</svg>
