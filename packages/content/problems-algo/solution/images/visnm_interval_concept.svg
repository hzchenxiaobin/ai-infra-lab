<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：峰落入他山 ⟺ 区间包含</text>

  <!-- ============ Left: geometry ============ -->
  <text x="140" y="56" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">几何视角：三角形山</text>

  <!-- x-axis -->
  <line x1="36" y1="312" x2="300" y2="312" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="326" font-size="9.5" fill="#888" filter="url(#rough2)">x</text>

  <!-- mountain i triangle (blue) -->
  <polygon points="60,312 260,312 160,196" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="330" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">(xi−yi,0)</text>
  <text x="260" y="330" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">(xi+yi,0)</text>

  <!-- peak i -->
  <circle cx="160" cy="196" r="3.5" fill="#446688" filter="url(#rough2)"/>
  <text x="170" y="192" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i (xi, yi)</text>

  <!-- peak j inside -->
  <circle cx="196" cy="244" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="206" y="240" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">j (xj, yj)</text>

  <!-- dashed drop lines showing |xj - xi| -->
  <line x1="160" y1="244" x2="196" y2="244" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="160" y1="244" x2="160" y2="196" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <text x="178" y="260" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">|xj−xi|</text>
  <text x="150" y="226" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">yi</text>
  <text x="218" y="252" font-size="10" fill="#888" filter="url(#rough2)">yj</text>

  <!-- condition -->
  <rect x="40" y="346" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="170" y="364" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">峰 j 落入山 i：</text>
  <text x="170" y="380" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">|xj−xi| ≤ yi − yj</text>

  <!-- bridge arrow -->
  <path d="M300,250 L328,250" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="314" y="242" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">取区间</text>
  <text x="314" y="254" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">[x−y, x+y]</text>

  <!-- ============ Right: interval abstraction ============ -->
  <text x="440" y="56" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">区间抽象：底边投影</text>

  <!-- number line -->
  <line x1="336" y1="160" x2="546" y2="160" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- interval i (blue, wide) -->
  <rect x="340" y="150" width="200" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="340" y="146" font-size="10" fill="#446688" filter="url(#rough2)">xi−yi</text>
  <text x="540" y="146" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">xi+yi</text>
  <text x="440" y="184" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">区间 i</text>

  <!-- interval j (red, inside) -->
  <rect x="386" y="214" width="92" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="386" y="248" font-size="10" fill="#b85450" filter="url(#rough2)">xj−yj</text>
  <text x="478" y="248" text-anchor="end" font-size="10" fill="#b85450" filter="url(#rough2)">xj+yj</text>
  <text x="432" y="208" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">区间 j</text>

  <!-- containment indicator -->
  <text x="440" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">j 的两端都在 i 内</text>
  <text x="440" y="292" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">区间 j ⊆ 区间 i</text>

  <!-- ============ Bottom equivalence ============ -->
  <rect x="336" y="320" width="208" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="440" y="340" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">峰 j 落入山 i</text>
  <text x="440" y="356" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">⟺</text>
  <text x="440" y="374" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[xj−yj, xj+yj] ⊆ [xi−yi, xi+yi]</text>
</svg>
