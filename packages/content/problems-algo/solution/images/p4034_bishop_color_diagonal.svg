    <!-- column / row labels -->
    <text x="55" y="50" text-anchor="middle" font-size="9" fill="#6b7f99">1</text>
    <text x="85" y="50" text-anchor="middle" font-size="9" fill="#6b7f99">2</text>
    <text x="115" y="50" text-anchor="middle" font-size="9" fill="#6b7f99">3</text>
    <text x="145" y="50" text-anchor="middle" font-size="9" fill="#6b7f99">4</text>
    <text x="175" y="50" text-anchor="middle" font-size="9" fill="#6b7f99">5</text>
    <text x="205" y="50" text-anchor="middle" font-size="9" fill="#6b7f99">6</text>
    <text x="235" y="50" text-anchor="middle" font-size="9" fill="#6b7f99">7</text>
    <text x="265" y="50" text-anchor="middle" font-size="9" fill="#6b7f99">8</text>
    <text x="32" y="75" text-anchor="middle" font-size="9" fill="#6b7f99">1</text>
    <text x="32" y="105" text-anchor="middle" font-size="9" fill="#6b7f99">2</text>
    <text x="32" y="135" text-anchor="middle" font-size="9" fill="#6b7f99">3</text>
    <text x="32" y="165" text-anchor="middle" font-size="9" fill="#6b7f99">4</text>
    <text x="32" y="195" text-anchor="middle" font-size="9" fill="#6b7f99">5</text>
    <text x="32" y="225" text-anchor="middle" font-size="9" fill="#6b7f99">6</text>
    <text x="32" y="255" text-anchor="middle" font-size="9" fill="#6b7f99">7</text>
    <text x="32" y="285" text-anchor="middle" font-size="9" fill="#6b7f99">8</text>

    <!-- diagonal lines: r−c=2 through source &amp; intersection; r+c=4 through intersection &amp; target -->
    <path d="M 40 116 L 220 296" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 5" fill="none"/>
    <path d="M 40 146 L 130 56" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 5" fill="none"/>
    <text x="222" y="286" font-size="8.5" fill="#8a6d1f">r−c=2</text>
    <text x="134" y="68" font-size="8.5" fill="#8a6d1f">r+c=4</text>

    <!-- path arrows: source → intersection → target -->
    <path d="M 80 156 L 63 139" stroke="#b85450" stroke-width="2.5" marker-end="url(#arrR)" fill="none"/>
    <path d="M 62 124 L 106 80" stroke="#b85450" stroke-width="2.5" marker-end="url(#arrR)" fill="none"/>

    <!-- cell labels -->
    <text x="85" y="166" text-anchor="middle" font-size="13" fill="#2f5527" font-weight="bold">象</text>
    <text x="55" y="135" text-anchor="middle" font-size="9" fill="#8a6d1f" font-weight="bold">中转</text>
    <text x="115" y="75" text-anchor="middle" font-size="9" fill="#8a3a35" font-weight="bold">目标</text>

    <!-- caption -->
    <text x="160" y="316" text-anchor="middle" font-size="10" fill="#333">示例 2：象 (4,2) → 中转 (3,1) → 目标 (1,3)，共 2 步</text>

    <!-- right panel: three classification boxes -->
    <rect x="305" y="52" width="235" height="88" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="422" y="72" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">① 颜色不同 ⇒ 返回 −1</text>
    <text x="318" y="90" font-size="9.2" fill="#8a3a35">象每步 r、c 同时 ±k：r+c 奇偶不变</text>
    <text x="318" y="106" font-size="9.2" fill="#8a3a35">即象永远停留在同色格上</text>
    <text x="318" y="122" font-size="9.2" fill="#8a3a35">(sr+sc) 与 (tr+tc) 奇偶不同 ⇒ −1</text>

    <rect x="305" y="152" width="235" height="88" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="422" y="172" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold">② 同对角线 ⇒ 返回 1</text>
    <text x="318" y="190" font-size="9.2" fill="#33507a">r−c 相等：同在 ↘ 主对角线</text>
    <text x="318" y="206" font-size="9.2" fill="#33507a">r+c 相等：同在 ↗ 反对角线</text>
    <text x="318" y="222" font-size="9.2" fill="#33507a">source ≠ target，一步直达 ⇒ 1</text>

    <rect x="305" y="252" width="235" height="96" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="422" y="272" text-anchor="middle" font-size="11" fill="#2f5527" font-weight="bold">③ 同色 + 异对角线 ⇒ 返回 2</text>
    <text x="318" y="290" font-size="9.2" fill="#2f5527">过 source 对角线 × 过 target 反对角线</text>
    <text x="318" y="306" font-size="9.2" fill="#2f5527">交点即中转格（同色 ⇒ 恰为整数格）</text>
    <text x="318" y="322" font-size="9.2" fill="#2f5527">source → 交点 → target，两步必达</text>
    <text x="318" y="338" font-size="9.2" fill="#2f5527">8×8 棋盘上交点必有其一在界内</text>
  </g>
</svg>
