<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 396" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="396" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：只看奇偶——有效子序列只有 4 种形态</text>

  <rect x="30" y="42" width="460" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">(sub[0]+sub[1])%2 == (sub[1]+sub[2])%2 == ⋯ == (sub[x−2]+sub[x−1])%2</text>
  <text x="260" y="84" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">→ 所有相邻和的奇偶性全相同，设公共奇偶为 k（k = 0 或 1）</text>

  <rect x="30" y="118" width="225" height="196" fill="#f2f6fb" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="142" y="141" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">k = 0：相邻和全为偶数</text>
  <text x="142" y="159" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">奇+奇=偶，偶+偶=偶</text>
  <text x="142" y="175" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">→ 相邻元素同奇偶，一路传导</text>

  <text x="44" y="198" font-size="11" fill="#446688" filter="url(#rough2)">全奇</text>
  <rect x="95" y="182" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="131" y="182" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="167" y="182" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="203" y="182" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="110" y="198" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">奇</text>
  <text x="146" y="198" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">奇</text>
  <text x="182" y="198" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">奇</text>
  <text x="218" y="198" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">奇</text>

  <text x="44" y="236" font-size="11" fill="#4a7a3a" filter="url(#rough2)">全偶</text>
  <rect x="95" y="220" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="131" y="220" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="167" y="220" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="203" y="220" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="110" y="236" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">偶</text>
  <text x="146" y="236" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">偶</text>
  <text x="182" y="236" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">偶</text>
  <text x="218" y="236" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">偶</text>

  <text x="142" y="272" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">长度 = 奇数个数 / 偶数个数</text>
  <text x="142" y="290" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">（一趟计数即可）</text>

  <rect x="265" y="118" width="225" height="196" fill="#fdf8f0" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="377" y="141" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">k = 1：相邻和全为奇数</text>
  <text x="377" y="159" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">奇+偶=奇（奇偶必成对）</text>
  <text x="377" y="175" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">→ 相邻元素异奇偶，交替出现</text>

  <text x="279" y="198" font-size="11" fill="#555" filter="url(#rough2)">奇开头</text>
  <rect x="330" y="182" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="366" y="182" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="402" y="182" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="438" y="182" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="345" y="198" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">奇</text>
  <text x="381" y="198" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">偶</text>
  <text x="417" y="198" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">奇</text>
  <text x="453" y="198" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">偶</text>

  <text x="279" y="236" font-size="11" fill="#555" filter="url(#rough2)">偶开头</text>
  <rect x="330" y="220" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="366" y="220" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="402" y="220" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="438" y="220" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="345" y="236" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">偶</text>
  <text x="381" y="236" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">奇</text>
  <text x="417" y="236" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">偶</text>
  <text x="453" y="236" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">奇</text>

  <text x="377" y="272" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">长度 = 最长奇偶交替</text>
  <text x="377" y="290" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">（每个同奇偶段各取一个）</text>

  <rect x="30" y="330" width="460" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = max(奇数个数, 偶数个数, 最长交替)</text>
  <text x="260" y="372" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">具体数值无关紧要——全部信息都藏在 mod 2 里</text>
</svg>
