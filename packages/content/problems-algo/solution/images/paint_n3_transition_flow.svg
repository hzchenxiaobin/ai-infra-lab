<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">状态机 DP：ABA / ABC 两状态滚动递推</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">下一行方案数只由上一行形状决定 → 2 个状态滚动</text>

  <!-- ===== Left: four steps ===== -->
  <g font-size="10" fill="#333">
    <!-- ① 状态定义 -->
    <rect x="36" y="66" width="236" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="154" y="88" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 状态定义</text>
    <text x="154" y="106" text-anchor="middle" font-size="10" fill="#555">aba = 末行为 ABA 型的方案数</text>
    <text x="154" y="119" text-anchor="middle" font-size="10" fill="#555">abc = 末行为 ABC 型的方案数</text>

    <path d="M 154 124 L 154 138" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- ② 转移方程 -->
    <rect x="36" y="140" width="236" height="108" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="154" y="160" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② 转移方程（反向累加）</text>
    <text x="52" y="182" font-family="monospace" font-size="11" fill="#333">aba ← 3·aba + 2·abc</text>
    <text x="52" y="200" font-family="monospace" font-size="11" fill="#333">abc ← 2·aba + 2·abc</text>
    <text x="52" y="220" font-size="9" fill="#888">ABA 行有 5 个后继，ABC 行有 4 个</text>
    <text x="52" y="234" font-size="9" fill="#888">系数来自枚举（见右表）</text>

    <path d="M 154 248 L 154 262" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- ③ 初始条件 -->
    <rect x="36" y="264" width="236" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="154" y="284" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③ 初始条件（n=1）</text>
    <text x="154" y="304" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">aba = abc = 6</text>

    <path d="M 154 318 L 154 332" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- ④ 计算顺序 -->
    <rect x="36" y="334" width="236" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="154" y="356" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">④ 计算顺序</text>
    <text x="154" y="374" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">i = 2 → 3 → ... → n</text>
    <text x="154" y="388" text-anchor="middle" font-size="9" fill="#888">两变量滚动，自底向上</text>
  </g>

  <!-- ===== Right: transition count table ===== -->
  <text x="394" y="78" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">转移计数（prev → next）</text>
  <g>
    <!-- header row -->
    <rect x="300" y="86" width="64" height="26" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="332" y="104" text-anchor="middle" font-size="9" fill="#888">prev＼next</text>
    <rect x="364" y="86" width="62" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="395" y="104" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">ABA</text>
    <rect x="426" y="86" width="62" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="457" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ABC</text>

    <!-- ABA row -->
    <rect x="300" y="112" width="64" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="332" y="133" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">ABA</text>
    <rect x="364" y="112" width="62" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="395" y="133" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
    <rect x="426" y="112" width="62" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="457" y="133" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>

    <!-- ABC row -->
    <rect x="300" y="144" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="332" y="165" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ABC</text>
    <rect x="364" y="144" width="62" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="395" y="165" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
    <rect x="426" y="144" width="62" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="457" y="165" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  </g>

  <!-- answer box -->
  <rect x="296" y="196" width="196" height="60" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="394" y="216" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">答案汇总</text>
  <text x="394" y="236" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">ans = (aba + abc)</text>
  <text x="394" y="250" text-anchor="middle" font-family="monospace" font-size="11" fill="#b85450" font-weight="bold">% (10⁹+7)</text>

  <!-- rolling code box -->
  <rect x="296" y="268" width="196" height="124" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="394" y="288" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">滚动数组 O(1) 空间</text>
  <text x="308" y="308" font-family="monospace" font-size="10" fill="#333">na = (3*aba + 2*abc) % M;</text>
  <text x="308" y="324" font-family="monospace" font-size="10" fill="#333">nc = (2*aba + 2*abc) % M;</text>
  <text x="308" y="344" font-family="monospace" font-size="10" fill="#b85450" font-weight="bold">aba, abc = na, nc;</text>
  <text x="308" y="366" font-size="9" fill="#888">同时赋值，避免临时变量</text>
  <text x="308" y="380" font-size="9" fill="#888">每步取模防溢出</text>
</svg>
