<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：前导零免费，值位段长度 ≤ ⌊log₂k⌋+1</text>

  <!-- row label -->
  <text x="92" y="50" font-size="11" fill="#888">下标</text>
  <text x="92" y="83" font-size="12" fill="#888" font-weight="bold">s:</text>

  <!-- index labels -->
  <text x="146" y="50" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">0</text>
  <text x="194" y="50" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">1</text>
  <text x="242" y="50" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">2</text>
  <text x="290" y="50" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">3</text>
  <text x="338" y="50" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">4</text>
  <text x="386" y="50" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">5</text>
  <text x="434" y="50" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">6</text>

  <!-- Row1: original s = 1 0 0 1 0 1 0 -->
  <!-- dropped '1' at idx 0 -->
  <rect x="122" y="60" width="48" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="146" y="85" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold">1</text>
  <path d="M 132 68 L 160 90" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <!-- kept '0' idx 1 -->
  <rect x="170" y="60" width="48" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="194" y="85" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <!-- kept '0' idx 2 -->
  <rect x="218" y="60" width="48" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="242" y="85" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <!-- dropped '1' idx 3 -->
  <rect x="266" y="60" width="48" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="85" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold">1</text>
  <path d="M 276 68 L 304 90" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <!-- kept '0' idx 4 -->
  <rect x="314" y="60" width="48" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="338" y="85" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <!-- kept '1' idx 5 (the MSB of value part) -->
  <rect x="362" y="60" width="48" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="386" y="85" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- kept '0' idx 6 -->
  <rect x="410" y="60" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="434" y="85" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <!-- downward hint arrows from kept cells to subsequence row -->
  <path d="M 194 100 L 194 138" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <path d="M 242 100 L 242 138" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <path d="M 338 100 L 314 138" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <path d="M 386 100 L 338 138" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <path d="M 434 100 L 386 138" stroke="#446688" stroke-width="1.2" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>

  <!-- Row2: subsequence = 0 0 0 1 0 -->
  <text x="92" y="169" font-size="12" fill="#888" font-weight="bold">子序列:</text>
  <rect x="170" y="150" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="194" y="175" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="218" y="150" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="242" y="175" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="266" y="150" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="175" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="314" y="150" width="48" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="338" y="175" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="362" y="150" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="386" y="175" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <!-- Bracket A: 前导零 over j0,j1,j2 (x 170..314) -->
  <path d="M 170 192 L 170 200 L 314 200 L 314 192" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="242" y="218" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">前导零 · 值=0（免费）</text>

  <!-- Bracket B: 值位段 over j3,j4 (x 314..410) -->
  <path d="M 314 192 L 314 200 L 410 200 L 410 192" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="362" y="218" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">值位段 “10”₂ = 2 ≤ k</text>

  <!-- note: dropped ones -->
  <text x="290" y="244" text-anchor="middle" font-size="11" fill="#b85450">（丢弃 idx 0、3 的两个 ‘1’，它们权重过大）</text>

  <!-- formula box -->
  <rect x="40" y="258" width="500" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="278" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">答案 = 前导零数(3) + 值位段长度(2) = 5</text>
  <text x="290" y="295" text-anchor="middle" font-size="11" fill="#666">所有 ‘0’ 都保留（免费 / 翻倍由贪心自动权衡），只挑选 ‘1’ 的去留</text>

  <!-- bound box -->
  <rect x="40" y="312" width="500" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="332" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">值位段首位必为 1，长度 L ⇒ 数值 ≥ 2^(L−1)</text>
  <text x="290" y="350" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">L &gt; m = ⌊log₂k⌋+1 时，2^m &gt; k，必不合法 ⇒ 值位段长度 ≤ m</text>
  <text x="290" y="364" text-anchor="middle" font-size="10" fill="#888">本题 k=5，m=3；只关注末尾约 m 个 ‘1’ 的去留即可</text>
</svg>
