<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：滚动数组 DP 求最长公共子串</text>

  <!-- start -->
  <rect x="195" y="36" width="170" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="57" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">输入 initial（m）、target（n）</text>

  <path d="M 280 68 L 280 88" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="205" y="92" width="150" height="30" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="112" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">f[0..n] = 0，mx = 0</text>

  <path d="M 280 122 L 280 136" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1: loop condition -->
  <polygon points="280,140 375,172 280,204 185,172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="168" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">还有 (i, j) 没扫？</text>
  <text x="280" y="185" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">i = 1…m，j = n…1</text>

  <!-- no: return -->
  <path d="M 375 172 L 448 172" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="410" y="164" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="452" y="154" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="502" y="177" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return m+n−2mx</text>

  <!-- yes: loop body -->
  <path d="M 280 204 L 280 224" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="292" y="218" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="185" y="228" width="190" height="30" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">取当前 i、j（j 沿倒序方向）</text>

  <path d="M 280 258 L 280 272" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 2: match? -->
  <polygon points="280,276 385,314 280,352 175,314" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">initial[i−1] ==</text>
  <text x="280" y="327" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">target[j−1] ?</text>

  <!-- yes branch -->
  <path d="M 385 314 L 418 314" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="401" y="306" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="422" y="290" width="128" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="486" y="309" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">f[j] = f[j−1] + 1</text>
  <text x="486" y="328" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">mx = max(mx, f[j])</text>

  <!-- no branch -->
  <path d="M 175 314 L 142 314" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="158" y="306" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="18" y="290" width="124" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="309" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">f[j] = 0</text>
  <text x="80" y="328" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">公共串断裂清零</text>

  <!-- next pair box -->
  <rect x="205" y="400" width="150" height="30" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="420" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">下一对 (i, j)</text>

  <!-- merge arrows -->
  <path d="M 280 352 L 280 396" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 486 338 L 486 415 L 357 415" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 80 338 L 80 415 L 201 415" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- loop back -->
  <path d="M 205 415 L 8 415 L 8 172 L 181 172" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="112" y="408" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">回到循环条件</text>

  <!-- note -->
  <rect x="90" y="440" width="380" height="24" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="456" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">倒序滚动：f[j] 依赖上一行的 f[j−1]，先算大的 j 读到的才是旧值（同 0-1 背包）</text>
</svg>
