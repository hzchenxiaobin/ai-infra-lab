<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 0 0 L 7 3.5 L 0 7 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：4×4 房间，14 个空格全部清扫</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">数字 = 清扫顺序；✗ = 障碍；起点 (1,1) 朝↑，依次试 ↑→↓←</text>

  <!-- ===== grid 4x4, cell 44, origin (60, 80) ===== -->
  <!-- col labels -->
  <g font-size="9.5" fill="#aaa" text-anchor="middle">
    <text x="82" y="74">0</text><text x="126" y="74">1</text><text x="170" y="74">2</text><text x="214" y="74">3</text>
  </g>
  <!-- row labels -->
  <g font-size="9.5" fill="#aaa" text-anchor="end">
    <text x="54" y="106">0</text><text x="54" y="150">1</text><text x="54" y="194">2</text><text x="54" y="238">3</text>
  </g>

  <!-- Row 0: 13, 2, 3, 4 -->
  <rect x="60" y="80" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="82" y="108" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">13</text>
  <rect x="104" y="80" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="126" y="108" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="148" y="80" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="170" y="108" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="192" y="80" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="214" y="108" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- Row 1: 12, robot(1), 5, obstacle -->
  <rect x="60" y="124" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="82" y="152" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">12</text>
  <!-- robot start cell -->
  <rect x="104" y="124" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="3" filter="url(#rough2)"/>
  <circle cx="126" cy="142" r="9" fill="#d6a040" stroke="#7a5415" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 126 135 L 122 146 L 126 143 L 130 146 Z" fill="#7a5415" filter="url(#rough2)"/>
  <text x="126" y="166" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1 (起点)</text>
  <rect x="148" y="124" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="170" y="152" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">5</text>
  <rect x="192" y="124" width="44" height="44" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="3" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="214" y="155" text-anchor="middle" font-size="16" fill="#bbb" font-weight="bold">✗</text>

  <!-- Row 2: 11, 10, 6, 9 -->
  <rect x="60" y="168" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="82" y="196" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">11</text>
  <rect x="104" y="168" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="126" y="196" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">10</text>
  <rect x="148" y="168" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="170" y="196" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">6</text>
  <rect x="192" y="168" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="214" y="196" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">9</text>

  <!-- Row 3: 14, obstacle, 7, 8 -->
  <rect x="60" y="212" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="82" y="240" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">14</text>
  <rect x="104" y="212" width="44" height="44" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="3" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="126" y="243" text-anchor="middle" font-size="16" fill="#bbb" font-weight="bold">✗</text>
  <rect x="148" y="212" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="170" y="240" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">7</text>
  <rect x="192" y="212" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="214" y="240" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">8</text>

  <!-- DFS tree arrows on grid (thin, dashed) -->
  <!-- 1(126,142)->2(126,102) up -->
  <path d="M 126 132 L 126 118" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- 2(126,102)->3(170,102) right -->
  <path d="M 148 102 L 162 102" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- 3->4 right -->
  <path d="M 192 102 L 206 102" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- 3(170,124)->5(170,146) down -->
  <path d="M 170 124 L 170 138" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- 5->6 down -->
  <path d="M 170 168 L 170 182" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- 6->7 down -->
  <path d="M 170 212 L 170 226" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- 7(192,234)->8(214,234) right -->
  <path d="M 192 234 L 206 234" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- 8(214,212)->9(214,190) up -->
  <path d="M 214 212 L 214 198" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- 6(148,190)->10(126,190) left -->
  <path d="M 148 190 L 136 190" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- 10->11 left -->
  <path d="M 104 190 L 92 190" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- 11(82,168)->12(82,146) up -->
  <path d="M 82 168 L 82 154" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- 12(82,124)->13(82,102) up -->
  <path d="M 82 124 L 82 118" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- 11(82,212)->14(82,234) down -->
  <path d="M 82 212 L 82 226" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== right side: DFS call tree ===== -->
  <text x="430" y="74" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">DFS 调用树（方向标在边上）</text>
  <g font-size="10" fill="#446688">
    <!-- root: 1 -->
    <rect x="412" y="86" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="430" y="101" text-anchor="middle" font-weight="bold" fill="#d6a040">1</text>
    <!-- 1 -> 2 (up) -->
    <path d="M 430 108 L 430 124" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
    <text x="438" y="120" font-size="8.5" fill="#888">↑</text>
    <rect x="412" y="126" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="430" y="141" text-anchor="middle" font-weight="bold" fill="#4a7a3a">2</text>
    <!-- 2 -> 3 (right) -->
    <path d="M 430 148 L 430 162" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
    <text x="438" y="158" font-size="8.5" fill="#888">→</text>
    <rect x="412" y="164" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="430" y="179" text-anchor="middle" font-weight="bold" fill="#4a7a3a">3</text>
    <!-- 3 -> 4 (right) and 3 -> 5 (down) -->
    <path d="M 430 186 L 430 198" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
    <rect x="372" y="200" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="390" y="215" text-anchor="middle" font-weight="bold" fill="#4a7a3a">4</text>
    <text x="404" y="214" font-size="8.5" fill="#888">→</text>
    <rect x="452" y="200" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="470" y="215" text-anchor="middle" font-weight="bold" fill="#4a7a3a">5</text>
    <text x="444" y="214" font-size="8.5" fill="#888">↓</text>
    <!-- 5 -> 6 -->
    <path d="M 470 222 L 470 236" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
    <text x="478" y="232" font-size="8.5" fill="#888">↓</text>
    <rect x="452" y="238" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="470" y="253" text-anchor="middle" font-weight="bold" fill="#4a7a3a">6</text>
    <!-- 6 -> 7 (down), 6 -> 10 (left) -->
    <path d="M 470 260 L 470 274" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
    <rect x="452" y="276" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="470" y="291" text-anchor="middle" font-weight="bold" fill="#4a7a3a">7</text>
    <text x="484" y="290" font-size="8.5" fill="#888">↓</text>
    <!-- 7 -> 8 (right) -> 9 (up) -->
    <path d="M 488 287 L 510 287 L 510 300" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
    <rect x="492" y="302" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="510" y="317" text-anchor="middle" font-weight="bold" fill="#4a7a3a">8</text>
    <rect x="492" y="328" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="510" y="343" text-anchor="middle" font-weight="bold" fill="#4a7a3a">9</text>
    <text x="524" y="342" font-size="8.5" fill="#888">↑</text>
    <!-- 6 -> 10 (left branch) -->
    <path d="M 452 249 L 420 249 L 420 274" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
    <text x="428" y="246" font-size="8.5" fill="#888">←</text>
    <rect x="402" y="276" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="420" y="291" text-anchor="middle" font-weight="bold" fill="#4a7a3a">10</text>
    <!-- 10 -> 11 (left) -->
    <path d="M 402 287 L 374 287 L 374 300" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
    <text x="380" y="284" font-size="8.5" fill="#888">←</text>
    <rect x="356" y="302" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="374" y="317" text-anchor="middle" font-weight="bold" fill="#4a7a3a">11</text>
    <!-- 11 -> 12 (up) -> 13 (up) -->
    <path d="M 374 324 L 374 336" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
    <text x="380" y="334" font-size="8.5" fill="#888">↑</text>
    <rect x="356" y="338" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="374" y="353" text-anchor="middle" font-weight="bold" fill="#4a7a3a">12</text>
    <rect x="356" y="364" width="36" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="374" y="378" text-anchor="middle" font-weight="bold" fill="#4a7a3a">13</text>
    <!-- 11 -> 14 (down) -->
    <path d="M 392 313 L 430 313 L 430 336" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
    <rect x="412" y="338" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="430" y="353" text-anchor="middle" font-weight="bold" fill="#4a7a3a">14</text>
    <text x="438" y="332" font-size="8.5" fill="#888">↓</text>
  </g>

  <!-- legend bottom -->
  <rect x="40" y="288" width="240" height="92" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" rx="8" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="56" y="308" font-size="11" fill="#444" font-weight="bold">要点</text>
  <text x="56" y="326" font-size="10" fill="#555">• 每格先 clean 再标记，四向轮试</text>
  <text x="56" y="342" font-size="10" fill="#555">• 撞墙/越界：move() 返回 false，跳过</text>
  <text x="56" y="358" font-size="10" fill="#555">• 递归返回后 go_back() 回到本格</text>
  <text x="56" y="374" font-size="10" fill="#4a7a3a" font-weight="bold">→ 14 个空格全扫，零遗漏</text>
</svg>
