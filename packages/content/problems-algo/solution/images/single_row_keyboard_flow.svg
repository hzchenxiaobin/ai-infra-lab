<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建映射表 → 初始化 → 遍历累加 → 返回</text>

  <!-- Box 1: build map -->
  <rect x="130" y="42" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12" fill="#333">① 建位置映射表</text>
  <text x="260" y="76" text-anchor="middle" font-size="10.5" fill="#888">for i in 0..25: pos[keyboard[i]] = i</text>

  <path d="M 260 82 L 260 94" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 2: init -->
  <rect x="130" y="94" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="117" text-anchor="middle" font-size="12" fill="#333">② prev = 0, ans = 0（手指初始在下标 0）</text>

  <path d="M 260 130 L 260 142" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: word 还有字符? -->
  <polygon points="260,144 360,178 260,212 160,178" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">word 还有</text>
  <text x="260" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">字符?</text>

  <!-- No branch (down) -->
  <path d="M 260 212 L 260 318" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="266" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Yes branch (right) -->
  <path d="M 360 178 L 400 178" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="172" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>

  <!-- Box 3: lookup + accumulate (right side, loop body) -->
  <rect x="402" y="150" width="110" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="457" y="168" text-anchor="middle" font-size="10.5" fill="#333">③ cur = pos[c]</text>
  <text x="457" y="184" text-anchor="middle" font-size="10.5" fill="#333">ans += |prev−cur|</text>
  <text x="457" y="200" text-anchor="middle" font-size="10.5" fill="#333">prev = cur</text>

  <!-- loop back arrow: from box3 bottom, down, left, up to diamond top -->
  <path d="M 457 206 L 457 240 L 260 240 L 260 144" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="234" text-anchor="middle" font-size="9.5" fill="#888">取下一字符 c</text>

  <!-- Box 4: return -->
  <rect x="130" y="318" width="260" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="341" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">④ return ans</text>

  <text x="260" y="368" text-anchor="middle" font-size="11" fill="#888">建表 O(26)=O(1) + 遍历 O(n) = 总时间 O(n)，空间 O(1)</text>
</svg>
