<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">与目标颜色间的最短距离：双向扫描 + O(1) 查询</text>

  <!-- step 1: left-to-right pass -->
  <rect x="40" y="44" width="440" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">① 左→右扫描：维护 last[c] = 颜色 c 最近出现的下标</text>
  <line x1="52" y1="72" x2="468" y2="72" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="260" y="92" text-anchor="middle" font-size="11" fill="#444">last[colors[i]] = i</text>
  <text x="260" y="110" text-anchor="middle" font-size="11" fill="#444">对每个 c ∈ {1,2,3}：若 last[c] ≠ -1，则 dist[i][c] = i − last[c]</text>
  <text x="260" y="130" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">O(n) 一次遍历，记录每个位置向左最近的各颜色</text>

  <path d="M 260 148 L 260 168" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- step 2: right-to-left pass -->
  <rect x="40" y="172" width="440" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="192" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">② 右→左扫描：维护 last[c]，取 min 合并右向距离</text>
  <line x1="52" y1="200" x2="468" y2="200" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="260" y="220" text-anchor="middle" font-size="11" fill="#444">last[colors[i]] = i</text>
  <text x="260" y="238" text-anchor="middle" font-size="11" fill="#444">对每个 c ∈ {1,2,3}：若 last[c] ≠ -1，则 dist[i][c] = min(dist[i][c], last[c] − i)</text>
  <text x="260" y="258" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">O(n) 反向遍历，补全右向最近，取 min 得最终距离</text>

  <path d="M 260 276 L 260 296" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- step 3: query -->
  <rect x="100" y="300" width="320" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">③ 查询 [index, color]</text>
  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#444">d = dist[index][color]</text>
  <text x="260" y="360" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">返回 d ≠ INF ? d : −1</text>

  <!-- side note -->
  <rect x="30" y="300" width="64" height="72" fill="#fafafa" stroke="#aaa" stroke-width="1" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
  <text x="62" y="322" text-anchor="middle" font-size="9" fill="#888">每次查询</text>
  <text x="62" y="338" text-anchor="middle" font-size="9" fill="#888">O(1)</text>
  <text x="62" y="354" text-anchor="middle" font-size="9" fill="#888">直接查表</text>

  <text x="260" y="400" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">预处理 O(n)  ·  查询 O(1)  ·  总 O(n + q)</text>

  <!-- note about color count -->
  <rect x="80" y="412" width="360" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="427" text-anchor="middle" font-size="9.5" fill="#b85450">颜色仅 3 种 → 内层循环常数 3，总 O(3n) = O(n)</text>
</svg>
