<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">按位判据：bit b 能否被某子序列和点亮？</text>
  <text x="280" y="52" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">只看每个数的低 b+1 位 low[i]，其前缀和单调不减（与原序无关）</text>

  <!-- ===== Track 1：情形① 前缀和落入区间 ===== -->
  <text x="50" y="148" font-size="14" fill="#2f5a22" filter="url(#rough2)">情形①</text>
  <line x1="120" y1="150" x2="520" y2="150" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="290" y="140" width="160" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="140" y1="144" x2="140" y2="156" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="290" y1="142" x2="290" y2="158" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="450" y1="142" x2="450" y2="158" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="172" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="290" y="132" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">2^b</text>
  <text x="450" y="132" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">2^(b+1)</text>
  <text x="370" y="132" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">目标区间</text>
  <path d="M150,185 Q250,170 358,151" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="440" y="188" text-anchor="middle" font-size="12" fill="#2f5a22" filter="url(#rough2)">前缀和落入 [2^b, 2^(b+1))</text>
  <text x="440" y="206" text-anchor="middle" font-size="12" fill="#2f5a22" filter="url(#rough2)">→ ans |= prefix 命中 bit b</text>

  <!-- ===== Track 2：情形② 跳过区间 ===== -->
  <text x="50" y="298" font-size="14" fill="#b85450" filter="url(#rough2)">情形②</text>
  <line x1="120" y1="300" x2="520" y2="300" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="290" y="290" width="160" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="140" y1="294" x2="140" y2="306" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="290" y1="292" x2="290" y2="308" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="450" y1="292" x2="450" y2="308" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="322" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="290" y="282" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">2^b</text>
  <text x="450" y="282" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">2^(b+1)</text>
  <!-- P_{k-1} 虚线标记，位于 0 与 2^b 之间 -->
  <line x1="225" y1="294" x2="225" y2="306" stroke="#888" stroke-width="1.4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="225" y="322" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">P(k-1)&lt;2^b</text>
  <!-- 跳跃弧线：从 P_{k-1} 起越过区间落到 2^(b+1) 之后 -->
  <path d="M232,315 Q370,250 473,301" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="415" y="352" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">前缀和跳过区间到 ≥ 2^(b+1)</text>
  <text x="415" y="370" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">→ 新加的 x 自带 bit b，ans |= x 兜底</text>

  <!-- 底部判据 -->
  <rect x="40" y="386" width="480" height="0" fill="none"/>
  <text x="280" y="392" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">判据：bit b ∈ 答案 ⟺ Σ low[i] ≥ 2^b（情形①②必居其一）</text>
</svg>
