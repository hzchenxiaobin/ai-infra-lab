<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">状态压缩：5 个元音 → 5 位掩码（只记奇偶）</text>

  <!-- vowel -> bit mapping -->
  <rect x="60" y="44" width="420" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">元音 → 位映射（1 = 奇数次，0 = 偶数次）</text>
  <text x="270" y="76" text-anchor="middle" font-size="11" fill="#555">a→bit0 · e→bit1 · i→bit2 · o→bit3 · u→bit4</text>

  <!-- string row: pos -1 (empty) + e l e e t -->
  <text x="40" y="120" font-size="12" fill="#888">字符:</text>
  <rect x="70" y="104" width="60" height="30" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="100" y="124" text-anchor="middle" font-size="12" fill="#aaa">ε</text>
  <rect x="130" y="104" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="124" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">e</text>
  <rect x="190" y="104" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="124" text-anchor="middle" font-size="13" fill="#333">l</text>
  <rect x="250" y="104" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">e</text>
  <rect x="310" y="104" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="124" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">e</text>
  <rect x="370" y="104" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="124" text-anchor="middle" font-size="13" fill="#333">t</text>

  <text x="100" y="148" text-anchor="middle" font-size="9" fill="#aaa">pos=−1</text>
  <text x="160" y="148" text-anchor="middle" font-size="9" fill="#aaa">i=0</text>
  <text x="220" y="148" text-anchor="middle" font-size="9" fill="#aaa">i=1</text>
  <text x="280" y="148" text-anchor="middle" font-size="9" fill="#aaa">i=2</text>
  <text x="340" y="148" text-anchor="middle" font-size="9" fill="#aaa">i=3</text>
  <text x="400" y="148" text-anchor="middle" font-size="9" fill="#aaa">i=4</text>

  <!-- mask row -->
  <text x="40" y="182" font-size="12" fill="#888">掩码:</text>
  <rect x="70" y="166" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="100" y="186" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace">00000</text>
  <rect x="130" y="166" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="186" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace">01000</text>
  <rect x="190" y="166" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="186" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace">01000</text>
  <rect x="250" y="166" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="186" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace">00000</text>
  <rect x="310" y="166" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="340" y="186" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace">01000</text>
  <rect x="370" y="166" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="400" y="186" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace">01000</text>

  <!-- arc 1: pos -1 (00000) and i=2 (00000) -->
  <path d="M 100 198 Q 100 212 112 212 L 268 212 Q 280 212 280 198" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="190" y="230" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">掩码同为 00000 → "ele" 中 e 出现 2 次（偶）✓</text>

  <!-- arc 2: i=0 (01000) and i=4 (01000) -->
  <path d="M 160 198 Q 160 252 174 252 L 386 252 Q 400 252 400 198" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">掩码同为 01000 → "leet" 中 e 出现 2 次（偶）✓</text>

  <!-- equation box -->
  <rect x="40" y="288" width="460" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="310" text-anchor="middle" font-size="12" fill="#333">只关心奇偶 → 精确计数压缩成 5 位</text>
  <text x="270" y="330" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">mask[j] == mask[i] ⇔ s[i+1..j] 所有元音偶数次</text>
  <text x="270" y="350" text-anchor="middle" font-size="10.5" fill="#888">两处前缀奇偶状态相同 → 中间各元音增量为偶数（抵消）</text>
</svg>
