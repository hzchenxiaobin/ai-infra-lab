  <rect x="172" y="54" width="64" height="26" fill="#f7f7f7" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="204" y="71" text-anchor="middle" font-size="10" fill="#999" font-style="italic" filter="url(#rough2)">−∞</text>
  <rect x="236" y="54" width="64" height="26" fill="#f7f7f7" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="268" y="71" text-anchor="middle" font-size="10" fill="#999" font-style="italic" filter="url(#rough2)">−∞</text>
  <rect x="300" y="54" width="64" height="26" fill="#f7f7f7" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="332" y="71" text-anchor="middle" font-size="10" fill="#999" font-style="italic" filter="url(#rough2)">−∞</text>
  <rect x="364" y="54" width="64" height="26" fill="#f7f7f7" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="396" y="71" text-anchor="middle" font-size="10" fill="#999" font-style="italic" filter="url(#rough2)">−∞</text>

  <!-- 行 2：j=0 -->
  <rect x="94" y="80" width="34" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="111" y="97" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">0</text>
  <rect x="128" y="80" width="44" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="97" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <rect x="172" y="80" width="64" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="204" y="97" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="236" y="80" width="64" height="26" fill="#f7f7f7" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="268" y="97" text-anchor="middle" font-size="10" fill="#999" font-style="italic" filter="url(#rough2)">−∞</text>
  <rect x="300" y="80" width="64" height="26" fill="#f7f7f7" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="332" y="97" text-anchor="middle" font-size="10" fill="#999" font-style="italic" filter="url(#rough2)">−∞</text>
  <rect x="364" y="80" width="64" height="26" fill="#f7f7f7" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="396" y="97" text-anchor="middle" font-size="10" fill="#999" font-style="italic" filter="url(#rough2)">−∞</text>

  <!-- 行 3：j=1 -->
  <rect x="94" y="106" width="34" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="111" y="123" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">1</text>
  <rect x="128" y="106" width="44" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
