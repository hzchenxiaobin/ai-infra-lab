  <rect x="172" y="106" width="64" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="204" y="123" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6</text>
  <rect x="236" y="106" width="64" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="268" y="123" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">−6</text>
  <rect x="300" y="106" width="64" height="26" fill="#f7f7f7" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="332" y="123" text-anchor="middle" font-size="10" fill="#999" font-style="italic" filter="url(#rough2)">−∞</text>
  <rect x="364" y="106" width="64" height="26" fill="#f7f7f7" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="396" y="123" text-anchor="middle" font-size="10" fill="#999" font-style="italic" filter="url(#rough2)">−∞</text>

  <!-- 行 4：j=2 -->
  <rect x="94" y="132" width="34" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="111" y="149" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">2</text>
  <rect x="128" y="132" width="44" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="149" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <rect x="172" y="132" width="64" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="204" y="149" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">12</text>
  <rect x="236" y="132" width="64" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="268" y="149" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">14</text>
  <rect x="300" y="132" width="64" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="332" y="149" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">14</text>
  <rect x="364" y="132" width="64" height="26" fill="#f7f7f7" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="396" y="149" text-anchor="middle" font-size="10" fill="#999" font-style="italic" filter="url(#rough2)">−∞</text>

  <!-- 行 5：j=3 -->
  <rect x="94" y="158" width="34" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="111" y="175" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">3</text>
  <rect x="128" y="158" width="44" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="175" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">−5</text>
  <rect x="172" y="158" width="64" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="204" y="175" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">12</text>
  <rect x="236" y="158" width="64" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="268" y="175" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">14</text>
  <rect x="300" y="158" width="64" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="332" y="175" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">14</text>
  <rect x="364" y="158" width="64" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="396" y="175" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">−16</text>

  <!-- 行 6：j=4 -->
  <rect x="94" y="184" width="34" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="111" y="201" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">4</text>
  <rect x="128" y="184" width="44" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="201" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">−3</text>
  <rect x="172" y="184" width="64" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="204" y="201" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">12</text>
  <rect x="236" y="184" width="64" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="268" y="201" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">14</text>
  <rect x="300" y="184" width="64" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="332" y="201" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">14</text>
  <rect x="364" y="184" width="64" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="396" y="201" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">−16</text>

  <!-- 行 7：j=5（关键行） -->
  <rect x="94" y="210" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="111" y="227" text-anchor="middle" font-size="9.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="128" y="210" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="150" y="227" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">2</text>
  <rect x="172" y="210" width="64" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="204" y="227" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">12</text>
  <rect x="236" y="210" width="64" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="268" y="227" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">16</text>
  <rect x="300" y="210" width="64" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="332" y="227" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">24</text>
  <rect x="364" y="210" width="64" height="26" fill="#fff8e1" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="396" y="227" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">26</text>

  <!-- 行 8：j=6 -->
  <rect x="94" y="236" width="34" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="111" y="253" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">6</text>
  <rect x="128" y="236" width="44" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="253" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">−7</text>
  <rect x="172" y="236" width="64" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="204" y="253" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">12</text>
  <rect x="236" y="236" width="64" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
