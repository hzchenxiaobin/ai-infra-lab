<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1 演算：a = [3,2,5,6]，b = [2,−6,4,−5,−3,2,−7]</text>

  <!-- 表头 -->
  <rect x="94" y="32" width="34" height="22" fill="#f0f0f0" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="111" y="47" text-anchor="middle" font-size="10" fill="#444" font-weight="bold" filter="url(#rough2)">j</text>
  <rect x="128" y="32" width="44" height="22" fill="#f0f0f0" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="150" y="47" text-anchor="middle" font-size="10" fill="#444" font-weight="bold" filter="url(#rough2)">b[j]</text>
  <rect x="172" y="32" width="64" height="22" fill="#f0f0f0" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="204" y="47" text-anchor="middle" font-size="10" fill="#444" font-weight="bold" filter="url(#rough2)">dp[0]</text>
  <rect x="236" y="32" width="64" height="22" fill="#f0f0f0" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="268" y="47" text-anchor="middle" font-size="10" fill="#444" font-weight="bold" filter="url(#rough2)">dp[1]</text>
  <rect x="300" y="32" width="64" height="22" fill="#f0f0f0" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="332" y="47" text-anchor="middle" font-size="10" fill="#444" font-weight="bold" filter="url(#rough2)">dp[2]</text>
  <rect x="364" y="32" width="64" height="22" fill="#f0f0f0" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="396" y="47" text-anchor="middle" font-size="10" fill="#444" font-weight="bold" filter="url(#rough2)">dp[3]</text>

  <!-- 行 1：初始 -->
  <rect x="94" y="54" width="34" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="111" y="71" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">初始</text>
  <rect x="128" y="54" width="44" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
