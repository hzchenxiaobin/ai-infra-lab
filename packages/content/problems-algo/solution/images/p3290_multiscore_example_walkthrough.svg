  <text x="396" y="253" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">26</text>

  <!-- 底部注记 -->
  <text x="260" y="278" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">−∞ 表示该阶段尚未配满（非法状态），不参与转移</text>

  <rect x="55" y="290" width="410" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="10.5" fill="#3a5f30" font-weight="bold" filter="url(#rough2)">dp[3] = 26 = 3×2 + 2×(−6) + 5×4 + 6×2</text>

  <path d="M 150 322 L 150 332" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">对应选中的下标 0, 1, 2, 5（j=5 时 dp[3] = dp[2]旧值 14 + 6×2）—— 与官方解释一致 ✓</text>
</svg>
