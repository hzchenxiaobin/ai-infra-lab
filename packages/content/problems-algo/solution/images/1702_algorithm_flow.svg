<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历找 p、c，按公式构造结果</text>

  <!-- Step 1: input -->
  <rect x="200" y="48" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">输入 binary</text>
  <text x="280" y="80" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">长度 n</text>

  <path d="M 280 90 L 280 108" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: scan -->
  <rect x="170" y="112" width="220" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">一次遍历</text>
  <text x="280" y="148" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">p = 首个 '0' 的下标</text>
  <text x="280" y="162" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">c = '0' 的总数</text>

  <path d="M 280 170 L 280 188" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: c == 0 ? -->
  <polygon points="280,192 360,232 280,272 200,232" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c == 0 ?</text>
  <text x="280" y="244" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">(无 0)</text>

  <!-- Yes branch: return binary -->
  <path d="M 200 232 L 96 232" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="148" y="226" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="32" y="212" width="64" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="64" y="230" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回</text>
  <text x="64" y="244" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">binary</text>

  <!-- No branch -->
  <path d="M 360 232 L 464 232" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="226" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Step: construct -->
  <rect x="320" y="288" width="220" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="308" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">构造答案</text>
  <line x1="332" y1="316" x2="528" y2="316" stroke="#e0c0c0" stroke-width="1" filter="url(#rough2)"/>
  <text x="332" y="332" font-size="10" fill="#555" filter="url(#rough2)">前缀：'1' × (p + c − 1)</text>
  <text x="332" y="348" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">中间：'0'（唯一一个）</text>
  <text x="332" y="364" font-size="10" fill="#555" filter="url(#rough2)">后缀：'1' × (n − p − c)</text>

  <!-- arrow from decision no to construct -->
  <path d="M 464 232 L 464 288" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)" style="display:none"/>

  <!-- connect no-branch down to construct -->
  <path d="M 430 272 L 430 288" stroke="none"/>

  <!-- return -->
  <path d="M 430 376 L 430 396" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="366" y="400" width="128" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="430" y="420" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">返回结果字符串</text>

  <!-- left side: complexity note -->
  <rect x="40" y="288" width="220" height="86" fill="#fff" stroke="#eee" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="308" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">复杂度</text>
  <line x1="52" y1="316" x2="248" y2="316" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="332" font-size="10" fill="#555" filter="url(#rough2)">时间：O(n)</text>
  <text x="52" y="348" font-size="10" fill="#555" filter="url(#rough2)">  一次遍历找 p、c</text>
  <text x="52" y="364" font-size="10" fill="#555" filter="url(#rough2)">空间：O(n)（输出串）</text>

  <!-- Footer -->
  <text x="280" y="432" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">无需真正模拟操作 —— 公式直接定位唯一 0 的位置</text>
</svg>
