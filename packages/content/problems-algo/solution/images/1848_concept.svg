<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：在所有 nums[i] == target 处取 |i − start| 的最小值</text>

  <!-- Subtitle -->
  <text x="270" y="46" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">示例：nums = [1, 5, 2, 5, 3, 5, 4]，target = 5，start = 6</text>

  <!-- start marker above cell 6 (center x=460) -->
  <text x="460" y="66" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">start = 6</text>
  <path d="M 460 70 L 460 80" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Array cells: 7 cells, width 60, height 40, starting at x=70, y=82 -->
  <!-- Cell 0: val=1, non-match -->
  <rect x="70" y="82" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- Cell 1: val=5, match -->
  <rect x="130" y="82" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- Cell 2: val=2, non-match -->
  <rect x="190" y="82" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- Cell 3: val=5, match -->
  <rect x="250" y="82" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- Cell 4: val=3, non-match -->
  <rect x="310" y="82" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- Cell 5: val=5, match -->
  <rect x="370" y="82" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="400" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- Cell 6: val=4, start position (non-match) -->
  <rect x="430" y="82" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- Index labels below cells -->
  <text x="100" y="140" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="160" y="140" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="220" y="140" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="280" y="140" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>
  <text x="340" y="140" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4</text>
  <text x="400" y="140" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">5</text>
  <text x="460" y="140" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">6</text>

  <!-- Divider -->
  <path d="M 40 160 L 500 160" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Distance section: for each match, show |i - start| -->
  <text x="50" y="186" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">target 出现下标：</text>
  <text x="160" y="186" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">i = 1</text>
  <text x="280" y="186" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">i = 3</text>
  <text x="400" y="186" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">i = 5</text>

  <text x="50" y="214" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">|i − start|：</text>

  <!-- Distance boxes for matches -->
  <rect x="130" y="198" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="217" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>

  <rect x="250" y="198" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="217" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="370" y="198" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="217" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- min arrow pointing to distance 1 -->
  <text x="400" y="248" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">↑ 最小</text>

  <!-- Result box -->
  <rect x="80" y="262" width="380" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="284" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">答案 = min(5, 3, 1) = 1</text>
  <text x="270" y="302" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">返回 |i − start| 的最小值</text>

  <!-- General rule box -->
  <rect x="60" y="322" width="420" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="342" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">一般规则</text>
  <text x="270" y="360" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">遍历所有 i，若 nums[i] == target，则用 |i − start| 更新最小值</text>
</svg>
