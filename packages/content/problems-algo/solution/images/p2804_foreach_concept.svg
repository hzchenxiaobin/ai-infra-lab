<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrOrange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心直觉：forEach 逐元素调用 callback，context 绑定为 callback 内部的 this</text>

  <!-- Array row -->
  <text x="60" y="68" font-size="12" fill="#446688" font-weight="bold">数组 this</text>
  <rect x="60" y="78" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="103" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="90" y="73" text-anchor="middle" font-size="9" fill="#888">i=0</text>

  <rect x="125" y="78" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="103" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="155" y="73" text-anchor="middle" font-size="9" fill="#888">i=1</text>

  <rect x="190" y="78" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="103" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="220" y="73" text-anchor="middle" font-size="9" fill="#888">i=2</text>

  <text x="258" y="103" font-size="13" fill="#888">...</text>

  <!-- Loop arrow under array -->
  <path d="M 90 122 Q 90 140 90 155" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 155 122 Q 155 140 155 155" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 220 122 Q 220 140 220 155" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="155" y="145" text-anchor="middle" font-size="10" fill="#888">逐元素遍历</text>

  <!-- Callback box -->
  <rect x="55" y="165" width="230" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="170" y="185" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">callback.call(context, val, i, arr)</text>
  <text x="170" y="203" text-anchor="middle" font-size="10" fill="#666">参数1 val = this[i]（当前元素值）</text>
  <text x="170" y="218" text-anchor="middle" font-size="10" fill="#666">参数2 i = 当前下标</text>
  <text x="170" y="233" text-anchor="middle" font-size="10" fill="#666">参数3 arr = this（原数组引用，可修改）</text>

  <!-- Context box (thisArg) -->
  <rect x="370" y="165" width="150" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="445" y="185" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">context (thisArg)</text>
  <text x="445" y="205" text-anchor="middle" font-size="10" fill="#666">回调内部的 this</text>
  <text x="445" y="222" text-anchor="middle" font-size="10" fill="#d6a040">例：false / 5 / obj</text>

  <!-- Arrow from context to callback (this binding) -->
  <path d="M 370 200 L 290 200" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="320" y="192" text-anchor="middle" font-size="10" fill="#d6a040">绑定为 this</text>

  <!-- callback can mutate array -->
  <path d="M 170 235 Q 170 260 170 275" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="65" y="282" width="210" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="170" y="307" text-anchor="middle" font-size="11" fill="#b85450">callback 可通过 arr[i] = ... 就地修改数组</text>

  <!-- Key points -->
  <rect x="350" y="282" width="190" height="55" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="445" y="300" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">规范要点</text>
  <text x="358" y="315" font-size="9.5" fill="#666">• 长度 len 在起始时缓存一次</text>
  <text x="358" y="329" font-size="9.5" fill="#666">• 稀疏数组空洞用 i in this 跳过</text>

  <!-- Bottom note -->
  <rect x="40" y="352" width="480" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="375" text-anchor="middle" font-size="11" fill="#446688">一次调用 callback.call(context, this[i], i, this) —— 值、下标、数组、this 四要素齐全</text>
</svg>
