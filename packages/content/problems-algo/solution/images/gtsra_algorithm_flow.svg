<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="700" height="400" fill="#fafafa"/>

  <text x="350" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：窗口函数排序计数 → 筛选 rn=2 或 cnt=1</text>

  <!-- ===== Step 1: UserActivity table ===== -->
  <rect x="20" y="48" width="140" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">UserActivity</text>
  <text x="90" y="84" text-anchor="middle" font-size="9.5" fill="#666">username | activity</text>
  <text x="90" y="98" text-anchor="middle" font-size="9.5" fill="#666">startDate | endDate</text>

  <!-- arrow -->
  <path d="M160 78 L200 78" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="180" y="70" text-anchor="middle" font-size="9" fill="#446688">PARTITION</text>
  <text x="180" y="94" text-anchor="middle" font-size="9" fill="#446688">BY username</text>

  <!-- ===== Step 2: window functions (rn + cnt) ===== -->
  <rect x="205" y="48" width="190" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="66" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">两个窗口函数并列</text>
  <text x="215" y="84" font-size="9.5" fill="#333">rn = ROW_NUMBER() OVER(</text>
  <text x="225" y="96" font-size="9" fill="#666">PARTITION BY username</text>
  <text x="225" y="106" font-size="9" fill="#666">ORDER BY startDate DESC)</text>

  <!-- arrow down -->
  <path d="M300 108 L300 132" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- cnt box -->
  <rect x="205" y="132" width="190" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="150" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">cnt = COUNT(*) OVER(</text>
  <text x="300" y="166" text-anchor="middle" font-size="9.5" fill="#666">PARTITION BY username)</text>

  <!-- arrow to filter -->
  <path d="M300 176 L300 200" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ===== Step 3: filter ===== -->
  <rect x="160" y="204" width="280" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="300" y="224" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">WHERE rn = 2  OR  cnt = 1</text>
  <text x="300" y="240" text-anchor="middle" font-size="9.5" fill="#666">rn=2 抓多活动次近｜cnt=1 兜底单活动</text>

  <!-- arrow to result -->
  <path d="M300 252 L300 276" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Step 4: result ===== -->
  <rect x="180" y="280" width="240" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <rect x="180" y="280" width="240" height="20" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="294" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">输出（每用户一行）</text>
  <text x="300" y="318" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">username, activity, startDate, endDate</text>

  <!-- ===== right side: no-window-function approach ===== -->
  <rect x="450" y="48" width="230" height="282" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="565" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">解法 B：自连接数「更近」</text>
  <line x1="465" y1="76" x2="665" y2="76" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="465" y="94" font-size="9.5" fill="#333" font-weight="bold">思路：对每行 u1，数同用户</text>
  <text x="465" y="106" font-size="9.5" fill="#333">中 startDate 更大的行数 g</text>
  <line x1="465" y1="114" x2="665" y2="114" stroke="#888" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="465" y="132" font-size="9.5" fill="#d6a040" font-weight="bold">g = 0 → 最新（rn1）</text>
  <text x="465" y="146" font-size="9.5" fill="#4a7a3a" font-weight="bold">g = 1 → 次近（rn2）✓</text>
  <text x="465" y="160" font-size="9.5" fill="#888">g = 2 → 第三（rn3）</text>
  <line x1="465" y1="168" x2="665" y2="168" stroke="#888" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="465" y="186" font-size="9.5" fill="#333" font-weight="bold">两段 UNION：</text>
  <text x="470" y="202" font-size="9" fill="#666">① g = 1 → 多用户次近</text>
  <text x="470" y="216" font-size="9" fill="#666">② 总数 = 1 → 单活动</text>
  <text x="470" y="234" font-size="9" fill="#666">LEFT JOIN u2 ON</text>
  <text x="470" y="246" font-size="9" fill="#666">  u1.user=u2.user</text>
  <text x="470" y="258" font-size="9" fill="#666">  AND u2.start &gt; u1.start</text>
  <text x="470" y="274" font-size="9" fill="#666">HAVING COUNT(u2.start)=1</text>
  <text x="470" y="290" font-size="9" fill="#b85450">⚠ 不用窗口函数的兜底</text>
  <text x="470" y="304" font-size="9" fill="#b85450">写法，O(n²) 相关子查询</text>
  <text x="470" y="318" font-size="9" fill="#b85450">单活动需 UNION 第二段</text>

  <!-- bottom note -->
  <rect x="20" y="346" width="660" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="350" y="364" text-anchor="middle" font-size="10" fill="#333">题眼：<tspan fill="#b85450" font-weight="bold">「每人取倒数第 2」+「单活动兜底」</tspan>——rn=2 与 cnt=1 用 OR 合并，单条件各管一边，互不重叠</text>
  <text x="350" y="380" text-anchor="middle" font-size="9.5" fill="#666">因 cnt=1 时唯一行 rn 必为 1（不等于 2），故 OR 两支无交集，不会重复输出</text>
</svg>
