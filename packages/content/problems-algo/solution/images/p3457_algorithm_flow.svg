<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 名额求和</text>

  <!-- Step 1: sort -->
  <rect x="130" y="40" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="240" y="59" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">排序（升序）pizzas[0..n−1]</text>
  <path d="M 240 70 L 240 84" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- Step 2: m, k -->
  <rect x="115" y="86" width="250" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="240" y="102" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">m = n / 4（总天数）</text>
  <text x="240" y="117" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">k = ⌈m/2⌉（奇数天个数）</text>
  <path d="M 240 122 L 240 136" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- Step 3: odd days -->
  <rect x="100" y="138" width="280" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="240" y="157" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">ans = 前 k 大之和（a[n−k] … a[n−1]）</text>
  <path d="M 240 168 L 240 184" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- Diamond -->
  <polygon points="240,186 334,232 240,278 146,232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="230" text-anchor="middle" font-size="11.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">j &lt; m − k ?</text>
  <text x="240" y="246" text-anchor="middle" font-size="8.5" fill="#8a6a1f" filter="url(#rough2)">（还有偶数天名额）</text>

  <!-- No: return -->
  <text x="346" y="226" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 334 232 L 362 232" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="366" y="217" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="421" y="236" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- Yes: loop body -->
  <text x="252" y="296" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 240 278 L 240 296" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="140" y="298" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="240" y="315" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">ans += a[n−k−2−2j]（计较小者）</text>
  <text x="240" y="331" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">j = j + 1（下一对）</text>

  <!-- loop back -->
  <path d="M 140 318 L 58 318 L 58 232 L 142 232" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="25" y="352" width="470" height="62" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="372" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">奇数天名额：前 k 大一一计重（1 换 1，性价比最高）</text>
  <text x="260" y="388" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">偶数天名额：第 k+2、k+4、… 大计重（2 换 1）</text>
  <text x="260" y="404" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">排序 O(n log n) 是唯一瓶颈，累计求和仅 O(n)</text>
</svg>
