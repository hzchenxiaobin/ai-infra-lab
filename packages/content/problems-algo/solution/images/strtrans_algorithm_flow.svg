<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：三步判定</text>

  <!-- 开始 -->
  <rect x="200" y="48" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">输入 str1, str2</text>
  <line x1="280" y1="82" x2="280" y2="100" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判1: str1 == str2 ? -->
  <polygon points="280,102 380,142 280,182 180,142" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">str1 == str2 ?</text>
  <text x="280" y="156" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">零次转换即可</text>

  <!-- 是 → true -->
  <line x1="380" y1="142" x2="448" y2="142" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="412" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="448" y="124" width="90" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="493" y="147" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return true</text>

  <!-- 否 → 下一步 -->
  <line x1="280" y1="182" x2="280" y2="202" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="196" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 步骤2: 建映射表 + 校验函数 -->
  <rect x="150" y="204" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">遍历建映射 m[str1[i]] = str2[i]</text>
  <line x1="280" y1="238" x2="280" y2="256" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判2: 映射冲突? -->
  <polygon points="280,258 390,298 280,338 170,298" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">m[a] 已存在</text>
  <text x="280" y="310" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">且 m[a] ≠ b ?</text>

  <!-- 是 → false -->
  <line x1="390" y1="298" x2="448" y2="298" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="418" y="292" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="448" y="280" width="90" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="493" y="303" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">return false</text>

  <!-- 否 → 下一步 -->
  <line x1="280" y1="338" x2="280" y2="358" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="352" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 判3: str2 用满 26 字母? -->
  <polygon points="280,360 390,400 280,440 170,400" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="396" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">|set(str2)| == 26 ?</text>
  <text x="280" y="412" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">无空闲字符破环</text>

  <!-- 是 → false -->
  <line x1="390" y1="400" x2="448" y2="400" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="418" y="394" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="448" y="382" width="90" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="493" y="405" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">return false</text>

  <!-- 否 → true -->
  <line x1="280" y1="440" x2="280" y2="456" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="296" y="452" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="210" y="456" width="140" height="20" fill="none" stroke="none"/>
  <text x="280" y="472" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return true</text>
</svg>
