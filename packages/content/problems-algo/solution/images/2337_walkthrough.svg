<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1 演算：start 与 target 的片段一一对应</text>

  <!-- index axis -->
  <g font-size="10" fill="#aaa">
    <text x="102" y="60" text-anchor="middle">0</text>
    <text x="146" y="60" text-anchor="middle">1</text>
    <text x="190" y="60" text-anchor="middle">2</text>
    <text x="234" y="60" text-anchor="middle">3</text>
    <text x="278" y="60" text-anchor="middle">4</text>
    <text x="322" y="60" text-anchor="middle">5</text>
    <text x="366" y="60" text-anchor="middle">6</text>
    <text x="410" y="60" text-anchor="middle">7</text>
    <text x="454" y="60" text-anchor="middle">8</text>
  </g>

  <!-- start label -->
  <text x="40" y="94" font-size="12" fill="#446688" font-weight="bold">start</text>
  <!-- start row cells: _ L _ _ R _ _ R _ -->
  <g font-size="14">
    <rect x="80"  y="72" width="44" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="102" y="97" text-anchor="middle" fill="#aaa">_</text>
    <rect x="124" y="72" width="44" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="146" y="98" text-anchor="middle" fill="#b85450" font-weight="bold">L</text>
    <rect x="168" y="72" width="44" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="190" y="97" text-anchor="middle" fill="#aaa">_</text>
    <rect x="212" y="72" width="44" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="234" y="97" text-anchor="middle" fill="#aaa">_</text>
    <rect x="256" y="72" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="278" y="98" text-anchor="middle" fill="#4a7a3a" font-weight="bold">R</text>
    <rect x="300" y="72" width="44" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="322" y="97" text-anchor="middle" fill="#aaa">_</text>
    <rect x="344" y="72" width="44" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="366" y="97" text-anchor="middle" fill="#aaa">_</text>
    <rect x="388" y="72" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="410" y="98" text-anchor="middle" fill="#4a7a3a" font-weight="bold">R</text>
    <rect x="432" y="72" width="44" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="454" y="97" text-anchor="middle" fill="#aaa">_</text>
  </g>

  <!-- matching arrows (from start cell bottom to target cell top) -->
  <!-- L: start@1 -> target@0 -->
  <path d="M 146 114 L 102 188" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="110" y="156" font-size="10.5" fill="#b85450" font-weight="bold">L 左移 1≥0 ✓</text>

  <!-- R1: start@4 -> target@7 -->
  <path d="M 278 114 L 410 188" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="300" y="156" font-size="10.5" fill="#4a7a3a" font-weight="bold">R 右移 4≤7 ✓</text>

  <!-- R2: start@7 -> target@8 -->
  <path d="M 410 114 L 454 188" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="416" y="172" font-size="10.5" fill="#4a7a3a" font-weight="bold">R 右移 7≤8 ✓</text>

  <!-- target label -->
  <text x="40" y="214" font-size="12" fill="#4a7a3a" font-weight="bold">target</text>
  <!-- target row cells: L _ _ _ _ _ R R _  (wait: target length 9: L______RR is 9 chars: L,_,_,_,_,_,_,R,R) -->
  <g font-size="14">
    <rect x="80"  y="192" width="44" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="102" y="218" text-anchor="middle" fill="#b85450" font-weight="bold">L</text>
    <rect x="124" y="192" width="44" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="146" y="217" text-anchor="middle" fill="#aaa">_</text>
    <rect x="168" y="192" width="44" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="190" y="217" text-anchor="middle" fill="#aaa">_</text>
    <rect x="212" y="192" width="44" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="234" y="217" text-anchor="middle" fill="#aaa">_</text>
    <rect x="256" y="192" width="44" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="278" y="217" text-anchor="middle" fill="#aaa">_</text>
    <rect x="300" y="192" width="44" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="322" y="217" text-anchor="middle" fill="#aaa">_</text>
    <rect x="344" y="192" width="44" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="366" y="217" text-anchor="middle" fill="#aaa">_</text>
    <rect x="388" y="192" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="410" y="218" text-anchor="middle" fill="#4a7a3a" font-weight="bold">R</text>
    <rect x="432" y="192" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="454" y="218" text-anchor="middle" fill="#4a7a3a" font-weight="bold">R</text>
  </g>

  <!-- conclusion -->
  <rect x="80" y="288" width="396" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="278" y="310" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">三项检查全过 → true</text>
  <text x="278" y="346" text-anchor="middle" font-size="10.5" fill="#888">顺序一致 L,R,R；每个 L 起点≥终点、每个 R 起点≤终点</text>
</svg>
