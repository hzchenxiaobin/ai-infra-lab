<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="30" y="22" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：判可行 → 除 9 分解 → 拼接（天然降序）</text>

  <!-- 起点 -->
  <rect x="215" y="40" width="130" height="34" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="61" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">输入 num, sum</text>
  <path d="M 280 74 L 280 88" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判可行 -->
  <polygon points="185,128 280,90 375,128 280,166" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">sum &gt; 9·num ?</text>
  <path d="M 375 128 L 428 128" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="386" y="121" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="428" y="110" width="112" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="484" y="132" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">返回 ""</text>
  <path d="M 280 166 L 280 192" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="186" font-size="10" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 除 9 分解 -->
  <rect x="180" y="192" width="200" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="212" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">k = sum ÷ 9（9 的个数）</text>
  <text x="280" y="230" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">r = sum mod 9（余数位）</text>
  <path d="M 280 240 L 280 262" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判余数 -->
  <polygon points="215,304 280,270 345,304 280,338" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">r = 0 ?</text>

  <path d="M 215 304 L 170 304" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="176" y="297" font-size="10" fill="#446688" filter="url(#rough2)">是</text>
  <rect x="42" y="282" width="128" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="106" y="300" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">ans = "9"×k</text>
  <text x="106" y="318" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">+ "0"×(num−k)</text>

  <path d="M 345 304 L 392 304" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="353" y="297" font-size="10" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="392" y="282" width="146" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="465" y="300" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">ans = "9"×k + str(r)</text>
  <text x="465" y="318" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">+ "0"×(num−k−1)</text>

  <!-- 汇合输出 -->
  <path d="M 106 326 L 106 356 L 196 356" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 465 326 L 465 356 L 364 356" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="336" width="160" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="354" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans</text>
  <text x="280" y="371" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">（天然降序 ⇒ 同分最大）</text>
</svg>
