<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：嵌套深度 = 当前未闭合的 ‘(’ 数量</text>

  <!-- String characters -->
  <text x="30" y="64" font-size="11" fill="#888">s =</text>
  <g font-size="14" fill="#333" text-anchor="middle">
    <text x="44" y="64" font-weight="bold" fill="#b85450">(</text>
    <text x="71" y="64">1</text>
    <text x="98" y="64">+</text>
    <text x="125" y="64" font-weight="bold" fill="#b85450">(</text>
    <text x="152" y="64">2</text>
    <text x="179" y="64">*</text>
    <text x="206" y="64">3</text>
    <text x="233" y="64" font-weight="bold" fill="#4a7a3a">)</text>
    <text x="260" y="64">+</text>
    <text x="287" y="64" font-weight="bold" fill="#b85450">(</text>
    <text x="314" y="64" font-weight="bold" fill="#b85450">(</text>
    <text x="341" y="64">8</text>
    <text x="368" y="64" font-weight="bold" fill="#4a7a3a">)</text>
    <text x="395" y="64">/</text>
    <text x="422" y="64">4</text>
    <text x="449" y="64" font-weight="bold" fill="#4a7a3a">)</text>
    <text x="476" y="64" font-weight="bold" fill="#4a7a3a">)</text>
    <text x="503" y="64">+</text>
    <text x="530" y="64">1</text>
  </g>

  <!-- Depth axis guide lines -->
  <g stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)">
    <line x1="20" y1="320" x2="548" y2="320"/>
    <line x1="20" y1="288" x2="548" y2="288"/>
    <line x1="20" y1="256" x2="548" y2="256"/>
    <line x1="20" y1="224" x2="548" y2="224"/>
  </g>
  <g font-size="10" fill="#888" text-anchor="end">
    <text x="16" y="324">0</text>
    <text x="16" y="292">1</text>
    <text x="16" y="260">2</text>
    <text x="16" y="228">3</text>
  </g>
  <text x="16" y="208" font-size="10" fill="#888" text-anchor="end">depth</text>

  <!-- Vertical tick lines at each char (faint) -->
  <g stroke="#eee" stroke-width="1" filter="url(#rough2)">
    <line x1="44" y1="70" x2="44" y2="320"/>
    <line x1="125" y1="70" x2="125" y2="320"/>
    <line x1="233" y1="70" x2="233" y2="320"/>
    <line x1="287" y1="70" x2="287" y2="320"/>
    <line x1="314" y1="70" x2="314" y2="320"/>
    <line x1="368" y1="70" x2="368" y2="320"/>
    <line x1="449" y1="70" x2="449" y2="320"/>
    <line x1="476" y1="70" x2="476" y2="320"/>
  </g>

  <!-- Step graph: depth after each char -->
  <path d="M 30 320 L 44 320 L 44 288 L 71 288 L 98 288 L 125 288 L 125 256 L 152 256 L 179 256 L 206 256 L 233 256 L 233 288 L 260 288 L 287 288 L 287 256 L 314 256 L 314 224 L 341 224 L 368 224 L 368 256 L 395 256 L 422 256 L 449 256 L 449 288 L 476 288 L 476 320 L 503 320 L 530 320"
        fill="none" stroke="#446688" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" filter="url(#rough2)"/>

  <!-- Peak segment highlight (depth 3) -->
  <path d="M 314 224 L 368 224" fill="none" stroke="#b85450" stroke-width="3.5" stroke-linecap="round" filter="url(#rough2)"/>
  <circle cx="341" cy="224" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="341" y="210" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">峰值 = 3</text>

  <!-- Peak annotation arrow -->
  <path d="M 420 196 L 360 218" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="190" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">ans = max(ans, depth)</text>
  <text x="470" y="204" text-anchor="middle" font-size="9" fill="#999">每次 ‘(’ 后更新</text>

  <!-- Insight box -->
  <rect x="30" y="346" width="500" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="48" y="364" font-size="11" fill="#446688" font-weight="bold">关键洞察</text>
  <text x="48" y="380" font-size="11" fill="#555">遇 ‘(’ → depth++ 并刷新 ans；遇 ‘)’ → depth--；其余字符直接跳过。</text>
</svg>
