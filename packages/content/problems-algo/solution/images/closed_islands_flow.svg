<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="540" height="400" fill="#fdfcf7"/>

  <text x="270" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">两阶段算法流程</text>
  <path d="M 170 38 Q 270 46 370 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Phase 1 -->
  <g filter="url(#sk2)">
    <rect x="60" y="56" width="420" height="96" rx="12" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="80" y="80" font-size="14" font-weight="bold" fill="#b85450">Phase 1：淹没边界连通的陆地</text>
  <text x="80" y="102" font-size="12" fill="#444">遍历四条边上的每个格子 (i, j)：</text>
  <text x="100" y="120" font-size="12" fill="#444">若 grid[i][j] == 0 → DFS/BFS 把整个连通块标记为 1</text>
  <text x="100" y="138" font-size="11" fill="#888">（顶/底边逐列扫，左/右边逐行扫，各 O(M+N) 起点）</text>

  <!-- arrow down -->
  <path d="M 270 162 L 270 186" stroke="#5a5a5a" stroke-width="2.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Phase 2 -->
  <g filter="url(#sk2)">
    <rect x="60" y="192" width="420" height="96" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="80" y="216" font-size="14" font-weight="bold" fill="#4a7a3a">Phase 2：数剩余岛屿（即封闭岛屿）</text>
  <text x="80" y="238" font-size="12" fill="#444">遍历内部所有格子 (i, j)（1 ≤ i ≤ M-2, 1 ≤ j ≤ N-2 也行）：</text>
  <text x="100" y="256" font-size="12" fill="#444">若 grid[i][j] == 0 → count++, DFS 沉岛（标记为 1）</text>
  <text x="100" y="274" font-size="11" fill="#888">（同 200 岛屿数量的沉岛法，原地修改省 visited）</text>

  <!-- arrow down -->
  <path d="M 270 298 L 270 322" stroke="#5a5a5a" stroke-width="2.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Result -->
  <g filter="url(#sk2)">
    <rect x="120" y="328" width="300" height="50" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="270" y="350" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">返回 count = 封闭岛屿数</text>
  <text x="270" y="368" text-anchor="middle" font-size="11" fill="#888">两阶段各 O(M×N)，总时间 O(M×N)</text>
</svg>
