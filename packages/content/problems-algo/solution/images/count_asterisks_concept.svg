<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：| 成对出现，串被切成“外/内/外/内/外”交替段</text>

  <!-- Pairing arcs above bars -->
  <path d="M 138 54 Q 196 24 254 54" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="196" y="36" text-anchor="middle" font-size="11" fill="#b85450">成对</text>
  <path d="M 354 54 Q 396 24 438 54" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="396" y="36" text-anchor="middle" font-size="11" fill="#b85450">成对</text>

  <!-- Seg 0 "l" - 外 green -->
  <rect x="96" y="54" width="32" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="77" text-anchor="middle" font-size="13" fill="#333">l</text>
  <!-- Bar 1 -->
  <text x="138" y="78" text-anchor="middle" font-size="18" fill="#888" font-weight="bold">|</text>
  <!-- Seg 1 "*e*et" - 内 red -->
  <rect x="148" y="54" width="96" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="77" text-anchor="middle" font-size="13" fill="#333">*e*et</text>
  <!-- Bar 2 -->
  <text x="254" y="78" text-anchor="middle" font-size="18" fill="#888" font-weight="bold">|</text>
  <!-- Seg 2 "c**o" - 外 green (count 2) -->
  <rect x="264" y="54" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="304" y="77" text-anchor="middle" font-size="13" fill="#333">c<tspan fill="#b85450" font-weight="bold">**</tspan>o</text>
  <!-- Bar 3 -->
  <text x="354" y="78" text-anchor="middle" font-size="18" fill="#888" font-weight="bold">|</text>
  <!-- Seg 3 "*de" - 内 red -->
  <rect x="364" y="54" width="64" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="396" y="77" text-anchor="middle" font-size="13" fill="#333">*de</text>
  <!-- Bar 4 -->
  <text x="438" y="78" text-anchor="middle" font-size="18" fill="#888" font-weight="bold">|</text>
  <!-- Seg 4 "" - 外 green (empty) -->
  <rect x="448" y="54" width="20" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>

  <!-- Segment labels below -->
  <text x="112" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">外·数星</text>
  <text x="196" y="106" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">内·忽略</text>
  <text x="304" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">外·数星</text>
  <text x="396" y="106" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">内·忽略</text>
  <text x="458" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">外·数星</text>

  <!-- Divider -->
  <path d="M 40 128 L 520 128" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Toggle explanation -->
  <text x="280" y="150" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">等价于：遇 | 翻转 inside，遇 * 且 !inside 则计数</text>

  <!-- Two-state toggle illustration -->
  <rect x="110" y="168" width="130" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="175" y="184" text-anchor="middle" font-size="10" fill="#4a7a3a">括号外 → 数 *</text>
  <text x="175" y="202" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">inside = false</text>

  <rect x="320" y="168" width="130" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="385" y="184" text-anchor="middle" font-size="10" fill="#b85450">括号内 → 忽略 *</text>
  <text x="385" y="202" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">inside = true</text>

  <!-- arrows between (two directions) -->
  <path d="M 244 188 L 316 188" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 316 198 L 244 198" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="280" y="182" text-anchor="middle" font-size="10" fill="#888">遇 | 翻转</text>

  <!-- Bottom notes -->
  <text x="60" y="244" font-size="11.5" fill="#555">• | 总是成对：第偶数个开门、第奇数个关门，奇偶性 = 是否在括号内</text>
  <text x="60" y="264" font-size="11.5" fill="#555">• 翻转一次 = 跨过一道 |，状态自动维护“当前在第几对括号内”</text>
  <text x="60" y="284" font-size="11.5" fill="#555">• 只数“外”段的 *：示例 c**o 段贡献 2，其余外段无 *</text>
</svg>
