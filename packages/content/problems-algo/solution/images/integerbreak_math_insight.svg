<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">数学贪心：为什么切成 3 最优？</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">同样总和下，每段越接近 e≈2.718 乘积越大 → 整数选 3</text>

  <!-- ===== Comparison: sum=6 ===== -->
  <text x="80" y="74" font-size="11" fill="#444" font-weight="bold">以总和 = 6 为例，对比不同切法：</text>

  <!-- 2+2+2 -->
  <rect x="60" y="82" width="120" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="120" y="100" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2 + 2 + 2</text>
  <text x="120" y="120" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2³ = 8</text>

  <!-- 3+3 -->
  <rect x="200" y="82" width="120" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="100" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3 + 3</text>
  <text x="260" y="120" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3² = 9 ✓</text>

  <!-- 4+2 -->
  <rect x="340" y="82" width="120" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="400" y="100" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">4 + 2</text>
  <text x="400" y="120" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4×2 = 8</text>

  <text x="260" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a">3 段更少、乘积更大 → 3 是最优因子</text>

  <!-- divider -->
  <line x1="40" y1="160" x2="480" y2="160" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Key inequality ===== -->
  <rect x="60" y="170" width="400" height="36" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="260" y="192" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3^(1/3) ≈ 1.442  &gt;  2^(1/2) ≈ 1.414  &gt;  4^(1/4) ≈ 1.414</text>

  <!-- ===== Edge case: remainder ===== -->
  <text x="80" y="226" font-size="11" fill="#444" font-weight="bold">按 n ÷ 3 的余数分三种情况：</text>

  <!-- r=0 -->
  <rect x="40" y="236" width="150" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="115" y="254" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">余数 = 0</text>
  <text x="115" y="272" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3^(n/3)</text>
  <text x="115" y="286" text-anchor="middle" font-size="9" fill="#888">全切成 3</text>

  <!-- r=1 -->
  <rect x="195" y="236" width="150" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="254" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">余数 = 1</text>
  <text x="270" y="272" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3^(q−1) × 4</text>
  <text x="270" y="286" text-anchor="middle" font-size="9" fill="#888">3×1 &lt; 2×2，凑成 4</text>

  <!-- r=2 -->
  <rect x="350" y="236" width="150" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="425" y="254" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">余数 = 2</text>
  <text x="425" y="272" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3^q × 2</text>
  <text x="425" y="286" text-anchor="middle" font-size="9" fill="#888">直接补一个 2</text>

  <!-- ===== Why 4 not 3+1 ===== -->
  <rect x="60" y="300" width="400" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="10" fill="#666">⚠ 余数为 1 时的关键：3 + 1 → 3×1 = 3，但 2 + 2 → 2×2 = 4</text>
  <text x="260" y="334" text-anchor="middle" font-size="10" fill="#666">所以把一个 3 和余下的 1 合并成 4，乘积更大</text>
</svg>
