<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="260" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：nums1=[1,7,11], nums2=[2,4,6], k=3</text>

  <!-- header row -->
  <rect x="40" y="40" width="50" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="65" y="57" text-anchor="middle" font-size="11" fill="#888">步骤</text>
  <rect x="94" y="40" width="120" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="154" y="57" text-anchor="middle" font-size="11" fill="#888">弹出 (sum, i, j)</text>
  <rect x="218" y="40" width="130" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="283" y="57" text-anchor="middle" font-size="11" fill="#888">同路入堆</text>
  <rect x="352" y="40" width="100" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="402" y="57" text-anchor="middle" font-size="11" fill="#888">堆内候选</text>
  <rect x="456" y="40" width="64" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="488" y="57" text-anchor="middle" font-size="11" fill="#888">答案</text>

  <!-- step 1 -->
  <rect x="40" y="68" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="65" y="88" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="94" y="68" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="154" y="88" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3, (0,0)</text>
  <rect x="218" y="68" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="283" y="88" text-anchor="middle" font-size="11" fill="#333">5, (0,1)</text>
  <rect x="352" y="68" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="402" y="88" text-anchor="middle" font-size="11" fill="#333">{5,9,13}</text>
  <rect x="456" y="68" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="488" y="88" text-anchor="middle" font-size="11" fill="#333">[1,2]</text>

  <!-- step 2 -->
  <rect x="40" y="100" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="65" y="120" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="94" y="100" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="154" y="120" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5, (0,1)</text>
  <rect x="218" y="100" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="283" y="120" text-anchor="middle" font-size="11" fill="#333">7, (0,2)</text>
  <rect x="352" y="100" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="402" y="120" text-anchor="middle" font-size="11" fill="#333">{7,9,13}</text>
  <rect x="456" y="100" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="488" y="120" text-anchor="middle" font-size="11" fill="#333">[1,4]</text>

  <!-- step 3 (k reached) -->
  <rect x="40" y="132" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="65" y="154" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <rect x="94" y="132" width="120" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6" rx="4" filter="url(#rough2)"/>
  <text x="154" y="154" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">7, (0,2)</text>
  <rect x="218" y="132" width="130" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="283" y="154" text-anchor="middle" font-size="10" fill="#888">k 已满，停</text>
  <rect x="352" y="132" width="100" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="402" y="154" text-anchor="middle" font-size="11" fill="#333">{9,13}</text>
  <rect x="456" y="132" width="64" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="488" y="154" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">[1,6]</text>

  <!-- final answer -->
  <rect x="40" y="184" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="12" fill="#444">按弹出顺序得到的前 k = 3 对：</text>
  <text x="280" y="228" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">[[1,2],[1,4],[1,6]]  ✓</text>
</svg>
