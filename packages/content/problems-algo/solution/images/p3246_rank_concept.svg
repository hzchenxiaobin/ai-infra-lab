<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：积分 = wins×3 + draws；position 用 RANK 才对得上 1,1,3</text>

  <rect x="24" y="38" width="228" height="112" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="138" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 积分怎么算（3-1-0 计分制）</text>
  <text x="138" y="74" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">赢 win = 3 分 · 平 draw = 1 分</text>
  <text x="138" y="90" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">输 loss = 0 分 → losses 列不参与</text>
  <rect x="40" y="98" width="196" height="22" fill="#ffffff" stroke="#446688" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="138" y="113" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">points = wins × 3 + draws</text>
  <text x="138" y="138" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">matches_played 同样是干扰列，读题先剔除</text>

  <rect x="268" y="38" width="228" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="382" y="56" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② position 怎么打（RANK 语义）</text>
  <text x="382" y="74" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">同分 → 同名次（题面硬性要求）</text>
  <text x="382" y="90" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">并列占坑 → 下一个名次跳号</text>
  <text x="382" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">position = 比我积分高的队数 + 1</text>
  <text x="382" y="132" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">示例铁证：1, 1, 3 ← 切尔西拿第 3</text>

  <rect x="24" y="166" width="128" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="181" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">函数 ＼ points</text>
  <rect x="152" y="166" width="58" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="181" y="181" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">20</text>
  <rect x="210" y="166" width="58" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="239" y="181" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">20</text>
  <rect x="268" y="166" width="58" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="297" y="181" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">18</text>
  <rect x="326" y="166" width="58" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="181" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">16</text>
  <rect x="384" y="166" width="58" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="413" y="181" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">14</text>

  <rect x="24" y="188" width="128" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="88" y="205" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">RANK() ✓ 本题</text>
  <rect x="152" y="188" width="58" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="181" y="205" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="210" y="188" width="58" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="239" y="205" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="268" y="188" width="58" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="297" y="205" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="326" y="188" width="58" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="205" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="384" y="188" width="58" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="413" y="205" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>

  <rect x="24" y="214" width="128" height="24" fill="none" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="88" y="230" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">DENSE_RANK() ✗</text>
  <rect x="152" y="214" width="58" height="24" fill="none" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="181" y="230" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">1</text>
  <rect x="210" y="214" width="58" height="24" fill="none" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="239" y="230" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">1</text>
  <rect x="268" y="214" width="58" height="24" fill="none" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="297" y="230" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">2</text>
  <rect x="326" y="214" width="58" height="24" fill="none" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="355" y="230" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">3</text>
  <rect x="384" y="214" width="58" height="24" fill="none" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="413" y="230" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">4</text>

  <rect x="24" y="238" width="128" height="24" fill="none" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="88" y="254" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">ROW_NUMBER() ✗</text>
  <rect x="152" y="238" width="58" height="24" fill="none" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="181" y="254" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">1</text>
  <rect x="210" y="238" width="58" height="24" fill="none" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="239" y="254" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">2</text>
  <rect x="268" y="238" width="58" height="24" fill="none" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="297" y="254" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">3</text>
  <rect x="326" y="238" width="58" height="24" fill="none" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="355" y="254" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">4</text>
  <rect x="384" y="238" width="58" height="24" fill="none" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="413" y="254" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">5</text>

  <path d="M 160 284 L 192 220" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <text x="140" y="300" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">并列 20 分 → 同为第 1</text>

  <path d="M 330 284 L 300 220" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" fill="none" filter="url(#rough2)"/>
  <text x="356" y="300" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">18 分 → 第 3（跳号，不是 2！）</text>

  <rect x="24" y="312" width="418" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="233" y="330" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">口诀：同分同名次 ＋ 名次留洞 = RANK()；洞被填平 = DENSE_RANK()；</text>
  <text x="233" y="348" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">强制连续编号 = ROW_NUMBER()。示例输出 1,1,3 是选 RANK 的铁证</text>

  <text x="260" y="384" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">英超自 1995/96 赛季起采用 3-1-0 计分制：赢 3 分、平 1 分、输 0 分</text>
</svg>
