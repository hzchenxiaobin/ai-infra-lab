<svg xmlns="http://www.w3.org/2000/svg" width="940" height="720" viewBox="0 0 940 720" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="940" height="720" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">循环双端队列：四个写操作流程（count 计数版）</text>
  <path d="M 300 42 Q 470 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="470" y="68" text-anchor="middle" font-size="11" fill="#666">插入类先判满；删除类先判空。两个“向后退”的操作（insertFront / deleteLast）需 (i-1+cap)%cap</text>

  <!-- ===== 左上：insertFront ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="84" width="220" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="150" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">insertFront(value)</text>
  <text x="150" y="118" text-anchor="middle" font-size="10" fill="#666">队首插入</text>

  <g filter="url(#sk)">
    <path d="M 150 134 L 250 178 L 150 222 L 50 178 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="150" y="174" text-anchor="middle" font-size="12" fill="#7a2828" font-weight="bold">count ==</text>
  <text x="150" y="190" text-anchor="middle" font-size="12" fill="#7a2828" font-weight="bold">cap？（满）</text>
  <path d="M 150 124 L 150 134" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="22" y="172" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="20" y="248" width="110" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="75" y="271" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>
  <path d="M 80 222 L 75 248" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="258" y="172" font-size="11" fill="#2e6e2e" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="180" y="248" width="220" height="76" rx="4" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>
  <text x="290" y="270" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">front = (front-1+cap)%cap</text>
  <text x="290" y="288" text-anchor="middle" font-size="11" fill="#333">data[front] = value</text>
  <text x="290" y="306" text-anchor="middle" font-size="11" fill="#333">count += 1</text>
  <text x="290" y="318" text-anchor="middle" font-size="9" fill="#2e6e2e">先退一格，新元素即新队首</text>
  <path d="M 150 222 L 290 248" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="180" y="344" width="220" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="290" y="367" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">return true</text>
  <path d="M 290 324 L 290 344" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== 右上：insertLast ===== -->
  <g filter="url(#sk)">
    <rect x="480" y="84" width="220" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="590" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">insertLast(value)</text>
  <text x="590" y="118" text-anchor="middle" font-size="10" fill="#666">队尾插入（= 622 enQueue）</text>

  <g filter="url(#sk)">
    <path d="M 590 134 L 690 178 L 590 222 L 490 178 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="590" y="174" text-anchor="middle" font-size="12" fill="#7a2828" font-weight="bold">count ==</text>
  <text x="590" y="190" text-anchor="middle" font-size="12" fill="#7a2828" font-weight="bold">cap？（满）</text>
  <path d="M 590 124 L 590 134" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="462" y="172" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="460" y="248" width="110" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="515" y="271" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>
  <path d="M 520 222 L 515 248" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="698" y="172" font-size="11" fill="#2e6e2e" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="620" y="248" width="220" height="76" rx="4" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>
  <text x="730" y="270" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">data[rear] = value</text>
  <text x="730" y="288" text-anchor="middle" font-size="11" fill="#333">rear = (rear+1)%cap</text>
  <text x="730" y="306" text-anchor="middle" font-size="11" fill="#333">count += 1</text>
  <text x="730" y="318" text-anchor="middle" font-size="9" fill="#7a5415">写入后位置，rear 前进</text>
  <path d="M 590 222 L 730 248" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="620" y="344" width="220" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="730" y="367" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">return true</text>
  <path d="M 730 324 L 730 344" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== 左下：deleteFront ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="404" width="220" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="150" y="424" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a2828">deleteFront()</text>
  <text x="150" y="438" text-anchor="middle" font-size="10" fill="#666">队首删除（= 622 deQueue）</text>

  <g filter="url(#sk)">
    <path d="M 150 454 L 250 498 L 150 542 L 50 498 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="150" y="494" text-anchor="middle" font-size="12" fill="#7a2828" font-weight="bold">count == 0？</text>
  <text x="150" y="510" text-anchor="middle" font-size="10" fill="#7a2828">(空队列)</text>
  <path d="M 150 444 L 150 454" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="22" y="492" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="20" y="568" width="110" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="75" y="591" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>
  <path d="M 80 542 L 75 568" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="258" y="492" font-size="11" fill="#2e6e2e" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="180" y="568" width="220" height="60" rx="4" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>
  <text x="290" y="590" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">front = (front+1)%cap</text>
  <text x="290" y="608" text-anchor="middle" font-size="11" fill="#333">count -= 1</text>
  <text x="290" y="620" text-anchor="middle" font-size="9" fill="#7a5415">丢弃队首，front 前进</text>
  <path d="M 150 542 L 290 568" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="180" y="644" width="220" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="290" y="667" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">return true</text>
  <path d="M 290 628 L 290 644" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== 右下：deleteLast ===== -->
  <g filter="url(#sk)">
    <rect x="480" y="404" width="220" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="590" y="424" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a2828">deleteLast()</text>
  <text x="590" y="438" text-anchor="middle" font-size="10" fill="#666">队尾删除</text>

  <g filter="url(#sk)">
    <path d="M 590 454 L 690 498 L 590 542 L 490 498 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="590" y="494" text-anchor="middle" font-size="12" fill="#7a2828" font-weight="bold">count == 0？</text>
  <text x="590" y="510" text-anchor="middle" font-size="10" fill="#7a2828">(空队列)</text>
  <path d="M 590 444 L 590 454" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="462" y="492" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="460" y="568" width="110" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="515" y="591" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>
  <path d="M 520 542 L 515 568" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="698" y="492" font-size="11" fill="#2e6e2e" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="620" y="568" width="220" height="60" rx="4" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>
  <text x="730" y="590" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">rear = (rear-1+cap)%cap</text>
  <text x="730" y="608" text-anchor="middle" font-size="11" fill="#333">count -= 1</text>
  <text x="730" y="620" text-anchor="middle" font-size="9" fill="#7a5415">rear 后退，队尾被丢弃</text>
  <path d="M 590 542 L 730 568" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="620" y="644" width="220" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="730" y="667" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">return true</text>
  <path d="M 730 628 L 730 644" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 查询类操作集中在右侧说明卡（见上方 x=730 处）。 -->
  <g filter="url(#sk)">
    <rect x="730" y="84" width="180" height="240" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="820" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">查询类操作（O(1)）</text>
  <text x="740" y="130" font-size="11" fill="#2b6e9e" font-weight="bold">getFront()</text>
  <text x="740" y="146" font-size="10" fill="#444">空 → -1；否则 data[front]</text>
  <text x="740" y="170" font-size="11" fill="#2b6e9e" font-weight="bold">getRear()</text>
  <text x="740" y="186" font-size="10" fill="#444">空 → -1；</text>
  <text x="740" y="200" font-size="10" fill="#444">否则 data[(rear-1+cap)%cap]</text>
  <text x="740" y="224" font-size="11" fill="#2e6e2e" font-weight="bold">isEmpty()</text>
  <text x="740" y="240" font-size="10" fill="#444">return count == 0</text>
  <text x="740" y="264" font-size="11" fill="#7a2828" font-weight="bold">isFull()</text>
  <text x="740" y="280" font-size="10" fill="#444">return count == cap</text>
  <text x="740" y="304" font-size="9" fill="#7a5415">不变量：front=队首；</text>
  <text x="740" y="316" font-size="9" fill="#7a5415">rear=下一插入位</text>
</svg>
