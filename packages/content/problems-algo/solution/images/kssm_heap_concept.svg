<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：每行有序 → 把 n 行看成 n 路归并，用小顶堆取第 k 小</text>

  <!-- matrix label -->
  <text x="40" y="66" font-size="12" fill="#888">矩阵（行列皆有序）：</text>

  <!-- matrix 3x3 centered around x=160 -->
  <!-- row 0 -->
  <rect x="100" y="74" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="140" y="74" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="160" y="96" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="180" y="74" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="200" y="96" text-anchor="middle" font-size="12" fill="#333">9</text>
  <!-- row 1 -->
  <rect x="100" y="108" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>
  <rect x="140" y="108" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="160" y="130" text-anchor="middle" font-size="12" fill="#333">11</text>
  <rect x="180" y="108" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="200" y="130" text-anchor="middle" font-size="12" fill="#333">13</text>
  <!-- row 2 -->
  <rect x="100" y="142" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">12</text>
  <rect x="140" y="142" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="160" y="164" text-anchor="middle" font-size="12" fill="#333">13</text>
  <rect x="180" y="142" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="200" y="164" text-anchor="middle" font-size="12" fill="#333">15</text>

  <!-- pointer arrows from each row's first element to heap -->
  <text x="58" y="96" font-size="10" fill="#4a7a3a" font-weight="bold">行0→</text>
  <text x="58" y="130" font-size="10" fill="#4a7a3a" font-weight="bold">行1→</text>
  <text x="58" y="164" font-size="10" fill="#4a7a3a" font-weight="bold">行2→</text>

  <!-- big arrow matrix -> heap -->
  <path d="M 230 124 L 300 124" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="265" y="118" text-anchor="middle" font-size="10" fill="#446688">每行首元素</text>
  <text x="265" y="138" text-anchor="middle" font-size="10" fill="#446688">入堆</text>

  <!-- min-heap on the right -->
  <text x="420" y="64" text-anchor="middle" font-size="12" fill="#888">小顶堆（候选首元素）</text>

  <!-- heap: tree-like, root smallest -->
  <ellipse cx="420" cy="92" rx="26" ry="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="420" y="97" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <ellipse cx="378" cy="140" rx="24" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="378" y="145" text-anchor="middle" font-size="12" fill="#333">10</text>
  <ellipse cx="462" cy="140" rx="24" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="462" y="145" text-anchor="middle" font-size="12" fill="#333">12</text>
  <!-- edges -->
  <path d="M 408 106 L 388 126" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 432 106 L 452 126" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="420" y="172" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">堆顶 = 当前全局最小</text>

  <!-- pop arrow downward -->
  <path d="M 420 180 L 420 206" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="432" y="198" font-size="10" fill="#b85450" font-weight="bold">弹出</text>

  <!-- step boxes -->
  <rect x="300" y="208" width="240" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="229" text-anchor="middle" font-size="12" fill="#333">① 弹出堆顶（计数 +1）</text>

  <path d="M 420 246 L 420 264" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="300" y="266" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="287" text-anchor="middle" font-size="12" fill="#333">② 同行后移一位入堆</text>

  <path d="M 420 304 L 420 322" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="300" y="324" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="420" y="345" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 重复 k 次，第 k 个即答案</text>

  <!-- loop back arrow -->
  <path d="M 300 341 L 286 341 L 286 225 L 300 225" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="262" y="288" font-size="10" fill="#b85450" font-weight="bold">循环</text>

  <!-- bottom note -->
  <rect x="40" y="368" width="500" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="290" y="385" text-anchor="middle" font-size="11" fill="#446688">堆大小恒为 n（行数），每次 O(log n)；共弹 k 次 → O(k log n)</text>
</svg>
