<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1, 4, 2, 3]</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">L↑/L↓ 以 i 结尾、R↑/R↓ 以 i 开头（均不含单身）；c = (L↑+1)(R↑+1) + (L↓+1)(R↓+1) − 1</text>

  <!-- 表头 -->
  <rect x="36" y="56" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="70" y="56" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="104" y="56" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="148" y="56" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="192" y="56" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="236" y="56" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="56" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="440" y="56" width="64" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="53" y="77" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="87" y="77" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">v</text>
  <text x="126" y="77" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">L↑</text>
  <text x="170" y="77" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">R↑</text>
  <text x="214" y="77" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">L↓</text>
  <text x="258" y="77" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">R↓</text>
  <text x="360" y="77" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">出场次数 c</text>
  <text x="472" y="77" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">贡献</text>

  <!-- 行 0 -->
  <rect x="36" y="88" width="34" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="70" y="88" width="34" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="104" y="88" width="44" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="148" y="88" width="44" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="192" y="88" width="44" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="236" y="88" width="44" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="88" width="160" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="440" y="88" width="64" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="53" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="87" y="110" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="126" y="110" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>
  <text x="170" y="110" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2</text>
  <text x="214" y="110" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>
  <text x="258" y="110" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>
  <text x="360" y="110" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">1×3 + 1×1 − 1 = 3</text>
  <text x="472" y="110" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">1×3 = 3</text>

  <!-- 行 1 -->
  <rect x="36" y="122" width="34" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="70" y="122" width="34" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="104" y="122" width="44" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="148" y="122" width="44" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="192" y="122" width="44" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="236" y="122" width="44" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="122" width="160" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="440" y="122" width="64" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="53" y="144" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="87" y="144" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="126" y="144" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>
  <text x="170" y="144" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>
  <text x="214" y="144" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>
  <text x="258" y="144" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="360" y="144" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">1×1 + 1×2 − 1 = 2</text>
  <text x="472" y="144" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">4×2 = 8</text>

  <!-- 行 2（桥示例，高亮） -->
  <rect x="36" y="156" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="70" y="156" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="104" y="156" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="148" y="156" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="192" y="156" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="236" y="156" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="156" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="440" y="156" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="53" y="178" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="87" y="178" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="126" y="178" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="170" y="178" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="214" y="178" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">0</text>
  <text x="258" y="178" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">0</text>
  <text x="360" y="178" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2×2 + 1×1 − 1 = 4</text>
  <text x="472" y="178" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2×4 = 8</text>

  <!-- 行 3 -->
  <rect x="36" y="190" width="34" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="70" y="190" width="34" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="104" y="190" width="44" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="148" y="190" width="44" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="192" y="190" width="44" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="236" y="190" width="44" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="190" width="160" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="440" y="190" width="64" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="53" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="87" y="212" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="126" y="212" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2</text>
  <text x="170" y="212" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>
  <text x="214" y="212" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="258" y="212" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>
  <text x="360" y="212" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">3×1 + 2×1 − 1 = 4</text>
  <text x="472" y="212" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">3×4 = 12</text>

  <!-- 读数注释 -->
  <text x="260" y="246" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">R↑[0] = 2：从 1 向右的递增有 [1,2]、[1,2,3]（可隔着 4 跳）</text>
  <text x="260" y="262" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">L↑[3] = 2：以 3 结尾的递增有 [2,3]、[1,2,3]；L↓[3] = 1：只有 [4,3]</text>

  <!-- 汇总 -->
  <rect x="56" y="274" width="408" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">ans = 3 + 8 + 8 + 12 = 31 ✓</text>

  <!-- 枚举对照 -->
  <rect x="32" y="318" width="456" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">对照：全部 8 条连续子序列 = [1] [4] [2] [3] [1,2] [2,3] [4,3] [1,2,3]</text>
  <text x="260" y="356" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">值之和 = (1+4+2+3) + (3+5+7) + 6 = 31 ✓；示例 1 [1,2] 同理得 6 ✓</text>

  <text x="260" y="388" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">元素 2 出场 4 次：[2] / [1,2] / [2,3] / [1,2,3] —— 正是概念图里乘法原理拼出的 4 条</text>
</svg>
