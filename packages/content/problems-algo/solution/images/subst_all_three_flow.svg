<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M0,0 L4.5,8 L9,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：记录最后出现位置</text>

  <!-- Step 1: init -->
  <rect x="190" y="48" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="73" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">last = {a:−1, b:−1, c:−1}，ans = 0</text>
  <path d="M 280 90 L 280 108" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: loop decision -->
  <polygon points="280,112 380,150 280,188 180,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">i &lt; n ?</text>
  <text x="280" y="162" text-anchor="middle" font-size="10.5" fill="#888">遍历每个下标 i</text>
  <!-- No branch -> return -->
  <path d="M 380 150 L 470 150" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="392" y="142" font-size="11" fill="#888">否</text>
  <rect x="440" y="128" width="100" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="490" y="148" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 ans</text>
  <text x="490" y="164" text-anchor="middle" font-size="10" fill="#888">累加完毕</text>
  <!-- Yes branch down -->
  <path d="M 280 188 L 280 208" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="200" font-size="11" fill="#888">是</text>

  <!-- Step 3: update last -->
  <rect x="170" y="212" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="237" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">last[ s[i] ] = i   （刷新该字符最后位置）</text>
  <path d="M 280 254 L 280 272" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: compute min -->
  <rect x="150" y="276" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="301" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">m = min(last_a, last_b, last_c)</text>
  <path d="M 280 318 L 280 336" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 5: ans += m+1 -->
  <rect x="150" y="340" width="260" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">ans += m + 1</text>
  <text x="280" y="376" text-anchor="middle" font-size="10" fill="#888">m=−1 时 +0，表示尚未集齐三种字符</text>

  <!-- loop back arrow -->
  <path d="M 150 362 L 90 362 L 90 150 L 180 150" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="58" y="260" font-size="10.5" fill="#888" font-style="italic">i++，回到</text>
  <text x="58" y="274" font-size="10.5" fill="#888" font-style="italic">循环判断</text>

  <!-- footnote -->
  <rect x="40" y="398" width="480" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="418" text-anchor="middle" font-size="10.5" fill="#888">每个 right 仅 O(1) 操作：刷新最后位置 → 取最小值 → 累加。全程 left/right 无需回溯。</text>
</svg>
