<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">算法流程：统计频次 → 累加偶数部分 → 落单标记补 1</text>

  <!-- Step 1: count -->
  <rect x="160" y="48" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历 s 统计每个字母频次 freq[]</text>

  <path d="M 260 96 L 260 118" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="160" y="122" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="148" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">ans = 0,  hasOdd = false</text>

  <path d="M 260 166 L 260 188" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop diamond -->
  <polygon points="260,190 360,232 260,274 160,232" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">遍历每个字母 ch</text>
  <text x="260" y="244" text-anchor="middle" font-size="10" fill="#888">freq[ch] &gt; 0 ?</text>

  <!-- loop body (right) -->
  <path d="M 360 232 L 398 232" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="400" y="200" width="108" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="454" y="222" text-anchor="middle" font-size="10" fill="#555">ans += freq//2 * 2</text>
  <text x="454" y="244" text-anchor="middle" font-size="10" fill="#555">hasOdd |= freq % 2</text>

  <!-- loop back -->
  <path d="M 454 200 C 454 168 320 168 260 190" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- exit down -->
  <path d="M 260 274 L 260 300" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- hasOdd check -->
  <polygon points="260,302 350,340 260,378 170,340" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">hasOdd ?</text>

  <!-- yes branch -->
  <path d="M 350 340 L 384 340" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="332" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="386" y="318" width="92" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="432" y="344" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans += 1</text>

  <path d="M 432 362 L 432 392 L 300 392" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no branch -->
  <path d="M 260 378 L 260 392" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="232" y="372" font-size="10" fill="#888">否</text>

  <!-- return -->
  <rect x="180" y="394" width="160" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="420" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return ans</text>

  <!-- side note -->
  <rect x="24" y="200" width="120" height="80" fill="#fafafa" stroke="#999" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="84" y="222" text-anchor="middle" font-size="10" fill="#777" font-weight="bold">关键公式</text>
  <text x="32" y="240" font-size="9" fill="#666">freq//2 × 2</text>
  <text x="32" y="252" font-size="9" fill="#888">= 去掉落单后的偶数</text>
  <text x="32" y="270" font-size="9" fill="#b85450" font-weight="bold">+1 只补一次</text>
</svg>
