<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：最小 k 个 × 最大 k 个，同序配对</text>
  <text x="310" y="48" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">以 nums = [2,3,4,4,4]（n = 5），k = 2 为例：能否删 2 对？</text>

  <!-- pairing arcs (parallel, same-order) -->
  <path d="M 182 126 Q 278 70 374 126" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 246 126 Q 342 70 438 126" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="278" y="90" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2 &lt; 4 ✓</text>
  <text x="342" y="64" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">3 &lt; 4 ✓</text>

  <!-- array cells -->
  <rect x="154" y="130" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="182" y="155" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="218" y="130" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="246" y="155" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="282" y="130" width="56" height="40" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="155" text-anchor="middle" font-size="14" fill="#777" filter="url(#rough2)">4</text>
  <rect x="346" y="130" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="374" y="155" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="410" y="130" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="438" y="155" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>

  <!-- indices -->
  <text x="182" y="190" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="246" y="190" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="310" y="190" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="374" y="190" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">3</text>
  <text x="438" y="190" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">4</text>

  <!-- side annotations -->
  <text x="214" y="214" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">小端 a = nums[0..k−1]</text>
  <text x="310" y="214" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">不参与</text>
  <text x="406" y="214" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">大端 b = nums[n−k..n−1]</text>

  <!-- conclusion box -->
  <rect x="60" y="244" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="268" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">k 可行 ⟺ ∀ i ∈ [0, k)：nums[i] &lt; nums[n−k+i]</text>
  <text x="310" y="288" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">（第 i 小配第 i 大——同序配对全部严格成立）</text>

  <text x="310" y="334" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">⚠️ 若反序配对（a[i] 配 b[k−1−i]），最小值被迫配最小大端，重复值处必卡壳</text>
</svg>
