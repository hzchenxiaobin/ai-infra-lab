<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：排序 + 双指针贪心</text>

  <!-- Start -->
  <rect x="250" y="42" width="100" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="61" text-anchor="middle" font-size="12" fill="#2a4a66" font-weight="bold">开始</text>
  <line x1="300" y1="70" x2="300" y2="88" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- sort + init box -->
  <rect x="170" y="90" width="260" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="112" text-anchor="middle" font-size="12" fill="#555">对 g、s 升序排序；i = j = ans = 0</text>
  <line x1="300" y1="124" x2="300" y2="142" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Diamond 1: i<n and j<m -->
  <polygon points="300,144 384,182 300,220 216,182" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="178" text-anchor="middle" font-size="12" fill="#3a5a2a">i &lt; n 且</text>
  <text x="300" y="194" text-anchor="middle" font-size="12" fill="#3a5a2a">j &lt; m ?</text>

  <!-- No -> return ans -->
  <line x1="384" y1="182" x2="458" y2="182" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="421" y="174" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="460" y="168" width="120" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="520" y="187" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 ans</text>

  <!-- Yes -> down to Diamond 2 -->
  <line x1="300" y1="220" x2="300" y2="236" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="316" y="232" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Diamond 2: s[j] >= g[i] -->
  <polygon points="300,236 390,278 300,320 210,278" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="283" text-anchor="middle" font-size="12" fill="#3a5a2a">s[j] ≥ g[i] ?</text>

  <!-- Yes (feed) -> left box -->
  <line x1="210" y1="278" x2="172" y2="278" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="191" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="40" y="258" width="130" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="105" y="276" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">喂！ans++</text>
  <text x="105" y="291" text-anchor="middle" font-size="11" fill="#2a4a66">i++，j++</text>

  <!-- No (discard) -> right box -->
  <line x1="390" y1="278" x2="428" y2="278" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="409" y="270" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="430" y="258" width="140" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="500" y="276" text-anchor="middle" font-size="11" fill="#a67830" font-weight="bold">饼干太小</text>
  <text x="500" y="291" text-anchor="middle" font-size="11" fill="#a67830">丢弃，j++</text>

  <!-- Loopback main (with arrow): feed box bottom -> down -> left corridor -> up -> into Diamond 1 left vertex -->
  <path d="M 105 300 L 105 360 L 25 360 L 25 182 L 212 182" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <!-- Loopback branch from discard box (no arrow, joins main) -->
  <path d="M 500 300 L 500 360 L 105 360" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="40" y="376" font-size="11" fill="#666">↻ 循环：动作完成后回到「i &lt; n 且 j &lt; m」判断</text>

  <rect x="60" y="404" width="480" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="300" y="422" text-anchor="middle" font-size="11" fill="#555">关键：饼干太小（s[j] &lt; g[i]）就丢掉它——它连最小贪心孩子都喂不了，后面更没机会</text>
  <text x="300" y="437" text-anchor="middle" font-size="11" fill="#555">饼干够大就喂当前孩子，两个孩子和饼干指针同时前进</text>
</svg>
