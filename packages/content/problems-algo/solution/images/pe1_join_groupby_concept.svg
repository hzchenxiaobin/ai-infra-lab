<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    JOIN 桥接 + GROUP BY 分桶 + AVG 聚合
  </text>

  <!-- ===== Project table ===== -->
  <text x="135" y="48" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">Project 表</text>
  <!-- header band -->
  <rect x="40" y="54" width="190" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="88" y="70" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">project_id</text>
  <text x="183" y="70" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">employee_id</text>
  <!-- data rows -->
  <rect x="40" y="78" width="190" height="120" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <line x1="135" y1="78" x2="135" y2="198" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="102" x2="230" y2="102" stroke="#aac" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="40" y1="126" x2="230" y2="126" stroke="#aac" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="40" y1="150" x2="230" y2="150" stroke="#aac" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="40" y1="174" x2="230" y2="174" stroke="#aac" stroke-width="0.8" filter="url(#rough2)"/>
  <!-- project 1 rows (blue tint) -->
  <text x="88" y="95" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="183" y="95" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="88" y="119" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="183" y="119" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="88" y="143" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="183" y="143" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <!-- project 2 rows (orange tint) -->
  <text x="88" y="167" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="183" y="167" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="88" y="191" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="183" y="191" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- ===== Employee table ===== -->
  <text x="445" y="48" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">Employee 表</text>
  <rect x="350" y="54" width="190" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="398" y="70" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">employee_id</text>
  <text x="493" y="70" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">exp_years</text>
  <rect x="350" y="78" width="190" height="96" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <line x1="445" y1="78" x2="445" y2="174" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="350" y1="102" x2="540" y2="102" stroke="#bcc" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="350" y1="126" x2="540" y2="126" stroke="#bcc" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="350" y1="150" x2="540" y2="150" stroke="#bcc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="398" y="95" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="493" y="95" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="398" y="119" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="493" y="119" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="398" y="143" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="493" y="143" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="398" y="167" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="493" y="167" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <!-- JOIN arrow -->
  <path d="M 230 138 C 270 138, 310 138, 348 138" fill="none" stroke="#446688"
        stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="289" y="130" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">JOIN ON</text>
  <text x="289" y="152" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">employee_id</text>

  <!-- ===== Buckets ===== -->
  <text x="280" y="214" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    GROUP BY project_id → 每桶求 AVG(exp_years)
  </text>

  <!-- Bucket 1 -->
  <rect x="40" y="232" width="225" height="128" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="152" y="252" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">桶 1 : project_id = 1</text>
  <text x="62" y="276" font-size="11" fill="#333" filter="url(#rough2)">exp 值: 3 , 2 , 1</text>
  <text x="62" y="298" font-size="11" fill="#333" filter="url(#rough2)">SUM = 6 , COUNT = 3</text>
  <text x="62" y="320" font-size="11" fill="#333" filter="url(#rough2)">AVG = 6 / 3 = 2.0</text>
  <rect x="62" y="330" width="180" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="346" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ ROUND = 2.00</text>

  <!-- Bucket 2 -->
  <rect x="295" y="232" width="225" height="128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="407" y="252" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">桶 2 : project_id = 2</text>
  <text x="317" y="276" font-size="11" fill="#333" filter="url(#rough2)">exp 值: 3 , 2</text>
  <text x="317" y="298" font-size="11" fill="#333" filter="url(#rough2)">SUM = 5 , COUNT = 2</text>
  <text x="317" y="320" font-size="11" fill="#333" filter="url(#rough2)">AVG = 5 / 2 = 2.5</text>
  <rect x="317" y="330" width="180" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="407" y="346" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ ROUND = 2.50</text>
</svg>
