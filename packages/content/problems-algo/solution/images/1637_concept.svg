<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：最宽垂直区域 = 排序后相邻 x 坐标的最大差</text>

  <!-- ===== 2D plane with points ===== -->
  <text x="50" y="52" font-size="11" fill="#888">二维点集（示例 2）</text>

  <!-- x-axis -->
  <path d="M 80 200 L 470 200" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="475" y="204" font-size="10" fill="#999">x</text>

  <!-- vertical dashed lines at each unique x: 1,3,5,8,9 -->
  <line x1="120" y1="70" x2="120" y2="200" stroke="#446688" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="200" y1="70" x2="200" y2="200" stroke="#446688" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="280" y1="70" x2="280" y2="200" stroke="#446688" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="400" y1="70" x2="400" y2="200" stroke="#446688" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="440" y1="70" x2="440" y2="200" stroke="#446688" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- x-axis labels -->
  <text x="120" y="214" text-anchor="middle" font-size="10" fill="#888">x=1</text>
  <text x="200" y="214" text-anchor="middle" font-size="10" fill="#888">x=3</text>
  <text x="280" y="214" text-anchor="middle" font-size="10" fill="#888">x=5</text>
  <text x="400" y="214" text-anchor="middle" font-size="10" fill="#888">x=8</text>
  <text x="440" y="214" text-anchor="middle" font-size="10" fill="#888">x=9</text>

  <!-- points: (3,1)(9,0)(1,0)(1,4)(5,3)(8,8) -->
  <circle cx="200" cy="178" r="4" fill="#446688" filter="url(#rough2)"/>
  <text x="208" y="176" font-size="9" fill="#666">(3,1)</text>
  <circle cx="440" cy="190" r="4" fill="#446688" filter="url(#rough2)"/>
  <text x="448" y="188" font-size="9" fill="#666">(9,0)</text>
  <circle cx="120" cy="190" r="4" fill="#446688" filter="url(#rough2)"/>
  <text x="92" y="188" font-size="9" fill="#666">(1,0)</text>
  <circle cx="120" cy="140" r="4" fill="#446688" filter="url(#rough2)"/>
  <text x="92" y="138" font-size="9" fill="#666">(1,4)</text>
  <circle cx="280" cy="152" r="4" fill="#446688" filter="url(#rough2)"/>
  <text x="288" y="150" font-size="9" fill="#666">(5,3)</text>
  <circle cx="400" cy="94" r="4" fill="#446688" filter="url(#rough2)"/>
  <text x="408" y="92" font-size="9" fill="#666">(8,8)</text>

  <!-- highlight widest gap between x=5 and x=8 -->
  <rect x="280" y="68" width="120" height="132" fill="#fce4ec" opacity="0.4" filter="url(#rough2)"/>
  <path d="M 280 64 L 280 58 L 400 58 L 400 64" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="340" y="52" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">最宽 = 3</text>

  <!-- gaps below axis -->
  <path d="M 120 224 L 120 230 L 200 230 L 200 224" stroke="#888" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="160" y="242" text-anchor="middle" font-size="9" fill="#888">2</text>
  <path d="M 200 224 L 200 230 L 280 230 L 280 224" stroke="#888" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="240" y="242" text-anchor="middle" font-size="9" fill="#888">2</text>
  <path d="M 280 224 L 280 230 L 400 230 L 400 224" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="340" y="242" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3 ← max</text>
  <path d="M 400 224 L 400 230 L 440 230 L 440 224" stroke="#888" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="420" y="242" text-anchor="middle" font-size="9" fill="#888">1</text>

  <!-- ===== Bottom: x extraction ===== -->
  <text x="50" y="272" font-size="11" fill="#888">提取 x 并排序</text>

  <!-- original x -->
  <rect x="80" y="278" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="296" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="120" y="278" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="296" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <rect x="160" y="278" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="296" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="200" y="278" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="296" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="240" y="278" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="280" y="278" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="296" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>

  <!-- sort arrow -->
  <path d="M 340 291 L 370 291" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="355" y="283" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">排序</text>

  <!-- sorted x -->
  <rect x="80" y="312" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="330" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="120" y="312" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="330" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="160" y="312" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="330" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="200" y="312" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="330" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="240" y="312" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <rect x="280" y="312" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="330" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>

  <!-- max adjacent diff highlight -->
  <path d="M 220 342 L 220 348 L 260 348 L 260 342" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="380" y="352" font-size="11" fill="#b85450" font-weight="bold">最大相邻差 = 8 − 5 = 3 → 答案</text>

  <!-- key insight box -->
  <rect x="370" y="278" width="170" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="455" y="298" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">💡 y 坐标无关</text>
  <text x="455" y="314" text-anchor="middle" font-size="10" fill="#888">垂直区域宽度只由 x 决定</text>
  <text x="455" y="328" text-anchor="middle" font-size="10" fill="#888">排序后取最大相邻差即可</text>
</svg>
