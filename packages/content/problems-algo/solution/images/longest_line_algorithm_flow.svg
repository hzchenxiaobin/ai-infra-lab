<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：逐行扫描 + 四状态滚动递推</text>

  <!-- Start -->
  <rect x="210" y="46" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化 h,v,d,a 四数组</text>

  <path d="M 280 80 L 280 94" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Outer loop -->
  <rect x="190" y="96" width="180" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="119" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for i in range(m):  prev = 0</text>

  <path d="M 280 134 L 280 148" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Inner loop -->
  <rect x="190" y="150" width="180" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="173" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for j in range(n):</text>

  <path d="M 280 188 L 280 202" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: mat[i][j] == 0? -->
  <polygon points="280,204 380,240 280,276 180,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">mat[i][j]</text>
  <text x="280" y="252" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">== 0 ?</text>

  <!-- Yes branch: zero out -->
  <path d="M 180 240 L 110 240 L 110 280" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="232" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="30" y="282" width="160" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="300" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">h[j]=v[j]=d[j]=a[j]=0</text>
  <text x="110" y="316" text-anchor="middle" font-size="10" fill="#b85450">prev = 旧 d[j]</text>

  <!-- No branch: compute 4 values -->
  <path d="M 380 240 L 450 240 L 450 280" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="232" font-size="10" fill="#4a7a3a" font-weight="bold">否(=1)</text>
  <rect x="370" y="282" width="160" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="450" y="300" text-anchor="middle" font-size="10" fill="#4a7a3a">h[j]=h[j−1]+1</text>
  <text x="450" y="314" text-anchor="middle" font-size="10" fill="#446688">v[j]=v[j]+1</text>
  <text x="450" y="328" text-anchor="middle" font-size="10" fill="#d6a040">d[j]=prev+1</text>
  <text x="450" y="342" text-anchor="middle" font-size="10" fill="#b85450">a[j]=a[j+1]+1</text>

  <!-- merge: prev = old d[j]; update ans -->
  <path d="M 110 328 L 110 370 L 270 370" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 450 360 L 450 370 L 290 370" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="372" width="160" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="388" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">prev = 旧 d[j]</text>
  <text x="280" y="402" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">ans = max(ans, h,v,d,a)</text>

  <!-- loop back arrows -->
  <path d="M 360 390 L 500 390 L 500 168 L 370 168" stroke="#999" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="510" y="280" font-size="9" fill="#999" transform="rotate(90 510 280)">j++</text>

  <path d="M 200 390 L 60 390 L 60 114 L 190 114" stroke="#999" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="50" y="250" font-size="9" fill="#999" transform="rotate(-90 50 250)">i++</text>

  <!-- End -->
  <path d="M 280 410 L 280 422" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="210" y="424" width="140" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="280" y="442" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">return ans</text>
</svg>
