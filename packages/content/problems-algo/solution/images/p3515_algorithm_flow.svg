<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#555"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：一次 DFS 预处理，更新 / 查询各落一个 BIT 原语</text>

  <!-- 左列：预处理 -->
  <rect x="24" y="44" width="164" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="106" y="64" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">建邻接表 O(n)</text>
  <path d="M 106 76 L 106 90" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="24" y="94" width="164" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="106" y="113" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">迭代 DFS：</text>
  <text x="106" y="133" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">tin / size / dist₀ / pe</text>
  <path d="M 106 146 L 106 160" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="24" y="164" width="164" height="32" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="106" y="184" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">逐个读查询</text>
  <path d="M 106 196 L 106 210" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="106,212 192,254 106,296 20,254" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="106" y="250" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">是更新？</text>
  <text x="106" y="266" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（类型 1）</text>

  <!-- 否 → 查询 -->
  <path d="M 149 233 Q 195 190 228 118" fill="none" stroke="#4a7a3a" stroke-width="1.5"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="170" y="206" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <text x="375" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">查询 [2, x]</text>
  <rect x="230" y="92" width="290" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="375" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">answer ← dist₀[x] + Δ前缀(tin[x])</text>
  <text x="375" y="128" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">（BIT 一次 query，O(log n)）</text>

  <!-- 是 → 更新 -->
  <path d="M 192 254 Q 215 235 228 208" fill="none" stroke="#b85450" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="204" y="234" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>

  <text x="375" y="180" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">更新 [1, u, v, w′]</text>
  <rect x="230" y="188" width="290" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="375" y="208" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">child ← u, v 中更深端点</text>
  <path d="M 375 220 L 375 230" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="230" y="232" width="290" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="375" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Δ ← w′ − curW[父边]，同步 curW</text>
  <path d="M 375 264 L 375 274" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="230" y="276" width="290" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="375" y="296" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">BIT 区间加：</text>
  <text x="375" y="314" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">add(tin, +Δ)，add(tin+size, −Δ)</text>

  <!-- 回环 -->
  <path d="M 520 114 L 542 114 L 542 352 L 14 352 L 14 180 L 22 180" fill="none" stroke="#446688"
        stroke-width="1.2" stroke-dasharray="5 4" opacity="0.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 520 300 L 542 300" fill="none" stroke="#446688" stroke-width="1.2"
        stroke-dasharray="5 4" opacity="0.6" filter="url(#rough2)"/>
  <text x="278" y="366" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">处理完 q 个查询后输出 answer</text>
</svg>
