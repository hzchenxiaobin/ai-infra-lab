<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">addNum(value) 算法流程</text>
  <path d="M 170 34 Q 310 42 450 34" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- Step 1: entry -->
  <g filter="url(#rough2)">
    <rect x="220" y="50" width="180" height="34" rx="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="310" y="72" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">收到 value</text>
  <path d="M 310 84 L 310 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: upper_bound -->
  <g filter="url(#rough2)">
    <rect x="160" y="104" width="300" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="310" y="121" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">it = intervals.upper_bound(value)</text>
  <text x="310" y="136" text-anchor="middle" font-size="10" fill="#7a5415">floor = prev(it) · ceiling = it</text>
  <path d="M 310 144 L 310 160" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: value inside floor? -->
  <g filter="url(#rough2)">
    <polygon points="310,164 420,204 310,244 200,204" fill="#fffdf3" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="310" y="200" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">floor 存在且</text>
  <text x="310" y="214" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">floor.end ≥ value ?</text>

  <!-- Yes branch: return -->
  <path d="M 200 204 L 80 204 L 80 230" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="92" y="198" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <g filter="url(#rough2)">
    <rect x="30" y="234" width="100" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="80" y="256" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">return (no-op)</text>

  <!-- No branch -->
  <path d="M 310 244 L 310 262" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="318" y="256" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- init start/end -->
  <g filter="url(#rough2)">
    <rect x="220" y="266" width="180" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="310" y="285" text-anchor="middle" font-size="10" fill="#446688">start = end = value</text>
  <path d="M 310 294 L 310 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 2: floor.end+1 == value? -->
  <g filter="url(#rough2)">
    <polygon points="310,316 440,352 310,388 180,352" fill="#fffdf3" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="310" y="348" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">floor 存在且</text>
  <text x="310" y="362" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">floor.end+1 == value ?</text>

  <!-- Yes: extend left -->
  <path d="M 180 352 L 100 352 L 100 378" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="110" y="346" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <g filter="url(#rough2)">
    <rect x="30" y="382" width="140" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="100" y="400" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">start = floor.start</text>
  <text x="100" y="416" text-anchor="middle" font-size="10" fill="#2e6e2e">erase(floor)</text>

  <!-- No -->
  <path d="M 310 388 L 310 406" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="318" y="400" font-size="10" fill="#888" font-weight="bold">否</text>

  <!-- merge point -->
  <g filter="url(#rough2)"><circle cx="310" cy="430" r="4" fill="#666"/></g>
  <path d="M 100 426 L 306 430" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 434 L 310 452" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 3: ceiling.start == value+1? -->
  <g filter="url(#rough2)">
    <polygon points="310,456 440,486 310,516 180,486" fill="#fffdf3" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="310" y="484" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">ceiling 存在且</text>
  <text x="310" y="498" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">ceiling.start==value+1 ?</text>

  <!-- Yes: extend right (drawn to the right side) -->
  <path d="M 440 486 L 540 486" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="448" y="480" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <g filter="url(#rough2)">
    <rect x="470" y="500" width="140" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="540" y="516" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">end = ceiling.end</text>
  <text x="540" y="530" text-anchor="middle" font-size="10" fill="#2e6e2e">erase(ceiling)</text>

  <!-- No: skip -->
  <text x="318" y="510" font-size="10" fill="#888" font-weight="bold">否</text>

  <!-- Final insert (right side bottom) -->
  <path d="M 310 516 L 310 524" stroke="#666" stroke-width="1.5" fill="none"/>
  <text x="310" y="535" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">intervals[start] = end</text>
</svg>
