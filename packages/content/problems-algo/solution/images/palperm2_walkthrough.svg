<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "aaaabb" → half = "aab" 的回溯过程</text>
  <text x="300" y="42" text-anchor="middle" font-size="10.5" fill="#888">a:4, b:2 → half = "aab"(a×2+b×1), mid = ""，排列后镜像拼接</text>

  <!-- Table header -->
  <rect x="30" y="54" width="540" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="72" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">步骤</text>
  <text x="155" y="72" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">path</text>
  <text x="270" y="72" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">used</text>
  <text x="445" y="72" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">动作</text>

  <!-- Row 1 -->
  <rect x="30" y="84" width="540" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="103" text-anchor="middle" font-size="11" fill="#333">①</text>
  <text x="155" y="103" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">[]</text>
  <text x="270" y="103" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">[F, F, F]</text>
  <text x="445" y="103" text-anchor="middle" font-size="11" fill="#333">选 i=0 'a' → path="a"</text>

  <!-- Row 2 -->
  <rect x="30" y="116" width="540" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="135" text-anchor="middle" font-size="11" fill="#333">②</text>
  <text x="155" y="135" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">"a"</text>
  <text x="270" y="135" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">[T, F, F]</text>
  <text x="445" y="135" text-anchor="middle" font-size="11" fill="#333">选 i=1 'a'（used[0]=T→不剪）→ "aa"</text>

  <!-- Row 3 - collect -->
  <rect x="30" y="148" width="540" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="65" y="167" text-anchor="middle" font-size="11" fill="#333">③</text>
  <text x="155" y="167" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">"aa"</text>
  <text x="270" y="167" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">[T, T, F]</text>
  <text x="445" y="167" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">选 i=2 'b' → "aab" 收集 ✓</text>

  <!-- Row 4 - collect -->
  <rect x="30" y="180" width="540" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="202" text-anchor="middle" font-size="11" fill="#333">④</text>
  <text x="155" y="200" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">"a"</text>
  <text x="270" y="200" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">[T, F, F]</text>
  <text x="445" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">撤销→选 i=2 'b'→"ab"→选 i=1 'a'（不剪）</text>
  <text x="445" y="210" text-anchor="middle" font-size="10" fill="#4a7a3a">→ "aba" 收集 ✓</text>

  <!-- Row 5 - PRUNED -->
  <rect x="30" y="218" width="540" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="240" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⑤</text>
  <text x="155" y="240" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">[]</text>
  <text x="270" y="240" text-anchor="middle" font-size="11" fill="#b85450" font-family="monospace" font-weight="bold">[F, F, F]</text>
  <text x="445" y="236" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i=1: a==a &amp;&amp; !used[0] → 剪枝 ✗</text>
  <text x="445" y="250" text-anchor="middle" font-size="9" fill="#b85450">used[0]=F → i=0 的 'a' 已回溯 → 同层重复</text>

  <!-- Row 6 -->
  <rect x="30" y="256" width="540" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="275" text-anchor="middle" font-size="11" fill="#333">⑥</text>
  <text x="155" y="275" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">[]</text>
  <text x="270" y="275" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">[F, F, F]</text>
  <text x="445" y="275" text-anchor="middle" font-size="11" fill="#333">选 i=2 'b' → path="b"</text>

  <!-- Row 7 - collect -->
  <rect x="30" y="288" width="540" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="310" text-anchor="middle" font-size="11" fill="#333">⑦</text>
  <text x="155" y="308" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">"b"</text>
  <text x="270" y="308" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">[F, F, T]</text>
  <text x="445" y="304" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">选 i=0 'a'→"ba"→选 i=1 'a'（不剪）</text>
  <text x="445" y="318" text-anchor="middle" font-size="10" fill="#4a7a3a">→ "baa" 收集 ✓</text>

  <!-- Row 8 - PRUNED -->
  <rect x="30" y="326" width="540" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="348" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⑧</text>
  <text x="155" y="348" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">"b"</text>
  <text x="270" y="348" text-anchor="middle" font-size="11" fill="#b85450" font-family="monospace" font-weight="bold">[F, F, T]</text>
  <text x="445" y="344" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i=1: a==a &amp;&amp; !used[0] → 剪枝 ✗</text>
  <text x="445" y="358" text-anchor="middle" font-size="9" fill="#b85450">used[0]=F → i=0 的 'a' 已回溯 → 同层重复</text>

  <!-- Mirror results section -->
  <rect x="30" y="372" width="540" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="394" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">★ 镜像拼接：half + mid + reverse(half)</text>

  <text x="60" y="416" font-size="11" fill="#333" font-family="monospace">"aab"</text>
  <text x="110" y="416" font-size="11" fill="#888">+ "" +</text>
  <text x="160" y="416" font-size="11" fill="#333" font-family="monospace">"baa"</text>
  <text x="210" y="416" font-size="11" fill="#d6a040" font-weight="bold">= "aabbaa"</text>

  <text x="60" y="434" font-size="11" fill="#333" font-family="monospace">"aba"</text>
  <text x="110" y="434" font-size="11" fill="#888">+ "" +</text>
  <text x="160" y="434" font-size="11" fill="#333" font-family="monospace">"aba"</text>
  <text x="210" y="434" font-size="11" fill="#d6a040" font-weight="bold">= "abaaba"</text>

  <text x="60" y="452" font-size="11" fill="#333" font-family="monospace">"baa"</text>
  <text x="110" y="452" font-size="11" fill="#888">+ "" +</text>
  <text x="160" y="452" font-size="11" fill="#333" font-family="monospace">"aab"</text>
  <text x="210" y="452" font-size="11" fill="#d6a040" font-weight="bold">= "baaaab"</text>

  <text x="380" y="434" text-anchor="middle" font-size="10.5" fill="#555">共 3 个回文排列</text>
  <text x="380" y="450" text-anchor="middle" font-size="9.5" fill="#888">2 次剪枝避免了重复搜索</text>
</svg>
