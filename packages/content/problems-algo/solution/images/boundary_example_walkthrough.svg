<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 7 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 2 演算：四段分别收集 → 拼接</text>

  <!-- ===== Mini tree (left) ===== -->
  <text x="20" y="48" font-size="10" fill="#446688" font-weight="bold">树形(同色编码)</text>
  <g filter="url(#rough2)">
    <!-- edges: left boundary blue, right boundary red, others gray -->
    <line x1="113" y1="68" x2="82" y2="100" stroke="#446688" stroke-width="2"/>   <!-- 1-2 -->
    <line x1="69" y1="122" x2="56" y2="150" stroke="#446688" stroke-width="2"/>   <!-- 2-4 -->
    <line x1="127" y1="68" x2="158" y2="100" stroke="#b85450" stroke-width="2"/>  <!-- 1-3 -->
    <line x1="165" y1="122" x2="165" y2="150" stroke="#b85450" stroke-width="2"/> <!-- 3-6 -->
    <line x1="165" y1="172" x2="178" y2="200" stroke="#b85450" stroke-width="2"/> <!-- 6-10 -->
    <line x1="82" y1="122" x2="94" y2="150" stroke="#bbb" stroke-width="1.2"/>     <!-- 2-5 -->
    <line x1="94" y1="172" x2="82" y2="200" stroke="#bbb" stroke-width="1.2"/>     <!-- 5-7 -->
    <line x1="106" y1="172" x2="110" y2="200" stroke="#bbb" stroke-width="1.2"/>   <!-- 5-8 -->
    <line x1="150" y1="172" x2="142" y2="200" stroke="#bbb" stroke-width="1.2"/>   <!-- 6-9 -->

    <!-- nodes -->
    <circle cx="120" cy="60" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="120" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

    <circle cx="75" cy="110" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="75" y="114" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

    <circle cx="165" cy="110" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="165" y="114" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

    <circle cx="50" cy="160" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="50" y="164" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

    <circle cx="100" cy="160" r="11" fill="#f0f0f0" stroke="#aaa" stroke-width="1.3"/>
    <text x="100" y="164" text-anchor="middle" font-size="11" fill="#666">5</text>

    <circle cx="165" cy="160" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="165" y="164" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>

    <circle cx="85" cy="210" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="85" y="214" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">7</text>

    <circle cx="115" cy="210" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="115" y="214" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">8</text>

    <circle cx="148" cy="210" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="148" y="214" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">9</text>

    <circle cx="182" cy="210" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="182" y="214" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">10</text>
  </g>

  <!-- ===== Right column: 4 collected lists ===== -->
  <!-- 根段 -->
  <text x="300" y="56" font-size="11" fill="#888" font-weight="bold">根段</text>
  <rect x="300" y="62" width="280" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="316" y="83" font-size="12" fill="#d6a040" font-weight="bold">[ 1 ]</text>
  <text x="380" y="83" font-size="9" fill="#888">root 有孩子 → 放最前</text>

  <!-- 左边界 -->
  <text x="300" y="116" font-size="11" fill="#888" font-weight="bold">左边界(自顶向下, 排除终点叶)</text>
  <rect x="300" y="122" width="280" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="316" y="143" font-size="12" fill="#446688" font-weight="bold">[ 2 ]</text>
  <text x="360" y="143" font-size="9" fill="#888">路径 1→2→4, 4 是叶子排除</text>

  <!-- 叶子 -->
  <text x="300" y="176" font-size="11" fill="#888" font-weight="bold">叶子(前序, 左→右)</text>
  <rect x="300" y="182" width="280" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="316" y="203" font-size="12" fill="#4a7a3a" font-weight="bold">[ 4, 7, 8, 9, 10 ]</text>

  <!-- 右边界 -->
  <text x="300" y="236" font-size="11" fill="#888" font-weight="bold">右边界(逆序, 排除根与终点叶)</text>
  <rect x="300" y="242" width="280" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="316" y="263" font-size="12" fill="#b85450" font-weight="bold">[ 6, 3 ]</text>
  <text x="372" y="263" font-size="9" fill="#888">路径 1→3→6→10, 排除 1/10, 逆序</text>

  <!-- concatenation arrows from 4 boxes down to result -->
  <path d="M 440 94 L 440 108 L 300 108 L 300 300" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <path d="M 440 154 L 440 168 L 300 168 L 300 300" stroke="#446688" stroke-width="1.2" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <path d="M 440 214 L 440 228 L 300 228 L 300 300" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <path d="M 440 274 L 440 300" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>

  <!-- ===== Final result ===== -->
  <rect x="40" y="300" width="540" height="50" rx="8" fill="#fff" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="320" font-size="11" fill="#888" font-weight="bold">拼接 = 根 + 左 + 叶 + 右</text>
  <text x="60" y="340" font-size="14" fill="#333" font-weight="bold">[1] + [2] + [4,7,8,9,10] + [6,3] =</text>
  <rect x="380" y="312" width="190" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="475" y="331" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">[1,2,4,7,8,9,10,6,3]</text>

  <!-- footnote -->
  <rect x="40" y="365" width="540" height="60" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="56" y="385" font-size="10" fill="#d6a040" font-weight="bold">去重要点</text>
  <text x="56" y="401" font-size="10" fill="#555">• 左边界排除终点叶 4（已由叶子段收集）；右边界排除根 1 与终点叶 10。</text>
  <text x="56" y="416" font-size="10" fill="#555">• 右边界「逆序」= 后序位置追加：先递归到路径末端，回溯时依次压入 → 6 在前、3 在后。</text>
</svg>
