<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">密钥格式化算法流程</text>

  <!-- Start -->
  <ellipse cx="270" cy="62" rx="100" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">开始：读入 s, k</text>

  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: clean -->
  <rect x="170" y="104" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="124" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">① 清洗字符串</text>
  <text x="270" y="140" text-anchor="middle" font-size="10.5" fill="#666">去 '-' + 转大写 → t (长度 n)</text>

  <path d="M 270 148 L 270 166" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: compute first group size -->
  <rect x="150" y="170" width="240" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="190" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">② 算首组长度</text>
  <text x="270" y="206" text-anchor="middle" font-size="10.5" fill="#666">first = n % k；若 first == 0 则 first = k</text>

  <path d="M 270 214 L 270 232" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: first < n ? (是否需要分段) -->
  <polygon points="270,236 380,282 270,328 160,282" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="278" text-anchor="middle" font-size="12" fill="#333">first &lt; n ?</text>
  <text x="270" y="294" text-anchor="middle" font-size="10.5" fill="#666">(是否多于一组)</text>

  <!-- No branch: single group -->
  <path d="M 380 282 L 460 282" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="274" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="430" y="304" width="62" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="461" y="322" text-anchor="middle" font-size="10" fill="#333">返回</text>
  <text x="461" y="336" text-anchor="middle" font-size="10" fill="#333">t</text>
  <path d="M 461 282 L 461 304" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Yes branch down -->
  <path d="M 270 328 L 270 346" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="342" font-size="11" fill="#82b366">是</text>

  <!-- Step 3: build groups -->
  <rect x="120" y="350" width="300" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="370" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">③ 拼接结果</text>
  <text x="270" y="386" text-anchor="middle" font-size="10.5" fill="#666">res = t[0:first]</text>
  <text x="270" y="400" text-anchor="middle" font-size="10.5" fill="#666">for i in (first, first+k, ...): res += '-' + t[i:i+k]</text>

  <path d="M 270 406 L 270 424" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <ellipse cx="270" cy="444" rx="80" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="448" text-anchor="middle" font-size="11" fill="#333">返回 res</text>
</svg>
