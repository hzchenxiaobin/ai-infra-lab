<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：去重 + 降序 + 取前 min(k, m) 个</text>

  <text x="260" y="48" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">示例 2：nums = [84, 93, 100, 77, 93]，k = 3</text>

  <!-- 第一行：nums 原数组（两个 93 红色强调） -->
  <rect x="114" y="58" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">84</text>
  <rect x="174" y="58" width="52" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">93</text>
  <rect x="234" y="58" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">100</text>
  <rect x="294" y="58" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">77</text>
  <rect x="354" y="58" width="52" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="380" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">93</text>

  <text x="406" y="72" font-size="10.5" fill="#b85450" filter="url(#rough2)">← 两个 93</text>
  <text x="406" y="86" font-size="10.5" fill="#b85450" filter="url(#rough2)">只能算一个</text>

  <!-- 箭头 1 -->
  <path d="M 260 94 L 260 112" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="108" font-size="11" fill="#446688" filter="url(#rough2)">① 哈希集合去重</text>

  <!-- 第二行：去重结果（绿色） -->
  <rect x="144" y="118" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="139" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">84</text>
  <rect x="204" y="118" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="139" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">93</text>
  <rect x="264" y="118" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="139" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">100</text>
  <rect x="324" y="118" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="139" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">77</text>

  <text x="416" y="132" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">m = 4</text>
  <text x="416" y="146" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">个不同值</text>

  <!-- 箭头 2 -->
  <path d="M 260 154 L 260 172" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="168" font-size="11" fill="#446688" filter="url(#rough2)">② 降序排序</text>

  <!-- 第三行：降序结果（蓝色） -->
  <rect x="144" y="178" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="199" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">100</text>
  <rect x="204" y="178" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="199" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">93</text>
  <rect x="264" y="178" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="199" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">84</text>
  <rect x="324" y="178" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="199" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">77</text>

  <!-- 箭头 3 -->
  <path d="M 260 214 L 260 232" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="228" font-size="11" fill="#446688" filter="url(#rough2)">③ 取前 k = 3 个</text>

  <!-- 第四行：最终结果 + 被丢弃的 77 -->
  <rect x="144" y="238" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="259" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">100</text>
  <rect x="204" y="238" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="259" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">93</text>
  <rect x="264" y="238" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="259" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">84</text>
  <rect x="324" y="238" width="52" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4" rx="4" filter="url(#rough2)"/>
  <text x="350" y="259" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">77</text>
  <path d="M 330 242 L 370 268" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="406" y="252" font-size="10.5" fill="#888" filter="url(#rough2)">超出 k 个</text>
  <text x="406" y="266" font-size="10.5" fill="#888" filter="url(#rough2)">丢弃即可</text>

  <text x="260" y="292" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 [100, 93, 84]，和 = 277</text>

  <text x="260" y="316" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">💡 nums[i] 均为正数 ⇒ 能多选就多选：实际选 min(k, m) 个，&quot;至多 k&quot; 坍缩成一次切片</text>
  <text x="260" y="334" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">💡 去重 + 降序 ⇒ 返回数组天然严格递减，无需二次处理</text>
  <text x="260" y="352" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">⚠️ 返回的是所选数字本身（可能不足 k 个），不是数值和</text>
</svg>
