<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：尾部数字 = 原始位置（1-indexed）</text>

  <!-- Row 1: shuffled input words -->
  <text x="40" y="64" font-size="11" fill="#888">乱序输入：</text>

  <!-- This1 (orange, position 1) -->
  <rect x="90" y="52" width="70" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="118" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">This</text>
  <rect x="150" y="48" width="20" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="76" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>

  <!-- is2 (green, position 2) -->
  <rect x="230" y="52" width="46" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="250" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">is</text>
  <rect x="270" y="48" width="20" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="280" y="76" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>

  <!-- a3 (blue, position 3) -->
  <rect x="340" y="52" width="34" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="353" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="370" y="48" width="20" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="380" y="76" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>

  <!-- sentence4 (orange-light, position 4) -->
  <rect x="440" y="52" width="100" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="486" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">sentence</text>
  <rect x="536" y="48" width="20" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="546" y="76" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>

  <!-- Arrows from each digit down to position slots -->
  <path d="M 160 100 Q 160 130 60 156" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 100 Q 280 130 200 156" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 100 Q 380 130 340 156" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 546 100 Q 546 130 480 156" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row 2: position slots 1..4 -->
  <text x="40" y="172" font-size="11" fill="#888">位置桶：</text>

  <rect x="40" y="160" width="80" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="180" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">槽 1</text>
  <text x="80" y="197" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">This</text>

  <rect x="160" y="160" width="80" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="180" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">槽 2</text>
  <text x="200" y="197" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">is</text>

  <rect x="300" y="160" width="80" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="340" y="180" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">槽 3</text>
  <text x="340" y="197" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>

  <rect x="440" y="160" width="100" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="490" y="180" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">槽 4</text>
  <text x="490" y="197" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">sentence</text>

  <!-- down arrow to output -->
  <path d="M 300 210 L 300 232" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row 3: reconstructed output -->
  <rect x="110" y="240" width="380" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="264" font-size="11" fill="#555">输出：</text>
  <text x="175" y="265" font-size="14" fill="#4a7a3a" font-weight="bold">"This is a sentence"</text>

  <!-- Core idea box -->
  <rect x="40" y="296" width="520" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="322" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">关键直觉：数字即下标</text>
  <text x="300" y="343" text-anchor="middle" font-size="11" fill="#666">每个词末位数字 d ∈ {1..9} ⇒ 去尾后放入 bucket[d−1]</text>
  <text x="300" y="360" text-anchor="middle" font-size="10" fill="#888">桶大小 ≤ 9，一次扫描 + 拼接，O(n) / O(1)</text>
</svg>
