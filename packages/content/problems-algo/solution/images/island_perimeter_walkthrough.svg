<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="460" height="360" fill="#fafafa"/>
  <text x="230" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：每块陆地的净周长贡献</text>

  <!-- col labels -->
  <text x="78" y="52" text-anchor="middle" font-size="11" fill="#888">j=0</text>
  <text x="134" y="52" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="190" y="52" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="246" y="52" text-anchor="middle" font-size="11" fill="#888">3</text>
  <!-- row labels -->
  <text x="40" y="92" text-anchor="middle" font-size="11" fill="#888">i=0</text>
  <text x="40" y="148" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="40" y="204" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="40" y="260" text-anchor="middle" font-size="11" fill="#888">3</text>

  <!-- grid cells: 56x56, x=50..274, y=60..284 -->
  <!-- row 0: (0,0)=0 (0,1)=1+4 (0,2)=0 (0,3)=0 -->
  <rect x="50" y="60" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="78" y="92" text-anchor="middle" font-size="12" fill="#88aacc">0</text>
  <rect x="106" y="60" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="134" y="92" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">+4</text>
  <rect x="162" y="60" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="190" y="92" text-anchor="middle" font-size="12" fill="#88aacc">0</text>
  <rect x="218" y="60" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="246" y="92" text-anchor="middle" font-size="12" fill="#88aacc">0</text>

  <!-- row 1: (1,0)=1+4 (1,1)=1+0 (1,2)=1+2 (1,3)=0 -->
  <rect x="50" y="116" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="78" y="148" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">+4</text>
  <rect x="106" y="116" width="56" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="134" y="148" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">0</text>
  <rect x="162" y="116" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="190" y="148" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">+2</text>
  <rect x="218" y="116" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="246" y="148" text-anchor="middle" font-size="12" fill="#88aacc">0</text>

  <!-- row 2: (2,0)=0 (2,1)=1+2 (2,2)=0 (2,3)=0 -->
  <rect x="50" y="172" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="78" y="204" text-anchor="middle" font-size="12" fill="#88aacc">0</text>
  <rect x="106" y="172" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="134" y="204" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">+2</text>
  <rect x="162" y="172" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="190" y="204" text-anchor="middle" font-size="12" fill="#88aacc">0</text>
  <rect x="218" y="172" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="246" y="204" text-anchor="middle" font-size="12" fill="#88aacc">0</text>

  <!-- row 3: (3,0)=1+4 (3,1)=1+0 (3,2)=0 (3,3)=0 -->
  <rect x="50" y="228" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="78" y="260" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">+4</text>
  <rect x="106" y="228" width="56" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="134" y="260" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">0</text>
  <rect x="162" y="228" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="190" y="260" text-anchor="middle" font-size="12" fill="#88aacc">0</text>
  <rect x="218" y="228" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="246" y="260" text-anchor="middle" font-size="12" fill="#88aacc">0</text>

  <!-- legend -->
  <rect x="300" y="68" width="18" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="324" y="80" font-size="10.5" fill="#4a7a3a">陆地（净贡献）</text>
  <rect x="300" y="90" width="18" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <text x="324" y="102" font-size="10.5" fill="#b85450">陆地·贡献 0</text>
  <rect x="300" y="112" width="18" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="324" y="124" font-size="10.5" fill="#446688">水域（0）</text>

  <text x="300" y="150" font-size="10.5" fill="#555">净贡献 =</text>
  <text x="300" y="166" font-size="10.5" fill="#555">+4 − 2·(左邻陆)</text>
  <text x="300" y="182" font-size="10.5" fill="#555">   − 2·(上邻陆)</text>

  <!-- summary box -->
  <rect x="40" y="300" width="380" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="320" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">7 块陆地 × 4 − 6 对相邻 × 2 = 28 − 12 = 16</text>
  <text x="230" y="336" text-anchor="middle" font-size="10.5" fill="#555">左邻相邻 3 对 + 上邻相邻 3 对 = 6 对</text>
</svg>
