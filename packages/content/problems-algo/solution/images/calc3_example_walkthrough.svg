<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "2*(5-3)+4"，求值结果 = 8</text>

  <!-- table header -->
  <text x="26" y="56" font-size="12" fill="#444" font-weight="bold">步</text>
  <text x="84" y="56" font-size="12" fill="#444" font-weight="bold">字符 c</text>
  <text x="150" y="56" font-size="12" fill="#444" font-weight="bold">动作</text>
  <text x="384" y="56" font-size="12" fill="#444" font-weight="bold">nums（栈底→顶）</text>
  <text x="544" y="56" font-size="12" fill="#444" font-weight="bold">ops</text>

  <line x1="20" y1="62" x2="624" y2="62" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: 2 -->
  <text x="26" y="82" font-size="11" fill="#333">1</text>
  <text x="84" y="82" font-size="11" fill="#333" font-weight="bold">'2'</text>
  <text x="150" y="82" font-size="11" fill="#888">数字，读完整压栈</text>
  <text x="384" y="82" font-size="11" fill="#4a7a3a" font-weight="bold">[2]</text>
  <text x="544" y="82" font-size="11" fill="#888">[]</text>

  <!-- Row 2: * -->
  <text x="26" y="102" font-size="11" fill="#333">2</text>
  <text x="84" y="102" font-size="11" fill="#b85450" font-weight="bold">'×'</text>
  <text x="150" y="102" font-size="11" fill="#888">ops 空，直接压 ×</text>
  <text x="384" y="102" font-size="11" fill="#333">[2]</text>
  <text x="544" y="102" font-size="11" fill="#b85450" font-weight="bold">[×]</text>

  <!-- Row 3: ( -->
  <text x="26" y="122" font-size="11" fill="#333">3</text>
  <text x="84" y="122" font-size="11" fill="#888" font-weight="bold">'('</text>
  <text x="150" y="122" font-size="11" fill="#888">压 '('（优先级 0）</text>
  <text x="384" y="122" font-size="11" fill="#333">[2]</text>
  <text x="544" y="122" font-size="11" fill="#888">[× (]</text>

  <!-- Row 4: 5 -->
  <text x="26" y="142" font-size="11" fill="#333">4</text>
  <text x="84" y="142" font-size="11" fill="#333" font-weight="bold">'5'</text>
  <text x="150" y="142" font-size="11" fill="#888">数字压栈</text>
  <text x="384" y="142" font-size="11" fill="#4a7a3a" font-weight="bold">[2, 5]</text>
  <text x="544" y="142" font-size="11" fill="#888">[× (]</text>

  <!-- Row 5: - -->
  <text x="26" y="162" font-size="11" fill="#333">5</text>
  <text x="84" y="162" font-size="11" fill="#d6a040" font-weight="bold">'−'</text>
  <text x="150" y="162" font-size="11" fill="#888">prio('(')=0 &lt; 1，不归约，压 −</text>
  <text x="384" y="162" font-size="11" fill="#333">[2, 5]</text>
  <text x="544" y="162" font-size="11" fill="#d6a040" font-weight="bold">[× ( −]</text>

  <!-- Row 6: 3 -->
  <text x="26" y="182" font-size="11" fill="#333">6</text>
  <text x="84" y="182" font-size="11" fill="#333" font-weight="bold">'3'</text>
  <text x="150" y="182" font-size="11" fill="#888">数字压栈</text>
  <text x="384" y="182" font-size="11" fill="#4a7a3a" font-weight="bold">[2, 5, 3]</text>
  <text x="544" y="182" font-size="11" fill="#888">[× ( −]</text>

  <!-- Row 7: ) -->
  <text x="26" y="202" font-size="11" fill="#333">7</text>
  <text x="84" y="202" font-size="11" fill="#888" font-weight="bold">')'</text>
  <text x="150" y="202" font-size="11" fill="#b85450" font-weight="bold">归约 −: 5−3=2；弹 '('</text>
  <text x="384" y="202" font-size="11" fill="#b85450" font-weight="bold">[2, 2]</text>
  <text x="544" y="202" font-size="11" fill="#b85450" font-weight="bold">[×]</text>

  <!-- Row 8: + -->
  <text x="26" y="222" font-size="11" fill="#333">8</text>
  <text x="84" y="222" font-size="11" fill="#d6a040" font-weight="bold">'+'</text>
  <text x="150" y="222" font-size="11" fill="#b85450" font-weight="bold">prio(×)=2 ≥ 1 → 归约 ×: 2×2=4</text>
  <text x="384" y="222" font-size="11" fill="#b85450" font-weight="bold">[4]</text>
  <text x="544" y="222" font-size="11" fill="#d6a040" font-weight="bold">[+]</text>

  <!-- Row 9: 4 -->
  <text x="26" y="242" font-size="11" fill="#333">9</text>
  <text x="84" y="242" font-size="11" fill="#333" font-weight="bold">'4'</text>
  <text x="150" y="242" font-size="11" fill="#888">数字压栈</text>
  <text x="384" y="242" font-size="11" fill="#4a7a3a" font-weight="bold">[4, 4]</text>
  <text x="544" y="242" font-size="11" fill="#888">[+]</text>

  <!-- Row 10: end -->
  <text x="26" y="262" font-size="11" fill="#333">10</text>
  <text x="84" y="262" font-size="11" fill="#888" font-weight="bold">结束</text>
  <text x="150" y="262" font-size="11" fill="#b85450" font-weight="bold">归约 +: 4+4=8</text>
  <text x="384" y="262" font-size="11" fill="#b85450" font-weight="bold">[8]</text>
  <text x="544" y="262" font-size="11" fill="#888">[]</text>

  <line x1="20" y1="272" x2="624" y2="272" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- result box -->
  <rect x="60" y="286" width="520" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="306" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">最终结果：2 × (5 − 3) + 4 = 2 × 2 + 4 = 8 ⭐</text>
  <text x="320" y="321" text-anchor="middle" font-size="11" fill="#888">关键在第 8 步：'+' 到达时栈顶 '×' 优先级更高，先归约乘法再压 '+'</text>

  <!-- precedence note -->
  <rect x="60" y="336" width="520" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="353" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">优先级表：× ÷ = 2，+ − = 1，( = 0</text>
  <text x="320" y="367" text-anchor="middle" font-size="10" fill="#888">'(' 用最低优先级挡住归约，使括号内子式被 ')' 隔离求值</text>

  <!-- unary minus note -->
  <rect x="60" y="382" width="520" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="400" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">一元负号：开头 '-' 或 '(-' 时（expect_num 为真）往 nums 压一个 0</text>
  <text x="320" y="416" text-anchor="middle" font-size="10" fill="#555">"-2+1" → 0−2+1 = −1；"1-(-2)" → 1−(0−2) = 3</text>
  <text x="320" y="430" text-anchor="middle" font-size="10" fill="#888">一元 '+' 直接跳过；化为二元后走统一归约，无需特判</text>
</svg>
