<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="300" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历，维护 |i − start| 的最小值</text>

  <!-- N1: ans = +∞ -->
  <rect x="180" y="38" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="58" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = +∞</text>
  <path d="M 250 68 L 250 84" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- N2: diamond i < n ?  center (250, 100) -->
  <polygon points="250,84 322,100 250,116 178,100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="104" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>
  <!-- N2 Yes -> down -->
  <path d="M 250 116 L 250 136" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="264" y="130" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <!-- N2 No -> right: 返回 ans -->
  <path d="M 322 100 L 398 100" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="95" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="398" y="85" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="458" y="105" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- N3: diamond nums[i] == target ?  center (250, 150) -->
  <polygon points="250,136 340,150 250,164 160,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="154" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">nums[i] == target ?</text>
  <!-- N3 Yes -> right: ans = min(ans, |i - start|) -->
  <path d="M 340 150 L 378 150" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="145" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="378" y="136" width="142" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="449" y="155" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">ans = min(ans, |i−start|)</text>
  <!-- ans box down then left to N4 -->
  <path d="M 449 164 L 449 200 L 254 200" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- N3 No -> down to N4 -->
  <path d="M 250 164 L 250 200" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="264" y="184" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- N4: i += 1 -->
  <rect x="190" y="200" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i += 1</text>
  <!-- loop back to N2: left, up, right -->
  <path d="M 190 215 L 80 215 L 80 100 L 176 100" stroke="#666" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="88" y="160" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">循环</text>

  <!-- Legend -->
  <path d="M 40 258 L 500 258" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="270" y="278" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">蓝=处理框  橙=判定  绿=更新/返回  虚线=循环回边</text>
</svg>
