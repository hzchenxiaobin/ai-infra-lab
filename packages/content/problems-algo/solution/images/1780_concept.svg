<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：三进制每位 = 该幂被使用的次数，distinct 要求每位 ≤ 1</text>

  <!-- ===== Powers header row ===== -->
  <text x="48" y="66" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">3 的幂</text>
  <g filter="url(#rough2)" font-size="11" font-weight="bold" text-anchor="middle">
    <rect x="118" y="50" width="56" height="28" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5" rx="4"/>
    <text x="146" y="69" fill="#888">81</text>
    <rect x="190" y="50" width="56" height="28" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5" rx="4"/>
    <text x="218" y="69" fill="#888">27</text>
    <rect x="262" y="50" width="56" height="28" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5" rx="4"/>
    <text x="290" y="69" fill="#888">9</text>
    <rect x="334" y="50" width="56" height="28" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5" rx="4"/>
    <text x="362" y="69" fill="#888">3</text>
    <rect x="406" y="50" width="56" height="28" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5" rx="4"/>
    <text x="434" y="69" fill="#888">1</text>
  </g>
  <text x="490" y="66" font-size="10" fill="#888" filter="url(#rough2)">结论</text>

  <!-- ===== n = 12 row ===== -->
  <text x="48" y="112" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">n = 12</text>
  <g filter="url(#rough2)" font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="118" y="96" width="56" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="146" y="115" fill="#ccc">0</text>
    <rect x="190" y="96" width="56" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="218" y="115" fill="#ccc">0</text>
    <rect x="262" y="96" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="290" y="115" fill="#446688">1</text>
    <rect x="334" y="96" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="362" y="115" fill="#446688">1</text>
    <rect x="406" y="96" width="56" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="434" y="115" fill="#ccc">0</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="478" y="98" width="64" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="12"/>
    <text x="510" y="114" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓ true</text>
  </g>
  <text x="290" y="140" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">12 = 9 + 3 = 3² + 3¹</text>

  <!-- ===== n = 91 row ===== -->
  <text x="48" y="172" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">n = 91</text>
  <g filter="url(#rough2)" font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="118" y="156" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="146" y="175" fill="#446688">1</text>
    <rect x="190" y="156" width="56" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="218" y="175" fill="#ccc">0</text>
    <rect x="262" y="156" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="290" y="175" fill="#446688">1</text>
    <rect x="334" y="156" width="56" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="362" y="175" fill="#ccc">0</text>
    <rect x="406" y="156" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="434" y="175" fill="#446688">1</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="478" y="158" width="64" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="12"/>
    <text x="510" y="174" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓ true</text>
  </g>
  <text x="290" y="200" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">91 = 81 + 9 + 1 = 3⁴ + 3² + 3⁰</text>

  <!-- ===== n = 21 row ===== -->
  <text x="48" y="232" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">n = 21</text>
  <g filter="url(#rough2)" font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="118" y="216" width="56" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="146" y="235" fill="#ccc">0</text>
    <rect x="190" y="216" width="56" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="218" y="235" fill="#ccc">0</text>
    <rect x="262" y="216" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="290" y="235" fill="#b85450">2</text>
    <rect x="334" y="216" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="362" y="235" fill="#446688">1</text>
    <rect x="406" y="216" width="56" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="434" y="235" fill="#ccc">0</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="478" y="218" width="64" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="12"/>
    <text x="510" y="234" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗ false</text>
  </g>
  <text x="290" y="260" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">数字 2 → 9 被用了两次，违反 distinct</text>

  <!-- arrow pointing to the problematic digit 2 -->
  <path d="M 290 270 L 290 282" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== Legend ===== -->
  <g filter="url(#rough2)" font-size="9" fill="#555">
    <rect x="118" y="290" width="20" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="146" y="302">数字 1：选该幂一次</text>
    <rect x="270" y="290" width="20" height="16" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="298" y="302">数字 0：不选</text>
    <rect x="400" y="290" width="20" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <text x="428" y="302">数字 2：冲突 ✗</text>
  </g>

  <!-- ===== Bottom: key insight ===== -->
  <rect x="40" y="322" width="480" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="342" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">关键洞察：n 的三进制表示 = 「选哪些 3 的幂」的编码</text>
  <line x1="52" y1="350" x2="508" y2="350" stroke="#b8d8b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="368" font-size="10" fill="#555" filter="url(#rough2)">将 n 写成三进制：n = d₄·81 + d₃·27 + d₂·9 + d₁·3 + d₀·1</text>
  <text x="52" y="386" font-size="10" fill="#555" filter="url(#rough2)">每位 dᵢ ∈ {0, 1, 2} 表示 3ⁱ 被使用的次数</text>
  <text x="52" y="406" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">distinct 要求每个幂最多用一次 → 每位 dᵢ ≤ 1 → 不允许出现数字 2</text>
  <text x="52" y="426" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">结论：n 能表示成不同的三的幂之和 ⟺ n 的三进制表示只含 0 和 1</text>
</svg>
