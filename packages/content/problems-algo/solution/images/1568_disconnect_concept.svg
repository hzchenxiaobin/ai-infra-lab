<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="620" height="400" fill="#fdfcf7"/>

  <text x="310" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">使陆地分离的最少天数：角点度数 ≤ 2 → 答案 ≤ 2</text>
  <path d="M 160 38 Q 310 46 460 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Left: 4x4 grid with island ===== -->
  <text x="132" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">取「最上行的最左陆地格」(r,c)</text>

  <!-- 4x4 grid, cell 46, origin (40,80); water=#eef2f7, land=#e8f0fe -->
  <!-- row 0: all water -->
  <g filter="url(#sk)"><rect x="40"  y="80"  width="46" height="46" rx="3" fill="#eef2f7" stroke="#9aa8b5" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="86"  y="80"  width="46" height="46" rx="3" fill="#eef2f7" stroke="#9aa8b5" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="132" y="80"  width="46" height="46" rx="3" fill="#eef2f7" stroke="#9aa8b5" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="178" y="80"  width="46" height="46" rx="3" fill="#eef2f7" stroke="#9aa8b5" stroke-width="1"/></g>
  <!-- row 1: water, (r,c) red, A orange, water -->
  <g filter="url(#sk)"><rect x="40"  y="126" width="46" height="46" rx="3" fill="#eef2f7" stroke="#9aa8b5" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="86"  y="126" width="46" height="46" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/></g>
  <g filter="url(#sk)"><rect x="132" y="126" width="46" height="46" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <g filter="url(#sk)"><rect x="178" y="126" width="46" height="46" rx="3" fill="#eef2f7" stroke="#9aa8b5" stroke-width="1"/></g>
  <!-- row 2: water, B orange, land blue, water -->
  <g filter="url(#sk)"><rect x="40"  y="172" width="46" height="46" rx="3" fill="#eef2f7" stroke="#9aa8b5" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="86"  y="172" width="46" height="46" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <g filter="url(#sk)"><rect x="132" y="172" width="46" height="46" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="178" y="172" width="46" height="46" rx="3" fill="#eef2f7" stroke="#9aa8b5" stroke-width="1"/></g>
  <!-- row 3: all water -->
  <g filter="url(#sk)"><rect x="40"  y="218" width="46" height="46" rx="3" fill="#eef2f7" stroke="#9aa8b5" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="86"  y="218" width="46" height="46" rx="3" fill="#eef2f7" stroke="#9aa8b5" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="132" y="218" width="46" height="46" rx="3" fill="#eef2f7" stroke="#9aa8b5" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="178" y="218" width="46" height="46" rx="3" fill="#eef2f7" stroke="#9aa8b5" stroke-width="1"/></g>

  <!-- cell text -->
  <text x="63"  y="103" text-anchor="middle" font-size="13" fill="#9aa8b5">0</text>
  <text x="109" y="103" text-anchor="middle" font-size="13" fill="#9aa8b5">0</text>
  <text x="155" y="103" text-anchor="middle" font-size="13" fill="#9aa8b5">0</text>
  <text x="201" y="103" text-anchor="middle" font-size="13" fill="#9aa8b5">0</text>
  <text x="63"  y="149" text-anchor="middle" font-size="13" fill="#9aa8b5">0</text>
  <text x="109" y="151" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
  <text x="155" y="151" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <text x="201" y="149" text-anchor="middle" font-size="13" fill="#9aa8b5">0</text>
  <text x="63"  y="195" text-anchor="middle" font-size="13" fill="#9aa8b5">0</text>
  <text x="109" y="197" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <text x="155" y="197" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <text x="201" y="195" text-anchor="middle" font-size="13" fill="#9aa8b5">0</text>
  <text x="63"  y="241" text-anchor="middle" font-size="13" fill="#9aa8b5">0</text>
  <text x="109" y="241" text-anchor="middle" font-size="13" fill="#9aa8b5">0</text>
  <text x="155" y="241" text-anchor="middle" font-size="13" fill="#9aa8b5">0</text>
  <text x="201" y="241" text-anchor="middle" font-size="13" fill="#9aa8b5">0</text>

  <!-- (r,c) label -->
  <text x="109" y="120" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">(r,c)</text>
  <text x="155" y="120" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">A 右</text>
  <text x="74"  y="197" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">B 下</text>

  <!-- arrows: up ✗ (no land), left ✗ (no land) -->
  <path d="M 109 72 L 109 78" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="124" y="76" font-size="10" fill="#b85450" font-weight="bold">↑ 无陆</text>
  <path d="M 32 149 L 38 149" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="30" y="152" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">←无陆</text>
  <!-- arrows: right A, down B (the only possible neighbors) -->
  <path d="M 124 149 L 130 149" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <path d="M 109 164 L 109 170" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>

  <!-- ===== Right: three insight boxes ===== -->
  <!-- Box 1: degree <= 2 -->
  <g filter="url(#sk)"><rect x="250" y="80" width="350" height="74" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="266" y="104" font-size="13" font-weight="bold" fill="#b85450">① 角点性质：度数 ≤ 2</text>
  <text x="266" y="124" font-size="11" fill="#444">(r,c) 上方无陆(更上) + 左方无陆(更左)</text>
  <text x="266" y="140" font-size="11" fill="#444">→ 邻居只可能在 右 A 与 下 B → 度数 ≤ 2</text>

  <!-- Box 2: case table -->
  <g filter="url(#sk)"><rect x="250" y="164" width="350" height="118" rx="10" fill="#fffdf3" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="266" y="186" font-size="13" font-weight="bold" fill="#d6a040">② 分情况：答案恒 ≤ 2</text>
  <text x="266" y="206" font-size="11" fill="#444">度 0 → 删它 → 0 座岛 → <tspan fill="#b85450" font-weight="bold">1 天</tspan></text>
  <text x="266" y="224" font-size="11" fill="#444">度 1 → 邻居 X 是割点 → <tspan fill="#b85450" font-weight="bold">1 天</tspan>（≥3 格时）</text>
  <text x="266" y="242" font-size="11" fill="#444">度 2 → 删 A,B → (r,c) 孤立 → <tspan fill="#b85450" font-weight="bold">2 天</tspan>（无割点时）</text>
  <text x="266" y="268" font-size="10" fill="#888">注：2 格岛 / 3 格 L 形均落入「1 天」分支</text>

  <!-- Box 3: three-stage decision -->
  <g filter="url(#sk)"><rect x="250" y="292" width="350" height="74" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="266" y="316" font-size="13" font-weight="bold" fill="#4a7a3a">③ 三段判定</text>
  <text x="266" y="336" font-size="11" fill="#444">数岛 ≠1 → <tspan font-weight="bold">0</tspan>；枚举删一格 ≠1 → <tspan font-weight="bold">1</tspan>；</text>
  <text x="266" y="352" font-size="11" fill="#444">否则由引理 → <tspan font-weight="bold">2</tspan>（无需搜索！）</text>

  <!-- bottom hint -->
  <text x="310" y="386" text-anchor="middle" font-size="10" fill="#888" font-style="italic">困难点不在实现，而在「想到答案上界是 2」</text>
</svg>
