<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="28" y="22" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：切一条边把树分成两半——同组点对在两侧各选一个</text>

  <!-- 面板一：树 + 切边 -->
  <rect x="20" y="38" width="330" height="252" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="58" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 删去边 (0,1)：树分成 S = subtree(1) 与其余</text>

  <!-- 子树 S 底色 -->
  <ellipse cx="95" cy="200" rx="72" ry="62" fill="#e6f4ea" fill-opacity="0.55"
           stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- 树的边 -->
  <line x1="165" y1="100" x2="95" y2="170" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="165" y1="100" x2="250" y2="170" stroke="#8a94a6" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="95" y1="170" x2="50" y2="235" stroke="#8a94a6" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="95" y1="170" x2="140" y2="235" stroke="#8a94a6" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="250" y1="170" x2="310" y2="215" stroke="#8a94a6" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 同组对 (4,5) 的路径 -->
  <polyline points="140,235 95,170 165,100 250,170 310,215" fill="none"
            stroke="#d6a040" stroke-width="3.5" opacity="0.85" filter="url(#rough2)"/>

  <!-- 切边标记 -->
  <line x1="123" y1="128" x2="137" y2="142" stroke="#b85450" stroke-width="2" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="141" y="122" font-size="15" fill="#b85450" filter="url(#rough2)">✂</text>

  <!-- 节点 -->
  <circle cx="165" cy="100" r="15" fill="#ffffff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="165" y="105" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <circle cx="95" cy="170" r="15" fill="#ffffff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="95" y="175" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="250" cy="170" r="15" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="175" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="50" cy="235" r="15" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="50" y="240" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="140" cy="235" r="15" fill="#ffffff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="240" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <circle cx="310" cy="215" r="15" fill="#ffffff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="220" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>

  <!-- 组标签角标 -->
  <rect x="173" y="78" width="20" height="15" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="183" y="90" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="103" y="148" width="20" height="15" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="113" y="160" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="258" y="148" width="20" height="15" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="268" y="160" text-anchor="middle" font-size="10" fill="#2d5a24" filter="url(#rough2)">2</text>
  <rect x="58" y="213" width="20" height="15" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="68" y="225" text-anchor="middle" font-size="10" fill="#2d5a24" filter="url(#rough2)">2</text>
  <rect x="148" y="213" width="20" height="15" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="158" y="225" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="318" y="193" width="20" height="15" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="328" y="205" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">1</text>

  <!-- 强调同组对两端 -->
  <circle cx="140" cy="235" r="19" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <circle cx="310" cy="215" r="19" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <text x="36" y="266" font-size="10.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">S 侧 = {1, 3, 4}</text>
  <text x="36" y="283" font-size="10" fill="#8a6d1f" filter="url(#rough2)">角标 = 组标签；同组对 (4,5) 的路径恰穿过切边 1 次</text>

  <!-- 面板二：这条边值多少 -->
  <rect x="362" y="38" width="178" height="252" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="375" y="60" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">② 这条边值多少？</text>

  <!-- 计数表 -->
  <rect x="372" y="74" width="172" height="26" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="372" y="100" width="172" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="372" y="124" width="172" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="400" y1="74" x2="400" y2="148" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <line x1="452" y1="74" x2="452" y2="148" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <line x1="492" y1="74" x2="492" y2="148" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <line x1="372" y1="100" x2="544" y2="100" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>

  <text x="386" y="91" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">g</text>
  <text x="426" y="91" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">total</text>
  <text x="472" y="91" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="518" y="91" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">c×(T−c)</text>

  <text x="386" y="116" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="426" y="116" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">4</text>
  <text x="472" y="116" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="518" y="116" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">2×2=4</text>

  <text x="386" y="140" text-anchor="middle" font-size="11" fill="#2d5a24" filter="url(#rough2)">2</text>
  <text x="426" y="140" text-anchor="middle" font-size="11" fill="#2d5a24" filter="url(#rough2)">2</text>
  <text x="472" y="140" text-anchor="middle" font-size="11" fill="#2d5a24" filter="url(#rough2)">1</text>
  <text x="518" y="140" text-anchor="middle" font-size="11" fill="#2d5a24" filter="url(#rough2)">1×1=1</text>

  <rect x="372" y="176" width="172" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="458" y="198" text-anchor="middle" font-size="12" fill="#8a3030" font-weight="bold" filter="url(#rough2)">边 (0,1) 贡献 = 5</text>

  <text x="375" y="232" font-size="9.5" fill="#6b5a33" filter="url(#rough2)">c：S 内组 g 的节点数</text>
  <text x="375" y="250" font-size="9.5" fill="#6b5a33" filter="url(#rough2)">total：全树组 g 的节点数</text>
  <text x="375" y="268" font-size="9.5" fill="#6b5a33" filter="url(#rough2)">异组点对不进入任何组计数</text>

  <!-- 面板三：为什么逐边求和等价 -->
  <rect x="20" y="304" width="520" height="150" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="326" font-size="12" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">③ 为什么逐边求和等价？</text>

  <text x="36" y="350" font-size="10.5" fill="#2d5a24" filter="url(#rough2)">dist(u,v) = 路径边数；树无环 → 每条边在一条路径中至多计 1 次</text>
  <text x="36" y="374" font-size="10.5" fill="#2d5a24" filter="url(#rough2)">交换求和顺序：答案 = Σ_e（路径穿过 e 的同组点对数）</text>
  <text x="36" y="398" font-size="10.5" fill="#2d5a24" filter="url(#rough2)">组 g 的点对穿过 e ⟺ 分居两侧 → 每组“左 × 右” = c_g × (total_g − c_g)</text>
  <text x="36" y="426" font-size="10.5" fill="#2d5a24" filter="url(#rough2)">组标签 ≤ 20 → 子树计数只需 21 槽，一趟后序自底向上合并全部搞定</text>
</svg>
