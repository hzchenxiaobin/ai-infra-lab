<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">失配类型与交换策略</text>

  <!-- String display -->
  <text x="30" y="58" font-size="12" fill="#888">s1:</text>
  <rect x="70" y="44" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="63" text-anchor="middle" font-size="13" fill="#333">x</text>
  <rect x="108" y="44" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="63" text-anchor="middle" font-size="13" fill="#333">y</text>
  <rect x="146" y="44" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="63" text-anchor="middle" font-size="13" fill="#333">x</text>
  <rect x="184" y="44" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="63" text-anchor="middle" font-size="13" fill="#333">x</text>
  <rect x="222" y="44" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="63" text-anchor="middle" font-size="13" fill="#333">y</text>

  <text x="30" y="92" font-size="12" fill="#888">s2:</text>
  <rect x="70" y="78" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="88" y="97" text-anchor="middle" font-size="13" fill="#b85450">y</text>
  <rect x="108" y="78" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="126" y="97" text-anchor="middle" font-size="13" fill="#d6a040">x</text>
  <rect x="146" y="78" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="97" text-anchor="middle" font-size="13" fill="#333">x</text>
  <rect x="184" y="78" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="202" y="97" text-anchor="middle" font-size="13" fill="#b85450">y</text>
  <rect x="222" y="78" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="97" text-anchor="middle" font-size="13" fill="#d6a040">x</text>

  <!-- Labels for mismatch types -->
  <text x="88" y="124" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">xy型</text>
  <text x="126" y="124" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">yx型</text>
  <text x="202" y="124" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">xy型</text>
  <text x="240" y="124" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">yx型</text>
  <text x="164" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a">已匹配</text>

  <!-- Divider -->
  <path d="M 30 140 L 530 140" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Strategy 1: two xy -> 1 swap -->
  <text x="30" y="162" font-size="12" fill="#555" font-weight="bold">策略①：两个 xy 型 → 1 次交换</text>
  <rect x="40" y="174" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="190" text-anchor="middle" font-size="11" fill="#333">x</text>
  <rect x="74" y="174" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="89" y="190" text-anchor="middle" font-size="11" fill="#333">x</text>
  <text x="100" y="190" font-size="10" fill="#888">s1</text>
  <rect x="40" y="202" width="30" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="218" text-anchor="middle" font-size="11" fill="#b85450">y</text>
  <rect x="74" y="202" width="30" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="89" y="218" text-anchor="middle" font-size="11" fill="#b85450">y</text>
  <text x="100" y="218" font-size="10" fill="#888">s2</text>

  <path d="M 55 198 Q 89 165 89 198" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="120" y="200" font-size="10" fill="#b85450">交换 s1[0]↔s2[1]</text>

  <path d="M 115 214 L 145 214" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="155" y="174" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a">y</text>
  <rect x="189" y="174" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a">x</text>
  <rect x="155" y="202" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="218" text-anchor="middle" font-size="11" fill="#4a7a3a">y</text>
  <rect x="189" y="202" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="218" text-anchor="middle" font-size="11" fill="#4a7a3a">x</text>
  <text x="230" y="200" font-size="10" fill="#4a7a3a">✓ 全部匹配</text>

  <!-- Strategy 2: xy + yx -> 2 swaps -->
  <text x="320" y="162" font-size="12" fill="#555" font-weight="bold">策略②：xy + yx 型 → 2 次交换</text>
  <rect x="330" y="174" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="190" text-anchor="middle" font-size="11" fill="#333">x</text>
  <rect x="364" y="174" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="379" y="190" text-anchor="middle" font-size="11" fill="#333">y</text>
  <text x="390" y="190" font-size="10" fill="#888">s1</text>
  <rect x="330" y="202" width="30" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="218" text-anchor="middle" font-size="11" fill="#b85450">y</text>
  <rect x="364" y="202" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="379" y="218" text-anchor="middle" font-size="11" fill="#d6a040">x</text>
  <text x="390" y="218" font-size="10" fill="#888">s2</text>

  <path d="M 415 214 L 445 214" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="455" y="174" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="190" text-anchor="middle" font-size="11" fill="#333">y</text>
  <rect x="489" y="174" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="504" y="190" text-anchor="middle" font-size="11" fill="#333">y</text>
  <rect x="455" y="202" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="218" text-anchor="middle" font-size="11" fill="#d6a040">x</text>
  <rect x="489" y="202" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="504" y="218" text-anchor="middle" font-size="11" fill="#d6a040">x</text>
  <text x="410" y="236" font-size="9" fill="#888">第1次交换后→两个yx型</text>
  <text x="410" y="248" font-size="9" fill="#888">再用策略①的变体1次→共2次</text>

  <!-- Formula box -->
  <rect x="60" y="278" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">设 xy 型 = a 个，yx 型 = b 个</text>
  <text x="280" y="310" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">答案 = a÷2 + b÷2 + 2×(a%2)，若 (a+b) 为奇数则 −1</text>

  <!-- Parity check -->
  <rect x="80" y="338" width="400" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⚠️ 每次交换恰好修复 2 个失配 → 总失配数必须为偶数</text>
</svg>
