<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：定长滑窗 + 频率表累加查询</text>

  <!-- Step 1: init -->
  <rect x="150" y="44" width="220" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 统计首个窗口 freq</text>
  <text x="260" y="79" text-anchor="middle" font-size="10" fill="#666">for i in [0,k): freq[nums[i]+50]++</text>
  <path d="M 260 90 L 260 104" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop j -->
  <rect x="120" y="108" width="280" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="128" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 遍历每个窗口 j = 0 … n-k</text>
  <text x="260" y="143" text-anchor="middle" font-size="10" fill="#666">j&gt;0 时滑动：freq[nums[j-1]+50]-- ; freq[nums[j+k-1]+50]++</text>
  <path d="M 260 152 L 260 166" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: query x-th -->
  <rect x="100" y="170" width="320" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="190" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 从 v=-50 向右累加 cnt</text>
  <text x="260" y="206" text-anchor="middle" font-size="11" fill="#555">cnt += freq[v+50]</text>
  <text x="260" y="221" text-anchor="middle" font-size="11" fill="#b85450">首达 cnt ≥ x → 记 val = v，break</text>
  <path d="M 260 228 L 260 242" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: decision -->
  <path d="M 260 242 L 360 270 L 260 298 L 160 270 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="266" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">val &lt; 0 ?</text>
  <text x="260" y="280" text-anchor="middle" font-size="10" fill="#666">第 x 小是否为负</text>

  <!-- yes branch -->
  <text x="92" y="266" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <path d="M 160 270 L 80 270 L 80 296" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="298" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="80" y="316" text-anchor="middle" font-size="11" fill="#333">ans[j] = val</text>
  <text x="80" y="330" text-anchor="middle" font-size="10" fill="#888">美丽值即该负数</text>

  <!-- no branch -->
  <text x="392" y="266" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <path d="M 360 270 L 440 270 L 440 296" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="380" y="298" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="316" text-anchor="middle" font-size="11" fill="#333">ans[j] = 0</text>
  <text x="440" y="330" text-anchor="middle" font-size="10" fill="#888">第 x 小非负</text>

  <!-- loop back arrow -->
  <path d="M 440 338 Q 480 355 360 355 Q 260 360 200 130" stroke="#999" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="358" text-anchor="middle" font-size="10" fill="#888">j++，回到②处理下一窗口</text>
</svg>
