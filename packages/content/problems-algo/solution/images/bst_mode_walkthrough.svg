<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：root = [1,null,2,2]（示例 1）</text>

  <!-- 左：原 BST -->
  <text x="40" y="56" font-size="12" fill="#888">原 BST：</text>

  <line x1="155" y1="100" x2="200" y2="150" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="190" y1="172" x2="150" y2="222" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="150" cy="86" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="90" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <circle cx="205" cy="158" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="205" y="162" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <circle cx="145" cy="232" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="145" y="236" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <text x="178" y="78" font-size="10" fill="#b85450" font-weight="bold">①</text>
  <text x="172" y="226" font-size="10" fill="#b85450" font-weight="bold">②</text>
  <text x="232" y="150" font-size="10" fill="#b85450" font-weight="bold">③</text>

  <text x="40" y="272" font-size="11" fill="#888">中序访问顺序：1 → 2 → 2</text>

  <!-- 右：逐步演变 -->
  <text x="290" y="56" font-size="12" fill="#888">逐步演变（prev, count, maxCount, ans）：</text>

  <!-- ① 访问 1 -->
  <text x="290" y="84" font-size="11" fill="#446688" font-weight="bold">① 访问 1：val≠prev(−∞) → count=1</text>
  <rect x="290" y="90" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="106" text-anchor="middle" font-size="10" fill="#333">1</text>
  <path d="M 324 102 L 348 102" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="336" y="96" font-size="9" fill="#888">1&gt;0</text>
  <rect x="352" y="90" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="412" y="106" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">max=1, ans=[1]</text>

  <!-- ② 访问 2 (first) -->
  <text x="290" y="132" font-size="11" fill="#d6a040" font-weight="bold">② 访问 2：val≠prev(1) → count=1</text>
  <rect x="290" y="138" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="154" text-anchor="middle" font-size="10" fill="#333">2</text>
  <path d="M 324 150 L 348 150" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="336" y="144" font-size="9" fill="#888">1==1</text>
  <rect x="352" y="138" width="130" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="417" y="154" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">max=1, ans=[1,2]</text>

  <!-- ③ 访问 2 (second) -->
  <text x="290" y="180" font-size="11" fill="#b85450" font-weight="bold">③ 访问 2：val==prev(2) → count=2</text>
  <rect x="290" y="186" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="307" y="202" text-anchor="middle" font-size="10" fill="#333">2</text>
  <path d="M 324 198 L 348 198" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="336" y="192" font-size="9" fill="#888">2&gt;1</text>
  <rect x="352" y="186" width="150" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="427" y="202" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">max=2, ans=[2] ←重置</text>

  <!-- 状态变量表 -->
  <text x="290" y="232" font-size="12" fill="#888">状态变量变化：</text>

  <!-- 表头 -->
  <rect x="290" y="240" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="320" y="256" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">prev</text>
  <rect x="350" y="240" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="380" y="256" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">count</text>
  <rect x="410" y="240" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="445" y="256" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">maxCount</text>
  <rect x="480" y="240" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="515" y="256" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">ans</text>

  <!-- 行① -->
  <rect x="290" y="262" width="60" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="276" text-anchor="middle" font-size="9" fill="#555">1</text>
  <rect x="350" y="262" width="60" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="380" y="276" text-anchor="middle" font-size="9" fill="#555">1</text>
  <rect x="410" y="262" width="70" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="445" y="276" text-anchor="middle" font-size="9" fill="#555">1</text>
  <rect x="480" y="262" width="70" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="515" y="276" text-anchor="middle" font-size="9" fill="#555">[1]</text>

  <!-- 行② -->
  <rect x="290" y="282" width="60" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="296" text-anchor="middle" font-size="9" fill="#555">2</text>
  <rect x="350" y="282" width="60" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="380" y="296" text-anchor="middle" font-size="9" fill="#555">1</text>
  <rect x="410" y="282" width="70" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="445" y="296" text-anchor="middle" font-size="9" fill="#555">1</text>
  <rect x="480" y="282" width="70" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="515" y="296" text-anchor="middle" font-size="9" fill="#555">[1,2]</text>

  <!-- 行③ -->
  <rect x="290" y="302" width="60" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="320" y="316" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2</text>
  <rect x="350" y="302" width="60" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="380" y="316" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2</text>
  <rect x="410" y="302" width="70" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="445" y="316" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2</text>
  <rect x="480" y="302" width="70" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="515" y="316" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">[2]</text>

  <!-- 结果标注 -->
  <text x="290" y="346" font-size="12" fill="#b85450" font-weight="bold">输出 [2] ✓</text>

  <!-- 说明框 -->
  <rect x="40" y="360" width="500" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="382" font-size="11" fill="#333" font-weight="bold">关键：count 达到新最大时清空 ans，相等时追加——一次遍历即得全部众数</text>
  <text x="60" y="400" font-size="11" fill="#555">② 处 count==maxCount ⇒ 追加；③ 处 count&gt;maxCount ⇒ 重置 ans=[2]，旧答案 [1,2] 被淘汰</text>
  <text x="60" y="416" font-size="11" fill="#4a7a3a" font-weight="bold">最终 maxCount=2，众数集=[2]，返回 [2]</text>
</svg>
