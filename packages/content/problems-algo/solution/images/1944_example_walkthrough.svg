<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：heights = [10,6,8,5,11,9]</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">从右向左扫描，栈存下标（高度递减），逐步累计 answer</text>

  <!-- ===== Header row ===== -->
  <rect x="24" y="58" width="592" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <g font-size="11" fill="#446688" font-weight="bold">
    <text x="40" y="75">步</text>
    <text x="80" y="75">i</text>
    <text x="120" y="75">h[i]</text>
    <text x="200" y="75">动作</text>
    <text x="380" y="75">栈（后）底→顶</text>
    <text x="560" y="75">answer[i]</text>
  </g>

  <!-- ===== Row 1: i=5 ===== -->
  <rect x="24" y="88" width="592" height="50" rx="3" fill="#fff" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <g font-size="10" fill="#333">
    <text x="40" y="116" font-weight="bold" fill="#b85450">1</text>
    <text x="80" y="116" font-weight="bold">5</text>
    <text x="120" y="116" font-weight="bold">9</text>
    <text x="200" y="110">栈空，cnt=0</text>
    <text x="200" y="124" fill="#446688">push 5</text>
    <text x="380" y="116" font-family="monospace" fill="#d6a040">[5(9)]</text>
    <text x="560" y="116" fill="#4a7a3a" font-weight="bold">0</text>
  </g>

  <!-- ===== Row 2: i=4 ===== -->
  <rect x="24" y="142" width="592" height="50" rx="3" fill="#fff" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <g font-size="10" fill="#333">
    <text x="40" y="170" font-weight="bold" fill="#b85450">2</text>
    <text x="80" y="170" font-weight="bold">4</text>
    <text x="120" y="170" font-weight="bold">11</text>
    <text x="200" y="164">9&lt;11 弹5 → cnt=1</text>
    <text x="200" y="178" fill="#446688">栈空，不+1；push 4</text>
    <text x="380" y="170" font-family="monospace" fill="#d6a040">[4(11)]</text>
    <text x="560" y="170" fill="#4a7a3a" font-weight="bold">1</text>
  </g>

  <!-- ===== Row 3: i=3 ===== -->
  <rect x="24" y="196" width="592" height="50" rx="3" fill="#fff" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <g font-size="10" fill="#333">
    <text x="40" y="224" font-weight="bold" fill="#b85450">3</text>
    <text x="80" y="224" font-weight="bold">3</text>
    <text x="120" y="224" font-weight="bold">5</text>
    <text x="200" y="218">11&gt;5 不弹</text>
    <text x="200" y="232" fill="#d6a040">栈非空 → cnt=1；push 3</text>
    <text x="380" y="224" font-family="monospace" fill="#d6a040">[4(11), 3(5)]</text>
    <text x="560" y="224" fill="#4a7a3a" font-weight="bold">1</text>
  </g>

  <!-- ===== Row 4: i=2 ===== -->
  <rect x="24" y="250" width="592" height="50" rx="3" fill="#fff" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <g font-size="10" fill="#333">
    <text x="40" y="278" font-weight="bold" fill="#b85450">4</text>
    <text x="80" y="278" font-weight="bold">2</text>
    <text x="120" y="278" font-weight="bold">8</text>
    <text x="200" y="272">5&lt;8 弹3 → cnt=1</text>
    <text x="200" y="286" fill="#d6a040">11&gt;8 止，+1 → cnt=2；push 2</text>
    <text x="380" y="278" font-family="monospace" fill="#d6a040">[4(11), 2(8)]</text>
    <text x="560" y="278" fill="#4a7a3a" font-weight="bold">2</text>
  </g>

  <!-- ===== Row 5: i=1 ===== -->
  <rect x="24" y="304" width="592" height="50" rx="3" fill="#fff" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <g font-size="10" fill="#333">
    <text x="40" y="332" font-weight="bold" fill="#b85450">5</text>
    <text x="80" y="332" font-weight="bold">1</text>
    <text x="120" y="332" font-weight="bold">6</text>
    <text x="200" y="326">8&gt;6 不弹</text>
    <text x="200" y="340" fill="#d6a040">栈非空 → cnt=1；push 1</text>
    <text x="380" y="332" font-family="monospace" fill="#d6a040">[4(11), 2(8), 1(6)]</text>
    <text x="560" y="332" fill="#4a7a3a" font-weight="bold">1</text>
  </g>

  <!-- ===== Row 6: i=0 ===== -->
  <rect x="24" y="358" width="592" height="58" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <g font-size="10" fill="#333">
    <text x="40" y="390" font-weight="bold" fill="#b85450">6</text>
    <text x="80" y="390" font-weight="bold">0</text>
    <text x="120" y="390" font-weight="bold">10</text>
    <text x="200" y="382">6&lt;10 弹1 → cnt=1</text>
    <text x="200" y="396">8&lt;10 弹2 → cnt=2</text>
    <text x="200" y="410" fill="#d6a040">11&gt;10 止，+1 → cnt=3；push 0</text>
    <text x="380" y="390" font-family="monospace" fill="#d6a040">[4(11), 0(10)]</text>
    <text x="560" y="390" fill="#4a7a3a" font-weight="bold">3</text>
  </g>

  <!-- ===== Final answer ===== -->
  <rect x="24" y="428" width="592" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="450" font-size="12" fill="#4a7a3a" font-weight="bold">最终 answer =</text>
  <g font-size="12" font-family="monospace">
    <text x="160" y="450" fill="#4a7a3a" font-weight="bold">[3, 1, 2, 1, 1, 0]</text>
  </g>
  <text x="320" y="450" font-size="10" fill="#555">每个下标入栈 1 次、出栈 1 次 → 总操作 O(n)</text>
</svg>
