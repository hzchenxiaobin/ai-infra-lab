<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：j − i = 2 ⇒ 只能同奇偶交换，位置分成两条轨道</text>
  <text x="310" y="48" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">以 s1 = "abcd" 为例：偶数位 {0,2} 一组，奇数位 {1,3} 一组，字符永不出轨</text>

  <!-- allowed swap arcs -->
  <path d="M 210 102 Q 310 56 410 102" fill="none" stroke="#446688" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <path d="M 410 66 Q 310 30 210 66" fill="none" stroke="#446688" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="310" y="62" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">swap(0,2) ✓ j−i=2</text>

  <!-- string cells -->
  <rect x="170" y="110" width="80" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="210" y="143" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">a</text>
  <rect x="270" y="110" width="80" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="310" y="143" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">b</text>
  <rect x="370" y="110" width="80" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="410" y="143" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">c</text>
  <rect x="470" y="110" width="80" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="510" y="143" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">d</text>

  <!-- index labels -->
  <text x="210" y="184" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">0</text>
  <text x="310" y="184" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="410" y="184" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <text x="510" y="184" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3</text>

  <!-- allowed swap arc for odd group below -->
  <path d="M 310 196 Q 410 236 510 196" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="410" y="234" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">swap(1,3) ✓ j−i=2</text>

  <!-- forbidden adjacent swaps -->
  <path d="M 252 137 L 268 137" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 250 128 L 266 146 M 266 128 L 250 146" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 352 137 L 368 137" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 350 128 L 366 146 M 366 128 L 350 146" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="270" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗ 相邻位 j−i=1（以及 j−i=3 等）都不许换：奇偶之间有一堵墙</text>

  <!-- orbit group boxes -->
  <rect x="60" y="290" width="240" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="180" y="309" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">偶数位轨道 {0, 2}：{a, c}</text>
  <text x="180" y="328" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">组内两个字符顺序任意</text>

  <rect x="320" y="290" width="240" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="440" y="309" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">奇数位轨道 {1, 3}：{b, d}</text>
  <text x="440" y="328" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">组内两个字符顺序任意</text>

  <text x="310" y="360" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">两条轨道各自翻转，组合出 2 × 2 = 4 个可达状态</text>
</svg>
