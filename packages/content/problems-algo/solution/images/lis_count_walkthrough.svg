<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>

  <rect width="760" height="460" fill="#fdfcf7"/>

  <text x="380" y="32" text-anchor="middle" font-size="18" fill="#2b2b2b" font-weight="bold">示例演算：nums = [1, 3, 5, 4, 7]</text>
  <path d="M 240 42 Q 380 50 520 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="380" y="56" text-anchor="middle" font-size="11" fill="#888">逐步填写 length[] 与 count[]，关注 i=4 时两条规则的协作</text>

  <!-- 表头 -->
  <g filter="url(#sk)">
    <rect x="30" y="72" width="46" height="26" fill="#f0ede4" stroke="#9e9e9e" stroke-width="1.2"/>
    <rect x="76" y="72" width="56" height="26" fill="#f0ede4" stroke="#9e9e9e" stroke-width="1.2"/>
    <rect x="132" y="72" width="64" height="26" fill="#f0ede4" stroke="#9e9e9e" stroke-width="1.2"/>
    <rect x="196" y="72" width="64" height="26" fill="#f0ede4" stroke="#9e9e9e" stroke-width="1.2"/>
    <rect x="260" y="72" width="470" height="26" fill="#f0ede4" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>
  <text x="53" y="89" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">i</text>
  <text x="104" y="89" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">x</text>
  <text x="164" y="89" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">length</text>
  <text x="228" y="89" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">count</text>
  <text x="495" y="89" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">转移细节</text>

  <!-- 行 i=0 -->
  <g filter="url(#sk)"><rect x="30" y="98" width="46" height="26" fill="#fffdf3" stroke="#e2dccd"/><rect x="76" y="98" width="56" height="26" fill="#e8f0fa" stroke="#cdd9e6"/><rect x="132" y="98" width="64" height="26" fill="#fffdf3" stroke="#e2dccd"/><rect x="196" y="98" width="64" height="26" fill="#fffdf3" stroke="#e2dccd"/><rect x="260" y="98" width="470" height="26" fill="#fffdf3" stroke="#e2dccd"/></g>
  <text x="53" y="115" text-anchor="middle" font-size="11" fill="#444">0</text>
  <text x="104" y="115" text-anchor="middle" font-size="11" fill="#4a8edb" font-weight="bold">1</text>
  <text x="164" y="115" text-anchor="middle" font-size="11" fill="#2b2b2b">1</text>
  <text x="228" y="115" text-anchor="middle" font-size="11" fill="#2b2b2b">1</text>
  <text x="276" y="115" font-size="11" fill="#888">初始化：自身长度 1，条数 1</text>

  <!-- 行 i=1 -->
  <g filter="url(#sk)"><rect x="30" y="124" width="46" height="26" fill="#fffdf3" stroke="#e2dccd"/><rect x="76" y="124" width="56" height="26" fill="#e8f0fa" stroke="#cdd9e6"/><rect x="132" y="124" width="64" height="26" fill="#eaf6ee" stroke="#cdddc4"/><rect x="196" y="124" width="64" height="26" fill="#eaf6ee" stroke="#cdddc4"/><rect x="260" y="124" width="470" height="26" fill="#fffdf3" stroke="#e2dccd"/></g>
  <text x="53" y="141" text-anchor="middle" font-size="11" fill="#444">1</text>
  <text x="104" y="141" text-anchor="middle" font-size="11" fill="#4a8edb" font-weight="bold">3</text>
  <text x="164" y="141" text-anchor="middle" font-size="11" fill="#4a8e4a" font-weight="bold">2</text>
  <text x="228" y="141" text-anchor="middle" font-size="11" fill="#4a8e4a" font-weight="bold">1</text>
  <text x="276" y="141" font-size="11" fill="#444">j=0 (1&lt;3)：1+1=2 &gt; 1 → length=2, count=count[0]=1</text>

  <!-- 行 i=2 -->
  <g filter="url(#sk)"><rect x="30" y="150" width="46" height="26" fill="#fffdf3" stroke="#e2dccd"/><rect x="76" y="150" width="56" height="26" fill="#e8f0fa" stroke="#cdd9e6"/><rect x="132" y="150" width="64" height="26" fill="#eaf6ee" stroke="#cdddc4"/><rect x="196" y="150" width="64" height="26" fill="#eaf6ee" stroke="#cdddc4"/><rect x="260" y="150" width="470" height="26" fill="#fffdf3" stroke="#e2dccd"/></g>
  <text x="53" y="167" text-anchor="middle" font-size="11" fill="#444">2</text>
  <text x="104" y="167" text-anchor="middle" font-size="11" fill="#4a8edb" font-weight="bold">5</text>
  <text x="164" y="167" text-anchor="middle" font-size="11" fill="#4a8e4a" font-weight="bold">3</text>
  <text x="228" y="167" text-anchor="middle" font-size="11" fill="#4a8e4a" font-weight="bold">1</text>
  <text x="276" y="167" font-size="11" fill="#444">j=0→len=2,cnt=1；j=1 (3&lt;5)：2+1=3 &gt; 2 → length=3, count=1</text>

  <!-- 行 i=3 -->
  <g filter="url(#sk)"><rect x="30" y="176" width="46" height="26" fill="#fffdf3" stroke="#e2dccd"/><rect x="76" y="176" width="56" height="26" fill="#e8f0fa" stroke="#cdd9e6"/><rect x="132" y="176" width="64" height="26" fill="#eaf6ee" stroke="#cdddc4"/><rect x="196" y="176" width="64" height="26" fill="#eaf6ee" stroke="#cdddc4"/><rect x="260" y="176" width="470" height="26" fill="#fffdf3" stroke="#e2dccd"/></g>
  <text x="53" y="193" text-anchor="middle" font-size="11" fill="#444">3</text>
  <text x="104" y="193" text-anchor="middle" font-size="11" fill="#4a8edb" font-weight="bold">4</text>
  <text x="164" y="193" text-anchor="middle" font-size="11" fill="#4a8e4a" font-weight="bold">3</text>
  <text x="228" y="193" text-anchor="middle" font-size="11" fill="#4a8e4a" font-weight="bold">1</text>
  <text x="276" y="193" font-size="11" fill="#444">j=0→len=2；j=1 (3&lt;4)：2+1=3 &gt; 2 → length=3, count=1；j=2 跳过</text>

  <!-- 行 i=4 重点 -->
  <g filter="url(#sk)"><rect x="30" y="202" width="46" height="26" fill="#fef6e6" stroke="#c98a2b"/><rect x="76" y="202" width="56" height="26" fill="#e8f0fa" stroke="#cdd9e6"/><rect x="132" y="202" width="64" height="26" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/><rect x="196" y="202" width="64" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/><rect x="260" y="202" width="470" height="26" fill="#fffdf3" stroke="#e2dccd"/></g>
  <text x="53" y="219" text-anchor="middle" font-size="11" fill="#c98a2b" font-weight="bold">4</text>
  <text x="104" y="219" text-anchor="middle" font-size="11" fill="#4a8edb" font-weight="bold">7</text>
  <text x="164" y="219" text-anchor="middle" font-size="12" fill="#c98a2b" font-weight="bold">4</text>
  <text x="228" y="219" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="276" y="219" font-size="10" fill="#444">j=0→2; j=1→3; j=2 (5&lt;7): 3+1=4&gt;3→规则一 length=4,cnt=1</text>

  <!-- i=4 续行说明 -->
  <g filter="url(#sk)"><rect x="260" y="228" width="470" height="24" fill="#fce4ec" stroke="#b85450" stroke-dasharray="4,3"/></g>
  <text x="276" y="244" font-size="10" fill="#b85450" font-weight="bold">j=3 (4&lt;7)：3+1=4 == 4 → 规则二 count += count[3] = 1+1 = 2</text>

  <!-- 汇总 -->
  <g filter="url(#sk)">
    <rect x="30" y="270" width="700" height="78" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5,3"/>
  </g>
  <text x="50" y="292" font-size="12" fill="#2b2b2b" font-weight="bold">最终状态：</text>
  <text x="50" y="312" font-size="11" fill="#444">length = [1, 2, 3, 3, 4]　count = [1, 1, 1, 1, 2]</text>
  <text x="50" y="330" font-size="11" fill="#4a8e4a">maxLen = max(length) = 4</text>
  <text x="50" y="346" font-size="11" fill="#b85450" font-weight="bold">ans = Σ count[i] | length[i]==4 = count[4] = 2 ✓</text>

  <!-- 两条 LIS -->
  <g filter="url(#sk)">
    <rect x="30" y="362" width="700" height="80" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" stroke-dasharray="5,3"/>
  </g>
  <text x="50" y="384" font-size="12" fill="#4a8edb" font-weight="bold">两条最长递增子序列（length=4）：</text>
  <text x="50" y="406" font-size="12" fill="#2b2b2b">① 1 → 3 → 5 → 7　（经 j=0,1,2 接到 7）</text>
  <text x="50" y="426" font-size="12" fill="#2b2b2b">② 1 → 3 → 4 → 7　（经 j=0,1,3 接到 7）</text>
  <text x="430" y="416" font-size="11" fill="#888">两者都以 length=3 的前驱接到 7</text>
  <text x="430" y="432" font-size="11" fill="#888">故 count[4] = count[2] + count[3] = 2</text>

  <text x="380" y="452" text-anchor="middle" font-size="11" fill="#888">时间 O(n²)，空间 O(n)　关键：等长前驱累加、更长前驱重置</text>
</svg>
