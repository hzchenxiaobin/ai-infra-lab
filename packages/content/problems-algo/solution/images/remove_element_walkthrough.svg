<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [0,1,2,2,3,0,4,2]，val = 2</text>

  <!-- Initial array -->
  <text x="40" y="52" font-size="11" fill="#888">初始:</text>
  <text x="100" y="52" font-size="10" fill="#888" font-weight="bold">下标 0   1   2   3   4   5   6   7</text>

  <!-- initial cells -->
  <rect x="100" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="144" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="166" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="188" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="232" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="276" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="320" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="364" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="386" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="408" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <text x="470" y="80" font-size="11" fill="#888">slow = fast = 0</text>

  <!-- Table header -->
  <text x="40" y="118" font-size="12" fill="#444" font-weight="bold">步骤</text>
  <text x="95" y="118" font-size="12" fill="#444" font-weight="bold">fast</text>
  <text x="150" y="118" font-size="12" fill="#444" font-weight="bold">值</text>
  <text x="230" y="118" font-size="12" fill="#444" font-weight="bold">判定</text>
  <text x="330" y="118" font-size="12" fill="#444" font-weight="bold">动作</text>
  <text x="460" y="118" font-size="12" fill="#444" font-weight="bold">slow</text>

  <line x1="30" y1="124" x2="540" y2="124" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 1: fast=0, 0≠2, write, slow=1 -->
  <text x="40" y="142" font-size="11" fill="#333">1</text>
  <text x="95" y="142" font-size="11" fill="#333">0</text>
  <text x="150" y="142" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="230" y="142" font-size="11" fill="#82b366">0 ≠ 2</text>
  <text x="330" y="142" font-size="11" fill="#4a7a3a">写入(原位), slow→1</text>
  <text x="460" y="142" font-size="11" fill="#333" font-weight="bold">1</text>

  <!-- Step 2: fast=1, 1≠2, write, slow=2 -->
  <text x="40" y="162" font-size="11" fill="#333">2</text>
  <text x="95" y="162" font-size="11" fill="#333">1</text>
  <text x="150" y="162" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="230" y="162" font-size="11" fill="#82b366">1 ≠ 2</text>
  <text x="330" y="162" font-size="11" fill="#4a7a3a">写入(原位), slow→2</text>
  <text x="460" y="162" font-size="11" fill="#333" font-weight="bold">2</text>

  <!-- Step 3: fast=2, 2==2, skip, slow=2 -->
  <text x="40" y="182" font-size="11" fill="#333">3</text>
  <text x="95" y="182" font-size="11" fill="#333">2</text>
  <text x="150" y="182" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="230" y="182" font-size="11" fill="#b85450">2 = 2</text>
  <text x="330" y="182" font-size="11" fill="#b85450">跳过</text>
  <text x="460" y="182" font-size="11" fill="#333" font-weight="bold">2</text>

  <!-- Step 4: fast=3, 2==2, skip, slow=2 -->
  <text x="40" y="202" font-size="11" fill="#333">4</text>
  <text x="95" y="202" font-size="11" fill="#333">3</text>
  <text x="150" y="202" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="230" y="202" font-size="11" fill="#b85450">2 = 2</text>
  <text x="330" y="202" font-size="11" fill="#b85450">跳过</text>
  <text x="460" y="202" font-size="11" fill="#333" font-weight="bold">2</text>

  <!-- Step 5: fast=4, 3≠2, write, slow=3 -->
  <text x="40" y="222" font-size="11" fill="#333">5</text>
  <text x="95" y="222" font-size="11" fill="#333">4</text>
  <text x="150" y="222" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="230" y="222" font-size="11" fill="#82b366">3 ≠ 2</text>
  <text x="330" y="222" font-size="11" fill="#4a7a3a">写入 nums[2]=3, slow→3</text>
  <text x="460" y="222" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- Step 6: fast=5, 0≠2, write, slow=4 -->
  <text x="40" y="242" font-size="11" fill="#333">6</text>
  <text x="95" y="242" font-size="11" fill="#333">5</text>
  <text x="150" y="242" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="230" y="242" font-size="11" fill="#82b366">0 ≠ 2</text>
  <text x="330" y="242" font-size="11" fill="#4a7a3a">写入 nums[3]=0, slow→4</text>
  <text x="460" y="242" font-size="11" fill="#333" font-weight="bold">4</text>

  <!-- Step 7: fast=6, 4≠2, write, slow=5 -->
  <text x="40" y="262" font-size="11" fill="#333">7</text>
  <text x="95" y="262" font-size="11" fill="#333">6</text>
  <text x="150" y="262" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="230" y="262" font-size="11" fill="#82b366">4 ≠ 2</text>
  <text x="330" y="262" font-size="11" fill="#4a7a3a">写入 nums[4]=4, slow→5</text>
  <text x="460" y="262" font-size="11" fill="#333" font-weight="bold">5</text>

  <!-- Step 8: fast=7, 2==2, skip, slow=5 -->
  <text x="40" y="282" font-size="11" fill="#333">8</text>
  <text x="95" y="282" font-size="11" fill="#333">7</text>
  <text x="150" y="282" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="230" y="282" font-size="11" fill="#b85450">2 = 2</text>
  <text x="330" y="282" font-size="11" fill="#b85450">跳过</text>
  <text x="460" y="282" font-size="11" fill="#333" font-weight="bold">5 ⭐</text>

  <!-- Array state after processing -->
  <text x="40" y="316" font-size="12" fill="#888">最终数组:</text>

  <!-- final array cells: [0, 1, 3, 0, 4, _, _, _] -->
  <rect x="100" y="326" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="348" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="144" y="326" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="166" y="348" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="188" y="326" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="348" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="232" y="326" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="348" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="276" y="326" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="348" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="320" y="326" width="44" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="342" y="348" text-anchor="middle" font-size="14" fill="#999">_</text>
  <rect x="364" y="326" width="44" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="386" y="348" text-anchor="middle" font-size="14" fill="#999">_</text>
  <rect x="408" y="326" width="44" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="430" y="348" text-anchor="middle" font-size="14" fill="#999">_</text>

  <!-- bracket showing k=5 -->
  <path d="M 100 368 Q 100 376 106 376 L 294 376 Q 300 376 300 368" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="200" y="392" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">前 slow = 5 个元素为结果</text>

  <!-- result box -->
  <rect x="60" y="406" width="460" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="426" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">答案 = 5，结果 = [0, 1, 3, 0, 4]</text>
  <text x="290" y="442" text-anchor="middle" font-size="11" fill="#888">3 个 2 被跳过，保留值依次覆写到 slow 位置（保持相对顺序）</text>
</svg>
