<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：示例 2 的 4 个查询</text>

  <!-- ============ 左：示例 2 的树 ============ -->
  <!-- 树边 -->
  <g stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" stroke-linecap="round">
    <line x1="155" y1="78" x2="110" y2="132"/>
    <line x1="155" y1="78" x2="200" y2="132"/>
    <line x1="110" y1="132" x2="80" y2="186"/>
    <line x1="110" y1="132" x2="140" y2="186"/>
    <line x1="200" y1="132" x2="170" y2="186"/>
    <line x1="200" y1="132" x2="230" y2="186"/>
    <line x1="80" y1="186" x2="62" y2="240"/>
    <line x1="80" y1="186" x2="100" y2="240"/>
  </g>

  <!-- 节点 -->
  <circle cx="155" cy="78" r="16" fill="#fff8e1" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="155" y="83" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <circle cx="110" cy="132" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="110" y="137" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <circle cx="200" cy="132" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="200" y="137" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>

  <circle cx="80" cy="186" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="191" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="140" cy="186" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="191" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="170" cy="186" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="191" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="230" cy="186" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="191" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>

  <circle cx="62" cy="240" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="62" y="245" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <circle cx="100" cy="240" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="100" y="245" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>

  <!-- depth 标注 -->
  <text x="178" y="74" font-size="9" fill="#888" filter="url(#rough2)">d0</text>
  <text x="248" y="132" font-size="9" fill="#888" filter="url(#rough2)">d1</text>
  <text x="248" y="186" font-size="9" fill="#888" filter="url(#rough2)">d2</text>
  <text x="118" y="258" font-size="9" fill="#888" filter="url(#rough2)">d3</text>

  <text x="155" y="295" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">原树高度 H = 3</text>
  <text x="155" y="312" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">(5→8→2→4/6)</text>

  <!-- ============ 右：查询表 ============ -->
  <!-- 表格外框 -->
  <rect x="305" y="60" width="240" height="225" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- 表头 -->
  <rect x="305" y="60" width="240" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="78" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">查询 u</text>
  <text x="430" y="78" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">脊柱外最深叶子</text>
  <text x="520" y="78" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">ans</text>

  <!-- 行分隔 -->
  <g stroke="#cccccc" stroke-width="1" filter="url(#rough2)">
    <line x1="305" y1="123" x2="545" y2="123"/>
    <line x1="305" y1="166" x2="545" y2="166"/>
    <line x1="305" y1="209" x2="545" y2="209"/>
    <line x1="388" y1="88" x2="388" y2="285"/>
    <line x1="478" y1="88" x2="478" y2="285"/>
  </g>

  <!-- 行 1: 查询 3 -->
  <text x="340" y="142" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="430" y="142" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">4 (深 3)</text>
  <text x="520" y="142" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- 行 2: 查询 2 -->
  <text x="340" y="185" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="430" y="185" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1,3,7 (深 2)</text>
  <text x="520" y="185" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- 行 3: 查询 4 -->
  <text x="340" y="228" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="430" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">6 (深 3)</text>
  <text x="520" y="228" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- 行 4: 查询 8 -->
  <text x="340" y="271" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">8</text>
  <text x="430" y="271" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3,7 (深 2)</text>
  <text x="520" y="271" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- 说明 -->
  <text x="425" y="310" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">每行：移除子树(u) 后</text>
  <text x="425" y="326" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">最深叶子深度 = ans[u]</text>
  <text x="425" y="350" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">输出：[3, 2, 3, 2] ✓</text>
</svg>
