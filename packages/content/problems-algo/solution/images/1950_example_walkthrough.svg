<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="520" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：arr = [10, 20, 50, 15, 5, 25, 30]</text>

  <!-- array cells -->
  <g font-size="13">
    <rect x="60" y="46" width="64" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="92" y="68" text-anchor="middle" fill="#333" filter="url(#rough2)">10</text>
    <rect x="128" y="46" width="64" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="160" y="68" text-anchor="middle" fill="#333" filter="url(#rough2)">20</text>
    <rect x="196" y="46" width="64" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="228" y="68" text-anchor="middle" fill="#333" filter="url(#rough2)">50</text>
    <rect x="264" y="46" width="64" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="296" y="68" text-anchor="middle" fill="#333" filter="url(#rough2)">15</text>
    <rect x="332" y="46" width="64" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="364" y="68" text-anchor="middle" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>
    <rect x="400" y="46" width="64" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="432" y="68" text-anchor="middle" fill="#333" filter="url(#rough2)">25</text>
    <rect x="468" y="46" width="64" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="500" y="68" text-anchor="middle" fill="#333" filter="url(#rough2)">30</text>
  </g>

  <!-- contribution table header -->
  <text x="40" y="104" font-size="12" fill="#666" font-weight="bold" filter="url(#rough2)">每个元素的最小窗口（left=左更小下标，right=右更小下标，w=right−left−1）</text>

  <!-- table -->
  <g font-size="11" font-family="monospace">
    <!-- header row -->
    <rect x="40" y="114" width="560" height="22" rx="3" fill="#446688" filter="url(#rough2)"/>
    <text x="60" y="129" fill="#fff" filter="url(#rough2)">idx</text>
    <text x="110" y="129" fill="#fff" filter="url(#rough2)">val</text>
    <text x="170" y="129" fill="#fff" filter="url(#rough2)">left</text>
    <text x="240" y="129" fill="#fff" filter="url(#rough2)">right</text>
    <text x="320" y="129" fill="#fff" filter="url(#rough2)">w</text>
    <text x="390" y="129" fill="#fff" filter="url(#rough2)">写入 len[w]</text>

    <!-- rows -->
    <rect x="40" y="136" width="560" height="20" rx="3" fill="#eef4ff" filter="url(#rough2)"/>
    <text x="60" y="150" fill="#333" filter="url(#rough2)">0</text><text x="110" y="150" fill="#333" filter="url(#rough2)">10</text><text x="170" y="150" fill="#4a7a3a" filter="url(#rough2)">−1</text><text x="240" y="150" fill="#b85450" filter="url(#rough2)">4</text><text x="320" y="150" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text><text x="390" y="150" fill="#555" filter="url(#rough2)">len[4]=10</text>

    <rect x="40" y="156" width="560" height="20" rx="3" fill="#fff" filter="url(#rough2)"/>
    <text x="60" y="170" fill="#333" filter="url(#rough2)">1</text><text x="110" y="170" fill="#333" filter="url(#rough2)">20</text><text x="170" y="170" fill="#4a7a3a" filter="url(#rough2)">0</text><text x="240" y="170" fill="#b85450" filter="url(#rough2)">3</text><text x="320" y="170" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text><text x="390" y="170" fill="#555" filter="url(#rough2)">len[2]=20</text>

    <rect x="40" y="176" width="560" height="20" rx="3" fill="#eef4ff" filter="url(#rough2)"/>
    <text x="60" y="190" fill="#333" filter="url(#rough2)">2</text><text x="110" y="190" fill="#333" filter="url(#rough2)">50</text><text x="170" y="190" fill="#4a7a3a" filter="url(#rough2)">1</text><text x="240" y="190" fill="#b85450" filter="url(#rough2)">3</text><text x="320" y="190" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text><text x="390" y="190" fill="#555" filter="url(#rough2)">len[1]=50</text>

    <rect x="40" y="196" width="560" height="20" rx="3" fill="#fff" filter="url(#rough2)"/>
    <text x="60" y="210" fill="#333" filter="url(#rough2)">3</text><text x="110" y="210" fill="#333" filter="url(#rough2)">15</text><text x="170" y="210" fill="#4a7a3a" filter="url(#rough2)">0</text><text x="240" y="210" fill="#b85450" filter="url(#rough2)">4</text><text x="320" y="210" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text><text x="390" y="210" fill="#555" filter="url(#rough2)">len[3]=15</text>

    <rect x="40" y="216" width="560" height="20" rx="3" fill="#fff8e1" filter="url(#rough2)"/>
    <text x="60" y="230" fill="#333" filter="url(#rough2)">4</text><text x="110" y="230" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text><text x="170" y="230" fill="#4a7a3a" filter="url(#rough2)">−1</text><text x="240" y="230" fill="#b85450" filter="url(#rough2)">7</text><text x="320" y="230" fill="#d6a040" font-weight="bold" filter="url(#rough2)">7</text><text x="390" y="230" fill="#555" filter="url(#rough2)">len[7]=5</text>

    <rect x="40" y="236" width="560" height="20" rx="3" fill="#fff" filter="url(#rough2)"/>
    <text x="60" y="250" fill="#333" filter="url(#rough2)">5</text><text x="110" y="250" fill="#333" filter="url(#rough2)">25</text><text x="170" y="250" fill="#4a7a3a" filter="url(#rough2)">4</text><text x="240" y="250" fill="#b85450" filter="url(#rough2)">7</text><text x="320" y="250" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text><text x="390" y="250" fill="#555" filter="url(#rough2)">len[2]=max(20,25)=25</text>

    <rect x="40" y="256" width="560" height="20" rx="3" fill="#eef4ff" filter="url(#rough2)"/>
    <text x="60" y="270" fill="#333" filter="url(#rough2)">6</text><text x="110" y="270" fill="#333" filter="url(#rough2)">30</text><text x="170" y="270" fill="#4a7a3a" filter="url(#rough2)">5</text><text x="240" y="270" fill="#b85450" filter="url(#rough2)">7</text><text x="320" y="270" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text><text x="390" y="270" fill="#555" filter="url(#rough2)">len[1]=max(50,30)=50</text>
  </g>

  <!-- len array -->
  <text x="40" y="302" font-size="12" fill="#666" font-weight="bold" filter="url(#rough2)">len[k]（k=1..7）映射到 res[k-1]，再反向传播：</text>
  <g font-size="12">
    <rect x="60" y="316" width="64" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="92" y="336" text-anchor="middle" fill="#333" filter="url(#rough2)">50</text>
    <rect x="128" y="316" width="64" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="160" y="336" text-anchor="middle" fill="#333" filter="url(#rough2)">25</text>
    <rect x="196" y="316" width="64" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="228" y="336" text-anchor="middle" fill="#333" filter="url(#rough2)">15</text>
    <rect x="264" y="316" width="64" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="296" y="336" text-anchor="middle" fill="#333" filter="url(#rough2)">10</text>
    <rect x="332" y="316" width="64" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="364" y="336" text-anchor="middle" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
    <rect x="400" y="316" width="64" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="432" y="336" text-anchor="middle" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
    <rect x="468" y="316" width="64" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="500" y="336" text-anchor="middle" fill="#333" filter="url(#rough2)">5</text>
  </g>
  <g font-size="9" fill="#888">
    <text x="92" y="358" text-anchor="middle" filter="url(#rough2)">k=1</text>
    <text x="160" y="358" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="228" y="358" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="296" y="358" text-anchor="middle" filter="url(#rough2)">4</text>
    <text x="364" y="358" text-anchor="middle" fill="#b85450" filter="url(#rough2)">5(空)</text>
    <text x="432" y="358" text-anchor="middle" fill="#b85450" filter="url(#rough2)">6(空)</text>
    <text x="500" y="358" text-anchor="middle" filter="url(#rough2)">7</text>
  </g>

  <!-- propagation arrow -->
  <path d="M 500 366 Q 460 392 432 366" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="300" y="388" font-size="11" fill="#b85450" filter="url(#rough2)">← 从右向左 max 传播：res[5]←5, res[4]←5，填掉两个 0</text>

  <!-- final res -->
  <text x="40" y="416" font-size="12" fill="#666" font-weight="bold" filter="url(#rough2)">最终答案 res（窗口大小 1→7 的最大最小值）：</text>
  <g font-size="13">
    <rect x="60" y="430" width="64" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="92" y="452" text-anchor="middle" fill="#d6a040" font-weight="bold" filter="url(#rough2)">50</text>
    <rect x="128" y="430" width="64" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="160" y="452" text-anchor="middle" fill="#d6a040" font-weight="bold" filter="url(#rough2)">25</text>
    <rect x="196" y="430" width="64" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="228" y="452" text-anchor="middle" fill="#d6a040" font-weight="bold" filter="url(#rough2)">15</text>
    <rect x="264" y="430" width="64" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="296" y="452" text-anchor="middle" fill="#d6a040" font-weight="bold" filter="url(#rough2)">10</text>
    <rect x="332" y="430" width="64" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="364" y="452" text-anchor="middle" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>
    <rect x="400" y="430" width="64" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="432" y="452" text-anchor="middle" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>
    <rect x="468" y="430" width="64" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="500" y="452" text-anchor="middle" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>
  </g>
  <text x="330" y="486" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">单调不增：大窗口最小值更小 → 向左扩散较大值填补空缺</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
</svg>
