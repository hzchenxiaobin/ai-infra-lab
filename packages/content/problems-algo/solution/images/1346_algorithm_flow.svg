<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="500" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：单趟遍历 + 哈希集合双向查找</text>

  <!-- Start -->
  <rect x="240" y="44" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="15" filter="url(#rough2)"/>
  <text x="300" y="64" text-anchor="middle" font-size="12" fill="#333">seen = ∅</text>

  <!-- arrow to loop -->
  <path d="M 300 74 L 300 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop entry -->
  <rect x="200" y="98" width="200" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="119" text-anchor="middle" font-size="12" fill="#333">取下一个 x ∈ arr</text>

  <!-- arrow to decision 1 -->
  <path d="M 300 130 L 300 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: 2x in seen? -->
  <polygon points="300,152 410,196 300,240 190,196" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="192" text-anchor="middle" font-size="11" fill="#333">2*x ∈ seen ?</text>
  <text x="300" y="208" text-anchor="middle" font-size="10" fill="#888">(x 当 M)</text>

  <!-- Yes 1 -> true -->
  <path d="M 410 196 L 452 196" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="190" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="454" y="180" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="509" y="201" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- No 1 -> decision 2 -->
  <path d="M 300 240 L 300 262" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="256" font-size="11" fill="#888">否</text>

  <!-- Decision 2: x even and x/2 in seen? -->
  <polygon points="300,264 415,308 300,352 185,308" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="304" text-anchor="middle" font-size="11" fill="#333">x 偶 且 x/2 ∈ seen ?</text>
  <text x="300" y="320" text-anchor="middle" font-size="10" fill="#888">(x 当 N)</text>

  <!-- Yes 2 -> true -->
  <path d="M 415 308 L 452 308" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="422" y="302" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="454" y="292" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="509" y="313" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- No 2 -> add -->
  <path d="M 300 352 L 300 374" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="368" font-size="11" fill="#888">否</text>

  <!-- add to seen -->
  <rect x="220" y="376" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="396" text-anchor="middle" font-size="12" fill="#333">seen.add(x)</text>

  <!-- loop back: from add box left side up to loop box left side -->
  <path d="M 220 391 L 120 391 L 120 114 L 200 114" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="70" y="250" font-size="11" fill="#888" transform="rotate(-90 70 250)">遍历下一个</text>

  <!-- after loop ends -> false -->
  <path d="M 300 406 L 300 430" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="424" font-size="11" fill="#888">遍历完</text>
  <rect x="240" y="432" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="453" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>

  <text x="300" y="482" text-anchor="middle" font-size="11" fill="#888">先查后存：保证查时 seen 中只有"之前"的元素，杜绝自配</text>
</svg>
