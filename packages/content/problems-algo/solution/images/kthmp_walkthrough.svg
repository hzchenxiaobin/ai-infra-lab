<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr=[2,3,4,7,11], k=5</text>

  <!-- Array shown at top, reused for each step -->
  <text x="20" y="58" font-size="11" fill="#888">数组：</text>
  <rect x="60" y="44" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="63" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="115" y="44" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="63" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="170" y="44" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="63" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="225" y="44" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="63" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="280" y="44" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="63" text-anchor="middle" font-size="12" fill="#333">11</text>
  <text x="85" y="84" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="140" y="84" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="195" y="84" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="250" y="84" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="305" y="84" text-anchor="middle" font-size="9" fill="#aaa">4</text>

  <!-- ===== Step 1 ===== -->
  <text x="20" y="114" font-size="11" fill="#446688" font-weight="bold">第1轮</text>
  <!-- left/right/mid markers -->
  <text x="85" y="104" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">L</text>
  <text x="195" y="104" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">mid</text>
  <text x="305" y="104" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">R</text>
  <!-- computation -->
  <rect x="360" y="96" width="160" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="113" text-anchor="middle" font-size="10" fill="#333">mid=2, arr[2]=4, 缺失=1 &lt; 5</text>
  <rect x="360" y="124" width="160" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="138" text-anchor="middle" font-size="10" fill="#4a7a3a">→ left = mid+1 = 3</text>

  <!-- ===== Step 2 ===== -->
  <text x="20" y="174" font-size="11" fill="#446688" font-weight="bold">第2轮</text>
  <text x="250" y="164" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">L</text>
  <text x="250" y="164" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">mid</text>
  <text x="305" y="164" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">R</text>
  <rect x="360" y="156" width="160" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="173" text-anchor="middle" font-size="10" fill="#333">mid=3, arr[3]=7, 缺失=3 &lt; 5</text>
  <rect x="360" y="184" width="160" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="198" text-anchor="middle" font-size="10" fill="#4a7a3a">→ left = mid+1 = 4</text>

  <!-- ===== Step 3 ===== -->
  <text x="20" y="234" font-size="11" fill="#446688" font-weight="bold">第3轮</text>
  <text x="305" y="224" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">L</text>
  <text x="305" y="224" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">mid</text>
  <text x="305" y="224" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">R</text>
  <rect x="360" y="216" width="160" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="233" text-anchor="middle" font-size="10" fill="#333">mid=4, arr[4]=11, 缺失=6 ≥ 5</text>
  <rect x="360" y="244" width="160" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="258" text-anchor="middle" font-size="10" fill="#b85450">→ right = mid−1 = 3</text>

  <!-- ===== Exit ===== -->
  <text x="20" y="294" font-size="11" fill="#446688" font-weight="bold">退出</text>
  <rect x="60" y="280" width="240" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="297" text-anchor="middle" font-size="10.5" fill="#333">left=4 &gt; right=3 → 区间为空</text>

  <!-- ===== Answer ===== -->
  <path d="M 270 308 L 270 326" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="100" y="332" width="340" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="356" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">ans = k + left = 5 + 4 = 9 ✓</text>

  <!-- note -->
  <text x="270" y="386" text-anchor="middle" font-size="10" fill="#888">left 停在「首个缺失数 ≥ k 的下标」，k+left 即第 k 个缺失正整数</text>
</svg>
