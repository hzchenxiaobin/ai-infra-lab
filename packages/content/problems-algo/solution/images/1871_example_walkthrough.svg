<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：s="011010", minJump=2, maxJump=3</text>

  <!-- Header row: index -->
  <text x="30" y="52" font-size="10" fill="#888" filter="url(#rough2)">下标</text>
  <text x="80" y="52" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="130" y="52" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="180" y="52" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="230" y="52" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="280" y="52" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <text x="330" y="52" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">5</text>

  <!-- s row -->
  <text x="30" y="78" font-size="11" fill="#555" filter="url(#rough2)">s</text>
  <rect x="60" y="62" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="110" y="62" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="160" y="62" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="210" y="62" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="260" y="62" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="310" y="62" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <!-- Steps table -->
  <text x="30" y="120" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="80" y="120" font-size="10" fill="#888" filter="url(#rough2)">j</text>
  <text x="150" y="120" font-size="10" fill="#888" filter="url(#rough2)">入窗</text>
  <text x="230" y="120" font-size="10" fill="#888" filter="url(#rough2)">出窗</text>
  <text x="300" y="120" font-size="10" fill="#888" filter="url(#rough2)">count</text>
  <text x="370" y="120" font-size="10" fill="#888" filter="url(#rough2)">s[j]</text>
  <text x="440" y="120" font-size="10" fill="#888" filter="url(#rough2)">dp[j]</text>
  <line x1="20" y1="126" x2="520" y2="126" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 0: j=0, base case -->
  <text x="30" y="146" font-size="10" fill="#555" filter="url(#rough2)">0</text>
  <text x="80" y="146" font-size="10" fill="#555" filter="url(#rough2)">0</text>
  <text x="150" y="146" font-size="10" fill="#888" filter="url(#rough2)">—</text>
  <text x="230" y="146" font-size="10" fill="#888" filter="url(#rough2)">—</text>
  <text x="300" y="146" font-size="10" fill="#888" filter="url(#rough2)">—</text>
  <text x="370" y="146" font-size="10" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="425" y="134" width="36" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="443" y="147" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">T</text>
  <text x="490" y="146" font-size="9" fill="#888" filter="url(#rough2)">起点</text>

  <!-- Step 1: j=1 -->
  <text x="30" y="172" font-size="10" fill="#555" filter="url(#rough2)">1</text>
  <text x="80" y="172" font-size="10" fill="#555" filter="url(#rough2)">1</text>
  <text x="150" y="172" font-size="10" fill="#888" filter="url(#rough2)">j−2=−1&lt;0</text>
  <text x="230" y="172" font-size="10" fill="#888" filter="url(#rough2)">—</text>
  <text x="300" y="172" font-size="10" fill="#555" filter="url(#rough2)">0</text>
  <text x="370" y="172" font-size="10" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="425" y="160" width="36" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="443" y="173" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">F</text>

  <!-- Step 2: j=2 -->
  <text x="30" y="198" font-size="10" fill="#555" filter="url(#rough2)">2</text>
  <text x="80" y="198" font-size="10" fill="#555" filter="url(#rough2)">2</text>
  <text x="150" y="198" font-size="10" fill="#4a7a3a" filter="url(#rough2)">dp[0]=T →+1</text>
  <text x="230" y="198" font-size="10" fill="#888" filter="url(#rough2)">j−4=−2&lt;0</text>
  <text x="300" y="198" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="370" y="198" font-size="10" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="425" y="186" width="36" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="443" y="199" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">F</text>
  <text x="490" y="198" font-size="9" fill="#b85450" filter="url(#rough2)">s[2]=1</text>

  <!-- Step 3: j=3 -->
  <text x="30" y="224" font-size="10" fill="#555" filter="url(#rough2)">3</text>
  <text x="80" y="224" font-size="10" fill="#555" filter="url(#rough2)">3</text>
  <text x="150" y="224" font-size="10" fill="#888" filter="url(#rough2)">dp[1]=F</text>
  <text x="230" y="224" font-size="10" fill="#888" filter="url(#rough2)">j−4=−1&lt;0</text>
  <text x="300" y="224" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="370" y="224" font-size="10" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="425" y="212" width="36" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="443" y="225" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">T</text>
  <text x="490" y="224" font-size="9" fill="#4a7a3a" filter="url(#rough2)">0+1&gt;0</text>

  <!-- Step 4: j=4 -->
  <text x="30" y="250" font-size="10" fill="#555" filter="url(#rough2)">4</text>
  <text x="80" y="250" font-size="10" fill="#555" filter="url(#rough2)">4</text>
  <text x="150" y="250" font-size="10" fill="#888" filter="url(#rough2)">dp[2]=F</text>
  <text x="230" y="250" font-size="10" fill="#b85450" filter="url(#rough2)">dp[0]=T →−1</text>
  <text x="300" y="250" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="370" y="250" font-size="10" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="425" y="238" width="36" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="443" y="251" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">F</text>
  <text x="490" y="250" font-size="9" fill="#b85450" filter="url(#rough2)">s[4]=1</text>

  <!-- Step 5: j=5 -->
  <text x="30" y="276" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="80" y="276" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="150" y="276" font-size="10" fill="#4a7a3a" filter="url(#rough2)">dp[3]=T →+1</text>
  <text x="230" y="276" font-size="10" fill="#888" filter="url(#rough2)">dp[1]=F</text>
  <text x="300" y="276" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="370" y="276" font-size="10" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="425" y="264" width="36" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="443" y="277" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">T</text>
  <text x="490" y="276" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">终点 ✓</text>

  <!-- Result -->
  <rect x="100" y="300" width="300" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="250" y="320" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">dp[5] = true → 返回 true ✓</text>

  <!-- Jump path visualization -->
  <text x="30" y="360" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">跳跃路径：</text>
  <rect x="60" y="372" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="392" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="80" y="418" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">起点</text>

  <path d="M 100 387 L 210 387" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="155" y="380" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">跳 3 步</text>

  <rect x="210" y="372" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="392" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="230" y="418" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">i=3</text>

  <path d="M 250 387 L 310 387" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">跳 2 步</text>

  <rect x="310" y="372" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="392" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="330" y="418" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">终点</text>

  <!-- Notes -->
  <rect x="370" y="372" width="250" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="495" y="392" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">窗口 [j−3, j−2] 随 j 右移</text>
  <text x="495" y="408" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">count 维护窗口内 T 的个数</text>
  <text x="495" y="422" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每步 O(1)，总计 O(n)</text>

  <!-- Bottom summary -->
  <rect x="50" y="444" width="540" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="320" y="462" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">关键：dp[3]=true 在 j=5 的窗口 [2,3] 内 → count=1 → dp[5]=true</text>
</svg>
