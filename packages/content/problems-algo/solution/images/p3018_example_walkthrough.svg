<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 432" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="432" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [3,4,3]，queries = [4,3,2] → 答案 2</text>
  <text x="310" y="45" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">精髓在第一步：查询删不动的端点，免费删！</text>

  <!-- row 0: initial -->
  <text x="36" y="76" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">初始</text>
  <rect x="100" y="62" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="152" y="62" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="204" y="62" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="226" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="278" y="76" font-size="10.5" fill="#333" filter="url(#rough2)">待处理 queries[0] = 4，k = 0</text>
  <text x="278" y="94" font-size="10.5" fill="#b85450" filter="url(#rough2)">两端 3、3 都 &lt; 4，查询删不动 ⚠️</text>
  <text x="596" y="84" text-anchor="end" font-size="11" fill="#999" filter="url(#rough2)">区间 [0,2]</text>

  <path d="M 122 100 L 122 124" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- row 1: free delete -->
  <text x="36" y="144" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">① 免费删</text>
  <text x="36" y="160" font-size="10.5" fill="#999" filter="url(#rough2)">k 不变</text>
  <rect x="100" y="130" width="44" height="34" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="152" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">3</text>
  <rect x="152" y="130" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="152" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="204" y="130" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="226" y="152" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="278" y="144" font-size="10.5" fill="#333" filter="url(#rough2)">白丢左端 3 ≈ 开局取子序列 [4,3]</text>
  <text x="278" y="162" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">内部的 4 立刻成了端点 ✓</text>
  <text x="596" y="152" text-anchor="end" font-size="11" fill="#999" filter="url(#rough2)">区间 [1,2]，k=0</text>

  <path d="M 174 168 L 174 194" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- row 2: query delete 4 -->
  <text x="36" y="214" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">② 查询删</text>
  <text x="36" y="230" font-size="10.5" fill="#999" filter="url(#rough2)">k 加 1</text>
  <rect x="100" y="200" width="44" height="34" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="222" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">3</text>
  <rect x="152" y="200" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="222" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="204" y="200" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="226" y="222" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="278" y="214" font-size="10.5" fill="#333" filter="url(#rough2)">4 ≥ queries[0] = 4，用它删掉 4</text>
  <text x="278" y="232" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">处理了 1 个查询 ✓</text>
  <text x="596" y="222" text-anchor="end" font-size="11" fill="#999" filter="url(#rough2)">区间 [2,2]，k=1</text>

  <path d="M 226 238 L 226 264" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- row 3: query delete 3 -->
  <text x="36" y="284" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">③ 查询删</text>
  <text x="36" y="300" font-size="10.5" fill="#999" filter="url(#rough2)">k 加 1</text>
  <rect x="100" y="270" width="44" height="34" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="292" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">3</text>
  <rect x="152" y="270" width="44" height="34" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="292" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">4</text>
  <rect x="204" y="270" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="226" y="292" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="278" y="284" font-size="10.5" fill="#333" filter="url(#rough2)">3 ≥ queries[1] = 3，删掉最后的 3</text>
  <text x="278" y="302" font-size="10.5" fill="#666" filter="url(#rough2)">数组空了，查询 2 无法处理 → 停</text>
  <text x="596" y="292" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">k = 2 ✓</text>

  <!-- bottom summary -->
  <rect x="40" y="328" width="540" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="310" y="352" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">DP 视角：f[1][2] = 0（免费删 3）→ f[2][2] = 1（查询删 4）→ bonus：3 ≥ queries[1] → 2</text>
  <text x="310" y="374" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">对照示例 1 [1,2,3,4,5]：一路查询删 1,2,3,4，查询 6 面对 5 删不动 → 答案 4</text>
  <text x="310" y="398" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">不换子序列会怎样？查询 4 面对两端 3、3 当场卡死，答案 0——免费删价值 2 个查询！</text>
</svg>
