<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">read(buf, n) 算法流程：循环 read4 + 按需拷贝</text>

  <!-- 开始 -->
  <ellipse cx="280" cy="58" rx="38" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">开始</text>

  <!-- 初始化 -->
  <rect x="214" y="88" width="132" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="104" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">total = 0</text>
  <text x="280" y="118" text-anchor="middle" font-size="10" fill="#888">buf4[4] 局部中转区</text>

  <path d="M 280 74 L 280 88" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判定: total < n ? -->
  <polygon points="280,134 360,168 280,202 200,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="164" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">total &lt; n ?</text>
  <text x="280" y="178" text-anchor="middle" font-size="9" fill="#888">还要继续读吗</text>

  <path d="M 280 122 L 280 134" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- N → 结束（返回 total） -->
  <path d="M 360 168 L 430 168" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="392" y="160" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="430" y="152" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="480" y="172" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 total</text>

  <!-- Y → read4 -->
  <path d="M 280 202 L 280 220" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="290" y="216" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="200" y="222" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">got = read4(buf4)</text>
  <text x="280" y="252" text-anchor="middle" font-size="9" fill="#888">从文件读最多 4 字符</text>

  <path d="M 280 256 L 280 272" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- need = min -->
  <rect x="196" y="274" width="168" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">need = min(got, n − total)</text>
  <text x="280" y="304" text-anchor="middle" font-size="9" fill="#888">本次最多拷 need 个（防读多）</text>

  <path d="M 280 308 L 280 322" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 拷贝 -->
  <rect x="172" y="324" width="216" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">拷 buf4[0..need) → buf[total..)</text>
  <text x="280" y="354" text-anchor="middle" font-size="10" fill="#4a7a3a">total += need</text>

  <path d="M 280 358 L 280 374" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判定: got < 4 (EOF) ? -->
  <polygon points="280,376 360,408 280,440 200,408" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="404" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">got &lt; 4 ?</text>
  <text x="280" y="418" text-anchor="middle" font-size="9" fill="#888">EOF 提前结束</text>

  <!-- Y → 返回 total（提前 EOF） -->
  <path d="M 360 408 L 430 408 L 480 408 L 480 184" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="392" y="400" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>

  <!-- N → 回循环（左侧绕回） -->
  <path d="M 200 408 L 150 408 L 150 168 L 200 168" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="135" y="290" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <text x="135" y="304" text-anchor="middle" font-size="9" fill="#888">回循环</text>

  <!-- 图例 -->
  <rect x="430" y="222" width="100" height="64" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="438" y="232" width="14" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="458" y="241" font-size="9" fill="#444">起始/正常步</text>
  <rect x="438" y="248" width="14" height="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="458" y="257" font-size="9" fill="#444">判定</text>
  <rect x="438" y="264" width="14" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="458" y="273" font-size="9" fill="#444">结束/返回</text>
</svg>
