<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">DP 流程：逐位扫描，两路合法转移累加</text>

  <!-- 初始化 -->
  <rect x="100" y="44" width="240" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="220" y="63" text-anchor="middle" font-size="12" fill="#333">f[0] = 1（空串一种解法）</text>
  <text x="220" y="79" text-anchor="middle" font-size="11" fill="#888">i = 1 开始遍历</text>
  <path d="M 220 88 L 220 106" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 决策菱形 i<=n -->
  <path d="M 220 110 L 320 154 L 220 198 L 120 154 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="150" text-anchor="middle" font-size="11.5" fill="#333">i ≤ n ?</text>
  <text x="220" y="168" text-anchor="middle" font-size="10.5" fill="#888">还有字符未处理？</text>

  <!-- 否 → 返回 -->
  <path d="M 320 154 L 408 154" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="360" y="146" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="408" y="136" width="130" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="473" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 f[n]</text>

  <!-- 是 ↓ -->
  <path d="M 220 198 L 220 218" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="234" y="212" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- 取1位判断 -->
  <path d="M 220 222 L 326 266 L 220 310 L 114 266 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="262" text-anchor="middle" font-size="11.5" fill="#333">s[i−1] ∈ '1'..'9' ?</text>
  <text x="220" y="280" text-anchor="middle" font-size="10.5" fill="#888">单字符是否合法</text>

  <!-- 是 → 累加 f[i-1] -->
  <path d="M 326 266 L 376 266" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="346" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="376" y="247" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="456" y="265" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">f[i] += f[i−1]</text>
  <text x="456" y="280" text-anchor="middle" font-size="10" fill="#888">继承前一位方案</text>

  <!-- 否/继续 ↓ -->
  <path d="M 220 310 L 220 326" stroke="#888" stroke-width="1.6" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="234" y="322" font-size="10" fill="#888">否则跳过</text>

  <!-- 取2位判断 -->
  <path d="M 220 330 L 336 376 L 220 422 L 104 376 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="370" text-anchor="middle" font-size="11.5" fill="#333">i≥2 且 10≤s[i−2..i]≤26 ?</text>
  <text x="220" y="388" text-anchor="middle" font-size="10.5" fill="#888">双字符是否合法</text>

  <!-- 是 → 累加 f[i-2] -->
  <path d="M 336 376 L 376 376" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="346" y="368" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="376" y="357" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="456" y="375" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">f[i] += f[i−2]</text>
  <text x="456" y="390" text-anchor="middle" font-size="10" fill="#888">继承前两位方案</text>

  <!-- i++ 回到决策 -->
  <path d="M 220 422 L 220 442" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="446" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="220" y="468" text-anchor="middle" font-size="12" fill="#333">i++，回到判断</text>

  <!-- 回环箭头 -->
  <path d="M 150 463 L 64 463 L 64 154 L 120 154" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 底部说明 -->
  <rect x="30" y="448" width="0" height="0" fill="none"/>
  <rect x="300" y="446" width="250" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="425" y="463" text-anchor="middle" font-size="10.5" fill="#555">两路判断独立：合法就累加，</text>
  <text x="425" y="478" text-anchor="middle" font-size="10.5" fill="#555">非法自动贡献 0，互不干扰</text>
</svg>
