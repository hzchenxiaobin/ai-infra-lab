<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">核心观察：堆式编号的完全二叉树——子树翻转 = 祖先链翻转</text>

  <!-- ===== edges (drawn under nodes) ===== -->
  <line x1="280" y1="82" x2="195" y2="158" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="280" y1="82" x2="365" y2="158" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="190" y1="178" x2="146" y2="238" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="190" y1="178" x2="234" y2="238" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="370" y1="178" x2="326" y2="238" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="370" y1="178" x2="414" y2="238" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- ===== dashed enclosure around subtree of node 2 ===== -->
  <rect x="104" y="132" width="172" height="138" fill="#fff8e1" fill-opacity="0.35" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 4" rx="12" filter="url(#rough2)"/>
  <text x="120" y="150" font-size="11" fill="#d6a040" font-weight="bold">翻转 q=2 的子树</text>
  <text x="120" y="163" font-size="10" fill="#d6a040">= {2, 4, 5}</text>

  <!-- ===== nodes ===== -->
  <!-- node 1 (root) -->
  <circle cx="280" cy="82" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <!-- node 2 (orange: in highlighted subtree) -->
  <circle cx="190" cy="178" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="190" y="184" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">2</text>
  <!-- node 3 -->
  <circle cx="370" cy="178" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="184" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>
  <!-- node 4 (orange) -->
  <circle cx="140" cy="240" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="140" y="246" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">4</text>
  <!-- node 5 (orange) -->
  <circle cx="240" cy="240" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="240" y="246" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">5</text>
  <!-- node 6 -->
  <circle cx="320" cy="240" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="246" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">6</text>
  <!-- node 7 -->
  <circle cx="420" cy="240" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="246" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">7</text>

  <!-- ===== parent relation arrow: 7 -> 3 ===== -->
  <path d="M 416 222 Q 432 196 386 180" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="448" y="200" font-size="11" fill="#4a7a3a" font-weight="bold">父 = ⌊7/2⌋ = 3</text>
  <text x="448" y="214" font-size="10" fill="#4a7a3a">编号即位置</text>

  <!-- divider -->
  <line x1="30" y1="288" x2="540" y2="288" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== note box A (blue) ===== -->
  <rect x="30" y="300" width="500" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">堆式编号 ⇒ 无需建边</text>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#333">parent(v) = ⌊v/2⌋，左孩子 = 2v，右孩子 = 2v+1</text>
  <text x="280" y="354" text-anchor="middle" font-size="11" fill="#333">v = 1..n 的自然递增即合法拓扑序（父先于子）</text>

  <!-- ===== note box B (orange) ===== -->
  <rect x="30" y="366" width="500" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="388" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">翻转 q 的子树 ⟺ 祖先链 +1（模 2）</text>
  <text x="280" y="406" text-anchor="middle" font-size="11" fill="#333">节点 v 被翻转 ⟺ q 是 v 的祖先或自身</text>
  <text x="280" y="420" text-anchor="middle" font-size="11" fill="#333">⇒ val[v] = (祖先链查询数) mod 2 = val[父] ⊕ cnt[v]</text>
</svg>
