<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums=[−1,0,3,5,9,12]，target=9</text>

  <!-- ===== Round 1 ===== -->
  <text x="20" y="56" font-size="12" fill="#446688" font-weight="bold">第 1 轮：left=0, right=5 → mid=2</text>
  <rect x="60" y="64" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="84" text-anchor="middle" font-size="12" fill="#333">−1</text>
  <rect x="125" y="64" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="84" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="190" y="64" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="255" y="64" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="84" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="320" y="64" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="84" text-anchor="middle" font-size="12" fill="#333">9</text>
  <rect x="385" y="64" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="415" y="84" text-anchor="middle" font-size="12" fill="#333">12</text>
  <text x="90" y="108" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">left</text>
  <text x="220" y="108" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">mid</text>
  <text x="415" y="108" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">right</text>
  <rect x="460" y="72" width="92" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="506" y="89" text-anchor="middle" font-size="11" fill="#446688">3 &lt; 9 → left=3</text>

  <!-- ===== Round 2 ===== -->
  <text x="20" y="138" font-size="12" fill="#446688" font-weight="bold">第 2 轮：left=3, right=5 → mid=4</text>
  <rect x="60" y="146" width="60" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="166" text-anchor="middle" font-size="12" fill="#aaa">−1</text>
  <rect x="125" y="146" width="60" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="166" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <rect x="190" y="146" width="60" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="166" text-anchor="middle" font-size="12" fill="#aaa">3</text>
  <rect x="255" y="146" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="166" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="320" y="146" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <rect x="385" y="146" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="415" y="166" text-anchor="middle" font-size="12" fill="#333">12</text>
  <text x="285" y="190" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">left</text>
  <text x="350" y="190" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">mid</text>
  <text x="415" y="190" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">right</text>
  <rect x="460" y="154" width="92" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="506" y="171" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">9 == 9 → ✅</text>

  <!-- ===== result ===== -->
  <rect x="40" y="220" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">命中！nums[mid] == target → return mid = 4</text>
  <text x="280" y="264" text-anchor="middle" font-size="11" fill="#555">两轮二分即定位，线性扫描则需 5 次比较</text>

  <!-- ===== not found mini case ===== -->
  <text x="20" y="306" font-size="12" fill="#b85450" font-weight="bold">反例：target=2（不存在）</text>
  <text x="20" y="328" font-size="11" fill="#555">第 1 轮 mid=2，nums[2]=3 &gt; 2 → right=1；第 2 轮 mid=0，nums[0]=−1 &lt; 2 → left=1；</text>
  <text x="20" y="346" font-size="11" fill="#555">第 3 轮 mid=1，nums[1]=0 &lt; 2 → left=2；此时 left &gt; right，区间为空 → return −1。</text>

  <rect x="40" y="362" width="480" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">区间收敛到 left &gt; right 即说明 target 不在数组中</text>
  <text x="280" y="400" text-anchor="middle" font-size="10.5" fill="#888">闭区间写法：循环结束时 [left,right] 为空，left 即为「插入位置」</text>
</svg>
