<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：m=1, n=1 → 3；m=1, n=2 → 6</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888">m=1 时状态 = 单格颜色 {R, G, B}，兼容图 = 三角形（两两兼容）</text>

  <!-- Example 1: m=1, n=1 -->
  <rect x="30" y="64" width="270" height="180" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="88" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">示例 1：m=1, n=1</text>
  <text x="165" y="106" text-anchor="middle" font-size="10" fill="#888">1×1 网格，3 种颜色任选</text>

  <!-- 3 single cells -->
  <rect x="55" y="120" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="75" y="145" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">R</text>

  <rect x="145" y="120" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="165" y="145" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">G</text>

  <rect x="235" y="120" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="255" y="145" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">B</text>

  <!-- DP -->
  <text x="55" y="182" font-size="11" fill="#555">dp[0] = [1, 1, 1]</text>
  <text x="55" y="200" font-size="11" fill="#555">n=1 → 无转移，直接求和</text>
  <rect x="55" y="208" width="180" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="226" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans = 1+1+1 = 3 ✓</text>

  <!-- Example 2: m=1, n=2 -->
  <rect x="320" y="64" width="270" height="180" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="455" y="88" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">示例 2：m=1, n=2</text>
  <text x="455" y="106" text-anchor="middle" font-size="10" fill="#888">1×2 网格，两格不同色</text>

  <!-- 6 combinations: RG, RB, GR, GB, BR, BG -->
  <g font-size="12" font-weight="bold">
    <!-- RG -->
    <rect x="335" y="118" width="28" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="349" y="137" text-anchor="middle" fill="#b85450">R</text>
    <rect x="363" y="118" width="28" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="377" y="137" text-anchor="middle" fill="#4a7a3a">G</text>

    <!-- RB -->
    <rect x="435" y="118" width="28" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="449" y="137" text-anchor="middle" fill="#b85450">R</text>
    <rect x="463" y="118" width="28" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="477" y="137" text-anchor="middle" fill="#446688">B</text>

    <!-- GR -->
    <rect x="335" y="152" width="28" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="349" y="171" text-anchor="middle" fill="#4a7a3a">G</text>
    <rect x="363" y="152" width="28" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="377" y="171" text-anchor="middle" fill="#b85450">R</text>

    <!-- GB -->
    <rect x="435" y="152" width="28" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="449" y="171" text-anchor="middle" fill="#4a7a3a">G</text>
    <rect x="463" y="152" width="28" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="477" y="171" text-anchor="middle" fill="#446688">B</text>

    <!-- BR -->
    <rect x="335" y="186" width="28" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="349" y="205" text-anchor="middle" fill="#446688">B</text>
    <rect x="363" y="186" width="28" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="377" y="205" text-anchor="middle" fill="#b85450">R</text>

    <!-- BG -->
    <rect x="435" y="186" width="28" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="449" y="205" text-anchor="middle" fill="#446688">B</text>
    <rect x="463" y="186" width="28" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="477" y="205" text-anchor="middle" fill="#4a7a3a">G</text>
  </g>

  <rect x="335" y="224" width="180" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="425" y="235" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans = 6 ✓</text>

  <!-- DP table for m=1 -->
  <rect x="30" y="260" width="560" height="180" rx="8" fill="#fafafa" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="310" y="284" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">DP 表（m=1，状态 R / G / B）</text>

  <!-- header row -->
  <g font-size="11">
    <rect x="50" y="296" width="60" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="80" y="314" text-anchor="middle" fill="#446688" font-weight="bold">col</text>
    <rect x="110" y="296" width="80" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="150" y="314" text-anchor="middle" fill="#b85450" font-weight="bold">dp[R]</text>
    <rect x="190" y="296" width="80" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="230" y="314" text-anchor="middle" fill="#4a7a3a" font-weight="bold">dp[G]</text>
    <rect x="270" y="296" width="80" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="310" y="314" text-anchor="middle" fill="#446688" font-weight="bold">dp[B]</text>
    <rect x="350" y="296" width="100" height="28" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="400" y="314" text-anchor="middle" fill="#d6a040" font-weight="bold">求和</text>
    <rect x="450" y="296" width="120" height="28" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="510" y="314" text-anchor="middle" fill="#555">转移说明</text>
  </g>

  <!-- col 0 -->
  <g font-size="11">
    <rect x="50" y="326" width="60" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="80" y="342" text-anchor="middle" fill="#444">0</text>
    <rect x="110" y="326" width="80" height="24" rx="3" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="150" y="342" text-anchor="middle" fill="#444">1</text>
    <rect x="190" y="326" width="80" height="24" rx="3" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="230" y="342" text-anchor="middle" fill="#444">1</text>
    <rect x="270" y="326" width="80" height="24" rx="3" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="310" y="342" text-anchor="middle" fill="#444">1</text>
    <rect x="350" y="326" width="100" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="400" y="342" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="450" y="326" width="120" height="24" rx="3" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="510" y="342" text-anchor="middle" fill="#888">初始化全 1</text>
  </g>

  <!-- col 1 -->
  <g font-size="11">
    <rect x="50" y="352" width="60" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="80" y="368" text-anchor="middle" fill="#444">1</text>
    <rect x="110" y="352" width="80" height="24" rx="3" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="150" y="368" text-anchor="middle" fill="#444">2</text>
    <rect x="190" y="352" width="80" height="24" rx="3" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="230" y="368" text-anchor="middle" fill="#444">2</text>
    <rect x="270" y="352" width="80" height="24" rx="3" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="310" y="368" text-anchor="middle" fill="#444">2</text>
    <rect x="350" y="352" width="100" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="400" y="368" text-anchor="middle" fill="#d6a040" font-weight="bold">6</text>
    <rect x="450" y="352" width="120" height="24" rx="3" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="510" y="368" text-anchor="middle" fill="#888">dp[R]=dp[G]+dp[B]</text>
  </g>

  <!-- explanation -->
  <text x="50" y="400" font-size="11" fill="#555">转移：dp[col][R] = dp[col−1][G] + dp[col−1][B]（R 与 G、B 兼容，不与自己兼容）</text>
  <text x="50" y="418" font-size="11" fill="#555">同理 dp[col][G] = dp[col−1][R] + dp[col−1][B]，dp[col][B] = dp[col−1][R] + dp[col−1][G]</text>
  <text x="50" y="436" font-size="10" fill="#888">每列每个状态 = 上一列所有兼容状态之和 → n=1 时和=3，n=2 时和=6，n=3 时和=12…（每翻倍×2）</text>
</svg>
