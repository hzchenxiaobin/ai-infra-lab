<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：追踪 (mult, add) 与基值 seq</text>

  <!-- 表头 -->
  <rect x="20" y="40" width="540" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="40" y="57" font-size="11" fill="#446688" font-weight="bold">步骤</text>
  <text x="110" y="57" font-size="11" fill="#446688" font-weight="bold">操作</text>
  <text x="230" y="57" font-size="11" fill="#446688" font-weight="bold">mult</text>
  <text x="290" y="57" font-size="11" fill="#446688" font-weight="bold">add</text>
  <text x="370" y="57" font-size="11" fill="#446688" font-weight="bold">seq（基值）</text>
  <text x="530" y="57" font-size="11" fill="#446688" font-weight="bold">校验</text>

  <!-- 行 1: append(2) -->
  <rect x="20" y="68" width="540" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="88" font-size="11" fill="#333">1</text>
  <text x="110" y="88" font-size="11" fill="#333">append(2)</text>
  <text x="230" y="88" font-size="11" fill="#446688">1</text>
  <text x="290" y="88" font-size="11" fill="#446688">0</text>
  <text x="370" y="88" font-size="11" fill="#a87020" font-weight="bold">[2]</text>
  <text x="530" y="88" font-size="11" fill="#888">b=(2−0)·1</text>

  <!-- 行 2: addAll(3) -->
  <rect x="20" y="100" width="540" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="120" font-size="11" fill="#333">2</text>
  <text x="110" y="120" font-size="11" fill="#333">addAll(3)</text>
  <text x="230" y="120" font-size="11" fill="#446688">1</text>
  <text x="290" y="120" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="370" y="120" font-size="11" fill="#a87020">[2]</text>
  <text x="530" y="120" font-size="11" fill="#888">add+=3</text>

  <!-- 行 3: append(7) -->
  <rect x="20" y="132" width="540" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="152" font-size="11" fill="#333">3</text>
  <text x="110" y="152" font-size="11" fill="#333">append(7)</text>
  <text x="230" y="152" font-size="11" fill="#446688">1</text>
  <text x="290" y="152" font-size="11" fill="#446688">3</text>
  <text x="370" y="152" font-size="11" fill="#a87020" font-weight="bold">[2, 4]</text>
  <text x="530" y="152" font-size="11" fill="#888">b=(7−3)·1</text>

  <!-- 行 4: multAll(2) -->
  <rect x="20" y="164" width="540" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="184" font-size="11" fill="#333">4</text>
  <text x="110" y="184" font-size="11" fill="#333">multAll(2)</text>
  <text x="230" y="184" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="290" y="184" font-size="11" fill="#b85450" font-weight="bold">6</text>
  <text x="370" y="184" font-size="11" fill="#a87020">[2, 4]</text>
  <text x="530" y="184" font-size="11" fill="#888">×2, ×2</text>

  <!-- 行 5: getIndex(0) -> 10 -->
  <rect x="20" y="196" width="540" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="40" y="216" font-size="11" fill="#333">5</text>
  <text x="110" y="216" font-size="11" fill="#333">getIndex(0)</text>
  <text x="230" y="216" font-size="11" fill="#446688">2</text>
  <text x="290" y="216" font-size="11" fill="#446688">6</text>
  <text x="370" y="216" font-size="11" fill="#a87020">[2, 4]</text>
  <text x="530" y="216" font-size="11" fill="#4a7a3a" font-weight="bold">2·2+6=10 ✓</text>

  <!-- 行 6: addAll(3) -->
  <rect x="20" y="228" width="540" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="248" font-size="11" fill="#333">6</text>
  <text x="110" y="248" font-size="11" fill="#333">addAll(3)</text>
  <text x="230" y="248" font-size="11" fill="#446688">2</text>
  <text x="290" y="248" font-size="11" fill="#b85450" font-weight="bold">9</text>
  <text x="370" y="248" font-size="11" fill="#a87020">[2, 4]</text>
  <text x="530" y="248" font-size="11" fill="#888">add+=3</text>

  <!-- 行 7: append(10) -->
  <rect x="20" y="260" width="540" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="280" font-size="11" fill="#333">7</text>
  <text x="110" y="280" font-size="11" fill="#333">append(10)</text>
  <text x="230" y="280" font-size="11" fill="#446688">2</text>
  <text x="290" y="280" font-size="11" fill="#446688">9</text>
  <text x="370" y="280" font-size="10" fill="#a87020" font-weight="bold">[2, 4, inv(2)]</text>
  <text x="530" y="280" font-size="10" fill="#888">(10−9)·2⁻¹</text>

  <!-- 行 8: multAll(2) -->
  <rect x="20" y="292" width="540" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="312" font-size="11" fill="#333">8</text>
  <text x="110" y="312" font-size="11" fill="#333">multAll(2)</text>
  <text x="230" y="312" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="290" y="312" font-size="11" fill="#b85450" font-weight="bold">18</text>
  <text x="370" y="312" font-size="10" fill="#a87020">[2, 4, inv(2)]</text>
  <text x="530" y="312" font-size="11" fill="#888">×2, ×2</text>

  <!-- 行 9: getIndex(0) -> 26 -->
  <rect x="20" y="324" width="540" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="40" y="344" font-size="11" fill="#333">9</text>
  <text x="110" y="344" font-size="11" fill="#333">getIndex(0)</text>
  <text x="230" y="344" font-size="11" fill="#446688">4</text>
  <text x="290" y="344" font-size="11" fill="#446688">18</text>
  <text x="370" y="344" font-size="10" fill="#a87020">[2, 4, inv(2)]</text>
  <text x="530" y="344" font-size="11" fill="#4a7a3a" font-weight="bold">2·4+18=26 ✓</text>

  <!-- 行 10: getIndex(1) -> 34 -->
  <rect x="20" y="356" width="540" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="40" y="376" font-size="11" fill="#333">10</text>
  <text x="110" y="376" font-size="11" fill="#333">getIndex(1)</text>
  <text x="230" y="376" font-size="11" fill="#446688">4</text>
  <text x="290" y="376" font-size="11" fill="#446688">18</text>
  <text x="370" y="376" font-size="10" fill="#a87020">[2, 4, inv(2)]</text>
  <text x="530" y="376" font-size="11" fill="#4a7a3a" font-weight="bold">4·4+18=34 ✓</text>

  <!-- 行 11: getIndex(2) -> 20 -->
  <rect x="20" y="388" width="540" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="40" y="408" font-size="11" fill="#333">11</text>
  <text x="110" y="408" font-size="11" fill="#333">getIndex(2)</text>
  <text x="230" y="408" font-size="11" fill="#446688">4</text>
  <text x="290" y="408" font-size="11" fill="#446688">18</text>
  <text x="370" y="408" font-size="10" fill="#a87020">[2, 4, inv(2)]</text>
  <text x="530" y="408" font-size="10" fill="#4a7a3a" font-weight="bold">2⁻¹·4+18=20 ✓</text>

  <!-- 注释框 -->
  <rect x="20" y="428" width="540" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="446" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">inv(2)=500000004，2⁻¹·4 ≡ 2 (mod 1e9+7)，故第 11 步 = 2+18 = 20</text>
</svg>
