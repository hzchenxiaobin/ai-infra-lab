<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">车的攻击规则：沿方向直线扫描，遇首个棋子定结果</text>

  <!-- 左场景：首个=p → 吃掉 -->
  <text x="150" y="60" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">首个棋子 = 卒 p → 吃掉 ✓</text>

  <rect x="40"  y="78" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="64"  y="108" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">R</text>
  <rect x="88"  y="78" width="48" height="48" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="136" y="78" width="48" height="48" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="184" y="78" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="208" y="108" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">p</text>
  <rect x="232" y="78" width="48" height="48" fill="#f5f5f5" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="256" y="108" text-anchor="middle" font-size="14" fill="#aaa">B</text>

  <path d="M 90 102 L 180 102" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a">扫描到首个 p，吃掉；B 在 p 之后，忽略</text>

  <!-- 右场景：首个=B → 挡住 -->
  <text x="430" y="60" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">首个棋子 = 象 B → 挡住 ✗</text>

  <rect x="320" y="78" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="344" y="108" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">R</text>
  <rect x="368" y="78" width="48" height="48" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="416" y="78" width="48" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="440" y="108" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">B</text>
  <rect x="464" y="78" width="48" height="48" fill="#f5f5f5" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="488" y="108" text-anchor="middle" font-size="14" fill="#aaa">p</text>

  <path d="M 370 102 L 412 102" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="430" y="148" text-anchor="middle" font-size="10" fill="#b85450">扫描到首个 B，被挡住；p 在 B 之后，吃不到</text>

  <!-- 中间分隔 -->
  <line x1="296" y1="60" x2="296" y2="150" stroke="#dddddd" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- 底部说明框 -->
  <rect x="30" y="180" width="500" height="160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">四方向扫描模板</text>

  <text x="50" y="232" font-size="11.5" fill="#555">车从自身位置出发，沿 上 / 下 / 左 / 右 四个方向各做一次直线扫描：</text>
  <text x="50" y="254" font-size="11.5" fill="#4a7a3a">• 遇 '.' → 继续走下一格</text>
  <text x="50" y="274" font-size="11.5" fill="#4a7a3a">• 遇 'p'（卒）→ 计数 +1，本方向停止</text>
  <text x="50" y="294" font-size="11.5" fill="#b85450">• 遇 'B'（象）→ 本方向停止，不计</text>
  <text x="50" y="314" font-size="11.5" fill="#888">• 越出边界 → 本方向停止，不计</text>
  <text x="50" y="334" font-size="11" fill="#d6a040" font-weight="bold">关键：每方向只看「第一个」碰到的棋子，之后无论是什么都被挡住</text>
</svg>
