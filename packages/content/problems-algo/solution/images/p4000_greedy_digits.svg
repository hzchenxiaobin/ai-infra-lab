<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：高位优先吃满 9</text>
  <text x="260" y="56" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">例子：n = 5, s = 23 —— 每一位取 min(9, 剩余 s)</text>

  <!-- 剩余 s 递减箭头 -->
  <path d="M 134 76 L 180 76" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="157" y="71" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">−9</text>
  <path d="M 202 76 L 248 76" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="225" y="71" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">−9</text>
  <path d="M 270 76 L 316 76" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="293" y="71" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">−5</text>

  <!-- 剩余 s 值 -->
  <text x="70" y="96" text-anchor="end" font-size="11.5" fill="#446688" filter="url(#rough2)">剩余 s：</text>
  <text x="124" y="96" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">23</text>
  <text x="192" y="96" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">14</text>
  <text x="260" y="96" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">5</text>
  <text x="328" y="96" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">0</text>
  <text x="396" y="96" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">0</text>

  <!-- 5 个数位格子 -->
  <rect x="96" y="102" width="56" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="164" y="102" width="56" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="232" y="102" width="56" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="300" y="102" width="56" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="368" y="102" width="56" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>

  <text x="124" y="134" text-anchor="middle" font-size="22" fill="#333" filter="url(#rough2)">9</text>
  <text x="192" y="134" text-anchor="middle" font-size="22" fill="#333" filter="url(#rough2)">9</text>
  <text x="260" y="134" text-anchor="middle" font-size="22" fill="#7a5518" filter="url(#rough2)">5</text>
  <text x="328" y="134" text-anchor="middle" font-size="22" fill="#333" filter="url(#rough2)">0</text>
  <text x="396" y="134" text-anchor="middle" font-size="22" fill="#333" filter="url(#rough2)">0</text>

  <!-- 格子下标注 -->
  <text x="124" y="166" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">吃满 9</text>
  <text x="192" y="166" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">吃满 9</text>
  <text x="260" y="166" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">吸干剩余</text>
  <text x="328" y="166" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">剩 0</text>
  <text x="396" y="166" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">剩 0</text>

  <!-- 指向结果 -->
  <path d="M 260 172 L 260 190" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="185" y="194" width="150" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="221" text-anchor="middle" font-size="19" fill="#7a5518" filter="url(#rough2)">答案 99500</text>

  <!-- 说明框 -->
  <rect x="30" y="252" width="460" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="50" y="276" font-size="13.5" font-weight="bold" fill="#2a5330" filter="url(#rough2)">为什么高位大，数就大？</text>
  <text x="50" y="300" font-size="12.5" fill="#333" filter="url(#rough2)">同位数比较 = 逐位字典序：贪心首位取 min(9, s)，已是可行上界</text>
  <text x="50" y="322" font-size="12.5" fill="#333" filter="url(#rough2)">首位并列 9 时看次位……逐位归纳，贪心结果字典序最大</text>
  <text x="50" y="344" font-size="12.5" fill="#333" filter="url(#rough2)">交换论证：某位比贪心小的解，其后必有更大的位，换到前面数变大</text>
</svg>
