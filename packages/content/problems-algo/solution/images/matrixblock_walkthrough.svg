<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：mat 3×3, k=1 → answer[0][0]=12, answer[2][2]=28</text>

  <!-- ===== 左：mat 3×3 ===== -->
  <text x="117" y="52" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">mat</text>
  <text x="79" y="64" text-anchor="middle" font-size="9" fill="#999">c=0</text>
  <text x="117" y="64" text-anchor="middle" font-size="9" fill="#999">1</text>
  <text x="155" y="64" text-anchor="middle" font-size="9" fill="#999">2</text>
  <text x="52" y="88" text-anchor="end" font-size="9" fill="#999">r=0</text>
  <text x="52" y="126" text-anchor="end" font-size="9" fill="#999">1</text>
  <text x="52" y="164" text-anchor="end" font-size="9" fill="#999">2</text>

  <rect x="60" y="70" width="114" height="114" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M98 70 V184 M136 70 V184" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <path d="M60 108 H174 M60 146 H174" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>

  <text x="79" y="95" text-anchor="middle" font-size="13" fill="#666">1</text>
  <text x="117" y="95" text-anchor="middle" font-size="13" fill="#666">2</text>
  <text x="155" y="95" text-anchor="middle" font-size="13" fill="#666">3</text>
  <text x="79" y="133" text-anchor="middle" font-size="13" fill="#666">4</text>
  <text x="117" y="133" text-anchor="middle" font-size="13" fill="#666">5</text>
  <text x="155" y="133" text-anchor="middle" font-size="13" fill="#666">6</text>
  <text x="79" y="171" text-anchor="middle" font-size="13" fill="#666">7</text>
  <text x="117" y="171" text-anchor="middle" font-size="13" fill="#666">8</text>
  <text x="155" y="171" text-anchor="middle" font-size="13" fill="#666">9</text>

  <!-- mat 高亮：answer[0][0] 邻域 2×2 (橙) -->
  <rect x="60" y="70" width="76" height="76" fill="#fff8e1" opacity="0.55" filter="url(#rough2)"/>
  <rect x="60" y="70" width="76" height="76" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="98" y="200" text-anchor="middle" font-size="9" fill="#d6a040">answer[0][0] 邻域</text>

  <!-- mat 高亮：answer[2][2] 邻域 2×2 (绿) -->
  <rect x="98" y="108" width="76" height="76" fill="#e6f4ea" opacity="0.55" filter="url(#rough2)"/>
  <rect x="98" y="108" width="76" height="76" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="155" y="200" text-anchor="middle" font-size="9" fill="#4a7a3a">answer[2][2] 邻域</text>

  <!-- ===== 右：pre 4×4 ===== -->
  <text x="378" y="52" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">pre (前缀和表)</text>
  <text x="327" y="64" text-anchor="middle" font-size="9" fill="#999">c=0</text>
  <text x="361" y="64" text-anchor="middle" font-size="9" fill="#999">1</text>
  <text x="395" y="64" text-anchor="middle" font-size="9" fill="#999">2</text>
  <text x="429" y="64" text-anchor="middle" font-size="9" fill="#999">3</text>
  <text x="300" y="86" text-anchor="end" font-size="9" fill="#999">r=0</text>
  <text x="300" y="120" text-anchor="end" font-size="9" fill="#999">1</text>
  <text x="300" y="154" text-anchor="end" font-size="9" fill="#999">2</text>
  <text x="300" y="188" text-anchor="end" font-size="9" fill="#999">3</text>

  <rect x="310" y="70" width="136" height="136" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M344 70 V206 M378 70 V206 M412 70 V206" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <path d="M310 104 H446 M310 138 H446 M310 172 H446" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>

  <!-- pre 值 -->
  <text x="327" y="93" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <text x="361" y="93" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <text x="395" y="93" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <text x="429" y="93" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <text x="327" y="127" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <text x="361" y="127" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="395" y="127" text-anchor="middle" font-size="12" fill="#666">3</text>
  <text x="429" y="127" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">6</text>
  <text x="327" y="161" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <text x="361" y="161" text-anchor="middle" font-size="12" fill="#666">5</text>
  <text x="395" y="161" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">12</text>
  <text x="429" y="161" text-anchor="middle" font-size="12" fill="#666">21</text>
  <text x="327" y="195" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <text x="361" y="195" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">12</text>
  <text x="395" y="195" text-anchor="middle" font-size="12" fill="#666">27</text>
  <text x="429" y="195" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">45</text>

  <!-- ===== 底部计算框 A: answer[0][0] ===== -->
  <rect x="30" y="226" width="245" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="152" y="248" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">answer[0][0]  (r1=0,r2=1,c1=0,c2=1)</text>
  <text x="152" y="276" text-anchor="middle" font-size="12" fill="#444">
    <tspan fill="#d6a040" font-weight="bold">pre[2][2]</tspan>
    <tspan fill="#333"> − </tspan>
    <tspan fill="#446688">pre[0][2]</tspan>
    <tspan fill="#333"> − </tspan>
    <tspan fill="#446688">pre[2][0]</tspan>
    <tspan fill="#333"> + </tspan>
    <tspan fill="#4a7a3a">pre[0][0]</tspan>
  </text>
  <text x="152" y="302" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">
    <tspan fill="#d6a040">12</tspan>
    <tspan fill="#333"> − </tspan>
    <tspan fill="#446688">0</tspan>
    <tspan fill="#333"> − </tspan>
    <tspan fill="#446688">0</tspan>
    <tspan fill="#333"> + </tspan>
    <tspan fill="#4a7a3a">0</tspan>
    <tspan fill="#333"> = </tspan>
    <tspan fill="#d6a040">12 ✓</tspan>
  </text>

  <!-- ===== 底部计算框 B: answer[2][2] ===== -->
  <rect x="290" y="226" width="245" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="412" y="248" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">answer[2][2]  (r1=1,r2=2,c1=1,c2=2)</text>
  <text x="412" y="276" text-anchor="middle" font-size="12" fill="#444">
    <tspan fill="#b85450" font-weight="bold">pre[3][3]</tspan>
    <tspan fill="#333"> − </tspan>
    <tspan fill="#446688">pre[1][3]</tspan>
    <tspan fill="#333"> − </tspan>
    <tspan fill="#446688">pre[3][1]</tspan>
    <tspan fill="#333"> + </tspan>
    <tspan fill="#4a7a3a">pre[1][1]</tspan>
  </text>
  <text x="412" y="302" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">
    <tspan fill="#b85450">45</tspan>
    <tspan fill="#333"> − </tspan>
    <tspan fill="#446688">6</tspan>
    <tspan fill="#333"> − </tspan>
    <tspan fill="#446688">12</tspan>
    <tspan fill="#333"> + </tspan>
    <tspan fill="#4a7a3a">1</tspan>
    <tspan fill="#333"> = </tspan>
    <tspan fill="#4a7a3a">28 ✓</tspan>
  </text>

  <!-- 底部说明 -->
  <rect x="30" y="338" width="505" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="282" y="362" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">观察：颜色对应 pre 表中的角点</text>
  <text x="50" y="386" font-size="11" fill="#444">
    <tspan fill="#b85450" font-weight="bold">红 = 右下角 pre[r2+1][c2+1] (+)</tspan>
    <tspan fill="#333">    </tspan>
    <tspan fill="#446688" font-weight="bold">蓝 = 上/左 pre[r1][c2+1], pre[r2+1][c1] (−)</tspan>
  </text>
  <text x="50" y="408" font-size="11" fill="#444">
    <tspan fill="#4a7a3a" font-weight="bold">绿 = 左上角 pre[r1][c1] (+)</tspan>
    <tspan fill="#333">    中心格 answer[1][1] 邻域覆盖全矩阵，四角仅 pre[3][3]=45 非零 → 45</tspan>
  </text>
</svg>
