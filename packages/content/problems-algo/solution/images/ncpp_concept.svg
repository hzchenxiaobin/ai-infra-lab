<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三大陷阱：重复帖子 · 重复评论 · 悬空评论</text>

  <!-- ===== 陷阱①：重复帖子 ===== -->
  <text x="40" y="54" font-size="11.5" fill="#446688" font-weight="bold">① 重复帖子：同一 sub_id 多行 parent_id=NULL</text>

  <!-- mini table -->
  <rect x="40" y="62" width="210" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="40" y1="86" x2="250" y2="86" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="125" y1="62" x2="125" y2="148" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="82" y="78" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">sub_id</text>
  <text x="187" y="78" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">parent_id</text>
  <text x="82" y="104" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="187" y="104" text-anchor="middle" font-size="11" fill="#333">NULL</text>
  <!-- 重复行：红色虚线 -->
  <rect x="42" y="110" width="206" height="26" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <text x="82" y="128" text-anchor="middle" font-size="11" fill="#999">1</text>
  <text x="187" y="128" text-anchor="middle" font-size="11" fill="#999">NULL</text>
  <text x="232" y="128" font-size="9.5" fill="#b85450">重复</text>

  <!-- 对策框 -->
  <rect x="270" y="68" width="270" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="284" y="86" font-size="11.5" fill="#d6a040" font-weight="bold">对策：DISTINCT sub_id</text>
  <text x="284" y="103" font-size="10.5" fill="#555">WHERE parent_id IS NULL → 帖子 1 只算 1 次</text>

  <path d="M 265 100 L 272 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 分隔虚线 -->
  <line x1="40" y1="162" x2="540" y2="162" stroke="#ddd" stroke-width="1" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- ===== 陷阱②：重复评论 ===== -->
  <text x="40" y="182" font-size="11.5" fill="#4a7a3a" font-weight="bold">② 重复评论：同一 sub_id 多行指向同一帖子</text>

  <rect x="40" y="190" width="210" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="40" y1="214" x2="250" y2="214" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="125" y1="190" x2="125" y2="276" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="82" y="206" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">sub_id</text>
  <text x="187" y="206" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">parent_id</text>
  <text x="82" y="232" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="187" y="232" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="42" y="238" width="206" height="26" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <text x="82" y="256" text-anchor="middle" font-size="11" fill="#999">3</text>
  <text x="187" y="256" text-anchor="middle" font-size="11" fill="#999">1</text>
  <text x="232" y="256" font-size="9.5" fill="#b85450">重复</text>

  <rect x="270" y="196" width="270" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="284" y="214" font-size="11.5" fill="#d6a040" font-weight="bold">对策：COUNT(DISTINCT sub_id)</text>
  <text x="284" y="231" font-size="10.5" fill="#555">评论 3 出现两次，只计 1 次</text>

  <path d="M 265 228 L 272 228" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <line x1="40" y1="290" x2="540" y2="290" stroke="#ddd" stroke-width="1" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- ===== 陷阱③：悬空评论 ===== -->
  <text x="40" y="310" font-size="11.5" fill="#b85450" font-weight="bold">③ 悬空评论：parent_id 指向不存在的帖子</text>

  <rect x="40" y="318" width="210" height="112" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="40" y1="342" x2="250" y2="342" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <line x1="125" y1="318" x2="125" y2="430" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="82" y="334" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">sub_id</text>
  <text x="187" y="334" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">parent_id</text>
  <text x="82" y="360" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="187" y="360" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="220" y="360" font-size="9.5" fill="#4a7a3a">评论</text>
  <!-- 不存在的帖子行 -->
  <rect x="42" y="368" width="206" height="28" fill="none" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="82" y="386" text-anchor="middle" font-size="11" fill="#b85450" text-decoration="line-through">7</text>
  <text x="187" y="386" text-anchor="middle" font-size="11" fill="#b85450" text-decoration="line-through">NULL</text>
  <text x="210" y="386" font-size="9" fill="#b85450">不存在</text>
  <text x="145" y="412" text-anchor="middle" font-size="9.5" fill="#b85450">帖子 7 已删除 → 无 parent_id=NULL 的行</text>

  <rect x="270" y="324" width="270" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="284" y="342" font-size="11.5" fill="#d6a040" font-weight="bold">对策：LEFT JOIN 自然过滤</text>
  <text x="284" y="359" font-size="10.5" fill="#555">以帖子为驱动表 JOIN，匹配失败 → 忽略</text>

  <path d="M 265 356 L 272 356" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部总结 -->
  <rect x="40" y="442" width="500" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="457" text-anchor="middle" font-size="10.5" fill="#555">💡 以帖子为驱动表 LEFT JOIN 评论，三陷阱一并解决</text>
</svg>
