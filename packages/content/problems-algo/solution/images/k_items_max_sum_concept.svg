<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：物品按价值分三档，贪心从高到低取</text>

  <!-- ===== 贪心顺序：左侧竖向箭头 ===== -->
  <path d="M 58 116 L 58 256" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="58" y="96" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">先</text>
  <text x="58" y="280" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">后（被迫）</text>
  <text x="40" y="190" font-size="11" fill="#888" transform="rotate(-90 40 190)">贪心选取顺序</text>

  <!-- ===== 第 1 档：+1（最优，绿） ===== -->
  <text x="132" y="100" text-anchor="end" font-size="11.5" fill="#4a7a3a" font-weight="bold">标记 1 × numOnes</text>
  <rect x="150" y="76" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="169" y="101" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="196" y="76" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="215" y="101" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="242" y="76" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="261" y="101" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="296" y="100" font-size="13" fill="#888">……</text>
  <rect x="340" y="76" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="367" y="101" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">+1</text>
  <text x="412" y="100" font-size="11" fill="#888">价值最高，优先取</text>

  <!-- ===== 第 2 档：0（中性，橙） ===== -->
  <text x="132" y="180" text-anchor="end" font-size="11.5" fill="#d6a040" font-weight="bold">标记 0 × numZeros</text>
  <rect x="150" y="156" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="169" y="181" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="196" y="156" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="215" y="181" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <text x="296" y="180" font-size="13" fill="#888">……</text>
  <rect x="340" y="156" width="54" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="367" y="181" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">0</text>
  <text x="412" y="180" font-size="11" fill="#888">不影响和，凑数用</text>

  <!-- ===== 第 3 档：-1（最差，红） ===== -->
  <text x="132" y="260" text-anchor="end" font-size="11.5" fill="#b85450" font-weight="bold">标记 −1 × numNegOnes</text>
  <rect x="150" y="236" width="38" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="169" y="261" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−1</text>
  <rect x="196" y="236" width="38" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="215" y="261" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−1</text>
  <text x="296" y="260" font-size="13" fill="#888">……</text>
  <rect x="340" y="236" width="54" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="367" y="261" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−1</text>
  <text x="412" y="260" font-size="11" fill="#888">价值最差，被迫才取</text>

  <!-- ===== 结论框 ===== -->
  <rect x="36" y="300" width="488" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="52" y="322" font-size="12" fill="#446688" font-weight="bold">贪心结论：</text>
  <text x="52" y="342" font-size="11.5" fill="#333">• k 个名额内：先尽量取 <tspan font-weight="bold" fill="#4a7a3a">+1</tspan>，再取 <tspan font-weight="bold" fill="#d6a040">0</tspan> 凑数，凑不齐才被迫取 <tspan font-weight="bold" fill="#b85450">−1</tspan></text>
  <text x="52" y="358" font-size="11.5" fill="#333">• 和 = <tspan font-weight="bold" fill="#4a7a3a">x₁</tspan> − <tspan font-weight="bold" fill="#b85450">r</tspan>，其中 x₁=min(numOnes,k)，r=max(0, k−numOnes−numZeros)</text>
</svg>
