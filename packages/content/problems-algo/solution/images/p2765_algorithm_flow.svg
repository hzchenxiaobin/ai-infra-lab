<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2765f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：定位 +1 起点 → 贪心延伸 → 跳到断点</text>

  <rect x="210" y="42" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">ans = −1,  i = 0</text>

  <path d="M280,76 L280,98" stroke="#446688" stroke-width="2" marker-end="url(#arr2765f)" filter="url(#rough2)"/>

  <path d="M280,102 L362,144 L280,186 L198,144 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="140" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">i &lt; n−1 ?</text>
  <text x="280" y="156" text-anchor="middle" font-size="11" fill="#d6a040">还能取一对</text>

  <text x="372" y="140" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M362,144 L428,144" stroke="#b85450" stroke-width="2" marker-end="url(#arr2765f)" filter="url(#rough2)"/>
  <rect x="428" y="124" width="120" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="488" y="146" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">返回 ans</text>
  <text x="488" y="160" text-anchor="middle" font-size="10" fill="#446688">（无交替则 −1）</text>

  <text x="290" y="208" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M280,186 L280,210" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr2765f)" filter="url(#rough2)"/>

  <path d="M280,214 L372,256 L280,298 L188,256 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">nums[i+1]−nums[i]</text>
  <text x="280" y="268" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">== 1 ?</text>

  <text x="176" y="252" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M188,256 L168,256" stroke="#b85450" stroke-width="2" marker-end="url(#arr2765f)" filter="url(#rough2)"/>
  <rect x="110" y="240" width="58" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="139" y="261" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">i++</text>
  <path d="M110,256 L72,256" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <text x="290" y="318" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M280,298 L280,322" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr2765f)" filter="url(#rough2)"/>

  <rect x="100" y="326" width="360" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">j = i+1；延伸 j</text>
  <text x="280" y="364" text-anchor="middle" font-size="11" fill="#4a7a3a">while j&lt;n 且 nums[j]==nums[i]+((j−i) mod 2)：j++</text>

  <path d="M280,378 L280,400" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr2765f)" filter="url(#rough2)"/>

  <rect x="140" y="402" width="280" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="421" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans = max(ans, j−i)</text>
  <text x="280" y="437" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">i = j−1  （跳到断点）</text>

  <path d="M140,423 L70,423 L70,144 L196,144" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr2765f)" filter="url(#rough2)"/>
  <text x="40" y="290" font-size="10" fill="#888">回到循环</text>
</svg>
