<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    核心观察：连通块内所有格子共享同一个 R
  </text>

  <!-- 3x3 grid of example 2 -->
  <!-- blocked -->
  <rect x="60" y="78" width="54" height="54" fill="#efefef" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="87" y="110" text-anchor="middle" font-size="16" fill="#999999" filter="url(#rough2)">−1</text>
  <rect x="60" y="136" width="54" height="54" fill="#efefef" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="87" y="168" text-anchor="middle" font-size="16" fill="#999999" filter="url(#rough2)">−1</text>
  <rect x="118" y="136" width="54" height="54" fill="#efefef" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="168" text-anchor="middle" font-size="16" fill="#999999" filter="url(#rough2)">−1</text>
  <rect x="176" y="136" width="54" height="54" fill="#efefef" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="203" y="168" text-anchor="middle" font-size="16" fill="#999999" filter="url(#rough2)">−1</text>
  <rect x="118" y="194" width="54" height="54" fill="#efefef" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="226" text-anchor="middle" font-size="16" fill="#999999" filter="url(#rough2)">−1</text>
  <rect x="176" y="194" width="54" height="54" fill="#efefef" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="203" y="226" text-anchor="middle" font-size="16" fill="#999999" filter="url(#rough2)">−1</text>

  <!-- component A: (0,1)=3, (0,2)=4, blue -->
  <rect x="118" y="78" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="145" y="110" text-anchor="middle" font-size="18" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="176" y="78" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="203" y="110" text-anchor="middle" font-size="18" fill="#446688" filter="url(#rough2)">4</text>

  <!-- component B: (2,0)=3, green -->
  <rect x="60" y="194" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="87" y="226" text-anchor="middle" font-size="18" fill="#4a7a3a" filter="url(#rough2)">3</text>

  <!-- dashed component outlines -->
  <rect x="113" y="72" width="124" height="66" rx="12" fill="none" stroke="#446688"
        stroke-width="1.8" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="175" y="62" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">块 A：s=7, t=2</text>
  <rect x="54" y="188" width="66" height="66" rx="12" fill="none" stroke="#4a7a3a"
        stroke-width="1.8" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="87" y="274" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">块 B：s=3, t=1</text>

  <!-- arrow grid -> panel -->
  <path d="M 232,120 L 292,148" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- right panel -->
  <text x="300" y="72" font-size="13" fill="#333" filter="url(#rough2)">全局统计（示例 2）</text>
  <text x="300" y="94" font-size="12" fill="#666" filter="url(#rough2)">total = 3+4+3 = 10</text>
  <text x="300" y="114" font-size="12" fill="#666" filter="url(#rough2)">cnt = 3（非阻塞格总数）</text>

  <rect x="300" y="130" width="196" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="398" y="155" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">R(块内任一格) = total − s</text>

  <rect x="300" y="186" width="196" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="398" y="211" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">ans = Σ (cnt − t) × s</text>

  <rect x="300" y="240" width="196" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="398" y="264" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">= (3−2)×7 + (3−1)×3</text>
  <text x="398" y="288" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">= 7 + 6 = 13</text>

  <!-- bottom captions -->
  <text x="260" y="322" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">
    「互相可达」是等价关系 → 非阻塞格被切成若干连通块
  </text>
  <text x="260" y="340" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">
    每块一次 flood fill 求出 (s, t)，整块共享同一个 R
  </text>
</svg>
