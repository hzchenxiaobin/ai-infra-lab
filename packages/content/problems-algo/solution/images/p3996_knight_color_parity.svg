<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：棋盘染色——骑士每走一步必换色</text>

  <!-- 坐标轴标签 -->
  <text x="38" y="38" text-anchor="middle" font-size="7" fill="#999" filter="url(#rough2)">0</text>
  <text x="66" y="38" text-anchor="middle" font-size="7" fill="#999" filter="url(#rough2)">1</text>
  <text x="94" y="38" text-anchor="middle" font-size="7" fill="#999" filter="url(#rough2)">2</text>
  <text x="122" y="38" text-anchor="middle" font-size="7" fill="#999" filter="url(#rough2)">3</text>
  <text x="150" y="38" text-anchor="middle" font-size="7" fill="#999" filter="url(#rough2)">4</text>
  <text x="178" y="38" text-anchor="middle" font-size="7" fill="#999" filter="url(#rough2)">5</text>
  <text x="206" y="38" text-anchor="middle" font-size="7" fill="#999" filter="url(#rough2)">6</text>
  <text x="234" y="38" text-anchor="middle" font-size="7" fill="#999" filter="url(#rough2)">7</text>
  <text x="20" y="59" text-anchor="end" font-size="7" fill="#999" filter="url(#rough2)">0</text>
  <text x="20" y="87" text-anchor="end" font-size="7" fill="#999" filter="url(#rough2)">1</text>
  <text x="20" y="115" text-anchor="end" font-size="7" fill="#999" filter="url(#rough2)">2</text>
  <text x="20" y="143" text-anchor="end" font-size="7" fill="#999" filter="url(#rough2)">3</text>
  <text x="20" y="171" text-anchor="end" font-size="7" fill="#999" filter="url(#rough2)">4</text>
  <text x="20" y="199" text-anchor="end" font-size="7" fill="#999" filter="url(#rough2)">5</text>
  <text x="20" y="227" text-anchor="end" font-size="7" fill="#999" filter="url(#rough2)">6</text>
  <text x="20" y="255" text-anchor="end" font-size="7" fill="#999" filter="url(#rough2)">7</text>

  <!-- 棋盘：蓝 = (x+y) 偶，橙 = (x+y) 奇 -->
  <rect x="24" y="42" width="224" height="224" fill="#e8f0fe" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- 橙色格（x+y 为奇） -->
  <rect x="52" y="42" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="108" y="42" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="164" y="42" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="220" y="42" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="24" y="70" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="80" y="70" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="136" y="70" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="192" y="70" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="52" y="98" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="108" y="98" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="164" y="98" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="220" y="98" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="24" y="126" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="80" y="126" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="136" y="126" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="192" y="126" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="52" y="154" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="108" y="154" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="164" y="154" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="220" y="154" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="24" y="182" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="80" y="182" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="136" y="182" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="192" y="182" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="52" y="210" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="108" y="210" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="164" y="210" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="220" y="210" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="24" y="238" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="80" y="238" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="136" y="238" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="192" y="238" width="28" height="28" fill="#fff8e1" filter="url(#rough2)"/>

  <!-- 网格线 -->
  <path d="M 52 42 V 266 M 80 42 V 266 M 108 42 V 266 M 136 42 V 266 M 164 42 V 266 M 192 42 V 266 M 220 42 V 266 M 24 70 H 248 M 24 98 H 248 M 24 126 H 248 M 24 154 H 248 M 24 182 H 248 M 24 210 H 248 M 24 238 H 248" stroke="#aaa" stroke-width="0.8" fill="none" filter="url(#rough2)"/>

  <!-- 8 个落点格描红 + 红点 -->
  <rect x="80" y="70" width="28" height="28" fill="none" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="136" y="70" width="28" height="28" fill="none" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="52" y="98" width="28" height="28" fill="none" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="164" y="98" width="28" height="28" fill="none" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="52" y="154" width="28" height="28" fill="none" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="164" y="154" width="28" height="28" fill="none" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="80" y="182" width="28" height="28" fill="none" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="136" y="182" width="28" height="28" fill="none" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <circle cx="94" cy="84" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="150" cy="84" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="66" cy="112" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="178" cy="112" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="66" cy="168" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="178" cy="168" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="94" cy="224" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="150" cy="224" r="3.5" fill="#b85450" filter="url(#rough2)"/>

  <!-- 骑士一步的 8 条箭头 -->
  <path d="M 122 140 L 82 120" stroke="#b85450" stroke-width="1.1" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 122 140 L 102 100" stroke="#b85450" stroke-width="1.1" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 122 140 L 162 120" stroke="#b85450" stroke-width="1.1" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 122 140 L 142 100" stroke="#b85450" stroke-width="1.1" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 122 140 L 82 160" stroke="#b85450" stroke-width="1.1" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 122 140 L 102 200" stroke="#b85450" stroke-width="1.1" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 122 140 L 162 160" stroke="#b85450" stroke-width="1.1" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 122 140 L 142 200" stroke="#b85450" stroke-width="1.1" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 骑士所在格 (3,3) -->
  <rect x="108" y="126" width="28" height="28" fill="none" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <circle cx="122" cy="140" r="10" fill="#446688" stroke="#2f4a66" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="122" y="144" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold" filter="url(#rough2)">马</text>
  <text x="122" y="121" text-anchor="middle" font-size="7.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">(3,3)</text>

  <!-- 图例 -->
  <rect x="24" y="276" width="13" height="13" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="42" y="286" font-size="8.5" fill="#446688" filter="url(#rough2)">(x+y) 偶</text>
  <rect x="96" y="276" width="13" height="13" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="114" y="286" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">(x+y) 奇</text>
  <circle cx="172" cy="282.5" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="180" y="286" font-size="8.5" fill="#b85450" filter="url(#rough2)">＝落点</text>
  <text x="24" y="304" font-size="8.5" fill="#b85450" filter="url(#rough2)">骑士从 (3,3) 出发的 8 个落点——全部落在奇数（橙）格</text>

  <!-- 右侧观察面板 -->
  <rect x="264" y="42" width="236" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="382" y="60" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">① 一步必换色</text>
  <text x="382" y="78" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">Δx ∈ {±1,±2}，Δy ∈ {±2,±1}</text>
  <text x="382" y="92" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">⇒ Δ(x+y) ∈ {±1, ±3} 全是奇数</text>
  <text x="382" y="106" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">⇒ 每步必翻转 (x+y) 的奇偶</text>

  <rect x="264" y="122" width="236" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="382" y="140" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② 步数被颜色钉死</text>
  <text x="382" y="158" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">走 k 步 ⇒ 换色恰好 k 次</text>
  <text x="382" y="174" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">同色 ⟺ 偶数步，异色 ⟺ 奇数步</text>

  <rect x="264" y="202" width="236" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="382" y="220" text-anchor="middle" font-size="10.5" fill="#7a5c1a" font-weight="bold" filter="url(#rough2)">③ 8×8 棋盘上一定走得到</text>
  <text x="382" y="238" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">骑士图连通（骑士巡游存在）⇒ 任何格子可达</text>
  <text x="382" y="254" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">同色 ⇒ 存在偶数步路径；异色 ⇒ 全是奇数步</text>

  <rect x="264" y="278" width="236" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="382" y="296" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">判据：一次奇偶比较</text>
  <text x="382" y="313" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">(sx+sy) % 2 == (tx+ty) % 2</text>
  <text x="382" y="327" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">start == target：0 步也是偶数 → true</text>

  <text x="260" y="352" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">三观察合一：颜色同 ⇒ true，颜色异 ⇒ false——连循环都不用写</text>
</svg>
