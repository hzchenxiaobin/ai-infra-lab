<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1, 2, 3]，n = 3</text>

  <!-- ===== Left: increment view ===== -->
  <text x="30" y="56" font-size="12" fill="#446688" font-weight="bold">视角 A：n−1 个 +1（原始操作）</text>

  <!-- step 0 -->
  <text x="30" y="80" font-size="10" fill="#888">初始</text>
  <rect x="70" y="64" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="108" y="64" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="146" y="64" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <path d="M 192 79 L 222 79" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="207" y="72" text-anchor="middle" font-size="9" fill="#888">步1</text>

  <!-- step 1 -->
  <rect x="70" y="100" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="88" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="108" y="100" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="126" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="146" y="100" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="164" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="192" y="116" font-size="9.5" fill="#4a7a3a">3 不动</text>

  <path d="M 192 115 L 222 115" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="207" y="108" text-anchor="middle" font-size="9" fill="#888">步2</text>

  <!-- step 2 -->
  <rect x="70" y="136" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="88" y="156" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="108" y="136" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="126" y="156" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="146" y="136" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="164" y="156" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="192" y="152" font-size="9.5" fill="#4a7a3a">4 不动</text>

  <path d="M 192 151 L 222 151" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="207" y="144" text-anchor="middle" font-size="9" fill="#888">步3</text>

  <!-- step 3 -->
  <rect x="70" y="172" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="192" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>
  <rect x="108" y="172" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="192" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>
  <rect x="146" y="172" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="192" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>
  <text x="192" y="188" font-size="9.5" fill="#d6a040">相等！</text>

  <!-- divider -->
  <path d="M 280 48 L 280 400" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- ===== Right: decrement view ===== -->
  <text x="300" y="56" font-size="12" fill="#446688" font-weight="bold">视角 B：1 个 −1（等价操作）</text>

  <!-- initial -->
  <text x="300" y="80" font-size="10" fill="#888">初始：min = 1</text>
  <rect x="360" y="64" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="378" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="398" y="64" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="416" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="436" y="64" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="454" y="84" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="482" y="80" font-size="9.5" fill="#b85450">需降 2</text>

  <!-- reduce 3 -> 2 -->
  <path d="M 454 96 L 454 110" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="466" y="106" font-size="9" fill="#b85450">−1</text>

  <rect x="360" y="114" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="378" y="134" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="398" y="114" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="416" y="134" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="436" y="114" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="454" y="134" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="482" y="130" font-size="9.5" fill="#b85450">需降 1</text>

  <!-- reduce 3->2 again (now the second 2) -->
  <path d="M 454 146 L 454 160" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="466" y="156" font-size="9" fill="#b85450">−1</text>

  <rect x="360" y="164" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="378" y="184" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="398" y="164" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="416" y="184" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="436" y="164" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="454" y="184" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="482" y="180" font-size="9.5" fill="#b85450">需降 0</text>

  <!-- reduce the middle 2 -> 1 -->
  <path d="M 416 196 L 416 210" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="428" y="206" font-size="9" fill="#d6a040">−1</text>

  <rect x="360" y="214" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="378" y="234" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="398" y="214" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="416" y="234" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="436" y="214" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="454" y="234" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="482" y="230" font-size="9.5" fill="#d6a040">相等！</text>

  <!-- ===== Bottom: formula ===== -->
  <rect x="30" y="300" width="500" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">公式验证</text>

  <text x="50" y="348" font-size="11.5" fill="#333">sum(nums) = 1 + 2 + 3 = 6</text>
  <text x="50" y="368" font-size="11.5" fill="#333">n = 3，　min(nums) = 1</text>
  <text x="50" y="388" font-size="11.5" fill="#333">n × min = 3 × 1 = 3</text>

  <text x="300" y="368" font-size="14" fill="#b85450" font-weight="bold">moves = 6 − 3 = 3</text>
  <text x="300" y="390" font-size="10.5" fill="#555">两种视角结果一致 ✓</text>

  <text x="50" y="410" font-size="10" fill="#888">视角 B 的每步「降 1」对应视角 A 的一步「n−1 个 +1」</text>
</svg>
