<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：A = [16, 33]，B = [4, 18]，k = 15，j 从 0 出发</text>

  <!-- table header -->
  <rect x="40" y="48" width="36" height="60" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="58" y="73" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">步</text>
  <text x="58" y="91" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">骤</text>

  <rect x="76" y="48" width="52" height="60" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="102" y="73" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="102" y="91" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(∈ A)</text>

  <rect x="128" y="48" width="104" height="60" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="180" y="68" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">窗口</text>
  <text x="180" y="86" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">[i−k, i+k]</text>
  <text x="180" y="101" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">出窗者淘汰</text>

  <rect x="232" y="48" width="150" height="60" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="307" y="68" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">j 的走位</text>
  <text x="307" y="86" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">while B[j] &lt; i−k:</text>
  <text x="307" y="100" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j++（只进不退）</text>

  <rect x="382" y="48" width="98" height="60" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="431" y="68" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">判定</text>
  <text x="431" y="86" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">B[j] ≤ i+k ?</text>
  <text x="431" y="101" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">是 → i 入 ans</text>

  <!-- row 1 -->
  <rect x="40" y="112" width="36" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="58" y="144" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="76" y="112" width="52" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="102" y="144" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">16</text>
  <rect x="128" y="112" width="104" height="56" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="180" y="144" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">[1, 31]</text>
  <rect x="232" y="112" width="150" height="56" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="307" y="133" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">B[0]=4 ≥ 1 → 不动</text>
  <text x="307" y="151" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">j 停在 0</text>
  <rect x="382" y="112" width="98" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="431" y="134" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4 ≤ 31 ✓</text>
  <text x="431" y="153" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans=[16]</text>

  <!-- row 2 -->
  <rect x="40" y="172" width="36" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="58" y="204" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="76" y="172" width="52" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="102" y="204" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">33</text>
  <rect x="128" y="172" width="104" height="56" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="180" y="204" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">[18, 48]</text>
  <rect x="232" y="172" width="150" height="56" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="307" y="193" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">B[0]=4 &lt; 18 → j=1</text>
  <text x="307" y="211" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B[1]=18 ≥ 18 → 停</text>
  <rect x="382" y="172" width="98" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="431" y="194" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">18 ≤ 48 ✓</text>
  <text x="431" y="213" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans=[16,33]</text>

  <!-- bottom notes -->
  <rect x="40" y="244" width="440" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="56" y="268" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">· 两个 B 都落在 i=16 的窗内也没关系——只要窗口左端在推着 j 单调右移就够了；</text>
  <text x="56" y="290" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">· 第 2 步的 4 被「B[j] &lt; i−k」淘汰后永远不会再回来：后面的 i 更大，i−k 也更大；</text>
  <text x="56" y="312" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">· 所以 j 在整趟扫描里总共只前进了 |B| 步 → 合并判定 O(|A|+|B|)。</text>
</svg>
