<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="4" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.1"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="720" height="440" fill="#fdfcf7"/>

  <!-- Title -->
  <text x="360" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">填充书架：示例演算（books 7 本, shelfWidth=4）</text>
  <path d="M 210 34 Q 360 42 510 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Section 1: dp table ===== -->
  <text x="60" y="62" font-size="12" font-weight="bold" fill="#5a3a7a">① dp 填表</text>

  <!-- header row -->
  <g font-size="10" fill="#666">
    <text x="130" y="80" text-anchor="middle">dp[0]</text>
    <text x="186" y="80" text-anchor="middle">dp[1]</text>
    <text x="242" y="80" text-anchor="middle">dp[2]</text>
    <text x="298" y="80" text-anchor="middle">dp[3]</text>
    <text x="354" y="80" text-anchor="middle">dp[4]</text>
    <text x="410" y="80" text-anchor="middle">dp[5]</text>
    <text x="466" y="80" text-anchor="middle">dp[6]</text>
    <text x="522" y="80" text-anchor="middle">dp[7]</text>
  </g>

  <!-- value cells -->
  <g font-size="12">
    <g filter="url(#sk2)"><rect x="104" y="86" width="52" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
    <text x="130" y="105" text-anchor="middle" fill="#2e6e2e" font-weight="bold">0</text>

    <g filter="url(#sk2)"><rect x="160" y="86" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1"/></g>
    <text x="186" y="105" text-anchor="middle" fill="#2b6e9e">1</text>

    <g filter="url(#sk2)"><rect x="216" y="86" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1"/></g>
    <text x="242" y="105" text-anchor="middle" fill="#2b6e9e">3</text>

    <g filter="url(#sk2)"><rect x="272" y="86" width="52" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
    <text x="298" y="105" text-anchor="middle" fill="#8a6a1a" font-weight="bold">4</text>

    <g filter="url(#sk2)"><rect x="328" y="86" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1"/></g>
    <text x="354" y="105" text-anchor="middle" fill="#2b6e9e">5</text>

    <g filter="url(#sk2)"><rect x="384" y="86" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1"/></g>
    <text x="410" y="105" text-anchor="middle" fill="#2b6e9e">5</text>

    <g filter="url(#sk2)"><rect x="440" y="86" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1"/></g>
    <text x="466" y="105" text-anchor="middle" fill="#2b6e9e">5</text>

    <g filter="url(#sk2)"><rect x="496" y="86" width="52" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
    <text x="522" y="105" text-anchor="middle" fill="#b03a3a" font-weight="bold">6</text>
  </g>

  <!-- annotations under key cells -->
  <text x="298" y="128" text-anchor="middle" font-size="9" fill="#8a6a1a">书1,2同层</text>
  <text x="522" y="128" text-anchor="middle" font-size="9" fill="#b03a3a">书3-6同层 ✓</text>
  <path d="M 298 114 L 298 118" stroke="#d6a040" stroke-width="1" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 522 114 L 522 118" stroke="#b85450" stroke-width="1" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Section 2: shelf layout ===== -->
  <text x="60" y="158" font-size="12" font-weight="bold" fill="#5a3a7a">② 最优书架布局（3 层，总高 6）</text>

  <!-- Shelf 1 line -->
  <path d="M 92 230 L 142 230" stroke="#888" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <!-- book 0: t=1,h=1 -->
  <g filter="url(#sk2)"><rect x="100" y="206" width="36" height="24" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="118" y="221" text-anchor="middle" font-size="9" fill="#333">0</text>
  <text x="118" y="200" text-anchor="middle" font-size="8" fill="#888">h1</text>

  <!-- Shelf 2 line -->
  <path d="M 92 290 L 252 290" stroke="#888" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <!-- book 1: t=2,h=3 -->
  <g filter="url(#sk2)"><rect x="100" y="218" width="72" height="72" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="136" y="258" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="136" y="212" text-anchor="middle" font-size="8" fill="#888">h3</text>
  <!-- book 2: t=2,h=3 -->
  <g filter="url(#sk2)"><rect x="172" y="218" width="72" height="72" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="208" y="258" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="208" y="212" text-anchor="middle" font-size="8" fill="#888">h3</text>

  <!-- Shelf 3 line -->
  <path d="M 92 360 L 252 360" stroke="#888" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <!-- book 3: t=1,h=1 -->
  <g filter="url(#sk2)"><rect x="100" y="336" width="36" height="24" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="118" y="351" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="118" y="330" text-anchor="middle" font-size="8" fill="#888">h1</text>
  <!-- book 4: t=1,h=1 -->
  <g filter="url(#sk2)"><rect x="136" y="336" width="36" height="24" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="154" y="351" text-anchor="middle" font-size="9" fill="#333">4</text>
  <text x="154" y="330" text-anchor="middle" font-size="8" fill="#888">h1</text>
  <!-- book 5: t=1,h=1 -->
  <g filter="url(#sk2)"><rect x="172" y="336" width="36" height="24" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="190" y="351" text-anchor="middle" font-size="9" fill="#333">5</text>
  <text x="190" y="330" text-anchor="middle" font-size="8" fill="#888">h1</text>
  <!-- book 6: t=1,h=2 -->
  <g filter="url(#sk2)"><rect x="208" y="312" width="36" height="48" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="226" y="340" text-anchor="middle" font-size="9" fill="#333">6</text>
  <text x="226" y="306" text-anchor="middle" font-size="8" fill="#888">h2</text>

  <!-- shelfWidth bracket on shelf 3 -->
  <path d="M 100 372 L 100 378 L 244 378 L 244 372" stroke="#888" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="172" y="392" text-anchor="middle" font-size="9" fill="#888">厚度 1+1+1+1 = 4 ≤ shelfWidth</text>

  <!-- Right side: layer height labels -->
  <g font-size="11">
    <g filter="url(#sk)"><rect x="300" y="206" width="120" height="28" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
    <text x="360" y="225" text-anchor="middle" fill="#2e6e2e" font-weight="bold">第1层 层高=1</text>

    <g filter="url(#sk)"><rect x="300" y="252" width="120" height="28" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
    <text x="360" y="271" text-anchor="middle" fill="#8a6a1a" font-weight="bold">第2层 层高=3</text>

    <g filter="url(#sk)"><rect x="300" y="324" width="120" height="28" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
    <text x="360" y="343" text-anchor="middle" fill="#8a6a1a" font-weight="bold">第3层 层高=2</text>
  </g>

  <!-- connecting lines from shelves to labels -->
  <path d="M 142 218 L 300 220" stroke="#4a8e4a" stroke-width="1" stroke-dasharray="3 2" fill="none" filter="url(#sk)"/>
  <path d="M 244 254 L 300 266" stroke="#d6a040" stroke-width="1" stroke-dasharray="3 2" fill="none" filter="url(#sk)"/>
  <path d="M 244 336 L 300 338" stroke="#d6a040" stroke-width="1" stroke-dasharray="3 2" fill="none" filter="url(#sk)"/>

  <!-- Summary box -->
  <g filter="url(#sk)"><rect x="460" y="300" width="220" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="570" y="324" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">总高 = 1 + 3 + 2</text>
  <text x="570" y="344" text-anchor="middle" font-size="15" fill="#b03a3a" font-weight="bold">= 6 ✓</text>

  <!-- bottom note -->
  <text x="360" y="420" text-anchor="middle" font-size="10" fill="#666">关键：第 0 本书独占一层（高1），让第1、2本高书凑一层 → 贪心放满会得 7，DP 找到全局最优 6</text>
</svg>
