<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心概念：容量受限的排队模拟</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">乘客累积入队 → 公交按 min(cap, 等待数) 接走 → 剩余继续等候</text>

  <!-- ===== Section 1: Timeline ===== -->
  <text x="36" y="72" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 事件时间线</text>

  <!-- Timeline arrow -->
  <path d="M 50 110 L 520 110" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="528" y="114" font-size="10" fill="#446688" filter="url(#rough2)">t</text>

  <!-- t=1: P11, P12 -->
  <circle cx="90" cy="110" r="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="100" cy="110" r="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="96" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">P11,P12</text>
  <text x="95" y="128" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">t=1</text>

  <!-- t=2: Bus 1 cap=1 -->
  <rect x="140" y="96" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="114" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">Bus1</text>
  <text x="160" y="142" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">cap=1</text>
  <text x="160" y="88" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">取1</text>

  <!-- t=4: Bus 2 cap=10 -->
  <rect x="215" y="96" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="235" y="114" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">Bus2</text>
  <text x="235" y="142" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">cap=10</text>
  <text x="235" y="88" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">取1</text>

  <!-- t=5: P13 -->
  <circle cx="305" cy="110" r="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="305" y="96" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">P13</text>
  <text x="305" y="128" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">t=5</text>

  <!-- t=6: P14 -->
  <circle cx="365" cy="110" r="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="365" y="96" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">P14</text>
  <text x="365" y="128" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">t=6</text>

  <!-- t=7: P15 + Bus3 -->
  <circle cx="425" cy="110" r="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="425" y="96" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">P15</text>
  <rect x="455" y="96" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="475" y="114" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">Bus3</text>
  <text x="475" y="142" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">cap=2</text>
  <text x="475" y="88" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">取2</text>

  <!-- divider -->
  <path d="M 30 156 L 530 156" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Section 2: Queue bars ===== -->
  <text x="36" y="174" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 等待队列变化（绿色=入队，橙色=上车，红色=溢出剩余）</text>

  <!-- Baseline -->
  <path d="M 50 280 L 520 280" stroke="#999" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Queue bars: 2, 1, 0, 1, 2, 3, 1 -->
  <!-- After P11,P12: queue=2 -->
  <rect x="80" y="240" width="30" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="95" y="234" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="95" y="296" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">入队+2</text>

  <!-- After Bus1: queue=1 -->
  <rect x="145" y="260" width="30" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="160" y="254" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="160" y="296" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">取1</text>

  <!-- After Bus2: queue=0 -->
  <rect x="220" y="278" width="30" height="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="235" y="272" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="235" y="296" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">取1</text>

  <!-- After P13: queue=1 -->
  <rect x="290" y="260" width="30" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="305" y="254" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="305" y="296" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">入队+1</text>

  <!-- After P14: queue=2 -->
  <rect x="350" y="240" width="30" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="365" y="234" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="365" y="296" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">入队+1</text>

  <!-- After P15: queue=3 -->
  <rect x="410" y="220" width="30" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="425" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="425" y="296" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">入队+1</text>

  <!-- After Bus3: queue=1 (remaining, red) -->
  <rect x="460" y="260" width="30" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="475" y="254" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="475" y="296" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">取2,剩1</text>

  <!-- divider -->
  <path d="M 30 312 L 530 312" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Section 3: Key insight ===== -->
  <rect x="60" y="324" width="440" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">picked = min(capacity, waiting_before)</text>
  <text x="280" y="364" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">remaining = max(0, waiting_before − capacity)</text>
  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">⚠️ 与 2142 区别：容量限制 → 超出部分溢出到下一辆车</text>
</svg>
