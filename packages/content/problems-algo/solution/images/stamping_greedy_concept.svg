<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">贪心放满：在每个“可放”位置都贴邮票</text>

  <!-- Grid 5x4, origin (44,76), cell 38 -->
  <!-- occupied col0 -->
  <g filter="url(#rough2)">
    <rect x="44" y="76" width="38" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <rect x="44" y="114" width="38" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <rect x="44" y="152" width="38" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <rect x="44" y="190" width="38" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <rect x="44" y="228" width="38" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <!-- empty cells cols1-3 -->
    <rect x="82" y="76" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="120" y="76" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="158" y="76" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="82" y="114" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="120" y="114" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="158" y="114" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="82" y="152" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="120" y="152" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="158" y="152" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="82" y="190" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="120" y="190" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="158" y="190" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="82" y="228" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="120" y="228" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="158" y="228" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
  </g>

  <!-- occupied marks "1" -->
  <g filter="url(#rough2)" font-size="14" fill="#b85450" text-anchor="middle">
    <text x="63" y="100">1</text>
    <text x="63" y="138">1</text>
    <text x="63" y="176">1</text>
    <text x="63" y="214">1</text>
    <text x="63" y="252">1</text>
  </g>

  <!-- Stamp1 at (0,1): rows0-3 cols1-3 -> rect (82,76) w114 h152 -->
  <rect x="80" y="74" width="118" height="156" fill="none" stroke="#4a7a3a" stroke-width="2.4"
        stroke-dasharray="7 4" rx="5" filter="url(#rough2)"/>
  <text x="139" y="70" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">邮票① 4×3</text>

  <!-- Stamp2 at (1,1): rows1-4 cols1-3 -> rect (82,114) w114 h152 -->
  <rect x="84" y="116" width="118" height="156" fill="none" stroke="#d6a040" stroke-width="2.4"
        stroke-dasharray="7 4" rx="5" filter="url(#rough2)"/>
  <text x="220" y="300" font-size="12" fill="#d6a040" filter="url(#rough2)">邮票② 4×3（与①重叠）</text>
  <path d="M200,295 Q170,280 150,250" fill="none" stroke="#d6a040" stroke-width="1.4"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- row/col labels -->
  <g filter="url(#rough2)" font-size="10" fill="#888" text-anchor="middle">
    <text x="63" y="68">c0</text>
    <text x="101" y="68">c1</text>
    <text x="139" y="68">c2</text>
    <text x="177" y="68">c3</text>
    <text x="34" y="98">r0</text>
    <text x="34" y="136">r1</text>
    <text x="34" y="174">r2</text>
    <text x="34" y="212">r3</text>
    <text x="34" y="250">r4</text>
  </g>

  <!-- Right side annotations -->
  <g filter="url(#rough2)">
    <rect x="250" y="92" width="290" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="262" y="116" font-size="13" fill="#2b2b2b">✓ 能放就放：矩形 H×W 内无占据格</text>
    <text x="262" y="138" font-size="13" fill="#2b2b2b">   ⟹ sum = pre 四角容斥 = 0</text>
    <text x="262" y="160" font-size="13" fill="#2b2b2b">✓ 多放只增空格覆盖，绝不压占据格</text>

    <rect x="250" y="200" width="290" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="262" y="224" font-size="13" fill="#2b2b2b">关键：覆盖能力 ≥ 任何合法方案</text>
    <text x="262" y="246" font-size="13" fill="#2b2b2b">故 存在合法方案 ⟺ 放满后空格全覆盖</text>

    <rect x="250" y="290" width="290" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="262" y="314" font-size="13" fill="#2b2b2b">最后遍历空格：coverage==0 ?</text>
    <text x="262" y="336" font-size="13" fill="#b85450">   有未覆盖 → false，否则 true</text>
  </g>
</svg>
