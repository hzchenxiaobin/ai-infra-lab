<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：山峰形数组使 nums[index]=x 时总和最小</text>

  <!-- ===== Mountain shape array ===== -->
  <text x="40" y="54" font-size="12" fill="#888">山峰形数组 (peak = x at index):</text>

  <!-- baseline -->
  <line x1="60" y1="200" x2="420" y2="200" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- index marker -->
  <line x1="240" y1="56" x2="240" y2="200" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="240" y="50" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">index</text>

  <!-- bars: left side descending from x-1, peak x, right side descending from x-1 -->
  <!-- left: positions at x=100,140,180 (3 left of index), values 2,3,4 (climbing up to peak=5) -->
  <!-- peak at x=220, value 5 -->
  <!-- right: positions at x=260,300,340,380 (4 right), values 4,3,2,1 -->

  <!-- left bar val=2 (x-3) -->
  <rect x="92" y="170" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="190" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- left bar val=3 (x-2) -->
  <rect x="140" y="140" width="36" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="175" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <!-- left bar val=4 (x-1) -->
  <rect x="188" y="110" width="36" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="206" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <!-- peak bar val=5 (x) -->
  <rect x="222" y="80" width="36" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="145" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="240" y="72" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">x = 5</text>

  <!-- right bar val=4 (x-1) -->
  <rect x="262" y="110" width="36" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <!-- right bar val=3 (x-2) -->
  <rect x="310" y="140" width="36" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="328" y="175" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <!-- right bar val=2 (x-3) -->
  <rect x="358" y="170" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="190" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- right bar val=1 (floor) -->
  <rect x="406" y="185" width="36" height="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="424" y="198" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>

  <!-- index labels -->
  <text x="110" y="216" text-anchor="middle" font-size="9" fill="#999">0</text>
  <text x="158" y="216" text-anchor="middle" font-size="9" fill="#999">1</text>
  <text x="206" y="216" text-anchor="middle" font-size="9" fill="#999">2</text>
  <text x="240" y="216" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">3</text>
  <text x="280" y="216" text-anchor="middle" font-size="9" fill="#999">4</text>
  <text x="328" y="216" text-anchor="middle" font-size="9" fill="#999">5</text>
  <text x="376" y="216" text-anchor="middle" font-size="9" fill="#999">6</text>
  <text x="424" y="216" text-anchor="middle" font-size="9" fill="#999">7</text>

  <!-- arrows showing descent direction -->
  <text x="150" y="100" font-size="10" fill="#446688">↗ +1</text>
  <text x="330" y="100" font-size="10" fill="#4a7a3a">↘ −1</text>

  <!-- ===== Key insight box ===== -->
  <rect x="40" y="238" width="480" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">关键贪心：固定 nums[index] = x 时，左右两侧每步减 1 直到 1</text>
  <text x="280" y="282" text-anchor="middle" font-size="11" fill="#555">→ 元素尽可能小 → 总和最小 → x 能取到的最大值最大</text>
  <text x="280" y="296" text-anchor="middle" font-size="10" fill="#888">（每个元素 ≥ 1，故减到 1 后保持 1 不再降）</text>

  <!-- ===== Sum formula box ===== -->
  <rect x="40" y="314" width="480" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="12" fill="#5a4a1a" font-weight="bold">一侧的最小和（cnt 个位置，起点 x−1，逐 −1 到 1）</text>
  <text x="70" y="358" font-size="11" fill="#333">cnt ≤ x−1：</text>
  <text x="170" y="358" font-size="11" fill="#446688" font-weight="bold">cnt·x − cnt(cnt+1)/2</text>
  <text x="340" y="358" font-size="10" fill="#888">(等差数列 x−1, x−2, …, x−cnt)</text>
  <text x="70" y="378" font-size="11" fill="#333">cnt &gt; x−1：</text>
  <text x="170" y="378" font-size="11" fill="#4a7a3a" font-weight="bold">(x−1)·x/2 + (cnt−x+1)</text>
  <text x="340" y="378" font-size="10" fill="#888">(降到 1 后余下全填 1)</text>
</svg>
