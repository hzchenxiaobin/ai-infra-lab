<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：k−1 个切分首元素必落在某个长度 dist+1 的窗口里</text>

  <!-- window bracket over indices 2..5 (dist+1 = 4 格) -->
  <rect x="156" y="60" width="208" height="92" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6,3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="52" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">窗口 [L, L+dist]（长度 dist+1）</text>

  <!-- 必选 label for nums[0] -->
  <text x="82" y="78" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">必选</text>

  <!-- nums row, indices 0..5 : 1,3,2,6,4,2 -->
  <rect x="60" y="88" width="44" height="40" fill="#fff8e1" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="114" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="82" y="144" text-anchor="middle" font-size="10" fill="#888">0</text>

  <rect x="110" y="88" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="132" y="114" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="132" y="144" text-anchor="middle" font-size="10" fill="#888">1</text>

  <rect x="160" y="88" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="114" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="182" y="144" text-anchor="middle" font-size="10" fill="#888">2</text>

  <rect x="210" y="88" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="232" y="114" text-anchor="middle" font-size="14" fill="#333">6</text>
  <text x="232" y="144" text-anchor="middle" font-size="10" fill="#888">3</text>

  <rect x="260" y="88" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="282" y="114" text-anchor="middle" font-size="14" fill="#333">4</text>
  <text x="282" y="144" text-anchor="middle" font-size="10" fill="#888">4</text>

  <rect x="310" y="88" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="114" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="332" y="144" text-anchor="middle" font-size="10" fill="#888">5</text>

  <!-- chosen markers -->
  <text x="182" y="172" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">↑选中</text>
  <text x="332" y="172" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">↑选中</text>

  <!-- slide arrow -->
  <path d="M 380 108 L 488 108" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="434" y="100" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">窗口滑动 →</text>
  <text x="434" y="124" text-anchor="middle" font-size="10" fill="#888">L: 1 … n−1−dist</text>

  <!-- formula note box -->
  <rect x="40" y="200" width="480" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="224" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">代价 = nums[0] + 窗口内 k−1 个最小元素之和</text>
  <text x="280" y="244" text-anchor="middle" font-size="11" fill="#666">约束：末切点 − 首切点 ≤ dist  ⟺  选中的 k−1 个下标全在某个长 dist+1 的窗口里</text>
  <text x="280" y="260" text-anchor="middle" font-size="10" fill="#888">→ 滑动窗口逐位置维护「k−1 最小之和」，取最小即为答案</text>

  <!-- why dist+1 -->
  <rect x="40" y="288" width="480" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">为什么窗口长度恰是 dist+1？</text>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#666">末切点 − 首切点 ≤ dist 意味着 [首切点, 末切点] 至多覆盖 dist+1 个下标</text>
  <text x="280" y="350" text-anchor="middle" font-size="10" fill="#888">枚举左端 L ∈ [1, n−1−dist]，窗口 [L, L+dist] 恰好 dist+1 格，覆盖一切合法选法</text>
</svg>
