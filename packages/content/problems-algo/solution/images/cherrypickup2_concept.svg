<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：两机器人同步下移 → 恒在同一行 → 状态降维 (i, j₁, j₂)</text>

  <!-- ===== Left: grid with two robot paths ===== -->
  <text x="125" y="54" text-anchor="middle" font-size="12" fill="#888">grid（示例 1，4×3）</text>

  <!-- row 0: 3, 1, 1 -->
  <rect x="50" y="64" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="89" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="100" y="64" width="50" height="38" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="89" text-anchor="middle" font-size="14" fill="#999">1</text>
  <rect x="150" y="64" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="89" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- row 1: 2, 5, 1 -->
  <rect x="50" y="102" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="127" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="100" y="102" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="127" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="150" y="102" width="50" height="38" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="127" text-anchor="middle" font-size="14" fill="#999">1</text>

  <!-- row 2: 1, 5, 5 -->
  <rect x="50" y="140" width="50" height="38" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="165" text-anchor="middle" font-size="14" fill="#999">1</text>
  <rect x="100" y="140" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="165" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="150" y="140" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="165" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>

  <!-- row 3: 2, 1, 1 -->
  <rect x="50" y="178" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="203" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="100" y="178" width="50" height="38" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="203" text-anchor="middle" font-size="14" fill="#999">1</text>
  <rect x="150" y="178" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="203" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- R1 path arrows (green): (0,0)->(1,0)->(2,1)->(3,0) -->
  <path d="M 75 96 L 75 118" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 80 136 L 120 156" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 120 174 L 80 194" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- R2 path arrows (blue): (0,2)->(1,1)->(2,2)->(3,2) -->
  <path d="M 170 96 L 130 118" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 130 136 L 170 156" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 175 174 L 175 194" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- robot labels -->
  <text x="75" y="58" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">R1起</text>
  <text x="175" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">R2起</text>

  <!-- row labels -->
  <text x="40" y="89" text-anchor="end" font-size="10" fill="#888">i=0</text>
  <text x="40" y="127" text-anchor="end" font-size="10" fill="#888">i=1</text>
  <text x="40" y="165" text-anchor="end" font-size="10" fill="#888">i=2</text>
  <text x="40" y="203" text-anchor="end" font-size="10" fill="#888">i=3</text>

  <!-- same row annotations -->
  <text x="212" y="127" font-size="9.5" fill="#b85450" font-weight="bold">同行</text>
  <text x="212" y="165" font-size="9.5" fill="#b85450" font-weight="bold">同行</text>
  <text x="212" y="89" font-size="9.5" fill="#b85450" font-weight="bold">同行</text>
  <text x="212" y="203" font-size="9.5" fill="#b85450" font-weight="bold">同行</text>

  <!-- path sums -->
  <rect x="40" y="230" width="170" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="125" y="248" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">R1: 3+2+5+2 = 12</text>
  <text x="125" y="263" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">R2: 1+5+5+1 = 12 → 共 24</text>

  <!-- ===== Right: state reduction ===== -->
  <text x="410" y="54" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">状态降维</text>

  <!-- 4D state -->
  <rect x="300" y="64" width="200" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="84" text-anchor="middle" font-size="11.5" fill="#333">朴素：(i₁, j₁, i₂, j₂) — 4 维</text>

  <!-- arrow down -->
  <path d="M 400 98 L 400 116" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="112" font-size="10" fill="#888">同步下移 i₁≡i₂</text>

  <!-- 3D state -->
  <rect x="300" y="120" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="400" y="140" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[i][j₁][j₂] — 3 维</text>

  <!-- 9 predecessors -->
  <text x="400" y="172" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">9 种前驱（3×3 组合）</text>

  <!-- 3x3 grid: pj1 rows, pj2 cols -->
  <!-- cells 30x22, origin x=345, y=180 -->
  <rect x="345" y="180" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="375" y="180" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="405" y="180" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="345" y="202" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="375" y="202" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="405" y="202" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="345" y="224" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="375" y="224" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="405" y="224" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>

  <text x="330" y="195" text-anchor="end" font-size="9" fill="#888">j₁−1</text>
  <text x="330" y="217" text-anchor="end" font-size="9" fill="#888">j₁</text>
  <text x="330" y="239" text-anchor="end" font-size="9" fill="#888">j₁+1</text>
  <text x="360" y="175" text-anchor="middle" font-size="9" fill="#888">j₂−1</text>
  <text x="390" y="175" text-anchor="middle" font-size="9" fill="#888">j₂</text>
  <text x="420" y="175" text-anchor="middle" font-size="9" fill="#888">j₂+1</text>

  <text x="400" y="262" text-anchor="middle" font-size="10" fill="#888">每个机器人 3 种来路 → 取 max</text>

  <!-- dedup note -->
  <rect x="300" y="274" width="200" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="293" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">去重：j₁ == j₂ 时</text>
  <text x="400" y="309" text-anchor="middle" font-size="11" fill="#555">grid[i][j₁] 只算一次</text>

  <!-- ===== Bottom: recurrence ===== -->
  <rect x="30" y="330" width="520" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="290" y="352" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">状态转移方程</text>
  <text x="290" y="372" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">dp[i][j₁][j₂] = max(dp[i−1][pj₁][pj₂]) + grid[i][j₁] + (j₁ ≠ j₂ ? grid[i][j₂] : 0)</text>
  <text x="290" y="390" text-anchor="middle" font-size="10" fill="#888">pj₁ ∈ {j₁−1, j₁, j₁+1}, pj₂ ∈ {j₂−1, j₂, j₂+1}，共 9 种前驱取最大</text>
</svg>
