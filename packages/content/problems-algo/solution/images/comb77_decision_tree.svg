<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrN" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">组合回溯树（n=4, k=2）：start 索引循环，只收集长度=k 的叶子</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">每层从 start 往后选；path.size()==k 时收集；剩余不足时剪枝</text>

  <!-- ===== Tree ===== -->
  <g font-size="11" filter="url(#rough2)">
    <!-- Layer labels -->
    <text x="28" y="83" font-size="10" fill="#888" font-weight="bold">depth 0</text>
    <text x="28" y="163" font-size="10" fill="#888" font-weight="bold">depth 1</text>
    <text x="28" y="263" font-size="10" fill="#888" font-weight="bold">depth 2</text>

    <!-- Root: path=[], start=1 -->
    <rect x="290" y="65" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="330" y="84" text-anchor="middle" fill="#446688" font-weight="bold">[] start=1</text>

    <!-- Layer 1 -->
    <!-- [1] start=2 -->
    <rect x="105" y="145" width="70" height="28" fill="#f5f5f5" stroke="#888" stroke-width="1.4" rx="6"/>
    <text x="140" y="164" text-anchor="middle" fill="#555" font-weight="bold">[1]</text>
    <!-- [2] start=3 -->
    <rect x="255" y="145" width="70" height="28" fill="#f5f5f5" stroke="#888" stroke-width="1.4" rx="6"/>
    <text x="290" y="164" text-anchor="middle" fill="#555" font-weight="bold">[2]</text>
    <!-- [3] start=4 -->
    <rect x="405" y="145" width="70" height="28" fill="#f5f5f5" stroke="#888" stroke-width="1.4" rx="6"/>
    <text x="440" y="164" text-anchor="middle" fill="#555" font-weight="bold">[3]</text>
    <!-- [4] start=5 — PRUNED -->
    <rect x="525" y="145" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" rx="6"/>
    <text x="560" y="164" text-anchor="middle" fill="#b85450" font-weight="bold">[4] ✂</text>

    <!-- Layer 2: collected leaves (green) -->
    <rect x="25" y="245" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="60" y="264" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[1,2] ✓</text>

    <rect x="105" y="245" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="140" y="264" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[1,3] ✓</text>

    <rect x="185" y="245" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="220" y="264" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[1,4] ✓</text>

    <rect x="255" y="245" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="290" y="264" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[2,3] ✓</text>

    <rect x="335" y="245" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="370" y="264" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[2,4] ✓</text>

    <rect x="405" y="245" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="440" y="264" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[3,4] ✓</text>

    <!-- edges: root → L1 -->
    <path d="M 310 93 L 145 145" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arrN)"/>
    <path d="M 325 93 L 290 145" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arrN)"/>
    <path d="M 345 93 L 430 145" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arrN)"/>
    <path d="M 360 93 L 555 145" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arrR)"/>
    <text x="110" y="120" font-size="9" fill="#888" font-weight="bold">i=1</text>
    <text x="262" y="120" font-size="9" fill="#888" font-weight="bold">i=2</text>
    <text x="400" y="120" font-size="9" fill="#888" font-weight="bold">i=3</text>
    <text x="510" y="120" font-size="9" fill="#b85450" font-weight="bold">i=4 剪枝</text>

    <!-- edges: [1] → leaves -->
    <path d="M 125 173 L 65 245" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)"/>
    <path d="M 140 173 L 140 245" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)"/>
    <path d="M 155 173 L 215 245" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)"/>
    <text x="62" y="215" font-size="9" fill="#4a7a3a">i=2</text>
    <text x="128" y="215" font-size="9" fill="#4a7a3a">i=3</text>
    <text x="195" y="215" font-size="9" fill="#4a7a3a">i=4</text>

    <!-- edges: [2] → leaves -->
    <path d="M 280 173 L 290 245" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)"/>
    <path d="M 300 173 L 365 245" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)"/>
    <text x="278" y="215" font-size="9" fill="#4a7a3a">i=3</text>
    <text x="345" y="215" font-size="9" fill="#4a7a3a">i=4</text>

    <!-- edges: [3] → leaf -->
    <path d="M 440 173 L 440 245" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)"/>
    <text x="428" y="215" font-size="9" fill="#4a7a3a">i=4</text>
  </g>

  <!-- ===== Pruning annotation ===== -->
  <g filter="url(#rough2)" font-size="10">
    <rect x="470" y="300" width="150" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8"/>
    <text x="545" y="318" text-anchor="middle" fill="#b85450" font-weight="bold">✂ 剪枝判定</text>
    <text x="545" y="334" text-anchor="middle" fill="#555" font-size="9">剩余 = n − start + 1</text>
    <text x="545" y="348" text-anchor="middle" fill="#555" font-size="9">还需 = k − path.size()</text>
    <text x="545" y="360" text-anchor="middle" fill="#b85450" font-size="9" font-weight="bold">剩余 &lt; 还需 → 跳过</text>
  </g>

  <!-- ===== Legend ===== -->
  <rect x="30" y="380" width="420" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="46" y="394" width="16" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
  <text x="70" y="406" font-size="10" fill="#4a7a3a">收集（size==k）</text>
  <rect x="170" y="394" width="16" height="14" fill="#f5f5f5" stroke="#888" stroke-width="1.3" rx="3"/>
  <text x="194" y="406" font-size="10" fill="#555">内部节点（继续递归）</text>
  <rect x="320" y="394" width="16" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4,3" rx="3"/>
  <text x="344" y="406" font-size="10" fill="#b85450">剪枝（剩余不足）</text>
  <text x="240" y="422" text-anchor="middle" font-size="9" fill="#666">共 C(4,2)=6 个组合；剪枝跳过 [4] 这个不可能凑够 k 个的分支</text>
</svg>
