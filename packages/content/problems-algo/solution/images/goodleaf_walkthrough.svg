<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="420" fill="#fafafa"/>

  <text x="340" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：root = [1,2,3,4,5,6,7], distance = 3</text>

  <!-- 小树示意 -->
  <text x="95" y="56" text-anchor="middle" font-size="11" fill="#888">后序顺序</text>
  <circle cx="95" cy="74" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="78" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="113" y="68" font-size="8" fill="#b85450" font-weight="bold">⑦</text>
  <line x1="87" y1="85" x2="62" y2="102" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="103" y1="85" x2="128" y2="102" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="57" cy="112" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="57" y="115" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="74" y="108" font-size="8" fill="#4a7a3a" font-weight="bold">③</text>
  <circle cx="133" cy="112" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="133" y="115" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="150" y="108" font-size="8" fill="#4a7a3a" font-weight="bold">⑥</text>
  <line x1="50" y1="121" x2="36" y2="138" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="64" y1="121" x2="78" y2="138" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="126" y1="121" x2="112" y2="138" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="140" y1="121" x2="154" y2="138" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="33" cy="146" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="33" y="149" text-anchor="middle" font-size="8" fill="#333">4</text>
  <text x="46" y="152" font-size="8" fill="#4a7a3a" font-weight="bold">①</text>
  <circle cx="81" cy="146" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="81" y="149" text-anchor="middle" font-size="8" fill="#333">5</text>
  <text x="94" y="152" font-size="8" fill="#4a7a3a" font-weight="bold">②</text>
  <circle cx="109" cy="146" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="109" y="149" text-anchor="middle" font-size="8" fill="#333">6</text>
  <text x="122" y="152" font-size="8" fill="#4a7a3a" font-weight="bold">④</text>
  <circle cx="157" cy="146" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="157" y="149" text-anchor="middle" font-size="8" fill="#333">7</text>
  <text x="170" y="152" font-size="8" fill="#4a7a3a" font-weight="bold">⑤</text>

  <!-- 表头 -->
  <rect x="190" y="48" width="480" height="26" fill="#446688" filter="url(#rough2)"/>
  <text x="225" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">节点</text>
  <text x="280" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">类型</text>
  <text x="350" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">dfs(left)</text>
  <text x="420" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">dfs(right)</text>
  <text x="510" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">配对计数</text>
  <text x="625" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">返回</text>
  <line x1="260" y1="48" x2="260" y2="74" stroke="#fafafa" stroke-width="1"/>
  <line x1="310" y1="48" x2="310" y2="74" stroke="#fafafa" stroke-width="1"/>
  <line x1="390" y1="48" x2="390" y2="74" stroke="#fafafa" stroke-width="1"/>
  <line x1="460" y1="48" x2="460" y2="74" stroke="#fafafa" stroke-width="1"/>
  <line x1="570" y1="48" x2="570" y2="74" stroke="#fafafa" stroke-width="1"/>

  <!-- ① 叶4 -->
  <rect x="190" y="74" width="480" height="26" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="225" y="91" text-anchor="middle" font-size="10" fill="#333">① 叶 4</text>
  <text x="280" y="91" text-anchor="middle" font-size="9" fill="#888">叶子</text>
  <text x="350" y="91" text-anchor="middle" font-size="9" fill="#888">—</text>
  <text x="420" y="91" text-anchor="middle" font-size="9" fill="#888">—</text>
  <text x="510" y="91" text-anchor="middle" font-size="9" fill="#888">—</text>
  <text x="625" y="91" text-anchor="middle" font-size="10" fill="#446688">[0]</text>

  <!-- ② 叶5 -->
  <rect x="190" y="100" width="480" height="26" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="225" y="117" text-anchor="middle" font-size="10" fill="#333">② 叶 5</text>
  <text x="280" y="117" text-anchor="middle" font-size="9" fill="#888">叶子</text>
  <text x="350" y="117" text-anchor="middle" font-size="9" fill="#888">—</text>
  <text x="420" y="117" text-anchor="middle" font-size="9" fill="#888">—</text>
  <text x="510" y="117" text-anchor="middle" font-size="9" fill="#888">—</text>
  <text x="625" y="117" text-anchor="middle" font-size="10" fill="#446688">[0]</text>

  <!-- ③ 节点2 -->
  <rect x="190" y="126" width="480" height="26" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="225" y="143" text-anchor="middle" font-size="10" fill="#333">③ 节点 2</text>
  <text x="280" y="143" text-anchor="middle" font-size="9" fill="#888">内部</text>
  <text x="350" y="143" text-anchor="middle" font-size="9" fill="#446688">[0]</text>
  <text x="420" y="143" text-anchor="middle" font-size="9" fill="#446688">[0]</text>
  <text x="510" y="143" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">0+0+2=2≤3 ✓ +1</text>
  <text x="625" y="143" text-anchor="middle" font-size="10" fill="#446688">[1,1]</text>

  <!-- ④ 叶6 -->
  <rect x="190" y="152" width="480" height="26" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="225" y="169" text-anchor="middle" font-size="10" fill="#333">④ 叶 6</text>
  <text x="280" y="169" text-anchor="middle" font-size="9" fill="#888">叶子</text>
  <text x="350" y="169" text-anchor="middle" font-size="9" fill="#888">—</text>
  <text x="420" y="169" text-anchor="middle" font-size="9" fill="#888">—</text>
  <text x="510" y="169" text-anchor="middle" font-size="9" fill="#888">—</text>
  <text x="625" y="169" text-anchor="middle" font-size="10" fill="#446688">[0]</text>

  <!-- ⑤ 叶7 -->
  <rect x="190" y="178" width="480" height="26" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="225" y="195" text-anchor="middle" font-size="10" fill="#333">⑤ 叶 7</text>
  <text x="280" y="195" text-anchor="middle" font-size="9" fill="#888">叶子</text>
  <text x="350" y="195" text-anchor="middle" font-size="9" fill="#888">—</text>
  <text x="420" y="195" text-anchor="middle" font-size="9" fill="#888">—</text>
  <text x="510" y="195" text-anchor="middle" font-size="9" fill="#888">—</text>
  <text x="625" y="195" text-anchor="middle" font-size="10" fill="#446688">[0]</text>

  <!-- ⑥ 节点3 -->
  <rect x="190" y="204" width="480" height="26" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="225" y="221" text-anchor="middle" font-size="10" fill="#333">⑥ 节点 3</text>
  <text x="280" y="221" text-anchor="middle" font-size="9" fill="#888">内部</text>
  <text x="350" y="221" text-anchor="middle" font-size="9" fill="#446688">[0]</text>
  <text x="420" y="221" text-anchor="middle" font-size="9" fill="#446688">[0]</text>
  <text x="510" y="221" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">0+0+2=2≤3 ✓ +1</text>
  <text x="625" y="221" text-anchor="middle" font-size="10" fill="#446688">[1,1]</text>

  <!-- ⑦ 根1 -->
  <rect x="190" y="230" width="480" height="26" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="225" y="247" text-anchor="middle" font-size="10" fill="#333">⑦ 根 1</text>
  <text x="280" y="247" text-anchor="middle" font-size="9" fill="#888">内部</text>
  <text x="350" y="247" text-anchor="middle" font-size="9" fill="#446688">[1,1]</text>
  <text x="420" y="247" text-anchor="middle" font-size="9" fill="#446688">[1,1]</text>
  <text x="510" y="247" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1+1+2=4&gt;3 ✗ ×4</text>
  <text x="625" y="247" text-anchor="middle" font-size="10" fill="#446688">[2,2,2,2]</text>

  <!-- 表格边框 -->
  <rect x="190" y="48" width="480" height="208" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="260" y1="74" x2="260" y2="256" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="310" y1="74" x2="310" y2="256" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="390" y1="74" x2="390" y2="256" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="460" y1="74" x2="460" y2="256" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="570" y1="74" x2="570" y2="256" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 结论框 -->
  <rect x="40" y="278" width="600" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="340" y="300" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最终 ans = 2 ✓</text>
  <text x="340" y="318" text-anchor="middle" font-size="10" fill="#555">好对 = (4,5) 在节点 2 计数 + (6,7) 在节点 3 计数 = 2</text>

  <!-- 关键观察 -->
  <rect x="40" y="340" width="600" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="340" y="360" text-anchor="middle" font-size="11" fill="#555">③⑥：各 1 对好对（d₁=d₂=0，0+0+2=2≤3）</text>
  <text x="340" y="378" text-anchor="middle" font-size="11" fill="#555">⑦：4 个组合全为 1+1+2=4&gt;3，无好对；返回 [2,2,2,2] 继续上传</text>
  <text x="340" y="396" text-anchor="middle" font-size="11" fill="#888">每对叶子恰在唯一 LCA 处被检查一次，不重不漏</text>
</svg>
