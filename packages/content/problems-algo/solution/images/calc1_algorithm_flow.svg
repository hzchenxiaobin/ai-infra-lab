<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="620" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">基本计算器：一遍扫描单栈算法流程</text>

  <!-- Start -->
  <ellipse cx="280" cy="62" rx="120" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333">开始: res=0, num=0, sign=+1, stack=[]</text>

  <path d="M 280 82 L 280 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: i &lt; n ? -->
  <polygon points="280,104 372,150 280,196 188,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>
  <text x="280" y="162" text-anchor="middle" font-size="10" fill="#888">(逐字符扫描)</text>

  <!-- No -> end & return -->
  <path d="M 372 150 L 444 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="142" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="446" y="126" width="108" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="500" y="146" text-anchor="middle" font-size="11" fill="#333">res += sign×num</text>
  <text x="500" y="162" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回 res</text>

  <!-- Yes -> down -->
  <path d="M 280 196 L 280 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="210" font-size="11" fill="#82b366">是</text>

  <!-- Diamond: c 是数字? -->
  <polygon points="280,218 372,264 280,310 188,264" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="260" text-anchor="middle" font-size="12" fill="#333">c 是数字?</text>

  <!-- Yes -> accumulate -->
  <path d="M 188 264 L 116 264" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="256" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="14" y="242" width="100" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="64" y="260" text-anchor="middle" font-size="11" fill="#333">num = num×10</text>
  <text x="64" y="276" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">+ int(c)</text>

  <!-- inner loop back up to diamond i&lt;n -->
  <path d="M 64 242 L 64 150 L 188 150" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="64" y="196" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 64 196)">i++ 继续</text>

  <!-- No -> down -->
  <path d="M 280 310 L 280 328" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="324" font-size="11" fill="#b85450">否</text>

  <!-- switch on c (4 boxes) -->
  <text x="280" y="344" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">按字符 c 分支处理：</text>

  <rect x="20" y="356" width="120" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="80" y="375" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">c ∈ '+ −'</text>
  <text x="80" y="391" text-anchor="middle" font-size="10" fill="#333">res += sign×num</text>
  <text x="80" y="402" text-anchor="middle" font-size="10" fill="#333">num=0; sign=±1</text>

  <rect x="150" y="356" width="120" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="210" y="375" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">c == '('</text>
  <text x="210" y="391" text-anchor="middle" font-size="10" fill="#333">push(res, sign)</text>
  <text x="210" y="402" text-anchor="middle" font-size="10" fill="#333">res=0; sign=+1</text>

  <rect x="280" y="356" width="120" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="340" y="375" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">c == ')'</text>
  <text x="340" y="391" text-anchor="middle" font-size="10" fill="#333">res += sign×num</text>
  <text x="340" y="402" text-anchor="middle" font-size="10" fill="#333">pop 合并见下</text>

  <rect x="410" y="356" width="120" height="48" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="470" y="375" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">c == ' '</text>
  <text x="470" y="394" text-anchor="middle" font-size="10" fill="#888">跳过</text>

  <!-- ) combine detail box -->
  <path d="M 340 404 L 340 422" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="424" width="280" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="340" y="446" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">) 合并：(pr, ps)=pop; res = pr + ps×res</text>

  <!-- converge all branches -->
  <path d="M 80 404 L 80 486 L 188 486" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 210 404 L 210 486" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 470 404 L 470 486 L 372 486" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340 458 L 340 486" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="490" width="200" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="510" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">i++，进入下一字符</text>

  <!-- loop back to top diamond -->
  <path d="M 180 506 L 10 506 L 10 150 L 188 150" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="10" y="330" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 10 330)">回到 i&lt;n 判断</text>

  <!-- unary minus note -->
  <rect x="40" y="546" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="567" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">⚠️ 一元负号自然处理：开头 '-' 或 '(-' 时 num=0</text>
  <text x="280" y="584" text-anchor="middle" font-size="11" fill="#666">res += sign×0 = 0（不改变 res），sign 置 −1，紧随其后的数即带负号累加</text>
  <text x="280" y="597" text-anchor="middle" font-size="10" fill="#888">如 "-2+1" → res = −1；"1-(-2)" → res = 3</text>
</svg>
