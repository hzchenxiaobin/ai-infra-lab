<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：单调栈 + 一趟 DP 求 max r[i]</text>

  <!-- 1. init -->
  <rect x="170" y="44" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">① 空栈 st，ans = 0</text>
  <text x="270" y="77" text-anchor="middle" font-size="10" fill="#446688">dp[i] 记 nums[i] 被删轮次</text>
  <path d="M 270 86 L 270 104" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. loop header -->
  <rect x="160" y="108" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="129" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">② 循环 i = 0 … n−1</text>
  <path d="M 270 144 L 270 162" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. maxR = 0 -->
  <rect x="180" y="166" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="186" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">③ maxR = 0</text>
  <path d="M 270 200 L 270 218" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. decision: stack non-empty and nums[top] <= nums[i] ? -->
  <polygon points="270,220 410,262 270,304 130,262" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="258" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">栈非空 &amp;&amp;</text>
  <text x="270" y="274" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">nums[top] ≤ nums[i] ?</text>
  <text x="270" y="290" text-anchor="middle" font-size="9.5" fill="#888">障碍待弹</text>

  <!-- yes branch: pop, update maxR, loop back to decision -->
  <path d="M 410 262 L 466 262 L 466 200 L 466 182 L 362 182" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="424" y="254" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="406" y="300" width="124" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="468" y="320" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">弹出 top</text>
  <text x="468" y="336" text-anchor="middle" font-size="10" fill="#b85450">maxR = max(maxR, dp[top])</text>
  <path d="M 468 300 L 468 262" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- no branch: down to next decision -->
  <path d="M 270 304 L 270 326" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="318" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- 5. decision: stack empty? -->
  <polygon points="270,328 380,366 270,404 160,366" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="362" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">栈空 ?</text>
  <text x="270" y="378" text-anchor="middle" font-size="9.5" fill="#888">左侧还有 &gt; nums[i] 的吗</text>

  <!-- yes: dp[i]=0 (left box) -->
  <path d="M 160 366 L 96 366 L 96 430" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="358" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">是</text>
  <rect x="40" y="432" width="112" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="96" y="454" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">dp[i] = 0</text>
  <text x="96" y="468" text-anchor="middle" font-size="9" fill="#888">nums[i] 是最大值，永存</text>

  <!-- no: dp[i] = maxR + 1 (right box) -->
  <path d="M 380 366 L 448 366 L 448 430" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="420" y="358" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="388" y="432" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="448" y="454" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">dp[i] = maxR + 1</text>
  <text x="448" y="468" text-anchor="middle" font-size="9" fill="#888">栈顶 = 杀手</text>

  <!-- both merge to: ans update + push, then loop back -->
  <path d="M 96 468 L 96 498 L 448 498 L 448 468" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="170" y="488" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="502" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">④ ans = max(ans, dp[i])；i 入栈</text>
  <text x="270" y="514" text-anchor="middle" font-size="9" fill="#4a7a3a">回到 ② 循环</text>

  <!-- return -->
  <path d="M 270 522 L 270 522" stroke="#666" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
</svg>
