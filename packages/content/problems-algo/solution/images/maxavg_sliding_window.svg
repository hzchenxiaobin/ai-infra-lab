<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">定长滑窗：窗口固定 k 格，右移一格 = 左出 + 右入</text>

  <!-- nums row -->
  <text x="30" y="74" font-size="12" fill="#888">nums:</text>
  <rect x="80" y="58" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="78" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="136" y="58" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="78" text-anchor="middle" font-size="12" fill="#333">12</text>
  <rect x="192" y="58" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="78" text-anchor="middle" font-size="12" fill="#333">−5</text>
  <rect x="248" y="58" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="78" text-anchor="middle" font-size="12" fill="#333">−6</text>
  <rect x="304" y="58" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="78" text-anchor="middle" font-size="12" fill="#333">50</text>
  <rect x="360" y="58" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="388" y="78" text-anchor="middle" font-size="12" fill="#333">3</text>

  <text x="108" y="104" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="164" y="104" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="220" y="104" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="276" y="104" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="332" y="104" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="388" y="104" text-anchor="middle" font-size="9" fill="#aaa">5</text>

  <!-- window [0..3] highlight -->
  <rect x="77" y="54" width="232" height="38" fill="none" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="193" y="126" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">窗口 [0..3]，k=4</text>

  <!-- slide arrow -->
  <path d="M 320 138 L 350 138" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="335" y="130" text-anchor="middle" font-size="10" fill="#446688">右移</text>

  <!-- window [1..4] highlight -->
  <rect x="133" y="148" width="232" height="38" fill="none" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="249" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">窗口 [1..4]，k=4</text>

  <!-- left out: nums[0]=1 (red) -->
  <rect x="80" y="148" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="108" y="168" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <path d="M 108 182 L 108 200" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="108" y="214" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">左出 −1</text>

  <!-- right in: nums[4]=50 (green) -->
  <rect x="304" y="148" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="332" y="168" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">50</text>
  <path d="M 332 182 L 332 200" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="332" y="214" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">右入 +50</text>

  <!-- sum update box -->
  <rect x="120" y="240" width="320" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">sum = sum − nums[left] + nums[right]</text>
  <text x="280" y="278" text-anchor="middle" font-size="11" fill="#888">2 − 1 + 50 = 51  →  O(1) 增量更新</text>

  <!-- bottom note -->
  <rect x="40" y="300" width="480" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">关键：窗口长度固定为 k，无需伸缩指针</text>
  <text x="280" y="342" text-anchor="middle" font-size="11" fill="#888">每步只做一次加一次减 → 总扫描 O(n)，比暴力 O(n·k) 快</text>
</svg>
