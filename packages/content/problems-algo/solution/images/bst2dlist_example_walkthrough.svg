<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="520" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：BST [4,2,5,1,3]</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">中序顺序 1→2→3→4→5，逐步互连成循环双向链表</text>

  <!-- 小型 BST 提示 -->
  <g font-size="10">
    <circle cx="40" cy="76" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="40" y="80" text-anchor="middle" fill="#333" font-weight="bold">4</text>
    <circle cx="22" cy="104" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="22" y="107" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <circle cx="58" cy="104" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="58" y="107" text-anchor="middle" fill="#333" font-weight="bold">5</text>
    <circle cx="10" cy="128" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="10" y="131" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <circle cx="34" cy="128" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="34" y="131" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <line x1="34" y1="86" x2="24" y2="96" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <line x1="46" y1="86" x2="56" y2="96" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <line x1="16" y1="112" x2="12" y2="120" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <line x1="28" y1="112" x2="32" y2="120" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  </g>
  <text x="40" y="152" text-anchor="middle" font-size="9" fill="#888">访问顺序：1②→2①→3③→4④→5⑤</text>

  <!-- 表头 -->
  <g font-size="10">
    <rect x="90" y="64" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="120" y="80" text-anchor="middle" fill="#446688" font-weight="bold">步骤</text>
    <rect x="150" y="64" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="180" y="80" text-anchor="middle" fill="#446688" font-weight="bold">访问</text>
    <rect x="210" y="64" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="250" y="80" text-anchor="middle" fill="#446688" font-weight="bold">操作</text>
    <rect x="290" y="64" width="260" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="420" y="80" text-anchor="middle" fill="#446688" font-weight="bold">链表状态（head ... prev）</text>
  </g>

  <!-- 步骤 1 -->
  <g font-size="10">
    <rect x="90" y="90" width="60" height="34" fill="#f6f6f6" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="120" y="112" text-anchor="middle" fill="#333">①</text>
    <rect x="150" y="90" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="180" y="112" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <rect x="210" y="90" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="250" y="105" text-anchor="middle" fill="#8a6a20">prev=null</text>
    <text x="250" y="118" text-anchor="middle" fill="#8a6a20">head=1</text>
    <rect x="290" y="90" width="260" height="34" fill="#f6f6f6" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <rect x="320" y="96" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="334" y="112" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <text x="360" y="112" font-size="9" fill="#888">prev=1</text>
  </g>

  <!-- 步骤 2 -->
  <g font-size="10">
    <rect x="90" y="126" width="60" height="34" fill="#f6f6f6" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="120" y="148" text-anchor="middle" fill="#333">②</text>
    <rect x="150" y="126" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="180" y="148" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <rect x="210" y="126" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="250" y="148" text-anchor="middle" fill="#8a6a20">1↔2 互连</text>
    <rect x="290" y="126" width="260" height="34" fill="#f6f6f6" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <rect x="320" y="132" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="334" y="148" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="348" y1="143" x2="358" y2="143" stroke="#4a7a3a" stroke-width="1.3" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <rect x="360" y="132" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="374" y="148" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <text x="400" y="148" font-size="9" fill="#888">prev=2</text>
  </g>

  <!-- 步骤 3 -->
  <g font-size="10">
    <rect x="90" y="162" width="60" height="34" fill="#f6f6f6" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="120" y="184" text-anchor="middle" fill="#333">③</text>
    <rect x="150" y="162" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="180" y="184" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <rect x="210" y="162" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="250" y="184" text-anchor="middle" fill="#8a6a20">2↔3 互连</text>
    <rect x="290" y="162" width="260" height="34" fill="#f6f6f6" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <rect x="320" y="168" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="334" y="184" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="348" y1="179" x2="358" y2="179" stroke="#4a7a3a" stroke-width="1.3" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <rect x="360" y="168" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="374" y="184" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <line x1="388" y1="179" x2="398" y2="179" stroke="#4a7a3a" stroke-width="1.3" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <rect x="400" y="168" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="414" y="184" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <text x="440" y="184" font-size="9" fill="#888">prev=3</text>
  </g>

  <!-- 步骤 4 -->
  <g font-size="10">
    <rect x="90" y="198" width="60" height="34" fill="#f6f6f6" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="120" y="220" text-anchor="middle" fill="#333">④</text>
    <rect x="150" y="198" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="180" y="220" text-anchor="middle" fill="#333" font-weight="bold">4</text>
    <rect x="210" y="198" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="250" y="220" text-anchor="middle" fill="#8a6a20">3↔4 互连</text>
    <rect x="290" y="198" width="260" height="34" fill="#f6f6f6" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <rect x="312" y="204" width="26" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="325" y="220" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="338" y1="215" x2="346" y2="215" stroke="#4a7a3a" stroke-width="1.2" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <rect x="348" y="204" width="26" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="361" y="220" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <line x1="374" y1="215" x2="382" y2="215" stroke="#4a7a3a" stroke-width="1.2" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <rect x="384" y="204" width="26" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="397" y="220" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <line x1="410" y1="215" x2="418" y2="215" stroke="#446688" stroke-width="1.3" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <rect x="420" y="204" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="433" y="220" text-anchor="middle" fill="#333" font-weight="bold">4</text>
    <text x="460" y="220" font-size="9" fill="#888">prev=4</text>
  </g>

  <!-- 步骤 5 -->
  <g font-size="10">
    <rect x="90" y="234" width="60" height="34" fill="#f6f6f6" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="120" y="256" text-anchor="middle" fill="#333">⑤</text>
    <rect x="150" y="234" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="180" y="256" text-anchor="middle" fill="#333" font-weight="bold">5</text>
    <rect x="210" y="234" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="250" y="256" text-anchor="middle" fill="#8a6a20">4↔5 互连</text>
    <rect x="290" y="234" width="260" height="34" fill="#f6f6f6" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <rect x="304" y="240" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="316" y="256" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="328" y1="251" x2="334" y2="251" stroke="#4a7a3a" stroke-width="1.2" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <rect x="336" y="240" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="348" y="256" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <line x1="360" y1="251" x2="366" y2="251" stroke="#4a7a3a" stroke-width="1.2" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <rect x="368" y="240" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="380" y="256" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <line x1="392" y1="251" x2="398" y2="251" stroke="#4a7a3a" stroke-width="1.2" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <rect x="400" y="240" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="412" y="256" text-anchor="middle" fill="#333" font-weight="bold">4</text>
    <line x1="424" y1="251" x2="430" y2="251" stroke="#d6a040" stroke-width="1.3" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <rect x="432" y="240" width="24" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="444" y="256" text-anchor="middle" fill="#333" font-weight="bold">5</text>
    <text x="472" y="256" font-size="9" fill="#888">prev=5</text>
  </g>

  <!-- 步骤 6 成环 -->
  <g font-size="10">
    <rect x="90" y="270" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="120" y="292" text-anchor="middle" fill="#b85450" font-weight="bold">⑥</text>
    <rect x="150" y="270" width="60" height="34" fill="#f6f6f6" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="180" y="292" text-anchor="middle" fill="#888">—</text>
    <rect x="210" y="270" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="250" y="287" text-anchor="middle" fill="#b85450">5→1 成环</text>
    <text x="250" y="299" text-anchor="middle" fill="#b85450">1←5</text>
    <rect x="290" y="270" width="260" height="34" fill="#f6f6f6" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <rect x="304" y="276" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="316" y="292" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="328" y1="287" x2="334" y2="287" stroke="#4a7a3a" stroke-width="1.2" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <rect x="336" y="276" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="348" y="292" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <line x1="360" y1="287" x2="366" y2="287" stroke="#4a7a3a" stroke-width="1.2" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <rect x="368" y="276" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="380" y="292" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <line x1="392" y1="287" x2="398" y2="287" stroke="#4a7a3a" stroke-width="1.2" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <rect x="400" y="276" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="412" y="292" text-anchor="middle" fill="#333" font-weight="bold">4</text>
    <line x1="424" y1="287" x2="430" y2="287" stroke="#4a7a3a" stroke-width="1.2" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <rect x="432" y="276" width="24" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="444" y="292" text-anchor="middle" fill="#333" font-weight="bold">5</text>
    <!-- 成环箭头 -->
    <path d="M 456 287 Q 530 287 530 360 Q 530 410 316 410 Q 100 410 100 360 Q 100 310 304 298" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  </g>

  <!-- 最终 -->
  <rect x="40" y="324" width="500" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="344" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">最终结果（循环双向链表）</text>
  <text x="290" y="362" text-anchor="middle" font-size="11" fill="#555">1 ⇄ 2 ⇄ 3 ⇄ 4 ⇄ 5 ⇄ 1（首尾相连），返回 head（val=1）</text>

  <!-- 关键 -->
  <rect x="40" y="384" width="500" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="56" y="404" font-size="11" fill="#4a7a3a" font-weight="bold">关键：每访问一个节点就与 prev 互连，prev 滑动；遍历完首尾成环</text>
  <text x="56" y="422" font-size="10" fill="#555">prev 游标像「黏合剂」：每来一个新节点就把它粘到链尾，最后把链尾与链头粘合成环</text>
</svg>
