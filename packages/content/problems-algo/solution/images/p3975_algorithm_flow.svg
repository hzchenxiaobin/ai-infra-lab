<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="14.5" fill="#333" filter="url(#rough2)">流程：排序 → 极大合并 → 逐段切割</text>

  <!-- 开始 -->
  <ellipse cx="260" cy="36" rx="42" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="41" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">开始</text>
  <path d="M 260 51 L 260 60" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 排序 -->
  <rect x="185" y="62" width="150" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="79" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">按 start 排序</text>
  <path d="M 260 88 L 260 96" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取区间 -->
  <rect x="185" y="98" width="150" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="115" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">取下一区间 [s, e]</text>
  <path d="M 260 124 L 260 132" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形：重叠或相接？ -->
  <polygon points="260,132 350,168 260,204 170,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="163" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">重叠或相接？</text>
  <text x="260" y="179" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">s ≤ tail_e + 1</text>

  <!-- 是 → 右：扩展尾端 -->
  <path d="M 350 168 L 366 168" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="356" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="368" y="152" width="112" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="424" y="165" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">tail_e =</text>
  <text x="424" y="179" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">max(tail_e, e)</text>

  <!-- 否 → 左：追加新段 -->
  <path d="M 170 168 L 154 168" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="162" y="160" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="40" y="152" width="114" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="97" y="165" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">merged 追加</text>
  <text x="97" y="179" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">新段 [s, e]</text>

  <!-- 汇合线 -->
  <path d="M 97 184 L 97 214 L 255 214" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 424 184 L 424 214 L 265 214" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 260 214 L 260 222" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形2：区间取尽？ -->
  <polygon points="260,224 325,242 260,260 195,242" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="246" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">区间取尽？</text>

  <!-- 还有 → 回环 -->
  <path d="M 325 242 L 496 242 L 496 111 L 348 111" fill="none" stroke="#b85450" stroke-width="1.5"
        stroke-dasharray="6 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="335" y="234" font-size="11" fill="#b85450" filter="url(#rough2)">还有</text>

  <!-- 取尽 → 切割 -->
  <path d="M 260 260 L 260 270" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="269" font-size="11" fill="#4a7a3a" filter="url(#rough2)">取尽</text>

  <rect x="130" y="272" width="260" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <g text-anchor="middle" filter="url(#rough2)">
    <text x="260" y="286" font-size="11" fill="#446688" font-weight="bold">对每个合并段 [l, r] 切割：</text>
    <text x="260" y="302" font-size="10.5" fill="#333">l &lt; f → [l, min(r, f−1)]</text>
    <text x="260" y="316" font-size="10.5" fill="#333">r &gt; g → [max(l, g+1), r]</text>
  </g>
  <path d="M 260 318 L 260 324" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <ellipse cx="260" cy="341" rx="46" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="346" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">返回 res</text>
</svg>
