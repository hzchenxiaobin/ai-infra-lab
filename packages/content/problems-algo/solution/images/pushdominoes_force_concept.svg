<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrL" markerWidth="10" markerHeight="10" refX="2" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">力的分解：双向传播 → 两次单向扫描</text>
  <text x="280" y="40" text-anchor="middle" font-size="10" fill="#888">示例 R . . L（N=4）</text>

  <!-- ===== Lane 1: rightward force (blue, above dominoes) ===== -->
  <text x="40" y="58" font-size="11" fill="#446688" font-weight="bold">第一遍 左→右：</text>
  <text x="40" y="72" font-size="9.5" fill="#888">遇 R 设 N，逐格 −1，遇 L 归零</text>
  <!-- big direction arrow -->
  <path d="M 150 64 L 410 64" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- baseline -->
  <line x1="130" y1="120" x2="430" y2="120" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- bars: height ∝ force. pos0=4(h60) pos1=3(h45) pos2=2(h30) pos3=0 -->
  <!-- pos0 R: source, full -->
  <rect x="136" y="60" width="36" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="154" y="54" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">N=4</text>
  <!-- pos1 . -->
  <rect x="220" y="75" width="36" height="45" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="238" y="69" text-anchor="middle" font-size="10" fill="#446688">3</text>
  <!-- pos2 . -->
  <rect x="304" y="90" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="322" y="84" text-anchor="middle" font-size="10" fill="#446688">2</text>
  <!-- pos3 L: zero -> X -->
  <text x="406" y="112" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">×</text>
  <text x="406" y="98" text-anchor="middle" font-size="10" fill="#b85450">0</text>
  <text x="406" y="84" text-anchor="middle" font-size="8.5" fill="#b85450">截断</text>

  <!-- decay -1 annotations between bars -->
  <text x="196" y="116" text-anchor="middle" font-size="9" fill="#999">−1</text>
  <text x="280" y="116" text-anchor="middle" font-size="9" fill="#999">−1</text>

  <!-- ===== Lane 2: dominoes ===== -->
  <!-- pos0 R -->
  <rect x="132" y="128" width="44" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="166" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">R</text>
  <!-- pos1 . -->
  <rect x="216" y="128" width="44" height="64" fill="#fff" stroke="#aaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="166" text-anchor="middle" font-size="16" fill="#aaa">.</text>
  <!-- pos2 . -->
  <rect x="300" y="128" width="44" height="64" fill="#fff" stroke="#aaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="166" text-anchor="middle" font-size="16" fill="#aaa">.</text>
  <!-- pos3 L -->
  <rect x="384" y="128" width="44" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="406" y="166" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">L</text>

  <!-- index labels -->
  <text x="154" y="202" text-anchor="middle" font-size="8.5" fill="#bbb">i=0</text>
  <text x="238" y="202" text-anchor="middle" font-size="8.5" fill="#bbb">i=1</text>
  <text x="322" y="202" text-anchor="middle" font-size="8.5" fill="#bbb">i=2</text>
  <text x="406" y="202" text-anchor="middle" font-size="8.5" fill="#bbb">i=3</text>

  <!-- ===== Lane 3: leftward force (green, below dominoes) ===== -->
  <line x1="130" y1="208" x2="430" y2="208" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <!-- bars grow downward from y=208. pos0=0 pos1=2(h30) pos2=3(h45) pos3=4(h60) -->
  <!-- pos0 R: zero -> X -->
  <text x="154" y="224" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">×</text>
  <text x="154" y="238" text-anchor="middle" font-size="10" fill="#b85450">0</text>
  <text x="154" y="252" text-anchor="middle" font-size="8.5" fill="#b85450">截断</text>
  <!-- pos1 . -->
  <rect x="220" y="208" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="238" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a">2</text>
  <!-- pos2 . -->
  <rect x="304" y="208" width="36" height="45" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="322" y="265" text-anchor="middle" font-size="10" fill="#4a7a3a">3</text>
  <!-- pos3 L: source, full -->
  <rect x="388" y="208" width="36" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="406" y="280" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">N=4</text>

  <!-- decay -1 -->
  <text x="280" y="252" text-anchor="middle" font-size="9" fill="#999">−1</text>
  <text x="364" y="252" text-anchor="middle" font-size="9" fill="#999">−1</text>

  <!-- big left arrow -->
  <path d="M 410 296 L 150 296" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="520" y="58" text-anchor="end" font-size="9.5" fill="#446688">右向力</text>
  <text x="520" y="300" text-anchor="end" font-size="9.5" fill="#4a7a3a">左向力</text>
  <text x="40" y="300" font-size="11" fill="#4a7a3a" font-weight="bold">第二遍 右→左</text>
  <text x="40" y="312" font-size="9.5" fill="#888">遇 L 设 N，逐格 −1，遇 R 归零</text>

  <!-- ===== Lane 4: net force -> result ===== -->
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">合力 = 右向力 − 左向力  →  按符号定字符</text>
  <!-- net boxes -->
  <rect x="136" y="340" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="154" y="360" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">+4</text>
  <rect x="220" y="340" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="238" y="360" text-anchor="middle" font-size="10" fill="#446688">+1</text>
  <rect x="304" y="340" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="322" y="360" text-anchor="middle" font-size="10" fill="#4a7a3a">−1</text>
  <rect x="388" y="340" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="406" y="360" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">−4</text>

  <!-- result chars -->
  <text x="154" y="386" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">R</text>
  <text x="238" y="386" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">R</text>
  <text x="322" y="386" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">L</text>
  <text x="406" y="386" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">L</text>
  <text x="280" y="386" text-anchor="middle" font-size="10" fill="#888">⟹ "RRLL"</text>

  <!-- ===== Balance note ===== -->
  <rect x="40" y="400" width="480" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="420" font-size="10.5" fill="#d6a040" font-weight="bold">等距抵消 ⇒ '.'</text>
  <text x="60" y="436" font-size="9.5" fill="#555">R . L 中，中间位置距两侧等距，右向力 = 左向力 ⇒ 合力 0 ⇒ 保持竖立 '.'</text>
  <text x="60" y="448" font-size="9.5" fill="#888">N 取串长：保证力在串内恒正，比较退化为纯距离比较。</text>
</svg>
