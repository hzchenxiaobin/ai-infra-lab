<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：按 '=' 切两段 → 各段拆成 x 系数与常数 → 移项得 ax+b=0</text>

  <!-- ===== Row 1: original equation ===== -->
  <text x="40" y="58" font-size="12" fill="#888" font-weight="bold">原始方程（以 x+5-3+x=6+x-2 为例）</text>
  <rect x="80" y="68" width="400" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="180" y="94" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">x+5-3+x</text>
  <rect x="270" y="70" width="20" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="94" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">=</text>
  <text x="380" y="94" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6+x-2</text>

  <!-- split arrows down to two parse boxes -->
  <path d="M 180 108 L 180 128" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 380 108 L 380 128" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== Row 2: two parse boxes ===== -->
  <!-- Left parse -->
  <rect x="60" y="132" width="220" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="170" y="154" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">解析左式</text>
  <text x="76" y="176" font-size="12" fill="#444">x 系数 c_L：</text>
  <text x="252" y="176" text-anchor="end" font-size="13" fill="#446688" font-weight="bold">2</text>
  <text x="76" y="198" font-size="12" fill="#444">常数 b_L：</text>
  <text x="252" y="198" text-anchor="end" font-size="13" fill="#446688" font-weight="bold">2</text>
  <text x="76" y="218" font-size="11" fill="#888">x →1, +5, -3, +x →1</text>

  <!-- Right parse -->
  <rect x="300" y="132" width="220" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="410" y="154" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">解析右式</text>
  <text x="316" y="176" font-size="12" fill="#444">x 系数 c_R：</text>
  <text x="492" y="176" text-anchor="end" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="316" y="198" font-size="12" fill="#444">常数 b_R：</text>
  <text x="492" y="198" text-anchor="end" font-size="13" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="316" y="218" font-size="11" fill="#888">+6, x →1, -2</text>

  <!-- arrows converging to move-all box -->
  <path d="M 170 224 L 170 248 L 280 248 L 280 264" stroke="#888" stroke-width="1.4" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 224 L 410 248 L 280 248" stroke="#888" stroke-width="1.4" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>

  <!-- ===== Row 3: move everything to left ===== -->
  <rect x="80" y="266" width="400" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">全部移到左边（右式系数/常数取负）</text>
  <text x="280" y="312" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a = c_L − c_R = 1，b = b_L − b_R = −2</text>
  <text x="280" y="328" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">即 1·x + (−2) = 0 ⇒ x = 2</text>

  <!-- arrow down to three cases -->
  <path d="M 280 330 L 280 348" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== Row 4: three cases ===== -->
  <rect x="40" y="352" width="150" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="115" y="374" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">a ≠ 0</text>
  <text x="115" y="396" text-anchor="middle" font-size="12" fill="#444">x = −b / a</text>
  <text x="115" y="414" text-anchor="middle" font-size="11" fill="#888">唯一整数解</text>

  <rect x="205" y="352" width="150" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">a = 0, b = 0</text>
  <text x="280" y="396" text-anchor="middle" font-size="12" fill="#444">0 = 0</text>
  <text x="280" y="414" text-anchor="middle" font-size="11" fill="#888">Infinite solutions</text>

  <rect x="370" y="352" width="150" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="445" y="374" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">a = 0, b ≠ 0</text>
  <text x="445" y="396" text-anchor="middle" font-size="12" fill="#444">0 = b ≠ 0</text>
  <text x="445" y="414" text-anchor="middle" font-size="11" fill="#888">No solution</text>
</svg>
