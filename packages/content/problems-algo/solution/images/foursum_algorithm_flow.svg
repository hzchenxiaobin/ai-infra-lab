<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：排序 → 固定 i → 固定 j → 双指针 → 去重</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">O(n³) = 排序 O(n log n) + 外层 i × 中层 j × 内层双指针 O(n)</text>

  <g font-size="10" fill="#333">
    <!-- Step 1: sort -->
    <rect x="40" y="62" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="82" font-size="12" fill="#446688" font-weight="bold">① 排序</text>
    <text x="120" y="82" font-family="monospace" font-size="10" fill="#555">sort(nums.begin(), nums.end())</text>
    <text x="120" y="98" font-size="9" fill="#888">升序排序，O(n log n)。让相同元素相邻 + 双指针可行</text>

    <path d="M 260 108 L 260 122" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 2: for i -->
    <rect x="40" y="126" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="146" font-size="12" fill="#4a7a3a" font-weight="bold">② 枚举第一个数 i</text>
    <text x="186" y="146" font-family="monospace" font-size="10" fill="#555">for (i = 0; i &lt; n-3; ++i)</text>
    <text x="54" y="164" font-size="9" fill="#b85450">去重 1：nums[i] == nums[i-1] → continue</text>
    <text x="54" y="178" font-size="9" fill="#d6a040">剪枝：最小四和 &gt; target → break；最大四和 &lt; target → continue</text>

    <path d="M 260 184 L 260 198" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 3: for j -->
    <rect x="40" y="202" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="222" font-size="12" fill="#4a7a3a" font-weight="bold">③ 枚举第二个数 j</text>
    <text x="186" y="222" font-family="monospace" font-size="10" fill="#555">for (j = i+1; j &lt; n-2; ++j)</text>
    <text x="54" y="240" font-size="9" fill="#b85450">去重 2：j &gt; i+1 且 nums[j] == nums[j-1] → continue</text>
    <text x="54" y="254" font-size="9" fill="#d6a040">剪枝：最小四和 &gt; target → break；最大四和 &lt; target → continue</text>

    <path d="M 260 260 L 260 274" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 4: two pointers -->
    <rect x="40" y="278" width="440" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="298" font-size="12" fill="#d6a040" font-weight="bold">④ 双指针：left = j+1, right = n-1</text>
    <text x="54" y="316" font-family="monospace" font-size="10" fill="#555">need = target − nums[i] − nums[j]</text>
    <text x="54" y="332" font-family="monospace" font-size="10" fill="#555">while (left &lt; right):</text>
    <text x="70" y="348" font-family="monospace" font-size="10" fill="#446688">sum &lt; need → left++</text>
    <text x="70" y="362" font-family="monospace" font-size="10" fill="#4a7a3a">sum &gt; need → right--</text>
    <text x="250" y="348" font-family="monospace" font-size="10" fill="#b85450">sum == need → 记录, left++, right--</text>
    <text x="250" y="362" font-size="9" fill="#888">注意：sum 用 long long 防溢出</text>

    <path d="M 260 370 L 260 384" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 5: dedup -->
    <rect x="40" y="388" width="440" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="408" font-size="12" fill="#b85450" font-weight="bold">⑤ 去重 3（找到解后）</text>
    <text x="220" y="408" font-family="monospace" font-size="10" fill="#555">while (nums[left]==nums[left-1]) left++</text>
    <text x="54" y="424" font-size="9" fill="#888">三层去重缺一不可：i 层、j 层、解后 left/right 层</text>

    <!-- complexity -->
    <rect x="40" y="440" width="440" height="16" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
    <text x="260" y="452" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">时间 O(n³)  ·  空间 O(log n)  ·  剪枝降常数不改变渐近复杂度</text>
  </g>
</svg>
