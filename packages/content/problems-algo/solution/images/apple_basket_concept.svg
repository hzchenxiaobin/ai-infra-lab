<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：排序后从最轻的苹果开始放</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">篮子容量 5000，选轻的能放更多个——贪心选择性质</text>

  <!-- unsorted row -->
  <text x="48" y="86" font-size="12" fill="#888" font-weight="bold">原始</text>
  <rect x="90" y="68" width="56" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="118" y="90" text-anchor="middle" font-size="13" fill="#883a38" font-weight="bold">900</text>
  <rect x="156" y="68" width="56" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="184" y="90" text-anchor="middle" font-size="13" fill="#883a38" font-weight="bold">950</text>
  <rect x="222" y="68" width="56" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="90" text-anchor="middle" font-size="13" fill="#883a38" font-weight="bold">800</text>
  <rect x="288" y="68" width="56" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="316" y="90" text-anchor="middle" font-size="13" fill="#883a38" font-weight="bold">1000</text>
  <rect x="354" y="68" width="56" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="382" y="90" text-anchor="middle" font-size="13" fill="#a67830" font-weight="bold">2000</text>

  <!-- sort arrow -->
  <path d="M 250 108 L 250 134" stroke="#446688" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="270" y="124" font-size="11" fill="#446688" font-weight="bold">排序</text>

  <!-- sorted row -->
  <text x="48" y="170" font-size="12" fill="#446688" font-weight="bold">升序</text>
  <rect x="90" y="152" width="56" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="118" y="174" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">800</text>
  <rect x="156" y="152" width="56" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="184" y="174" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">900</text>
  <rect x="222" y="152" width="56" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="174" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">950</text>
  <rect x="288" y="152" width="56" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="316" y="174" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">1000</text>
  <rect x="354" y="152" width="56" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="382" y="174" text-anchor="middle" font-size="13" fill="#a67830" font-weight="bold">2000</text>

  <!-- selected bracket -->
  <path d="M 90 194 Q 90 210 100 210 L 306 210 Q 316 210 316 194" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="206" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">放入篮子：800+900+950+1000 = 3650 ≤ 5000 ✓</text>

  <!-- basket -->
  <rect x="90" y="248" width="320" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="250" y="272" text-anchor="middle" font-size="13" fill="#2a4a66" font-weight="bold">篮子（容量 5000）</text>
  <text x="250" y="292" text-anchor="middle" font-size="12" fill="#2a4a66">已装 3650 / 5000 → 4 个苹果</text>

  <!-- next apple too heavy -->
  <line x1="382" y1="190" x2="382" y2="244" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="470" y="220" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3650+2000</text>
  <text x="470" y="236" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">= 5650 &gt; 5000</text>
  <text x="470" y="252" text-anchor="middle" font-size="10" fill="#b85450">放不下，停！</text>

  <!-- caption -->
  <rect x="40" y="324" width="480" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="343" text-anchor="middle" font-size="11" fill="#555">轻的苹果「性价比」高：每占 1 单位重量就多 1 个苹果</text>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#555">优先选最轻的 → 同等容量下装入个数最多 → 经典贪心</text>
</svg>
