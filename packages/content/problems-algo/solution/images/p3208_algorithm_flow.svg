<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：单趟扫描维护 run</text>

  <text x="30" y="60" font-size="10.5" fill="#888" filter="url(#rough2)">扫 i = 1 … n+k−2</text>
  <text x="30" y="78" font-size="10.5" fill="#888" filter="url(#rough2)">每步 O(1)：一次比较 + 一次判定</text>

  <!-- 初始化 -->
  <rect x="200" y="34" width="200" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="56" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">run = 1，ans = 0，i 从 1 起</text>
  <path d="M300,68 L300,80" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 1：循环条件 -->
  <polygon points="300,82 372,108 300,134 228,108" fill="#fafafa" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i &lt; n+k−1 ?</text>

  <path d="M372,108 L404,108" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="100" font-size="10" fill="#888" filter="url(#rough2)">否</text>
  <rect x="408" y="91" width="94" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="455" y="113" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">返回 ans</text>

  <path d="M300,134 L300,148" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="146" font-size="10" fill="#888" filter="url(#rough2)">是</text>

  <!-- 取数 -->
  <rect x="185" y="152" width="230" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="175" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">cur = a[i%n]，prev = a[(i−1)%n]</text>
  <path d="M300,188 L300,200" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 2：相邻同色？ -->
  <polygon points="300,204 358,228 300,252 242,228" fill="#fafafa" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="232" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">cur == prev ?</text>

  <path d="M358,228 L390,228" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="366" y="220" font-size="10" fill="#888" filter="url(#rough2)">是</text>
  <rect x="394" y="212" width="96" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="442" y="233" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">run = 1（切断）</text>

  <path d="M300,252 L300,262" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="308" y="260" font-size="10" fill="#888" filter="url(#rough2)">否</text>
  <rect x="235" y="266" width="130" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="287" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">run = run + 1</text>

  <!-- 两条 run 更新路径汇合 -->
  <path d="M300,298 L300,312" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M442,244 L442,312 L306,312" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M300,312 L300,316" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 3：run ≥ k ? -->
  <polygon points="300,320 362,344 300,368 238,344" fill="#fafafa" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="348" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">run ≥ k ?</text>

  <path d="M362,344 L394,344" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="336" font-size="10" fill="#888" filter="url(#rough2)">是</text>
  <rect x="398" y="328" width="90" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="443" y="349" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans++</text>

  <path d="M238,344 L158,344" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="336" font-size="10" fill="#888" filter="url(#rough2)">否</text>
  <rect x="62" y="328" width="92" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="108" y="349" text-anchor="middle" font-size="12.5" fill="#a06a10" filter="url(#rough2)">i++</text>

  <!-- ans++ 汇回 i++ -->
  <path d="M443,360 L443,388 L108,388 L108,362" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i++ 回到循环条件 -->
  <path d="M108,328 L108,108 L224,108" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
