<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分查找算法流程（闭式 T_n = n·delay + period·n(n−1)/2）</text>

  <!-- Start -->
  <rect x="220" y="44" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="66" text-anchor="middle" font-size="12" fill="#333">开始：传入 delay,period,cancelTime</text>

  <!-- decision: delay >= cancelTime? -->
  <path d="M 290 78 L 380 120 L 290 162 L 200 120 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="116" text-anchor="middle" font-size="11" fill="#333">delay ≥ cancelTime ?</text>
  <text x="290" y="132" text-anchor="middle" font-size="11" fill="#333">(首次调用已超时)</text>
  <path d="M 290 78 L 290 78" stroke="#666" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="290" y1="78" x2="290" y2="98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Yes -> return 0 -->
  <line x1="380" y1="120" x2="430" y2="120" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="114" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="430" y="104" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="490" y="125" text-anchor="middle" font-size="12" fill="#b85450">return 0</text>

  <!-- No -> double upper bound -->
  <text x="180" y="114" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <line x1="200" y1="120" x2="150" y2="120" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="104" width="130" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="85" y="118" text-anchor="middle" font-size="10" fill="#333">hi=1</text>
  <text x="85" y="130" text-anchor="middle" font-size="10" fill="#4a7a3a">while T(hi)&lt;cancel: hi&lt;&lt;1</text>

  <!-- arrow down to binary search box -->
  <line x1="85" y1="136" x2="85" y2="172" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- binary search box -->
  <rect x="20" y="172" width="250" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="190" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">二分 [0, hi]：lo=0, hi=上界</text>
  <text x="145" y="206" text-anchor="middle" font-size="11" fill="#333">mid = (lo + hi + 1) &gt;&gt; 1</text>
  <text x="145" y="218" text-anchor="middle" font-size="10" fill="#888">（用 BigInt 算 T(mid) 防溢出）</text>

  <!-- decision T(mid) < cancelTime ? -->
  <path d="M 145 222 L 240 258 L 145 294 L 50 258 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="145" y1="222" x2="145" y2="238" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="145" y="256" text-anchor="middle" font-size="11" fill="#333">T(mid) &lt; cancelTime ?</text>

  <!-- Yes -> lo = mid (loop back up) -->
  <line x1="50" y1="258" x2="20" y2="258" stroke="#666" stroke-width="1.5" fill="none"/>
  <text x="44" y="252" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 20 258 L 20 197 L 18 197" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="24" y="232" font-size="10" fill="#4a7a3a">lo = mid</text>

  <!-- No -> hi = mid - 1 (loop back) -->
  <line x1="240" y1="258" x2="280" y2="258" stroke="#666" stroke-width="1.5" fill="none"/>
  <text x="248" y="252" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 280 258 L 280 197 L 272 197" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="232" font-size="10" fill="#b85450">hi = mid−1</text>

  <!-- loop convergence note -->
  <rect x="300" y="244" width="250" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="425" y="262" text-anchor="middle" font-size="10" fill="#666">当 lo == hi 收敛时退出循环</text>
  <text x="425" y="278" text-anchor="middle" font-size="10" fill="#666">lo 即满足 T_n &lt; cancelTime 的最大 n</text>

  <!-- return -->
  <line x1="145" y1="294" x2="145" y2="320" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="70" y="320" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="342" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return Number(lo)</text>

  <!-- complexity note -->
  <rect x="240" y="326" width="310" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="395" y="348" text-anchor="middle" font-size="11" fill="#333">🔑 每轮 O(1) 判定，共 O(log cnt) 轮 ⇒ 优于模拟法 O(cnt)</text>
</svg>
