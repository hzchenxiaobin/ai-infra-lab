<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">UTF-8 编码：首字节前导 1 的个数 = 字节数</text>

  <!-- Row 1: 1-byte -->
  <text x="80" y="95" font-size="13" fill="#555" font-weight="bold">1 字节</text>
  <rect x="130" y="80" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="100" text-anchor="middle" font-size="12" fill="#333">0xxxxxxx</text>

  <!-- Row 2: 2-byte -->
  <text x="80" y="145" font-size="13" fill="#555" font-weight="bold">2 字节</text>
  <rect x="130" y="130" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="150" text-anchor="middle" font-size="12" fill="#333">110xxxxx</text>
  <rect x="214" y="130" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="254" y="150" text-anchor="middle" font-size="12" fill="#333">10xxxxxx</text>

  <!-- Row 3: 3-byte -->
  <text x="80" y="195" font-size="13" fill="#555" font-weight="bold">3 字节</text>
  <rect x="130" y="180" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="200" text-anchor="middle" font-size="12" fill="#333">1110xxxx</text>
  <rect x="214" y="180" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="254" y="200" text-anchor="middle" font-size="12" fill="#333">10xxxxxx</text>
  <rect x="298" y="180" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="338" y="200" text-anchor="middle" font-size="12" fill="#333">10xxxxxx</text>

  <!-- Row 4: 4-byte -->
  <text x="80" y="245" font-size="13" fill="#555" font-weight="bold">4 字节</text>
  <rect x="130" y="230" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="250" text-anchor="middle" font-size="12" fill="#333">11110xxx</text>
  <rect x="214" y="230" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="254" y="250" text-anchor="middle" font-size="12" fill="#333">10xxxxxx</text>
  <rect x="298" y="230" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="338" y="250" text-anchor="middle" font-size="12" fill="#333">10xxxxxx</text>
  <rect x="382" y="230" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="422" y="250" text-anchor="middle" font-size="12" fill="#333">10xxxxxx</text>

  <!-- Legend -->
  <rect x="130" y="285" width="16" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="152" y="298" font-size="11" fill="#555">首字节（前导 1 决定字节数）</text>
  <rect x="320" y="285" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="342" y="298" font-size="11" fill="#555">续字节（必以 10 开头）</text>

  <!-- Key insight -->
  <rect x="60" y="312" width="400" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">判定：前导 0 → 1 字节；前导几个 1 → 几字节</text>
  <text x="260" y="346" text-anchor="middle" font-size="11" fill="#555">续字节必须 10xxxxxx，否则非法；超过 4 字节非法</text>
</svg>
