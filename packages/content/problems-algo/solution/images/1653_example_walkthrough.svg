<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：s = "aababbab"，枚举 9 个分割点</text>

  <!-- String label -->
  <text x="28" y="62" font-size="10.5" fill="#666">原串</text>

  <!-- Char boxes: a a b a b b a b -->
  <rect x="68" y="50" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="107" y="50" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="146" y="50" width="34" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="163" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="185" y="50" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="224" y="50" width="34" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="241" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="263" y="50" width="34" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="302" y="50" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="319" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="341" y="50" width="34" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>

  <!-- Split tick lines (9 splits at x = 66 + 39*i) -->
  <line x1="66" y1="88" x2="66" y2="108" stroke="#999" stroke-width="1" stroke-dasharray="2 2" filter="url(#rough2)"/>
  <line x1="105" y1="88" x2="105" y2="108" stroke="#999" stroke-width="1" stroke-dasharray="2 2" filter="url(#rough2)"/>
  <line x1="144" y1="88" x2="144" y2="108" stroke="#999" stroke-width="1" stroke-dasharray="2 2" filter="url(#rough2)"/>
  <line x1="183" y1="88" x2="183" y2="108" stroke="#999" stroke-width="1" stroke-dasharray="2 2" filter="url(#rough2)"/>
  <line x1="222" y1="88" x2="222" y2="108" stroke="#999" stroke-width="1" stroke-dasharray="2 2" filter="url(#rough2)"/>
  <line x1="261" y1="88" x2="261" y2="108" stroke="#999" stroke-width="1" stroke-dasharray="2 2" filter="url(#rough2)"/>
  <line x1="300" y1="88" x2="300" y2="108" stroke="#999" stroke-width="1" stroke-dasharray="2 2" filter="url(#rough2)"/>
  <line x1="339" y1="88" x2="339" y2="108" stroke="#999" stroke-width="1" stroke-dasharray="2 2" filter="url(#rough2)"/>
  <line x1="378" y1="88" x2="378" y2="108" stroke="#999" stroke-width="1" stroke-dasharray="2 2" filter="url(#rough2)"/>

  <!-- Split index labels -->
  <text x="28" y="124" font-size="10.5" fill="#666">分割点</text>
  <text x="66" y="124" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="105" y="124" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="144" y="124" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="183" y="124" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="222" y="124" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="261" y="124" text-anchor="middle" font-size="10" fill="#888">5</text>
  <text x="300" y="124" text-anchor="middle" font-size="10" fill="#888">6</text>
  <text x="339" y="124" text-anchor="middle" font-size="10" fill="#888">7</text>
  <text x="378" y="124" text-anchor="middle" font-size="10" fill="#888">8</text>

  <!-- Cost label -->
  <text x="28" y="158" font-size="10.5" fill="#666">代价</text>

  <!-- Cost cells: [4,3,2,3,2,3,4,3,4]; highlight i=2,4 (cost 2) in orange -->
  <rect x="51" y="142" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="66" y="160" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="90" y="142" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="160" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="129" y="142" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="160" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <rect x="168" y="142" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="183" y="160" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="207" y="142" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="160" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <rect x="246" y="142" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="261" y="160" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="285" y="142" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="160" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="324" y="142" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="339" y="160" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="363" y="142" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="378" y="160" text-anchor="middle" font-size="12" fill="#333">4</text>

  <!-- Explanation box -->
  <rect x="40" y="186" width="440" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="206" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">最小代价 = 2，有两个最优分割点：</text>
  <text x="260" y="224" text-anchor="middle" font-size="11" fill="#555">i=2 → 左侧 "aa"、右侧删 a → "aabbbb"</text>
  <text x="260" y="240" text-anchor="middle" font-size="11" fill="#555">i=4 → 左侧删 b、右侧删 a → "aaabbb"</text>

  <!-- Footer -->
  <text x="260" y="278" text-anchor="middle" font-size="10" fill="#aaa">代价 = 左侧 b 数 + 右侧 a 数；扫描一遍即可算出全部 9 个值</text>
</svg>
