<svg xmlns="http://www.w3.org/2000/svg" width="780" height="560" viewBox="0 0 780 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3"/>
    </filter>
  </defs>
  <rect width="780" height="560" fill="#fdfcf7"/>
  <text x="390" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums=[1,1,4,2,3], x=5</text>
  <path d="M 270 42 Q 390 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="390" y="64" text-anchor="middle" font-size="11" fill="#666">total=11, target=total−x=6，找和为 6 的最长子数组</text>

  <!-- index header -->
  <g font-size="9" fill="#999" text-anchor="middle">
    <text x="110" y="88">0</text><text x="170" y="88">1</text><text x="230" y="88">2</text><text x="290" y="88">3</text><text x="350" y="88">4</text>
  </g>

  <!-- ===== right=0: window [1], sum=1 ===== -->
  <text x="56" y="112" text-anchor="end" font-size="11" fill="#2b6e9e" font-weight="bold">right=0</text>
  <g filter="url(#sk2)"><rect x="80" y="94" width="60" height="32" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="110" y="116" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">1</text>
  <g filter="url(#sk2)"><rect x="140" y="94" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="170" y="116" text-anchor="middle" font-size="12" fill="#aaa">1</text>
  <g filter="url(#sk2)"><rect x="200" y="94" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="230" y="116" text-anchor="middle" font-size="12" fill="#aaa">4</text>
  <g filter="url(#sk2)"><rect x="260" y="94" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="290" y="116" text-anchor="middle" font-size="12" fill="#aaa">2</text>
  <g filter="url(#sk2)"><rect x="320" y="94" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="350" y="116" text-anchor="middle" font-size="12" fill="#aaa">3</text>
  <text x="110" y="138" text-anchor="middle" font-size="9" fill="#446688">L=0</text>
  <text x="440" y="112" font-size="12" fill="#888">sum=1 &lt; 6</text>

  <!-- ===== right=1: window [1,1], sum=2 ===== -->
  <text x="56" y="158" text-anchor="end" font-size="11" fill="#2b6e9e" font-weight="bold">right=1</text>
  <g filter="url(#sk2)"><rect x="80" y="140" width="60" height="32" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="110" y="162" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">1</text>
  <g filter="url(#sk2)"><rect x="140" y="140" width="60" height="32" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="170" y="162" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">1</text>
  <g filter="url(#sk2)"><rect x="200" y="140" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="230" y="162" text-anchor="middle" font-size="12" fill="#aaa">4</text>
  <g filter="url(#sk2)"><rect x="260" y="140" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="290" y="162" text-anchor="middle" font-size="12" fill="#aaa">2</text>
  <g filter="url(#sk2)"><rect x="320" y="140" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="350" y="162" text-anchor="middle" font-size="12" fill="#aaa">3</text>
  <text x="110" y="184" text-anchor="middle" font-size="9" fill="#446688">L=0</text>
  <text x="440" y="158" font-size="12" fill="#888">sum=2 &lt; 6</text>

  <!-- ===== right=2: window [1,1,4], sum=6 == target ===== -->
  <text x="56" y="204" text-anchor="end" font-size="11" fill="#2b6e9e" font-weight="bold">right=2</text>
  <g filter="url(#sk2)"><rect x="80" y="186" width="60" height="32" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="110" y="208" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">1</text>
  <g filter="url(#sk2)"><rect x="140" y="186" width="60" height="32" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="170" y="208" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">1</text>
  <g filter="url(#sk2)"><rect x="200" y="186" width="60" height="32" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="230" y="208" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">4</text>
  <g filter="url(#sk2)"><rect x="260" y="186" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="290" y="208" text-anchor="middle" font-size="12" fill="#aaa">2</text>
  <g filter="url(#sk2)"><rect x="320" y="186" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="350" y="208" text-anchor="middle" font-size="12" fill="#aaa">3</text>
  <text x="110" y="230" text-anchor="middle" font-size="9" fill="#446688">L=0</text>
  <g filter="url(#sk2)"><rect x="420" y="194" width="150" height="24" rx="6" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="495" y="211" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">sum=6 ✓ len=3, max=3</text>

  <!-- ===== right=3: window [1,1,4,2], sum=8 > target, shrink ===== -->
  <text x="56" y="262" text-anchor="end" font-size="11" fill="#b03a3a" font-weight="bold">right=3</text>
  <g filter="url(#sk2)"><rect x="80" y="244" width="60" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="110" y="266" text-anchor="middle" font-size="13" fill="#a03a3a">1</text>
  <g filter="url(#sk2)"><rect x="140" y="244" width="60" height="32" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="170" y="266" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">1</text>
  <g filter="url(#sk2)"><rect x="200" y="244" width="60" height="32" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="230" y="266" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">4</text>
  <g filter="url(#sk2)"><rect x="260" y="244" width="60" height="32" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="290" y="266" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">2</text>
  <g filter="url(#sk2)"><rect x="320" y="244" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="350" y="266" text-anchor="middle" font-size="12" fill="#aaa">3</text>
  <text x="110" y="288" text-anchor="middle" font-size="9" fill="#b85450">缩!</text>
  <text x="440" y="262" font-size="12" fill="#b85450">sum=8 &gt; 6 → 缩左</text>

  <!-- shrink step: remove nums[0]=1, sum=7, still > 6, remove nums[1]=1, sum=6 -->
  <text x="56" y="316" text-anchor="end" font-size="10" fill="#b85450">缩后</text>
  <g filter="url(#sk2)"><rect x="80" y="298" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="110" y="320" text-anchor="middle" font-size="12" fill="#aaa">1</text>
  <g filter="url(#sk2)"><rect x="140" y="298" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="170" y="320" text-anchor="middle" font-size="12" fill="#aaa">1</text>
  <g filter="url(#sk2)"><rect x="200" y="298" width="60" height="32" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="230" y="320" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">4</text>
  <g filter="url(#sk2)"><rect x="260" y="298" width="60" height="32" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="290" y="320" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">2</text>
  <g filter="url(#sk2)"><rect x="320" y="298" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="350" y="320" text-anchor="middle" font-size="12" fill="#aaa">3</text>
  <text x="230" y="342" text-anchor="middle" font-size="9" fill="#446688">L=2</text>
  <g filter="url(#sk2)"><rect x="420" y="306" width="170" height="24" rx="6" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="505" y="323" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">sum=6 ✓ len=2, max=3</text>

  <!-- divider -->
  <path d="M 60 358 L 720 358" stroke="#e0e0e0" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#sk)"/>

  <!-- ===== right=4: window [4,2,3], sum=9 > target, shrink ===== -->
  <text x="56" y="384" text-anchor="end" font-size="11" fill="#b03a3a" font-weight="bold">right=4</text>
  <g filter="url(#sk2)"><rect x="80" y="366" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="110" y="388" text-anchor="middle" font-size="12" fill="#aaa">1</text>
  <g filter="url(#sk2)"><rect x="140" y="366" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="170" y="388" text-anchor="middle" font-size="12" fill="#aaa">1</text>
  <g filter="url(#sk2)"><rect x="200" y="366" width="60" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="230" y="388" text-anchor="middle" font-size="13" fill="#a03a3a">4</text>
  <g filter="url(#sk2)"><rect x="260" y="366" width="60" height="32" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="290" y="388" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">2</text>
  <g filter="url(#sk2)"><rect x="320" y="366" width="60" height="32" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="350" y="388" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">3</text>
  <text x="230" y="410" text-anchor="middle" font-size="9" fill="#b85450">缩!</text>
  <text x="440" y="384" font-size="12" fill="#b85450">sum=9 &gt; 6 → 缩左</text>

  <!-- shrink: remove 4, sum=5 < 6 -->
  <text x="56" y="438" text-anchor="end" font-size="10" fill="#b85450">缩后</text>
  <g filter="url(#sk2)"><rect x="80" y="420" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="110" y="442" text-anchor="middle" font-size="12" fill="#aaa">1</text>
  <g filter="url(#sk2)"><rect x="140" y="420" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="170" y="442" text-anchor="middle" font-size="12" fill="#aaa">1</text>
  <g filter="url(#sk2)"><rect x="200" y="420" width="60" height="32" rx="4" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/></g>
  <text x="230" y="442" text-anchor="middle" font-size="12" fill="#aaa">4</text>
  <g filter="url(#sk2)"><rect x="260" y="420" width="60" height="32" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="290" y="442" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">2</text>
  <g filter="url(#sk2)"><rect x="320" y="420" width="60" height="32" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="350" y="442" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">3</text>
  <text x="290" y="464" text-anchor="middle" font-size="9" fill="#446688">L=3</text>
  <text x="440" y="438" font-size="12" fill="#888">sum=5 &lt; 6，不命中</text>

  <!-- ===== Result ===== -->
  <path d="M 60 482 L 720 482" stroke="#e0e0e0" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#sk)"/>

  <g filter="url(#sk2)"><rect x="120" y="498" width="240" height="44" rx="10" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="240" y="518" text-anchor="middle" font-size="12" fill="#7a5415">最长子数组 [1,1,4]，长度 = 3</text>
  <text x="240" y="534" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">答案 = n − max_len = 5 − 3 = 2</text>

  <g filter="url(#sk2)"><rect x="420" y="498" width="220" height="44" rx="10" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="530" y="518" text-anchor="middle" font-size="12" fill="#2e5e2e">删除右端 [2,3]，和 = 5 = x</text>
  <text x="530" y="534" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">操作数 = 2 ✓</text>
</svg>
