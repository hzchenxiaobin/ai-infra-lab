<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="460" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [10, 6, 5, 8]</text>

  <!-- Array -->
  <text x="30" y="62" font-size="12" fill="#888">nums =</text>
  <rect x="80" y="46" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>
  <rect x="140" y="46" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="200" y="46" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="260" y="46" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>

  <!-- Frequency table -->
  <text x="30" y="110" font-size="12" fill="#888" font-weight="bold">第一遍建表 cnt：</text>
  <rect x="80" y="118" width="220" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="136" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">值 x</text>
  <text x="245" y="136" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cnt[x]</text>
  <line x1="195" y1="118" x2="195" y2="144" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="80" y="146" width="220" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="125" y="161" text-anchor="middle" font-size="11" fill="#333">10</text>
  <text x="245" y="161" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <rect x="80" y="170" width="220" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="125" y="185" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="245" y="185" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <rect x="80" y="194" width="220" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="125" y="209" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="245" y="209" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <rect x="80" y="218" width="220" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="125" y="233" text-anchor="middle" font-size="11" fill="#333">8</text>
  <text x="245" y="233" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- Second pass: filter -->
  <text x="360" y="110" font-size="12" fill="#888" font-weight="bold">第二遍过滤（遍历键）：</text>

  <!-- Header -->
  <rect x="360" y="118" width="270" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="380" y="134" font-size="10" fill="#333" font-weight="bold">x</text>
  <text x="440" y="134" font-size="10" fill="#333" font-weight="bold">cnt[x+1]</text>
  <text x="520" y="134" font-size="10" fill="#333" font-weight="bold">cnt[x−1]</text>
  <text x="600" y="134" font-size="10" fill="#333" font-weight="bold">孤独?</text>

  <!-- row 10 -->
  <rect x="360" y="144" width="270" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="380" y="161" font-size="11" fill="#333" font-weight="bold">10</text>
  <text x="440" y="161" font-size="11" fill="#888">cnt[11]=0</text>
  <text x="520" y="161" font-size="11" fill="#888">cnt[9]=0</text>
  <text x="600" y="161" font-size="12" fill="#4a7a3a" font-weight="bold">✅</text>

  <!-- row 6 -->
  <rect x="360" y="172" width="270" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="380" y="189" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="440" y="189" font-size="11" fill="#888">cnt[7]=0</text>
  <text x="520" y="189" font-size="11" fill="#b85450" font-weight="bold">cnt[5]=1</text>
  <text x="600" y="189" font-size="12" fill="#b85450" font-weight="bold">❌</text>

  <!-- row 5 -->
  <rect x="360" y="200" width="270" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="380" y="217" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="440" y="217" font-size="11" fill="#b85450" font-weight="bold">cnt[6]=1</text>
  <text x="520" y="217" font-size="11" fill="#888">cnt[4]=0</text>
  <text x="600" y="217" font-size="12" fill="#b85450" font-weight="bold">❌</text>

  <!-- row 8 -->
  <rect x="360" y="228" width="270" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="380" y="245" font-size="11" fill="#333" font-weight="bold">8</text>
  <text x="440" y="245" font-size="11" fill="#888">cnt[9]=0</text>
  <text x="520" y="245" font-size="11" fill="#888">cnt[7]=0</text>
  <text x="600" y="245" font-size="12" fill="#4a7a3a" font-weight="bold">✅</text>

  <!-- Pairwise failure annotation -->
  <rect x="80" y="290" width="550" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="100" y="312" font-size="12" fill="#d6a040" font-weight="bold">⚠️ 成对失效：</text>
  <text x="100" y="330" font-size="11" fill="#555">5 与 6 互为邻位 —— 对 5 而言 cnt[6]=1 违反条件 2；对 6 而言 cnt[5]=1 违反条件 3。</text>
  <text x="100" y="344" font-size="11" fill="#555">两个相邻整数互相破坏对方的孤独性，故两者均不孤独。</text>

  <!-- Result -->
  <path d="M 195 250 Q 195 380 270 392" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 495 256 Q 495 380 410 392" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="240" y="396" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="340" y="415" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最终答案</text>
  <text x="340" y="431" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">ans = [10, 8]</text>
</svg>
