<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：「突发」= 某个连续 7 天窗口的帖数 ≥ 平均每周帖数 × 2</text>
  <text x="290" y="38" text-anchor="middle" font-size="9" fill="#888">2 月固定记作 4 周 → avg_weekly_posts = 2 月总帖数 ÷ 4（与起始星期无关）</text>

  <!-- Panel A: user 3 (negative) -->
  <text x="40" y="58" font-size="10" fill="#555" font-weight="bold">用户 3（3 帖：02-06 / 02-14 / 02-25，均匀铺开）</text>

  <rect x="50" y="68" width="119" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="169" y="68" width="119" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="288" y="68" width="119" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="407" y="68" width="119" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="109" y="86" text-anchor="middle" font-size="8" fill="#446688">第 1 周</text>
  <text x="228" y="86" text-anchor="middle" font-size="8" fill="#4a7a3a">第 2 周</text>
  <text x="347" y="86" text-anchor="middle" font-size="8" fill="#446688">第 3 周</text>
  <text x="466" y="86" text-anchor="middle" font-size="8" fill="#4a7a3a">第 4 周</text>

  <circle cx="143.5" cy="82" r="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="279.5" cy="82" r="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="466.5" cy="82" r="6" fill="#4a7a3a" filter="url(#rough2)"/>

  <rect x="50" y="64" width="119" height="36" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" rx="4" filter="url(#rough2)"/>
  <rect x="390" y="64" width="119" height="36" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" rx="4" filter="url(#rough2)"/>
  <text x="109" y="112" text-anchor="middle" font-size="8" fill="#d6a040">7 天窗①：1 帖</text>
  <text x="449" y="112" text-anchor="middle" font-size="8" fill="#d6a040">7 天窗②：1 帖</text>
  <text x="58" y="112" font-size="8" fill="#888">1</text>
  <text x="164" y="112" font-size="8" fill="#888">7</text>
  <text x="283" y="112" font-size="8" fill="#888">14</text>
  <text x="402" y="112" font-size="8" fill="#888">21</text>
  <text x="521" y="112" font-size="8" fill="#888">28</text>

  <text x="40" y="134" font-size="10" fill="#555">avg = 3 ÷ 4 = <tspan fill="#446688" font-weight="bold">0.75</tspan>/周 → 阈值 2×avg = <tspan fill="#d6a040" font-weight="bold">1.5</tspan>；窗口滑遍全月 max_7day = 1 &lt; 1.5</text>
  <text x="470" y="134" font-size="11" fill="#b85450" font-weight="bold">✗ 非突发</text>

  <!-- Panel B: user 1 (positive) -->
  <text x="40" y="168" font-size="10" fill="#555" font-weight="bold">用户 1（仅 1 帖：02-27）</text>

  <rect x="50" y="178" width="119" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="169" y="178" width="119" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="288" y="178" width="119" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="407" y="178" width="119" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <circle cx="500.5" cy="192" r="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <rect x="390" y="174" width="119" height="36" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" rx="4" filter="url(#rough2)"/>
  <text x="449" y="224" text-anchor="middle" font-size="8" fill="#d6a040">7 天窗：1 帖</text>
  <text x="58" y="224" font-size="8" fill="#888">1</text>
  <text x="164" y="224" font-size="8" fill="#888">7</text>
  <text x="283" y="224" font-size="8" fill="#888">14</text>
  <text x="402" y="224" font-size="8" fill="#888">21</text>
  <text x="521" y="224" font-size="8" fill="#888">28</text>

  <text x="40" y="246" font-size="10" fill="#555">avg = 1 ÷ 4 = <tspan fill="#446688" font-weight="bold">0.25</tspan>/周 → 阈值 2×avg = <tspan fill="#d6a040" font-weight="bold">0.5</tspan>；max_7day = 1 ≥ 0.5</text>
  <text x="360" y="246" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 突发！</text>

  <!-- Insight box -->
  <rect x="40" y="260" width="500" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="290" y="280" text-anchor="middle" font-size="9" fill="#d6a040">💡 反直觉：帖数 k ≤ 2 的用户必然突发 —— max_7day ≥ 1，而阈值 k/2 ≤ 1</text>
  <text x="290" y="298" text-anchor="middle" font-size="9" fill="#d6a040">真正被筛掉的只有「帖多且均匀」的用户（如用户 3：3 帖铺满全月，每窗仅 1 帖）</text>
  <text x="290" y="316" text-anchor="middle" font-size="9" fill="#d6a040">⚠️ 2024 是闰年（2 月 29 天），但题目规定只统计 02-01 ~ 02-28 —— 恰好 4 周</text>
  <text x="290" y="334" text-anchor="middle" font-size="9" fill="#d6a040">输出三列：user_id、max_7day_posts、avg_weekly_posts（0.2500 保留四位小数）</text>
</svg>
