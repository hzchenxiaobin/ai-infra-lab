<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：缺失和 s 的拆解与可行域</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">总和确定 → 缺失和确定 → 判可行域 → 商余均匀分配</text>

  <!-- Top: total sum decomposition -->
  <text x="28" y="72" font-size="11" fill="#666" font-weight="bold">总和拆解</text>

  <!-- total box -->
  <rect x="60" y="58" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="120" y="79" text-anchor="middle" font-size="11" fill="#333">总和 = mean×(n+m)</text>

  <!-- minus sign -->
  <text x="195" y="78" text-anchor="middle" font-size="16" fill="#666" font-weight="bold">−</text>

  <!-- observed box -->
  <rect x="210" y="58" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="79" text-anchor="middle" font-size="11" fill="#333">已观测和 Σrolls</text>

  <!-- equals -->
  <text x="325" y="78" text-anchor="middle" font-size="16" fill="#666" font-weight="bold">=</text>

  <!-- missing sum s box (highlight) -->
  <rect x="340" y="58" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="79" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">缺失和 s</text>

  <!-- arrow down -->
  <path d="M 400 92 L 400 110" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="106" font-size="10.5" fill="#b85450" font-weight="bold">需凑出</text>

  <!-- Middle: feasibility range number line -->
  <text x="28" y="132" font-size="11" fill="#666" font-weight="bold">可行域</text>

  <!-- number line -->
  <line x1="70" y1="160" x2="450" y2="160" stroke="#888" stroke-width="2" filter="url(#rough2)"/>

  <!-- tick n -->
  <line x1="120" y1="154" x2="120" y2="166" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="182" text-anchor="middle" font-size="11" fill="#666">n</text>
  <text x="120" y="196" text-anchor="middle" font-size="9.5" fill="#aaa">全填1</text>

  <!-- tick 6n -->
  <line x1="400" y1="154" x2="400" y2="166" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="182" text-anchor="middle" font-size="11" fill="#666">6n</text>
  <text x="400" y="196" text-anchor="middle" font-size="9.5" fill="#aaa">全填6</text>

  <!-- green feasible zone -->
  <rect x="120" y="156" width="280" height="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="260" y="150" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">可行区间 [n, 6n]</text>

  <!-- s marker inside -->
  <polygon points="260,148 256,140 264,140" fill="#b85450" filter="url(#rough2)"/>
  <text x="260" y="136" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">s 落内 → 有解</text>

  <!-- arrow down -->
  <path d="M 260 200 L 260 218" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Bottom: base/remainder distribution -->
  <text x="28" y="238" font-size="11" fill="#666" font-weight="bold">均匀分配</text>

  <!-- formula box -->
  <rect x="80" y="226" width="360" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="245" text-anchor="middle" font-size="11.5" fill="#333">q = s ÷ n，r = s mod n</text>

  <!-- dice row: first r get q+1 (orange), rest get q (blue) -->
  <text x="28" y="282" font-size="10.5" fill="#666">缺失骰子</text>

  <!-- q+1 dice (first r) -->
  <rect x="110" y="266" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="288" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">q+1</text>
  <rect x="150" y="266" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="288" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">q+1</text>

  <!-- ellipsis -->
  <text x="200" y="288" text-anchor="middle" font-size="14" fill="#888">…</text>
  <text x="200" y="308" text-anchor="middle" font-size="9.5" fill="#d6a040">共 r 个</text>

  <!-- q dice -->
  <rect x="230" y="266" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="248" y="288" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">q</text>
  <rect x="270" y="266" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="288" y="288" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">q</text>

  <!-- ellipsis -->
  <text x="320" y="288" text-anchor="middle" font-size="14" fill="#888">…</text>
  <text x="320" y="308" text-anchor="middle" font-size="9.5" fill="#446688">共 n−r 个</text>

  <!-- sum check -->
  <rect x="120" y="318" width="280" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="337" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">总和 = r(q+1) + (n−r)q = nq + r = s ✓</text>
</svg>
