<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：排序后扫描，「最近 k 个保留」卡住 ⇒ 放弃新请求</text>
  <text x="260" y="33" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">题意口径：任意长度为 window 的闭区间（端点也算）内，同一用户的请求数至多 k</text>

  <text x="48" y="52" font-size="9.5" fill="#888" filter="url(#rough2)">示例 2（全是用户 1）：时刻排序后 [2, 2, 5, 6]，k = 2，window = 5</text>

  <!-- ======== Row 1: processing t = 5 ======== -->
  <text x="48" y="57" font-size="0" fill="#446688" filter="url(#rough2)"> </text>
  <rect x="48" y="62" width="180" height="38" rx="3" fill="#e8f0fe" fill-opacity="0.75"
        stroke="#446688" stroke-width="1.2" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="48" y="58" font-size="8.5" fill="#446688" font-weight="bold" filter="url(#rough2)">扫描到 t = 5：闭区间 [t−window, t] = [0, 5]</text>

  <line x1="42" y1="116" x2="352" y2="116" stroke="#999" stroke-width="1.5" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <line x1="48" y1="113" x2="48" y2="119" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="84" y1="113" x2="84" y2="119" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="120" y1="113" x2="120" y2="119" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="156" y1="113" x2="156" y2="119" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="192" y1="113" x2="192" y2="119" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="228" y1="113" x2="228" y2="119" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="264" y1="113" x2="264" y2="119" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="300" y1="113" x2="300" y2="119" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="336" y1="113" x2="336" y2="119" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="48" y="130" text-anchor="middle" font-size="7" fill="#999" filter="url(#rough2)">0</text>
  <text x="84" y="130" text-anchor="middle" font-size="7" fill="#999" filter="url(#rough2)">1</text>
  <text x="120" y="130" text-anchor="middle" font-size="7" fill="#999" filter="url(#rough2)">2</text>
  <text x="156" y="130" text-anchor="middle" font-size="7" fill="#999" filter="url(#rough2)">3</text>
  <text x="192" y="130" text-anchor="middle" font-size="7" fill="#999" filter="url(#rough2)">4</text>
  <text x="228" y="130" text-anchor="middle" font-size="7" fill="#999" filter="url(#rough2)">5</text>
  <text x="264" y="130" text-anchor="middle" font-size="7" fill="#999" filter="url(#rough2)">6</text>
  <text x="300" y="130" text-anchor="middle" font-size="7" fill="#999" filter="url(#rough2)">7</text>
  <text x="336" y="130" text-anchor="middle" font-size="7" fill="#999" filter="url(#rough2)">8</text>

  <circle cx="120" cy="78" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="81" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="120" cy="97" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="100" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">2</text>

  <circle cx="228" cy="88" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="228" y="91" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">5</text>
  <line x1="218" y1="78" x2="238" y2="98" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="218" y1="98" x2="238" y2="78" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <text x="350" y="76" font-size="8.5" fill="#333" filter="url(#rough2)">队列 = [2, 2]（最近 k=2 个保留）</text>
  <text x="350" y="90" font-size="8.5" fill="#333" filter="url(#rough2)">t − 队首 = 5 − 2 = 3 ≤ window</text>
  <text x="350" y="104" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⇒ 保留 5 凑成 k+1 个同窗，放弃</text>

  <!-- ======== Row 2: processing t = 6 ======== -->
  <text x="48" y="133" font-size="0" fill="#446688" filter="url(#rough2)"> </text>
  <rect x="84" y="138" width="180" height="38" rx="3" fill="#e8f0fe" fill-opacity="0.75"
        stroke="#446688" stroke-width="1.2" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="48" y="134" font-size="8.5" fill="#446688" font-weight="bold" filter="url(#rough2)">扫描到 t = 6：闭区间 [1, 6]（长度仍恰为 window）</text>

  <line x1="42" y1="192" x2="352" y2="192" stroke="#999" stroke-width="1.5" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <line x1="48" y1="189" x2="48" y2="195" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="84" y1="189" x2="84" y2="195" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="120" y1="189" x2="120" y2="195" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="156" y1="189" x2="156" y2="195" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="192" y1="189" x2="192" y2="195" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="228" y1="189" x2="228" y2="195" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="264" y1="189" x2="264" y2="195" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="300" y1="189" x2="300" y2="195" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="336" y1="189" x2="336" y2="195" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="48" y="206" text-anchor="middle" font-size="7" fill="#999" filter="url(#rough2)">0</text>
  <text x="84" y="206" text-anchor="middle" font-size="7" fill="#999" filter="url(#rough2)">1</text>
  <text x="120" y="206" text-anchor="middle" font-size="7" fill="#999" filter="url(#rough2)">2</text>
  <text x="156" y="206" text-anchor="middle" font-size="7" fill="#999" filter="url(#rough2)">3</text>
  <text x="192" y="206" text-anchor="middle" font-size="7" fill="#999" filter="url(#rough2)">4</text>
  <text x="228" y="206" text-anchor="middle" font-size="7" fill="#999" filter="url(#rough2)">5</text>
  <text x="264" y="206" text-anchor="middle" font-size="7" fill="#999" filter="url(#rough2)">6</text>
  <text x="300" y="206" text-anchor="middle" font-size="7" fill="#999" filter="url(#rough2)">7</text>
  <text x="336" y="206" text-anchor="middle" font-size="7" fill="#999" filter="url(#rough2)">8</text>

  <circle cx="120" cy="154" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="157" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="120" cy="173" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="176" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">2</text>

  <circle cx="228" cy="164" r="8" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="228" y="167" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="228" y="149" text-anchor="middle" font-size="7" fill="#999" filter="url(#rough2)">已弃</text>

  <circle cx="264" cy="164" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="264" y="167" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">6</text>
  <line x1="254" y1="154" x2="274" y2="174" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="254" y1="174" x2="274" y2="154" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <text x="350" y="152" font-size="8.5" fill="#333" filter="url(#rough2)">t − 队首 = 6 − 2 = 4 ≤ window</text>
  <text x="350" y="166" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⇒ 放弃 6；本用户保留 {2, 2}</text>
  <text x="350" y="180" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">示例 2 只有用户 1 ⇒ 总答案 2 ✓</text>

  <!-- legend -->
  <circle cx="64" cy="224" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="74" y="228" font-size="8.5" fill="#666" filter="url(#rough2)">保留</text>
  <circle cx="140" cy="224" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="135" y1="219" x2="145" y2="229" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="228" font-size="8.5" fill="#666" filter="url(#rough2)">放弃的候选 t</text>
  <circle cx="250" cy="224" r="5" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <text x="260" y="228" font-size="8.5" fill="#666" filter="url(#rough2)">已弃</text>
  <rect x="320" y="219" width="16" height="10" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <text x="340" y="228" font-size="8.5" fill="#666" filter="url(#rough2)">长度 window 的闭区间</text>

  <!-- insight box -->
  <rect x="36" y="244" width="448" height="122" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="266" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">等价改写：任意闭区间 ≤ k ⟺ 排序后 t[i+k] − t[i] &gt; window（k+1 个挤进跨度 ≤ window）</text>
  <text x="260" y="284" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">队列只需存最近 k 个保留时刻：更旧的与未来任何 t′ 的跨度只增不减，永不参与违规判定</text>
  <text x="260" y="302" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">为什么放弃的是最新 t：旧请求过期更早，删旧留新总数不增、后续更挤（交换论证见题解）</text>
  <text x="260" y="320" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">判定取等（≤ window）：闭区间含端点，间隔恰为 window 也冲突（示例 3 的口径）</text>
  <text x="260" y="344" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">贪心 = 最优：前缀计数不变式 |G∩(−∞,x]| ≥ |OPT∩(−∞,x]|，归纳三行收官 ✓</text>
</svg>
