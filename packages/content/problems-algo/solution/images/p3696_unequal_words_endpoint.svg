<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">核心观察：最优对必有一端贴边（下标 0 或 n−1）</text>

  <!-- 示例 2 的数组 -->
  <text x="124" y="45" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">端点</text>
  <text x="396" y="45" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">端点</text>

  <rect x="94" y="50" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="73" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>

  <rect x="162" y="50" width="60" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="73" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>

  <rect x="230" y="50" width="60" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="73" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>

  <rect x="298" y="50" width="60" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="73" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>

  <rect x="366" y="50" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="396" y="73" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>

  <text x="124" y="100" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="192" y="100" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="260" y="100" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="328" y="100" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="396" y="100" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">4</text>

  <!-- 最优对弧线 -->
  <path d="M 192 106 Q 294 150 396 106" fill="none" stroke="#b85450" stroke-width="2"
        marker-start="url(#arrR)" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="294" y="146" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">最优对 (1, 4)：j − i + 1 = 4</text>

  <!-- 两个公式框 -->
  <rect x="25" y="158" width="230" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">与左端点配对 (0, i)</text>
  <text x="140" y="200" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">words[i] ≠ words[0] ⇒ 距离 i + 1</text>
  <text x="140" y="214" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">首元素固定，枚举另一端</text>

  <rect x="265" y="158" width="230" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="380" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">与右端点配对 (i, n−1)</text>
  <text x="380" y="200" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">words[i] ≠ words[n−1] ⇒ 距离 n − i</text>
  <text x="380" y="214" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">末元素固定，枚举另一端</text>

  <!-- 反证法框 -->
  <rect x="25" y="232" width="470" height="116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">为什么最优对一定贴边？（反证法）</text>
  <text x="260" y="274" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">反设最优对 (i, j) 两端都不贴边：0 &lt; i &lt; j &lt; n−1</text>
  <text x="260" y="294" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">则换更远的端点必不合法：words[0] = words[j]，words[n−1] = words[i]</text>
  <text x="260" y="314" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">⇒ words[0] ≠ words[n−1]，对 (0, n−1) 距离 = n 更大，矛盾！</text>
  <text x="260" y="334" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">∴ 最优对必有一端是 words[0] 或 words[n−1]</text>
</svg>
