<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2799f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arr2799g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr2799r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：扩展凑齐 k 种 → 计数 → 左端右移</text>

  <!-- init -->
  <rect x="180" y="44" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">k=不同元素数, right=0, distinct=0</text>

  <path d="M280,82 L280,104" stroke="#446688" stroke-width="2" marker-end="url(#arr2799f)" filter="url(#rough2)"/>

  <!-- loop header diamond -->
  <path d="M280,108 L380,152 L280,196 L180,152 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="150" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">left &lt; n ?</text>
  <text x="280" y="166" text-anchor="middle" font-size="10" fill="#d6a040">遍历每个左端</text>

  <!-- yes branch down -->
  <text x="290" y="212" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M280,196 L280,218" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr2799g)" filter="url(#rough2)"/>

  <!-- expand box -->
  <rect x="150" y="222" width="260" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="242" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">① while right&lt;n 且 distinct&lt;k：</text>
  <text x="280" y="260" text-anchor="middle" font-size="11" fill="#4a7a3a">加入 nums[right]，right++，更新 distinct</text>

  <path d="M280,272 L280,292" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr2799g)" filter="url(#rough2)"/>

  <!-- check diamond -->
  <path d="M280,294 L390,330 L280,366 L170,330 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">distinct == k ?</text>
  <text x="280" y="344" text-anchor="middle" font-size="10" fill="#d6a040">凑齐了？</text>

  <!-- yes: count -->
  <text x="120" y="326" font-size="11" fill="#446688" font-weight="bold">是</text>
  <path d="M170,330 L110,330 L110,384" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr2799f)" filter="url(#rough2)"/>

  <rect x="30" y="386" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="140" y="407" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">② ans += n − right + 1</text>

  <!-- no: skip count -->
  <text x="400" y="326" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M390,330 L470,330 L470,384" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arr2799r)" filter="url(#rough2)"/>
  <text x="478" y="360" font-size="9" fill="#b85450">凑不齐，跳过</text>

  <!-- remove box -->
  <rect x="290" y="386" width="220" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="400" y="407" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">③ 移出 nums[left]，更新 distinct</text>

  <!-- both flow to loop back -->
  <path d="M140,420 L140,440 L540,440 L540,152 L380,152" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr2799f)" filter="url(#rough2)"/>
  <text x="430" y="434" font-size="10" fill="#446688">left++，回到循环</text>

  <!-- exit branch -->
  <text x="392" y="146" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M380,152 L460,152 L460,124" stroke="#b85450" stroke-width="2" marker-end="url(#arr2799r)" filter="url(#rough2)"/>
  <rect x="410" y="90" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="470" y="112" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">return ans</text>
</svg>
