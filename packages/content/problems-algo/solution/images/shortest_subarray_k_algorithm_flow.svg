<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：遍历右端 j，先查队头再保队尾</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">前缀和 P[0..n]；deque 存下标、P 值单调递增；均摊 O(n)</text>

  <!-- Step 1: init -->
  <rect x="190" y="58" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">初始化：deque 空，ans = ∞</text>
  <path d="M 280 92 L 280 104" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop -->
  <rect x="190" y="106" width="180" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">for j = 0 … n（含 P[0]=0）</text>
  <path d="M 280 136 L 280 148" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: front check (diamond) -->
  <polygon points="280,150 400,184 280,218 160,184" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="180" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">队头满足</text>
  <text x="280" y="194" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">P[front] ≤ P[j]−k ?</text>

  <!-- Yes branch -->
  <path d="M 400 184 L 470 184" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="436" y="178" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="430" y="170" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="490" y="184" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">ans = min(ans, j−front)</text>
  <text x="490" y="196" text-anchor="middle" font-size="9" fill="#4a7a3a">弹出队头 front</text>
  <!-- loop back to diamond (continue checking front) -->
  <path d="M 490 204 L 490 220 L 280 220 L 280 218" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3,2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="385" y="234" text-anchor="middle" font-size="8" fill="#4a7a3a">while：继续查新队头</text>

  <!-- No branch downward -->
  <path d="M 280 218 L 280 248" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="236" font-size="9" fill="#888">否</text>

  <!-- Decision 2: back check (diamond) -->
  <polygon points="280,250 400,284 280,318 160,284" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">队尾被支配</text>
  <text x="280" y="294" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">P[back] ≥ P[j] ?</text>

  <!-- Yes branch -->
  <path d="M 400 284 L 470 284" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="436" y="278" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">是</text>
  <rect x="430" y="270" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="490" y="290" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">弹出队尾 back</text>
  <path d="M 490 300 L 490 316 L 280 316 L 280 318" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="385" y="330" text-anchor="middle" font-size="8" fill="#b85450">while：继续查新队尾</text>

  <!-- No branch downward -->
  <path d="M 280 318 L 280 346" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="336" font-size="9" fill="#888">否</text>

  <!-- Step: push j -->
  <rect x="200" y="348" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">j 入队尾</text>

  <!-- loop back to for -->
  <path d="M 200 363 L 120 363 L 120 121 L 190 121" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="240" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">下一</text>
  <text x="100" y="252" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">个 j</text>

  <!-- end -->
  <path d="M 280 378 L 280 392" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="394" width="220" height="20" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="280" y="408" text-anchor="middle" font-size="10" fill="#555">遍历结束：return ans == ∞ ? −1 : ans</text>

  <!-- order note -->
  <rect x="20" y="58" width="150" height="56" fill="#fafafa" stroke="#bbb" stroke-width="0.8" rx="5" filter="url(#rough2)"/>
  <text x="36" y="74" font-size="9" fill="#888" font-weight="bold">顺序要点</text>
  <text x="36" y="88" font-size="8" fill="#555">① 先查队头（用 j</text>
  <text x="36" y="98" font-size="8" fill="#555">   当右端找答案）</text>
  <text x="36" y="108" font-size="8" fill="#555">② 再保队尾单调</text>
</svg>
