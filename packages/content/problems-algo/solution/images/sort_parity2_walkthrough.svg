<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [4, 2, 5, 7]</text>

  <!-- ===== Step 1 ===== -->
  <text x="40" y="48" font-size="12" fill="#888" font-weight="bold">第 1 步</text>
  <text x="100" y="48" font-size="11" fill="#555">i=0 → nums[0]=4（偶）偶下标放偶数 ✓ → i=2</text>

  <!-- index numbers -->
  <text x="202" y="66" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="254" y="66" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="306" y="66" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="358" y="66" text-anchor="middle" font-size="9" fill="#aaa">3</text>

  <!-- pointer label -->
  <text x="202" y="84" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i↓</text>

  <!-- cells: [4,2,5,7]; idx0 correct (blue), others grey -->
  <rect x="176" y="88" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="110" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">4</text>
  <rect x="228" y="88" width="52" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="110" text-anchor="middle" font-size="15" fill="#999">2</text>
  <rect x="280" y="88" width="52" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="306" y="110" text-anchor="middle" font-size="15" fill="#999">5</text>
  <rect x="332" y="88" width="52" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="358" y="110" text-anchor="middle" font-size="15" fill="#999">7</text>

  <!-- ===== Step 2 ===== -->
  <text x="40" y="146" font-size="12" fill="#888" font-weight="bold">第 2 步</text>
  <text x="100" y="146" font-size="11" fill="#555">i=2 → nums[2]=5（奇）误入偶下标 ✗ → j=1 处 2（偶）误入奇下标 → 交换</text>

  <!-- index numbers -->
  <text x="202" y="164" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="254" y="164" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="306" y="164" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="358" y="164" text-anchor="middle" font-size="9" fill="#aaa">3</text>

  <!-- pointer labels -->
  <text x="254" y="182" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">j↓</text>
  <text x="306" y="182" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">i↓</text>

  <!-- cells: [4,2,5,7]; idx1 (pink, 2 even, wrong thick), idx2 (blue, 5 odd, wrong thick) -->
  <rect x="176" y="186" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="208" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">4</text>
  <rect x="228" y="186" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="208" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <rect x="280" y="186" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="306" y="208" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">5</text>
  <rect x="332" y="186" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="208" text-anchor="middle" font-size="15" fill="#999">7</text>

  <!-- swap arrow between idx1(254) and idx2(306) -->
  <path d="M 254 222 Q 280 238 306 222" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 306 222 Q 280 238 254 222" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="236" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">swap</text>

  <!-- ===== Step 3: done ===== -->
  <text x="40" y="260" font-size="12" fill="#888" font-weight="bold">第 3 步</text>
  <text x="100" y="260" font-size="11" fill="#555">i=4 ≥ n=4 → 所有偶下标已处理，结束</text>

  <!-- cells: [4,5,2,7] all correct (green) -->
  <rect x="176" y="278" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="300" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">4</text>
  <rect x="228" y="278" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="300" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">5</text>
  <rect x="280" y="278" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="306" y="300" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <rect x="332" y="278" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="300" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">7</text>

  <!-- index numbers below result -->
  <text x="202" y="324" text-anchor="middle" font-size="9" fill="#aaa">0偶</text>
  <text x="254" y="324" text-anchor="middle" font-size="9" fill="#aaa">1奇</text>
  <text x="306" y="324" text-anchor="middle" font-size="9" fill="#aaa">2偶</text>
  <text x="358" y="324" text-anchor="middle" font-size="9" fill="#aaa">3奇</text>

  <!-- result note -->
  <rect x="120" y="330" width="320" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">结果 [4, 5, 2, 7]：偶下标放偶数、奇下标放奇数 ✓</text>
</svg>
