<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="780" height="520" fill="#fdfcf7"/>

  <text x="390" y="32" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold">栈解法演算：S = "(()(()))"</text>
  <path d="M 250 42 Q 390 50 530 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="390" y="56" text-anchor="middle" font-size="11" fill="#888">规则：( → 压 0；) → 弹 v，v==0 得 1 否则得 2v，再加到新栈顶</text>

  <!-- 字符串展示 -->
  <text x="60" y="86" font-size="12" fill="#888" font-weight="bold">字符串</text>
  <g filter="url(#sk)">
    <rect x="220" y="70" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="262" y="70" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="304" y="70" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="346" y="70" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="388" y="70" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="430" y="70" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="472" y="70" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="514" y="70" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="240" y="92" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">(</text>
  <text x="282" y="92" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">(</text>
  <text x="324" y="92" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">)</text>
  <text x="366" y="92" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">(</text>
  <text x="408" y="92" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">(</text>
  <text x="450" y="92" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">)</text>
  <text x="492" y="92" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">)</text>
  <text x="534" y="92" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">)</text>
  <text x="240" y="116" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="282" y="116" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="324" y="116" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="366" y="116" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="408" y="116" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="450" y="116" text-anchor="middle" font-size="9" fill="#888">5</text>
  <text x="492" y="116" text-anchor="middle" font-size="9" fill="#888">6</text>
  <text x="534" y="116" text-anchor="middle" font-size="9" fill="#888">7</text>

  <!-- 高亮两个 () 原子 -->
  <g filter="url(#sk)">
    <rect x="260" y="66" width="84" height="42" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5,3" rx="6"/>
    <rect x="386" y="66" width="84" height="42" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5,3" rx="6"/>
  </g>
  <text x="302" y="130" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">"()" 得 1</text>
  <text x="428" y="130" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">"()" 得 1</text>

  <!-- 步骤表 -->
  <text x="60" y="160" font-size="12" fill="#2b2b2b" font-weight="bold">逐步执行：</text>
  <g filter="url(#sk)">
    <rect x="60" y="168" width="660" height="252" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3"/>
  </g>
  <text x="80" y="190" font-size="11" fill="#2b2b2b" font-weight="bold">i</text>
  <text x="120" y="190" font-size="11" fill="#2b2b2b" font-weight="bold">S[i]</text>
  <text x="190" y="190" font-size="11" fill="#2b2b2b" font-weight="bold">操作</text>
  <text x="440" y="190" font-size="11" fill="#2b2b2b" font-weight="bold">栈（底→顶）</text>

  <!-- init -->
  <text x="80" y="212" font-size="10" fill="#888">-</text>
  <text x="120" y="212" font-size="10" fill="#888">-</text>
  <text x="190" y="212" font-size="10" fill="#444">初始：栈 = [0]</text>
  <text x="440" y="212" font-size="10" fill="#4a8edb" font-family="monospace">[0]</text>

  <!-- i=0 -->
  <text x="80" y="234" font-size="10" fill="#2b2b2b">0</text>
  <text x="120" y="234" font-size="10" fill="#446688" font-weight="bold">(</text>
  <text x="190" y="234" font-size="10" fill="#444">压 0（开新层）</text>
  <text x="440" y="234" font-size="10" fill="#4a8edb" font-family="monospace">[0, 0]</text>

  <!-- i=1 -->
  <text x="80" y="256" font-size="10" fill="#2b2b2b">1</text>
  <text x="120" y="256" font-size="10" fill="#446688" font-weight="bold">(</text>
  <text x="190" y="256" font-size="10" fill="#444">压 0</text>
  <text x="440" y="256" font-size="10" fill="#4a8edb" font-family="monospace">[0, 0, 0]</text>

  <!-- i=2 -->
  <text x="80" y="278" font-size="10" fill="#2b2b2b">2</text>
  <text x="120" y="278" font-size="10" fill="#b85450" font-weight="bold">)</text>
  <text x="190" y="278" font-size="10" fill="#444">弹 v=0 → 得 1，加到新顶</text>
  <text x="440" y="278" font-size="10" fill="#4a8edb" font-family="monospace">[0, 1]</text>

  <!-- i=3 -->
  <text x="80" y="300" font-size="10" fill="#2b2b2b">3</text>
  <text x="120" y="300" font-size="10" fill="#446688" font-weight="bold">(</text>
  <text x="190" y="300" font-size="10" fill="#444">压 0</text>
  <text x="440" y="300" font-size="10" fill="#4a8edb" font-family="monospace">[0, 1, 0]</text>

  <!-- i=4 -->
  <text x="80" y="322" font-size="10" fill="#2b2b2b">4</text>
  <text x="120" y="322" font-size="10" fill="#446688" font-weight="bold">(</text>
  <text x="190" y="322" font-size="10" fill="#444">压 0</text>
  <text x="440" y="322" font-size="10" fill="#4a8edb" font-family="monospace">[0, 1, 0, 0]</text>

  <!-- i=5 -->
  <text x="80" y="344" font-size="10" fill="#2b2b2b">5</text>
  <text x="120" y="344" font-size="10" fill="#b85450" font-weight="bold">)</text>
  <text x="190" y="344" font-size="10" fill="#444">弹 v=0 → 得 1，加到新顶</text>
  <text x="440" y="344" font-size="10" fill="#4a8edb" font-family="monospace">[0, 1, 1]</text>

  <!-- i=6 -->
  <text x="80" y="366" font-size="10" fill="#2b2b2b">6</text>
  <text x="120" y="366" font-size="10" fill="#b85450" font-weight="bold">)</text>
  <text x="190" y="366" font-size="10" fill="#b85450">弹 v=1 → 得 2×1=2，加到新顶</text>
  <text x="440" y="366" font-size="10" fill="#4a8edb" font-family="monospace">[0, 3]</text>

  <!-- i=7 -->
  <text x="80" y="388" font-size="10" fill="#2b2b2b">7</text>
  <text x="120" y="388" font-size="10" fill="#b85450" font-weight="bold">)</text>
  <text x="190" y="388" font-size="10" fill="#b85450">弹 v=3 → 得 2×3=6，加到新顶</text>
  <text x="440" y="388" font-size="10" fill="#4a8edb" font-family="monospace">[6]</text>

  <!-- 答案 -->
  <text x="80" y="412" font-size="11" fill="#b85450" font-weight="bold">答案</text>
  <text x="190" y="412" font-size="11" fill="#b85450" font-weight="bold">栈仅剩 [6] → score = 6 ✓</text>

  <!-- 底部要点 -->
  <g filter="url(#sk)">
    <rect x="60" y="436" width="660" height="68" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="80" y="460" font-size="11" fill="#2b2b2b" font-weight="bold">关键观察：</text>
  <text x="80" y="478" font-size="10" fill="#444">① 每层用一个「累加器」值 0 占位，) 时弹出并结算本层　② v==0 区分 "()"(得1) 与 "(A)"(得 2v)</text>
  <text x="80" y="494" font-size="10" fill="#444">③ 结算结果回加到「上一层累加器」，天然实现规则 2 的 A+B　④ 最终栈底即总分数</text>
</svg>
