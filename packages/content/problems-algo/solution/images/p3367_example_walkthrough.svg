<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：edges=[[0,1,4],[0,2,2],[2,3,12],[2,4,6]]，k=2</text>

  <!-- 左：树 -->
  <circle cx="128" cy="74" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="128" y="79" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">0</text>

  <line x1="116" y1="84" x2="54" y2="146" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="110" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>

  <line x1="137" y1="88" x2="203" y2="146" stroke="#b85450" stroke-width="2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="182" y="112" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2 ✗删</text>

  <line x1="202" y1="171" x2="146" y2="244" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="158" y="212" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">12</text>

  <line x1="218" y1="171" x2="254" y2="244" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="248" y="204" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">6</text>

  <circle cx="46" cy="158" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="162" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>

  <circle cx="210" cy="158" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="162" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>

  <circle cx="138" cy="256" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="138" y="260" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>

  <circle cx="262" cy="256" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="262" y="260" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="155" y="296" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">节点 2 度数 3 &gt; k=2，必让一条</text>
  <text x="155" y="312" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">（红色虚边最终被删）</text>

  <!-- 右：四步 -->
  <rect x="290" y="54" width="222" height="46" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="401" y="72" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">① 叶子 1 / 3 / 4</text>
  <text x="401" y="90" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">dp[·][0] = dp[·][1] = 0</text>

  <rect x="290" y="108" width="222" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="401" y="126" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">② 节点 2：gains = [12, 6]</text>
  <text x="401" y="144" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">预算 k=2：dp[2][0] = 18</text>
  <text x="401" y="162" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">预算 k−1=1：dp[2][1] = 12</text>

  <rect x="290" y="186" width="222" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="401" y="204" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">③ 节点 0：base = 18</text>
  <text x="401" y="222" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">gain(1) = 0+4−0 = +4 ✓ 取</text>
  <text x="401" y="240" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">gain(2) = 12+2−18 = −4 ✗ 弃</text>
  <text x="401" y="262" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">dp[0][0] = 18 + 4 = 22</text>

  <rect x="290" y="282" width="222" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="401" y="302" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">④ 移除边 (0, 2, 2)</text>
  <text x="401" y="322" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">保留 4 + 12 + 6 = 22 ✓</text>

  <text x="260" y="354" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">保 0−2 需牺牲孩子边 6（拿 2 换 6 净亏 4）——「名额之争」正是双状态要统筹的耦合</text>
</svg>
