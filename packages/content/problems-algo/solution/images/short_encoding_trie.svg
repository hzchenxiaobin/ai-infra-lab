<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">逆序插入 Trie：叶子 = 未被覆盖的单词</text>
  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888">反转后「后缀关系」变「前缀关系」，共享前缀路径</text>

  <!-- reversal legend -->
  <text x="30" y="74" font-size="10.5" fill="#555">time → emit ， me → em ， bell → lleb</text>

  <!-- Trie tree -->
  <!-- Root -->
  <g filter="url(#rough2)">
    <circle cx="200" cy="110" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="200" y="114" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">root</text>

  <!-- branch e (emit / em) -->
  <path d="M 200 132 L 200 164" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="152" font-size="10" fill="#888">e</text>
  <g filter="url(#rough2)">
    <circle cx="200" cy="184" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="200" y="188" text-anchor="middle" font-size="11" fill="#446688">e</text>

  <!-- m (end of "em" = reversed "me") — internal, has child -->
  <path d="M 200 202 L 200 232" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="220" font-size="10" fill="#888">m</text>
  <g filter="url(#rough2)">
    <circle cx="200" cy="252" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3"/>
  </g>
  <text x="200" y="256" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">m</text>
  <text x="200" y="284" text-anchor="middle" font-size="9" fill="#b85450">词尾 "me" → 非叶子</text>
  <text x="200" y="296" text-anchor="middle" font-size="9" fill="#b85450">(有子节点，被覆盖)</text>

  <!-- i -->
  <path d="M 200 272 L 200 302" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="290" font-size="10" fill="#888">i</text>
  <g filter="url(#rough2)">
    <circle cx="200" cy="322" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="200" y="326" text-anchor="middle" font-size="11" fill="#446688">i</text>

  <!-- t (leaf = reversed "time") -->
  <path d="M 200 340 L 200 368" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="358" font-size="10" fill="#888">t</text>
  <g filter="url(#rough2)">
    <circle cx="200" cy="388" r="20" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2.2"/>
  </g>
  <text x="200" y="392" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">t</text>
  <text x="248" y="392" font-size="10" fill="#2e8b57" font-weight="bold">叶子 → 计入 4+1</text>

  <!-- branch l (lleb = bell) -->
  <path d="M 218 110 Q 300 110 360 150" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="120" font-size="10" fill="#888">l</text>
  <g filter="url(#rough2)">
    <circle cx="380" cy="168" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="380" y="172" text-anchor="middle" font-size="11" fill="#446688">l</text>

  <path d="M 380 186 L 380 214" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="204" font-size="10" fill="#888">l</text>
  <g filter="url(#rough2)">
    <circle cx="380" cy="234" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="380" y="238" text-anchor="middle" font-size="11" fill="#446688">l</text>

  <path d="M 380 252 L 380 280" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="270" font-size="10" fill="#888">e</text>
  <g filter="url(#rough2)">
    <circle cx="380" cy="300" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="380" y="304" text-anchor="middle" font-size="11" fill="#446688">e</text>

  <path d="M 380 318 L 380 346" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="336" font-size="10" fill="#888">b</text>
  <g filter="url(#rough2)">
    <circle cx="380" cy="366" r="20" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2.2"/>
  </g>
  <text x="380" y="370" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">b</text>
  <text x="428" y="370" font-size="10" fill="#2e8b57" font-weight="bold">叶子 → 计入 4+1</text>

  <!-- legend box -->
  <rect x="470" y="74" width="120" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="530" y="94" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">图例</text>
  <g filter="url(#rough2)">
    <circle cx="492" cy="116" r="9" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2"/>
  </g>
  <text x="510" y="120" font-size="9.5" fill="#555">叶子(计入)</text>
  <g filter="url(#rough2)">
    <circle cx="492" cy="142" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="3 2"/>
  </g>
  <text x="510" y="146" font-size="9.5" fill="#555">词尾但非叶子</text>
  <text x="510" y="158" font-size="9" fill="#b85450">(被覆盖,跳过)</text>
  <g filter="url(#rough2)">
    <circle cx="492" cy="176" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="510" y="180" font-size="9.5" fill="#555">普通内部节点</text>

  <!-- answer -->
  <rect x="470" y="208" width="120" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="530" y="226" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Σ(叶子深度+1)</text>
  <text x="530" y="244" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">= 5 + 5 = 10</text>

  <!-- bottom note -->
  <rect x="30" y="408" width="540" height="0" fill="none"/>
  <text x="300" y="416" text-anchor="middle" font-size="10" fill="#4a7a3a">💡 后缀→前缀：A 是 B 后缀 ⇔ rev(A) 是 rev(B) 前缀 ⇔ rev(A) 的节点有子节点(非叶子)</text>
</svg>
