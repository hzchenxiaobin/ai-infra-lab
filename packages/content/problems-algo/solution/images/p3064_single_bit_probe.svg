<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：单比特探测——询问 2ⁱ，「计数器」退化成「指示灯」</text>
  <text x="260" y="43" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">设隐藏数 n = 33（下面只画低 8 位，高 22 位同理）</text>

  <!-- n bit row -->
  <text x="66" y="76" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">n = 33</text>
  <rect x="118" y="56" width="26" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="131" y="76" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="146" y="56" width="26" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="159" y="76" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="174" y="56" width="26" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="187" y="76" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="202" y="56" width="26" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="215" y="76" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="230" y="56" width="26" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="243" y="76" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="258" y="56" width="26" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="271" y="76" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="286" y="56" width="26" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="299" y="76" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="314" y="56" width="26" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="327" y="76" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="131" y="102" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">7</text>
  <text x="159" y="102" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">6</text>
  <text x="187" y="102" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="215" y="102" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="243" y="102" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="271" y="102" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="299" y="102" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="327" y="102" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="356" y="76" font-size="10.5" fill="#888" filter="url(#rough2)">位下标 →</text>

  <!-- panel A: probe bit 5 -->
  <rect x="32" y="118" width="222" height="138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="143" y="138" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">探测 i = 5：问 num = 2⁵ = 32</text>
  <rect x="56" y="148" width="20" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="66" y="163" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="78" y="148" width="20" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="88" y="163" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="100" y="148" width="20" height="22" fill="#fde9c8" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="110" y="163" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="122" y="148" width="20" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="132" y="163" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="144" y="148" width="20" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="154" y="163" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="166" y="148" width="20" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="176" y="163" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="188" y="148" width="20" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="198" y="163" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="210" y="148" width="20" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="220" y="163" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <path d="M 143 174 L 143 188" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="156" y="186" font-size="10" fill="#8a6d3b" filter="url(#rough2)">n &amp; num 再数设置位</text>
  <text x="143" y="206" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">n &amp; 2⁵ = 00100000₂ → 设置位个数 1</text>
  <rect x="68" y="216" width="150" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="143" y="232" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">n 的第 5 位 = 1 ✓</text>

  <!-- panel B: probe bit 3 -->
  <rect x="266" y="118" width="222" height="138" fill="#f5f7fa" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="377" y="138" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">探测 i = 3：问 num = 2³ = 8</text>
  <rect x="290" y="148" width="20" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="300" y="163" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="312" y="148" width="20" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="322" y="163" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="334" y="148" width="20" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="344" y="163" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="356" y="148" width="20" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="366" y="163" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="378" y="148" width="20" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="388" y="163" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="400" y="148" width="20" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="410" y="163" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="422" y="148" width="20" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="432" y="163" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="444" y="148" width="20" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="454" y="163" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <path d="M 377 174 L 377 188" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="390" y="186" font-size="10" fill="#446688" filter="url(#rough2)">n &amp; num 再数设置位</text>
  <text x="377" y="206" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">n &amp; 2³ = 00000000₂ → 设置位个数 0</text>
  <rect x="302" y="216" width="150" height="24" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="377" y="232" text-anchor="middle" font-size="11.5" fill="#777" font-weight="bold" filter="url(#rough2)">n 的第 3 位 = 0</text>

  <!-- summary box -->
  <rect x="48" y="272" width="424" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">API 返回 popcount(n &amp; num)：num 只含一个设置位 ⇒ n &amp; num ∈ {0, 2ⁱ}</text>
  <text x="260" y="314" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">返回值只能是 1 或 0 —— 恰好就是 n 在第 i 位上的取值</text>
  <text x="260" y="334" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">n = Σ 2ⁱ × [commonSetBits(2ⁱ) &gt; 0]，i = 0 … 29</text>
</svg>
