<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">甜点成本构成：基底（必选 1）+ 配料（每种 0/1/2 份）→ 最接近 target</text>

  <!-- ===== Base section ===== -->
  <text x="95" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">基底 baseCosts</text>
  <rect x="50" y="62" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="72" y="88" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <rect x="100" y="62" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="122" y="88" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">7</text>
  <text x="95" y="118" text-anchor="middle" font-size="10" fill="#888">必选 1 种</text>

  <!-- plus sign -->
  <text x="172" y="90" text-anchor="middle" font-size="20" fill="#888" font-weight="bold">+</text>

  <!-- ===== Topping section ===== -->
  <text x="265" y="52" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">配料 toppingCosts</text>
  <rect x="220" y="62" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="242" y="88" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>
  <rect x="270" y="62" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="292" y="88" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">4</text>
  <text x="242" y="118" text-anchor="middle" font-size="9" fill="#4a7a3a">×0 / ×1 / ×2</text>
  <text x="292" y="118" text-anchor="middle" font-size="9" fill="#4a7a3a">×0 / ×1 / ×2</text>

  <!-- equals sign -->
  <text x="342" y="90" text-anchor="middle" font-size="20" fill="#888" font-weight="bold">=</text>

  <!-- ===== Target section ===== -->
  <text x="430" y="52" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">目标 target</text>
  <rect x="390" y="62" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="89" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">10</text>
  <text x="430" y="118" text-anchor="middle" font-size="10" fill="#888">最接近此值</text>

  <!-- ===== Example highlight ===== -->
  <path d="M 122 104 L 122 150 L 242 150 L 242 104" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,3" fill="none" filter="url(#rough2)"/>
  <text x="182" y="166" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">7 + 1×3 = 10 = target ✓</text>

  <!-- ===== Formula box ===== -->
  <rect x="40" y="190" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="212" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">总成本 = base + Σ kᵢ × toppingCosts[i]</text>
  <text x="280" y="232" text-anchor="middle" font-size="11" fill="#888">kᵢ ∈ {0, 1, 2}（每种配料最多 2 份），base 必选</text>

  <!-- ===== Cost line with target ===== -->
  <text x="40" y="272" font-size="11" fill="#888">成本轴：</text>
  <line x1="90" y1="288" x2="500" y2="288" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="90" y1="280" x2="90" y2="296" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="500" y1="280" x2="500" y2="296" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- cost marks -->
  <circle cx="180" cy="288" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="310" text-anchor="middle" font-size="9" fill="#446688">7</text>
  <circle cx="340" cy="288" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="340" y="310" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">10</text>
  <text x="340" y="276" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">target</text>
  <circle cx="400" cy="288" r="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="310" text-anchor="middle" font-size="9" fill="#4a7a3a">11</text>

  <text x="460" y="328" text-anchor="middle" font-size="10" fill="#888">选 |cost − target| 最小者</text>
</svg>
