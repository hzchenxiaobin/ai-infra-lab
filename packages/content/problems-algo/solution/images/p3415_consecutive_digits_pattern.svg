<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">「三个连续数字」= 数值连续递增 d → d+1 → d+2</text>

  <!-- digit ladder 0..9 -->
  <g filter="url(#rough2)">
    <rect x="42" y="40" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="62" y="60" text-anchor="middle" font-size="13" fill="#333">0</text>
    <rect x="86" y="40" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="106" y="60" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="130" y="40" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="150" y="60" text-anchor="middle" font-size="13" fill="#333">2</text>
    <rect x="174" y="40" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="194" y="60" text-anchor="middle" font-size="13" fill="#333">3</text>
    <rect x="218" y="40" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="238" y="60" text-anchor="middle" font-size="13" fill="#333">4</text>
    <rect x="262" y="40" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="282" y="60" text-anchor="middle" font-size="13" fill="#333">5</text>
    <rect x="306" y="40" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="326" y="60" text-anchor="middle" font-size="13" fill="#333">6</text>
    <rect x="350" y="40" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="370" y="60" text-anchor="middle" font-size="13" fill="#333">7</text>
    <rect x="394" y="40" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="414" y="60" text-anchor="middle" font-size="13" fill="#333">8</text>
    <rect x="438" y="40" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="458" y="60" text-anchor="middle" font-size="13" fill="#333">9</text>
  </g>

  <!-- green arc under 1,2,3 -->
  <path d="M 90 80 Q 152 94 214 80" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="152" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">d, d+1, d+2</text>

  <text x="260" y="126" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">候选闭集（d ∈ [0,7]）：012 · 123 · 234 · 345 · 456 · 567 · 678 · 789</text>

  <!-- row 1: ABC123XYZ -->
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <rect x="144" y="140" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="156" y="158" text-anchor="middle">A</text>
    <rect x="170" y="140" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="182" y="158" text-anchor="middle">B</text>
    <rect x="196" y="140" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="208" y="158" text-anchor="middle">C</text>
    <rect x="222" y="140" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="234" y="158" text-anchor="middle">1</text>
    <rect x="248" y="140" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="260" y="158" text-anchor="middle">2</text>
    <rect x="274" y="140" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="286" y="158" text-anchor="middle">3</text>
    <rect x="300" y="140" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="312" y="158" text-anchor="middle">X</text>
    <rect x="326" y="140" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="338" y="158" text-anchor="middle">Y</text>
    <rect x="352" y="140" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="364" y="158" text-anchor="middle">Z</text>
  </g>
  <text x="260" y="184" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓ 含 123（1→2→3 连续递增）→ 命中</text>

  <!-- row 2: Item003Description -->
  <g filter="url(#rough2)" font-size="10.5" fill="#333">
    <rect x="27" y="200" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="39" y="217" text-anchor="middle">I</text>
    <rect x="53" y="200" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="65" y="217" text-anchor="middle">t</text>
    <rect x="79" y="200" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="91" y="217" text-anchor="middle">e</text>
    <rect x="105" y="200" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="117" y="217" text-anchor="middle">m</text>
    <rect x="131" y="200" width="24" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="143" y="217" text-anchor="middle">0</text>
    <rect x="157" y="200" width="24" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="169" y="217" text-anchor="middle">0</text>
    <rect x="183" y="200" width="24" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="195" y="217" text-anchor="middle">3</text>
    <rect x="209" y="200" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="221" y="217" text-anchor="middle">D</text>
    <rect x="235" y="200" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="247" y="217" text-anchor="middle">e</text>
    <rect x="261" y="200" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="273" y="217" text-anchor="middle">s</text>
    <rect x="287" y="200" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="299" y="217" text-anchor="middle">c</text>
    <rect x="313" y="200" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="325" y="217" text-anchor="middle">r</text>
    <rect x="339" y="200" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="351" y="217" text-anchor="middle">i</text>
    <rect x="365" y="200" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="377" y="217" text-anchor="middle">p</text>
    <rect x="391" y="200" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="403" y="217" text-anchor="middle">t</text>
    <rect x="417" y="200" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="429" y="217" text-anchor="middle">i</text>
    <rect x="443" y="200" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="455" y="217" text-anchor="middle">o</text>
    <rect x="469" y="200" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="481" y="217" text-anchor="middle">n</text>
  </g>
  <text x="260" y="244" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗ 只有 003（0→0→3 数值不连续）→ 不命中</text>

  <!-- warning box -->
  <rect x="40" y="260" width="440" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="11" fill="#7a4a2b" filter="url(#rough2)">⚠ [0-9]{3} 只匹配「任意三个连排的数字字符」，会把 003 误判为命中</text>
  <text x="260" y="292" text-anchor="middle" font-size="11" fill="#7a4a2b" filter="url(#rough2)">——「数值连续递增」与「位置连排」是两种不同的语义</text>

  <!-- bottom note -->
  <rect x="40" y="312" width="440" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="335" text-anchor="middle" font-size="11" fill="#2d5523" filter="url(#rough2)">命中多组也只算一行：Product56789 含 567、678、789，仍只输出 1 行</text>
</svg>
