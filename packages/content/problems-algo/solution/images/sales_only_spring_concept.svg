<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：「仅在春季销售」= 全部销售日期都落在窗口内</text>

  <!-- Timeline -->
  <text x="30" y="56" font-size="11.5" fill="#888">① 时间轴：2019 年春季窗口 [2019-01-01, 2019-03-31]</text>

  <!-- Spring window highlight -->
  <rect x="190" y="70" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="255" y="89" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2019 春季</text>

  <!-- Timeline axis -->
  <line x1="40" y1="105" x2="560" y2="105" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="120" font-size="9.5" fill="#aaa">2018-12</text>
  <text x="190" y="120" font-size="9.5" fill="#4a7a3a" font-weight="bold">01-01</text>
  <text x="320" y="120" font-size="9.5" fill="#4a7a3a" font-weight="bold">03-31</text>
  <text x="520" y="120" font-size="9.5" fill="#aaa">2019-12</text>

  <!-- Tick marks for window boundaries -->
  <line x1="190" y1="100" x2="190" y2="110" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="320" y1="100" x2="320" y2="110" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <!-- Product 1: S8 — all in window -->
  <text x="30" y="146" font-size="11.5" fill="#888">② 产品 1 (S8)：唯一一笔销售 2019-01-21 落在窗口内 → ✓ 仅春季</text>
  <rect x="40" y="152" width="520" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="170" font-size="10.5" fill="#446688">S8</text>
  <circle cx="235" cy="166" r="6" fill="#4a7a3a" stroke="#3a5a2a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="235" y="142" text-anchor="middle" font-size="9" fill="#4a7a3a">01-21</text>
  <text x="510" y="170" font-size="11" fill="#4a7a3a" font-weight="bold">MIN≥起 AND MAX≤止 ✓</text>

  <!-- Product 2: G4 — one in, one out -->
  <text x="30" y="198" font-size="11.5" fill="#888">③ 产品 2 (G4)：两笔销售，01-17 在窗口内但 06-02 在窗口外 → ✗ 非仅春季</text>
  <rect x="40" y="204" width="520" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="222" font-size="10.5" fill="#d6a040">G4</text>
  <circle cx="240" cy="218" r="6" fill="#4a7a3a" stroke="#3a5a2a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="194" text-anchor="middle" font-size="9" fill="#4a7a3a">02-17</text>
  <circle cx="400" cy="218" r="6" fill="#b85450" stroke="#8a3a30" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="194" text-anchor="middle" font-size="9" fill="#b85450">06-02</text>
  <text x="500" y="222" font-size="11" fill="#b85450" font-weight="bold">MAX 超出窗口 ✗</text>

  <!-- Product 3: iPhone — all out -->
  <text x="30" y="250" font-size="11.5" fill="#888">④ 产品 3 (iPhone)：唯一一笔销售 05-13 在窗口外 → ✗ 非仅春季</text>
  <rect x="40" y="256" width="520" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="274" font-size="10.5" fill="#b85450">iPhone</text>
  <circle cx="385" cy="270" r="6" fill="#b85450" stroke="#8a3a30" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="385" y="246" text-anchor="middle" font-size="9" fill="#b85450">05-13</text>
  <text x="500" y="274" font-size="11" fill="#b85450" font-weight="bold">MIN 超出窗口 ✗</text>

  <!-- Key insight -->
  <path d="M 300 290 L 300 310" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="316" width="540" height="70" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="50" y="338" font-size="11.5" fill="#555" font-weight="bold">💡 「仅在春季」的数学翻译</text>
  <text x="50" y="356" font-size="11" fill="#888">一个产品的所有销售日期都落在 [2019-01-01, 2019-03-31] 内</text>
  <text x="50" y="372" font-size="11" fill="#888">等价于：MIN(sale_date) ≥ '2019-01-01' AND MAX(sale_date) ≤ '2019-03-31'</text>

  <!-- Result -->
  <rect x="40" y="398" width="520" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="420" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">HAVING MIN(sale_date) ≥ '2019-01-01' AND MAX(sale_date) ≤ '2019-03-31'</text>
  <text x="300" y="440" text-anchor="middle" font-size="10.5" fill="#555">结果 = 仅产品 1 (S8) 通过过滤</text>
</svg>
