<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">片段移动规则：L 只能向左，R 只能向右，彼此永不交叉</text>

  <!-- ===== Row A: L moves left ===== -->
  <text x="40" y="78" font-size="12" fill="#b85450" font-weight="bold">L 片段</text>
  <g font-size="14">
    <rect x="120" y="64" width="44" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="142" y="89" text-anchor="middle" fill="#aaa">_</text>
    <rect x="164" y="64" width="44" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="186" y="89" text-anchor="middle" fill="#aaa">_</text>
    <rect x="208" y="64" width="44" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="230" y="90" text-anchor="middle" fill="#b85450" font-weight="bold">L</text>
    <rect x="252" y="64" width="44" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="274" y="89" text-anchor="middle" fill="#aaa">_</text>
    <rect x="296" y="64" width="44" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="318" y="89" text-anchor="middle" fill="#aaa">_</text>
  </g>
  <!-- leftward arc arrow -->
  <path d="M 226 50 Q 180 24 144 50" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="185" y="22" text-anchor="middle" font-size="11" fill="#b85450">向左滑入空位</text>

  <!-- ===== Row B: R moves right ===== -->
  <text x="40" y="158" font-size="12" fill="#4a7a3a" font-weight="bold">R 片段</text>
  <g font-size="14">
    <rect x="120" y="144" width="44" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="142" y="169" text-anchor="middle" fill="#aaa">_</text>
    <rect x="164" y="144" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="186" y="170" text-anchor="middle" fill="#4a7a3a" font-weight="bold">R</text>
    <rect x="208" y="144" width="44" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="230" y="169" text-anchor="middle" fill="#aaa">_</text>
    <rect x="252" y="144" width="44" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="274" y="169" text-anchor="middle" fill="#aaa">_</text>
    <rect x="296" y="144" width="44" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="318" y="169" text-anchor="middle" fill="#aaa">_</text>
  </g>
  <path d="M 210 130 Q 256 104 312 130" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="260" y="102" text-anchor="middle" font-size="11" fill="#4a7a3a">向右滑入空位</text>

  <!-- ===== Row C: cannot cross ===== -->
  <text x="40" y="240" font-size="12" fill="#444" font-weight="bold">不可交叉</text>
  <g font-size="14">
    <rect x="164" y="226" width="44" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="186" y="252" text-anchor="middle" fill="#b85450" font-weight="bold">L</text>
    <rect x="208" y="226" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="230" y="252" text-anchor="middle" fill="#4a7a3a" font-weight="bold">R</text>
  </g>
  <!-- forbidden swap arrow (crossed out) -->
  <path d="M 186 216 C 186 196 230 196 230 216" stroke="#999" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 230 216 C 230 196 186 196 186 216" stroke="#999" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 198 198 L 218 218" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="208" y="288" text-anchor="middle" font-size="11" fill="#888">L 向左、R 向右，方向相背，永远交换不了位置</text>

  <!-- ===== Formula box ===== -->
  <rect x="40" y="304" width="480" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="328" font-size="12.5" fill="#444" font-weight="bold">关键推论：去掉所有 '_' 后</text>
  <text x="60" y="348" font-size="12" fill="#555">start 与 target 的 L/R 字符序列必须完全相同（顺序不变）</text>
</svg>
