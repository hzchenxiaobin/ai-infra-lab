<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">差分 d[i]=nums1[i]−nums2[i]：正差分需 −k，负差分需 +k</text>

  <!-- Column centers: 154, 238, 322, 406 ; cell w=60, gap=24, start x=124 -->
  <!-- index row -->
  <text x="110" y="62" text-anchor="end" font-size="11" fill="#888">下标</text>
  <text x="154" y="62" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="238" y="62" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="322" y="62" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="406" y="62" text-anchor="middle" font-size="11" fill="#888">3</text>

  <!-- nums1 row -->
  <text x="110" y="96" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">nums1</text>
  <rect x="124" y="76" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="96" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="208" y="76" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="96" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="292" y="76" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="96" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="376" y="76" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="406" y="96" text-anchor="middle" font-size="13" fill="#333">4</text>

  <!-- nums2 row -->
  <text x="110" y="134" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold">nums2</text>
  <rect x="124" y="114" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="134" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="208" y="114" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="134" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="292" y="114" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="134" text-anchor="middle" font-size="13" fill="#333">7</text>
  <rect x="376" y="114" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="406" y="134" text-anchor="middle" font-size="13" fill="#333">1</text>

  <!-- minus signs between nums1 and nums2 -->
  <text x="280" y="158" text-anchor="middle" font-size="13" fill="#888">−</text>

  <!-- diff row (highlighted) -->
  <text x="110" y="186" text-anchor="end" font-size="13" fill="#b85450" font-weight="bold">diff</text>
  <rect x="124" y="166" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="188" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">+3</text>
  <rect x="208" y="166" width="60" height="34" fill="#fafafa" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="188" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">0</text>
  <rect x="292" y="166" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="188" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">−6</text>
  <rect x="376" y="166" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="406" y="188" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">+3</text>

  <!-- two groups: positive diffs (need -k) on left, negative diffs (need +k) on right -->
  <!-- left group box -->
  <rect x="40" y="226" width="220" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="244" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">正差分 → 需 −k 消减</text>
  <text x="150" y="266" text-anchor="middle" font-size="11" fill="#333">idx0: +3 ⇒ 1 次 −k</text>
  <text x="150" y="284" text-anchor="middle" font-size="11" fill="#333">idx3: +3 ⇒ 1 次 −k</text>
  <text x="150" y="306" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Σ正 = 6 ⇒ 2 次</text>

  <!-- right group box -->
  <rect x="300" y="226" width="220" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="244" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">负差分 → 需 +k 抬升</text>
  <text x="410" y="266" text-anchor="middle" font-size="11" fill="#333">idx2: −6 ⇒ 2 次 +k</text>
  <text x="410" y="290" text-anchor="middle" font-size="11" fill="#888">（其余差分为 0）</text>
  <text x="410" y="306" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">Σ|负| = 6 ⇒ 2 次</text>

  <!-- pairing arrows between groups -->
  <path d="M 260 272 L 300 272" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">配对</text>

  <!-- Bottom note -->
  <rect x="40" y="338" width="480" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">每次操作 = 1 个 −k + 1 个 +k（总和守恒）⇒ 答案 = Σ正差分 / k = Σ|负差分| / k</text>
</svg>
