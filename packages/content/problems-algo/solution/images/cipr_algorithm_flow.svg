<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：求 gcd → 判是否 2 的幂</text>
  <text x="270" y="42" text-anchor="middle" font-size="11" fill="#888">不构造路径，直接用数论闭合判定</text>

  <!-- Step 1: compute gcd -->
  <rect x="130" y="56" width="280" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 求 g = gcd(targetX, targetY)</text>
  <text x="270" y="94" text-anchor="middle" font-size="9" fill="#888">欧几里得算法，O(log min(X,Y))</text>

  <path d="M 270 102 L 270 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: power of two? -->
  <polygon points="270,124 350,164 270,204 190,164" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="160" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">g 是 2 的幂?</text>
  <text x="270" y="176" text-anchor="middle" font-size="9" fill="#888">(g &amp; (g−1)) == 0</text>

  <!-- yes -> true -->
  <path d="M 350 164 L 416 164" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="383" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="418" y="142" width="100" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="468" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return</text>
  <text x="468" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- no -> false -->
  <path d="M 270 204 L 270 230" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="222" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="210" y="232" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="258" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return false</text>

  <!-- Bit trick panel -->
  <rect x="40" y="296" width="460" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="316" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">判 2 的幂技巧：g &amp; (g−1) == 0</text>
  <text x="270" y="332" text-anchor="middle" font-size="9" fill="#888">2 的幂的二进制只有一个 1，减 1 后全变 1，相与为 0</text>

  <!-- examples row -->
  <text x="70" y="356" font-size="10" fill="#446688" font-family="monospace" font-weight="bold">g=1</text>
  <text x="110" y="356" font-size="9" fill="#888" font-family="monospace">1 &amp; 0 = 0</text>
  <text x="168" y="356" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <text x="200" y="356" font-size="10" fill="#446688" font-family="monospace" font-weight="bold">g=2</text>
  <text x="240" y="356" font-size="9" fill="#888" font-family="monospace">10 &amp; 01 = 0</text>
  <text x="300" y="356" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <text x="330" y="356" font-size="10" fill="#446688" font-family="monospace" font-weight="bold">g=3</text>
  <text x="370" y="356" font-size="9" fill="#888" font-family="monospace">11 &amp; 10 = 2</text>
  <text x="430" y="356" font-size="10" fill="#b85450" font-weight="bold">✗</text>

  <text x="120" y="378" font-size="10" fill="#446688" font-family="monospace" font-weight="bold">g=4</text>
  <text x="160" y="378" font-size="9" fill="#888" font-family="monospace">100 &amp; 011 = 0</text>
  <text x="230" y="378" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <text x="270" y="398" text-anchor="middle" font-size="9" fill="#888">g ≥ 1 恒成立（X,Y ≥ 1）；g=1 时 1&amp;0=0 判为 2⁰ ✓</text>
</svg>
