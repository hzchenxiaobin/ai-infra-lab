<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：同一张表，四个 API 四种答案</text>

  <!-- Table: 10 rows x 5 cols, show 4 rows + ellipsis -->
  <rect x="30" y="48" width="260" height="230" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="68" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">players：10 行 × 5 列</text>

  <!-- header -->
  <rect x="42" y="78" width="34" height="20" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="59" y="92" text-anchor="middle" font-size="9" fill="#fff" filter="url(#rough2)">id</text>
  <rect x="78" y="78" width="44" height="20" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="92" text-anchor="middle" font-size="9" fill="#fff" filter="url(#rough2)">name</text>
  <rect x="124" y="78" width="30" height="20" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="139" y="92" text-anchor="middle" font-size="9" fill="#fff" filter="url(#rough2)">age</text>
  <rect x="156" y="78" width="48" height="20" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="92" text-anchor="middle" font-size="9" fill="#fff" filter="url(#rough2)">position</text>
  <rect x="206" y="78" width="40" height="20" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="226" y="92" text-anchor="middle" font-size="9" fill="#fff" filter="url(#rough2)">team</text>

  <!-- rows -->
  <rect x="42" y="100" width="34" height="18" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="59" y="113" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">846</text>
  <rect x="78" y="100" width="44" height="18" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="113" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Mason</text>
  <rect x="124" y="100" width="30" height="18" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="139" y="113" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">21</text>
  <rect x="156" y="100" width="48" height="18" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="113" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Forward</text>
  <rect x="206" y="100" width="40" height="18" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="226" y="113" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">Real..</text>

  <rect x="42" y="120" width="34" height="18" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="59" y="133" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">749</text>
  <rect x="78" y="120" width="44" height="18" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="133" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Riley</text>
  <rect x="124" y="120" width="30" height="18" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="139" y="133" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">30</text>
  <rect x="156" y="120" width="48" height="18" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="133" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Winger</text>
  <rect x="206" y="120" width="40" height="18" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="226" y="133" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">Bar..</text>

  <rect x="42" y="140" width="34" height="18" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="59" y="153" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">155</text>
  <rect x="78" y="140" width="44" height="18" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="153" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Bob</text>
  <rect x="124" y="140" width="30" height="18" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="139" y="153" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">28</text>
  <rect x="156" y="140" width="48" height="18" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="153" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Striker</text>
  <rect x="206" y="140" width="40" height="18" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="226" y="153" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">Man..</text>

  <text x="160" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">⋮  还有 7 行 ⋮</text>

  <!-- count annotations -->
  <path d="M 300 82 L 300 176" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="118" font-size="10" fill="#446688" filter="url(#rough2)">len(players)</text>
  <text x="308" y="132" font-size="10" fill="#446688" filter="url(#rough2)">= 10</text>

  <path d="M 42 236 L 246 236" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="254" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">len(players.columns) = 5</text>

  <!-- Right: API comparison -->
  <rect x="330" y="48" width="206" height="230" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="433" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">API 对对碰</text>

  <rect x="344" y="82" width="178" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="433" y="99" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">df.shape → (10, 5) ✅</text>
  <text x="433" y="115" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">一次拿俩，正是题目要的</text>

  <rect x="344" y="130" width="178" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="433" y="147" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">len(df) → 10 ✅</text>
  <text x="433" y="163" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">只给行数，等于 shape[0]</text>

  <rect x="344" y="178" width="178" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="433" y="195" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">len(df.columns) → 5 ✅</text>
  <text x="433" y="211" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">只给列数，等于 shape[1]</text>

  <rect x="344" y="226" width="178" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="433" y="243" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">df.size → 50 ❌</text>
  <text x="433" y="259" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">元素总数 = 10 × 5，误用重灾区</text>

  <!-- Bottom note -->
  <rect x="55" y="302" width="450" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">返回前别忘了 list() 包装</text>
  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">题目要求返回 [10, 5]（list），而 .shape 给的是 (10, 5)（tuple）</text>
  <text x="280" y="366" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">list(players.shape) 一步转换，稳过评测</text>
</svg>
