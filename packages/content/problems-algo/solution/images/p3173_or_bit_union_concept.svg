<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 375" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="375" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：按位 OR = 置位集合的并集（只并不清）</text>

  <rect x="20" y="44" width="234" height="178" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="137" y="66" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">5 | 4 = 5</text>

  <text x="80" y="90" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">a = 5</text>
  <rect x="88" y="74" width="28" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="102" y="91" text-anchor="middle" font-size="12.5" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="121" y="74" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="135" y="91" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="154" y="74" width="28" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="91" text-anchor="middle" font-size="12.5" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="187" y="74" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="201" y="91" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="78" y="122" text-anchor="end" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">|</text>
  <text x="70" y="122" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">b = 4</text>
  <rect x="88" y="106" width="28" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="102" y="123" text-anchor="middle" font-size="12.5" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="121" y="106" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="135" y="123" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="154" y="106" width="28" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="123" text-anchor="middle" font-size="12.5" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="187" y="106" width="28" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="201" y="123" text-anchor="middle" font-size="12.5" fill="#aaa" filter="url(#rough2)">0</text>

  <path d="M 88 140 L 215 140" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>

  <text x="80" y="162" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a|b</text>
  <rect x="88" y="146" width="28" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="102" y="163" text-anchor="middle" font-size="12.5" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="121" y="146" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="135" y="163" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="154" y="146" width="28" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="163" text-anchor="middle" font-size="12.5" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="187" y="146" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="201" y="163" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="222" y="163" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 5</text>

  <text x="137" y="190" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">4 的置位 ⊆ 5 的置位（子掩码）</text>
  <text x="137" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 左端取等：5 | 4 = max = 5</text>

  <rect x="266" y="44" width="234" height="178" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="383" y="66" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">8 | 4 = 12</text>

  <text x="326" y="90" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">a = 8</text>
  <rect x="334" y="74" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="348" y="91" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="367" y="74" width="28" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="381" y="91" text-anchor="middle" font-size="12.5" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="400" y="74" width="28" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="414" y="91" text-anchor="middle" font-size="12.5" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="433" y="74" width="28" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="447" y="91" text-anchor="middle" font-size="12.5" fill="#aaa" filter="url(#rough2)">0</text>

  <text x="324" y="122" text-anchor="end" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">|</text>
  <text x="316" y="122" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">b = 4</text>
  <rect x="334" y="106" width="28" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="348" y="123" text-anchor="middle" font-size="12.5" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="367" y="106" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="381" y="123" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="400" y="106" width="28" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="414" y="123" text-anchor="middle" font-size="12.5" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="433" y="106" width="28" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="447" y="123" text-anchor="middle" font-size="12.5" fill="#aaa" filter="url(#rough2)">0</text>

  <path d="M 334 140 L 461 140" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>

  <text x="326" y="162" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a|b</text>
  <rect x="334" y="146" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="348" y="163" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="367" y="146" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="381" y="163" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="400" y="146" width="28" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="414" y="163" text-anchor="middle" font-size="12.5" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="433" y="146" width="28" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="447" y="163" text-anchor="middle" font-size="12.5" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="468" y="163" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 12</text>

  <text x="383" y="190" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">两数无公共置位（a &amp; b = 0）</text>
  <text x="383" y="208" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">→ 右端取等：8 | 4 = 8 + 4 = 12</text>

  <rect x="32" y="238" width="456" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="261" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">夹逼：max(a, b) ≤ a | b ≤ a + b</text>
  <text x="260" y="281" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">左取等 ⟺ 子掩码（位包含）；右取等 ⟺ 位不相交（a &amp; b = 0）</text>

  <rect x="32" y="304" width="456" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="327" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">恒等式：a + b = (a | b) + (a &amp; b)</text>
  <text x="260" y="347" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">AND 补回 OR 吞掉的公共位：9 + 11 = 20 = (9|11) + (9&amp;11) = 11 + 9</text>
</svg>
