<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 384"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="384" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    算法流程：左移拼接 + 滚动取模
  </text>

  <!-- Start -->
  <ellipse cx="270" cy="54" rx="38" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="58" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M270,70 L270,82" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="200" y="84" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans=0, shift=0, i=1</text>
  <path d="M270,114 L270,122" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond1: i <= n ? -->
  <polygon points="270,122 340,150 270,178 200,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i ≤ n ?</text>

  <!-- No -> return ans -->
  <path d="M340,150 L388,150" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="364" y="143" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="392" y="134" width="104" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="444" y="155" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">return ans</text>

  <!-- Yes -> down -->
  <path d="M270,178 L270,196" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="192" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- diamond2: i 是 2 的幂 ? -->
  <polygon points="270,196 350,226 270,256 190,226" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="222" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i 是 2 的幂?</text>
  <text x="270" y="236" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(i &amp; (i-1) == 0)</text>

  <!-- Yes -> shift++ (right) -->
  <path d="M350,226 L398,226" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="374" y="219" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="400" y="210" width="92" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="446" y="231" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">shift += 1</text>
  <!-- shift++ down then left into compute right side -->
  <path d="M446,242 L446,305 L362,305" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No -> down -->
  <path d="M270,256 L270,286" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="274" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- compute ans -->
  <rect x="180" y="288" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="309" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = (ans&lt;&lt;shift | i) % MOD</text>
  <path d="M270,322 L270,330" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i++ -->
  <rect x="230" y="330" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="349" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i += 1</text>

  <!-- loop back: left then up then right into diamond1 left vertex -->
  <path d="M230,344 L96,344 L96,150 L196,150" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="84" y="250" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)" transform="rotate(-90 84 250)">下一轮</text>

  <text x="270" y="374" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    每轮 O(1)；遇 2 的幂 shift+1，否则直接左移拼接
  </text>
</svg>
