<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold">核心观察：manager_id 自引用链 → 谁能追溯到 CEO？</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">CEO 的 manager_id = 1（自引用）；沿 manager_id 链向上追溯，能到 1 即「向 CEO 汇报」</text>

  <!-- ===== Left: CEO subtree (reports to CEO) ===== -->
  <text x="30" y="74" font-size="11" fill="#4a7a3a" font-weight="bold">向 CEO 汇报 ✓</text>

  <!-- dashed box around CEO subtree -->
  <rect x="40" y="80" width="240" height="230" fill="none" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="5 4" rx="10" filter="url(#rough2)"/>

  <!-- CEO node (1, Boss) -->
  <circle cx="150" cy="110" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="150" y="115" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="150" y="148" text-anchor="middle" font-size="9.5" fill="#446688">Boss (CEO)</text>
  <text x="150" y="160" text-anchor="middle" font-size="9" fill="#888">manager_id=1</text>
  <text x="150" y="172" text-anchor="middle" font-size="9" fill="#888">(自引用=顶层)</text>

  <!-- 2 (Bob) - direct report -->
  <circle cx="95" cy="200" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="205" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="95" y="228" text-anchor="middle" font-size="9" fill="#4a7a3a">Bob</text>
  <text x="95" y="240" text-anchor="middle" font-size="8.5" fill="#888">mgr=1 ✓直接</text>
  <line x1="135" y1="128" x2="108" y2="184" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 77 (Robert) - direct report -->
  <circle cx="220" cy="200" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="205" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">77</text>
  <text x="220" y="228" text-anchor="middle" font-size="9" fill="#4a7a3a">Robert</text>
  <text x="220" y="240" text-anchor="middle" font-size="8.5" fill="#888">mgr=1 ✓直接</text>
  <line x1="168" y1="128" x2="207" y2="184" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 4 (Daniel) - indirect via 2 -->
  <circle cx="95" cy="270" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="95" y="275" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="95" y="296" text-anchor="middle" font-size="9" fill="#4a7a3a">Daniel</text>
  <text x="95" y="308" text-anchor="middle" font-size="8.5" fill="#888">mgr=2</text>
  <text x="95" y="318" text-anchor="middle" font-size="8.5" fill="#4a7a3a">4→2→1 ✓</text>
  <line x1="95" y1="217" x2="95" y2="254" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- 7 (Luis) - indirect via 4 -->
  <circle cx="175" cy="295" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="175" y="300" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="175" y="321" text-anchor="middle" font-size="9" fill="#4a7a3a">Luis</text>
  <text x="175" y="333" text-anchor="middle" font-size="8.5" fill="#888">mgr=4</text>
  <text x="175" y="343" text-anchor="middle" font-size="8.5" fill="#4a7a3a">7→4→2→1 ✓</text>
  <line x1="111" y1="270" x2="162" y2="282" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- ===== Right: non-reporting subtree ===== -->
  <text x="330" y="74" font-size="11" fill="#b85450" font-weight="bold">不向 CEO 汇报 ✗</text>

  <!-- dashed box around non-reporting subtree -->
  <rect x="330" y="80" width="200" height="230" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="5 4" rx="10" filter="url(#rough2)"/>

  <!-- 3 (Alice) - self-ref, not CEO -->
  <circle cx="410" cy="110" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="410" y="115" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="410" y="146" text-anchor="middle" font-size="9.5" fill="#b85450">Alice</text>
  <text x="410" y="158" text-anchor="middle" font-size="9" fill="#888">manager_id=3</text>
  <text x="410" y="170" text-anchor="middle" font-size="9" fill="#b85450">(自引用≠CEO)</text>

  <!-- 8 (Jhon) -->
  <circle cx="410" cy="200" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="205" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">8</text>
  <text x="410" y="226" text-anchor="middle" font-size="9" fill="#b85450">Jhon</text>
  <text x="410" y="238" text-anchor="middle" font-size="8.5" fill="#888">mgr=3</text>
  <text x="410" y="250" text-anchor="middle" font-size="8.5" fill="#b85450">8→3→3→... ✗</text>
  <line x1="410" y1="130" x2="410" y2="184" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- 9 (Angela) -->
  <circle cx="470" cy="270" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="275" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">9</text>
  <text x="470" y="296" text-anchor="middle" font-size="9" fill="#b85450">Angela</text>
  <text x="470" y="308" text-anchor="middle" font-size="8.5" fill="#888">mgr=8</text>
  <text x="470" y="320" text-anchor="middle" font-size="8.5" fill="#b85450">9→8→3→... ✗</text>
  <line x1="422" y1="210" x2="460" y2="256" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- ===== Bottom: result + key insight ===== -->
  <rect x="30" y="328" width="270" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="45" y="350" font-size="11" fill="#4a7a3a" font-weight="bold">输出 employee_id：</text>
  <text x="170" y="350" font-size="12.5" fill="#4a7a3a" font-weight="bold">{2, 77, 4, 7}</text>

  <rect x="320" y="328" width="210" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="330" y="350" font-size="10.5" fill="#b85450">manager_id 链追溯不到 1 → 排除</text>

  <rect x="30" y="372" width="500" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="45" y="389" font-size="10.5" fill="#555">关键：CEO 的 <tspan fill="#446688" font-weight="bold">manager_id = 1</tspan>（自引用，非 NULL）；员工 3 的 <tspan fill="#b85450" font-weight="bold">manager_id = 3</tspan>（也自引用，但不是 CEO）</text>
  <text x="45" y="404" font-size="10.5" fill="#555">→ 判定标准：沿 manager_id 链向上追溯，<tspan fill="#4a7a3a" font-weight="bold">能到达 employee_id=1</tspan> 即向 CEO 汇报；追溯不到则排除</text>
</svg>
