<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n=4, connections=[[0,1],[0,2],[1,2]]</text>

  <!-- table header -->
  <rect x="20" y="48" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="48" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步</text>
  <rect x="76" y="48" width="78" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">边 (u,v)</text>
  <rect x="154" y="48" width="130" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="219" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">parent [0,1,2,3]</text>
  <rect x="284" y="48" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="324" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">count</text>
  <rect x="364" y="48" width="156" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="442" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">操作说明</text>

  <!-- row 0: init -->
  <rect x="20" y="74" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="48" y="92" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">init</text>
  <rect x="76" y="74" width="78" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="115" y="92" text-anchor="middle" font-size="12" fill="#888">—</text>
  <rect x="154" y="74" width="130" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="219" y="92" text-anchor="middle" font-size="12" fill="#333">[0, 1, 2, 3]</text>
  <rect x="284" y="74" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="324" y="92" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="364" y="74" width="156" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="442" y="92" text-anchor="middle" font-size="11" fill="#666">各自为根</text>

  <!-- row 1: (0,1) -->
  <rect x="20" y="102" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="48" y="120" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">①</text>
  <rect x="76" y="102" width="78" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="115" y="120" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">(0,1)</text>
  <rect x="154" y="102" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="219" y="120" text-anchor="middle" font-size="12" fill="#333">[<tspan fill="#b85450" font-weight="bold">0</tspan>, 0, 2, 3]</text>
  <rect x="284" y="102" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="324" y="120" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="364" y="102" width="156" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="442" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a">不同根→union, parent[1]=0</text>

  <!-- row 2: (0,2) -->
  <rect x="20" y="130" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="48" y="148" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">②</text>
  <rect x="76" y="130" width="78" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="115" y="148" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">(0,2)</text>
  <rect x="154" y="130" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="219" y="148" text-anchor="middle" font-size="12" fill="#333">[0, 0, <tspan fill="#b85450" font-weight="bold">0</tspan>, 3]</text>
  <rect x="284" y="130" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="324" y="148" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="364" y="130" width="156" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="442" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a">不同根→union, parent[2]=0</text>

  <!-- row 3: (1,2) redundant -->
  <rect x="20" y="158" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="48" y="176" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">③</text>
  <rect x="76" y="158" width="78" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="176" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">(1,2)</text>
  <rect x="154" y="158" width="130" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="219" y="176" text-anchor="middle" font-size="12" fill="#888">[0, 0, 0, 3]</text>
  <rect x="284" y="158" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="324" y="176" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <rect x="364" y="158" width="156" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="442" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">find(1)=0=find(2)→跳过</text>

  <!-- result -->
  <rect x="20" y="196" width="500" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="219" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">count = 2 → 返回 count − 1 = 1 ⭐</text>

  <!-- graph before -->
  <text x="135" y="252" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">操作前：2 个分量</text>

  <circle cx="90" cy="290" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="295" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <circle cx="180" cy="290" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="295" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <circle cx="135" cy="340" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="135" y="345" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <circle cx="240" cy="340" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="345" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <!-- tree edges -->
  <line x1="106" y1="290" x2="164" y2="290" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="90" y1="306" x2="125" y2="324" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <!-- redundant edge (1,2) red dashed -->
  <path d="M 180 306 Q 165 322 148 326" stroke="#b85450" stroke-width="2.5" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="180" y="372" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">冗余线 (1,2)</text>

  <!-- arrow -->
  <line x1="280" y1="315" x2="330" y2="315" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="305" y="306" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">拔→插</text>

  <!-- graph after -->
  <text x="430" y="252" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">操作后：全连通</text>

  <circle cx="380" cy="290" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="295" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <circle cx="470" cy="290" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="295" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <circle cx="425" cy="340" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="425" y="345" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <circle cx="380" cy="340" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="345" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <!-- tree edges after -->
  <line x1="396" y1="290" x2="454" y2="290" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="380" y1="306" x2="415" y2="324" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <!-- moved cable (1,3) red solid -->
  <line x1="470" y1="306" x2="392" y2="324" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="430" y="372" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">重连 (1,3)</text>

  <rect x="20" y="382" width="500" height="14" fill="none"/>
</svg>
