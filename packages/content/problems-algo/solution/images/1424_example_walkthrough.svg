<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：不规则矩阵分桶与拼接（示例 2）</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888">自底向上 i=4→0 遍历，按 i+j 入桶，桶内天然 i 降序</text>

  <!-- ===== Left: ragged grid ===== -->
  <text x="160" y="72" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">不规则网格（颜色 = 对角线 i+j）</text>

  <!-- row labels -->
  <g font-size="10" fill="#888">
    <text x="44" y="92" text-anchor="middle">i=0</text>
    <text x="44" y="122" text-anchor="middle">i=1</text>
    <text x="44" y="152" text-anchor="middle">i=2</text>
    <text x="44" y="182" text-anchor="middle">i=3</text>
    <text x="44" y="212" text-anchor="middle">i=4</text>
  </g>

  <!-- cells: x=60+j*42, y=78+i*30, w=38, h=26 -->
  <!-- row0 -->
  <rect x="60" y="78" width="38" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="79" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="102" y="78" width="38" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="121" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="144" y="78" width="38" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="163" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="186" y="78" width="38" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="205" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="228" y="78" width="38" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="247" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <!-- row1 -->
  <rect x="60" y="108" width="38" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="79" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <rect x="102" y="108" width="38" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="121" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <!-- row2 -->
  <rect x="60" y="138" width="38" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="79" y="156" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <!-- row3 -->
  <rect x="60" y="168" width="38" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="79" y="186" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <rect x="102" y="168" width="38" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="121" y="186" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>
  <rect x="144" y="168" width="38" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="163" y="186" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">11</text>
  <!-- row4 -->
  <rect x="60" y="198" width="38" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="79" y="216" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">12</text>
  <rect x="102" y="198" width="38" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="121" y="216" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">13</text>
  <rect x="144" y="198" width="38" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="163" y="216" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">14</text>
  <rect x="186" y="198" width="38" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="205" y="216" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">15</text>
  <rect x="228" y="198" width="38" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="247" y="216" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">16</text>

  <!-- processing order arrow (bottom-up) on far left -->
  <path d="M 30 211 L 30 91" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="22" y="156" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" transform="rotate(-90 22 156)">处理顺序 i: 4→0</text>

  <!-- g4 evolution note -->
  <rect x="40" y="240" width="240" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160" y="258" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">观察桶 g₄ 的形成（i 降序入桶）</text>
  <text x="50" y="276" font-size="10" fill="#555">i=4 入 12 → i=3 入 10 → i=0 入 5</text>
  <text x="50" y="290" font-size="10" fill="#4a7a3a" font-weight="bold">⇒ g₄ = [12, 10, 5]（自下而上）✓</text>

  <!-- legend -->
  <g font-size="9" fill="#555">
    <rect x="40" y="308" width="12" height="10" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="56" y="317">s%4=0</text>
    <rect x="100" y="308" width="12" height="10" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="116" y="317">s%4=1</text>
    <rect x="160" y="308" width="12" height="10" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="176" y="317">s%4=2</text>
    <rect x="220" y="308" width="12" height="10" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
    <text x="236" y="317">s%4=3</text>
  </g>

  <!-- ===== Right: buckets ===== -->
  <text x="490" y="72" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">最终各桶内容（按桶号 s 升序）</text>

  <!-- buckets g0..g8, y = 84 + k*28, chip 30x22 from x=370 -->
  <!-- g0 -->
  <text x="340" y="100" font-size="10" fill="#4a7a3a" font-weight="bold">g₀</text>
  <rect x="360" y="86" width="30" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="375" y="102" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <!-- g1 -->
  <text x="340" y="128" font-size="10" fill="#446688" font-weight="bold">g₁</text>
  <rect x="360" y="114" width="30" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="375" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <rect x="394" y="114" width="30" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="409" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <!-- g2 -->
  <text x="340" y="156" font-size="10" fill="#d6a040" font-weight="bold">g₂</text>
  <rect x="360" y="142" width="30" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="375" y="158" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <rect x="394" y="142" width="30" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="409" y="158" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <rect x="428" y="142" width="30" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="443" y="158" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <!-- g3 -->
  <text x="340" y="184" font-size="10" fill="#b85450" font-weight="bold">g₃</text>
  <rect x="360" y="170" width="30" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="375" y="186" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">9</text>
  <rect x="394" y="170" width="30" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="409" y="186" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <!-- g4 (highlight) -->
  <text x="340" y="212" font-size="10" fill="#4a7a3a" font-weight="bold">g₄</text>
  <rect x="356" y="198" width="38" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="375" y="214" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">12</text>
  <rect x="394" y="198" width="38" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="413" y="214" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>
  <rect x="432" y="198" width="30" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="447" y="214" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <!-- g5 -->
  <text x="340" y="240" font-size="10" fill="#446688" font-weight="bold">g₅</text>
  <rect x="360" y="226" width="30" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="375" y="242" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">13</text>
  <rect x="394" y="226" width="30" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="409" y="242" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">11</text>
  <!-- g6 -->
  <text x="340" y="268" font-size="10" fill="#d6a040" font-weight="bold">g₆</text>
  <rect x="360" y="254" width="30" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="375" y="270" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">14</text>
  <!-- g7 -->
  <text x="340" y="296" font-size="10" fill="#b85450" font-weight="bold">g₇</text>
  <rect x="360" y="282" width="30" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="375" y="298" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">15</text>
  <!-- g8 -->
  <text x="340" y="324" font-size="10" fill="#4a7a3a" font-weight="bold">g₈</text>
  <rect x="360" y="310" width="30" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="375" y="326" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">16</text>

  <!-- concat arrow -->
  <path d="M 490 340 L 490 356" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="540" y="350" font-size="10" fill="#888">按 s 升序拼接</text>

  <!-- ===== Final output ===== -->
  <rect x="40" y="362" width="560" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="384" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">[1, 6, 2, 8, 7, 3, 9, 4, 12, 10, 5, 13, 11, 14, 15, 16]</text>

  <!-- key insight -->
  <rect x="40" y="406" width="560" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="426" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">关键：i+j 定桶号（全局序），i 降序遍历定桶内序（自下而上）</text>
  <text x="320" y="444" text-anchor="middle" font-size="10" fill="#555">行长度不齐也无妨——每个有效元素 O(1) 归位，无需扫描空位，整体 O(n)</text>
</svg>
