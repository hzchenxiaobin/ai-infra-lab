<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [−4,−1,1,2]，target = 1</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">双指针逐步夹逼，best 从 −4 锁定到 2（差值仅 1，全局最优）</text>

  <!-- Step 0: init -->
  <g font-size="11" fill="#333">
    <text x="30" y="78" font-size="11" fill="#888" font-weight="bold">初始：</text>
    <text x="74" y="78" font-size="10" fill="#555">best = nums[0]+nums[1]+nums[2] = (−4)+(−1)+1 = −4，target = 1</text>
  </g>

  <!-- sorted array header -->
  <text x="30" y="108" font-size="10" fill="#888">排序后：</text>
  <g font-size="12" fill="#333">
    <rect x="84" y="92" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="112" y="114" text-anchor="middle">−4</text>
    <rect x="142" y="92" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="170" y="114" text-anchor="middle">−1</text>
    <rect x="200" y="92" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="228" y="114" text-anchor="middle">1</text>
    <rect x="258" y="92" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="286" y="114" text-anchor="middle">2</text>
    <text x="112" y="86" text-anchor="middle" font-size="9" fill="#888">idx 0</text>
    <text x="170" y="86" text-anchor="middle" font-size="9" fill="#888">idx 1</text>
    <text x="228" y="86" text-anchor="middle" font-size="9" fill="#888">idx 2</text>
    <text x="286" y="86" text-anchor="middle" font-size="9" fill="#888">idx 3</text>
  </g>

  <!-- Step 1: i=0, left=1, right=3 -->
  <g font-size="11" fill="#333">
    <text x="30" y="158" font-size="11" fill="#444" font-weight="bold">步骤 1：</text>
    <text x="78" y="158" font-size="10" fill="#555">i=0(−4), left=1(−1), right=3(2)</text>
    <!-- mini array -->
    <rect x="84" y="166" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="112" y="186" text-anchor="middle" font-size="11">−4</text>
    <rect x="142" y="166" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="170" y="186" text-anchor="middle" font-size="11">−1</text>
    <rect x="200" y="166" width="56" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="228" y="186" text-anchor="middle" font-size="11" fill="#aaa">1</text>
    <rect x="258" y="166" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="286" y="186" text-anchor="middle" font-size="11">2</text>
    <text x="112" y="210" text-anchor="middle" font-size="9" fill="#4a7a3a">i</text>
    <text x="170" y="210" text-anchor="middle" font-size="9" fill="#446688">left</text>
    <text x="286" y="210" text-anchor="middle" font-size="9" fill="#d6a040">right</text>
    <text x="330" y="178" font-size="10" fill="#555">s = −4+(−1)+2 = −3</text>
    <text x="330" y="194" font-size="10" fill="#b85450">|−3−1|=4 &lt; |−4−1|=5 → best=−3</text>
    <text x="330" y="210" font-size="10" fill="#446688">s &lt; target → left++</text>
  </g>

  <!-- Step 2: i=0, left=2, right=3 -->
  <g font-size="11" fill="#333">
    <text x="30" y="240" font-size="11" fill="#444" font-weight="bold">步骤 2：</text>
    <text x="78" y="240" font-size="10" fill="#555">i=0(−4), left=2(1), right=3(2)</text>
    <rect x="84" y="248" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="112" y="268" text-anchor="middle" font-size="11">−4</text>
    <rect x="142" y="248" width="56" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="170" y="268" text-anchor="middle" font-size="11" fill="#aaa">−1</text>
    <rect x="200" y="248" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="228" y="268" text-anchor="middle" font-size="11">1</text>
    <rect x="258" y="248" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="286" y="268" text-anchor="middle" font-size="11">2</text>
    <text x="112" y="292" text-anchor="middle" font-size="9" fill="#4a7a3a">i</text>
    <text x="228" y="292" text-anchor="middle" font-size="9" fill="#446688">left</text>
    <text x="286" y="292" text-anchor="middle" font-size="9" fill="#d6a040">right</text>
    <text x="330" y="260" font-size="10" fill="#555">s = −4+1+2 = −1</text>
    <text x="330" y="276" font-size="10" fill="#b85450">|−1−1|=2 &lt; |−3−1|=4 → best=−1</text>
    <text x="330" y="292" font-size="10" fill="#446688">s &lt; target → left++（left==right，本轮结束）</text>
  </g>

  <!-- Step 3: i=1, left=2, right=3 -->
  <g font-size="11" fill="#333">
    <text x="30" y="322" font-size="11" fill="#444" font-weight="bold">步骤 3：</text>
    <text x="78" y="322" font-size="10" fill="#555">i=1(−1), left=2(1), right=3(2)</text>
    <rect x="84" y="330" width="56" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="112" y="350" text-anchor="middle" font-size="11" fill="#aaa">−4</text>
    <rect x="142" y="330" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="170" y="350" text-anchor="middle" font-size="11">−1</text>
    <rect x="200" y="330" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="228" y="350" text-anchor="middle" font-size="11">1</text>
    <rect x="258" y="330" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="286" y="350" text-anchor="middle" font-size="11">2</text>
    <text x="170" y="374" text-anchor="middle" font-size="9" fill="#4a7a3a">i</text>
    <text x="228" y="374" text-anchor="middle" font-size="9" fill="#446688">left</text>
    <text x="286" y="374" text-anchor="middle" font-size="9" fill="#d6a040">right</text>
    <text x="330" y="342" font-size="10" fill="#555">s = −1+1+2 = 2</text>
    <text x="330" y="358" font-size="10" fill="#b85450">|2−1|=1 &lt; |−1−1|=2 → best=2 ✅</text>
    <text x="330" y="374" font-size="10" fill="#d6a040">s &gt; target → right--（本轮结束）</text>
  </g>

  <!-- Final result -->
  <rect x="40" y="404" width="480" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="424" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">最终 best = 2（三元组 [−1, 1, 2]，与 target=1 差值仅 1）</text>
  <text x="280" y="440" text-anchor="middle" font-size="10" fill="#888">外层 i=2 时 i = n−2 越界，循环结束 → 返回 best</text>
</svg>
