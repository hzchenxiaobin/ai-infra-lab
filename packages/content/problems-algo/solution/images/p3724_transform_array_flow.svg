<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#999999"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：一趟扫描，每个 j 只做 O(1) 工作</text>

  <rect x="215" y="30" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="12" filter="url(#rough2)"/>
  <text x="260" y="46" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M 260 54 L 260 64" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="105" y="66" width="310" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="83" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">S = Σ|nums1[i]−nums2[i]|，t = nums2[n]</text>

  <path d="M 260 92 L 260 102" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="175" y="104" width="170" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="121" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">j = 0，best = +∞</text>

  <path d="M 260 130 L 260 140" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="142" width="340" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="158" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① lo = min(aⱼ, bⱼ, t)，hi = max(aⱼ, bⱼ, t)</text>
  <text x="260" y="176" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② cost = S − |aⱼ−bⱼ| + (hi − lo)</text>

  <path d="M 260 186 L 260 196" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="198" width="240" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="215" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ best = min(best, cost)，j++</text>

  <path d="M 260 224 L 260 234" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 260 234 L 345 264 L 260 294 L 175 264 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="269" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">j &lt; n ?</text>

  <path d="M 260 294 L 260 306" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="304" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="150" y="308" width="220" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="12" filter="url(#rough2)"/>
  <text x="260" y="325" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">return best + 1</text>

  <!-- 是：右侧回环，继续枚举下一个 j -->
  <path d="M 345 264 L 480 264 L 480 164 L 436 164" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="356" y="256" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="472" y="150" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">下一个 j</text>

  <text x="16" y="352" font-size="10" fill="#999" filter="url(#rough2)">O(n) / O(1)：S ≤ 10¹⁰，C++ 记得 long long</text>
</svg>
