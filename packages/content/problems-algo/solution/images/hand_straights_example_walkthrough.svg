<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：hand = [1,2,3,6,2,3,4,7,8]，k = 3</text>
  <text x="280" y="40" text-anchor="middle" font-size="10.5" fill="#888">排序后 [1,2,2,3,3,4,6,7,8]，每次取最小未用牌作为一组开头</text>

  <!-- Column headers -->
  <text x="36" y="66" font-size="10.5" fill="#888" font-weight="bold">步骤</text>
  <text x="96" y="66" font-size="10.5" fill="#888" font-weight="bold">x</text>
  <text x="150" y="66" font-size="10.5" fill="#888" font-weight="bold">消耗的组</text>
  <text x="320" y="66" font-size="10.5" fill="#888" font-weight="bold">freq 变化（仅列改变项）</text>
  <text x="510" y="66" font-size="10.5" fill="#888" font-weight="bold">结果</text>

  <line x1="20" y1="74" x2="540" y2="74" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 1: x=1, consume [1,2,3] -->
  <text x="36" y="98" font-size="11" fill="#333">1</text>
  <rect x="86" y="84" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="100" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <!-- group [1,2,3] blue -->
  <rect x="150" y="84" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="164" y="100" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="182" y="84" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="196" y="100" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="214" y="84" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="228" y="100" text-anchor="middle" font-size="11" fill="#333">3</text>
  <!-- freq changes -->
  <text x="320" y="100" font-size="10.5" fill="#555">freq[2]: 2→1   freq[3]: 2→1</text>
  <text x="510" y="100" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Step 2: x=2, consume [2,3,4] -->
  <text x="36" y="132" font-size="11" fill="#333">2</text>
  <rect x="86" y="118" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="100" y="134" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <!-- group [2,3,4] green -->
  <rect x="150" y="118" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="164" y="134" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="182" y="118" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="196" y="134" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="214" y="118" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="228" y="134" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="320" y="134" font-size="10.5" fill="#555">freq[3]: 1→0   freq[4]: 1→0</text>
  <text x="510" y="134" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Step 3: x=3,4 skipped (freq=0), x=6 consume [6,7,8] -->
  <text x="36" y="166" font-size="11" fill="#333">3</text>
  <rect x="86" y="152" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="100" y="168" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <!-- group [6,7,8] orange -->
  <rect x="150" y="152" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="164" y="168" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="182" y="152" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="196" y="168" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="214" y="152" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="228" y="168" text-anchor="middle" font-size="11" fill="#333">8</text>
  <text x="320" y="168" font-size="10.5" fill="#555">freq[7]: 1→0   freq[8]: 1→0</text>
  <text x="510" y="168" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

  <line x1="20" y1="188" x2="540" y2="188" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Result -->
  <text x="36" y="212" font-size="11" fill="#444" font-weight="bold">结果</text>
  <rect x="150" y="198" width="260" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="214" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">所有 freq = 0 → return true</text>
  <text x="320" y="236" text-anchor="middle" font-size="10" fill="#888">x=3,4 的 freq 已为 0，循环中自动跳过</text>

  <!-- Failure example box -->
  <rect x="30" y="250" width="500" height="138" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">反例：hand = [1,2,3,4,5]，k = 4</text>

  <!-- Step 1: x=1, consume [1,2,3,4] -->
  <text x="50" y="294" font-size="10.5" fill="#333">步骤1</text>
  <rect x="100" y="280" width="24" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="112" y="295" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <text x="135" y="294" font-size="10" fill="#555">消耗 [1,2,3,4]</text>
  <text x="280" y="294" font-size="10" fill="#555">freq[2,3,4] 各 −1</text>
  <text x="440" y="294" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Step 2: x=5, try [5,6,7,8], freq[6]=0 -->
  <text x="50" y="324" font-size="10.5" fill="#333">步骤2</text>
  <rect x="100" y="310" width="24" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="112" y="325" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <text x="135" y="324" font-size="10" fill="#555">尝试 [5,6,7,8]</text>
  <text x="280" y="324" font-size="10" fill="#b85450" font-weight="bold">freq[6] = 0 &lt; 1</text>
  <text x="440" y="324" font-size="11" fill="#b85450" font-weight="bold">✗</text>

  <text x="280" y="352" text-anchor="middle" font-size="10.5" fill="#555">→ return false（5 无法作为一组开头，缺 6,7,8）</text>
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#888">本质：n=5 不能被 k=4 整除 → 步骤 ① 直接 return false</text>
</svg>
