<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：曼哈顿距离 = 四个对角方向投影的最大值</text>
  <text x="260" y="42" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">|x| + |y| = max( x+y , x−y , −x+y , −x−y )</text>

  <!-- 左：坐标系与四个对角方向 -->
  <g filter="url(#rough2)">
    <path d="M 128 244 L 128 62" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>
    <path d="M 46 160 L 226 160" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>
    <text x="136" y="68" font-size="11" fill="#446688">y</text>
    <text x="226" y="152" font-size="11" fill="#446688">x</text>
    <text x="112" y="176" font-size="11" fill="#666">O</text>
    <path d="M 128 160 L 200 160 L 200 126" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="152" y="152" font-size="10" fill="#b85450">|x| = 2</text>
    <text x="206" y="148" font-size="10" fill="#b85450">|y| = 1</text>
    <circle cx="200" cy="126" r="5" fill="#b85450"/>
    <text x="206" y="118" font-size="10.5" font-weight="bold" fill="#b85450">P(2,1)</text>
    <path d="M 128 160 L 168 120" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="172" y="118" font-size="10.5" font-weight="bold" fill="#4a7a3a">(+,+)</text>
    <path d="M 128 160 L 88 120" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)"/>
    <text x="84" y="118" font-size="10" fill="#446688" text-anchor="end">(−,+)</text>
    <path d="M 128 160 L 168 200" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)"/>
    <text x="172" y="204" font-size="10" fill="#446688">(+,−)</text>
    <path d="M 128 160 L 88 200" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)"/>
    <text x="84" y="204" font-size="10" fill="#446688" text-anchor="end">(−,−)</text>
  </g>
  <text x="135" y="262" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">P=(2,1)：|x|+|y| = 2+1 = 3</text>
  <text x="135" y="278" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">四个投影中 x+y = 3 最大 ✓</text>

  <!-- 右上：每步贡献 ±1 -->
  <g filter="url(#rough2)">
    <rect x="268" y="56" width="238" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="387" y="70" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33506b">对固定符号方向 (sx, sy)</text>
    <text x="387" y="85" text-anchor="middle" font-size="10" fill="#33506b">每步对投影的贡献 ∈ {+1, −1}</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="268" y="100" width="64" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="332" y="100" width="174" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="300" y="113" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a6d1f">字符</text>
    <text x="419" y="113" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a6d1f">对投影的贡献</text>
    <rect x="268" y="118" width="64" height="17" fill="#ffffff" stroke="#9db4c9" stroke-width="1" rx="4"/>
    <rect x="332" y="118" width="174" height="17" fill="#ffffff" stroke="#9db4c9" stroke-width="1" rx="4"/>
    <text x="300" y="130" text-anchor="middle" font-size="10" fill="#333">E</text>
    <text x="419" y="130" text-anchor="middle" font-size="10" fill="#333">+sx</text>
    <rect x="268" y="135" width="64" height="17" fill="#f4f7fb" stroke="#9db4c9" stroke-width="1" rx="4"/>
    <rect x="332" y="135" width="174" height="17" fill="#f4f7fb" stroke="#9db4c9" stroke-width="1" rx="4"/>
    <text x="300" y="147" text-anchor="middle" font-size="10" fill="#333">W</text>
    <text x="419" y="147" text-anchor="middle" font-size="10" fill="#333">−sx</text>
    <rect x="268" y="152" width="64" height="17" fill="#ffffff" stroke="#9db4c9" stroke-width="1" rx="4"/>
    <rect x="332" y="152" width="174" height="17" fill="#ffffff" stroke="#9db4c9" stroke-width="1" rx="4"/>
    <text x="300" y="164" text-anchor="middle" font-size="10" fill="#333">N</text>
    <text x="419" y="164" text-anchor="middle" font-size="10" fill="#333">+sy</text>
    <rect x="268" y="169" width="64" height="17" fill="#f4f7fb" stroke="#9db4c9" stroke-width="1" rx="4"/>
    <rect x="332" y="169" width="174" height="17" fill="#f4f7fb" stroke="#9db4c9" stroke-width="1" rx="4"/>
    <text x="300" y="181" text-anchor="middle" font-size="10" fill="#333">S</text>
    <text x="419" y="181" text-anchor="middle" font-size="10" fill="#333">−sy</text>
    <text x="387" y="200" text-anchor="middle" font-size="9.5" fill="#666">任意方向下：恒为 2 个好步、2 个坏步</text>
  </g>

  <!-- 右中：修改的增益 -->
  <g filter="url(#rough2)">
    <rect x="268" y="210" width="238" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="387" y="228" text-anchor="middle" font-size="10.5" fill="#8a6d1f">改 1 个坏步：贡献 −1 → +1</text>
    <text x="387" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">每次修改净赚 +2</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="268" y="262" width="238" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="387" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24">k 次修改总增益 = 2·min(k, 坏步数)</text>
  </g>

  <!-- 底部：最终公式 -->
  <g filter="url(#rough2)">
    <rect x="30" y="304" width="460" height="44" fill="#ffffff" stroke="#446688" stroke-width="1.5" stroke-dasharray="6 4" rx="10"/>
    <text x="260" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">某时刻投影 = 好步 g − 坏步 b + 2·min(k, b)</text>
    <text x="260" y="340" text-anchor="middle" font-size="10" fill="#33506b">ans = 4 个符号方向 × 全部前缀（时刻）取最大值</text>
  </g>
</svg>
