<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：n = 3, target = 3（贪心扫描视角）</text>
  <text x="310" y="46" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⌊target/2⌋ = 1，从 i = 1 起扫描，冲突即跳过</text>

  <!-- header row -->
  <rect x="40" y="70" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="68" y="91" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">步骤</text>
  <rect x="96" y="70" width="64" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="91" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">候选 i</text>
  <rect x="160" y="70" width="132" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="226" y="91" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">target−i 已选？</text>
  <rect x="292" y="70" width="118" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="351" y="91" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">动作</text>
  <rect x="410" y="70" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="465" y="91" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">已选集合 S</text>
  <rect x="520" y="70" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="550" y="91" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">sum</text>

  <!-- row 1 -->
  <rect x="40" y="102" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="68" y="123" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="96" y="102" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="123" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="160" y="102" width="132" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="226" y="123" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2 ∉ S</text>
  <rect x="292" y="102" width="118" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="351" y="123" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">选 1 ✓</text>
  <rect x="410" y="102" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="465" y="123" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1}</text>
  <rect x="520" y="102" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="550" y="123" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <!-- row 2: the skip step -->
  <rect x="40" y="134" width="56" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="68" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="96" y="134" width="64" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="160" y="134" width="132" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="226" y="155" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1 ∈ S ✗</text>
  <rect x="292" y="134" width="118" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="351" y="155" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">跳过 ✗</text>
  <rect x="410" y="134" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="465" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1}</text>
  <rect x="520" y="134" width="60" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="550" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <!-- row 3 -->
  <rect x="40" y="166" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="68" y="187" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="96" y="166" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="187" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="160" y="166" width="132" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="226" y="187" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0 ∉ S</text>
  <rect x="292" y="166" width="118" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="351" y="187" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">选 3 ✓</text>
  <rect x="410" y="166" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="465" y="187" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1,3}</text>
  <rect x="520" y="166" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="550" y="187" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <!-- row 4 -->
  <rect x="40" y="198" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="68" y="219" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="96" y="198" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="219" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="160" y="198" width="132" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="226" y="219" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−1 ∉ S</text>
  <rect x="292" y="198" width="118" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="351" y="219" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">选 4 ✓（选满）</text>
  <rect x="410" y="198" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="465" y="219" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1,3,4}</text>
  <rect x="520" y="198" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="550" y="219" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>

  <!-- formula check -->
  <rect x="70" y="252" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="274" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">公式复核：m = min(3, ⌊3/2⌋) = 1，rest = 2</text>
  <text x="310" y="296" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">ans = 1×2/2 + 2×3 + 2×1/2 = 1 + 6 + 1 = 8 ✓</text>

  <!-- final array -->
  <rect x="170" y="324" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="346" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最终数组 [1, 3, 4]，总和 8</text>

  <text x="310" y="382" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">跳过的 2 与已选的 1 凑出 3 = target；从 3 = target 起的数与任何正数之和 &gt; target，再无冲突</text>
</svg>
