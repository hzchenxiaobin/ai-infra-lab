<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：tasks=[[1,3,2],[2,5,3],[5,6,2]] → 4</text>

  <!-- time axis header: cells 1..6 at y=44 -->
  <text x="60" y="66" font-size="11" fill="#888" filter="url(#rough2)">时刻→</text>
  <rect x="150" y="44" width="52" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="176" y="64" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">1</text>
  <rect x="206" y="44" width="52" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="232" y="64" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">2</text>
  <rect x="262" y="44" width="52" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="288" y="64" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">3</text>
  <rect x="318" y="44" width="52" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="344" y="64" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">4</text>
  <rect x="374" y="44" width="52" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="400" y="64" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">5</text>
  <rect x="430" y="44" width="52" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="456" y="64" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">6</text>

  <!-- ===== Row 1: Task A [1,3,2] ===== -->
  <text x="40" y="112" font-size="11" fill="#b85450" filter="url(#rough2)">A[1,3]需2</text>
  <!-- 1:off 2:new 3:new 4:off 5:off 6:off -->
  <rect x="150" y="96" width="52" height="34" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="206" y="96" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="262" y="96" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="318" y="96" width="52" height="34" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="374" y="96" width="52" height="34" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="430" y="96" width="52" height="34" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="304" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">cnt=0，从右补 3、2</text>
  <!-- bracket A -->
  <path d="M150,140 L150,146 L314,146 L314,140" fill="none" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- ===== Row 2: Task B [2,5,3] ===== -->
  <text x="40" y="172" font-size="11" fill="#d6a040" filter="url(#rough2)">B[2,5]需3</text>
  <!-- 1:off 2:on(blue) 3:on(blue) 4:off 5:new 6:off -->
  <rect x="150" y="156" width="52" height="34" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="206" y="156" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="262" y="156" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="318" y="156" width="52" height="34" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="374" y="156" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="430" y="156" width="52" height="34" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="358" y="206" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">cnt=2（复用2,3），从右补 5</text>
  <!-- bracket B -->
  <path d="M206,200 L206,206 L426,206 L426,200" fill="none" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- ===== Row 3: Task C [5,6,2] ===== -->
  <text x="40" y="232" font-size="11" fill="#446688" filter="url(#rough2)">C[5,6]需2</text>
  <!-- 1:off 2:on 3:on 4:off 5:on 6:new -->
  <rect x="150" y="216" width="52" height="34" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="206" y="216" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="262" y="216" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="318" y="216" width="52" height="34" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="374" y="216" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="430" y="216" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="400" y="266" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">cnt=1（复用5），从右补 6</text>
  <!-- bracket C -->
  <path d="M374,260 L374,266 L482,266 L482,260" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- legend -->
  <rect x="150" y="290" width="18" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="174" y="301" font-size="10" fill="#555" filter="url(#rough2)">本轮新开机</text>
  <rect x="250" y="290" width="18" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="274" y="301" font-size="10" fill="#555" filter="url(#rough2)">已开机</text>

  <!-- final -->
  <rect x="100" y="330" width="360" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">开机点 = {2, 3, 5, 6} = 4 ✓</text>
</svg>
