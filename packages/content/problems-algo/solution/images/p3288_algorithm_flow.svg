<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：锚点拆段 → 降维 LIS</text>

  <!-- ① 取锚点 -->
  <rect x="150" y="34" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="53" text-anchor="middle" font-size="11" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">① 取锚点 (xk, yk) = coordinates[k]</text>
  <path d="M 260 64 L 260 78" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ② 分区菱形 -->
  <polygon points="260,80 370,110 260,140 150,110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="106" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">② 逐点分区：</text>
  <text x="260" y="121" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">与 k 可比？</text>

  <!-- 分支：左 lower -->
  <path d="M 152 112 Q 100 118 88 146" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="26" y="150" width="130" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="91" y="170" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">lower 桶</text>
  <text x="91" y="186" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">x &lt; xk 且 y &lt; yk</text>
  <text x="91" y="198" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">（k 之前）</text>

  <!-- 分支：右 upper -->
  <path d="M 368 112 Q 420 118 432 146" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="364" y="150" width="130" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="429" y="170" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">upper 桶</text>
  <text x="429" y="186" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">x &gt; xk 且 y &gt; yk</text>
  <text x="429" y="198" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">（k 之后）</text>

  <!-- 分支：下 丢弃 -->
  <path d="M 260 140 L 260 154" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="196" y="158" width="128" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="172" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">不可比 → 丢弃</text>
  <text x="260" y="186" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">（一大一小，永远进不了路径）</text>

  <!-- 两桶汇聚 -->
  <path d="M 96 202 Q 160 226 208 234" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 424 202 Q 360 226 312 234" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ③ 排序 -->
  <rect x="120" y="240" width="280" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="259" text-anchor="middle" font-size="10.5" fill="#3a5f30" font-weight="bold" filter="url(#rough2)">③ 排序：x 升序，同 x 时 y 降序（两桶各一次）</text>
  <path d="M 260 270 L 260 282" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ④ LIS -->
  <rect x="100" y="286" width="320" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="305" text-anchor="middle" font-size="10.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">④ 对 y 序列求严格上升 LIS（贪心 + 二分 lower_bound）</text>
  <path d="M 260 316 L 260 326" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ⑤ 结果 -->
  <rect x="110" y="330" width="300" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="347" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">⑤ ans = LIS(lower) + 1 + LIS(upper)</text>
</svg>
