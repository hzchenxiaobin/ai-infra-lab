<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fdfcf7"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold">dp 表：dp[i][j] = 前缀 LCS 长度</text>
  <path d="M 160 38 Q 280 46 400 38" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <text x="280" y="52" text-anchor="middle" font-size="11" fill="#888">nums1 = [1,4,2]　nums2 = [1,2,4]　行=nums1前缀，列=nums2前缀</text>

  <!-- 列头 -->
  <text x="50" y="90" font-size="11" fill="#888">j→</text>
  <text x="130" y="90" text-anchor="middle" font-size="12" fill="#888">""</text>
  <text x="210" y="90" text-anchor="middle" font-size="12" fill="#4a8edb" font-weight="bold">1</text>
  <text x="290" y="90" text-anchor="middle" font-size="12" fill="#4a8edb" font-weight="bold">2</text>
  <text x="370" y="90" text-anchor="middle" font-size="12" fill="#4a8edb" font-weight="bold">4</text>

  <!-- 行头 -->
  <text x="40" y="140" text-anchor="end" font-size="11" fill="#888">i</text>
  <text x="80" y="135" font-size="11" fill="#888">↓</text>
  <text x="110" y="120" text-anchor="middle" font-size="12" fill="#4a8e4a" font-weight="bold">""</text>
  <text x="110" y="170" text-anchor="middle" font-size="12" fill="#4a8e4a" font-weight="bold">1</text>
  <text x="110" y="220" text-anchor="middle" font-size="12" fill="#4a8e4a" font-weight="bold">4</text>
  <text x="110" y="270" text-anchor="middle" font-size="12" fill="#4a8e4a" font-weight="bold">2</text>

  <!-- dp 表格 -->
  <g filter="url(#sk)">
    <!-- 第0行（边界） -->
    <rect x="130" y="104" width="60" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="190" y="104" width="60" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="250" y="104" width="60" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="310" y="104" width="60" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>

    <!-- 第1行 (nums1[0]=1) -->
    <rect x="130" y="140" width="60" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <!-- dp[1][1]: 1==1, match! -->
    <rect x="190" y="140" width="60" height="36" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" rx="3"/>
    <rect x="250" y="140" width="60" height="36" fill="#fffdf3" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="310" y="140" width="60" height="36" fill="#fffdf3" stroke="#bbb" stroke-width="1" rx="3"/>

    <!-- 第2行 (nums1[1]=4) -->
    <rect x="130" y="176" width="60" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="190" y="176" width="60" height="36" fill="#fffdf3" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="250" y="176" width="60" height="36" fill="#fffdf3" stroke="#bbb" stroke-width="1" rx="3"/>
    <!-- dp[2][3]: 4==4, match! -->
    <rect x="310" y="176" width="60" height="36" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" rx="3"/>

    <!-- 第3行 (nums1[2]=2) -->
    <rect x="130" y="212" width="60" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="190" y="212" width="60" height="36" fill="#fffdf3" stroke="#bbb" stroke-width="1" rx="3"/>
    <!-- dp[3][2]: 2==2, match! -->
    <rect x="250" y="212" width="60" height="36" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" rx="3"/>
    <rect x="310" y="212" width="60" height="36" fill="#fffdf3" stroke="#bbb" stroke-width="1" rx="3"/>
  </g>

  <!-- 值 -->
  <!-- 第0行 -->
  <text x="160" y="127" text-anchor="middle" font-size="13" fill="#aaa">0</text>
  <text x="220" y="127" text-anchor="middle" font-size="13" fill="#aaa">0</text>
  <text x="280" y="127" text-anchor="middle" font-size="13" fill="#aaa">0</text>
  <text x="340" y="127" text-anchor="middle" font-size="13" fill="#aaa">0</text>
  <!-- 第1行 -->
  <text x="160" y="163" text-anchor="middle" font-size="13" fill="#aaa">0</text>
  <text x="220" y="163" text-anchor="middle" font-size="14" fill="#4a8e4a" font-weight="bold">1</text>
  <text x="280" y="163" text-anchor="middle" font-size="13" fill="#444">1</text>
  <text x="340" y="163" text-anchor="middle" font-size="13" fill="#444">1</text>
  <!-- 第2行 -->
  <text x="160" y="199" text-anchor="middle" font-size="13" fill="#aaa">0</text>
  <text x="220" y="199" text-anchor="middle" font-size="13" fill="#444">1</text>
  <text x="280" y="199" text-anchor="middle" font-size="13" fill="#444">1</text>
  <text x="340" y="199" text-anchor="middle" font-size="14" fill="#4a8e4a" font-weight="bold">2</text>
  <!-- 第3行 -->
  <text x="160" y="235" text-anchor="middle" font-size="13" fill="#aaa">0</text>
  <text x="220" y="235" text-anchor="middle" font-size="13" fill="#444">1</text>
  <text x="280" y="235" text-anchor="middle" font-size="13" fill="#444">2</text>
  <text x="340" y="235" text-anchor="middle" font-size="14" fill="#c98a2b" font-weight="bold">2</text>

  <!-- 答案标记 -->
  <rect x="310" y="212" width="60" height="36" fill="none" stroke="#c98a2b" stroke-width="2.2" rx="3" filter="url(#sk)"/>
  <text x="380" y="238" font-size="11" fill="#c98a2b" font-weight="bold">← 答案</text>

  <!-- 转移说明 -->
  <g filter="url(#sk)">
    <rect x="400" y="140" width="140" height="110" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="4,3"/>
  </g>
  <text x="412" y="162" font-size="11" fill="#2b2b2b" font-weight="bold">转移规则</text>
  <text x="412" y="182" font-size="10" fill="#444">匹配：</text>
  <text x="412" y="196" font-size="10" fill="#4a8e4a">dp[i-1][j-1]+1</text>
  <text x="412" y="214" font-size="10" fill="#444">不匹配：</text>
  <text x="412" y="228" font-size="10" fill="#b85450">max(上, 左)</text>
  <text x="412" y="244" font-size="9" fill="#888">绿格=字符匹配处</text>

  <!-- 底部说明 -->
  <g filter="url(#sk)">
    <rect x="60" y="288" width="440" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="80" y="310" font-size="12" fill="#2b2b2b" font-weight="bold">关键观察</text>
  <text x="80" y="330" font-size="11" fill="#444">dp[i][j] = nums1[0..i-1] 与 nums2[0..j-1] 的 LCS 长度</text>
  <text x="80" y="348" font-size="11" fill="#444">匹配时 +1（绿格），不匹配时取上方和左方的较大值</text>

  <text x="280" y="386" text-anchor="middle" font-size="10" fill="#aaa">与 1143 LCS 的 dp 表结构完全一致</text>
</svg>
