<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：空隙数组 + 定长滑窗</text>

  <!-- ① 构造空隙数组 -->
  <rect x="140" y="56" width="240" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="76" text-anchor="middle" font-size="13" fill="#2a4a6a" font-weight="bold" filter="url(#rough2)">① 构造空隙数组 g[0..n]</text>
  <text x="260" y="94" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">首 start₀ ／ 相邻差 ／ 尾 eventTime−end</text>

  <path d="M 260 102 L 260 122" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 初始化窗口 -->
  <rect x="115" y="126" width="290" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="152" text-anchor="middle" font-size="13" fill="#2a4a6a" font-weight="bold" filter="url(#rough2)">② window = g₀+⋯+g_k，ans = window</text>

  <path d="M 260 168 L 260 190" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形判断 -->
  <polygon points="260,194 348,240 260,286 172,240" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="245" text-anchor="middle" font-size="14" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">i ≤ n ?</text>

  <!-- 否 → 返回 -->
  <path d="M 348 240 L 396 240" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="372" y="230" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="400" y="220" width="100" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="450" y="245" text-anchor="middle" font-size="14" fill="#2e5a22" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- 是 → 循环体 -->
  <path d="M 260 286 L 260 308" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="302" font-size="12" fill="#446688" filter="url(#rough2)">是</text>

  <!-- ③ 循环体 -->
  <rect x="80" y="310" width="360" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="12" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">③ window += g[i] − g[i−k−1]</text>
  <text x="260" y="345" text-anchor="middle" font-size="12" fill="#8a3a34" filter="url(#rough2)">ans = max(ans, window)；i++</text>

  <!-- 回环箭头：循环体左侧 → 菱形左侧 -->
  <path d="M 80 331 L 36 331 L 36 240 L 164 240" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右侧说明小框 -->
  <rect x="400" y="60" width="105" height="96" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="452" y="82" text-anchor="middle" font-size="11" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">窗口长度</text>
  <text x="452" y="102" text-anchor="middle" font-size="15" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">k + 1</text>
  <text x="452" y="122" text-anchor="middle" font-size="10" fill="#7a5c1e" filter="url(#rough2)">k = n 时覆盖</text>
  <text x="452" y="137" text-anchor="middle" font-size="10" fill="#7a5c1e" filter="url(#rough2)">全部 n+1 个空隙</text>
</svg>
