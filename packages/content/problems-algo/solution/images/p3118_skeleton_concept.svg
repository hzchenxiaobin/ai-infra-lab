<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：输出 = 周骨架(4) × 会员骨架(2) 的 8 格网格，缺格补 0</text>

  <text x="78" y="58" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">周 / 周五日期</text>
  <text x="238" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">Premium</text>
  <text x="426" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">VIP</text>

  <rect x="16" y="68" width="124" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="78" y="89" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">第 1 周</text>
  <text x="78" y="108" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">11-03 周五</text>

  <rect x="148" y="68" width="180" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="238" y="92" text-anchor="middle" font-size="15" fill="#2e5c22" font-weight="bold" filter="url(#rough2)">1126</text>
  <text x="238" y="110" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">用户 11 消费</text>

  <rect x="336" y="68" width="180" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="6 3" rx="6" filter="url(#rough2)"/>
  <text x="426" y="92" text-anchor="middle" font-size="15" fill="#a06a10" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="426" y="110" text-anchor="middle" font-size="8.5" fill="#a06a10" filter="url(#rough2)">当天无 VIP 交易 → 补 0</text>

  <rect x="16" y="124" width="124" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="78" y="145" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">第 2 周</text>
  <text x="78" y="164" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">11-10 周五</text>

  <rect x="148" y="124" width="180" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="6 3" rx="6" filter="url(#rough2)"/>
  <text x="238" y="148" text-anchor="middle" font-size="15" fill="#a06a10" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="238" y="166" text-anchor="middle" font-size="8.5" fill="#a06a10" filter="url(#rough2)">当天无 Premium 交易 → 补 0</text>

  <rect x="336" y="124" width="180" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="426" y="148" text-anchor="middle" font-size="15" fill="#2e5c22" font-weight="bold" filter="url(#rough2)">7473</text>
  <text x="426" y="166" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">用户 15 消费</text>

  <rect x="16" y="180" width="124" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="78" y="201" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">第 3 周</text>
  <text x="78" y="220" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">11-17 周五</text>

  <rect x="148" y="180" width="180" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="6 3" rx="6" filter="url(#rough2)"/>
  <text x="238" y="204" text-anchor="middle" font-size="15" fill="#a06a10" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="238" y="222" text-anchor="middle" font-size="8.5" fill="#a06a10" filter="url(#rough2)">Standard 不计入</text>

  <rect x="336" y="180" width="180" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="6 3" rx="6" filter="url(#rough2)"/>
  <text x="426" y="204" text-anchor="middle" font-size="15" fill="#a06a10" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="426" y="222" text-anchor="middle" font-size="8.5" fill="#a06a10" filter="url(#rough2)">Standard 不计入</text>

  <rect x="16" y="236" width="124" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="78" y="257" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">第 4 周</text>
  <text x="78" y="276" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">11-24 周五</text>

  <rect x="148" y="236" width="180" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="238" y="260" text-anchor="middle" font-size="15" fill="#2e5c22" font-weight="bold" filter="url(#rough2)">5117</text>
  <text x="238" y="278" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">用户 8 消费</text>

  <rect x="336" y="236" width="180" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="426" y="260" text-anchor="middle" font-size="15" fill="#2e5c22" font-weight="bold" filter="url(#rough2)">14933</text>
  <text x="426" y="278" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">9692 + 5241（两个 VIP）</text>

  <text x="290" y="305" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠ 11-17 有交易(2414)，但来自 Standard —— 数据存在 ≠ 该组合有数据</text>

  <rect x="30" y="318" width="520" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="340" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">GROUP BY 只能聚出有数据的 4 格；骨架 T(周 1~4) × M(Premium/VIP) 叉乘出 8 格，与交易数据无关</text>
  <text x="290" y="358" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">骨架当 LEFT JOIN 左表 + IFNULL(SUM, 0)，把 4 个空格拉平成 0</text>
  <text x="290" y="378" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">输出行数 = 周基数 × 会员基数 = 4 × 2 = 8</text>
</svg>
