<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">划分法：两数组各切一刀，左半共 half 个 且 左半最大 ≤ 右半最小</text>

  <!-- ===== nums1 row ===== -->
  <text x="92" y="116" text-anchor="end" font-size="13" fill="#446688" font-weight="bold">nums1</text>
  <!-- left part (green) -->
  <rect x="150" y="92" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="114" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="200" y="92" width="50" height="34" fill="#e6f4ea" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="114" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <!-- right part (blue) -->
  <rect x="250" y="92" width="50" height="34" fill="#e8f0fe" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="114" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="300" y="92" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="114" text-anchor="middle" font-size="13" fill="#333">7</text>

  <!-- boundary tags above nums1 -->
  <text x="225" y="82" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">nums1[i−1]</text>
  <text x="275" y="82" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">nums1[i]</text>

  <!-- ===== nums2 row ===== -->
  <text x="92" y="190" text-anchor="end" font-size="13" fill="#446688" font-weight="bold">nums2</text>
  <rect x="150" y="166" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="188" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="200" y="166" width="50" height="34" fill="#e6f4ea" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="188" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="250" y="166" width="50" height="34" fill="#e8f0fe" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="188" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="300" y="166" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="188" text-anchor="middle" font-size="13" fill="#333">8</text>

  <!-- boundary tags below nums2 -->
  <text x="225" y="216" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">nums2[j−1]</text>
  <text x="275" y="216" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">nums2[j]</text>

  <!-- partition vertical dashed line -->
  <line x1="250" y1="84" x2="250" y2="208" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <!-- i / j pointer tags -->
  <rect x="234" y="60" width="32" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="250" y="72" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i = 2</text>
  <rect x="234" y="214" width="32" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="250" y="226" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">j = 2</text>

  <!-- left / right half labels -->
  <text x="200" y="258" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">← 左半（i + j = half = 4）</text>
  <text x="300" y="258" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">右半 →</text>

  <!-- ===== right summary box ===== -->
  <rect x="392" y="92" width="196" height="186" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="490" y="116" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">合法划分条件</text>
  <line x1="404" y1="124" x2="576" y2="124" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="404" y="144" font-size="11" fill="#555">左半最大 ≤ 右半最小</text>
  <text x="404" y="166" font-size="11" fill="#666">left_max = max(nums1[i−1],</text>
  <text x="416" y="180" font-size="11" fill="#666">nums2[j−1]) = max(3, 4)</text>
  <text x="556" y="180" text-anchor="end" font-size="12" fill="#b85450" font-weight="bold">= 4</text>
  <text x="404" y="204" font-size="11" fill="#666">right_min = min(nums1[i],</text>
  <text x="416" y="218" font-size="11" fill="#666">nums2[j]) = min(5, 6)</text>
  <text x="556" y="218" text-anchor="end" font-size="12" fill="#d6a040" font-weight="bold">= 5</text>
  <text x="490" y="244" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4 ≤ 5  ✓</text>
  <text x="490" y="266" text-anchor="middle" font-size="11" fill="#888">i + j = 2 + 2 = 4 = half</text>

  <!-- median result box -->
  <rect x="392" y="290" width="196" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="490" y="308" text-anchor="middle" font-size="11" fill="#555">总长 8（偶）</text>
  <text x="490" y="324" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">中位数 = (4 + 5)/2 = 4.5</text>

  <!-- color legend bottom-left -->
  <rect x="30" y="296" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="52" y="308" font-size="11" fill="#555">红框：左部最大候选（i−1 / j−1）</text>
  <rect x="30" y="318" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="52" y="330" font-size="11" fill="#555">橙框：右部最小候选（i / j）</text>

  <!-- note bottom -->
  <rect x="30" y="350" width="540" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="300" y="368" text-anchor="middle" font-size="11" fill="#4a7a3a">边界处 i=0/i=m 用 ±∞ 哨兵，使两条不等式对所有 i 统一成立，无需特判</text>
  <text x="300" y="380" text-anchor="middle" font-size="10" fill="#4a7a3a">在较短数组上二分 i（j = half − i 随之确定）→ 复杂度 O(log min(m, n))</text>
</svg>
