<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：滑动窗口 + 维护最大数字 best</text>

  <!-- Step 1: init -->
  <rect x="160" y="44" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① best = ""（空串哨兵）</text>

  <!-- arrow -->
  <line x1="270" y1="82" x2="270" y2="100" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: for loop -->
  <rect x="140" y="104" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② for i = 0 .. n−3：</text>

  <!-- arrow into loop body -->
  <line x1="270" y1="138" x2="270" y2="154" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: take window of 3 -->
  <rect x="100" y="158" width="340" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="180" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">取窗口 num[i], num[i+1], num[i+2]</text>

  <!-- arrow -->
  <line x1="270" y1="192" x2="270" y2="206" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: three equal? -->
  <polygon points="270,210 380,250 270,290 160,250" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="246" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">三字符</text>
  <text x="270" y="262" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">全相同？</text>

  <!-- No branch (right) -->
  <line x1="380" y1="250" x2="430" y2="250" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="244" font-size="10" fill="#888" font-weight="bold">否</text>
  <rect x="434" y="234" width="90" height="32" fill="#f4f7fb" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="479" y="254" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">跳过</text>

  <!-- Yes branch (left) -->
  <line x1="160" y1="250" x2="120" y2="250" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="244" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Step 4: compare digit with best -->
  <rect x="20" y="232" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="248" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">num[i] &gt;</text>
  <text x="70" y="262" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">best[0] ?</text>

  <!-- arrow down from compare -->
  <line x1="70" y1="268" x2="70" y2="288" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: update best -->
  <rect x="14" y="292" width="112" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="70" y="314" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">best = num[i]×3</text>

  <!-- converge -->
  <line x1="70" y1="326" x2="70" y2="346" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="479" y1="266" x2="479" y2="346" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="70" y1="346" x2="479" y2="346" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="270" y1="346" x2="270" y2="362" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop back arrow (right side) -->
  <path d="M 470 176 Q 510 176 510 121 L 400 121" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="150" font-size="9.5" fill="#888">下一 i</text>

  <!-- Step 6: return -->
  <rect x="110" y="366" width="320" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="390" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">③ 遍历结束：返回 best</text>
  <text x="270" y="404" text-anchor="middle" font-size="10" fill="#888">（best 仍为 "" 则返回空串）</text>

  <!-- footer -->
  <rect x="40" y="424" width="465" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="272" y="446" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">关键：best 用空串哨兵，'0' 也是合法答案，不可把 "000" 当作"无匹配"</text>
</svg>
