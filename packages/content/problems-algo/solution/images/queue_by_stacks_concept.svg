<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="900" height="460" fill="#fafafa"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">用栈实现队列：两个栈倒换出队序</text>
  <path d="M 280 42 Q 450 50 620 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="450" y="70" text-anchor="middle" font-size="12" fill="#666">队列是 FIFO（先进先出），栈是 LIFO（后进先出）——用两个栈“倒两次”，顺序就正过来了</text>

  <!-- 左：队列 FIFO 直观 -->
  <text x="120" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">队列（FIFO）</text>
  <g filter="url(#sk)">
    <rect x="50" y="120" width="50" height="34" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="100" y="120" width="50" height="34" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="150" y="120" width="50" height="34" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/>
  </g>
  <text x="75" y="142" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="125" y="142" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="175" y="142" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="55" y="112" font-size="10" fill="#2e6e2e">队首</text>
  <text x="165" y="112" font-size="10" fill="#2e6e2e">队尾</text>
  <path d="M 40 137 L 50 137" stroke="#2e6e2e" stroke-width="2" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="40" y="170" font-size="11" fill="#2e6e2e">出队 → 1（最先进来的先出）</text>

  <!-- 中间：第一个栈 in_stack -->
  <text x="370" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">in_stack（入栈栈）</text>
  <text x="370" y="120" text-anchor="middle" font-size="10" fill="#666">push(1), push(2), push(3)</text>
  <g filter="url(#sk)">
    <rect x="330" y="148" width="80" height="34" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="330" y="184" width="80" height="34" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="330" y="220" width="80" height="34" rx="3" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="370" y="170" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <text x="370" y="206" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="370" y="242" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="416" y="170" font-size="10" fill="#b85450">栈顶</text>
  <text x="280" y="252" font-size="10" fill="#666">栈底</text>
  <text x="285" y="148" font-size="11" fill="#2b6e9e">↑ 栈顶是 3（后进），</text>
  <text x="285" y="164" font-size="11" fill="#2b6e9e">  直接 pop 会得到 3 ≠ 队首</text>

  <!-- 倒换箭头 -->
  <path d="M 416 165 Q 500 120 584 165" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="500" y="112" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">pop 并 push 倒过去</text>
  <text x="500" y="128" text-anchor="middle" font-size="10" fill="#b85450">顺序被“逆转”一次</text>

  <!-- 右：第二个栈 out_stack -->
  <text x="650" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">out_stack（出队栈）</text>
  <text x="650" y="120" text-anchor="middle" font-size="10" fill="#666">倒入后：1 在栈顶</text>
  <g filter="url(#sk)">
    <rect x="610" y="148" width="80" height="34" rx="3" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="610" y="184" width="80" height="34" rx="3" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="610" y="220" width="80" height="34" rx="3" fill="#fff8e1" stroke="#d6a040"/>
  </g>
  <text x="650" y="170" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">1</text>
  <text x="650" y="206" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="650" y="242" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="696" y="170" font-size="10" fill="#2e6e2e">栈顶</text>
  <text x="696" y="252" font-size="10" fill="#666">栈底</text>
  <path d="M 610 250 L 600 250" stroke="#2e6e2e" stroke-width="2" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="540" y="254" font-size="11" fill="#2e6e2e">pop → 1（队首！正确）</text>

  <!-- 底部结论框 -->
  <g filter="url(#sk)">
    <rect x="80" y="300" width="740" height="70" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="450" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">核心：第一次入栈逆序一次，倒栈再逆序一次 → 两次 LIFO 抵消 = FIFO</text>
  <text x="450" y="346" text-anchor="middle" font-size="11" fill="#444">push 永远进 in_stack；pop/peek 只从 out_stack 出，out_stack 空了才把 in_stack 全部倒过来</text>
  <text x="450" y="362" text-anchor="middle" font-size="11" fill="#7a5415">倒栈是“懒”触发——只有出队且 out_stack 空时才倒，摊还 O(1)</text>

  <!-- 角色分工 -->
  <g filter="url(#sk)">
    <rect x="80" y="392" width="350" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="470" y="392" width="350" height="50" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="255" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">in_stack：只管“收”</text>
  <text x="255" y="430" text-anchor="middle" font-size="11" fill="#444">push(x) 直接压入，O(1)</text>
  <text x="645" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">out_stack：只管“出”</text>
  <text x="645" y="430" text-anchor="middle" font-size="11" fill="#444">空了就从 in_stack 倒满，再 pop/peek，O(1) 摊还</text>
</svg>
