<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">JOIN 展开：一通电话 → 两行参与者记录</text>

  <!-- ===== Step 1: a single Calls row ===== -->
  <rect x="150" y="46" width="260" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="11" fill="#a07020" font-weight="bold">Calls 表一行</text>
  <text x="280" y="82" text-anchor="middle" font-size="12" fill="#333">caller_id=3, callee_id=12, duration=102</text>

  <!-- arrow down -->
  <path d="M 280 90 L 280 118" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="206" y="98" width="148" height="18" fill="#fff" stroke="#888" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="111" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">JOIN ON id IN (caller_id, callee_id)</text>

  <!-- ===== Step 2: two expanded participant rows ===== -->
  <rect x="80" y="128" width="180" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="170" y="148" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">参与者行（caller 侧）</text>
  <text x="170" y="168" text-anchor="middle" font-size="12" fill="#333">id=3, duration=102</text>

  <rect x="300" y="128" width="180" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="390" y="148" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">参与者行（callee 侧）</text>
  <text x="390" y="168" text-anchor="middle" font-size="12" fill="#333">id=12, duration=102</text>

  <!-- arrows from step1 to step2 (split) -->
  <path d="M 230 90 C 200 100, 180 110, 170 128" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 90 C 360 100, 380 110, 390 128" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- arrow down to mapping -->
  <path d="M 170 184 L 170 208" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 390 184 L 390 208" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="206" y="194" width="148" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="10" fill="#3a6a2a" font-weight="bold">→ Person.phone_number → Country</text>

  <!-- ===== Step 3: country-tagged rows ===== -->
  <rect x="80" y="218" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="170" y="243" text-anchor="middle" font-size="12" fill="#333">(Peru, 102)</text>

  <rect x="300" y="218" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="390" y="243" text-anchor="middle" font-size="12" fill="#333">(Peru, 102)</text>

  <!-- arrow down: group by -->
  <path d="M 280 258 L 280 280" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="206" y="262" width="148" height="16" fill="#fff" stroke="#888" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">GROUP BY country + AVG(duration)</text>

  <!-- ===== Step 4: per-country avg ===== -->
  <rect x="120" y="290" width="320" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="11" fill="#a07020" font-weight="bold">该国参与者-时长平均</text>
  <text x="280" y="328" text-anchor="middle" font-size="12" fill="#333">Peru: [102,330,5,102,330,5] / 6 = 145.67</text>

  <!-- ===== Step 5: compare with global ===== -->
  <path d="M 280 336 L 280 358" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="70" y="362" width="240" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="190" y="382" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">全局平均</text>
  <text x="190" y="400" text-anchor="middle" font-size="11" fill="#333">AVG(duration) FROM Calls = 55.7</text>

  <rect x="330" y="362" width="170" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="415" y="382" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">比较</text>
  <text x="415" y="400" text-anchor="middle" font-size="11" fill="#333">145.67 &gt; 55.7 → 可投资</text>
</svg>
