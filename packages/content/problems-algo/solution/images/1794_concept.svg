<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr1794c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：单字符 + 首次出现 / 末次出现 → 最小 j − a</text>

  <!-- ====== Formula derivation box ====== -->
  <rect x="50" y="44" width="460" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="70" y="66" font-size="12" fill="#333" filter="url(#rough2)">子串长 L：j = i + L − 1, b = a + L − 1</text>
  <text x="70" y="86" font-size="12" fill="#333" filter="url(#rough2)">⟹ j − a = (i − a) + (L − 1)，<tspan fill="#b85450" font-weight="bold">L = 1 时最小：j − a = i − a</tspan></text>
  <text x="70" y="106" font-size="12" fill="#333" filter="url(#rough2)">最小化 i − a ⟹ <tspan fill="#446688" font-weight="bold">min i = first[c]</tspan>（首次出现）+ <tspan fill="#4a7a3a" font-weight="bold">max a = last[c]</tspan>（末次出现）</text>
  <text x="70" y="122" font-size="11" fill="#888" filter="url(#rough2)">每个字符 c 独立计算，全局取最小 diff</text>

  <!-- ====== firstString row ====== -->
  <text x="50" y="158" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">first</text>
  <g font-size="14" fill="#333" text-anchor="middle">
    <rect x="100" y="144" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
    <text x="122" y="168" filter="url(#rough2)" font-weight="bold">a</text>
    <rect x="144" y="144" width="44" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="166" y="168" filter="url(#rough2)">b</text>
    <rect x="188" y="144" width="44" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="210" y="168" filter="url(#rough2)">c</text>
    <rect x="232" y="144" width="44" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="254" y="168" filter="url(#rough2)">d</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="122" y="140" filter="url(#rough2)">0</text>
    <text x="166" y="140" filter="url(#rough2)">1</text>
    <text x="210" y="140" filter="url(#rough2)">2</text>
    <text x="254" y="140" filter="url(#rough2)">3</text>
  </g>
  <text x="122" y="196" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">首次出现 i=0</text>

  <!-- ====== secondString row ====== -->
  <text x="50" y="232" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">second</text>
  <g font-size="14" fill="#333" text-anchor="middle">
    <rect x="100" y="218" width="44" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="122" y="242" filter="url(#rough2)">b</text>
    <rect x="144" y="218" width="44" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="166" y="242" filter="url(#rough2)">c</text>
    <rect x="188" y="218" width="44" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="210" y="242" filter="url(#rough2)">c</text>
    <rect x="232" y="218" width="44" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="254" y="242" filter="url(#rough2)">d</text>
    <rect x="276" y="218" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
    <text x="298" y="242" filter="url(#rough2)" font-weight="bold">a</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="122" y="214" filter="url(#rough2)">0</text>
    <text x="166" y="214" filter="url(#rough2)">1</text>
    <text x="210" y="214" filter="url(#rough2)">2</text>
    <text x="254" y="214" filter="url(#rough2)">3</text>
    <text x="298" y="214" filter="url(#rough2)">4</text>
  </g>
  <text x="298" y="270" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">末次出现 a=4</text>

  <!-- Arrow from first 'a' to second 'a' -->
  <path d="M 122 180 Q 210 200 298 218" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr1794c)" filter="url(#rough2)"/>
  <rect x="170" y="192" width="140" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="240" y="207" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">j − a = 0 − 4 = −4</text>

  <!-- ====== Conclusion box ====== -->
  <rect x="60" y="296" width="440" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">每个字符 c：<tspan fill="#446688" font-weight="bold">diff[c] = first[c] − last[c]</tspan></text>
  <text x="280" y="340" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">全局最小 diff → 答案 = 达到该最小的字符个数</text>
</svg>
