<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 490" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="490" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">可能的二分法：建图 + BFS 染色流程</text>

  <!-- ===== B0: build adjacency ===== -->
  <rect x="60" y="46" width="280" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="66" text-anchor="middle" font-size="12" fill="#333">① 由 dislikes 建邻接表 g（1-indexed）</text>
  <path d="M 200 76 L 200 88" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== B1: init color ===== -->
  <rect x="60" y="88" width="280" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="108" text-anchor="middle" font-size="12" fill="#333">② color[1..n] = 0（全部未染色）</text>
  <path d="M 200 118 L 200 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== B2: outer loop ===== -->
  <rect x="60" y="124" width="280" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="144" text-anchor="middle" font-size="12" fill="#333">③ 遍历每个人 i = 1..n（覆盖各连通分量）</text>

  <!-- B2 -> terminal (true) when all visited -->
  <path d="M 340 139 L 390 139" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="365" y="132" text-anchor="middle" font-size="10" fill="#888">遍历完</text>
  <rect x="390" y="124" width="190" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="485" y="144" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">返回 true（可分组）✓</text>

  <path d="M 200 154 L 200 160" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== D1: i 未染色? ===== -->
  <polygon points="200,160 286,186 200,212 114,186" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="190" text-anchor="middle" font-size="12" fill="#333">i 未染色?</text>
  <!-- D1 No: loop back to B2 -->
  <path d="M 286 186 L 332 186 L 332 139 L 342 139" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="174" text-anchor="middle" font-size="10" fill="#888">否（已染）</text>
  <!-- D1 Yes: down -->
  <path d="M 200 212 L 200 232" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="226" font-size="11" fill="#4a7a3a">是</text>

  <!-- ===== B3: color start ===== -->
  <rect x="60" y="232" width="280" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="252" text-anchor="middle" font-size="12" fill="#333">④ color[i] = 1（蓝）；i 入队</text>
  <path d="M 200 262 L 200 276" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== B4: BFS pop + neighbors ===== -->
  <rect x="60" y="276" width="280" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="296" text-anchor="middle" font-size="12" fill="#333">⑤ 出队 u，遍历其邻居 v（讨厌 u 的人）</text>
  <path d="M 200 306 L 200 314" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== D2: v 未染色? ===== -->
  <polygon points="200,314 286,340 200,366 114,340" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="344" text-anchor="middle" font-size="12" fill="#333">v 未染色?</text>
  <!-- D2 Yes: right to B5 -->
  <path d="M 286 340 L 340 340" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="306" y="332" text-anchor="middle" font-size="11" fill="#4a7a3a">是</text>
  <rect x="340" y="324" width="240" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="344" text-anchor="middle" font-size="11" fill="#333">color[v] = −color[u]；v 入队</text>
  <!-- B5 loop back up to B4 -->
  <path d="M 580 340 L 580 291 L 342 291" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="462" y="284" text-anchor="middle" font-size="10" fill="#888">继续下一 v</text>
  <!-- D2 No: down -->
  <path d="M 200 366 L 200 384" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="378" font-size="10" fill="#888">否（已染）</text>

  <!-- ===== D3: v 与 u 同色? ===== -->
  <polygon points="200,384 292,410 200,436 108,410" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="414" text-anchor="middle" font-size="12" fill="#333">v 与 u 同色?</text>
  <!-- D3 Yes: right to B6 (false terminal) -->
  <path d="M 292 410 L 340 410" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="402" text-anchor="middle" font-size="10" fill="#b03a3a">是（冲突）</text>
  <rect x="340" y="394" width="240" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="460" y="414" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">返回 false（讨厌者被迫同组）✗</text>
  <!-- D3 No: loop back left/up to B4 -->
  <path d="M 108 410 L 40 410 L 40 291 L 58 291" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="98" y="404" text-anchor="end" font-size="10" fill="#888">否</text>
  <text x="46" y="284" font-size="10" fill="#888">否 → 下一 v</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="440" width="520" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="461" text-anchor="middle" font-size="11" fill="#444">与 785 二分图判定完全同构：相邻（互相讨厌）必须异色，</text>
  <text x="300" y="475" text-anchor="middle" font-size="11" fill="#444">同色相邻即奇环 → 无法分成两组 → 返回 false</text>
</svg>
